---
# ansible-lint configuration, passed by .github/scripts/run-ansible-lint.sh (CI only; pre-commit runs
# ansible-playbook --syntax-check instead).
# Discovery scope comes from that script's --project-dir ansible/, not from `kinds`: ansible-lint
# discovers every file in the project directory first, then applies kinds filtering.
exclude_paths:
  # All legacy roles, being migrated to Nix home-manager (relative to ansible/ dir)
  - "roles/legacy_*/**"
  - ".ansible/**" # Galaxy-installed roles and collections (not our code)

# Mock these custom modules/actions so ansible-lint recognizes them.
# custom_module_paths and action_plugins are not valid in the config file; use the environment
# variables ANSIBLE_LIBRARY and ANSIBLE_ACTION_PLUGINS instead.
mock_modules:
  - github_release_install
  - autostart_entry
  - community.general.snap
  - community.general.zfs
  - community.general.flatpak
  - community.general.flatpak_remote

# Mock these roles if they're external/Galaxy roles
mock_roles:
  - petermosmans.customize-gnome
