# Deb packages for the haku-harness-runner image, on debian:trixie-slim.
# `git` lets the runner check out haku-state before launching a harness; `curl` and `wget` are the
# fetch utilities agents expect in the interactive shell they run inside this image. The generated
# CA bundle, Python interpreter, runner, Claude CLI, Codex CLI and kubectl use separate layers.
#
# Regenerate the lock file after any change:
#   bazel run @trixie_haku_harness_runner//:lock
version: 1

sources:
  - channel: trixie main
    url: https://snapshot.debian.org/archive/debian/20260301T000000Z
  - channel: trixie-security main
    url: https://snapshot.debian.org/archive/debian-security/20260301T000000Z

archs:
  - "amd64"

packages:
  # `bubblewrap` gives the Codex sandbox a system bwrap instead of its bundled fallback.
  - "bubblewrap"
  - "curl"
  - "git"
  - "ripgrep"
  - "wget"
  # TODO(2026-08-29): add python3 (full stdlib, not python3-minimal) to the runner image —
  #   operator wants it eventually.
