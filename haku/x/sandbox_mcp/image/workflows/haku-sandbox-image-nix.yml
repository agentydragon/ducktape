# ARCHIVED WORKFLOW COPY: GitHub only loads workflow files from .github/workflows.
# This file documents the retired image publisher; no active workflow builds or publishes it.
#
# Build the Nix-based Haku sandbox image (haku/x/sandbox_mcp/image/default.nix)
# and push it to the Forgejo OCI registry, through nix-image.yml.
#
# The Nix image was published under its own repository while the old lane evaluated a
# possible migration away from the apt-based image. That migration did not happen; both image
# sources and their publisher definitions are retained only as historical reference.
name: Haku Sandbox Image (Nix)

on:
  push:
    branches: [devel]
    paths:
      # keep-sorted start
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/nix-image.yml"
      - "flake.lock"
      - "haku/x/sandbox_mcp/image/**"
      - "haku/x/sandbox_mcp/image/workflows/haku-sandbox-image-nix.yml"
      - "nix/flake/packages.nix"
      - "nix/lib/nix-ld-image.nix"
      # keep-sorted end
  # Also on PRs, which the other image workflows deliberately don't do. The cutover
  # checklist needs a *pullable tag* to point a throwaway Pod at, and the image's whole
  # open question is a runtime one a build can't answer — so it has to be testable before
  # it merges, not after. `workflow_dispatch` alone cannot deliver that: GitHub only
  # dispatches workflows that already exist on the default branch (verified — dispatching
  # this file on its own branch 404s), which is exactly the situation a brand-new image
  # workflow is in.
  pull_request:
    paths:
      # keep-sorted start
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/nix-image.yml"
      - "flake.lock"
      - "haku/x/sandbox_mcp/image/**"
      - "haku/x/sandbox_mcp/image/workflows/haku-sandbox-image-nix.yml"
      - "nix/flake/packages.nix"
      - "nix/lib/nix-ld-image.nix"
      # keep-sorted end
  workflow_dispatch:

concurrency:
  group: haku-sandbox-image-nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/nix-image.yml
    with:
      attr: haku-sandbox-image
      image: git.allegedly.works/ducktape-ci/haku-sandbox-image-nix
      registry: forgejo
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
