# ARCHIVED WORKFLOW COPY: GitHub only loads workflow files from .github/workflows.
# This file documents the retired image publisher; no active workflow builds or publishes it.
#
# Build and push the Haku sandbox image (bazelisk + JDK + git toolchain,
# no nix/docker/RBE) to the Forgejo OCI registry
# (git.allegedly.works/ducktape-ci/haku-sandbox-image) — not GHCR, so the pull
# credential was provisioned in code (tf/gitops/forgejo-images). The retired
# Haku SandboxTemplate consumed this image. Mirrors agent-workspace-image.yml.
name: Haku Sandbox Image

on:
  push:
    branches: [devel]
    paths:
      - "haku/x/sandbox_mcp/image/**"
      - "haku/x/sandbox_mcp/image/workflows/haku-sandbox-image.yml"
  workflow_dispatch:

concurrency:
  group: haku-sandbox-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: git.allegedly.works/ducktape-ci/haku-sandbox-image
    steps:
      - uses: actions/checkout@v7

      # Decrypts secrets/ci/* → exports FORGEJO_IMAGES_{USERNAME,PASSWORD}.
      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Login to Forgejo registry
        run: echo "$FORGEJO_IMAGES_PASSWORD" | docker login git.allegedly.works -u "$FORGEJO_IMAGES_USERNAME" --password-stdin

      - name: Build and push
        run: |
          TS=$(date -u +%Y%m%d%H%M%S)
          REF="$IMAGE:${GITHUB_REF_NAME}-${TS}-${GITHUB_SHA:0:7}"
          docker build -t "$REF" haku/x/sandbox_mcp/image
          docker push "$REF"
          echo "pushed \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
