<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock Haku UI</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: repeating-linear-gradient(135deg, #ffd43b 0 32px, #111 32px 64px);
        font-family: system-ui, sans-serif;
      }

      main {
        padding: 28px 42px;
        border: 6px solid white;
        background: #111;
        color: #ffd43b;
        box-shadow: 0 12px 40px #000;
        font-size: clamp(24px, 5vw, 64px);
        font-weight: 900;
        text-align: center;
      }

      small {
        display: block;
        margin-top: 10px;
        color: white;
        font-size: 18px;
        letter-spacing: 0.12em;
      }
    </style>
  </head>
  <body>
    <main>
      MOCK HAKU UI IFRAME
      <small>VISIBLE CONTENT BOUNDARY</small>
    </main>
  </body>
</html>
