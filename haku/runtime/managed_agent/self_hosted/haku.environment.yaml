# Haku's self-hosted Managed Agents environment. The agent loop runs at
# Anthropic; tool execution (the fixed bash/read/write/edit/glob/grep set) runs
# in the haku-worker pod in haku-sandbox. `{type: self_hosted}` is the entire
# config — egress, hardening, and networking are ours (haku-egress-proxy + CCNP).
#   ant beta:environments create < haku.environment.yaml
#
# NB: provisioned imperatively via `ant`, NOT the claude-managed-agents tofu
# provider (unlike the sibling anthropic-hosted agent in tf/gitops/haku-cloud-agent).
# The provider forces a `networking` block the API rejects for self_hosted — see
# README.md "Why this is provisioned imperatively, not Terraform".
name: haku-selfhosted
config:
  type: self_hosted
