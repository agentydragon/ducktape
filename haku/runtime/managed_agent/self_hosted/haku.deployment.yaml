# The wake trigger: a scheduled deployment fires one fresh session per tick, which re-orients from
# haku-state. provision.sh injects the resolved --agent / --environment-id / --vault-ids; the static
# parts live here. Verify flag/field names against `ant beta:deployments create --help`.
name: haku-scan
initial_events:
  - type: user.message
    content:
      - type: text
        text: "Wake: do one scan pass per the run procedure, then commit, push, and stop."
# Test on demand with `ant beta:deployments run --deployment-id <id>` before trusting a new cadence.
schedule:
  type: cron
  expression: "0 */6 * * *"
  timezone: America/Los_Angeles
