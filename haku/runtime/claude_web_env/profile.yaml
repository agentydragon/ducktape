# Claude Code web profile for Haku, the personal background agent.
#
# Selected via DUCKTAPE_CLAUDE_HOOKS_PROFILE=haku/runtime/claude_web_env/profile.yaml
# (with SOPS_AGE_KEY=<haku age key>).
#
# Models devinfra/claude/claude_hook/profiles/web/profile.yaml. Deviations:
#   - K8S_* overrides so kubeconfig.py materializes Haku's kubeconfig (the JWT in
#     secrets/haku-k8s-jwt.yaml → group `haku` → haku-sandbox-admin in the
#     haku-sandbox namespace) instead of claude-web's.
#   - No bazel/RBE warmup — Haku scans and writes git, it doesn't build.
startup_env_script: devinfra/secrets/web_env.sh

idle_watchdog: false

env_exports: |
  export DUCKTAPE_PRECOMMIT_ENFORCE_BAZEL_TESTS=0
  # Nix devtools win over /opt/node22 (see the web profile for the rationale).
  export PATH="/usr/local/bin:${PATH}"
  # Materialize Haku's kubeconfig, not claude-web's: read the haku JWT and
  # present as the `haku` user in the haku-sandbox namespace.
  export K8S_JWT_SOPS_PATH=secrets/haku-k8s-jwt.yaml
  export K8S_USER=haku
  export K8S_NAMESPACE=haku-sandbox

background_commands:
  # One command does the whole home bootstrap: materialize ~/.kube/config from
  # the SOPS-encrypted haku JWT (the single place kubeconfig is built), then
  # write ~/.netrc and clone haku-state into ~/haku-state — so the agent starts
  # with cluster access and its memory ready, and git needs no inline creds.
  # after_env so the K8S_* exports above are in scope.
  - name: bootstrap
    command: bash "$CLAUDE_PROJECT_DIR/haku/runtime/claude_web_env/bootstrap.sh"
    # TODO: investigate why git clone of haku-state takes 4+ minutes over web-home
    # egress (observed 11th run 2026-06-26). 90s timed out every run; bumped to 600s
    # as a stopgap. Root cause unknown — may be egress throttling on large initial
    # clone, or Forgejo slow on cold start. Check with a fresh clone + timing.
    timeout: 600
    after_env: true
  - name: creds banner
    command: bash "$CLAUDE_PROJECT_DIR/devinfra/claude/claude_hook/creds_banner.sh"
    timeout: 10
    after_env: true
  - name: nix nixpkgs check
    command: |
      if ! command -v nix &>/dev/null; then
        echo "ERROR: Nix not found on PATH. setup.sh should have installed Nix — did it complete?"
        exit 1
      fi
      if nix-instantiate '<nixpkgs>' --eval -E '1' &>/dev/null 2>&1; then
        echo "Nix: nixpkgs available."
      else
        nix-channel --add https://nixos.org/channels/nixpkgs-unstable nixpkgs
        nix-channel --update nixpkgs
        echo "Nix: nixpkgs channel configured."
      fi
    timeout: 120
  - name: pre-commit setup
    command: pre-commit install --install-hooks
    timeout: 300

context_template: devinfra/claude/claude_hook/profiles/web/context.mako
