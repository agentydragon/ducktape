# Haku's self-backlog — rendered in the UI's "💡 Improvements" tab and gardened every run
# (procedures/maintenance_and_synthesis.md). Two lists the operator reads to decide where to
# invest in me:
#   ideas[]    — capability ideas that would make me more useful (value-ranked).
#   friction[] — data-access gaps / flaky-or-limited backends I hit during runs, for the
#                operator to fix at the source.
# value/severity ∈ high|medium|low. idea status ∈ recommend|idea|parked|blocked|wired.
# friction status ∈ open|workaround|resolved|answered. `detail` is markdown.
#
# This is a STARTER with one illustrative entry in each list — replace them with the real ideas
# and friction you accumulate. Only list things that need the *operator's* investment (a new
# credential, a service, a decision, an API to enable); don't list capabilities you already
# have and could just build yourself — do those, don't advertise them.
updated: ""

ideas:
  - id: example-idea
    title: "Example capability idea (replace me)"
    value: medium
    status: idea
    summary: "One line on what this would unlock, and what the operator must provide."
    detail: |
      Describe the capability, why it would help, and — crucially — **what the operator would need
      to provision** for it (an API key, an MCP server, a service signup, a scoped credential). If
      it needs nothing from the operator, it doesn't belong here — just build it.

friction:
  - id: example-friction
    title: "Example data-access gap (replace me)"
    severity: medium
    status: open
    detail: |
      **Impact:** what this gap costs you each run. **Fix:** the concrete thing the operator could
      change at the source (widen an OAuth scope, enable an API, add a recipient to a secret).
