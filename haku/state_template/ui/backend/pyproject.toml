[project]
name = "haku-ui-backend"
version = "0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat top-level modules (not a package); the backend is run from its own directory.
[tool.setuptools]
py-modules = ["app", "config", "forgejo", "models", "reads"]
