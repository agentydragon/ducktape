# Validate the state files the UI backend reads live from HEAD (items/, kitchen/, runs/,
# responses/, memory/improvements/) against the backend's own Pydantic models
# (tools/validate_state.py) — the actual read contract. The backend has no build step for
# data (it parses these at request time), so without this gate a malformed commit only
# surfaces when the dashboard 500s or silently renders wrong (the `shopping_list: 0`
# incident). Runs on EVERY push to main — data commits vastly outnumber ui/ commits and
# aren't covered by bazel-ci.yaml (its path filter is scoped to code/config).
#
# Runs the real Bazel target (`bazel run //tools:validate_state`) so the validator, its
# deps, and the models.py it checks against are exactly what the rest of the build uses —
# no separate pip install to drift. Reuses bazel-ci's runner setup (bazelisk + egress CA);
# the shared --disk_cache keeps it fast after the first run.
name: validate-state
on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: haku-ci
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bazelisk resolves the pinned Bazel (.bazelversion) and bundles a JDK.
      - name: Install bazelisk
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/bazel" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x "$HOME/bin/bazel"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ hashFiles('MODULE.bazel', 'ui/backend/requirements.txt', 'ui/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            bazel-disk-

      # Trust the egress-proxy CA at the JVM level (writes ~/.bazelrc) so Bazel's
      # downloader can fetch rules_python + pydantic through the proxy — see bazel-ci.yaml.
      - name: Trust egress-proxy CA (JDK truststore)
        run: bash tools/ci/trust_egress_ca.sh

      - name: Validate state files
        run: bazel run --config=ci //tools:validate_state
