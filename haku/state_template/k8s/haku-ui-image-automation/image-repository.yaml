apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: haku-ui
spec:
  # The image the deployment marker pins (forgejo.example.com/haku/ui). Private
  # package, so the reflector authenticates with the registry creds via the
  # haku-forgejo-registry-pull dockerconfigjson Secret (same namespace, haku).
  image: forgejo.example.com/haku/ui
  interval: 5m
  secretRef:
    name: haku-forgejo-registry-pull
