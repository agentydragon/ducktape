apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-ui
  labels:
    app: haku-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haku-ui
  template:
    metadata:
      labels:
        app: haku-ui
    spec:
      # No service-account token; service-link env vars off (the backend fixes its
      # own host/port and reads only HAKU_UI_* env, so a HAKU_UI_* service link
      # would clobber config).
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image lives in the in-cluster Forgejo registry; the operator provisions
      # this pull secret separately (reflected into haku-sandbox).
      imagePullSecrets:
        - name: haku-forgejo-registry-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          # Flux image automation writes this tag (NOT CI — the build-ui workflow
          # only pushes the image). The trailing `$imagepolicy` marker tells Flux's
          # ImageUpdateAutomation which image ref to rewrite; keep it on this line.
          # The matching ImageRepository/ImagePolicy/ImageUpdateAutomation are Haku's
          # own (the sibling k8s/haku-ui-image-automation/ dir), reconciled into
          # haku-sandbox — hence the haku-sandbox:haku-ui policy ref.
          image: git.allegedly.works/haku/ui:main-20260629083051-85fda52 # {"$imagepolicy": "haku-sandbox:haku-ui"}
          ports:
            - containerPort: 8080
          env:
            # haku-state write creds (the haku-state-git-write secret, mounted into
            # haku-sandbox by the tf/gitops/haku-state module). The backend uses these
            # as Forgejo basic auth — no local clone.
            - name: HAKU_UI_GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: haku-state-git-write
                  key: username
            - name: HAKU_UI_GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-state-git-write
                  key: password
            # Internal plaintext-HTTP Forgejo API. MUST be the FULLY-QUALIFIED
            # `.svc.cluster.local` name: the namespace injects HTTP(S)_PROXY →
            # haku-mitmproxy with NO_PROXY=...,.svc.cluster.local,10.0.0.0/8. httpx
            # matches NO_PROXY by hostname string (not resolved IP), so the short
            # name `forgejo-http.forgejo` does NOT match the suffix and gets routed
            # through mitmproxy, where it dial-times-out (ReadTimeout on every
            # /contents call). The FQDN matches the `.svc.cluster.local` suffix and
            # bypasses the proxy for a direct in-cluster connection. (10.0.0.0/8
            # can't save the short name — NO_PROXY CIDRs only match IP literals.)
            - name: HAKU_UI_FORGEJO_API_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000/api/v1/repos/haku/haku-state
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
