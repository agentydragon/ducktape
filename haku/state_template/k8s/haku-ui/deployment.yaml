apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-ui
  labels:
    app: haku-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haku-ui
  template:
    metadata:
      labels:
        app: haku-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Unprivileged nginx serves /usr/share/nginx/html on :8080 as uid 101.
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: haku-ui-html
