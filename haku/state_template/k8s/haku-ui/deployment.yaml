apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-ui
  labels:
    app: haku-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haku-ui
  template:
    metadata:
      labels:
        app: haku-ui
    spec:
      # No service-account token; service-link env vars off (the backend fixes its
      # own host/port and reads only HAKU_UI_* env, so a HAKU_UI_* service link
      # would clobber config).
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image lives in the in-cluster Forgejo registry; the operator provisions
      # this pull secret separately (reflected into haku).
      imagePullSecrets:
        - name: haku-forgejo-registry-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          # Flux image automation writes this tag (NOT CI — the build-ui workflow
          # only pushes the image). The trailing `$imagepolicy` marker tells Flux's
          # ImageUpdateAutomation which image ref to rewrite; keep it on this line.
          # The matching ImageRepository/ImagePolicy/ImageUpdateAutomation are Haku's
          # own (the sibling k8s/haku-ui-image-automation/ dir), reconciled into
          # haku — hence the haku:haku-ui policy ref.
          image: forgejo.example.com/haku/ui:main-00000000000000-0000000 # {"$imagepolicy": "haku:haku-ui"}
          ports:
            - containerPort: 8080
          env:
            # haku-state write creds (the haku-state-git-write Secret, mounted into
            # haku by the operator). The backend uses these as Forgejo
            # basic auth — no local clone.
            - name: HAKU_UI_GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: haku-state-git-write
                  key: username
            - name: HAKU_UI_GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-state-git-write
                  key: password
            # Internal cluster-internal plaintext-HTTP Forgejo API host. If the namespace
            # injects an HTTP(S)_PROXY egress proxy with a NO_PROXY that includes
            # `.svc.cluster.local`, this MUST be the FULLY-QUALIFIED `.svc.cluster.local`
            # name: httpx matches NO_PROXY by hostname string (not resolved IP), so a short
            # name like `forgejo-http.forgejo` would NOT match the suffix
            # and would get routed through the proxy (where it typically dial-times-out on
            # every /contents call). The FQDN matches the `.svc.cluster.local` suffix and
            # bypasses the proxy for a direct in-cluster connection. (A NO_PROXY CIDR like
            # 10.0.0.0/8 can't save the short name — NO_PROXY CIDRs only match IP literals.)
            - name: HAKU_UI_FORGEJO_API_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000/api/v1/repos/haku/haku-state
            # Public (operator-facing) repo URL for the footer's commit links. Required by the
            # backend (no code default) so this deployment's URL isn't baked into the starter.
            - name: HAKU_UI_REPO_WEB_URL
              value: https://forgejo.example.com/haku/haku-state
            # Console-approved tool calls. The backend sends authored tool_requests/*.yaml
            # to haku-console; haku-console owns approval, execution, audit, and results.
            - name: HAKU_UI_HAKU_CONSOLE_API_URL
              value: http://haku-console.haku-console.svc.cluster.local:8080
            - name: HAKU_UI_HAKU_CONSOLE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-tool-call-api
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
