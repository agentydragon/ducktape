architecture: standalone

fullnameOverride: guacamole-postgresql
primary:
  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

auth:
  username: guacamole
  database: guacamole
  existingSecret: guacamole-db-credentials
  secretKeys:
    userPasswordKey: password
    adminPasswordKey: postgres-password
    replicationPasswordKey: replication-password

tls:
  enabled: false
