# Helmfile overrides for the guacamole chart.
nameOverride: ""
fullnameOverride: ""

guacamole:
  replicaCount: 1
  image:
    repository: guacamole/guacamole
    tag: "1.5.5"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

guacd:
  replicaCount: 1
  image:
    repository: guacamole/guacd
    tag: "1.5.5"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4822
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

postgres:
  host: guacamole-postgresql
  port: 5432
  database: guacamole
  user: guacamole
  secretName: guacamole-db-credentials
  secretKeys:
    userPasswordKey: password
    adminPasswordKey: postgres-password
    envPasswordKey: POSTGRES_PASSWORD

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
  hosts:
    - host: guacamole.k3s.agentydragon.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - guacamole.k3s.agentydragon.com
      secretName: guacamole-tls

nodeSelector: {}
affinity: {}
tolerations: []
