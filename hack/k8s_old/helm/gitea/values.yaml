# Default values for the Ducktape Gitea stack chart.

namespace:
  create: true
  name: gitea
  labels: {}

sharedStorage:
  claimName: gitea-shared-storage

reflector:
  enabled: true
  image:
    repository: docker.io/emberstack/kubernetes-reflector
    tag: "9.1.34"
    pullPolicy: IfNotPresent
  resources: {}
  args: []

sealedSecrets:
  oauth:
    enabled: true
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: authentik
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    encryptedData:
      GITEA_CLIENT_SECRET: 
      client_id: 
      client_secret: 
  emberCredentials:
    enabled: true
    encryptedData:
      ember-password: 

oauthSetupJob:
  enabled: true
  hookWeight: 1
  image:
    repository: gitea/gitea
    tag: "1.22.3"
    pullPolicy: IfNotPresent
  pvcMountPath: /data
  autoDiscoverUrl: https://auth.k3s.agentydragon.com/application/o/gitea/.well-known/openid-configuration
  providerName: Authentik
  adminGroup: gitea-admins
  restrictedGroup: gitea-users
  oauthSecretName: gitea-oauth-shared

emberBootstrap:
  enabled: true
  serviceAccountName: gitea-ember-bootstrap
  secretWriterRoleName: ember-secret-writer
  reflectorNamespace: kube-system
  secretNamespace: ember
  secretName: gitea-ember-token
  tokenName: ember-agent-token
  username: ember-bot
  email: ember-bot@internal
  baseUrl: http://gitea-http:3000
  passwordSecretName: gitea-ember-credentials
  passwordSecretKey: ember-password
  scriptConfigMapName: gitea-ember-bootstrap
  image:
    repository: gitea/gitea
    tag: "1.22.3"
    pullPolicy: IfNotPresent
  pvcMountPath: /data
  scriptPath: /scripts/ember_pat.py
  tokenScopes: read:user,write:user,read:repository,write:repository,read:organization,write:organization,read:package,write:package,read:issue,write:issue,read:notification,write:notification

gitea:
  replicaCount: 1
  image:
    repository: gitea/gitea
    registry: docker.io
    tag: 1.22.3
    pullPolicy: IfNotPresent
    rootless: false

  service:
    http:
      type: ClusterIP
      port: 3000
      clusterIP: null
    ssh:
      type: LoadBalancer
      port: 22

  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
      ingress.kubernetes.io/force-ssl-redirect: "false"
    hosts:
      - host: git.k3s.agentydragon.com
        paths:
          - path: /
            pathType: Prefix

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  gitea:
    admin:
      username: agentydragon
      email: agentydragon@gmail.com

    config:
      APP_NAME: "agentydragon Gitea"
      server:
        PROTOCOL: http
        DOMAIN: git.k3s.agentydragon.com
        ROOT_URL: https://git.k3s.agentydragon.com/
        SSH_DOMAIN: git.k3s.agentydragon.com
        SSH_PORT: 22
        LANDING_PAGE: login
      service:
        DISABLE_REGISTRATION: false
        ALLOW_ONLY_EXTERNAL_REGISTRATION: true
        REQUIRE_SIGNIN_VIEW: true
        REGISTER_EMAIL_CONFIRM: false
        DEFAULT_ALLOW_CREATE_ORGANIZATION: false
      database:
        DB_TYPE: sqlite3
      security:
        INSTALL_LOCK: true
        SECRET_KEY: ""
      oauth2:
        ENABLED: true
      openid:
        ENABLE_OPENID_SIGNIN: true
        ENABLE_OPENID_SIGNUP: true
        WHITELISTED_URIS: auth.k3s.agentydragon.com
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: true
        USERNAME: preferred_username
        ACCOUNT_LINKING: auto
        UPDATE_AVATAR: false
      repository:
        DEFAULT_PRIVATE: last
        ENABLE_PUSH_CREATE_USER: true
        ENABLE_PUSH_CREATE_ORG: true
      indexer:
        REPO_INDEXER_ENABLED: true
      cache:
        ADAPTER: memory
      session:
        PROVIDER: memory
      queue:
        TYPE: level
      log:
        LEVEL: Info
        MODE: console

  postgresql:
    enabled: false

  redis:
    enabled: false

  valkey-cluster:
    enabled: false

  valkey:
    enabled: false

  postgresql-ha:
    enabled: false

  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 100m

  nodeSelector: {}
  tolerations: []
  affinity: {}

  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
