{{- if .Values.emberBootstrap.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gitea-stack.emberServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.componentLabels" (dict "context" . "component" "ember-bootstrap") | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gitea-stack.emberSecretWriterRoleName" . }}
  namespace: {{ .Values.emberBootstrap.secretNamespace }}
  labels:
{{ include "common.componentLabels" (dict "context" . "component" "ember-secret-writer") | indent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gitea-stack.emberSecretWriterRoleName" . }}
  namespace: {{ .Values.emberBootstrap.secretNamespace }}
  labels:
{{ include "common.componentLabels" (dict "context" . "component" "ember-secret-writer") | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gitea-stack.emberSecretWriterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gitea-stack.emberServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
