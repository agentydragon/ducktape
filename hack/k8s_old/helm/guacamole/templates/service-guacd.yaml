apiVersion: v1
kind: Service
metadata:
  name: {{ include "guacamole.guacdServiceName" . }}
  labels:
    {{- include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/component" "guacd")) | nindent 4 }}
spec:
  type: {{ .Values.guacd.service.type }}
  selector:
    {{- include "common.selectorLabelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/component" "guacd")) | nindent 4 }}
  ports:
    - name: guacd
      port: {{ .Values.guacd.service.port }}
      targetPort: guacd
      protocol: TCP
