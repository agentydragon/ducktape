apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "guacamole.guacdServiceName" . }}
  labels:
    {{- include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/component" "guacd")) | nindent 4 }}
spec:
  replicas: {{ .Values.guacd.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.selectorLabelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/component" "guacd")) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.selectorLabelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/component" "guacd")) | nindent 8 }}
        {{- range $k, $v := .Values.guacd.podLabels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- if .Values.guacd.podAnnotations }}
      annotations:
        {{- range $k, $v := .Values.guacd.podAnnotations }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "guacamole.serviceAccountName" . }}
      containers:
        - name: guacd
          image: "{{ .Values.guacd.image.repository }}:{{ .Values.guacd.image.tag }}"
          imagePullPolicy: {{ .Values.guacd.image.pullPolicy }}
          ports:
            - name: guacd
              containerPort: {{ .Values.guacd.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.guacd.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
