apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "matrix-stack.fullname" . }}-ember-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
    app.kubernetes.io/component: bootstrap
    helm.sh/chart: {{ include "matrix-stack.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "matrix-stack.fullname" . }}-ember-secret-writer
  namespace: {{ .Values.bootstrap.ember.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
    app.kubernetes.io/component: bootstrap
    helm.sh/chart: {{ include "matrix-stack.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "matrix-stack.fullname" . }}-ember-secret-writer
  namespace: {{ .Values.bootstrap.ember.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
    app.kubernetes.io/component: bootstrap
    helm.sh/chart: {{ include "matrix-stack.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "matrix-stack.fullname" . }}-ember-secret-writer
subjects:
  - kind: ServiceAccount
    name: {{ include "matrix-stack.fullname" . }}-ember-bootstrap
    namespace: {{ .Release.Namespace }}
