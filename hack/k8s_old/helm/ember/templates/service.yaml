apiVersion: v1
kind: Service
metadata:
  name: {{ include "ember.serviceName" . }}
  labels:
    {{- include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/component" "agent")) | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ember.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
