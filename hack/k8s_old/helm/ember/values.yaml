namespace:
  create: true
  name: ember

replicaCount: 1

image:
  repository: registry.k3s.agentydragon.com/emberd
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  create: false
  name: registry-auth
  registry: registry.k3s.agentydragon.com
  username: ""
  password: ""

service:
  type: ClusterIP
  port: 8000

config:
  matrix:
    base_url: https://matrix.k3s.agentydragon.com
    admin_user_id: "@agentydragon:matrix.k3s.agentydragon.com"
  state:
    dir: /var/lib/ember
    workspace_dir: /var/lib/ember/workspace
  openai:
    model: gpt-5-codex
    reasoning_effort: medium
    include_encrypted_reasoning: true
    api_base: http://rspcache.rspcache.svc.cluster.local:8000

persistence:
  enabled: true
  existingClaim: ""
  storageClass: local-path
  accessModes:
    - ReadWriteOnce
  size: 5Gi

runtimeSecrets:
  matrixTokenSecret: matrix-ember-token
  matrixAccessTokenKey: access_token
  giteaSecret: gitea-ember-token
  giteaTokenKey: token
  rspcacheClientSecret: ember-rspcache-client
  rspcacheApiKeyKey: openai_api_key

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
affinity: {}
tolerations: []

podAnnotations: {}
podLabels: {}

rotator:
  enabled: true
  schedule: "0 4 * * *"
  image:
    repository: registry.k3s.agentydragon.com/rspcache
    tag: latest
    pullPolicy: IfNotPresent
  adminUrl: http://rspcache-admin.rspcache.svc.cluster.local:8100
  secretName: ember-rspcache-client
  upstreamAlias: default
  deploymentName: ""
  restartPolicy: Never

serviceAccount:
  create: false
  name: ""

serviceAccountRotator:
  create: true
  name: ember-rspcache-rotator

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 20
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
