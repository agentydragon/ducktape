otel:
  endpoint: https://alloy-otlp.allegedly.works/v1/traces
  # bearer_token: injected via settings.local.json (written by web_setup.sh).

k8s:
  server: https://api.allegedly.works:16443
  service_account: claude-code-web
  service_account_namespace: default
  namespace: claude-sandbox

pre_commit:
  auto_apply_hooks:
    - ruff-format
    - buildifier
    - shfmt
    - prettier
    - nixfmt
    - gofumpt
    - trailing-whitespace
    - end-of-file-fixer

idle_watchdog: false
install_mkcert: true
setup_docker: true
env_exports: |
  export DUCKTAPE_PRECOMMIT_ENFORCE_BAZEL_TESTS=0
  export DUCKTAPE_PRECOMMIT_ENFORCE_TEST_TAG=1
bazel_remote_proxy:
  target: remote.buildbuddy.io:443
bazel_bes_proxy:
  target: remote.buildbuddy.io:443
background_commands:
  - name: apt package install
    command: |
      apt-get update -qq &&
      apt-get install -y -qq libgirepository-2.0-dev libcairo2-dev libdbus-1-dev
    timeout: 300
  - name: rootfs tuning
    command: |
      if ! test -b /dev/vda; then
        echo "rootfs tuning: /dev/vda not present (not a Firecracker VM?), skipping"
        exit 0
      fi
      echo "--- tune2fs -l /dev/vda (before) ---"
      tune2fs -l /dev/vda
      tune2fs -m 1 /dev/vda
      echo "--- tune2fs -l /dev/vda (after) ---"
      tune2fs -l /dev/vda
    timeout: 30
  - name: pre-commit setup
    command: pre-commit install --install-hooks
    timeout: 300
  - name: bazel info
    command: bazelisk info
    timeout: 300
    after_env: true
context_template: .claude_hooks/templates/web_context.mako
