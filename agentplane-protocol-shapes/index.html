<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentplane protocol shapes audit</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript
      >This report uses JavaScript for Mantine components and charts.</noscript
    >
    <script type="module">
      import {
        Alert,
        Anchor,
        Container,
        Group,
        Paper,
        Stack,
        Text,
        Title,
      } from "@mantine/core";
      import { useEffect, useState } from "react";
      import { html, mount } from "../report.js";

      function Links({ items }) {
        return html`<${Group} gap="sm">
          ${items.map(({ label, url }) => html`<${Anchor} key=${url} href=${url} size="sm">${label}<//>`)}
        <//>`;
      }

      function Report() {
        const [data, setData] = useState(null);
        const [error, setError] = useState(null);
        useEffect(() => {
          const controller = new AbortController();
          fetch("evidence.json", { signal: controller.signal })
            .then((response) => {
              if (!response.ok)
                throw new Error(`Evidence HTTP ${response.status}`);
              return response.json();
            })
            .then(setData)
            .catch((caught) => {
              if (caught.name !== "AbortError") setError(caught.message);
            });
          return () => controller.abort();
        }, []);

        return html`<${Container}
          component="main"
          size="lg"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
        >
          <${Stack} gap="md">
            <${Anchor} href="../">All reports<//>
            <${Title} order=${1}>Agentplane’s repeated protocol shapes<//>
            <${Text}
              >Scope the next changes around Session override semantics and one
              executable settings comparison. Browser diagnostics match their
              Python declarations today, and the Action store already checks
              historical policy evidence.<//
            >
            ${error && html`<${Alert} color="red">${error}<//>`}
            ${
              data &&
              html`
                <${Group} gap="sm">
                  <${Anchor}
                    href=${"https://github.com/agentydragon/ducktape/commit/" + data.source_devel_commit}
                    >${"devel " + data.source_devel_commit.slice(0, 10)}<//
                  >
                  <${Text} c="dimmed" size="sm"
                    >${"Reviewed " + data.audited_at_utc.slice(0, 10) + " UTC"}<//
                  >
                <//>
                <${Group} component="nav" gap="sm">
                  <${Anchor} href="#retained">Findings<//>
                  <${Anchor} href="#scope">Verification<//>
                  <${Anchor} href="evidence.json">Evidence<//>
                  <${Anchor} href="manifest.json">Manifest<//>
                <//>
                <${Title} id="retained" order=${2}>Current findings<//>
                ${data.findings.map(
                  (item) =>
                    html`<${Paper}
                      key=${item.id}
                      id=${item.id}
                      component="article"
                      p="md"
                      radius="md"
                      withBorder
                    >
                      <${Stack} gap="xs">
                        <${Title} order=${3}>${item.heading}<//>
                        <${Text}>${item.finding}<//>
                        ${item.probe && html`<${Text} size="sm" c="dimmed">${item.probe}<//>`}
                        <${Text}>${item.action}<//>
                        <${Links} items=${item.links} />
                      <//>
                    <//>`,
                )}
                ${
                  data.retired &&
                  html`<${Stack} gap="xs">
                    <${Title} order=${2}>Closed or narrowed<//>
                    ${data.retired.map(
                      (item) =>
                        html`<${Group} key=${item.id} gap="xs">
                          <${Text}>${item.finding}<//
                          ><${Links} items=${item.links} />
                        <//>`,
                    )}
                  <//>`
                }
                <${Title} id="rules" order=${2}>Contract ownership<//>
                <${Text}
                  >The owning service defines the wire contract. The App joins
                  generated backend messages where it owns a view. Storage
                  migrations define persisted rows, and explicit adapters
                  preserve historical meaning. For test consumers of the App and
                  the relay, see the fixture and model audit.<//
                >
                <${Anchor} href="../fixture-model-audit/#test-client"
                  >Fixture and model audit<//
                >
                <${Title} id="scope" order=${2}>Scope and verification<//>
                <${Text}>${data.scope}<//>
                ${data.validation && html`<${Text}>${data.validation.summary}<//><${Links} items=${data.validation.links} />`}
                <${Links}
                  items=${[{ label: "Previous snapshot", url: data.previous_snapshot }]}
                />
              `
            }
          <//>
        <//>`;
      }
      mount(Report);
    </script>
  </body>
</html>
