# Task type definitions
# Defines default grading configuration for each type of task
# Setup is defined per-task, not per-type (they're orthogonal concerns)

task_types:
  coding:
    # Standard coding tasks - produce files
    grading:
      strategy: file_based
      criteria_file: ../data/graders_consolidated.yaml

  code_review:
    # Code review tasks - analyze existing code
    grading:
      strategy: comparison
      # reference must be provided per task
