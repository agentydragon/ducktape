# Deb packages for the agentplane-runner image, on debian:trixie-slim. `git` for the
# repositories agents work in, `ripgrep` for Claude Code's Grep tool (the pinned native
# binary ships no bundled rg), `curl` as the fetch utility both harnesses reach for.
# The CA bundle, Python interpreter, runner, Claude CLI, and Codex CLI are separate layers.
#
# Regenerate the lock file after any change:
#   bazel run @trixie_agentplane_runner//:lock
version: 1

sources:
  - channel: trixie main
    url: https://snapshot.debian.org/archive/debian/20260301T000000Z
  - channel: trixie-security main
    url: https://snapshot.debian.org/archive/debian-security/20260301T000000Z

archs:
  - "amd64"

packages:
  - "curl"
  - "git"
  - "ripgrep"
