syntax = "proto3";

package ducktape.agentplane.protocol.v1;

message SubmitInput {
  string text = 1;
}

message ChangeModel {
  string model = 1;
}

// Ends exactly this active turn. A runner must not carry an interrupt forward to a later turn.
message InterruptTurn {
  string turn_id = 1;
}

// Stops the active harness while keeping its runner session resumable.
message StopRunnerSession {}

message Command {
  // Chosen by the caller and stable across every app/runner reconnect. Every command, including
  // an input, has one id; a distinct request id is neither needed nor accepted.
  string command_id = 1;
  oneof operation {
    SubmitInput submit_input = 2;
    ChangeModel change_model = 3;
    InterruptTurn interrupt_turn = 4;
    StopRunnerSession stop_runner_session = 5;
  }
}
