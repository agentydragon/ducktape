syntax = "proto3";

package ducktape.agentplane.protocol.v1;

import "google/protobuf/timestamp.proto";
import "x/agentplane/protocol/command.proto";

enum TurnStatus {
  TURN_STATUS_UNSPECIFIED = 0;
  TURN_STATUS_COMPLETED = 1;
  TURN_STATUS_INTERRUPTED = 2;
  TURN_STATUS_FAILED = 3;
  // The harness was gone before it reported a terminal turn result.
  TURN_STATUS_PROCESS_LOST = 4;
}

enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  ITEM_KIND_ASSISTANT_TEXT = 1;
  ITEM_KIND_REASONING = 2;
  ITEM_KIND_TOOL_CALL = 3;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_TO_HARNESS = 1;
  DIRECTION_FROM_HARNESS = 2;
}

message HarnessStarted {
  bool resumed = 1;
  int32 pid = 2;
}

message HarnessExited {
  int32 exit_code = 1;
  bool stopped_by_runner = 2;
  string stopped_by_command_id = 3;
}

message HarnessLost {}

message HarnessStderr {
  string text = 1;
}

// The emitting source has fsynced this exact Command and owns trying to process it. It does not
// promise native delivery, model selection, interruption, or a timing category.
message CommandAdmitted {
  Command command = 1;
}

// A terminal failed outcome after admission. An invalid request is rejected before admission and
// therefore has no Event.
message CommandFailed {
  string command_id = 1;
  string reason = 2;
}

message CommandNoop {
  string command_id = 1;
  string reason = 2;
}

message HarnessUserMessageConfirmed {
  string harness_message_id = 1;
  string text = 2;
  repeated string origin_command_ids = 3;
  string turn_id = 4;
}

message TurnStarted {
  string turn_id = 1;
  string model = 2;
}

message ModelChanged {
  string command_id = 1;
  string previous_model = 2;
  string model = 3;
}

message TurnCompleted {
  string turn_id = 1;
  TurnStatus status = 2;
  string error = 3;
  string interrupted_by_command_id = 4;
}

message ItemStarted {
  string item_id = 1;
  ItemKind kind = 2;
  string tool_name = 3;
}

message TextDelta {
  string item_id = 1;
  string text = 2;
}

message ToolArgumentsDelta {
  string item_id = 1;
  string partial_json = 2;
}

message ToolArguments {
  string item_id = 1;
  string arguments_json = 2;
}

message ToolOutputDelta {
  string item_id = 1;
  string text = 2;
}

message ToolResult {
  string output = 1;
  bool succeeded = 2;
}

message ItemCompleted {
  string item_id = 1;
  oneof outcome {
    string text = 2;
    ToolResult tool = 3;
  }
}

message Native {
  Direction direction = 1;
  string line = 2;
}

// Test-only: emitted only when hidden runner checkpoint options are enabled. It shares the normal
// replayable Event log so a test can crash a real process at a durable boundary.
message DebugCheckpoint {
  string name = 1;
  string command_id = 2;
}

message Event {
  google.protobuf.Timestamp at = 1;
  // Causal Native EventEntry origin sequences in this Event's original source.
  repeated uint64 source_sequences = 2;
  oneof observation {
    HarnessStarted harness_started = 4;
    HarnessExited harness_exited = 5;
    HarnessLost harness_lost = 6;
    HarnessStderr harness_stderr = 7;
    CommandAdmitted command_admitted = 8;
    CommandFailed command_failed = 9;
    CommandNoop command_noop = 10;
    HarnessUserMessageConfirmed harness_user_message_confirmed = 11;
    TurnStarted turn_started = 12;
    TurnCompleted turn_completed = 13;
    ItemStarted item_started = 14;
    TextDelta text_delta = 15;
    ToolArgumentsDelta tool_arguments_delta = 16;
    ToolArguments tool_arguments = 17;
    ToolOutputDelta tool_output_delta = 18;
    ItemCompleted item_completed = 19;
    Native native = 20;
    ModelChanged model_changed = 21;
    DebugCheckpoint debug_checkpoint = 22;
  }
}
