<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="../../../../../util/testing/frontend_visual/test-fonts.css" />
    <link rel="stylesheet" href="./bundle.css" />
    <style>
      /* Deterministic screenshots: Mantine transitions and the streaming badge's pulse are off. */

      *::before,
      *::after {

        animation-delay: 0s !important;
        transition-duration: 0s !important;
        transition-delay: 0s !important;
      }
    </style>
