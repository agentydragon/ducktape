<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bazel gRPC-Web demo</title>
  </head>
  <body>
    <main>
      <h1>Bazel gRPC-Web demo</h1>
      <form id="greeting-form">
        <label for="name">Name</label>
        <input id="name" name="name" value="Bazel" autocomplete="off" />

      </form>
      <button id="sign-in" type="button" hidden>Sign in with Authentik</button>
      <p id="result" role="status">Connecting…</p>
    </main>
    <script type="module" src="/frontend.js"></script>
  </body>
</html>
