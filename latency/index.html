  <body>
    <div id="report-content"></div>
    <noscript>This report uses JavaScript for charts and disclosures.</noscript>
    <script type="module">
      import {
        Accordion,
        Alert,
        Anchor,
        Badge,
        Box,
        Code,
        Container,
        Group,
        Paper,
        SimpleGrid,
        Stack,
        Table,
        Text,
        Title,
      } from "@mantine/core";
      import { BarChart, LineChart } from "@mantine/charts";
      import {
        html,
        mount,
        ManifestStamp,
      } from "../report.js?v=ebc2503d323c1b76";
      const response = await fetch("./evidence.json");
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const e = await response.json(),
        c = e.cohort;
      const backendGraph = e.backend_graph_comparison;
      const configurationRollout = e.ci_configuration_rollout;
      document.title =
        configurationRollout?.title ??
        backendGraph?.verdict_title ??
        "CI latency and ordinary Firecracker reuse";
      const gh = "https://github.com/agentydragon/ducktape";
      const link = (url, label) => html`<${Anchor} href=${url}>${label}<//>`;
      const pr = (n) => link(`${gh}/pull/${n}`, `#${n}`);
      const inv = (id) =>
        link(`https://app.buildbuddy.io/invocation/${id}`, id.slice(0, 8));
      const fmt = (s) => {
        if (s == null) return "Unobserved";
        const rounded = Math.round(s);
        return `${Math.floor(rounded / 60)}m ${(rounded % 60).toString().padStart(2, "0")}s`;
      };
      const num = (n) => (n == null ? "Unknown" : Number(n).toFixed(1));
      const table = (headers, rows, width = 800) =>
        html`<${Table.ScrollContainer} minWidth=${width}
          ><${Table} striped withTableBorder
            ><${Table.Thead}
              ><${Table.Tr}
                >${headers.map((h) => html`<${Table.Th}>${h}<//>`)}<//
              ><//
            ><${Table.Tbody}
              >${rows.map((row) => html`<${Table.Tr}>${row.map((v) => html`<${Table.Td}>${v}<//>`)}<//>`)}<//
            ><//
          ><//
        >`;
      const current = c.fresh_groups.find(
        (g) => g.name === "Backend production",
      );
      const caseBy = (n) => e.selected_cases.find((x) => x.pr === n);
      const prior = e.historical.previous_report;
      const priorUrl = `${gh}/blob/${prior.commit}/latency/index.html`;
      const capacity = e.kvm_pool.timeline
        .filter((_, i) => i % 4 === 0)
        .map((x) => ({
          ...x,
          time: new Date(x.t * 1000).toISOString().slice(11, 16),
        }));
      const phaseTimeline = () => {
        const x = caseBy(16947),
          base = Date.parse(x.timeline.first_workflow),
          vm = x.tests.find((t) => t.label.endsWith(":test_vm"));
        const phase = e.physical_phases.find(
          (p) => p.pr === 16947 && p.target_path.endsWith("__test_vm"),
        ).spans;
        const rows = [
          { name: "VM process", start: vm.start, end: vm.end },
          ...phase
            .filter((p) =>
              [
                "system_test.stack.setup",
                "system_test.case",
                "system_test.stack.cleanup",
              ].includes(p.name),
            )
            .map((p, i) => ({
              name:
                p.name === "system_test.case"
                  ? `Concurrent VM case ${i}`
                  : p.name.replace("system_test.stack.", "Stack "),
              start: p.start,
              end: p.end,
            })),
        ];
        return html`<${Box} style=${{ overflowX: "auto" }} mt="lg"
          ><svg
            role="img"
            aria-label="Nested wall-clock VM phases for PR 16947; seconds from first workflow creation; overlapping cases are not additive"
            width="1000"
            height=${rows.length * 34 + 46}
            viewBox=${`0 0 1000 ${rows.length * 34 + 46}`}
          >
            ${[0, 100, 200, 300, 400, 500].map((t) => html`<text x=${190 + t * 1.35} y="18" font-size="13" fill="currentColor">${t}s</text>`)}
            ${rows.map((r, i) => {
              const start = (Date.parse(r.start) - base) / 1000,
                end = (Date.parse(r.end) - base) / 1000;
              return html`<text
                  x="0"
                  y=${52 + i * 34}
                  font-size="13"
                  fill="currentColor"
                  >${r.name}</text
                ><rect
                  x=${190 + start * 1.35}
                  y=${34 + i * 34}
                  width=${Math.max(2, (end - start) * 1.35)}
                  height="24"
                  rx="3"
                  fill=${i === 0 ? "#228be6" : i === 1 ? "#12b886" : "#f59f00"}
                  ><title>
                    ${r.name}: ${start.toFixed(1)}–${end.toFixed(1)}s from
                    workflow creation
                  </title></rect
                >`;
            })}
          </svg><//
        >`;
      };
      const dispositions = [
        [
          "Native fixtures, partitions, trust reuse",
          "Merged #16675/#16689/#16695/#16700. Runtime cut remains established by prior configured queries: App files 0 in native Pod/central/Gateway; App Pod retains 8. Current natural traces now include successful warm reuse. This does not measure a complete-feedback treatment. Full historical PR selector replay remains deferred behind the resource/guest long pole; single-file historical replay 79→15 App tests, positive controls 45→45 and 20→20 is retained.",
        ],
        [
          "Four-worker Pod port",
          "Merged #16659. Historical same-input warm 22-case ABBA:363.3→289.2s action mean (20.4%), CPU 883.2→844.3s, peak 5.07→5.12 GiB; faster-control sensitivity 13.8%. Current split has different inventories. Exposure threshold ends 22 Nov 11:01 UTC; not yet mature. No attributed fleet gain.",
        ],
        [
          "Rejected allocations",
          "Two ordinary pytest stacks:293.608→313.861s slowest action (+6.9%), CPU 718.740→1046.335s (+45.6%), same 15 cases. Duplicated setup defeated that arrangement. Bridge 8s hards saved 24.9% elapsed but cost 62.8% more CPU; blanket Python bytecode added 3455 cold compiles/4203 CPU-s for 4.494s import reduction. Do not repeat unchanged.",
        ],
        [
          "Guest and shared-stack architecture",
          "Direct-guest private systemd proof and missing-proof negative passed. Native ownership screen 200.769 vs 202.192s did not isolate a gain; shared-guest 343/424/246/357s changed fresh-fixture coverage and cleanup. Codex-only root removed 26.2% bytes but only 4.0% time in one confounded pair. Historical 376f graph replay 442.484→365.475s (17.4%), CPU+5.4%,562 NEW launches/4118 JUnit exposures; not current fleet feedback.",
        ],
        [
          "Image store and imports",
          "Store continuity #15188, image-import overlap #15966 and usable-image guard #16040 are merged. Historical warm setup 46.992→32.216s; whole graphs had different VM roots. #15126 bulk import and #15214 image split are still OPEN. Hold promotion until same-source complete graphs show savings. Current warm traces establish retained baseline attachment, not each optimization’s treatment effect.",
        ],
        [
          "Artifact mounts and MCP overlap",
          "Artifact feasibility #16047 remains OPEN/manual: real harnesses passed, input bytes fell only 47044B. MCP overlap #16038 merged: case 112.336→96.833s, whole action 254.348→265.866s. Current 1+3+4 partition differs. No transfer or CI saving credited.",
        ],
        [
          "KVM placement and capacity",
          "Old one-worker reservation incident is historical. #15822 closed; #15996 pilot/capacity evidence merged. Four actions on three slots queued 215.314s; Pod still last. Prior #16378 had 537.14s queue/444.392s conditional feedback headroom with 36/36 saturated samples. The historical 09:15–10:45 UTC window had 1–2 registered workers and a consequential 416s wait on a failed head. Later #17015 permits eight workers and removes host spread; the earlier same-input qualification shows the slow registration ramp under the prior policy. #17045 now removes scale-up stabilization; the latest burst above finds reservation overcount and failed bootstrap holding excess capacity. Required routing remains unchanged.",
        ],
        [
          "Reliability and recovery",
          "Browser route lifetime #16045/#16051, auth/guest diagnostics #16053/#16055, readiness #16299/#16344 and Claude resume transcript #16704 are merged. Current #16865 is a concrete managed snapshot TSC-scaling failure; #16972 exposes Kine fatal exit. Neither is evidence those prior mechanisms were repaired or regressed. Stream diagnostic #16041 remains OPEN; two-reset native control still exhausted WaitExecution budget despite physical success.",
        ],
        [
          "Ownership and unfinished diagnoses",
          "Natural browser auth trigger, admitted-turn guest stall, early QEMU crash #16057 and retained-VM failures remain distinct. New Kine fatal narrows the local failure chain; its trigger remains unproven. Map runner shutdown/reconciliation ownership, then simplify one race-tested path. No blanket retry, replay, timeout increase or validation-policy change.",
        ],
        [
          "Measurement commitments",
          "Original ten-lane cohorts and methods remain linked below. Seven-day/50-fresh-outcome follow-ups for baseline, MCP and browser repairs are not mature; new selected cases are not substitutes. Current report advances fleet sampling, physical long paths, pool clocks and one provider early-failure signal. Matched full-graph architecture qualification and trust-reuse cost attribution remain open in #16034/#16099.",
        ],
      ];
      function Qualification() {
        const q = e.vm_kvm_qualification;
        const a = q.aggregate_by_arm;
        return html`<section id="vm-kvm-qualification">
          <${Title} order=${2}
            >Earlier VM routing qualification · slow scale-up policy<//
          >
          <${Text} my="sm"
            >${q.window_utc.join(" → ")} UTC · pinned source
            <${Code}>${q.source_devel_commit}<//>. ${q.workload}<//
          >
          <${Alert}
            title=${q.status}
            color=${q.qualified ? "green" : "yellow"}
            my="md"
          >
            ${q.decision}
          <//>
          <${SimpleGrid} cols=${{ base: 1, sm: 3 }} my="md">
            <${Paper} withBorder p="md"
              ><${Text} c="dimmed">Managed VM process<//>
              <${Title} order=${3}>${fmt(a.control.vm.process.p50)} median<//>
              <${Text}
                >p90 ${fmt(a.control.vm.process.p90)} · mean
                ${fmt(a.control.vm.process.mean)} ·
                n=${a.control.vm.process.n}<//
              >
            <//>
            <${Paper} withBorder p="md"
              ><${Text} c="dimmed">KVM VM process<//>
              <${Title} order=${3}>${fmt(a.candidate.vm.process.p50)} median<//>
              <${Text}
                >p90 ${fmt(a.candidate.vm.process.p90)} · mean
                ${fmt(a.candidate.vm.process.mean)} ·
                n=${a.candidate.vm.process.n}<//
              >
            <//>
            <${Paper} withBorder p="md"
              ><${Text} c="dimmed">KVM VM admission wait<//>
              <${Title} order=${3}>${fmt(a.candidate.vm.queue.p90)} p90<//>
              <${Text}
                >Valid queue n=${a.candidate.vm.queue.n};
                ${a.candidate.vm.invalid_queue_count} unknown/inverted clocks.
                Waiting is additional to execution.<//
              >
            <//>
          <//>
          <${Box}
            role="img"
            data-chart="qualification-process"
            aria-label="VM test process median and p90 by configured execution lane, seconds"
          >
            <${BarChart}
              h=${240}
              data=${["control", "candidate"].map((k) => ({ lane: k === "control" ? "Managed TCG" : "Shared KVM", Median: a[k].vm.process.p50, p90: a[k].vm.process.p90 }))}
              dataKey="lane"
              series=${[
                { name: "Median", color: "blue.6" },
                { name: "p90", color: "orange.6" },
              ]}
              withLegend
              valueFormatter=${(v) => `${num(v)}s`}
            />
          <//>
          <${Text} my="sm">${q.comparison_boundary}<//>
          ${table(
            [
              "Lane / fixture state",
              "VM actions",
              "Process p50 / p90 / mean",
              "Setup median",
              "Concurrent-case envelope median",
              "Retained-baseline cleanup median",
            ],
            ["control", "candidate"].flatMap((k) =>
              Object.entries(a[k].vm_by_persistence || {}).map(([state, v]) => [
                `${k} / ${state}`,
                v.process.n,
                `${num(v.process.p50)} / ${num(v.process.p90)} / ${num(v.process.mean)}s`,
                fmt(v.setup_seconds.p50),
                fmt(v.case_envelope_seconds.p50),
                fmt(v.cleanup_seconds.p50),
              ]),
            ),
            1100,
          )}
          ${table(
            [
              "Round / lane / invocation",
              "All selected actions",
              "Registered start → end",
              "Bazel command",
              "VM process p50 / p90 / mean",
              "VM queue p50 / p90 / mean (valid n)",
              "Firecracker queue p50 / p90 / mean (valid n)",
              "Last selected test",
            ],
            q.runs.map((r) => [
              html`${r.round} · ${r.arm}<br />${inv(r.invocation)}`,
              `${r.passed_actions}/${r.actions} passed; ${r.failed_actions} failed`,
              `${r.registered_at_arm_start ?? "Unknown"} → ${r.registered_at_arm_end ?? "Unknown"}`,
              fmt(r.command_elapsed_s),
              `${num(r.vm.process.p50)} / ${num(r.vm.process.p90)} / ${num(r.vm.process.mean)}s`,
              `${num(r.vm.queue.p50)} / ${num(r.vm.queue.p90)} / ${num(r.vm.queue.mean)}s (n=${r.vm.queue.n})`,
              `${num(r.firecracker.queue.p50)} / ${num(r.firecracker.queue.p90)} / ${num(r.firecracker.queue.mean)}s (n=${r.firecracker.queue.n})`,
              r.last_test,
            ]),
            1450,
          )}
          <${Text} size="sm" my="sm">${q.feedback_boundary}<//>
          <${Alert}
            title="Interrupted third control · retained outcome"
            color="gray"
            my="md"
          >
            ${inv(q.interrupted_control.invocation)} ·
            ${q.interrupted_control.reason} ${q.interrupted_control.disposition}
          <//>
          <${Title} order=${3} mt="lg"
            >Requested workers versus registered capacity<//
          >
          <${Box}
            role="img"
            data-chart="qualification-capacity"
            aria-label="Qualification window desired workers, registered executors and occupied tasks at fifteen-second resolution"
            my="md"
          >
            <${LineChart}
              h=${280}
              data=${q.timeline.map((p) => ({ ...p, time: new Date(p.t * 1000).toISOString().slice(11, 19) }))}
              dataKey="time"
              series=${[
                { name: "desired", label: "Desired workers", color: "gray.6" },
                { name: "registered", label: "Registered", color: "blue.6" },
                { name: "busy", label: "Tasks in progress", color: "teal.6" },
              ]}
              withLegend
              withDots=${false}
              curveType="step"
              yAxisProps=${{ allowDecimals: false }}
            />
          <//>
          <${Text} my="sm">${q.admission_mechanism}<//>
          <${Text} size="sm"
            >Local reservations can duplicate actions and are not a central
            backlog count. Executing-task gauges include preparation and upload.
            Sampled registration, VMI readiness and native worker logs were
            checked separately.<//
          >
          <${Title} order=${3} mt="lg"
            >Coverage, resource and cleanup qualification<//
          >
          ${table(
            ["Criterion", "Observed result", "Limit / disposition"],
            q.gates.map((g) => [g.criterion, g.result, g.limit]),
            1050,
          )}
          ${table(["Resource / scope", "Observed value", "Interpretation"], q.resource_rows, 1050)}
          <${Text} my="sm">${q.resource_summary}<//>
          <${Text} size="sm"
            >Historical next action at collection: ${q.next_action} Follow-up:
            #17045 is now deployed; the new scale-up experiment above supersedes
            that recommendation and defers fixture reuse behind startup and
            demand control.<//
          >
          <${Accordion} variant="contained" mt="md">
            <${Accordion.Item} value="qualification-methods">
              <${Accordion.Control}
                >Qualification commands, clocks and limits<//
              >
              <${Accordion.Panel}
                ><${Stack} gap="sm">
                  ${q.methods.map((m) => html`<${Text} size="sm">${m}<//>`)}
                  ${link(`${gh}/blob/${q.source_devel_commit}/agentplane/system_tests/suites/test_vm.py`, "Both unchanged harness cases")}
                  ${link(`${gh}/blob/${q.source_devel_commit}/agentplane/system_tests/x/vm_kvm/BUILD.bazel`, "Existing manual KVM configuration")}
                  ${link(`${gh}/pull/17015`, "Merged pool capacity change")}
                <//><//
              >
            <//>
          <//>
        </section>`;
      }

      function ScaleupQualification() {
        const q = e.kvm_scaleup_qualification;
        return html`<section id="kvm-scaleup-qualification">
          <${Title} order=${2}
            >Faster scale-up: cold and registered-worker bursts<//
          >
          <${Text} my="sm"
            >${q.observation_window_utc.join(" → ")} UTC. ${pr(17045)} deployed
            +4 workers /60s, zero scale-up stabilization; min1/max8 at that
            observation. The later min2 rollout is recorded above. Scale-down
            remains −1/300s with a 900s stabilization window.<//
          >
          <${Alert}
            title="Four test processes requested eight workers"
            color="yellow"
            my="md"
            >${q.finding}<//
          >
          <${SimpleGrid} cols=${{ base: 1, sm: 3 }} my="md">
            ${q.arms.map((a) => html`<${Paper} withBorder p="md"><${Text} c="dimmed">${a.name === "cold" ? "Cold · one registered worker" : "Warm · six registered workers"}<//><${Title} order=${3}>${fmt(a.command_elapsed_s)} command<//><${Text}>${a.new_physical_actions} NEW actions /${a.junit.tests} passing cases · ${inv(a.invocation)}<//><//>`)}
            <${Paper} withBorder p="md"
              ><${Text} c="dimmed">Coverage retained<//
              ><${Title} order=${3}>8 actions /16 cases<//
              ><${Text}
                >Real Claude and Codex harnesses; no retries, failures or skips.
                Maximum own physical concurrency:4.<//
              ><//
            >
          <//>
          <${Text} my="sm">${q.comparison_boundary}<//>
          <${Box}
            role="img"
            data-chart="scaleup-process"
            aria-label="Firecracker process median and p90, seconds; four actions per burst"
          >
            <${BarChart}
              h=${240}
              data=${q.arms.map((a) => ({ burst: a.name, Median: a.clocks.process.p50, p90: a.clocks.process.p90 }))}
              dataKey="burst"
              series=${[
                { name: "Median", color: "blue.6" },
                { name: "p90", color: "orange.6" },
              ]}
              withLegend
              valueFormatter=${(v) => `${num(v)}s`}
            />
          <//>
          ${table(
            [
              "Burst / clock",
              "Valid n /4",
              "p50 (s)",
              "p90 (s)",
              "Mean (s)",
              "Missing / invalid",
            ],
            q.arms.flatMap((a) =>
              ["queue", "worker_prep", "process"].map((k) => [
                `${a.name} / ${k}`,
                a.clocks[k].n,
                num(a.clocks[k].p50),
                num(a.clocks[k].p90),
                num(a.clocks[k].mean),
                4 - a.clocks[k].n,
              ]),
            ),
            880,
          )}
          <${Alert} title="Warm queue latency is unknown" color="gray" my="md"
            >All four warm queued→worker-start intervals are inverted, as is one
            cold interval. They are excluded, never clamped to zero. Process
            intervals are valid for all eight actions. Queue, preparation and
            process percentiles are different populations and must not be
            added.<//
          >
          <${Title} order=${3} mt="lg"
            >Pool demand, registration and physical work<//
          >
          <${Box}
            role="img"
            data-chart="scaleup-capacity"
            aria-label="Desired and registered workers, executor task gauge and this experiment's native test processes; UTC sampled about every eleven seconds"
            my="md"
          >
            <${LineChart}
              h=${300}
              data=${q.timeline.map((p) => ({ ...p, time: new Date(p.t * 1000).toISOString().slice(11, 19) }))}
              dataKey="time"
              series=${[
                { name: "desired", label: "Desired workers", color: "gray.6" },
                { name: "registered", label: "Registered", color: "blue.6" },
                { name: "busy", label: "Task gauge", color: "teal.6" },
                {
                  name: "owned_test_processes",
                  label: "Own test processes",
                  color: "orange.6",
                },
              ]}
              withLegend
              withDots=${false}
              curveType="step"
              yAxisProps=${{ allowDecimals: false }}
            />
          <//>
          <${Text} my="sm">${q.scaleup_observation}<//>
          <${Text} my="sm">${q.demand_observation}<//>
          <${Text} size="sm"
            >${q.sampling.observations} pool observations; requested 10s
            spacing, maximum gap ${num(q.sampling.maximum_observation_gap_s)}s.
            Registration requires scheduler-health on current VMI pods;
            freshness was checked separately. The task gauge includes
            preparation/upload and may include unrelated shared-pool work;
            own-process counts use completed native execution intervals. Local
            reservations are duplicate views, not distinct backlog.<//
          >
          <${Title} order=${3} mt="lg">Bootstrap and idle scale-down<//>
          <${Text} my="sm">${q.boot_failure}<//>
          <${Text} my="sm">${q.recovery.observation}<//>
          ${table(["Qualification", "Result", "Limit"], q.gates, 1050)}
          <${Title} order=${3} mt="lg">RAM, CPU and disk pressure<//>
          ${table(["Metric / scope", "Observed value", "Boundary"], q.resource_rows, 1050)}
          <${Text} size="sm">${q.resource_boundary}<//>
          <${Title} order=${3} mt="lg"
            >Disposition of the earlier recommendation<//
          >
          <${Text} my="sm"
            >The prebuilt-image experiment proposed in this collection is now
            complete in the comparison above. It tested a NixOS bundle with a
            different kernel and Docker version; production adoption
            subsequently merged in #17184. Automatic recovery of
            never-registered workers and distinct scheduler-demand ownership are
            still open. Required VM routing remains managed; the bounded Docker
            reuse follow-up above now tests fixture retention. Fleet routing
            still needs reliable pool control. The original proposal is retained
            in the evidence for this observation window.<//
          >
          <${Text} my="sm"
            >${q.rejected_query.finding} Focused rule test:
            ${inv(q.rejected_query.invocation)}.
            ${link("https://www.buildbuddy.io/docs/prometheus-metrics-on-prem/", "BuildBuddy metric definitions")}.
            No demand-query patch was published or deployed.<//
          >
