<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CI latency</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript>This report uses JavaScript for charts and disclosures.</noscript>
    <script type="module">
      import {
        Accordion,
        Anchor,
        Box,
        Code,
        Container,
        Group,
        Select,
        Stack,
        Table,
        Text,
        Title,
      } from "@mantine/core";
      import React from "react";
      import { BarChart } from "@mantine/charts";
      import { html, mount } from "../report.js";

      const evidenceSha =
        "cbc79ebc984297232d124c4d24db0bdfda646887ab4ce2b856c65d8d6d942303";
      const response = await fetch(`./evidence.json?v=${evidenceSha}`);
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const bytes = await response.arrayBuffer();
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      if (
        Array.from(new Uint8Array(digest), (n) =>
          n.toString(16).padStart(2, "0"),
        ).join("") !== evidenceSha
      )
        throw new Error("Evidence does not match this report");
      const e = JSON.parse(new TextDecoder().decode(bytes));
      const repo = "https://github.com/agentydragon/ducktape";
      const link = (href, name) => html`<${Anchor} href=${href}>${name}<//>`;
      const pr = (n) => link(`${repo}/pull/${n}`, `#${n}`);
      const inv = (id, label) =>
        link(`https://app.buildbuddy.io/invocation/${id}`, label);
      const source = (path, label) =>
        link(`${repo}/blob/${e.source_devel_commit}/${path}`, label);
      const table = (headers, rows, width = 540) =>
        html` <${Table.ScrollContainer}
          minWidth=${width}
          type="native"
          maw="100%"
        >
          <${Table} striped verticalSpacing="sm">
            <${Table.Thead}
              ><${Table.Tr}
                >${headers.map((label) => html`<${Table.Th} key=${label}>${label}<//>`)}<//
              ><//
            >
            <${Table.Tbody}
              >${rows.map((cells, i) => html`<${Table.Tr} key=${i}>${cells.map((item, j) => html`<${Table.Td} key=${j}>${item}<//>`)}<//>`)}<//
            >
          <//>
        <//>`;
      const disclosure = (label, contents) =>
        html` <${Accordion} variant="contained">
          <${Accordion.Item} value=${label}>
            <${Accordion.Control}>${label}<//>
            <${Accordion.Panel}>${contents}<//>
          <//>
        <//>`;
      const names = {
        same_repo_open: "Repository opening",
        same_repo_update: "Repository update",
        fork_open: "Trusted fork opening",
        fork_update: "Trusted fork update",
      };
      const fmt = (v) => (v == null ? "—" : String(Math.round(v * 10) / 10));
      const pair = (v) =>
        v.n ? fmt(v.p50) + " / " + fmt(v.p90) + " (" + v.n + ")" : "—";
      const section = (id, title, ...children) =>
        html`<section id=${id}>
          <${Stack} gap="sm"><${Title} order=${2}>${title}<//>${children}<//>
        </section>`;
      const p = (...s) => html`<${Text}>${s}<//>`;
      const previous = link(
        repo + "/blob/" + e.previous_report_commit + "/latency/index.html",
        "Previous snapshot and matched trials",
      );
      const now = e.heads.filter((r) => r.day === "2026-11-24");
      const jf = (r, k) =>
        link(
          repo + "/actions/runs/" + r.gates[k].run + "/job/" + r.gates[k].job,
          k,
        );
      const sample = (pr, time) =>
        now.find((r) => r.pr === pr && (r.green === time || r.red === time));
      function Report() {
        const [k, setK] = React.useState("fork_open");
        const days = e.daily[k];
        return html`<${Container}
          component="main"
          size="72rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
          ><${Stack} gap="xl">
            <header>
              ${link("../", "Ducktape reports")}<${Title} my="sm"
                >CI feedback latency<//
              >
              <${Text} size="lg"
                >Bazel finished last on 59 of 69 green heads on 24 November.
                Median green ranged from 4m 51s to 7m 01s across the four PR
                classes. A 30% cut to median green needs roughly half the
                measured Bazel critical path removed. A 60% cut also requires
                changing which work enters that path.<//
              >
              <${Text} c="dimmed" mt="sm"
                >17–23 November UTC and 24 November through 22:30 UTC. Seconds
                from first observed workflow creation for each PR head.
                Successful reruns included.<//
              >
            </header>
            ${section(
              "cohorts",
              "Time to green and first red",
              table(
                [
                  "24 November",
                  "Heads",
                  "Green / red / canceled",
                  "Required green p50 / p90 (n)",
                  "First red p50 / p90 (n)",
                  "Required red p50 / p90 (n)",
                ],
                Object.entries(e.classes).map(([k, s]) => [
                  names[k],
                  s.n,
                  [
                    s.outcomes.green || 0,
                    s.outcomes.red || 0,
                    s.outcomes.cancelled || 0,
                  ].join(" / "),
                  pair(s.green),
                  pair(s.red),
                  pair(s.required_red),
                ]),
                820,
              ),
              disclosure(
                "First green or red on each head",
                table(
                  [
                    "Class",
                    "Any verdict / heads",
                    "First verdict p50 / p90 (s)",
                    "30% / 60% median targets (s)",
                  ],
                  Object.entries(e.classes).map(([k, d]) => [
                    names[k],
                    d.first_verdict.n + " / " + d.n,
                    fmt(d.first_verdict.p50) + " / " + fmt(d.first_verdict.p90),
                    fmt(0.7 * d.first_verdict.p50) +
                      " / " +
                      fmt(0.4 * d.first_verdict.p50),
                  ]),
                ),
              ),
              p(
                "The median PR-opening to workflow delay was 4 s in-repository and 5 s on trusted forks. GitHub does not give this collection a comparable push timestamp for updates. On devel the rules require Bazel, artifacts/imports and pre-commit, with zero required approvals and no strict up-to-date requirement.",
              ),
              p(
                "Of 98 audited heads, 69 reached green, 16 ended red and 13 were canceled. Four greens and one cancellation had already reported a failure. First red includes a matching BuildBuddy status, a failed required gate or a confirmed devel merge conflict. Required green is the completion of all three checks. Draft status, conflict resolution, policy exceptions and the time an agent read the result have no historical readiness clock here.",
              ),
              html`<${Select}
                label="Daily green by PR class"
                value=${k}
                onChange=${(v) => v && setK(v)}
                allowDeselect=${false}
                maw="22rem"
                data=${Object.entries(names).map(([value, label]) => ({ value, label }))}
              />`,
              html`<${Box} role="img" aria-label="Minutes to required green by UTC arrival day"><${BarChart} h=${235} withLegend dataKey="day" data=${days.map((d) => ({ day: d.day.slice(8) + (d.day.endsWith("24") ? "*" : ""), Median: d.green.n ? d.green.p50 / 60 : null, P90: d.green.n >= 8 ? d.green.p90 / 60 : null }))} series=${[
                { name: "Median", color: "blue.7" },
                { name: "P90", color: "orange.7" },
              ]} yAxisLabel="Minutes" /></${Box}>`,
              p(
                "UTC arrival day, * partial. Green counts for days 17–24: " +
                  days.map((d) => d.green.n).join(", ") +
                  ". A missing bar means no observations or fewer than eight greens for p90. Small samples make the tails sensitive to a single rerun.",
              ),
              disclosure(
                "Daily values in seconds",
                table(
                  [
                    "UTC day",
                    "Heads",
                    "Green (n)",
                    "Green p50 / p90, s",
                    "First red p50 / p90, s (n)",
                  ],
                  days.map((d) => [
                    d.day,
                    d.n,
                    d.green.n,
                    d.green.n
                      ? fmt(d.green.p50) +
                        " / " +
                        (d.green.n >= 8 ? fmt(d.green.p90) : "—")
                      : "—",
                    pair(d.red),
                  ]),
                ),
              ),
              disclosure(
                "Changed paths and sample selection",
                html`<${Stack}
                  >${table(
                    [
                      "24 November",
                      "Heads",
                      "Green p50 / p90 (n)",
                      "First red p50 / p90 (n)",
                    ],
                    Object.entries(e.workloads).map(([k, s]) => [
                      k,
                      s.n,
                      pair(s.green),
                      pair(s.red),
                    ]),
                  )}
                  ${p("We ranked heads by a hash of the SHA within day, repository and opening/update class. The cap was eight per class per complete day and 30 on the 24th. Of 320 candidates, 276 tested merges had the event head as second parent and a devel first parent, and six fork resolver logs confirmed a devel conflict. We excluded 38 other merges, including 22 on the 24th. An opening was the first observed workflow within one minute of PR creation. Counts do not estimate the repository-wide mix. Changed paths use the tested tree versus its first parent, prioritizing Debundle, Agentplane, cluster and Nix when edits span areas.")}<//
                >`,
              ),
            )}
            ${section(
              "drivers",
              "What runs while a PR waits",
              p(
                "Debundle accounted for 80 of 98 audited heads and 58 of 69 greens. In the final 90 minutes of arrivals, nine of ten heads touched Debundle. Five reached green (416–2,687 s), two ended red and three were canceled. These samples describe that workload mix.",
              ),
              p(
                "On the 69 greens, GitHub admission for the first Bazel job took 2 s at the median and 10 s at p90. Its Test + Build + lint step took 309 / 624 s. The pinned CLI install step took 1 / 2 s among 59 jobs with a positive-duration step. Pre-commit finished last five times, and artifacts/imports five times. The previous cache-stall sample had pre-commit last on ten of twelve. ",
                previous,
              ),
              p(
                "On 54 Bazel-last, single-attempt greens with a native test critical path, its median length was 254 s. Test actions accounted for the largest portion on 24 paths, Rust compilation on 16, Lean compilation on 12 and other operations on two. Median reported remote queue share was 0.16% among paths with that field. The outer runner still needs to start and sync. This sample gives little reason to buy general runner slots.",
              ),
              table(
                [
                  "Head",
                  "Hosted and remote clocks from workflow creation",
                  "What determined feedback",
                ],
                [
                  [
                    pr(19701),
                    "Bazel runner +27 s, remote sync +41 s, affected targets logged +93 s, all green +113 s.",
                    "20 targets, six tests. Native test path 1.35 s.",
                  ],
                  [
                    pr(19836),
                    "Remote wait message → first sync 17 s. 235 affected targets. Artifacts green +107 s, Bazel green +421 s.",
                    "Test invocation 305 s, with a 291 s path through Rust CLI compilation, graph export and editor-spec generation.",
                  ],
                  [
                    pr(19849),
                    "Bazel runner +2 s, other gates green by +83 s. Printer test enqueued +876 s, timed out +939 s. Live status +998 s, required red +1,248 s.",
                    "The failing process ran 61 s. A different test, linked if_test, ended the 1,096 s native critical path. Shrinking that last test alone would miss the first red.",
                  ],
                ],
                730,
              ),
              html`<${Group}
                >${[sample(19701, 113), sample(19836, 421), sample(19849, 998)].map((r) => inv(r.trace.invocation, "#" + r.pr + " inner trace"))}<//
              >`,
              p(
                "The sample’s assigned, completed GitHub jobs occupied 1,145 runner-minutes inside the 24 November window, including waiting on BuildBuddy. This includes pre-audit candidates. On #19849 the three largest fresh TestRunner labels by aggregate process time were property_assignment (833 s), flat_patterns (624 s) and loops (586 s). Their actions overlap. The native path instead spent 267 s in corejs_certificate_support, 150 s in corejs_runtime and 312 s in if_test. BuildBuddy’s outer runner handles checkout and invokes Bazel. The inner actions run on RBE. Pool-wide entitlement, backlog and per-action worker class were unavailable from these clocks.",
              ),
              disclosure(
                "Reruns and earlier red",
                p(
                  "Four heads recovered on the same tested merge. #19821 hit the 300 s default_parameters timeout. #19857 timed out in reordering and the Excalidraw browser smoke. One #19800 head failed test_services_central and another hit a microVM restore error. All four had user-triggered rerun attempts. On #19857 the first job ended 21:37:02 UTC, the next attempt started 21:52:02 and its Bazel job started 21:58:08. The 15-minute gap preceded the attempt. On the 20 heads with both red clocks the paired median lead of the first signal was 5.5 s, and the maximum was 261 s. A subscription that follows the tested merge’s live status can expose those leads. The stored timestamps measure publication. ",
                  pr(19857),
                  " · ",
                  pr(19800),
                ),
              ),
            )}
            ${section(
              "goals",
              "What a 30% or 60% reduction requires",
              p(
                "The targets below are relative to each class’s current green median. For each head we reduce its measured ordinary-test critical path and recompute the latest of all three gates. Untraced heads and reruns keep their original clocks. The simulation assumes each second removed from the path moves Bazel completion a full second earlier. A parallel straggler can absorb that saving.",
              ),
              table(
                [
                  "PR class",
                  "Current",
                  "30% target",
                  "60% target",
                  "If path halves",
                  "Path cut needed for 30% / 60%",
                  "Other-gate floor",
                ],
                e.model.map((m) => [
                  names[m.k],
                  m.base,
                  fmt(0.7 * m.base),
                  fmt(0.4 * m.base),
                  fmt(m.half),
                  m.needed.join("% / ") + "%",
                  fmt(m.floor),
                ]),
                735,
              ),
              p(
                "The previous 182-head baseline had green medians of 197, 281, 167 and 397 s in the same class order. Its 30% goals were 138, 197, 117 and 278 s. All four current medians exceed them. The dates, sampled workloads and opening-clock origins differ. The new estimates use today’s observations.",
              ),
              p(
                "For first red, 30% / 60% targets are 142 / 81 s for fork openings, 113 / 64 s for fork updates, and 539 / 308 s for same-repo updates. The last pair rests on four first-red signals. Four fork conflicts were diagnosed in 7–15 s. We observed no same-repo opening red. Simply reporting terminal checks faster cannot recover minutes on heads whose failing action starts late.",
              ),
              html`<${Title} order=${3}
                >Run the printer test as soon as its own inputs are ready<//
              >`,
              p(
                "It invokes only lowersplit --diagnostic, yet its launcher includes both compiler entry points and their shared Bazel target includes Certified.lean. Give the diagnostic runner its actual import closure and module I/O. Keep a separate end-to-end test for public CLI dispatch. This bounded change could advance red on proof edits that leave the printer’s inputs unchanged. ",
                source(
                  "devinfra/js/debundle/x/split_proof/lean/BUILD.bazel",
                  "Current targets",
                ),
              ),
              p(
                "The first same-seed trial favored the warm stock dependencies: stock passed in 16.8 s, while the cold candidate entered the queue 167 s later and timed out at 60 s. We then changed only Certified.lean after both layouts had built and forced both tests to execute again with their original assertions. The diagnostic-only test entered the queue 192 s earlier, alongside the stock workflow-library rebuild, and passed in 48.7 s. The stock test then timed out at 60.2 s. This demonstrates earlier eligibility on that kind of edit. Both layouts timed out once across the two trials. Confirm repeatability and measure PR-wide red before adopting.",
                " ",
                inv(
                  "6a0b1b4a-22d6-425a-8fd8-f8485dd33aed",
                  "Same-input diagnostic trial",
                ),
                " · ",
                inv(
                  "8a9d83ab-3a5a-4ce5-b192-e67529f25489",
                  "Certified-only edit replay",
                ),
              ),
              html`<${Title} order=${3}
                >Start a focused test run on graph-wide changes<//
              >`,
              p(
                "The median trusted-fork update red came from #19732. Its MODULE.bazel change triggered a sweep with 2,294 test labels in scope. It also edited the translation package BUILD file. The remote driver started at +39 s. The failing shift_fuzz_test queued at +150 s, ran 8.6 s and published red at +161 s. The preliminary query took 10.8 s. Removing it alone cannot deliver the 48 s required for 30%. ",
                jf(sample(19732, 161), "Bazel"),
                " · ",
                inv("6d108243-88f9-46a0-8411-b6249e93d595", "Selection query"),
              ),
              p(
                "Trial a parallel run of tests in directly edited BUILD packages on the same merge, using the normal flags, trust boundary and cache. Keep the full sweep running. For this head, a focused run starting at +39 s would have 74 s to produce red for a 30% cut, or 25 s for 60%. The latter leaves about 16 s for startup and dependencies after the test itself. Compare exact-source failures, extra runner-minutes, duplicated setup and required green before enabling. This helps only when the early run contains the failure.",
              ),
              html`<${Title} order=${3}
                >Narrow the Rust tool used for graph export<//
              >`,
              p(
                "The graph action invokes the full debundler with run --graphs --reports-only. Give that action a smaller executable that calls the same export code, as the analyzer and projector already do. On #19836 the tool-side CLI rlib alone took 67 s. The whole 67 s would cover just over half the 126 s needed for a 30% cut on this head. Compare emitted graph bytes, rejection markers, editor specs, real browser behavior and cold/warm full-gate clocks. Medium engineering effort, no standing capacity. The shared pipeline crates and other Rust test targets can remain the last work. ",
                source(
                  "devinfra/js/debundle/pipeline.bzl",
                  "Graph export action",
                ),
              ),
              html`<${Title} order=${3}
                >Reduce both proof compilation and editor-test time<//
              >`,
              p(
                "Try one cacheable Lean compilation per module or small import component, with dependents starting when their imports finish. Retain the pinned toolchain, axiom audit and byte-equivalent outputs. Replay an upstream runtime edit and a downstream proof edit with both target and exec configurations. Previous Frame/Scope partitioning saved 39 s on a warm 415 s path but regressed twice cold. A new boundary must also beat the cold control. ",
                inv(
                  "d22f7c7a-e421-49ec-99d8-3200ee4f0a30",
                  "Earlier warm replay",
                ),
              ),
              p(
                "The certified editor test binds an origin, certifies the split, runs the stock browser, installs the overlay and runs the split browser. The first two operations after binding both read the original inputs. Overlap certification and the stock browser, await both before installing the overlay, and retain the separate output-tree check and both browser comparisons. This can save at most the shorter overlapping phase and raises peak CPU and memory. Measure each phase and compare the full gate, including competing tests. ",
                source(
                  "devinfra/js/debundle/x/split_proof/integration/excalidraw/browser_smoke_test.py",
                  "Editor test contract",
                ),
              ),
              p(
                "For green, #19838 took 868 s. Its 769 s path contained roughly 464 s of Lean work and 303 s in the editor test. Holding the other 99 s fixed, a 30% cut allows 509 s on this path (for example, 280 s Lean and 225 s editor). A 60% cut allows 248 s (145 s Lean and 100 s editor). These are engineering budgets. Any newly limiting parallel action must fit too. ",
                pr(19838),
              ),
              p(
                "For first red, #19849 first signaled at 998 s. Its first failing action entered the queue at +876 s. If the remaining 122 s are fixed, the action must enter by +577 s for a 30% cut or +277 s for 60%. Narrowing the diagnostic executable can remove unrelated prerequisites. The 60% target may also require faster shared Lean compilation, and the observed interval between action exit and first GitHub status was 59 s. The watcher polls at two seconds by default. The available clocks do not isolate BuildBuddy indexing from status publication. ",
                pr(19849),
                " · ",
                source(
                  "devinfra/buildbuddy/ci/live_test_status.py",
                  "Live watcher",
                ),
              ),
              p(
                "A blind sharding rollout lost its first comparison. On the same source revision the unmodified if_test passed in 83.2 s. Three independent actions containing every original case once passed in 98.0, 154.8 and 94.6 s. All four processes started within two seconds, and the three candidates consumed 264 CPU-s combined versus 114 CPU-s for control. Different workers and one run limit attribution. Keep this arrangement out of production. ",
                inv("6fed6de6-e657-4540-9a3c-bd8102f17a64", "Four-arm trial"),
              ),
              html`<${Title} order=${3}
                >Protect the pre-commit gate during cache outages<//
              >`,
              p(
                "The previous matched replay cut green from 374 to 152 s during a failed compiler download. Both Rustfmt and scanner changes are still open. Apply their real file matchers and retain the tools on matching changes. Their ceiling is small on today’s Bazel-last heads. The direct installer and exit-3 publication fix have landed. The installer currently takes 1 s at the median. We have no matched production estimate for runner time freed by publication suppression. ",
                pr(19640),
                " · ",
                pr(19653),
                " · ",
                pr(19578),
                " · ",
                pr(19642),
              ),
            )}
            ${section(
              "evidence",
              "Source and measurements",
              p(
                "Source ",
                link(
                  repo + "/tree/" + e.source_devel_commit,
                  e.source_devel_commit,
                ),
                ". Success uses the earliest observed completion of all required contexts in the original workflow runs and their reruns. Live ordinary failures must match the run, attempt and invocation. Job clocks have one-second resolution. Provider timestamps do not measure first log accessibility, inbox acceptance or agent read time. The notification service supports commit status, check and workflow events, but no matched subscriber receipts were collected. ",
                pr(19648),
                " (withdrawn fork lookup) · ",
                source(
                  "agentplane/notification_service/internal/sources/github/publication/fanout/github_matching_integration_test.go",
                  "Subscriber matching",
                ),
                " · ",
                link(repo + "/rules?ref=refs%2Fheads%2Fdevel", "Current rules"),
              ),
              disclosure(
                "Exact heads and gate clocks",
                table(
                  [
                    "PR head",
                    "Class",
                    "Outcome",
                    "Green / first red (s)",
                    "First-attempt jobs",
                  ],
                  now.map((r) => [
                    link(
                      repo + "/pull/" + r.pr,
                      "#" + r.pr + " " + r.sha.slice(0, 8),
                    ),
                    names[r.class],
                    r.outcome,
                    fmt(r.green) + " / " + fmt(r.red),
                    html`<${Group} gap="xs"
                      >${Object.keys(r.gates).map((k) => jf(r, k))}<//
                    >`,
                  ]),
                  660,
                ),
              ),
              html`<${Group}
                >${link("./evidence.json", "Head-level evidence")}
                ${link("./manifest.json", "Manifest")} ${previous}<//
              >`,
            )}<//
          ><//
        >`;
      }
      mount(Report);
    </script>
  </body>
</html>
