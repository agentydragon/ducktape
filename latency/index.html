<section id="kvm-runner-dispatch">
 <${Title} order=${2}>Where the two cold VM actions landed<//>
 <${Text} my="sm">On 22 November, two required KubeVirt tests started on worker 5 with an empty runner pool. The executor logs show different opportunities for reuse. Our pool can retain warm workers longer. The two timelines show when that could help.<//>
 <${Title} order=${3}>#18741 · A matching runner was idle<//>

 <${Text} my="sm">At 00:40:56 BuildBuddy queued Firecracker and KubeVirt 16 ms apart. Worker 5 took KubeVirt and spent 306s on fixture setup. At 00:41:01 worker 0 took Firecracker. Its lookup still listed the paused KubeVirt runner. The KubeVirt action occupied 592s of the 622s Bazel critical path and finished 4m10s after the next test.<//>

 <${Title} order=${3} mt="md">#18844 · The known warm runner was busy<//>

 <${Text} size="sm">${pr(18844)} · ${build(dispatchB.invocation, "Cold VM action")} · ${build(dispatchB.previous_invocation, "Concurrent warm VM action")} · ${link(dispatchB.metrics, "Pool metrics at dispatch")}<//>
 <${Title} order=${3} mt="md">What longer worker retention would cost<//>
 <${Text} my="sm">Between 00:00 and 04:00 UTC, 6 of 18 KubeVirt runner lookups found a matching paused runner on the assigned worker. The other 12 missed. These counts include repeat attempts. Worker 4 returned a matching runner at 00:17:48 and shut down at 00:33:15 as the pool shrank from six to five. Cold lookups followed four and eight minutes later, the second on #18741. Retaining worker 4 would have preserved another placement option.<//>
 <${Text} my="sm">Holding each observed pool size for 15 extra minutes after demand fell would have added 173 requested worker-minutes over these four hours, a 12% increase from 1,463. This replay prices capacity. Which worker stays, which action it gets and how quickly the PR finishes all require a live comparison.<//>
 <${Text} my="sm"><strong>Next decision.</strong> Compare the current 15-minute scale-down window with 30 minutes in alternating, time-limited trial windows. Keep the 5s runner preference and both required suites. Compare critical-path VM runs at similar arrival rates and fixture fingerprints. Record local matches, enqueue-to-completion time, final required-check time and extra worker-minutes. Revert to 15 minutes if the longer window buys no repeatable feedback-time improvement.<//>
 <${Text} size="sm">${link(evidence.kvm_runner_dispatch.retention_sample.metrics, "Four-hour pool history")} · ${file("cluster/cdk8s/buildbuddy_kvm_worker.py", "Worker scale-down policy")}<//>
</section>
<section id="kvm-scale-up-signal">
 <${Title} order=${2}>The KVM scale-up signal can rise while a worker has room<//>
 <${Text} my="sm">The live two-to-eight-worker pool allows one task per worker. Its autoscaler adds busy workers to the sum of reservations in local executor queues. An action can have reservations on several executors, even after it starts. Replay found ${kvmScaleUp.raw_increase_samples} samples where every desired worker reported, the pool was below eight and the raw target exceeded the desired size. ${kvmScaleUp.raw_increase_samples_with_cpu_idle_worker} had a CPU-idle worker. In ${kvmScaleUp.raw_increase_samples_with_full_size_headroom} of those samples, at least one healthy nondeleting worker showed 4 unassigned CPUs, 7 GiB unassigned estimated RAM, at least 50 decimal GB of free work disk and no observed active task stage.<//>
 <${Text} my="sm">At 00:41:30 UTC on 22 November, two of five workers had assigned CPU and the local queues reported four reservations, for a raw target of six. Three workers met the full-size headroom check. Both required actions had reached workers by 00:41:02. ${link("#kvm-runner-dispatch", "Dispatch trace")}. Other arrivals are unknown. This replay counts evaluation samples. Actual scale-ups, distinct waiting executions and excess VM-hours are unmeasured.<//>
 <${Text} my="sm">An earlier isolated reproduction recorded three extra reservations for two running actions. A separate action really waited 85.7s while the assigned-and-queued CPU gauge equaled assigned CPU. The hosted metrics inventory had no distinct pending count for this pool. Six hours of executor logs contained 106 runner lookups and zero queue-add debug records. The available logs help trace dispatch. Queue deduplication needs fresh waiting execution and attempt IDs and resource requirements. ${link(kvmScaleUp.earlier_isolated_reproduction.issue, "Reproduction and telemetry gap")}<//>
 <${Text} my="sm">Among ${kvmScaleUp.full_size_shadow_replay.samples_with_reservations} samples with reservations and complete worker telemetry below the limit, both the current signal and a probe for zero full-size headroom called for growth in ${kvmScaleUp.full_size_shadow_replay.both_signals_call_for_growth}. The current signal alone called for growth in ${kvmScaleUp.full_size_shadow_replay.raw_target_only} and the probe alone in ${kvmScaleUp.full_size_shadow_replay.shadow_probe_only}. All six probe-only points fell in one 2m30s interval. The idle worker showed 31.3 GB free at 08:06 UTC on 21 November. Its advertised disk capacity was 70.1 GB. This 30-second replay used a 50 decimal GB filesystem threshold as a proxy for KubeVirt placement.<//>
 <${Text} my="sm"><strong>Evaluate the shadow target.</strong> The recording rule proposes one additional VM when queued work remains after eligible ready and booting capacity. It counts a booting VM once and holds on missing telemetry. Compare distinct enqueue-to-start times, idle warm VM-hours, false adds and burst regressions before enabling scaling. ${pr(18894)}. ${pr(kvmScaleUp.two_task_draft_pr)} separately tests two slots per worker for actions that fit together.<//>
 <${Text} size="sm" c="dimmed">21 November 04:47 to 22 November 04:47 UTC · 30s evaluation, about 60s executor scrapes · ${kvmScaleUp.usable_samples.toLocaleString("en-US")} of ${kvmScaleUp.possible_samples.toLocaleString("en-US")} samples usable · ${link(kvmScaleUp.autoscaler_source, "Inspected scale-up policy")} · ${link(kvmScaleUp.metrics_dashboard, "Pool metrics")} · ${link("./evidence.json", "Replay method and examples")}<//>
<section id="kvm-disk-sizing">
 <${Title} order=${3} mt="lg">KubeVirt passed below its 50 GiB disk request<//>
 <${Text} my="sm">Eighteen of 30 KubeVirt passes started below 50 GiB free. The lowest-space pass started at 26.801 GiB and had a sampled minimum of 26.437 GiB. It reused its runner. First assignments dropped a median 11.215 GiB across 12 passes and started with at least 45.424 GiB free. Later assignments dropped a median 1.418 GiB across 18 passes. For Firecracker the corresponding medians were 15.776 GiB across 13 first assignments and 1.358 GiB across 20 later assignments. None started below its 20 GiB request.<//>

 <${Text} my="sm"><strong>KubeVirt now requests 30 GiB on devel.</strong> ${pr(18902)} merged at 05:31 UTC on 22 November. Firecracker still requests 20 GiB. Track cold and warm fits and disk-pressure failures on the current 80 GiB PVC. Across all 5,520 guest disk scrapes, 278 showed less than 30 GiB free and the minimum was 20.47 GiB. Keep the PVC size and test overlapping actions separately.<//>
 <${Text} size="sm" c="dimmed">21 November 05:00 to 22 November 05:00 UTC · 48 of 72 invocations sampled across the day. Joined exact execution IDs to guest launcher pods and used physical disk scrapes about one minute apart. Of 76 executions, 63 passed with complete telemetry, four had nonzero exit codes with telemetry, five were unsuccessful or incomplete, and four lacked endpoint scrapes. Net change can miss brief peaks. The assignment number comes from the execution response and describes the runner’s reuse history. ${build("0b5493f6-ac65-5e3b-84cd-8ec6046a08c9", "Lowest-space KubeVirt pass")} · ${link("./evidence.json", "Exact executions, queries and method")}<//>

  <${Text} my="sm">KubeVirt keeps more image data than Firecracker. Firecracker adds live guest disks and checkpoint copies while the scenario runs. Both actions run inside Docker and use a sparse 32 GiB file for the inner K3s ext4 filesystem. The checkpoints belong to the Firecracker guest inside the action. The BuildBuddy worker pays for that file's allocated blocks and shares its Docker image layers and file cache across actions. ${link(kvmFootprint.sources.worker_paths, "Worker directory layout")} · ${link(kvmFootprint.sources.backing_disk, "Sparse ext4 image")}<//>

  <${Text} size="sm" c="dimmed">Four higher-drop passes selected from the 21–22 November sizing cohort. Image bytes are within K3s used bytes. The final fixture snapshot follows workload cleanup. The two first assignments came from the same CI invocation on separate workers. Both reused actions also reattached their warm K3s baselines, with image layers already present before import. Their outer disk drop measures a different filesystem and observation window.<//>
  <${Text} my="sm">Across all 63 passes, median downloaded input bytes were 2.72 GiB on first KubeVirt assignments and 0.94 GiB on first Firecracker assignments. On later assignments those medians were 0.26 and 0.36 GiB. BuildBuddy separately reports median uploads below 0.05 GiB in each group. In the largest sampled input transfers, KubeVirt staged a 535 MiB guest root layer while Firecracker staged a 713 MiB boot layer. Transfers count bytes staged through REAPI. A worker sample counted ${diskGiB(kvmFootprint.host_summary.shared_workspace_bytes)} of the workspace by inode in the file cache. Its workspace occupied ${diskGiB(kvmFootprint.host_summary.unique_workspace_bytes)} beyond shared cache files. ${link("./evidence.json", "Transfer and inode accounting")}<//>

        <${Text} size="sm" c="dimmed" mt="sm">One snapshot per action during its suite, on the same worker with one active action slot. The later Firecracker point includes the KubeVirt runner still paused in Docker. Filesystem metadata and concurrently changing files account for small differences between the total and the sum of directory measurements.<//>

  <${Text} my="sm">For KubeVirt, start with the largest uncompressed OCI inputs if the aim is to lower persistent footprint. gzip can reduce stored OCI content and input-cache bytes. Unpacked layers will still occupy space. Measure import time, allocated blocks and warm reuse on the same worker. Shrinking the logical 32 GiB K3s disk or the sparse guest workspace capacity has a much smaller measured target. ${link(kvmFootprint.sources.image_evidence, "Exact KubeVirt OCI inputs")}<//>

<section id="shard-replay">

 <${Text} my="sm">The action-presentation suite renders real approval and result surfaces at desktop and mobile widths. Pytest distributes cases by collection position. On #18283, all 16 shards ran fresh. They consumed 56.9 process-minutes and 74.2 CPU-minutes. Shard 11 took 300s of a 360s Bazel critical path. On #18753, shard 4 took 197s of a 328s critical path.<//>

 <${Text} my="sm">Keep the current shard assignment. In the real same-source trial, both arms passed all 529 cases. The weighted plan moved 491 cases and shortened the slowest fresh process by just 0.57s (171.77s to 171.20s). Total process time rose from 2,287s to 2,289s. Both arms waited under 0.07s for a worker on every shard. With this control’s per-case costs held fixed, the new placement predicted only 8.9s less case time. Actual case durations varied between arms. This trial does not justify maintaining a weight table.<//>

<section id="runner-bootstrap">
 <${Title} order=${2}>Three checks slowed during the same cache incident<//>
 <${Text} my="sm">On #18430, Pre-commit setup took 609s and the hooks took 14s. The runner reported an HTTP/2 stream error fetching rustc from the public Attic cache. Rustfmt skipped all four changed files. Test & Build and imports also spent 391s and 392s on Nix setup. Their logs end long silent intervals within the same second. Only the Pre-commit log identifies the failed transfer.<//>
 <${Text} my="sm">Across 175 green heads, setup medians were 15s for Test & Build, 32s for imports and 36s for Pre-commit. Six heads had a setup interval of at least 120s. Shortening Pre-commit alone on #18430 would have moved the finish to Test & Build, saving at most 139s. The other gates must also improve to recover the rest.<//>
 <${Text} my="sm">For this tail, split rustfmt from the base pre-commit tool closure and install it when the tested file list selects the Rust hook. Preserve the full toolset for unclassified and all-file runs and publish both closures to the public cache. Check that a Rust edit still invokes the pinned formatter, a non-Rust edit executes all applicable hooks, and the smaller closure excludes rustc. In the local closure trial, removing only rustfmt removed rustc and reduced the closure from 2,741 MB to 2,303 MB. The lean profile passed all applicable hooks on the four files at the exact #18430 head. The full profile passed the rustfmt hook on a tracked Rust file. Closure size is unpacked store size. Cold GitHub transfer time remains unmeasured.<//>

</section>

 <${Text} my="sm">On infrastructure PR #18621, mypy on the manifest generator occupied 57.0s of the 58.0s inner critical path. A faster Platform Sessions test would leave that chain intact. The earlier single-worker SSD and cache experiments answer a different question about KVM fixtures.<//>

              <${Text} size="sm" mt="sm">The ceiling holds the remaining action and required-check clocks fixed. It averages 20.8s across the 12 sampled first-pass heads with physical test records. Cluster Firecracker would take over on #18244 and Gateway budget on #18255. Firecracker already finished last on failed attempt #18256. On #18271, Pod was critical with a 0.097s queue and a 391.3s process.<//>

            <section id="kvm-cas">
              <${Title} order=${2}>KVM kept direct Cloud after the cache trial<///>
              <${Text} my="sm">Fresh Cloud-direct workers fetched the identical 7,467-file Firecracker input tree in 8.63–8.71s. The warm shared proxy took 9.29s on its own host, with a different worker from the one that filled it. The cold fill crossed hosts and took 19.05s. All four runs used empty executor file caches. ${link(cacheTrial.archived_report, "Experiment report")} · ${pr(cacheTrial.experiment_pr)}<//>

              <${Text} my="sm">The warm proxy served 1,388 ByteStream hits and 816,514,268 compressed bytes. It made zero upstream ByteStream reads or BatchReadBlobs calls during that sample. GetTree, SplitBlob and authentication still reached Cloud. Both full two-case runs passed with warm executor file caches. ${build(cacheTrial.full_tests[0].invocation, "Full direct run")} · ${build(cacheTrial.full_tests[1].invocation, "Full shared run")}<//>
              <${Text} my="sm">During a proxy-only egress fault, a standalone client verified a cached blob. The warm guest still hit metadata and authentication errors, and both guest probes were canceled at their fault deadlines. The restarted proxy failed its readiness check after egress was restored. Direct rollback fetched the same inputs in 8.73s. The trial pool, proxy, policies and disks were removed. ${build(cacheTrial.egress_fault.warm_guest_invocation, "Warm fault")} · ${build(cacheTrial.egress_fault.cold_guest_invocation, "Cold fault")}<//>
              <${Text} c="dimmed" size="sm" mb="sm">One fresh action per route and cache state. These measurements cover input staging in this pool. Fleet tail latency remains unmeasured. Required KVM CI stays on Cloud direct. Per-node caches are deferred.<//>
              <${Accordion} variant="contained"><${Accordion.Item} value="earlier-cas"><${Accordion.Control}>Earlier CAS stalls and loopback replay<//><${Accordion.Panel}>
              <${Text} my="sm">On #18106, VM and Firecracker each spent about 9m42s fetching inputs on different workers. Their download bitmaps resolve to the same four unique blobs. The 62.5 MiB Action Service layer accounted for 99.989% of the bytes. Both actions passed. A Gateway crash test caused the rerun. ${pr(18106)} · ${build(cas.pr_invocation, "First Bazel attempt")}<//>
              ${table(
                [
                  "Execution",
                  "Input fetch",
                  "Unique files / bytes",
                  "Read timeouts followed by successful retry",
                ],
                cas.executions.map((r) => [
                  r.label,
                  seconds(r.input_s),
                  r.bytes == null
                    ? "Unknown"
                    : `${r.files} / ${r.bytes.toLocaleString("en-US")}`,
                  r.recovered_read_stalls,
                ]),
                655,
              )}
              <${Text} size="sm" mt="sm">The execution receipts identify the whole set of downloads. The retry logs lack blob digests and the two terminal cold attempts lack bitmaps. The recovered cold attempt fetched just 55 KiB in 3m33s, so byte volume alone cannot explain the long waits. Worker-side gRPC counters also recorded Unavailable and Canceled responses during both incident windows. The four largest five-minute Unavailable bursts in the 24-hour sample were between 08:25 and 09:10 UTC. The counters establish the timing of a shared path problem. Responsibility and per-blob timings remain unknown. ${build(cas.cold_invocation, "Cold execution and attempts")}<//>
              <${Title} order=${3} mt="md">Loopback replay of the four PR blobs<///>
              ${table(
                [
                  "Route",
                  "62.5 MiB layer read",
                  "Verified client reads",
                  "Proxy upstream ByteStream reads",
                ],
                cas.replay.map((r) => [
                  r.label,
                  r.large_seconds.map(seconds).join(" / "),
                  r.verified_reads,
                  r.upstream_reads ?? "Direct",
                ]),
                625,
              )}
              <${Text} size="sm" mt="sm">BuildBuddy Enterprise Cache Proxy v2.323.0 filled an empty Pebble store, then served all eight repeat reads locally with zero additional upstream ByteStream calls. The cold fill made 53 upstream ByteStream RPCs for four client requests, including chunk reads. After a proxy restart with the same disk, four more reads hit locally. The restarted process contacted hosted authentication. Both direct controls were healthy. The proxy and clients ran on the same developer host, so these timings establish cache behavior and give no cluster or PR latency estimate.<//>
                <${Text} mt="sm" size="sm">${link(cas.proxy_docs, "BuildBuddy Cache Proxy")} · ${link(cas.executor_config, "Worker configuration")}<//>
              <//><//><//>
            </section>
            <section id="firecracker-overlap">
              <${Title} order=${2}>Firecracker overlap delayed live-guest scheduling<///>
              <${Text} my="sm">In four serial-versus-simultaneous pairs, TestRunner savings ranged from 47 seconds faster to 12 seconds slower. The live-guest launcher reached PodScheduled 3–6 seconds after the readiness wait began in serial runs and 37–69 seconds with both scenarios starting together. All eight runs passed both scenarios. Required CI stays serial.<//>
              ${table(
                [
                  "Host and fixture",
                  "Serial",
                  "Simultaneous",
                  "Process change",
                  "Live PodScheduled",
                ],
                firecrackerFollowup.matched_pairs.map((pair) => {
                  const saved = pair.process_seconds_saved;
                  const { serial, concurrent } = pair.rows;
                  return [
                    `${pair.host.replace("ovh-ns", "")} · ${pair.fixture}`,
                    build(serial.invocation, seconds(serial.process_s)),
                    build(concurrent.invocation, seconds(concurrent.process_s)),
                    `${seconds(Math.abs(saved))} ${saved >= 0 ? "faster" : "slower"}`,
                    `${seconds(serial.live_pod_schedule_s)} → ${seconds(concurrent.live_pod_schedule_s)}`,
                  ];
                }),
                535,
              )}
              <${Text} size="sm" mt="sm">Each pair used the same worker and input tree. The interrupted repeat used another guest on the same physical host. The process clock includes fixture setup and teardown. PodScheduled uses the nested Kubernetes condition timestamp and the test’s readiness-span start.<//>
              <${Title} order=${3} mt="md">Staggered start on one retained fixture<///>
              <${Text} my="sm">${staggered.finding}<//>
              ${table(
                [
                  "Start mode",
                  "TestRunner",
                  "Live PodScheduled",
                  "Both-case envelope",
                ],
                staggered.arms.map((arm) => [
                  arm.replay ? "Staggered repeat" : modeNames[arm.mode],
                  build(arm.invocation, seconds(arm.process_s)),
                  seconds(arm.live_pod_schedule_s),
                  seconds(arm.case_envelope_s),
                ]),
                425,
              )}
              <${Text} mt="sm">${staggered.scheduler_evidence}<//>
              <${Text} size="sm" mt="sm">The four timed executions reused one baseline and passed both scenarios. Each staggered gate opened after the observer saw the live pod scheduled. The first staggered submission disconnected after cancellation and later finished on the worker. Its verdicts and timings came from native BuildBuddy output, and the repeat followed it on the retained runner. The experiment used a private recycling key and verified removal of the retained container and loop backing. ${build(staggered.dispose_invocation, "Disposal")} · ${link("./firecracker-staggered-spike.patch", "Probe patch")}<//>
              <${Accordion} variant="contained" mt="md"><${Accordion.Item} value="first-overlap"><${Accordion.Control}>Earlier warm overlap experiment<//><${Accordion.Panel}>
              <${Text} my="sm">${overlap.finding}<//>
              ${table(
                [
                  "Arm",
                  "TestRunner process",
                  "Both-case envelope",
                  "Case overlap",
                  "Live guest",
                  "Proxy-trust refusal",
                ],
                overlap.rows.map((r) => [
                  build(r.invocation, r.label),
                  seconds(r.native_process_s),
                  seconds(r.case_envelope_s),
                  seconds(r.case_overlap_s),
                  seconds(r.live_case_s),
                  seconds(r.refusal_case_s),
                ]),
                810,
              )}
              <${Text} size="sm" mt="sm">${overlap.method}<//>
              <${Text} size="sm" mt="sm">${overlap.limit}<//>
              <${Text} my="sm">${link("./firecracker-overlap-spike.patch", "Experiment patch")} · ${pr(18246)}<//>
              <//><//><//>
            </section>
            <section id="reruns">
              <${Title} order=${2}>Failure recovery drove the backend tail<//>
              <${Text} my="sm">The informational BuildBuddy status preceded final red by 4 seconds to 10m32s. For #18243, an early test failure was followed by 7m42s of ongoing CI before final red, then 11m03s until GitHub created the next job. Assignment on that retry took 2s. GitHub identifies the triggering account type as User on these five retries. The request source and reason for the interval are unobserved.<//>
              ${table(["PR", "First failure", "Live failure → job red", "Red → retry job created", "Time to green", "Evidence"], failureRows, 860)}
              <${Text} size="sm" mt="sm">PR subscriptions receive completed check-run facts and commit statuses by default. The linked status timestamps measure GitHub publication. The completed job logs and selected BuildBuddy artifacts were readable during review. First queryability, webhook delivery, inbox acknowledgement and harness receipt need separate clocks. ${file("agentplane/notification_service/docs/agents/github.md", "Subscription behavior")}<//>
            </section>
            <section id="cases">
              <${Title} order=${2}>What finished last on green heads<///>
              <${Text} my="sm">All times in the middle columns are UTC. The GitHub Test + Build + lint step includes outer Remote Bazel allocation and setup, inner Bazel, any subsequent build and finalization. The Pod follow-up includes two exact outer allocation clocks.<///>
              ${table(
                [
                  "PR",
                  "CI workflow",
                  "Job starts",
                  "Remote step",
                  "Inner test",
                  "Bazel critical-path test",
                  "Required green",
                ],
                [18234, 18244, 18246, 18255, 18265].map((n) => {
                  const c = byPr.get(n),
                    a = c.attempts[0],
                    j = c.jobs[0];
                  return [
                    pr(n),
                    utc(c.start),
                    utc(j.started_at),
                    j.remote.map(utc).join("–"),
                    build(a.inner, time(a.duration_s)),
                    short(a.critical_path.test),
                    job(j, time(c.feedback_s)),
                  ];
                }),
                785,
              )}
              <${SimpleGrid} cols=${{ base: 1, md: 2 }} mt="md">
                <${Paper} withBorder p="md">
                  <${Title} order=${3}>Managed Pod admission<///>
                  <${Text} mt="xs">On #18244, the 299.7s Pod process included 54.7s of fixture setup, 179.8s from the first to the last case and 32.5s of stack cleanup. ${link("#managed-pod", "Queue comparison")}<//>
                <//>
                <${Paper} withBorder p="md">
                  <${Title} order=${3}>Firecracker scenario and cleanup<///>
                  <${Text} mt="xs">#18246 ran for 412.3s with a confirmed warm fixture. Setup took 50.6s. The live-guest continuity case occupied 212.9s, including 56.6s sandbox cleanup. The proxy-trust negative case followed for 74.9s, followed by 50.2s stack cleanup. The live-guest case exercises the one-minute idle policy, suspend/checkpoint, credential rotation and same-process resume. ${file("agentplane/system_tests/scenarios/firecracker.py", "Scenario source")}<//>
                <//>
                <${Paper} withBorder p="md">
                  <${Title} order=${3}>Fast and slow KVM VM paths<///>
                  <${Text} mt="xs">#18234 had 42.2s warm setup inside a 182s VM action. On #18265, the first action failed before scenario execution after a baseline fingerprint mismatch. The recycled runner entered in private cgroup 0::/init and the rebuild expected 0::/. The retry passed both cases after 193.4s cold setup. Shortening VM on that head could save up to 25.2s before Gateway budget became last. ${file("agentplane/system_tests/k3s/baseline.py", "Namespace check")}${" · "}${link("../reliability/#vm-cutover", "Corroborating devel report")}<//>
                <//>
                <${Paper} withBorder p="md">
                  <${Title} order=${3}>KVM input fetch delayed a failed attempt<///>
                  <${Text} mt="xs">#18106 assigned VM and Firecracker actions after 5.2s and 3.6s. They then spent 581.1s and 581.9s in input fetch, on two distinct workers, with 65.6 MB across four recorded files on each action. Both tests passed. The long fetch deferred final job red after the separate Gateway crash case failed. Native metadata leaves the responsible CAS object and network path unknown.<//>
                <//>
              <//>
            </section>
            <section id="capacity">
              <${Title} order=${2}>Runner and executor capacity<///>
              <${Text} my="sm">GitHub recorded 27.35 occupied runner-hours and a peak of 40 in the 19:42:40–21:12:40 UTC window, a lower bound based on completed assigned jobs. Among 69 assigned, completed PR Test & Build jobs, creation to start was 2s median, 3s p90 and 65s maximum. No measured PR Test & Build job was awaiting assignment at the cutoff. The longest waits across all job types occurred in dependent release and image steps. Default CodeQL setup is off.<///>
              <${Text} my="sm">Decoded action properties on #18244 put VM and Firecracker on self-hosted Docker in <code>kvm-vm</code>, one concurrent task per worker. Pod used the managed Firecracker action lane. The managed Pod follow-up measures the two corresponding outer runner admissions. Provider eligibility and capacity remain unobserved.<///>
              ${table(
                [
                  "Physical TestRunner population",
                  "Process n",
                  "Process median / p90",
                  "Valid queue n",
                  "Queue median / p90",
                  "Unknown queue",
                ],
                [
                  ["KVM VM", "vm"],
                  ["KVM Firecracker", "firecracker"],
                  [
                    "Managed Pod, dispatcher, Gateway budget, central",
                    "other_four_long",
                  ],
                ].map(([label, k]) => {
                  const s = evidence.native_cost[k];
                  return [
                    label,
                    s.process.n,
                    `${time(s.process.p50)} / ${time(s.process.p90)}`,
                    s.queue.n,
                    `${seconds(s.queue.p50)} / ${seconds(s.queue.p90)}`,
                    s.queue_unknown,
                  ];
                }),
                760,
              )}
              <${Text} size="sm" mt="sm">The four managed labels reached a 195.6s maximum native queue. Twenty KVM queue clocks were inverted. Keep those unknown. At one-minute resolution the KVM telemetry recorded up to eight registered workers, with task counts available jointly on 684 of 816 points. No joint sample reached eight registered and eight tasks. Short queue bursts and misses still remain possible.<///>
              <${Box} role="img" data-chart="kvm-pool" mt="md" aria-label="KVM desired workers, registered workers and executor task gauge">
                <${LineChart} h=${215} data=${phases} dataKey="utc" domain=${[0, 8]} withLegend connectNulls=${false}
                  strokeWidth=${2} withDots=${false} series=${[
                    {
                      name: "registered",
                      label: "Registered",
                      color: "blue.6",
                    },
                    { name: "tasks", label: "Tasks", color: "teal.6" },
                    { name: "desired", label: "Desired", color: "gray.6" },
                  ]} />
              <//>
              <${Text} size="sm" mt="sm">Chart samples every ten minutes from the one-minute census. The task gauge includes input preparation and upload. ${link("https://grafana.allegedly.works/d/buildbuddy-executor-pool", "Executor pool dashboard")}<//>
              <${Text} mt="sm">Across the selected backend and fixture invocations, 1,072 unique originating TestRunner actions used 27.68 process-hours and 46.99 observed CPU-hours. CPU was missing for 37 actions, including all sampled KVM VM and Firecracker actions. Thread-browser shards consumed 3.44 process-hours across 112 actions. Runner hours and remote action costs use different clocks.<///>
            </section>
            <section id="actions">
              <${Title} order=${2}>20 November investigation priorities<///>
              ${table(
                ["Priority", "Change or test", "Expected effect and boundary"],
                [
                  [
                    "1 · Managed Pod queue",
                    html`Track recurrence in required CI and obtain provider
                    admission reasons and eligible capacity for an overlapping
                    burst.
                    ${link("#managed-pod", "Measured cases and follow-up")}`,
                    "Two of 12 successful first-attempt backend heads with physical test records show minute-scale feedback headroom. Snapshot restore errors require their own recovery evidence.",
                  ],
                  [
                    "2 · Firecracker scheduling",
                    html`${staggered.action}
                    ${link("#firecracker-overlap", "Matched KVM comparison")}`,
                    "Three of 12 earlier first-pass backend heads had Firecracker as latest physical finisher. Other gates and action stages constrain any PR-level saving.",
                  ],
                ],
                1000,
              )}
              <${Text} mt="sm">A 30% reduction from the 9m31s one-attempt median requires 2m51s. Reaching a four-minute mean requires a 4m52s reduction from the observed 8m52s mean. None of the isolated observed path reductions covers that distance. A larger design would narrow App-triggered guest, Firecracker and managed Pod work together. Keep an end-to-end App→guest witness and the separate guest lifecycle, PKI and recovery assertions. Compare on the same selected source changes with exact gates and action inputs before counting a gain.<///>
              <${Text} mt="sm">The timeout lookup fix and recycled Docker rebuild fix merged. Track subscriber delivery separately from test-recovery time. The two-worker minimum and fleet warm-hit rate still need a matched comparison. ${pr(18292)} · ${pr(18295)}<//>
              <${Text} mt="sm">The 20 November cold job reached its 30-minute GitHub timeout. BuildBuddy finished successfully about eight seconds after GitHub canceled it. Two executor attempts failed waiting for CAS Read responses before the test process started. Input fetch consumed 2m53s, 8m50s and 3m33s across two failed starts and the passing attempt. The passing process took 6m50s. The retained receipts and cache replay are linked above. ${link(evidence.cold_workflow[1].html_url, "Passed run")} · ${link(evidence.cold_workflow[0].html_url, "Timed-out GitHub job")}${" · "}${build(evidence.cold_execution.invocation, "Recovered BuildBuddy result")}<//>
            </section>
            <${Accordion} variant="separated">
              <${Accordion.Item} value="method">
                <${Accordion.Control}>19–20 November population and clocks<//>
                <${Accordion.Panel}>
                  <${Text} mb="sm">151 exact latest heads sampled from 264 matching heads across 19 November 20:00 through 20 November 21:12 UTC. GitHub returned 888 PR CI runs for the full window. The frame includes earlier heads and cross-repository runs. Gate estimates use only the joined latest same-repository devel heads with complete changed-file classes, plus one large-diff head in an unclassified row. Exact check attempts and cutoff outcomes appear in the evidence. These are balanced path samples and the earlier 10–16 November report used a different sampling frame.<///>
                  <${Text} mb="sm">The devel ruleset requires Test & Build, Pre-commit and Build artifacts + imports, with non-strict status checks and zero ordinary approvals. It requires a PR, linear history and extra approval for unattributed changes. Auto-merge is enabled in repository settings. Historical draft, review and conflict transitions were unavailable. Of the 60 green post-shadow heads all were already merged at collection. The sample does not assign auto-merge-ready timestamps.<///>
                  <${Text} mb="sm">BuildBuddy test invocations use deterministic run-and-attempt IDs. For linked traces, the synthetic test commit's parents identify the PR head and tested base. All listed post-shadow timelines have a tested base containing the route change. Native test process clocks, fixture spans and GitHub step intervals overlap. The 90-minute runner census excludes unfinished jobs. The independent older-active scan raced pagination, returning 14 records against a reported 26.<///>
                  <${Text} size="sm">${link(`${gh}/rules/15894562`, "Ruleset")} · ${file(".github/workflows/bazel-ci.yml", "Bazel CI workflow")} · ${file("devinfra/ci/skills/ci_latency/SKILL.md", "Collection method")} · ${link("./evidence.json", "Exact heads, cases and supporting data")}<///>
                <//>
              <//>
              <${Accordion.Item} value="history">
                <${Accordion.Control}>Prior measurements and experiments<//>
                <${Accordion.Panel}>
                  <${Text} mb="sm">The 10–16 November baseline recorded 51 green of 53 backend heads, with 10m23s median and 19m05s p90. The 18 November Firecracker acceptance measured 40.6s warm setup against 106.3s on the cold seed. Selected current traces show reuse in operation. Fleet reuse, the two-worker warm floor's latency benefit, and cost attribution remain open.<///>
                  <${Text} mb="sm">Prior two-stack sharding duplicated setup and increased the slowest action and CPU cost. The managed resource trial hit an admission limit. The paired admission archives, previous canary, rejected trials, timeline graphs and the original methods remain in the pinned snapshot.<///>
                  <${Text} size="sm">${link(`${prior}/index.html`, "Prior latency dashboard")} · ${link(`${prior}/evidence.json`, "Prior evidence")} · ${link("../agentplane-test-architecture/", "Architecture record")}<///>
