<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CI latency</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript>This report uses JavaScript for charts and disclosures.</noscript>
    <script type="module">
      import { useState } from "react";
      import {
        Accordion,
        Anchor,
        Box,
        Code,
        Container,
        Group,
        SegmentedControl,
        Stack,
        Table,
        Text,
        TextInput,
        Title,
      } from "@mantine/core";
      import { BarChart } from "@mantine/charts";
      import { html, mount } from "../report.js";
      const evidenceSha =
        "3fb83c15b7ad399eab5e4b8f93f4f2e6e346848d3e15073d598d0cbdd026449e";
      const response = await fetch(`./evidence.json?v=${evidenceSha}`);
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const bytes = await response.arrayBuffer();
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      const receivedSha = Array.from(new Uint8Array(digest), (byte) =>
        byte.toString(16).padStart(2, "0"),
      ).join("");
      if (receivedSha !== evidenceSha)
        throw new Error("Evidence does not match this report");
      const e = JSON.parse(new TextDecoder().decode(bytes));
      const gh = "https://github.com/agentydragon/ducktape";
      const archive =
        gh + "/blob/" + e.previous_report_commit + "/latency/index.html";
      const link = (href, label) => html`<${Anchor} href=${href}>${label}<//>`;
      const pr = (n) => link(`${gh}/pull/${n}`, `#${n}`);
      const source = (path, label) =>
        link(`${gh}/blob/${e.source_devel_commit}/${path}`, label);
      const inv = (id, label) =>
        link(
          "https://app.buildbuddy.io/invocation/" + id,
          label || id.slice(0, 8),
        );
      const table = (headers, rows, width = 560) =>
        html` <${Table.ScrollContainer}
          minWidth=${width}
          type="native"
          maw="100%"
        >
          <${Table} striped verticalSpacing="sm">
            <${Table.Thead}
              ><${Table.Tr}
                >${headers.map((header) => html`<${Table.Th} key=${header}>${header}<//>`)}<//
              ><//
            >
            <${Table.Tbody}
              >${rows.map((row, i) => html`<${Table.Tr} key=${i}>${row.map((value, j) => html`<${Table.Td} key=${j}>${value}<//>`)}<//>`)}<//
            >
          <//>
        <//>`;
      const disclosure = (label, contents) =>
        html` <${Accordion}
          variant="contained"
          mt="sm"
          defaultValue=${location.hash && label.startsWith("Earlier") ? label : null}
          ><${Accordion.Item} value=${label}>
            <${Accordion.Control}>${label}<//
            ><${Accordion.Panel}>${contents}<//>
          <//><//
        >`;
      const minutes = (s) =>
        s == null
          ? "—"
          : `${Math.floor(Math.round(s) / 60)}m ${String(Math.round(s) % 60).padStart(2, "0")}s`;
      const header = (title, lede) =>
        html` <header>
          ${link("../", "Ducktape reports")}
          <${Title} order=${1} my="sm">${title}<//>
          <${Text} size="lg">${lede}<//>
          <${Text} mt="sm" size="sm" c="dimmed"
            >Inspected devel <${Code}>${e.source_devel_commit}<//><//
          >
        </header>`;
      const footer = () =>
        html`<footer>
          <${Group} gap="md">
            ${link("./evidence.json", "Reviewed evidence")}
            ${link("./manifest.json", "Manifest")}
            ${link(archive, "Previous snapshot")} ${link("../", "All reports")}
          <//>
        </footer>`;

      function Report() {
        const f = e.full_days;
        const p = e.partial_day;
        return html`<${Container}
          component="main"
          size="73rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
        >
          <${Stack} gap="xl">
            ${header("CI latency", html`Over 15–21 November UTC, ${f.n} of 168 sampled PR heads reached required green. Median ${minutes(f.median_s)} · p90 ${minutes(f.p90_s)}. On 22 November through 10:00 UTC, ${p.n} of 24 reached green at a median of ${minutes(p.median_s)} and p90 of ${minutes(p.p90_s)}.`)}
            <section id="weekly-trend">
              <${Title} order=${2}>Time to required checks passing<//>
              <${Text} my="sm"
                >The clock starts when GitHub creates the CI workflow and stops
                when its head has three passing required checks. Each day
                contributes 24 sampled same-repository heads. The first seven
                days are complete. The 22 November sample ends at 10:00 UTC.<//
              >
              <${Box}
                role="img"
                data-chart="pr-feedback"
                aria-label="Daily median and p90 minutes between CI workflow creation and required green"
              >
                <${BarChart}
                  h=${240}
                  withLegend
                  dataKey="day"
                  data=${e.daily.map((d) => ({ day: d.day.slice(8) + (d.day.endsWith("-22") ? "*" : ""), Median: +(d.median_s / 60).toFixed(2), P90: +(d.p90_s / 60).toFixed(2) }))}
                  series=${[
                    { name: "Median", color: "blue.7" },
                    { name: "P90", color: "orange.7" },
                  ]}
                  yAxisProps=${{ width: 32 }}
                  yAxisLabel="Minutes"
                />
              <//>
              ${disclosure(
                "Daily counts and durations",
                table(
                  [
                    "UTC day",
                    "Eligible",
                    "Sampled",
                    "Green",
                    "Red",
                    "Cancelled",
                    "Incomplete",
                    "Median",
                    "p90",
                  ],
                  e.daily.map((d) => [
                    d.day + (d.day.endsWith("-22") ? " (partial)" : ""),
                    d.eligible_heads,
                    d.sampled,
                    d.outcomes.green || 0,
                    d.outcomes.red || 0,
                    d.outcomes.cancelled || 0,
                    d.outcomes.incomplete || 0,
                    minutes(d.median_s),
                    minutes(d.p90_s),
                  ]),
                  800,
                ),
              )}
            </section>
            <section id="current-clocks">
              <${Title} order=${2}
                >Bazel finished last on 118 of 126 green heads<//
              >
              <${Text} my="sm"
                >The artifacts and imports check finished last on seven and
                pre-commit on one. An offline replay moves the Bazel completion
                up by 60 seconds and holds the other timestamps fixed. 118 heads
                benefit. Mean savings is 47.1 seconds across all 126 green heads
                and the p90 moves from 9m 36s to 8m 36s. This replay estimates
                the benefit only if Bazel finishes a minute earlier on every
                measured head.<//
              >
              <${Text} size="sm"
                >Exact check names and durations are in the evidence. The clock
                excludes time before workflow creation, approval and merge
                scheduling. GitHub runner assignment, Remote Bazel setup,
                BuildBuddy action queue, action process time and webhook
                delivery use distinct clocks.
                ${link(gh + "/rules?ref=refs%2Fheads%2Fdevel", "Active branch rules")}
                ·
                ${source(".github/workflows/bazel-ci.yml", "Bazel gate and live status")}<//
              >
            </section>
            <section id="actions">
              <${Title} order=${2}>Next measurements<//>
              <${Stack} gap="sm" mt="sm">
                <${Text}
                  ><strong>1. Qualify the synchronized KVM guest image.</strong>
                  #19089 landed and the live worker policy allows UDP/123 to
                  Cloudflare. The isolated guest test reduced measured offset
                  from 609 ms to 1.3 ms. The production pool still uses the
                  previous image pin. Run the new image through fresh boot and
                  both required KVM targets before promotion. Then count
                  comparable queue timestamps and native queue delays before
                  using them to size the pool. ${pr(19089)} ·
                  ${source("cluster/cdk8s/buildbuddy_kvm_worker.py#L117-L119", "Production image pin")}<//
                >
                <${Text}
                  ><strong
                    >2. Measure browser dependency isolation on selected
                    PRs.</strong
                  >
                  The fresh cost sample points to Action and Thread browsers for
                  worker savings. Compare the action selection and last required
                  gate on matched Action-only and Thread-only edits with the
                  split now on devel. Keep desktop and mobile captures and
                  runtime cases in the comparison.
                  ${link("../ci-test-cost/", "Test cost and split evaluation")}
                  · ${pr(18979)}<//
                >
                <${Text}
                  ><strong
                    >3. Resolve failure signatures before changing retry
                    policy.</strong
                  >
                  One sampled frontend timeout recovered on an identical tested
                  SHA. Attribution of time from initial red through to a new run
                  still needs a request clock.
                  ${link("../reliability/#priorities", "Reliability findings")}<//
                >
              <//>
            </section>
            <section id="kvm-pilot-results">
              <${Title} order=${2}
                >Keep serial Firecracker cleanup and cold K3s image import<//
              >
              <${Text} my="sm"
                >The overlap pilot started proxy trust during cleanup of the
                live guest. Its targeted interval grew 24.4 seconds. The seed
                shortened stack setup by 0.81 seconds and added 4.97 seconds
                from worker start to process end, plus 1.15 GB of added inputs.
                Both use passing two-case samples from 22 November. The overlap
                arms had different workers and fixture warmth.
                ${source("devinfra/ci/debug/system_test_feedback/kvm_pilots_2026_11_22.md", "Pilot method and run links")}<//
              >
            </section>
            <section id="method-current">
              <${Title} order=${2}>Population and prior investigations<//>
              <${Text} my="sm"
                >Paginated the same CI workflow’s pull_request event by UTC day,
                kept runs whose recorded head repository matched Ducktape,
                deduplicated daily by head SHA and selected the 24 smallest
                SHA-256 hashes. Each selected Bazel check is joined to its
                workflow run ID. The other gates are matched on exact head SHA.
                Day sampling is balanced across very different daily volumes, so
                the combined result describes the sample. Trusted fork runs have
                a separate admission path.
                ${source(".github/workflows/trusted-fork-pr-ci.yml", "Fork admission")}<//
              >
              ${disclosure(
                "Earlier KVM, cache and sharding measurements",
                html` <${Stack} gap="sm">
                  <${Text} id="vm-shadow"
                    >${link(archive + "#vm-shadow", "Paired KVM and managed TCG results")}<//
                  >
                  <${Text} id="kvm-cas"
                    >${link(archive + "#kvm-cas", "Direct Cloud, shared cache and recovery trial")}<//
                  >
                  <${Text} id="kvm-placement"
                    >${link(archive + "#kvm-placement", "Worker placement and wyrm2 qualification")}<//
                  >
                  <${Text} id="kvm-work-disk"
                    >${link(archive + "#kvm-work-disk", "SSD and HDD work-disk comparison")}<//
                  >
                  <${Text} id="kvm-retained-vm-ssd"
                    >${link(archive + "#kvm-retained-vm-ssd", "Retained VM work-disk and import measurements")}<//
                  >
                  <${Text} id="kvm-scale-up-signal"
                    >${link(archive + "#kvm-scale-up-signal", "KVM scale-up replay")}<//
                  >
                  <${Text} id="kvm-test-memory"
                    >${link(archive + "#kvm-test-memory", "Worker memory and disposable caps")}<//
                  >
                  <${Text} id="kvm-disk-breakdown"
                    >${link(archive + "#kvm-disk-breakdown", "KVM disk footprint breakdown")}<//
                  >
                  <${Text} id="shard-replay"
                    >${link(archive + "#shard-replay", "Browser sharding comparison")}<//
                  >
                  <${Text} id="cases"
                    >${link(archive + "#cases", "Traced backend cases")}<//
                  >
                  <${Text} id="docker-recycling"
                    >${source("agentplane/system_tests/debug/kvm_docker_recycling.md", "Recycled KVM Docker evidence")}<//
                  >
                  <${Text} id="worker-image-comparison"
                    >${source("cluster/k8s/buildbuddy-kvm-worker/README.md", "Worker image qualification")}<//
                  >
                <//>`,
              )}
            </section>

            ${footer()}
          <//>
        <//>`;
      }
      mount(Report);
    </script>
  </body>
</html>
