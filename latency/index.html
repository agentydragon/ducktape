<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CI latency · Agentplane backend PR feedback</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript
      >This report uses JavaScript for Mantine charts and disclosures.</noscript
    >
    <script type="module">
      import {
        Accordion,
        Alert,
        Anchor,
        Badge,
        Box,
        Container,
        Group,
        Paper,
        SimpleGrid,
        Stack,
        Table,
        Text,
        Title,
      } from "@mantine/core";
      import { BarChart, LineChart } from "@mantine/charts";
      import { CiLanes } from "../ci-lanes.js";
      import { html, mount, ManifestStamp } from "../report.js";
      import { ResourceFollowup } from "./resource-followup.js";
      const response = await fetch("./evidence.json");
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const evidence = await response.json();
      const backend = evidence.backend_refresh;
      const data = evidence.latest_refresh;
      const followup = evidence.followup_refresh;
      const recent = evidence.nov13_selected_followup;
      const fmt = (s) =>
        s == null
          ? "Unobserved"
          : `${Math.floor(s / 60)}m ${Math.round(s % 60)
              .toString()
              .padStart(2, "0")}s`;
      const n = (s) => Number(s).toFixed(1);
      const gh = "https://github.com/agentydragon/ducktape";
      const prior = `${gh}/blob/${data.prior_report_commit}/latency/index.html`;
      const inv = (id) => `https://app.buildbuddy.io/invocation/${id}`;
      const source = (path) => `${gh}/blob/${data.source_devel_commit}/${path}`;
      const shortNames = {
        documentation: "Docs",
        "other code/tooling": "Other code",
        "cdk8s infrastructure": "cdk8s",
        "Agentplane services": "Services",
        "Agentplane frontend": "Frontend",
        "Agentplane test infrastructure": "Test infra",
        "graph-wide/toolchain": "Graph-wide",
      };
      const chartClasses = data.classes
        .filter((c) => shortNames[c.name])
        .map((c) => ({
          label: shortNames[c.name],
          p50: c.green_seconds.p50 / 60,
          p90: c.green_seconds.p90 / 60,
        }));
      const table = (headers, rows, width = 650) =>
        html`<${Table.ScrollContainer} minWidth=${width}
          ><${Table} striped highlightOnHover withTableBorder
            ><${Table.Thead}
              ><${Table.Tr}
                >${headers.map((h) => html`<${Table.Th}>${h}<//>`)}<//
              ><//
            ><${Table.Tbody}
              >${rows.map((row) => html`<${Table.Tr}>${row.map((v) => html`<${Table.Td}>${v}<//>`)}<//>`)}<//
            ><//
          ><//
        >`;
      const poolTimeline = data.kvm_pool.timeline
        .filter((r, i) => i % 5 === 0)
        .map((r) => ({
          time: new Date(r.t * 1000).toISOString().slice(11, 16),
          healthy: r.healthy,
          busy: r.busy,
          reservations: r.local_reservations,
        }));

      function ReliabilityWork() {
        const review = evidence.backend_retry_review;
        return html`<${Stack}
          component="section"
          id="reliability-dispatch"
          gap="md"
        >
          <${Title} order=${2}>Earlier Nov 10–12 backend rerun audit<//>
          <${Text}
            >22 of 102 green production-backend heads needed multiple Bazel
            attempts. Those heads account for 47.5% of summed feedback time:
            31m14s mean to green, compared with 9m30s for the 80 single-attempt
            heads.<//
          >
          <${Text} size="sm" c="dimmed">${review.interpretation}<//>
          <${SimpleGrid} cols=${{ base: 1, sm: 2 }}>
            ${review.lanes.map(
              (lane) =>
                html`<${Paper} withBorder p="md">
                  <${Stack} gap="sm">
                    <${Title} order=${3}>${lane.name}<//>
                    <${Badge} variant="light"
                      >${lane.pr_state === "MERGED" ? "Merged" : lane.url ? "PR opened" : "Dispatched"}<//
                    >
                    <${Text} fw=${600}>${lane.status}<//>
                    ${lane.url ? html`<${Anchor} href=${lane.url}>${lane.url}<//>` : null}
                    <${Text}>${lane.summary}<//>
                    <${Text} size="sm">${lane.validation}<//>
                    <${Anchor} size="sm" href=${lane.focused_invocation_url}
                      >Focused RBE validation<//
                    >
                    <${Anchor} size="sm" href=${lane.debug_note_url}
                      >Investigation and remaining evidence boundaries<//
                    >
                  <//>
                <//>`,
            )}
          <//>
          <${Text}
            >The 25 preceding failed checks include seven VM test failures and
            four thread-browser failures. Two additional attempts include remote
            execution failures while building the VM target. Targets can
            co-fail; these counts are discovery leads, not per-target failure
            rates.<//
          >
          <${Accordion} variant="contained" multiple=${true}>
            <${Accordion.Item} value="reliability-cases">
              <${Accordion.Control}
                >Selected failed attempts and what remains unknown<//
              >
              <${Accordion.Panel}>
                <${Stack} gap="md"
                  >${review.selected_cases.map(
                    (c) =>
                      html`<${Paper} withBorder p="sm">
                        <${Anchor}
                          href=${`https://app.buildbuddy.io/invocation/${c.invocation}`}
                          >PR #${c.pr} · ${c.target}<//
                        >
                        <${Text} size="sm" my="xs">${c.observation}<//>
                        <${Text} size="sm" c="dimmed">${c.diagnosis}<//>
                      <//>`,
                  )}<//
                >
              <//>
            <//>
            <${Accordion.Item} value="reliability-landed">
              <${Accordion.Control}
                >Already landed: preserve the distinction between a fix and
                measured recurrence<//
              >
              <${Accordion.Panel}>
                <${Stack} gap="md"
                  >${review.landed.map(
                    (c) =>
                      html`<${Paper} withBorder p="sm">
                        <${Anchor}
                          href=${`https://github.com/agentydragon/ducktape/pull/${c.pr}`}
                          >#${c.pr} · ${c.status}<//
                        >
                        <${Text} size="sm" mt="xs">${c.summary}<//>
                      <//>`,
                  )}<//
                >
              <//>
            <//>
          <//>
          <${Text} size="sm">${review.deferred}<//>
          <${Text} size="sm"
            ><${Anchor} href=${review.pod_split_disposition.source_url}
              >TLS-only Pod split: keep disabled in required CI<//
            >. ${review.pod_split_disposition.summary}<//
          >
          <${Text} size="sm" c="dimmed"
            >Backend cohort window: 10 November 00:00–12 November 23:59:19 UTC;
            results sampled ${review.population_observed_at_utc}. This
            supplemental review uses current source
            <${Anchor}
              href=${`https://github.com/agentydragon/ducktape/commit/${review.inspected_devel_commit}`}
              >${review.inspected_devel_commit}<//
            >, reviewed ${review.reviewed_at_utc}. Earlier report populations
            retain their original windows and source revisions.
            <${Anchor} href="./evidence.json">Reviewed attempt inventory<//>.<//
          >
        <//>`;
      }

      function Report() {
        return html`<${Container}
          component="main"
          size="76rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
          ><${Stack} gap="xl">
            <header>
              <${Anchor} href="../">Ducktape reports<//
              ><${Text} mt="md" c="dimmed"
                >${`CI latency · Agentplane backend · refreshed ${backend.observed_at_utc}`}<//
              ><${Title} order=${1} my="sm"
                >${`Agentplane backend CI: ${fmt(backend.summary.green_seconds.p50)} median, ${fmt(backend.summary.green_seconds.p90)} p90`}<//
              ><${Text} size="lg"
                >Among ${backend.summary.green_seconds.n} green production
                backend heads, the mean is${" "}
                <strong>${fmt(backend.summary.green_seconds.mean)}</strong>.
                These timings cover the required CI gates from the first
                workflow creation for each exact head, including reruns.
                Integration test execution dominates the inspected median case;
                failure recovery extends the tail.<//
              ><${Text} mt="sm" size="sm" c="dimmed"
                ><${ManifestStamp} src="./manifest.json" /><br />The backend
                refresh below has its own population and window. Earlier all-PR
                results and intervention experiments retain their original dates
                and source revisions. Workflow creation is a proxy for push
                time; review, conflicts, mergeability and agent notification
                delivery are outside this clock.<//
              >
            </header>
            <${CiLanes} data=${evidence.dispatch10} />
            <${Paper} component="section" id="latest-graph" withBorder p="lg">
              <${Stack} gap="sm">
                <${Title} order=${2}>Earlier selected graph experiments<//>
                <${Text} size="sm" c="dimmed"
                  >${`Supplement reviewed ${recent.reviewed_at_utc}; selected physical runs on 13 November UTC. The cohort distributions above retain their original windows and source revisions.`}<//
                >
                <${Text}>
                  <${Anchor} href=${recent.fixture.pr_url}>Merged PR #15966<//
                  >${" "} overlaps PodTemplate image import with CRDs and
                  deployment startup, joining the import before tests create
                  Sandboxes. A focused cold Pod pair reduced stack setup from
                  140.131s to 125.428s; both runs passed 21 cases. That single
                  pair does not measure a CI gate saving.
                <//>
                ${table(
                  [
                    "Selected Pod + MCP Actions + VM graph",
                    "Control",
                    "Fixture candidate",
                  ],
                  [
                    ["Bazel elapsed", "492.125s", "519.987s"],
                    ["JUnit cases passed", "27 / 27", "27 / 27"],
                    ["Pod stack setup", "152.932s, cold", "149.724s, cold"],
                    ["MCP Actions setup", "144.363s, cold", "172.264s, cold"],
                    ["VM baseline", "cold", "warm"],
                  ],
                  680,
                )}
                <${Text} size="sm">
                  <${Anchor} href=${recent.graph.control_invocation_url}
                    >Control<//
                  >${" "} and${" "}
                  <${Anchor} href=${recent.graph.candidate_invocation_url}
                    >candidate<//
                  >${" "} used the same three labels and passed identical case
                  sets (21 Pod, 5 MCP Actions, 1 VM). Their actual action inputs
                  differed only in the intended fixture source. Different
                  overlapping executor load and the VM cold/warm mismatch
                  prevent a causal gate or compute-cost comparison. Pod finished
                  last in both; the selected graph alone exceeded the
                  four-minute objective. See the${" "}
                  <${Anchor} href=${recent.graph.note_url}>graph evidence<//
                  >${" "} and${" "}
                  <${Anchor} href=${recent.graph.correction_pr_url}
                    >compute-unit correction<//
                  >: Pod and MCP Actions requested 4 CU each; VM requested 8 CU.
                <//>
                <${Text} size="sm">
                  Per-suite images in${" "}
                  <${Anchor} href=${recent.images.pr_url}>#15214<//>${" "} are
                  open and ready for review with required checks green. The
                  Codex-only image is 486.1 MB of OCI blobs versus 914.5 MB for
                  the full image; the Pod variant is 798.9 MB. These are image
                  inputs, not measured transfer savings. The observed smaller
                  Pod image imported more slowly under different worker and load
                  conditions, so its CI benefit remains unmeasured. The manual
                  real-model suite was build-validated but not run.
                <//>
                <${Text} size="sm">
                  A later warm-fixture Pod partition pair selected the same 27
                  JUnit cases: 21 Pod cases split 5/9/7, 5 MCP Actions, and 1
                  VM. The${" "}
                  <${Anchor} href=${recent.pod_partition.control_invocation_url}
                    >unsplit control<//
                  >${" "} took 580.533s in Bazel; the${" "}
                  <${Anchor}
                    href=${recent.pod_partition.candidate_invocation_url}
                    >partitioned candidate<//
                  >${" "} took 357.487s. Its three Pod group processes finished
                  in 220.075s, 255.994s, and 256.097s versus 387.428s for the
                  unsplit Pod process; the VM finished last at about 314s in the
                  candidate. Both selected graphs still exceeded 240s. Distinct
                  warm fixtures each cleaned up, but partitioning created two
                  extra stacks and the largest shared group could hold five
                  Sandboxes at the node cap. The control had a failed VM
                  execution followed by a successful new one, with its initiator
                  unknown; load and run time also differed, and it overlapped
                  the KVM pilot. Pod actions summed to 48.81 requested CU-min
                  and 1976.706 observed CPU-seconds in the candidate versus
                  25.83 CU-min and 1175.310 CPU-seconds in the control;
                  requested CU-min is a capacity proxy, not billing. The${" "}
                  <${Anchor} href=${recent.pod_partition.pr_url}
                    >merged partition trial note<//
                  >${" "} matches five common source files by CAS, without
                  comparing full runfiles trees. This selected pair does not
                  isolate a causal CI-gate improvement or capacity cost.
                <//>
                <${Text} size="sm">
                  A separate same-source, uncached VM placement pilot in${" "}
                  <${Anchor} href=${recent.vm_pilot.pr_url}>#15996<//>${" "}
                  passed one ordinary Claude/Codex harness case on each path.
                  Its KVM test action took 219.986s versus 346.448s on the
                  managed TCG executor, with both requesting 4 CPU and 7 GiB;
                  live KVM metrics confirmed that assignment, while managed
                  actual resources were unobserved. The${" "}
                  <${Anchor} href=${recent.vm_pilot.invocation_url}
                    >selected invocation<//
                  >${" "} took 396.977s overall. The managed fixture was cold,
                  KVM image cache warmth is unknown, executor isolation and
                  retention differ, and KVM queue timestamps were inverted. This
                  selected pair cannot establish a causal improvement in the
                  last CI gate, normal-load admission, or compute cost. The
                  merged PR records the trial; required CI was not rerouted.
                <//>
              <//>
            <//>
            <${ReliabilityWork} />
            <section id="backend-current">
              <${Title} order=${2}
                >Current backend PRs: scope and distribution<//
              >
              <${Text} my="sm">${backend.population_description}<//>
              ${table(
                [
                  "Changed paths",
                  "Heads",
                  "Green / failed / cancelled / pending / missing",
                  "Green mean",
                  "Green median",
                  "Green p90",
                ],
                backend.groups.map((g) => [
                  g.name,
                  g.n,
                  `${g.outcomes.green || 0} / ${g.outcomes.failed || 0} / ${g.outcomes.cancelled || 0} / ${g.outcomes.pending || 0} / ${g.outcomes.missing || 0}`,
                  fmt(g.green_seconds.mean),
                  fmt(g.green_seconds.p50),
                  fmt(g.green_seconds.p90),
                ]),
                900,
              )}
              <${Box}
                mt="lg"
                data-chart="backend-feedback"
                role="img"
                aria-label="Agentplane backend required-check median and p90, minutes, green exact heads only"
              >
                <${BarChart}
                  h=${280}
                  data=${backend.timing_groups
                    .filter((g) => g.green_seconds.n)
                    .map((g) => ({
                      label: `${g.short_name} (n=${g.green_seconds.n})`,
                      p50: g.green_seconds.p50 / 60,
                      p90: g.green_seconds.p90 / 60,
                    }))}
                  dataKey="label"
                  orientation="vertical"
                  series=${[
                    { name: "p50", label: "Median minutes", color: "blue.6" },
                    { name: "p90", label: "p90 minutes", color: "orange.6" },
                  ]}
                  withLegend
                  yAxisProps=${{ width: 140 }}
                  valueFormatter=${(v) => `${n(v)} min`}
                />
              <//>
              ${table(
                [
                  "Production backend, green heads",
                  "n",
                  "Mean",
                  "Median",
                  "p90",
                  "Maximum",
                ],
                backend.timing_groups.map((g) => [
                  g.name,
                  g.green_seconds.n,
                  fmt(g.green_seconds.mean),
                  fmt(g.green_seconds.p50),
                  fmt(g.green_seconds.p90),
                  fmt(g.green_seconds.max),
                ]),
                750,
              )}
              <${Title} order=${3} mt="lg" mb="sm"
                >Fast, typical and recovery examples<//
              >
              ${table(
                [
                  "Exact head / latest Bazel job",
                  "Required gates",
                  "Before latest job",
                  "Assignment",
                  "Runner setup",
                  "Remote envelope",
                  "Post",
                ],
                backend.cases.map((c) => [
                  html`<${Anchor} href=${c.job_url}
                      >#${c.pr}, attempt ${c.attempt}<//
                    ><br /><code>${c.head_sha}</code>`,
                  fmt(c.feedback_seconds),
                  fmt(c.before_latest_job_seconds),
                  fmt(c.assignment_seconds),
                  fmt(c.setup_seconds),
                  fmt(c.remote_seconds),
                  fmt(c.post_seconds),
                ]),
                1050,
              )}
              <${Text} size="sm" my="sm">
                PR #15493 took 1h55m40s across five Bazel attempts: four
                failures followed by success. The latest successful job itself
                took only 3m55s from creation. The earlier attempts and gaps
                remain part of feedback for that head; gap durations do not
                identify scheduler waiting or an operator cause. Retained logs
                show two VM-suite timeouts, a guest supervision proof failure,
                and a managed MicroVM restore failure. Those observed failure
                classes have different owners; they are not evidence of a single
                queue problem.
              <//>
              <${Text} size="sm" mt="sm">${backend.method}<//>
              <${Accordion} mt="md" variant="contained" multiple=${true}>
                <${Accordion.Item} value="backend-heads">
                  <${Accordion.Control}
                    >Exact backend heads and required-gate results<//
                  >
                  <${Accordion.Panel}>
                    ${table(
                      [
                        "PR / exact head",
                        "Change class",
                        "Outcome",
                        "Required-gate feedback",
                        "Bazel attempts",
                      ],
                      backend.heads.map((h) => [
                        html`<${Anchor} href=${`${gh}/pull/${h.pr}`}>#${h.pr}<//
                          ><br /><code>${h.head_sha}</code>`,
                        h.change_class,
                        h.outcome,
                        h.job_url
                          ? html`<${Anchor} href=${h.job_url}
                              >${fmt(h.feedback_seconds)}<//
                            >`
                          : fmt(h.feedback_seconds),
                        h.bazel_attempts,
                      ]),
                      950,
                    )}
                  <//>
                <//>
                <${Accordion.Item} value="backend-method">
                  <${Accordion.Control}>Selection, clock and uncertainty<//>
                  <${Accordion.Panel}
                    ><${Stack} gap="sm">
                      ${backend.limits.map((s) => html`<${Text} size="sm">${s}<//>`)}
                    <//><//
                  >
                <//>
              <//>
              <${Paper} withBorder p="md" mt="lg">
                <${Title} order=${3}
                  >A 10m03s backend head: execution, with little action
                  queueing<//
                >
                <${Text} my="sm">
                  The earlier cohort’s median service head,${" "}
                  <${Anchor} href=${backend.case_audit.job_url}>PR #15687<//>,
                  tested <code>${backend.case_audit.tested_commit}</code>. Its
                  GitHub job used 32s setup and 565s for the remote test/build
                  envelope. The${" "}
                  <${Anchor} href=${backend.case_audit.invocation_url}
                    >inner Bazel test invocation<//
                  >${" "}took 486.427s, with a 456.57s dependency critical path;
                  Pod testing contributed 414.47s. These are nested clocks.
                <//>
                <${Text} my="sm">
                  The physical Pod action queued for 0.061s and executed for
                  412.659s. Existing spans show 111.851s stack setup, a 237.408s
                  window containing 21 integration cases in two slots, and
                  29.995s cleanup. The longest case takes 81.449s and proves
                  idle suspension and explicit resume, including the production
                  one-minute minimum. Nested spans overlap; their sums are not a
                  critical path. This is a linked Nov 11 case, not a population
                  estimate for current scheduling.
                <//>
                <${Text} size="sm">
                  After the selected reliability work, revisit narrower real
                  image inputs and matched full-graph measurements in${" "}
                  <${Anchor} href=${`${gh}/pull/15214`}>#15214<//>, which
                  remains open. Byte reductions have no established CI saving
                  yet. Keep the existing scenario coverage and resource
                  reservations. Earlier KVM and Pod experiments, recovery
                  findings and their limits remain below.
                <//>
              <//>
            </section>
            <${Title} order=${2}>Earlier Nov 11–12 all-PR cohort<//>
            <${Text} size="sm" c="dimmed">
              Original window: 11 Nov 07:20 → 12 Nov 07:20 UTC; observed through
              07:46:51 UTC. The broader service class below includes test-only
              changes and is distinct from the production backend refresh above.
              These retained counts and charts were not recollected.
            <//>
            <${SimpleGrid} cols=${{ base: 1, sm: 3 }}
              ><${Paper} p="lg" withBorder
                ><${Text} c="dimmed">All required gates green<//
                ><${Title} order=${2}>94 / 159 heads<//
                ><${Text}
                  >33 failed · 31 cancelled · 1 pending. These outcomes are not
                  a flake rate.<//
                ><//
              ><${Paper} p="lg" withBorder
                ><${Text} c="dimmed">Among 94 green heads<//
                ><${Title} order=${2}>2m55s / 15m12s<//
                ><${Text}
                  >p50 / p90; mean 6m17s. Failed and superseded work is reported
                  separately.<//
                ><//
              ><${Paper} p="lg" withBorder
                ><${Text} c="dimmed">Bazel is the last gate<//
                ><${Title} order=${2}>90 / 94<//
                ><${Text}
                  >Artifact validation is last on four. Pre-commit is last on
                  none.<//
                ><//
              ><//
            >
            <${Alert} title="Decision" color="blue"
              >Keep the four-CPU KVM shape and the Pod suite’s current
              reservation. The same-source KVM canary is faster in its bounded
              three-scenario run, but uses different resources and cleanup, so
              it does not establish a production CI saving. Firecracker
              image-store reuse merged and was observed across two physical
              executions on one worker; its speedup is unmeasured. VM/Pod
              already retained a separate K3s baseline. More KVM workers cannot
              shorten a managed VM or Pod action.<//
            >
            <section id="cohorts">
              <${Title} order=${2}>What different PRs experience<//
              ><${Text} my="sm"
                >These classes use paginated file lists only when the PR’s
                recorded head matches the measured SHA. Mixed PRs use the
                documented class precedence. Superseded or unverified paths
                remain unknown; that group contains most failed and cancelled
                heads, so class-specific success frequencies would be
                misleading. Small classes are descriptive, not stable
                percentiles.<//
              >
              <${Box}
                data-chart="latest-class-feedback"
                role="img"
                aria-label="Green-head median and p90 gate feedback by PR class, in minutes"
                ><${BarChart}
                  h=${300}
                  data=${chartClasses}
                  dataKey="label"
                  orientation="vertical"
                  series=${[
                    { name: "p50", label: "Median minutes", color: "blue.6" },
                    { name: "p90", label: "p90 minutes", color: "orange.6" },
                  ]}
                  withLegend
                  tickLine="y"
