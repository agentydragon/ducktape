<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CI latency</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript>This report uses JavaScript for charts and disclosures.</noscript>
    <script type="module">
      import {
        Accordion,
        Anchor,
        Box,
        Code,
        Container,
        Group,
        Select,
        Stack,
        Table,
        Text,
        Title,
      } from "@mantine/core";
      import React from "react";
      import { BarChart } from "@mantine/charts";
      import { html, mount } from "../report.js";

      const evidenceSha =
        "c5b5d38800625b26e276891495fa534dc8a36e0ee1f752d81cba0e08b411b1e0";
      const response = await fetch(`./evidence.json?v=${evidenceSha}`);
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const bytes = await response.arrayBuffer();
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      if (
        Array.from(new Uint8Array(digest), (n) =>
          n.toString(16).padStart(2, "0"),
        ).join("") !== evidenceSha
      )
        throw new Error("Evidence does not match this report");
      const e = JSON.parse(new TextDecoder().decode(bytes));

      const repo = "https://github.com/agentydragon/ducktape";
      const link = (href, name) => html`<${Anchor} href=${href}>${name}<//>`;
      const pr = (n) => link(`${repo}/pull/${n}`, `#${n}`);
      const inv = (id, label) =>
        link(`https://app.buildbuddy.io/invocation/${id}`, label);
      const source = (path, label) =>
        link(`${repo}/blob/${e.source_devel_commit}/${path}`, label);
      const table = (headers, rows, width = 540) =>
        html` <${Table.ScrollContainer}
          minWidth=${width}
          type="native"
          maw="100%"
        >
          <${Table} striped verticalSpacing="sm">
            <${Table.Thead}
              ><${Table.Tr}
                >${headers.map((label) => html`<${Table.Th} key=${label}>${label}<//>`)}<//
              ><//
            >
            <${Table.Tbody}
              >${rows.map((cells, i) => html`<${Table.Tr} key=${i}>${cells.map((item, j) => html`<${Table.Td} key=${j}>${item}<//>`)}<//>`)}<//
            >
          <//>
        <//>`;
      const disclosure = (label, contents) =>
        html` <${Accordion} variant="contained">
          <${Accordion.Item} value=${label}>
            <${Accordion.Control}>${label}<//>
            <${Accordion.Panel}>${contents}<//>
          <//>
        <//>`;
      const section = (id, title, ...children) =>
        html`<section id=${id}>
          <${Stack} gap="sm"><${Title} order=${2}>${title}<//>${children}<//>
        </section>`;
      const sub = (t) => html`<${Title} order=${3}>${t}<//>`;
      const p = (...s) => html`<${Text}>${s}<//>`;
      const fmt = (v) => (v == null ? "—" : String(Math.round(v)));
      const pair = (v) =>
        v.n ? `${fmt(v.p50)} / ${fmt(v.p90)} (${v.n})` : "—";
      const names = {
        same_repo_open: "Repository opening",
        same_repo_update: "Repository update",
        fork_open: "Trusted fork opening",
        fork_update: "Trusted fork update",
      };
      const cats = {
        test_vm: "Agentplane test_vm (KubeVirt)",
        test_firecracker: "Agentplane test_firecracker",
        agentplane_system_other: "Other Agentplane system test",
        lean: "Lean compilation or audit",
        rust: "Rust compilation",
        debundle_integration_test: "Debundle integration (Excalidraw)",
        debundle_other_test: "Other Debundle test",
        other_test: "Other test",
        other_build: "Short build path (< 1 min)",
        no_test_invocation: "No test invocation",
      };
      const previous = link(
        `${repo}/blob/2f3a3dbcf3/latency/index.html`,
        "previous snapshot (17–24 Nov)",
      );
      const periods = Object.keys(e.critical_path_sample.periods);
      const catRows = Object.keys(cats).map((k) => [
        cats[k],
        ...periods.map((per) => {
          const c = e.critical_path_sample.periods[per].categories[k];
          return c ? `${c.n} · ${fmt(c.green.p50)} / ${fmt(c.green.p90)}` : "—";
        }),
      ]);
      const vmRuns = e.kvm_recycling.runs;
      function Report() {
        return html`<${Container}
          component="main"
          size="72rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
        >
          <${Stack} gap="xl">
            <header>
              ${link("../", "Ducktape reports")}
              <${Title} my="sm">CI feedback latency<//>
              <${Text} size="lg">
                Median time to required green rose from 185–244 s (20–23 Nov) to
                398 s and 421 s (24–25 Nov), then 268 s on 26 Nov. Bazel
                finished last on 148 of 160 sampled greens. Three things set the
                long paths: the Lean build rule compiles each library's modules
                one after another, a 26-crate Debundle dependency chain, and a
                KubeVirt suite that imports 24 images one by one because its
                runner is never reused.
              <//>
              <${Text} c="dimmed" mt="sm">
                PR heads that arrived 20 Nov 00:00 – 27 Nov 05:00 UTC (27 Nov
                partial). Seconds from GitHub's PR opened/synchronize event for
                each exact head to all three required checks green. Successful
                reruns included.
              <//>
            </header>

            ${section(
              "trend",
              "Time to required green",
              html`<${Box}
                role="img"
                aria-label="Median and p90 minutes to required green by UTC arrival day"
              >
                <${BarChart}
                  h=${240}
                  withLegend
                  dataKey="day"
                  data=${e.daily.map((d) => ({ day: d.day.slice(8) + (d.day.endsWith("27") ? "*" : ""), Median: d.green.p50 / 60, P90: d.green.p90 / 60 }))}
                  series=${[
                    { name: "Median", color: "blue.7" },
                    { name: "P90", color: "orange.7" },
                  ]}
                  yAxisLabel="Minutes"
                  valueFormatter=${(v) => v.toFixed(1)}
                />
              <//>`,
              p(
                "UTC arrival day, * partial. Green heads per day: ",
                e.daily.map((d) => d.green.n).join(", "),
                ". All PR heads, not a sample.",
              ),
              table(
                [
                  "Class",
                  "Heads",
                  "Green / red / superseded / other",
                  "Green p50 / p90 s (n)",
                  "Red p50 / p90 s (n)",
                ],
                Object.entries(e.classes).map(([k, s]) => [
                  names[k],
                  s.n,
                  [
                    s.outcomes.green || 0,
                    s.outcomes.red || 0,
                    s.outcomes.superseded || 0,
                    (s.outcomes.cancelled || 0) + (s.outcomes.pending || 0),
                  ].join(" / "),
                  pair(s.green),
                  pair(s.red),
                ]),
                760,
              ),
              p(
                "The four classes now sit within about 2 minutes of each other at the median. Fork updates are slowest (332 s). Reds are no faster than greens: the median first failure lands at 259–349 s, because the failing action usually starts late in the Bazel run.",
              ),
              disclosure(
                "Daily values in seconds",
                table(
                  [
                    "UTC day",
                    "Heads",
                    "Green p50 / p90 (n)",
                    "Red p50 / p90 (n)",
                  ],
                  e.daily.map((d) => [
                    d.day,
                    d.heads,
                    pair(d.green),
                    pair(d.red),
                  ]),
                ),
              ),
              disclosure(
                "Clocks and sources",
                p(
                  "The start clock is the PR opened time or the synchronize event's updated_at, read from the stored GitHub webhooks (CDviz). It is not the push time. Same-repo verdicts come from CDviz's ci_feedback view. Fork verdicts come from GitHub check runs on the head SHA, because that view mislabels most fork heads (see Data collection). Required checks: Bazel (bazel-ci / Test & Build), Build artifacts + imports check, Pre-commit checks; zero approvals required. Superseded heads are censored at their replacement. The previous report used a smaller audited sample with a workflow-creation clock, so compare its numbers loosely: ",
                  previous,
                  ".",
                ),
              ),
            )}
            ${section(
              "drivers",
              "What sets the time",
              p(
                "We sampled 12 same-repo and 8 fork green heads per day and read the critical path of each Bazel test invocation. Bazel finished last on 77 of 80 heads in 20–23 Nov and 71 of 80 in 24–27 Nov. Pre-commit was last six times in the later period. Each row counts heads by the largest category on their critical path.",
              ),
              table(
                [
                  "Critical path dominated by",
                  ...periods.map((per) => `${per}: heads · green p50 / p90 s`),
                ],
                catRows,
                700,
              ),
              p(
                "The regression is a workload shift. Before 24 Nov, 36 of 80 sampled heads had a path under a minute or a small test. After it, 29 of 80 spent most of their path compiling Lean or Rust. The KVM suites appear on about one head in eight in both periods, but they own the longest tails. The 15,925 s Firecracker tail is one head that failed at 996 s and passed on a rerun four hours later.",
              ),
              disclosure(
                "Sampled heads",
                table(
                  ["Head", "Day", "Green s", "Path s", "Dominant", "Trace"],
                  e.critical_path_sample.rows.map((r) => [
                    link(`${repo}/commit/${r.sha}`, r.sha.slice(0, 10)),
                    r.d.slice(5),
                    fmt(r.green),
                    fmt(r.cp),
                    cats[r.cat],
                    r.inv ? inv(r.inv, "path") : "—",
                  ]),
                  700,
                ),
              ),
            )}
            ${section(
              "opportunities",
              "Best opportunities",
              sub(
                "1. KubeVirt suite (test_vm): stop paying for a cold stack every run",
              ),
              p(
                "Every scenario in ",
                source("agentplane/system_tests/vm/defs.bzl", "test_vm"),
                " shares one K3s/KubeVirt stack. Its OTel spans show where a run goes. In the fastest sampled run (428 s), stack setup took 242 s, the two scenarios ran side by side for 131 s, and cleanup took 42 s. In each scenario the VM sandbox took 65–71 s to become ready and the agent turn 12–15 s. Setup is dominated by 24 container-image imports done one at a time (",
                source(
                  "agentplane/system_tests/k3s/baseline.py",
                  "import_images",
                ),
                "): 190 s in that run, 572 s in the slowest. The K3s, KubeVirt and PKI installs overlap the imports, but the last import (the VM guest root disk, 34–84 s) gates KubeVirt readiness.",
              ),
              p(
                "The suite is built to skip imports on a recycled runner, but it never gets one. In 6 of 6 sampled runs it started fresh. After the end-of-test memory reclaim the runner still held 2.152–2.339 GB, over the 2 GiB (2.147 GB) cap, mostly anonymous memory of the retained K3s, KubeVirt, Kyverno and cert-manager processes. ",
                pr(19002),
                " (22 Nov) caps paused runners at 2 GiB to stop memory stalls, so BuildBuddy discards every test_vm runner. test_firecracker stays near 1.4 GB and does recycle: warm setup took 40–47 s against 125–179 s cold.",
              ),
              table(
                [
                  "Suite",
                  "Trace",
                  "Warm runner",
                  "Memory after reclaim (cap 2.147 GB)",
                  "Stack setup s",
                  "Pytest s",
                ],
                vmRuns.map((r) => [
                  r.suite,
                  inv(r.invocation, r.invocation.slice(0, 8)),
                  r.recycled ? "yes" : "no",
                  (r.memory_after_reclaim_bytes / 1e9).toFixed(3) + " GB",
                  fmt(r.stack_setup_s),
                  fmt(r.pytest_s),
                ]),
                700,
              ),
              p(
                "Queueing is not the problem: these KVM actions waited 0.1–5 s (one 87 s) and fetched inputs in 1–17 s (max 56 s). The time is execution.",
              ),
              table(
                ["Change", "Mechanism", "Expected effect on test_vm", "Status"],
                [
                  [
                    "Retain only the image store",
                    "Stop K3s before the runner is paused and keep the ext4 image disk. Anonymous memory falls well under the 2 GiB cap, so BuildBuddy keeps the runner; the next run boots K3s and reinstalls controllers but skips imports.",
                    "−150 to −550 s setup on a warm hit. The 17 Nov spike measured 41 s warm vs 144 s cold setup on one source.",
                    "Proposed. Measure warm-hit rate and setup spans on PR traffic.",
                  ],
                  [
                    "Skip baseline cleanup when the runner cannot be kept",
                    "stack.cleanup (42–73 s) resets the stack for reuse that never happens. The test already measures memory after reclaim and can skip the reset when it exceeds the cap.",
                    "−40 to −70 s on every current run.",
                    "Proposed; small change.",
                  ],
                  [
                    "Import images concurrently",
                    "Imports are serial and are the setup critical path. 11 of 24 images are pinned upstream (KubeVirt, cert-manager, Kyverno) and never change.",
                    "Up to the serial sum minus the longest image; bounded by worker disk and CPU.",
                    "Untested. Shared blobs need one importer each to avoid containerd ingest locks.",
                  ],
                ],
                820,
              ),
              p(
                "Cold runs also vary threefold: setup 187 vs 657 s, with every phase slower by a similar factor. That points to contention on the worker rather than one stalled step. Over the week, guests on wyrm2 (about 28% of KVM busy time) had the most IO waiting while busy (median 0.18 vs 0.07–0.11 on the OVH hosts) and the highest CPU-wait tail (p90 0.43). The two slowest test_vm runs (1,234 and 1,016 s) ran on the same executor. Spans carry no host identity, so these runs cannot be tied to a host. Add the VM and node name to the test span resource; then decide whether to keep KVM workers off wyrm2.",
              ),
              sub("2. Debundle Rust: a 26-crate dependency chain"),
              p(
                'On 9 of the 29 later Lean/Rust heads, the path ended in building the debundler "for tool" (115–315 s) before any Debundle test could start. In one example trace, ten crate-metadata compiles ran in sequence (8–17 s each, including one-file crates), then the full cli rlib (62 s), the binary link (49 s), graph export (22 s), the editor-spec step (29 s) and the test (30 s). ',
                inv("b67f9f5b-9cf2-5f62-a778-a16577f09253", "Trace"),
                ". The debundler depends on 100 crates; its longest dependency chain is 26 crates, each a direct Bazel dependency of the next (checked edge by edge). Each level costs a metadata compile of 8–17 s, mostly fixed overhead. An edit to a low crate therefore costs minutes before any test runs.",
              ),
              p(
                "The ongoing crate splits (",
                pr(20219),
                ", ",
                pr(20237),
                ", ",
                pr(20292),
                ", ",
                pr(20303),
                ", ",
                pr(20387),
                ") cut work only where they make the graph wider. A split that adds a layer adds 8–17 s to every edit below it. Proposal: track the longest crate chain as a number in review, flatten chains such as cli → comment → binding → candidate_assessment, and give apply and graph export binaries that link only what they call. Next experiment: profile one one-file metadata compile to see what the 8–10 s floor is (dependency metadata loading, proc macros or action setup).",
              ),
              p(
                "Rejected: building exec-configuration Rust at opt-level 1 instead of Bazel's default optimized exec build. A same-source pair sped up the largest full compiles (cli 43→26 s, staged_analysis 58→43 s) but not the metadata chain. The link got slower (24→30 s), and so did the tool's analysis run (22→34 s). It was one pair on different workers, so the net effect is within noise. ",
                inv("f7d3db0f-0be3-468c-a745-70e6b9cd1ae0", "Control"),
                " · ",
                inv("a98eb4a6-1da3-4241-a22a-85dce99dd70b", "opt-level 1"),
              ),
              sub("3. Lean: modules in one library compile one after another"),
              p(
                pr(20059),
                " (26 Nov) moved Lean to one cached action per module. Before it, grouped library builds set paths of 313–1,176 s (24–25 Nov, 6 heads). After it, sampled Lean paths took 111–299 s (n = 5). One core-library edit still recompiled 26 modules strictly in sequence, 8–54 s each, 515 s in total. ",
                inv("eebd453d-7384-500f-a02e-5eade1555aa6", "Trace"),
              ),
              p(
                "That sequence is mostly not the import graph: only 7 of its 25 links are real imports. rules_lean compiles the modules of one lean_library in listed order and gives each compile every earlier module of the library as an input (",
                link(
                  "https://github.com/martianoff/rules_lean/blob/44fc4e4b299a32fd278865a45df24e0d05eb96a8/lean/private/rules.bzl#L108-L145",
                  "rules.bzl",
                ),
                "). Bazel therefore cannot start a module until all modules listed before it finish. Scheduling each compile on its real imports would cut this edit's Lean path to about 149 s over 7 modules (ObjectFrame → … → LinkedBehaviorExamples). That estimate assumes enough parallel workers and unchanged per-module times.",
              ),
              p(
                "Proposal: give each module only its own imports' outputs as inputs. Either declare one lean_library per module with explicit deps (generated from the import lines), or patch rules_lean to take a per-module import map. This is the largest single Lean lever we found.",
              ),
              p(
                "Each step also has a high fixed cost. Lean's profiler shows per-module time is mostly import, not proof work: HiddenRegion (50 lines) reported 7 s of import against 0.4 s of elaboration. Remotely each module compile stages 15,500 files (2.7 GB) and uses 10–13 CPU-s; locally the same compile takes 1.3–3.2 s. Keeping low-level modules off the `Lean` package (HostProfile pulls in Lean.Data.Json) would lower that floor. Rejected: dropping the per-module C output that rules_lean emits; local timing showed no difference.",
              ),
              sub("4. Smaller items"),
              p(
                "The Excalidraw integration tests dominated six later heads (green 738 / 1,350 s). The previous report's overlap of certification and the stock browser still applies. The two pre-commit tool-install PRs (",
                pr(19640),
                ", ",
                pr(19653),
                ") are still open; pre-commit was last on six later heads. The printer-test narrowing has started (",
                pr(20463),
                ", ",
                pr(20470),
                ").",
              ),
            )}
            ${section(
              "signals",
              "When agents can see results",
              p(
                "GitHub's job-completion webhook reached our collector at p50 2.9 s, p90 5.7 s and p99 7.4 s for about 19,700 required-gate completions (one 2,178 s outlier). This is receipt in the cluster, not an agent reading it. Delivery is not a meaningful part of feedback time.",
              ),
              p(
                "The live BuildBuddy test status, which can report red before the job ends, is a GitHub commit status. CDviz does not subscribe to status or check-run events, so its lead time stays unmeasured.",
              ),
            )}
            ${section(
              "collection",
              "Data collection fixes",
              p(
                "CDviz stores near-raw webhook payloads, which made this refresh possible. Three gaps showed up:",
              ),
              table(
                ["Gap", "Effect", "Proposed fix"],
                [
                  [
                    "ci_feedback view mislabels fork heads",
                    "745 of 1,451 fork heads stay pending although GitHub shows them green. Same-repo: 4 of 2,877. The skipped CI pull_request run (higher run ID) emits pending rows for bazel-ci / Test & Build that outrank the real trusted-fork result.",
                    "View only, raw data is intact: a new migration that emits run-level pending rows only for gates the run actually produced, or clears them when the run completes without that job.",
                  ],
                  [
                    "No status or check_run events",
                    "Early-red clock from the live BuildBuddy status is missing.",
                    "Subscribe to status and check_run in the webhook; store raw.",
                  ],
                  [
                    "No push clock",
                    "Updates use pull_request.updated_at as a proxy.",
                    "Subscribe to push events and keep X-GitHub-Delivery; imported_at then gives push arrival and duplicate detection.",
                  ],
                ],
                760,
              ),
              p(
                "The skills now include tested queries for this store (",
                pr(20512),
                ").",
              ),
            )}
            ${section(
              "evidence",
              "Source and measurements",
              p(
                "Source ",
                link(
                  `${repo}/tree/${e.source_devel_commit}`,
                  e.source_devel_commit,
                ),
                ". Raw API pages, logs and traces are kept locally; this page publishes aggregates and links only. Critical paths are BuildBuddy's critical-path tool log for each sampled head's first successful Bazel job. Sixteen sampled heads had no test invocation and count as such.",
              ),
              html`<${Group}
                >${link("./evidence.json", "Evidence")}
                ${link("./manifest.json", "Manifest")} ${previous}<//
              >`,
            )}
          <//>
        <//>`;
      }
      mount(Report);
    </script>
  </body>
</html>
