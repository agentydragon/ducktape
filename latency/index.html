    <script type="module">
      import {
        Accordion,
        Anchor,
        Box,
        Container,
        Group,
        Paper,
        SimpleGrid,
        Stack,
        Table,
        Text,
        Title,
      } from "@mantine/core";
      import { BarChart, LineChart } from "@mantine/charts";
      import { html, mount } from "../report.js?v=ebc2503d323c1b76";
      const response = await fetch(
        "./evidence.json?v=22b798b2794e95d0068e2e222d637d0b6280a067aee07eb1d76fa729e134811f",
      );
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const evidence = await response.json();
      const podAdmission = evidence.managed_pod_admission;
      const cas = evidence.cas_followup;
      const overlap = evidence.firecracker_overlap;
      const census = evidence.scheduler_pr_census;
      const firecrackerFollowup = evidence.firecracker_scheduler_followup;
      const staggered = firecrackerFollowup.staggered_probe;
      const hhmm = (stamp) => stamp.slice(11, 16);
      const modeNames = {
        serial: "Serial",
        simultaneous: "Simultaneous",
        staggered: "Staggered",
      };
      const cacheTrial = evidence.kvm_shared_cache_trial;
      const kvmPlacement = evidence.kvm_worker_placement;
      const gh = "https://github.com/agentydragon/ducktape";
      const source = evidence.source_devel_commit;
      const post = "after shadow retired";
      const groups = evidence.groups.filter((g) => g.period === post);
      const byPr = new Map(evidence.cases.map((c) => [c.pr, c]));
      const link = (href, label) => html`<${Anchor} href=${href}>${label}<//>`;
      const pr = (n) => link(`${gh}/pull/${n}`, `#${n}`);
      const file = (path, label) => link(`${gh}/blob/${source}/${path}`, label);
      const prior = `${gh}/blob/${evidence.prior_report_commit}/latency`;
      const seconds = (v) =>
        v == null ? "Unknown" : `${Number(v.toFixed(2))}s`;
      const time = (v) => {
        if (v == null) return "Unknown";
        const s = Math.round(v);
        return `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`;
      };
      const utc = (s) => s?.slice(11, 19) ?? "Unknown";
      const short = (label) => label?.split(":").at(-1) ?? "Unknown";
      const job = (j, label) => link(j.html_url, label);
      const build = (i, label) =>
        link(`https://app.buildbuddy.io/invocation/${i}`, label);
      const table = (headers, rows, width = 600) => html`
        <${Table.ScrollContainer} minWidth=${width}>
          <${Table} striped withTableBorder style=${{ overflowWrap: "normal" }}>
            <${Table.Thead}
              ><${Table.Tr}
                >${headers.map((h) => html`<${Table.Th}>${h}<//>`)}<//
              ><//
            >
            <${Table.Tbody}
              >${rows.map((row) => html`<${Table.Tr}>${row.map((v) => html`<${Table.Td}>${v}<//>`)}<//>`)}<//
            >
          <//>
        <//>
      `;
      const titles = {
        "Agentplane backend": "Backend",
        "Agentplane tests / fixtures": "Fixtures",
        Documentation: "Docs",
        Frontend: "Frontend",
        "Other code / tooling": "Tooling",
        "Other infrastructure": "Other infra",
        "cdk8s infrastructure": "cdk8s",
      };
      const phases = evidence.kvm_pool.timeline
        .filter(
          (_, i) => i % 10 === 0 || i === evidence.kvm_pool.timeline.length - 1,
        )
        .map((r) => ({
          ...r,
          utc: new Date(r.at * 1000).toISOString().slice(11, 16),
        }));
      const failureRows = [18106, 18243, 18254, 18256, 18273].map((n) => {
        const c = byPr.get(n);
        return [
          pr(n),
          evidence.rerun_causes[n],
          time(c.failure_before_job_red_s),
          time(c.prior_red_to_retry_job_created_s),
          time(c.feedback_s),
          html`${job(c.jobs[0], "Attempt 1")} ·
          ${build(c.attempts[0].inner, "Bazel")}`,
        ];
      });
      const comparable = evidence.groups.filter(
        (g) => g.group === "Agentplane backend",
      );
      function Report() {
        return html`<${Container} component="main" size="72rem" py="xl" style=${{ overflowWrap: "anywhere" }}>
          <${Stack} gap="xl">
            <header>
              ${link("../", "Ducktape reports")}
              <${Title} order=${1} mt="md" mb="xs">PR time to green<//>
              <${Text} size="lg">Across 13–19 November, 247 of 350 sampled heads reached green. Median ${time(evidence.weekly_feedback.pooled.median_s)} · p90 ${time(evidence.weekly_feedback.pooled.p90_s)} among those heads, including five successful reruns.<//>
              <${Text} c="dimmed" size="sm" mt="sm">Seven complete UTC days · KVM worker placement updated 21 November<//>
              <${Group} gap="md" mt="xs">${link("./evidence.json", "Evidence")}${link("./manifest.json", "Manifest")}<//>
              <${Text} mt="sm">In the ${hhmm(census.window_utc[0])}–${hhmm(census.window_utc[1])} UTC refresh on 21 November, ${census.overall.outcomes.green ?? 0} of ${census.eligible_prs} current exact PR heads reached required green. Median ${time(census.overall.median_s)} · p90 ${time(census.overall.p90_s)} among the green heads. At collection ${census.eligible_prs - (census.overall.outcomes.green ?? 0)} heads had yet to reach green.<//>
              <${Text} c="dimmed" size="sm">The refresh reviewed ${census.workflow_runs} workflow runs. It excludes superseded and unmatched heads. The weekly chart retains its original population.<//>
            </header>
            <section id="weekly-trend">
              <${Title} order=${2}>Daily time to green · 13–19 November<//>
              <${Text} my="sm">50 sampled PR heads per UTC day across change classes. Time starts at CI workflow creation and ends when all three required checks pass. Failed or unfinished heads contribute to the sample count only. Changes in the daily PR mix can move both lines.<//>
              <div role="img" aria-label="Median and 90th percentile minutes to required green by UTC day">
                <${LineChart} h=${225} data=${evidence.weekly_feedback.daily.map((d) => ({ day: d.day.slice(8), median: d.median_s / 60, p90: d.p90_s / 60 }))} dataKey="day" series=${[
                  { name: "median", label: "Median", color: "blue.6" },
                  { name: "p90", label: "p90", color: "orange.6" },
                ]} withLegend curveType="linear" yAxisLabel="Minutes" yAxisProps=${{ tickFormatter: (v) => String(v) }} valueFormatter=${(v) => time(v * 60)} />
              </div>
              <${Accordion} variant="contained"><${Accordion.Item} value="weekly-counts"><${Accordion.Control}>Daily times and included heads<//><${Accordion.Panel}>
                ${table(
                  ["November UTC", "Green / sampled", "Median", "p90"],
                  evidence.weekly_feedback.daily.map((d) => [
                    d.day,
                    `${d.n} / ${d.sampled}`,
                    time(d.median_s),
                    time(d.p90_s),
                  ]),
                  330,
                )}
              <//><//><//>
            </section>
            <section id="cohort">
              <${Title} order=${2}>20 November follow-up · PR time by change class<//>
              <${Text} my="sm">From the first observed CI workflow creation for the exact head to the last accepted required check. Backend heads took 10m24s at the median and 23m27s at p90. The 67 post-shadow heads include 60 green, one failed, five canceled and one incomplete. Green timing includes successful reruns. Push time, historical merge eligibility and agent receipt remain unobserved.<//>
              <${Box} role="img" data-chart="pr-feedback" aria-label="Median and p90 minutes to required checks passing by change class">
                <${BarChart} h=${290} data=${groups.map((g) => ({ class: titles[g.group], Median: g.green.p50 / 60, p90: g.green.p90 / 60 }))}
                  dataKey="class" series=${[
                    { name: "Median", color: "blue.6" },
                    { name: "p90", color: "orange.6" },
                  ]}
                  orientation="vertical" yAxisProps=${{ width: 76 }} xAxisLabel="Minutes" withLegend valueFormatter=${(v) => time(v * 60)} />
              <//>
              ${table(
                [
                  "Change class",
                  "Sample / frame",
                  "Green",
                  "Failed / canceled / incomplete",
                  "Median",
                  "p90",
                  "Mean",
                ],
                groups.map((g) => [
                  g.group,
                  `${g.heads} / ${g.frame}`,
                  g.green.n,
                  [
                    g.outcomes.failed ?? 0,
                    g.outcomes.cancelled ?? 0,
                    g.outcomes.incomplete ?? 0,
                  ].join(" / "),
                  time(g.green.p50),
                  time(g.green.p90),
                  time(g.green.mean),
                ]),
                750,
              )}
              <${Text} size="sm" mt="sm">Test & Build finished last on all 60 green heads. A modeled 60-second reduction to Test & Build would save 54 seconds per green head on average. The imports gate would become last on 14 heads and Pre-commit on one, with their clocks held fixed.<//>
            </section>
            <section id="vm-shadow">
              <${Title} order=${2}>VM cutover follow-up<//>
              <${Text} my="sm">Required VM CI moved to recycled cluster KVM at 05:41 UTC. The managed TCG shadow stopped at 07:36 UTC. KVM was faster in 97 of 100 manual pairs on 89 revisions, with a median paired saving of 4m28s and 2 first-attempt failures versus 23 on managed TCG. Warm fixture exposure differed across arms. Four fresh devel pairs also favored KVM. These clocks cover the VM test.<//>
              ${table(
                [
                  "Backend head window",
                  "Green / sampled",
                  "Median",
                  "p90",
                  "Mean",
                ],
                comparable.map((g) => [
                  g.period,
                  `${g.green.n} / ${g.heads}`,
                  time(g.green.p50),
                  time(g.green.p90),
                  time(g.green.mean),
                ]),
              )}
              <${Text} mt="sm">After retirement, the median was 9m31s on 12 one-attempt heads and 21m06s on five rerun heads. Different source changes, cache states and failures across the windows prevent a routing-effect estimate. On 12 successful first attempts with physical test records, the latest physical test was Pod on three, Firecracker on three, VM on two, and another test on four.<//>
              <${Text} mt="sm">Keep measuring for seven days through 27 November, or until 50 fresh required VM executions if that takes longer. Count VM failures and VM-last heads on verified cutover ancestry, report warm and cold separately, and retain managed Pod and Firecracker competitors on the same heads. A PR and a devel run both hit the namespace guard when a recycled fixture needed a rebuild. Keep tracking fresh exposure after the rebuild path is repaired.<//>
              <${Text} size="sm" mt="sm">${pr(18046)} routing · ${pr(18079)} shadow retirement · ${link("../vm-pairs.json", "Paired data")} · ${link(`${prior}/index.html#vm-shadow`, "Previous review")}<//>
            </section>
            <section id="kvm-placement">
              <${Title} order=${2}>KVM workers can now run on wyrm2<//>
              <${Text} my="sm">On 21 November the BuildBuddy KVM pool opened placement beyond OVH. The change lets workers use wyrm2, whose Piraeus SSD zvol was expanded to 600 GiB. ${pr(kvmPlacement.placement.pr)} placement · ${pr(kvmPlacement.storage.pr)} storage<//>
              <${Text} mb="sm">Two host-pinned pairs used the same manual VM TestRunner action and cold fixtures on warm executor caches. These are TestRunner process times. Queueing, input staging and upload are outside the clock.<//>
              ${table(
                ["Cold run", "OVH control plane", "wyrm2"],
                kvmPlacement.pairs.map((pair) => [
                  pair.label,
                  build(
                    pair.cp.invocation,
                    `${seconds(pair.cp.process_seconds)} · pass`,
                  ),
                  build(
                    pair.wyrm2.invocation,
                    `${seconds(pair.wyrm2.process_seconds)} · ${pair.wyrm2.exit_code ? "teardown failed" : "pass"}`,
                  ),
                ]),
                350,
              )}
              <${Text} mt="sm">Another wyrm2 worker was booting during the first pair. In the second pair both wyrm2 scenarios passed, then teardown lacked shutdown-completion evidence for one launcher. A separate profiled wyrm2 repeat passed in ${seconds(kvmPlacement.profiled_repeat.process_seconds)}. ${build(kvmPlacement.profiled_repeat.invocation, "Profiled repeat")}<//>
              <${Text} mt="sm">The OVH control plane uses an Intel bare-metal host. Wyrm2 uses AMD hardware with an extra Proxmox layer. CPU, storage paths and load also differ, so these runs leave the cause of the gap unresolved. Warm recycled VM performance and placement effects on required-check feedback remain unmeasured.<//>
              <${Text} mt="sm">Keep wyrm2 eligible and revisit placement if shutdown failures recur. Compare an HDD-backed worker next.<//>
              <${Text} size="sm" c="dimmed" mt="sm">21 November UTC · <code>${kvmPlacement.target}</code> · ${link(`${gh}/tree/${kvmPlacement.source_commit}/agentplane/system_tests/x/vm_kvm`, "Test source")}<//>
            </section>
            <section id="managed-pod">
              <${Title} order=${2}>Two PR heads had over a minute of Pod queue headroom<//>
              <${Text} my="sm">Three of 24 physical Pod executions with valid queue clocks waited more than a minute on 20 November, all between 20:09 and 20:22 UTC. Eighteen started in under a second. The long waits were on two of the 12 successful first-attempt backend heads with physical test records and on one failed attempt whose Firecracker test finished later. One additional Pod execution had an unusable queue clock.<//>
              <${Box} role="img" data-chart="managed-pod" aria-label="Observed Pod queue and maximum possible required-check time reduction for each PR" mb="sm">
                <${BarChart}
                  h=${220}
                  data=${podAdmission.cases.map((c) => ({
                    pr: `#${c.pr}`,
                    wait: c.pod.queue,
                    ceiling: c.conditional_headroom_s,
                  }))}
                  dataKey="pr" orientation="vertical"
                  yAxisProps=${{ width: 62 }}
                  xAxisLabel="Seconds"
                  withLegend
                  series=${[
                    {
                      name: "wait",
                      label: "Observed queue",
                      color: "orange.6",
                    },
                    {
                      name: "ceiling",
                      label: "Possible feedback reduction",
                      color: "blue.6",
                    },
                  ]}
                  valueFormatter=${seconds}
                />
              <//>
              ${table(
                [
                  "PR",
                  "Pod queue",
                  "Next physical finisher",
                  "Queue-only ceiling",
                  "Bazel evidence",
                ],
                podAdmission.cases.map((c) => [
                  pr(c.pr),
                  seconds(c.pod.queue),
                  short(c.competing_action_label),
                  seconds(c.conditional_headroom_s),
                  html`${build(c.invocation, "Inner")}${c.outer.invocation ? html` · ${build(c.outer.invocation, "Outer")}` : ""}
                  · ${link(c.job, "GitHub job")}`,
                ]),
                715,
              )}
              <${Text} size="sm" mt="sm">The ceiling holds the remaining action and required-check clocks fixed. It averages 20.8s across the 12 sampled first-pass heads with physical test records. Cluster Firecracker would take over on #18244 and Gateway budget on #18255. Firecracker already finished last on failed attempt #18256. On #18271, Pod was critical with a 0.097s queue and a 391.3s process.<//>
              <${Text} mt="sm">Worker admission for the outer Remote Bazel runners was 63ms on #18244 and 60ms on #18255. Their runner processes began 93s and 68s before the inner Bazel test invocations appeared. The long Pod waits happened after those invocations began and before a Pod worker started. In the fixture traces, the largest instrumented session admission was 0.83s and stack setup took 55–73s inside the process.<//>
              <${Text} mt="sm">The two queued Pod actions on #18255 and #18256 started on different workers 33ms apart after overlapping for 92s. Dispatcher started in under 0.1s on both heads with the same platform properties. Pod on #18246 started in 0.071s while #18244 was queued. The decoded actions share the full managed Firecracker platform, including Firecracker isolation, the image and recycling key, 4 requested compute units and 50GB of scratch. A separate exact-action pair started in 3.035s on #18227 and 1.875s on devel while the first action was still running. The three slow Pod actions had different input roots. A standalone repeat would sample another load window with no eligible-capacity measurement.<//>
              <${Text} size="sm" mt="sm">
                ${build(podAdmission.exact_digest_pair[0].invocation, "Same action on #18227")} ·
                ${build(podAdmission.exact_digest_pair[1].invocation, "Same action on devel")} ·
                ${link(`${gh}/blob/${podAdmission.inspected_source_devel_commit}/agentplane/system_tests/suites/BUILD.bazel`, "Current target")} ·
                ${link("https://www.buildbuddy.io/docs/rbe-platforms/", "Provider routing properties")}
              <//>
              <${Text} mt="sm">Keep the managed route while the admission cause is unknown. The BuildBuddy key received permission denials for executor inventory and account usage. Account throttling, a shortage of compatible workers and reservation terms remain unverified. Pursue a small reserved comparison only if provider telemetry identifies recurring, actionable contention and a candidate can serve the same Firecracker, snapshot and scratch requirements.<//>
              <${Text} size="sm" c="dimmed" mt="sm">Queue sample 01:40–21:06 UTC on 20 November. The capped target-history extension added five originating actions to the retained PR sample and excluded two shared links. An independent workflow census from 21:12:39 to 21:44 UTC found 14 successful, one canceled and two in-progress CI runs at collection, including superseded heads. The exact-head distribution above retains its original window. Route reviewed at devel ${podAdmission.inspected_source_devel_commit}.<//>
            </section>
            <section id="kvm-cas">
              <${Title} order=${2}>KVM kept direct Cloud after the cache trial<///>
              <${Text} my="sm">Fresh Cloud-direct workers fetched the identical 7,467-file Firecracker input tree in 8.63–8.71s. The warm shared proxy took 9.29s on its own host, with a different worker from the one that filled it. The cold fill crossed hosts and took 19.05s. All four runs used empty executor file caches. ${link(cacheTrial.archived_report, "Experiment report")} · ${pr(cacheTrial.experiment_pr)}<//>
              ${table(
                ["Cache path", "Input fetch", "Receiving host", "BuildBuddy"],
                cacheTrial.staging.map((row) => [
                  row.label,
                  seconds(row.input_s),
                  row.host,
                  build(row.invocation, "Invocation"),
                ]),
                520,
              )}
              <${Text} my="sm">The warm proxy served 1,388 ByteStream hits and 816,514,268 compressed bytes. It made zero upstream ByteStream reads or BatchReadBlobs calls during that sample. GetTree, SplitBlob and authentication still reached Cloud. Both full two-case runs passed with warm executor file caches. ${build(cacheTrial.full_tests[0].invocation, "Full direct run")} · ${build(cacheTrial.full_tests[1].invocation, "Full shared run")}<//>
              <${Text} my="sm">During a proxy-only egress fault, a standalone client verified a cached blob. The warm guest still hit metadata and authentication errors, and both guest probes were canceled at their fault deadlines. The restarted proxy failed its readiness check after egress was restored. Direct rollback fetched the same inputs in 8.73s. The trial pool, proxy, policies and disks were removed. ${build(cacheTrial.egress_fault.warm_guest_invocation, "Warm fault")} · ${build(cacheTrial.egress_fault.cold_guest_invocation, "Cold fault")}<//>
              <${Text} c="dimmed" size="sm" mb="sm">One fresh action per route and cache state. These measurements cover input staging in this pool. Fleet tail latency remains unmeasured. Required KVM CI stays on Cloud direct. Per-node caches are deferred.<//>
              <${Accordion} variant="contained"><${Accordion.Item} value="earlier-cas"><${Accordion.Control}>Earlier CAS stalls and loopback replay<//><${Accordion.Panel}>
              <${Text} my="sm">On #18106, VM and Firecracker each spent about 9m42s fetching inputs on different workers. Their download bitmaps resolve to the same four unique blobs. The 62.5 MiB Action Service layer accounted for 99.989% of the bytes. Both actions passed. A Gateway crash test caused the rerun. ${pr(18106)} · ${build(cas.pr_invocation, "First Bazel attempt")}<//>
              ${table(
                [
                  "Execution",
                  "Input fetch",
                  "Unique files / bytes",
                  "Read timeouts followed by successful retry",
                ],
                cas.executions.map((r) => [
                  r.label,
                  seconds(r.input_s),
                  r.bytes == null
                    ? "Unknown"
                    : `${r.files} / ${r.bytes.toLocaleString("en-US")}`,
                  r.recovered_read_stalls,
                ]),
                655,
              )}
              <${Text} size="sm" mt="sm">The execution receipts identify the whole set of downloads. The retry logs lack blob digests and the two terminal cold attempts lack bitmaps. The recovered cold attempt fetched just 55 KiB in 3m33s, so byte volume alone cannot explain the long waits. Worker-side gRPC counters also recorded Unavailable and Canceled responses during both incident windows. The four largest five-minute Unavailable bursts in the 24-hour sample were between 08:25 and 09:10 UTC. The counters establish the timing of a shared path problem. Responsibility and per-blob timings remain unknown. ${build(cas.cold_invocation, "Cold execution and attempts")}<//>
              <${Title} order=${3} mt="md">Loopback replay of the four PR blobs<///>
              ${table(
                [
                  "Route",
                  "62.5 MiB layer read",
                  "Verified client reads",
                  "Proxy upstream ByteStream reads",
                ],
                cas.replay.map((r) => [
                  r.label,
                  r.large_seconds.map(seconds).join(" / "),
                  r.verified_reads,
                  r.upstream_reads ?? "Direct",
                ]),
                625,
              )}
              <${Text} size="sm" mt="sm">BuildBuddy Enterprise Cache Proxy v2.323.0 filled an empty Pebble store, then served all eight repeat reads locally with zero additional upstream ByteStream calls. The cold fill made 53 upstream ByteStream RPCs for four client requests, including chunk reads. After a proxy restart with the same disk, four more reads hit locally. The restarted process contacted hosted authentication. Both direct controls were healthy. The proxy and clients ran on the same developer host, so these timings establish cache behavior and give no cluster or PR latency estimate.<//>
                <${Text} mt="sm" size="sm">${link(cas.proxy_docs, "BuildBuddy Cache Proxy")} · ${link(cas.executor_config, "Worker configuration")}<//>
              <//><//><//>
            </section>
            <section id="firecracker-overlap">
              <${Title} order=${2}>Firecracker overlap delayed live-guest scheduling<///>
              <${Text} my="sm">In four serial-versus-simultaneous pairs, TestRunner savings ranged from 47 seconds faster to 12 seconds slower. The live-guest launcher reached PodScheduled 3–6 seconds after the readiness wait began in serial runs and 37–69 seconds with both scenarios starting together. All eight runs passed both scenarios. Required CI stays serial.<//>
              ${table(
                [
                  "Host and fixture",
                  "Serial",
                  "Simultaneous",
                  "Process change",
                  "Live PodScheduled",
                ],
                firecrackerFollowup.matched_pairs.map((pair) => {
                  const saved = pair.process_seconds_saved;
                  const { serial, concurrent } = pair.rows;
                  return [
                    `${pair.host.replace("ovh-ns", "")} · ${pair.fixture}`,
                    build(serial.invocation, seconds(serial.process_s)),
                    build(concurrent.invocation, seconds(concurrent.process_s)),
                    `${seconds(Math.abs(saved))} ${saved >= 0 ? "faster" : "slower"}`,
                    `${seconds(serial.live_pod_schedule_s)} → ${seconds(concurrent.live_pod_schedule_s)}`,
                  ];
                }),
                535,
              )}
              <${Text} size="sm" mt="sm">Each pair used the same worker and input tree. The interrupted repeat used another guest on the same physical host. The process clock includes fixture setup and teardown. PodScheduled uses the nested Kubernetes condition timestamp and the test’s readiness-span start.<//>
              <${Title} order=${3} mt="md">Staggered start on one retained fixture<///>

              <${Text} mt="sm">${staggered.scheduler_evidence}<//>
              <${Text} size="sm" mt="sm">The four timed executions reused one baseline and passed both scenarios. Each staggered gate opened after the observer saw the live pod scheduled. The first staggered submission disconnected after cancellation and later finished on the worker. Its verdicts and timings came from native BuildBuddy output, and the repeat followed it on the retained runner. The experiment used a private recycling key and verified removal of the retained container and loop backing. ${build(staggered.dispose_invocation, "Disposal")} · ${link("./firecracker-staggered-spike.patch", "Probe patch")}<//>
              <${Accordion} variant="contained" mt="md"><${Accordion.Item} value="first-overlap"><${Accordion.Control}>Earlier warm overlap experiment<//><${Accordion.Panel}>

            </section>
            <section id="reruns">
              <${Title} order=${2}>Failure recovery drove the backend tail<//>
              <${Text} my="sm">The informational BuildBuddy status preceded final red by 4 seconds to 10m32s. For #18243, an early test failure was followed by 7m42s of ongoing CI before final red, then 11m03s until GitHub created the next job. Assignment on that retry took 2s. GitHub identifies the triggering account type as User on these five retries. The request source and reason for the interval are unobserved.<//>
              ${table(["PR", "First failure", "Live failure → job red", "Red → retry job created", "Time to green", "Evidence"], failureRows, 860)}
              <${Text} size="sm" mt="sm">PR subscriptions receive completed check-run facts and commit statuses by default. The linked status timestamps measure GitHub publication. The completed job logs and selected BuildBuddy artifacts were readable during review. First queryability, webhook delivery, inbox acknowledgement and harness receipt need separate clocks. ${file("agentplane/notification_service/docs/agents/github.md", "Subscription behavior")}<//>
            </section>
            <section id="cases">
              <${Title} order=${2}>What finished last on green heads<///>
              <${Text} my="sm">All times in the middle columns are UTC. The GitHub Test + Build + lint step includes outer Remote Bazel allocation and setup, inner Bazel, any subsequent build and finalization. The Pod follow-up includes two exact outer allocation clocks.<///>
              ${table(
                [

                  "CI workflow",
                  "Job starts",
                  "Remote step",
                  "Inner test",
                  "Bazel critical-path test",
                  "Required green",

                [18234, 18244, 18246, 18255, 18265].map((n) => {
                  const c = byPr.get(n),
                    a = c.attempts[0],
                    j = c.jobs[0];
                  return [
                    pr(n),
                    utc(c.start),
                    utc(j.started_at),
                    j.remote.map(utc).join("–"),
                    build(a.inner, time(a.duration_s)),
                    short(a.critical_path.test),
                    job(j, time(c.feedback_s)),
                  ];
                }),
                785,
              )}
              <${SimpleGrid} cols=${{ base: 1, md: 2 }} mt="md">
                <${Paper} withBorder p="md">
                  <${Title} order=${3}>Managed Pod admission<///>
                  <${Text} mt="xs">On #18244, the 299.7s Pod process included 54.7s of fixture setup, 179.8s from the first to the last case and 32.5s of stack cleanup. ${link("#managed-pod", "Queue comparison")}<//>
                <//>
                <${Paper} withBorder p="md">
                  <${Title} order=${3}>Firecracker scenario and cleanup<///>
                  <${Text} mt="xs">#18246 ran for 412.3s with a confirmed warm fixture. Setup took 50.6s. The live-guest continuity case occupied 212.9s, including 56.6s sandbox cleanup. The proxy-trust negative case followed for 74.9s, followed by 50.2s stack cleanup. The live-guest case exercises the one-minute idle policy, suspend/checkpoint, credential rotation and same-process resume. ${file("agentplane/system_tests/scenarios/firecracker.py", "Scenario source")}<//>
                <//>
                <${Paper} withBorder p="md">
                  <${Title} order=${3}>Fast and slow KVM VM paths<///>
                  <${Text} mt="xs">#18234 had 42.2s warm setup inside a 182s VM action. On #18265, the first action failed before scenario execution after a baseline fingerprint mismatch. The recycled runner entered in private cgroup 0::/init and the rebuild expected 0::/. The retry passed both cases after 193.4s cold setup. Shortening VM on that head could save up to 25.2s before Gateway budget became last. ${file("agentplane/system_tests/k3s/baseline.py", "Namespace check")}${" · "}${link("../reliability/#vm-cutover", "Corroborating devel report")}<//>
                <//>
                <${Paper} withBorder p="md">
                  <${Title} order=${3}>KVM input fetch delayed a failed attempt<///>
                  <${Text} mt="xs">#18106 assigned VM and Firecracker actions after 5.2s and 3.6s. They then spent 581.1s and 581.9s in input fetch, on two distinct workers, with 65.6 MB across four recorded files on each action. Both tests passed. The long fetch deferred final job red after the separate Gateway crash case failed. Native metadata leaves the responsible CAS object and network path unknown.<//>
                <//>
              <//>
            </section>
            <section id="capacity">
              <${Title} order=${2}>Runner and executor capacity<///>
              <${Text} my="sm">GitHub recorded 27.35 occupied runner-hours and a peak of 40 in the 19:42:40–21:12:40 UTC window, a lower bound based on completed assigned jobs. Among 69 assigned, completed PR Test & Build jobs, creation to start was 2s median, 3s p90 and 65s maximum. No measured PR Test & Build job was awaiting assignment at the cutoff. The longest waits across all job types occurred in dependent release and image steps. Default CodeQL setup is off.<///>
              <${Text} my="sm">Decoded action properties on #18244 put VM and Firecracker on self-hosted Docker in <code>kvm-vm</code>, one concurrent task per worker. Pod used the managed Firecracker action lane. The managed Pod follow-up measures the two corresponding outer runner admissions. Provider eligibility and capacity remain unobserved.<///>
              ${table(

              <${Text} size="sm" mt="sm">The four managed labels reached a 195.6s maximum native queue. Twenty KVM queue clocks were inverted. Keep those unknown. At one-minute resolution the KVM telemetry recorded up to eight registered workers, with task counts available jointly on 684 of 816 points. No joint sample reached eight registered and eight tasks. Short queue bursts and misses still remain possible.<///>
              <${Box} role="img" data-chart="kvm-pool" mt="md" aria-label="KVM desired workers, registered workers and executor task gauge">

                  strokeWidth=${2} withDots=${false} series=${[
                    {
                      name: "registered",

                    },
                    { name: "tasks", label: "Tasks", color: "teal.6" },

              <//>
              <${Text} size="sm" mt="sm">Chart samples every ten minutes from the one-minute census. The task gauge includes input preparation and upload. ${link("https://grafana.allegedly.works/d/buildbuddy-executor-pool", "Executor pool dashboard")}<//>
              <${Text} mt="sm">Across the selected backend and fixture invocations, 1,072 unique originating TestRunner actions used 27.68 process-hours and 46.99 observed CPU-hours. CPU was missing for 37 actions, including all sampled KVM VM and Firecracker actions. Thread-browser shards consumed 3.44 process-hours across 112 actions. Runner hours and remote action costs use different clocks.<///>
            </section>

              ${table(

                    admission reasons and eligible capacity for an overlapping
                    burst.
                    ${link("#managed-pod", "Measured cases and follow-up")}`,

              <${Text} mt="sm">A 30% reduction from the 9m31s one-attempt median requires 2m51s. Reaching a four-minute mean requires a 4m52s reduction from the observed 8m52s mean. None of the isolated observed path reductions covers that distance. A larger design would narrow App-triggered guest, Firecracker and managed Pod work together. Keep an end-to-end App→guest witness and the separate guest lifecycle, PKI and recovery assertions. Compare on the same selected source changes with exact gates and action inputs before counting a gain.<///>
              <${Text} mt="sm">The timeout lookup fix and recycled Docker rebuild fix merged. Track subscriber delivery separately from test-recovery time. The two-worker minimum and fleet warm-hit rate still need a matched comparison. ${pr(18292)} · ${pr(18295)}<//>
              <${Text} mt="sm">The 20 November cold job reached its 30-minute GitHub timeout. BuildBuddy finished successfully about eight seconds after GitHub canceled it. Two executor attempts failed waiting for CAS Read responses before the test process started. Input fetch consumed 2m53s, 8m50s and 3m33s across two failed starts and the passing attempt. The passing process took 6m50s. The retained receipts and cache replay are linked above. ${link(evidence.cold_workflow[1].html_url, "Passed run")} · ${link(evidence.cold_workflow[0].html_url, "Timed-out GitHub job")}${" · "}${build(evidence.cold_execution.invocation, "Recovered BuildBuddy result")}<//>
            </section>

                <${Accordion.Control}>Population, clocks and provenance<//>
                <${Accordion.Panel}>
                  <${Text} mb="sm">151 exact latest heads sampled from 264 matching heads across 19 November 20:00 through 20 November 21:12 UTC. GitHub returned 888 PR CI runs for the full window. The frame includes earlier heads and cross-repository runs. Gate estimates use only the joined latest same-repository devel heads with complete changed-file classes, plus one large-diff head in an unclassified row. Exact check attempts and cutoff outcomes appear in the evidence. These are balanced path samples and the earlier 10–16 November report used a different sampling frame.<///>
                  <${Text} mb="sm">The devel ruleset requires Test & Build, Pre-commit and Build artifacts + imports, with non-strict status checks and zero ordinary approvals. It requires a PR, linear history and extra approval for unattributed changes. Auto-merge is enabled in repository settings. Historical draft, review and conflict transitions were unavailable. Of the 60 green post-shadow heads all were already merged at collection. The sample does not assign auto-merge-ready timestamps.<///>
                  <${Text} mb="sm">BuildBuddy test invocations use deterministic run-and-attempt IDs. For linked traces, the synthetic test commit's parents identify the PR head and tested base. All listed post-shadow timelines have a tested base containing the route change. Native test process clocks, fixture spans and GitHub step intervals overlap. The 90-minute runner census excludes unfinished jobs. The independent older-active scan raced pagination, returning 14 records against a reported 26.<///>
