  <body>
    <div id="report-content"></div>
    <noscript>This report uses JavaScript for charts and disclosures.</noscript>
    <script type="module">
      import {
        Accordion,
        Alert,
        Anchor,
        Badge,
        Box,
        Code,
        Container,
        Group,
        Paper,
        SimpleGrid,
        Stack,
        Table,
        Text,
        Title,
      } from "@mantine/core";
      import { BarChart, LineChart } from "@mantine/charts";
      import { html, mount, ManifestStamp } from "../report.js";
      const response = await fetch("./evidence.json");
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const e = await response.json(),
        c = e.cohort;
      const gh = "https://github.com/agentydragon/ducktape",
        inv = (id) => `https://app.buildbuddy.io/invocation/${id}`;
      const fmt = (s) =>
        s == null
          ? "Unobserved"
          : `${Math.floor(s / 60)}m ${Math.round(s % 60)
              .toString()
              .padStart(2, "0")}s`;
      const n = (s) => (s == null ? "Unknown" : Number(s).toFixed(1));
      const link = (url, label) =>
        html`${" "}<${Anchor} href=${url}>${label}<//>${" "}`;
      const pr = (id) => link(`${gh}/pull/${id}`, `#${id}`);
      const table = (headers, rows, width = 700) =>
        html`<${Table.ScrollContainer} minWidth=${width}
          ><${Table} striped withTableBorder
            ><${Table.Thead}
              ><${Table.Tr}
                >${headers.map((h) => html`<${Table.Th}>${h}<//>`)}<//
              ><//
            ><${Table.Tbody}
              >${rows.map((row) => html`<${Table.Tr}>${row.map((v) => html`<${Table.Td}>${v}<//>`)}<//>`)}<//
            ><//
          ><//
        >`;
      const caseBy = (pr) => e.selected_cases.find((x) => x.pr === pr);
      const pools = e.kvm_pool.timeline
        .filter((x, i) => i % 4 === 0)
        .map((x) => ({
          ...x,
          time: new Date(x.t * 1000).toISOString().slice(11, 16),
        }));
      const oldRows = [
        [
          "Native suite boundaries and trust reuse",
          "Merged #16675/#16689/#16695/#16700. Configured runtime cut passes below; exact whole-feedback treatment remains unmeasured. Retain real PKI, ownership, readiness and fresh lifecycle witnesses.",
        ],
        [
          "Pod four-worker scheduling",
          "Merged #16659. Warm 22-case ABBA: 363.3→289.2s action mean (20.4%); CPU 883.2→844.3s; peak 5.07→5.12GiB. Faster-control sensitivity 13.8%. Current split has 23 cases; no matched new-layout feedback comparison. Exposure window ends 22Nov11: 01UTC.",
        ],
        [
          "Two ordinary pytest stacks",
          "Rejected at frozen 6e6ad85: same 15 cases passed; slowest action 293.608→313.861s (+6.9%), CPU 718.740→1046.335s (+45.6%). Extra setup defeated that allocation. Do not repeat it unchanged; native dependency partitions are a different design.",
        ],
        [
          "Bridge eight shards / Python bytecode",
          "Historical 4/8/8/4 same 24-case screen: elapsed−24.9%, CPU+62.8%; whole-gate benefit unqualified. Bytecode saved 4.494s import self-time but added 3455 cold compiles/4203CPU-s. No blanket bytecode promotion; archive both original sources.",
        ],
        [
          "Guest architecture iterations 10–14",
          "Private systemd proof in direct guest and missing-proof negative passed. Warm ownership screen native 200.769s versus 202.192s did not isolate a gain. Shared guest screen 343/424/246/357s changed fresh-fixture coverage and had variable cleanup; no promotion. Reduced Codex-only root removed 26.2% bytes, only 4.0% observed action time in one confounded pair.",
        ],
        [
          "Earlier graph replay",
          "Historical 376f ABBA: 442.484→365.475s selected invocation (17.4%), known CPU+5.4%; 562 NEW launches/4118 JUnit exposures. Historical labels/cache conditions, not current PR feedback or a qualified 30% saving.",
        ],
        [
          "Image/store/import work",
          "#15188 store continuity, #15966 image-import overlap and #16040 guarded usable-image import are merged. Warm ABBA setup 46.992→32.216s for import guard; complete graphs had mismatched VM roots. #15214 image split remains OPEN and held for actual savings; #15126 bulk-import OPEN, old confounded trial insufficient. Image bytes do not equal elapsed benefit.",
        ],
        [
          "Artifact mounts / MCP overlap",
          "#16047 remains OPEN manual/draft. Real harness mount feasibility passed, but total inputs fell only 47044B; no transfer-speed claim. #16038 MCP case overlap merged: 112.336→96.833s case envelope, whole action 254.348→265.866s; old setup/load confounds. Current 1+3+4 split changes arrangement; do not reuse old result as its effect.",
        ],
        [
          "KVM placement and old resource experiments",
          "#15822 CLOSED; #15996 pilot and capacity evidence merged. Four KVM actions on three slots left fourth queued 215.314s; Pod still last in that graph. Keep placement unchanged until capacity-aware qualification. Old 4→8CPU and 2→3Pod trials are not evidence against the later changed four-worker arrangement. One task/worker protects exclusive K3s state.",
        ],
        [
          "Reliability and observer recovery",
          "#16045/#16051 browser route lifetime repair and artifact retention, #16053 auth diagnostics, #16055 guest-progress diagnostics, #16299 and #16344 bounded readiness repairs are merged. Mechanism proofs stay distinct from recurrence rates. #16041 diagnostic PR remains OPEN: native two-reset control exhausted WaitExecution retry budget despite physical success. No blanket retries/cancellation policy change.",
        ],
        [
          "Unresolved failures and ownership",
          "Natural browser auth cause, admitted-turn guest stall, early QEMU crash #16057 and the newer VM API/containerd outage remain distinct. Next occurrence needs exact physical executor/incarnation, native process/API clocks and teardown owner. Map runner shutdown/reconciliation ownership, then simplify one race-tested path. No timeout increase.",
        ],
        [
          "Old capacity and setup recommendations",
          "Old one-worker 22–26-reservation incident is superseded by current 2–3 registered capacity. Graceful drain and 8GiB workers already landed. PKI/device-plugin trims and tag guards landed; no causal fleet saving assigned. Subsecond fetch examples do not justify a proxy. Idle suspend's production one-minute boundary and real boot/supervision assertions remain required.",
        ],
      ];
      function Report() {
        return html`<${Container}
          component="main"
          size="76rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
          ><${Stack} gap="xl">
            <header>
              ${link("../", "Ducktape reports")}
              <${Text} c="dimmed" mt="md"
                >CI latency · reviewed 15 November 2026 UTC<//
              >
              <${Title} order=${1} my="sm"
                >Backend PR feedback: 9m34s median, 15m25s p90<//
              >
              <${Text} size="lg"
                >Useful integration work still dominates typical feedback. KVM
                admission can add several minutes to the tail. The new test
                boundaries are merged, but a 30% complete-feedback gain has not
                been demonstrated.<//
              >
              <${Text} size="sm" c="dimmed" mt="sm"
                ><${ManifestStamp} src="./manifest.json" /><br />58 green
                production-backend heads from 59 sampled heads; mean 9m41s.
                Window 13Nov00: 00→15Nov13: 55UTC. First workflow creation
                proxies unavailable push timestamps. These are CI-gate clocks,
                not observed auto-merge eligibility.<//
              >
            </header>
            <${Alert} title="Next decision" color="blue"
              >Prioritize a capacity-aware KVM tail experiment, and qualify the
              merged architecture against complete selected graphs. A fourth
              eligible worker could remove a demonstrated queue bottleneck; more
              pytest sharding or a VM-only speedup cannot reliably shorten the
              current typical path. Keep required scenarios and deployed routing
              unchanged while testing.<//
            >
            <${SimpleGrid} cols=${{ base: 1, sm: 3 }}>
              <${Paper} withBorder p="md"
                ><${Text} c="dimmed">Production backend sample<//
                ><${Title} order=${2}>58 green / 59 heads<//
                ><${Text}
                  >1 failed; latest heads only. This is not a flake rate.<//
                ><//
              >
              <${Paper} withBorder p="md"
                ><${Text} c="dimmed">Current last-test headroom<//
                ><${Title} order=${2}>23s / 2s<//
                ><${Text}
                  >Dispatcher-only / VM-only fixed-clock headroom in two linked
                  heads; other tests become last.<//
                ><//
              >
              <${Paper} withBorder p="md"
                ><${Text} c="dimmed">A slow Firecracker example<//
                ><${Title} order=${2}>537s queue<//
                ><${Text}
                  >444s conditional headroom before Pod becomes last: 46.8% of
                  that head’s 950s feedback.<//
                ><//
              >
            <//>
            <section id="cohort">
              <${Title} order=${2}>What recent PRs experience<//>
              <${Text} my="sm"
                >A balanced chronological sample within each day and path class:
                637 newly opened devel-base PRs in the search frame, 145
                selected, 144 eligible heads. Up to 20 production and 10
                test/fixture heads per day, 5 per other class; no outcome
                filtering. Class percentiles are descriptive and unweighted,
                rather than a traffic-weighted census. Older PRs with new pushes
                and superseded heads are absent.<//
              >
              <${Box}
                role="img"
                data-chart="feedback"
                aria-label="Green PR-head median and p90 feedback in minutes by changed-path class"
                ><${BarChart}
                  h=${330}
                  data=${c.groups.map((g) => ({ label: `${g.name} (n=${g.green_s.n})`, Median: g.green_s.p50 / 60, p90: g.green_s.p90 / 60 }))}
                  dataKey="label"
                  orientation="vertical"
                  series=${[
                    { name: "Median", color: "blue.6" },
                    { name: "p90", color: "orange.6" },
                  ]}
                  withLegend
                  yAxisProps=${{ width: 190 }}
                  valueFormatter=${(v) => `${n(v)}min`}
              /><//>
              ${table(
                [
                  "Changed paths",
                  "Heads",
                  "Green / failed / cancelled",
                  "Median",
                  "p90",
                  "Mean",
                ],
                c.groups.map((g) => [
                  g.name,
                  g.n,
                  `${g.outcomes.green || 0} / ${g.outcomes.failed || 0} / ${g.outcomes.cancelled || 0}`,
                  fmt(g.green_s.p50),
                  fmt(g.green_s.p90),
                  fmt(g.green_s.mean),
                ]),
                850,
              )}
              <${Text} size="sm" mt="sm"
                >The prior 10–13Nov cohort had 124 green/129 production heads:
                11m27s median, 23m38s p90, 13m36s mean. Current medians and
                tails are lower, but the frame, equal-day sampling, source and
                workload mix differ. Most new measurements precede today’s final
                ports. This is not an attributed improvement.<//
              >
              <${Text} size="sm" mt="sm"
                >Bazel was last on 140/141 green heads; artifact/import
                validation on 1; pre-commit on 0. Only two sampled heads had
                multiple Bazel checks: one cancelled attempt followed by success
                (#16088), and one success followed by failure (#16007). This
                latest-head sample cannot establish the fleet rerun rate or
                prove the earlier reliability work eliminated retries.<//
              >
            </section>
            <section id="timelines">
              <${Title} order=${2}>Linked heads: the bottleneck changes<//>
              ${table(
                [
                  "PR / tested tree",
                  "Gate feedback",
                  "Job assignment",
                  "Runner setup",
                  "Remote envelope",
                  "Inner Bazel",
                  "Last fresh test",
                ],
                [16226, 16657, 16689, 16716, 16718, 16378, 16088].map((p) => {
                  const x = caseBy(p);
                  return [
                    html`${link(x.job_url, `#${p}`)}<br /><${Code}
                        >${x.tested_merge.slice(0, 12)}<//
                      >`,
                    fmt(x.feedback_s),
                    fmt(x.timeline.job_created_to_started_s),
                    fmt(x.timeline.setup_s),
                    fmt(x.timeline.remote_envelope_s),
                    link(inv(x.invocation), fmt(x.bazel_elapsed_s)),
                    x.last_test?.label.split(":").pop() ||
                      "No NEW tests; cache/build path",
                  ];
                }),
                1050,
              )}
              <${Text} size="sm" mt="sm"
                >Outer remote admission, checkout, selection, Bazel
                prerequisites and finalization sit inside the remote envelope;
                its unexplained remainder is not labelled queue time. The inner
                Bazel clock is nested. Before-job and postprocessing clocks are
                in evidence. No PR had a reconstructed historical push or
                mergeability-ready timestamp.<//
              >
              <${Paper} withBorder p="md" mt="md"
                ><${Title} order=${3}>#16716: Dispatcher finishes last<//>
                <${Text} my="sm"
                  >574s required feedback; 437.562s inner invocation; 413.54s
                  dependency critical path. The Dispatcher process takes 320.49s
                  with 0.06s recorded action queue. Existing spans show 113.933s
                  cold setup, three serial cases 15.164/52.022/77.520s, and
                  28.265s stack cleanup. A50.061s peer-lifetime span sits inside
                  a case. These are real queue/readiness/failover and opted-in
                  wake-up proofs, including global rollout mutations;
                  parallelizing them on the same stack would need an isolation
                  redesign.<//
                >
                <${Text}
                  >The next test finishes 23.118s earlier. Removing 100s from
                  Dispatcher alone therefore cannot deliver 100s
                  complete-feedback savings under the recorded other clocks. The
                  four-worker and native split ports are in this tested merge;
                  trust pooling is not.
                  ${link(inv(caseBy(16716).invocation), "Exact invocation")}<//
                >
              <//>
              <${Paper} withBorder p="md" mt="md"
                ><${Title} order=${3}>#16718: VM and Firecracker almost tie<//>
                <${Text} my="sm"
                  >595s required feedback; 460.000s inner invocation. All six
                  inspected merged ports are ancestors of this tested merge. VM
                  process 413.25s: 125.225s cold setup, 201.037s longest
                  concurrent scenario, 30.768s cleanup; other time includes
                  Python/import and test plumbing. Two guest readiness waits
                  overlap at 111.797s and 84.651s. Guest-root import 40.846s is
                  nested in setup; it is not additional time.<//
                >
                <${Text}
                  >Firecracker queues 146.13s and then executes 269.03s,
                  finishing 1.919s before VM. Eliminating its queue alone saves
                  zero under these clocks; accelerating VM alone has about 2s of
                  TestRunner-envelope headroom. Both paths need attention.
                  Native default runfiles and real integration assertions stay
                  intact.
                  ${link(inv(caseBy(16718).invocation), "Exact invocation")}<//
                >
              <//>
              <${Text} my="sm"
                >All five inspected retained-baseline traces report
                cold/fingerprint_mismatch, rather than an unexplained generic
                “slow setup.” The compatibility fingerprint covers
                infrastructure helpers, CRDs, manifests and PKI image indexes;
                it already excludes per-action application images. This small
                selected sample does not establish an avoidable-miss rate.
                Preserve cleanliness, immutable compatibility and exact
                ownership checks. See
                ${link(`${gh}/blob/${e.source_devel_commit}/agentplane/system_tests/k3s/baseline.py`, "baseline owner")}
                and
                ${link(`${gh}/blob/${e.source_devel_commit}/agentplane/system_tests/deployment/stack.py`, "stack lifecycle")}
                before narrowing the key.<//
              >
              ${table(
                [
                  "PR",
                  "NEW tests",
                  "Test process seconds",
                  "Observed test CPU seconds",
                  "Missing CPU actions",
                ],
                e.selected_cases.map((x) => [
                  pr(x.pr),
                  x.fresh_tests,
                  n(x.test_process_s),
                  n(x.test_cpu_s_observed),
                  x.cpu_missing,
                ]),
                850,
              )}
              <${Text} size="sm"
                >Process seconds sum independent physical test actions; CPU is a
                separate resource. Neither is PR elapsed time. Selected exact
                JUnit artifacts contain 34 nonempty cases across six target
                executions, all passed with no errors or skips. Fresh-origin
                GetExecution records only; cached target durations are excluded.
                Major inspected suites exercise readiness, identity/trust, real
                guest/kernel supervision, dispatch and recovery; no volume
                stress workload was identified among these long poles.<//
              >
            </section>
            <section id="queues">
              <${Title} order=${2}
                >The scarce lane is KVM, not every executor<//
              >
              ${table(
                ["Layer", "Observed evidence", "Implication"],
                [
                  [
                    "GitHub Bazel jobs",
                    "52 completed assigned attempts in recent 90min: created→start p50 2s, p90 72s, max 281s",
                    "DAG/trust/concurrency time included. Not a pure runner-starvation distribution.",
                  ],
                  [
                    "Managed outer Remote Bazel runner",
                    "Nested in 529/541s remote envelopes; provider admission not isolated",
                    "Account entitlement and shared capacity unobserved; no free-tier or quota claim.",
                  ],
                  [
                    "Managed inner K3s tests",
                    "Current selected action queues~0.06–0.10s; process 267–413s",
                    "Useful execution, cold setup and guest readiness dominate these records.",
                  ],
                  [
                    "Self-hosted kvm-vm",
                    "2–3 registered and scraped workers; max 3; each 4CPU, 7GiB advertised, one task",
                    "Firecracker requires KVM/Docker isolation. An idle managed worker is not interchangeable.",
                  ],
                  [
                    "Nested K3s",
                    "Readiness, Kubernetes resources and cleanup occur inside TestRunner",
                    "Do not add these waits to RBE queue or infer pod capacity from requested compute units.",
                  ],
                ],
                1000,
              )}
              <${Box}
                my="lg"
                role="img"
                data-chart="capacity"
                aria-label="KVM registered executors, active tasks and local reservations over the recent 90minute window"
                ><${LineChart}
                  h=${290}
                  data=${pools}
                  dataKey="time"
                  series=${[
                    {
                      name: "registered",
                      label: "Registered",
                      color: "blue.6",
                    },
                    {
                      name: "tasks",
                      label: "Tasks in progress",
                      color: "teal.6",
                    },
                    {
                      name: "local_reservations",
                      label: "Local reservations",
                      color: "orange.6",
                    },
                  ]}
                  withLegend
                  withDots=${false}
                  curveType="step"
                  yAxisProps=${{ allowDecimals: false }}
              /><//>
              <${Text}
                >12:25→13:55UTC,361/361 joint 15s observations.
                Registered/scraped count 2–3. Local reservations peak 14;153
                points show reservations while every registered worker has a
                task. Those reservations can duplicate physical actions and are
                not central backlog. Charts display 60s samples; evidence
                retains 15s points.
                ${link("https://grafana.allegedly.works/d/buildbuddy-executor-pool", "Deployed pool dashboard")}<//
              >
              <${Text} my="sm"
                >Historical #16378 is the consequential counterexample:
                Firecracker waits 537.14s, runs 239.00s, finishes 444.392s after
                Pod. Removing its wait would conditionally shorten that 950s
                head by at most 444s(46.8%), before Pod becomes last. During its
                exact 08:03:36→08:12: 33UTC queue, all 36 available 15s samples
                show 3/3 registered workers occupied with positive local
                reservations. This confirms eligible pool saturation in that
                interval. This is fixed-clock headroom, not a prediction that
                one added worker achieves it. Current #16718 instead has zero
                queue-only headroom because VM ties it.<//
              >
              <${Text} size="sm"
                >The complete recent 860-run census contains 2090 job attempts.
                Completed assigned occupancy is 17.98 runner-hours, mean 11.99
                busy runners, peak 38; excludes unfinished jobs and unswept
                older work. It is a lower bound for this repository, not account
                utilization. The separate older-live-run sweep changed 15→14
                rows during pagination and failed; it was not silently accepted
                as complete. CodeQL default setup is currently not
                configured.<//
              >
            </section>
            <section id="probe">
              <${Title} order=${2}>Bounded probe: native runtime cut is real<//>
              <${Text} my="sm"
                >On literal devel
                ${link(`${gh}/commit/${e.source_devel_commit}`, e.source_devel_commit)},
                a CI-configured cquery inspects DefaultInfo.default_runfiles. It
                executes no test bodies. Native targets carry no App runtime
                files; positive App consumers still carry them.
                ${link(inv(e.configured_input_probe.invocation), "Immutable query result")}<//
              >
              ${table(
                ["Configured target", "App runtime files"],
                e.configured_input_probe.targets.map((x) => [
                  x.target,
                  x.app_runtime_file_count,
                ]),
                900,
              )}
              <${Text} my="sm"
                >A second
                ${link(inv(e.configured_input_probe.remaining_path_invocation), "declared-path query")}
                finds
                ${html`<${Code}>native Pod → pod_native_manifests → renderer binary → recipe → fixture_chart → App settings<//>`}.
                The shared renderer still imports App configuration. This can
                broaden selection/build work even though App is absent from test
                runfiles; re-rendering unchanged output can preserve the
                downstream cache. Next probe the exact historical full-PR diffs
                through the production selector and CAS outputs before crediting
                elapsed savings.<//
              >
            </section>
            <section id="options">
              <${Title} order=${2}>Concrete options against the 30% goal<//>
              <${Text} my="sm"
                >Objective: good required coverage with at least 30% lower
                complete backend feedback, progressing toward a four-minute mean
                without excessive compute or lifecycle complexity. Test
                grouping, fixture lifetime and placement are choices; real PKI,
                guest/kernel boundaries, fresh identities, revocation, cleanup
                ownership and unique behavioral assertions are constraints. No
                current alternative is qualified to meet that objective across
                the whole backend class.<//
              >
              ${table(
                [
                  "Priority / architecture",
                  "Change and expected scope",
                  "Decisive experiment / cost",
                ],
                [
                  [
                    "1 · KVM admission tail",
                    "Compare a fourth eligible independent worker or reserved capacity at the pool owner; keep one task per worker. Conditional large-tail opportunity: up to 444s/46.8% on #16378, zero on #16718. A managed VM speedup does not serve this KVM capability.",
                    "Currentmax 3 and strict host spread are explicit. A fourth worker needs a placement/capacity decision, not just higher Bazel jobs. Repeat three four-PR-equivalent bursts including a scale-down start only after changing that constraint; prior four-on-three burst already queued 215s. Track full gates, registration, load and drain; recurring 4CPU/8GiB guest plus disk per added worker. No deployed change made.",
                  ],
                  [
                    "2 · Shorten several setup/readiness paths together",
                    "Keep the merged native partition; separate App-specific chart composition/settings from the common renderer where output equivalence permits. Then identify actual baseline component changes and safe retained-vs-fresh boundaries. Current cold setup 77–125s and~25s certified cleanup are observed envelopes, not fully removable work.",
                    "First replay full historical App/backend PR diffs on literal current source; compare affected targets, renderer bytes, NEW actions and final gates. For retention, compare exact component digests and same-source cold/warm graphs; exercise dirty, changed binary/CRD and failed-cleanup rejection. No savings forecast until avoided work is demonstrated. Input probe above already tests the runtime-cut assumption.",
                  ],
                  [
                    "3 · Faster VM execution with adequate independent capacity",
                    "A real-KVM VM test path is plausible; earlier same-source canaries were faster than managed TCG, but cache/resources differed and the existing KVM pool is already contended. Moving VM into that pool unchanged can worsen feedback.",
                    "Provision/routable capacity is the changed constraint required before another placement trial. Preserve both real harnesses, systemd/kernel proof, History, suspend/recovery and teardown. Model at leasttwo KVM actions per PR; four simultaneous PRs need up toeight independent slots. Compare whole graphs and queue tails, not isolated boot times; substantial recurring capacity/maintenance cost.",
                  ],
