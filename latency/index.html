<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CI latency</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript>This report uses JavaScript for charts and disclosures.</noscript>
    <script type="module">
      import {
        Accordion,
        Anchor,
        Box,
        Code,
        Container,
        Group,
        Stack,
        Table,
        Text,
        Title,
      } from "@mantine/core";
      import { BarChart } from "@mantine/charts";
      import { html, mount } from "../report.js";

      const evidenceSha =
        "f804324badff4d5cb13d4bfacaa08caabf19c3c0aacf70b9548ec3ee8a2cf1dc";
      const response = await fetch(`./evidence.json?v=${evidenceSha}`);
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const bytes = await response.arrayBuffer();
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      if (
        Array.from(new Uint8Array(digest), (n) =>
          n.toString(16).padStart(2, "0"),
        ).join("") !== evidenceSha
      )
        throw new Error("Evidence does not match this report");
      const e = JSON.parse(new TextDecoder().decode(bytes));
      const repo = "https://github.com/agentydragon/ducktape";
      const link = (href, name) => html`<${Anchor} href=${href}>${name}<//>`;
      const pr = (n) => link(`${repo}/pull/${n}`, `#${n}`);
      const run = (n, label) => link(`${repo}/actions/runs/${n}`, label);
      const job = (n, id, label) =>
        link(`${repo}/actions/runs/${n}/job/${id}`, label);
      const inv = (id, label) =>
        link(`https://app.buildbuddy.io/invocation/${id}`, label);
      const prior = (fragment, label) =>
        link(
          `${repo}/blob/${e.previous_report_commit}/latency/index.html${fragment}`,
          label,
        );
      const source = (path, label) =>
        link(`${repo}/blob/${e.source_devel_commit}/${path}`, label);
      const values = (data) =>
        data?.n ? `${data.p50} / ${data.p90} s (${data.n})` : "—";
      const table = (headers, rows, width = 540) =>
        html` <${Table.ScrollContainer}
          minWidth=${width}
          type="native"
          maw="100%"
        >
          <${Table} striped verticalSpacing="sm">
            <${Table.Thead}
              ><${Table.Tr}
                >${headers.map((label) => html`<${Table.Th} key=${label}>${label}<//>`)}<//
              ><//
            >
            <${Table.Tbody}
              >${rows.map((cells, i) => html`<${Table.Tr} key=${i}>${cells.map((item, j) => html`<${Table.Td} key=${j}>${item}<//>`)}<//>`)}<//
            >
          <//>
        <//>`;
      const disclosure = (label, contents) =>
        html` <${Accordion} variant="contained">
          <${Accordion.Item} value=${label}>
            <${Accordion.Control}>${label}<//>
            <${Accordion.Panel}>${contents}<//>
          <//>
        <//>`;
      const classes = [
        ["Same-repo opening", "same_repo_open"],
        ["Same-repo update", "same_repo_update"],
        ["Trusted-fork opening", "fork_open"],
        ["Trusted-fork update", "fork_update"],
      ];
      const greenChart = classes.slice(0, 2).map(([name, key]) => ({
        name: name.endsWith("opening") ? "Opening" : "Update",
        Baseline: e.baseline.summary[key].green_s.p50,
        Latest: e.latest[key].green_s.p50,
        Goal: Math.round(e.baseline.summary[key].green_s.p50 * 0.7),
      }));
      const latestHeads = e.fixed_windows.at(-1).heads;
      const headCounts = (summary) =>
        summary ? `${summary.n} (${summary.outcomes.cancelled ?? 0})` : "0 (0)";
      const driver = e.latest_gate_breakdown;
      const recovery = e.public_cache_recovery;
      const gateNames = [
        ["Pre-commit", "precommit"],
        ["Bazel", "bazel"],
        ["Artifacts and imports", "artifacts_and_imports"],
      ];
      const outcomeTime = (r) =>
        r.required_green_s ?? r.actionable_red_s ?? null;
      const traceRows = latestHeads.map((r) => [
        html`${pr(r.pr)} <${Code}>${r.sha.slice(0, 8)}<//>`,
        r.stratum.endsWith("_open") ? "Opening" : "Update",
        r.superseded_by ? "Superseded / canceled" : r.required_outcome,
        outcomeTime(r) == null ? "—" : `${outcomeTime(r)} s`,
        html`<${Code}>${r.tested_merge.slice(0, 8)}<//> ${r.precommit_profile}`,
        html`<${Group} gap="xs"
          >${r.gates.map((g) => link(g.url, g.gate === "Pre-commit checks" ? "Pre-commit" : g.gate.startsWith("bazel-ci") ? "Bazel" : "Artifacts"))}<//
        >`,
      ]);

      function Report() {
        return html`<${Container}
          component="main"
          size="73rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
        >
          <${Stack} gap="xl">
            <header>
              ${link("../", "Ducktape reports")}
              <${Title} order=${1} my="sm">CI feedback latency<//>
              <${Text} size="lg"
                >The latest production window fell short of the 30% goal. Twelve
                of 16 heads reached required green. Median green took 330 s for
                seven openings and 445 s for five updates, versus 199.5 s and
                259 s in the baseline. Pre-commit finished last on ten greens
                during a public Nix cache incident.<//
              >
              <${Text} mt="sm" size="sm" c="dimmed"
                >Latest arrivals on 24 November, 00:10:01–00:50:00 UTC. Baseline
                from 22 November 00:00 through 23 November 22:49:59 UTC.
                Inspected devel <${Code}>${e.source_devel_commit}<//><//
              >
              <${Text} mt="sm" size="sm"
                >${link("#paired-precommit", "Matched pre-commit trial during the incident")}<//
              >
            </header>

            <section id="latest">
              <${Title} order=${2}>Required green by head type<//>
              <${Text} my="sm"
                >The census covers 11 same-repo openings and five updates. One
                opening reached actionable red at 191 s and required red at 198
                s. Three original opening heads were canceled as replacements
                arrived. No eligible head lacked ordinary CI and no fork heads
                arrived. Five stacked heads were outside the devel census.
                ${" "}${inv("ca9cbbb6-87d6-5283-86bf-5c57bce8c4a2", "CoreJS axiom-audit failure")}<//
              >
              <${Text} size="sm" c="dimmed"
                >Median required-green time (seconds)<//
              >
              <${Box}
                role="img"
                data-chart="required-green"
                aria-label="Median required-green seconds before the rollout, in the latest window, and at the 30 percent improvement goal"
              >
                <${BarChart}
                  h=${245}
                  withLegend
                  dataKey="name"
                  data=${greenChart}
                  series=${[
                    { name: "Baseline", color: "blue.7" },
                    { name: "Latest", color: "orange.7" },
                    { name: "Goal", color: "teal.7" },
                  ]}
                  yAxisProps=${{ width: 37 }}
                />
              <//>
              <${Text} my="sm"
                >Three heads were green by five minutes and nine by ten. Using
                the baseline's opening and update proportions, the share green
                by five minutes was 15.0% versus 39.4%. By ten minutes it was
                61.0% versus 54.6%. All 16 heads had aged into both horizons.
                The small samples and different workloads limit rollout
                attribution.<//
              >
              ${disclosure("Exact heads and required checks", table(["PR head", "Kind", "Outcome", "Time to signal", "Tested merge and profile", "Job links"], traceRows, 740))}
            </section>

            <section id="cohorts">
              <${Title} order=${2}>Comparable clocks and distinct arrivals<//>
              <${Text} my="sm"
                >Openings start at PR creation. Updates start at the first
                matching workflow creation on the exact head. Green is the last
                of the three required successes. Actionable red is the first
                exact-head published failure or failed required check. The
                historical fork rows below use required red because the earlier
                signal attaches to the tested merge. Review, mergeability and
                agent delivery are separate clocks.<//
              >
              ${table(
                [
                  "PR class",
                  "Baseline heads (canceled)",
                  "Baseline green p50/p90 (n)",
                  "Latest heads (canceled)",
                  "Latest green p50/p90 (n)",
                  "Baseline red p50/p90 (n)",
                  "Latest red p50/p90 (n)",
                ],
                classes.map(([label, k]) => [
                  label,
                  headCounts(e.baseline.summary[k]),
                  values(e.baseline.summary[k].green_s),
                  headCounts(e.latest[k]),
                  values(e.latest[k]?.green_s),
                  values(e.baseline.summary[k].actionable_red_s),
                  values(e.latest[k]?.actionable_red_s),
                ]),
                820,
              )}
              <${Text} my="sm" size="sm"
                >The baseline sampled 195 of 1,228 heads. Recovering historical
                synthetic merge refs corrected the same-repo classes to 51
                measured openings out of 337 and 24 measured updates out of 276,
                with the sampled heads and original selection weights preserved.
                Baseline opening red includes two heads that published failure
                and were later canceled.<//
              >
              <${Text} my="sm" size="sm"
                >Exact tested merges show that all 16 heads used sparse checkout
                and the Nix launcher. Fifteen installed ${" "}
                <${Code}>.#precommit<//>. Only the Rustfmt proposal's own check
                installed <${Code}>.#precommit-ci<//>. Excluding that head
                raises the opening-green median to 353 s. The direct installer
                and the combined scanner proposal had yet to roll out.${" "}
                ${pr(19578)} · ${pr(19640)} · ${pr(19653)}<//
              >
              ${disclosure(
                "Earlier fixed rollout windows",
                html`<${Stack} gap="sm">
                  ${table(
                    [
                      "Arrival window (UTC)",
                      "Heads and outcomes",
                      "Green or red clocks",
                    ],
                    [
                      [
                        "23:18:44–23:38:59",
                        "31 · 29 green, 2 canceled",
                        "Open green 266 / 456 s (21). Update green 395.5 / 479 s (8). p50 / p90.",
                      ],
                      [
                        "23:39:00–23:44:39",
                        "4 · 2 green, 2 red",
                        "Open green at 468 and 540 s. Open red at 438 s and update red at 416 s; required failures followed at 538 s and 505 s.",
                      ],
                      [
                        "23:50:26–23:55:25",
                        "7 · all green",
                        "Open green at 418, 492 and 578 s. Update green at 376, 383, 448 and 617 s.",
                      ],
                      [
                        "23 Nov 23:56:00–24 Nov 00:10:00",
                        "11 · 5 green, 3 red, 2 canceled, 1 superseded",
                        "Open green 452.5 / 498 s (4). Update green at 465 s (1), and update red 394 / 460 s (3). p50 / p90.",
                      ],
                    ],
                    600,
                  )}
                  <${Text}
                    >The first window inherited sparse Bazel checkout,
                    host-profile sharding, and block storage reuse. Six heads
                    included linked-program sharding. The later windows included
                    the new resolver source but no fork exercised it. All four
                    windows used the Nix launcher. The two later windows around
                    midnight also inherited the Lean partition and cdk8s
                    classification. ${pr(19582)} · ${pr(19580)} · ${pr(19587)} ·
                    ${pr(19603)} · ${pr(19596)} · ${pr(19623)}<//
                  >
                  <${Text} size="sm"
                    >The evidence records each original attempt and its gates.
                    These are bounded observations between 22 and 24 November,
                    with unsampled intervals and no seven-day post-rollout
                    series. ${link("./evidence.json", "Cohort evidence")}<//
                  >
                <//>`,
              )}
            </section>

            <section id="latest-drivers">
              <${Title} order=${2}
                >The Nix cache stalled pre-commit on ten greens<//
              >
              <${Text} my="sm"
                >Pre-commit finished a median of 173.5 s after the next gate on
                those ten heads. Setup took a median of 368 s and hooks took 15
                s. Nix installation took 3.79 s and the evaluation and
                realization plan took 17.49 s. The interval from the compiler
                copy announcement to the dependent Rustfmt copy or stream error
                was 335.44 s at the median. Rustfmt skipped on all ten heads.<//
              >
              ${table(
                [
                  "Required gate",
                  "Median hosted wait",
                  "Median job runtime",
                  "Last on green",
                ],
                gateNames.map(([label, key]) => [
                  label,
                  `${driver.runner_admission_median_s[key]} s`,
                  `${driver.job_duration_median_s[key]} s`,
                  `${driver.last[key]} / ${driver.greens}`,
                ]),
                540,
              )}
              <${Text} my="sm"
                >The public cache process was OOM-killed at 00:49:12 UTC with an
                8 GiB limit. At 00:48:30 its working set was 7.989 GiB. The
                ordinary PR and independent full replay reported HTTP/2 framing
                errors for the same pinned Rust compiler stream within 13 ms of
                each other in the restart second. The memory measurements do not
                identify which operations consumed that memory.${" "}
                ${job(45299462842, 138128057878, "Ordinary pre-commit log")}
                ·${" "} ${job(45299454803, 138128032136, "Full replay log")}<//
              >
              <${Text} my="sm"
                >After restart, four successful ordinary devel-targeting jobs
                used the same full profile and pinned compiler. The median
                interval to the dependent Rustfmt copy fell to${" "}
                ${recovery.transfer_median_s.toFixed(2)} s (10.34–16.79 s). The
                entire pre-commit job took ${recovery.job_median_s} s at the
                median. This targeted job-log read through 01:08 UTC measures
                cache recovery. All-gates timing was not collected for those
                heads.${" "}
                ${job(45301879131, 138136133865, "Full-profile recovery log")}<//
              >
              <${Text} size="sm"
                >Even with pre-commit finishing before both other gates on every
                green, the measured other gates leave optimistic medians of 168
                s for openings and 216 s for updates. The historical 30% targets
                are about 140 s and 181 s. Bazel was last on 136 of 138 baseline
                greens.<//
              >
            </section>

            <section id="experiments">
              <${Title} order=${2}>What the experiments shortened<//>
              <${Stack} gap="md" mt="sm">
                <${Text}
                  ><strong>Pre-commit bootstrap.</strong> The candidate gate
                  completed in 89 s, with 56 s of Nix setup and 16 s of hooks.
                  It skipped Rustfmt using the existing matcher and deferred
                  417.4 MiB of unpacked Nix closure. Rust-using changes retain
                  the original compiler and formatter. The two historical replay
                  gates spent 309 s and 383 s in setup. Their logs stalled
                  between announcing the compiler and its dependent formatter.
                  Those and the one hosted candidate are unmatched observations.
                  Its own proposed change was the sole treated head in the
                  latest devel-targeting window. ${" "}${pr(19640)} ·
                  ${job(45295577252, 138114986539, "Hosted candidate")}<//
                >
                <${Text} size="sm"
                  >A stacked follow-up defers another 1.24 GiB of the initial
                  closure by realizing Ansible and Checkov only on demand. It
                  matched production scanner exit codes on valid and invalid
                  inputs. In one unpaired stacked PR outside the devel census
                  all required checks passed in 98 s, with pre-commit taking 62
                  s, including 37 s of setup and 11 s of hooks. Another gate
                  finished last. ${pr(19653)}<//
                >
                <${Text}
                  ><strong>Bazel launcher.</strong> Three fresh hosted starts
                  per arm reached working CLIs in median 34 s with Nix setup, 22
                  s with the prebuilt image, and 13 s with direct
                  checksum-verified downloads. The image was 205 MiB compressed.
                  Its layer comparison overlapped, so it adds no evidence for a
                  layer override. Every direct-install sample was faster than
                  every image or Nix sample and had not been adopted in these
                  cohorts. ${run(45287501810, "Hosted three-arm benchmark")} ·
                  ${run(45289827845, "Image layer trial")} · ${pr(19578)}<//
                >
                <${Text}
                  ><strong>Exact full-gate replay.</strong> On two immutable
                  historical merge trees, sparse checkout plus direct install
                  shortened setup before the BuildBuddy step by 24 s on green
                  and 42 s on red. Both green arms reached all gates at +607 s,
                  waiting for shared pre-commit. Indexed ordinary red appeared
                  at +584.20 s and +583.37 s. They shared the failing RBE
                  action. The control also hit an Electric container-loading
                  error whose structured abort events followed the failed-test
                  summary. This pair establishes launch savings. Its shared and
                  differing execution paths prevent an independent red estimate.
                  The baseline's launcher-only replay bounded the weighted
                  median at 192 → 168 s with all launcher time removed and other
                  clocks fixed. ${run(45292001590, "Fixed-workload replay")} ·
                  ${inv("1778e54a-0817-5797-a3ac-fe8474c7d50f", "Red control")}<//
                >
                <${Text}
                  ><strong>Block storage control plane.</strong> One real
                  envtest API server and etcd replaced six per process. All nine
                  cases still passed in each of three repetitions per arm with
                  real loop devices. The median action fell from 39.00 s to
                  32.12 s and median pytest time from 30.64 s to 13.07 s on
                  different workers. #19587 landed at 23:17:41 UTC. Its isolated
                  savings do not supply a PR-level estimate.${" "}${pr(19587)} ·
                  ${inv("9ffcc6e4-635a-402a-9eb6-93865e21da52", "Parent tests")}
                  ·
                  ${inv("5be30f7e-e215-40e9-baea-67dceeec765d", "Candidate tests")}<//
                >
              <//>
            </section>

            <section id="paired-precommit">
              <${Title} order=${2}
                >The slim profile avoided the cache stall in a matched replay<//
              >
              <${Text} my="sm">
                A separate dispatch at 00:43:22 UTC on 24 November used the same
                two-Nix-file workload on all four runners. Each started at +3 s
                and passed. Both arms share Bazel (+102 s, zero affected
                targets) and the real artifacts/imports check (+152 s). Full
                pre-commit finished at +374 s and slim pre-commit finished at
                +69 s. The last required gate moved from pre-commit to
                artifacts/imports. Relative to dispatch, all three gates passed
                at +152 s with slim pre-commit, down from +374 s with full
                pre-commit (59.4% earlier).${" "}
                ${run(45299454803, "Matched dispatch")} ·${" "}
                ${link(repo + "/commit/8ec08d64147f8a7babc19e763575ec66ea48b299", "Tested merge")}
              <//>
              <${Text} size="sm">
                Full Nix setup took 336 s and hooks 13 s. Slim setup took 28 s
                and hooks 12 s. The full job's public Attic rustc NAR transfer
                returned HTTP 200 and failed after 304.7 s with an HTTP/2
                framing error. Nix retried and the job passed. The slim job
                avoided fetching rustc. Fresh Ubuntu 26.04 hosts used different
                image revisions and regions (westus and us-west-2). This elapsed
                comparison captures avoidance of the shared cache incident on
                one stacked workload. The recovered full-profile jobs supply no
                evidence of an ongoing 335 s per-job saving. A matched
                healthy-cache comparison remains unmeasured.${" "}
                ${job(45299454803, 138128032136, "Full pre-commit log")}
              <//>
            </section>

            <section id="runner-demand">
              <${Title} order=${2}
                >A devel publication fanout overlapped seven queued PRs<//
              >
              <${Text} my="sm"
                >During 23:50:26–23:55:25 UTC, seven PR Bazel jobs waited 58–170
                s for a hosted runner, median 82 s. The census counted 36–40
                concurrent executing jobs in this repository, with 11,791
                runner-seconds across 113 jobs. Image and release jobs from one
                failed devel push accounted for 4,562 runner-seconds in that
                window. The matched replay accounted for 1,239. These counts
                describe observed overlap. The account limit, other
                repositories’ load and counterfactual PR wait are unknown.
                ${" "}${run(45290550409, "Failed devel publication")}<//
              >
              <${Text}
                >The failed devel run selected 55 images and 70 releases after
                its ordinary test failure skipped the normal build. All 55
                images and 44 releases were confirmed no-ops. In a read-only
                replay on the exact failed SHA, the 296.312 s normal build
                returned enough outputs for 53 unchanged images and 67 already
                published release digests. The replay would schedule five jobs
                in place of 125. Two external OCI cases and three release cases
                still lack matching evidence. The 120 omitted jobs consumed
                14,223 runner-seconds in the historical run. No queue
                improvement was measured. ${pr(19642)} ·
                ${inv("675a900f-329d-4a92-bc71-f150b975ec75", "Read-only replay")}<//
              >
              <${Text} mt="sm" size="sm"
                >Only one of six failed Bazel runs in the latest 100 devel
                pushes was the exit-3 case addressed here. Five exited 1,
                including four OCI manifest errors on the Electric pin already
                redirected by #19573. The branch's focused tests passed. Its
                full CI hit a separate Lean audit failure. ${pr(19573)} ·
                ${inv("93848b4d-ad67-4d0f-b46e-8616be39d477", "Focused validation")}<//
              >
            </section>

            <section id="fork-red">
              <${Title} order=${2}
                >Earlier fork red was already published on the tested merge<//
              >
              <${Text} my="sm"
                >All 17 Bazel-red fork heads in the baseline published earlier
                live status on their exact tested merge. The lead was 4–315 s,
                median 78 s. Fourteen statuses named a failed test. The other
                eight red forks were merge conflicts and stopped before Bazel.
                On an open fork GitHub’s Checks tab and CLI omitted the live
                status even though the current potential merge carried it.
                ${" "}${link(`${repo}/pull/19357/checks`, "Fork check view")}<//
              >
              <${Text}
                >${pr(19648)} adds the read-only
                <${Code}>bbapi invocation pr-status<//> lookup. Replaying the 17
                historical PR heads took median 2.28 s per read. It recovered 15
                reds and selected the newer green attempt for the other two. It
                identifies the tested merge and current base, and displays a
                pending or stale signal explicitly. These are read-only queries
                to existing GitHub and BuildBuddy APIs. The required Bazel check
                retains the final verdict.
                ${" "}${inv("85f63c62-c101-4c33-bf31-0fdb778c839f", "Focused tests")}<//
              >
            </section>

            <section id="next">
              <${Title} order=${2}>Next measurements<//>
              <${Stack} gap="sm" mt="sm">
                <${Text}
                  ><strong
                    >1. Measure the pre-commit and direct-installer rollout on
                    consecutive heads.</strong
                  >
                  Anchor to merge times and verify the installer and profile in
                  each job log. Record cache health alongside required feedback
                  on openings, updates and forks. Keep Rust-using heads visible
                  because they realize the deferred closure.<//
                >
                <${Text}
                  ><strong
                    >2. Measure publication suppression during naturally
                    overlapping work.</strong
                  >
                  The exit-3 replay justifies a focused change. Read the next
                  qualifying devel push against actual selected publication
                  jobs, runner occupancy and PR starts. Keep PR failure timing,
                  the normal build result and release evidence distinct.<//
                >
                <${Text}
                  ><strong
                    >3. Watch proof and provider chains where Bazel stays
                    last.</strong
                  >
                  Capture the inner worker and outer admission clocks
                  separately. The current Bazel queue measurements do not
                  justify adding remote workers. Compare matched proof and
                  provider edits before trading coverage for seconds.
                  ${" "}${link("../ci-test-cost/", "Test cost and split evaluation")}<//
                >
              <//>
            </section>

            <section id="prior">
              <${Title} order=${2}>Prior dated observations<//>
              <${Text} my="sm"
                >The preceding report sampled 24 same-repository heads per day
                from 15–21 November, with a partial 22 November point. 126 of
                168 heads reached required green in the seven complete days.
                That median was 186 s and p90 was 576 s from CI workflow
                creation. The earlier clock and sampling design form a separate
                trend from the new baseline.
                ${" "}${prior("#weekly-trend", "21 November trend and source")}<//
              >
              ${disclosure(
                "Previous daily trend and KVM measurements",
                html`<${Stack} gap="md">
                  <${Text} size="sm" c="dimmed"
                    >Required-green time (minutes)<//
                  >
                  <${Box}
                    role="img"
                    data-chart="archived-trend"
                    aria-label="Prior median and p90 minutes to required green for 15 to 22 November"
                  >
                    <${BarChart}
                      h=${225}
                      withLegend
                      dataKey="day"
                      data=${e.archived_observation.daily.map((d) => ({ day: d.day.slice(8) + (d.day.endsWith("-22") ? "*" : ""), Median: +(d.median_s / 60).toFixed(2), P90: +(d.p90_s / 60).toFixed(2) }))}
                      series=${[
                        { name: "Median", color: "blue.7" },
                        { name: "P90", color: "orange.7" },
                      ]}
                      yAxisProps=${{ width: 32 }}
                    />
                  <//>
                  ${table(
                    [
                      "UTC date",
                      "Eligible",
                      "Sampled",
                      "Green",
                      "Median / p90",
                    ],
                    e.archived_observation.daily.map((d) => [
                      d.day + (d.day.endsWith("-22") ? " through 11:40" : ""),
                      d.eligible_heads,
                      d.sampled,
                      d.outcomes.green ?? 0,
                      `${d.median_s} / ${d.p90_s} s`,
                    ]),
                    510,
                  )}
                  <${Text}
                    >In that prior sample Bazel was last on 118 of 126 greens.
                    Moving Bazel 60 s earlier in an offline replay lowered p90
                    from 576 to 516 s. The six-hour 22 November KVM sample had
                    room for another VM suite in 208 of 254 fully observed
                    samples with queued reservations. The Firecracker packing
                    comparison kept the final completion near 17 minutes but
                    delayed the first result and failed a live-guest case on
                    repeat. These observations still support keeping the
                    two-to-eight worker range and one Firecracker test per 8 GiB
                    worker. ${prior("#current-clocks", "Gate replay")} ·
                    ${prior("#kvm-capacity", "KVM sample")} ·
                    ${prior("#kvm-pilot-results", "Packing and seeding trials")}<//
                  >
                <//>`,
              )}
            </section>

            <footer>
              <${Group} gap="md">
                ${link("./evidence.json", "Reviewed evidence")}
                ${link("./manifest.json", "Manifest")}
                ${link(`${repo}/blob/${e.prior_snapshot_commit}/latency/index.html`, "Previous snapshot")}
                ${link(`${repo}/rules?ref=refs%2Fheads%2Fdevel`, "Current branch rules")}
                ${source(".github/workflows/bazel-ci.yml", "Inspected Bazel workflow")}
              <//>
            </footer>
          <//>
        <//>`;
      }

      mount(Report);
    </script>
