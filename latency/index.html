    <link rel="stylesheet" href="../report.css" />

    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",

          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",

          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",

  <body>
    <div id="report-content"></div>
    <noscript>This report uses JavaScript for charts and disclosures.</noscript>
    <script type="module">
      import {
        Accordion,
        Anchor,
        Box,
        Container,
        Group,
        Paper,
        SimpleGrid,
        Stack,
        Table,
        Text,
        Title,
      } from "@mantine/core";
      import { BarChart, LineChart } from "@mantine/charts";
      import { html, mount } from "../report.js?v=ebc2503d323c1b76";
      const response = await fetch(
        "./evidence.json?v=6319dd011142f35ead5e669e0a5235c722d1983053a42bee54d18404892b0a26",
      );
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const evidence = await response.json();
      const gh = "https://github.com/agentydragon/ducktape";
      const source = evidence.source_devel_commit;
      const post = "after shadow retired";
      const groups = evidence.groups.filter((g) => g.period === post);
      const byPr = new Map(evidence.cases.map((c) => [c.pr, c]));
      const link = (href, label) => html`<${Anchor} href=${href}>${label}<//>`;
      const pr = (n) => link(`${gh}/pull/${n}`, `#${n}`);
      const file = (path, label) => link(`${gh}/blob/${source}/${path}`, label);
      const prior = `${gh}/blob/${evidence.prior_report_commit}/latency`;
      const seconds = (v) =>
        v == null ? "Unknown" : `${Number(v.toFixed(2))}s`;
      const time = (v) => {
        if (v == null) return "Unknown";
        const s = Math.round(v);
        return `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`;
      };
      const utc = (s) => s?.slice(11, 19) ?? "Unknown";
      const short = (label) => label?.split(":").at(-1) ?? "Unknown";
      const job = (j, label) => link(j.html_url, label);
      const build = (i, label) =>
        link(`https://app.buildbuddy.io/invocation/${i}`, label);
      const table = (headers, rows, width = 600) => html`
        <${Table.ScrollContainer} minWidth=${width}>
          <${Table} striped withTableBorder style=${{ overflowWrap: "normal" }}>
            <${Table.Thead}
              ><${Table.Tr}
                >${headers.map((h) => html`<${Table.Th}>${h}<//>`)}<//
              ><//
            >
            <${Table.Tbody}
              >${rows.map((row) => html`<${Table.Tr}>${row.map((v) => html`<${Table.Td}>${v}<//>`)}<//>`)}<//
            >
          <//>
        <//>
      `;
      const titles = {
        "Agentplane backend": "Backend",
        "Agentplane tests / fixtures": "Fixtures",
        Documentation: "Docs",
        Frontend: "Frontend",
        "Other code / tooling": "Tooling",
        "Other infrastructure": "Other infra",
        "cdk8s infrastructure": "cdk8s",
      };
      const phases = evidence.kvm_pool.timeline
        .filter(
          (_, i) => i % 10 === 0 || i === evidence.kvm_pool.timeline.length - 1,
        )
        .map((r) => ({
          ...r,
          utc: new Date(r.at * 1000).toISOString().slice(11, 16),
        }));
      const failureRows = [18106, 18243, 18254, 18256, 18273].map((n) => {
        const c = byPr.get(n);
        return [
          pr(n),
          evidence.rerun_causes[n],
          time(c.failure_before_job_red_s),
          time(c.prior_red_to_retry_job_created_s),
          time(c.feedback_s),
          html`${job(c.jobs[0], "Attempt 1")} ·
          ${build(c.attempts[0].inner, "Bazel")}`,
        ];
      });
      const comparable = evidence.groups.filter(
        (g) => g.group === "Agentplane backend",
      );
      function Report() {
        return html`<${Container} component="main" size="72rem" py="xl" style=${{ overflowWrap: "anywhere" }}>
          <${Stack} gap="xl">
            <header>
              ${link("../", "Ducktape reports")}
              <${Title} order=${1} mt="md" mb="xs">PR time to green<//>
              <${Text} size="lg">Across 13–19 November, 247 of 350 sampled heads reached green. Median ${time(evidence.weekly_feedback.pooled.median_s)} · p90 ${time(evidence.weekly_feedback.pooled.p90_s)} among those heads, including five successful reruns.<//>
              <${Text} c="dimmed" size="sm" mt="sm">Seven complete UTC days · Backend cutover follow-up updated 20 November · Inspected devel ${evidence.source_devel_commit}<//>
              <${Group} gap="md" mt="xs">${link("./evidence.json", "Evidence")}${link("./manifest.json", "Manifest")}<//>
            </header>
            <section id="weekly-trend">
              <${Title} order=${2}>Daily time to green · 13–19 November<//>
              <${Text} my="sm">50 sampled PR heads per UTC day across change classes. Time starts at CI workflow creation and ends when all three required checks pass. Failed or unfinished heads contribute to the sample count only. Changes in the daily PR mix can move both lines.<//>
              <div role="img" aria-label="Median and 90th percentile minutes to required green by UTC day">
                <${LineChart} h=${225} data=${evidence.weekly_feedback.daily.map((d) => ({ day: d.day.slice(8), median: d.median_s / 60, p90: d.p90_s / 60 }))} dataKey="day" series=${[
                  { name: "median", label: "Median", color: "blue.6" },
                  { name: "p90", label: "p90", color: "orange.6" },
                ]} withLegend curveType="linear" yAxisLabel="Minutes" yAxisProps=${{ tickFormatter: (v) => String(v) }} valueFormatter=${(v) => time(v * 60)} />
              </div>
              <${Accordion} variant="contained"><${Accordion.Item} value="weekly-counts"><${Accordion.Control}>Daily times and included heads<//><${Accordion.Panel}>
                ${table(
                  ["November UTC", "Green / sampled", "Median", "p90"],
                  evidence.weekly_feedback.daily.map((d) => [
                    d.day,
                    `${d.n} / ${d.sampled}`,
                    time(d.median_s),
                    time(d.p90_s),
                  ]),
                  330,
                )}
              <//><//><//>
            </section>
            <section id="cohort">
              <${Title} order=${2}>20 November follow-up · PR time by change class<//>
              <${Text} my="sm">From the first observed CI workflow creation for the exact head to the last accepted required check. Backend heads took 10m24s at the median and 23m27s at p90. The 67 post-shadow heads include 60 green, one failed, five canceled and one incomplete. Green timing includes successful reruns. Push time, historical merge eligibility and agent receipt remain unobserved.<//>
              <${Box} role="img" data-chart="pr-feedback" aria-label="Median and p90 minutes to required checks passing by change class">
                <${BarChart} h=${290} data=${groups.map((g) => ({ class: titles[g.group], Median: g.green.p50 / 60, p90: g.green.p90 / 60 }))}
                  dataKey="class" series=${[
                    { name: "Median", color: "blue.6" },
                    { name: "p90", color: "orange.6" },
                  ]}
                  orientation="vertical" yAxisProps=${{ width: 76 }} xAxisLabel="Minutes" withLegend valueFormatter=${(v) => time(v * 60)} />
              <//>
              ${table(
                [
                  "Change class",
                  "Sample / frame",
                  "Green",
                  "Failed / canceled / incomplete",
                  "Median",
                  "p90",
                  "Mean",
                ],
                groups.map((g) => [
                  g.group,
                  `${g.heads} / ${g.frame}`,
                  g.green.n,
                  [
                    g.outcomes.failed ?? 0,
                    g.outcomes.cancelled ?? 0,
                    g.outcomes.incomplete ?? 0,
                  ].join(" / "),
                  time(g.green.p50),
                  time(g.green.p90),
                  time(g.green.mean),
                ]),
                750,
              )}
              <${Text} size="sm" mt="sm">Test & Build finished last on all 60 green heads. A modeled 60-second reduction to Test & Build would save 54 seconds per green head on average. The imports gate would become last on 14 heads and Pre-commit on one, with their clocks held fixed.<//>
            </section>
            <section id="vm-shadow">
              <${Title} order=${2}>VM cutover follow-up<//>
              <${Text} my="sm">Required VM CI moved to recycled cluster KVM at 05:41 UTC. The managed TCG shadow stopped at 07:36 UTC. KVM was faster in 97 of 100 manual pairs on 89 revisions, with a median paired saving of 4m28s and 2 first-attempt failures versus 23 on managed TCG. Warm fixture exposure differed across arms. Four fresh devel pairs also favored KVM. These clocks cover the VM test.<//>
              ${table(
                [
                  "Backend head window",
                  "Green / sampled",
                  "Median",
                  "p90",
                  "Mean",
                ],
                comparable.map((g) => [
                  g.period,
                  `${g.green.n} / ${g.heads}`,
                  time(g.green.p50),
                  time(g.green.p90),
                  time(g.green.mean),
                ]),
              )}
              <${Text} mt="sm">After retirement, the median was 9m31s on 12 one-attempt heads and 21m06s on five rerun heads. Different source changes, cache states and failures across the windows prevent a routing-effect estimate. On 12 successful first attempts with physical test records, the latest physical test was Pod on three, Firecracker on three, VM on two, and another test on four.<//>
              <${Text} mt="sm">Keep measuring for seven days through 27 November, or until 50 fresh required VM executions if that takes longer. Count VM failures and VM-last heads on verified cutover ancestry, report warm and cold separately, and retain managed Pod and Firecracker competitors on the same heads. A PR and a devel run both hit the namespace guard when a recycled fixture needed a rebuild. Keep tracking fresh exposure after the rebuild path is repaired.<//>
              <${Text} size="sm" mt="sm">${pr(18046)} routing · ${pr(18079)} shadow retirement · ${link("../vm-pairs.json", "Paired data")} · ${link(`${prior}/index.html#vm-shadow`, "Previous review")}<//>
            </section>
            <section id="reruns">
              <${Title} order=${2}>Failure recovery drove the backend tail<//>
              <${Text} my="sm">The informational BuildBuddy status preceded final red by 4 seconds to 10m32s. For #18243, an early test failure was followed by 7m42s of ongoing CI before final red, then 11m03s until GitHub created the next job. Assignment on that retry took 2s. GitHub identifies the triggering account type as User on these five retries. The request source and reason for the interval are unobserved.<//>
              ${table(["PR", "First failure", "Live failure → job red", "Red → retry job created", "Time to green", "Evidence"], failureRows, 860)}
              <${Text} size="sm" mt="sm">PR subscriptions receive completed check-run facts and commit statuses by default. The linked status timestamps measure GitHub publication. The completed job logs and selected BuildBuddy artifacts were readable during review. First queryability, webhook delivery, inbox acknowledgement and harness receipt need separate clocks. ${file("agentplane/notification_service/docs/agents/github.md", "Subscription behavior")}<//>
            </section>
            <section id="cases">
              <${Title} order=${2}>What finished last on green heads<///>
              <${Text} my="sm">All times in the middle columns are UTC. The GitHub Test + Build + lint step includes outer Remote Bazel allocation and setup, inner Bazel, any subsequent build and finalization. The phase data leave outer allocation unresolved.<///>
              ${table(
                [
                  "PR",
                  "CI workflow",
                  "Job starts",
                  "Remote step",
                  "Inner test",
                  "Bazel critical-path test",
                  "Required green",
                ],
                [18234, 18244, 18246, 18255, 18265].map((n) => {
                  const c = byPr.get(n),
                    a = c.attempts[0],
                    j = c.jobs[0];
                  return [
                    pr(n),
                    utc(c.start),
                    utc(j.started_at),
                    j.remote.map(utc).join("–"),
                    build(a.inner, time(a.duration_s)),
                    short(a.critical_path.test),
                    job(j, time(c.feedback_s)),
                  ];
                }),
                785,
              )}
              <${SimpleGrid} cols=${{ base: 1, md: 2 }} mt="md">
                <${Paper} withBorder p="md">
                  <${Title} order=${3}>Managed Pod admission<///>
                  <${Text} mt="xs">#18244 spent 163.1s between managed RBE queue and worker start, then 299.7s in the process. Driver spans show 54.7s setup, a 179.8s envelope for the first through last case, and 32.5s stack cleanup. Removing the queue alone gives up to 116.4s before Firecracker becomes last. The equivalent gap on #18255 is 133.5s.<//>
                <//>
                <${Paper} withBorder p="md">
                  <${Title} order=${3}>Firecracker scenario and cleanup<///>
                  <${Text} mt="xs">#18246 ran for 412.3s with a confirmed warm fixture. Setup took 50.6s. The live-guest continuity case occupied 212.9s, including 56.6s sandbox cleanup. The proxy-trust negative case followed for 74.9s, followed by 50.2s stack cleanup. The live-guest case exercises the one-minute idle policy, suspend/checkpoint, credential rotation and same-process resume. ${file("agentplane/system_tests/scenarios/firecracker.py", "Scenario source")}<//>
                <//>
                <${Paper} withBorder p="md">
                  <${Title} order=${3}>Fast and slow KVM VM paths<///>
                  <${Text} mt="xs">#18234 had 42.2s warm setup inside a 182s VM action. On #18265, the first action failed before scenario execution after a baseline fingerprint mismatch. The recycled runner entered in private cgroup 0::/init and the rebuild expected 0::/. The retry passed both cases after 193.4s cold setup. Shortening VM on that head could save up to 25.2s before Gateway budget became last. ${file("agentplane/system_tests/k3s/baseline.py", "Namespace check")}${" · "}${link("../reliability/#vm-cutover", "Corroborating devel report")}<//>
                <//>
                <${Paper} withBorder p="md">
                  <${Title} order=${3}>KVM input fetch delayed a failed attempt<///>
                  <${Text} mt="xs">#18106 assigned VM and Firecracker actions after 5.2s and 3.6s. They then spent 581.1s and 581.9s in input fetch, on two distinct workers, with 65.6 MB across four recorded files on each action. Both tests passed. The long fetch deferred final job red after the separate Gateway crash case failed. Native metadata leaves the responsible CAS object and network path unknown.<//>
                <//>
              <//>
            </section>
            <section id="capacity">
              <${Title} order=${2}>Runner and executor capacity<///>
              <${Text} my="sm">GitHub recorded 27.35 occupied runner-hours and a peak of 40 in the 19:42:40–21:12:40 UTC window, a lower bound based on completed assigned jobs. Among 69 assigned, completed PR Test & Build jobs, creation to start was 2s median, 3s p90 and 65s maximum. No measured PR Test & Build job was awaiting assignment at the cutoff. The longest waits across all job types occurred in dependent release and image steps. Default CodeQL setup is off.<///>
              <${Text} my="sm">Decoded action properties on #18244 put VM and Firecracker on self-hosted Docker in <code>kvm-vm</code>, one concurrent task per worker. Pod used the managed Firecracker action lane. Outer Remote Bazel runner admission and provider-wide quotas are unobserved.<///>
              ${table(
                [
                  "Physical TestRunner population",
                  "Process n",
                  "Process median / p90",
                  "Valid queue n",
                  "Queue median / p90",
                  "Unknown queue",
                ],
                [
                  ["KVM VM", "vm"],
                  ["KVM Firecracker", "firecracker"],
                  [
                    "Managed Pod, dispatcher, Gateway budget, central",
                    "other_four_long",
                  ],
                ].map(([label, k]) => {
                  const s = evidence.native_cost[k];
                  return [
                    label,
                    s.process.n,
                    `${time(s.process.p50)} / ${time(s.process.p90)}`,
                    s.queue.n,
                    `${seconds(s.queue.p50)} / ${seconds(s.queue.p90)}`,
                    s.queue_unknown,
                  ];
                }),
                760,
              )}
              <${Text} size="sm" mt="sm">The four managed labels reached a 195.6s maximum native queue. Twenty KVM queue clocks were inverted. Keep those unknown. At one-minute resolution the KVM telemetry recorded up to eight registered workers, with task counts available jointly on 684 of 816 points. No joint sample reached eight registered and eight tasks. Short queue bursts and misses still remain possible.<///>
              <${Box} role="img" data-chart="kvm-pool" mt="md" aria-label="KVM desired workers, registered workers and executor task gauge">
                <${LineChart} h=${215} data=${phases} dataKey="utc" domain=${[0, 8]} withLegend connectNulls=${false}
                  strokeWidth=${2} withDots=${false} series=${[
                    {
                      name: "registered",
                      label: "Registered",
                      color: "blue.6",
                    },
                    { name: "tasks", label: "Tasks", color: "teal.6" },
                    { name: "desired", label: "Desired", color: "gray.6" },
                  ]} />
              <//>
              <${Text} size="sm" mt="sm">Chart samples every ten minutes from the one-minute census. The task gauge includes input preparation and upload. ${link("https://grafana.allegedly.works/d/buildbuddy-executor-pool", "Executor pool dashboard")}<//>
              <${Text} mt="sm">Across the selected backend and fixture invocations, 1,072 unique originating TestRunner actions used 27.68 process-hours and 46.99 observed CPU-hours. CPU was missing for 37 actions, including all sampled KVM VM and Firecracker actions. Thread-browser shards consumed 3.44 process-hours across 112 actions. Runner hours and remote action costs use different clocks.<///>
            </section>
            <section id="actions">
              <${Title} order=${2}>Where to spend the next investigation<///>
              ${table(
                ["Priority", "Change or test", "Expected effect and boundary"],
                [
                  [
                    "1 · Failure recovery",
                    "Extend the bbapi failedTest lookup to include the TIMED_OUT group. On the exact #18273 invocation, GetTarget returned TIMED_OUT while first-failure returned an empty label. The timeout action finished 7m15s before the live failure status. Verify when the broader query can first see a timeout and that the subscriber receives the attempt and invocation link.",
                    "This recovers a missing failure category without changing required tests. The 7m15s is the physical-action-to-status interval. API indexing and subscriber delivery would reduce the available lead. Fix repeat failures separately to improve time to green.",
                  ],
                  [
                    "2 · Managed Pod queue",
                    "Scope a burst comparison to the same Pod actions and measure managed admission against a reserved compatible lane. Treat provider TSC snapshot-restore failures as a separate retry cause. Verify a retry receives a compatible or fresh snapshot before proposing any automatic retry.",
                    "2m43s and 3m16s observed waits, with 1m56s and 2m14s conditional headroom on those heads. Needs confirmed routing, admission and capacity cost. KVM's current worker minimum does not serve managed Pod.",
                  ],
                  [
                    "3 · Firecracker scenario overlap",
                    "Compare serial and concurrent execution of the independent proxy-trust negative and live-guest cases under one fixture. Keep separate guest and credential identities, one-minute idle policy, cleanup and required cold coverage. Measure nested admission and peak memory before extending to loaded runs.",
                    "Up to 75s on the #18246 trace if the shorter case overlaps fully without slowing the long case. A second whole stack repeats setup. Three first-pass backend heads had Firecracker as latest physical finisher.",
                  ],
                  [
                    "4 · Verify the VM recycle failure",
                    "Make Docker namespace preparation idempotent when a recycled runner with verified private cgroups is already in its /init child. Exercise a clean fixture followed by a fingerprint-changing action on the same runner. Keep negative coverage for host or unprepared namespaces.",
                    "Matching receipts on #18265 and a devel push confirm the rebuild predicate. About 25s conditional headroom on #18265 before Gateway budget becomes last. The two-worker minimum and fleet warm-hit rate still need a matched comparison.",
                  ],
                ],
                1000,
              )}
              <${Text} mt="sm">A 30% reduction from the 9m31s one-attempt median requires 2m51s. Reaching a four-minute mean requires a 4m52s reduction from the observed 8m52s mean. None of the isolated observed path reductions covers that distance. A larger design would narrow App-triggered guest, Firecracker and managed Pod work together. Keep an end-to-end App→guest witness and the separate guest lifecycle, PKI and recovery assertions. Compare on the same selected source changes with exact gates and action inputs before counting a gain.<///>
              <${Text} mt="sm">The 20 November cold job reached its 30-minute GitHub timeout. BuildBuddy finished successfully about eight seconds after GitHub canceled it. Two executor attempts failed waiting for CAS Read responses before the test process started. Input fetch consumed 2m53s, 8m50s and 3m33s across two failed starts and the passing attempt. The passing process took 6m50s. Inspect the worker-side CAS read path before changing the cold test budget. ${link(evidence.cold_workflow[1].html_url, "Passed run")} · ${link(evidence.cold_workflow[0].html_url, "Timed-out GitHub job")}${" · "}${build(evidence.cold_execution.invocation, "Recovered BuildBuddy result")}<//>
            </section>
            <${Accordion} variant="separated">
              <${Accordion.Item} value="method">
                <${Accordion.Control}>Population, clocks and provenance<//>
                <${Accordion.Panel}>
                  <${Text} mb="sm">151 exact latest heads sampled from 264 matching heads across 19 November 20:00 through 20 November 21:12 UTC. GitHub returned 888 PR CI runs for the full window. The frame includes earlier heads and cross-repository runs. Gate estimates use only the joined latest same-repository devel heads with complete changed-file classes, plus one large-diff head in an unclassified row. Exact check attempts and cutoff outcomes appear in the evidence. These are balanced path samples and the earlier 10–16 November report used a different sampling frame.<///>
                  <${Text} mb="sm">The devel ruleset requires Test & Build, Pre-commit and Build artifacts + imports, with non-strict status checks and zero ordinary approvals. It requires a PR, linear history and extra approval for unattributed changes. Auto-merge is enabled in repository settings. Historical draft, review and conflict transitions were unavailable. Of the 60 green post-shadow heads all were already merged at collection. The sample does not assign auto-merge-ready timestamps.<///>
                  <${Text} mb="sm">BuildBuddy test invocations use deterministic run-and-attempt IDs. For linked traces, the synthetic test commit's parents identify the PR head and tested base. All listed post-shadow timelines have a tested base containing the route change. Native test process clocks, fixture spans and GitHub step intervals overlap. The 90-minute runner census excludes unfinished jobs. The independent older-active scan raced pagination, returning 14 records against a reported 26.<///>
                  <${Text} size="sm">${link(`${gh}/rules/15894562`, "Ruleset")} · ${file(".github/workflows/bazel-ci.yml", "Bazel CI workflow")} · ${file("devinfra/ci/skills/ci_latency/SKILL.md", "Collection method")} · ${link("./evidence.json", "Exact heads, cases and supporting data")}<///>
                <//>
              <//>
              <${Accordion.Item} value="history">
                <${Accordion.Control}>Prior measurements and experiments<//>
                <${Accordion.Panel}>
                  <${Text} mb="sm">The 10–16 November baseline recorded 51 green of 53 backend heads, with 10m23s median and 19m05s p90. The 18 November Firecracker acceptance measured 40.6s warm setup against 106.3s on the cold seed. Selected current traces show reuse in operation. Fleet reuse, the two-worker warm floor's latency benefit, and cost attribution remain open.<///>
                  <${Text} mb="sm">Prior two-stack sharding duplicated setup and increased the slowest action and CPU cost. The managed resource trial hit an admission limit. The paired admission archives, previous canary, rejected trials, timeline graphs and the original methods remain in the pinned snapshot.<///>
                  <${Text} size="sm">${link(`${prior}/index.html`, "Prior latency dashboard")} · ${link(`${prior}/evidence.json`, "Prior evidence")} · ${link("../agentplane-test-architecture/", "Architecture record")}<///>
                <//>
              <//>
            <//>
          <//>
        <//>`;
      }
      mount(Report);
    </script>
  </body>
</html>
