apiVersion: v1
kind: Config
clusters:
- cluster:
    server: https://127.0.0.1:6443
    insecure-skip-tls-verify: true
  name: talos-demo
contexts:
- context:
    cluster: talos-demo
    user: talos-admin
  name: talos-demo
current-context: talos-demo
users:
- name: talos-admin
  user:
    client-certificate-data: ""
    client-key-data: ""
