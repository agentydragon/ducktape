# Keep Debian metadata snapshot-pinned. Package digests still come from those indexes;
# try the live pool while the same package is available, then the immutable snapshot.
rewrite (snapshot\.debian\.org/archive/(debian(?:-security)?)/[^/]+/(pool/.*\.deb)) https://deb.debian.org/$2/$3
rewrite (snapshot\.debian\.org/archive/(debian(?:-security)?)/[^/]+/(pool/.*\.deb)) https://$1
