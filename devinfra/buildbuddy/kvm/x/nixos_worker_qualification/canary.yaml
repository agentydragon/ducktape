apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buildbuddy-kvm-worker-nixos-spike-pull
  namespace: buildbuddy-executor
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: buildbuddy-kvm-worker-nixos-spike-pull
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: pool.kubevirt.io/v1beta1
kind: VirtualMachinePool
metadata:
  name: buildbuddy-kvm-worker-nixos-spike
  namespace: buildbuddy-executor
  labels:
    app.kubernetes.io/name: buildbuddy-kvm-worker-nixos-spike
spec:
  replicas: 0
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildbuddy-kvm-worker-nixos-spike
  virtualMachineTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: buildbuddy-kvm-worker-nixos-spike
    spec:
      runStrategy: Always
      dataVolumeTemplates:
        - metadata:
            name: buildbuddy-kvm-worker-nixos-spike-work
          spec:
            source:
              blank: {}
            storage:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 80Gi
              storageClassName: piraeus-ssd-local-delete
              volumeMode: Filesystem
      template:
        metadata:
          labels:
            app.kubernetes.io/name: buildbuddy-kvm-worker-nixos-spike
        spec:
          nodeSelector:
            topology.kubernetes.io/region: hil
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: cpu-feature.node.kubevirt.io/svm
                        operator: In
                        values: ["true"]
                  - matchExpressions:
                      - key: cpu-feature.node.kubevirt.io/vmx
                        operator: In
                        values: ["true"]
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          terminationGracePeriodSeconds: 87000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
              httpHeaders:
                - name: server-type
                  value: buildbuddy-executor
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          domain:
            cpu:
              cores: 4
              model: host-passthrough
              features:
                - name: svm
                  policy: optional
                - name: vmx
                  policy: optional
            resources:
              requests:
                cpu: "2"
                memory: 8Gi
              limits:
                cpu: "4"
                memory: 8Gi
            firmware:
              bootloader:
                efi:
                  secureBoot: false
            devices:
              autoattachGraphicsDevice: false
              disks:
                - name: rootdisk
                  bootOrder: 1
                  disk:
                    bus: virtio
                - name: work
                  serial: work
                  disk:
                    bus: virtio
                - name: buildbuddy-key
                  serial: bbkey
                  disk:
                    bus: virtio
                - name: worker-config
                  serial: bbconfig
                  disk:
                    bus: virtio
              interfaces:
                - name: default
                  masquerade: {}
                  ports: []
          networks:
            - name: default
              pod: {}
          volumes:
            - name: rootdisk
              containerDisk:
                image: IMAGE_DIGEST_PLACEHOLDER
                imagePullSecret: buildbuddy-kvm-worker-nixos-spike-pull
                imagePullPolicy: IfNotPresent
            - name: work
              dataVolume:
                name: buildbuddy-kvm-worker-nixos-spike-work
            - name: buildbuddy-key
              secret:
                secretName: buildbuddy-api-key
            - name: worker-config
              configMap:
                name: buildbuddy-kvm-worker-nixos-spike
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buildbuddy-kvm-worker-nixos-spike
  namespace: buildbuddy-executor
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: buildbuddy-kvm-worker-nixos-spike
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alloy-node
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9100"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: remote.buildbuddy.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - remote.buildbuddy.io
    - toFQDNs:
        - matchName: time.cloudflare.com
      toPorts:
        - ports:
            - port: "123"
              protocol: UDP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: zot
            k8s:io.kubernetes.pod.namespace: oci-cache
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: buildbuddy-kvm-worker-nixos-spike-metrics
  namespace: buildbuddy-executor
  labels:
    app.kubernetes.io/name: buildbuddy-kvm-worker-nixos-spike
spec:
  selector:
    app.kubernetes.io/name: buildbuddy-kvm-worker-nixos-spike
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
    - name: node-metrics
      port: 9100
      targetPort: 9100
  type: ClusterIP
