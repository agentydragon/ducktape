apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildbuddy-kvm-cache-proxy
  namespace: buildbuddy-executor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: buildbuddy-kvm-cache-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildbuddy-kvm-cache-proxy
    spec:
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        fsGroup: 10000
        runAsGroup: 10000
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: proxy
          image: buildbuddy.bbcr.io/public/buildbuddy-proxy-enterprise@sha256:d527deb6f72c6bc95b0377d6ff0ae8754bc47012e1b2baa16ab838b6e879bea5
          args:
            - --config_file=/etc/buildbuddy/config.yaml
            - --listen=0.0.0.0
            - --cache_proxy.remote_cache=grpcs://remote.buildbuddy.io:443
            - --cache_proxy.proxy_type=customer
            - --cache_proxy.metadata_directory=/buildbuddy/proxy-metadata
            - --auth.remote.target=grpcs://remote.buildbuddy.io:443
            - --auth.reparse_jwts=false
            - --cache.pebble.root_directory=/buildbuddy/pebble
            - --cache.max_size_bytes=8589934592
          env:
            - name: HOME
              value: /buildbuddy
          ports:
            - name: grpc
              containerPort: 1985
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: server-type
                  value: cache-proxy
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/buildbuddy
              readOnly: true
            - name: cache
              mountPath: /buildbuddy
      volumes:
        - name: config
          configMap:
            name: buildbuddy-kvm-cache-proxy
        - name: cache
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: piraeus-ssd-local-delete
                resources:
                  requests:
                    storage: 12Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildbuddy-kvm-cache-proxy
  namespace: buildbuddy-executor
data:
  config.yaml: |
    ssl:
      enable_ssl: false
---
apiVersion: v1
kind: Service
metadata:
  name: buildbuddy-kvm-cache-proxy
  namespace: buildbuddy-executor
spec:
  selector:
    app.kubernetes.io/name: buildbuddy-kvm-cache-proxy
  ports:
    - name: grpc
      port: 1985
      targetPort: grpc
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buildbuddy-kvm-cache-proxy
  namespace: buildbuddy-executor
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: buildbuddy-kvm-cache-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/part-of: buildbuddy-kvm-cache-canary
      toPorts:
        - ports:
            - port: "1985"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: remote.buildbuddy.io
    - toFQDNs:
        - matchName: remote.buildbuddy.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - remote.buildbuddy.io
