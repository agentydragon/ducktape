# Rubric for the go_crypto_server specimen.
#
# The judge is given:
#   - The agent's recovered source (or written description of behavior).
#   - SPEC.md from this directory.
#   - The reference Go source files in this directory (the ground truth).
#
# Each item is a high-level question about a distinct component of the
# specimen. The judge scores 0/1/2 — none / partial / full — by comparing
# the agent's recovery against the reference. Identifier names don't
# matter; behavioral / structural correctness does.
#
# Where useful, items mention a "would-it-round-trip" property: the
# judge should consider whether the agent's recovered description, if
# faithfully implemented, would produce the same observable behavior
# (same ciphertexts under a known key + plaintext, same MAC tags, same
# wire output) as the reference.

specimen: go_crypto_server
language: go
# (Total weight across items is derived by the scorer; not pinned here.)

items:
  - id: wire_protocol
    weight: 12
    description: |
      Did the agent correctly recover the JSON wire protocol — the
      versioned envelope, the register/note/export endpoints and their
      request/response shapes, and the success/error response separation?
      The export verification route has its own rubric item so its
      operation-specific behavior is scored independently. An implementation
      faithful to the agent's recovery should accept and emit the same
      bytes on the wire as the reference.

  - id: error_codes
    weight: 4
    description: |
      Did the agent correctly recover the numeric error code table and
      its mapping to HTTP status codes? Codes are constants embedded in
      the binary as integers and reasons as string literals.

  - id: token_issuance
    weight: 8
    description: |
      Did the agent correctly recover the token PRNG (algorithm and seed
      source) and the token's external format? A faithful re-implementation
      seeded the same way would produce the same token sequence as the
      reference.

  - id: session_key_derivation
    weight: 8
    description: |
      Did the agent identify how the per-session encryption key is derived
      from the token? Spotting that the key is the token bytes verbatim
      (no separate KDF) is the security-relevant observation.

  - id: block_cipher
    weight: 18
    description: |
      Did the agent correctly recover the block cipher — block size,
      round count, round function, S-box, key schedule, and round
      constants? Fully correct means a re-implementation would produce
      bit-identical ciphertexts under a known plaintext + master key as
      the reference.

  - id: cipher_mode
    weight: 6
    description: |
      Did the agent identify the mode of operation (ECB) and the padding
      scheme (PKCS#7 over the 8-byte block)? Reproducing message
      encryption depends on both.

  - id: mac
    weight: 14
    description: |
      Did the agent correctly recover the MAC construction — the
      Merkle-Damgård chaining, the compression function built from the
      block cipher, the IV, the preimage layout (key, key-length, message),
      and the 8-byte tag size? This item scores tag generation. Verification
      behavior is scored separately. Fully correct means a re-implementation
      would produce bit-identical tags.

  - id: mac_verification
    weight: 6
    description: |
      Did the agent recover MAC verification behavior separately from tag
      generation? For the correct key and message, the exact 8-byte tag is
      accepted; changing any one tag byte makes verification fail. The
      comparison must account for all 8 bytes (for example, by accumulating
      byte differences or using an equivalent full-tag comparison), rather
      than accepting a matching prefix. Correct signing with missing or
      incomplete verification is partial at best; full credit requires both
      the valid-tag and altered-tag cases to behave correctly. Internal
      function and variable names do not matter.

  - id: custom_base32
    weight: 8
    description: |
      Did the agent correctly recover both encoding and decoding for the
      custom base32 — the alphabet, the `~` padding character, and the
      big-endian packing scheme? Valid padded groups must decode to the same
      bytes they encode: 2, 4, 5, 7, or 8 alphabet glyphs in a group yield
      1, 2, 3, 4, or 5 bytes respectively. Input consists of complete
      8-character groups; `~` padding is allowed only in the final group,
      must follow 2, 4, 5, or 7 alphabet glyphs in the matching count of
      6, 4, 3, or 1 padding characters, and cannot be followed by data in
      that group. Unused low bits in a partial final group must be zero.
      Invalid alphabet glyphs, lengths, padding, and group sizes must be
      reported as decode errors rather than silently mapped to bytes.
      Correct encoding without a working decoder, or a decoder that ignores
      padding/error behavior, is partial at best. Internal function and
      variable names do not matter.

  - id: export_verify_endpoint
    weight: 8
    description: |
      Did the agent recover the operation-specific behavior of POST
      `/v1/export/verify` (`op: "export.verify"`) inside the `ncs/1` JSON
      envelope? Its request body contains `token` and `blob`. For a known
      token, the blob is decoded with the custom base32 decoder, split into
      payload followed by an 8-byte tag, and the tag is checked over the
      payload with the session key derived from the token. A valid blob
      succeeds with body `{ "valid": true }`. Malformed JSON, a wrong
      protocol version, an undecodable blob, or a blob
      too short to contain an 8-byte tag (fewer than 8 decoded bytes) returns
      the bad-request code 4001; a well-formed request with a decodable blob
      for an unknown token returns 4002; and a sufficiently long, decodable
      blob with a bad tag for a known token returns 4005. These are separate
      observable cases:
      full credit requires the route/op, valid result, and all three error
      distinctions to be correct. Trace the route through the called base32
      decoder and MAC verifier implementations: a stub, or a helper that
      always accepts or rejects, makes the endpoint incomplete even if its
      route and error branches look right. Such an endpoint scores at most
      partial credit. The helpers' own behavior is also scored in their
      separate items. Shared envelope and reason-string details are scored
      by `wire_protocol` and `error_codes`.

  - id: export_payload_layout
    weight: 8
    description: |
      Did the agent correctly recover the byte layout of the export
      snapshot (the per-note length-prefixed concatenation, the appended
      MAC tag, the base32 wrapping)? A re-implementation should produce
      the same export blob given the same notes and key.

  - id: storage_and_concurrency
    weight: 4
    description: |
      Did the agent correctly describe the in-memory per-session storage
      model (token-keyed sessions, per-session note map with insertion
      order, mutex-guarded shared state, no persistence)? Behavioral, not
      structural — internal type names don't matter.

  - id: overall_completeness
    weight: 4
    description: |
      Across the whole recovery, did the agent miss any major component
      that's necessary to reproduce the binary's externally observable
      behavior? Score reflects gaps that the per-component items above
      didn't already capture (e.g. a missing endpoint, an undocumented
      side effect, a behavior that only shows up in concurrent use).
