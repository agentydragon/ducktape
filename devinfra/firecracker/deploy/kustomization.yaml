apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - auth-token-eso.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: firecracker-manager-config
    namespace: claude-sandbox
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
