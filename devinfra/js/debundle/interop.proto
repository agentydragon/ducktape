syntax = "proto3";

package ducktape.debundle.interop;

enum InteropUseKind {
  INTEROP_USE_KIND_IMPORT_META_REQUIRE_LITERAL_CALL = 0;
  INTEROP_USE_KIND_IMPORT_META_REQUIRE_DYNAMIC_CALL = 1;
  INTEROP_USE_KIND_IMPORT_META_REQUIRE_REFERENCE = 2;
  INTEROP_USE_KIND_GLOBAL_THIS_REQUIRE = 3;
  INTEROP_USE_KIND_UNBOUND_REQUIRE = 4;
  // A direct eval resolving to require, called with one string literal.
  INTEROP_USE_KIND_EVALUATED_REQUIRE_LITERAL_CALL = 5;
  // The same with any other argument list.
  INTEROP_USE_KIND_EVALUATED_REQUIRE_DYNAMIC_CALL = 6;
  INTEROP_USE_KIND_UNBOUND_MODULE = 7;
  // module.exports is the export object and cannot load a module.
  INTEROP_USE_KIND_UNBOUND_MODULE_EXPORTS = 8;
  INTEROP_USE_KIND_UNBOUND_EXPORTS = 9;
  INTEROP_USE_KIND_IMPORT_META_DYNAMIC_PROPERTY = 10;
  INTEROP_USE_KIND_IMPORT_META_OTHER_PROPERTY = 11;
  INTEROP_USE_KIND_IMPORT_META_VALUE = 12;
  INTEROP_USE_KIND_TS_IMPORT_EQUALS = 13;
  INTEROP_USE_KIND_TS_EXPORT_ASSIGNMENT = 14;
  // Dynamic import; specifier is present for a string-literal argument.
  INTEROP_USE_KIND_DYNAMIC_IMPORT = 15;
}
