logical_modules:
  static/app:
    consumer:
      members:
        - { name: c, selector: { binding: { name: c } } }
    helper:
      members:
        - { name: a, selector: { binding: { name: a } } }
        - { name: b, selector: { binding: { name: b } } }
import_order:
  static/app: [helper, consumer]
unassigned_mode:
  static/app: { kind: catchall_file }
