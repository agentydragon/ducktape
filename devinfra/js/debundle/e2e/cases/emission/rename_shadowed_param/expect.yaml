spec.yaml:
  accept:
    stdout: "argtop\n"
    source:
      main/entry.js:
        contains:
          - 'var readable = "top"'
          - "function f(a)"
          - "return a"
          - 'console.log(f("arg") + readable)'
        excludes:
          - "function f(readable)"
          - "return readable"
