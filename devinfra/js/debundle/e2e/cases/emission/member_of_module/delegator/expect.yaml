spec.yaml:
  accept:
    entry: static/app
    check_all_js: true
    runtime_files:
      static/app/gen.js: "static/gen.js"
    stdout: "7\n"
    exports:
      static/app/modules/ids.js:
        include: [generateId]
        exclude: []
    source:
      static/app/modules/ids.js:
        contains:
          - "source bindings: nextId"
          - "function generateId"
