spec.yaml:
  accept:
    entry: static/app
    check_all_js: true
    runtime_files:
      static/app/accessors.js: "static/accessors.js"
    stdout: "cards tree\n"
    exports:
      static/app/modules/accessors.js:
        include: [CardsViewAccessor]
        exclude: [TreeView, CardsView]
    source:
      static/app/modules/accessors.js:
        contains:
          - "source bindings: CardsView"
          - "class CardsViewAccessor"
        excludes:
          - "source bindings: TreeView"
