spec.yaml:
  accept:
    entry: static/app
    source:
      static/app/modules/alpha.js:
        contains: ["var alphaDecorator = "]
        excludes: [betaDecorator]
      static/app/modules/beta.js:
        contains: ["var betaDecorator = "]
        excludes: [alphaDecorator]
    stdout: "aA bB\n"
