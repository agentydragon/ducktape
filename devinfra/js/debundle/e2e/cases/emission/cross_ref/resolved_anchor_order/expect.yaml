    entry: static/app
    check_all_js: true
    stdout: "42\n"
    exports:
      static/app/modules/anchors.js:
        include: [isTranscriptionProvider]
        exclude: []
      static/app/modules/delegators.js:
        include: [isMeetingTranscriptionProvider]
