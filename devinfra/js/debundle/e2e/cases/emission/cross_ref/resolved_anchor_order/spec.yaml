logical_modules:
  static/app:
    anchors:
      source_matches:
        - match: "function $a($b) { return $b + 1; }"
          bindings:
            - local: "$a"
              name: isTranscriptionProvider
    delegators:
      members:
        - name: isMeetingTranscriptionProvider
          selector:
            cross_ref:
              references: isTranscriptionProvider
              kind: function_declaration
unassigned_mode:
  static/app:
    kind: catchall_file
import_order:
  static/app:
    - anchors
    - delegators
