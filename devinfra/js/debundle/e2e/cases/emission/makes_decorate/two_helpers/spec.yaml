logical_modules:
  static/app:
    alpha:
      source_matches:
        - match: |
            class Alpha {
              alphaLabel() {
                STMT_LIST;
              }
            }
          bindings: [Alpha]
      members:
        - name: alphaDecorator
          selector:
            makes_decorate_call:
              class: Alpha
              member: alphaLabel
    beta:
      source_matches:
        - match: |
            class Beta {
              betaLabel() {
                STMT_LIST;
              }
            }
          bindings: [Beta]
      members:
        - name: betaDecorator
          selector:
            makes_decorate_call:
              class: Beta
unassigned_mode:
  static/app:
    kind: catchall_file
import_order:
  static/app:
    - alpha
    - beta
    - residual
