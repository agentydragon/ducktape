spec.yaml:
  accept:
    entry: static/app
    source:
      static/app/modules/alpha.js:
        contains: ["var alphaDecorator = ", "export { Alpha, alphaDecorator }"]
        excludes: [betaDecorator, "class Beta"]
      static/app/modules/beta.js:
        contains: ["var betaDecorator = ", "export { Beta, betaDecorator }"]
        excludes: [alphaDecorator, "class Alpha"]
    stdout: "aA bB\n"
    check_all_js: true
