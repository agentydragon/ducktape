logical_modules:
  static/app:
    model:
      source_matches:
        - match: |
            class $a {
              greet() {
                STMT_LIST;
              }
            }
          bindings:
            - local: "$a"
              name: DecoratedClass
    decorate_helper:
      members:
        - name: decorateClassMember
          selector:
            makes_decorate_call:
              class: DecoratedClass
unassigned_mode:
  static/app:
    kind: catchall_file
import_order:
  static/app:
    - model
    - decorate_helper
    - residual
