logical_modules:
  static/app:
    decorate_helper:
      members:
        - name: applyDecorators
          selector: { makes_decorate_call: { class: DecoratedClass } }
      annotations: { applyDecorators: { effect: typescript_decorate_helper } }
    model:
      source_matches:
        - match: |-
            class C {
              greet() {
                STMT_LIST;
              }
            }
          bindings:
            - { local: C, name: DecoratedClass }
      anonymous_statements:
        - { match: 'd0([tag], C.prototype, "greet", 1);' }
import_order:
  static/app: [model, decorate_helper, residual]
unassigned_mode:
  static/app: { kind: catchall_file }
