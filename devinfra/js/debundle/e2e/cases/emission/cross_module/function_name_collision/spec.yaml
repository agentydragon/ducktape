logical_modules:
  static/app:
    consumer:
      members:
        - { name: sharedReadableName, selector: { binding: { name: b } } }
        - { name: run, selector: { binding: { name: c } } }
    provider:
      members:
        - { name: sharedReadableName, selector: { binding: { name: a } } }
