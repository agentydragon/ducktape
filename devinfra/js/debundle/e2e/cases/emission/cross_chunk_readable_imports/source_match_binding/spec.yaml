logical_modules:
  static/importer:
    guard:
      members:
        - selector:
            binding:
              name: "guard"
  static/provider:
    provider:
      source_matches:
        - match: |
            function local() { return 6; }
          bindings:
            - local: "local"
              name: "readable"
unassigned_mode:
  static/importer:
    kind: "inline_in_entry"
  static/provider:
    kind: "catchall_file"
import_order:
  static/importer:
    - "guard"
  static/provider:
    - "provider"
