logical_modules:
  static/app:
    alpha:
      members:
        - name: alphaDecorator
          selector:
            makes_decorate_call: { class: Alpha, member: alphaLabel }
      source_matches:
        - match: |-
            class Alpha {
              alphaLabel() {
                STMT_LIST;
              }
            }
          bindings: [Alpha]
    beta:
      members:
        - name: betaDecorator
          selector: { makes_decorate_call: { class: Beta } }
      source_matches:
        - match: |-
            class Beta {
              betaLabel() {
                STMT_LIST;
              }
            }
          bindings: [Beta]
import_order:
  static/app: [alpha, beta, residual]
unassigned_mode:
  static/app: { kind: catchall_file }
