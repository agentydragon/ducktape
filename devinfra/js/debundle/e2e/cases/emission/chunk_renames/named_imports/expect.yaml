spec.yaml:
  accept:
    entry: static/app
    stdout: "local dep-x dep-y\n"
    source:
      static/app/entry.js:
        contains:
          [
            'import { x as importedThing, y } from "../vendor/entry.js";',
            "let payload =",
            "console.log(payload, importedThing, y)",
            "export { payload as x }",
          ]
        excludes: ["import { payload as importedThing", "let x =", "console.log(x, importedThing, y)"]
    runtime_files: { static/vendor/entry.js: vendor/entry.js }
    check_all_js: true
