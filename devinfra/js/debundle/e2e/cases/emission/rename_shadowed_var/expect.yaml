spec.yaml:
  accept:
    stdout: "innerABA\n"
    source:
      main/entry.js:
        contains:
          - 'var b = "A"'
          - "function f(b)"
          - 'var a = "innerA"'
          - "return a + b"
          - 'console.log(f("B") + b)'
        excludes:
          - 'var b = "innerA"'
          - "return b + b"
