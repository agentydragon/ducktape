spec.yaml:
  accept:
    entry: static/app
    exports:
      static/app/modules/services.js:
        include: [FooServiceClass]
        exclude: [BarPlugin, FooService]
    source:
      static/app/modules/services.js:
        contains: ["source bindings: FooService", "class FooServiceClass"]
        excludes: ["source bindings: BarPlugin"]
    stdout: "FooServiceClass BarPlugin\n"
    original_stdout: "FooService BarPlugin\n"
    check_all_js: true
