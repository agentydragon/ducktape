logical_modules:
  static/app:
    context:
      source_matches:
        - match: 'const $a = { id: "ctx-1" };'
          bindings:
            - { local: "$a", name: CodegenContext }
    helpers:
      members:
        - name: readContextId
          selector:
            reads_member:
              member: id
              object: CodegenContext
              kind: function_declaration
import_order:
  static/app: [context, helpers, residual]
unassigned_mode:
  static/app: { kind: catchall_file }
