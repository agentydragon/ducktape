logical_modules:
  static/app:
    mod_init:
      members:
        - { name: readT, selector: { binding: { name: readT } } }
        - { name: init, selector: { binding: { name: init } } }
    mod_logger:
      members:
        - { name: T, selector: { binding: { name: T } } }
import_order:
  static/app: [mod_init, mod_logger]
unassigned_mode:
  static/app: { kind: catchall_file }
