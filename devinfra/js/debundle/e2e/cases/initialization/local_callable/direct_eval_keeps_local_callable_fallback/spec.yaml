host_behavior:
  synchronous_module_loader: "present"
logical_modules:
  main:
    values/dynamic:
      members:
        - selector:
            binding:
              name: "dynamic"
    values/later:
      members:
        - selector:
            binding:
              name: "later"
import_order:
  main:
    - "values/dynamic"
    - "values/later"
    - "residual"
unassigned_mode:
  main:
    kind: "catchall_file"
chunk_analysis_options:
  main:
    dataflow_aware_s_chain: false
    trusted_dataflow_summaries: false
    admission_overrides:
      - "a1_eval"
    local_property_effects: false
