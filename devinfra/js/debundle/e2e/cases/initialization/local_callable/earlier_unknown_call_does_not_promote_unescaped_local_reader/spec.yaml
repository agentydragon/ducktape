host_behavior:
  synchronous_module_loader: "present"
logical_modules:
  main:
    values/dynamic:
      members:
        - selector:
            binding:
              name: "dynamic"
        - selector:
            binding:
              name: "prefix"
    values/later:
      members:
        - selector:
            binding:
              name: "later"
        - selector:
            binding:
              name: "readLater"
import_order:
  main:
    - "values/dynamic"
    - "values/later"
unassigned_mode:
  main:
    kind: "catchall_file"
