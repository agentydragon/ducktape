host_behavior:
  synchronous_module_loader: "present"
logical_modules:
  main:
    values/all:
      members:
        - selector:
            binding:
              name: "dynamic"
        - selector:
            binding:
              name: "later"
        - selector:
            binding:
              name: "readLater"
        - selector:
            binding:
              name: "observed"
      anonymous_statements:
        - match: "Object.defineProperty(Object.prototype, \"__debundle_test_probe__\", {\n  set(value) { observed = readLater(); },\n});"
        - match: "console.log(dynamic);"
import_order:
  main:
    - "values/all"
    - "residual"
unassigned_mode:
  main:
    kind: "catchall_file"
