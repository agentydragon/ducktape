inputs:
  input_root: "."
  js_list_path: ".fixture/js-files.txt"
logical_modules:
  main:
    mod_state:
      members:
        - selector:
            binding:
              name: "state"
        - selector:
            binding:
              name: "setState"
unassigned_mode:
  main:
    kind: "catchall_file"
import_order:
  main:
    - "mod_state"
materialize_logical_modules:
  target_dir: "modules"
  report_out_dir: "out/reports/tree"
  prune_other_chunks: false
write_js_tree:
  out_dir: "out"
