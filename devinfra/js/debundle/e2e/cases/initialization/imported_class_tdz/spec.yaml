logical_modules:
  main:
    mod_logger:
      members:
        - selector:
            binding:
              name: "currentLogger"
        - selector:
            binding:
              name: "setLogger"
      anonymous_statements:
        - match: "setLogger(new Backend());"
import_order:
  main: ["mod_logger"]
unassigned_mode:
  main:
    kind: "inline_in_entry"
chunk_analysis_options:
  main:
    dataflow_aware_s_chain: true
    trusted_dataflow_summaries: false
    local_property_effects: false
