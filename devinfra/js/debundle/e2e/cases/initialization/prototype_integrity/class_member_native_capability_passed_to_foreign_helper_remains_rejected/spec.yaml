host_behavior:
  synchronous_module_loader: "present"
logical_modules:
  static/app:
    callbacks/wrapped:
      members:
        - selector:
            binding:
              name: "Holder"
        - selector:
            binding:
              name: "Policy"
        - selector:
            binding:
              name: "create"
        - selector:
            binding:
              name: "prefix"
        - selector:
            binding:
              name: "command"
    values/later:
      members:
        - selector:
            binding:
              name: "later"
import_order:
  static/app:
    - "callbacks/wrapped"
    - "residual"
    - "values/later"
unassigned_mode:
  static/app:
    kind: "catchall_file"
