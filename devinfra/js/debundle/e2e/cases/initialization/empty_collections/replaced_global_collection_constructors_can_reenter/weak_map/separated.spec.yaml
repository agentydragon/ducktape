logical_modules:
  main:
    values/collection:
      members:
        - { "selector": { "binding": { "name": "collection" } } }
        - { "selector": { "binding": { "name": "key" } } }
      anonymous_statements:
        - { "match": "globalThis.saved = () => later;" }
        - match: 'globalThis[key] = function WeakMap() { try { globalThis.saved(); return { value: "ready" }; } catch (error) { return { value: error.name }; } };'
    values/later:
      members:
        - { "selector": { "binding": { "name": "later" } } }
import_order:
  main: ["values/collection", "values/later"]
unassigned_mode:
  main:
    kind: "catchall_file"
