logical_modules:
  main:
    values/collection:
      members:
        - { "selector": { "binding": { "name": "collection" } } }
      anonymous_statements:
        - { "match": "globalThis.saved = () => later;" }
        - match: "Array.prototype[Symbol.iterator] = function* () { try { globalThis.saved(); } catch (error) { globalThis.observed = error.name; } yield 1; };"
    values/later:
      members:
        - { "selector": { "binding": { "name": "later" } } }
import_order:
  main: ["values/collection", "values/later"]
unassigned_mode:
  main:
    kind: "catchall_file"
