host_behavior:
  synchronous_module_loader: "present"
logical_modules:
  main:
    later:
      members:
        - selector:
            binding:
              name: "later"
    result:
      members:
        - selector:
            binding:
              name: "getterCalls"
        - selector:
            binding:
              name: "methodCalls"
        - selector:
            binding:
              name: "result"
        - selector:
            binding:
              name: "record"
        - selector:
            binding:
              name: "beforeGetterCalls"
        - selector:
            binding:
              name: "beforeMethodCalls"
      anonymous_statements:
        - match: "console.log(beforeGetterCalls, beforeMethodCalls, result.value, result.make(), getterCalls, methodCalls);"
    wrapper:
      members:
        - selector:
            binding:
              name: "wrap"
import_order:
  main:
    - "wrapper"
    - "result"
    - "later"
unassigned_mode:
  main:
    kind: "catchall_file"
