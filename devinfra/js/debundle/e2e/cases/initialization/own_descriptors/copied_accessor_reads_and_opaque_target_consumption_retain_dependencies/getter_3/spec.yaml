host_behavior:
  synchronous_module_loader: "present"
logical_modules:
  main:
    later:
      members:
        - selector:
            binding:
              name: "later"
    result:
      members:
        - selector:
            binding:
              name: "result"
        - selector:
            binding:
              name: "observed"
    wrapper:
      members:
        - selector:
            binding:
              name: "wrap"
import_order:
  main:
    - "wrapper"
    - "result"
    - "later"
unassigned_mode:
  main:
    kind: "catchall_file"
