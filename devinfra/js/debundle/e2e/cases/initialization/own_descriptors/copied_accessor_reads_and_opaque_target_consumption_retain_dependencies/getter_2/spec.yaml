logical_modules:
  main:
    later:
      members:
        - { "selector": { "binding": { "name": "later" } } }
    result:
      members:
        - { "selector": { "binding": { "name": "wrap" } } }
        - { "selector": { "binding": { "name": "result" } } }
      anonymous_statements:
        - { "match": "result.value();" }
import_order:
  main: ["result", "later"]
unassigned_mode:
  main:
    kind: "catchall_file"
