host_behavior:
  synchronous_module_loader: "present"
logical_modules:
  main:
    values/collection:
      members:
        - selector:
            binding:
              name: "result"
        - selector:
            binding:
              name: "missing"
    values/later:
      members:
        - selector:
            binding:
              name: "later"
import_order:
  main:
    - "values/collection"
    - "values/later"
    - "residual"
unassigned_mode:
  main:
    kind: "catchall_file"
