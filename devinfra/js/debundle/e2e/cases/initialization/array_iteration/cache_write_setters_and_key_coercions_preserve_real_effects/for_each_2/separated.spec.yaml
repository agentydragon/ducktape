logical_modules:
  static/app:
    registry:
      members:
        - { "selector": { "binding": { "name": "entries" } } }
        - { "selector": { "binding": { "name": "observed" } } }
        - { "selector": { "binding": { "name": "result" } } }
        - { "selector": { "binding": { "name": "lookup" } } }
      anonymous_statements:
        - match: "Object.defineProperty(Object.prototype, 'a', { set(value) { observed = later; }, configurable: true });"
    values/later:
      members:
        - { "selector": { "binding": { "name": "later" } } }
      anonymous_statements:
        - { "match": "later = 42;" }
import_order:
  static/app: ["values/later", "registry"]
unassigned_mode:
  static/app:
    kind: "catchall_file"
