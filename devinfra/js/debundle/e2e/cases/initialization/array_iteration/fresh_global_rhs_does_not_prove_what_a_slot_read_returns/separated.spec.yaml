host_behavior:
  synchronous_module_loader: "present"
logical_modules:
  static/app:
    registry:
      members:
        - selector:
            binding:
              name: "entries"
        - selector:
            binding:
              name: "observed"
        - selector:
            binding:
              name: "result"
      anonymous_statements:
        - match: "Object.defineProperty(globalThis, 'slot', { configurable: true, get() { return Array.prototype; }, set(value) {} });"
        - match: "globalThis.slot = {};"
        - match: "globalThis.slot.forEach = function(callback) { observed = later; };"
    values/later:
      members:
        - selector:
            binding:
              name: "later"
      anonymous_statements:
        - match: "later = 42;"
import_order:
  static/app:
    - "values/later"
    - "registry"
unassigned_mode:
  static/app:
    kind: "catchall_file"
