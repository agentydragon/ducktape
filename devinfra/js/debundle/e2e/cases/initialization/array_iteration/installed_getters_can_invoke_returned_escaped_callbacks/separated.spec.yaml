host_behavior:
  synchronous_module_loader: "present"
logical_modules:
  static/app:
    registry:
      members:
        - selector:
            binding:
              name: "createReader"
        - selector:
            binding:
              name: "holder"
        - selector:
            binding:
              name: "observed"
      anonymous_statements:
        - match: "retain(createReader);"
        - match: "retain(holder);"
    values/later:
      members:
        - selector:
            binding:
              name: "later"
      anonymous_statements:
        - match: "later = 42;"
import_order:
  static/app:
    - "values/later"
    - "registry"
unassigned_mode:
  static/app:
    kind: "catchall_file"
