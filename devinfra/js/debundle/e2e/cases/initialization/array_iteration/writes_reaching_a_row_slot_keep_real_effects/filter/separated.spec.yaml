logical_modules:
  static/app:
    registry:
      members:
        - { "selector": { "binding": { "name": "entries" } } }
        - { "selector": { "binding": { "name": "observed" } } }
        - { "selector": { "binding": { "name": "result" } } }
      anonymous_statements:
        - match: "Array.prototype.constructor = { get [Symbol.species]() { observed = later; return Array; } };"
    values/later:
      members:
        - { "selector": { "binding": { "name": "later" } } }
      anonymous_statements:
        - { "match": "later = 42;" }
import_order:
  static/app: ["values/later", "registry"]
unassigned_mode:
  static/app:
    kind: "catchall_file"
