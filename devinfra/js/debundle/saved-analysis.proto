syntax = "proto3";

package ducktape.debundle.saved_analysis;

import "devinfra/js/debundle/spec_wire.proto";
import "google/protobuf/empty.proto";

// Saved semantic evidence. Proof and authority records retain presence where
// absence could weaken a restored proof; diagnostic locations are optional.

message ArgumentInputEvidence {
  optional .ducktape.debundle.saved_analysis.ArgumentInputRef reference = 1;
  optional string spec_location = 2;
  optional .ducktape.debundle.saved_analysis.SourceMatchClaim source_match = 3;
  optional string source_path = 4;
  optional string audited_source_sha256 = 5;
  optional string selected_binding = 6;
  optional uint64 parameter_index = 7;
  optional uint64 exact_arity = 8;
  SourceLocation declaration_location = 9;
}

message ArgumentInputRef {
  optional string defining_chunk = 1;
  optional uint64 input_index = 2;
}

message AssumedEffectReason {
  message PossibleGetter {
    PossibleGetterLookupSite lookup = 1;
    PossibleGetterPromotion promotion = 2;
  }
  oneof value {
    ExecutionPrecisionLossReason fallback_summary = 1;
    google.protobuf.Empty opaque_callback_invocation = 2;
    google.protobuf.Empty escaped_callback_closure = 3;
    google.protobuf.Empty possible_setter = 4;
    PossibleGetter possible_getter = 5;
    ExecutionOperation whole_body_promotion = 6;
    google.protobuf.Empty private_constructor_restore = 7;
    google.protobuf.Empty unresolved_call_closure = 8;
  }
}

message BoundedInvocationFallbackCallSite {
  optional uint64 top_level_owner = 1;
  optional uint32 span_start = 2;
  optional uint32 span_end = 3;
}

message BoundedInvocationFallbackInputPath {
  message Retained {
    optional .ducktape.debundle.saved_analysis.BoundedInvocationFallbackSeed seed = 1;
    repeated .ducktape.debundle.saved_analysis.BoundedInvocationFallbackPathEdge edges = 2;
  }
  oneof value {
    Retained retained = 1;
    .ducktape.debundle.saved_analysis.BoundedInvocationFallbackUnknownPathReason unknown = 2;
  }
}

message BoundedInvocationFallbackPathEdge {
  // A selected accessor edge may have an unknown property.
  message AccessorProperty {
    optional string property = 1;
  }
  oneof value {
    string object_property = 1;
    google.protobuf.Empty unknown_object_property = 2;
    uint32 array_element = 3;
    google.protobuf.Empty unknown_array_property = 4;
    AccessorProperty applied_getter = 5;
    AccessorProperty applied_setter = 6;
    google.protobuf.Empty closure_home_object = 7;
    string closure_snapshot = 8;
    string closure_cell = 9;
    google.protobuf.Empty instance_retained_value = 10;
    google.protobuf.Empty deferred_callback_retained_value = 11;
    google.protobuf.Empty audited_result_retained_value = 12;
    google.protobuf.Empty descriptor_map_retained_value = 13;
    google.protobuf.Empty escaped_callback_pool_expansion = 14;
    google.protobuf.Empty class_members_capability = 15;
  }
}

message BoundedInvocationFallbackSeed {
  oneof value {
    uint64 argument = 1;
    string captured_binding = 2;
    google.protobuf.Empty escaped_callback_pool = 3;
    string available_export_binding = 4;
    google.protobuf.Empty available_export_callbacks = 5;
  }
}

enum BoundedInvocationFallbackUnknownPathReason {
  BOUNDED_INVOCATION_FALLBACK_UNKNOWN_PATH_REASON_UNSPECIFIED = 0;
  BOUNDED_INVOCATION_FALLBACK_UNKNOWN_PATH_REASON_SEED_UNAVAILABLE = 1;
  BOUNDED_INVOCATION_FALLBACK_UNKNOWN_PATH_REASON_RETAINED_REFERENCE_PATH_UNAVAILABLE = 2;
}

message BundleGlobalNames {
  repeated string names = 1;
  optional bool registered_symbols = 2;
  optional bool fresh_collections = 3;
  repeated NoAccessorInstallRef no_accessor_install_callables = 4;
}

// Persisted callable capabilities include dependencies hidden from report JSON.
message CallableSummary {
  repeated CallbackFactoryEvidence callback_factory_evidence = 1;
  ReturnedRecordSummary returned_record = 2;
  NamespaceWrapperSummary namespace_wrapper = 3;
  CallbackObjectArguments callback_object_arguments = 4;
  DescriptorCopyFactorySummary descriptor_copy_factory = 5;
  ForeignCallSummary foreign_call = 6;
  repeated string may_read_importer_cells = 7;
}

message CallbackFactoryBarrierFact {
  optional string namespace_binding = 1;
  optional string member = 2;
  optional uint64 argument_count = 3;
  repeated uint64 callback_arguments = 4;
  CallbackSourceUnits callback_source_units = 5;
  optional .ducktape.debundle.saved_analysis.CallbackFactoryBarrierRejection rejection = 6;
}

// Absence means source units are unknown; a present empty message means none.
message CallbackSourceUnits {
  repeated uint64 source_units = 1;
}

message CallbackFactoryBarrierRejection {
  message NamespaceMemberWrite {
    optional .ducktape.debundle.saved_analysis.CallbackFactoryWriteWitness witness = 1;
  }
  message NamespaceDynamicPropertyWrite {
    optional .ducktape.debundle.saved_analysis.CallbackFactoryWriteWitness witness = 1;
  }
  message NamespaceCallArgument {
    optional .ducktape.debundle.saved_analysis.CallbackFactoryCallArgumentWitness witness = 1;
  }
  oneof value {
    NamespaceMemberWrite namespace_member_write = 1;
    NamespaceDynamicPropertyWrite namespace_dynamic_property_write = 2;
    NamespaceCallArgument namespace_call_argument = 3;
    bool unsupported_guard = 4;
  }
}

message CallbackFactoryCallArgumentWitness {
  optional uint64 statement_ordinal = 1;
  optional .ducktape.debundle.saved_analysis.SourceSpan call_span = 2;
  optional uint64 argument_index = 3;
  optional string namespace_binding = 4;
}

message CallbackFactoryEvidence {
  message AuthorAssertion {
    optional string defining_module = 1;
    optional string export = 2;
  }
  message InferredImmutableWrapper {
    optional string defining_module = 1;
    optional string export = 2;
    optional string local = 3;
    .ducktape.debundle.saved_analysis.SourceLocation source_location = 4;
  }
  oneof value {
    AuthorAssertion author_assertion = 1;
    InferredImmutableWrapper inferred_immutable_wrapper = 2;
  }
}

message CallbackFactoryUseFact {
  optional string imported_local = 1;
  repeated CallbackFactoryEvidence evidence = 2;
  optional .ducktape.debundle.saved_analysis.CallbackFactoryUseKind kind = 3;
  optional uint64 lexical_statement_ordinal = 4;
  SourceLocation source_location = 5;
  optional .ducktape.debundle.saved_analysis.SourceSpan span = 6;
}

enum CallbackFactoryUseKind {
  CALLBACK_FACTORY_USE_KIND_UNSPECIFIED = 0;
  // The checked call suppressed opaque callback promotion.
  CALLBACK_FACTORY_USE_KIND_CALL_TIMING = 1;
  // The checked return shape retained callbacks in a deferred result.
  CALLBACK_FACTORY_USE_KIND_RETURN_SHAPE = 2;
  // The private initializer result was omitted as a reachability root.
  CALLBACK_FACTORY_USE_KIND_CLOSED_RESULT_ROOT = 3;
}

message CallbackFactoryWriteWitness {
  optional uint64 statement_ordinal = 1;
  optional string receiver_binding = 2;
  optional string property = 3;
}

message CallbackObjectArguments {
  optional .ducktape.debundle.saved_analysis.CallbackFactoryEvidence wrapper = 1;
  repeated uint64 object_arguments = 2;
}

// The operation that first exposed class members to the opaque callback pool.
enum ClassMembersPublicationWriter {
  CLASS_MEMBERS_PUBLICATION_WRITER_UNSPECIFIED = 0;
  CLASS_MEMBERS_PUBLICATION_WRITER_GLOBAL_OR_INTRINSIC_MEMBER_WRITE = 1;
  CLASS_MEMBERS_PUBLICATION_WRITER_INSTANCE_MEMBER_WRITE = 2;
  CLASS_MEMBERS_PUBLICATION_WRITER_OWN_DESCRIPTOR_MAP_MEMBER_WRITE = 3;
  CLASS_MEMBERS_PUBLICATION_WRITER_UNTRACKED_RECEIVER_MEMBER_WRITE = 4;
  CLASS_MEMBERS_PUBLICATION_WRITER_PUBLISHED_OBJECT_MEMBER_WRITE = 5;
  CLASS_MEMBERS_PUBLICATION_WRITER_MEMBER_CHAIN_STORE = 6;
  CLASS_MEMBERS_PUBLICATION_WRITER_POSSIBLE_CALLBACK_RETENTION = 7;
  CLASS_MEMBERS_PUBLICATION_WRITER_BOUNDED_INVOCATION_FALLBACK = 8;
  CLASS_MEMBERS_PUBLICATION_WRITER_NO_REENTRY_CALL_RETENTION = 9;
  CLASS_MEMBERS_PUBLICATION_WRITER_LOCAL_OPERATION_FALLBACK = 10;
  CLASS_MEMBERS_PUBLICATION_WRITER_THROW_VALUE_PUBLICATION = 11;
  // A store to a local the source-summary lane reads as unknown.
  CLASS_MEMBERS_PUBLICATION_WRITER_UNTRACKED_LOCAL_STORE = 12;
  // A generator call: whoever later resumes the generator object runs
  // the body.
  CLASS_MEMBERS_PUBLICATION_WRITER_GENERATOR_CREATION = 13;
  // `Object.assign` onto a target the analysis does not track.
  CLASS_MEMBERS_PUBLICATION_WRITER_OBJECT_ASSIGN_COPY = 14;
  // The receiver of a local method that reads `this`, which the summary
  // does not bind.
  CLASS_MEMBERS_PUBLICATION_WRITER_METHOD_RECEIVER = 15;
  // The unknown instance of a refused local class construction.
  CLASS_MEMBERS_PUBLICATION_WRITER_REFUSED_CONSTRUCTION_INSTANCE = 16;
  // The receiver of a member read or write that may run an accessor
  // reading `this`.
  CLASS_MEMBERS_PUBLICATION_WRITER_ACCESSOR_RECEIVER = 17;
  // What an escaped class's construction stored on an instance or the
  // class.
  CLASS_MEMBERS_PUBLICATION_WRITER_CLASS_REACH = 18;
  // A store on a local class or its prototype.
  CLASS_MEMBERS_PUBLICATION_WRITER_CLASS_SURFACE_MEMBER_WRITE = 19;
}

message CompletedInitialization {
  optional uint64 owner = 1;
  optional .ducktape.debundle.saved_analysis.ProofDependencies dependencies = 2;
}

message ConstructionRejection {
  oneof value {
    google.protobuf.Empty spread_arguments = 1;
    google.protobuf.Empty unchecked_constructor = 2;
    google.protobuf.Empty arguments_to_default_fields = 3;
    google.protobuf.Empty class_used_outside_construction = 4;
    google.protobuf.Empty exported_class = 5;
    google.protobuf.Empty class_mutated = 6;
    google.protobuf.Empty class_members_escaped = 7;
    string field_may_exist_on_object_prototype = 8;
    google.protobuf.Empty undeclared_constructor_read = 9;
    uint64 unchecked_property_source = 10;
  }
}

enum DataflowOpacityCause {
  DATAFLOW_OPACITY_CAUSE_UNSPECIFIED = 0;
  DATAFLOW_OPACITY_CAUSE_MEMBER_WRITE_OR_ALIAS = 1;
  DATAFLOW_OPACITY_CAUSE_DYNAMIC_CELL_WRITES = 2;
  DATAFLOW_OPACITY_CAUSE_GLOBAL_OBJECT_ALIAS_ESCAPE = 3;
  DATAFLOW_OPACITY_CAUSE_OPAQUE_AT_INIT_CALL = 4;
}

message DeferredRecordMember {
  optional string name = 1;
  SourceLocation source_location = 2;
  repeated string captures = 3;
}

message DescriptorCopyAuthorRef {
  optional string defining_module = 1;
  optional string export = 2;
  optional string spec_location = 3;
}

message DescriptorCopyFactorySignature {
  optional uint64 argument_count = 1;
  optional uint64 object_argument = 2;
  // Both key collections must be nonempty and exclude __proto__.
  repeated string eager_own_data_keys = 3;
  repeated string assigned_data_keys = 4;
}

message DescriptorCopyFactorySummary {
  optional string defining_module = 1;
  optional string export = 2;
  optional string author_location = 3;
  repeated DescriptorCopyFactorySignature signatures = 4;
}

message EffectiveInitializerCallReplacement {
  optional string package = 1;
  optional string bundle_path = 2;
  optional string bundle_export = 3;
  optional .debundle.spec.PartialSwapKind symbol_kind = 4;
  optional string upstream_export = 5;
  optional string bundle_sha256 = 6;
}

message EvaluationEffects {
  repeated GlobalAccess global_accesses = 1;
}

enum ExecutionOperation {
  EXECUTION_OPERATION_UNSPECIFIED = 0;
  EXECUTION_OPERATION_MEMBERSHIP_PROTOCOL = 1;
  EXECUTION_OPERATION_INSTANCE_OF_PROTOCOL = 2;
  EXECUTION_OPERATION_DESTRUCTURING_PROTOCOL = 3;
  EXECUTION_OPERATION_MEMBER_READ = 4;
  EXECUTION_OPERATION_OBJECT_SPREAD = 5;
  EXECUTION_OPERATION_ARRAY_SPREAD = 6;
  EXECUTION_OPERATION_IMPLICIT_COERCION = 7;
  EXECUTION_OPERATION_PROPERTY_WRITE = 8;
  EXECUTION_OPERATION_RETURNED_CALLBACK = 9;
  EXECUTION_OPERATION_SUPERCLASS_CONSTRUCTION = 10;
  EXECUTION_OPERATION_OBJECT_ASSIGN = 11;
  EXECUTION_OPERATION_OPAQUE_EXECUTION = 12;
  EXECUTION_OPERATION_GENERATOR_PARAMETERS = 13;
  EXECUTION_OPERATION_CALLABLE_INPUTS = 14;
  EXECUTION_OPERATION_ARRAY_ITERATION = 15;
}

message ExecutionPrecisionLoss {
  optional .ducktape.debundle.saved_analysis.ExecutionPrecisionLossReason reason = 1;
  optional .ducktape.debundle.saved_analysis.HavocReach reach = 2;
  optional uint64 statement_ordinal = 3;
  optional .ducktape.debundle.saved_analysis.SourceLocation source_location = 4;
  optional .ducktape.debundle.saved_analysis.SourceSpan span = 5;
}

message ExecutionPrecisionLossReason {
  message UnsupportedOperation {
    optional .ducktape.debundle.saved_analysis.ExecutionOperation operation = 1;
    optional .ducktape.debundle.saved_analysis.OrderedFieldReadRefusal ordered_field_read_refusal = 2;
    optional .ducktape.debundle.saved_analysis.OrderedCallAdmissionRefusal ordered_call_admission_refusal = 3;
  }
  message CallbackPoolLimit {
    optional uint64 limit = 1;
    optional uint64 pool_size = 2;
  }
  oneof value {
    google.protobuf.Empty unknown_call_target = 1;
    google.protobuf.Empty missing_call_result = 2;
    UnsupportedOperation unsupported_operation = 3;
    .ducktape.debundle.saved_analysis.ConstructionRejection unsupported_construction = 4;
    google.protobuf.Empty recursive_invocation = 5;
    uint64 invocation_depth_limit = 6;
    uint64 invocation_expansion_limit = 7;
    CallbackPoolLimit callback_pool_limit = 8;
  }
}

enum ExportLinkage {
  EXPORT_LINKAGE_UNSPECIFIED = 0;
  EXPORT_LINKAGE_LOCAL = 1;
  EXPORT_LINKAGE_DEPENDENCY = 2;
}

message ExportReentryClosureBlocker {
  message NonEsmChunk {
    optional string source_chunk = 1;
  }
  message TopLevelAwait {
    optional string source_chunk = 1;
  }
  message OpenReplacementBundle {
    optional string source_chunk = 1;
  }
  message UnsupportedStaticRequest {
    optional string source_chunk = 1;
    optional string specifier = 2;
    .ducktape.debundle.saved_analysis.ExportReentryTarget resolved_target = 3;
  }
  message UnresolvedStaticRequest {
    optional string source_chunk = 1;
    optional string specifier = 2;
  }
  message MissingTargetChunk {
    optional string source_chunk = 1;
    optional string specifier = 2;
    optional string target_chunk = 3;
  }
  message NonEntryStaticRequest {
    optional string source_chunk = 1;
    optional string specifier = 2;
    .ducktape.debundle.saved_analysis.ExportReentryTarget resolved_target = 3;
    optional string entry_file = 4;
  }
  message TargetCycle {
    optional string target_chunk = 1;
  }
  oneof value {
    NonEsmChunk non_esm_chunk = 1;
    TopLevelAwait top_level_await = 2;
    OpenReplacementBundle open_replacement_bundle = 3;
    UnsupportedStaticRequest unsupported_static_request = 4;
    UnresolvedStaticRequest unresolved_static_request = 5;
    MissingTargetChunk missing_target_chunk = 6;
    NonEntryStaticRequest non_entry_static_request = 7;
    TargetCycle target_cycle = 8;
  }
}

message ExportReentryGlobalBlocker {
  message IncompleteArtifact {
    optional uint64 present_chunks = 1;
    optional uint64 expected_chunks = 2;
  }
  message NonOrdinaryStaticRequest {
    optional string source_chunk = 1;
    optional string specifier = 2;
    .ducktape.debundle.saved_analysis.ExportReentryTarget resolved_target = 3;
  }
  oneof value {
    IncompleteArtifact incomplete_artifact = 1;
    NonOrdinaryStaticRequest non_ordinary_static_request = 2;
  }
}

message ExportReentryHostBuiltinLeaf {
  optional string source_chunk = 1;
  optional string specifier = 2;
  .ducktape.debundle.saved_analysis.HostModule builtin = 3;
  optional uint64 request_count = 4;
}

message ExportReentryLoaderDerivation {
  message LoaderClosure {
    optional bool closed = 1;
    repeated .ducktape.debundle.saved_analysis.HostBehaviorKey host_keys = 2;
    repeated .ducktape.debundle.saved_analysis.ProgramPremiseKey premise_keys = 3;
    repeated .ducktape.debundle.saved_analysis.ExportReentryLoaderRequest requests = 4;
    repeated string loaded_chunks = 5;
    optional uint64 suspended_sites = 6;
    optional uint64 premised_sites = 7;
    optional uint64 outside_window_sites = 8;
    optional uint64 unreachable_sites = 9;
    repeated .ducktape.debundle.saved_analysis.ExportReentryLoaderFailure failures = 10;
    // Presence distinguishes an absent selection from a known empty selection.
    ExportReentryExports reentry_through = 11;
  }
  oneof value {
    google.protobuf.Empty no_synchronous_loader = 1;
    google.protobuf.Empty no_host_loader_sites = 2;
    LoaderClosure loader_closure = 3;
  }
}

message ExportReentryLoaderFailure {
  optional .ducktape.debundle.saved_analysis.LoaderClosureFailureKind reason = 1;
  optional uint64 occurrences = 2;
  .ducktape.debundle.saved_analysis.LoaderClosureWitness first = 3;
}

message ExportReentryLoaderRequest {
  optional string source_chunk = 1;
  optional string specifier = 2;
  .ducktape.debundle.saved_analysis.LoaderRequestReportTarget target = 3;
  optional uint64 request_count = 4;
}

message ExportReentryPolicy {
  oneof value {
    google.protobuf.Empty conservative = 1;
    google.protobuf.Empty no_static_importer_reentry = 2;
    ExportReentryExports reentry_through = 3;
  }
}

message ExportReentryReport {
  .ducktape.debundle.saved_analysis.HostBehavior host_behavior = 1;
  .ducktape.debundle.saved_analysis.ProgramPremises program_premises = 2;
  .ducktape.debundle.saved_analysis.ExportReentryPolicy policy = 3;
  .ducktape.debundle.saved_analysis.ExportReentryLoaderDerivation loader = 4;
  repeated .ducktape.debundle.saved_analysis.ExportReentryGlobalBlocker global_blockers = 5;
  repeated .ducktape.debundle.saved_analysis.ExportReentryClosureBlocker closure_blockers = 6;
  repeated .ducktape.debundle.saved_analysis.ExportReentryHostBuiltinLeaf host_builtin_leaves = 7;
}

message ExportReentryTarget {
  optional string chunk = 1;
  optional string file = 2;
}

message FirstClassMembersPublication {
  optional .ducktape.debundle.saved_analysis.ClassMembersPublicationWriter writer = 1;
  optional uint64 top_level_owner = 2;
  optional uint32 span_start = 3;
  optional uint32 span_end = 4;
  optional .ducktape.debundle.saved_analysis.BoundedInvocationFallbackInputPath bounded_fallback_input_path = 6;
  optional .ducktape.debundle.saved_analysis.BoundedInvocationFallbackCallSite bounded_fallback_callsite = 7;
}

message ForeignCallSummary {
  optional string defining_module = 1;
  optional string export = 2;
  optional string local = 3;
  SourceLocation source_location = 4;
  optional .ducktape.debundle.saved_analysis.ForeignInvocation invocation = 5;
  repeated ForeignReturn returns = 6;
  repeated uint64 retained_arguments = 7;
  repeated string retained_provider_captures = 8;
  repeated string provider_cell_reads = 9;
  repeated NativeIntrinsic native_constructions = 10;
  optional string replacement_package = 11;
  optional .ducktape.debundle.saved_analysis.ProofDependencies dependencies = 12;
}

enum ForeignInvocation {
  FOREIGN_INVOCATION_UNSPECIFIED = 0;
  FOREIGN_INVOCATION_CALL = 1;
  FOREIGN_INVOCATION_CONSTRUCT = 2;
}

message ForeignReturn {
  oneof value {
    uint64 argument_index = 1;
    google.protobuf.Empty fresh_allocation = 2;
    google.protobuf.Empty primitive = 3;
  }
}

message GlobalAccessEvidence {
  optional .ducktape.debundle.saved_analysis.ProofDependencies dependencies = 1;
  repeated AssumedEffectReason assumptions = 2;
}

enum GlobalAccessKind {
  GLOBAL_ACCESS_KIND_UNSPECIFIED = 0;
  GLOBAL_ACCESS_KIND_READ = 1;
  GLOBAL_ACCESS_KIND_WRITE = 2;
}

message GlobalAccessSite {
  optional uint64 lexical_owner = 1;
  optional uint32 start = 2;
  optional uint32 end = 3;
  optional .ducktape.debundle.saved_analysis.GlobalAccessKind access = 4;
  optional string property = 5;
}

enum GlobalReachCause {
  GLOBAL_REACH_CAUSE_UNSPECIFIED = 0;
  GLOBAL_REACH_CAUSE_UNKNOWN_CALLEE = 1;
  GLOBAL_REACH_CAUSE_TAINTED_INPUT = 2;
  GLOBAL_REACH_CAUSE_BORROWED_RECEIVER = 3;
  GLOBAL_REACH_CAUSE_DYNAMIC_SCOPE = 4;
  GLOBAL_REACH_CAUSE_FOREIGN_RECORD = 5;
  GLOBAL_REACH_CAUSE_UNMODELLED_OPERATION = 6;
  GLOBAL_REACH_CAUSE_ESCAPED_CALLBACK_POOL = 7;
}

message HavocReach {
  oneof value {
    google.protobuf.Empty bounded = 1;
    GlobalReachCause global = 2;
  }
}

message HostBehavior {
  optional .debundle.spec.SynchronousModuleLoader synchronous_module_loader = 1;
  optional .debundle.spec.LoaderResultForEvaluatingModule loader_result_for_evaluating_module = 2;
  optional .debundle.spec.SynchronousLoadRunsAppCallbacks synchronous_load_runs_app_callbacks = 3;
  optional .debundle.spec.SynchronousLoadDrainsMicrotasks synchronous_load_drains_microtasks = 4;
  // Empty collections grant no host permissions.
  repeated .debundle.spec.NodeBuiltinModule reentry_free_builtin_modules = 5;
  repeated .debundle.spec.BunModule reentry_free_bun_modules = 6;
  repeated .debundle.spec.EmbeddedLoader reentry_free_embedded_loaders = 7;
  repeated .debundle.spec.ReentryFreeOperation reentry_free_operations = 8;
  optional .debundle.spec.PredefinedGlobals predefined_globals = 9;
  optional string note = 10;
}

message HostBehaviorKey {
  oneof value {
    google.protobuf.Empty loader_result_for_evaluating_module = 1;
    google.protobuf.Empty synchronous_load_runs_app_callbacks = 2;
    google.protobuf.Empty synchronous_load_drains_microtasks = 3;
    .debundle.spec.NodeBuiltinModule reentry_free_builtin_module = 4;
    .debundle.spec.BunModule reentry_free_bun_module = 5;
    .debundle.spec.EmbeddedLoader reentry_free_embedded_loader = 6;
    .debundle.spec.ReentryFreeOperation reentry_free_operation = 7;
    google.protobuf.Empty predefined_globals = 8;
  }
}

message HostModule {
  oneof value {
    .debundle.spec.NodeBuiltinModule node = 1;
    .debundle.spec.BunModule bun = 2;
  }
}

message ImportedPrimitiveArrayLifetimeContract {
  optional bool identity_unchanged_through_spread = 1;
  optional bool dense_own_data_primitive_contents_unchanged_through_spread = 2;
  optional bool ordinary_array_prototype_chain_unchanged_through_spread = 3;
  optional bool no_own_iterator_or_accessors_through_spread = 4;
  optional bool no_rebinding_through_spread = 5;
}

message ImportedPrimitiveArrayOperandEvidence {
  optional string selector_local = 1;
  optional string consumer_binding = 2;
  optional string provider_module = 3;
  optional string provider_export = 4;
  optional string provider_local = 5;
  optional string source_specifier = 6;
  optional .ducktape.debundle.saved_analysis.SourceMatchClaim provider_source_match = 7;
  optional string provider_source_sha256 = 8;
  repeated uint32 primitive_slots = 9;
  SourceLocation provider_source_location = 10;
}

message ImportedPrimitiveArraySpreadInputEvidence {
  optional .ducktape.debundle.saved_analysis.ImportedPrimitiveArraySpreadInputRef reference = 1;
  optional string spec_location = 2;
  optional .ducktape.debundle.saved_analysis.SourceMatchClaim consumer_source_match = 3;
  optional string consumer_source_sha256 = 4;
  optional string selected_consumer_binding = 5;
  SourceLocation consumer_source_location = 6;
  repeated ImportedPrimitiveArrayOperandEvidence operands = 7;
  optional .ducktape.debundle.saved_analysis.ImportedPrimitiveArrayLifetimeContract lifetime = 8;
}

message ImportedPrimitiveArraySpreadInputRef {
  optional string defining_chunk = 1;
  optional uint64 input_index = 2;
}

message ImportedPrimitiveArraySpreadInputUse {
  optional .ducktape.debundle.saved_analysis.ImportedPrimitiveArraySpreadInputEvidence evidence = 1;
  optional uint64 operand_index = 2;
}

message ImportedPrimitiveRead {
  optional uint32 kinds = 1;
  optional string provider_module = 2;
  repeated string dependency_closure = 3;
  repeated PrimitiveExportCell source_cells = 4;
}

enum InferenceRule {
  INFERENCE_RULE_UNSPECIFIED = 0;
  INFERENCE_RULE_NATIVE_INTEGRITY = 1;
  INFERENCE_RULE_NATIVE_CALL_IDENTITY = 2;
  INFERENCE_RULE_NATIVE_OWN_DATA_READ = 3;
  INFERENCE_RULE_EMPTY_COLLECTION_CONSTRUCTION = 4;
  INFERENCE_RULE_LOCAL_CLASS_CONSTRUCTION = 5;
  INFERENCE_RULE_PRIMITIVE_SET_ITERATION = 6;
  INFERENCE_RULE_STABLE_PRIMITIVE_ARRAY_SPREAD = 7;
  INFERENCE_RULE_IMPORTED_PRIMITIVE_ARRAY_SPREAD = 8;
  INFERENCE_RULE_STABLE_FUNCTION = 9;
  INFERENCE_RULE_STABLE_PROVIDER = 10;
  INFERENCE_RULE_ARGUMENT_NO_ESCAPE = 11;
  INFERENCE_RULE_RETURNED_RECORD = 12;
  INFERENCE_RULE_NAMESPACE_WRAPPER = 13;
  INFERENCE_RULE_OWN_PROPERTY_SOURCE_ORIGIN = 14;
  INFERENCE_RULE_OWN_PROPERTY_SHAPE = 15;
