source_matches:
  - match: |
      var ANYTHING = ANYTHING,
        isSingleCharacter = (char) =>
          char.codePointAt(0) !== void 0 && char.codePointAt(1) === void 0,
        satisfiesWordInvariant = AST_CONTAINS_STRING("Word should not contain any whitespaces!"),
        ANYTHING = ANYTHING;
    bindings:
      - isSingleCharacter
      - satisfiesWordInvariant
