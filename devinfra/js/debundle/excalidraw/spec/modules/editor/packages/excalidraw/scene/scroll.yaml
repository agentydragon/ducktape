# Upstream owner: packages/excalidraw/scene/scroll.ts
source_matches:
  - match: |
      var isOutsideViewPort = (appState, cords) => {
        let [x1, y1, x2, y2] = cords,
          { x: viewportX1, y: viewportY1 } = sceneCoordsToViewportCoords({sceneX: x1, sceneY: y1}, appState),
          { x: viewportX2, y: viewportY2 } = sceneCoordsToViewportCoords({sceneX: x2, sceneY: y2}, appState);
        return viewportX2 - viewportX1 > appState.width || viewportY2 - viewportY1 > appState.height;
      };
    bindings:
      - isOutsideViewPort

  - match: |
      var selected = ({
        scenePoint: scenePoint,
        viewportDimensions: viewportDimensions,
        zoom: zoom,
        offsets: offsets,
      }) => {
        STMT_LIST;
        return (EXPR, {scrollX: EXPR, scrollY: EXPR});
      };
    bindings:
      - local: selected
        name: centerScrollOn

  - match: |
      var selected = (elements, appState) => {
        if (EXPR, !elements.length) return {scrollX: 0, scrollY: 0};
        STMT_LIST;
        return EXPR({
          scenePoint: {x: EXPR, y: EXPR},
          viewportDimensions: {width: appState.width, height: appState.height},
