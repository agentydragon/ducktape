syntax = "proto3";

package ducktape.debundle.solver_backends.ortools_cpsat;

message SelectorCpSatRequest {
  repeated Variable variables = 1;
  reserved 3, 6;
  repeated TableConstraint allowed_tables = 2;
  repeated AllDifferent all_different = 4;
  repeated TargetProjection target_projections = 5;
  repeated AllowedRowSet allowed_row_sets = 7;
  repeated SharedSparseDomain shared_sparse_domains = 8;
}

message Variable {
  uint32 id = 1;
  string debug_name = 3;
  oneof domain {
    DenseDomain dense_domain = 4;
    SparseDomain sparse_domain = 5;
    uint32 shared_sparse_domain_id = 6;
  }
}

message DenseDomain {
  uint32 value_count = 1;
}

message SparseDomain {
  repeated int64 values = 1;
}

message SharedSparseDomain {
  uint32 id = 1;
  repeated int64 values = 2;
}

// `target_ids` attributes a constraint to the targets whose selectors it
// encodes. Attribution only matters once the plain solve is infeasible: the
// sidecar then enforces the constraint only while every listed target is
// enabled, and reports which targets had to be disabled (see
// `SelectorCpSatResponse.conflicts`). An empty list keeps the constraint hard.
message TableConstraint {
  uint32 id = 1;
  repeated uint32 variable_ids = 2;
  repeated Tuple allowed_rows = 3;
  optional uint32 row_set_id = 4;
  repeated uint32 target_ids = 5;
}

message AllowedRowSet {
  uint32 id = 1;
  uint32 arity = 2;
  repeated int64 values = 3;
}

message Tuple {
  repeated int64 values = 1;
}

message AllDifferent {
  uint32 id = 1;
  repeated uint32 variable_ids = 2;
  // Parallel to `variable_ids`: the targets each entry is attributed to, with
  // `TableConstraint.target_ids` semantics. A disabled entry leaves the
  // constraint; the remaining entries stay pairwise distinct.
  repeated TargetSet entry_targets = 3;
}

message TargetSet {
  repeated uint32 target_ids = 1;
}

message TargetProjection {
  uint32 target_id = 1;
  uint32 owner_variable_id = 2;
  oneof binding_projection {
    uint32 binding_variable_id = 3;
    string binding_const = 4;
  }
}

message SelectorCpSatResponse {
  SolverStatus status = 1;
  AssignmentCoverage assignment_coverage = 2;
  repeated AssignmentRow assignments = 3;
  string diagnostic = 4;
  string solver_response_stats = 5;
  // Set only when the plain solve was infeasible. Each entry is one
  // infeasible core (CP-SAT's sufficient assumptions, not necessarily
  // minimal): with all its targets enabled, the attributed constraints have no
  // solution. `status`, `assignment_coverage` and `assignments` then describe
  // the targets outside every conflict set, solved with the conflicting
  // targets disabled.
  repeated ConflictSet conflicts = 6;
}

message ConflictSet {
  repeated uint32 target_ids = 1;
}

enum SolverStatus {
  SOLVER_STATUS_UNSPECIFIED = 0;
  SOLVER_STATUS_SATISFIABLE = 1;
  SOLVER_STATUS_UNSATISFIABLE = 2;
  SOLVER_STATUS_AMBIGUOUS = 3;
  SOLVER_STATUS_INVALID = 4;
  SOLVER_STATUS_UNKNOWN = 5;
}

enum AssignmentCoverage {
  ASSIGNMENT_COVERAGE_UNSPECIFIED = 0;
  ASSIGNMENT_COVERAGE_SAMPLE = 1;
  ASSIGNMENT_COVERAGE_TARGET_SUPPORT_COMPLETE = 2;
}

message AssignmentRow {
  repeated Assignment values = 1;
}

message Assignment {
  uint32 variable_id = 1;
  int64 value = 2;
}
