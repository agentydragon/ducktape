# v0.18.1 packages/math/line.ts. Several constructors return [a, b];
# the adjacent intersection function distinguishes the line constructor.
source_matches:
  - match: |
      function line(a, b) {
        return [a, b];
      }
      function linesIntersectAt(a, b) {
        let a1 = a[1][1] - a[0][1], b1 = a[0][0] - a[1][0],
          a2 = b[1][1] - b[0][1], b2 = b[0][0] - b[1][0],
          determinant = a1 * b2 - a2 * b1;
        if (determinant !== 0) {
          let c1 = a1 * a[0][0] + b1 * a[0][1], c2 = a2 * b[0][0] + b2 * b[0][1];
          return pointFrom((c1 * b2 - c2 * b1) / determinant, (a1 * c2 - a2 * c1) / determinant);
        }
        return null;
      }
    bindings:
      - line
      - linesIntersectAt
