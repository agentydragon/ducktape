# Workflow trigger definitions - single source of truth
#
# This file defines all CI workflows and their triggers. The generator script
# (generate_ci.py) reads this to produce .github/workflows/ci.yml.
#
# Trigger types (discriminated by trigger.kind):
#   always: Always run this workflow
#   bazel_query: Bazel query expression over affected targets ($targets placeholder)
#   path: Regex pattern for changed files
#
# Job options:
#   targets: Pass affected targets to the workflow (default: false)
#   secrets: inherit - pass all caller secrets to the workflow (also implies RBE wiring)
#   inputs: Additional inputs to pass to the workflow
#
# Workflow file changes automatically trigger their workflow.

workflows:
  # Bazel build/test is handled by BuildBuddy Workflows (buildbuddy.yaml).
  # GitHub Actions only runs non-Bazel and image-build workflows here.

  # Image builds
  rbe-image:
    trigger: { kind: path, pattern: "^devinfra/rbe_image/" }

  # Note: E2E container was moved to a pure Bazel build (rules_distroless).
  # See devinfra/claude/hook_daemon/session_start/container_e2e/BUILD.bazel.

  # Bazel image workflows always trigger. Bazel builds are hermetic, so same
  # inputs → same image digest. Docker push deduplicates at the blob level
  # (existing layers aren't re-uploaded), so unchanged images have minimal
  # network cost. Always-trigger also avoids the stale-image bug where
  # bazel-diff (HEAD vs HEAD~1) misses changes from earlier commits whose
  # push step failed.
  props-images:
    trigger: { kind: always }
    events: [push]
    secrets: inherit

  # Harbor images are now pushed via BuildBuddy Workflows (buildbuddy.yaml
  # "Push Harbor Images" action) using oci_push targets. The GHA workflow
  # bazel-harbor-images.yml has been removed.

  openclaw-image:
    trigger: { kind: path, pattern: "^(openclaw/|airlock/openclaw/)" }
    events: [push]
    secrets: inherit
    rbe: false

  # Path-based workflows (non-Bazel)
  nix-attic-push:
    trigger: { kind: always }
    events: [push]
    secrets: inherit
    rbe: false

  ansible-lint:
    trigger: { kind: path, pattern: "^ansible/" }

  # Always-run workflows
  pre-commit:
    trigger: { kind: always }

# Release: bb_release.sh creates GitHub Releases; sync-pins.yml (periodic)
# updates npins/sources.json. No GHA workflow dispatch needed.
