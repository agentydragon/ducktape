# Web session profile — `home-manager` install mode
# (DUCKTAPE_WEB_SETUP_MODE=home-manager): web_setup.sh runs
# `home-manager switch --flake .#claude-web`, which installs the devtools into
# the home-manager profile at ${HOME}/.nix-profile. Point
# DUCKTAPE_CLAUDE_HOOKS_PROFILE at THIS file (not profile.yaml) for that mode.
#
# SYNC: profile.yaml (this dir) is the `profile`-mode sibling. The two are
# standalone copies that MUST stay in sync EXCEPT for the env_exports PATH
# wiring (the only intended divergence):
#   - profile.yaml (profile mode): prepend /usr/local/bin (the symlink bridge)
#   - this file (HM mode):         source hm-session-vars.sh (full HM session env)
# Change startup_env_script, background_commands, context_template, and git_shim
# in both files together.
startup_env_script: devinfra/secrets/web_env.sh

idle_watchdog: false

# CLEANUP(added 2026-05-30): the keys below were removed because the Rust `claude-hook`
# daemon IGNORES them — serde drops unknown fields (see config.rs), so they were
# honored only by the retired Python daemon. Leaving them implied behavior that
# does not happen: `setup_docker: true` did NOT start Docker (confirmed by the
# web_selfcheck W5 finding on 2026-05-30). Removed:
#   otel:            { endpoint: https://alloy-otlp.allegedly.works/v1/traces }
#   setup_tmpfs:     true
#   setup_docker:    true
#   bazel_bes_proxy: { target: remote.buildbuddy.io:443 }
# Restore a key (with a ProfileConfig field + test) when the Rust daemon
# implements it; otherwise delete this tombstone once the "Rust parity
# follow-ups" item in devinfra/claude/TODO.md is closed as won't-do.
# NOTE: DUCKTAPE_OTEL_BEARER_TOKEN is still exported by web_env.sh, independent
# of the removed `otel:` key.
env_exports: |
  export DUCKTAPE_PRECOMMIT_ENFORCE_BAZEL_TESTS=0
  export DUCKTAPE_PRECOMMIT_ENFORCE_TEST_TAG=1
  # Pull the full home-manager session environment into the agent's Bash tool
  # env — PATH (nix-profile bin, placed ahead of /opt/node22 so the nix devtools
  # win), NIX_PROFILES, XDG_DATA_DIRS, LOCALE_ARCHIVE_2_27, XCURSOR_PATH — not
  # just PATH. home-manager activation wrote this script; the agent's frozen
  # shell snapshot never sources the HM rc, so source it here.
  #
  # USER must be exported first: hm-session-vars sources nix.sh, whose body (the
  # PATH prepend included) is gated on `[ -n "$USER" ]`, and Claude Code launches
  # the agent shell with USER unset. nix.sh re-points NIX_SSL_CERT_FILE at
  # /etc/ssl/certs/ca-certificates.crt — already the session value (Anthropic's
  # MITM CA bundle) — so HTTPS keeps working.
  # SYNC: profile.yaml prepends /usr/local/bin instead; only home-manager mode
  # writes hm-session-vars.sh (nix profile install does not), so the modes differ.
  export USER="${USER:-$(id -un)}"
  if [ -f "${HOME}/.nix-profile/etc/profile.d/hm-session-vars.sh" ]; then
    . "${HOME}/.nix-profile/etc/profile.d/hm-session-vars.sh"
  fi
background_commands:
  # Materializes ~/.kube/config from the SOPS-encrypted JWT in
  # secrets/claude-web-k8s-jwt.yaml. See kubeconfig.py's module
  # docstring for the full rationale (token vs cert, why the egress proxy
  # breaks client-cert auth on CC web).
  - name: kubeconfig
    command: python3 "$CLAUDE_PROJECT_DIR/devinfra/k8s/kubeconfig.py" --write ~/.kube/config
    timeout: 30
    after_env: true
  - name: creds banner
    command: bash "$CLAUDE_PROJECT_DIR/devinfra/claude/claude_hook/creds_banner.sh"
    timeout: 10
    after_env: true
  # Localhost OTLP relay for Claude Code native telemetry (session env points
  # OTEL_EXPORTER_OTLP_ENDPOINT at 127.0.0.1:4318; the claude process can't
  # egress directly). Idempotent: no-op if a forwarder is already listening.
  - name: otel forwarder
    command: bash "$CLAUDE_PROJECT_DIR/devinfra/claude/ensure_otel_forwarder.sh"
    timeout: 90
    after_env: true
  - name: nix nixpkgs check
    command: |
      if ! command -v nix &>/dev/null; then
        echo "ERROR: Nix not found on PATH. web_setup.sh should have installed Nix — did it complete successfully?"
        exit 1
      fi
      if nix-instantiate '<nixpkgs>' --eval -E '1' &>/dev/null 2>&1; then
        echo "Nix: nixpkgs available. Use 'nix-shell -p <pkg> --run <cmd>' or 'nix shell nixpkgs#<pkg>'."
      else
        echo "Nix: nixpkgs not configured. Configuring nixpkgs-unstable channel..."
        nix-channel --add https://nixos.org/channels/nixpkgs-unstable nixpkgs
        nix-channel --update nixpkgs
        echo "Nix: nixpkgs channel configured."
      fi
    timeout: 120
  - name: apt package install
    command: |
      apt-get update -qq &&
      apt-get install -y -qq libgirepository-2.0-dev libcairo2-dev libdbus-1-dev
    timeout: 300
  - name: pre-commit setup
    command: pre-commit install --install-hooks
    timeout: 300
  - name: git remote info
    command: |
      echo "Git remotes (set up by web_setup.sh):"
      echo "  origin          — Anthropic's local git proxy (routes to GitHub). Push here: git push origin <branch>."
      echo "  github-no-proxy — Plain GitHub HTTPS URL, no credentials."
      echo "                    Exists ONLY as a bbr shim: BB's RBE runner runs on their cloud and cannot"
      echo "                    reach the local proxy URL (127.0.0.1:51318) that 'origin' uses. bbr selects"
      echo "                    this remote so the cloud runner can fetch the repo from GitHub directly."
      echo "                    Do NOT push to github-no-proxy — no push credentials. Always push to origin."
    timeout: 10
  - name: bazelisk warmup (query //...)
    command: |
      bazelisk query //... >/dev/null &
      bazelisk_pid=$!
      echo "Bazel warmup running (PID ${bazelisk_pid}). Output base lock held until finished."
      echo "To cancel: kill -TERM ${bazelisk_pid}"
      wait "${bazelisk_pid}"
    timeout: 300
    after_env: true
context_template: devinfra/claude/claude_hook/profiles/web/context.mako
