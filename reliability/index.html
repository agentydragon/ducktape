              ${"The "}
              <${Anchor} href=${oldReport}
                >${"previous canonical reliability report"}<//
              >
              ${" measured 30 October 22:10–1 November 21:45 UTC at devel de5f6710. Its 5/45 tracked VM failures and separate 1 November GitHub job-attempt subset remain historical measurements; 9 November was a presentation-only update. They are not relabeled as this window's rates."}
            <//>
            <${Box} visibleFrom="sm">
              <${Table.ScrollContainer}
                minWidth=${760}
                type="native"
                my="md"
                maw="100%"
              >
                <${Table} striped highlightOnHover verticalSpacing="sm">
                  <${Table.Thead}>
                    <${Table.Tr}
                      ><${Table.Th}>${"Prior item"}<//
                      ><${Table.Th}>${"Disposition"}<//><//
                    >
                  <//>
                  <${Table.Tbody}>
                    ${prior.map(
                      (row) =>
                        html`<${Table.Tr} key=${row.item}>
                          <${Table.Td}>${row.item}<//>
                          <${Table.Td}>${row.state}<//>
                        <//>`,
                    )}
                  <//>
                <//>
              <//>
            <//>
            <${Stack} hiddenFrom="sm" gap="sm" my="md">
              ${prior.map(
                (row) =>
                  html`<${Paper} key=${row.item} withBorder p="md">
                    <${Text} fw=${700}>${row.item}<//>
                    <${Text} component="p" size="sm" my="sm">${row.state}<//>
                  <//>`,
              )}
            <//>
          <//>

          <${Stack} component="section" id="limits" gap="sm" my="xl">
            <${Title} order=${2}>${"Scope and visibility limits"}<//>
            <ul>
              <li>
                ${"This focused eight-day collection measures the indexed VM target and selected #15493 attempts; it does not measure repository-wide PR reliability, merged-PR check state or a full physical-test denominator."}
              </li>
              <li>
                ${"The stats API's 98 runs and target history's 917 rows have different definitions. Cached passes are not fresh executions. Eight likely-flaky samples are BuildBuddy's cross-run heuristic, not eight verified same-source recoveries."}
              </li>
              <li>
                ${"No retained guest trace spans the VM2 console cutoff; no failed-snapshot creator/CPU/TSC values or timestamp of the final systemd proof-read entry is available."}
              </li>
              <li>
                ${"A later passing rerun would add a verdict. It would not show that either kernel panic, snapshot provenance fault, guest-progress stall or supervision deadline mechanism has been repaired."}
              </li>
            </ul>
          <//>
          <${Box} component="footer" c="dimmed" mt="xl">
            <${Anchor} href="evidence.json">${"Evidence"}<//>
            ${" · "}
            <${Anchor} href="manifest.json">${"Manifest"}<//>
            ${" · "}
            <${Anchor} href="../latency/">${"CI latency"}<//>
            ${" · "}
            <${Anchor} href="../">${"All reports"}<//>
            <${Text} component="p" size="sm" my="sm">
              ${"Latest-only snapshot. GitHub Pages updates after a gh-pages PR merges."}
            <//>
          <//>
        <//>`;
      }

      mount(Report);
    </script>
  </body>
</html>
