    <script type="module">
      import { useState } from "react";
      import {
        Accordion,
        Alert,
        Anchor,
        Badge,
        Code,
        Container,
        Group,
        Paper,
        SimpleGrid,
        Stack,
        Table,
        Text,
        TextInput,

      } from "@mantine/core";
      import { BarChart } from "@mantine/charts";
      import { html, mount, ManifestStamp } from "../report.js";
      import { DailyVmChart } from "./charts.js";
      const response = await fetch("./evidence.json");
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const e = await response.json();
      const gh = "https://github.com/agentydragon/ducktape";
      const bb = "https://app.buildbuddy.io/invocation/";
      const link = (url, label) => html`<${Anchor} href=${url}>${label}<//>`;
      const pr = (n) => link(`${gh}/pull/${n}`, `#${n}`);
      const percent = (n, d) => `${((100 * n) / d).toFixed(1)}%`;
      const rows = (heads, values, minWidth = 660) =>
        html`<${Table.ScrollContainer}
          minWidth=${minWidth}
          type="native"
          maw="100%"
          ><${Table} striped verticalSpacing="sm"
            ><${Table.Thead}
              ><${Table.Tr}
                >${heads.map((h) => html`<${Table.Th} key=${h}>${h}<//>`)}<//
              ><//
            ><${Table.Tbody}
              >${values.map((r, i) => html`<${Table.Tr} key=${i}>${r.map((cell, j) => html`<${Table.Td} key=${j}>${cell}<//>`)}<//>`)}<//
            ><//
          ><//
        >`;
      function Metric({ value, label, detail }) {
        return html`<${Paper} withBorder p="md"
          ><${Text} size="xl" fw=${700}>${value}<//
          ><${Text} fw=${600}>${label}<//
          ><${Text} size="sm" c="dimmed" mt="xs">${detail}<//><//
        >`;
      }
      function SetupTimeline() {
        const d = e.setup_breakdown;
        const lanes = [
          {
            label: "Open cold K3s",
            color: "#1971c2",
            spans: d.spans.filter(
              (s) => s.name === "system_test.k3s.baseline.open",
            ),
          },
          ...Object.keys(d.image_groups_seconds).map((g, i) => ({
            label: g,
            color: ["#e67700", "#7048e8", "#0b7285", "#c2255c"][i],
            spans: d.images.filter((s) => s.group === g),
          })),
          {
            label: "Controllers / apply (overlap)",
            color: "#2b8a3e",
            spans: d.spans.filter((s) =>
              [
                "system_test.virtualization.install",
                "system_test.pki.controllers",
                "system_test.crds.apply",
                "system_test.virtualization.apis",
                "system_test.manifests.apply",
                "system_test.pki.issuance",
                "system_test.virtualization.ready",
              ].includes(s.name),
            ),
          },
        ];
        const x = (seconds) => 276 + (660 * seconds) / d.setup_seconds;
        return html`<${Table.ScrollContainer}
          minWidth=${960}
          type="native"
          maw="100%"
        >
          <svg
            viewBox="0 0 970 260"
            role="img"
            aria-label="375-second VM setup timeline: serial image imports overlap controller and manifest work"
            style=${{ width: "100%", display: "block", color: "var(--mantine-color-text)" }}
          >
            <text x="276" y="18" fill="currentColor" fontSize="13">
              Seconds since fixture setup began (UTC 12:40:46.778)
            </text>
            ${[0, 60, 120, 180, 240, 300, 375].map((t) => html`<g key=${t}><line x1=${x(t)} x2=${x(t)} y1="42" y2="250" stroke="currentColor" opacity="0.15" /><text x=${x(t)} y="37" textAnchor="middle" fill="currentColor" fontSize="12">${t}</text></g>`)}
            ${lanes.map((lane, i) => html`<g key=${lane.label}><text x="4" y=${66 + i * 33} fill="currentColor" fontSize="13">${lane.label}</text>${lane.spans.map((span, j) => html`<rect key=${j} x=${x(span.start_offset_seconds)} y=${51 + i * 33} width=${Math.max(1, x(span.end_offset_seconds) - x(span.start_offset_seconds))} height="21" rx="2" fill=${lane.color}><title>${span.image ?? span.name}: ${span.seconds.toFixed(3)} seconds</title></rect>`)}</g>`)}
          </svg>
        <//>`;
      }
      function Report() {
        const [query, setQuery] = useState("");
        const findings = e.findings.filter((f) =>
          `${f.id} ${f.title} ${f.classification}`
            .toLowerCase()
            .includes(query.toLowerCase()),
        );
        const v = e.vm_exposure;
        return html`<${Container}
          component="main"
          size="76rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
          ><${Stack} gap="xl">
            <header>
              ${link("../", "Ducktape reports")}
              <${Text} c="dimmed" mt="md"
                >CI reliability · 10–16 November 2026 UTC<//
              >
              <${Title} order=${1} my="sm"
                >VM setup and infrastructure remain the main reliability work<//
              >
              <${Text} size="lg"
                >32 of 883 completed mainline test invocations failed (3.6%).
                They include test failures, sustained build regressions and
                remote failures. This is an invocation failure frequency; a
                repository flake rate is not established.<//
              >
              <${Text} size="sm" c="dimmed" mt="sm"
                ><${ManifestStamp} src="./manifest.json"
              /><//>
              <${Text} size="sm"
                >Inspected source
                ${link(`${gh}/commit/${e.source_devel_commit}`, html`<${Code}>${e.source_devel_commit}<//>`)}.
                Exact window: 2026-11-10 00:00 UTC (inclusive) to 2026-11-17
                00:00 UTC (exclusive), using invocation creation or PR merge
                time. Collected ${e.collected_at_utc}.${" "}
                ${link("./evidence.json", "Reviewed evidence")} ·
                ${link("./manifest.json", "Manifest")}<//
              >
            </header>
            <section id="vm-shadow">
              <${Title} order=${2}>Managed TCG and cluster KVM · paired VM runs<//>
              <${Text} size="sm" mt="sm">${e.vm_shadow_review.sample_note}<//>
              ${e.vm_shadow_review.sections.map(
                ({ heading, text }) =>
                  html`<div key=${heading}>
                    <${Title} order=${3} mt="md">${heading}<//>
                    <${Text} mt="xs">${text}<//>
                  </div>`,
              )}
              <${Text} size="sm" mt="sm">${e.vm_shadow_review.selection_note}<//>
              <${Text} size="sm" mt="xs">
                ${link(e.vm_shadow_review.run_url, "Fresh pre-cutover pair")}${" · "}
                ${link(e.vm_shadow_review.paired_evidence, "Per-pair measurements")}${" · "}
                ${link(e.vm_shadow_review.routing_url, "Merged routing change")}${" · "}
                ${link(e.vm_shadow_review.required_pr_invocation_url, "Required PR VM execution")}${" · "}
                ${link(e.vm_shadow_review.post_cutover_url, "First post-cutover run")}${" · "}
                ${link(e.vm_shadow_review.fresh_post_cutover_artifact_url, "Fresh post-cutover archive")}${" · "}
                ${link("https://app.buildbuddy.io/invocation/2de8e501-a373-4c7c-908b-cabd1681e04a", "Manual pair 64")}${" · "}
                ${link("https://github.com/agentydragon/ducktape/blob/gh-pages/README.md#reviewing-paired-vm-runs", "Archive reference")}
              <//>
            </section>
            <${SimpleGrid} cols=${{ base: 1, sm: 3 }}>
              <${Metric}
                value="32 / 883"
                label="Failed completed test invocations"
                detail="851 succeeded. Six disconnected invocations are separate. Unit: unique child Bazel test invocation with canonical repo, CI role and devel branch."
              />
              <${Metric}
                value="10 / 149"
                label="Failed non-cached VM test runs"
                detail="6.7% observed frequency in this target/configuration. 704 cached passes and two failures before TestResult are excluded from this denominator."
              />
              <${Metric}
                value="3 / 1,487"
                label="Devel PRs merged with a visible red gate"
                detail="Seven additional PRs had a check crossing merge time; two have unknown merge-time state. This measures operator friction, not flaky tests or proven overrides."
              />
            <//>
            <${Alert}
              color="blue"
              title="Prior repairs and coverage changed during this window"
            >
              The old and new seven-day windows overlap. The earlier 28/88 VM
              API count and current 12/151 count have different source and
              exposure; they do not establish an improvement.${" "}${pr(15897)}
              moved unsupported Codex OOM-survival coverage to manual on 12
              November. ${" "}${pr(17117)} moved a memory benchmark to manual
              after this window. Both policy changes are explicit below; neither
              repairs runtime behavior.
            <//>
            <${Group} component="nav" aria-label="Report sections">
              ${link("#selected-experiments", "Latest experiments")}${link("#vm-forensics", "Accounting and kernel stall")}${link("#priorities", "Priorities")}${link("#populations", "Counts and cache")}${link("#vm-phases", "VM causal timeline")}${link("#baseline-census", "Baseline census")}${link("#merges", "Merge-time checks")}${link("#continuity", "Prior interventions")}${link("#limits", "Coverage limits")}
            <//>
            <section id="priorities">
              <${Title} order=${2} mb="sm"
                >Ranked findings and next decisions<//
              >
              <${Text} mb="md"
                >Order weighs recurrence, retry/operator cost, mechanism
                confidence and repair cost. The original-window findings remain below. The 17 November follow-up records the separately merged accounting repair and new forensic evidence; it does not remeasure the historical population.<//
              >
              <${TextInput}
                label="Filter findings"
                placeholder="Search title or classification"
                value=${query}
                onChange=${(event) => setQuery(event.currentTarget.value)}
                mb="md"
              />
              <${Text} size="sm" c="dimmed" mb="sm" aria-live="polite"
                >${findings.length} of ${e.findings.length} findings<//
              >
              <${Stack} gap="md">
                ${findings.map(
                  (f) =>
                    html`<${Paper}
                      key=${f.id}
                      withBorder
                      p="lg"
                      data-finding=${f.id}
                      ><${Stack} gap="sm">
                        <${Group} justify="space-between"
                          ><${Title} order=${3}>${f.id}. ${f.title}<//
                          ><${Badge} variant="light"
                            >${f.status ?? (f.id === "D" || f.id === "F" ? "Historical / changed" : "Open")}<//
                          ><//
                        >
                        <${Text} size="sm" c="dimmed">${f.classification}<//
                        ><${Text} fw=${600}>${f.frequency}<//>
                        <${Text}>${f.observation}<//
                        ><${Text}>${f.comparator}<//>
                        <${Text} fw=${600}
                          >Repair or next discriminating observation<//
                        ><${Text}>${f.repair}<//>
                        <${Text} size="sm" c="dimmed">${f.limit}<//
                        ><${Group} gap="md"
                          >${f.links.map((l) => html`<span key=${l.url}>${link(l.url, l.label)}</span>`)}<//
                        >
                      <//><//
                    >`,
                )}
                ${findings.length ? null : html`<${Text}>No findings match this filter.<//>`}
              <//>
            </section>
            <section id="vm-forensics">
              <${Title} order=${2} mb="sm">17 November: accounting verified; the failed guest never reached Runtime<//>
              <${Alert} color="blue" title="Selected forensic samples outside the original seven-day population" mb="md">
                ${pr(17261)} merged at 09:10:46 UTC as <${Code}>db353034c0bc1e8d4a044f9e2c542ebf8a4caf36<//>. All three required checks passed on head <${Code}>3bbb9a307818dfc2171be8df2cb03db69fdfc3d9<//>. Its CI tested synthetic merge <${Code}>705e62f414eaee959b3d011142bc31cbc77ec6a4<//>, including one fresh remote VM result in 441.176 seconds. That is validation of this run, not a measured reduction in flakiness.
              <//>
              <${Text}>The case clock now begins after shared setup. Native pytest phase timings and <${Code}>junit_duration_report=call<//> separate callback durations from shared setup/teardown. Five focused regressions cover slow setup, selection, blocked case, setup failure and teardown failure; the old-policy control fails during its 1.2-second shared setup against a one-second item deadline. Bazel's total process watchdog remains in place. ${link(bb + "b432a3f9-397b-41d5-8a01-1171fa5b34be", "Focused regressions")}${" · "}${link(bb + "d01b5f9c-efc7-401d-854f-a54303c31402", "old-policy negative control")}<//>
              ${rows(
                [
                  "Sample / seconds",
                  "Shared setup",
                  "Claude call",
                  "Codex call",
                  "Shared teardown",
                  "JUnit suite wall",
                  "TestRunner",
                ],
                e.vm_forensics.timings.map((t) => [
                  t.sample,
                  t.setup_seconds.toFixed(2),
                  t.claude_call_seconds.toFixed(3),
                  t.codex_call_seconds.toFixed(3),
                  t.teardown_seconds.toFixed(2),
                  t.junit_suite_seconds.toFixed(3),
                  t.test_runner_seconds.toFixed(3),
                ]),
              )}
              <${Text} size="sm" mt="sm">Cases overlap, so their times are not additive. TestRunner includes work outside pytest. The warm failed manual candidate and cold rebased CI pass differ in source, configuration and retained state; their elapsed difference is not a causal speedup. JUnit's failed sample contains two callbacks plus a separate zero-call-time Codex teardown-error row, preserving the shared failure without inventing a third scenario. ${link(bb + "7ba9c250-4568-467b-9ab6-8496e2e2a795", "Manual failure")}${" · "}${link(bb + "3efe5700-2b96-55a4-b733-784c672a3a09", "rebased CI pass")}<//>
              <${Alert} color="green" mt="md" title="Two bounded uncached repetitions pass at pinned source">
                ${link(bb + "95e444be-2b63-40c0-a51f-4f89cfa582db", "Repetition invocation 95e444be")} tests source <${Code}>d16ba5c2b1d7e93efe812d4c6a9d9a2143913aca<//>. Both runs are cold and exercise Claude and Codex; all four guest serials contain shutdown-complete receipts and neither has an RCU-stall warning. One suite takes 687.555s with 362.72s shared setup while both callbacks remain below 289s: the intended accounting boundary is exercised by a real cold run longer than the former item deadline. Three physical TestRunner IDs produced two passing results plus one separate provider UNAVAILABLE pause-socket refusal before a native retry. These passes do not reproduce or repair the kernel stall, and do not establish a fleet rate.
              <//>
              <${Title} order=${3} mt="lg" mb="sm">Startup: kernel timer/RCU progress stops before userspace<//>
              <${Text}>The failed Codex guest runs QEMU 10.1.0-10.el9 with TCG and two vCPUs, using Debian kernel 6.12.115-2. Independent serial reaches early device initialization, then reports repeated RCU stalls: CPU 0 has zero timer ticks in the grace period, and NMI backtraces repeatedly show <${Code}>pv_native_safe_halt<//>. No systemd or Runtime startup output follows. This places the first observed failure before Runtime authentication; <${Code}>NeverConnected<//> and unreachable Runtime RPCs are downstream symptoms.<//>
              <${Text} mt="sm">The existing APIC monitor records CPU 0's timer vector 236 in service, pending further delivery and raising processor priority to 0xe0. A pending timer or one sampled ISR236 also occurs transiently in passing guests; persistence and the covered replay distinguish this sample. The APIC capture starts before that transition and retains independent return-vector and EOI-register events. A source-based replay finds 641 accepted timer vectors but 640 timer-clearing EOIs; after the last acceptance at native host-mono 682.536071 seconds, later EOIs clear higher-priority vectors 251/253 while 236 remains. This agrees with the monitor state; the guest instruction path between acceptance and acknowledgement is absent. Its interrupt stream reaches the 16 MiB cap at 08:30:04 UTC; monitor samples continue to 08:32:53. The QEMU source RPM for this exact build was inspected. Source and records narrow the delivery/acknowledgement boundary; they do not identify the guest instruction or emulator mutation that first lost progress. Both monitor queries and uprobes perturb timing; no QEMU or kernel repair is claimed.<//>
              <${Title} order=${3} mt="lg" mb="sm">Cleanup: accepted delete waits at the quiescence fence<//>
              ${rows(
                ["UTC", "Observed transition"],
                [
                  [
                    "08:32:23.175",
                    "Readiness wait fails after 300.118s; Runtime has never connected.",
                  ],
                  [
                    "08:32:23.539 → 08:32:23.625",
                    "Suspend accepted, Suspended observed, then deletion of the exact Sandbox UID accepted.",
                  ],
                  [
                    "08:37:23",
                    "The same Sandbox retains deletionTimestamp and state-volume finalizer, stopStage=Quiescing, and no quiesce receipt; the same VM/Pod remains alive.",
                  ],
                  [
                    "08:37:23.797",
                    "Cancellation-safe cleanup reports its 300.275s timeout; baseline certification subsequently refuses the remaining Sandbox.",
                  ],
                ],
              )}
              <${Text} mt="sm">The controller deliberately seals every published Runtime incarnation before deleting its workload and state. A lost or absent controller observation does not prove that no Session was admitted. <${Code}>TestDeletionSealsAnAcceptedIncarnationWithoutARuntimeSnapshot<//> defends that invariant. Here, the never-booted Runtime cannot provide the receipt, so cleanup remains fenced; the successful comparator completes delete in 18.671s. Removing the finalizer or relaxing baseline certification would discard the safety proof. ${link(gh + "/blob/d16ba5c2b1d7e93efe812d4c6a9d9a2143913aca/agentplane/environments/internal/controller/controller.go#L259-L361", "Controller ownership and finalizer")}${" · "}${link(gh + "/blob/d16ba5c2b1d7e93efe812d4c6a9d9a2143913aca/agentplane/environments/internal/controller/controller_test.go#L805-L820", "existing regression guard")}<//>
              <${Text} size="sm" mt="sm">The first Quiesce RPC result predates the captured controller log window. Later no-route failures, the final retry state and the guest serial are retained. No missing-delete or cancellation race was found. A safe alternative would need a durable incarnation-scoped no-admission proof or a recovered Runtime that supplies its seal; neither contract was implemented here.<//>
            </section>
            <section id="selected-experiments">
              <${Title} order=${2} mb="sm">17 November: cold profiles captured; startup triggers remain open<//>
              <${Alert} color="blue" title="Selected experiments, separate from the historical census" mb="md">
                These manual controls and implementation checks do not change the 32/883 or 10/149 denominators. A passing control validates its configuration and coverage; it does not measure a fleet improvement.
              <//>
              ${rows(
                ["PR", "Change", "Verified disposition"],
                e.lane_experiments.interventions.map((p) => [
                  pr(p.pr),
                  p.change,
                  p.state,
                ]),
              )}
              <${Title} order=${3} mt="lg" mb="sm">Cold content: 25 actual imports, with native profiling<//>
              <${Text}>${link(bb + e.lane_experiments.cold_import.invocation, "Fresh cold-content control")} passed both normal Claude/Codex cases. Before collection, the baseline marker/root and a task-owned K3s directory/containerd store were absent. The pre-import image list was empty. Native Action properties confirm the unique recycling family/data path and normal Firecracker placement; all 25 import spans record <${Code}>skipped=false<//>. The sync source is <${Code}>5c6cc2ebeaa53c1e8ea3e0a1cc6c6335776119ed<//> plus the attached ${link("./cold-import-experiment/BUILD.patch", "temporary target patch")} and ${link("./cold-import-experiment/cold_content_precondition.py", "read-only precollection guard")}. Neither experiment changes production retention or deletes a shared cache.<//>
              ${rows(
                ["Measurement clock", "Seconds / interpretation"],
                [
                  [
                    "Native pytest shared setup",
                    e.lane_experiments.cold_import.pytest_setup_seconds_rounded.toFixed(
                      2,
                    ),
                  ],
                  [
                    "Driver stack.setup span",
                    e.lane_experiments.cold_import.stack_setup_seconds.toFixed(
                      3,
                    ),
                  ],
                  [
                    "Inside 25 serial import spans",
                    e.lane_experiments.cold_import.image_span_seconds.toFixed(
                      3,
                    ),
                  ],
                  [
                    "First image start → last image end",
                    e.lane_experiments.cold_import.image_envelope_seconds.toFixed(
                      3,
                    ),
                  ],
                  [
                    "Claude / Codex callback",
                    e.lane_experiments.cold_import.case_calls
                      .map((c) => c.seconds.toFixed(3))
                      .join(" / "),
                  ],
                  [
                    "Native pytest shared teardown",
                    e.lane_experiments.cold_import.pytest_teardown_seconds_rounded.toFixed(
                      2,
                    ),
                  ],
                  [
                    "JUnit suite wall / TestRunner",
                    e.lane_experiments.cold_import.junit_suite_seconds.toFixed(
                      3,
                    ) +
                      " / " +
                      e.lane_experiments.cold_import.test_runner_seconds.toFixed(
                        3,
                      ),
                  ],
                ],
                340,
              )}
              <${Text} size="sm" mt="sm">The 216.209s import envelope includes 3.440s outside the image spans. The sidecar's 225.324s “queue” marker window also includes Deployment availability after the last image. Controller installation and manifest work overlap imports; cases overlap each other. These rows are not additive. Different source and retained state prevent interpreting the earlier 375s setup as an unprofiled performance control.<//>
              <${Accordion} variant="contained" mt="sm"><${Accordion.Item} value="cold-profile-images"><${Accordion.Control}>All 25 cold-control image spans</${Accordion.Control}><${Accordion.Panel}>
                ${rows(
                  ["Image", "Import span seconds"],
                  e.lane_experiments.cold_import.image_spans.map((s) => [
                    s.image,
                    s.seconds.toFixed(3),
                  ]),
                )}
              <//><//><//>
              ${rows(
                [
                  "Native artifact",
                  "Bytes / cap",
                  "Sidecar / native parser",
                  "Process wait at context exit",
                ],
                e.lane_experiments.cold_import.profiles.map((p) => [
                  p.artifact,
                  p.bytes.toLocaleString("en-US") +
                    " / " +
                    p.output_limit_bytes.toLocaleString("en-US"),
                  p.status +
                    " / " +
                    e.lane_experiments.cold_import.native_parser_status,
                  p.process_wait_at_context_exit_seconds.toFixed(6) + "s",
                ]),
              )}
              <${Text} mt="sm">The native CPU profile contains 171.08 CPU-seconds over its reported 420s window: unpack's <${Code}>fsApplier.Apply<//> accounts for 63.10 cumulative CPU-seconds and transfer's <${Code}>importStream<//> for 25.28. The native runtime trace spans 420.001s. Its syscall profile sums 554.11 aggregate seconds across goroutines, including 260.53s in the profiler reader and 116.79s in FIFO open; those background durations are not import I/O attribution. ${link(bb + "26964de2-6865-4659-a4f9-06e6eea6dcad", "Go 1.27.3 native validation")}<//>

              <${Text} mt="sm">Renderer blocking can reproduce the late snapshot and Python cancellation, but neither control reproduces the historical roughly 23s API-header delay. The ${link("./browser-renderer-control.patch", "temporary injection")} was removed; ${pr(17353)} records its source, controls and visibility boundary. Upstream Go Date headers alone do not prove when the proxy received headers: the server may stamp them before flushing. The merged proxy phases now distinguish receipt, upstream headers and downstream send for the next natural failure. No timeout increase or new runtime repair follows from these controls.<//>

              <${Text} mb="sm">Inspected source <${Code}>4e56f0735934c9689d83e1f4f2967a68fab64977<//>. The canonical-repository census uses ROLE=CI, devel child Bazel test invocations and exact-label result lookups. It includes 572 completed invocations and one disconnected invocation; each target opportunity remains separate from the invocation verdict. Unit tests, PR runs and manual experiments are excluded. ${link(gh + "/issues/16027", "Issue #16027")} owns the follow-up.<//>

              <//>
              <${Title} order=${3} mt="lg" mb="sm">What the rebuild reasons support<//>
              <${Text}>All 23 explicit fingerprint mismatches had a clean previous marker. Thirteen can be joined to an earlier observed fingerprint/source; each pair changes fingerprinted inputs: baseline helper code, certificate or VM infrastructure helpers, or checked-in CRDs. Those are supported compatibility invalidations. The other ten lack an earlier matching observation, so their input changes remain unverified. None of the 155 available baseline-open traces reports dirty, unhealthy, identity_changed or invalid_marker; 225 results lack a reason span, so this is not proof those reasons never occurred.<//>
              <${Text} mt="sm">The fresh results' tested sources declare two stable recycling-key families: one VM family and one shared Pod / Pod-platform / MCP family. All 154 readable native Actions agree with those source-derived keys, covering 155 result events; native metadata is unavailable for the rest. The Actions request newest snapshot reads and allow snapshots, with no forced remote-save policy.<//>
              <${Text} mt="sm">Worker + source key + fingerprint grouping yields 82 observed cells, including 16 with both cold and warm outcomes and five with both warm reuse and missing markers. A worker can run different VM/snapshot instances, so those mixed cells do not establish loss of a previously certified baseline.<//>
              <${Text} mt="sm">Native ExecuteResponses were recovered for 150 of 385 linked physical executions. They report 36 versioned snapshot-key tuples across eight platform/configuration combinations. Eleven of the 14 missing-marker results have native VM metadata: all eleven are first-task runners with no last-executed task. All 102 warm results with metadata have a last-executed task. This is consistent with a fresh VM or base state being selected, rather than a clean attached K3s baseline failing its identity check. The missing read/admission/fallback decision is still needed to explain why a compatible retained snapshot was not used.<//>

              <${Text} mt="sm">Two VM traces explicitly refuse certification because one or two Sandboxes remain: ${link(bb + "76be72fb-c63f-5f20-a630-77e3c50ba474", "76be72fb")}${" "}and ${link(bb + "b144fcec-660d-565b-9b6a-8ca97c905344", "b144fcec")}. The source invalidates the executor snapshot on a persistent stack lifecycle error. Keep that fence: a later cold start after invalidation can be correct. Four present VM identity artifacts lack cleanup completion; two contain these refusal traces, while the other two do not establish a cleanup failure. Across all 161 identity artifacts, namespace, PostgreSQL Pod and root Secret UIDs are each unique.<//>
              <${Title} order=${3} mt="lg" mb="sm">Setup distributions are observational, with missing coverage<//>

              <${Text} size="sm" mt="sm">Only 155 setup traces are readable. These are unpaired fixture wall times on changing sources and workers; subtraction is not a causal saving, CPU saving or complete required-gate improvement.<//>
              <${Accordion} variant="contained" mt="md">
                <${Accordion.Item} value="baseline-provenance"><${Accordion.Control}>Baseline sample coverage, source witnesses and physical executions</${Accordion.Control}><${Accordion.Panel}>
                  <${Text}>380 non-cached result events link 385 unique TestRunner IDs: 352 NEW and 33 shared links. The physical rows include 373 exit-zero executions, five test failures and seven infrastructure failures before verdicts. Two fresh PASSED results in invocation 9af6d1b2 have no matching producer row. No duplicate physical ID is counted twice. A shared link may originate outside this cohort.<//>
                  <${Text} mt="sm">155 traces and 161 identity artifacts are available, with 102 results having both. The 166 results with neither are outcome-unknown. Artifact loss may be biased; 48 cold out of 214 known is not a fleet cold-start rate. Full reviewed invocation, source, configuration, shard/run/attempt, cache and physical provenance is in evidence.json.<//>

              <${Alert} color="yellow" mt="md" title="Decision: no avoidable compatibility-key miss established">
                Keep #16027 open. Collect through 21 November 00:00 UTC for seven complete days (14–20 November), retaining 13 November's partial stratum. The next discriminating evidence is the provider's snapshot lookup/admission/fallback decision for exact missing-marker executions and their snapshot families. Preserve paired input manifests for future mismatches and investigate the two Sandbox cleanup refusals separately. Do not force snapshot saves or weaken compatibility / cleanup guards. No scheduled collection or source repair was configured.

              <${Title} order=${3} mt="lg" mb="sm">17 November provider follow-up: snapshot versions changed<//>
              <${Text}>All 11 missing-marker results with native metadata are first-task runners; ten readable Actions match the source recycling-key family and one Action is unavailable. For nine of those 11, the closest earlier recovered response with the same platform and VM configuration hashes has a different snapshot version ID. The other two are concurrent cases in a newly observed version. Both non-VM configurations acquire new observed versions around 07:23, 07:39 and 07:49 UTC on 16 November; the 07:49 main non-VM version later has 28 readable warm results. Five observed platform/configuration/version groups include both warm and cold outcomes, so rotation alone is insufficient. This is a new analysis of the existing incomplete response sample, not a new census or proof of an avoidable miss.<//>
              <${Text} mt="sm">In inspected upstream BuildBuddy source, a missing version-cache record or explicit snapshot invalidation writes a new random version; manifest reads use that version. Hosted source and effective flags are unverified. Live GetExecution, the exact retained ExecuteResponse, its server-log inventory and the full Bazel build log expose neither version-mutation cause nor attempted manifest reads/admission nor completed snapshot publication. Save flags remain intent. ${link("https://github.com/buildbuddy-io/buildbuddy/blob/a398894f6eb7a4ebbdfb7085843470f8c20f64c1/enterprise/server/remote_execution/snaploader/snaploader.go#L133-L165", "Version selection source")}${" · "}${link("https://github.com/buildbuddy-io/buildbuddy/blob/a398894f6eb7a4ebbdfb7085843470f8c20f64c1/enterprise/server/remote_execution/snaploader/snaploader.go#L1530-L1570", "invalidation source")}<//>
              <${Text} mt="sm">One VM chain supports the safety-invalidation mechanism: ${link(bb + "76be72fb-c63f-5f20-a630-77e3c50ba474", "cleanup refusal at 04:25 UTC on 17 November")} escapes the stack guard that writes BuildBuddy's invalidation marker. A concurrent action had already reused the old version; ${link(bb + "b273c841-8191-55bd-958d-b7e4f732569f", "the next observed action at 04:31 UTC")} uses a new version and missing marker on the same worker with the same fingerprint and platform/configuration hashes. Relevant source/policy files are byte-identical. This fits appropriate invalidation after an unsafe cleanup; the provider mutation record is missing, so a concurrent invalidation or lost version record cannot be excluded.<//>
              <${Text} mt="sm">The retained provider packet identifies all 11 physical executions and the missing hosted revision/settings, version-record reads and mutations, local/remote candidate lookup and admission results, and prior producer publication outcomes. This is the proven provider visibility boundary. A clean or failed suite can intentionally invalidate snapshots; version churn alone does not establish a defect. No decision records, monitoring schedule, forced save or compatibility change are available from this follow-up.<//>
