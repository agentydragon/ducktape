<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CI reliability · 13–19 November 2026</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript
      >This report uses JavaScript for its tables, filters and charts.</noscript
    >
    <script type="module">
      import { useState } from "react";
      import {
        Accordion,
        Alert,
        Anchor,
        Code,
        Container,
        Group,
        Paper,
        Stack,
        Table,
        Text,
        TextInput,
        Title,
      } from "@mantine/core";
      import { BarChart } from "@mantine/charts";
      import { html, mount } from "../report.js";
      // This must match evidence_sha256 in the publication manifest.
      const evidenceSha =
        "2ea9831b45d6cc273d9b4ecf896233fdac76831986f2b3706bf21913e10b6299";
      const evidenceUrl = `./evidence.json?v=${evidenceSha}`;
      const manifestUrl = `./manifest.json?v=${evidenceSha}`;

      async function loadEvidence() {
        const response = await fetch(evidenceUrl, { cache: "no-cache" });
        if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);

        const bytes = await response.arrayBuffer();
        const digest = await crypto.subtle.digest("SHA-256", bytes);
        const receivedSha = Array.from(new Uint8Array(digest), (byte) =>
          byte.toString(16).padStart(2, "0"),
        ).join("");
        if (receivedSha !== evidenceSha)
          throw new Error("Evidence does not match this report");

        return JSON.parse(new TextDecoder().decode(bytes));
      }

      const e = await loadEvidence().catch(() => null);
      const gh = "https://github.com/agentydragon/ducktape";
      const bb = "https://app.buildbuddy.io/invocation/";
      const link = (url, label) => html`<${Anchor} href=${url}>${label}<//>`;
      const pr = (n) => link(`${gh}/pull/${n}`, `#${n}`);
      const inv = (id, label = id.slice(0, 8)) => link(bb + id, label);
      const table = (heads, rows, width = 620) =>
        html`<${Table.ScrollContainer}
          minWidth=${width}
          type="native"
          maw="100%"
        >
          <${Table} striped verticalSpacing="sm">
            <${Table.Thead}
              ><${Table.Tr}
                >${heads.map((head) => html`<${Table.Th} key=${head}>${head}<//>`)}<//
              ><//
            >
            <${Table.Tbody}
              >${rows.map((r, i) => html`<${Table.Tr} key=${i}>${r.map((c, j) => html`<${Table.Td} key=${j}>${c}<//>`)}<//>`)}<//
            >
          <//>
        <//>`;
      const links = (items) =>
        html`<${Group} gap="md"
          >${items.map(({ url, label }) => html`<span key=${url}>${link(url, label)}</span>`)}<//
        >`;
      function Report() {
        const [query, setQuery] = useState("");
        const findings = e.findings.filter((f) =>
          [f.title, f.classification, ...f.paragraphs]
            .join(" ")
            .toLowerCase()
            .includes(query.trim().toLowerCase()),
        );
        const p = e.pull_requests;
        const m = e.mainline;
        const k = e.kvm_cutover;
        return html`<${Container}
          component="main"
          size="73rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
        >
          <${Stack} gap="xl">
            <header>
              ${link("../", "Ducktape reports")}
              <${Title} order=${1} my="sm"
                >CI reliability · 13–19 November 2026<//
              >
              <${Text} size="lg"
                >Four of 350 sampled PR heads showed red, then went green on
                identical tested inputs with a fresh target recovery. All four
                occurred on 18 November. On 20 November the new VM retry policy
                absorbed a failure in one of 16 fresh PR verdicts.${" "}
                ${link("#vm-cutover", "VM retry details")}<//
              >
            </header>
            <section id="pr-health">
              <${Title} order=${2}
                >PR heads with a verified intermittent failure<//
              >
              <${Text} my="sm"
                >13–19 November UTC · 50 heads sampled each day. Seven distinct
                targets failed or timed out, then passed. Unretried reds make
                this a lower bound. Each affected head counts once. Zero means
                no verified case in that day's sample.<//
              >
              <div
                role="img"
                aria-label="Daily count of PR heads with a verified red-to-green target recovery"
              >
                <${BarChart}
                  h=${220}
                  data=${e.flake_trend.daily.map((d) => ({ day: d.day.slice(8), heads: d.confirmed }))}
                  dataKey="day"
                  series=${[{ name: "heads", color: "orange.7" }]}
                  yAxisProps=${{ allowDecimals: false, width: 32 }}
                  yAxisLabel="Heads"
                />
              </div>
              <${Accordion} variant="contained" mt="md">
                <${Accordion.Item} value="daily"
                  ><${Accordion.Control}>Daily counts and denominators<//>
                  <${Accordion.Panel}
                    >${table(
                      [
                        "UTC day",
                        "Verified intermittent",
                        "Eligible",
                        "Sampled",
                        "Green",
                        "Red",
                        "Superseded",
                        "Cancelled",
                        "Incomplete",
                        "Unknown",
                      ],
                      p.daily.map((d, i) => [
                        d.day,
                        e.flake_trend.daily[i].confirmed,
                        d.eligible,
                        d.sampled,
                        d.green,
                        d.red,
                        d.superseded,
                        d.cancelled,
                        d.incomplete,
                        d.unknown,
                      ]),
                    )}<//
                  >
                <//>
                <${Accordion.Item} value="heads"
                  ><${Accordion.Control}
                    >Same-tested-SHA recoveries in the PR sample<//
                  >
                  <${Accordion.Panel}
                    >${table(
                      [
                        "PR",
                        "Tested SHA",
                        "First invocation",
                        "Retry invocation",
                      ],
                      p.same_commit_recoveries.map((r) => [
                        pr(r.pr),
                        html`<${Code}>${r.tested}<//>`,
                        inv(r.first),
                        inv(r.retry),
                      ]),
                    )}<//
                  >
                <//>
              <//>
              <${Text} size="sm" mt="md"
                >Five of 61 initially red heads recovered on the same tested
                SHA. Four had a verified target pair. The fifth lacks a verified
                intermittent target pair. There were 242 first-pass greens, 44
                superseded heads and three cancellations. The five recoveries
                took 3m 30s to 19m 49s from the first red check completing to
                the retry completing. Median 7m 35s. These intervals include the
                wait before starting the retry.<//
              >
              <${Text} size="sm" mt="sm">${p.method}<//>
            </section>
            <section id="vm-cutover">
              <${Title} order=${2}
                >Flakes absorbed by Bazel · VM retry rollout<//
              >
              <${Text} mt="sm"
                >On 20 November, one of 16 fresh required VM verdicts in the
                sampled PR jobs failed on attempt one and passed on attempt two.
                The required job stayed green. A separate devel census found one
                such recovery in 13 fresh VM verdicts. Both hit the
                recycled-runner rebuild guard.<//
              >
              <${Text} my="sm"
                >The VM suite gained a second attempt on 20 November, after the
                seven-day chart window. We inspected${" "}
                ${e.flake_trend.post_shadow_vm.inspected_jobs} required Bazel
                jobs across 67 post-shadow PR heads. Cached passes and jobs
                without fresh VM results are excluded. ${pr(18265)} ·
                ${inv("6e111092-663c-58b6-98b1-3368720d6d9f", "PR attempt evidence")}
                · ${pr(17940)} retry policy<//
              >
              <${Text} my="sm">${k.summary}<//>
              ${table(["Post-cutover devel", "Count", "Unit"], k.counts, 340)}
              <${Title} order=${3} mt="md"
                >A recycled runner rebuild failed before either case started<//
              >
              <${Stack} gap="sm" mt="sm"
                >${k.mechanism.map((s) => html`<${Text} key=${s}>${s}<//>`)}${links(k.links)}<//
              >
              <${Accordion} variant="contained" mt="md">
                <${Accordion.Item} value="vm-shadow" id="vm-shadow">
                  <${Accordion.Control}
                    >Earlier paired TCG and KVM measurements<//
                  >
                  <${Accordion.Panel}
                    >${k.history.map((x) => html`<${Text} mb="sm" key=${x}>${x}<//>`)}${links(k.history_links)}<//
                  >
                <//>
              <//>
            </section>
            <section id="priorities">
              <${Title} order=${2}>Failure mechanisms and priorities<//>
              <${TextInput}
                label="Filter findings"
                placeholder="Search failure mechanisms"
                value=${query}
                onChange=${(event) => setQuery(event.currentTarget.value)}
                my="md"
              />
              <${Text} size="sm" c="dimmed" mb="sm" aria-live="polite"
                >${findings.length} of ${e.findings.length} findings<//
              >
              <${Stack} gap="md">
                ${findings.map(
                  (f) =>
                    html`<${Paper}
                      withBorder
                      p="lg"
                      key=${f.id}
                      data-finding=${f.id}
                    >
                      <${Stack} gap="sm">
                        <${Title} order=${3}>${f.title}<//>
                        <${Text} fw=${600}>${f.frequency}<//>
                        ${f.paragraphs.map((x) => html`<${Text} key=${x}>${x}<//>`)}
                        ${links(f.links)}
                      <//>
                    <//>`,
                )}
                ${findings.length ? null : html`<${Text}>No findings match this filter.<//>`}
              <//>
            </section>
            <section id="intermittent-targets">
              <${Title} order=${2}>PR target recoveries with fresh results<//>
              <${Text} my="sm">${e.pr_targets.summary}<//>
              <${Text} my="sm">${e.pr_targets.scope}<//>
              <${Accordion} variant="contained">
                <${Accordion.Item} value="retry-targets"
                  ><${Accordion.Control}>Verified target and head pairs<//>
                  <${Accordion.Panel}
                    >${table(
                      [
                        "PR",
                        "Target",
                        "Failed attempt",
                        "Passing attempt",
                        "Observed phase",
                      ],
                      e.pr_targets.pairs.map((r) => [
                        pr(r.pr),
                        html`<${Code}>${r.label}<//>`,
                        inv(r.first),
                        inv(r.retry),
                        r.phase,
                      ]),
                      760,
                    )}<//
                  >
                <//>
              <//>
            </section>
            <section id="populations">
              <${Title} order=${2}>Mainline and merge-time evidence<//>
              <${Text} my="sm">${m.method}<//>
              ${table(["Bazel test exit", "Invocations"], Object.entries(m.exit_counts), 335)}
              <${Title} order=${3} mt="md"
                >BuildBuddy target-tracking candidates<//
              >
              <${Text} my="sm">${e.target_stats.method}<//>
              ${table(
                ["Target", "Indexed runs", "Failed runs", "Likely flaky runs"],
                e.target_stats.rows.map((r) => [
                  html`<${Code}>${r.label}<//>`,
                  r.runs,
                  r.failed,
                  r.likely,
                ]),
              )}
              <${Title} order=${3} mt="md" id="merges"
                >Required checks visible at merge time<//
              >
              <${Text} my="sm">${e.merges.summary}<//>
              <${Accordion} variant="contained">
                <${Accordion.Item} value="merge-candidates"
                  ><${Accordion.Control}>PRs with a red check at merge<//>
                  <${Accordion.Panel}
                    >${table(
                      [
                        "PR",
                        "Merged UTC",
                        "Red job",
                        "Bazel child",
                        "Failure evidence",
                      ],
                      e.merges.red.map((r) => [
                        pr(r.pr),
                        r.merged,
                        link(r.job, "Bazel gate"),
                        inv(r.inv),
                        r.diagnosis,
                      ]),
                      710,
                    )}<//
                  >
                <//>
              <//>
            </section>
            <section id="continuity">
              <${Title} order=${2}
                >Earlier interventions and open measurements<//
              >
              <${Accordion} variant="contained" mt="sm">
                ${e.continuity.map(
                  (r) =>
                    html`<${Accordion.Item} key=${r.title} value=${r.title}>
                      <${Accordion.Control}>${r.title}<//>
                      <${Accordion.Panel}
                        ><${Text} mb="sm">${r.body}<//>${links(r.links)}<//
                      >
                    <//>`,
                )}
              <//>
            </section>
            <section id="limits">
              <${Title} order=${2}>Coverage<//>
              <${Stack} gap="sm" mt="sm"
                >${e.limits.map((s) => html`<${Text} key=${s}>${s}<//>`)}<//
              >
            </section>
            <footer>
              ${links([
                { url: evidenceUrl, label: "Reviewed evidence" },
                { url: manifestUrl, label: "Publication manifest" },
                { url: "../latency/", label: "CI latency" },
                { url: "../", label: "All reports" },
              ])}
            </footer>
          <//>
        <//>`;
      }
      function EvidenceUnavailable() {
        return html`<${Container} component="main" size="sm" py="xl">
          <${Stack} gap="md">
            <${Title} order=${1}>CI reliability<//>
            <${Alert} color="red" title="Report data unavailable">
              The evidence for this report version could not be loaded. Reload
              the report to try again.
            <//>
            <${Group}>
              ${link("./", "Reload report")} ${link("../", "All reports")}
            <//>
          <//>
        <//>`;
      }

      mount(e ? Report : EvidenceUnavailable);
    </script>
  </body>
</html>
