<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CI reliability</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript>This report uses JavaScript for charts and disclosures.</noscript>
    <script type="module">
      import { useState } from "react";
      import {
        Accordion,
        Anchor,
        Box,
        Code,
        Container,
        Group,
        SegmentedControl,
        Stack,
        Table,
        Text,
        TextInput,
        Title,
      } from "@mantine/core";
      import { BarChart } from "@mantine/charts";
      import { html, mount } from "../report.js";
      const evidenceSha =
        "fe5ae00d77912347e1cf27824ecda8c25ca4787f7f7a0f1e2170e7a7ca22250e";
      const response = await fetch(`./evidence.json?v=${evidenceSha}`);
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const bytes = await response.arrayBuffer();
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      const receivedSha = Array.from(new Uint8Array(digest), (byte) =>
        byte.toString(16).padStart(2, "0"),
      ).join("");
      if (receivedSha !== evidenceSha)
        throw new Error("Evidence does not match this report");
      const e = JSON.parse(new TextDecoder().decode(bytes));
      const gh = "https://github.com/agentydragon/ducktape";
      const archive =
        gh + "/blob/" + e.previous_report_commit + "/reliability/index.html";
      const link = (href, label) => html`<${Anchor} href=${href}>${label}<//>`;
      const pr = (n) => link(`${gh}/pull/${n}`, `#${n}`);
      const source = (path, label) =>
        link(`${gh}/blob/${e.source_devel_commit}/${path}`, label);
      const inv = (id, label) =>
        link(
          "https://app.buildbuddy.io/invocation/" + id,
          label || id.slice(0, 8),
        );
      const table = (headers, rows, width = 560) =>
        html` <${Table.ScrollContainer}
          minWidth=${width}
          type="native"
          maw="100%"
        >
          <${Table} striped verticalSpacing="sm">
            <${Table.Thead}
              ><${Table.Tr}
                >${headers.map((header) => html`<${Table.Th} key=${header}>${header}<//>`)}<//
              ><//
            >
            <${Table.Tbody}
              >${rows.map((row, i) => html`<${Table.Tr} key=${i}>${row.map((value, j) => html`<${Table.Td} key=${j}>${value}<//>`)}<//>`)}<//
            >
          <//>
        <//>`;
      const disclosure = (label, contents) =>
        html` <${Accordion}
          variant="contained"
          mt="sm"
          defaultValue=${location.hash && label.startsWith("Earlier") ? label : null}
          ><${Accordion.Item} value=${label}>
            <${Accordion.Control}>${label}<//
            ><${Accordion.Panel}>${contents}<//>
          <//><//
        >`;
      const minutes = (s) =>
        s == null
          ? "—"
          : `${Math.floor(Math.round(s) / 60)}m ${String(Math.round(s) % 60).padStart(2, "0")}s`;
      const header = (title, lede) =>
        html` <header>
          ${link("../", "Ducktape reports")}
          <${Title} order=${1} my="sm">${title}<//>
          <${Text} size="lg">${lede}<//>
          <${Text} mt="sm" size="sm" c="dimmed"
            >Inspected devel <${Code}>${e.source_devel_commit}<//><//
          >
        </header>`;
      const footer = () =>
        html`<footer>
          <${Group} gap="md">
            ${link("./evidence.json", "Reviewed evidence")}
            ${link("./manifest.json", "Manifest")}
            ${link(archive, "Previous snapshot")} ${link("../", "All reports")}
          <//>
        </footer>`;

      function Report() {
        const [query, setQuery] = useState("");
        const retryNames = [
          "Disconnected Bazel invocation",
          "No failed test verdict available",
          "Sandbox frontend timeout",
        ];
        const retries = e.retries
          .map((r, i) => ({ ...r, case: retryNames[i] }))
          .filter((r) =>
            [r.case, r.pr, r.day]
              .join(" ")
              .toLowerCase()
              .includes(query.trim().toLowerCase()),
          );
        const sandbox = e.sandbox_confirmed;
        return html`<${Container}
          component="main"
          size="73rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
        >
          <${Stack} gap="xl">
            ${header("CI reliability", "Across 168 sampled PR heads on 15–21 November UTC, 126 reached required green, 13 remained red and 29 were cancelled. Two Bazel jobs recovered on the same tested source and neither exposed a verified target pair. The partial 22 November sample adds one verified target recovery in 24 heads.")}
            <section id="pr-health">
              <${Title} order=${2}>Daily required-check outcomes<//>
              <${Text} my="sm"
                >24 heads per UTC day. 22 November is partial through 10:00 UTC.
                Green includes successful reruns. Cancellations can include
                superseded heads. Each head counts once.<//
              >
              <${Box}
                role="img"
                data-chart="pr-outcomes"
                aria-label="Daily counts of green, red and cancelled PR heads"
              >
                <${BarChart}
                  h=${245}
                  type="stacked"
                  withLegend
                  dataKey="day"
                  data=${e.daily.map((d) => ({ day: d.day.slice(8) + (d.day.endsWith("-22") ? "*" : ""), Green: d.outcomes.green || 0, Red: d.outcomes.red || 0, Cancelled: d.outcomes.cancelled || 0 }))}
                  series=${[
                    { name: "Green", color: "teal.7" },
                    { name: "Red", color: "red.7" },
                    { name: "Cancelled", color: "gray.6" },
                  ]}
                  yAxisProps=${{ allowDecimals: false, width: 32 }}
                  yAxisLabel="Heads"
                />
              <//>
              ${disclosure(
                "Daily counts and denominators",
                table(
                  [
                    "UTC day",
                    "Eligible",
                    "Sampled",
                    "Green",
                    "Red",
                    "Cancelled",
                    "Verified recoveries",
                  ],
                  e.daily.map((d) => [
                    d.day + (d.day.endsWith("-22") ? " (partial)" : ""),
                    d.eligible_heads,
                    d.sampled,
                    d.outcomes.green || 0,
                    d.outcomes.red || 0,
                    d.outcomes.cancelled || 0,
                    e.verified_target_recoveries_by_day[d.day] || 0,
                  ]),
                ),
              )}
            </section>
            <section id="priorities">
              <${Title} order=${2}>Investigate the sandbox page timeout<//>
              <${Text} my="sm"
                >On #18803, the retained History Threads test exceeded Vitest’s
                5-second deadline. The same tested SHA and configuration then
                passed with a fresh remote result. CI took 5m 12s from the
                failed check finishing to the passing rerun completing. The
                failed log ends at the test deadline. It does not identify which
                awaited transition was active. ${pr(18803)} ·
                ${inv(sandbox.failure, "Failed result")} ·
                ${inv(sandbox.pass, "Uncached pass")}<//
              >
              <${Text} my="sm"
                >The current case covers ready-to-suspended state, menu gating,
                wake-on-send and retained rows after inventory removal. Rerun
                the full target and record the duration of render, tooltip and
                rerender checkpoints if it recurs. Keep the original assertion
                coverage and deadline while identifying the waiting phase.
                ${source("agentplane/app/frontend/sandboxes/sandbox_page.test.tsx#L792", "Current test")}<//
              >
              <${Text} my="sm"
                >A fresh RBE control at the inspected devel SHA passed the full
                target. This verifies the current case still runs and leaves
                recurrence unresolved.
                ${inv(e.current_source_control.invocation, "Current-source control")}<//
              >
              <${TextInput}
                label="Filter findings"
                placeholder="Search failure mechanisms"
                value=${query}
                onChange=${(event) => setQuery(event.currentTarget.value)}
                my="md"
              />
              ${table(
                ["UTC day", "Recovery", "Evidence"],
                retries.map((r) => [
                  r.day,
                  r.case,
                  html`<${Group} gap="sm"
                    >${r.pr ? pr(r.pr) : link(r.url, "GitHub run")}
                    ${r.attempts.map((a) => html`<span key=${a.number}>${link(a.url, `Attempt ${a.number}`)}</span>`)}<//
                  >`,
                ]),
              )}
              ${retries.length ? null : html`<${Text} mt="sm" aria-live="polite">No findings match this filter.<//>`}
            </section>
            <section id="vm-cutover">
              <${Title} order=${2}>VM rebuild fix needs more fresh exposure<//>
              <${Text} my="sm"
                >On 22 November through 10:00 UTC, four fresh VM verdicts passed
                on attempt one across 15 green Bazel PR checks and 14 successful
                devel CI runs. Thirteen VM results were cached, and 12
                invocations did not yield a VM test result. The earlier 20
                November cohorts recorded one Bazel retry recovery in 16 fresh
                PR verdicts and one in 13 devel verdicts. Both earlier failures
                hit the recycled-runner namespace guard before scenario
                execution. ${pr(18295)} ·
                ${link(archive + "#vm-cutover", "Earlier VM exposure and failed attempts")}<//
              >
              <${Text} my="sm"
                >Track first-attempt failures per fresh VM verdict and match
                them to recycled baseline rebuilds. Fresh passes alone do not
                establish that the relevant rebuild path ran in all four
                tests.<//
              >
            </section>
            <section id="populations">
              <${Title} order=${2}>Mainline target index<//>
              <${Text} my="sm"
                >15–21 November UTC. BuildBuddy indexed one Bazel FLAKY VM
                verdict. Its likely-flaky heuristic also marks failures
                bracketed by passing runs, including across different revisions
                and configurations. The four visual-operation failed rows
                include three build failures. A geometry assertion failed in the
                other run.
                ${link("../visual-reliability/", "Visual test diagnosis")}<//
              >
              ${table(
                [
                  "Target",
                  "Indexed runs",
                  "Failed",
                  "Bazel FLAKY",
                  "Likely flaky",
                ],
                e.mainline_target_index.map((r) => [
                  html`<${Code}>${r.label}<//>`,
                  r.totalRuns,
                  r.failedRuns,
                  r.flakyRuns || 0,
                  r.likelyFlakyRuns || 0,
                ]),
                720,
              )}
            </section>
            <section id="continuity">
              <${Title} order=${2}>Sampling and earlier investigations<//>
              <${Text} my="sm"
                >The daily head sample and exact-check join follow the
                ${link("../latency/#method-current", "latency method")}. A
                verified recovery requires the exact same tested SHA,
                configuration and an explicit non-cached failing and passing
                target result. Unretried reds limit recurrence estimates. The
                current sample tracks workflow attempts. Earlier merge-time
                classifications retain their original windows.<//
              >
              ${disclosure(
                "Earlier reliability findings",
                html`<${Group} gap="md">
                  <span id="vm-shadow"
                    >${link(archive + "#vm-shadow", "Managed TCG and KVM comparison")}</span
                  >
                  <span id="vm-forensics"
                    >${source("agentplane/system_tests/debug/vm_boot_stalls/vm_runtime_connection_2026_11_17.md", "VM runtime connection forensics")}</span
                  >
                  ${link(archive + "#merges", "Earlier merge-time red checks")}
                  ${link(archive + "#priorities", "Runtime proxy, browser readiness and source regressions")}
                <//>`,
              )}
            </section>

            ${footer()}
          <//>
        <//>`;
      }
      mount(Report);
    </script>
  </body>
</html>
