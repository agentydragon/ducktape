<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CI reliability · 10–16 November 2026</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",

      document.documentElement.dataset.mantineColorScheme = matchMedia(

    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript
      >This report uses JavaScript for its tables, filters and charts.</noscript
    >
    <script type="module">
      import { useState } from "react";
      import {
        Accordion,
        Alert,
        Anchor,
        Badge,
        Code,
        Container,
        Group,
        Paper,
        SimpleGrid,
        Stack,
        Table,
        Text,
        TextInput,
        Title,
      } from "@mantine/core";
      import { BarChart } from "@mantine/charts";
      import { html, mount, ManifestStamp } from "../report.js";
      import { DailyVmChart } from "./charts.js";
      const response = await fetch("./evidence.json");
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const e = await response.json();
      const gh = "https://github.com/agentydragon/ducktape";
      const bb = "https://app.buildbuddy.io/invocation/";
      const link = (url, label) => html`<${Anchor} href=${url}>${label}<//>`;
      const pr = (n) => link(`${gh}/pull/${n}`, `#${n}`);
      const percent = (n, d) => `${((100 * n) / d).toFixed(1)}%`;
      const rows = (heads, values) =>
        html`<${Table.ScrollContainer} minWidth=${660} type="native" maw="100%"
          ><${Table} striped verticalSpacing="sm"
            ><${Table.Thead}
              ><${Table.Tr}
                >${heads.map((h) => html`<${Table.Th} key=${h}>${h}<//>`)}<//
              ><//
            ><${Table.Tbody}
              >${values.map((r, i) => html`<${Table.Tr} key=${i}>${r.map((cell, j) => html`<${Table.Td} key=${j}>${cell}<//>`)}<//>`)}<//
            ><//
          ><//
        >`;
      function Metric({ value, label, detail }) {
        return html`<${Paper} withBorder p="md"
          ><${Text} size="xl" fw=${700}>${value}<//
          ><${Text} fw=${600}>${label}<//
          ><${Text} size="sm" c="dimmed" mt="xs">${detail}<//><//
        >`;
      }
      function SetupTimeline() {
        const d = e.setup_breakdown;
        const lanes = [
          {
            label: "Open cold K3s",
            color: "#1971c2",
            spans: d.spans.filter(
              (s) => s.name === "system_test.k3s.baseline.open",
            ),
          },
          ...Object.keys(d.image_groups_seconds).map((g, i) => ({
            label: g,
            color: ["#e67700", "#7048e8", "#0b7285", "#c2255c"][i],
            spans: d.images.filter((s) => s.group === g),
          })),
          {
            label: "Controllers / apply (overlap)",
            color: "#2b8a3e",
            spans: d.spans.filter((s) =>
              [
                "system_test.virtualization.install",
                "system_test.pki.controllers",
                "system_test.crds.apply",
                "system_test.virtualization.apis",
                "system_test.manifests.apply",
                "system_test.pki.issuance",
                "system_test.virtualization.ready",
              ].includes(s.name),
            ),
          },
        ];
        const x = (seconds) => 276 + (660 * seconds) / d.setup_seconds;
        return html`<${Table.ScrollContainer}
          minWidth=${960}
          type="native"
          maw="100%"
        >
          <svg
            viewBox="0 0 970 260"
            role="img"
            aria-label="375-second VM setup timeline: serial image imports overlap controller and manifest work"
            style=${{ width: "100%", display: "block", color: "var(--mantine-color-text)" }}
          >
            <text x="276" y="18" fill="currentColor" fontSize="13">
              Seconds since fixture setup began (UTC 12:40:46.778)
            </text>
            ${[0, 60, 120, 180, 240, 300, 375].map((t) => html`<g key=${t}><line x1=${x(t)} x2=${x(t)} y1="42" y2="250" stroke="currentColor" opacity="0.15" /><text x=${x(t)} y="37" textAnchor="middle" fill="currentColor" fontSize="12">${t}</text></g>`)}
            ${lanes.map((lane, i) => html`<g key=${lane.label}><text x="4" y=${66 + i * 33} fill="currentColor" fontSize="13">${lane.label}</text>${lane.spans.map((span, j) => html`<rect key=${j} x=${x(span.start_offset_seconds)} y=${51 + i * 33} width=${Math.max(1, x(span.end_offset_seconds) - x(span.start_offset_seconds))} height="21" rx="2" fill=${lane.color}><title>${span.image ?? span.name}: ${span.seconds.toFixed(3)} seconds</title></rect>`)}</g>`)}
          </svg>
        <//>`;
      }
      function Report() {
        const [query, setQuery] = useState("");
        const findings = e.findings.filter((f) =>
          `${f.id} ${f.title} ${f.classification}`
            .toLowerCase()
            .includes(query.toLowerCase()),
        );
        const v = e.vm_exposure;
        return html`<${Container}
          component="main"
          size="76rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
          ><${Stack} gap="xl">
            <header>
              ${link("../", "Ducktape reports")}
              <${Text} c="dimmed" mt="md"
                >CI reliability · 10–16 November 2026 UTC<//
              >
              <${Title} order=${1} my="sm"
                >VM setup and infrastructure remain the main reliability work<//
              >
              <${Text} size="lg"
                >32 of 883 completed mainline test invocations failed (3.6%).
                They include test failures, sustained build regressions and
                remote failures. This is an invocation failure frequency; a
                repository flake rate is not established.<//
              >
              <${Text} size="sm" c="dimmed" mt="sm"
                ><${ManifestStamp} src="./manifest.json"
              /><//>
              <${Text} size="sm"
                >Inspected source
                ${link(`${gh}/commit/${e.source_devel_commit}`, html`<${Code}>${e.source_devel_commit}<//>`)}.
                Exact window: 2026-11-10 00:00 UTC (inclusive) to 2026-11-17
                00:00 UTC (exclusive), using invocation creation or PR merge
                time. Collected ${e.collected_at_utc}.${" "}
                ${link("./evidence.json", "Reviewed evidence")} ·
                ${link("./manifest.json", "Manifest")}<//
              >
            </header>
            <${SimpleGrid} cols=${{ base: 1, sm: 3 }}>
              <${Metric}
                value="32 / 883"
                label="Failed completed test invocations"
                detail="851 succeeded. Six disconnected invocations are separate. Unit: unique child Bazel test invocation with canonical repo, CI role and devel branch."
              />
              <${Metric}
                value="10 / 149"
                label="Failed non-cached VM test runs"
                detail="6.7% observed frequency in this target/configuration. 704 cached passes and two failures before TestResult are excluded from this denominator."
              />
              <${Metric}
                value="3 / 1,487"
                label="Devel PRs merged with a visible red gate"
                detail="Seven additional PRs had a check crossing merge time; two have unknown merge-time state. This measures operator friction, not flaky tests or proven overrides."
              />
            <//>
            <${Alert}
              color="blue"
              title="Prior repairs and coverage changed during this window"
            >
              The old and new seven-day windows overlap. The earlier 28/88 VM
              API count and current 12/151 count have different source and
              exposure; they do not establish an improvement.${" "}${pr(15897)}
              moved unsupported Codex OOM-survival coverage to manual on 12
              November. ${" "}${pr(17117)} moved a memory benchmark to manual
              after this window. Both policy changes are explicit below; neither
              repairs runtime behavior.
            <//>
            <${Group} component="nav" aria-label="Report sections">
              ${link("#priorities", "Priorities")}${link("#populations", "Counts and cache")}${link("#vm-phases", "VM causal timeline")}${link("#baseline-census", "Baseline census")}${link("#merges", "Merge-time checks")}${link("#continuity", "Prior interventions")}${link("#limits", "Coverage limits")}
            <//>
            <section id="priorities">
              <${Title} order=${2} mb="sm"
                >Ranked findings and next decisions<//
              >
              <${Text} mb="md"
                >Order weighs recurrence, retry/operator cost, mechanism
                confidence and repair cost. Only report files changed. Proposed
                source repairs below remain unimplemented and untested.<//
              >
              <${TextInput}
                label="Filter findings"
                placeholder="Search title or classification"
                value=${query}
                onChange=${(event) => setQuery(event.currentTarget.value)}
                mb="md"
              />
              <${Text} size="sm" c="dimmed" mb="sm" aria-live="polite"
                >${findings.length} of ${e.findings.length} findings<//
              >
              <${Stack} gap="md">
                ${findings.map(
                  (f) =>
                    html`<${Paper}
                      key=${f.id}
                      withBorder
                      p="lg"
                      data-finding=${f.id}
                      ><${Stack} gap="sm">
                        <${Group} justify="space-between"
                          ><${Title} order=${3}>${f.id}. ${f.title}<//
                          ><${Badge} variant="light"
                            >${f.id === "D" || f.id === "F" ? "Historical / changed" : "Open"}<//
                          ><//
                        >
                        <${Text} size="sm" c="dimmed">${f.classification}<//
                        ><${Text} fw=${600}>${f.frequency}<//>
                        <${Text}>${f.observation}<//
                        ><${Text}>${f.comparator}<//>
                        <${Text} fw=${600}
                          >Repair or next discriminating observation<//
                        ><${Text}>${f.repair}<//>
                        <${Text} size="sm" c="dimmed">${f.limit}<//
                        ><${Group} gap="md"
                          >${f.links.map((l) => html`<span key=${l.url}>${link(l.url, l.label)}</span>`)}<//
                        >
                      <//><//
                    >`,
                )}
                ${findings.length ? null : html`<${Text}>No findings match this filter.<//>`}
              <//>
            </section>
            <section id="populations">
              <${Title} order=${2} mb="sm"
                >Counts measure distinct populations<//
              >
              <${Text} my="sm"
                >The mainline population contains 889 unique child test
                invocations: 883 completed and six disconnected. Failures
                comprise 21 TESTS_FAILED, seven BUILD_FAILURE, three
                REMOTE_ERROR and one REMOTE_CACHE_EVICTED. Separate build (823)
                and run (15) commands are not additional test builds. Remote
                parent runners are not counted twice.<//
              >
              <${Paper}
                withBorder
                p="md"
                my="md"
                data-chart="mainline-daily-failures"
              >
                <${Title} order=${3}
                  >Non-green mainline test invocations by UTC creation day<//
                >
                <${Text} size="sm" c="dimmed"
                  >Counts of invocation outcomes, including cached target
                  results; disconnected is separate from completed failures.
                  Daily total denominators follow in the table.<//
                >
                <${BarChart}
                  h=${320}
                  mt="md"
                  data=${e.mainline.daily.map((d) => ({ ...d, day: d.day.slice(5) }))}
                  dataKey="day"
                  type="stacked"
                  withLegend
                  series=${[
                    { name: "Tests failed", color: "red.6" },
                    { name: "Build failed", color: "orange.6" },
                    { name: "Remote/cache", color: "violet.6" },
                    { name: "Disconnected", color: "gray.6" },
                  ]}
                  yAxisLabel="Invocations"
                  barProps=${{ isAnimationActive: false }}
                />
              <//>
              ${rows(
                [
                  "UTC day",
                  "Passed",
                  "Test failure",
                  "Build failure",
                  "Remote/cache",
                  "Disconnected",
                  "All",
                ],
                e.mainline.daily.map((d) => [
                  d.day,
                  d.Passed,
                  d["Tests failed"],
                  d["Build failed"],
                  d["Remote/cache"],
                  d.Disconnected,
                  d.all_invocations,
                ]),
              )}
              <${Title} order=${3} mt="lg" mb="sm"
                >VM exposure: verdicts, cache and physical IDs<//
              >
              ${rows(
                ["Measure", "Count / interpretation"],
                [
                  [
                    "Indexed rows joined to the mainline population",
                    "855: 843 passed, 10 failed tests, 2 failures to build",
                  ],
                  [
                    "Cached test runs",
                    "704 passes; recorded verdicts without fresh execution exposure",
                  ],
                  [
                    "Non-cached test-result runs",
                    "149: 139 passed, 10 failed; one configuration, one run/shard/attempt per verdict",
                  ],
                  [
                    "Linked physical execution IDs",
                    "161 unique IDs: 145 NEW links and 16 action-sharing links; this count includes infrastructure attempts",
                  ],
                  [
                    "Remote execution outcomes",
                    "12 UNAVAILABLE rows (7 pause refusals, 3 health deadlines, 2 restore failures), 1 cancelled row, 10 test-exit-1 rows and 138 OK/zero rows",
                  ],
                  [
                    "Mapping boundary",
                    "One PASSED target, 8450920c, has only a cancelled linked execution. Its successful physical producer remains unknown. Two FTB rows have no test summary; cache/physical exposure unknown.",
                  ],
                ],
              )}
              <${Text} size="sm" c="dimmed" mt="sm"
                >The 10/149 figure is a non-cached result frequency, not 10/161
                and not an intrinsic flake probability. IDs were deduplicated;
                action-sharing links may originate outside this cohort. No new
                same-full-SHA fresh recovery pair was established. A
                cache-served pass or a different-source pass is not that
                recovery.<//
              >
              <${Title} order=${3} mt="lg" mb="sm"
                >BuildBuddy Flakes API leads<//
              >
              <${Text} mb="sm"
                >Explicit canonical repository, devel branch and exact UTC
                dates. All candidate sample pages were followed. For VM, the
                API's 12/151 reconciles to ten failed tests plus two failures to
                build among 149 non-cached results plus those two FTB rows. Keep
                its five likely-flaky heuristic runs separate from verified
                recoveries. Other API rows are leads; their complete physical
                exposure was not audited.<//
              >
              ${rows(
                ["Target", "API failed / total", "Likely-flaky heuristic"],
                e.target_stats.rows.map((r) => [
                  html`<${Code}>${r.label}<//>`,
                  `${r.data.failedRuns ?? 0} / ${r.data.totalRuns}`,
                  r.data.likelyFlakyRuns ?? 0,
                ]),
              )}
              <${Accordion} variant="contained" mt="md">
                <${Accordion.Item} value="bad-targets"
                  ><${Accordion.Control}
                    >24 bad target verdicts in 22 mainline invocations, with
                    source and attempt identity<//
                  ><${Accordion.Panel}>
                    <${Text} size="sm" mb="sm"
                      >Failures can co-occur: one build-failure invocation also
                      produced a VM test failure. All matching result events
                      report strategy=remote; omitted cache counts are zero with
                      full event coverage. Raw shard failures do not multiply
                      final target verdicts.<//
                    >
                    ${rows(
                      [
                        "Target / verdict",
                        "Invocation / tested full SHA",
                        "Non-cached runs / bad shards",
                        "Cluster",
                      ],
                      e.failed_targets.map((r) => [
                        html`<${Stack} gap=${4}
                          ><${Code}>${r.target}<//
                          ><${Text} size="sm">${r.verdict}<//><//
                        >`,
                        html`<${Stack} gap=${4}
                          >${link(bb + r.invocation, r.invocation.slice(0, 8))}<${Code}
                            >${r.tested_sha}<//
                          ><${Text} size="xs">${r.created_at_utc}<//><//
                        >`,
                        `${r.noncached_runs} / ${r.result_events.length}`,
                        r.cluster ?? "Separate target mechanism; see evidence",
                      ]),
                    )}
                  <//><//
                >
                <${Accordion.Item} value="github"
                  ><${Accordion.Control}
                    >17,897 GitHub workflow run IDs: separate PR, fork and push
                    populations<//
                  ><${Accordion.Panel}>
                    <${Text} mb="sm"
                      >Seven daily partitions per workflow, each below the
                      1,000-result cap and paginated to its reported count.
                      Latest attempt per run ID; selected historical
                      merge-candidate attempts were reconstructed. Push CI has
                      774 success, 55 failure and 792 cancellation outcomes, but
                      also contains release/image jobs, so 55/829 is not the
                      Bazel failure frequency. Cancelling superseded queued work
                      is not a flaky test. Fork PR execution uses its trusted
                      workflow.<//
                    >
                    ${rows(
                      [
                        "Workflow / event",
                        "Run IDs",
                        "Latest visible outcomes",
                      ],
                      e.github_workflow_populations.rows.map((r) => [
                        `${r.workflow.split("/").at(-1)} · ${r.event}`,
                        r.run_ids,
                        JSON.stringify(r.latest_attempt_outcomes),
                      ]),
                    )}
                    <${Text} size="sm" mt="sm"
                      >${e.github_workflow_populations.missing_coverage}<//
                    >
                  <//><//
                >
              <//>
            </section>
            <section id="vm-phases">
              <${Title} order=${2} mb="sm"
                >The cold VM timeout has a measurable causal timeline<//
              >
              <${Text}
                >Failed physical attempt
                ${link(bb + "54d9f029-3e3c-55e3-8fa7-4f38d48461a0", "54d9f029")}
                tested full source
                <${Code}>2a207f39a1f624879631e078ab139f66ef368793<//>,
                configuration 6db61594, shard 1, run 1, attempt 1; one
                non-cached result and one unique TestRunner. Existing driver and
                service traces were inspected before proposing diagnostics.<//
              >
              ${rows(
                ["UTC / interval", "Evidence and implication"],
                [
                  [
                    "12:40:46.778 → 12:47:01.797",
                    "Setup lasts 375.019s. Retained baseline reason is missing_marker (cold), not an asserted reuse success.",
                  ],
                  [
                    "12:41:33.435 → 12:46:58.337",
                    "25 serial image imports occupy a 324.902s elapsed envelope; virt-launcher alone is 69.481s and guest root 58.035s. This interval overlaps other setup work and is not added to setup duration.",
                  ],
                  [
                    "12:47:05.844 → 12:50:55.684",
                    "Claude case envelope is 229.839s. Its final turn wait ends at 12:50:22.260; the later timeout interrupts remaining case work. Codex completes in 183.026s.",
                  ],
                  [
                    "600s outer pytest deadline",
                    "Fixture setup plus the Claude envelope exceeds the shared deadline. The wrapper remains failed even though later cleanup completes; no lost-turn cause is established for this attempt.",
                  ],
                  [
                    "Fresh following pass 26a37e83",
                    "Same retained-baseline fingerprint, warm reason reused. Setup 51.405s, Claude 138.281s, Codex 124.111s, two JUnit passes. Source/action inputs differ; no same-source recovery or causal speedup is claimed.",
                  ],
                ],
              )}
              <${Title} order=${3} mt="lg" mb="sm">What used the 375 seconds?<//>
              <${Text} mb="sm">The setup was doing active cold-start work. Its baseline marker was absent, so K3s bootstrapped and the single import worker loaded all 25 images. Every image reports <${Code}>image.import.skipped=false<//>. The import worker is intentionally serial to retain blob deduplication; this observation does not validate parallel imports.<//>
              <${Text} fw=${600} mt="sm">Setup budget: 43.111s K3s + 321.248s image imports + 10.660s remaining work = 375.019s.<//>
              ${rows(
                [
                  "Non-overlapping wall-time budget",
                  "Seconds",
                  "Share of setup",
                ],
                [
                  [
                    "Open cold K3s baseline (includes 41.598s K3s start)",
                    "43.111",
                    "11.5%",
                  ],
                  [
                    "Time inside 25 serial image-import spans",
                    "321.248",
                    "85.7%",
                  ],
                  [
                    "Remaining setup time and gaps between imports",
                    "10.660",
                    "2.8%",
                  ],
                  ["Total fixture setup", "375.019", "100%"],
                ],
              )}
              <${Text} size="sm" mt="sm">The imports' 324.902s first-start-to-last-end envelope contains 3.653s of gaps. Controller installation, CRD/manifests and certificate work overlap that envelope; adding those spans again would overstate the total.<//>
              <${SetupTimeline} />
              ${rows(
                [
                  "Image group (serial span time)",
                  "Seconds",
                  "Largest contributors",
                ],
                [
                  [
                    "KubeVirt + Kyverno · 7 images",
                    "144.651",
                    "virt-launcher 69.481; virt-handler 29.963; virt-operator 14.141",
                  ],
                  [
                    "PKI · 4 images",
                    "14.631",
                    "cert-manager controller 5.656; cainjector 3.768",
                  ],
                  [
                    "Application / runner / PostgreSQL · 12 images",
                    "102.622",
                    "PostgreSQL 23.393; runner-disk 13.651; notifications 11.387",
                  ],
                  [
                    "Guest · 2 images",
                    "59.344",
                    "guest-root 58.035; guest-boot 1.310",
                  ],
                ],
              )}
              <${Accordion} variant="contained" mt="sm"><${Accordion.Item} value="all-imports"><${Accordion.Control}>All 25 image imports and overlapping setup spans</${Accordion.Control}><${Accordion.Panel}>
                ${rows(
                  ["Image", "Seconds", "Offset from setup start (s)"],
                  e.setup_breakdown.images.map((i) => [
                    i.image.replace("git.allegedly.works/ducktape-ci/", ""),
                    i.seconds.toFixed(3),
                    `${i.start_offset_seconds.toFixed(3)} → ${i.end_offset_seconds.toFixed(3)}`,
                  ]),
                )}
                ${rows(
                  ["Overlapping span (do not add to total)", "Seconds"],
                  e.setup_breakdown.spans
                    .filter(
                      (s) =>
                        ![
                          "system_test.k3s.start",
                          "system_test.k3s.bootstrap",
                          "system_test.k3s.baseline.open",
                        ].includes(s.name),
                    )
                    .map((s) => [s.name, s.seconds.toFixed(3)]),
                )}
              </${Accordion.Panel}></${Accordion.Item}><//>
              <${Text} mt="sm">After the last import, the remaining 3.460s includes 2.389s between the “images imported” and “Deployments Available” events and a 0.697s virtualization-readiness check. The 25.313s PKI-controller wait and 12.978s manifest apply were already hidden beneath imports.<//>
              <${Text} mt="sm">Existing native profiling covers only UTC 12:45:58–12:46:13: 8.43 CPU-seconds sampled during 15 wall-seconds. The five-second runtime trace includes 1.90s of aggregate syscall delay (1.34s in writes), with containerd content-copy/write stacks present. This confirms import activity in that sample; it does not establish why the whole import queue was slow or prove a storage bottleneck. No whole-import CPU or I/O attribution is claimed.<//>
              <${Text} mt="sm">The following warm pass used the same baseline fingerprint but different source/action inputs. Its 51.405s setup is a phase comparator, not a measured 324s saving. The cold reason here is <${Code}>missing_marker<//>; determining whether retention could have avoided it is the separate baseline census below.<//>
              <${Text} size="sm" c="dimmed" mt="sm"
                >Driver spans are wall-time intervals, with inclusive and
                parallel work; unfinished spans may be absent. Service export
                batching can lose final spans. Host and guest clocks are not
                assumed synchronized. The trace explains this timeout's budget,
                while JUnit/TestResult establishes the failed verdict.

              <${Text} mt="sm">The fresh results' tested sources declare two stable recycling-key families: one VM family and one shared Pod / Pod-platform / MCP family. All 154 readable native Actions agree with those source-derived keys, covering 155 result events; native metadata is unavailable for the rest. The Actions request newest snapshot reads and allow snapshots, with no forced remote-save policy.<//>

              <${Text} mt="sm">Native ExecuteResponses were recovered for 150 of 385 linked physical executions. They report 36 versioned snapshot-key tuples across eight platform/configuration combinations. Eleven of the 14 missing-marker results have native VM metadata: all eleven are first-task runners with no last-executed task. All 102 warm results with metadata have a last-executed task. This is consistent with a fresh VM or base state being selected, rather than a clean attached K3s baseline failing its identity check. The missing read/admission/fallback decision is still needed to explain why a compatible retained snapshot was not used.<//>
