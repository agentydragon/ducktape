name: Setup Nix + Attic
description: Install Nix with the repository Attic substituter and authenticate it

inputs:
  attic_token:
    description: Attic token for private cache access and permitted uploads
    required: true
  upload:
    description: >-
      Upload every path added to the store to ducktape:main as it lands (`attic watch-store`),
      so a failed or timed-out cold build still caches its finished paths. Requires a writer token.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # jq is available on GitHub-hosted runners, but Nix is not installed yet.
    - name: Load Attic trusted pubkeys
      id: attic_keys
      shell: bash
      run: |
        keys="$(jq -r 'join(" ")' nix/attic-pubkeys.json)"
        echo "value=$keys" >> "$GITHUB_OUTPUT"

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes fetch-closure
          netrc-file = /home/runner/.config/nix/netrc
          extra-trusted-public-keys = ${{ steps.attic_keys.outputs.value }}
          extra-substituters = https://cache.allegedly.works/main
          fallback = true

    - name: Write Nix netrc for cache.allegedly.works
      shell: bash
      env:
        ATTIC_TOKEN: ${{ inputs.attic_token }}
      run: |
        : "${ATTIC_TOKEN:?Attic token is required}"
        printf 'ATTIC_TOKEN=%s\n' "$ATTIC_TOKEN" >> "$GITHUB_ENV"
        mkdir -p /home/runner/.config/nix
        umask 077
        printf 'machine cache.allegedly.works password %s\n' "$ATTIC_TOKEN" \
          > /home/runner/.config/nix/netrc

    - name: Start incremental Attic upload
      if: inputs.upload == 'true'
      shell: bash
      run: |
        nix profile install nixpkgs#attic-client
        attic login ducktape https://cache.allegedly.works "$ATTIC_TOKEN"
        nohup attic watch-store ducktape:main > "$RUNNER_TEMP/attic-watch-store.log" 2>&1 &
