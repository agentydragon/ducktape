name: GHCR Build and Push
description: Compute image tags, login to GHCR, and build+push a Docker image.

inputs:
  image:
    description: Full image name (e.g. ghcr.io/agentydragon/foo)
    required: true
  context:
    description: Docker build context path
    required: true
  file:
    description: Path to Dockerfile (optional; defaults to {context}/Dockerfile)
    required: false
    default: ""
  build_args:
    description: Newline-separated Docker build args (e.g. BASE_DIGEST=sha256:...)
    required: false
    default: ""
  cache_from:
    description: Docker build cache source (e.g. type=registry,ref=image:buildcache)
    required: false
    default: ""
  cache_to:
    description: Docker build cache destination (e.g. type=registry,ref=image:buildcache,mode=max)
    required: false
    default: ""

outputs:
  tags:
    description: Comma-separated list of pushed image tags
    value: ${{ steps.meta.outputs.tags }}
  pin_tag:
    description: The branch-timestamp-sha7 tag (useful for Flux ImagePolicy)
    value: ${{ steps.meta.outputs.pin_tag }}

runs:
  using: composite
  steps:
    - name: Compute image tags
      id: meta
      shell: bash
      run: |
        SHA="${{ github.sha }}"
        TS="$(date -u +%Y%m%d%H%M%S)"
        PINNED_TAG="${GITHUB_REF_NAME}-${TS}-${SHA:0:7}"
        TAGS="${{ inputs.image }}:$SHA,${{ inputs.image }}:$PINNED_TAG"
        if [[ "${{ github.event_name }}" != "workflow_call" ]]; then
          TAGS="$TAGS,${{ inputs.image }}:latest"
        fi
        echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
        echo "pin_tag=$PINNED_TAG" >> "$GITHUB_OUTPUT"

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        build-args: ${{ inputs.build_args }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: ${{ inputs.cache_from }}
        cache-to: ${{ inputs.cache_to }}
