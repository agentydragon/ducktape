# Save Bazel repository cache (only on cache miss).
# See .github/docs/bazel_caching.md for design rationale.
#
# NOTE: Uses actions/cache/save@v4 which creates a new cache entry even when
# the key already exists, which can cause duplicate-key 400 errors on restore.
# This action is currently unused — see .github/docs/bazel_caching.md.
name: Bazel Repo Cache Save
description: Save Bazel repository cache (use after bazel-repo-cache action)

inputs:
  cache-hit:
    description: "Whether cache was restored (from bazel-repo-cache output)"
    required: true
  cache-key:
    description: "Cache key to save under (from bazel-repo-cache output)"
    required: true

runs:
  using: composite
  steps:
    - name: Save Bazel repository cache
      if: inputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cache/bazelisk
          ~/.cache/bazel/_bazel_runner/cache/repos/v1
        key: ${{ inputs.cache-key }}
