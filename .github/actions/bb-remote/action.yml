# Wrapper around `bb remote` that ensures --config=rbe is always passed.
#
# We use `bb remote` directly instead of `bbr` (devinfra/bbr.py) in CI to
# avoid a chicken-and-egg: bbr reads the RBE image pin from
# devinfra/image_pins.json, but CI workflows may need to build/push the RBE
# image itself. This action centralizes the --config=rbe flag so individual
# workflows don't forget it (without RBE, actions run in linux-sandbox on the
# runner VM which lacks tools like cpio).
#
# Two modes, mutually exclusive:
# - `args`:   `bb remote <args> --config=rbe --config=ci ...`
#             (e.g. args="build //..."). Triggers `bb`'s post-run
#             `downloadOutputs` path for `build` and local `run` commands,
#             which currently fails with "Exhausted all peers" — see
#             devinfra/debug/bb_remote_peers_exhausted.md.
# - `script`: `bb remote --script="<script>"`. Runs an arbitrary shell
#             script on the runner VM. Prefer this for combined Bazel
#             invocations and any workload that doesn't need build outputs
#             materialized on the GHA runner. The script can reference
#             $RBE_IMAGE (forwarded automatically) to inline
#             `--remote_default_exec_properties=container-image=docker://$RBE_IMAGE`.
name: bb remote
description: Run a Bazel command via bb remote with RBE enabled

inputs:
  args:
    description: >
      Bazel subcommand and arguments (e.g. 'build //...' or 'run //target').
      Mutually exclusive with `script`.

      GOTCHA: these are placed BEFORE `--config=rbe --config=ci`, and Bazel's
      last-one-wins ordering means anything those configs set silently overrides
      what you pass here. `--remote_download_outputs=toplevel` used to be passed
      by four callers and never took effect once — the build log says so:
      "option '--remote_download_minimal' (source expanded from --config=rbe) was
      expanded and now overrides the explicit option
      --remote_download_outputs=toplevel". Use `script` when you need a flag to win.

      Note also that this flag would not have controlled what reaches the GitHub
      runner even if it had applied: `bb`'s post-run download resolves outputs
      from the invocation's build events and fetches them from CAS, independently
      of what Bazel materialized on the runner VM.
    required: false
    default: ""
  script:
    description: >
      Shell script to run on the BB runner instead of a single Bazel command.
      Mutually exclusive with `args`. $RBE_IMAGE is forwarded to the runner
      so the script can build remote-default-exec-properties dynamically.
    required: false
    default: ""
  env_overrides:
    description: >
      Newline-separated KEY=VALUE pairs forwarded to the runner via
      x-buildbuddy-platform.env-overrides. Only still used by the
      props-agents job in .github/workflows/push-images.yml, which pushes
      to the private props registry from inside the BB runner VM. The GHCR
      push path (the matrix in the same workflow) downloads OCI layouts to
      the runner and calls `crane push` directly, so it doesn't need this.
    required: false
    default: ""
  rbe_image:
    description: >
      Override RBE executor container image (e.g. ghcr.io/.../rbe-worker:sha).
      When set, passes --remote_default_exec_properties=container-image to
      override the pinned image from image_pins.json.
    required: false
    default: ""
  disk_bytes:
    description: "Runner disk size in bytes (EstimatedFreeDiskBytes)"
    required: false
    default: "50000000000"
  compute_units:
    description: "Runner vCPU count (EstimatedComputeUnits)"
    required: false
    default: "4"
  linkage_roles:
    description: >
      Optional comma-separated role names for child Bazel invocations in the
      emitted linkage JSON, e.g. "test,build".
    required: false
    default: ""
  run_from_commit:
    description: >
      If set, passes --run_from_commit=<sha>: the runner checks out that exact commit
      and skips workspace patch sync entirely. Only safe when the workspace is a clean
      checkout of that commit (the patch path's "drops uncommitted changes" caveat
      doesn't apply). See .github/workflows/bazel-ci.yml and
      devinfra/docs/bb_remote_internals.md.
    required: false
    default: ""

outputs:
  log_path:
    description: "Path to the captured bb remote log on the GitHub Actions runner"
    value: ${{ steps.bb-remote.outputs.log_path }}
  linkage_json_path:
    description: "Path to the emitted bb remote linkage JSON on the GitHub Actions runner"
    value: ${{ steps.bb-remote.outputs.linkage_json_path }}
  bazel_invocation_ids:
    description: >
      Comma-separated BuildBuddy invocation ids of the Bazel builds this step ran.
      A later job can read what those builds produced — output digests, per-target
      test verdicts — instead of building the same targets again.
    value: ${{ steps.bb-remote.outputs.bazel_invocation_ids }}

runs:
  using: composite
  steps:
    - name: bb remote
      id: bb-remote
      shell: bash
      env:
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_SCRIPT: ${{ inputs.script }}
        INPUT_ENV_OVERRIDES: ${{ inputs.env_overrides }}
        INPUT_RBE_IMAGE: ${{ inputs.rbe_image }}
        INPUT_DISK_BYTES: ${{ inputs.disk_bytes }}
        INPUT_COMPUTE_UNITS: ${{ inputs.compute_units }}
        INPUT_LINKAGE_ROLES: ${{ inputs.linkage_roles }}
        INPUT_RUN_FROM_COMMIT: ${{ inputs.run_from_commit }}
      run: |
        set -euo pipefail

        if [[ -n "$INPUT_ARGS" && -n "$INPUT_SCRIPT" ]]; then
          echo "::error::bb-remote: 'args' and 'script' are mutually exclusive"; exit 1
        fi
        if [[ -z "$INPUT_ARGS" && -z "$INPUT_SCRIPT" ]]; then
          echo "::error::bb-remote: one of 'args' or 'script' must be set"; exit 1
        fi

        safe_job="${GITHUB_JOB:-job}"
        safe_job="${safe_job//[^A-Za-z0-9_.-]/_}"
        LOG_PATH="${RUNNER_TEMP:-/tmp}/bb-remote-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${safe_job}.log"
        LINKAGE_JSON_PATH="${RUNNER_TEMP:-/tmp}/bb-remote-linkage-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${safe_job}.json"
        mkdir -p "$(dirname "$LOG_PATH")"
        echo "log_path=$LOG_PATH" >> "$GITHUB_OUTPUT"
        echo "linkage_json_path=$LINKAGE_JSON_PATH" >> "$GITHUB_OUTPUT"

        ENV_ARGS=()
        while IFS= read -r line; do
          [[ -n "$line" ]] && ENV_ARGS+=(--remote_run_header="x-buildbuddy-platform.env-overrides=$line")
        done <<< "$INPUT_ENV_OVERRIDES"

        # Resolve the runner and the RBE executor image — two different artifacts
        # since the rbe-worker/bbr-runner image split: the runner VM boots
        # `.bbr_runner` (Bazel client + repo devtools: bazel-diff, nix, …), while
        # Bazel actions execute on `.rbe_worker`.
        # --container_image is a `bb remote` flag (runner VM): must come before the Bazel subcommand.
        # --remote_default_exec_properties is a Bazel command flag (RBE executor): must come after the subcommand.
        #
        # When no override is given, read the pinned executor image from image_pins.json
        # so that repo-rule resolution (pip wheel builds) runs on the custom image with
        # system libs (pkg-config, libcairo2-dev, etc.). Without this, bb remote uses
        # BuildBuddy's default image which lacks these dependencies. The rbe_image input
        # overrides only the executor (that's what rbe-image validation exercises); the
        # runner always boots the pinned bbr_runner image.
        RBE_IMAGE="$INPUT_RBE_IMAGE"
        if [[ -z "$RBE_IMAGE" ]]; then
          pin_image=$(jq -r '.rbe_worker.image' devinfra/image_pins.json)
          pin_digest=$(jq -r '.rbe_worker.digest' devinfra/image_pins.json)
          RBE_IMAGE="${pin_image}@${pin_digest}"
        fi
        runner_image=$(jq -r '.bbr_runner.image' devinfra/image_pins.json)
        runner_digest=$(jq -r '.bbr_runner.digest' devinfra/image_pins.json)
        BB_IMAGE_ARGS=(--container_image="docker://${runner_image}@${runner_digest}")

        RUNNER_EXEC_PROPS=(
          --runner_exec_properties=EstimatedFreeDiskBytes="$INPUT_DISK_BYTES"
          --runner_exec_properties=EstimatedComputeUnits="$INPUT_COMPUTE_UNITS"
          --runner_exec_properties=workload-isolation-type=firecracker
          --runner_exec_properties=init-dockerd=true
          --runner_exec_properties=recycle-runner=true
          --runner_exec_properties=remote-snapshot-save-policy=always
          --runner_exec_properties=snapshot-read-policy=newest
        )

        # --run_from_commit (optional): runner checks out the exact commit instead of
        # mirroring the working tree as a patchset. See the run_from_commit input and
        # bazel-ci.yml for the rationale.
        RUN_FROM_COMMIT_ARGS=()
        if [[ -n "$INPUT_RUN_FROM_COMMIT" ]]; then
          RUN_FROM_COMMIT_ARGS=(--run_from_commit="$INPUT_RUN_FROM_COMMIT")
        fi

        if [[ -n "$INPUT_SCRIPT" ]]; then
          # Forward RBE_IMAGE so the script can interpolate it into Bazel flags.
          ENV_ARGS+=(--remote_run_header="x-buildbuddy-platform.env-overrides=RBE_IMAGE=${RBE_IMAGE}")
          BB_REMOTE_COMMAND=(
            bb remote
            "${RUNNER_EXEC_PROPS[@]}"
            "${ENV_ARGS[@]}"
            "${BB_IMAGE_ARGS[@]}"
            "${RUN_FROM_COMMIT_ARGS[@]}"
            --script="$INPUT_SCRIPT"
          )
        else
          BAZEL_IMAGE_ARGS=(--remote_default_exec_properties="container-image=docker://${RBE_IMAGE}")
          # shellcheck disable=SC2206 # word-splitting on $INPUT_ARGS is intended
          INPUT_ARGS_ARRAY=($INPUT_ARGS)
          BB_REMOTE_COMMAND=(
            bb remote
            "${RUNNER_EXEC_PROPS[@]}"
            "${ENV_ARGS[@]}"
            "${BB_IMAGE_ARGS[@]}"
            "${RUN_FROM_COMMIT_ARGS[@]}"
            "${INPUT_ARGS_ARRAY[@]}"
            --config=rbe
            --config=ci
            "${BAZEL_IMAGE_ARGS[@]}"
          )
        fi

        set +e
        "${BB_REMOTE_COMMAND[@]}" 2>&1 | tee "$LOG_PATH"
        BB_REMOTE_STATUS=${PIPESTATUS[0]}
        set -e

        LINKAGE_STATUS=0
        python3 devinfra/ci/emit_bb_remote_linkage.py \
          --log "$LOG_PATH" \
          --out "$LINKAGE_JSON_PATH" \
          --roles "$INPUT_LINKAGE_ROLES" \
          --bb-remote-exit-code "$BB_REMOTE_STATUS" || LINKAGE_STATUS=$?

        if [[ "$BB_REMOTE_STATUS" -eq 0 && "$LINKAGE_STATUS" -ne 0 ]]; then
          exit "$LINKAGE_STATUS"
        fi
        exit "$BB_REMOTE_STATUS"
