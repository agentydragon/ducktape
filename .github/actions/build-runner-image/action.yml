name: Assemble BuildBuddy runner image
description: Import the pinned base, assemble the Nix closure, and validate reproducibility and runtime tools.
inputs:
  image:
    description: Publication repository, used to compare the existing pin.
    required: true
outputs:
  digest:
    description: Digest of the assembled OCI manifest.
    value: ${{ steps.build.outputs.digest }}
  needs_publish:
    description: Whether this image differs from the current pin.
    value: ${{ steps.build.outputs.needs_publish }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-nix-devtools
      with:
        installables: ".#runner-image-tools"

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Assemble and compare repeated builds
      id: build
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        python3 devinfra/buildbuddy/images/runner/build.py build \
          --work-dir "$RUNNER_TEMP/runner-image" --image "$IMAGE" \
          --github-output "$GITHUB_OUTPUT" --check-reproducible

    - name: Exercise the assembled tools in Docker
      shell: bash
      env:
        ARCHIVE: ${{ steps.build.outputs.archive }}
      run: |
        docker load --input "$ARCHIVE"
        docker run --rm --entrypoint /bin/bash \
          -e USE_BAZEL_VERSION="$(cat .bazelversion)" \
          buildbuddy-remote-runner:latest -euxo pipefail -c '
            command -v bb bazelisk bazel-diff
            command -v heaptrack heaptrack_print
            bb version
            bazelisk version
            bazel-diff --help
            heaptrack --version
            ldd /usr/lib/heaptrack/libheaptrack_preload.so | grep -F "libc.so.6 => /lib/x86_64-linux-gnu/libc.so.6"
            timeout 30s heaptrack --raw --output /tmp/heaptrack-smoke \
              /usr/bin/python3 -c "import os; assert os.readlink(\"/proc/self/exe\") == \"/usr/bin/python3.12\"; x = bytearray(4 * 1024 * 1024)"
            gzip -dc /tmp/heaptrack-smoke.raw.gz | /usr/lib/heaptrack/libexec/heaptrack_interpret 2> /tmp/heaptrack-stats.txt \
              | gzip -c > /tmp/heaptrack-smoke.gz
            heaptrack_print -f /tmp/heaptrack-smoke.gz > /tmp/heaptrack-smoke.txt
            grep -E "^[[:space:]]*allocations:[[:space:]]*[1-9][0-9]*" /tmp/heaptrack-stats.txt
            grep -F "in /usr/bin/python3.12" /tmp/heaptrack-smoke.txt > /dev/null
            git --version
            python3 -c "import json, subprocess, urllib.request"
            test -x /usr/bin/dockerd.real
            /usr/bin/dockerd --version
          '
