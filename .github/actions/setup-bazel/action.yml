# Setup Bazel with BuildBuddy remote cache + GHA repository cache.
# See .github/docs/bazel-caching.md for design rationale.
name: Setup Bazel
description: Setup Bazel with BuildBuddy remote cache and GitHub Actions local cache

inputs:
  buildbuddy_api_key:
    description: "BuildBuddy API key for remote cache (optional - falls back to GHA cache)"
    required: false
    default: ""
  extra_hash:
    description: "Additional hash to append to cache key (use hashFiles() at call site)"
    required: false
    default: ""
  rbe_image:
    description: "Override RBE container image (optional - uses platform default if empty)"
    required: false
    default: ""

outputs:
  cache-hit:
    description: "Whether GitHub Actions cache was restored"
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-key:
    description: "Cache key"
    value: ${{ steps.cache.outputs.cache-key }}

runs:
  using: composite
  steps:
    - name: Setup BuildBuddy
      id: buildbuddy
      uses: ./.github/actions/setup-buildbuddy
      with:
        api_key: ${{ inputs.buildbuddy_api_key }}
        rbe_image: ${{ inputs.rbe_image }}

    - name: Enable CI quiet mode
      shell: bash
      run: |
        echo "" >> "$HOME/.bazelrc"
        echo "# CI quiet mode (auto-added by setup-bazel)" >> "$HOME/.bazelrc"
        echo "common --config=ci" >> "$HOME/.bazelrc"

    - name: Setup Bazel cache
      id: cache
      uses: ./.github/actions/bazel-repo-cache
      with:
        extra_hash: ${{ inputs.extra_hash }}
