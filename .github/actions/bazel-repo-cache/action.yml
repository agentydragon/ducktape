# Restore Bazel repository cache (compressed downloads + Bazelisk binary).
# See .github/docs/bazel-caching.md for design rationale.
name: Bazel Repo Cache
description: Setup Bazelisk and restore Bazel repository cache

inputs:
  extra_hash:
    description: "Additional hash to append to cache key (use hashFiles() at call site)"
    required: false
    default: ""

outputs:
  cache-hit:
    description: "Whether the cache was restored"
    value: ${{ steps.cache-restore.outputs.cache-hit }}
  cache-key:
    description: "The cache key"
    value: ${{ steps.cache-key.outputs.key }}

runs:
  using: composite
  steps:
    - name: Setup Bazelisk
      uses: bazelbuild/setup-bazelisk@v3

    - name: Enable host CC toolchain detection
      shell: bash
      run: |
        # The workspace .bazelrc sets BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1 to
        # prevent Nix store paths leaking into builds. GHA runners use standard
        # Ubuntu with system GCC (13/14), so we override to allow detection.
        echo "" >> ~/.bazelrc
        echo "# CI: allow Bazel to detect system GCC on GHA runners" >> ~/.bazelrc
        echo "build --repo_env=BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=0" >> ~/.bazelrc

    - name: Derive cache key
      id: cache-key
      shell: bash
      env:
        BASE_HASH: ${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
        EXTRA_HASH: ${{ inputs.extra_hash }}
      run: |
        if [[ -n "$EXTRA_HASH" ]]; then
          HASH="${BASE_HASH:0:8}-${EXTRA_HASH:0:8}"
        else
          HASH="${BASE_HASH:0:16}"
        fi

        KEY="bazel-repo-cache-${HASH}"
        echo "key=$KEY" >> $GITHUB_OUTPUT

    - name: Restore Bazel repository cache
      id: cache-restore
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/bazelisk
          ~/.cache/bazel/_bazel_runner/cache/repos/v1
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: bazel-repo-cache-
