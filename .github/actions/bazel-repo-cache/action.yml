# Restore and save Bazel repository cache (compressed downloads + Bazelisk binary).
# See .github/docs/bazel_caching.md for design rationale.
#
# Uses the unified actions/cache@v4 which restores at step time and saves as a
# post step (on job success). The save only fires when the exact key was NOT
# found during restore, avoiding the duplicate-key problem that broke the
# previous actions/cache/save@v4 approach (see bazel_caching.md §
# Duplicate-key problem).
name: Bazel Repo Cache
description: Setup Bazelisk and restore/save Bazel repository cache

inputs:
  extra_hash:
    description: "Additional hash to append to cache key (use hashFiles() at call site)"
    required: false
    default: ""

outputs:
  cache-hit:
    description: "Whether the cache was restored"
    value: ${{ steps.cache-restore.outputs.cache-hit }}
  cache-key:
    description: "The cache key"
    value: ${{ steps.cache-key.outputs.key }}

runs:
  using: composite
  steps:
    - name: Setup Bazelisk
      uses: bazelbuild/setup-bazelisk@v3

    - name: Derive cache key
      id: cache-key
      shell: bash
      env:
        BASE_HASH: ${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
        EXTRA_HASH: ${{ inputs.extra_hash }}
      run: |
        if [[ -n "$EXTRA_HASH" ]]; then
          HASH="${BASE_HASH:0:8}-${EXTRA_HASH:0:8}"
        else
          HASH="${BASE_HASH:0:16}"
        fi

        KEY="bazel-repo-cache-${HASH}"
        echo "key=$KEY" >> $GITHUB_OUTPUT

    - name: Restore/save Bazel repository cache
      id: cache-restore
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/bazelisk
          ~/.cache/bazel/_bazel_runner/cache/repos/v1
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: bazel-repo-cache-
