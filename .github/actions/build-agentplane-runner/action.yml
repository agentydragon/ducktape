name: Build Agentplane runner binary
description: Build and download the Go runner executable from this checkout through BuildBuddy.

inputs:
  source_commit:
    description: Exact checked-out commit to build remotely.
    required: false
    default: ""

outputs:
  binary:
    description: Local path to the downloaded executable.
    value: ${{ steps.download.outputs.path }}

runs:
  using: composite
  steps:
    - name: Install BuildBuddy CLI
      shell: bash
      run: nix profile install .#citools

    - name: Choose runner binary invocation
      id: invocation
      shell: bash
      run: |
        invocation_run_id="$GITHUB_RUN_ID-${IMAGE:-agentplane-runner}"
        invocation_id="$(python3 devinfra/ci/invocation_ids.py \
          --run-id "$invocation_run_id" --attempt "$GITHUB_RUN_ATTEMPT" --role build)"
        echo "id=$invocation_id" >> "$GITHUB_OUTPUT"

    - name: Build runner binary from this checkout
      id: build
      uses: ./.github/actions/bb-remote
      with:
        script: |
          bazel build //agentplane/runner:runner_release \
            --invocation_id="$BUILD_INVOCATION_ID" \
            --config=rbe --config=ci \
            --remote_default_exec_properties="container-image=docker://$RBE_CONTAINER_IMAGE"
        env_overrides: |
          BUILD_INVOCATION_ID=${{ steps.invocation.outputs.id }}
        linkage_roles: build
        bazel_invocation_ids: ${{ steps.invocation.outputs.id }}
        run_from_commit: ${{ inputs.source_commit || github.sha }}

    - name: Download runner binary from BuildBuddy
      id: download
      shell: bash
      env:
        INVOCATION_ID: ${{ steps.invocation.outputs.id }}
      run: |
        set -euo pipefail
        artifact="$(bbapi artifact --kind build list "$INVOCATION_ID" --json | \
          jq -cer '[.[] | select((.name | split("/") | last) == "agentplane-runner")] |
            if length == 1 then .[0] else error("expected one runner binary build output") end')"
        artifact_label="$(jq -er '.label' <<< "$artifact")"
        artifact_name="$(jq -er '.name' <<< "$artifact")"
        output="$RUNNER_TEMP/agentplane-runner"
        bbapi artifact --kind build download "$INVOCATION_ID" \
          "$artifact_label/$artifact_name" --output "$output"
        test -s "$output"
        echo "path=$output" >> "$GITHUB_OUTPUT"
