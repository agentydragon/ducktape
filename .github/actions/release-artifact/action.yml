name: Release artifact
description: Build a Bazel artifact via RBE, upload to GitHub Release if content changed.

inputs:
  pkg:
    description: "Package name (e.g. claude-hooks)"
    required: true
  bazel_targets:
    description: "Space-separated Bazel targets that produce the release assets"
    required: true
  outputs:
    description: "Space-separated release asset paths under bb-out/"
    required: true
  release_metadata:
    description: "Upload <pkg>.release.json for a single-asset release"
    required: false
    default: "false"
  metadata_platform:
    description: "Optional platform string to include in release metadata"
    required: false
    default: ""
  rbe_image:
    description: "Override RBE container image (optional)"
    required: false
    default: ""
  bazel_flags:
    description: >
      Extra bazel flags appended to both build invocations (unstamped and
      stamped). Use for per-artifact compilation_mode or rustc_flags
      overrides — e.g. `-c opt --@rules_rust//:extra_rustc_flag=-Cdebuginfo=1`
      for an artifact that should ship as an optimized binary instead of
      the workflow's default fastbuild.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Build 1: unstamped (default, --stamp off) — deterministic, for skip decision
    - name: Build artifact (unstamped)
      uses: ./.github/actions/bb-remote
      with:
        args: build ${{ inputs.bazel_targets }} ${{ inputs.bazel_flags }}
        rbe_image: ${{ inputs.rbe_image }}

    - name: Check content hash
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_RELEASE_PAT }}
        PKG: ${{ inputs.pkg }}
      run: |
        set -euo pipefail

        # Skip [skip ci] commits
        subject=$(git log -1 --format=%s)
        if [[ "$subject" == *"[skip ci]"* ]]; then
          echo "$PKG: commit has [skip ci], skipping"
          echo "should_release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        artifacts=()
        for artifact in ${{ inputs.outputs }}; do
          if [[ ! -f "$artifact" ]]; then
            echo "::error::Artifact not found at $artifact"
            ls -R bb-out/ 2>/dev/null || echo "bb-out/ does not exist"
            exit 1
          fi
          artifacts+=("$artifact")
        done

        # Content-addressed skip check: tag by the complete release asset set.
        # Single-artifact hashes retain their historical value so this change
        # does not cause every existing package to be republished.
        content_sha=$(python3 devinfra/ci/release_content_hash.py "${artifacts[@]}")
        tag="${PKG}-${content_sha:0:12}"
        echo "content_sha=${content_sha}" >> "$GITHUB_OUTPUT"
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"

        if gh release view "$tag" >/dev/null 2>&1; then
          echo "$PKG: unchanged (release $tag exists), skipping"
          echo "should_release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "should_release=true" >> "$GITHUB_OUTPUT"

    # Build 2: stamped — injects GIT_COMMIT via expand_template.
    # Only _build_info_gen + wheel targets re-run; everything else is cache-hit.
    - name: Build artifact (stamped)
      if: steps.check.outputs.should_release == 'true'
      uses: ./.github/actions/bb-remote
      with:
        args: build ${{ inputs.bazel_targets }} ${{ inputs.bazel_flags }} --stamp
        rbe_image: ${{ inputs.rbe_image }}

    - name: Upload release
      if: steps.check.outputs.should_release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_RELEASE_PAT }}
        PKG: ${{ inputs.pkg }}
      run: |
        set -euo pipefail

        tag="${{ steps.check.outputs.tag }}"
        files=()
        for artifact in ${{ inputs.outputs }}; do
          files+=("$artifact")
        done

        if [[ "${{ inputs.release_metadata }}" == "true" ]]; then
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "::error::Release metadata requires exactly one release asset"
            exit 1
          fi
          artifact="${files[0]}"
          metadata="$RUNNER_TEMP/${PKG}.release.json"
          metadata_platform="${{ inputs.metadata_platform }}"
          metadata_platform_args=()
          artifact_sha=$(sha256sum "$artifact" | awk '{print $1}')
          if [[ -n "$metadata_platform" ]]; then
            metadata_platform_args=(--platform "$metadata_platform")
          fi
          python3 devinfra/ci/release_metadata.py \
            --output "$metadata" \
            --package "$PKG" \
            --tag "$tag" \
            --git-commit "$(git rev-parse HEAD)" \
            --binary "$(basename "$artifact")" \
            --sha256 "$artifact_sha" \
            "${metadata_platform_args[@]}"
          files+=("$metadata")
        fi

        echo "$PKG: content changed, creating release $tag"

        gh release create "$tag" "${files[@]}" \
          --title "$PKG (${tag#"${PKG}"-})" \
          --notes "$PKG release" \
          --target "$GITHUB_SHA" \
          --latest=false

        echo "Released: $PKG ($tag)"
