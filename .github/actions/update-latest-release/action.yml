name: Update latest release
description: |
  Cleans up old commit-tagged releases (keeps the most recent N) and
  creates/updates a rolling "latest" release pointing to the newest build.

inputs:
  package_prefix:
    description: "Tag prefix for filtering releases (e.g., kubespand)"
    required: true
  latest_tag:
    description: "Rolling release tag name (e.g., kubespand-latest)"
    required: true
  title:
    description: "Release title (e.g., kubespand (latest))"
    required: true
  body:
    description: "Release notes body (before the rolling release footer)"
    required: true
  files:
    description: "Artifact glob/path to upload (e.g., dist/kubespand)"
    required: true
  keep_releases:
    description: "Number of old releases to keep"
    required: false
    default: "10"

runs:
  using: composite
  steps:
    - name: Cleanup old releases
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PACKAGE_PREFIX: ${{ inputs.package_prefix }}
        LATEST_TAG: ${{ inputs.latest_tag }}
        KEEP: ${{ inputs.keep_releases }}
      run: |
        # Sort by createdAt (newest first) so alphabetically-low hex SHAs like
        # "5c64d53b" are not mistakenly treated as older than "eff5227c".
        gh release list --limit 100 --json tagName,createdAt \
          --jq "[.[] | select(.tagName | startswith(\"${PACKAGE_PREFIX}-\"))
                     | select(.tagName != \"${LATEST_TAG}\")]
                | sort_by(.createdAt) | reverse | .[${KEEP}:] | .[].tagName" \
          | xargs -r -I{} gh release delete {} --yes --cleanup-tag

    - name: Update latest release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.latest_tag }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        FILES: ${{ inputs.files }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release delete "$TAG" --yes --cleanup-tag
        fi

        FULL_BODY="$(cat <<EOF
        ${BODY}

        **This is a rolling release that always points to the latest build.**

        Latest commit: ${{ github.sha }}
        Branch: ${{ github.ref_name }}
        EOF
        )"

        # shellcheck disable=SC2086
        gh release create "$TAG" \
          --title "$TITLE" \
          --notes "$FULL_BODY" \
          $FILES
