# Build the Nix-based Haku sandbox image (cluster/k8s/haku/workspaces/image/default.nix)
# and push it to the Forgejo OCI registry, through nix-image.yml.
#
# Deliberately a DIFFERENT image repo from the apt-based haku-sandbox-image.yml
# (`-nix` suffix): the Nix image is not yet what the SandboxTemplate pulls, and pushing it
# under the same name would let Flux/the template roll an image whose runtime behaviour
# nobody has confirmed yet. Publishing it under its own name is what makes the cutover
# checklist in cluster/k8s/haku/workspaces/image/README.md runnable at all — you need a
# pullable ref to point a scratch SandboxTemplate at.
#
# Once the checklist passes, this workflow and haku-sandbox-image.yml collapse into one and
# the Dockerfile goes away.
name: Haku Sandbox Image (Nix)

on:
  push:
    branches: [devel]
    paths:
      - "cluster/k8s/haku/workspaces/image/**"
      - "nix/lib/nix-ld-image.nix"
      - "flake.lock"
      - "nix/flake/packages.nix"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/haku-sandbox-image-nix.yml"
      - ".github/workflows/nix-image.yml"
  # Also on PRs, which the other image workflows deliberately don't do. The cutover
  # checklist needs a *pullable tag* to point a throwaway Pod at, and the image's whole
  # open question is a runtime one a build can't answer — so it has to be testable before
  # it merges, not after. `workflow_dispatch` alone cannot deliver that: GitHub only
  # dispatches workflows that already exist on the default branch (verified — dispatching
  # this file on its own branch 404s), which is exactly the situation a brand-new image
  # workflow is in.
  pull_request:
    paths:
      - "cluster/k8s/haku/workspaces/image/**"
      - "nix/lib/nix-ld-image.nix"
      - "flake.lock"
      - "nix/flake/packages.nix"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/haku-sandbox-image-nix.yml"
      - ".github/workflows/nix-image.yml"
  workflow_dispatch:

concurrency:
  group: haku-sandbox-image-nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/nix-image.yml
    with:
      attr: haku-sandbox-image
      image: git.allegedly.works/ducktape-ci/haku-sandbox-image-nix
      registry: forgejo
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
