# Build the Nix-based Haku sandbox image (cluster/k8s/haku/workspaces/image/default.nix)
# and push it to the Forgejo OCI registry. Mirrors codex-pod-image.yml — a
# dockerTools.buildLayeredImage docker archive, so `skopeo copy docker-archive:`.
#
# Deliberately a DIFFERENT image repo from the apt-based haku-sandbox-image.yml
# (`-nix` suffix): the Nix image is not yet what the SandboxTemplate pulls, and pushing it
# under the same name would let Flux/the template roll an image whose runtime behaviour
# nobody has confirmed yet. Publishing it under its own name is what makes the cutover
# checklist in cluster/k8s/haku/workspaces/image/README.md runnable at all — you need a
# pullable ref to point a scratch SandboxTemplate at.
#
# Once the checklist passes, this workflow and haku-sandbox-image.yml collapse into one and
# the Dockerfile goes away.
name: Haku Sandbox Image (Nix)

on:
  push:
    branches: [devel]
    paths:
      - "cluster/k8s/haku/workspaces/image/**"
      - "flake.lock"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/haku-sandbox-image-nix.yml"
  # Also on PRs, which the other image workflows deliberately don't do. The cutover
  # checklist needs a *pullable tag* to point a throwaway Pod at, and the image's whole
  # open question is a runtime one a build can't answer — so it has to be testable before
  # it merges, not after. `workflow_dispatch` alone cannot deliver that: GitHub only
  # dispatches workflows that already exist on the default branch (verified — dispatching
  # this file on its own branch 404s), which is exactly the situation a brand-new image
  # workflow is in.
  pull_request:
    paths:
      - "cluster/k8s/haku/workspaces/image/**"
      - "flake.lock"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/haku-sandbox-image-nix.yml"
  workflow_dispatch:

concurrency:
  group: haku-sandbox-image-nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-push:
    name: Build & push haku-sandbox (Nix)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: git.allegedly.works/ducktape-ci/haku-sandbox-image-nix
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nix-attic
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Build image
        run: nix build .#haku-sandbox-image --print-build-logs

      - name: Compute tag
        id: meta
        run: |
          SHA="${{ github.sha }}"
          # Sanitize: on pull_request events GITHUB_REF_NAME is `<n>/merge`, and `/` is not
          # legal in an OCI tag — skopeo rejects it with "invalid reference format". The
          # devel-only workflows never hit this because a branch name has no slash.
          SLUG="${GITHUB_REF_NAME//\//-}"
          echo "pin_tag=${SLUG}-$(date -u +%Y%m%d%H%M%S)-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Ungated, unlike codex-pod-image.yml's devel-only push. Nothing consumes
      # `haku-sandbox-image-nix` — no ImagePolicy, no SandboxTemplate — so a branch tag
      # cannot be auto-deployed anywhere, and tags are timestamped so nothing is clobbered.
      # RE-GATE THIS TO devel when the cutover lands and this collapses into
      # haku-sandbox-image.yml under the consumed name; at that point an unreviewed branch
      # push would roll the live sandbox.
      - name: Push to Forgejo
        run: |
          ref="$IMAGE:${{ steps.meta.outputs.pin_tag }}"
          skopeo copy --insecure-policy \
            --dest-creds "$FORGEJO_IMAGES_USERNAME:$FORGEJO_IMAGES_PASSWORD" \
            "docker-archive:$(readlink -f result)" "docker://$ref"
          echo "pushed \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
