# Build the Nix-based Haku sandbox image (cluster/k8s/haku/workspaces/image/default.nix)
# and push it to the Forgejo OCI registry. Mirrors codex-pod-image.yml — a
# dockerTools.buildLayeredImage docker archive, so `skopeo copy docker-archive:`.
#
# Deliberately a DIFFERENT image repo from the apt-based haku-sandbox-image.yml
# (`-nix` suffix): the Nix image is not yet what the SandboxTemplate pulls, and pushing it
# under the same name would let Flux/the template roll an image whose runtime behaviour
# nobody has confirmed yet. Publishing it under its own name is what makes the cutover
# checklist in cluster/k8s/haku/workspaces/image/README.md runnable at all — you need a
# pullable ref to point a scratch SandboxTemplate at.
#
# Once the checklist passes, this workflow and haku-sandbox-image.yml collapse into one and
# the Dockerfile goes away.
name: Haku Sandbox Image (Nix)

on:
  push:
    branches: [devel]
    paths:
      - "cluster/k8s/haku/workspaces/image/**"
      - "flake.lock"
      - ".github/workflows/haku-sandbox-image-nix.yml"
  workflow_dispatch:

concurrency:
  group: haku-sandbox-image-nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-push:
    name: Build & push haku-sandbox (Nix)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: git.allegedly.works/ducktape-ci/haku-sandbox-image-nix
    steps:
      - uses: actions/checkout@v6

      # Attic trusted pubkeys (SSOT) — read with jq before Nix is installed,
      # since extra_nix_config below is a static field.
      - name: Load Attic trusted pubkeys
        id: attic_keys
        run: echo "value=$(jq -r 'join(" ")' nix/attic-pubkeys.json)" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes fetch-closure
            netrc-file = /home/runner/.config/nix/netrc
            extra-trusted-public-keys = ${{ steps.attic_keys.outputs.value }}
            extra-substituters = https://cache.allegedly.works/main
            fallback = true

      # Decrypts secrets/ci/* → exports ATTIC_TOKEN + FORGEJO_IMAGES_{USERNAME,PASSWORD}.
      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Write Nix netrc for cache.allegedly.works
        run: |
          mkdir -p /home/runner/.config/nix
          umask 077
          printf 'machine cache.allegedly.works password %s\n' "$ATTIC_TOKEN" \
            > /home/runner/.config/nix/netrc

      - name: Build image
        run: nix build .#haku-sandbox-image --print-build-logs

      - name: Compute tag
        id: meta
        run: |
          SHA="${{ github.sha }}"
          echo "pin_tag=${GITHUB_REF_NAME}-$(date -u +%Y%m%d%H%M%S)-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Unlike codex-pod-image.yml, this is NOT gated to devel-only. Nothing consumes
      # `haku-sandbox-image-nix` — no ImagePolicy, no SandboxTemplate — so a branch tag
      # cannot be auto-deployed, and being able to push one from a feature branch is what
      # lets the cutover checklist run *before* the image is merged rather than after.
      - name: Push to Forgejo
        if: github.ref_name == 'devel' || github.event_name == 'workflow_dispatch'
        run: |
          ref="$IMAGE:${{ steps.meta.outputs.pin_tag }}"
          skopeo copy --insecure-policy \
            --dest-creds "$FORGEJO_IMAGES_USERNAME:$FORGEJO_IMAGES_PASSWORD" \
            "docker-archive:$(readlink -f result)" "docker://$ref"
          echo "pushed \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
