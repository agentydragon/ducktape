# Build the Haku Managed Agents self-hosted worker image (Runtime B) with Nix
# and push it to GHCR.
#
# Unlike the Dockerfile images in container-images.yml (docker/build-push-action
# via the ghcr-build-push composite), this is a Nix flake output: an
# uncompressed full-NixOS rootfs tar (`.#haku-managed-agent-image`), so it is
# `podman import`-ed (which compresses the layer once) and pushed rather than
# buildx-built. Flux picks up the pushed `devel-<ts>-<sha7>` tag via
# the haku-managed-agent ImagePolicy (cluster/k8s/flux-image-automation-ghcr/).
name: haku-managed-agent image

on:
  push:
    branches: [devel]
    paths:
      - "haku/runtime/managed_agent/self_hosted/**"
      - "flake.nix"
      - "nix/packages/anthropic-cli.nix"
      - "nix/packages/fastmcp.nix"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/haku-managed-agent-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push haku-managed-agent
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/haku-managed-agent
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nix-attic
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Build image
        run: nix build .#haku-managed-agent-image --print-build-logs

      - name: Compute tag
        id: meta
        run: |
          SHA="${{ github.sha }}"
          echo "pin_tag=${GITHUB_REF_NAME}-$(date -u +%Y%m%d%H%M%S)-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Gate the push to devel so feature branches don't publish tags the Flux
      # ImagePolicy would immediately deploy (matches push-images.yml).
      - name: Import + push to GHCR
        if: github.ref_name == 'devel'
        run: |
          echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          # NixOS system.build.tarball is a flat rootfs tar (not an OCI
          # archive): import it, baking the systemd init as CMD, then push.
          ref="$IMAGE:${{ steps.meta.outputs.pin_tag }}"
          podman import --change 'CMD ["/init"]' result/tarball/*.tar "$ref"
          podman push "$ref"
          echo "pushed \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
