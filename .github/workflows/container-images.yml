# Build and push standalone container images in parallel, then pin digests atomically.
# Most images still target GHCR; RTL-TCP targets the private Forgejo registry.
#
# Images:
#   buildbuddy-remote-runner    — the `bb remote` runner: RBE container image base + the Nix devtools
#                   (devinfra/buildbuddy_remote_runner/Dockerfile). Pinned in devinfra/bbr.json.
#   freecad-test  — FreeCAD test runner (skills/freecad/Dockerfile.test)
#   rtl-tcp       — RTL-SDR Blog V4 rtl_tcp server (x/rtl_tcp/Dockerfile); Flux ImagePolicy,
#                   no digest pin needed. Uses rtl-sdr-blog fork for V4 R828D support.
#
# (cpap-sync is built via Bazel — see //cpap:image and the
# push-images.yml matrix. The RBE container image is rbe-container-image.yml, kept
# separate so its trigger can stay narrow — that image's digest is in every
# Bazel action's cache key.)
#
# Independent of CI — bazel-ci uses the pinned images from image_pins.json.
name: Container Images

on:
  push:
    branches: [main, devel]
    # buildbuddy-remote-runner's Dockerfile COPYs flake.nix + nix/flake/** + nix/packages/**
    # + artifact/gaffer pins and Attic's public key, then runs
    # `nix build .#rbetools`, so the image depends on those inputs. Missing
    # them here means a Nix tooling change
    # (e.g. #2706 adding bazel-diff) doesn't rebuild the image and
    # image_pins.json falls out of date; the next `bazel-ci` run silently uses
    # the old runner.
    #
    # devinfra/image_pins.json is here for the rbe_container pin only: the runner
    # is FROM that digest, so an RBE container repin must cascade into a remote runner rebuild.
    # Every pin commit except rbe-container-image.yml's carries `[skip ci]`, which
    # is what stops that cascade from looping.
    paths:
      - "devinfra/buildbuddy_remote_runner/Dockerfile"
      - "devinfra/image_pins.json"
      - "flake.nix"
      - "flake.lock"
      - "nix/packages/**"
      - "nix/flake/**"
      - "nix/artifact-pins.json"
      - "nix/attic-pubkeys.json"
      - "nix/gaffer-pins.json"
      - "skills/skills_registry.json"
      - "skills/freecad/Dockerfile.test"
      - "x/rtl_tcp/Dockerfile"
      - "loom/gym/sandbox/**"
      - ".github/workflows/container-images.yml"
  # Build the real runner Dockerfile before merge, but do not log in, tag, push,
  # publish cache entries, or update the pinned image digest.
  pull_request:
    paths:
      - "devinfra/buildbuddy_remote_runner/Dockerfile"
      - "devinfra/image_pins.json"
      - "flake.nix"
      - "flake.lock"
      - "nix/packages/**"
      - "nix/flake/**"
      - "nix/artifact-pins.json"
      - "nix/attic-pubkeys.json"
      - "nix/gaffer-pins.json"
      - "skills/skills_registry.json"
      - ".github/workflows/container-images.yml"
  workflow_dispatch:

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  RUNNER_IMAGE: ghcr.io/${{ github.repository_owner }}/buildbuddy-remote-runner
  FREECAD_IMAGE: ghcr.io/${{ github.repository_owner }}/freecad-test

jobs:
  buildbuddy-remote-runner-pr:
    name: BuildBuddy Remote Runner (build only)
    if: github.event_name == 'pull_request'
    # Read-only, and read-only is new here: the runner is FROM the RBE container image
    # package, which is private, so an anonymous pull 404s. The rest of the
    # deliberate no-credentials posture stands — no tag, no push, no cache
    # publish, no repin.
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    # A cold Nix closure plus Docker layer export can exceed the default on
    # hosted runners; the build is still making progress when 15 minutes ends.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v4

      - id: base
        run: |
          python3 -c "import json; p=json.load(open('devinfra/image_pins.json'))['rbe_container']; print('ref=' + p['image'] + '@' + p['digest'])" >> "$GITHUB_OUTPUT"

      # With no output or tags, Buildx evaluates the complete Dockerfile and
      # leaves the result only in its ephemeral build cache.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: devinfra/buildbuddy_remote_runner/Dockerfile
          build-args: BASE_REF=${{ steps.base.outputs.ref }}
          push: false
          cache-from: type=registry,ref=${{ env.RUNNER_IMAGE }}:buildcache

  buildbuddy-remote-runner:
    name: BuildBuddy Remote Runner
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Keep the production path consistent with the pull-request build above:
    # cold-cache Nix evaluation and image export can take over 15 minutes.
    timeout-minutes: 30
    outputs:
      pin_tag: ${{ steps.build.outputs.pin_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - id: base
        run: |
          python3 -c "import json; p=json.load(open('devinfra/image_pins.json'))['rbe_container']; print('ref=' + p['image'] + '@' + p['digest'])" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/ghcr-build-push
        id: build
        with:
          image: ${{ env.RUNNER_IMAGE }}
          context: .
          file: devinfra/buildbuddy_remote_runner/Dockerfile
          build_args: BASE_REF=${{ steps.base.outputs.ref }}
          cache_from: type=registry,ref=${{ env.RUNNER_IMAGE }}:buildcache
          cache_to: type=registry,ref=${{ env.RUNNER_IMAGE }}:buildcache,mode=max

  freecad-image:
    name: FreeCAD Test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pin_tag: ${{ steps.build.outputs.pin_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/ghcr-build-push
        id: build
        with:
          image: ${{ env.FREECAD_IMAGE }}
          context: skills/freecad
          file: skills/freecad/Dockerfile.test
          cache_from: type=registry,ref=${{ env.FREECAD_IMAGE }}:buildcache
          cache_to: type=registry,ref=${{ env.FREECAD_IMAGE }}:buildcache,mode=max

  rtl-tcp-image:
    name: RTL-TCP
    # Only push from devel — Flux ImagePolicy filters on devel-* tags.
    if: github.ref_name == 'devel'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Login to Forgejo registry
        run: echo "$FORGEJO_IMAGES_PASSWORD" | docker login git.allegedly.works -u "$FORGEJO_IMAGES_USERNAME" --password-stdin

      - name: Build and push
        env:
          IMAGE: git.allegedly.works/ducktape-ci/rtl-tcp
        run: |
          set -euo pipefail
          ts="$(date -u +%Y%m%d%H%M%S)"
          pin_tag="${GITHUB_REF_NAME}-${ts}-${GITHUB_SHA:0:7}"
          docker buildx build \
            --push \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:$pin_tag" \
            --tag "$IMAGE:latest" \
            x/rtl_tcp

  loom-gym-sandbox:
    name: Loom Gym Sandbox
    # The forecasting-eval agent environment (interactive python3 + sci toolkit).
    # A Dockerfile rather than an oci_image because the agent shells into a general
    # python env, not a single py_binary. The in-cluster eval Job pulls this from
    # GHCR and tags it loom-gym-sandbox:latest into the docker-ci daemon.
    if: github.ref_name == 'devel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/ghcr-build-push
        with:
          image: ghcr.io/${{ github.repository_owner }}/loom-gym-sandbox
          context: loom/gym/sandbox

  # `pin-digests` pushes via the ducktape-automation GitHub App so the commit
  # bypasses the main-protection ruleset (github-actions can't bypass on
  # personal-account repos). The GHCR docker login below stays on github.token
  # — registry auth is unaffected by branch protection.
  pin-digests:
    name: Pin Digests
    needs: [buildbuddy-remote-runner, freecad-image]
    if: always() && !cancelled() && (needs.buildbuddy-remote-runner.result == 'success' || needs.freecad-image.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/mint-automation-token
        id: app
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: prettier

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # --image re-homes the pin the first time a purpose-built runner is
      # published: the entry is seeded against ghcr.io/…/bbr-runner, because a
      # digest reference is scoped to the registry repo holding the manifest.
      - name: Pin buildbuddy_remote_runner
        if: needs.buildbuddy-remote-runner.result == 'success'
        run: |
          DIGEST=$(docker manifest inspect "$RUNNER_IMAGE:${{ needs.buildbuddy-remote-runner.outputs.pin_tag }}" --verbose | \
            python3 -c "import json,sys; d=json.load(sys.stdin); d=d[0] if isinstance(d,list) else d; print(d['Descriptor']['digest'])")
          python3 devinfra/update_image_pin.py buildbuddy_remote_runner --digest "$DIGEST" --image "$RUNNER_IMAGE"

      - name: Pin freecad_test
        if: needs.freecad-image.result == 'success'
        run: |
          DIGEST=$(docker manifest inspect "$FREECAD_IMAGE:${{ needs.freecad-image.outputs.pin_tag }}" --verbose | \
            python3 -c "import json,sys; d=json.load(sys.stdin); d=d[0] if isinstance(d,list) else d; print(d['Descriptor']['digest'])")
          python3 devinfra/update_image_pin.py freecad_test --digest "$DIGEST"

      - name: Commit and push
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app_slug }}
          APP_USER_ID: ${{ steps.app.outputs.user_id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git add devinfra/image_pins.json devinfra/bbr.json

          if git diff --cached --quiet; then
            echo "Image pins already up to date"
            exit 0
          fi

          MSG="chore: pin"
          if [[ "${{ needs.buildbuddy-remote-runner.result }}" == "success" ]]; then
            MSG="$MSG buildbuddy_remote_runner"
          fi
          if [[ "${{ needs.freecad-image.result }}" == "success" ]]; then
            MSG="$MSG freecad_test"
          fi
          MSG="$MSG image digest(s) [skip ci]"

          git commit -m "$MSG"

          BRANCH="${GITHUB_REF_NAME}"
          if ! git pull --rebase origin "$BRANCH"; then
            echo "::error::Rebase failed"
            git status
            exit 1
          fi

          # Push as the ducktape-automation App via URL-embedded HTTP Basic
          # auth — see the corresponding comment in sync-pins.yml for why the
          # extraheader-replacement approach didn't work.
          set +x
          for key in $(git config --local --name-only --get-regexp '^includeif\.gitdir:.*\.path$' || true); do
            git config --local --unset-all "$key"
          done
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
