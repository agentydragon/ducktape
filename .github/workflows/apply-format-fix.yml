name: Apply owned format fix

on:
  push:
    branches:
      - haku-console/deny-agent-copilot-tools

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('haku/console/mcp/server.py')
          text = path.read_text()
          old = '''    tools = [
        exposed(tool)
        for tool in metadata.state.tools
        if not _is_agent_tool_blocked(server, actor, tool.name)
    ]'''
          new = '    tools = [exposed(tool) for tool in metadata.state.tools if not _is_agent_tool_blocked(server, actor, tool.name)]'
          if old not in text:
              raise SystemExit('missing server format anchor')
          path.write_text(text.replace(old, new, 1))
          path = Path('haku/console/mcp/test_server.py')
          text = path.read_text()
          old = '''            actor=agent,
        )


if __name__ == "__main__":'''
          new = '''            actor=agent,
        )

if __name__ == "__main__":'''
          if old not in text:
              raise SystemExit('missing test format anchor')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/apply-format-fix.yml
          git diff --check
          git config user.name 'haku-console-agent'
          git config user.email 'haku-console-agent@users.noreply.github.com'
          git add -A
          git commit -m 'haku-console: apply ruff formatting'
          git push
