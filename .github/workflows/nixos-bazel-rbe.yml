name: Bazel execution contract

# The smoke workspace has its own MODULE.bazel and assembles its .bazelrc from
# devinfra/bazel/rbe.bazelrc; the root .bazelrc and MODULE.bazel do not configure it.
on:
  pull_request:
    paths:
      # keep-sorted start
      - ".github/actions/setup-bazel/action.yml"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/nixos-bazel-rbe.yml"
      - "devinfra/bazel/**"
      - "devinfra/buildbuddy/setup.sh"
      - "devinfra/nixos_bazel_test/**"
      - "flake.lock"
      - "flake.nix"
      - "nix/attic-pubkeys.json"
      - "nix/flake/packages.nix"
      - "nix/nixos/modules/bazel/**"
      # keep-sorted end
  push:
    branches: [devel]
    paths:
      # keep-sorted start
      - ".github/actions/setup-bazel/action.yml"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/nixos-bazel-rbe.yml"
      - "devinfra/bazel/**"
      - "devinfra/buildbuddy/setup.sh"
      - "devinfra/nixos_bazel_test/**"
      - "flake.lock"
      - "flake.nix"
      - "nix/attic-pubkeys.json"
      - "nix/flake/packages.nix"
      - "nix/nixos/modules/bazel/**"
      # keep-sorted end
  workflow_dispatch:

concurrency:
  # New PR heads supersede old runs; keep push and manual runs independent.
  group: bazel-contract-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    name: FHS and NixOS clients to BuildBuddy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix-attic
        with:
          attic_token: ${{ secrets.ATTIC_READ_TOKEN }}

      # Run first to verify independence from host Bazel setup: the NixOS image
      # supplies Bazelisk, and run.sh mounts credentials separately.
      - name: Run NixOS Bazel RBE integration test
        run: devinfra/nixos_bazel_test/run.sh test

      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Run FHS Bazel execution-contract test
        env:
          CLIENT_NAME: FHS
          SOURCE_WORKSPACE: ${{ github.workspace }}/devinfra/nixos_bazel_test/testdata/workspace
          RBE_BAZELRC: ${{ github.workspace }}/devinfra/bazel/rbe.bazelrc
          WORKSPACE: ${{ runner.temp }}/bazel-execution-contract
          EXECUTION_LOG_DIR: ${{ runner.temp }}
        run: |
          # setup-bazel wrote the BuildBuddy credential here; import it explicitly
          # since the smoke test runs bazel with --nohome_rc.
          export CREDENTIAL_RC="$HOME/.config/bazel/buildbuddy.bazelrc"
          bash devinfra/nixos_bazel_test/smoke_test.sh
