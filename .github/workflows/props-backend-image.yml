# Build and push the props-backend container image to Harbor.
#
# Uses Bazel to build the OCI image (includes frontend + Python deps),
# loads it into Docker, then pushes to registry.allegedly.works.
#
# Triggers:
#   - workflow_call (from ci.yml): tags :<sha> + :<timestamp>-<sha7>
#   - workflow_dispatch: same tags + :latest
#
# After push, Harbor notifies the Flux webhook receiver which triggers an
# immediate ImageRepository rescan (instead of waiting for the 5m poll).
name: Props Backend Image

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
      HARBOR_ROBOT_USERNAME:
        required: true
      HARBOR_ROBOT_TOKEN:
        required: true

concurrency:
  # Use hardcoded name to avoid deadlock when called via workflow_call
  # (${{ github.workflow }} resolves to caller's name, colliding with CI's group)
  group: props-backend-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: registry.allegedly.works/props/props-backend

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}
          rbe_image: ${{ inputs.rbe_image }}

      - name: Build and load image
        run: bazel run //props/backend:load

      - name: Compute image tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          # Timestamp prefix makes tags sortable for Flux ImagePolicy (alphabetical order)
          TS="$(date -u +%Y%m%d%H%M%S)"
          SEMVER_TAG="${TS}-${SHA:0:7}"
          TAGS="${{ env.IMAGE }}:$SHA,${{ env.IMAGE }}:$SEMVER_TAG"
          if [[ "${{ github.event_name }}" != "workflow_call" ]]; then
            TAGS="$TAGS,${{ env.IMAGE }}:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "semver_tag=$SEMVER_TAG" >> $GITHUB_OUTPUT

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.allegedly.works
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Tag and push
        run: |
          IFS=',' read -ra TAG_LIST <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAG_LIST[@]}"; do
            docker tag props-backend:latest "$tag"
            docker push --quiet "$tag"
          done
