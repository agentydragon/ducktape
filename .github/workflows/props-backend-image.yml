# Build and push the props-backend container image to Harbor.
#
# Uses Bazel to build the OCI image (includes frontend + Python deps),
# loads it into Docker, then pushes to registry.allegedly.works.
#
# Triggers:
#   - workflow_call (from ci.yml): tags :<sha> + :devel-YYYY-MM-DDTHHMMSSZ-<sha7>
#   - workflow_dispatch: same tags + :latest
#
# After push, Harbor notifies the Flux webhook receiver which triggers an
# immediate ImageRepository rescan (instead of waiting for the 5m poll).
name: Props Backend Image

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
      HARBOR_ROBOT_USERNAME:
        required: true
      HARBOR_ROBOT_TOKEN:
        required: true

concurrency:
  # Use hardcoded name to avoid deadlock when called via workflow_call
  # (${{ github.workflow }} resolves to caller's name, colliding with CI's group)
  group: props-backend-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: registry.allegedly.works/props/props-backend

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}
          rbe_image: ${{ inputs.rbe_image }}

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.allegedly.works
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Build and load image
        run: bazel run //props/backend:load

      - name: Tag and push (if changed)
        env:
          SHA: ${{ github.sha }}
        run: |
          # Skip push on pull requests — image was built for validation only.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR build — skipping push"
            exit 0
          fi

          # Backend image is stamp-free: same sources → same image ID across commits.
          # Compare local image ID against remote config digest and skip when unchanged.
          local_id=$(docker inspect --format='{{.Id}}' props-backend:latest)
          remote_digest=$(docker manifest inspect "${{ env.IMAGE }}:latest" 2>/dev/null \
            | jq -r '.config.digest // empty' 2>/dev/null || true)

          if [[ -n "$remote_digest" && "$local_id" == "$remote_digest" ]]; then
            echo "props-backend: unchanged (local=$local_id, remote=$remote_digest), skipping push"
            exit 0
          fi

          echo "props-backend: changed (local=$local_id, remote=${remote_digest:-<none>}), pushing"

          # Timestamp prefix makes tags sortable for Flux ImagePolicy (alphabetical order).
          # Format: devel-YYYY-MM-DDTHHMMSSZ-sha7 (ISO 8601 date; colons omitted from time
          # because Docker tag syntax forbids them)
          TS="$(date -u +%Y-%m-%dT%H%M%SZ)"
          SEMVER_TAG="devel-${TS}-${SHA:0:7}"
          TAGS="${{ env.IMAGE }}:$SHA,${{ env.IMAGE }}:$SEMVER_TAG"
          if [[ "${{ github.event_name }}" != "workflow_call" ]]; then
            TAGS="$TAGS,${{ env.IMAGE }}:latest"
          fi

          IFS=',' read -ra TAG_LIST <<< "$TAGS"
          for tag in "${TAG_LIST[@]}"; do
            docker tag props-backend:latest "$tag"
            docker push --quiet "$tag"
          done
