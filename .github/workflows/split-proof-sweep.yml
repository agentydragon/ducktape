name: Split proof library sweeps
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        bundle: [acorn, acorn_min, lodash, semver, zod, zod_min]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix-devtools
        with:
          installables: ".#bb"
      - uses: ./.github/actions/bb-remote
        with:
          args: >-
            test //devinfra/js/debundle/x/split_proof/experiments/splits:real_split_${{ matrix.bundle }}_test
            --test_tag_filters= --test_timeout=3600 --nocache_test_results --test_output=errors
