# Gazelle drift check: Python BUILD files are gazelle-managed (README §Gazelle),
# so a run over a converged tree is a no-op and any diff or unresolvable import
# here means the PR hand-edited managed rules or skipped the gazelle run.
#
# Transitional duplicate of the pre-commit Gazelle hook. Keep this check until
# tf/gitops/github-branch-protection has reconciled removal of the standalone
# required-check entry; then remove this workflow.
name: Gazelle diff
"on":
  pull_request: {}
  push:
    branches: [devel]
  workflow_dispatch: {}
concurrency:
  group: gazelle-diff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gazelle-diff:
    name: Gazelle diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install pinned gazelle
        run: nix profile install .#gazelle

      - name: Gazelle --mode=diff
        run: |
          if ! gazelle --mode=diff; then
            echo "::error::BUILD files drifted from gazelle; run: gazelle (devshell) or bb run //devinfra:gazelle"
            exit 1
          fi
