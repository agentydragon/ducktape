# Gazelle drift check: Python BUILD files are gazelle-managed (README §Gazelle),
# so a run over a converged tree is a no-op and any diff or unresolvable import
# here means the PR hand-edited managed rules or skipped the gazelle run.
#
# Deliberately its own workflow on a plain runner: the released gazelle binary
# (devinfra/ci/artifact_targets.json → nix/artifact-pins.json) needs only the
# checkout and the checked-in manifest — no Bazel, no BuildBuddy — and a red
# drift check neither blocks nor delays bazel-ci.
name: Gazelle diff
"on":
  pull_request: {}
  push:
    branches: [devel]
  workflow_dispatch: {}
concurrency:
  group: gazelle-diff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gazelle-diff:
    name: Gazelle diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Depth 2 so the synthetic merge's base parent is available for the
          # stale-binary guard's PR delta (see gazelle_diff_check.py).
          fetch-depth: 2

      - name: Fetch pinned gazelle binary
        id: fetch
        run: python3 devinfra/ci/gazelle_diff_check.py

      - name: Gazelle --mode=diff
        if: steps.fetch.outputs.skip == ''
        run: |
          if ! /tmp/gazelle --mode=diff; then
            echo "::error::BUILD files drifted from gazelle; run: bb run //devinfra:gazelle"
            exit 1
          fi
