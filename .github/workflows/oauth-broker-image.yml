# Build and push the OAuth broker container image to Harbor.
#
# Triggers:
#   - workflow_call (from ci.yml)
#   - workflow_dispatch: manual push
name: OAuth Broker Image

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
      HARBOR_ROBOT_USERNAME:
        required: true
      HARBOR_ROBOT_TOKEN:
        required: true

concurrency:
  group: oauth-broker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}
          rbe_image: ${{ inputs.rbe_image }}

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.allegedly.works
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Build and push
        run: |
          .github/scripts/harbor_push.sh \
            //oauth_broker:load \
            oauth-broker:latest \
            registry.allegedly.works/oauth-broker/oauth-broker
