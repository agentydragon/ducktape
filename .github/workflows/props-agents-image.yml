# Build and push all props agent container images to the props registry.
#
# Uses Bazel to build each OCI image, loads into Docker, then pushes to the
# user-configured props registry (not GHCR).
#
# Required GitHub secrets:
#   PROPS_REGISTRY_URL      - Registry host, e.g. "props.example.com:8000"
#   PROPS_REGISTRY_USERNAME - Registry username (PostgreSQL role)
#   PROPS_REGISTRY_PASSWORD - Registry password
#
# Agent images pushed:
#   critic:latest, critic:{sha}
#   critic:{variant}, critic:{variant}-{sha}  (5 variants)
#   grader:latest, grader:{sha}
#   critic_dev_improve:latest, critic_dev_improve:{sha}
#   critic_dev_optimize:latest, critic_dev_optimize:{sha}
#
# Skip logic: agent images are stamp-free (no //tools:build_info dep), so the
# Docker image ID (sha256 of the image config) is a stable content fingerprint.
# push_if_changed compares the local image ID against the remote config digest
# and skips the push when they match.
#
# Triggers:
#   - workflow_call (from ci.yml): always (digest comparison handles skip)
#   - workflow_dispatch: manual push of all agents
name: Props Agent Images

on:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key for remote cache (optional)"
        required: false
      PROPS_REGISTRY_URL:
        description: "Props registry host (e.g. props.example.com:8000)"
        required: true
      PROPS_REGISTRY_USERNAME:
        description: "Props registry username"
        required: true
      PROPS_REGISTRY_PASSWORD:
        description: "Props registry password"
        required: true
  workflow_dispatch:

concurrency:
  # Hardcoded name avoids deadlock when called via workflow_call
  # (${{ github.workflow }} resolves to caller's name)
  group: props-agents-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}
          rbe_image: ${{ inputs.rbe_image }}

      - name: Login to Props Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.PROPS_REGISTRY_URL }}
          username: ${{ secrets.PROPS_REGISTRY_USERNAME }}
          password: ${{ secrets.PROPS_REGISTRY_PASSWORD }}

      - name: Build and load images
        run: |
          bazel run //props/agents/critic:load
          bazel run //props/agents/grader:load
          bazel run //props/agents/critic_dev/improve:load
          bazel run //props/agents/critic_dev/optimize:load
          bazel run //props/agents/critic/variants:contract_truthfulness_load
          bazel run //props/agents/critic/variants:dead_code_load
          bazel run //props/agents/critic/variants:flag_propagation_load
          bazel run //props/agents/critic/variants:high_recall_load
          bazel run //props/agents/critic/variants:verbose_docs_load

      - name: Tag and push images
        env:
          REGISTRY: ${{ secrets.PROPS_REGISTRY_URL }}
          SHA: ${{ github.sha }}
        run: |
          # Skip push on pull requests — images were built for validation only.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR build — skipping push"
            exit 0
          fi

          # Agent images are stamp-free: same sources → same image ID across commits.
          # Skip pushing when the local image ID matches the remote config digest.
          push_if_changed() {
            local local_tag="$1" remote_repo="$2"
            shift 2
            local remote_tags=("$@")

            local local_id remote_digest
            local_id=$(docker inspect --format='{{.Id}}' "$local_tag")
            remote_digest=$(docker manifest inspect "$REGISTRY/$remote_repo:latest" 2>/dev/null \
              | jq -r '.config.digest // empty' 2>/dev/null || true)

            if [[ -n "$remote_digest" && "$local_id" == "$remote_digest" ]]; then
              echo "$remote_repo: unchanged, skipping push"
              return
            fi

            for tag in "${remote_tags[@]}"; do
              docker tag "$local_tag" "$REGISTRY/$remote_repo:$tag"
              docker push --quiet "$REGISTRY/$remote_repo:$tag"
            done
          }

          push_if_changed critic:latest critic latest "$SHA"
          push_if_changed grader:latest grader latest "$SHA"
          push_if_changed critic_dev_improve:latest critic_dev_improve latest "$SHA"
          push_if_changed critic_dev_optimize:latest critic_dev_optimize latest "$SHA"

          for variant in contract_truthfulness dead_code flag_propagation high_recall verbose_docs; do
            push_if_changed "critic:$variant" critic "$variant" "${variant}-${SHA}"
          done
