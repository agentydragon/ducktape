# Rebuild ducktape's own pinned artifacts (Python wheels + aiquota's GNOME
# Shell extension zip) from PR source and run each nix package's importsCheck
# against them. DUCKTAPE_ARTIFACT_OVERRIDES (see flake.nix) swaps the released
# pin for the freshly-Bazel-built artifact so nix's `mkWheel` imports check
# runs against PR source — catches "wheel forgot a package" bugs like the
# gmail_api / ducktape_pkg drift in #2669 at PR time, before release.yml
# publishes a broken artifact and sync-pins.yml rotates the pin onto it.
#
# nix-attic-push.yml still does the full-fleet build against pinned artifacts on
# push to devel/main; this workflow is the fast per-PR gate.
#
# Source of truth for pin → Bazel target + output: devinfra/ci/artifact_targets.json.
# Keep it in sync with the artifact entries in release.yml's matrix (SYNC
# comment there points here).
name: Nix wheel check

on:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy remote execution and cache credential"
        required: true
    inputs:
      environment:
        description: "Protected GitHub Environment to gate this job (optional)"
        required: false
        type: string
        default: ""
      source_commit:
        description: "Exact commit to check out and build (defaults to github.sha)"
        required: false
        type: string
        default: ""
      source_ref:
        description: "Ref to resolve after the caller's trust decision instead of trusting an event-time commit SHA"
        required: false
        type: string
        default: ""
      pr_head_sha:
        description: "Expected PR head parent when source_commit is a synthetic merge"
        required: false
        type: string
        default: ""
      allow_unsafe_pr_checkout:
        description: "Opt in to checkout's pull_request_target fork checkout after the caller establishes trust"
        required: false
        type: boolean
        default: false
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nix-wheel-check-${{ inputs.pr_head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_REPO_DEFAULT_BRANCH: devel

jobs:
  nix-wheel-check:
    name: Build artifacts + imports check
    # Fork revisions are checked by trusted-fork-pr-ci.yml after its caller
    # either recognizes the dedicated agent fork or gates the exact head.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ${{ inputs.environment || null }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || inputs.source_commit || github.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: ${{ inputs.allow_unsafe_pr_checkout }}

      - name: Resolve and verify source revision
        id: source
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.pr_head_sha }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          resolved_sha=$(git rev-parse HEAD)
          if [[ -z "$SOURCE_REF" ]]; then
            expected_sha="${SOURCE_COMMIT:-$GITHUB_SHA}"
            if [[ "$resolved_sha" != "$expected_sha" ]]; then
              echo "::error::checked out $resolved_sha, expected $expected_sha"
              exit 1
            fi
          fi
          if [[ -n "$EXPECTED_HEAD_SHA" ]]; then
            actual_head=$(git rev-parse HEAD^2)
            if [[ "$actual_head" != "$EXPECTED_HEAD_SHA" ]]; then
              echo "::error::merge head $actual_head, expected trusted PR head $EXPECTED_HEAD_SHA"
              exit 1
            fi
          fi
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved source revision: $resolved_sha"

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - name: Check generated command policies
        run: |
          nix build --no-link --print-out-paths \
            .#checks.x86_64-linux.claude-code-permissions \
            .#checks.x86_64-linux.codex-execpolicy-evaluation \
            .#checks.x86_64-linux.gemini-cli-integration

      # Derive the Bazel target list + nix package list from the SSOT.
      # A release is in-gate when its `nixPackage: true`; every pin in an
      # in-gate release gets its target built and its output overridden.
      # Non-wheel binaries (bbapi, claude-hook-rs, debundle, skills) go
      # through mkBinaryArtifact whose nix build is a trivial install/
      # autoPatchelfHook — bazel-ci already rebuilds them, so the PR gate
      # skips them to keep wall-time bounded.
      - name: Compute build inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          spec=devinfra/ci/artifact_targets.json
          bazel_targets=$(jq -r '
            . as $doc |
            [$doc.pins | to_entries[] |
               select($doc.releases[.value.release].nixPackage) |
               .value.target] | join(" ")
          ' "$spec")
          nix_pkgs=$(jq -r '
            [.releases | to_entries[] |
               select(.value.nixPackage) |
               ".#packages.x86_64-linux.\(.key)"] | join(" ")
          ' "$spec")
          echo "bazel_targets=$bazel_targets" >> "$GITHUB_OUTPUT"
          echo "nix_pkgs=$nix_pkgs" >> "$GITHUB_OUTPUT"

      # Every one of these artifacts must come back, because "Assemble artifact
      # overrides" below exits 1 on a missing file — this gate fails closed. It
      # relies on `bb remote build`'s post-run download, which returns an
      # arbitrary subset for a large enough request: measured on devel, 50 targets
      # yielded 12 files while these 8 yielded 8. So it is sound at this size and
      # degrades as more releases gain `nixPackage`. If it starts flaking on
      # "missing artifact for pin", read the outputs from the build event stream
      # instead (devinfra/ci/bes.py) rather than raising a retry count.
      #
      # run_from_commit: actions/checkout in PR mode doesn't fetch a local
      # `devel` ref, so bb remote's default base-branch patch sync fails with
      # `git rev-parse devel: exit status 128`. On pull_request events,
      # github.sha is the synthetic merge commit, keeping the remote build on
      # the same base+PR tree as the GitHub runner. Same rationale as
      # bazel-ci.yml.
      - name: Build artifacts from source
        uses: ./.github/actions/bb-remote
        with:
          args: build ${{ steps.inputs.outputs.bazel_targets }}
          run_from_commit: ${{ steps.source.outputs.sha }}

      # Emit the JSON blob flake.nix's artifacts logic consumes. Every pin
      # in an in-gate release gets an override entry (so aiquota's wheel
      # AND its extension zip both land as overrides). Verifying every
      # expected output exists surfaces build/output-path drift with a
      # clear error before nix reads a missing file.
      - name: Assemble artifact overrides
        id: overrides
        shell: bash
        run: |
          set -euo pipefail
          json='{}'
          while IFS=$'\t' read -r pin rel; do
            if [[ ! -f "$rel" ]]; then
              echo "::error::missing artifact for pin '$pin' at $rel"
              exit 1
            fi
            abs=$(readlink -f "$rel")
            json=$(jq -c --arg k "$pin" --arg v "$abs" '. + {($k): $v}' <<<"$json")
          done < <(jq -r '
            . as $doc |
            $doc.pins | to_entries[] |
            select($doc.releases[.value.release].nixPackage) |
            "\(.key)\t\(.value.output)"
          ' devinfra/ci/artifact_targets.json)
          {
            echo 'overrides<<EOF'
            echo "$json"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Drives each mkWheel's `importsCheck` (nix/packages/default.nix) against
      # the PR-source artifact. --impure is required for the getEnv override read.
      - name: Nix build + imports check
        env:
          DUCKTAPE_ARTIFACT_OVERRIDES: ${{ steps.overrides.outputs.overrides }}
        run: nix build --impure --no-link --print-out-paths ${{ steps.inputs.outputs.nix_pkgs }}
