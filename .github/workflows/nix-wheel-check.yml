# Rebuild ducktape's own pinned artifacts (Python wheels + GNOME Shell
# extension archives) from PR source and run each nix package's check
# against them. DUCKTAPE_ARTIFACT_OVERRIDES (see flake.nix) swaps the released
# pin for the freshly-Bazel-built artifact so nix's `mkWheel` imports check
# runs against PR source — catches "wheel forgot a package" bugs like the
# missing Gmail modules in #2669 at PR time, before release.yml
# publishes a broken artifact and sync-pins.yml rotates the pin onto it.
#
# nix-attic-push.yml still does the full-fleet build against pinned artifacts on
# push to devel/main; this workflow is the fast per-PR gate.
#
# Source of truth for pin → Bazel target + asset filename: devinfra/ci/artifact_targets.json.
# Keep it in sync with the artifact entries in release.yml's matrix (SYNC
# comment there points here).
name: Nix wheel check

on:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy remote execution and cache credential"
        required: true
      ATTIC_TOKEN:
        description: "Attic CI token for private cache access and permitted uploads"
        required: true
    inputs:
      environment:
        description: "Protected GitHub Environment to gate this job (optional)"
        required: false
        type: string
        default: ""
      source_commit:
        description: "Exact commit to check out and build (defaults to github.sha)"
        required: false
        type: string
        default: ""
      pr_head_sha:
        description: "Expected PR head parent when source_commit is a synthetic merge"
        required: false
        type: string
        default: ""
      allow_unsafe_pr_checkout:
        description: "Opt in to checkout's pull_request_target fork checkout after the caller establishes trust"
        required: false
        type: boolean
        default: false
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep PR identity stable across revisions. Separate fork event types so the
  # skipped pull_request job cannot cancel its trusted pull_request_target run.
  group: nix-wheel-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Mainline runs publish source-check markers to Attic: let the active run
  # finish, retaining only the newest pending revision during merge bursts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.pr_head_sha != '' }}
  queue: single

permissions:
  contents: read
  pull-requests: read

env:
  GIT_REPO_DEFAULT_BRANCH: devel

jobs:
  nix-wheel-check:
    name: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          'Fork Nix check runs in trusted-fork-pr-ci' ||
          'Build artifacts + imports check' }}
    # Fork revisions are checked by trusted-fork-pr-ci.yml after its caller
    # either recognizes the dedicated agent fork or gates the exact head.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ${{ inputs.environment || null }}
    runs-on: ubuntu-latest
    # A warm run takes ~2 min. After a flake update nothing in the overridden
    # Python set (nix/packages/default.nix) is cached, and the first run
    # rebuilds it from source in ~40 min.
    timeout-minutes: 90
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        name: "Check out source (a failure here means the source was unavailable; no tests or build ran)"
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          # verify-source reads both parents of the synthetic PR merge commit.
          fetch-depth: 2
          allow-unsafe-pr-checkout: ${{ inputs.allow_unsafe_pr_checkout }}

      - name: Resolve and verify source revision
        id: source
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.pr_head_sha || github.event.pull_request.head.sha }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: python3 devinfra/ci/pr_mergeability.py verify-source

      # setup-nix-attic (not setup-nix-devtools) so the checks below can substitute
      # from cache.allegedly.works/main instead of building from source. Packages
      # pinned to nixpkgs-master (e.g. codex, see nix/home/codex/default.nix) have
      # no cache.nixos.org binary — only Hydra-built release channels get one — so
      # without the Attic substituter this job source-builds codex's whole Rust
      # toolchain on every run and blows the timeout (#5749).
      - uses: ./.github/actions/setup-nix-attic
        with:
          attic_token: ${{ secrets.ATTIC_TOKEN }}

      # The remote build only needs bb; use the same pin and checksum as Bazel CI.
      - name: Install pinned BuildBuddy CLI
        run: |
          python3 devinfra/buildbuddy/ci/install_bb.py --pins nix/artifact-pins.json \
            --destination "$RUNNER_TEMP/buildbuddy-cli/bin/bb"
          echo "$RUNNER_TEMP/buildbuddy-cli/bin" >> "$GITHUB_PATH"

      # Derive the Bazel target list + nix package list from the SSOT.
      # A release is in-gate when its `nixPackage: true`; every pin in an
      # in-gate release gets its target built and its output overridden.
      # Non-wheel binaries (bbapi, claude-hook, debundle, skills) go
      # through mkBinaryArtifact whose nix build is a trivial install/
      # autoPatchelfHook — bazel-ci already rebuilds them, so the PR gate
      # skips them to keep wall-time bounded.
      - name: Compute build inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          spec=devinfra/ci/artifact_targets.json
          bazel_targets=$(jq -r '
            . as $doc |
            [$doc.pins | to_entries[] |
               select($doc.releases[.value.release].nixPackage) |
               .value.target] | join(" ")
          ' "$spec")
          nix_checks=$(jq -r '
            [.releases | to_entries[] |
               select(.value.nixPackage) |
               ".#checks.x86_64-linux.artifact-\(.key)"] | join(" ")
          ' "$spec")
          echo "bazel_targets=$bazel_targets" >> "$GITHUB_OUTPUT"
          echo "nix_checks=$nix_checks" >> "$GITHUB_OUTPUT"

      # `bb remote build`'s post-run download returns an arbitrary subset of a
      # large request, so "Fetch artifacts" below retrieves every required output
      # from this invocation's event stream. Its own role keeps the id apart from
      # bazel-ci's when trusted-fork-pr-ci.yml calls both in one run.
      - name: Choose artifact build invocation
        id: invocation
        run: |
          invocation_id="$(python3 devinfra/buildbuddy/ci/invocation_ids.py \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --role nix-wheel-build)"
          echo "id=$invocation_id" >> "$GITHUB_OUTPUT"

      # run_from_commit: actions/checkout in PR mode doesn't fetch a local
      # `devel` ref, so bb remote's default base-branch patch sync fails with
      # `git rev-parse devel: exit status 128`. On pull_request events,
      # github.sha is the synthetic merge commit, keeping the remote build on
      # the same base+PR tree as the GitHub runner. Same rationale as
      # bazel-ci.yml.
      - parallel:
          - name: Check generated command policies
            run: |
              nix build --no-link --print-out-paths \
                .#checks.x86_64-linux.claude-code-permissions \
                .#checks.x86_64-linux.codex-execpolicy-evaluation \
                .#checks.x86_64-linux.gemini-cli-integration

          - name: Build artifacts from source
            uses: ./.github/actions/bb-remote
            with:
              args: build --invocation_id=${{ steps.invocation.outputs.id }} ${{ steps.inputs.outputs.bazel_targets }}
              linkage_roles: nix-wheel-build
              bazel_invocation_ids: ${{ steps.invocation.outputs.id }}
              # Rotate away from the exhausted workspace while retaining warm
              # runner reuse for subsequent artifact builds.
              runner_recycling_key: ducktape-nix-wheel-v2
              run_from_commit: ${{ steps.source.outputs.sha }}

      - name: Fetch artifacts
        env:
          INVOCATIONS: ${{ steps.invocation.outputs.id }}
        run: |
          set -euo pipefail
          overrides_file="$RUNNER_TEMP/nix-wheel-artifact-overrides.tsv"
          python3 -m devinfra.ci.release_assets nix-overrides \
            --invocations "$INVOCATIONS" > "$overrides_file"
          mapfile -t outputs < <(cut -f2 "$overrides_file")
          python3 -m devinfra.buildbuddy.ci.fetch_build_outputs --invocations "$INVOCATIONS" "${outputs[@]}"

      # Emit the JSON blob flake.nix's artifacts logic consumes. Every pin
      # in an in-gate release gets an override entry (including every asset in
      # a multi-asset release). The TSV was resolved from the build's stream,
      # then the fetch step materialized those files from CAS.
      - name: Assemble artifact overrides
        id: overrides
        shell: bash
        run: |
          set -euo pipefail
          json='{}'
          while IFS=$'\t' read -r pin rel; do
            if [[ ! -f "$rel" ]]; then
              echo "::error::missing artifact for pin '$pin' at $rel"
              exit 1
            fi
            abs=$(readlink -f "$rel")
            json=$(jq -c --arg k "$pin" --arg v "$abs" '. + {($k): $v}' <<<"$json")
          done < "$RUNNER_TEMP/nix-wheel-artifact-overrides.tsv"
          {
            echo 'overrides<<EOF'
            echo "$json"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Upload every path this run adds to the store as soon as it lands, so a
      # cold rebuild that times out or fails still leaves its finished paths in
      # Attic for the next run. Fork revisions (pull_request_target, via
      # trusted-fork-pr-ci.yml) never write to the shared cache.
      - name: Start incremental Attic upload
        if: github.event_name != 'pull_request_target'
        run: |
          nix profile install nixpkgs#attic-client
          attic login ducktape https://cache.allegedly.works "$ATTIC_TOKEN"
          nohup attic watch-store ducktape:main > "$RUNNER_TEMP/attic-watch-store.log" 2>&1 &

      # Each marker depends on the complete source-built package and its checks.
      # Cache hits need only the marker; misses build the package as before.
      # --impure is required for the getEnv artifact override read.
      - name: Nix build + imports check
        env:
          DUCKTAPE_ARTIFACT_OVERRIDES: ${{ steps.overrides.outputs.overrides }}
        run: |
          nix build --impure --no-link --print-out-paths \
            ${{ steps.inputs.outputs.nix_checks }} > "$RUNNER_TEMP/artifact-check-paths"
          cat "$RUNNER_TEMP/artifact-check-paths"

      # Publish the source-override results: ordinary pinned-artifact builds can
      # have different store paths even when they contain the same wheel bytes.
      # The watcher may still be uploading; this push covers the markers' full
      # closures before the job ends.
      - name: Cache source artifact checks in Attic
        if: github.event_name != 'pull_request_target'
        run: |
          mapfile -t checks < "$RUNNER_TEMP/artifact-check-paths"
          test "${#checks[@]}" -gt 0
          attic push ducktape:main "${checks[@]}"
