# Build and push the public-coder-agent OpenClaw image with Nix.
#
# This is a dockerTools archive rather than a Dockerfile build. The gateway is
# packaged by nix-openclaw and openclaw/default.nix adds the proxy preload plus
# the small public-coder command-line toolset.
name: OpenClaw Image

on:
  pull_request:
    paths:
      # keep-sorted start
      - ".bazelversion"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/scripts/smoke-openclaw-image.sh"
      - ".github/workflows/nix-image.yml"
      - ".github/workflows/openclaw-image.yml"
      - "cluster/k8s/agents/public-coder-agent/app/app.k8s.yaml"
      - "flake.lock"
      - "flake.nix"
      - "nix/artifact-pins.json"
      - "nix/flake/packages.nix"
      - "nix/packages/**"
      - "openclaw/bundle-runtime-plugin.sh"
      - "openclaw/default.nix"
      - "openclaw/gateway.nix"
      - "openclaw/patches/**"
      - "openclaw/proxy-setup.mjs"
      # keep-sorted end
  push:
    branches: [devel]
    paths:
      # keep-sorted start
      - ".bazelversion"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/scripts/smoke-openclaw-image.sh"
      - ".github/workflows/nix-image.yml"
      - ".github/workflows/openclaw-image.yml"
      - "cluster/k8s/agents/public-coder-agent/app/app.k8s.yaml"
      - "flake.lock"
      - "flake.nix"
      - "nix/artifact-pins.json"
      - "nix/flake/packages.nix"
      - "nix/packages/**"
      - "openclaw/bundle-runtime-plugin.sh"
      - "openclaw/default.nix"
      - "openclaw/gateway.nix"
      - "openclaw/patches/**"
      - "openclaw/proxy-setup.mjs"
      # keep-sorted end
  workflow_dispatch:

concurrency:
  group: openclaw-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/nix-image.yml
    with:
      attr: openclaw-image
      image: git.allegedly.works/ducktape-ci/public-coder-agent
      registry: forgejo
      smoke: |
        pip install --quiet pyyaml
        python3 -c '
        import yaml
        with open("cluster/k8s/agents/public-coder-agent/app/app.k8s.yaml") as f:
            config_map = next(
                doc
                for doc in yaml.safe_load_all(f)
                if doc["kind"] == "ConfigMap" and doc["metadata"]["name"] == "public-coder-agent-config"
            )
        with open("/tmp/public-coder-agent-openclaw.json5", "w") as out:
            out.write(config_map["data"]["openclaw.json5"])
        '
        loaded="$(docker load -i "$(readlink -f result)")"
        printf '%s\n' "$loaded"
        image="$(printf '%s\n' "$loaded" | sed -n -e 's/^Loaded image: //p' -e 's/^Loaded image ID: //p' | tail -n 1)"
        test -n "$image"
        docker run --rm \
          --entrypoint /bin/sh \
          --mount "type=bind,src=$PWD/.github/scripts/smoke-openclaw-image.sh,dst=/tmp/smoke-openclaw-image.sh,readonly" \
          --mount "type=bind,src=/tmp/public-coder-agent-openclaw.json5,dst=/tmp/public-coder-agent-openclaw.json5,readonly" \
          "$image" /tmp/smoke-openclaw-image.sh
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
