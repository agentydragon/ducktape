# Build and push the OpenClaw derivative to GHCR with Nix.
#
# This is a dockerTools archive rather than a Dockerfile build. The gateway is
# packaged by nix-openclaw and openclaw/default.nix adds the proxy preload plus
# the small public-coder command-line toolset. Keeping the existing image name
# lets Flux roll public-coder-agent without a registry migration.
name: OpenClaw Image

on:
  pull_request:
    paths:
      - ".bazelversion"
      - "openclaw/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/artifact-pins.json"
      - "nix/packages/**"
      - ".github/scripts/smoke-openclaw-image.sh"
      - ".github/workflows/openclaw-image.yml"
  push:
    branches: [devel]
    paths:
      - ".bazelversion"
      - "openclaw/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/artifact-pins.json"
      - "nix/packages/**"
      - ".github/scripts/smoke-openclaw-image.sh"
      - ".github/workflows/openclaw-image.yml"
  workflow_dispatch:

concurrency:
  group: openclaw-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw
    steps:
      - uses: actions/checkout@v7

      - name: Load Attic trusted pubkeys
        id: attic_keys
        run: echo "value=$(jq -r 'join(\" \")' nix/attic-pubkeys.json)" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes fetch-closure
            netrc-file = /home/runner/.config/nix/netrc
            extra-trusted-public-keys = ${{ steps.attic_keys.outputs.value }}
            extra-substituters = https://cache.allegedly.works/main
            fallback = true

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Write Nix netrc for cache.allegedly.works
        run: |
          mkdir -p /home/runner/.config/nix
          umask 077
          printf 'machine cache.allegedly.works password %s\n' "$ATTIC_TOKEN" \
            > /home/runner/.config/nix/netrc

      - name: Build image
        run: nix build .#openclaw-image --print-build-logs

      - name: Smoke test public-coder runtime
        run: |
          loaded="$(docker load -i "$(readlink -f result)")"
          printf '%s\n' "$loaded"
          image="$(printf '%s\n' "$loaded" | sed -n -e 's/^Loaded image: //p' -e 's/^Loaded image ID: //p' | tail -n 1)"
          test -n "$image"
          docker run --rm \
            --entrypoint /bin/sh \
            --mount "type=bind,src=$PWD/.github/scripts/smoke-openclaw-image.sh,dst=/tmp/smoke-openclaw-image.sh,readonly" \
            "$image" /tmp/smoke-openclaw-image.sh

      - name: Compute tag
        id: meta
        run: |
          SHA="${{ github.sha }}"
          echo "pin_tag=${GITHUB_REF_NAME}-$(date -u +%Y%m%d%H%M%S)-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Push to GHCR
        if: github.event_name == 'push'
        run: |
          ref="$IMAGE:${{ steps.meta.outputs.pin_tag }}"
          echo "${{ github.token }}" | skopeo login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          skopeo copy --insecure-policy \
            "docker-archive:$(readlink -f result)" "docker://$ref"
          echo "pushed \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
