# Build and push the OpenClaw derivative to GHCR.
# Derives from upstream OpenClaw with the proxy preload configured.
name: OpenClaw Image

on:
  push:
    branches: [main, devel]
    paths:
      - "openclaw/**"
      - ".github/workflows/openclaw-image.yml"
  workflow_dispatch:

concurrency:
  group: openclaw-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/ghcr-build-push
        with:
          image: ghcr.io/${{ github.repository_owner }}/openclaw
          context: .
          file: openclaw/Dockerfile
          cache_from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/openclaw:buildcache
          cache_to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/openclaw:buildcache,mode=max
