# Main CI pipeline — dependency chain for Bazel builds, releases, and image pushes.
#
# Container images (rbe-worker, freecad-test) are built by container-images.yml
# independently. CI uses the pinned image from image_pins.json.
#
# Independent workflows (pre-commit, ansible-lint, nix-attic-push, openclaw-image,
# container-images) have their own triggers and run separately.
name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:

# Deliberately no workflow-level concurrency group. That would cancel the whole run —
# release and push-images included — the moment a new commit lands on the same ref,
# so a busy merge day never lets an image finish publishing (#2759).
#
# Each called workflow carries its own group instead, and the polarity differs according
# to what the work is worth once it has been superseded:
#
#   bazel-ci.yml                  cancels only PR runs — a test result for a PR head
#                                 nobody will merge is worthless. A push run is for a
#                                 commit that ships, so it queues behind the run in
#                                 flight; GitHub keeps one pending run per group, so a
#                                 merge burst costs the run in flight plus the newest.
#                                 Cancelling push runs starved devel of images: eight
#                                 in ten devel runs were cancelled on a busy day, and a
#                                 cancelled run publishes nothing, so nothing published
#                                 until a gap longer than a full run appeared.
#   push-images.yml, release.yml  cancel-in-progress: false — a half-finished publish is
#                                 not worthless. Queued runs coalesce (a new one replaces
#                                 the pending one); running ones are left to finish.
#
# The publish jobs below still skip a cancelled bazel-ci rather than publish from it.
# `cancelled()` reports the *run*, not the dependency, so without the explicit
# `needs.bazel-ci.result` check they would go ahead with no invocation ids and fail open
# on every row: measured on devel, that is "42 of 42 images need a push" plus ~20 releases.

permissions:
  contents: write
  packages: write

jobs:
  bazel-ci:
    # GitHub never exposes repository secrets to pull_request workflows from
    # forks. Those revisions use trusted-fork-pr-ci.yml, which automatically
    # trusts the dedicated agent fork and requires environment review for any
    # other fork while preserving this check context.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/bazel-ci.yml
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  release:
    needs: [bazel-ci]
    if: always() && !cancelled() && github.event_name == 'push' && needs.bazel-ci.result != 'cancelled'
    uses: ./.github/workflows/release.yml
    with:
      # What bazel-ci already built. Empty if it was skipped or died before Bazel
      # ran, which release.yml turns into "publish everything" rather than "nothing".
      bazel_invocation_ids: ${{ needs.bazel-ci.outputs.bazel_invocation_ids }}
    secrets: inherit

  # push-images also pushes the props agent images (props-agents job) to the
  # props registry, gated on props tests — see push-images.yml.
  push-images:
    needs: [bazel-ci]
    if: always() && !cancelled() && github.event_name == 'push' && needs.bazel-ci.result != 'cancelled'
    uses: ./.github/workflows/push-images.yml
    with:
      bazel_invocation_ids: ${{ needs.bazel-ci.outputs.bazel_invocation_ids }}
    secrets: inherit
