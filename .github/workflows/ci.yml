# AUTO-GENERATED from devinfra/ci/workflows.yaml - DO NOT EDIT DIRECTLY
# Regenerate with: bazel run //devinfra/ci:generate_ci_bin
name: CI
"on":
  push:
    branches:
      - main
      - master
      - devel
  pull_request: null
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  compute-targets:
    name: Compute affected targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      targets: ${{ steps.decide.outputs.targets }}
      workflows: ${{ steps.decide.outputs.workflows }}
      infra_changed: ${{ steps.decide.outputs.infra_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - uses: ./.github/actions/bazel-repo-cache
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache bazel-diff JAR
        id: cache-bazel-diff
        uses: actions/cache@v4
        with:
          path: bazel-diff.jar
          key: bazel-diff-16.0.0
      - name: Download bazel-diff
        run: |-
          curl -fsSL -o bazel-diff.jar \
            "https://github.com/Tinder/bazel-diff/releases/download/16.0.0/bazel-diff_deploy.jar"
        if: steps.cache-bazel-diff.outputs.cache-hit != 'true'
      - name: Cache bazel-diff hashes
        uses: actions/cache@v4
        with:
          path: .bazel-diff-cache
          key: bazel-diff-hashes-${{ github.sha }}
          restore-keys: bazel-diff-hashes-
      - name: Set CI env
        run: |-
          echo "BAZEL_DIFF_JAR=$PWD/bazel-diff.jar" >> $GITHUB_ENV
          echo "BAZEL_DIFF_CACHE_DIR=$PWD/.bazel-diff-cache" >> $GITHUB_ENV
          echo "BAZEL_QUERY_LOG_DIR=$PWD/bazel-query-logs" >> $GITHUB_ENV
          echo "CI_WORKFLOWS_MANIFEST=$PWD/devinfra/ci/workflows.yaml" >> $GITHUB_ENV
          # Full build on main/master pushes; incremental everywhere else (PRs, devel, feature branches)
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" =~ ^(main|master)$ ]]; then
            echo "CI_PUSH_STRATEGY=full" >> $GITHUB_ENV
          else
            echo "CI_PUSH_STRATEGY=incremental" >> $GITHUB_ENV
          fi
      - name: Compute CI decision
        id: decide
        run: uv run devinfra/ci/ci_decide.py
      - name: Upload targets files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targets
          path: targets*.txt
          if-no-files-found: ignore
      - name: Upload query logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bazel-query-logs-${{ github.run_id }}
          path: bazel-query-logs
          if-no-files-found: ignore
  bazel-check:
    needs:
      - compute-targets
      - rbe-image
    if: always() && !cancelled() && !failure() && contains(fromJson(needs.compute-targets.outputs.workflows || '[]'), 'bazel-check')
    uses: ./.github/workflows/bazel-check.yml
    with:
      targets: ${{ needs.compute-targets.outputs.targets }}
      rbe_image: ${{ needs.rbe-image.outputs.rbe_image }}
    secrets: inherit
  bazel-test:
    needs:
      - compute-targets
      - rbe-image
    if: always() && !cancelled() && !failure() && contains(fromJson(needs.compute-targets.outputs.workflows || '[]'), 'bazel-test')
    uses: ./.github/workflows/bazel-test.yml
    with:
      targets: ${{ needs.compute-targets.outputs.targets }}
      rbe_image: ${{ needs.rbe-image.outputs.rbe_image }}
    secrets: inherit
  rbe-image:
    needs: compute-targets
    if: contains(fromJson(needs.compute-targets.outputs.workflows || '[]'), 'rbe-image')
    uses: ./.github/workflows/rbe-image.yml
  props-images:
    needs:
      - compute-targets
      - rbe-image
    if: always() && !cancelled() && !failure() && contains(fromJson(needs.compute-targets.outputs.workflows || '[]'), 'props-images')
    uses: ./.github/workflows/props-images.yml
    with:
      rbe_image: ${{ needs.rbe-image.outputs.rbe_image }}
    secrets: inherit
  bazel-harbor-images:
    needs:
      - compute-targets
      - rbe-image
    if: always() && !cancelled() && !failure() && contains(fromJson(needs.compute-targets.outputs.workflows || '[]'), 'bazel-harbor-images')
    uses: ./.github/workflows/bazel-harbor-images.yml
    with:
      rbe_image: ${{ needs.rbe-image.outputs.rbe_image }}
    secrets: inherit
  openclaw-image:
    needs: compute-targets
    if: contains(fromJson(needs.compute-targets.outputs.workflows || '[]'), 'openclaw-image')
    uses: ./.github/workflows/openclaw-image.yml
    secrets: inherit
  nix-flake-check:
    needs: compute-targets
    if: contains(fromJson(needs.compute-targets.outputs.workflows || '[]'), 'nix-flake-check')
    uses: ./.github/workflows/nix-flake-check.yml
  ansible-lint:
    needs: compute-targets
    if: contains(fromJson(needs.compute-targets.outputs.workflows || '[]'), 'ansible-lint')
    uses: ./.github/workflows/ansible-lint.yml
  pre-commit:
    needs: compute-targets
    if: contains(fromJson(needs.compute-targets.outputs.workflows || '[]'), 'pre-commit')
    uses: ./.github/workflows/pre-commit.yml
