name: BuildBuddy Nix Runner Experiment

on:
  workflow_dispatch:
    inputs:
      candidate_only:
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix-devtools
        with:
          installables: ".#runner-image-tools"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish temporary Nix candidate
        env:
          CANDIDATE: ghcr.io/${{ github.repository_owner }}/buildbuddy-remote-runner:nix-experiment-${{ github.sha }}
        run: |
          set -euo pipefail
          nix build .#nix-rbe-container-image --out-link "$RUNNER_TEMP/nix-image"
          docker load --input "$RUNNER_TEMP/nix-image"
          docker tag nix-rbe-container-image:latest "$CANDIDATE"
          docker push "$CANDIDATE"
