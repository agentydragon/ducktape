name: BuildBuddy Runner Image Compression Experiment
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix-devtools
        with:
          installables: ".#runner-image-tools"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Recompress the isolated candidate and verify its config
        shell: bash
        env:
          SOURCE: ghcr.io/agentydragon/buildbuddy-remote-runner@sha256:7ff3661d85a9245eb5306a0423e433c3d0997f71607b31a982baa5e224601f6b
          TARGET: ghcr.io/${{ github.repository_owner }}/buildbuddy-remote-runner:nix-compressed-probe-20261117
        run: |
          set -euo pipefail
          skopeo inspect --raw "docker://$SOURCE" > "$RUNNER_TEMP/source-manifest.json"
          skopeo copy --insecure-policy --format oci --dest-compress-format gzip \
            "docker://$SOURCE" "oci:$RUNNER_TEMP/compressed:runner"
          skopeo copy --insecure-policy --preserve-digests \
            --digestfile "$RUNNER_TEMP/dest-digest" \
            "oci:$RUNNER_TEMP/compressed:runner" "docker://$TARGET"
          skopeo inspect --raw "docker://$TARGET" > "$RUNNER_TEMP/dest-manifest.json"
          source_config=$(jq -r '.config.digest' "$RUNNER_TEMP/source-manifest.json")
          dest_config=$(jq -r '.config.digest' "$RUNNER_TEMP/dest-manifest.json")
          copy_digest=$(cat "$RUNNER_TEMP/dest-digest")
          dest_digest="sha256:$(sha256sum "$RUNNER_TEMP/dest-manifest.json" | cut -d' ' -f1)"
          printf 'copy digestfile: %s\npublished digest: %s\n' "$copy_digest" "$dest_digest"
          test "$source_config" = "$dest_config"
          skopeo inspect --raw "docker://${TARGET%:*}@$dest_digest" | cmp - "$RUNNER_TEMP/dest-manifest.json"
          test "$(jq '[.layers[] | select(.mediaType == "application/vnd.oci.image.layer.v1.tar+gzip")] | length' "$RUNNER_TEMP/dest-manifest.json")" = "$(jq '.layers | length' "$RUNNER_TEMP/dest-manifest.json")"
          printf 'source config: %s\n' "$source_config"
          printf 'destination config: %s\n' "$dest_config"
          printf 'source layers: %s bytes across %s layers\n' \
            "$(jq '[.layers[].size] | add' "$RUNNER_TEMP/source-manifest.json")" \
            "$(jq '.layers | length' "$RUNNER_TEMP/source-manifest.json")"
          printf 'destination layers: %s bytes across %s layers\n' \
            "$(jq '[.layers[].size] | add' "$RUNNER_TEMP/dest-manifest.json")" \
            "$(jq '.layers | length' "$RUNNER_TEMP/dest-manifest.json")"
          printf 'destination digest: %s\n' "$dest_digest"
