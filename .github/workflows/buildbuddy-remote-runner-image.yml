name: Nix RBE Candidate Image
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix-devtools
        with:
          installables: ".#runner-image-tools"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish compressed Nix RBE candidate
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/buildbuddy-remote-runner
          TAG: nix-nested-docker-${{ github.sha }}
        run: |
          set -euo pipefail
          nix build .#nix-rbe-container-image --out-link "$RUNNER_TEMP/nix-image"
          skopeo inspect --config "docker-archive:$RUNNER_TEMP/nix-image" > "$RUNNER_TEMP/source-config.json"
          skopeo copy --insecure-policy --format oci --dest-compress-format gzip \
            "docker-archive:$RUNNER_TEMP/nix-image" "oci:$RUNNER_TEMP/compressed:runner"
          skopeo copy --insecure-policy --preserve-digests \
            --digestfile "$RUNNER_TEMP/dest-digest" \
            "oci:$RUNNER_TEMP/compressed:runner" "docker://$IMAGE:$TAG"
          digest=$(cat "$RUNNER_TEMP/dest-digest")
          skopeo inspect --raw "docker://$IMAGE:$TAG" > "$RUNNER_TEMP/dest-manifest.json"
          manifest_digest="sha256:$(sha256sum "$RUNNER_TEMP/dest-manifest.json" | cut -d' ' -f1)"
          test "$manifest_digest" = "$digest"
          skopeo inspect --raw "docker://$IMAGE@$digest" | cmp - "$RUNNER_TEMP/dest-manifest.json"
          skopeo inspect --config "docker://$IMAGE@$digest" > "$RUNNER_TEMP/dest-config.json"
          cmp <(jq -S . "$RUNNER_TEMP/source-config.json") <(jq -S . "$RUNNER_TEMP/dest-config.json")
          jq -e 'all(.layers[]; .mediaType == "application/vnd.oci.image.layer.v1.tar+gzip")' \
            "$RUNNER_TEMP/dest-manifest.json" >/dev/null
          printf 'candidate image: %s@%s\n' "$IMAGE" "$digest"
          printf 'config preserved: %s\n' "$(jq -r '.config.digest' "$RUNNER_TEMP/dest-manifest.json")"
          printf 'gzip layers: %s (%s bytes)\n' \
            "$(jq '.layers | length' "$RUNNER_TEMP/dest-manifest.json")" \
            "$(jq '[.layers[].size] | add' "$RUNNER_TEMP/dest-manifest.json")"
