# Build agentplane's Nix build-box image (agentplane/images/build.nix: the sandbox image plus Bazel
# and its toolchain) and push it to the Forgejo registry, through nix-image.yml. The archive also
# goes to the Attic cache. Fork PRs use pull_request_target with the trusted-fork review gate; the
# reusable workflow never publishes from that event.
name: Agentplane Sandbox Build Image

on:
  push:
    branches: [devel]
    paths:
      # keep-sorted start
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/agentplane-sandbox-build-image.yml"
      - ".github/workflows/nix-image.yml"
      - "agentplane/cli/package.nix"
      - "agentplane/images/build.nix"
      - "agentplane/images/sandbox.nix"
      - "agentplane/images/tools.nix"
      - "devinfra/ci/pr_mergeability.py"
      - "flake.lock"
      - "nix/artifact-pins.json"
      - "nix/flake/packages.nix"
      - "nix/lib/nix-ld-image.nix"
      # keep-sorted end
  # Same-repository PRs build directly. Forks use pull_request_target below because this build
  # needs the Attic token; the fork build remains unable to publish.
  pull_request:
    paths:
      # keep-sorted start
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/agentplane-sandbox-build-image.yml"
      - ".github/workflows/nix-image.yml"
      - "agentplane/cli/package.nix"
      - "agentplane/images/build.nix"
      - "agentplane/images/sandbox.nix"
      - "agentplane/images/tools.nix"
      - "devinfra/ci/pr_mergeability.py"
      - "flake.lock"
      - "nix/artifact-pins.json"
      - "nix/flake/packages.nix"
      - "nix/lib/nix-ld-image.nix"
      # keep-sorted end
  # Fork PRs use pull_request_target so the build can read the Attic cache. The caller resolves
  # GitHub's merge commit and gates non-allowlisted authors with fork-ci-review before checkout.
  pull_request_target:
    branches: [devel]
    paths:
      # keep-sorted start
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/agentplane-sandbox-build-image.yml"
      - ".github/workflows/nix-image.yml"
      - "agentplane/cli/package.nix"
      - "agentplane/images/build.nix"
      - "agentplane/images/sandbox.nix"
      - "agentplane/images/tools.nix"
      - "devinfra/ci/pr_mergeability.py"
      - "flake.lock"
      - "nix/artifact-pins.json"
      - "nix/flake/packages.nix"
      - "nix/lib/nix-ld-image.nix"
      # keep-sorted end
  workflow_dispatch:

concurrency:
  # Keep a skipped fork pull_request run from canceling its trusted pull_request_target run.
  group: agentplane-sandbox-build-image-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-merge-commit:
    name: Resolve PR merge commit
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # pull_request_target loads this workflow from the base branch. Resolve the exact merge
      # commit for this PR head before checking out any PR-controlled code.
      - uses: actions/checkout@v7
        with:
          ref: devel
          fetch-depth: 1
      - name: Resolve the merge commit GitHub built for this PR head
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 devinfra/ci/pr_mergeability.py resolve

  image:
    needs: [resolve-merge-commit]
    if: >-
      always() &&
      (github.event_name != 'pull_request_target' || needs.resolve-merge-commit.outputs.sha != '') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/nix-image.yml
    with:
      attr: agentplane-sandbox-build-image
      image: git.allegedly.works/ducktape-ci/agentplane-sandbox-build
      registry: forgejo
      attic: true
      source_commit: ${{ needs.resolve-merge-commit.outputs.sha }}
      allow_unsafe_pr_checkout: ${{ github.event_name == 'pull_request_target' }}
      environment: >-
        ${{
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          github.event.pull_request.user.login != 'agentydragon-agent' &&
          github.event.pull_request.user.login != 'agentydragon' &&
          'fork-ci-review' || ''
        }}
    secrets:
      FORGEJO_IMAGES_USERNAME: ${{ secrets.FORGEJO_IMAGES_USERNAME }}
      FORGEJO_IMAGES_PASSWORD: ${{ secrets.FORGEJO_IMAGES_PASSWORD }}
      ATTIC_TOKEN: ${{ secrets[github.event_name != 'pull_request_target' && github.ref_name == 'devel' && 'ATTIC_TOKEN' || 'ATTIC_READ_TOKEN'] }}
      ATTIC_READ_TOKEN: ${{ secrets.ATTIC_READ_TOKEN }}
