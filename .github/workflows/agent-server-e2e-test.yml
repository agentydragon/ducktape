# Agent server E2E test reusable workflow
#
# Runs agent_server tests that require Docker and the runtime image
name: Agent Server E2E Test

on:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key for remote cache (optional)"
        required: false
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Pull required Docker images
        run: docker pull python:3.12-slim

      - name: Build and load agent server runtime image
        run: bazel run //agent_server:load

      - name: Run E2E tests
        run: |
          bazel test --keep_going \
            --test_tag_filters=requires_docker \
            --test_env=CI=true --test_env=GITHUB_ACTIONS=true \
            //agent_server/...

      - uses: ./.github/actions/collect-test-logs
        if: failure()
        with:
          artifact-name: agent-server-e2e-test-logs

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Agent Server E2E Test Results
          path: "bazel-testlogs/**/test.xml"
          reporter: java-junit
          fail-on-error: false

      - uses: ./.github/actions/bazel-cache-save
        if: always()
        with:
          cache-hit: ${{ steps.bazel.outputs.cache-hit }}
          cache-key: ${{ steps.bazel.outputs.cache-key }}
          skip_cache: ${{ steps.bazel.outputs.buildbuddy-enabled }}
