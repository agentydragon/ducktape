name: Publish PR visuals

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      # This privileged workflow always executes the trusted default-branch implementation.
      # PR-controlled code produced the PNGs, but never receives S3 credentials.
      - uses: actions/checkout@v6
        with:
          ref: devel

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Download BuildBuddy linkage
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: bazel-ci-linkage-*
          merge-multiple: true
          path: linkage

      - name: Publish visual review
        id: visuals
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PR_VISUALS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PR_VISUALS_SECRET_KEY }}
          AWS_REGION: us-east-1
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          bb run //devinfra/ci:pr_visuals_bin -- \
            --linkage-dir "$PWD/linkage" \
            --work-dir "$RUNNER_TEMP/pr-visuals" \
            --sha "$HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --endpoint https://s3.allegedly.works \
            --bucket pr-visuals \
            --public-base-url https://s3.allegedly.works/pr-visuals \
            --pull-request "$PR_NUMBER"
