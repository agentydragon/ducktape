# Build agentplane's Nix runner image (agentplane/runner/image.nix) and push it to the Forgejo
# registry, through nix-image.yml. The archive also goes to the Attic cache. The runner and
# `agentplane` are not in the image: they come from the runner disk image, so a pin bump for either
# does not build this one. The runner-ducktape variant, which does carry released tools, builds in
# agentplane-runner-ducktape-image.yml.
name: Runner Image

on:
  push:
    branches: [devel]
    paths:
      # keep-sorted start
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/agentplane-runner-image.yml"
      - ".github/workflows/nix-image.yml"
      - "agentplane/images/sandbox.nix"
      - "agentplane/images/tools.nix"
      - "agentplane/runner/ducktape_image_smoke.sh"
      - "agentplane/runner/image.nix"
      - "flake.lock"
      - "flake.nix"
      - "nix/flake/packages.nix"
      - "nix/lib/nix-ld-image.nix"
      # keep-sorted end
  # Build-only on PRs, so a change to the image is proven to build before it merges.
  pull_request:
    paths:
      # keep-sorted start
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/agentplane-runner-image.yml"
      - ".github/workflows/nix-image.yml"
      - "agentplane/images/sandbox.nix"
      - "agentplane/images/tools.nix"
      - "agentplane/runner/ducktape_image_smoke.sh"
      - "agentplane/runner/image.nix"
      - "flake.lock"
      - "flake.nix"
      - "nix/flake/packages.nix"
      - "nix/lib/nix-ld-image.nix"
      # keep-sorted end
  workflow_dispatch:

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/nix-image.yml
    with:
      attr: runner-image
      image: git.allegedly.works/ducktape-ci/runner
      registry: forgejo
      attic: true
      # Starts each harness the runner SandboxTemplate names, once, as the image's own user.
      # Nothing here runs a turn, and the system tests run a Bazel-built runner image of their own:
      # this image's first turn is on staging.
      smoke: bash agentplane/runner/ducktape_image_smoke.sh runner
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
