# Build and push the container E2E test image to GHCR.
#
# Pre-bakes python:3.13-slim + git + JDK (keytool) so the container E2E test
# doesn't spend time on apt-get at test runtime.
#
# Triggers:
#   - push to main/devel when Dockerfile changes
#   - workflow_dispatch for manual rebuilds
#   - workflow_call (from ci.yml)
#
# After pushing, the workflow auto-updates the oci.pull digest in MODULE.bazel
# and commits the change. The image is pinned by commit SHA tag.
name: E2E Container Image

on:
  push:
    branches: [main, devel]
    paths:
      - "devinfra/claude/testing/container_e2e/Dockerfile"
      - ".github/workflows/e2e-container-image.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-container-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/e2e-container

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: devinfra/claude/testing/container_e2e
          file: devinfra/claude/testing/container_e2e/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Update MODULE.bazel with new digest
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          TAG="${{ github.sha }}"
          echo "New digest: ${DIGEST}"
          echo "New tag: ${TAG}"

          # Update the digest line for e2e_container
          sed -i '/name = "e2e_container"/,/^)/ s|digest = "sha256:[a-f0-9]*"|digest = "'"${DIGEST}"'"|' MODULE.bazel
          # Update the tag line for e2e_container
          sed -i '/name = "e2e_container"/,/^)/ s|tag = "[a-f0-9]*"|tag = "'"${TAG}"'"|' MODULE.bazel

          git diff MODULE.bazel

      - name: Commit and push digest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULE.bazel
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update e2e-container image to ${{ github.sha }}"
            git push
          fi

  cleanup-old-images:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: e2e-container
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
