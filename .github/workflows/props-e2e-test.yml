# Props E2E test reusable workflow
#
# Runs props e2e tests that require Docker infrastructure (registry, proxy, postgres)
name: Props E2E Test

on:
  workflow_call:
    inputs:
      targets:
        description: "E2E test targets to run"
        required: false
        type: string
        default: "//props/critic:test_e2e //props/critic_dev/improve:test_e2e //props/critic_dev/optimize:test_e2e //props/core:test_agent_pkg_e2e"
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key for remote cache (optional)"
        required: false
  workflow_dispatch:
    inputs:
      targets:
        description: "E2E test targets to run"
        required: false
        type: string
        default: "//props/critic:test_e2e //props/critic_dev/improve:test_e2e //props/critic_dev/optimize:test_e2e //props/core:test_agent_pkg_e2e"

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      # Generate PGPASSWORD (compose.yaml expects it from environment)
      - name: Setup environment
        run: |
          echo "PGPASSWORD=$(openssl rand -base64 24)" >> $GITHUB_ENV
          # Dummy OPENAI_API_KEY to satisfy compose.yaml (tests use fake server)
          echo "OPENAI_API_KEY=test-key-not-used" >> $GITHUB_ENV

      # Build unified backend image (compose.yaml references props-backend:latest)
      - name: Build backend image
        run: bazel run //props/backend:load

      # Pull images needed by compose.yaml
      - name: Pull infrastructure images
        run: |
          docker pull postgres:16
          docker pull registry:2

      # Start services using existing compose.yaml
      - name: Start infrastructure
        working-directory: props
        run: |
          docker compose up -d
          echo "Waiting for PostgreSQL..."
          until pg_isready -h 127.0.0.1 -p 5433 -U postgres; do sleep 1; done
          echo "Waiting for registry..."
          until curl -sf http://127.0.0.1:5000/v2/; do sleep 1; done
          echo "Waiting for backend..."
          for i in {1..60}; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || echo "000")
            if [[ "$HTTP" == "200" ]]; then break; fi
            if [ $i -eq 60 ]; then
              echo "Backend failed to start"
              docker logs props-backend
              exit 1
            fi
            sleep 1
          done
          echo "Infrastructure ready"

      # Initialize database schema and sync test data
      - name: Setup database
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: postgres
          PGDATABASE: eval_results
          ADGN_PROPS_SPECIMENS_ROOT: ${{ github.workspace }}/props/testing/fixtures/testdata/specimens
        run: bazel run //props/cli:cli -- db recreate -y

      # Build and push agent images to local registry
      - name: Push agent images
        run: |
          bazel run //props/critic:push
          bazel run //props/grader:push
          bazel run //props/critic_dev/improve:push
          bazel run //props/critic_dev/optimize:push

      - name: Run E2E tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: postgres
          PGDATABASE: eval_results
          AGENT_PGHOST: 127.0.0.1
          # Unified backend handles registry proxy on port 8000
          PROPS_REGISTRY_PROXY_HOST: 127.0.0.1
          PROPS_REGISTRY_PROXY_PORT: "8000"
          PROPS_DOCKER_NETWORK: props-agents
          PROPS_E2E_HOST_HOSTNAME: 172.17.0.1
        run: |
          bazel test --keep_going \
            --test_env=CI=true --test_env=GITHUB_ACTIONS=true \
            ${{ inputs.targets }}

      - uses: ./.github/actions/collect-test-logs
        if: failure()
        with:
          artifact-name: props-e2e-test-logs

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Props E2E Test Results
          path: "bazel-testlogs/**/test.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Cleanup infrastructure
        if: always()
        working-directory: props
        run: docker compose down

      - uses: ./.github/actions/bazel-cache-save
        if: always()
        with:
          cache-hit: ${{ steps.bazel.outputs.cache-hit }}
          cache-key: ${{ steps.bazel.outputs.cache-key }}
          skip_cache: ${{ steps.bazel.outputs.buildbuddy-enabled }}
