# Props E2E test reusable workflow
#
# Runs props e2e tests using testcontainers for infrastructure.
# No docker-compose required - all infrastructure is managed by pytest fixtures.
name: Props E2E Test

on:
  workflow_call:
    inputs:
      targets:
        description: "E2E test targets to run"
        required: false
        type: string
        default: "//props/critic:test_e2e //props/critic_dev/improve:test_e2e //props/critic_dev/optimize:test_e2e //props/core:test_agent_pkg_e2e"
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key for remote cache (optional)"
        required: false
  workflow_dispatch:
    inputs:
      targets:
        description: "E2E test targets to run"
        required: false
        type: string
        default: "//props/critic:test_e2e //props/critic_dev/improve:test_e2e //props/critic_dev/optimize:test_e2e //props/core:test_agent_pkg_e2e"

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Run E2E tests
        env:
          # For testcontainers bridge networking
          PROPS_E2E_HOST_HOSTNAME: host.docker.internal
        run: |
          bazel test --keep_going \
            --test_env=CI=true --test_env=GITHUB_ACTIONS=true \
            --test_env=PROPS_E2E_HOST_HOSTNAME=host.docker.internal \
            ${{ inputs.targets }}

      - uses: ./.github/actions/collect-test-logs
        if: failure()
        with:
          artifact-name: props-e2e-test-logs

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Props E2E Test Results
          path: "bazel-testlogs/**/test.xml"
          reporter: java-junit
          fail-on-error: false

      - uses: ./.github/actions/bazel-cache-save
        if: always()
        with:
          cache-hit: ${{ steps.bazel.outputs.cache-hit }}
          cache-key: ${{ steps.bazel.outputs.cache-key }}
          skip_cache: ${{ steps.bazel.outputs.buildbuddy-enabled }}
