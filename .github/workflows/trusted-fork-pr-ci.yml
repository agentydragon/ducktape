# BuildBuddy CI for fork pull requests. Revisions authored by the dedicated
# agent identity or the repository owner run automatically because they already own the
# BuildBuddy credential; every other author is gated by the protected
# fork-ci-review GitHub Environment. pull_request_target intentionally loads
# this workflow and the called reusable workflows from the base branch before
# executing PR code.
#
# Same event types, checks and source semantics as a same-repo PR in ci.yml, drafts
# included. Deviation: pull_request_target hands the workflow no merge commit, so the
# first job asks GitHub for the one it built for this exact head
# (devinfra/ci/pr_mergeability.py) and the jobs below check out that immutable commit.
# Nothing re-resolves a ref after the trust decision, so a push after approval cannot
# change what runs.
name: Trusted fork PR CI
run-name: >-
  ${{ format('Trusted PR #{0} @ {1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}

on:
  pull_request_target:
    branches: [devel]

concurrency:
  group: trusted-fork-pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  merge-commit:
    name: Resolve PR merge commit
    # Same-repo PRs get their merge commit from the pull_request run in ci.yml.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Empty when there is nothing to build: GitHub builds no merge commit for a
      # conflicted PR, and a PR that moved on is covered by the run for its new head.
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # pull_request_target runs trusted base-branch code. This job reads PR metadata;
      # it never checks out PR-controlled code.
      - uses: actions/checkout@v7
        with:
          # Always run the trusted helper from devel. Event-time base.sha can point to
          # a commit from before this helper was added, breaking long-lived PRs.
          ref: devel
          fetch-depth: 1
      - name: Resolve the merge commit GitHub built for this PR head
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 devinfra/ci/pr_mergeability.py resolve

  bazel-ci:
    needs: [merge-commit]
    if: needs.merge-commit.outputs.sha != ''
    uses: ./.github/workflows/bazel-ci.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      # PRs authored by the agent identity or repository owner already own the only
      # injected capability. All other authors wait for a fork-ci-review review.
      environment: >-
        ${{
          github.event.pull_request.user.login != 'agentydragon-agent' &&
          github.event.pull_request.user.login != 'agentydragon' &&
          'fork-ci-review' || ''
        }}
      source_commit: ${{ needs.merge-commit.outputs.sha }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      pr_base_sha: ${{ github.event.pull_request.base.sha }}
      # actions/checkout v6 refuses fork code under pull_request_target unless
      # explicitly opted in. The called job either recognizes the trusted author
      # or blocks on fork-ci-review before runner assignment.
      allow_unsafe_pr_checkout: true
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  nix-wheel-check:
    needs: [merge-commit]
    if: needs.merge-commit.outputs.sha != ''
    uses: ./.github/workflows/nix-wheel-check.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      environment: >-
        ${{
          github.event.pull_request.user.login != 'agentydragon-agent' &&
          github.event.pull_request.user.login != 'agentydragon' &&
          'fork-ci-review' || ''
        }}
      source_commit: ${{ needs.merge-commit.outputs.sha }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      allow_unsafe_pr_checkout: true
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  nix-wheel-check-required:
    # Branch protection requires this exact context. The reusable workflow's own
    # context is prefixed with its caller job ID, so bridge its result here.
    name: >-
      ${{ github.event.pull_request.head.repo.full_name != github.repository &&
          'Build artifacts + imports check' ||
          'Fork Nix check not applicable' }}
    needs: [nix-wheel-check]
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Require the trusted fork Nix result
        if: needs.nix-wheel-check.result != 'success'
        run: |
          echo "::error::The trusted fork Nix check did not succeed (job result: ${{ needs.nix-wheel-check.result }}). See the fork Nix job and the Resolve PR merge commit job."
          exit 1
      - name: Confirm the trusted fork Nix result
        if: needs.nix-wheel-check.result == 'success'
        run: echo "Trusted fork Nix check succeeded."
