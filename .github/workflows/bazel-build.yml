# Bazel build reusable workflow
#
# Builds all targets (without lint aspects)
name: Bazel Build

on:
  workflow_call:
    inputs:
      targets:
        description: "Bazel targets to build (default: //...)"
        required: false
        type: string
        default: "//..."

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: ./.github/actions/bazel-cache
        id: bazel-cache

      - name: Build
        run: bazel build --keep_going ${{ inputs.targets }}

      - name: Save Bazel cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
