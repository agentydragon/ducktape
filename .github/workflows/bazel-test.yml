# Bazel test reusable workflow
#
# Runs all Bazel tests except those with dedicated workflows:
# - //tools/claude_hooks/... - tested by claude-hooks-release.yml (requires Java, special flags)
name: Bazel Test

on:
  workflow_call:
    inputs:
      targets:
        description: "Bazel targets to test (default excludes packages with dedicated workflows)"
        required: false
        type: string
        default: "//... - //tools/claude_hooks/..."
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key for remote cache (optional)"
        required: false
  workflow_dispatch:
    inputs:
      targets:
        description: "Bazel targets to test (default excludes packages with dedicated workflows)"
        required: false
        type: string
        default: "//... - //tools/claude_hooks/..."
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download targets artifact
        uses: actions/download-artifact@v4
        with:
          name: targets
        continue-on-error: true # May not exist for workflow_dispatch

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}
          rbe_image: ${{ inputs.rbe_image }}

      - name: Run tests
        id: tests
        run: |
          # Prefer per-workflow target file (computed from this workflow's query
          # in workflows.yaml), falling back to shared targets.txt, then inputs.
          # Target files are used instead of GHA string outputs because target
          # lists can exceed shell argument length limits.
          if [[ -f targets-bazel-test.txt ]] && [[ -s targets-bazel-test.txt ]]; then
            TARGET_ARG="--target_pattern_file=targets-bazel-test.txt"
            echo "Using per-workflow targets from targets-bazel-test.txt"
          elif [[ -f targets-bazel-test.txt ]] || { [[ -f targets.txt ]] && [[ ! -s targets.txt ]]; }; then
            # Empty target file means no test targets were affected
            echo "No test targets affected, skipping"
            exit 0
          elif [[ -f targets.txt ]] && [[ -s targets.txt ]]; then
            TARGET_ARG="--target_pattern_file=targets.txt"
            echo "Using shared targets from targets.txt (no per-workflow file)"
          else
            TARGETS="${{ inputs.targets }}"
            if [[ -z "$TARGETS" ]]; then
              echo "No targets specified, skipping tests"
              exit 0
            fi
            TARGET_ARG="$TARGETS"
            echo "Using targets from input: $TARGET_ARG"
          fi

          bazel test --keep_going \
            --build_metadata=ROLE=ci --build_metadata=TAGS=test \
            --test_tag_filters=-live_openai_api \
            --test_env=CI=true --test_env=GITHUB_ACTIONS=true \
            $TARGET_ARG

      - uses: ./.github/actions/collect-test-logs
        if: always()
        with:
          artifact-name: test-logs

      # Skip when all tests were remote-cached (no local XML outputs).
      - name: Test Report
        uses: dorny/test-reporter@v2
        if: always() && hashFiles('bazel-testlogs/**/test.xml') != ''
        with:
          name: Bazel Test Results
          path: "bazel-testlogs/**/test.xml"
          reporter: java-junit
          fail-on-error: false
