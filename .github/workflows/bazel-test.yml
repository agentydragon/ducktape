# Bazel test reusable workflow
#
# Runs all Bazel tests except those with dedicated workflows:
# - //tools/claude_hooks/... - tested by claude-hooks-release.yml (requires Java, special flags)
name: Bazel Test

on:
  workflow_call:
    inputs:
      targets:
        description: "Bazel targets to test (default excludes packages with dedicated workflows)"
        required: false
        type: string
        default: "//... - //tools/claude_hooks/..."
      enable_profiling:
        description: "Enable Bazel profiling (generates downloadable artifacts)"
        required: false
        type: boolean
        default: false
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key for remote cache (optional)"
        required: false
  workflow_dispatch:
    inputs:
      targets:
        description: "Bazel targets to test (default excludes packages with dedicated workflows)"
        required: false
        type: string
        default: "//... - //tools/claude_hooks/..."
      enable_profiling:
        description: "Enable Bazel profiling (generates downloadable artifacts)"
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gatelet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      # Pull Docker image needed by agent_server tests (removed by free-disk-space)
      - name: Pull test Docker image
        run: docker pull python:3.12-slim

      - name: Run tests with coverage
        id: tests
        env:
          # PostgreSQL environment for props and gatelet tests
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          PROFILE_FLAG=""
          if [[ "${{ inputs.enable_profiling }}" == "true" ]]; then
            PROFILE_FLAG="--config=ci-profile"
          fi
          bazel coverage --keep_going \
            --test_tag_filters=-requires_docker,-visual,-e2e \
            --combined_report=lcov \
            --test_env=CI=true --test_env=GITHUB_ACTIONS=true \
            --test_env=PGHOST=localhost --test_env=PGPORT=5432 \
            --test_env=PGUSER=postgres --test_env=PGPASSWORD=postgres \
            --test_env=PGDATABASE=postgres \
            $PROFILE_FLAG \
            ${{ inputs.targets }}

      - uses: ./.github/actions/collect-test-logs
        if: failure()
        with:
          artifact-name: failed-test-logs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: bazel-out/_coverage/_coverage_report.dat
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Bazel profile
        if: inputs.enable_profiling && always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-profile-test-${{ github.run_id }}
          path: |
            bazel-profile.gz
            execution-log.json
          retention-days: 14
          if-no-files-found: warn

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Bazel Test Results
          path: "bazel-testlogs/**/test.xml"
          reporter: java-junit
          fail-on-error: false

      - uses: ./.github/actions/bazel-cache-save
        if: always()
        with:
          cache-hit: ${{ steps.bazel.outputs.cache-hit }}
          cache-key: ${{ steps.bazel.outputs.cache-key }}
          skip_cache: ${{ steps.bazel.outputs.buildbuddy-enabled }}
