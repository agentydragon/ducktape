# Build iron-proxy from the exact unreleased upstream revision that adds
# HTTP/2/gRPC MITM support. Shared by every iron-proxy deployment in the
# cluster, not owned by any one of them.
#
# CLEANUP(added 2026-08-09): delete this workflow and return every consumer to
#   the official upstream image once iron-proxy v0.50.0 ships stable — c90f4fe
#   is already in v0.50.0-rc.1/rc.2, just not in any non-RC tag.
name: Iron Proxy Image

on:
  pull_request:
    branches: [devel]
    paths:
      - "cluster/proxies/iron_proxy_image/**"
      - ".github/workflows/iron-proxy-image.yml"
  push:
    branches: [devel]
    paths:
      - "cluster/proxies/iron_proxy_image/**"
      - ".github/workflows/iron-proxy-image.yml"
  workflow_dispatch:

concurrency:
  group: iron-proxy-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Test, build, and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: git.allegedly.works/ducktape-ci/iron-proxy
      IRON_PROXY_REVISION: c90f4fe31607552ed05675fc7ad239d94b431af2
    steps:
      - name: Checkout Ducktape
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout pinned iron-proxy source
        uses: actions/checkout@v6
        with:
          repository: ironsh/iron-proxy
          ref: ${{ env.IRON_PROXY_REVISION }}
          path: .build/iron-proxy
          persist-credentials: false

      - name: Exclude checkout metadata from the image context
        run: printf '.git\n' > .build/iron-proxy/.dockerignore

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache-dependency-path: .build/iron-proxy/go.sum

      - name: Test HTTP/2 MITM support
        working-directory: .build/iron-proxy
        run: go test -count=1 ./internal/proxy -run 'TestIntegration_(CONNECT|DirectHTTPS)_HTTP2'

      - name: Build image
        run: |
          TS=$(date -u +%Y%m%d%H%M%S)
          TAG_REF=${GITHUB_REF_NAME//\//-}
          REF="$IMAGE:${TAG_REF}-${TS}-${GITHUB_SHA:0:7}"
          echo "REF=$REF" >> "$GITHUB_ENV"
          docker build \
            --build-arg "IRON_PROXY_REVISION=$IRON_PROXY_REVISION" \
            -f cluster/proxies/iron_proxy_image/Dockerfile \
            -t "$REF" \
            .build/iron-proxy

      # Pull requests test and build without credentials. Only a devel push
      # decrypts the existing Forgejo registry bot credential and publishes.
      - uses: ./.github/actions/setup-ci-secrets
        if: github.event_name == 'push'
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Log in to Forgejo registry
        if: github.event_name == 'push'
        run: echo "$FORGEJO_IMAGES_PASSWORD" | docker login git.allegedly.works -u "$FORGEJO_IMAGES_USERNAME" --password-stdin

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$REF"
          echo "pushed \`$REF\` from upstream \`$IRON_PROXY_REVISION\`" >> "$GITHUB_STEP_SUMMARY"
