# Ansible-lint reusable workflow
#
# Full ansible validation with dependencies
name: Ansible-lint

on:
  push:
    branches: [main, devel]
    paths:
      - "ansible/**"
      - ".ansible-lint.yaml"
      - ".github/workflows/ansible-lint.yml"
  pull_request:
    paths:
      - "ansible/**"
      - ".ansible-lint.yaml"
      - ".github/workflows/ansible-lint.yml"
  workflow_dispatch:

jobs:
  ansible-lint-full:
    name: Ansible-lint (full, all playbooks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Only cache roles - collections are bundled in ansible package
      - name: Restore Ansible Galaxy roles cache
        id: cache-ansible-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.ansible/roles
          key: ansible-roles-${{ runner.os }}-${{ hashFiles('ansible/requirements.yaml') }}
          restore-keys: ansible-roles-${{ runner.os }}-

      # Use full 'ansible' package for bundled collections (avoids Galaxy API for collections).
      # Galaxy has known reliability issues - see pre-commit.yml for details.
      - name: Install ansible and ansible-lint
        run: pip install "ansible>=10" ansible-lint

      # Only fetch roles from Galaxy - collections are bundled in ansible package
      - name: Install Ansible Galaxy roles
        run: |
          cd ansible
          ansible-galaxy role install -r requirements.yaml

      # requirements.yaml now names a real collection dependency (ansible.posix, for
      # atlas.yaml's authorized_key task). `ansible-lint --project-dir ansible` (below) scopes
      # its own collections search to ansible/.ansible/collections/ansible_collections ahead of
      # the bundled site-packages copy, and that project-local directory starts out empty, so
      # the module fails to resolve unless something has populated it. `-p` targets that exact
      # path; `--force` is required too, since without it ansible-galaxy sees the requirement
      # already satisfied by the bundled site-packages copy and skips writing into `-p` at all
      # (the "Nothing to do. All requested collections are already installed" this replaces).
      - name: Install Ansible Galaxy collections
        run: |
          cd ansible
          ansible-galaxy collection install -r requirements.yaml -p ./.ansible/collections --force

      - name: Run ansible-lint (thorough mode)
        run: .github/scripts/run-ansible-lint.sh

      - name: Generate ansible-lint summary
        if: always()
        run: |
          echo "### Ansible-lint Results (Full Mode)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode**: Full validation with dependencies" >> $GITHUB_STEP_SUMMARY
          echo "**Flags**: No NODEPS, no --offline (complete checking)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All playbooks passed ansible-lint" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Ansible-lint found issues" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Save Ansible Galaxy roles cache
        if: always() && steps.cache-ansible-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.ansible/roles
          key: ${{ steps.cache-ansible-restore.outputs.cache-primary-key }}
