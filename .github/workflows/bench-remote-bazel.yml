# Dispatch-only trusted replay on the dedicated branch.
name: Trusted matched pre-commit replay
"on": workflow_dispatch
permissions:
  contents: read
env:
  GIT_REPO_DEFAULT_BRANCH: devel
jobs:
  full:
    name: Pre-commit / full
    if: github.repository == 'agentydragon/ducktape' && github.ref == 'refs/heads/codex/ci-feedback-precommit-matched' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR merge
        uses: actions/checkout@v7
        with:
          ref: 8ec08d64147f8a7babc19e763575ec66ea48b299
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source, tree and parents
        id: source
        env:
          SOURCE_COMMIT: 8ec08d64147f8a7babc19e763575ec66ea48b299
          EXPECTED_HEAD_SHA: a03af9ed7b4c622a74a056244e77631577203b42
          REPLAY_PARENT: 8764776ecf5818a6d23e3d4ecd4b175748736be1
          REPLAY_TREE: 5f542625bb8e1a6f218f9c93de5217d351448ad8
        run: |
          set -euo pipefail
          python3 devinfra/ci/pr_mergeability.py verify-source
          test "$(git rev-parse HEAD^1)" = "$REPLAY_PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$REPLAY_TREE"
      - name: Discover changed files for pre-commit
        id: changed-files
        env:
          EXPECTED_HEAD_SHA: a03af9ed7b4c622a74a056244e77631577203b42
          REPLAY_SOURCE: 8ec08d64147f8a7babc19e763575ec66ea48b299
        run: GITHUB_EVENT_NAME=pull_request GITHUB_SHA="$REPLAY_SOURCE" python3 -m devinfra.ci.precommit_file_selection
      - uses: ./.github/actions/setup-nix-devtools
        with:
          installables: .#precommit
      - name: Restore Ansible Galaxy roles cache
        id: cache-ansible-roles-restore
        if: steps.changed-files.outputs.needs_ansible_roles == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.ansible/roles
          key: ansible-roles-${{ runner.os }}-${{ hashFiles('ansible/requirements.yaml') }}
          restore-keys: ansible-roles-${{ runner.os }}-
      - name: Install Ansible Galaxy roles
        if: steps.changed-files.outputs.needs_ansible_roles == 'true'
        run: |
          cd ansible
          ansible-galaxy role install -r requirements.yaml
      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch
        run: |
          GITHUB_EVENT_NAME=pull_request
          # Avoid injecting global-agent into the Nix-provided Node tools.
          unset NODE_OPTIONS
          set -euo pipefail

          # PRs: check only files changed in the PR (fast feedback).
          # Branch pushes + manual runs: check all files (full gate before merge).
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mapfile -d '' -t changed < "$RUNNER_TEMP/pre-commit-changed-files"
            if [ "${#changed[@]}" -eq 0 ]; then
              echo "No files changed; nothing for pre-commit to check."
              exit 0
            fi
            echo "Running pre-commit on ${#changed[@]} changed file(s):"
            printf '  %s\n' "${changed[@]}"
            pre-commit run --files "${changed[@]}" --show-diff-on-failure -v
          else
            pre-commit run --all-files --show-diff-on-failure -v
          fi
      - name: Record installed Nix profile
        run: nix profile list --json
  slim:
    name: Pre-commit / slim
    if: github.repository == 'agentydragon/ducktape' && github.ref == 'refs/heads/codex/ci-feedback-precommit-matched' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR merge
        uses: actions/checkout@v7
        with:
          ref: 8ec08d64147f8a7babc19e763575ec66ea48b299
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source, tree and parents
        id: source
        env:
          SOURCE_COMMIT: 8ec08d64147f8a7babc19e763575ec66ea48b299
          EXPECTED_HEAD_SHA: a03af9ed7b4c622a74a056244e77631577203b42
          REPLAY_PARENT: 8764776ecf5818a6d23e3d4ecd4b175748736be1
          REPLAY_TREE: 5f542625bb8e1a6f218f9c93de5217d351448ad8
        run: |
          set -euo pipefail
          python3 devinfra/ci/pr_mergeability.py verify-source
          test "$(git rev-parse HEAD^1)" = "$REPLAY_PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$REPLAY_TREE"
      - name: Discover changed files for pre-commit
        id: changed-files
        env:
          EXPECTED_HEAD_SHA: a03af9ed7b4c622a74a056244e77631577203b42
          REPLAY_SOURCE: 8ec08d64147f8a7babc19e763575ec66ea48b299
        run: GITHUB_EVENT_NAME=pull_request GITHUB_SHA="$REPLAY_SOURCE" python3 -m devinfra.ci.precommit_file_selection
      - uses: ./.github/actions/setup-nix-devtools
        with:
          installables: .#precommit-ci
      - name: Restore Ansible Galaxy roles cache
        id: cache-ansible-roles-restore
        if: steps.changed-files.outputs.needs_ansible_roles == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.ansible/roles
          key: ansible-roles-${{ runner.os }}-${{ hashFiles('ansible/requirements.yaml') }}
          restore-keys: ansible-roles-${{ runner.os }}-
      - name: Install Ansible Galaxy roles
        if: steps.changed-files.outputs.needs_ansible_roles == 'true'
        run: |
          cd ansible
          ansible-galaxy role install -r requirements.yaml
      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch
        run: |
          GITHUB_EVENT_NAME=pull_request
          # Avoid injecting global-agent into the Nix-provided Node tools.
          unset NODE_OPTIONS
          set -euo pipefail

          # PRs: check only files changed in the PR (fast feedback).
          # Branch pushes + manual runs: check all files (full gate before merge).
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mapfile -d '' -t changed < "$RUNNER_TEMP/pre-commit-changed-files"
            if [ "${#changed[@]}" -eq 0 ]; then
              echo "No files changed; nothing for pre-commit to check."
              exit 0
            fi
            echo "Running pre-commit on ${#changed[@]} changed file(s):"
            printf '  %s\n' "${changed[@]}"
            pre-commit run --files "${changed[@]}" --show-diff-on-failure -v
          else
            pre-commit run --all-files --show-diff-on-failure -v
          fi
      - name: Record installed Nix profile
        run: nix profile list --json
  bazel:
    name: Bazel / common
    if: github.repository == 'agentydragon/ducktape' && github.ref == 'refs/heads/codex/ci-feedback-precommit-matched' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR merge
        uses: actions/checkout@v7
        with:
          ref: 8ec08d64147f8a7babc19e763575ec66ea48b299
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            devinfra/bazel
            devinfra/buildbuddy/ci
            devinfra/ci
            nix
      - name: Verify source, tree and parents
        id: source
        env:
          SOURCE_COMMIT: 8ec08d64147f8a7babc19e763575ec66ea48b299
          EXPECTED_HEAD_SHA: a03af9ed7b4c622a74a056244e77631577203b42
          REPLAY_PARENT: 8764776ecf5818a6d23e3d4ecd4b175748736be1
          REPLAY_TREE: 5f542625bb8e1a6f218f9c93de5217d351448ad8
        run: |
          set -euo pipefail
          python3 devinfra/ci/pr_mergeability.py verify-source
          test "$(git rev-parse HEAD^1)" = "$REPLAY_PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$REPLAY_TREE"
      - uses: ./.github/actions/setup-nix-devtools
        with:
          installables: .#bb .#bbapi
      - name: Derive BuildBuddy invocation IDs
        id: invocation-ids
        run: python3 devinfra/buildbuddy/ci/invocation_ids.py --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --bazel-ci-outputs "$GITHUB_OUTPUT"
      - name: Test + Build + lint
        id: bb-remote
        uses: ./.github/actions/bb-remote
        with:
          compute_units: 8
          runner_recycling_key: ci-feedback-precommit-replay-bazel-v1
          run_from_commit: ${{ steps.source.outputs.sha }}
          linkage_roles: ${{ steps.invocation-ids.outputs.linkage_roles }}
          bazel_invocation_ids: ${{ steps.invocation-ids.outputs.all_invocation_ids }}
          env_overrides: |
            GITHUB_EVENT_NAME=pull_request
            PR_HEAD_SHA=a03af9ed7b4c622a74a056244e77631577203b42
            PR_BASE_SHA=8764776ecf5818a6d23e3d4ecd4b175748736be1
            ${{ steps.invocation-ids.outputs.env_overrides }}
          script: python3 devinfra/ci/bazel_ci.py
      - name: Upload BuildBuddy linkage
        if: always() && steps.source.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: bazel-ci-linkage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.bb-remote.outputs.linkage_json_path }}
          if-no-files-found: warn
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
  artifacts:
    name: Artifacts + imports / common
    if: github.repository == 'agentydragon/ducktape' && github.ref == 'refs/heads/codex/ci-feedback-precommit-matched' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR merge
        uses: actions/checkout@v7
        with:
          ref: 8ec08d64147f8a7babc19e763575ec66ea48b299
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source, tree and parents
        id: source
        env:
          SOURCE_COMMIT: 8ec08d64147f8a7babc19e763575ec66ea48b299
          EXPECTED_HEAD_SHA: a03af9ed7b4c622a74a056244e77631577203b42
          REPLAY_PARENT: 8764776ecf5818a6d23e3d4ecd4b175748736be1
          REPLAY_TREE: 5f542625bb8e1a6f218f9c93de5217d351448ad8
        run: |
          set -euo pipefail
          python3 devinfra/ci/pr_mergeability.py verify-source
          test "$(git rev-parse HEAD^1)" = "$REPLAY_PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$REPLAY_TREE"
      - uses: ./.github/actions/setup-nix-attic
        with:
          attic_token: ${{ secrets.ATTIC_READ_TOKEN }}
          upload: "false"
      - name: Install pinned BuildBuddy CLIs
        run: nix profile install .#bb .#bbapi
      - name: Compute build inputs
        id: inputs
        run: python3 -m devinfra.ci.release_assets nix-wheel-inputs >> "$GITHUB_OUTPUT"
      - name: Choose artifact build invocation
        id: invocation
        run: |
          invocation_id="$(python3 devinfra/buildbuddy/ci/invocation_ids.py \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --role nix-wheel-build)"
          echo "id=$invocation_id" >> "$GITHUB_OUTPUT"
      - parallel:
          - name: Check generated command policies
            run: |
              nix build --no-link --print-out-paths \
                .#checks.x86_64-linux.claude-code-permissions \
                .#checks.x86_64-linux.codex-execpolicy-evaluation \
                .#checks.x86_64-linux.gemini-cli-integration
          - name: Build artifacts from source
            uses: ./.github/actions/bb-remote
            with:
              args: build --invocation_id=${{ steps.invocation.outputs.id }} ${{ steps.inputs.outputs.bazel_targets }}
              linkage_roles: nix-wheel-build
              bazel_invocation_ids: ${{ steps.invocation.outputs.id }}
              runner_recycling_key: ci-feedback-precommit-replay-nix-v1
              run_from_commit: ${{ steps.source.outputs.sha }}
      - name: Fetch artifacts and assemble overrides
        id: overrides
        env:
          INVOCATIONS: ${{ steps.invocation.outputs.id }}
        run: |
          set -euo pipefail
          overrides="$(python3 -m devinfra.ci.nix_artifact_overrides --invocations "$INVOCATIONS")"
          {
            echo 'overrides<<EOF'
            echo "$overrides"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Nix build + imports check
        env:
          DUCKTAPE_ARTIFACT_OVERRIDES: ${{ steps.overrides.outputs.overrides }}
        run: |
          nix build --impure --no-link --print-out-paths \
            ${{ steps.inputs.outputs.nix_checks }} > "$RUNNER_TEMP/artifact-check-paths"
          cat "$RUNNER_TEMP/artifact-check-paths"
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
