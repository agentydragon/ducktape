name: Qualify GitHub Actions job container
on: workflow_dispatch

permissions:
  contents: read
  packages: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/agentydragon/ducktape-ci-launcher-candidate@sha256:89335657cd4ee57e8ef9d4d0d5c9e78b7c4d8a6052508f2ca4029fa5c715b868
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify this checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 devinfra/ci/pr_mergeability.py verify-source
      - name: Build a fresh derivation
        shell: bash
        run: |
          set -euo pipefail
          shell=$(readlink -f /bin/bash)
          nix build --no-link --print-out-paths --impure --expr "
            derivation {
              name = \"ci-launcher-smoke-$GITHUB_RUN_ID\";
              system = builtins.currentSystem;
              builder = (builtins.storePath \"${shell%/bin/bash}\") + \"/bin/bash\";
              args = [ \"-c\" \"echo verified > \$out\" ];
            }
          "
      - name: Launch an exact-commit BuildBuddy remote command
        if: success() || failure()
        uses: ./.github/actions/bb-remote
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        with:
          run_from_commit: ${{ github.sha }}
          script: git rev-parse --verify HEAD
