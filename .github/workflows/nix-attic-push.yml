# Build all Nix flake outputs and push closures to Attic binary cache.
#
# Runs on every push to devel. attic push deduplicates — unchanged outputs
# are a cheap no-op (evaluate flake + check store paths against server).
name: Nix Attic push

on:
  workflow_call:

jobs:
  nix-attic-push:
    name: Build & push to Attic
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Attic client
        run: nix profile install nixpkgs#attic-client

      - name: Configure Attic cache
        run: attic login ducktape https://cache.allegedly.works "${{ secrets.ATTIC_TOKEN }}"

      - name: Build and push all flake outputs
        run: |
          drvs=()
          for host in $(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            drvs+=(".#nixosConfigurations.$host.config.system.build.toplevel")
          done
          for host in $(nix eval --impure --json .#homeConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            drvs+=(".#homeConfigurations.$host.activationPackage")
          done
          drvs+=(".#packages.x86_64-linux.web-session")
          drvs+=(".#devShells.x86_64-linux.default.inputDerivation")
          echo "Building ${#drvs[@]} outputs..."
          nix build --impure "${drvs[@]}" --no-link --print-out-paths | xargs attic push main

      - name: Generate summary
        if: always()
        run: |
          echo "### Nix Attic Push" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "All flake outputs built and pushed to cache" >> $GITHUB_STEP_SUMMARY
          else
            echo "Some outputs failed to build" >> $GITHUB_STEP_SUMMARY
          fi
