# Build all Nix flake outputs and push closures to Attic binary cache.
#
# Runs on every push to devel. attic push deduplicates — unchanged outputs
# are a cheap no-op (evaluate flake + check store paths against server).
name: Nix Attic push

on:
  push:
    branches: [main, devel]
  workflow_dispatch:

# Serialize per branch. Let an active publish finish, but keep only the newest
# pending run (`queue: single`), dropping stale pending commits during a burst.
# Each retained run evaluates the full output set, and attic push skips paths
# already present in the cache.
concurrency:
  group: nix-attic-push-${{ github.ref }}
  cancel-in-progress: false
  queue: single

jobs:
  nix-attic-push:
    name: Build & push ${{ matrix.cache }} to Attic
    runs-on: ubuntu-latest
    strategy:
      # `main` evaluates every NixOS/home closure. Its host-specific failure
      # must not prevent independently publishing the public bootstrap set.
      fail-fast: false
      matrix:
        cache: [main, public]
    # 360 min (GitHub-hosted ceiling) so the first run after enabling
    # extra-substituters (below) can do the one-time cold build of paths
    # cache.nixos.org can't serve — notably the unfree CUDA stack
    # (cuda-merged/ollama for wyrm2), a ~1.5h+ local build that caused the
    # earlier 120-min timeouts — and push them. Once cached, later runs
    # substitute them and finish quickly, so this can be lowered again.
    timeout-minutes: 360
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix-attic
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Install Attic client + nix-fast-build
        # nix-fast-build (+ nix-eval-jobs) drives the parallel eval/build/push in
        # devinfra/ci/nix_attic_build_and_push.sh.
        run: nix profile install nixpkgs#attic-client nixpkgs#nix-fast-build nixpkgs#nix-eval-jobs

      - name: Configure Attic cache
        run: attic login ducktape https://cache.allegedly.works "$ATTIC_TOKEN"

      - name: Build and push ${{ matrix.cache }} outputs
        run: devinfra/ci/nix_attic_build_and_push.sh "${{ matrix.cache }}"

      - name: Generate summary
        if: always()
        run: |
          echo "### Nix Attic Push" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "${{ matrix.cache }} outputs built and pushed to cache" >> $GITHUB_STEP_SUMMARY
          else
            echo "${{ matrix.cache }} outputs failed to build" >> $GITHUB_STEP_SUMMARY
          fi
