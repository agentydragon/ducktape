# Build the codex-pod image (x/codex_pod_image) with Nix and push it to our
# Forgejo OCI registry (git.allegedly.works/ducktape-ci/codex-pod) — not GHCR, so
# the pull credential is provisioned in code (tf/gitops/forgejo-images +
# forgejo-images-creds) rather than a manual "make public" GHCR click.
#
# Like haku-managed-agent-image.yml this is a Nix flake output rather than a Dockerfile
# build, but `.#codex-pod-image` is a dockerTools.buildLayeredImage docker
# archive (not a NixOS rootfs tar), so it is `skopeo copy`-ed to the registry.
# Flux picks up the pushed `devel-<ts>-<sha7>` tag via the codex-pod ImagePolicy
# (cluster/k8s/flux-image-automation-forgejo/).
name: codex-pod image

on:
  push:
    branches: [devel]
    paths:
      - "x/codex_pod_image/**"
      - "flake.lock"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/codex-pod-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    name: Build & push codex-pod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: git.allegedly.works/ducktape-ci/codex-pod
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nix-attic
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Build image
        run: nix build .#codex-pod-image --print-build-logs

      - name: Compute tag
        id: meta
        run: |
          SHA="${{ github.sha }}"
          echo "pin_tag=${GITHUB_REF_NAME}-$(date -u +%Y%m%d%H%M%S)-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Gate the push to devel so feature branches don't publish tags the Flux
      # ImagePolicy would immediately deploy (matches push-images.yml).
      - name: Push to Forgejo
        if: github.ref_name == 'devel'
        run: |
          ref="$IMAGE:${{ steps.meta.outputs.pin_tag }}"
          # result is a dockerTools.buildLayeredImage docker archive (gzip tar).
          skopeo copy --insecure-policy \
            --dest-creds "$FORGEJO_IMAGES_USERNAME:$FORGEJO_IMAGES_PASSWORD" \
            "docker-archive:$(readlink -f result)" "docker://$ref"
          echo "pushed \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
