# Build the stateless CPAP gateway qcow2 and publish it as a KubeVirt
# containerDisk image in the private Forgejo registry. Flux tracks the
# resulting devel-* tags through the cpap-gateway ImagePolicy.
name: cpap-gateway image

on:
  push:
    branches: [devel]
    paths:
      # keep-sorted start
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/cpap-gateway-image.yml"
      - ".github/workflows/nix-containerdisk-publish.yml"
      - "cpap/gateway/**"
      - "flake.lock"
      - "flake.nix"
      # The health check reaches the guest through its artifact pin; unrelated pin
      # bumps rebuild an unchanged disk, which the publish step does not push.
      - "nix/artifact-pins.json"
      - "nix/flake/packages.nix"
      - "nix/nixos/modules/vm-hardware.nix"
      # keep-sorted end
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    uses: ./.github/workflows/nix-containerdisk-publish.yml
    with:
      flake_output: cpap-gateway-container-disk
      image_name: cpap-gateway
      image: git.allegedly.works/ducktape-ci/cpap-gateway
    secrets:
      FORGEJO_IMAGES_USERNAME: ${{ secrets.FORGEJO_IMAGES_USERNAME }}
      FORGEJO_IMAGES_PASSWORD: ${{ secrets.FORGEJO_IMAGES_PASSWORD }}
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
