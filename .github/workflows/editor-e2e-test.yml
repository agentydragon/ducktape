# Editor agent E2E test reusable workflow
#
# Runs editor_agent tests that require Docker
name: Editor E2E Test

on:
  workflow_call:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: ./.github/actions/bazel-cache
        id: bazel-cache

      - name: Build and load editor runtime image
        run: bazel run //editor_agent/runtime:load

      - name: Run E2E tests
        run: |
          bazel test --keep_going \
            --test_tag_filters=requires_docker \
            --test_env=CI=true --test_env=GITHUB_ACTIONS=true \
            //editor_agent/...

      - name: Collect test logs
        if: failure()
        run: |
          mkdir -p e2e-test-logs
          TESTLOGS_DIR=$(bazel info bazel-testlogs 2>/dev/null || echo "bazel-testlogs")
          if [ -d "$TESTLOGS_DIR" ]; then
            find "$TESTLOGS_DIR" -name "test.xml" | while read xml; do
              test_dir=$(dirname "$xml")
              target_path="${test_dir#$TESTLOGS_DIR/}"
              mkdir -p "e2e-test-logs/$target_path"
              cp "$test_dir/test.log" "e2e-test-logs/$target_path/" 2>/dev/null || true
              cp "$test_dir/test.xml" "e2e-test-logs/$target_path/" 2>/dev/null || true
            done
          fi

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-e2e-test-logs-${{ github.run_id }}
          path: e2e-test-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Editor E2E Test Results
          path: "bazel-testlogs/**/test.xml"
          reporter: java-junit
          fail-on-error: false

      - uses: ./.github/actions/bazel-cache-save
        if: always()
        with:
          cache-hit: ${{ steps.bazel-cache.outputs.cache-hit }}
          cache-key: ${{ steps.bazel-cache.outputs.cache-key }}
