# Pre-commit checks reusable workflow
#
# Runs pre-commit safety checks and formatters; Bazel aspects run in bazel-ci.yml.
name: Pre-commit checks

on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:

# Cancel obsolete PR checks; other events get independent concurrency groups.
concurrency:
  group: pre-commit-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Discover changed files for pre-commit
        id: changed-files
        run: python3 devinfra/ci/precommit_file_selection.py

      # ============================================================================
      # ENVIRONMENT SETUP
      # ============================================================================

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: precommit

      # Cache Ansible Galaxy roles (required for syntax check - meta/main.yml dependencies)
      - name: Restore Ansible Galaxy roles cache
        id: cache-ansible-roles-restore
        if: steps.changed-files.outputs.needs_ansible_roles == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.ansible/roles
          key: ansible-roles-${{ runner.os }}-${{ hashFiles('ansible/requirements.yaml') }}
          restore-keys: ansible-roles-${{ runner.os }}-

      # Roles ARE needed for syntax checking - ansible-playbook --syntax-check resolves
      # role dependencies from meta/main.yml files (e.g., legacy_gui depends on
      # petermosmans.customize-gnome)
      - name: Install Ansible Galaxy roles
        if: steps.changed-files.outputs.needs_ansible_roles == 'true'
        run: |
          cd ansible
          ansible-galaxy role install -r requirements.yaml

      # ============================================================================
      # PRE-COMMIT RUN
      # ============================================================================

      - name: Run pre-commit
        env:
          # no-commit-to-branch is a local guard against committing directly to
          # devel/main. CI deliberately runs pre-commit against the protected
          # branch's own checkout, where that hook would always fail — skip it here.
          SKIP: no-commit-to-branch
        run: |
          # Avoid injecting global-agent into the Nix-provided Node tools.
          unset NODE_OPTIONS
          set -euo pipefail

          # PRs: check only files changed in the PR (fast feedback).
          # Branch pushes + manual runs: check all files (full gate before merge).
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mapfile -d '' -t changed < "$RUNNER_TEMP/pre-commit-changed-files"
            if [ "${#changed[@]}" -eq 0 ]; then
              echo "No files changed; nothing for pre-commit to check."
              exit 0
            fi
            echo "Running pre-commit on ${#changed[@]} changed file(s):"
            printf '  %s\n' "${changed[@]}"
            pre-commit run --files "${changed[@]}" --show-diff-on-failure -v
          else
            pre-commit run --all-files --show-diff-on-failure -v
          fi

      # ============================================================================
      # ANSIBLE CACHE SAVE
      # ============================================================================

      - name: Save Ansible Galaxy roles cache
        if: >-
          always() &&
          steps.changed-files.outputs.needs_ansible_roles == 'true' &&
          steps.cache-ansible-roles-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.ansible/roles
          key: ${{ steps.cache-ansible-roles-restore.outputs.cache-primary-key }}
