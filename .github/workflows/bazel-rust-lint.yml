# Bazel Rust lint reusable workflow
#
# Runs Rust linting via Bazel aspects:
# - Rust: clippy
name: Bazel Rust Lint

on:
  workflow_call:
    inputs:
      targets:
        description: "Bazel targets to lint (default: //finance/...)"
        required: false
        type: string
        default: "//finance/..."
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key for remote cache (optional)"
        required: false
  workflow_dispatch:
    inputs:
      targets:
        description: "Bazel targets to lint (default: //finance/...)"
        required: false
        type: string
        default: "//finance/..."

jobs:
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}
          rbe_image: ${{ inputs.rbe_image }}
          extra_hash: ${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      - name: Rust lint
        run: |
          bazel build --keep_going --config=rust-check \
            --build_metadata=ROLE=ci --build_metadata=TAGS=rust-lint \
            ${{ inputs.targets }}
