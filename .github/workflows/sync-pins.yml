name: Sync artifact pins
# Periodically sync npins/sources.json with the latest GitHub Releases.
# Replaces per-commit dispatch from bb_release.py — one commit per cycle
# regardless of how many releases landed since the last sync.
#
# Pushes via the ducktape-automation GitHub App so the commit is bypass-actor
# eligible for the main-protection ruleset (github-actions can't bypass on
# personal-account repos). The hardcoded `devel` ref + push target will need
# to flip to `main` when ducktape's default branch flips.
"on":
  schedule:
    # GitHub throttles scheduled workflows to ~30 min intervals regardless of cron.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
concurrency:
  group: sync-pins
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  sync:
    name: Sync pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: devel

      - uses: ./.github/actions/mint-automation-token
        id: app
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Sync pins with latest releases
        id: sync
        run: pip install uv && uv run devinfra/ci/sync_pins.py
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

      - name: Commit and push if changed
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app_slug }}
          APP_USER_ID: ${{ steps.app.outputs.user_id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add npins/sources.json
          if git diff --cached --quiet; then
            echo "No pin changes"
            exit 0
          fi
          git commit -m "chore: sync artifact pins (${{ steps.sync.outputs.updated }})"
          git pull --rebase origin devel
          # Replace actions/checkout's basic-auth Authorization header with the
          # App installation token so the push is App-attributed.
          #
          # actions/checkout writes its `http.https://github.com/.extraheader`
          # value into a temp file under $RUNNER_TEMP and pulls it in via
          # `includeif.gitdir:<repo>.path = <temp file>` entries in the local
          # config. `git config --unset-all` only edits the local config, so
          # it cannot remove a value that lives in an includeif'd file —
          # adding our own value alongside results in TWO Authorization
          # headers on the wire and GitHub returns "Duplicate header:
          # Authorization" 400.
          #
          # Drop the includeif entries first to disconnect the credentials
          # file, then set our own extraheader in the local config.
          for key in $(git config --local --name-only --get-regexp '^includeif\.gitdir:.*\.path$' || true); do
            git config --local --unset-all "$key"
          done
          git config 'http.https://github.com/.extraheader' "Authorization: Bearer ${APP_TOKEN}"
          git push origin "HEAD:devel"
