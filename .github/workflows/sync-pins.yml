name: Sync artifact pins
# Periodically sync nix/artifact-pins.json with the latest GitHub Releases.
# Replaces per-commit dispatch from bb_release.py — one commit per cycle
# regardless of how many releases landed since the last sync.
#
# The hardcoded `devel` ref and push target will need to flip to `main` when
# ducktape's default branch flips.
"on":
  schedule:
    # GitHub throttles scheduled workflows to ~30 min intervals regardless of cron.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
concurrency:
  group: sync-pins
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  sync:
    name: Sync pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: devel

      - uses: ./.github/actions/mint-automation-token
        id: app
        with:
          private_key: ${{ secrets.DUCKTAPE_AUTOMATION_PRIVATE_KEY }}

      - name: Sync pins with latest releases
        id: sync
        run: pip install uv && uv run devinfra/ci/sync_pins.py
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

      - name: Push pin changes as the automation App
        uses: ./.github/actions/commit-and-push-as-app
        with:
          token: ${{ steps.app.outputs.token }}
          app_slug: ${{ steps.app.outputs.app_slug }}
          user_id: ${{ steps.app.outputs.user_id }}
          paths: nix/artifact-pins.json
          message: "chore: sync artifact pins (${{ steps.sync.outputs.updated }})"
          branch: devel
