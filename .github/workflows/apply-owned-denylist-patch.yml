name: Apply owned denylist patch

on:
  push:
    branches:
      - haku-console/deny-agent-copilot-tools

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python tools/apply_owned_denylist.py
          rm tools/apply_owned_denylist.py .github/workflows/apply-owned-denylist-patch.yml
          git diff --check
          git config user.name 'haku-console-agent'
          git config user.email 'haku-console-agent@users.noreply.github.com'
          git add -A
          git commit -m 'haku-console: deny Copilot tools to agents'
          git push
