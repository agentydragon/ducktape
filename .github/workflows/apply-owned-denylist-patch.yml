name: Apply owned denylist patch

on:
  push:
    branches:
      - haku-console/deny-agent-copilot-tools

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and remove bootstrap workflow
        env:
          PATCH_GZIP_B64: 
        run: |
          printf '%s' "$PATCH_GZIP_B64" | base64 --decode | gzip --decompress > /tmp/deny-agent-copilot-tools.patch
          git apply --check /tmp/deny-agent-copilot-tools.patch
          git apply /tmp/deny-agent-copilot-tools.patch
          rm .github/workflows/apply-owned-denylist-patch.yml
          git config user.name 'haku-console-agent'
          git config user.email 'haku-console-agent@users.noreply.github.com'
          git add -A
          git commit -m 'haku-console: deny Copilot tools to agents'
          git push
