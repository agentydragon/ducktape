name: Retry failed executor snapshot restore

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  retry:
    if: >-
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    concurrency: retry-snapshot-restore-${{ github.event.workflow_run.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-devtools
        with:
          installables: ".#bbapi"
      - name: Check the failed test invocation and rerun its job once
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 -m devinfra.ci.retry_snapshot_restore
