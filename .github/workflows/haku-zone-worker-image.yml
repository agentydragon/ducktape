# Build and push the Haku zone-worker image (Claude Code CLI + Codex CLI +
# entrypoint wrapper) to GHCR. Consumed by validator-stamped Jobs in the Haku
# worker zones (haku/plans/multi_agent.md).
name: Haku Zone Worker Image

on:
  push:
    branches: [devel]
    paths:
      - "haku/dispatch/worker/**"
      - ".github/workflows/haku-zone-worker-image.yml"
  workflow_dispatch:

concurrency:
  group: haku-zone-worker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/ghcr-build-push
        with:
          image: ghcr.io/${{ github.repository_owner }}/haku-zone-worker
          context: haku/dispatch/worker
          cache_from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/haku-zone-worker:buildcache
          cache_to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/haku-zone-worker:buildcache,mode=max
