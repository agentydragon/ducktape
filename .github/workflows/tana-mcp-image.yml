# Build and push the Tana MCP Desktop image to the Forgejo OCI registry.
name: Tana MCP Image

on:
  push:
    branches: [devel]
    paths: ["tana/mcp_server/**"]
  workflow_dispatch:

concurrency:
  group: tana-mcp-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push
    if: github.ref_name == 'devel'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: git.allegedly.works/ducktape-ci/tana-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/oci-build-push
        with:
          image: ${{ env.IMAGE }}
          registry: git.allegedly.works
          login_username: ${{ secrets.FORGEJO_IMAGES_USERNAME }}
          login_password: ${{ secrets.FORGEJO_IMAGES_PASSWORD }}
          context: tana/mcp_server
          cache_from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache_to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
