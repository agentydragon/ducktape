# Build and push the Tana MCP Desktop image to GHCR.
#
# Triggers:
#   - push to devel changing tana/mcp_server/** (tags :latest too)
#   - workflow_dispatch: manual trigger (tags :latest too)
#   - workflow_call (from ci.yml): tags :<sha> + :<timestamp>-<sha7>
name: Tana MCP Image

on:
  push:
    branches: [devel]
    paths: ["tana/mcp_server/**"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: tana-mcp-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/ghcr-build-push
        with:
          image: ghcr.io/${{ github.repository_owner }}/tana-desktop
          context: tana/mcp_server
          github_token: ${{ secrets.GITHUB_TOKEN }}
