# Bazel check reusable workflow
#
# Build + all quality checks in a single pass via --config=check:
# - Python: ruff (lint), mypy (typecheck)
# - JS/TS: ESLint
# - Rust: clippy, rustfmt
name: Bazel Check

on:
  workflow_call:
    inputs:
      targets:
        description: "Bazel targets to build and check (default: //...)"
        required: false
        type: string
        default: "//..."
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key for remote cache (optional)"
        required: false
  workflow_dispatch:
    inputs:
      targets:
        description: "Bazel targets to build and check (default: //...)"
        required: false
        type: string
        default: "//..."

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download targets artifact
        uses: actions/download-artifact@v4
        with:
          name: targets
        continue-on-error: true # May not exist for workflow_dispatch

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: ./.github/actions/setup-bazel
        id: bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}
          rbe_image: ${{ inputs.rbe_image }}

      - name: Build and check
        run: |
          # Use target_pattern_file if artifact exists (avoids shell arg length limits)
          if [[ -f targets.txt ]] && [[ -s targets.txt ]]; then
            TARGET_ARG="--target_pattern_file=targets.txt"
            echo "Using targets from artifact file"
          elif [[ -f targets.txt ]]; then
            # Empty targets.txt means no Bazel targets were affected (e.g.,
            # only workflow YAML files changed). Skip rather than letting
            # bazel exit 4 on zero matched targets.
            echo "targets.txt is empty, skipping check"
            exit 0
          else
            TARGET_ARG="${{ inputs.targets }}"
            echo "Using targets from input: $TARGET_ARG"
          fi
          # --config=check runs: ruff, ESLint, mypy, clippy, rustfmt
          # --strategy=mypy=local avoids sandbox copying overhead for mypy
          bazel build --keep_going --config=check --strategy=mypy=local \
            --build_metadata=ROLE=ci --build_metadata=TAGS=check \
            $TARGET_ARG
