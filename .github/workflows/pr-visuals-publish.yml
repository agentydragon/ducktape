# Publishes visual reviews for the Bazel run of a same-repo PR or devel push (`CI`) and of
# an agent-fork PR (`Trusted fork PR CI`). The publisher finds a PR run's PR and base
# commit from the run's head ref and commit, never from the event's `pull_requests`: that
# is empty for a fork and is resolved at delivery time, not for the run's commit.
#
# Only the agent fork is followed, the identity trusted-fork-pr-ci.yml runs without
# review. A reviewer approving another fork's CI run authorises the run, not hosting its
# images in our bucket and its text in a bot comment. Keep the owner below in sync with
# the trusted authors there.
name: Publish PR visuals

on:
  workflow_run:
    workflows: [CI, Trusted fork PR CI]
    types: [in_progress, completed]

concurrency:
  # A completed event supersedes the announcement or publication for the same CI
  # attempt, including when CI was cancelled. A rerun or another CI workflow for
  # the same head must not cancel this attempt's publication.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

jobs:
  announce:
    if: >-
      github.event.action == 'in_progress' &&
      (
        (github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event.workflow_run.event == 'pull_request_target' &&
         github.event.workflow_run.head_repository.owner.login == 'agentydragon-agent')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: devel

      - name: Record visual publisher artifact
        run: jq -e '.pins["pr-visuals"]' nix/artifact-pins.json

      - uses: ./.github/actions/setup-nix-devtools
        with:
          installables: ".#pr-visuals"

      - name: Announce visual review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The commit the run was triggered on, which never moves (see `publish`).
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr-visuals-announce \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$HEAD_SHA" \
            --status in_progress \
            --summary "Bazel CI is running; visual publication will follow." \
            --details-url "${{ github.event.workflow_run.html_url }}" \
            --external-id "pr-visual-review:${{ github.event.workflow_run.id }}:${{ github.event.workflow_run.run_attempt }}"

  # A cancelled CI run has no visual publication. Other completed runs still
  # publish their available artifacts, including when unrelated tests failed.
  publish:
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      (
        (github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event.workflow_run.event == 'pull_request_target' &&
         github.event.workflow_run.head_repository.owner.login == 'agentydragon-agent') ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'devel')
      )
    runs-on: ubuntu-latest
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      # Install the release pinned by trusted devel, never the PR's implementation.
      # PR-controlled code produced the PNGs, but never receives S3 credentials.
      - uses: actions/checkout@v7
        with:
          ref: devel

      - name: Record visual publisher artifact
        run: jq -e '.pins["pr-visuals"]' nix/artifact-pins.json

      - uses: ./.github/actions/setup-nix-devtools
        with:
          installables: ".#pr-visuals"

      - name: Publish visual review
        id: visuals
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PR_VISUALS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PR_VISUALS_SECRET_KEY }}
          AWS_REGION: us-east-1
          GITHUB_TOKEN: ${{ github.token }}
          # The commit this run actually tested, for both event kinds: the PR head the run
          # was triggered on (not a merge sha), which never moves.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # PR run → its OWNER:BRANCH, from which the publisher looks up the PR and its
          # base commit. Passed through the environment alone: a branch name is free text.
          PR_HEAD_REF: ${{ github.event.workflow_run.event != 'push' && format('{0}:{1}', github.event.workflow_run.head_repository.owner.login, github.event.workflow_run.head_branch) || '' }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          args=(
            --ci-run-id "${{ github.event.workflow_run.id }}"
            --ci-run-attempt "${{ github.event.workflow_run.run_attempt }}"
            --work-dir "$RUNNER_TEMP/pr-visuals"
            --sha "$HEAD_SHA"
            --repository "$GITHUB_REPOSITORY"
            --endpoint https://s3.allegedly.works
            --bucket pr-visuals
            --public-base-url https://s3.allegedly.works/pr-visuals
            --ci-conclusion "$CI_CONCLUSION"
            --ci-details-url "$CI_RUN_URL"
          )
          if [ -n "$PR_HEAD_REF" ]; then
            args+=(--pull-request-head "$PR_HEAD_REF")
            args+=(--check-external-id "pr-visual-review:${{ github.event.workflow_run.id }}:${{ github.event.workflow_run.run_attempt }}")
          fi
          pr-visuals-publish "${args[@]}"

  # Close the announcement, if one was posted before the upstream cancellation.
  # This job has no BuildBuddy or S3 credential and never downloads visual assets.
  cancel:
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.conclusion == 'cancelled' &&
      (
        (github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event.workflow_run.event == 'pull_request_target' &&
         github.event.workflow_run.head_repository.owner.login == 'agentydragon-agent')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: devel

      - name: Record visual publisher artifact
        run: jq -e '.pins["pr-visuals"]' nix/artifact-pins.json

      - uses: ./.github/actions/setup-nix-devtools
        with:
          installables: ".#pr-visuals"

      - name: Complete cancelled visual review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr-visuals-announce \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$HEAD_SHA" \
            --status completed \
            --conclusion cancelled \
            --summary "Bazel CI was cancelled; visual publication stopped." \
            --details-url "${{ github.event.workflow_run.html_url }}" \
            --external-id "pr-visual-review:${{ github.event.workflow_run.id }}:${{ github.event.workflow_run.run_attempt }}"
