name: Publish PR visuals

on:
  workflow_run:
    workflows: [CI]
    types: [in_progress, completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

jobs:
  announce:
    if: >-
      github.event.action == 'in_progress' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: devel

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Announce visual review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
        run: |
          bb run //devinfra/pr_visuals:check_run_bin -- \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$HEAD_SHA" \
            --status in_progress \
            --summary "Bazel CI is running; visual publication will follow." \
            --details-url "${{ github.event.workflow_run.html_url }}" \
            --external-id "pr-visual-review:${{ github.event.workflow_run.id }}"

  publish:
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      (
        (github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.pull_requests[0] != null) ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'devel')
      )
    runs-on: ubuntu-latest
    steps:
      # This privileged workflow always executes the trusted default-branch implementation.
      # PR-controlled code produced the PNGs, but never receives S3 credentials.
      - uses: actions/checkout@v6
        with:
          ref: devel

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Download BuildBuddy linkage
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: bazel-ci-linkage-*
          merge-multiple: true
          path: linkage

      - name: Publish visual review
        id: visuals
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PR_VISUALS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PR_VISUALS_SECRET_KEY }}
          AWS_REGION: us-east-1
          GITHUB_TOKEN: ${{ github.token }}
          # PR run → comment on the PR. Devel push → publish the bundle, no comment.
          HEAD_SHA: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].head.sha || github.event.workflow_run.head_sha }}
          # PR run → the base devel commit whose published bundle is the diff baseline.
          BASE_SHA: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].base.sha || '' }}
          PR_NUMBER: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number || '' }}
        run: |
          args=(
            --linkage-dir "$PWD/linkage"
            --work-dir "$RUNNER_TEMP/pr-visuals"
            --sha "$HEAD_SHA"
            --repository "$GITHUB_REPOSITORY"
            --endpoint https://s3.allegedly.works
            --bucket pr-visuals
            --public-base-url https://s3.allegedly.works/pr-visuals
          )
          if [ -n "$BASE_SHA" ]; then
            args+=(--base-sha "$BASE_SHA")
          fi
          if [ -n "$PR_NUMBER" ]; then
            args+=(--pull-request "$PR_NUMBER")
            args+=(--check-external-id "pr-visual-review:${{ github.event.workflow_run.id }}")
          fi
          bb run //devinfra/pr_visuals:publisher_bin -- "${args[@]}"

  finalize-ci-failure:
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: devel

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Finalize visual review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          bb run //devinfra/pr_visuals:check_run_bin -- \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$HEAD_SHA" \
            --status completed \
            --conclusion "$CI_CONCLUSION" \
            --summary "Bazel CI concluded $CI_CONCLUSION; visual publication did not run." \
            --details-url "${{ github.event.workflow_run.html_url }}" \
            --external-id "pr-visual-review:${{ github.event.workflow_run.id }}"
