name: Publish PR visuals

on:
  workflow_run:
    workflows: [CI]
    types: [in_progress, completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

jobs:
  announce:
    if: >-
      github.event.action == 'in_progress' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: devel

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Announce visual review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The run's own head, never `pull_requests[0].head.sha`: that field is
          # resolved when the event is delivered, so it reports whatever the PR's
          # head is by then. Push twice in quick succession and the older run's
          # events arrive describing the newer commit. See the `publish` job.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          bb run //devinfra/pr_visuals:check_run_bin -- \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$HEAD_SHA" \
            --status in_progress \
            --summary "Bazel CI is running; visual publication will follow." \
            --details-url "${{ github.event.workflow_run.html_url }}" \
            --external-id "pr-visual-review:${{ github.event.workflow_run.id }}"

  # A flaky non-visual test must not leave the base commit without a visual
  # bundle. The publisher only advances pointers for manifests it actually
  # receives, so an incomplete test run cannot manufacture one.
  publish:
    if: >-
      github.event.action == 'completed' &&
      (
        (github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.pull_requests[0] != null) ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'devel')
      )
    runs-on: ubuntu-latest
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      # This privileged workflow always executes the trusted default-branch implementation.
      # PR-controlled code produced the PNGs, but never receives S3 credentials.
      - uses: actions/checkout@v7
        with:
          ref: devel

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Download BuildBuddy linkage
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: bazel-ci-linkage-*
          merge-multiple: true
          path: linkage

      - name: Publish visual review
        id: visuals
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PR_VISUALS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PR_VISUALS_SECRET_KEY }}
          AWS_REGION: us-east-1
          GITHUB_TOKEN: ${{ github.token }}
          # The commit this run actually tested, for both event kinds.
          #
          # This was `pull_requests[0].head.sha` on the PR path, which is not that:
          # GitHub resolves it at delivery time, so it names the PR's head *now*. A
          # run cancelled by a newer push therefore reported its `cancelled` against
          # the commit that superseded it, and — worse than the wrong title — uploaded
          # its bundle under that commit's S3 key, making the newer commit's baseline
          # the older commit's images. `workflow_run.head_sha` is the PR head the run
          # was triggered on (not a merge sha) and never moves.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # PR run → the base devel commit whose published bundle is the diff baseline.
          BASE_SHA: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].base.sha || '' }}
          PR_NUMBER: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number || '' }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          args=(
            --linkage-dir "$PWD/linkage"
            --work-dir "$RUNNER_TEMP/pr-visuals"
            --sha "$HEAD_SHA"
            --repository "$GITHUB_REPOSITORY"
            --endpoint https://s3.allegedly.works
            --bucket pr-visuals
            --public-base-url https://s3.allegedly.works/pr-visuals
            --ci-conclusion "$CI_CONCLUSION"
            --ci-details-url "$CI_RUN_URL"
          )
          if [ -n "$BASE_SHA" ]; then
            args+=(--base-sha "$BASE_SHA")
          fi
          if [ -n "$PR_NUMBER" ]; then
            args+=(--pull-request "$PR_NUMBER")
            args+=(--check-external-id "pr-visual-review:${{ github.event.workflow_run.id }}")
          fi
          bb run //devinfra/pr_visuals:publisher_bin -- "${args[@]}"
