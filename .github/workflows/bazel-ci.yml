# Bazel test + build via bb remote (runs on BuildBuddy RBE).
name: Bazel CI

on:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy remote execution and cache credential"
        required: true
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
      environment:
        description: "Protected GitHub Environment to gate this job (optional)"
        required: false
        type: string
        default: ""
      source_commit:
        description: "Exact commit to check out and run (defaults to github.sha)"
        required: false
        type: string
        default: ""
      source_ref:
        description: "Ref to resolve after the caller's trust decision instead of trusting an event-time commit SHA"
        required: false
        type: string
        default: ""
      pr_head_sha:
        description: "Expected PR head parent when source_commit is a synthetic merge"
        required: false
        type: string
        default: ""
      pr_base_sha:
        description: "Event-time PR base SHA, used only for drift diagnostics"
        required: false
        type: string
        default: ""
      allow_unsafe_pr_checkout:
        description: "Opt in to checkout's pull_request_target fork checkout after the caller establishes trust"
        required: false
        type: boolean
        default: false
    outputs:
      bazel_invocation_ids:
        description: >
          The Bazel invocations this run performed. Publish planners read what
          these built — output digests, per-target test verdicts — rather than
          rebuilding the same targets. Empty when the job did not run, which
          callers must treat as "prove nothing", not "nothing changed".
        value: ${{ jobs.bazel-ci.outputs.bazel_invocation_ids }}
  workflow_dispatch:

concurrency:
  group: bazel-ci-${{ inputs.pr_head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_REPO_DEFAULT_BRANCH: devel

jobs:
  bazel-ci:
    name: Test & Build
    outputs:
      bazel_invocation_ids: ${{ steps.bb-remote.outputs.bazel_invocation_ids }}
    environment: ${{ inputs.environment || null }}
    runs-on: ubuntu-latest
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || inputs.source_commit || github.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: ${{ inputs.allow_unsafe_pr_checkout }}

      # pull_request_target payloads can pair the current head SHA with an old
      # merge_commit_sha. Resolve the live merge ref only after the caller's
      # trust decision, then freeze it to this SHA and prove its second parent
      # is the trusted head before loading any PR-controlled local action.
      - name: Resolve and verify source revision
        id: source
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.pr_head_sha }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          resolved_sha=$(git rev-parse HEAD)
          if [[ -z "$SOURCE_REF" ]]; then
            expected_sha="${SOURCE_COMMIT:-$GITHUB_SHA}"
            if [[ "$resolved_sha" != "$expected_sha" ]]; then
              echo "::error::checked out $resolved_sha, expected $expected_sha"
              exit 1
            fi
          fi
          if [[ -n "$EXPECTED_HEAD_SHA" ]]; then
            actual_head=$(git rev-parse HEAD^2)
            if [[ "$actual_head" != "$EXPECTED_HEAD_SHA" ]]; then
              echo "::error::merge head $actual_head, expected trusted PR head $EXPECTED_HEAD_SHA"
              exit 1
            fi
          fi
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved source revision: $resolved_sha"

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      # Combined test + build in one bb-remote `--script` invocation:
      # - Saves one Firecracker VM allocation per CI run.
      # - Avoids `bb remote build`'s post-run `downloadOutputs` path, which
      #   currently fails with "Exhausted all peers" — see
      #   devinfra/debug/bb_remote_peers_exhausted.md.
      # `&&` matches the previous step ordering: build runs only if test passed.
      #
      # run_from_commit: have the runner check out the exact commit instead of mirroring the
      # PR as a patchset (base=devel + diff). The CI checkout is a clean commit (no
      # uncommitted changes for the patch path to drop), so checking it out skips patch sync
      # entirely — no patchset to generate, transfer, or apply. On pull_request
      # events, github.sha is GitHub's synthetic refs/pull/<n>/merge commit, so Bazel evaluates
      # and tests the PR combined with its event-time base instead of the isolated PR head.
      # GitHub serves that commit by exact SHA even though it is not an origin branch. On
      # push/dispatch, github.sha is the pushed/dispatched commit. See
      # devinfra/docs/bb_remote_internals.md §"Git state synchronization"
      # ("--run_from_commit disables patches").
      # Bazel names its invocations from the run's identity rather than CI discovering
      # them afterwards, so a consumer can find them even when this run is cancelled
      # mid-flight. See devinfra/ci/invocation_ids.py.
      - name: Derive BuildBuddy invocation IDs
        id: invocation-ids
        run: |
          for role in test build; do
            id=$(python3 devinfra/ci/invocation_ids.py \
              --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --role "$role")
            echo "$role=$id" >> "$GITHUB_OUTPUT"
          done

      - name: Test + Build + lint
        id: bb-remote
        uses: ./.github/actions/bb-remote
        with:
          rbe_image: ${{ inputs.rbe_image }}
          run_from_commit: ${{ steps.source.outputs.sha }}
          linkage_roles: test,build
          # The build itself lives in devinfra/ci/bazel_ci.sh — see that file's header for
          # why (a ~200-line bash program in a YAML string is invisible to shfmt and
          # shellcheck). It runs on the BuildBuddy runner VM, which has the repo checked
          # out but NOT the GitHub Actions environment, so every value it needs is
          # forwarded explicitly below rather than being ambient.
          env_overrides: |
            GITHUB_EVENT_NAME=${{ github.event_name }}
            PR_HEAD_SHA=${{ inputs.pr_head_sha || github.event.pull_request.head.sha }}
            PR_BASE_SHA=${{ inputs.pr_base_sha || github.event.pull_request.base.sha }}
            TEST_INVOCATION_ID=${{ steps.invocation-ids.outputs.test }}
            BUILD_INVOCATION_ID=${{ steps.invocation-ids.outputs.build }}
          script: bash devinfra/ci/bazel_ci.sh
      - name: Upload BuildBuddy linkage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-ci-linkage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.bb-remote.outputs.linkage_json_path }}
          if-no-files-found: warn
