# Bazel test + build via bb remote (runs on BuildBuddy RBE).
name: Bazel CI

on:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
  workflow_dispatch:

concurrency:
  group: bazel-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_REPO_DEFAULT_BRANCH: devel

jobs:
  bazel-ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      # Combined test + build in one bb-remote `--script` invocation:
      # - Saves one Firecracker VM allocation per CI run.
      # - Avoids `bb remote build`'s post-run `downloadOutputs` path, which
      #   currently fails with "Exhausted all peers" — see
      #   devinfra/debug/bb_remote_peers_exhausted.md.
      # `&&` matches the previous step ordering: build runs only if test passed.
      #
      # run_from_commit: have the runner check out the exact commit instead of mirroring the
      # PR as a patchset (base=devel + diff). The patch path (bb's generatePatches) can't sync
      # binary-file *deletions* — for a deleted binary it emits "Binary files differ" with no
      # applyable hunk, so the runner's `git apply` fails (exit 255) before Bazel even runs.
      # Checking out the commit skips patch sync entirely. Safe here because the CI checkout is
      # a clean commit (no uncommitted changes for the patch path to drop). Uses the PR head
      # SHA (on origin, fetchable by the runner); GITHUB_SHA for push/dispatch. This also makes
      # the old "create local devel ref" step unnecessary — run_from_commit skips base
      # resolution (@{upstream}) entirely. See devinfra/docs/bb_remote_internals.md
      # §"Git state synchronization" ("--run_from_commit disables patches").
      - name: Test + Build + lint
        id: bb-remote
        uses: ./.github/actions/bb-remote
        with:
          rbe_image: ${{ inputs.rbe_image }}
          run_from_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          linkage_roles: test,build
          script: |
            set -euo pipefail
            RBE_FLAGS="--config=rbe --config=ci --remote_default_exec_properties=container-image=docker://$RBE_IMAGE"
            export CI_VM_PROBE_DIR="/home/buildbuddy/workspace/.ducktape-ci-vm-probe"
            probe_bb_runner() {
              python3 devinfra/ci/bb_runner_probe.py snapshot "$1" || true
            }
            finalize_bb_runner_probe() {
              python3 devinfra/ci/bb_runner_probe.py finalize --upload || true
            }
            trap finalize_bb_runner_probe EXIT

            # On PRs, test/build only the targets affected by the diff vs.
            # origin/devel — computed by target-determinator (packaged in
            # #2679, shadow-validated in #2680). Devel-branch push runs still
            # test `//...` below, so a PR that IS in the affected set of a
            # broken area still fails as it should; PRs unrelated to the
            # broken area are unblocked.
            #
            # Fails hard on any TD error — no fallback to `//...`. TD is the
            # source of truth for the affected set; a silent fallback would
            # let broken-devel failures re-block unrelated PRs, defeating the
            # whole policy.
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              mkdir -p /tmp/td-cache
              # bb-remote's runner cloned shallow (`git fetch --depth=1 <sha>`),
              # so origin/devel has no shared ancestor with HEAD and
              # `git merge-base` errors out. Deepen 200 commits of devel
              # history (covers roughly a week+ of activity — enough for any
              # non-stale PR without paying full-unshallow cost). `--deepen`
              # errors on a non-shallow repo, hence the fallback.
              git fetch --deepen=200 --no-tags origin devel 2>/dev/null \
                || git fetch --no-tags origin devel
              # If merge-base still doesn't resolve, the PR base is older
              # than the deepened window — refuse rather than silently
              # over-approximating the affected set. Author needs to rebase.
              if ! BASE=$(git merge-base origin/devel HEAD 2>/dev/null); then
                echo "::error::PR base is more than 200 commits behind origin/devel — please rebase on devel and re-push."
                exit 1
              fi
              echo "before-revision: $BASE"
              echo "head:            $(git rev-parse HEAD)"
              # target-determinator: -targets is the query (default //...);
              # the before-revision is a positional argument, NOT -before-revision.
              target-determinator \
                -cache-dir=/tmp/td-cache \
                "$BASE" \
                > /tmp/affected.txt
              N=$(wc -l < /tmp/affected.txt)
              echo "affected targets: $N"
              if [ "$N" -eq 0 ]; then
                echo "No targets affected by this PR — skipping test/build."
                exit 0
              fi
              probe_bb_runner before-test
              bazel test --keep_going $RBE_FLAGS --target_pattern_file=/tmp/affected.txt && \
                probe_bb_runner after-test && \
                bazel build --keep_going $RBE_FLAGS --target_pattern_file=/tmp/affected.txt && \
                probe_bb_runner after-build
            else
              # push to devel / workflow_dispatch: full sweep.
              probe_bb_runner before-test
              bazel test --keep_going $RBE_FLAGS //... && \
                probe_bb_runner after-test && \
                bazel build --keep_going $RBE_FLAGS //... && \
                probe_bb_runner after-build
            fi

      - name: Upload BuildBuddy linkage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-ci-linkage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.bb-remote.outputs.linkage_json_path }}
          if-no-files-found: warn
