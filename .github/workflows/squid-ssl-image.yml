# Squid with ssl_bump for the egress-proxy spike. Alpine-based because it is the
# only mainstream distro whose squid package is built --with-openssl; Ubuntu's is
# gnutls and refuses ssl-bump.
#
# CLEANUP(added 2026-08-10): delete alongside cluster/images/squid-ssl and the
#   archived spike snapshot when the reference is no longer useful.
name: Squid SSL Image

on:
  pull_request:
    branches: [devel]
    paths:
      - "cluster/images/squid-ssl/**"
      - ".github/workflows/squid-ssl-image.yml"
  push:
    branches: [devel]
    paths:
      - "cluster/images/squid-ssl/**"
      - ".github/workflows/squid-ssl-image.yml"
  workflow_dispatch:

concurrency:
  group: squid-ssl-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: git.allegedly.works/ducktape-ci/squid-ssl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: |
          TS=$(date -u +%Y%m%d%H%M%S)
          TAG_REF=${GITHUB_REF_NAME//\//-}
          REF="$IMAGE:${TAG_REF}-${TS}-${GITHUB_SHA:0:7}"
          echo "REF=$REF" >> "$GITHUB_ENV"
          docker build -f cluster/images/squid-ssl/Dockerfile -t "$REF" cluster/images/squid-ssl

      - name: Verify ssl_bump and ICAP support are compiled in
        run: |
          docker run --rm --entrypoint sh "$REF" -c 'squid -v' | tee /tmp/v
          grep -q -- '--with-openssl' /tmp/v || { echo "::error::squid not built --with-openssl"; exit 1; }
          docker run --rm --entrypoint sh "$REF" -c 'ls /usr/lib/squid/security_file_certgen' \
            || { echo "::error::security_file_certgen helper missing"; exit 1; }
          # Pin the major series. Squid changes directive semantics across major
          # versions without erroring -- that is what broke the spike's first run
          # -- so a base-image bump silently moving us off the series the config
          # was validated against must fail here, not in the fence.
          grep -qE 'Version 7\.' /tmp/v || { echo "::error::expected Squid 7.x; got: $(head -1 /tmp/v)"; exit 1; }
          # ICAP is the only mechanism in Squid that can rewrite a header
          # programmatically. Alpine's package has neither it nor eCAP, which is
          # why this image moved to Debian's squid-openssl flavour; assert it so
          # a future base change cannot quietly take it away again.
          grep -q -- '--enable-icap-client' /tmp/v || { echo "::error::squid not built --enable-icap-client"; exit 1; }
          # The runtime uid must match the Deployment's runAsUser. Debian's squid
          # runs as `proxy`, Alpine's ran as `squid`, and the numbers differ --
          # print it so the manifest is set from the build, not from memory.
          docker run --rm --entrypoint sh "$REF" -c 'id proxy; echo "configured user: $(id -u proxy):$(id -g proxy)"'

      - uses: ./.github/actions/setup-ci-secrets
        if: github.event_name == 'push'
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Log in to Forgejo registry
        if: github.event_name == 'push'
        run: echo "$FORGEJO_IMAGES_PASSWORD" | docker login git.allegedly.works -u "$FORGEJO_IMAGES_USERNAME" --password-stdin

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$REF"
          echo "pushed \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
