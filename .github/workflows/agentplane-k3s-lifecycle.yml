name: Agentplane k3s lifecycle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lifecycle:
    name: Model-free Sandbox lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - name: Run model-free k3s lifecycle tests
        id: lifecycle
        uses: ./.github/actions/bb-remote
        with:
          script: |
            bazelisk test --config=rbe --config=ci \
              --test_tag_filters=manual \
              --remote_default_exec_properties="container-image=docker://$RBE_CONTAINER_IMAGE" \
              //agentplane/x/k3s_env:test_lifecycle
          linkage_roles: test
          run_from_commit: ${{ github.sha }}

      - name: Upload BuildBuddy logs and linkage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agentplane-k3s-lifecycle-buildbuddy
          path: |
            ${{ steps.lifecycle.outputs.log_path }}
            ${{ steps.lifecycle.outputs.linkage_json_path }}
          if-no-files-found: warn
