# Build, test, and release claude_hooks wheel
#
# Runs on:
# - Every push to devel/main (for releases)
# - PRs that touch claude_hooks files
# - Manual workflow_dispatch
#
# Tests: unit + e2e (including podman integration)
# On push to devel/main: creates releases (requires tests to pass)
name: Claude Hooks CI

on:
  push:
    branches: [devel, main]
  pull_request:
    paths:
      - "tools/claude_hooks/**"
      - ".github/workflows/claude-hooks-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # All tests run on all pushes and PRs
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Java (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify keytool available
        run: keytool -help >/dev/null

      - uses: ./.github/actions/bazel-cache
        id: bazel-cache

      - name: Run unit tests (sandboxed)
        run: |
          bazel test --keep_going \
            --test_output=all \
            --nocache_test_results \
            --test_tag_filters=-e2e \
            --test_env=CI=true \
            --test_env=GITHUB_ACTIONS=true \
            --test_env=JAVA_HOME \
            //tools/claude_hooks:all

      - name: Run e2e tests (no sandbox for podman)
        run: |
          # E2E tests need --spawn_strategy=local so podman can create Unix sockets
          bazel test \
            --test_output=all \
            --nocache_test_results \
            --test_tag_filters=e2e \
            --spawn_strategy=local \
            --test_env=CI=true \
            --test_env=GITHUB_ACTIONS=true \
            --test_env=JAVA_HOME \
            --test_env=PATH \
            //tools/claude_hooks:all

      - uses: ./.github/actions/collect-test-logs
        if: failure()
        with:
          artifact-name: claude-hooks-test-logs

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Claude Hooks Test Results
          path: "bazel-testlogs/**/test.xml"
          reporter: java-junit
          fail-on-error: false

      - uses: ./.github/actions/bazel-cache-save
        if: always()
        with:
          cache-hit: ${{ steps.bazel-cache.outputs.cache-hit }}
          cache-key: ${{ steps.bazel-cache.outputs.cache-key }}

  # Build wheel, test it, and release (on push to devel/main)
  # Note: Podman integration tests run here via the e2e tests with PATH passed through.
  # A separate podman-test job using Bazel sandbox doesn't work because Bazel's sandbox
  # doesn't expose podman even when it's installed on the runner.
  wheel-build-test-release:
    name: Wheel Build, Test & Release
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Java (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Free disk space
        if: github.event_name == 'push'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: ./.github/actions/bazel-cache
        id: bazel-cache

      - name: Build wheel
        run: bazel build //tools/claude_hooks:claude_hooks_wheel

      - name: Install wheel
        run: uv tool install bazel-bin/tools/claude_hooks/claude_hooks-*.whl

      - name: Test installed wheel (including podman integration)
        run: |
          # E2E tests run against the installed wheel (CLAUDE_HOOKS_USE_WHEEL=1).
          # PATH is passed through so podman (pre-installed on GitHub runners) is available.
          # --spawn_strategy=local is required for podman to create Unix sockets.
          bazel test //tools/claude_hooks:test_e2e \
            --test_output=all \
            --nocache_test_results \
            --spawn_strategy=local \
            --test_env=CLAUDE_HOOKS_USE_WHEEL=1 \
            --test_env=CI=true \
            --test_env=JAVA_HOME \
            --test_env=PATH

      # Release steps - only on push to devel/main
      - name: Set short SHA
        if: github.event_name == 'push'
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Prepare wheel for release
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cp bazel-bin/tools/claude_hooks/claude_hooks-*.whl dist/

      - name: Create commit-tagged release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: claude-hooks-${{ env.SHORT_SHA }}
          name: claude-hooks (${{ env.SHORT_SHA }})
          body: |
            claude_hooks wheel for Claude Code web environments.

            Contains:
            - `claude-session-start` - Session start hook for Claude Code web
            - `bazel` / `bazelisk` - Bazel wrapper with proxy support

            Requires Python 3.13+

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: dist/*.whl

      - name: Cleanup old releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep last 10 commit-tagged releases (exclude latest-* tags)
          gh release list --limit 100 \
            | grep "^claude-hooks-" \
            | grep -v "^claude-hooks-latest" \
            | tail -n +11 \
            | cut -f1 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag

      - name: Update latest release for branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine the latest tag based on branch
          if [[ "${{ github.ref_name }}" == "devel" ]]; then
            TAG="claude-hooks-latest-devel"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            TAG="claude-hooks-latest-main"
          else
            echo "Not on devel or main, skipping latest release"
            exit 0
          fi

          # Delete existing release if it exists (we'll recreate it)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          # Create the latest release
          gh release create "$TAG" \
            --title "claude-hooks (latest)" \
            --notes "$(cat <<'EOF'
          claude_hooks wheel for Claude Code web environments.

          Contains:
          - \`claude-session-start\` - Session start hook for Claude Code web
          - \`bazel\` / \`bazelisk\` - Bazel wrapper with proxy support

          Requires Python 3.13+

          **This is a rolling release that always points to the latest build.**

          Latest commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          EOF
          )" \
            dist/*.whl

      - uses: ./.github/actions/bazel-cache-save
        if: always()
        with:
          cache-hit: ${{ steps.bazel-cache.outputs.cache-hit }}
          cache-key: ${{ steps.bazel-cache.outputs.cache-key }}
