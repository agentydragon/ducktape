# Build, test, and release claude_hooks wheel
#
# Runs on every push to devel/main and all PRs:
# - Always runs all claude_hooks tests (unit + e2e)
# - On push: creates commit-tagged release (requires tests to pass)
# - On push + tests pass: also creates branch-specific "latest" release
name: Claude Hooks CI

on:
  push:
    branches: [devel, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # All tests run on all pushes and PRs
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Setup Java (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify keytool available
        run: keytool -help >/dev/null

      - name: Restore Bazel cache
        id: cache-bazel-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-claude-hooks-e2e-${{ hashFiles('MODULE.bazel', 'requirements_bazel.txt') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Run all Claude hooks tests
        id: tests
        continue-on-error: true
        run: |
          bazel test --keep_going \
            --test_output=all \
            --nocache_test_results \
            --test_env=CI=true \
            --test_env=GITHUB_ACTIONS=true \
            //tools/claude_hooks:all

      - name: Collect test logs
        if: always()
        run: |
          mkdir -p e2e-test-logs
          TESTLOGS_DIR=$(bazel info bazel-testlogs 2>/dev/null || echo "bazel-testlogs")
          if [ -d "$TESTLOGS_DIR" ]; then
            find "$TESTLOGS_DIR" -name "test.xml" | while read xml; do
              test_dir=$(dirname "$xml")
              target_path="${test_dir#$TESTLOGS_DIR/}"
              mkdir -p "e2e-test-logs/$target_path"
              cp "$test_dir/test.log" "e2e-test-logs/$target_path/" 2>/dev/null || true
              cp "$test_dir/test.xml" "e2e-test-logs/$target_path/" 2>/dev/null || true
            done
          fi

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-hooks-test-logs-${{ github.run_id }}
          path: e2e-test-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Claude Hooks Test Results
          path: "bazel-testlogs/**/test.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Save Bazel cache
        if: always() && steps.cache-bazel-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ steps.cache-bazel-restore.outputs.cache-primary-key }}

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  # Release job - only runs on push to devel/main, always creates commit-tagged release
  release:
    name: Build and Release
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Restore Bazel cache
        id: cache-bazel-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-wheel-${{ hashFiles('MODULE.bazel', 'requirements_bazel.txt') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Build wheel
        run: bazel build //tools/claude_hooks:claude_hooks_wheel

      - name: Prepare wheel
        run: |
          mkdir -p dist
          cp bazel-bin/tools/claude_hooks/claude_hooks-*.whl dist/

      - name: Create commit-tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: claude-hooks-${{ env.SHORT_SHA }}
          name: claude-hooks (${{ env.SHORT_SHA }})
          body: |
            claude_hooks wheel for Claude Code web environments.

            Contains:
            - `claude-session-start` - Session start hook for Claude Code web
            - `bazel` / `bazelisk` - Bazel wrapper with proxy support

            Requires Python 3.13+

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: dist/*.whl

      - name: Cleanup old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep last 10 commit-tagged releases (exclude latest-* tags)
          gh release list --limit 100 \
            | grep "^claude-hooks-" \
            | grep -v "^claude-hooks-latest" \
            | tail -n +11 \
            | cut -f1 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag

      - name: Update latest release for branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine the latest tag based on branch
          if [[ "${{ github.ref_name }}" == "devel" ]]; then
            TAG="claude-hooks-latest-devel"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            TAG="claude-hooks-latest-main"
          else
            echo "Not on devel or main, skipping latest release"
            exit 0
          fi

          # Delete existing release if it exists (we'll recreate it)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          # Create the latest release
          gh release create "$TAG" \
            --title "claude-hooks (latest)" \
            --notes "$(cat <<'EOF'
          claude_hooks wheel for Claude Code web environments.

          Contains:
          - \`claude-session-start\` - Session start hook for Claude Code web
          - \`bazel\` / \`bazelisk\` - Bazel wrapper with proxy support

          Requires Python 3.13+

          **This is a rolling release that always points to the latest build.**

          Latest commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          EOF
          )" \
            dist/*.whl

      - name: Save Bazel cache
        if: always() && steps.cache-bazel-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ steps.cache-bazel-restore.outputs.cache-primary-key }}
