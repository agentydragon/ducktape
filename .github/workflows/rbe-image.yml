# Build and push the BuildBuddy RBE worker image to GHCR.
#
# Based on BuildBuddy's rbe-ubuntu24-04 image, with extra deps for Rust, GHC,
# and Chromium headless shell. See tools/rbe_image/Dockerfile.
#
# Triggers:
#   - push to main/devel (when tools/rbe_image/** changes): tags :latest + :<sha>
#   - workflow_dispatch: tags :latest + :<sha>
#   - workflow_call (from ci.yml): tags :<sha>, outputs image ref
name: RBE Worker Image

on:
  push:
    branches: [main, devel]
    paths:
      - "tools/rbe_image/**"
      - ".github/workflows/rbe-image.yml"
  workflow_dispatch:
  workflow_call:
    outputs:
      rbe_image:
        description: "Full image reference (e.g. ghcr.io/.../rbe-worker:<sha>), empty if skipped"
        value: ${{ jobs.build-and-push.outputs.rbe_image }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rbe-worker

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      rbe_image: ${{ steps.meta.outputs.rbe_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          TAG="${{ github.sha }}"
          TAGS="${{ env.IMAGE }}:$TAG"
          if [[ "${{ github.event_name }}" != "workflow_call" ]]; then
            TAGS="$TAGS,${{ env.IMAGE }}:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "rbe_image=${{ env.IMAGE }}:$TAG" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/rbe_image/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
