# Build and push the BuildBuddy RBE worker image to GHCR.
#
# The image provides git, ca-certificates, and podman for remote execution.
# Python comes from Bazel's hermetic toolchain (bootstrap_impl=script).
name: RBE Worker Image

on:
  push:
    branches: [main, devel]
    paths:
      - "tools/rbe_image/**"
      - "tools/claude_hooks/config/podman/**"
      - ".github/workflows/rbe-image.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rbe-worker

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/rbe_image/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
