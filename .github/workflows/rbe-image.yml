# Build and push the BuildBuddy RBE worker image to GHCR.
#
# Based on BuildBuddy's rbe-ubuntu24-04 image, with extra deps for Rust, GHC,
# and Chromium headless shell. See devinfra/rbe_image/Dockerfile.
#
# Triggers:
#   - push to main/devel (when devinfra/rbe_image/** changes): tags :latest + :<sha> + :{branch}-{ts}-{sha7}
#   - workflow_dispatch: tags :latest + :<sha> + :{branch}-{ts}-{sha7}
#   - workflow_call (from ci.yml): tags :<sha> + :{branch}-{ts}-{sha7}, outputs image ref
#
# On push/dispatch, also pins BUILD.bazel to the new :{branch}-{ts}-{sha7} tag
# and commits with "chore: update rbe image [skip ci]".
name: RBE Worker Image

on:
  push:
    branches: [main, devel]
    paths:
      - "devinfra/rbe_image/**"
      - ".github/workflows/rbe-image.yml"
  workflow_dispatch:
  workflow_call:
    outputs:
      rbe_image:
        description: "Full image reference (e.g. ghcr.io/.../rbe-worker:<sha>), empty if skipped"
        value: ${{ jobs.build-and-push.outputs.rbe_image }}

concurrency:
  # Use hardcoded name to avoid deadlock when called via workflow_call
  # (${{ github.workflow }} resolves to caller's name, colliding with CI's group)
  group: rbe-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rbe-worker

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      rbe_image: ${{ steps.meta.outputs.rbe_image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Compute image tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          TS="$(date -u +%Y%m%d%H%M%S)"
          BRANCH="${{ github.ref_name }}"
          PIN_TAG="${BRANCH}-${TS}-${SHA:0:7}"
          TAGS="${{ env.IMAGE }}:${SHA},${{ env.IMAGE }}:${PIN_TAG}"
          if [[ "${{ github.event_name }}" != "workflow_call" ]]; then
            TAGS="$TAGS,${{ env.IMAGE }}:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "rbe_image=${{ env.IMAGE }}:$SHA" >> $GITHUB_OUTPUT
          echo "pin_tag=$PIN_TAG" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devinfra/rbe_image/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Pin RBE image in BUILD.bazel
        if: github.event_name != 'workflow_call'
        run: |
          PIN_TAG="${{ steps.meta.outputs.pin_tag }}"

          sed -i "s|\"container-image\": \"docker://ghcr.io/agentydragon/rbe-worker:.*\"|\"container-image\": \"docker://ghcr.io/agentydragon/rbe-worker:${PIN_TAG}\"|" BUILD.bazel

          grep -q "rbe-worker:${PIN_TAG}" BUILD.bazel || {
            echo "::error::Failed to update BUILD.bazel with pin tag $PIN_TAG"
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add BUILD.bazel

          if git diff --cached --quiet; then
            echo "BUILD.bazel already pinned to $PIN_TAG"
            exit 0
          fi

          git commit -m "chore: update rbe image [skip ci]"

          BRANCH="${{ github.ref_name }}"
          if ! git pull --rebase origin "$BRANCH"; then
            echo "::error::Rebase failed"
            git status
            exit 1
          fi

          git push origin "HEAD:${BRANCH}"
