# Shared build-and-publish job for Nix-built KubeVirt containerDisk images.
name: Publish Nix containerDisk image

on:
  workflow_call:
    inputs:
      flake_output:
        description: Flake package output to build
        required: true
        type: string
      image_name:
        description: Short image name used in the job display
        required: true
        type: string
      image:
        description: Full Forgejo registry image name, without a tag
        required: true
        type: string
      attic:
        description: Cache the built image in Attic on devel
        required: false
        type: boolean
        default: false
      source_commit:
        description: Exact commit to check out and build (defaults to the triggering commit)
        required: false
        type: string
        default: ""
      allow_unsafe_pr_checkout:
        description: Allow a fork checkout after the caller establishes trust
        required: false
        type: boolean
        default: false
      environment:
        description: Protected GitHub Environment to gate the build (optional)
        required: false
        type: string
        default: ""
    secrets:
      FORGEJO_IMAGES_USERNAME:
        required: true
      FORGEJO_IMAGES_PASSWORD:
        required: true
      ATTIC_TOKEN:
        description: "Attic writer token for runs that upload to the private cache"
        required: false
      ATTIC_READ_TOKEN:
        description: "Attic reader token for private cache access without uploads"
        required: true

permissions:
  contents: read

jobs:
  build-push:
    name: Build & push ${{ inputs.image_name }}
    environment: ${{ inputs.environment || null }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLAKE_OUTPUT: ${{ inputs.flake_output }}
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          allow-unsafe-pr-checkout: ${{ inputs.allow_unsafe_pr_checkout }}

      - uses: ./.github/actions/setup-nix-attic
        with:
          attic_token: ${{ secrets[inputs.attic && github.event_name != 'pull_request_target' && github.ref_name == 'devel' && 'ATTIC_TOKEN' || 'ATTIC_READ_TOKEN'] }}

      - name: Build containerDisk image
        run: nix build ".#$FLAKE_OUTPUT" --print-build-logs

      - name: Push to Attic
        if: inputs.attic && github.event_name != 'pull_request_target' && github.ref_name == 'devel'
        run: |
          nix profile install nixpkgs#attic-client
          attic login ducktape https://cache.allegedly.works "$ATTIC_TOKEN"
          attic push ducktape:main result

      - name: Compute tag
        id: meta
        shell: bash
        run: |
          echo "pin_tag=${GITHUB_REF_NAME}-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Keep feature-branch/manual runs from publishing a tag that Flux would
      # consider deployable. workflow_dispatch on devel remains useful for a
      # retry after a transient registry failure.
      - name: Push to Forgejo registry
        if: github.event_name != 'pull_request_target' && github.ref_name == 'devel'
        env:
          FORGEJO_IMAGES_USERNAME: ${{ secrets.FORGEJO_IMAGES_USERNAME }}
          FORGEJO_IMAGES_PASSWORD: ${{ secrets.FORGEJO_IMAGES_PASSWORD }}
          PIN_TAG: ${{ steps.meta.outputs.pin_tag }}
        run: |
          set -euo pipefail
          ref="$IMAGE:$PIN_TAG"
          echo "$FORGEJO_IMAGES_PASSWORD" | skopeo login git.allegedly.works \
            -u "$FORGEJO_IMAGES_USERNAME" --password-stdin
          # Images labelled with their Nix source (see cpap/gateway/container-disk.nix)
          # are pushed only when it changed: a new tag restarts the VM.
          label='works.allegedly.nix-source'
          source="$(skopeo inspect --config "docker-archive:$(readlink -f result)" |
            jq -r --arg l "$label" '.config.Labels[$l] // empty')"
          if [[ -n "$source" ]]; then
            latest="$(skopeo list-tags "docker://$IMAGE" |
              jq -r --arg p "${GITHUB_REF_NAME}-" '[.Tags[] | select(startswith($p))] | sort | last // empty')"
            if [[ -n "$latest" ]] && [[ "$(skopeo inspect --config "docker://$IMAGE:$latest" |
              jq -r --arg l "$label" '.config.Labels[$l] // empty')" == "$source" ]]; then
              echo "$IMAGE:$latest already has $source; not pushing" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          skopeo copy --insecure-policy \
            "docker-archive:$(readlink -f result)" \
            "docker://$ref"
          echo "pushed $ref" >> "$GITHUB_STEP_SUMMARY"
