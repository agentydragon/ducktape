# Publish OCI images, fanning out only over the ones whose content actually moved.
#
# The image roster lives in devinfra/ci/image_targets.json, not in this file.
#
# Two phases:
#
#   plan  — builds nothing. bazel-ci already built every image's `.digest` sibling
#           on this commit, so this asks that invocation's build event stream where
#           each `<name>.json.sha256` is and fetches it (~70 bytes apiece), then
#           compares against what `latest` holds — the content of the most recent
#           publish. Emits a `matrix.include` of just the images that differ.
#           See devinfra/ci/plan_image_pushes.py.
#
#   push  — per changed image: run its tests, `bb remote build` the OCI layout, and
#           push a new pinned tag unless the digest it just built is already the
#           newest published one — the planner fails open, so "in the matrix" means
#           unproven, not changed. A failing test fails that image loudly and skips
#           its push; other images are unaffected (`fail-fast: false`).
#
# Typically nothing changed and the push matrix is empty, so a merge costs one job
# instead of forty-three. Previously every image got its own runner to rediscover
# that its digest was unchanged: measured over 96 such jobs, exactly one pushed
# anything. See devinfra/ci/debug/ci_queue_saturation.md.
#
# Credentials live exactly where they should: registry auth happens on the GitHub
# runner, not through the BB runner VM.
#
# Also pushes the props *agent* images to the props registry (not GHCR) via the
# `props-agents` job below — folded in from the former props-images.yml.
name: Push Images

on:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
      bazel_invocation_ids:
        description: >
          Comma-separated BuildBuddy invocation ids from bazel-ci, whose build event
          stream says what this commit produced. Empty means the planner can prove
          nothing and pushes everything.
        required: false
        type: string
        default: ""
  workflow_dispatch:

# Coalesce, never cancel. A newly queued run replaces whichever run is *pending* in this
# group, so a burst of merges collapses into a single publish — but a run that is already
# publishing is left alone. `cancel-in-progress: true` here is exactly what stalled image
# rollouts for ~2.5h on a busy merge day (#2759): do not "fix" this flag.
#
# Skipping the superseded commits is safe because publishing is content-addressed. Every
# image's digest is compared against what its registry last published, so whichever run
# gets there publishes everything still outstanding — an image whose change landed in a
# coalesced commit still differs from the registry and is picked up by the next run.
concurrency:
  group: push-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GIT_REPO_DEFAULT_BRANCH: devel

jobs:
  plan:
    name: Plan image pushes
    # Deliberately no job-level `if`. `push` interpolates this job's `matrix` output
    # into `strategy.matrix`, and a skipped job leaves that output empty — where
    # `fromJSON('')` is a workflow-level error rather than an empty matrix. So the
    # job always runs and always emits a valid matrix; the devel gate below decides
    # whether it has anything in it. Same shape as release.yml's matrix job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      # Only publish from devel. `workflow_dispatch` can be triggered from any
      # branch, but Flux ImagePolicy filters on `devel-YYYYMMDDHHMMSS-shortsha` and
      # picks newest-alphabetical — so pushing that tag shape from a feature branch
      # would immediately deploy unmerged code.
      PUBLISH: ${{ github.ref_name == 'devel' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix-devtools
        if: env.PUBLISH == 'true'
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        if: env.PUBLISH == 'true'
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - uses: imjasonh/setup-crane@v0.7
        if: env.PUBLISH == 'true'

      - name: Authenticate to Forgejo registry
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          crane auth login git.allegedly.works \
            -u "$FORGEJO_IMAGES_USERNAME" \
            -p "$FORGEJO_IMAGES_PASSWORD"

      - name: Plan pushes
        id: plan
        shell: bash
        env:
          INVOCATIONS: ${{ inputs.bazel_invocation_ids }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != "true" ]; then
            echo "Not on devel — nothing to publish."
            { echo 'matrix={"include":[]}'; echo "count=0"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -m devinfra.ci.plan_image_pushes --invocations "$INVOCATIONS"

  push:
    needs: [plan]
    # Skips cleanly when nothing moved; `plan` always emits a count.
    if: needs.plan.outputs.count != '0'
    name: Push ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Test (gate for push)
        id: test
        if: matrix.test_target != ''
        uses: ./.github/actions/bb-remote
        with:
          args: test ${{ matrix.test_target }}
          rbe_image: ${{ inputs.rbe_image }}

      # Both targets, deliberately. The image gives the OCI layout `crane push`
      # uploads; its `.digest` sibling gives the `<name>.json.sha256` beside it,
      # which is the only thing that produces that file — building the image
      # alone does not. `Resolve image output path` below locates the layout by
      # finding that sha256 and stripping the suffix, so dropping the sibling
      # fails every push with "found 0" (devel 45e4c188, 28 jobs).
      - name: bb remote build OCI layout
        uses: ./.github/actions/bb-remote
        with:
          args: build ${{ matrix.image }} ${{ matrix.image }}.digest
          rbe_image: ${{ inputs.rbe_image }}

      - uses: imjasonh/setup-crane@v0.7

      - name: Authenticate to Forgejo registry
        if: matrix.registry == 'forgejo'
        shell: bash
        run: |
          set -euo pipefail
          crane auth login git.allegedly.works \
            -u "$FORGEJO_IMAGES_USERNAME" \
            -p "$FORGEJO_IMAGES_PASSWORD"

      # This job builds exactly one image, so a search by target name is unambiguous
      # here even though it would not be in the planner's 42-target build. Resolving
      # locally also means the push never depends on which outputs `bb remote build`
      # chose to bring back for the planner.
      - name: Resolve image output path
        id: paths
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          NAME="${IMAGE##*:}"
          BIN="bb-out/bazel-out/k8-fastbuild/bin"
          mapfile -t DIGEST_FILES < <(find "$BIN" -path "*/${NAME}.json.sha256" -type f)
          if [[ "${#DIGEST_FILES[@]}" -ne 1 ]]; then
            printf 'Expected exactly one digest file for %s, found %s:\n' "$IMAGE" "${#DIGEST_FILES[@]}" >&2
            printf '  %s\n' "${DIGEST_FILES[@]}" >&2
            exit 1
          fi
          echo "oci_dir=${DIGEST_FILES[0]%.json.sha256}" >> "$GITHUB_OUTPUT"

      # Re-decides what the planner could only guess. The planner fails open, so an
      # image it could not prove unchanged is here on suspicion; this job built the
      # image and holds the digest it lacked, so it compares before minting a tag.
      # Skipping that check costs a Flux commit and a rollout per merge for every
      # image the `//...` sweep cannot see. See devinfra/ci/push_image.py.
      - name: Push image
        shell: bash
        env:
          OCI_DIR: ${{ steps.paths.outputs.oci_dir }}
          IMAGE_NAME: ${{ matrix.image_name }}
          REGISTRY: ${{ matrix.registry }}
        run: |
          set -euo pipefail
          python3 -m devinfra.ci.push_image \
            --name "$IMAGE_NAME" --registry "$REGISTRY" --oci-dir "$OCI_DIR"

  # Props agent images go to the props registry (not GHCR): the props backend's
  # registry proxy fronts Forgejo, and the orchestrator + critic-dev flow pull
  # and push agent / critic-variant images there at runtime. They're pushed by
  # the bespoke //props/agents:push_images_bin binary (which handles the critic
  # variants and the digest+tag scheme), not the GHCR matrix above. Gated on
  # props tests; like the matrix it only pushes from devel, and (via the
  # always() && !cancelled() caller in ci.yml) runs regardless of unrelated CI
  # failures — only a props test failure blocks it.
  props-agents:
    name: Push props agent images
    # DISABLED(added 2026-08-27): props is deliberately down, so `Push agent images` fails
    # against its unreachable registry on every devel push and reds the run — the publish
    # half of CI has been permanently red on a service nobody is waiting for. The job is
    # kept rather than deleted because whether props comes back is an open question, and
    # the push scheme here (critic variants, digest+tag) is not obvious to reconstruct.
    #
    # Re-enable by deleting `false &&`. Delete the job outright if props is not coming back.
    #
    # This does NOT quiet props in CI generally: bazel-ci runs `//...` on devel, so
    # //props/... still builds and tests there, and //props/llm_proxy:test_budget currently
    # times out. That is a separate failure with a separate fix.
    if: false && github.ref_name == 'devel'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Test (gate for push)
        uses: ./.github/actions/bb-remote
        with:
          args: test //props/...
          rbe_image: ${{ inputs.rbe_image }}

      - name: Push agent images
        uses: ./.github/actions/bb-remote
        with:
          args: run //props/agents:push_images_bin
          rbe_image: ${{ inputs.rbe_image }}
          env_overrides: |
            PROPS_REGISTRY_URL=${{ vars.PROPS_REGISTRY_URL }}
            PROPS_REGISTRY_USERNAME=${{ env.PROPS_REGISTRY_USERNAME }}
            PROPS_REGISTRY_PASSWORD=${{ env.PROPS_REGISTRY_PASSWORD }}
