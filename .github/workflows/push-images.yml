# Push OCI images to GHCR via bb remote (parallel matrix).
#
# Each image is pushed independently — a broken build doesn't block others.
# Images with a test_target are only pushed if their tests pass (Bazel remote
# cache makes this a fast cache lookup after bazel-ci already ran //...).
# Images without a test_target are always pushed on commit.
# Images with unchanged digests are skipped (ghcr_push_lib deduplicates).
name: Push Images

on:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GIT_REPO_DEFAULT_BRANCH: devel

jobs:
  push:
    name: Push ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Images with test gates: only pushed if their tests pass.
          - target: //airlock:push_ghcr
            test_target: //airlock/...
          - target: //airlock/auth_proxy:push_ghcr
            test_target: //airlock/auth_proxy/...
          - target: //homeassistant/proxy:push_ghcr
            test_target: //homeassistant/proxy/...
          - target: //mcp_infra/exec:push_ghcr
            test_target: //mcp_infra/exec/...
          - target: //props/backend:push_ghcr
            test_target: //props/backend/...
          - target: //tana/token_broker:push_ghcr
            test_target: //tana/token_broker/...
          - target: //x/authentik_mcp_poc:server_push_ghcr
            test_target: //x/authentik_mcp_poc/...
          - target: //x/authentik_mcp_poc:backend_push_ghcr
            test_target: //x/authentik_mcp_poc/...
          # Images without tests: always pushed on commit.
          - target: //cluster/k8s/agents/claude-token-rotation:push_ghcr
          - target: //cluster/k8s/inventree/token-provisioner:push_ghcr
          - target: //devinfra/firecracker/manager:push_ghcr
          - target: //devinfra/firecracker/vm_pod:push_ghcr
          - target: //inventree_utils/rai_plugin:push_ghcr
          - target: //openclaw/exec:push_ghcr
          - target: //third_party/activitywatch:push_ghcr
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Test (gate for push)
        id: test
        if: matrix.test_target != ''
        uses: ./.github/actions/bb-remote
        with:
          args: test ${{ matrix.test_target }}
          rbe_image: ${{ inputs.rbe_image }}
        continue-on-error: true

      - name: Push image (skipped if tests failed)
        if: steps.test.outcome == 'success' || steps.test.outcome == 'skipped'
        uses: ./.github/actions/bb-remote
        with:
          args: run --remote_download_toplevel ${{ matrix.target }}
          rbe_image: ${{ inputs.rbe_image }}
          # GHCR auth: forward the workflow-scoped GITHUB_TOKEN via bb remote
          # env-overrides so crane push inside the runner VM logs in as the
          # workflow. Advantages over a long-lived PAT:
          #   * The `permissions: packages: write` block above is enforced per
          #     run instead of relying on secret scope.
          #   * First-push packages are automatically linked to this repo and
          #     inherit its (public) visibility — no post-push API PATCH.
          #   * The token rotates per job, not per manual rotation.
          # Username is literally `x-access-token`; that's the conventional
          # form GHCR accepts alongside a workflow token.
          env_overrides: |
            GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GHCR_USERNAME=x-access-token
