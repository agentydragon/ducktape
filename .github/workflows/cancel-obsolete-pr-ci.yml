# Trusted metadata-only controller: new CI admission never depends on this job.
name: Cancel obsolete PR CI

on:
  workflow_run:
    workflows: [CI, Nix wheel check]
    types: [requested]
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cancel-obsolete:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.repo.id == github.event.repository.id &&
       github.event.pull_request.head.repo.id == github.event.repository.id)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Both triggers run the default branch workflow. Check out that trusted revision.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Cancel obsolete or closed PR validation runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m devinfra.ci.cancel_obsolete_pr_runs
