# Build the ephemeral public-coder-devbox qcow2 and publish it as a KubeVirt
# containerDisk image in the private Forgejo registry. Flux tracks the
# resulting devel-* tags through the public-coder-devbox ImagePolicy.
name: public-coder-devbox image

on:
  push:
    branches: [devel]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/flake/packages.nix"
      - "openclaw/public_coder_agent/devbox/*.nix"
      - "nix/nixos/modules/base.nix"
      - "nix/nixos/modules/vm-hardware.nix"
      - "nix/nixos/modules/bazel/**"
      - "nix/ssh-keys.nix"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/nix-containerdisk-publish.yml"
      - ".github/workflows/public-coder-devbox-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    uses: ./.github/workflows/nix-containerdisk-publish.yml
    with:
      flake_output: public-coder-devbox-container-disk
      image_name: public-coder-devbox
      image: git.allegedly.works/ducktape-ci/public-coder-devbox
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
