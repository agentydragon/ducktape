# Build and push all props container images (backend + agents).
#
# Combines backend and agent image builds into a single workflow to share
# Bazel setup, RBE warm cache, and checkout overhead.
#
# All images are stamp-free: same sources → same image ID across commits.
# push_if_changed compares the local image ID against the remote config
# digest and skips the push when unchanged.
#
# Backend image → registry.allegedly.works (Harbor)
# Agent images  → props registry (PROPS_REGISTRY_URL)
#
# Triggers:
#   - workflow_call (from ci.yml): always (digest comparison handles skip)
#   - workflow_dispatch: manual push of all images
name: Props Images

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
      HARBOR_ROBOT_USERNAME:
        required: true
      HARBOR_ROBOT_TOKEN:
        required: true
      PROPS_REGISTRY_URL:
        required: true
      PROPS_REGISTRY_USERNAME:
        required: true
      PROPS_REGISTRY_PASSWORD:
        required: true

concurrency:
  group: props-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}
          rbe_image: ${{ inputs.rbe_image }}

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.allegedly.works
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Login to Props Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.PROPS_REGISTRY_URL }}
          username: ${{ secrets.PROPS_REGISTRY_USERNAME }}
          password: ${{ secrets.PROPS_REGISTRY_PASSWORD }}

      - name: Build and load all images
        run: |
          bazel run //props/backend:load
          bazel run //props/agents/critic:load
          bazel run //props/agents/grader:load
          bazel run //props/agents/critic_dev/improve:load
          bazel run //props/agents/critic_dev/optimize:load
          bazel run //props/agents/critic/variants:contract_truthfulness_load
          bazel run //props/agents/critic/variants:dead_code_load
          bazel run //props/agents/critic/variants:flag_propagation_load
          bazel run //props/agents/critic/variants:high_recall_load
          bazel run //props/agents/critic/variants:verbose_docs_load

      - name: Push backend image (if changed)
        env:
          IMAGE: registry.allegedly.works/props/props-backend
          SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR build — skipping push"
            exit 0
          fi

          local_id=$(docker inspect --format='{{.Id}}' props-backend:latest)
          remote_digest=$(docker manifest inspect "$IMAGE:latest" 2>/dev/null \
            | jq -r '.config.digest // empty' 2>/dev/null || true)

          if [[ -n "$remote_digest" && "$local_id" == "$remote_digest" ]]; then
            echo "props-backend: unchanged (local=$local_id, remote=$remote_digest), skipping push"
            exit 0
          fi

          echo "props-backend: changed (local=$local_id, remote=${remote_digest:-<none>}), pushing"

          # Timestamp prefix makes tags sortable for Flux ImagePolicy.
          TS="$(date -u +%Y-%m-%dT%H%M%SZ)"
          SEMVER_TAG="devel-${TS}-${SHA:0:7}"
          TAGS="$IMAGE:$SHA,$IMAGE:$SEMVER_TAG"
          if [[ "${{ github.event_name }}" != "workflow_call" ]]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi

          IFS=',' read -ra TAG_LIST <<< "$TAGS"
          for tag in "${TAG_LIST[@]}"; do
            docker tag props-backend:latest "$tag"
            docker push --quiet "$tag"
          done

      - name: Push agent images (if changed)
        env:
          REGISTRY: ${{ secrets.PROPS_REGISTRY_URL }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR build — skipping push"
            exit 0
          fi

          push_if_changed() {
            local local_tag="$1" remote_repo="$2"
            shift 2
            local remote_tags=("$@")

            local local_id remote_digest
            local_id=$(docker inspect --format='{{.Id}}' "$local_tag")
            remote_digest=$(docker manifest inspect "$REGISTRY/$remote_repo:latest" 2>/dev/null \
              | jq -r '.config.digest // empty' 2>/dev/null || true)

            if [[ -n "$remote_digest" && "$local_id" == "$remote_digest" ]]; then
              echo "$remote_repo: unchanged, skipping push"
              return
            fi

            for tag in "${remote_tags[@]}"; do
              docker tag "$local_tag" "$REGISTRY/$remote_repo:$tag"
              docker push --quiet "$REGISTRY/$remote_repo:$tag"
            done
          }

          push_if_changed critic:latest critic latest "$SHA"
          push_if_changed grader:latest grader latest "$SHA"
          push_if_changed critic_dev_improve:latest critic_dev_improve latest "$SHA"
          push_if_changed critic_dev_optimize:latest critic_dev_optimize latest "$SHA"

          for variant in contract_truthfulness dead_code flag_propagation high_recall verbose_docs; do
            push_if_changed "critic:$variant" critic "$variant" "${variant}-${SHA}"
          done
