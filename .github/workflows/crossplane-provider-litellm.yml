# Build the patched LiteLLM Crossplane package on pull requests, and publish it
# to Forgejo only after the change lands on devel.
name: LiteLLM Crossplane Provider

on:
  pull_request:
    paths:
      - ".github/workflows/crossplane-provider-litellm.yml"
      - "cluster/cdk8s/providers/litellm/**"
  push:
    branches: [devel]
    paths:
      - ".github/workflows/crossplane-provider-litellm.yml"
      - "cluster/cdk8s/providers/litellm/**"
  workflow_dispatch:

concurrency:
  group: crossplane-provider-litellm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-publish:
    name: Build and publish provider package
    # Manual runs on feature branches are useful for build verification, but only
    # a devel ref may publish a package that Flux can install.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ github.ref_name == 'devel' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache: false

      - uses: docker/setup-buildx-action@v4

      - name: Authenticate to Forgejo registry
        env:
          FORGEJO_IMAGES_USERNAME: ${{ secrets.FORGEJO_IMAGES_USERNAME }}
          FORGEJO_IMAGES_PASSWORD: ${{ secrets.FORGEJO_IMAGES_PASSWORD }}
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "$FORGEJO_IMAGES_PASSWORD" | docker login git.allegedly.works \
            -u "$FORGEJO_IMAGES_USERNAME" --password-stdin

      - name: Build and test package
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/litellm-xpkg"
          if [[ "$PUBLISH" == "true" ]]; then
            cluster/cdk8s/providers/litellm/build_xpkg.sh "$output_dir" --push
          else
            cluster/cdk8s/providers/litellm/build_xpkg.sh "$output_dir"
          fi
