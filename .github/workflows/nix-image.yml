# Build one dockerTools image from the flake and publish it. Each image's own workflow keeps its
# triggers and concurrency, and calls this with the flake output and the repository to push to.
#
# The archive is a dockerTools docker archive, so `skopeo copy docker-archive:`. Publish runs on
# devel pushes or manual devel runs. A caller may build trusted fork PRs with Attic access, but
# this workflow never publishes from pull_request_target.
name: Nix image

on:
  workflow_call:
    inputs:
      attr:
        description: Flake output to build.
        required: true
        type: string
      image:
        description: Repository to push to, without a tag.
        required: true
        type: string
      registry:
        description: "`forgejo` pushes as the ducktape-ci user; `ghcr` with this run's GITHUB_TOKEN."
        required: true
        type: string
      smoke:
        description: Shell run in the checkout after the build and before any push; `result` is the archive.
        required: false
        type: string
        default: ""
      attic:
        description: Also push the archive to the Attic cache, so a host building the same revision substitutes it.
        required: false
        type: boolean
        default: false
      source_commit:
        description: Exact commit to check out and build (defaults to the triggering commit).
        required: false
        type: string
        default: ""
      allow_unsafe_pr_checkout:
        description: Allow a fork checkout after the caller establishes trust.
        required: false
        type: boolean
        default: false
      environment:
        description: Protected GitHub Environment to gate the build (optional).
        required: false
        type: string
        default: ""
    secrets:
      FORGEJO_IMAGES_USERNAME:
        required: false
      FORGEJO_IMAGES_PASSWORD:
        required: false
      ATTIC_TOKEN:
        description: "Attic writer token for runs that upload to the private cache"
        required: false
      ATTIC_READ_TOKEN:
        description: "Attic reader token for private cache access without uploads"
        required: true

jobs:
  image:
    name: Build & push ${{ inputs.attr }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || null }}
    timeout-minutes: 60
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          allow-unsafe-pr-checkout: ${{ inputs.allow_unsafe_pr_checkout }}

      - uses: ./.github/actions/setup-nix-attic
        with:
          attic_token: ${{ secrets[inputs.attic && github.event_name != 'pull_request_target' && github.ref_name == 'devel' && 'ATTIC_TOKEN' || 'ATTIC_READ_TOKEN'] }}

      - name: Build image
        run: nix build ".#${{ inputs.attr }}" --print-build-logs

      - name: Smoke test
        if: inputs.smoke != ''
        run: ${{ inputs.smoke }}

      # Before the cache upload: a cache failure must not withhold the image.
      - name: Push image
        if: github.event_name != 'pull_request_target' && github.ref_name == 'devel'
        env:
          FORGEJO_IMAGES_USERNAME: ${{ secrets.FORGEJO_IMAGES_USERNAME }}
          FORGEJO_IMAGES_PASSWORD: ${{ secrets.FORGEJO_IMAGES_PASSWORD }}
          REGISTRY: ${{ inputs.registry }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          case "$REGISTRY" in
            forgejo) creds="$FORGEJO_IMAGES_USERNAME:$FORGEJO_IMAGES_PASSWORD" ;;
            ghcr) creds="$GITHUB_ACTOR:$GHCR_TOKEN" ;;
            *)
              echo "unknown registry: $REGISTRY" >&2
              exit 1
              ;;
          esac
          ref="$IMAGE:$GITHUB_REF_NAME-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}"
          skopeo copy --insecure-policy --dest-creds "$creds" --digestfile "$RUNNER_TEMP/digest" \
            "docker-archive:$(readlink -f result)" "docker://$ref"
          echo "pushed \`$ref\` as \`$IMAGE@$(cat "$RUNNER_TEMP/digest")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Push to Attic
        if: inputs.attic && github.event_name != 'pull_request_target' && github.ref_name == 'devel'
        run: |
          nix profile install nixpkgs#attic-client
          attic login ducktape https://cache.allegedly.works "$ATTIC_TOKEN"
          attic push ducktape:main result
