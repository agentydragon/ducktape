# Build the NixOS Agentplane runner guest and publish its qcow2 containerDisk.
name: Agentplane Runner VM Image

on:
  push:
    branches: [devel]
    paths:
      - ".github/actions/bb-remote/action.yml"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/agentplane-runner-vm-image.yml"
      - ".github/workflows/nix-containerdisk-publish.yml"
      - "agentplane/runner/**"
      - "devinfra/ci/invocation_ids.py"
      - "devinfra/ci/pr_mergeability.py"
      - "flake.lock"
      - "flake.nix"
      - "nix/artifact-pins.json"
      - "nix/flake/packages.nix"
      - "nix/nixos/modules/vm-hardware.nix"
  # Same-repository PRs can use pull_request directly. Fork PRs are skipped here
  # (their secrets are unavailable) and use pull_request_target below instead.
  pull_request:
    paths:
      # keep-sorted start
      - ".github/actions/bb-remote/action.yml"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/agentplane-runner-vm-image.yml"
      - ".github/workflows/nix-containerdisk-publish.yml"
      - "agentplane/runner/**"
      - "devinfra/ci/invocation_ids.py"
      - "devinfra/ci/pr_mergeability.py"
      - "flake.lock"
      - "flake.nix"
      - "nix/artifact-pins.json"
      - "nix/flake/packages.nix"
      - "nix/nixos/modules/vm-hardware.nix"
      # keep-sorted end
  # Fork PRs use pull_request_target so repository secrets are available, with
  # the same trusted-author / fork-ci-review gate as trusted-fork-pr-ci.yml.
  pull_request_target:
    branches: [devel]
    paths:
      # keep-sorted start
      - ".github/actions/bb-remote/action.yml"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/agentplane-runner-vm-image.yml"
      - ".github/workflows/nix-containerdisk-publish.yml"
      - "agentplane/runner/**"
      - "devinfra/ci/invocation_ids.py"
      - "devinfra/ci/pr_mergeability.py"
      - "flake.lock"
      - "flake.nix"
      - "nix/artifact-pins.json"
      - "nix/flake/packages.nix"
      - "nix/nixos/modules/vm-hardware.nix"
      # keep-sorted end
  workflow_dispatch:

concurrency:
  # Fork pull_request runs skip building; they must not cancel the trusted pull_request_target run.
  group: agentplane-runner-vm-image-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-merge-commit:
    name: Resolve PR merge commit
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # pull_request_target loads this workflow from the base branch. Resolve the
      # exact merge commit for this head before checking out any PR-controlled code.
      - uses: actions/checkout@v7
        with:
          ref: devel
          fetch-depth: 1
      - name: Resolve the merge commit GitHub built for this PR head
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 devinfra/ci/pr_mergeability.py resolve

  image:
    needs: [resolve-merge-commit]
    if: >-
      always() &&
      (github.event_name != 'pull_request_target' || needs.resolve-merge-commit.outputs.sha != '') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/nix-containerdisk-publish.yml
    with:
      flake_output: agentplane-runner-vm-container-disk
      image_name: agentplane-runner-vm
      image: git.allegedly.works/ducktape-ci/agentplane-runner-vm
      build_runner_wheel: true
      source_commit: ${{ needs.resolve-merge-commit.outputs.sha }}
      allow_unsafe_pr_checkout: ${{ github.event_name == 'pull_request_target' }}
      environment: >-
        ${{
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          github.event.pull_request.user.login != 'agentydragon-agent' &&
          github.event.pull_request.user.login != 'agentydragon' &&
          'fork-ci-review' || ''
        }}
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
