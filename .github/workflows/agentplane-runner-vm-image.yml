# Build the NixOS Agentplane runner guest and publish its qcow2 containerDisk.
name: Agentplane Runner VM Image

# The runner and `agentplane` command are not in this image: they ship on the runner disk
# (//agentplane/runner:disk_image), so their artifact pins do not trigger this build.
# Keep automatic triggers on Nix/image inputs.
on:
  push:
    branches: [devel]
    paths:
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/agentplane-runner-vm-image.yml"
      - ".github/workflows/nix-containerdisk-publish.yml"
      - "agentplane/images/tools.nix"
      - "agentplane/runner/container-disk.nix"
      - "agentplane/runner/vm.nix"
      - "devinfra/ci/pr_mergeability.py"
      - "flake.lock"
      - "flake.nix"
      - "nix/artifact-pins.json"
      - "nix/attic-pubkeys.json"
      - "nix/flake/devtools.nix"
      - "nix/flake/packages.nix"
      - "nix/lib/nix-ld-image.nix"
      - "nix/nixos/modules/base.nix"
      - "nix/nixos/modules/vm-hardware.nix"
      - "nix/packages/**"
  # Same-repository PRs can use pull_request directly. Fork PRs are skipped here
  # (their secrets are unavailable) and use pull_request_target below instead.
  pull_request:
    paths:
      # keep-sorted start
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/agentplane-runner-vm-image.yml"
      - ".github/workflows/nix-containerdisk-publish.yml"
      - "agentplane/images/tools.nix"
      - "agentplane/runner/container-disk.nix"
      - "agentplane/runner/vm.nix"
      - "devinfra/ci/pr_mergeability.py"
      - "flake.lock"
      - "flake.nix"
      - "nix/artifact-pins.json"
      - "nix/attic-pubkeys.json"
      - "nix/flake/devtools.nix"
      - "nix/flake/packages.nix"
      - "nix/lib/nix-ld-image.nix"
      - "nix/nixos/modules/base.nix"
      - "nix/nixos/modules/vm-hardware.nix"
      - "nix/packages/**"
      # keep-sorted end
  # Fork PRs use pull_request_target so repository secrets are available, with
  # the same trusted-author / fork-ci-review gate as trusted-fork-pr-ci.yml.
  pull_request_target:
    branches: [devel]
    paths:
      # keep-sorted start
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/agentplane-runner-vm-image.yml"
      - ".github/workflows/nix-containerdisk-publish.yml"
      - ".github/workflows/trusted-fork-pr-context.yml"
      - "agentplane/images/tools.nix"
      - "agentplane/runner/container-disk.nix"
      - "agentplane/runner/vm.nix"
      - "devinfra/ci/pr_mergeability.py"
      - "flake.lock"
      - "flake.nix"
      - "nix/artifact-pins.json"
      - "nix/attic-pubkeys.json"
      - "nix/flake/devtools.nix"
      - "nix/flake/packages.nix"
      - "nix/lib/nix-ld-image.nix"
      - "nix/nixos/modules/base.nix"
      - "nix/nixos/modules/vm-hardware.nix"
      - "nix/packages/**"
      # keep-sorted end
  workflow_dispatch:

concurrency:
  # Fork pull_request runs skip building; they must not cancel the trusted pull_request_target run.
  group: agentplane-runner-vm-image-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fork-context:
    uses: ./.github/workflows/trusted-fork-pr-context.yml
    permissions:
      contents: read
      pull-requests: read

  image:
    needs: [fork-context]
    if: >-
      always() &&
      (github.event_name != 'pull_request_target' || needs.fork-context.outputs.source_commit != '') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/nix-containerdisk-publish.yml
    with:
      flake_output: agentplane-runner-vm-container-disk
      image_name: agentplane-runner-vm
      image: git.allegedly.works/ducktape-ci/agentplane-runner-vm
      attic: true
      source_commit: ${{ needs.fork-context.outputs.source_commit }}
      allow_unsafe_pr_checkout: ${{ github.event_name == 'pull_request_target' }}
      environment: ${{ needs.fork-context.outputs.environment }}
    secrets:
      FORGEJO_IMAGES_USERNAME: ${{ secrets.FORGEJO_IMAGES_USERNAME }}
      FORGEJO_IMAGES_PASSWORD: ${{ secrets.FORGEJO_IMAGES_PASSWORD }}
      ATTIC_TOKEN: ${{ secrets[github.event_name != 'pull_request_target' && github.ref_name == 'devel' && 'ATTIC_TOKEN' || 'ATTIC_READ_TOKEN'] }}
      ATTIC_READ_TOKEN: ${{ secrets.ATTIC_READ_TOKEN }}
