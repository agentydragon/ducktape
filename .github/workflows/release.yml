# Release artifacts to GitHub, fanning out only over the ones whose content moved.
#
# Two phases:
#
#   matrix  — builds nothing. bazel-ci already built every default-config release
#             on this commit, so this reads that invocation's build event stream,
#             derives each release's content hash from the digests it reports, and
#             diffs those against the published tags. Emits a `matrix.include` of
#             just the releases that changed. See devinfra/ci/plan_releases.py.
#
#   release — per changed release: run its tests, rebuild stamped, `gh release
#             create`. Unchanged; the planner is purely a filter in front of it, and
#             .github/actions/release-artifact still makes the same check itself.
#
# Typically nothing changed and the matrix is empty, so a merge costs one job instead
# of fifty-one. See devinfra/ci/debug/ci_queue_saturation.md.
#
# The rows still come from devinfra/ci/artifact_targets.json — the same SSOT
# .github/workflows/nix-wheel-check.yml reads. See the schema note at the top
# of that file for field semantics (pins ↔ releases, etc.).
# Per-skill rows are appended from skills/skills_registry.json (one release per
# skill, `skill-<name>`); see skills/README.md.
name: Release

on:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
      bazel_invocation_ids:
        description: >
          Comma-separated BuildBuddy invocation ids from bazel-ci, whose build
          event stream says what this commit produced. Empty means the planner
          can prove nothing and releases everything.
        required: false
        type: string
        default: ""
  workflow_dispatch:

# Coalesce, never cancel — same reasoning as the block in push-images.yml. A queued run
# replaces the pending one so a merge burst collapses into one publish; a run already
# creating releases is never killed (#2759). Safe to skip superseded commits because a
# release's identity is a content hash, so the next run publishes whatever is still
# unreleased.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GIT_REPO_DEFAULT_BRANCH: devel

jobs:
  matrix:
    name: Compute release matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Plan releases
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ env.GH_RELEASE_PAT }}
          INVOCATIONS: ${{ inputs.bazel_invocation_ids }}
        run: |
          set -euo pipefail
          python3 -m devinfra.ci.plan_releases \
            --invocations "$INVOCATIONS" \
            --commit-subject "$(git log -1 --format=%s)"

  release:
    needs: [matrix]
    # Skips cleanly when nothing moved; `matrix` always emits a count.
    if: needs.matrix.outputs.count != '0'
    name: Release ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Run tests for ${{ matrix.pkg }}
        if: matrix.tests != ''
        uses: ./.github/actions/bb-remote
        with:
          args: test ${{ matrix.tests }}
          rbe_image: ${{ inputs.rbe_image }}

      - uses: ./.github/actions/release-artifact
        with:
          pkg: ${{ matrix.pkg }}
          bazel_targets: ${{ matrix.targets }}
          outputs: ${{ matrix.outputs }}
          bazel_flags: ${{ matrix.bazel_flags }}
          release_metadata: ${{ matrix.release_metadata }}
          metadata_platform: ${{ matrix.metadata_platform }}
          rbe_image: ${{ inputs.rbe_image }}
