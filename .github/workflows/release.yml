# Release artifacts to GitHub, fanning out only over the ones whose content moved.
#
# Two phases:
#
#   matrix  — builds nothing. For release targets reported by bazel-ci, this reads
#             the build event stream, derives each release's content hash from its
#             output digests, and compares those against published tags. Missing or
#             custom-configuration targets stay in the matrix for their own job.
#             See devinfra/ci/plan_releases.py.
#
#   release — per changed release: reuse exact verified push-CI test verdicts when
#             available, otherwise run its tests, rebuild stamped, and publish.
#
# When no artifact changed, the empty matrix avoids starting a per-artifact job.
#
# The rows still come from devinfra/ci/artifact_targets.json — the same SSOT
# .github/workflows/nix-wheel-check.yml reads. See the schema note at the top
# of that file for field semantics (pins ↔ releases, etc.).
# Per-skill rows are appended from skills/skills_registry.json (one release per
# skill, `skill-<name>`); see skills/README.md.
name: Release

on:
  workflow_call:
    inputs:
      rbe_container_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
      bazel_invocation_ids:
        description: >
          Comma-separated BuildBuddy invocation ids from bazel-ci, whose build
          event stream says what this commit produced. Empty means the planner
          can prove nothing and releases everything.
        required: false
        type: string
        default: ""
      bazel_test_invocation_id:
        description: Deterministic test invocation id from a successful bazel-ci push.
        required: false
        type: string
        default: ""
      bazel_test_source_commit:
        description: Verified source SHA of that bazel-ci invocation.
        required: false
        type: string
        default: ""
  workflow_dispatch:

# Coalesce, never cancel — same reasoning as the block in push-images.yml. A queued run
# replaces the pending one so a merge burst collapses into one publish; a run already
# creating releases is never killed (#2759). Safe to skip superseded commits because a
# release's identity is a content hash, so the next run publishes whatever is still
# unreleased.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GIT_REPO_DEFAULT_BRANCH: devel

jobs:
  matrix:
    name: Compute release matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Plan releases
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ env.GH_RELEASE_PAT }}
          INVOCATIONS: ${{ inputs.bazel_invocation_ids }}
          TEST_INVOCATION_ID: ${{ inputs.bazel_test_invocation_id }}
          TEST_SOURCE_COMMIT: ${{ inputs.bazel_test_source_commit }}
          RBE_CONTAINER_IMAGE: ${{ inputs.rbe_container_image }}
        run: |
          set -euo pipefail
          python3 -m devinfra.ci.plan_releases \
            --invocations "$INVOCATIONS" \
            --test-invocation-id "$TEST_INVOCATION_ID" \
            --test-source-commit "$TEST_SOURCE_COMMIT" \
            --rbe-container-image "$RBE_CONTAINER_IMAGE" \
            --commit-subject "$(git log -1 --format=%s)"

  release:
    needs: [matrix]
    # Skips cleanly when nothing moved; `matrix` always emits a count.
    if: needs.matrix.result == 'success' && needs.matrix.outputs.count != '0'
    name: Release ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: bb

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Run tests for ${{ matrix.pkg }}
        if: matrix.tests != '' && matrix.reuse_test_verdict != 'true'
        uses: ./.github/actions/bb-remote
        with:
          args: test ${{ matrix.tests }}
          rbe_container_image: ${{ inputs.rbe_container_image }}

      - uses: ./.github/actions/release-artifact
        with:
          pkg: ${{ matrix.pkg }}
          bazel_targets: ${{ matrix.targets }}
          bazel_flags: ${{ matrix.bazel_flags }}
          release_metadata: ${{ matrix.release_metadata }}
          metadata_platform: ${{ matrix.metadata_platform }}
          rbe_container_image: ${{ inputs.rbe_container_image }}
