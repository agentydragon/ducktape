name: Release
# Triggered by BB Workflows "Release" action after artifacts are uploaded to GitHub Releases.
# Only does nix-pin + attic push + git commit — no Bazel.
"on":
  workflow_dispatch:
    inputs:
      short_sha:
        description: Short commit SHA of the artifacts uploaded by BB (e.g. abc12345)
        required: true
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  pin-and-push:
    name: Update flake pins and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Install npins and attic-client
        run: nix profile install nixpkgs#npins nixpkgs#attic-client

      - name: Update artifact pins and push Nix packages to attic
        env:
          ATTIC_JWT_TOKEN: ${{ secrets.ATTIC_JWT_TOKEN }}
        run: |
          SHA="${{ inputs.short_sha }}"
          BASE="https://github.com/agentydragon/ducktape/releases/download"

          declare -A pins=(
            [claude-hooks-wheel]="$BASE/claude-hooks-$SHA/claude_hooks-0.1.0-py3-none-any.whl"
            [ducktape-wheel]="$BASE/ducktape-$SHA/ducktape-0.1.0-py3-none-any.whl"
            [gterm-theme-wheel]="$BASE/gterm-theme-$SHA/gterm_theme-0.1.0-py3-none-any.whl"
            [bbapi-binary]="$BASE/bbapi-$SHA/bbapi"
            [skills-tar]="$BASE/skills-$SHA/skills.tar"
          )
          for name in "${!pins[@]}"; do
            npins update "$name" --url "${pins[$name]}"
          done

          attic login main https://cache.allegedly.works "$ATTIC_JWT_TOKEN"
          store_paths=()
          for pkg in claude-hooks bbapi skills; do
            store_paths+=($(nix build --no-link --print-out-paths ".#packages.x86_64-linux.$pkg"))
          done
          attic push main "${store_paths[@]}"

      - name: Commit and push updated pins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npins/sources.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: bump release artifacts [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
