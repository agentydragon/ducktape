name: Release
# Triggered by BB Workflows "Release" action after artifacts are uploaded to GitHub Releases.
# Only does nix-pin + attic push + git commit — no Bazel.
"on":
  workflow_dispatch:
    inputs:
      short_sha:
        description: Short commit SHA of the artifacts uploaded by BB (e.g. abc12345)
        required: true
      changed:
        description: Space-separated packages with new releases (e.g. "claude-hooks bbapi")
        required: true
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  pin-and-push:
    name: Update flake pins and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Install npins and attic-client
        run: nix profile install nixpkgs#npins nixpkgs#attic-client

      - name: Update artifact pins and push Nix packages to attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          SHA="${{ inputs.short_sha }}"
          BASE="https://github.com/agentydragon/ducktape/releases/download"

          declare -A urls=(
            [claude-hooks]="$BASE/claude-hooks-$SHA/claude_hooks-0.1.0-py3-none-any.whl"
            [ducktape]="$BASE/ducktape-$SHA/ducktape-0.1.0-py3-none-any.whl"
            [gterm-theme]="$BASE/gterm-theme-$SHA/gterm_theme-0.1.0-py3-none-any.whl"
            [bbapi]="$BASE/bbapi-$SHA/bbapi"
            [skills]="$BASE/skills-$SHA/skills.tar"
          )

          store_paths=()
          read -ra changed_pkgs <<< "${{ inputs.changed }}"
          for pkg in "${changed_pkgs[@]}"; do
            npins update "$pkg" --url "${urls[$pkg]}"
            store_paths+=($(nix build --no-link --print-out-paths ".#packages.x86_64-linux.$pkg"))
          done

          # web-session (symlinkJoin of claude-hooks + bbapi + gh) is not an npins
          # artifact but bundles them; rebuild and push so web_setup.sh is a cache hit.
          store_paths+=($(nix build --no-link --print-out-paths ".#packages.x86_64-linux.web-session"))

          attic login main https://cache.allegedly.works "$ATTIC_TOKEN"
          attic push main "${store_paths[@]}"

      - name: Commit and push updated pins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npins/sources.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: bump release artifacts [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
