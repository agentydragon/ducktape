# Build the homepage image (website/default.nix) and push it to the Forgejo registry.
# Pull requests build and smoke-test it; fork PRs use pull_request_target with the trusted-fork
# review gate. Only devel pushes and manual devel runs publish.
name: Website Image

on:
  pull_request:
    paths:
      # keep-sorted start
      - ".github/actions/finish-attic-upload/action.yml"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/nix-image.yml"
      - ".github/workflows/website-image.yml"
      - "devinfra/ci/pr_mergeability.py"
      - "flake.lock"
      - "flake.nix"
      - "nix/flake/packages.nix"
      - "website/**"
      # keep-sorted end
  push:
    branches: [devel]
    paths:
      # keep-sorted start
      - ".github/actions/finish-attic-upload/action.yml"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/nix-image.yml"
      - ".github/workflows/website-image.yml"
      - "devinfra/ci/pr_mergeability.py"
      - "flake.lock"
      - "flake.nix"
      - "nix/flake/packages.nix"
      - "website/**"
      # keep-sorted end
  # Fork PRs use pull_request_target so the build can read the Attic cache. The caller resolves
  # GitHub's merge commit and gates non-allowlisted authors with fork-ci-review before checkout.
  pull_request_target:
    branches: [devel]
    paths:
      # keep-sorted start
      - ".github/actions/finish-attic-upload/action.yml"
      - ".github/actions/setup-nix-attic/action.yml"
      - ".github/workflows/nix-image.yml"
      - ".github/workflows/trusted-fork-pr-context.yml"
      - ".github/workflows/website-image.yml"
      - "devinfra/ci/pr_mergeability.py"
      - "flake.lock"
      - "flake.nix"
      - "nix/flake/packages.nix"
      - "website/**"
      # keep-sorted end
  workflow_dispatch:

concurrency:
  # Keep a skipped fork pull_request run from canceling its trusted pull_request_target run.
  group: website-image-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fork-context:
    uses: ./.github/workflows/trusted-fork-pr-context.yml
    permissions:
      contents: read
      pull-requests: read

  image:
    needs: [fork-context]
    if: >-
      always() &&
      (github.event_name != 'pull_request_target' || needs.fork-context.outputs.source_commit != '') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/nix-image.yml
    with:
      attr: website-image
      image: git.allegedly.works/ducktape-ci/website
      registry: forgejo
      smoke: |
        image="$(docker load -i "$(readlink -f result)" | sed -n 's/^Loaded image: //p')"
        docker run -d --rm --name website -p 8080:8080 "$image"
        for path in / /about.html /found.html /nfc.html /atom.xml /rss.xml; do
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            -o /dev/null "http://127.0.0.1:8080$path"
        done
        docker stop website
      source_commit: ${{ needs.fork-context.outputs.source_commit }}
      allow_unsafe_pr_checkout: ${{ github.event_name == 'pull_request_target' }}
      environment: ${{ needs.fork-context.outputs.environment }}
    secrets:
      FORGEJO_IMAGES_USERNAME: ${{ secrets.FORGEJO_IMAGES_USERNAME }}
      FORGEJO_IMAGES_PASSWORD: ${{ secrets.FORGEJO_IMAGES_PASSWORD }}
      ATTIC_READ_TOKEN: ${{ secrets.ATTIC_READ_TOKEN }}
