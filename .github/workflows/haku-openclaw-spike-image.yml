# Build and push Haku's Claude-backed OpenClaw spike with Nix. Same build
# mechanism as the public-coder openclaw image: the gateway comes from
# nix-openclaw's npm-package build pinned to stable 2026.8.1, and the
# repository's CLI surface is layered declaratively.
name: Haku OpenClaw Spike Image

on:
  pull_request:
    paths:
      - "haku/openclaw_spike/**"
      # This image builds the gateway from openclaw/gateway.nix, shared with
      # public-coder, so a change there must rebuild here too. Listed file by
      # file rather than openclaw/** on purpose: the rest of that directory is
      # public-coder's image and does not belong in this trigger.
      - "openclaw/gateway.nix"
      - "openclaw/npm_wrapper/**"
      - "openclaw/patch-openclaw-npm-dist.mjs"
      - "openclaw/proxy-setup.mjs"
      - "flake.nix"
      - "flake.lock"
      - "nix/flake/packages.nix"
      - "cluster/k8s/agents/haku-openclaw-spike/app/haku-openclaw-spike-config.k8s.yaml"
      - ".github/workflows/haku-openclaw-spike-image.yml"
      - ".github/workflows/nix-image.yml"
      - ".github/actions/setup-nix-attic/action.yml"
  push:
    branches: [devel]
    paths:
      - "haku/openclaw_spike/**"
      # This image builds the gateway from openclaw/gateway.nix, shared with
      # public-coder, so a change there must rebuild here too. Listed file by
      # file rather than openclaw/** on purpose: the rest of that directory is
      # public-coder's image and does not belong in this trigger.
      - "openclaw/gateway.nix"
      - "openclaw/npm_wrapper/**"
      - "openclaw/patch-openclaw-npm-dist.mjs"
      - "openclaw/proxy-setup.mjs"
      - "flake.nix"
      - "flake.lock"
      - "nix/flake/packages.nix"
      - "cluster/k8s/agents/haku-openclaw-spike/app/haku-openclaw-spike-config.k8s.yaml"
      - ".github/workflows/haku-openclaw-spike-image.yml"
      - ".github/workflows/nix-image.yml"
      - ".github/actions/setup-nix-attic/action.yml"
  workflow_dispatch:

concurrency:
  group: haku-openclaw-spike-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/nix-image.yml
    with:
      attr: haku-openclaw-spike-image
      image: git.allegedly.works/ducktape-ci/haku-openclaw-spike
      registry: forgejo
      smoke: |
        pip install --quiet pyyaml
        python3 -c '
        import yaml
        with open("cluster/k8s/agents/haku-openclaw-spike/app/haku-openclaw-spike-config.k8s.yaml") as f:
            config_map = yaml.safe_load(f)
        with open("/tmp/haku-openclaw-spike-openclaw.json", "w") as out:
            out.write(config_map["data"]["openclaw.json"])
        '
        loaded="$(docker load -i "$(readlink -f result)")"
        printf '%s\n' "$loaded"
        image="$(printf '%s\n' "$loaded" | sed -n -e 's/^Loaded image: //p' -e 's/^Loaded image ID: //p' | tail -n 1)"
        test -n "$image"
        docker run --rm --entrypoint /bin/sh \
          --mount "type=bind,src=/tmp/haku-openclaw-spike-openclaw.json,dst=/tmp/haku-openclaw-spike-openclaw.json,readonly" \
          "$image" -ceu '
          openclaw --version
          node --version
          claude --version
          java -version
          keytool -version
          for command in bazel kubectl tea ruff git jq python3 rg sed awk grep; do
            command -v "$command"
          done
          # The egress proxy preload is wired via NODE_OPTIONS (a nix-store
          # path, not /app as on the old upstream-base image); confirm it exists.
          preload_option="${NODE_OPTIONS%% *}"
          preload="${preload_option#--import=file://}"
          test -f "$preload"
          # Validate the config this image actually deploys with against
          # openclaw'"'"'s own schema. Catches structural/type errors --
          # unknown keys, wrong types, invalid enum values -- before Flux
          # rolls it out; unset secrets surface only as non-fatal warnings.
          validate_out="${TMPDIR:-/tmp}/openclaw-config-validate.json"
          OPENCLAW_CONFIG_PATH=/tmp/haku-openclaw-spike-openclaw.json openclaw config validate --json >"$validate_out" || true
          jq -e ".valid == true" "$validate_out" >/dev/null || {
            echo "haku-openclaw-spike openclaw.json failed schema validation:" >&2
            jq . "$validate_out" >&2
            exit 1
          }
          # openclaw --version does not import the gateway runtime modules, so
          # it passes even when the gateway is missing runtime deps. Actually
          # load the gateway: the npm-path install copies openclaw deps from
          # node_modules/openclaw/node_modules, and a hoisted (non-nested) lock
          # left the gateway with zero deps, crashing at its first import
          # (tslog). Run the real gateway briefly and reject a module-resolution
          # failure; a config/network failure after modules load is expected.
          gw_out="$(timeout 15 openclaw gateway 2>&1 || true)"
          if printf %s "$gw_out" | grep -qE "openclaw requires (Node|Bun)|ERR_MODULE_NOT_FOUND|Cannot find package"; then
            echo "FATAL: gateway runtime validation failed:" >&2
            printf %s "$gw_out" | tail -8 >&2
            exit 1
          fi
        '
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
