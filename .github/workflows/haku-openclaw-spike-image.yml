# Build and push Haku's Claude-backed OpenClaw spike with Nix. The image
# packages the published beta gateway artifact and layers the repository's CLI
# surface declaratively.
name: Haku OpenClaw Spike Image

on:
  pull_request:
    paths:
      - "haku/openclaw_spike/**"
      - "openclaw/proxy-setup.mjs"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/haku-openclaw-spike-image.yml"
  push:
    branches: [devel]
    paths:
      - "haku/openclaw_spike/**"
      - "openclaw/proxy-setup.mjs"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/haku-openclaw-spike-image.yml"
  workflow_dispatch:

concurrency:
  group: haku-openclaw-spike-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: git.allegedly.works/ducktape-ci/haku-openclaw-spike
    steps:
      - uses: actions/checkout@v7

      - name: Load Attic trusted pubkeys
        id: attic_keys
        run: echo "value=$(jq -r 'join(\" \")' nix/attic-pubkeys.json)" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes fetch-closure
            netrc-file = /home/runner/.config/nix/netrc
            extra-trusted-public-keys = ${{ steps.attic_keys.outputs.value }}
            extra-substituters = https://cache.allegedly.works/main
            fallback = true

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Write Nix netrc for cache.allegedly.works
        run: |
          mkdir -p /home/runner/.config/nix
          umask 077
          printf 'machine cache.allegedly.works password %s\n' "$ATTIC_TOKEN" \
            > /home/runner/.config/nix/netrc

      - name: Build image
        run: nix build .#haku-openclaw-spike-image --print-build-logs

      - name: Smoke test Haku runtime surface
        run: |
          loaded="$(docker load -i "$(readlink -f result)")"
          printf '%s\n' "$loaded"
          image="$(printf '%s\n' "$loaded" | sed -n -e 's/^Loaded image: //p' -e 's/^Loaded image ID: //p' | tail -n 1)"
          test -n "$image"
          entrypoint="$(docker inspect --format='{{json .Config.Entrypoint}}' "$image")"
          cmd="$(docker inspect --format='{{json .Config.Cmd}}' "$image")"
          test "$entrypoint" = "null"
          case "$cmd" in
            *'"gateway"]') ;;
            *)
              echo "unexpected default command: $cmd" >&2
              exit 1
              ;;
          esac
          case "$entrypoint" in
            *tini*)
              echo "unexpected tini entrypoint: $entrypoint" >&2
              exit 1
              ;;
          esac
          docker run --rm --entrypoint /bin/sh "$image" -ceu '
            test -x "$(command -v node)"
            openclaw --version
            node --version
            node -p "process.versions.sqlite"
            node -e "const [major, minor, patch] = process.versions.sqlite.split(\".\").map(Number); const supported = major === 3 && ((minor > 51) || (minor === 51 && patch >= 3) || (minor === 50 && patch >= 7) || (minor === 44 && patch >= 6)); if (!supported) process.exit(1)"
            openclaw gateway --help
            claude --version
            java -version
            keytool -version
            for command in bazel kubectl tea ruff git jq python3 rg; do
              command -v "$command"
            done
            test -f /app/proxy-setup.mjs
          '

      - name: Compute tag
        id: meta
        run: |
          SHA="${{ github.sha }}"
          echo "pin_tag=${GITHUB_REF_NAME}-$(date -u +%Y%m%d%H%M%S)-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: github.event_name == 'push'
        run: |
          REF="$IMAGE:${{ steps.meta.outputs.pin_tag }}"
          skopeo copy --insecure-policy \
            --dest-creds "$FORGEJO_IMAGES_USERNAME:$FORGEJO_IMAGES_PASSWORD" \
            "docker-archive:$(readlink -f result)" "docker://$REF"
          echo "pushed \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
