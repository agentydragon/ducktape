# Build and release gnome-terminal-profile-switcher wheel
#
# Only creates a release if there are actual Bazel target changes since the last release.
name: gnome-terminal-profile-switcher Release

on:
  push:
    branches: [devel, main]
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force release even if no changes detected"
        required: false
        default: false
        type: boolean

# Cancel outdated workflow runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Check if release needed
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.check.outputs.release_needed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/bazel-cache
        id: bazel-cache

      - name: Check if release needed
        id: check
        uses: ./.github/actions/check-release-needed
        with:
          package_prefix: gnome-terminal-profile-switcher
          bazel_target_pattern: "//gnome_terminal_profile_switcher/..."

      - name: Log result
        run: |
          echo "Release needed: ${{ steps.check.outputs.release_needed }}"
          echo "Reason: ${{ steps.check.outputs.reason }}"

      - uses: ./.github/actions/bazel-cache-save
        if: always()
        with:
          cache-hit: ${{ steps.bazel-cache.outputs.cache-hit }}
          cache-key: ${{ steps.bazel-cache.outputs.cache-key }}

  release:
    needs: [check]
    if: needs.check.outputs.release_needed == 'true' || inputs.force_release == true
    uses: ./.github/workflows/python-wheel-release.yml
    with:
      package_name: gnome-terminal-profile-switcher
      wheel_name: gnome_terminal_profile_switcher
      bazel_target: //gnome_terminal_profile_switcher:gnome_terminal_profile_switcher_wheel
      wheel_path: bazel-bin/gnome_terminal_profile_switcher
      apt_packages: libcairo2-dev libgirepository-2.0-dev libdbus-1-dev libxcb1-dev pkg-config
      release_body: |
        gnome-terminal-profile-switcher wheel.

        **Note**: Requires system libraries (libgirepository-2.0-dev, libdbus-1-dev).
