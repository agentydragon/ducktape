name: VM executor comparison

on:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        required: true

jobs:
  compare:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 100
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      PAIR_DIR: ${{ github.workspace }}/vm-pair
      REQUIRED_LABEL: //agentplane/system_tests/suites:test_vm
      SHADOW_LABEL: //agentplane/system_tests/suites:test_vm_tcg
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix-devtools
        with:
          installables: ".#bb .#bbapi"

      - name: Select a fresh hosted KVM result
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m devinfra.buildbuddy.ci.vm_shadow select

      - name: Run the managed QEMU suite on the same commit
        id: shadow
        if: steps.select.outputs.selection == 'fresh'
        uses: ./.github/actions/bb-remote
        with:
          run_from_commit: ${{ github.sha }}
          linkage_roles: vm-shadow
          bazel_invocation_ids: ${{ steps.select.outputs.shadow_id }}
          # The managed variant is manual, so override the CI manual-tag exclusion.
          args: >-
            test --test_tag_filters=manual --nocache_test_results --flaky_test_attempts=2
            --invocation_id=${{ steps.select.outputs.shadow_id }}
            ${{ env.SHADOW_LABEL }}

      - name: Archive target attempts and executor outcomes
        if: always() && steps.select.outputs.selection != 'cached'
        env:
          SHADOW_OUTCOME: ${{ steps.shadow.outcome }}
        run: python3 -m devinfra.buildbuddy.ci.vm_shadow collect

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vm-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: vm-pair/
          retention-days: 90
          if-no-files-found: error
