# Workflow trigger definitions - single source of truth
#
# This file defines all CI workflows and their triggers. The generator script
# (generate_ci.py) reads this to produce .github/workflows/ci.yml.
#
# Trigger types (discriminated by trigger.kind):
#   always: Always run this workflow
#   bazel_query: Bazel query expression over affected targets ($targets placeholder)
#   path: Regex pattern for changed files
#
# Job options:
#   targets: Pass affected targets to the workflow (default: false)
#   secrets: inherit - pass all caller secrets to the workflow (also implies RBE wiring)
#   inputs: Additional inputs to pass to the workflow
#
# Workflow file changes automatically trigger their workflow.

workflows:
  # Core Bazel workflows
  # Build + all quality checks (ruff, ESLint, mypy, clippy, rustfmt; run by default)
  bazel-check:
    trigger: { kind: bazel_query, query: "$targets" }
    targets: true
    secrets: inherit

  bazel-test:
    # Java (keytool) is provided hermetically via //third_party/jdk.
    # E2E tests (local=True) run locally even when RBE is enabled.
    # Exclude manual-tagged tests: target lists are passed by file, bypassing
    # Bazel's default wildcard exclusion of manual targets.
    trigger: { kind: bazel_query, query: 'kind(".*_test rule", $targets) except attr(tags, "manual", $targets)' }
    targets: true
    secrets: inherit

  # Image builds
  rbe-image:
    trigger: { kind: path, pattern: "^tools/rbe_image/" }

  # Bazel image workflows always trigger. Bazel builds are hermetic, so same
  # inputs → same image digest. The workflow compares the local digest against
  # the registry and skips the push when unchanged. This avoids the stale-image
  # bug where bazel-diff (HEAD vs HEAD~1) misses changes from earlier commits
  # whose push step failed.
  props-images:
    trigger: { kind: always }
    events: [push]
    secrets: inherit

  # Single workflow that builds and pushes all Bazel-built Harbor images.
  # The list of images is defined in harbor_images below.
  bazel-harbor-images:
    trigger: { kind: always }
    events: [push]
    secrets: inherit

  openclaw-image:
    trigger: { kind: path, pattern: "^docker/openclaw/" }
    events: [push]
    secrets: inherit
    rbe: false

  # Path-based workflows (non-Bazel)
  nix-flake-check:
    trigger: { kind: path, pattern: "^nix/" }

  ansible-lint:
    trigger: { kind: path, pattern: "^ansible/" }

  # Always-run workflows
  pre-commit:
    trigger: { kind: always }

# Release workflow definitions
#
# Each entry generates a <name>-release.yml workflow with:
#   1. A "check" job using check-release-needed action
#   2. A "release" job calling python-wheel-release.yml
#
# The entry key is used as package_name and package_prefix.
# wheel_name and wheel_path are derived from bazel_target.
# claude-hooks-release.yml is hand-written (has custom test jobs).
releases:
  ducktape:
    bazel_target: //:wheel
    release_body: |
      ducktape wheel containing:
      - `git-commit-ai` - AI-powered commit message generator
      - `difftree` - Tree-style visualization of diffs
      - `gmail-archiver` - Gmail email auto-archiving tool

  headscale-cleanup:
    bazel_target: //headscale_cleanup:wheel
    release_body: |
      headscale-cleanup wheel.

      CLI tool for cleaning up stale Headscale nodes (controlplane* and worker* nodes).

  gnome-terminal-profile-switcher:
    bazel_target: //gnome_terminal_profile_switcher:wheel
    apt_packages: [libcairo2-dev, libgirepository-2.0-dev, libdbus-1-dev, libxcb1-dev, pkg-config]
    release_body: |
      gnome-terminal-profile-switcher wheel.

      **Note**: Requires system libraries (libgirepository-2.0-dev, libdbus-1-dev).

# List of Bazel-built images pushed to Harbor (registry.allegedly.works).
# The bazel-harbor-images workflow (generated from this config) builds and
# pushes all images in a single job, sharing Bazel setup and registry login.
harbor_images:
  - bazel_target: //oauth_broker:load
    local_tag: oauth-broker:latest
    remote_path: oauth-broker/oauth-broker

  - bazel_target: //cluster/k8s/applications/inventree-token-provisioner:load
    local_tag: inventree-token-provisioner:latest
    remote_path: inventree/token-provisioner

  - bazel_target: //props/backend:load
    local_tag: props-backend:latest
    remote_path: props/props-backend

  - bazel_target: //approval_gate:load
    local_tag: approval-gate:latest
    remote_path: approval-gate/approval-gate

  - bazel_target: //mcp_infra/exec:exec_backend_load
    local_tag: approval-gate-exec-backend:latest
    remote_path: approval-gate/exec-backend

  - bazel_target: //homeassistant_proxy:load
    local_tag: homeassistant-proxy:latest
    remote_path: homeassistant-proxy/homeassistant-proxy
