<html lang="en">
  <head>

    />

      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",

  <body>
    <div id="report-content"></div>
    <noscript>This plan uses JavaScript for Mantine components.</noscript>
    <script type="module">
      import { useEffect, useState } from "react";
      import {
        Accordion,
        Alert,
        Anchor,
        Badge,
        Box,
        Code,
        Container,
        Group,
        List,
        Paper,
        SegmentedControl,
        SimpleGrid,
        Stack,
        Table,
        Text,
        Title,
      } from "@mantine/core";
      import { html, mount } from "../report.js";

      const source = "bdb8adf0a809aa27109c1bdb1f50dafa69f4bdbf";
      const repo = "https://github.com/agentydragon/ducktape";
      const src = (path) => `${repo}/blob/${source}/${path}`;
      const issue = `${repo}/issues/16099`;
      const p = (text) => html`<${Text} component="p" my="sm">${text}<//>`;
      const code = (text) =>
        html`<${Code}
          style=${{ whiteSpace: "normal", overflowWrap: "anywhere" }}
          >${text}<//
        >`;
      function Section({ id, title, children }) {
        return html`<${Box} component="section" id=${id} my="xl">
          <${Title} order=${2} mb="md">${title}<//>${children}<//
        >`;
      }
      function Rows({ headers, rows, minWidth = 680, id }) {
        const readableCell = { overflowWrap: "normal", wordBreak: "normal" };
        return html`<${Table.ScrollContainer} minWidth=${minWidth} id=${id}>
          <${Table}
            striped
            withTableBorder
            withColumnBorders
            verticalSpacing="sm"
          >
            <${Table.Thead}
              ><${Table.Tr}
                >${headers.map((s) => html`<${Table.Th} key=${s} style=${readableCell}>${s}<//>`)}<//
              ><//
            >
            <${Table.Tbody}
              >${rows.map((r, i) => html`<${Table.Tr} key=${i}>${r.map((v, j) => html`<${Table.Td} key=${j} style=${typeof v === "string" && /^\d+(?:\.\d+)?s$/.test(v) ? { ...readableCell, whiteSpace: "nowrap" } : readableCell}>${v}<//>`)}<//>`)}<//
            >
          <//><//
        >`;
      }
      function Node({ label, detail, color = "blue" }) {
        return html`<${Paper} withBorder radius="md" p="md">
          <${Badge} color=${color} variant="light" mb="xs">${label}<//>
          <${Text} size="sm">${detail}<//><//
        >`;
      }
      const classes = {
        Runtime: {
          contract:
            "Real Gateway → Runtime → History recovery, journal admission, command receipts and stream/cursor settlement. PostgreSQL and a real Runtime PID1 container; no app process.",
          deployment:
            "A focused real Pod journey checks the packaged runner, workload identity and cluster wiring. VM/Firecracker checks remain selected when their compiled or deployment inputs depend on the change.",
          narrowing:
            "Native contract targets depend on their binaries, schemas, libraries and explicit runtime artifacts. Deployment slices keep exact images; changing unrelated app UI assets should stop invalidating the native recovery fixture.",
        },
        App: {
          contract:
            "App routes and projections use real owning services and databases. Exercise browser reconnect, History projection, OIDC login and approval presentation at the app boundary.",
          deployment:
            "Keep real app/OAuth/browser journeys and one backend integration path. A pure UI change should not require VM guest construction when no selected contract consumes that guest.",
          narrowing:
            "Separate app image/assets from backend contract support. App-dependent acceptance remains app-dependent: replacing its client with direct gRPC would remove the guarantee being tested.",
        },
        Platform: {
          contract:
            "Controller reconcile logic uses the existing injected clock and real API semantics where needed; real database and authorization contracts remain in their owner targets.",
          deployment:
            "Retain affected K3s/PKI/RBAC, packaged image boot, Pod, VM, Firecracker, suspend/resume, Secret rotation and workload isolation acceptance before merge. Broad infrastructure/schema changes expand the selected gate.",
          narrowing:
            "Declare service/image/runtime dependencies by guarantee. Graph-wide changes still use CI's full sweep. Unknown coverage mappings keep the current broad test selected.",
        },
      };
      const lanes = [
        [
          "M1 · Native owner contracts · repeated at exact source",
          "Keep the four Runtime/Gateway/History contracts on PR #16102. Their 25-run exact-head exposure passed; the sample is n=25 per contract and does not establish a failure rate. Preserve the real PostgreSQL, Runtime, service and identity boundaries.",
        ],
        [
          "M2 · MCP and central deployment slices · candidate",
          "Keep the three MCP/OAuth cases and four real central-recovery cases separately selectable as manual candidate targets. Preserve real app, Actions, Gateway, History, sampler, controllers and PKI. The new profile is not an active devel selector.",
        ],
        [
          "M3 · Same-source selected graph and physical attempts",
          "Compare A1/B1/B2/A2 at literal source 220. Preserve every physical interruption, retry and final result; a green target alone does not prove a clean execution. Final source-head required checks and the actual selection archive are separate evidence. No complete-CI saving is established.",
        ],
        [
          "M4 · Real acceptance and qualification · pending",
          "Keep owner/native contracts, focused real deployment acceptance, and app/browser/MCP journeys required. One historical selector-only pair is complete; 29 pairs remain. Three busy windows, a four-PR burst and rerun-inclusive required-feedback comparison remain. The 100 native case executions are 25 per contract, not 100 independent reliability trials.",
        ],
        [
          "M5 · Prove a narrow frequency move · not enabled",
          "Only after proof may repetitive fault × harness × platform combinations move to devel/nightly. Keep unknown or sensitive changes on the broad gate. Manual VM boot-only work has no equivalence claim for the full VM suite; actual selection snapshots are evidence, not a new selector.",
        ],
        [
          "M6 · Continue or stop on quarter payback",
          "Continue while the best remaining candidate can repay implementation, review and maintenance within about one quarter. Stop dedicated work only when it cannot pay back within about one quarter and the two best probes fail to show worthwhile gain. Count developer waiting separately from total CI wall savings.",
        ],
      ];
      function Report() {
        const [selected, setSelected] = useState("Runtime");
        const [data, setData] = useState(null);
        const [manifest, setManifest] = useState(null);
        const [error, setError] = useState(null);
        useEffect(() => {
          const controller = new AbortController();
          Promise.all(
            ["evidence.json", "manifest.json"].map(async (path) => {
              const response = await fetch(path, { signal: controller.signal });
              if (!response.ok)
                throw new Error(`${path}: HTTP ${response.status}`);
              return response.json();
            }),
          )
            .then(([e, m]) => {
              setData(e);
              setManifest(m);
            })
            .catch((e) => {
              if (e.name !== "AbortError") setError(String(e));
            });
          return () => controller.abort();
        }, []);
        const choice = classes[selected];
        const comparison = data?.iteration2_comparison;
        const nativeIteration = data?.iteration2_native;
        const iteration3 = data?.iteration3;
        const seconds = (value) =>
          Number.isFinite(value) ? `${value.toFixed(3)}s` : "Pending";
        const iteration4 = data?.iteration4;
        const iteration5 = data?.iteration5;
        const iteration9 = data?.iteration9;
        const iteration10 = data?.iteration10;
        const iteration11 = data?.iteration11;
        const iteration12 = data?.iteration12;
        const iteration8 = data?.iteration8;
        const iteration7 = data?.iteration7;
        const iteration5Cohort = iteration5?.historical_replay_cohort;
        const iteration5PairRows = (iteration5Cohort?.pairs || []).map(
          (pair) => [
            html`<${Stack} gap=${0}>
              <${Anchor} href=${pair.pr_url}>PR #${pair.pr_number}<//>
              <${Text} size="xs" c="dimmed"
                >${pair.stratum}; ${pair.changed_path_count} changed paths<//
              >
            <//>`,
            html`<${Stack} gap=${0}>
              <${Code}>${pair.tested_base_sha}<//>
              <${Text} size="xs" c="dimmed">tested base<//>
              <${Code}>${pair.tested_head_sha}<//>
              <${Text} size="xs" c="dimmed">tested head<//>
            <//>`,
            `${pair.required_gate_outcome} · ${pair.workflow_attempts.length} attempt${pair.workflow_attempts.length === 1 ? "" : "s"}`,
            `${pair.buildbuddy_bazel_exit_code || "No Bazel exit"} · ${pair.buildbuddy_invocation_status}`,
          ],
        );
        const iteration5StrataRows = Object.entries(
          iteration5Cohort?.selected_strata || {},
        ).map(([stratum, sample]) => [
          stratum,
          `${sample.selected} / ${sample.frame} in frame`,
          Object.entries(sample.required_gate_outcomes || {})
            .map(([outcome, count]) => `${count} ${outcome}`)
            .join(", "),
        ]);
        const iteration4Cases = iteration4?.native_contracts?.cases || [];
        const iteration4Repeat = iteration4?.native_contracts?.repeat_run;
        const iteration4NativeCaseRows = iteration4Cases.map((item) => [
          item.contract,
          item.exercise,
        ]);
        const iteration4RepeatRows = iteration4Repeat
          ? [
              [
                "Exact source",
                html`<${Anchor}
                  href=${`${repo}/commit/${iteration4Repeat.source_commit}`}
                  >${iteration4Repeat.source_commit}<//
                >`,
              ],
              [
                "BuildBuddy invocation",
                html`<${Anchor} href=${iteration4Repeat.url}
                  >${iteration4Repeat.invocation}<//
                >`,
              ],
              [
                "Physical TestRunner actions",
                `${iteration4Repeat.physical_actions} NEW; attempt ${iteration4Repeat.test_runner_attempt_number}; ${iteration4Repeat.skips} skips`,
              ],
              [
                "Case exposures",
                `${iteration4Repeat.case_exposures} passing executions across four cases; ${iteration4Repeat.test_results} TestResults`,
              ],
              [
                "Per-action process time",
                `mean ${seconds(iteration4Repeat.process_seconds.mean)} · median ${seconds(iteration4Repeat.process_seconds.median)} · p90 ${seconds(iteration4Repeat.process_seconds.p90)} · range ${seconds(iteration4Repeat.process_seconds.min)}–${seconds(iteration4Repeat.process_seconds.max)}`,
              ],
              [
                "Bounded repeat-job Bazel wall",
                `${seconds(iteration4Repeat.bazel_wall_seconds)}; four-way 25-run job, not PR feedback time`,
              ],
              [
                "Aggregate CPU and workers",
                `${seconds(iteration4Repeat.total_cpu_seconds)} summed test CPU across ${iteration4Repeat.distinct_workers} workers`,
              ],
              ["Sample limit", iteration4Repeat.sample_limit],
            ]
          : [["Native repeat", "Evidence pending"]];
        const iteration4NegativeRows = (
          iteration4?.native_contracts?.negative_controls || []
        ).map((control) => [
          control.label,
          html`<${Stack} gap="xs">
            <${Text} size="sm">${control.outcome}<//>
            <${Text} size="sm" c="dimmed"
              >${control.interpretation || control.disposition}<//
            >
            <${Anchor} href=${control.url}>${control.invocation}<//>
          <//>`,
        ]);
        const iteration4Mcp = iteration4?.mcp_candidate;
        const iteration4Batch =
          iteration4?.native_contracts?.case_batch_reliability;
        const iteration4BatchRows = iteration4Batch
          ? [
              [
                "Nested pytest result-waiter failure",
                html`<${Anchor} href=${iteration4Batch.failure_url}
                  >${iteration4Batch.failure_invocation}<//
                >`,
              ],
              [
                "Fix with complete pass",
                html`<${Anchor}
                  href=${`https://app.buildbuddy.io/invocation/${iteration4Batch.fixed_full_pass_invocation}`}
                  >${iteration4Batch.fixed_full_pass_invocation}<//
                >`,
              ],
              [
                "Stronger fatal/cancel pass",
                html`<${Anchor}
                  href=${`https://app.buildbuddy.io/invocation/${iteration4Batch.stronger_fatal_cancel_pass_invocation}`}
                  >${iteration4Batch.stronger_fatal_cancel_pass_invocation}<//
                >`,
              ],
              ["Interpretation", iteration4Batch.interpretation],
            ]
          : [];
        const iteration4McpRows = iteration4Mcp
          ? [
              ...(iteration4Mcp.whole_pr_ci.checks || []).map((check) => [
                `${check.name} · head 220e6a5`,
                check.conclusion,
                html`<${Anchor} href=${check.url}
                  >Workflow ${check.workflow_run_id}<//
                >`,
              ]),
              [
                "Manual MCP target",
                iteration4Mcp.profile_split.mcp_target,
                `${iteration4Mcp.profile_split.mcp_cases} MCP cases`,
              ],
              [
                "Manual central target",
                iteration4Mcp.profile_split.central_target,
                `${iteration4Mcp.profile_split.central_recovery_cases} real central-recovery cases`,
              ],
              [
                "Configured control closure",
                iteration4Mcp.configured_graph_query.control.outcome,
                html`<${Anchor}
                  href=${iteration4Mcp.configured_graph_query.control.url}
                  >${iteration4Mcp.configured_graph_query.control.invocation}<//
                >`,
              ],
              [
                "Configured candidate closure",
                iteration4Mcp.configured_graph_query.candidate.outcome,
                html`<${Anchor}
                  href=${iteration4Mcp.configured_graph_query.candidate.url}
                  >${iteration4Mcp.configured_graph_query.candidate.invocation}<//
                >`,
              ],
              [
                "MCP / central case collections",
                iteration4Mcp.case_collections.outcome,
                html`<${Anchor} href=${iteration4Mcp.case_collections.url}
                  >${iteration4Mcp.case_collections.invocation}<//
                >`,
              ],
              [
                "Selected-target control",
                iteration4Mcp.selected_graph_control.outcome,
                html`<${Anchor} href=${iteration4Mcp.selected_graph_control.url}
                  >${iteration4Mcp.selected_graph_control.invocation}<//
                >`,
              ],
              [
                "Selected-target B1 candidate",
                iteration4Mcp.selected_graph_candidate.outcome,
                html`<${Stack} gap="xs">
                  <${Badge} color="teal"
                    >${iteration4Mcp.selected_graph_candidate.status}<//
                  >
                  <${Anchor} href=${iteration4Mcp.selected_graph_candidate.url}
                    >${iteration4Mcp.selected_graph_candidate.invocation}<//
                  >
                <//>`,
              ],
              [
                "Ordinary PR CI · tested head 220e6a5",
                iteration4Mcp.whole_pr_ci.interpretation,
                html`<${Stack} gap="xs">
                  <${Anchor} href=${iteration4Mcp.whole_pr_ci.workflow_url}
                    >Workflow ${iteration4Mcp.whole_pr_ci.workflow_run_id}<//
                  >
                  <${Anchor} href=${iteration4Mcp.whole_pr_ci.buildbuddy_url}
                    >BuildBuddy
                    ${iteration4Mcp.whole_pr_ci.buildbuddy_invocation}<//
                  >
                <//>`,
              ],
              [
                "Latest PR head",
                html`<${Anchor}
                  href=${`${repo}/commit/${iteration4.source_provenance.latest_source_head}`}
                  >${iteration4.source_provenance.latest_source_head}<//
                >`,
                iteration4.source_provenance.latest_head_ci_status,
              ],
              [
                "CaseBatch / render integration",
                iteration4Mcp.case_batch_full_integration.status,
                html`<${Anchor}
                  href=${iteration4Mcp.case_batch_full_integration.url}
                  >${iteration4Mcp.case_batch_full_integration.invocation}<//
                >`,
              ],
            ]
          : [];
        const iteration3TopSummary = iteration3
          ? `Iteration 3 evidence (${iteration3.status || "status pending"}): ${iteration3.finding || "The three source-pinned suite variants are still being reviewed."}`
          : "Iteration 3 source-pinned comparisons are loading; no result is inferred while evidence is unavailable.";
        const centralTargets = [
          "//agentplane/system_tests/suites/mcp:test_gateway_crash",
          "//agentplane/system_tests/suites/mcp:test_gateway_budget",
          "//agentplane/system_tests/suites/mcp:test_sampler_roll",
          "//agentplane/system_tests/suites/mcp:test_history_outage",
        ];
        const comparisonRows = centralTargets.map((target) => {
          const targetName = target.split(":").pop();
          const row = comparison?.targets?.find(
            (candidate) =>
              candidate.label === target ||
              candidate.label?.endsWith(targetName),
          );
          return [
            row?.label || target,
            seconds(row?.control_process_seconds),
            seconds(row?.candidate_process_seconds),
            seconds(row?.control_setup_seconds),
            seconds(row?.candidate_setup_seconds),
            seconds(row?.control_case_seconds),
            seconds(row?.candidate_case_seconds),
            row?.outcome ||
              "Pending final source-qualified candidate comparison",
          ];
        });
        const nativeRows = nativeIteration?.observations?.length
          ? nativeIteration.observations.map((run, index) => [
              index + 1,
              run.arm,
              run.invocation
                ? html`<${Anchor}
                    href=${`https://app.buildbuddy.io/invocation/${run.invocation}`}
                    >${run.invocation}<//
                  >`
                : "Pending",
              seconds(run.test_seconds),
              seconds(run.process_seconds),
              seconds(run.cpu_seconds),
            ])
          : [
              [
                "Pending",
                "Native ABBA",
                "Final ordered observations pending",
                "Pending",
                "Pending",
                "Pending",
              ],
            ];
        const iteration3Specs = [
          { key: "control", label: "Control · 6369d22" },
          { key: "concurrent_only", label: "Concurrent-only · defe54fa" },
          { key: "combined_profile", label: "Combined profile · 6fc4da6" },
        ];
        const iteration3Sources = iteration3?.source_provenance?.variants || [];
        const iteration3StatusColor = (status) =>
          /fail|error/i.test(status || "")
            ? "red"
            : /pass|complete/i.test(status || "")
              ? "green"
              : /pending|running|queued/i.test(status || "")
                ? "yellow"
                : "gray";
        const invocationIdPattern =
          /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
        const linkInvocationIds = (value) =>
          String(value)
            .split(
              /([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/gi,
            )
            .map((part, index) =>
              invocationIdPattern.test(part)
                ? html`<${Anchor}
                    href=${`https://app.buildbuddy.io/invocation/${part}`}
                    key=${index}
                    >${part}<//
                  >`
                : part,
            );
        const iteration3Timing = (value, status) => {
          if (Number.isFinite(value)) return seconds(value);
          return /pending|running|queued|accepted|submitted/i.test(status || "")
            ? "Pending"
            : "Not measured";
        };
        const iteration3SourceCell = (spec, variant, sourceVariant) => {
          const label = sourceVariant?.label || variant?.label || spec.label;
          return html`<${Stack} gap="xs">
            <${Text} fw=${600}>${label}<//>
            ${
              sourceVariant?.commit
                ? html`<${Anchor}
                    href=${`${repo}/commit/${sourceVariant.commit}`}
                    >${sourceVariant.commit}<//
                  >`
                : "Source commit pending"
            }
            ${sourceVariant?.branch ? html`<${Text} size="xs" c="dimmed">${sourceVariant.branch}<//>` : null}
            ${sourceVariant?.source_note ? html`<${Text} size="xs">${sourceVariant.source_note}<//>` : null}
          <//>`;
        };
        const iteration3VariantRows = iteration3Specs.map((spec) => {
          const variant = iteration3?.variants?.find(
            (candidate) => candidate.key === spec.key,
          );
          const sourceVariant = iteration3Sources.find(
            (candidate) => candidate.key === spec.key,
          );
          const status = variant?.status || "PENDING";
          const outcome = variant?.outcome || "Run result pending";
          const notes = [
            ...(variant?.failures || []).map(
              (failure) => `Failure: ${failure}`,
            ),
            ...(variant?.pending || []).map((pending) => `Pending: ${pending}`),
          ];
          return [
            iteration3SourceCell(spec, variant, sourceVariant),
            html`<${Badge} miw=${80} color=${iteration3StatusColor(status)}
              >${status}<//
            >`,
            html`<${Stack} gap="xs">
              <${Text} size="sm">${outcome}<//>
              ${notes.map(
                (note) =>
                  html`<${Text}
                    size="sm"
                    c=${note.startsWith("Pending:") ? "orange" : "red"}
                    >${note}<//
                  >`,
              )}
            <//>`,
          ];
        });
        const iteration3RunRows = iteration3Specs.flatMap((spec) => {
          const variant = iteration3?.variants?.find(
            (candidate) => candidate.key === spec.key,
          );
          const sourceVariant = iteration3Sources.find(
            (candidate) => candidate.key === spec.key,
          );
          const label = sourceVariant?.label || variant?.label || spec.label;
          const runs = variant?.runs?.length ? variant.runs : [null];
          return runs.map((run, index) => {
            const status = run?.status || variant?.status || "PENDING";
            const attemptLink = run?.url
              ? html`<${Anchor} href=${run.url}
                  >${run.invocation || "BuildBuddy invocation"}<//
                >`
              : run?.invocation
                ? html`<${Anchor}
                    href=${`https://app.buildbuddy.io/invocation/${run.invocation}`}
                    >${run.invocation}<//
                  >`
                : "Pending invocation";
            const notes = [
              ...(index === 0 ? variant?.failures || [] : []).map(
                (failure) => `Failure: ${failure}`,
              ),
              ...(index === 0 ? variant?.pending || [] : []).map(
                (pending) => `Pending: ${pending}`,
              ),
            ];
            return [
              label,
              iteration3Timing(run?.process_seconds, status),
              iteration3Timing(run?.setup_seconds, status),
              iteration3Timing(run?.cpu_seconds, status),
              iteration3Timing(run?.test_seconds, status),
              html`<${Badge} miw=${80} color=${iteration3StatusColor(status)}
                >${status}<//
              >`,
              attemptLink,
              html`<${Stack} gap="xs">
                <${Text} size="sm"
                  >${run?.note || (index === 0 ? variant?.outcome || "No run result recorded" : "")}<//
                >
                ${notes.map(
                  (note) =>
                    html`<${Text}
                      size="sm"
                      c=${note.startsWith("Pending:") ? "orange" : "red"}
                      >${note}<//
                    >`,
                )}
              <//>`,
            ];
          });
        });
        const iteration3ProjectionSpike = iteration3?.projection_spike;
        const iteration3ProjectionRuns = iteration3ProjectionSpike?.runs?.length
          ? iteration3ProjectionSpike.runs
          : [null];
        const iteration3ProjectionConfigRows = (

                  "Real authority + database + envtest API; actual identities and negative grants. Compose real adjacent services only when testing their wire contract.",
                  "MCP OAuth, launcher scope, parent/delegated identity, budget and action routing. Existing recordingDispatcher/fakeHistory fixtures are not equivalent coverage.",
                ],
                [
                  "Idle / resume / lifecycle",
                  "Existing controller fake-clock timing matrix + real API ownership tests; focused Runtime retained-turn contract.",
                  "Real >=60s idle suspension, lifecycle denial, operator resume, changed Pod UID, retained Sandbox UID and failed turn. Keep unique integration assertions until mapped.",

                [
                  "PKI / Secret / platform",
                  "Native TLS negatives + real controller/API checks for issuer and ownership logic.",
                  "Actual projected Secret rotation and positive ready control, cert-manager issuance, RBAC, Pod/VM/Firecracker boot, storage and isolation.",

                [
                  "App / browser / user journey",
                  "App owns route and projection fixtures with real database/service contracts; narrow browser targets with explicit assets.",

                ],
              ]}
            />
            ${p("The detailed 13-suite inventory and source pointers are in evidence.json. The matrix is a migration proposal: no existing assertion has been declared redundant merely because the pilot passes. Each migration PR must enumerate its removed duplicate assertions and retained unique witnesses.")}
            <${Anchor} href="evidence.json"
              >Reviewed source and contract inventory<//
            >
          <//>
          <${Section} id="spike" title="The bounded spike and what it proves">
            ${error ? html`<${Alert} color="red">${error}<//>` : null}
            ${
              data
                ? html`<${Paper} withBorder p="lg" radius="md">
                    <${Badge}
                      color=${data.pilot.status === "passed" ? "teal" : "orange"}
                      >${data.pilot.label}<//
                    >
                    ${p(data.pilot.summary)}
                    <${Rows}
                      headers=${["Run / control", "Native outcome", "Physical test time", "Evidence"]}
                      rows=${data.pilot.runs.map((r) => [r.label, r.outcome, r.process_seconds == null ? "Not available" : `${r.process_seconds.toFixed(3)}s`, html`<${Anchor} href=${r.url}>${r.invocation}<//>`])}
                    />
                    ${p(data.pilot.limits)}
                    <${Group} gap="md"
                      ><${Anchor} href=${data.pilot.branch_url}
                        >Pivot source branch<//
                      ><${Anchor}
                        href=${data.pilot.pr_url || data.pilot.branch_url}
                        >${data.pilot.pr_url ? "Source PR" : "Experimental target"}<//
                      ><${Anchor} href=${issue}
                        >Measurement tracker #16099<//
                      ><//
                    >
                  <//>`
                : p("Loading reviewed native spike evidence…")
            }
            ${p("A passing recovery test establishes that this fixture can exercise a production service boundary without the full cluster. Repeated physical passes test feasibility, not a low flake rate. An injected outage exercises an error path; the discarded-journal control was rejected at the retained Session inventory assertion. The outage starts after a completed turn and is a graceful listener stop, so active-turn recovery and abrupt crash remain untested. Neither is a complete historical-regression or mutant campaign.")}
            ${p("There is no valid subtraction between this small pilot's action time and the earlier 21-case Pod suite. The candidate gate still needs its other contracts and real acceptance. Complete feedback savings remain unmeasured until the shadow/replay phase.")}
          <//>
          <${Section}
            id="rollout"
            title="One architecture PR, staged proof checkpoints"
          >
            ${p("Every source milestone stays on draft PR #16102. Use commits for implementation and measurement checkpoints; keep the existing required gate and frequency until the candidate graph, user-journey coverage and whole-PR evidence have been reviewed.")}
            <${Accordion} multiple variant="separated"
              >${lanes.map(([title, detail], i) => html`<${Accordion.Item} key=${i} value=${`p${i + 1}`}><${Accordion.Control}>${title}<//><${Accordion.Panel}>${p(detail)}<//><//>`)}<//
            >
            <${Anchor} href=${issue}
              >#16099 tracks the deliverables and future measurements<//
            >
          <//>
          <${Section} id="acceptance" title="What evidence can change the gate">
            <${Rows}
              headers=${["Proof", "Experiment / required observation", "Stop or retain current gate if…"]}
              rows=${[
                [
                  "Regression sensitivity",
                  "Inventory each unique assertion. Add known fixes and reviewed seeded defects: lost journal, duplicate admission, stale incarnation, wrong issuer, History cursor gap, unauthorized delegation and browser reconnect. Healthy positive controls must pass.",
                  "Any reviewed defect escapes, a negative is vacuous, or a deployment/app assertion lacks an owner.",
                ],
                [
                  "Physical feasibility",
                  "Exact-source repeats, fault-path cleanup, same-journal restart, independent case identities, generated inputs and actual service processes. The native repeat has 25 exposures per contract; review shared-fixture correlation and negative-control reach.",
                  "State leaks, a hidden app/K3s dependency returns, a substituted service changes the guarantee, or setup shifts to an unmeasured layer.",
                ],
                [
                  "Whole-gate speed",
                  "30 pinned base/head pairs, 100 fresh contract executions, three busy windows and a four-PR burst. Keep required contexts, reruns and failed/cancelled outcomes; measure exact-head workflow creation through all required checks.",
                  "Only a phase is faster, a required user journey is lost, sample exposure is unmatched, or capacity merely moves the queue.",
                ],
                [
                  "Reliability",
                  "Record fresh physical failures separately from result-stream false reds and cached results. Publish denominators, attempt counts, signatures, rerun delay and intervals. No blanket retry or raised timeout.",
                  "A new unexplained failure/cleanup signature appears. State the denominator and independence assumptions; 100 correlated case exposures do not equal 100 independent failure trials.",
                ],
                [
                  "First feedback target",
                  "First target: rerun-inclusive backend mean <4m and p90 <8m, timed from exact-head workflow creation to all required successful checks; use push timestamps where available. This is a target, not a floor or forecast.",
                  "The data do not meet the target; continue while the best remaining candidate can repay within about a quarter, then apply the accepted two-probe stop rule.",
                ],
              ]}
            />
            ${p("For matched gate evidence, pin original base/head pairs and both architecture trees, preserve merge-tree provenance, counterbalance control/candidate order, and retain all outcomes. Replays estimate graph behavior; live PRs establish required-feedback clocks. Queue, worker preparation, execution, CPU and artifact gates remain separate. Do not equate all saved CI wall time with developer time saved.")}
          <//>
          <${Section}
            id="prior-work"
            title="Disposition of the earlier ten lanes"
          >
            ${p("Keep the usable-image import candidate as a separate setup improvement: its warm same-worker ABBA result was 14.776s shorter setup, without a proved complete-CI saving. Keep browser/VM/auth and execution-stream recurrence tracking in #16034. Those investigations complement this pivot and do not need to finish before its fixtures can be built.")}
            ${p("MCP overlap shortened a case envelope but increased whole-action time; harness mounts barely changed declared bytes. The KVM burst exhausted three registered slots and Pod remained the long pole. These results reject those particular arrangements as established CI wins; they do not rule out a smaller graph, different grouping or adequately provisioned capacity. Infrastructure snapshots and Pod runner pooling already exist. The parked persistent shared-cluster spike is not an operational fixture to assume.")}
            <${Group} gap="md"
              ><${Anchor} href="../latency/#ten-lane-followups"
                >Latency experiments<//
              ><${Anchor} href="../reliability/#ten-lane-followups"
                >Reliability follow-ups<//

                >Existing exposure tracker<//
              ><${Anchor} href=${`${repo}/pull/15214`}
                >Held image split #15214<//
              ><//
            >
          <//>
          <${Text} size="sm" c="dimmed" mt="xl"
            >Proposed architecture and observed pilot are distinct from merged
            policy, production rollout and measured feedback improvement.
            Publication goes through a PR to gh-pages; this page redeploys after
            that PR merges.<//
          >
          <${Group} gap="md" mt="md"
            ><${Anchor} href="evidence.json">Evidence JSON<//
            ><${Anchor} href="manifest.json">Source manifest<//
            ><${Anchor} href="visual-validation.json">RBE visual proof<//><//

        <//>`;
