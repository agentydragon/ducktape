<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentplane test architecture</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript>This plan uses JavaScript for Mantine components.</noscript>
    <script type="module">
      import { useEffect, useState } from "react";
      import {
        Alert,
        Anchor,
        Box,
        Container,
        Group,
        Stack,
        Table,
        Text,
        Title,
      } from "@mantine/core";
      import { html, mount } from "../report.js";
      const repo = "https://github.com/agentydragon/ducktape";
      const paragraph = (text) =>
        html`<${Text} component="p" my="sm">${text}<//>`;
      function Section({ id, title, children }) {
        return html`<${Box} component="section" id=${id} my="xl"
          ><${Title} order=${2} mb="md">${title}<//>${children}<//
        >`;
      }
      function Rows({ headers, rows }) {
        return html`<${Table.ScrollContainer} minWidth=${700}
          ><${Table}
            striped
            withTableBorder
            withColumnBorders
            verticalSpacing="sm"
          >
            <${Table.Thead}
              ><${Table.Tr}
                >${headers.map((label) => html`<${Table.Th} key=${label}>${label}<//>`)}<//
              ><//
            >
            <${Table.Tbody}
              >${rows.map((row, i) => html`<${Table.Tr} key=${i}>${row.map((cell, j) => html`<${Table.Td} key=${j}>${cell}<//>`)}<//>`)}<//
            >
          <//><//
        >`;
      }
      function Report() {
        const [data, setData] = useState(null);
        const [error, setError] = useState(null);
        useEffect(() => {
          const controller = new AbortController();
          fetch("evidence.json", { signal: controller.signal })
            .then((response) => {
              if (!response.ok)
                throw new Error(`Evidence HTTP ${response.status}`);
              return response.json();
            })
            .then(setData)
            .catch((caught) => {
              if (caught.name !== "AbortError") setError(caught.message);
            });
          return () => controller.abort();
        }, []);
        if (error)
          return html`<${Container} py="xl"
            ><${Alert} color="red">${error}<//><//
          >`;
        if (!data)
          return html`<${Container} py="xl"
            ><${Text}>Loading current branch evidence…<//><//
          >`;
        const audit = data.source_audit;
        const history = data.historical;
        const links = (entries) =>
          html`<${Group} gap="sm">
            ${entries.map((entry) => html`<${Anchor} key=${entry.url} href=${entry.url}>${entry.label}<//>`)}
          <//>`;
        return html`<${Container}
          size="lg"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
        >
          <${Anchor} href="../">All reports<//>
          <${Title} order=${1} mt="md">Agentplane test architecture<//>
          ${paragraph(audit.headline)}
          <${Group} gap="md" mt="sm">
            <${Anchor} href=${repo + "/commit/" + audit.source_devel_commit}
              >${"devel " + audit.source_devel_commit.slice(0, 10)}<//
            >
            <${Text} size="sm" c="dimmed"
              >${"Reviewed " + audit.audited_at_utc.slice(0, 10) + " UTC"}<//
            >
          <//>
          <${Group} component="nav" gap="md" mt="md">
            <${Anchor} href="#pytest-fixtures">Fixture ownership<//>
            <${Anchor} href="#next">Next actions<//>
            <${Anchor} href="#validation">Verification<//>
            <${Anchor} href="#devel-pod-concurrency">Historical measurements<//>
          <//>
          <${Section} id="pytest-fixtures" title="Fixture ownership on devel">
            <${Rows}
              headers=${["Boundary", "Current coverage", "Guardrail", "Evidence"]}
              rows=${audit.boundaries.map((row) => [row.heading, row.finding, row.action, links(row.links)])}
            />
            ${paragraph(audit.scope)} ${paragraph(audit.comparison.finding)}
            ${links(audit.comparison.links)}
          <//>
          <${Section} id="next" title="Ranked next actions">
            <${Rows}
              headers=${["Step", "Experiment", "Decision gate"]}
              rows=${audit.actions}
            />
          <//>
          <${Section} id="validation" title="Current verification">
            ${audit.validation ? html`${paragraph(audit.validation.summary)}${links(audit.validation.links)}` : null}
            <${Anchor} href="evidence.json">Evidence and case inventory<//>
            <${Anchor} href="manifest.json"> Manifest<//>
          <//>
          ${
            history.devel_pod_concurrency &&
            html`<${Section}
              id="devel-pod-concurrency"
              title="Historical concurrency port: matched 22-case cohort"
            >
              ${paragraph(history.devel_pod_concurrency.decision)}
              <${Rows}
                headers=${["Case slots", "Fresh passes", "Mean action (s)", "Mean case envelope (s)", "Mean CPU (s)", "Maximum action memory (GiB)", "Immutable runs"]}
                rows=${history.devel_pod_concurrency.rows.map((row) => [
                  row.slots,
                  row.passes + "/" + row.runs,
                  row.mean_action_seconds.toFixed(1),
                  row.mean_case_envelope_seconds.toFixed(1),
                  row.mean_cpu_seconds.toFixed(1),
                  row.max_action_memory_gib.toFixed(2),
                  html`<${Group} gap="xs"
                    >${row.invocations.map((id, index) => html`<${Anchor} key=${id} href=${"https://app.buildbuddy.io/invocation/" + id}>${"Run " + (index + 1)}<//>`)}<//
                  >`,
                ])}
              />
              ${paragraph(history.devel_pod_concurrency.scope)}
              ${paragraph(history.devel_pod_concurrency.memory_finding)}
              ${paragraph("Observation window: " + history.devel_pod_concurrency.window_start_utc + " to " + history.devel_pod_concurrency.window_end_utc)}
              <${Stack} gap="xs">
                <${Anchor}
                  style=${{ overflowWrap: "anywhere" }}
                  href=${repo + "/commit/" + history.devel_pod_concurrency.source_base}
                  >${"devel base " + history.devel_pod_concurrency.source_base}<//
                >
                <${Anchor}
                  style=${{ overflowWrap: "anywhere" }}
                  href=${repo + "/commit/" + history.devel_pod_concurrency.source_head}
                  >${"Fixed benchmark source " + history.devel_pod_concurrency.source_head}<//
                >
                <${Anchor} href=${repo + "/pull/16659"}
                  >Independent devel PR #16659<//
                >
              <//>
            <//>`
          }
          ${
            history.pod_concurrency &&
            html`<${Section}
              id="pod-concurrency"
              title="Historical 15-case concurrency screen: fixed memory settings"
            >
              ${paragraph(history.pod_concurrency.decision)}
              <${Rows}
                headers=${["Case slots", "Fresh passes", "Mean action (s)", "Mean case envelope (s)", "Mean CPU (s)", "Maximum action memory (GiB)", "Immutable runs"]}
                rows=${history.pod_concurrency.rows.map((row) => [
                  row.slots,
                  row.passes + "/" + row.runs,
                  row.mean_action_seconds.toFixed(1),
                  row.mean_case_envelope_seconds.toFixed(1),
                  row.mean_cpu_seconds.toFixed(1),
                  row.max_action_memory_gib.toFixed(2),
                  html`<${Group} gap="xs"
                    >${row.invocations.map((id, index) => html`<${Anchor} key=${id} href=${"https://app.buildbuddy.io/invocation/" + id}>${"Run " + (index + 1)}<//>`)}<//
                  >`,
                ])}
              />
              ${paragraph(history.pod_concurrency.scope)}
              ${paragraph(history.pod_concurrency.memory_finding)}
              <${Anchor}
                href=${repo + "/commit/" + history.pod_concurrency.source_head}
                >Fixed benchmark source<//
              >
            <//>`
          }
          <${Section}
            id="measurements"
            title="Retained experiment evidence at original sources"
          >
            <${Rows}
              headers=${["Screen", "Observed result", "What it establishes"]}
              rows=${history.current_screens.map((row) => [
                html`<${Anchor} href=${row.url}>${row.title}<//>`,
                row.result,
                row.scope,
              ])}
            />
            ${paragraph("The selector screen replays exact historical changes to one source file at a time through the production bazel-diff algorithm and tag filtering. It does not replay each entire historical PR. Selected-test counts, action execution time and complete required feedback are different measures. Raw JUnit, traces and execution payloads remain private; reviewed summaries retain immutable source and invocation links.")}
          <//>
          <${Group} mt="sm">
            <${Anchor} href=${history.records.previous_report}
              >Earlier report snapshot<//
            >
            <${Anchor} href=${history.records.experiments}
              >Immutable experiment records<//
            >
            <${Anchor} href=${repo + "/pull/16489"}>Source PR #16489<//>
            <${Anchor} href=${repo + "/issues/16099"}
              >Follow-up tracker #16099<//
            >
            <${Anchor} href="evidence.json">Current evidence<//
            ><${Anchor} href="manifest.json">Manifest<//>
          <//>
        <//>`;
      }
      mount(Report);
    </script>
  </body>
</html>
