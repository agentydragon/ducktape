<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentplane fast CI architecture plan</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript>This plan uses JavaScript for Mantine components.</noscript>
    <script type="module">
      import { useEffect, useState } from "react";
      import {
        Alert,
        Anchor,
        Badge,
        Box,
        Container,
        Group,
        Paper,
        SimpleGrid,
        Stack,
        Table,
        Text,
        Title,
      } from "@mantine/core";
      import { html, mount } from "../report.js";
      const repo = "https://github.com/agentydragon/ducktape";
      const paragraph = (text) =>
        html`<${Text} component="p" my="sm">${text}<//>`;
      function Section({ id, title, children }) {
        return html`<${Box} component="section" id=${id} my="xl"
          ><${Title} order=${2} mb="md">${title}<//>${children}<//
        >`;
      }
      function Rows({ headers, rows }) {
        return html`<${Table.ScrollContainer} minWidth=${700}
          ><${Table}
            striped
            withTableBorder
            withColumnBorders
            verticalSpacing="sm"
          >
            <${Table.Thead}
              ><${Table.Tr}
                >${headers.map((label) => html`<${Table.Th} key=${label}>${label}<//>`)}<//
              ><//
            >
            <${Table.Tbody}
              >${rows.map((row, i) => html`<${Table.Tr} key=${i}>${row.map((cell, j) => html`<${Table.Td} key=${j}>${cell}<//>`)}<//>`)}<//
            >
          <//><//
        >`;
      }
      function Report() {
        const [data, setData] = useState(null);
        const [error, setError] = useState(null);
        useEffect(() => {
          const controller = new AbortController();
          fetch("evidence.json", { signal: controller.signal })
            .then((response) => {
              if (!response.ok)
                throw new Error(`Evidence HTTP ${response.status}`);
              return response.json();
            })
            .then(setData)
            .catch((caught) => {
              if (caught.name !== "AbortError") setError(caught.message);
            });
          return () => controller.abort();
        }, []);
        if (error)
          return html`<${Container} py="xl"
            ><${Alert} color="red">${error}<//><//
          >`;
        if (!data)
          return html`<${Container} py="xl"
            ><${Text}>Loading current branch evidence…<//><//
          >`;
        const source = (path, revision = data.source.head) =>
          `${repo}/blob/${revision}/${path}`;
        const link = (path, label, revision) =>
          html`<${Anchor} href=${source(path, revision)}>${label}<//>`;
        return html`<${Container} size="lg" py="xl">
          <${Anchor} href="../">All reports<//>
          <${Title} order=${1} mt="md">Agentplane CI: current branch plan<//>
          ${paragraph("A current comparison of devel and experimental PR #16489 after rebasing. The goal is good PR regression coverage with at least 30% faster complete required feedback, allowing up to 25% more compute. That latency improvement is not yet proven.")}
          <${Paper} withBorder p="md" radius="md">
            <${Stack} gap="xs">
              <${Text}>${"Reviewed " + data.observed_at_utc}<//>
              <${Anchor}
                style=${{ overflowWrap: "anywhere" }}
                href=${repo + "/commit/" + data.source.base}
                >${"devel base " + data.source.base}<//
              >
              <${Anchor}
                style=${{ overflowWrap: "anywhere" }}
                href=${repo + "/commit/" + data.source.head}
                >${"PR head " + data.source.head}<//
              >
              <${Group}
                ><${Badge} color="blue">Draft experiment<//
                ><${Badge}
                  color=${data.validation.implementation_checks_passed ? "green" : "yellow"}
                  >${data.validation.summary}<//
                ><//
              >
              <${Anchor}
                href=${repo + "/compare/" + data.source.base + "..." + data.source.head}
                >Exact remaining diff<//
              >
            <//>
          <//>
          <${Group} mt="md" gap="lg">
            <${Anchor} href="#devel">Already on devel<//
            ><${Anchor} href="#branch">Remaining branch changes<//>
            <${Anchor} href="#pytest-fixtures">Fixture ownership<//
            ><${Anchor} href="#next">Next work<//>
            <${Anchor} href="#validation">Validation<//>
          <//>
          <${Alert} mt="lg" color="blue" title="Current decision">
            ${data.decision}
          <//>
          <${Section} id="devel" title="What devel already has">
            ${paragraph("These mechanisms are part of the rebased base and are not claimed as new improvements in this PR.")}
            <${Rows}
              headers=${["Existing mechanism", "Current owner"]}
              rows=${data.already_on_devel.map((row) => [row.description, link(row.path, row.label, data.source.base)])}
            />
          <//>
          <${Section} id="branch" title="What PR #16489 still adds">
            <${Rows}
              headers=${["Boundary", "Remaining change", "Coverage retained"]}
              rows=${data.remaining_changes.map((row) => [link(row.path, row.label), row.change, row.retained])}
            />
            ${paragraph("The split changes dependency and ownership boundaries. Direct native clients replace App access only where the scenario's assertion does not require the App. The App-backed delegated Action journey, real Pod/VM/Firecracker paths, trust, RBAC, Secret projection, policy revocation and deployment packaging remain covered. Selection still follows Bazel dependencies; there is no new blind path filter or manual-only replacement for required acceptance.")}
          <//>
          <${Section}
            id="pytest-fixtures"
            title="Fixture reuse and pytest lifecycle"
          >
            <${SimpleGrid} cols=${{ base: 1, sm: 3 }}>
              <${Paper} withBorder p="md"
                ><${Title} order=${3}>Deployment<//
                >${paragraph("Build and start once per Bazel test action. Distinct deployment profiles declare their actual workloads and image sets.")}<//
              >
              <${Paper} withBorder p="md"
                ><${Title} order=${3}>Compatible probes<//
                >${paragraph("The platform module shares native clients and one ordinary Pod across three trust probes. Every lease rechecks the full Sandbox target, Pod UID and readiness.")}<//
              >
              <${Paper} withBorder p="md"
                ><${Title} order=${3}>Mutating scenarios<//
                >${paragraph("Failed or replaced leases are discarded before reuse. Impostor workloads, revocation and lifecycle resources stay owned by their individual cases.")}<//
              >
            <//>
            ${paragraph("Use standard pytest yield fixtures, pytest-asyncio's module loop and AsyncExitStack. Devel already supplies the shared cancellation-safe cleanup drain and diagnostic failure precedence, including merged PR #16615. The native Pod pool uses those existing owners.")}
            ${paragraph("Common pytest hooks now own tracing, harness parameters and scripted models. Suites needing App clients, model discovery or App-backed Sandbox ownership explicitly load app_fixtures. MCP operator-login fixtures also load explicitly. Shared Sandbox types and template names have no App client dependency; App lifecycle operations live in app_sandbox. The native suites therefore keep the shared reporting machinery without loading App code.")}
            ${paragraph("Exact UIDs, acknowledged-create registration before readiness, uncertain-create ownership, deletion order and private secondary-error notes remain domain responsibilities. A general pytest plugin cannot infer those contracts.")}
            <${Alert}
              color="blue"
              title="Required acceptance and manual comparisons"
            >
              The required Pod target keeps CaseBatch. Manual ordinary-pytest
              targets call the same scenario functions with the same marks.
              Their two stacks group compatible shared-runner probes together
              and keep the fresh-inventory storage check first. Promotion also
              needs complete-feedback, compute and failure-isolation evidence.
              Actual fixtures still use pytest-asyncio.
            <//>
          <//>
          <${Section} id="measurements" title="Current experiment evidence">
            <${Rows}
              headers=${["Screen", "Observed result", "What it establishes"]}
              rows=${data.current_screens.map((row) => [
                html`<${Anchor} href=${row.url}>${row.title}<//>`,
                row.result,
                row.scope,
              ])}
            />
            ${paragraph("The selector screen replays exact historical changes to one source file at a time through the production bazel-diff algorithm and tag filtering. It does not replay each entire historical PR. Selected-test counts, action execution time and complete required feedback are different measures. Raw JUnit, traces and execution payloads remain private; reviewed summaries retain immutable source and invocation links.")}
          <//>
          <${Section}
            id="next"
            title="Next work toward a substantial feedback improvement"
          >
            <${Rows}
              headers=${["Step", "Concrete change or experiment", "Decision gate"]}
              rows=${data.next_steps.map((row) => [row.title, row.action, row.acceptance])}
            />
            ${paragraph("Count complete required feedback from PR update through every required check, including failures, cancellations and reruns. Keep queue time, setup, test execution, worker occupancy and observed CPU as separate clocks. Do not add overlapping setup savings, mistake requested resources for capacity, or infer a flake rate from a small passing sample.")}
          <//>
          <${Section} id="validation" title="Validation of the rebased branch">
            ${paragraph(data.validation.detail)}
            <${Stack} gap="xs"
              >${(data.validation.links || []).map((entry) => html`<${Anchor} key=${entry.url} href=${entry.url}>${entry.label}<//>`)}<//
            >
            ${paragraph("Correctness checks and focused ownership tests do not establish a CI speedup or a reliability-rate improvement. Broad performance qualification remains open.")}
          <//>
          <${Text} size="sm" c="dimmed"
            >Earlier report snapshots and benchmark sources are records, not the
            current branch state.<//
          >
          <${Group} mt="sm">
            <${Anchor} href=${data.records.previous_report}
              >Earlier report snapshot<//
            >
            <${Anchor} href=${data.records.experiments}
              >Immutable experiment records<//
            >
            <${Anchor} href=${repo + "/pull/16489"}>Source PR #16489<//>
            <${Anchor} href=${repo + "/issues/16099"}
              >Follow-up tracker #16099<//
            >
            <${Anchor} href="evidence.json">Current evidence<//
            ><${Anchor} href="manifest.json">Manifest<//>
          <//>
        <//>`;
      }
      mount(Report);
    </script>
  </body>
</html>
