<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ducktape reports</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript
      >This report uses JavaScript for Mantine components and charts.</noscript
    >
    <script type="module">
      import {
        Anchor,
        Box,
        Code,
        Container,
        Paper,
        SimpleGrid,
        Text,
        Title,
      } from "@mantine/core";
      import { html, mount, ManifestStamp } from "./report.js";
      function Report() {
        return html`<${Container}
          component=${"main"}
          size="74rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
        >
          <header>
            <${Title} order=${1} mt="md" mb="sm"> ${"Ducktape reports"} <//>
            <${Text} component="p" my="sm">
              ${" Latest-only snapshots served by GitHub Pages at "}
              <${Anchor} href=${"https://agentydragon.github.io/ducktape/"}>
                ${"agentydragon.github.io/ducktape"}
              <//>
              ${", published from the "}
              <${Anchor}
                href=${"https://github.com/agentydragon/ducktape/tree/gh-pages"}
              >
                <${Code}
                  style=${{ whiteSpace: "normal", overflowWrap: "anywhere" }}
                >
                  ${"gh-pages"}
                <//>
              <//>
              ${" branch. CI reports include their reviewed measurements as "}
              <${Code}
                style=${{ whiteSpace: "normal", overflowWrap: "anywhere" }}
              >
                ${"evidence.json"}
              <//>
              ${" and source commit and observation window in "}
              <${Code}
                style=${{ whiteSpace: "normal", overflowWrap: "anywhere" }}
              >
                ${"manifest.json"}
              <//>
              ${". Other reports describe their scope and dates on the page. Earlier versions are in the branch's git history. "}
            <//>
          </header>
          <${SimpleGrid}
            component=${"section"}
            cols=${{ base: 1, sm: 2, lg: 3 }}
            spacing="md"
          >
            <${Paper} component="article" withBorder p="lg" radius="md" my="md">
              <${Title} order=${2} mt="md" mb="sm">
                <${Anchor} href=${"agentplane-test-architecture/"}>
                  ${"Agentplane test architecture"}
                <//>
              <//>
              <${Text} component="p" my="sm">
                ${"Concrete fast-CI plan, real-service recovery pilot, retained deployment coverage and measured gate-adoption criteria."}
              <//>
              <${ManifestStamp}
                src=${"agentplane-test-architecture/manifest.json"}
              />
              <${Text} component="p" my="sm">
                <${Anchor} href=${"agentplane-test-architecture/evidence.json"}>
                  ${"evidence"}
                <//>
                ${" · "}
                <${Anchor} href=${"agentplane-test-architecture/manifest.json"}>
                  ${"manifest"}
                <//>
              <//>
            <//>
            <${Paper} component="article" withBorder p="lg" radius="md" my="md">
              <${Title} order=${2} mt="md" mb="sm">
                <${Anchor} href=${"upstream-patches/"}>
                  ${"Upstream patches and issues"}
                <//>
              <//>
              <${Text} component="p" my="sm">
                ${"Upstream fixes, open issues and local patches with evidence and next actions."}
              <//>
              <${ManifestStamp} src=${"upstream-patches/manifest.json"} />
              <${Text} component="p" my="sm">
                <${Anchor} href=${"upstream-patches/evidence.json"}>
                  ${"evidence"}
                <//>
              <//>
            <//>
            <${Paper} component="article" withBorder p="lg" radius="md" my="md">
              <${Title} order=${2} mt="md" mb="sm">
                <${Anchor} href=${"latency/"}> ${"Latency"} <//>
              <//>
              <${Text} component="p" my="sm">
                ${" Current devel-base backend feedback, ten dispatched experiments, and explicit follow-up measurements; earlier populations retain their windows. "}
              <//>
              <${ManifestStamp} src=${"latency/manifest.json"} />
              <${Text} component="p" my="sm">
                <${Anchor} href=${"latency/evidence.json"}> ${"evidence"} <//>
                ${" · "}
                <${Anchor} href=${"latency/manifest.json"}> ${"manifest"} <//>
              <//>
            <//>
            <${Paper} component="article" withBorder p="lg" radius="md" my="md">
              <${Title} order=${2} mt="md" mb="sm">
                <${Anchor} href=${"reliability/"}> ${"Reliability"} <//>
              <//>
              <${Text} component="p" my="sm">
                ${" Fresh browser and VM failure evidence, native result-recovery controls, and ten tracked follow-ups; historical failure populations keep their original denominators. "}
              <//>
              <${ManifestStamp} src=${"reliability/manifest.json"} />
              <${Text} component="p" my="sm">
                <${Anchor} href=${"reliability/evidence.json"}>
                  ${"evidence"}
                <//>
                ${" · "}
                <${Anchor} href=${"reliability/manifest.json"}>
                  ${"manifest"}
                <//>
              <//>
            <//>
            <${Paper} component="article" withBorder p="lg" radius="md" my="md">
              <${Title} order=${2} mt="md" mb="sm">
                <${Anchor} href=${"visual-reliability/"}>
                  ${"Visual reliability"}
                <//>
              <//>
              <${Text} component="p" my="sm">
                ${" Inspected gallery images, viewport identity, browser fixture failures, baseline provenance, and unchanged-source repeats. "}
              <//>
              <${ManifestStamp} src=${"visual-reliability/manifest.json"} />
              <${Text} component="p" my="sm">
                <${Anchor} href=${"visual-reliability/evidence.json"}>
                  ${"evidence"}
                <//>
                ${" · "}
                <${Anchor} href=${"visual-reliability/manifest.json"}>
                  ${"manifest"}
                <//>
              <//>
            <//>
            <${Paper} component="article" withBorder p="lg" radius="md" my="md">
              <${Title} order=${2} mt="md" mb="sm">
                <${Anchor} href=${"bazel-audit/"}> ${"Bazel build audit"} <//>
              <//>
              <${Text} component="p" my="sm">
                ${" Target graph, package ownership, unused wrappers, naming and lint wiring, with prioritized refactoring candidates. "}
              <//>
              <${Text} component="span" size="sm" c="dimmed">
                ${"Source review: 79a2524e7f · 4 November PST / 5 November UTC"}
              <//>
              <${Text} component="p" my="sm">
                <${Anchor} href=${"bazel-audit/evidence.json"}>
                  ${"evidence"}
                <//>
              <//>
            <//>
            <${Paper} component="article" withBorder p="lg" radius="md" my="md">
              <${Title} order=${2} mt="md" mb="sm">
                <${Anchor} href=${"storage/"}>
                  ${"Cluster storage dashboard"}
                <//>
              <//>
              <${Text} component="p" my="sm">
                ${" HDD pool scenarios, Seaweed volume fullness, ranked savings options, and Langfuse, ClickHouse, Zot, Mimir and Loki evidence, with the earlier storage inventory. "}
              <//>
              <${Text} component="span" size="sm" c="dimmed">
                ${"Remediation snapshot: 10 November UTC; inventory: 9 November UTC."}
              <//>
              <${Text} component="p" my="sm">
                <${Anchor} href=${"storage/remediation-evidence.json"}>
                  ${"remediation evidence"}
                <//>
                ${" · "}
                <${Anchor} href=${"storage/evidence.json"}>
                  ${"inventory evidence"}
                <//>
                ${" · "}
                <${Anchor} href=${"storage/manifest.json"}> ${"manifest"} <//>
              <//>
            <//>
            <${Paper} component="article" withBorder p="lg" radius="md" my="md">
              <${Title} order=${2} mt="md" mb="sm">
                <${Anchor} href=${"fixture-model-audit/"}>
                  ${"Fixture and model audit"}
                <//>
              <//>
              <${Text} component="p" my="sm">
                ${" Open risks in preview fixtures, generated-client adapters, test projections, and shared configuration. "}
              <//>
              <${Text} component="span" size="sm" c="dimmed">
                ${"Source review: 69f35d736d · 9 November UTC."}
              <//>
              <${Text} component="p" my="sm">
                <${Anchor} href=${"fixture-model-audit/evidence.json"}>
                  ${"evidence"}
                <//>
                ${" · "}
                <${Anchor} href=${"fixture-model-audit/manifest.json"}>
                  ${"manifest"}
                <//>
              <//>
            <//>
            <${Paper} component="article" withBorder p="lg" radius="md" my="md">
              <${Title} order=${2} mt="md" mb="sm">
                <${Anchor} href=${"agentplane-organization/"}>
                  ${"Agentplane organization"}
                <//>
              <//>
              <${Text} component="p" my="sm">
                ${"Architecture proposal, source inventory, package hierarchy and staged adoption plan."}
              <//>
              <${Text} component="span" size="sm" c="dimmed">
                ${"Source inventory 93f2ba8eef · organization preflight 909a7748b9 · 12 November 2026 · not a live deployment audit."}
              <//>
            <//>
            <${Paper} component="article" withBorder p="lg" radius="md" my="md">
              <${Title} order=${2} mt="md" mb="sm">
                <${Anchor} href=${"agentplane-protocol-shapes/"}>
                  ${"Agentplane protocol shapes"}
                <//>
              <//>
              <${Text} component="p" my="sm">
                ${" Open typed-presence, adapter mapping, config parity, policy vocabulary, and telemetry contracts. "}
              <//>
              <${Text} component="span" size="sm" c="dimmed">
                ${"Source review: 79a2524e7f · 4 November PST / 5 November UTC."}
              <//>
            <//>
          <//>
          <${Box} component="footer" mt="xl">
            <${Text} component="p" my="sm">
              <${Text} component="span" size="sm" c="dimmed">
                ${"Collection and publication tools live on "}
                <${Anchor}
                  href=${"https://github.com/agentydragon/ducktape/tree/devel/devinfra/ci/skills/ci_latency"}
                >
                  ${"devel"}
                <//>
                ${". The site redeploys when "}
                <${Code}
                  style=${{ whiteSpace: "normal", overflowWrap: "anywhere" }}
                >
                  ${"gh-pages"}
                <//>
                ${" changes."}
              <//>
            <//>
          <//>
        <//> `;
      }
      mount(Report);
    </script>
  </body>
</html>
