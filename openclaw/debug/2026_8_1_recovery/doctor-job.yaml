# One-off stopped-writer recovery for the OpenClaw 2026.8.1 bump. Run after
# maintenance-job.yaml, with the Deployment scaled to 0.
#
# Applied by hand: not referenced by any kustomization, and not to be reconciled.
# Background and the full runbook: ./README.md.
#
# Two things make this work where a plain `openclaw doctor --fix` does not:
#   - OPENCLAW_NIX_MODE=0, because the wrapper sets 1 and doctor refuses to repair
#     under it. "" does not work: --set-default expands ${OPENCLAW_NIX_MODE:-1}.
#   - the chown init container, because a PVC root left root:root by a hand restore
#     makes doctor die on EPERM (fchmod) before it reaches the deferred
#     session-store migration, and the error never names the directory.
# One-off stopped-writer maintenance for the OpenClaw 2026.8.1 bump (#5369).
#
# Not referenced by any kustomization: this is applied by hand with the
# Deployment scaled to 0, and must not be reconciled or re-run.
#
# Why it is needed: autoMigrateLegacyState runs migrateLegacyMediaPersistence
# (gated on doctorOnlyStateMigrations, i.e. `doctor --fix`, and holding the
# agent-database maintenance lease) and then migrateHistoricalTranscriptDirectives,
# which is NOT gated and takes no lease. The second step needs the schema the
# first one advances. On gateway startup only the second runs, hits
# `if (readSqliteUserVersion(db) === 17) assertAgentDatabaseMaintenanceAuthority()`
# with no AsyncLocalStorage authority, throws, and completeStartupMigrationPreflight
# turns the resulting warning into a hard exit 1. Under `doctor --fix` the first
# step advances 17 -> 19, so the second finds !== 17 and passes.
apiVersion: batch/v1
kind: Job
metadata:
  name: public-coder-doctor-fix
  namespace: public-coder-agent
spec:
  # One attempt. A partially-applied migration must be inspected, never silently retried.
  backoffLimit: 0
  template:
    metadata:
      labels:
        # Deliberately the Deployment's label: the namespace has no default-deny,
        # so any other label would give this pod unrestricted egress instead of
        # the app/networkpolicy-egress.yaml fence.
        app.kubernetes.io/name: public-coder-agent
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ovh-ns102453
      initContainers:
        - name: chown-state-root
          image: ghcr.io/agentydragon/openclaw:devel-20260904000643-36581b3
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          # Non-recursive on purpose: everything below is already openclaw-owned.
          command:
            - sh
            - -c
            - |
              set -eu
              ls -ld /state
              chown 1000:1000 /state
              ls -ld /state
          volumeMounts:
            - name: data
              mountPath: /state
      containers:
        - name: doctor
          image: ghcr.io/agentydragon/openclaw:devel-20260904000643-36581b3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command:
            - sh
            - -c
            - |
              set -eu
              STATE=/home/openclaw/.openclaw
              BK="$STATE/.maintenance-backup-pre-doctor"

              echo "== backing up session stores, agent databases and config =="
              mkdir -p "$BK"
              for f in "$STATE"/agents/*/sessions/sessions.json "$STATE"/agents/*/agent/openclaw-agent.sqlite; do
                if [ -e "$f" ]; then
                  a=$(basename "$(dirname "$(dirname "$f")")")
                  cp -p "$f" "$BK/$a--$(basename "$f")"
                fi
              done
              cp -p "$STATE/openclaw.json5" "$BK/openclaw.json5.before" 2>/dev/null || true
              du -sh "$BK"

              # Only needed when doctor reports "legacy main rows have no
              # unambiguous configured owner": a legacy agents/main/ predates the
              # multi-agent config and OpenClaw will not guess which live agent
              # inherits its sessions. Migration-only, so it is deliberately not
              # carried in the GitOps ConfigMap. Done in python because busybox
              # sed cannot do 0,/re/.
              echo "== ensuring agents.defaults.sessionStore.agentId =="
              python3 - <<'PY'
              p = "/home/openclaw/.openclaw/openclaw.json5"
              s = open(p).read()
              if "sessionStore" in s:
                  print("  already present")
              else:
                  needle = "    defaults: {\n"
                  assert needle in s, "anchor not found; check the config shape"
                  open(p, "w").write(s.replace(needle, needle + '      sessionStore: { agentId: "coder" },\n', 1))
                  print("  inserted")
              PY

              echo "== openclaw doctor --fix (OPENCLAW_NIX_MODE=0) =="
              set +e
              openclaw doctor --fix --yes > /tmp/doctor.out 2>&1
              rc=$?
              set -e
              grep -vE "doctor-contracts|^Require stack|^- /nix/store" /tmp/doctor.out | tail -50
              echo "doctor exit=$rc"

              echo "== session stores after (each should be migrated away) =="
              for d in "$STATE"/agents/*/sessions; do
                [ -d "$d" ] || continue
                ls -la "$d" 2>/dev/null | grep -E "sessions[.](json|sqlite)" || echo "  $d: migrated"
              done
          env:
            - name: HOME
              value: /home/openclaw
            - name: OPENCLAW_CONFIG_PATH
              value: /home/openclaw/.openclaw/openclaw.json5
            - name: NPM_CONFIG_PREFIX
              value: /home/openclaw/.local
            - name: NPM_CONFIG_CACHE
              value: /home/openclaw/.cache/npm
            - name: OPENCLAW_LOG_LEVEL
              value: debug
            # The config interpolates several of these; doctor validates the same
            # config the gateway does, so it gets the same environment.
            - name: GH_PAT
              value: "proxy-github-placeholder"
            - name: HAKU_CONSOLE_TOKEN
              value: "proxy-haku-console-placeholder"
            - name: CLICKHOUSE_PUBLIC_CODER_USER
              value: "public_coder_analytics"
            - name: CLICKHOUSE_PUBLIC_CODER_PASSWORD
              value: "proxy-clickhouse-public-coder-password"
            - name: AIQUOTA_API_BEARER_TOKEN
              value: "proxy-aiquota-api-bearer-placeholder"
            - name: BRAVE_API_KEY
              value: "proxy-brave-search-api-key-placeholder"
            - name: MATRIX_PASSWORD
              value: "proxy-matrix-password-placeholder"
            - name: BUILDBUDDY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: buildbuddy-api-key
                  key: api-key
            - name: OPENCLAW_LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-key-public-coder-agent
                  key: api-key
            - name: OPENCLAW_GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: public-coder-agent-gateway-password
                  key: password
            - name: NODE_USE_ENV_PROXY
              value: "1"
            - name: HTTP_PROXY
              value: "http://public-coder-agent-proxy.public-coder-agent.svc.cluster.local:8080"
            - name: HTTPS_PROXY
              value: "http://public-coder-agent-proxy.public-coder-agent.svc.cluster.local:8080"
            - name: NO_PROXY
              value: "127.0.0.1,localhost,litellm.litellm.svc,litellm.litellm.svc.cluster.local"
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: PIP_CERT
              value: /etc/ssl/certs/ca-certificates.crt
            # See the header: "" would fall back to 1 via --set-default.
            - name: OPENCLAW_NIX_MODE
              value: "0"
          volumeMounts:
            - name: data
              mountPath: /home/openclaw/.openclaw
            - name: trust
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: public-coder-agent-state-v2
        - name: trust
          configMap:
            name: public-coder-agent-proxy-ca-cert
        - name: tmp
          emptyDir: {}
