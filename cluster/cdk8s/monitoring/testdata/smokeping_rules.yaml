rule_files:
  - smokeping.yaml
evaluation_interval: 1m
tests:
  - name: clean affected clean and a missing scrape cannot manufacture an episode
    interval: 30s
    input_series:
      - series: smokeping_requests_total{job="monitoring/smokeping",source_node="optiplex",target="gateway"}
        values: 0+150x10 stale stale 1800 1950 2100 2250 0 150
      - series: smokeping_response_duration_seconds_count{job="monitoring/smokeping",source_node="optiplex",target="gateway"}
        values: 0 150 300 450 600 735 870 1005 1140 1290 1440 stale stale 1740 1875 2010 2145 0 150
    promql_expr_test:
      - expr: home_network:icmp_affected:1m{source_node="optiplex",target="gateway"}
        eval_time: 2m
        exp_samples:
          - labels: home_network:icmp_affected:1m{source_node="optiplex",target="gateway"}
            value: 0
      - expr: home_network:icmp_affected:1m{source_node="optiplex",target="gateway"}
        eval_time: 3m
        exp_samples:
          - labels: home_network:icmp_affected:1m{source_node="optiplex",target="gateway"}
            value: 1
      - expr: home_network:episode_starts:1h{source_node="optiplex",target="gateway"}
        eval_time: 3m
        exp_samples:
          - labels: home_network:episode_starts:1h{source_node="optiplex",target="gateway"}
            value: 1
      - expr: home_network:icmp_affected:1m{source_node="optiplex",target="gateway"}
        eval_time: 6m
        exp_samples: []
      - expr: home_network:episode_starts:1h{source_node="optiplex",target="gateway"}
        eval_time: 8m
        exp_samples:
          - labels: home_network:episode_starts:1h{source_node="optiplex",target="gateway"}
            value: 1
      - expr: home_network:icmp_affected:1m{source_node="optiplex",target="gateway"}
        eval_time: 9m
        exp_samples: []
      - expr: home_network:affected_minutes:1h{source_node="optiplex",target="gateway"}
        eval_time: 5m
        exp_samples:
          - labels: home_network:affected_minutes:1h{source_node="optiplex",target="gateway"}
            value: 2
      - expr: home_network:observed_minutes:1h{source_node="optiplex",target="gateway"}
        eval_time: 5m
        exp_samples:
          - labels: home_network:observed_minutes:1h{source_node="optiplex",target="gateway"}
            value: 5
      - expr: home_network:episode_starts:1h{source_node="optiplex",target="gateway"}
        eval_time: 5m
        exp_samples:
          - labels: home_network:episode_starts:1h{source_node="optiplex",target="gateway"}
            value: 1
  - name: unlabelled optiplex history and labelled rollout retain a coverage gap
    interval: 30s
    input_series:
      # The original single-source Deployment was named smokeping and ran on optiplex.
      - series: smokeping_requests_total{job="monitoring/smokeping",pod="smokeping-855d8d7d9-86xrn",target="gateway"}
        values: 0+150x6 stale stale stale stale stale stale
      - series: smokeping_response_duration_seconds_count{job="monitoring/smokeping",pod="smokeping-855d8d7d9-86xrn",target="gateway"}
        values: 0+150x6 stale stale stale stale stale stale
      # An unlabelled different Deployment must never be assigned to optiplex.
      - series: smokeping_requests_total{job="monitoring/smokeping",pod="smokeping-wyrm2-legacy-test",target="gateway"}
        values: 0+150x4 stale stale stale stale stale stale stale stale
      - series: smokeping_response_duration_seconds_count{job="monitoring/smokeping",pod="smokeping-wyrm2-legacy-test",target="gateway"}
        values: 0+150x4 stale stale stale stale stale stale stale stale
      - series: smokeping_requests_total{job="monitoring/smokeping",pod="smokeping-6649bc96c9-cwbfr",source_node="optiplex",target="gateway"}
        values: stale stale stale stale stale stale 0+150x6
      - series: smokeping_response_duration_seconds_count{job="monitoring/smokeping",pod="smokeping-6649bc96c9-cwbfr",source_node="optiplex",target="gateway"}
        values: stale stale stale stale stale stale 0+135x6
      - series: smokeping_requests_total{job="monitoring/smokeping",pod="smokeping-wyrm2-59dbb5dc8d-l56hv",source_node="wyrm2",target="gateway"}
        values: stale stale stale stale stale stale stale stale 0+150x4
      - series: smokeping_response_duration_seconds_count{job="monitoring/smokeping",pod="smokeping-wyrm2-59dbb5dc8d-l56hv",source_node="wyrm2",target="gateway"}
        values: stale stale stale stale stale stale stale stale 0+150x4
    promql_expr_test:
      - expr: home_network:observed_minutes:1h{target="gateway"}
        eval_time: 2m
        exp_samples:
          - labels: home_network:observed_minutes:1h{source_node="optiplex",target="gateway"}
            value: 2
      - expr: home_network:icmp_affected:1m{target="gateway"}
        eval_time: 3m
        exp_samples: []
      - expr: home_network:icmp_affected:1m{target="gateway"}
        eval_time: 4m
        exp_samples: []
      - expr: home_network:icmp_affected:1m{target="gateway"}
        eval_time: 5m
        exp_samples:
          - labels: home_network:icmp_affected:1m{source_node="optiplex",target="gateway"}
            value: 1
          - labels: home_network:icmp_affected:1m{source_node="wyrm2",target="gateway"}
            value: 0
      - expr: home_network:observed_minutes:1h{target="gateway"}
        eval_time: 5m
        exp_samples:
          - labels: home_network:observed_minutes:1h{source_node="optiplex",target="gateway"}
            value: 3
          - labels: home_network:observed_minutes:1h{source_node="wyrm2",target="gateway"}
            value: 1
      - expr: home_network:episode_starts:1h{target="gateway"}
        eval_time: 5m
        exp_samples:
          - labels: home_network:episode_starts:1h{source_node="optiplex",target="gateway"}
            value: 0
          - labels: home_network:episode_starts:1h{source_node="wyrm2",target="gateway"}
            value: 0
