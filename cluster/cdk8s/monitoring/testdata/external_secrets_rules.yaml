rule_files:
  - external-secrets.yaml
evaluation_interval: 1m
tests:
  - name: recent successful scans keep the audit healthy
    interval: 1m
    input_series:
      - series: kube_cronjob_created{namespace="external-secrets-system",cronjob="cluster-secret-store-audit"}
        values: 0+0x60
      - series: kube_cronjob_status_last_successful_time{namespace="external-secrets-system",cronjob="cluster-secret-store-audit"}
        values: 0+0x30 1800+0x29
    promql_expr_test:
      - expr: ALERTS{alertname="ClusterSecretStoreAuditStale",alertstate="firing"}
        eval_time: 59m
        exp_samples: []

  - name: a failed Job leaves the audit stale
    interval: 1m
    input_series:
      - series: kube_cronjob_created{namespace="external-secrets-system",cronjob="cluster-secret-store-audit"}
        values: 0+0x60
      - series: kube_cronjob_status_last_successful_time{namespace="external-secrets-system",cronjob="cluster-secret-store-audit"}
        values: 0+0x60
    promql_expr_test:
      - expr: ALERTS{alertname="ClusterSecretStoreAuditStale",alertstate="firing"}
        eval_time: 55m
        exp_samples: []
      - expr: ALERTS{alertname="ClusterSecretStoreAuditStale",alertstate="firing"}
        eval_time: 57m
        exp_samples:
          - labels: ALERTS{alertname="ClusterSecretStoreAuditStale",alertstate="firing",cronjob="cluster-secret-store-audit",namespace="external-secrets-system",severity="warning"}
            value: 1

  - name: a CronJob that has never succeeded also becomes stale
    interval: 1m
    input_series:
      - series: kube_cronjob_created{namespace="external-secrets-system",cronjob="cluster-secret-store-audit"}
        values: 0+0x60
    promql_expr_test:
      - expr: ALERTS{alertname="ClusterSecretStoreAuditStale",alertstate="firing"}
        eval_time: 57m
        exp_samples:
          - labels: ALERTS{alertname="ClusterSecretStoreAuditStale",alertstate="firing",cronjob="cluster-secret-store-audit",namespace="external-secrets-system",severity="warning"}
            value: 1

  - name: missing exporter series is an audit failure
    interval: 1m
    input_series: []
    promql_expr_test:
      - expr: ALERTS{alertname="ClusterSecretStoreAuditStale",alertstate="firing"}
        eval_time: 11m
        exp_samples:
          - labels: ALERTS{alertname="ClusterSecretStoreAuditStale",alertstate="firing",cronjob="cluster-secret-store-audit",namespace="external-secrets-system",severity="warning"}
            value: 1
