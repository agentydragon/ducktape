apiVersion: batch/v1
kind: Job
metadata:
  name: piraeus-storage-bench-direct
  namespace: piraeus-storage-bench-20261019
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: piraeus-storage-bench-direct
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        kubernetes.io/hostname: ovh-ns102453
      containers:
        - name: benchmark
          image: code.forgejo.org/forgejo/forgejo:15.0.8-rootless
          command: [/bin/sh, -ec]
          args:
            - touch /gate/ready; while [ ! -e /gate/start ]; do sleep 1; done; exec /bin/sh /scripts/storage-bench.sh
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: gate
              mountPath: /gate
            - name: local-path
              mountPath: /mnt/local-path
            - name: seaweedfs
              mountPath: /mnt/seaweedfs
            - name: piraeus-one
              mountPath: /mnt/piraeus-one
            - name: piraeus-two
              mountPath: /mnt/piraeus-two
      volumes:
        - name: gate
          emptyDir: {}
        - name: scripts
          configMap:
            name: piraeus-storage-bench-scripts
            defaultMode: 0555
        - name: local-path
          persistentVolumeClaim:
            claimName: repo-local-path
        - name: seaweedfs
          persistentVolumeClaim:
            claimName: repo-seaweedfs
        - name: piraeus-one
          persistentVolumeClaim:
            claimName: repo-piraeus-one
        - name: piraeus-two
          persistentVolumeClaim:
            claimName: repo-piraeus-two
