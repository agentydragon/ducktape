apiVersion: apps/v1
kind: Deployment
metadata:
  name: rook-ceph-tools
  namespace: rook-ceph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rook-ceph-tools
  template:
    metadata:
      labels:
        app: rook-ceph-tools
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: rook-ceph-default
      containers:
        - name: rook-ceph-tools
          image: quay.io/ceph/ceph:v20.2.2-20260616
          command: [/bin/bash, -ceu]
          args:
            - |
              config=/etc/ceph/ceph.conf
              endpoints=/etc/rook/mon-endpoints
              keyring=/etc/ceph/keyring
              write_config() {
                mon_endpoints="$(sed 's/[a-z0-9_-]\+=//g' "$endpoints")"
                cat >"$config" <<EOF
              [global]
              mon_host = $mon_endpoints

              [client.admin]
              keyring = $keyring
              EOF
              }
              printf '[%s]\nkey = %s\n' "$ROOK_CEPH_USERNAME" "$ROOK_CEPH_SECRET" >"$keyring"
              write_config
              while sleep 10; do write_config; done
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 2016
            runAsGroup: 2016
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            - name: ROOK_CEPH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rook-ceph-mon
                  key: ceph-username
            - name: ROOK_CEPH_SECRET
              valueFrom:
                secretKeyRef:
                  name: rook-ceph-mon
                  key: ceph-secret
          volumeMounts:
            - name: ceph-config
              mountPath: /etc/ceph
            - name: mon-endpoint-volume
              mountPath: /etc/rook
      volumes:
        - name: ceph-config
          emptyDir: {}
        - name: mon-endpoint-volume
          configMap:
            name: rook-ceph-mon-endpoints
            items:
              - key: data
                path: mon-endpoints
