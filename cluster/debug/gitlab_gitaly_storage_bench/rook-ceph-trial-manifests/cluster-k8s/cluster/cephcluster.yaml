apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
  annotations:
    description: Disposable two-node SSD Ceph trial using loop-backed OSDs
spec:
  dataDirHostPath: /var/mnt/seaweedfs-data/rook-ceph-trial/rook-data
  cephVersion:
    image: quay.io/ceph/ceph:v20.2.2-20260616
    allowUnsupported: false
  mon:
    count: 3
    # Trial-only: retain odd quorum with only two SSD hosts.
    allowMultiplePerNode: true
  mgr:
    count: 1
    allowMultiplePerNode: true
    modules:
      - name: rook
        enabled: true
  dashboard:
    enabled: false
  crashCollector:
    disable: true
  logCollector:
    enabled: false
  cleanupPolicy:
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
    allowUninstallWithVolumes: false
  monitoring:
    enabled: false
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
  priorityClassNames:
    all: system-node-critical
    mgr: system-cluster-critical
  resources:
    mon:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    mgr:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    osd:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        memory: 4Gi
    prepareosd:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values: [hil-ovh]
                - key: storage.allegedly.works/tier
                  operator: In
                  values: [ssd]
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
  storage:
    useAllNodes: false
    useAllDevices: false
    allowDeviceClassUpdate: true
    nodes:
      - name: ovh-ns104952
        devices:
          - name: /dev/loop3
            config:
              deviceClass: ssd
      - name: ovh-ns104963
        devices:
          - name: /dev/loop3
            config:
              deviceClass: ssd
  healthCheck:
    daemonHealth:
      mon:
        interval: 45s
        timeout: 10m
      osd:
        interval: 1m
      status:
        interval: 1m
  cephConfig:
    global:
      osd_pool_default_size: "2"
      osd_pool_default_min_size: "1"
      mon_data_avail_warn: "10"
      osd_memory_target: "2147483648"
      bdev_flock_retry: "20"
      bluefs_buffered_io: "false"
---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: builtin-mgr
  namespace: rook-ceph
spec:
  name: .mgr
  failureDomain: host
  replicated:
    size: 2
    requireSafeReplicaSize: false
