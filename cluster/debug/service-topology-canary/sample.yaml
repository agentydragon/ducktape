apiVersion: v1
kind: Namespace
metadata:
  name: service-topology-canary
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Service
metadata:
  name: sample
  namespace: service-topology-canary
spec:
  trafficDistribution: PreferClose
  selector:
    app: topology-sample
    backend: "true"
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: ovh
  namespace: service-topology-canary
  labels:
    app: topology-sample
    backend: "true"
spec:
  nodeSelector:
    kubernetes.io/hostname: ovh-ns103711
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: sample
      image: busybox:1.37.0
      command:
        - sh
        - -c
        - "echo ovh > /tmp/index.html; exec httpd -f -p 8080 -h /tmp"
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        periodSeconds: 2
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
---
apiVersion: v1
kind: Pod
metadata:
  name: home
  namespace: service-topology-canary
  labels:
    app: topology-sample
    backend: "true"
spec:
  nodeSelector:
    kubernetes.io/hostname: optiplex
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
