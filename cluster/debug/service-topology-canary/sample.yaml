      readinessProbe:
        httpGet:
          path: /
          port: 8080
        periodSeconds: 2
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
---
