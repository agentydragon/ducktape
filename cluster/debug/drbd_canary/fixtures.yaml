apiVersion: v1
kind: Namespace
metadata:
  name: drbd-canary-tests
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: block
spec:
  storageClassName: local-canary
  volumeMode: Block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sparse
spec:
  storageClassName: local-canary
  volumeMode: Block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filesystem
spec:
  storageClassName: local-canary
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: block
  labels:
    app.kubernetes.io/name: drbd-canary-tests
spec:
  restartPolicy: Never
  nodeSelector:
    storage.allegedly.works/drbd-canary: "true"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - ovh-ns102453
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: io
      image: alpine:3.24.2
      command:
        - /bin/sh
        - -ec
        - apk add --no-cache fio coreutils && exec sleep infinity
      readinessProbe:
        exec:
          command:
            - fio
            - --version
        periodSeconds: 2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeDevices:
        - name: data
          devicePath: /dev/canary
      volumeMounts:
        - name: exercises
          mountPath: /exercises
          readOnly: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: block
    - name: exercises
      configMap:
        name: exercises
---
