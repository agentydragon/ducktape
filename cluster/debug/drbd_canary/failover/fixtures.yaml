apiVersion: v1
kind: Namespace
metadata:
  name: drbd-failover-tests
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: drbd-failover-tests
spec:
  storageClassName: piraeus-ssd-2-autodiskful
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Appends a numbered, fsynced line every second. Every line printed to stdout was
# durable before printing, so Loki's last ingested line bounds what the volume must hold.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: drbd-failover-tests
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: drbd-failover-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drbd-failover-writer
    spec:
      terminationGracePeriodSeconds: 5
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["hil-ovh"]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["ovh-ns103711"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: alpine:3.24.2
          command:
            - /bin/sh
            - -ec
            - |
              log=/data/log
              touch "$log"
              i=$(tail -n 1 "$log" | cut -d' ' -f1)
              i=${i:-0}
              echo "start host=$(hostname) last=$i lines=$(wc -l < "$log")"
              while true; do
                i=$((i + 1))
                line="$i $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                echo "$line $(printf '%s' "$line" | sha256sum | cut -c1-16)" >> "$log"
                sync "$log"
                echo "ack $line"
                sleep 1
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
