---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-webhook-token
  namespace: ducktape-flux
spec:
  # EXPERIMENT(added 2026-09-04): suspended to test whether the GitHub-provider
  # tf roots are spending the account's GraphQL quota. Something drains the whole
  # 5000-point budget hourly and every other candidate has been eliminated by
  # measurement; these three are what remains that both authenticates as the user
  # and calls the GitHub API. Unsuspend once the next reset window has been read
  # either way -- this is a diagnostic, not a decision.
  # See <debug/github_rate_limit_monitoring_blind_spot.md>.
  suspend: true
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/flux-webhook-token
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: flux-webhook-token
      namespace: flux-system
  dependsOn:
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
    - name: github-secrets-sync-secrets
      namespace: ducktape-flux
