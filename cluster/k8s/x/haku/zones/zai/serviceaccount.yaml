# ServiceAccount for validator-stamped worker Jobs: zero k8s API grants (no
# Role binds it), and the Job template additionally sets
# automountServiceAccountToken: false — a hijacked worker cannot read any
# secret via the API, only what is explicitly mounted into its pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-zone-worker
  namespace: haku-sandbox-zai
automountServiceAccountToken: false
