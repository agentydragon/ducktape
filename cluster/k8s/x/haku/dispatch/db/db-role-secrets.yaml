# Passwords for the two managed roles on haku-dispatch-db, ESO-generated once
# (the plaid-mcp readonly-secret pattern; symbols disabled so templated URIs
# need no escaping). Listed before the Cluster in kustomization.yaml so the
# managed-role passwordSecrets exist when CNPG reconciles them.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: haku-dispatch-db-dispatcher-generator
  namespace: haku-dispatch
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# The dispatcher's own database credential (owner of the `dispatcher` DB).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-dispatch-db-dispatcher
  namespace: haku-dispatch
spec:
  refreshInterval: 8760h
  target:
    name: haku-dispatch-db-dispatcher
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "dispatcher"
        password: "{{ .password }}"
        uri: "postgresql://dispatcher:{{ .password }}@haku-dispatch-db-rw.haku-dispatch.svc:5432/dispatcher"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: haku-dispatch-db-dispatcher-generator
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: haku-dispatch-db-haku-reader-generator
  namespace: haku-dispatch
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# Haku's read-only credential (operator, 2026-07-02: Haku reads jobs/results
# via SQL instead of a dispatcher GET API). Read access comes declaratively
# from pg_read_all_data membership on the managed role (postgres-cluster.yaml)
# — see the caveat there. Reflected into haku-sandbox.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-dispatch-db-haku-reader
  namespace: haku-dispatch
spec:
  refreshInterval: 8760h
  target:
    name: haku-dispatch-db-haku-reader
    template:
      type: kubernetes.io/basic-auth
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: haku-sandbox
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: haku-sandbox
      data:
        username: "haku_reader"
        password: "{{ .password }}"
        DATABASE_URL: "postgresql://haku_reader:{{ .password }}@haku-dispatch-db-rw.haku-dispatch.svc:5432/dispatcher"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: haku-dispatch-db-haku-reader-generator
