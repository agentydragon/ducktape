# The dispatch layer for Haku's worker zones (haku/plans/multi_agent.md):
# dispatcher + workers-LiteLLM + their shared CNPG cluster. Trusted,
# ducktape-reviewed code — Haku (L0) may call the validator API but holds no
# credential material from this namespace and cannot modify what runs here.
apiVersion: v1
kind: Namespace
metadata:
  name: haku-dispatch
  labels:
    goldilocks.fairwinds.com/enabled: "true"
    goldilocks.fairwinds.com/vpa-update-mode: "auto"
    rbac.ducktape.io/agent-logs-configmaps-reader: "true"
    name: haku-dispatch
