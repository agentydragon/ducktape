apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: haku-dispatch
resources:
  - deployment.yaml
  - service.yaml
  - cnp-workers-litellm.yaml

configMapGenerator:
  - name: workers-litellm-config
    options:
      disableNameSuffixHash: true
    files:
      - config.yaml=workers-litellm-config.yaml
