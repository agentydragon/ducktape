# Second-layer LiteLLM serving Haku's worker zones. Holds the static zone keys
# as upstream credentials; issues/enforces per-job virtual keys (minted by the
# dispatcher via this instance's master key). Reachability is the security
# property: the CNPs in this directory admit only zone-namespace pods — never
# haku-sandbox (L0) — so leaked per-job keys are unusable outside the zones.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers-litellm
  namespace: haku-dispatch
  labels:
    app.kubernetes.io/name: workers-litellm
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workers-litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workers-litellm
    spec:
      containers:
        - name: litellm
          image: litellm/litellm:1.90.2
          args: ["--config", "/etc/litellm/config.yaml"]
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4000"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: workers-litellm-master-key
                  key: api-key
            # Per-job virtual keys live here (DATABASE_URL) — see
            # cluster/k8s/x/haku/dispatch/README.md → key chain.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: haku-dispatch-db-app
                  key: uri
            # Set once, NEVER rotate (encrypts key material in the DB).
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: workers-litellm-salt-key
                  key: key
            # zai zone's static key on the MAIN LiteLLM — upstream credential
            # for the GLM model group in the config.
            - name: ZAI_ZONE_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-key-haku-lane-zai
                  key: api-key
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "1"
              # LiteLLM 1.90.2 with the virtual-key DB idles at ~1020Mi — the
              # original 1Gi limit OOMKilled this pod at startup (operator:
              # give it real headroom).
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: workers-litellm-config
            items:
              - key: config.yaml
                path: config.yaml
