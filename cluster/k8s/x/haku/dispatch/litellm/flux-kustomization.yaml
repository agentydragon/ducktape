apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-dispatch-litellm
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/x/haku/dispatch/litellm
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 10m
  dependsOn:
    - name: haku-dispatch-namespace
      namespace: ducktape-flux
    - name: haku-dispatch-db
      namespace: ducktape-flux
    - name: litellm
      namespace: ducktape-flux
    # Mounts the TF-minted zone key + workers master/salt keys.
    - name: litellm-keys-tf
      namespace: ducktape-flux
