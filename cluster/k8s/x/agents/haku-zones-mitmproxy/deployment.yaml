# Shared egress proxy for all Haku worker zones (haku-sandbox-{zai,oai,…}).
# Mirrors agents/haku-egress-proxy; deviation: no TLS-interception exceptions and a
# much narrower FQDN allowlist (workers' LLM path is in-cluster via the
# haku-dispatch workers-LiteLLM, never a direct provider connection).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-zones-mitmproxy
  namespace: haku-zones-mitmproxy
  labels:
    app.kubernetes.io/name: haku-zones-mitmproxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-zones-mitmproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-zones-mitmproxy
    spec:
      initContainers:
        - name: mitmproxy-ca-init
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              cat /mitmproxy-ca/tls.key /mitmproxy-ca/tls.crt > /mitmproxy-data/mitmproxy-ca.pem
              cp /mitmproxy-ca/tls.crt /mitmproxy-data/mitmproxy-ca-cert.pem
          volumeMounts:
            - name: mitmproxy-ca
              mountPath: /mitmproxy-ca
              readOnly: true
            - name: mitmproxy-data
              mountPath: /mitmproxy-data
      containers:
        - name: mitmproxy
          # >=12.2.3 for the CA SKI/AKI fix — see
          # cluster/docs/lessons_learned/2026_06_25_mitmproxy_ca_ski_aki_mismatch.md.
          image: mitmproxy/mitmproxy:12.2.3
          command:
            - mitmweb
            - --listen-host
            - "0.0.0.0"
            - --listen-port
            - "8080"
            - --web-host
            - "0.0.0.0"
            - --web-port
            - "8081"
            - --set
            - confdir=/mitmproxy-data
          ports:
            - name: proxy
              containerPort: 8080
            - name: web
              containerPort: 8081
          volumeMounts:
            - name: mitmproxy-data
              mountPath: /mitmproxy-data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mitmproxy-ca
          secret:
            secretName: haku-zones-mitmproxy-ca
        - name: mitmproxy-data
          emptyDir: {}
