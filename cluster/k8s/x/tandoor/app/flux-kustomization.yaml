apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tandoor
  namespace: ducktape-flux
spec:
  # Suspended — currently using Grocy instead.
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/x/tandoor/app
  prune: true
  wait: true
  dependsOn:
    - name: tandoor-namespace
    - name: tandoor-db
    - name: gateway
      namespace: ducktape-flux
    - name: authentik
      namespace: ducktape-flux
