apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tandoor-namespace
  namespace: ducktape-flux
spec:
  interval: 10m
  # Suspended — currently using Grocy instead.
  suspend: true
  path: ./cluster/k8s/x/tandoor/namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 2m
