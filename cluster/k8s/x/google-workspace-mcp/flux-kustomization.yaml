apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: google-workspace-mcp
  namespace: ducktape-flux
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/x/google-workspace-mcp
  prune: true
  wait: true
  dependsOn:
    - name: airlock # google-client-credentials (Reflector mirrors it here)
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
