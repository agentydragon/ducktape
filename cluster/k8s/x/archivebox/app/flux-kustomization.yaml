apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: archivebox
  namespace: ducktape-flux
  annotations:
    description: Suspended ArchiveBox experiment; former Authentik header SSO and split local/SeaweedFS CSI storage.
spec:
  # Retain the declaration without allowing Flux to recreate retired objects.
  suspend: true
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./cluster/k8s/x/archivebox/app
  prune: true
  # Captured web archives are user data. Removing this experimental controller
  # must not implicitly delete the Deployment, namespace, or either PVC.
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: archivebox-namespace
    - name: seaweedfs-csi
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: archivebox
      namespace: archivebox
