apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: archivebox-namespace
  namespace: ducktape-flux
spec:
  # Retain the declarative record without reconciling the retired namespace.
  suspend: true
  interval: 1h
  retryInterval: 5m
  timeout: 2m
  path: ./cluster/k8s/x/archivebox/namespace
  # Leave the Namespace behind if this experimental controller is removed; the
  # archive PVCs may contain irreplaceable captures.
  prune: false
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
