apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: activitywatch
  namespace: ducktape-flux
spec:
  # Retired 2026-08-17: upstream aw-sync mutates the receive-only SQLite input
  # and cannot provide an idempotent, provenance-preserving import. Retain the
  # manifests for a future repo-owned snapshot/import design, but keep all
  # cluster objects deleted while this Kustomization is suspended.
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/x/activitywatch
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: local-path-provisioner
      namespace: ducktape-flux
    - name: seaweedfs-csi
      namespace: ducktape-flux
