apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: activitywatch
  namespace: ducktape-flux
spec:
  # Revived 2026-08-26: the central aw-server is fed by the repo-owned
  # instance-to-instance importer (@ducktape_activitywatch//importer) over a
  # bearer-gated write route, replacing aw-sync. The cluster Syncthing receiver and
  # the old aw-sync importer-cronjob are gone; the desktop-side Syncthing/certs
  # retirement is the follow-up (cluster/docs/activitywatch/revival-plan.md).
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/x/activitywatch
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: local-path-provisioner
      namespace: ducktape-flux
    - name: seaweedfs-csi
      namespace: ducktape-flux
