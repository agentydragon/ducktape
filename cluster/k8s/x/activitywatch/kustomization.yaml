apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - pvc.yaml
  - service.yaml
  - write-httproute.yaml
  - cilium-network-policy.yaml
  - activitywatch-write-token.sops.yaml

configMapGenerator:
  - name: activitywatch-readonly-proxy
    namespace: activitywatch
    files:
      - default.conf=readonly-proxy.conf
  - name: activitywatch-write-proxy
    namespace: activitywatch
    files:
      - default.conf.template=write-proxy.conf.template
