# ActivityWatch central query + write server.
# Ingress: kube-apiserver (health probes), Authentik proxy (read-only proxy 5601),
# the Gateway (bearer-gated write-proxy 5602). Egress: DNS only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: activitywatch
  namespace: activitywatch
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: activitywatch
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "5600"
              protocol: TCP
    # Read-only proxy through Authentik embedded outpost (nginx on 5601).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            app.kubernetes.io/name: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "5601"
              protocol: TCP
    # Public write route: the Gateway (Envoy, hostNetwork) reaches the bearer-gated
    # write-proxy sidecar on 5602. See docs/cilium_network_policy.md (fromEntities: ingress).
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5602"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
