# Read-only bearer for the central ActivityWatch read route. The bearer-proxy
# sidecar (5603) checks it; the emberstack reflector mirrors this Secret into
# haku-egress-proxy so the iron proxy can substitute it for the Haku sandbox's
# placeholder (cluster/k8s/agents/haku-egress-proxy/claude-iron.yaml). Distinct from
# the write token so read and write are separate credentials -- and unlike the write
# token, no desktop reads it, so it is encrypted only to Flux (cluster-secrets) +
# admin via the generic cluster/k8s rule. Rotate by re-minting and re-encrypting.
apiVersion: v1
kind: Secret
metadata:
    name: activitywatch-read-token
    namespace: activitywatch
    annotations:
        description: Read-only ActivityWatch bearer; checked by the bearer-proxy read route (5603) and mirrored to haku-egress-proxy for the iron proxy's placeholder substitution.
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: haku-egress-proxy
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: haku-egress-proxy
type: Opaque
