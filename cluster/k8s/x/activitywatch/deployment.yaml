apiVersion: apps/v1
kind: Deployment
metadata:
  name: activitywatch
  namespace: activitywatch
  labels:
    app.kubernetes.io/name: activitywatch
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: activitywatch
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activitywatch
    spec:
      # No Kubernetes API access; don't mount a SA token.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      containers:
        - name: aw-server
          image: ghcr.io/agentydragon/aw-server:devel-20260817024836-e6fd634
          command:
            - /usr/local/bin/aw-server
            - --host
            - 0.0.0.0
            - --port
            - "5600"
            - --dbpath
            - /data/db.sqlite3
            - --device-id
            - activitywatch-cluster
          ports:
            - containerPort: 5600
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /api/0/info
              port: 5600
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/0/info
              port: 5600
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: readonly-proxy
          image: nginx:alpine
          ports:
            - containerPort: 5601
              name: readonly
          volumeMounts:
            - name: readonly-proxy-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              # TODO(vpa-memory-audit): 64Mi -> 128Mi. VPA observed a 50Mi
              # request / 60Mi upper bound, leaving no headroom at 64Mi.
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5601
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5601
            initialDelaySeconds: 2
            periodSeconds: 10
        - name: write-proxy
          image: nginx:alpine
          # The gate on the public write route: only requests bearing the shared
          # write token reach aw-server (which has no auth of its own). envsubst fills
          # ${AW_WRITE_TOKEN} from the secret; NGINX_ENVSUBST_FILTER keeps it to that
          # one variable so nginx's own $-variables survive.
          env:
            - name: AW_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: activitywatch-write-token
                  key: token
            - name: NGINX_ENVSUBST_FILTER
              value: AW_WRITE_TOKEN
          ports:
            - containerPort: 5602
              name: write
          volumeMounts:
            - name: write-proxy-config
              mountPath: /etc/nginx/templates
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5602
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5602
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: activitywatch-data
        - name: readonly-proxy-config
          configMap:
            name: activitywatch-readonly-proxy
        - name: write-proxy-config
          configMap:
            name: activitywatch-write-proxy
