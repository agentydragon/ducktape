apiVersion: apps/v1
kind: Deployment
metadata:
  name: activitywatch
  namespace: activitywatch
  labels:
    app.kubernetes.io/name: activitywatch
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: activitywatch
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activitywatch
    spec:
      imagePullSecrets:
        - name: forgejo-images-creds
      # No Kubernetes API access; don't mount a SA token.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      containers:
        - name: aw-server
          image: git.allegedly.works/ducktape-ci/aw-server:devel-20260831015008-2fbc425 # {"$imagepolicy": "flux-system:aw-server"}
          command:
            - /usr/local/bin/aw-server
            - --host
            - 0.0.0.0
            - --port
            - "5600"
            - --dbpath
            - /data/db.sqlite3
            - --device-id
            - activitywatch-cluster
          ports:
            - containerPort: 5600
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /api/0/info
              port: 5600
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/0/info
              port: 5600
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: readonly-proxy
          image: nginx:alpine
          ports:
            - containerPort: 5601
              name: readonly
          volumeMounts:
            - name: readonly-proxy-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              # TODO(vpa-memory-audit): 64Mi -> 128Mi. VPA observed a 50Mi
              # request / 60Mi upper bound, leaving no headroom at 64Mi.
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5601
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5601
            initialDelaySeconds: 2
            periodSeconds: 10
        - name: bearer-proxy
          image: nginx:alpine
          # One nginx gating both token-checked routes: 5602 write (shared write
          # token) and 5603 read (distinct read token, read methods only). aw-server
          # has no auth of its own, so this sidecar is the gate. envsubst fills
          # ${AW_WRITE_TOKEN}/${AW_READ_TOKEN} from the secrets; the ^AW_ filter keeps
          # substitution to those two so nginx's own $-variables survive. The read
          # token is also what the Haku agent uses via the iron egress proxy.
          env:
            - name: AW_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: activitywatch-write-token
                  key: token
            - name: AW_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: activitywatch-read-token
                  key: token
            - name: NGINX_ENVSUBST_FILTER
              value: "^AW_"
          ports:
            - containerPort: 5602
              name: write
            - containerPort: 5603
              name: read
          volumeMounts:
            - name: bearer-proxy-config
              mountPath: /etc/nginx/templates
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5602
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5602
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: activitywatch-data
        - name: readonly-proxy-config
          configMap:
            name: activitywatch-readonly-proxy
        - name: bearer-proxy-config
          configMap:
            name: activitywatch-bearer-proxy
