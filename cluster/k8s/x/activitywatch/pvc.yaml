apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: activitywatch-data
  namespace: activitywatch
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-proxmox
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: activitywatch-syncthing-state
  namespace: activitywatch
  annotations:
    description: Persistent Syncthing index state; losing it creates receive-only conflicts on restart.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-ovh
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: activitywatch-sync-inbox
  namespace: activitywatch
  annotations:
    description: Syncthing receive-only inbox for ActivityWatch aw-sync databases from user devices.
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: seaweedfs-ovh
  resources:
    requests:
      storage: 10Gi
