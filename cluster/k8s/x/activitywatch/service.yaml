apiVersion: v1
kind: Service
metadata:
  name: activitywatch-readonly
  namespace: activitywatch
spec:
  selector:
    app.kubernetes.io/name: activitywatch
  ports:
    - port: 5600
      targetPort: 5601
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: activitywatch-write
  namespace: activitywatch
  annotations:
    description: Internal write-capable ActivityWatch API endpoint for the aw-sync importer.
spec:
  selector:
    app.kubernetes.io/name: activitywatch
  ports:
    - port: 5600
      targetPort: 5600
      name: http
