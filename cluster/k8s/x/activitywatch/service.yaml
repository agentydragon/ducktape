apiVersion: v1
kind: Service
metadata:
  name: activitywatch-readonly
  namespace: activitywatch
spec:
  selector:
    app.kubernetes.io/name: activitywatch
  ports:
    - port: 5600
      targetPort: 5601
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: activitywatch-write
  namespace: activitywatch
  annotations:
    description: Bearer-gated ActivityWatch write endpoint (write-proxy sidecar), fronted by the public write HTTPRoute for desktop importers.
spec:
  selector:
    app.kubernetes.io/name: activitywatch
  ports:
    - port: 5600
      targetPort: 5602
      name: http
