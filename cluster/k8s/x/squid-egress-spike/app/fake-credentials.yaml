# Deliberately a ConfigMap, not a Secret: every value here is fake. The spike
# proves the substitution *mechanism*, and giving it a real credential would add
# risk without adding information.
#
# The production shape is the same env-var interface backed by a SOPS Secret, so
# swapping this for `envFrom: secretRef:` is the only change needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: squid-spike-fake-credentials
  namespace: squid-egress-spike
  annotations:
    description: Fake credential values for the Squid substitution spike. Not secrets.
data:
  SPIKE_BEARER_SECRET: "fake-real-bearer-do-not-use"
  SPIKE_OTHER_SECRET: "fake-other-bearer-do-not-use"
  # base64("spike:placeholder") and base64("spike:fake-real-password")
  SPIKE_BASIC_PLACEHOLDER_B64: "c3Bpa2U6cGxhY2Vob2xkZXI="
  SPIKE_BASIC_REAL_B64: "c3Bpa2U6ZmFrZS1yZWFsLXBhc3N3b3Jk"
