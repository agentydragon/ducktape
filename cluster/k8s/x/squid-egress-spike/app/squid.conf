# Squid config for the egress-proxy spike. Mounted via configMapGenerator; not a
# Kubernetes manifest.
#
# Encodes every property option E has to demonstrate, so that "does Squid do what
# iron does" is answered by running this rather than by reading docs.

http_port 3128 ssl-bump generate-host-certificates=on dynamic_cert_mem_cache_size=8MB tls-cert=/run/squid-ca/bump-ca.pem
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/cache/squid/ssl_db -M 8MB

acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump all

# The echo origin serves a self-signed cert. A real fence would verify upstream
# and set this to `deny all`.
#
# NOT `tls_outgoing_options flags=DONT_VERIFY_PEER`: that is how Squid 5 said it,
# and since 6.x it neither disables origin verification nor errors out. `squid -k
# parse` answers "the DONT_VERIFY_PEER flag is deprecated, remove the clientca=
# option to disable client certificates" — it has been repurposed to the client
# side. The first run of this spike had it, and every bumped request died
# ERR_SECURE_CONNECT_FAIL while openssl s_client from the same pod completed the
# same handshake fine.
#
# CLEANUP(added 2026-08-10): sslproxy_cert_error is valid through v7 but is gone
#   in v8. Find its replacement before moving this config to Squid 8 — a fence
#   that silently stops honouring an origin-verification decision is the failure
#   mode this whole comment exists to warn about.
sslproxy_cert_error allow all

# --- destinations -----------------------------------------------------------
acl to_echo    dstdomain echo-origin.squid-egress-spike.svc.cluster.local
acl to_elsewhere dstdomain example.invalid

# --- proxy-asserted caller identity ----------------------------------------
# %>a is the client address as Squid sees it, so the agent cannot forge it. This
# is the piece iron cannot produce without an upstream feature.
request_header_add X-Spike-Client "%>a" all

# --- credential substitution ------------------------------------------------
# Rendered separately because Squid cannot read environment variables: ${...} in
# squid.conf only expands its own process_name/process_number/service_name
# macros. The initContainer envsubst's the real values into this file.
#
# EVERY substitution rule in there is destination-scoped. Gating on the
# placeholder alone would let an agent redeem a placeholder it already holds at a
# host of its choosing, turning substitution into credential exfiltration.
include /run/squid-secrets/credentials.conf

# --- caching ----------------------------------------------------------------
# Memory only: nothing persists, so no authenticated response can outlive the
# request on disk, and the pod stays stateless. cache_dir is deliberately absent.
cache_mem 128 MB
maximum_object_size_in_memory 8 MB
# Never store responses to authenticated requests. RFC 9111 already forbids it;
# stating it means a future refresh_pattern cannot quietly override it.
acl has_auth req_header Authorization .
cache deny has_auth

# --- access -----------------------------------------------------------------
# The haku-console external_acl gate goes here when it exists. Until then the
# spike is allow-all so the substitution and caching questions can be answered
# independently of the gate.
#
# external_acl_type haku_gate ttl=300 negative_ttl=30 concurrency=16 grace=20 \
#   %SRC %DST /usr/local/bin/haku_gate.py
# acl gated external haku_gate
# http_access allow gated
http_access allow all

# --- observability ----------------------------------------------------------
# 11,2 logs the literal request Squid sends upstream, which is how the spike
# observes post-bump header rewriting without the origin having to cooperate.
# 83,3 is section "SSL accelerator support": without it an upstream TLS failure
# renders as "[No Error] (TLS code: [Unknown Error Code])" on the error page and
# says nothing at all in the log, which is exactly how the first run went.
debug_options ALL,1 11,2 83,3
access_log stdio:/dev/stdout squid
cache_log /dev/stdout
pid_filename /run/squid/squid.pid
