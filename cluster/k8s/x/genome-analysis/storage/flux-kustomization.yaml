apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: genome-analysis-storage
  namespace: ducktape-flux
  annotations:
    description: Storage for the operator's own whole-genome sequencing analysis (ducktape#4785).
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/x/genome-analysis/storage
  prune: true
  # Sequencing data and downloaded reference databases are expensive to reproduce (a
  # multi-hour download, in the data's case irreplaceable). Removing this Kustomization
  # must not implicitly delete the PVCs.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: genome-analysis-namespace
    - name: local-path-provisioner
      namespace: ducktape-flux
