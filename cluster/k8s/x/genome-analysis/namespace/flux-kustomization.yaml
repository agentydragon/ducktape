apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: genome-analysis-namespace
  namespace: ducktape-flux
spec:
  interval: 1h
  retryInterval: 5m
  timeout: 2m
  path: ./cluster/k8s/x/genome-analysis/namespace
  # Leave the Namespace behind even if the storage/app Kustomizations are removed;
  # the PVCs it holds may carry irreplaceable sequencing data.
  prune: false
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
