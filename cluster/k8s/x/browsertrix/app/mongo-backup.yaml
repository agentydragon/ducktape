apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: browsertrix-mongo-backup
  namespace: browsertrix
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: seaweedfs-ovh-hdd
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: browsertrix-mongo-backup
  namespace: browsertrix
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mongodump
              image: docker.io/library/mongo:7.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  umask 077
                  mongodump \
                    --host local-mongo \
                    --username root \
                    --password "$MONGO_PASSWORD" \
                    --authenticationDatabase admin \
                    --archive="/backup/browsertrix-${stamp}.archive.gz" \
                    --gzip
                  find /backup -type f -name 'browsertrix-*.archive.gz' -mtime +30 -delete
              env:
                - name: MONGO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: browsertrix-secrets
                      key: mongo-password
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: browsertrix-mongo-backup
