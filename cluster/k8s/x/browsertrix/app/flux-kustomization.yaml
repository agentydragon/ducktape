apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: browsertrix
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 25m
  path: ./cluster/k8s/x/browsertrix/app
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: browsertrix-namespace
      namespace: ducktape-flux
    - name: seaweedfs-browsertrix-bucket
      namespace: ducktape-flux
    - name: seaweedfs-secrets
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
    - name: seaweedfs-csi
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: browsertrix
      namespace: browsertrix
