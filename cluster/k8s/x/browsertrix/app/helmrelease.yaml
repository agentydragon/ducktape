apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: browsertrix
  namespace: browsertrix
spec:
  suspend: true
  interval: 15m
  timeout: 20m
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./cluster/charts/browsertrix
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: ducktape
        namespace: ducktape-flux
      interval: 10m
  valuesFrom:
    - kind: Secret
      name: browsertrix-secrets
      valuesKey: superuser-password
      targetPath: superuser.password
    - kind: Secret
      name: browsertrix-secrets
      valuesKey: backend-password
      targetPath: backend_password_secret
    - kind: Secret
      name: browsertrix-secrets
      valuesKey: mongo-password
      targetPath: mongo_auth.password
    - kind: Secret
      name: s3-identity-browsertrix
      valuesKey: accessKey
      targetPath: storages[0].access_key
    - kind: Secret
      name: s3-identity-browsertrix
      valuesKey: secretKey
      targetPath: storages[0].secret_key
  values:
    external_url: https://archive.allegedly.works

    registration_enabled: "0"
    default_org: Private Archive
    superuser:
      email: admin@allegedly.works
      # Overridden from browsertrix-secrets.
      password: unused
    backend_password_secret: unused

    # Pin ReplayWeb.page instead of loading an unversioned npm latest build.
    rwp_base_url: https://cdn.jsdelivr.net/npm/replaywebpage@2.4.6/

    main_node_selector:
      topology.kubernetes.io/zone: hil-ovh
    crawler_node_selector:
      topology.kubernetes.io/zone: hil-ovh

    volume_storage_class: local-path-ovh-hdd
    backend_num_replicas: 1
    mongo_local: true
    mongo_storage: 10Gi
    mongo_memory: 1Gi
    mongo_auth:
      username: root
      # Overridden from browsertrix-secrets.
      password: unused

    # WACZ files live in the retained SeaweedFS bucket. Browser downloads are
    # served through the Browsertrix frontend's same-origin /data/ proxy, so the
    # bucket and its credentials never need to be exposed through public-s3.
    storage_proxy:
      enabled: true
      host: seaweedfs-s3.seaweedfs.svc:8333
      bucket: browsertrix
      access_path: /data/
    storages:
      - name: default
        type: s3
        # Overridden from reflected s3-identity-browsertrix.
        access_key: unused
        secret_key: unused
        bucket_name: browsertrix
        endpoint_url: http://seaweedfs-s3.seaweedfs.svc:8333/
        access_endpoint_url: /data/
        access_addressing_style: path
        is_default_primary: true
        region: us-east-1

    # Start conservatively: at most four browser windows, two per crawler pod.
    max_browser_windows: 4
    crawler_browser_instances: 2
    qa_num_browser_windows: 1
    crawler_storage: 25Gi
    crawler_channels:
      - id: default
        image: docker.io/webrecorder/browsertrix-crawler:1.14.1
        imagePullPolicy: IfNotPresent
    crawler_pull_policy: IfNotPresent
    crawler_namespace: browsertrix-crawlers

    # Crawler pages are hostile input. Permit the public Internet, DNS, the
    # per-crawl Redis pods, QA access to the frontend, and WACZ uploads to the
    # dedicated SeaweedFS S3 service; exclude private/link-local/special ranges.
    crawler_enable_network_policy: true
    crawler_network_policy_egress:
      - to:
          - ipBlock:
              cidr: 0.0.0.0/0
              except:
                - 0.0.0.0/8
                - 10.0.0.0/8
                - 100.64.0.0/10
                - 127.0.0.0/8
                - 169.254.0.0/16
                - 172.16.0.0/12
                - 192.0.0.0/24
                - 192.168.0.0/16
                - 198.18.0.0/15
                - 224.0.0.0/4
                - 240.0.0.0/4
      - to:
          - ipBlock:
              cidr: ::/0
              except:
                - ::/128
                - ::1/128
                - fc00::/7
                - fe80::/10
                - ff00::/8
                - 2001:db8::/32
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: browsertrix
            podSelector:
              matchLabels:
                role: frontend
        ports:
          - port: 80
            protocol: TCP
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: browsertrix-crawlers
            podSelector:
              matchLabels:
                role: redis
        ports:
          - port: 6379
            protocol: TCP
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: seaweedfs
            podSelector:
              matchLabels:
                app.kubernetes.io/name: seaweedfs
                app.kubernetes.io/component: s3
        ports:
          - port: 8333
            protocol: TCP
