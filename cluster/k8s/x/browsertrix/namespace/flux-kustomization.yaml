apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: browsertrix-namespace
  namespace: ducktape-flux
spec:
  suspend: true
  interval: 10m
  retryInterval: 1m
  timeout: 1m
  path: ./cluster/k8s/x/browsertrix/namespace
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
