apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wayback-archive-db
  namespace: ducktape-flux
spec:
  # Decommissioned by operator request; keep its configuration but stop reconciliation.
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/x/wayback-cache/db
  prune: true
  wait: true
  dependsOn:
    - name: wayback-cache-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
