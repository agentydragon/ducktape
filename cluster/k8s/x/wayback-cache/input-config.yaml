apiVersion: v1
kind: ConfigMap
metadata:
  name: wayback-cache-input-config
  namespace: wayback-cache
  labels:
    app.kubernetes.io/name: wayback-cache
    app.kubernetes.io/component: input
data:
  config.yaml: |
    queue_wait_seconds: 180
    store:
      database_url_env: WAYBACK_CACHE_DATABASE_URL
      s3:
        endpoint: http://seaweedfs-s3.seaweedfs.svc:8333
        bucket: wayback-archive
        region: us-east-1
        allow_http: true
        access_key_id_env: WAYBACK_CACHE_S3_ACCESS_KEY_ID
        secret_access_key_env: WAYBACK_CACHE_S3_SECRET_ACCESS_KEY
