apiVersion: apps/v1
kind: Deployment
metadata:
  name: wayback-cache-filler-workers
  namespace: wayback-cache
  labels:
    app.kubernetes.io/name: wayback-cache-filler
    app.kubernetes.io/component: filler
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # Consider KEDA from a verified backlog signal; cap against Archive.org's
  # upstream rate limits rather than cluster capacity.
  replicas: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: wayback-cache-filler
      app.kubernetes.io/component: filler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wayback-cache-filler
        app.kubernetes.io/component: filler
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: wayback-cache-filler
              app.kubernetes.io/component: filler
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: wayback-cache-filler
                  app.kubernetes.io/component: filler
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: filler
          image: ghcr.io/agentydragon/wayback-archive:devel-20260827004504-e17981e # {"$imagepolicy": "flux-system:wayback-archive"}
          imagePullPolicy: Always
          command:
            - /usr/local/bin/wayback_cache_filler
          env:
            - name: RUST_LOG
              value: info
            - name: WAYBACK_CACHE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wayback-archive-db-app
                  key: uri
            - name: WAYBACK_CACHE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-identity-wayback-archive
                  key: accessKey
            - name: WAYBACK_CACHE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-identity-wayback-archive
                  key: secretKey
          volumeMounts:
            - name: config
              mountPath: /etc/wayback-cache
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: wayback-cache-filler-config
