apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wayback-cache-namespace
  namespace: ducktape-flux
spec:
  # Do not recreate the namespace after the Wayback decommission.
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 1m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/x/wayback-cache/namespace
  prune: false
  wait: true
