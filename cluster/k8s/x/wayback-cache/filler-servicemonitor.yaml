apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wayback-cache-filler
  namespace: wayback-cache
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wayback-cache-filler
      app.kubernetes.io/component: filler
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
