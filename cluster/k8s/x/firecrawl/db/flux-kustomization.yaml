apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: firecrawl-db
  namespace: ducktape-flux
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: ExternalArtifact
    name: firecrawl-db
    namespace: ducktape-flux
  path: ./cluster/k8s/x/firecrawl/db
  prune: true
  wait: true
  dependsOn:
    - name: firecrawl-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
