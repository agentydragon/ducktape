apiVersion: v1
kind: Service
metadata:
  name: firecrawl-api
  namespace: firecrawl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: firecrawl
    app.kubernetes.io/component: api
  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: firecrawl-playwright
  namespace: firecrawl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: firecrawl
    app.kubernetes.io/component: playwright
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: firecrawl-redis
  namespace: firecrawl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: firecrawl
    app.kubernetes.io/component: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
