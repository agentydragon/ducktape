apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: firecrawl
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: ExternalArtifact
    name: firecrawl
    namespace: ducktape-flux
  path: ./cluster/k8s/x/firecrawl/app
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: firecrawl-namespace
      namespace: ducktape-flux
    - name: firecrawl-db
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
