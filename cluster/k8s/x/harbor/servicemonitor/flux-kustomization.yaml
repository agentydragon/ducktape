apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-servicemonitor
  namespace: ducktape-flux
spec:
  suspend: true
  interval: 10m
  path: ./cluster/k8s/x/harbor/servicemonitor
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  dependsOn:
    - name: harbor
    - name: monitoring-stack
      namespace: ducktape-flux
