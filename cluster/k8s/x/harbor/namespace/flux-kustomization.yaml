apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-namespace
  namespace: ducktape-flux
spec:
  suspend: true
  interval: 1h
  path: ./cluster/k8s/x/harbor/namespace
  prune: false
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 1m
