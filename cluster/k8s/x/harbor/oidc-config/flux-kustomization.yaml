apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-oidc-config
  namespace: ducktape-flux
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/x/harbor/oidc-config
  prune: true
  wait: true
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: harbor-oidc-config
      namespace: flux-system
  dependsOn:
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
    - name: sso-providers-tf # writes harbor-oauth-client-secret to authentik ns
      namespace: ducktape-flux
    - name: reflector # mirrors harbor-oauth-client-secret to harbor ns
      namespace: ducktape-flux
    - name: harbor # Harbor API must be running
