apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor
  namespace: ducktape-flux
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/x/harbor/app
  prune: true
  wait: true
  # Health check ensures Harbor is fully operational
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: harbor
      namespace: harbor
  dependsOn:
    - name: harbor-namespace
      namespace: ducktape-flux
    - name: harbor-db
    - name: gateway
      namespace: ducktape-flux
    - name: harbor-secrets
    # Phase 1: Deploy without Authentik dependency
    # Phase 2: Add harbor-sso after Harbor is running
