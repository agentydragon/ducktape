apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openhands-sandboxes
  namespace: ducktape-flux
spec:
  suspend: true
  interval: 10m
  path: ./cluster/k8s/x/openhands/sandboxes
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
