apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openhands-settings-json
  namespace: openhands
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-openhands-secret-store
    kind: ClusterSecretStore
  target:
    name: openhands-settings-json
    creationPolicy: Owner
    template:
      data:
        settings.json: |
          {
            "user_consents_to_analytics": false,
            "agent_settings": {
              "llm": {
                "model": "gpt-5.6-terra",
                "api_key": "{{ .openaiApiKey }}"
              }
            },
            "llm_profiles": {
              "profiles": {
                "gpt-5.6-sol": {
                  "model": "gpt-5.6-sol",
                  "api_key": "{{ .openaiApiKey }}"
                },
                "gpt-5.6-terra": {
                  "model": "gpt-5.6-terra",
                  "api_key": "{{ .openaiApiKey }}"
                },
                "gpt-5.6-luna": {
                  "model": "gpt-5.6-luna",
                  "api_key": "{{ .openaiApiKey }}"
                }
              },
              "active": "gpt-5.6-terra"
            }
          }
  data:
    - secretKey: openaiApiKey
      remoteRef:
        key: openhands-secrets
        property: OPENAI_API_KEY
