apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands
  namespace: openhands
  labels:
    app.kubernetes.io/name: openhands
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openhands
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openhands
    spec:
      serviceAccountName: openhands
      # Entrypoint requires root to set up sandbox user; SANDBOX_USER_ID=0
      # skips the docker-socket setup path in entrypoint.sh.
      securityContext:
        runAsUser: 0
      nodeSelector:
        kubernetes.io/hostname: wyrm2
      containers:
        - name: openhands
          image: ghcr.io/all-hands-ai/openhands:main
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: OH_PERSISTENCE_DIR
              value: /.openhands
            - name: FILE_STORE_PATH
              value: /.openhands
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openhands-secrets
                  key: JWT_SECRET
            - name: ZAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openhands-secrets
                  key: ZAI_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openhands-secrets
                  key: OPENAI_API_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openhands-secrets
                  key: GITHUB_TOKEN
            - name: LLM_MODEL
              value: anthropic/claude-sonnet-5
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openhands-secrets
                  key: ZAI_API_KEY
            - name: LLM_BASE_URL
              value: https://api.z.ai/api/anthropic
            - name: OLLAMA_BASE_URL
              value: http://ollama.ollama:11434
          volumeMounts:
            - name: data
              mountPath: /.openhands
            - name: config-toml
              mountPath: /app/config.toml
              subPath: config.toml
            - name: settings-json
              mountPath: /.openhands/settings.json
              subPath: settings.json
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/options
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/options
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openhands-data
        - name: config-toml
          configMap:
            name: openhands-config-toml
        - name: settings-json
          secret:
            secretName: openhands-settings-json
            items:
              - key: settings.json
                path: settings.json
