# VPA resources for recommendation-only monitoring.
# updateMode: "Off" means VPA only generates recommendations, never modifies pods.
#
# Right-sized services (see docs/operations/2026-02-22-memory-request-rightsizing.md)
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vault
  namespace: vault
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: instance
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: openclaw
  namespace: openclaw
spec:
