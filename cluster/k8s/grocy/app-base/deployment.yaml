apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocy
  labels:
    app.kubernetes.io/name: grocy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grocy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grocy
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hil
      containers:
        - name: grocy
          image: lscr.io/linuxserver/grocy:v4.6.0-ls318
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "UTC"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: settingoverrides
              mountPath: /config/data/settingoverrides
          lifecycle:
            # Trigger Grocy's lazy schema migration at startup so a fresh DB is
            # migrated before anything downstream (the MCP, logins, the user-perms
            # Terraform) hits it. `/` is auth-exempt and runs MigrateDatabase()
            # then 302s. Best-effort: bounded retry until the server is up, never
            # fails the container — Grocy's normal lazy migration still covers the
            # first real request if the server is slow to come up here.
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - "i=0; while [ $i -lt 60 ]; do curl -fsS -o /dev/null http://localhost:80/ && exit 0; sleep 2; i=$((i+1)); done"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /login
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /login
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: grocy-config-ovh
        - name: settingoverrides
          configMap:
            name: grocy-settingoverrides
