apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grocy-mcp-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grocy-mcp
      app.kubernetes.io/component: server
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
