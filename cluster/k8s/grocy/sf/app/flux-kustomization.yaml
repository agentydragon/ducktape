apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grocy-sf
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: forgejo-images
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: cert-manager-issuer-config
      namespace: ducktape-flux
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: authentik
      namespace: ducktape-flux
    - name: volsync
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/grocy/sf/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: grocy-sf
    namespace: ducktape-flux
  timeout: 5m
  wait: true
