apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "true"
    goldilocks.fairwinds.com/vpa-update-mode: auto
    rbac.ducktape.io/agent-readable-logs: "true"
  name: grocy-sf
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grocy-config-ovh
  namespace: grocy-sf
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path-ovh
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grocy-config-ovh-verify-20260520
  namespace: grocy-sf
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
        - args:
            - |
              test -f /config/data/grocy.db
              php -r '$db=new PDO("sqlite:/config/data/grocy.db"); echo $db->query("PRAGMA integrity_check")->fetchColumn(), "\n";' | grep -Fx ok
          command:
            - /bin/sh
            - -ceu
          image: lscr.io/linuxserver/grocy:v4.6.0-ls318
          name: verifier
          volumeMounts:
            - mountPath: /config
              name: config
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: grocy-config-ovh
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: grocy-config-ovh-migration
  namespace: grocy-sf
spec:
  rsyncTLS:
    copyMethod: Direct
    destinationPVC: grocy-config-ovh
    moverSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceType: ClusterIP
  trigger:
    manual: prep-20260520
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grocy-config-ovh-backup
  namespace: grocy-sf
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: seaweedfs-ovh
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: grocy-config-ovh-backup
  namespace: grocy-sf
spec:
  rsyncTLS:
    copyMethod: Direct
    destinationPVC: grocy-config-ovh-backup
    moverAffinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values:
                    - hil-ovh
    moverSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceType: ClusterIP
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: grocy-config-ovh-backup
  namespace: grocy-sf
spec:
  rsyncTLS:
    address: volsync-rsync-tls-dst-grocy-config-ovh-backup.grocy-sf.svc
    copyMethod: Direct
    keySecret: volsync-rsync-tls-grocy-config-ovh-backup
    moverAffinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values:
                    - hil-ovh
    moverSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    port: 8000
  sourcePVC: grocy-config-ovh
  trigger:
    schedule: 23 */6 * * *
