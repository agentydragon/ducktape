apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocy-sf
resources:
  # cdk8s-generated (cluster/cdk8s/grocy/app.py) -- see cluster/docs/cdk8s.md.
  - grocy.k8s.yaml
  - grocy-sf.k8s.yaml
patches:
  - target:
      kind: Deployment
      name: grocy
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grocy
      spec:
        replicas: 1
        template:
          spec:
            nodeSelector:
              topology.kubernetes.io/zone: hil-ovh
