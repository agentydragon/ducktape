apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grocy-mcp-sf
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/grocy/sf/mcp
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: grocy-mcp-server
      namespace: grocy-sf
  dependsOn:
    - name: gateway
      namespace: ducktape-flux
    - name: grocy-sf
      namespace: ducktape-flux
    - name: valkey
      namespace: ducktape-flux
    - name: agent-machine-access-tf
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
