apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: grocy-sf-valkey-ovh
  annotations:
    description: Replacement OVH Valkey for Grocy SF MCP OAuth state
spec:
  clusterSize: 2
  kubernetesConfig:
    image: valkey/valkey:8-alpine
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        # TODO(vpa-memory-audit): 128Mi -> 384Mi. VPA observed 256Mi for both
        # request and upper bound — double the old limit. This valkey backs the
        # Grocy MCP cache; 256Mi resident suggests unbounded key growth rather
        # than a working set, so check the eviction policy.
        memory: 384Mi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path-ovh
        resources:
          requests:
            storage: 1Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values: ["hil-ovh"]
      # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
      # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
      # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: grocy-sf-valkey-ovh
          topologyKey: kubernetes.io/hostname
