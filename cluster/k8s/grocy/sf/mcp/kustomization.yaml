apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocy-sf
resources:
  - ../../mcp-base
  - valkey-ovh-instance.yaml
  - server-httproute.yaml
configMapGenerator:
  - name: grocy-mcp-config
    files:
      - config.yaml
patches:
  # Point the secret env at this household's OIDC secret (base uses grocy-mcp-oidc).
  - target:
      kind: Deployment
      name: grocy-mcp-server
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grocy-mcp-server
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: GROCY_MCP_AUTH__OIDC_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: grocy-mcp-oidc-sf
                        key: client_id
                  - name: GROCY_MCP_AUTH__OIDC_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: grocy-mcp-oidc-sf
                        key: client_secret
                  - name: GROCY_MCP_AUTH__PROXY_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: grocy-mcp-oidc-sf
                        key: grocy_proxy_client_id
