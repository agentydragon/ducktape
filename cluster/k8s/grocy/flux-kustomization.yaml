apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grocy
  namespace: flux-system
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/grocy
  prune: true
  wait: true
  dependsOn:
    - name: gateway
    - name: proxmox-csi
    - name: cert-manager-issuer-config
    - name: cert-manager-environment
    - name: authentik
