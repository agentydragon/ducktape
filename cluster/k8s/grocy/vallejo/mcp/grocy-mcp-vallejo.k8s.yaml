apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: grocy-vallejo
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    description: PostgreSQL DSN for the grocy-vallejo MCP OAuth state store.
  name: mcp-oauth-db-credentials
  namespace: grocy-vallejo
spec:
  data:
    - remoteRef:
        key: mcp-oauth-grocy-vallejo-credentials
        property: uri
      secretKey: uri
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: mcp-oauth-grocy-vallejo-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: mcp-oauth-db-credentials
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grocy-mcp-vallejo-server
  namespace: grocy-vallejo
spec:
  hostnames:
    - grocy-mcp-vallejo.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: grocy-mcp-server
          port: 8765
      timeouts:
        backendRequest: 60s
        request: 60s
