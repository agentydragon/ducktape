# NOT behind the Authentik outpost — OIDCProxy runs inside the pod and drives
# the full MCP OAuth dance (DCR, PKCE, resource metadata).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grocy-mcp-vallejo-server
  namespace: grocy-vallejo
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "grocy-mcp-vallejo.allegedly.works"
  rules:
    - backendRefs:
        - name: grocy-mcp-server
          port: 8765
      timeouts:
        request: "60s"
        backendRequest: "60s"
