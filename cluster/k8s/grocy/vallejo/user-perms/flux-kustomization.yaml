apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grocy-vallejo-user-perms
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: forgejo-images
      namespace: ducktape-flux
    - name: grocy-vallejo
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: grocy-user-perms-provisioner
      namespace: grocy-vallejo
  interval: 10m
  path: ./cluster/k8s/grocy/vallejo/user-perms
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: grocy-vallejo-user-perms
    namespace: ducktape-flux
  timeout: 5m
  wait: true
