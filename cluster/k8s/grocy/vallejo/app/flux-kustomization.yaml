apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grocy-vallejo
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/grocy/vallejo/app
  prune: true
  wait: true
  dependsOn:
    - name: forgejo-images
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: cert-manager-issuer-config
      namespace: ducktape-flux
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: authentik
      namespace: ducktape-flux
    - name: volsync
      namespace: ducktape-flux
