apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # cdk8s-generated (cluster/cdk8s/grocy/user_perms.py) -- see cluster/docs/cdk8s.md.
  - grocy-user-perms.k8s.yaml
components:
  - ./image-pins
configMapGenerator:
  # Hash-suffixed: a policy edit changes the Job spec, which (with the force
  # annotation) makes Flux recreate the one-shot Job — immediate convergence.
  - name: grocy-user-perms-policy
    files:
      - policy.yaml
