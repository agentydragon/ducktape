apiVersion: v1
kind: Service
metadata:
  name: grocy-mcp-server
  labels:
    app.kubernetes.io/name: grocy-mcp
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: grocy-mcp
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8765
      targetPort: 8765
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  type: ClusterIP
