apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocy-mcp-server
  labels:
    app.kubernetes.io/name: grocy-mcp
    app.kubernetes.io/component: server
  annotations:
    description: "FastMCP server generating Grocy tools from Grocy's OpenAPI spec. Per-request token exchange swaps the caller's Authentik JWT for a Grocy-proxy-scoped JWT before calling Grocy."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grocy-mcp
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grocy-mcp
        app.kubernetes.io/component: server
    spec:
      enableServiceLinks: false
      containers:
        - name: server
          image: ghcr.io/agentydragon/grocy-mcp:devel-20260701103509-515c933 # {"$imagepolicy": "flux-system:grocy-mcp-oidc-server"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
            # Prometheus metrics, cluster-internal only (not on the HTTPRoute).
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
            # Non-secret structured config (grocy_url, auth issuer/URLs/
            # extra_jwt_issuers, persistence) comes from this YAML file, supplied
            # per household by the overlay's grocy-mcp-config configMap. Secrets
            # stay in env below (per-household secret via overlay patch).
            - name: GROCY_MCP_CONFIG_FILE
              value: /etc/grocy-mcp/config.yaml
            - name: GROCY_MCP_AUTH__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grocy-mcp-oidc
                  key: client_id
            - name: GROCY_MCP_AUTH__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grocy-mcp-oidc
                  key: client_secret
            - name: GROCY_MCP_AUTH__PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grocy-mcp-oidc
                  key: grocy_proxy_client_id
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: config
              mountPath: /etc/grocy-mcp
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: grocy-mcp-config
