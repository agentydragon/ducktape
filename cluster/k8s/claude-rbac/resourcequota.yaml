apiVersion: v1
kind: ResourceQuota
metadata:
  name: claude-sandbox-quota
  namespace: claude-sandbox
spec:
  hard:
    # Limit total resources in namespace
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    # Limit number of objects
    pods: "10"
    services: "5"
    configmaps: "20"
    persistentvolumeclaims: "5"
    requests.storage: 50Gi
