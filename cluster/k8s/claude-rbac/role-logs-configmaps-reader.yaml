apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: logs-configmaps-reader
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources:
      - pods/log
      - configmaps
    verbs: ["get", "list", "watch"]
---
