---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: github-branch-protection
  namespace: flux-system
spec:
  # EXPERIMENT(added 2026-09-04): suspended to test whether the GitHub-provider
  # tf roots are spending the account's GraphQL quota. Unsuspend once the next
  # reset window has been read either way -- a diagnostic, not a decision.
  # See <debug/github_rate_limit_monitoring_blind_spot.md>.
  suspend: true
  interval: 15m
  refreshBeforeApply: true
  path: ./tf/gitops/github-branch-protection
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  serviceAccountName: tf-runner
  approvePlan: "auto"

  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "github_branch_protection"
      }
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tofu-state-db-credentials
              key: password
