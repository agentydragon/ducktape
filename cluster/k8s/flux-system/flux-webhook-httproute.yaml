---
# Exposes the Flux notification-controller webhook-receiver service externally.
# Handles both Harbor push webhooks and GitHub push webhooks.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "flux-webhook.allegedly.works"
  rules:
    - backendRefs:
        - name: webhook-receiver
          port: 80
