apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Keep controller args that must survive raw Terraform bootstrap applies in
  # gotk-components.yaml instead of overlay-only patches.
  - gotk-components.yaml
  # Keep root GitRepository fields that must survive raw Terraform bootstrap
  # applies in gotk-sync.yaml. Runtime GitHub App auth belongs on separate
  # Flux-managed sources because the Secret below is SOPS-decrypted by Flux.
  - gotk-sync.yaml
  - ducktape-automation-github-app.sops.yaml
patches:
  - target:
      kind: Namespace
      name: flux-system
    patch: |
      - op: add
        path: /metadata/labels/goldilocks.fairwinds.com~1enabled
        value: "false"
      - op: add
        path: /metadata/labels/rbac.ducktape.io~1agent-namespace-diagnostics-reader
        value: "true"
  # Keep flux controller disk I/O (git clones, artifacts, image automation — all on
  # emptyDir, i.e. the host disk) off the control-plane nodes, whose etcd lives on slow
  # rotational HDDs. Soft (preferred) so these system-cluster-critical controllers keep a
  # scheduling fallback if both NVMe workers are down. See
  # cluster/docs/lessons_learned/2026_06_19_etcd_hdd_io_contention.md
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
