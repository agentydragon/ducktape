apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Keep controller args that must survive raw Terraform bootstrap applies in
  # gotk-components.yaml instead of overlay-only patches.
  - gotk-components.yaml
  # Keep root GitRepository fields that must survive raw Terraform bootstrap
  # applies in gotk-sync.yaml. Runtime GitHub App auth belongs on separate
  # Flux-managed sources because the Secret below is SOPS-decrypted by Flux.
  - gotk-sync.yaml
  - ducktape-automation-github-app.sops.yaml
patches:
  - target:
      kind: Namespace
      name: flux-system
    patch: |
      - op: add
        path: /metadata/labels/goldilocks.fairwinds.com~1enabled
        value: "false"
      - op: add
        path: /metadata/labels/rbac.ducktape.io~1agent-readable-logs
        value: "true"
  # Keep flux controller disk I/O (git clones, artifacts, image automation — all on
  # emptyDir, i.e. the host disk) off rotational disks: every ducktape commit is a fresh
  # clone plus an artifact per GitRepository, and on an HDD that saturates the disk. Keyed
  # to the hardware label, not a node role: the roles moved between the KS-5 HDD boxes and
  # the NVMe boxes during storage tiering, and a role-keyed preference silently inverted.
  # NotIn also admits nodes without the label (wyrm2). Soft (preferred) so these
  # system-cluster-critical controllers keep a scheduling fallback if every SSD node is
  # down. See cluster/docs/lessons_learned/2026_06_19_etcd_hdd_io_contention.md
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: storage.allegedly.works/tier
                      operator: NotIn
                      values: [hdd]
