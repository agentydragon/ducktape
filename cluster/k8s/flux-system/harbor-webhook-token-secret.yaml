---
# Webhook token for the Flux harbor Receiver.
# Token generated by terraform/gitops/harbor-ci, stored in Vault at kv/harbor/webhook-token.
# The Receiver computes its webhook path as sha256(token), which is also used
# by harbor-webhook Terraform to configure the Harbor notification endpoint.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-webhook-token
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-webhook-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        token: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: kv/harbor/webhook-token
        property: token
