---
# Flux Receiver: Harbor push events → immediate ImageRepository rescan
#
# When Harbor sends a push_artifact webhook to /hook/<sha256(token)>, Flux
# immediately rescans the props-backend ImageRepository instead of waiting
# for the 5-minute poll interval.
#
# The webhook URL is configured in Harbor by terraform/gitops/harbor-webhook.
# The token secret is created from Vault by flux-system/harbor-webhook-token-secret.yaml.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: harbor
  namespace: flux-system
spec:
  type: harbor
  events:
    - push_artifact
  secretRef:
    name: harbor-webhook-token
  resources:
    - apiVersion: image.toolkit.fluxcd.io/v1beta2
      kind: ImageRepository
      name: props-backend
      namespace: flux-system
