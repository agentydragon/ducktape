---
# Webhook token for the Flux github Receiver.
# Token generated by terraform/gitops/harbor-ci, stored in Vault at kv/flux/github-webhook-token.
# Used as the GitHub webhook secret for HMAC-SHA256 payload verification.
# After deploying, register the webhook in GitHub:
#   TOKEN=$(kubectl get secret github-webhook-token -n flux-system -o jsonpath='{.data.token}' | base64 -d)
#   PATH=$(python3 -c "import hashlib; print(hashlib.sha256(TOKEN.encode()).hexdigest())")
#   gh api repos/agentydragon/ducktape/hooks --method POST \
#     -f "config[url]=https://flux-webhook.allegedly.works/hook/$PATH" \
#     -f "config[secret]=$TOKEN" \
#     -f "config[content_type]=json" \
#     -f "events[]=push"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-webhook-token
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-webhook-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        token: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: kv/flux/github-webhook-token
        property: token
