apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-proxy-ha-token
  namespace: homeassistant-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: homeassistant-proxy-ha-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: kv/homeassistant-proxy/ha-token
        property: token
