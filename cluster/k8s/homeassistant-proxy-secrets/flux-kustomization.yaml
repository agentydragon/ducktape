apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homeassistant-proxy-secrets
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/homeassistant-proxy-secrets
  prune: true
  wait: true
  dependsOn:
    - name: homeassistant-proxy-namespace
    - name: external-secrets-config
