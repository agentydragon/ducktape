# A credential a sandbox may present without ever holding it: where its real value comes from, and
# every exact location the proxy substitutes it into. An EgressPolicy rule references one by name;
# on its own a credential grants nothing.
#
# The placeholder a sandbox sends is `agentplane-credential-<name>` and is not written here. Deriving
# it from the object's name is what makes one placeholder mean one credential — detection is
# namespace-global, so a placeholder recognised from one credential governs a request granted
# through another, and two objects cannot be checked against each other by any schema.
#
# Shared contract with the proxy (x/agentplane/egress/SPEC.md); the kubeconform schema under
# cluster/schemas/ is this file's openAPIV3Schema, pinned by
# cluster/validation/test_agentplane_crd_schemas.py.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: egresscredentials.agentplane.allegedly.works
spec:
  group: agentplane.allegedly.works
  scope: Namespaced
  names:
    kind: EgressCredential
    listKind: EgressCredentialList
    plural: egresscredentials
    singular: egresscredential
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Description
          type: string
          jsonPath: .spec.description
        - name: Secret
          type: string
          jsonPath: .spec.source.secretRef.name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [source, description, targets]
              properties:
                description:
                  description: >-
                    What this credential is and what it can do, in prose, for the sandbox that will
                    present it without ever seeing it. Served to agents over the rules endpoint, so
                    it must contain nothing secret — name the identity and its reach, never the
                    value. An agent holding an opaque placeholder can send a request; only one told
                    whose token it stands for can weigh whether to.
                  type: string
                  minLength: 1
                source:
                  description: >-
                    Where the real value comes from. The Secret is resolved in the proxy's configured
                    credentials namespace (agentplane-egress-credentials), never this object's, and
                    only the proxy reads it.
                  type: object
                  required: [secretRef]
                  properties:
                    secretRef:
                      type: object
                      required: [name, key]
                      properties:
                        name:
                          type: string
                          minLength: 1
                        key:
                          type: string
                          minLength: 1
                targets:
                  description: >-
                    Every exact location this credential may be presented in. A target fires only
                    where a request actually presents the placeholder in that position, so declaring
                    one does not make it apply to traffic that does not use it.
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [header, method]
                    properties:
                      header:
                        description: Request header the placeholder goes in, matched case-insensitively.
                        type: string
                        minLength: 1
                      method:
                        description: >-
                          How the header value is parsed, and which whole component of that parse the
                          placeholder must equal. wholeValue: the value itself. schemeToken:
                          `<scheme> <credential>`. basicUsername and basicPassword: the halves of a
                          `Basic base64(username:password)` payload. basicWhole: a `Basic` payload
                          that is the credential entire, with or without a colon in it.
                        type: string
                        enum: [wholeValue, schemeToken, basicUsername, basicPassword, basicWhole]
                      scheme:
                        description: >-
                          The scheme schemeToken expects, compared case-insensitively (`Bearer`).
                          Meaningless for every other method.
                        type: string
                        minLength: 1
                    allOf:
                      - if:
                          properties:
                            method:
                              const: schemeToken
                        then:
                          required: [scheme]
                        else:
                          not:
                            required: [scheme]
