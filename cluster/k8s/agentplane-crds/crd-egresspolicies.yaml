# A reusable, subject-free egress rule set for Agentplane sandboxes: which hosts, methods, and
# paths a request may reach, and optionally the credential the proxy substitutes on the way
# out. An EgressBinding attaches policies to subjects; on its own a policy grants nothing.
# Shared contract with the proxy (x/agentplane/plans/egress_proxy.md); the kubeconform schema
# under cluster/schemas/ is this file's openAPIV3Schema, pinned by
# cluster/validation/test_agentplane_crd_schemas.py.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: egresspolicies.agentplane.allegedly.works
spec:
  group: agentplane.allegedly.works
  scope: Namespaced
  names:
    kind: EgressPolicy
    listKind: EgressPolicyList
    plural: egresspolicies
    singular: egresspolicy
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # Kubernetes JSONPath has no length(), so the column shows the first rule's hosts, not a
      # rule count.
      additionalPrinterColumns:
        - name: Hosts
          type: string
          jsonPath: .spec.rules[0].hosts
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [rules]
              properties:
                rules:
                  description: Rules are alternatives; a request matching any one of them is allowed.
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [hosts]
                    properties:
                      hosts:
                        description: >-
                          Exact lowercase hostnames, or `*.` followed by a domain to match every
                          subdomain of it (not the domain itself).
                        type: array
                        minItems: 1
                        items:
                          type: string
                          pattern: '^(\*\.)?[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$'
                      methods:
                        description: HTTP methods the rule admits; omitted means any method.
                        type: array
                        minItems: 1
                        items:
                          type: string
                          enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS, CONNECT, TRACE]
                      paths:
                        description: Path patterns the rule admits, as the proxy matches them; omitted means any path.
                        type: array
                        minItems: 1
                        items:
                          type: string
                          minLength: 1
                      credential:
                        description: >-
                          The credential the proxy substitutes on a matching request: it replaces
                          the placeholder value in the named header with the Secret key's value. The
                          Secret is resolved in the proxy's configured credentials namespace
                          (agentplane-egress-credentials), never the policy's, and only the proxy
                          reads it.
                        type: object
                        required: [secretRef, header, placeholder]
                        properties:
                          secretRef:
                            type: object
                            required: [name, key]
                            properties:
                              name:
                                type: string
                                minLength: 1
                              key:
                                type: string
                                minLength: 1
                          header:
                            type: string
                            minLength: 1
                          placeholder:
                            description: The inert value the sandbox sends in the header.
                            type: string
                            minLength: 1
