# Attaches EgressPolicies to subjects: a named Sandbox, or a named ServiceAccount for a workload
# no Sandbox owns. The
# binding's existence is the grant: creating one allows, deleting one takes that back, and it
# contributes nothing after it expires. Shared contract with the proxy (x/agentplane/egress/SPEC.md);
# the kubeconform schema under cluster/schemas/ is this file's openAPIV3Schema, pinned by
# cluster/validation/test_agentplane_crd_schemas.py.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: egressbindings.agentplane.allegedly.works
spec:
  group: agentplane.allegedly.works
  scope: Namespaced
  names:
    kind: EgressBinding
    listKind: EgressBindingList
    plural: egressbindings
    singular: egressbinding
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Expires
          type: string
          jsonPath: .spec.expiresAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [subjects, policies]
              properties:
                subjects:
                  type: array
                  minItems: 1
                  items:
                    description: Exactly one subject kind, as ActionPolicyBinding's subject is written.
                    type: object
                    minProperties: 1
                    maxProperties: 1
                    properties:
                      sandbox:
                        description: >-
                          One Sandbox, resolved in the workload namespace the enforcing deployment
                          serves (`--sandbox-namespace`). A grant to it ends with it because the
                          binding is owned by it; `uid` additionally pins one instance, and is
                          optional because that ownership is what ends the grant.
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            minLength: 1
                          uid:
                            type: string
                            minLength: 1
                      serviceAccount:
                        description: >-
                          A workload no Sandbox owns, such as a Deployment, named by the
                          ServiceAccount its Pod runs as. Every Pod running as it is this subject
                          and nothing ends the subject with a workload, so bind only a
                          ServiceAccount dedicated to one.
                        type: object
                        required: [namespace, name]
                        properties:
                          namespace:
                            type: string
                            minLength: 1
                          name:
                            type: string
                            minLength: 1
                policies:
                  description: EgressPolicy names in the binding's namespace.
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                expiresAt:
                  description: After this instant the binding contributes nothing.
                  type: string
                  format: date-time
