# Attaches EgressPolicies to subjects, each a namespaced ServiceAccount. The
# binding's existence is the grant: creating one allows, deleting one takes that back, and it
# contributes nothing after it expires. Shared contract with the proxy (x/agentplane/egress/SPEC.md);
# the kubeconform schema under cluster/schemas/ is this file's openAPIV3Schema, pinned by
# cluster/validation/test_agentplane_crd_schemas.py.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: egressbindings.agentplane.allegedly.works
spec:
  group: agentplane.allegedly.works
  scope: Namespaced
  names:
    kind: EgressBinding
    listKind: EgressBindingList
    plural: egressbindings
    singular: egressbinding
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Expires
          type: string
          jsonPath: .spec.expiresAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [subjects, policies]
              properties:
                subjects:
                  description: >-
                    The ServiceAccounts this binding grants to. A subject is what a workload's Pod
                    runs as, so an agent this cluster does not host is an ordinary subject. Every
                    Pod running as the account is this subject and nothing ends the subject with a
                    workload, so bind only an account dedicated to one; the app gives each sandbox
                    an account of its own, owned by it.
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [namespace, name]
                    properties:
                      namespace:
                        type: string
                        minLength: 1
                      name:
                        type: string
                        minLength: 1
                policies:
                  description: EgressPolicy names in the binding's namespace.
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                expiresAt:
                  description: After this instant the binding contributes nothing.
                  type: string
                  format: date-time
