# A reusable, subject-free set of Action auto-decision policies for the Action Service. Each
# policy is one typed evaluator (`type` plus its parameters); Python owns the semantics and
# reports whether it accepted the set in the Ready condition. An ActionPolicyBinding attaches
# sets to a caller; on its own a set grants nothing. Shared contract with the Action Service
# (x/agentplane/action_service/SPEC.md); the kubeconform schema under cluster/schemas/ is this
# file's openAPIV3Schema, pinned by cluster/validation/test_agentplane_crd_schemas.py.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: actionpolicysets.agentplane.allegedly.works
spec:
  group: agentplane.allegedly.works
  scope: Namespaced
  names:
    kind: ActionPolicySet
    listKind: ActionPolicySetList
    plural: actionpolicysets
    singular: actionpolicyset
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              properties:
                autoApproveIf:
                  description: A request matching any policy here is auto-approved.
                  type: array
                  items: &policy
                    description: >-
                      One typed evaluator: `type` selects the kind, and each kind admits exactly
                      the fields its `oneOf` branch names.
                    type: object
                    required: [type, actions]
                    properties:
                      type:
                        description: >-
                          The evaluator. `exact_actions` matches by Action name alone;
                          `argument_schema` also requires the arguments to satisfy `schema`;
                          `github_repository` requires a GitHub MCP call to target
                          `owner`/`repository`; `github_public_repository` requires it to
                          target a repository an unauthenticated GitHub lookup confirms public.
                        type: string
                        enum: [exact_actions, argument_schema, github_repository, github_public_repository]
                      actions:
                        description: Action names by ActionGroup key; the policy matches only these.
                        type: object
                        minProperties: 1
                        additionalProperties:
                          type: array
                          minItems: 1
                          items:
                            type: string
                            minLength: 1
                      schema:
                        description: >-
                          A JSON Schema the arguments must satisfy, with plain JSON Schema
                          semantics: `properties` alone never implies presence; use `required`.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      owner:
                        description: The GitHub repository owner.
                        type: string
                        minLength: 1
                      repository:
                        description: The GitHub repository name.
                        type: string
                        minLength: 1
                    # The discriminated union. A structural schema declares every field once, above,
                    # and lets a `oneOf` branch carry only value validations, so each branch pins
                    # `type` and says which of the declared fields that kind requires and forbids.
                    oneOf:
                      - properties:
                          type:
                            enum: [exact_actions]
                        not:
                          anyOf:
                            - required: [schema]
                            - required: [owner]
                            - required: [repository]
                      - properties:
                          type:
                            enum: [argument_schema]
                        required: [schema]
                        not:
                          anyOf:
                            - required: [owner]
                            - required: [repository]
                      - properties:
                          type:
                            enum: [github_repository]
                        required: [owner, repository]
                        not:
                          required: [schema]
                      - properties:
                          type:
                            enum: [github_public_repository]
                        not:
                          anyOf:
                            - required: [schema]
                            - required: [owner]
                            - required: [repository]
                autoDenyIf:
                  description: A request matching any policy here is auto-denied.
                  type: array
                  items: *policy
                autoDenyUnless:
                  description: A request matching none of the policies here is auto-denied.
                  type: array
                  items: *policy
            status:
              type: object
              properties:
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    description: A metav1.Condition; the Action Service sets Ready.
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$'
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: "^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$"
                      message:
                        type: string
                        maxLength: 32768
