apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: website
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: gateway
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/website
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: website
    namespace: ducktape-flux
  timeout: 5m
  wait: true
