apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: haku-managed-agent
  namespace: flux-system
spec:
  image: git.allegedly.works/ducktape-ci/haku-managed-agent
  interval: 5m
  secretRef:
    name: forgejo-images-creds
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: haku-managed-agent
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: haku-managed-agent
  filterTags:
    # Tags pushed by CI: {branch}-YYYYMMDDHHMMSS-{sha7} — alphabetical == chronological
    pattern: '^devel-\d{14}-[0-9a-f]{7}$'
  policy:
    alphabetical:
      order: asc
