apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: agentplane-action-service-migrate
  namespace: flux-system
spec:
  image: git.allegedly.works/ducktape-ci/agentplane-action-service-migrate
  interval: 5m
  secretRef:
    name: forgejo-images-creds
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: agentplane-action-service-migrate
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: agentplane-action-service-migrate
  filterTags:
    pattern: '^devel-\d{14}-[0-9a-f]{7}$'
  policy:
    alphabetical:
      order: asc
