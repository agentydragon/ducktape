apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: aiquota-migrate
  namespace: flux-system
spec:
  image: git.allegedly.works/ducktape-ci/aiquota-migrate
  interval: 5m
  secretRef:
    name: forgejo-images-creds
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: aiquota-migrate
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: aiquota-migrate
  filterTags:
    pattern: "^devel-[0-9]{14}-[0-9a-f]{7}$"
  policy:
    alphabetical:
      order: asc
