apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: grocy-user-perms-provisioner
  namespace: flux-system
spec:
  image: git.allegedly.works/ducktape-ci/grocy-user-perms-provisioner
  interval: 5m
  secretRef:
    name: forgejo-images-creds
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: grocy-user-perms-provisioner
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: grocy-user-perms-provisioner
  filterTags:
    # Tags pushed by CI: {branch}-YYYYMMDDHHMMSS-{sha7} - alphabetical order == chronological
    pattern: '^devel-\d{14}-[0-9a-f]{7}$'
  policy:
    alphabetical:
      order: asc
