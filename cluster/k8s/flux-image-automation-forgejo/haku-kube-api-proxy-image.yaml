apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: haku-kube-api-proxy
  namespace: flux-system
spec:
  image: git.allegedly.works/ducktape-ci/haku-kube-api-proxy
  interval: 5m
  # Private Forgejo package — authenticate the scan with the ducktape-ci
  # credential (reflected here from cluster/k8s/forgejo-images/).
  secretRef:
    name: forgejo-images-creds
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: haku-kube-api-proxy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: haku-kube-api-proxy
  filterTags:
    # Tags pushed by CI: {branch}-YYYYMMDDHHMMSS-{sha7} — alphabetical == chronological
    pattern: '^devel-\d{14}-[0-9a-f]{7}$'
  policy:
    alphabetical:
      order: asc
