# CLEANUP(added 2026-08-09): delete along with the commit-built image once
#   iron-proxy v0.50.0 ships stable (c90f4fe is already in v0.50.0-rc.2).
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: iron-proxy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: iron-proxy
  filterTags:
    # CI tags: {branch}-YYYYMMDDHHMMSS-{sha7}; alphabetical == chronological.
    pattern: '^devel-\d{14}-[0-9a-f]{7}$'
  policy:
    alphabetical:
      order: asc
