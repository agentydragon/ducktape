# CLEANUP(added 2026-08-09): delete along with the commit-built image once
#   iron-proxy v0.50.0 ships stable (c90f4fe is already in v0.50.0-rc.2).
#
# Renamed from `public-coder-iron-proxy` (2026-08-09): the image is plain
# upstream iron-proxy at a pinned revision, and public-coder-agent is one of
# three consumers. The `.../public-coder-iron-proxy` package still exists and is
# what the running pods pull; the consuming deployments move to this path when
# Flux writes the first tag pushed under the new name.
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: iron-proxy
  namespace: flux-system
spec:
  image: git.allegedly.works/ducktape-ci/iron-proxy
  interval: 5m
  # Private Forgejo package; this credential is reflected from forgejo-images.
  secretRef:
    name: forgejo-images-creds
---
# CLEANUP(added 2026-08-09): delete along with the commit-built image once
#   iron-proxy v0.50.0 ships stable (c90f4fe is already in v0.50.0-rc.2).
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: iron-proxy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: iron-proxy
  filterTags:
    # CI tags: {branch}-YYYYMMDDHHMMSS-{sha7}; alphabetical == chronological.
    pattern: '^devel-\d{14}-[0-9a-f]{7}$'
  policy:
    alphabetical:
      order: asc
