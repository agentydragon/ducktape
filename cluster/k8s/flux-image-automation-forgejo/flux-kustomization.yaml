apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-image-automation-forgejo
  namespace: flux-system
  annotations:
    description: Image automation for images hosted in our Forgejo registry (authenticated scans via the reflected ducktape-ci credential).
spec:
  interval: 10m
  path: ./cluster/k8s/flux-image-automation-forgejo
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: forgejo-images # source credential (reflected into flux-system)
