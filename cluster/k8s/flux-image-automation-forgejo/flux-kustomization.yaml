apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Image automation for images hosted in our Forgejo registry (authenticated scans via the reflected ducktape-ci credential).
  name: flux-image-automation-forgejo
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: forgejo-images
      namespace: ducktape-flux
    - name: flux-image-automation-ghcr
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/flux-image-automation-forgejo
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: flux-image-automation-forgejo
    namespace: ducktape-flux
