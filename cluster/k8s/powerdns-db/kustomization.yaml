apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres-cluster.yaml
configMapGenerator:
  - name: powerdns-schema
    namespace: dns-system
    files:
      - schema.pgsql.sql
    options:
      # Stable name required: CNPG references this ConfigMap by exact name in postInitApplicationSQLRefs
      disableNameSuffixHash: true
