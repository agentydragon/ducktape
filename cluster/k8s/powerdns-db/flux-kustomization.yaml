apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: powerdns-db
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/powerdns-db"
  prune: true
  wait: true
  dependsOn:
    - name: cnpg
    - name: dns-system-namespace
    - name: hcloud-csi # hcloud-volumes storage class
