apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-barman-cloud
  namespace: ducktape-flux
  annotations:
    description: Installs the CNPG-I Barman Cloud plugin before database backup resources are applied.
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/cnpg-barman-cloud
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: cnpg-barman-cloud
    namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: plugin-barman-cloud
      namespace: cnpg-system
    - apiVersion: apps/v1
      kind: Deployment
      name: plugin-barman-cloud
      namespace: cnpg-system
  dependsOn:
    - name: cnpg
      namespace: ducktape-flux
    - name: cert-manager
      namespace: ducktape-flux
