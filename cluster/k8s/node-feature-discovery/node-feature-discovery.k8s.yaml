apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/enforce: privileged
    rbac.ducktape.io/agent-readable-logs: "true"
  name: node-feature-discovery
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nfd
  namespace: node-feature-discovery
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/node-feature-discovery/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: node-feature-discovery
spec:
  chart:
    spec:
      chart: node-feature-discovery
      sourceRef:
        kind: HelmRepository
        name: nfd
        namespace: node-feature-discovery
      version: 0.19.0
  install:
    remediation:
      retries: 3
  interval: 15m
  upgrade:
    disableWait: true
  values:
    worker:
      config:
        sources:
          pci:
            deviceClassWhitelist:
              - "02"
              - "03"
            deviceLabelFields:
              - vendor
      tolerations:
        - effect: NoSchedule
          operator: Exists
      updateStrategy:
        rollingUpdate:
          maxUnavailable: 3
        type: RollingUpdate
