apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: gateway
  namespace: ducktape-flux
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: ducktape
      namespace: ducktape-flux
  artifacts:
    - name: gateway
      originRevision: "@repo"
      copy:
        - from: "@repo/cluster/k8s/gateway/**"
          to: "@artifact/cluster/k8s/gateway/"
          exclude:
            - flux-kustomization.yaml
