apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/openclaw
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  dependsOn:
    - name: openclaw-operator
    - name: openclaw-namespace
    - name: openclaw-secrets
    - name: authentik-blueprint-openclaw
