apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: sshpiper-source
  namespace: ducktape-flux
spec:
  interval: 1h
  url: https://github.com/tg123/sshpiper.git
  ref:
    tag: v1.6.1
  # Keep only the CRD. In particular, plugin/kubernetes/sample.yaml is an example Pipe,
  # not a production route to apply. Flux generates a kustomization.yaml for this plain-YAML path.
  ignore: |
    /*
    !/plugin
    /plugin/*
    !/plugin/kubernetes
    /plugin/kubernetes/*
    !/plugin/kubernetes/crd.yaml
