# Namespace-local source for public Ducktape control objects.
#
# Keep this checkout intentionally sparse, matching flux-system's existing
# public-repository source. Include the source roots consumed by the
# ArtifactGenerator as well as the paths used directly by public Kustomizations.
# The public Kustomizations retarget to this source in the follow-up change once
# it has reconciled and webhook/alert coverage is in place.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ducktape
  namespace: ducktape-flux
spec:
  interval: 1m
  ref:
    branch: devel
  sparseCheckout:
    - cluster/k8s/
    - cluster/charts/browsertrix/
    - haku/x/dispatch/deploy/
    - haku/runtime/managed_agent/self_hosted/deploy/
    - loom/wayback/deploy/
    - props/deploy/
    - tf/gitops/
  url: https://github.com/agentydragon/ducktape.git
