apiVersion: v1
kind: Namespace
metadata:
  labels:
    name: ducktape-flux
  name: ducktape-flux
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ducktape
  namespace: ducktape-flux
spec:
  interval: 1m
  ref:
    branch: devel
  sparseCheckout:
    - cluster/k8s/
    - cluster/charts/browsertrix/
    - haku/x/dispatch/deploy/
    - haku/runtime/managed_agent/self_hosted/deploy/
    - loom/wayback/deploy/
    - props/deploy/
    - tf/gitops/
  url: https://github.com/agentydragon/ducktape.git
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    description: Read-only public Ducktape Flux diagnostics.
  name: ducktape-flux-reader
  namespace: ducktape-flux
rules:
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    description: Binds the public-coder access profile to public Ducktape Flux diagnostics.
  name: public-coder-agent-ducktape-flux-reader
  namespace: ducktape-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ducktape-flux-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:public-coder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    description: Binds the Haku OIDC group to public Ducktape Flux diagnostics.
  name: haku-ducktape-flux-reader
  namespace: ducktape-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ducktape-flux-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:haku
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:haku
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
