apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Agentplane's own CRDs (EgressPolicy, EgressBinding, EgressCredential, ActionPolicySet, ActionPolicyBinding), cluster-scoped and shared by every Agentplane namespace; the environment seeds, the egress proxy and the Action Service depend on this.
  name: agentplane-crds
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/agentplane-crds
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: agentplane-crds
    namespace: ducktape-flux
  timeout: 2m
  wait: true
---
