apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: forgejo-agentydragon
  namespace: forgejo
spec:
  # Keep the failed replacement inert and prevent finalizer-driven resource
  # destruction while the controller's least-privilege runner gap is resolved.
  suspend: true
  destroyResourcesOnDeletion: false
  interval: 15m
  refreshBeforeApply: true
  path: ./tf/gitops/forgejo-agentydragon
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  serviceAccountName: tf-runner-forgejo-agentydragon
  approvePlan: "auto"
  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate_forgejo_agentydragon@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate_forgejo_agentydragon?sslmode=require"
        schema_name = "forgejo_agentydragon"
      }
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tofu-state-forgejo-agentydragon-v2-credentials
              key: password
