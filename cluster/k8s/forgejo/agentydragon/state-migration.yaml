# This Job performs the state hand-off only. It does not initialize providers,
# plan, apply, import, or contact Forgejo. The old Terraform CR remains
# suspended while the new one is suspended, so this is the sole state writer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-agentydragon-state-migration-config
  namespace: tofu-state
data:
  main.tf: |
    terraform {
      backend "pg" {}
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-agentydragon-state-transfer
  namespace: tofu-state
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transfer
          # This is the deployed tofu-controller runner image. v0.16.5 bundles
          # OpenTofu 1.11.3, avoiding mixed pg-backend lock implementations.
          image: ghcr.io/flux-iac/tf-runner:v0.16.5@sha256:7209171093907ec1d0559c682949fcee4b625205a6a058c16fe0ce0017af5f41
          command: ["/bin/sh", "-ec"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - |
              umask 077
              trap 'rm -f /work/source.tfstate /work/destination.tfstate' EXIT
              mkdir -p /work/source /work/destination
              cp /config/main.tf /work/source/main.tf
              cp /config/main.tf /work/destination/main.tf

              cd /work/source
              env PGPASSWORD="$OLD_PGPASSWORD" tofu init -input=false -no-color \
                -backend-config='conn_str=postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable' \
                -backend-config='schema_name=forgejo_agentydragon'
              env PGPASSWORD="$OLD_PGPASSWORD" tofu state pull > /work/source.tfstate
              test -s /work/source.tfstate
              source_count="$(env PGPASSWORD="$OLD_PGPASSWORD" tofu state list | wc -l)"

              cd /work/destination
              env PGPASSWORD="$NEW_PGPASSWORD" tofu init -input=false -no-color \
                -backend-config='conn_str=postgres://tfstate_forgejo_agentydragon@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate_forgejo_agentydragon?sslmode=require' \
                -backend-config='schema_name=forgejo_agentydragon'
              test -z "$(env PGPASSWORD="$NEW_PGPASSWORD" tofu state list)"
              env PGPASSWORD="$NEW_PGPASSWORD" tofu state push /work/source.tfstate
              env PGPASSWORD="$NEW_PGPASSWORD" tofu state pull > /work/destination.tfstate
              cmp -s /work/source.tfstate /work/destination.tfstate
              destination_count="$(env PGPASSWORD="$NEW_PGPASSWORD" tofu state list | wc -l)"
              test "$source_count" = "$destination_count"
              printf 'state transfer verified: %s resources\n' "$destination_count"
          env:
            - name: OLD_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  # Temporary migration-only access to the old shared database.
                  name: tofu-state-db-credentials
                  key: password
            - name: NEW_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tofu-state-forgejo-agentydragon-credentials
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: config
          configMap:
            name: forgejo-agentydragon-state-migration-config
        - name: work
          emptyDir:
            medium: Memory
