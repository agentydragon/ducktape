# This Job performs the state hand-off only. It does not initialize providers,
# plan, apply, import, or contact Forgejo. The old Terraform CR remains
# suspended while the new one is suspended, so this is the sole state writer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-agentydragon-state-migration-config
  namespace: tofu-state
data:
  main.tf: |
    terraform {
      backend "pg" {}
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-agentydragon-state-transfer-v4
  namespace: tofu-state
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transfer
          # This is the deployed tofu-controller runner image. v0.16.5 bundles
          # OpenTofu 1.11.3, avoiding mixed pg-backend lock implementations.
          # Match the live controller setting. This tag is already pulled and
          # successfully started by controller-created runners on this node.
          image: ghcr.io/flux-iac/tf-runner:v0.16.5
          command: ["/bin/sh", "-ec"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - |
              umask 077
              trap 'rm -f /work/source.tfstate /work/destination.tfstate /work/source.resources /work/destination.resources' EXIT
              printf 'runner started\n'
              tofu version
              mkdir -p /work/source /work/destination
              cp /config/main.tf /work/source/main.tf
              cp /config/main.tf /work/destination/main.tf

              cd /work/source
              printf 'initializing source backend\n'
              timeout 90s env PGPASSWORD="$OLD_PGPASSWORD" tofu init -input=false -no-color \
                -backend-config='conn_str=postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable' \
                -backend-config='schema_name=forgejo_agentydragon'
              printf 'pulling source state\n'
              timeout 90s env PGPASSWORD="$OLD_PGPASSWORD" tofu state pull > /work/source.tfstate
              test -s /work/source.tfstate

              cd /work/destination
              printf 'initializing destination backend\n'
              timeout 90s env PGPASSWORD="$NEW_PGPASSWORD" tofu init -input=false -no-color \
                -backend-config='conn_str=postgres://tfstate_forgejo_agentydragon@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate_forgejo_agentydragon?sslmode=require' \
                -backend-config='schema_name=forgejo_agentydragon'
              # A backend with no state makes `tofu state list` fail, so do not
              # use it as an emptiness test. A prior Job may already have
              # written this exact state; accept only that case and otherwise
              # fail closed rather than overwriting a target state.
              if timeout 90s env PGPASSWORD="$NEW_PGPASSWORD" tofu state pull > /work/destination.tfstate 2>/dev/null; then
                printf 'destination state already exists\n'
              else
                rm -f /work/destination.tfstate
                printf 'pushing state to empty destination\n'
                timeout 90s env PGPASSWORD="$NEW_PGPASSWORD" tofu state push /work/source.tfstate
                timeout 90s env PGPASSWORD="$NEW_PGPASSWORD" tofu state pull > /work/destination.tfstate
              fi
              printf 'verifying destination state\n'
              # OpenTofu may serialize equivalent state differently across
              # versions. Compare its resource-instance addresses instead of
              # serialized bytes; no state values are written to the log.
              timeout 90s env PGPASSWORD="$OLD_PGPASSWORD" tofu state list | LC_ALL=C sort > /work/source.resources
              timeout 90s env PGPASSWORD="$NEW_PGPASSWORD" tofu state list | LC_ALL=C sort > /work/destination.resources
              cmp -s /work/source.resources /work/destination.resources
              resource_count="$(wc -l < /work/destination.resources)"
              printf 'state transfer verified: %s resources\n' "$resource_count"
          env:
            - name: OLD_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  # Temporary migration-only access to the old shared database.
                  name: tofu-state-db-credentials
                  key: password
            - name: NEW_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tofu-state-forgejo-agentydragon-credentials
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: config
          configMap:
            name: forgejo-agentydragon-state-migration-config
        - name: work
          emptyDir:
            medium: Memory
