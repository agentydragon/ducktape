# Retained only for the state-transfer gate. Deletion after activation must not
# destroy SSH keys that the replacement root adopts from transferred state.
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: forgejo-agentydragon
  namespace: flux-system
spec:
  suspend: true
  destroyResourcesOnDeletion: false
  interval: 15m
  refreshBeforeApply: true
  path: ./tf/gitops/forgejo-agentydragon
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  serviceAccountName: tf-runner
  approvePlan: "auto"
  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "forgejo_agentydragon"
      }
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tofu-state-db-credentials
              key: password
