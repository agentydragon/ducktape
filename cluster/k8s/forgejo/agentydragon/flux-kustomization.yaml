apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-agentydragon
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/forgejo/agentydragon
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  # The replacement remains suspended through the state transfer and therefore
  # has no Ready condition yet. The old CR was suspended only after its last
  # successful reconciliation, so it is the temporary health gate. Activation
  # switches this back to the replacement before deleting the old CR.
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: forgejo-agentydragon
      namespace: flux-system
  dependsOn:
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
