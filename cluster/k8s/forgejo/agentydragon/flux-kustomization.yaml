apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-agentydragon
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/forgejo/agentydragon
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    # Wait for the Terraform apply (attaches user-level SSH keys to the existing
    # OIDC-created agentydragon account) so post-merge verification can use the
    # Ready condition before attempting git-over-SSH.
    namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: forgejo-agentydragon
      namespace: forgejo
  dependsOn:
    - name: forgejo # Forgejo API must be up (provider target)
      namespace: ducktape-flux
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
