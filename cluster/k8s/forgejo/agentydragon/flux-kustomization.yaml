apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-agentydragon
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/forgejo/agentydragon
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Wait for the Terraform apply (attaches user-level SSH keys to the existing
  # OIDC-created agentydragon account) so post-merge verification can use the
  # Ready condition before attempting git-over-SSH.
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: forgejo-agentydragon
      namespace: flux-system
  dependsOn:
    - name: forgejo # Forgejo API must be up (provider target)
    - name: tofu-controller
    - name: tofu-state-db
