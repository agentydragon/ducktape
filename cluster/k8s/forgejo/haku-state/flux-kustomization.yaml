apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-state
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: forgejo
      namespace: ducktape-flux
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
    - name: agentplane-index
      namespace: ducktape-flux
    - name: haku-namespace
      namespace: ducktape-flux
    - name: haku-console-namespace
      namespace: ducktape-flux
    - name: haku-egress-proxy-namespace
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: haku-state
      namespace: flux-system
  interval: 10m
  path: ./cluster/k8s/forgejo/haku-state
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: haku-state
    namespace: ducktape-flux
  timeout: 10m
  wait: true
