apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-state
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/forgejo/haku-state
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    # Wait for the Terraform apply (creates the Forgejo repo + service user + the
    # haku-forgejo-git Secret) so scan runs can depend on it.
    namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: haku-state
      namespace: flux-system
  dependsOn:
    - name: forgejo # Forgejo API must be up (provider target)
      namespace: ducktape-flux
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
    # The git-creds Secret lands in both target namespaces; wait for each to exist.
    - name: haku-namespace
      namespace: ducktape-flux
    - name: haku-console-namespace
      namespace: ducktape-flux
    - name: haku-egress-proxy-namespace
      namespace: ducktape-flux
    - name: agentplane-index-namespace
      namespace: ducktape-flux
