apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: forgejo-props
  namespace: flux-system
spec:
  interval: 15m
  refreshBeforeApply: true
  path: ./tf/gitops/forgejo-props
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  serviceAccountName: tf-runner
  # Generate the destroy plan, but require a separate Git-approved token before
  # deleting the Forgejo props user and its upstream registry credentials.
  destroy: true
  approvePlan: ""
  # Once the Terraform object is removed, destroy the external Forgejo resources
  # before allowing the controller to remove the object.
  destroyResourcesOnDeletion: true

  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "forgejo_props"
      }
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tofu-state-db-credentials
              key: password
