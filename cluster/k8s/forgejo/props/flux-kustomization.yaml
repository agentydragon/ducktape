apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-props
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/forgejo/props
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    # Wait for the Terraform apply (creates the Forgejo user + props secrets) so
    # the dependent `props` Kustomization only proceeds once they exist.
    namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: forgejo-props
      namespace: flux-system
  dependsOn:
    - name: forgejo # Forgejo API must be up (provider target)
      namespace: ducktape-flux
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
