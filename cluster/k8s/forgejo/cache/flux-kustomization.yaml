apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-cache
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: forgejo-cache
    namespace: ducktape-flux
  path: ./cluster/k8s/forgejo/cache
  prune: true
  wait: true
  dependsOn:
    - name: forgejo-namespace
      namespace: ducktape-flux
    - name: valkey
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
