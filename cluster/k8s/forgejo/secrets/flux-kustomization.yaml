apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-secrets
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/forgejo/secrets
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: forgejo-secrets

    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: forgejo-metrics-token
      namespace: forgejo
  dependsOn:
    - name: forgejo-namespace
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
