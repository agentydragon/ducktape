apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-git-health-monitor
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/forgejo/git-health-monitor
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: forgejo
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: monitoring-stack
      namespace: ducktape-flux
