apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: forgejo
  namespace: forgejo
spec:
  selector:
    matchLabels:
      # Helm release name; robust regardless of the chart's app name label.
      app.kubernetes.io/instance: forgejo
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      bearerTokenSecret:
        name: forgejo-metrics-token
        key: token
