apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: forgejo
  namespace: ducktape-flux
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: ducktape
      namespace: ducktape-flux
  artifacts:
    - name: forgejo
      originRevision: "@repo"
      copy:
        - from: "@repo/cluster/k8s/forgejo/app/**"
          to: "@artifact/cluster/k8s/forgejo/app/"
          exclude:
            - flux-kustomization.yaml
