# Forgejo metadata DB, SSD tier (OVH storage tiering, CNPG Case B — migration completed
# 2026-07-05). forgejo-db's instances happened to sit on the KS-GAME NVMe nodes, but its
# StorageClass was local-path-ovh (= hdd tier), so the Stage 2 CP reshuffle would have
# relocated it to a KS-5 HDD node. It was moved to the NVMe tier via the CNPG
# standalone-replica pattern (skills/cnpg_region_switch): a streaming replica of the old
# forgejo-db was bootstrapped here (pg_basebackup), promoted, and Forgejo repointed onto it.
# The source cluster has since been retired; the inert replica / externalClusters /
# pg_basebackup stanzas were dropped once the promotion was durable.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db-ssd
  namespace: forgejo
  annotations:
    description: Forgejo metadata DB on the SSD tier (physically cloned from the retired forgejo-db, Case B git-latency migration)
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    # One instance per KS-GAME node for HA (local-path-ovh-ssd pins the tier). No
    # off-control-plane anti-affinity: the SSD tier IS the KS-GAME boxes, which Stage 2
    # promotes to control-plane — this DB is meant to live there.
    topologyKey: kubernetes.io/hostname

  storage:
    storageClass: local-path-ovh-ssd
    size: 10Gi

  monitoring:
    enablePodMonitor: true

  # Application-user identity for CNPG's ongoing reconcile. NOT a re-initialization: CNPG
  # runs bootstrap exactly once, at cluster creation on empty PGDATA (this cluster was
  # actually created via pg_basebackup, see the header) — the running instances are never
  # re-init'd by this stanza. Its sole purpose is to tell CNPG the application role is
  # "forgejo" (this clone's owner) rather than CNPG's default "app": without it, the
  # instance-manager loops on `role "app" does not exist` because no "app" role was cloned.
  # CNPG keeps the forgejo role's password in sync with this Secret — a no-op, since the
  # Secret holds the value physically replicated from the source. Forgejo authenticates with
  # the same Secret via the chart's gitea.config.database.PASSWD. The -creds name deliberately
  # avoids CNPG's reserved <cluster>-app; see forgejo-db-ssd-creds.sops.yaml.
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      secret:
        name: forgejo-db-ssd-creds
