apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    description: Forgejo metadata DB on the SSD tier (physically cloned from the retired forgejo-db, Case B git-latency migration)
  name: forgejo-db-ssd
  namespace: forgejo
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
          weight: 100
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      secret:
        name: forgejo-db-ssd-creds
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  monitoring:
    enablePodMonitor: true
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 10Gi
    storageClass: local-path-ovh-ssd
