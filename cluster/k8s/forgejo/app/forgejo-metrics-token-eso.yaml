# ESO owns a stable Forgejo metrics bearer token. CreatedOnce avoids rotating
# the token without coordinating a Forgejo restart and Prometheus scrape cutover.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: forgejo-metrics-token
  namespace: forgejo
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-metrics-token
  namespace: forgejo
spec:
  refreshPolicy: CreatedOnce
  target:
    name: forgejo-metrics-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: forgejo-metrics-token
