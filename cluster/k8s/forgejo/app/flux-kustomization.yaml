apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: forgejo-namespace
      namespace: ducktape-flux
    - name: forgejo-db
      namespace: ducktape-flux
    - name: forgejo-cache
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: cert-manager
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: sso-providers-tf
      namespace: ducktape-flux
    - name: authentik
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: forgejo
      namespace: forgejo
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: forgejo
      namespace: forgejo
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: forgejo
      namespace: forgejo
  interval: 10m
  path: ./cluster/k8s/forgejo/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: forgejo
    namespace: ducktape-flux
  timeout: 5m
  wait: true
