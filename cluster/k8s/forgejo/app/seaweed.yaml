apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    description: Forgejo packages, LFS, attachments, and artifacts.
spec:
  name: forgejo
  # The physical bucket is already populated; adopt it instead of treating it
  # as a conflicting bucket during the Flux ownership handoff.
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  reclaimPolicy: Retain
  access:
    - user: forgejo
      actions: [Read, Write, List, Tagging]
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    description: Forgejo's SeaweedFS S3 credentials.
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  # The IAM username is cluster-global. Without a same-namespace S3Identity,
  # the operator treats this as the existing SeaweedFS identity named forgejo.
  identityRef:
    name: forgejo
  # Same-namespace targets are created and owned by S3Credentials.
  secretRef:
    name: forgejo-s3-credentials
    accessKeyField: accessKey
    secretKeyField: secretKey
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: forgejo
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: forgejo
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: forgejo
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
