---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: forgejo
  namespace: forgejo
spec:
  type: oci
  interval: 24h
  url: oci://code.forgejo.org/forgejo-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 15m
  timeout: 15m # Extended timeout (PostgreSQL + PVC binding + init containers)
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3 # Retry transient upgrade failures (e.g. slow S3 backend readiness) instead of going Stalled
  chart:
    spec:
      chart: forgejo
      version: "17.1.0"
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: forgejo
  valuesFrom:
    - kind: Secret
      name: forgejo-db-app
      valuesKey: password
      # The Forgejo chart is a fork of the Gitea chart and keeps the `gitea:` values key.
      targetPath: gitea.config.database.PASSWD
  values:
    # Global configuration
    global:
      imageRegistry: ""

    # HA: two replicas sharing the RWX git PVC (forgejo-git-rwx). Both pods mount
    # the same SeaweedFS volume concurrently (RWX multi-mount + cross-node git
    # lock/rename semantics verified 2026-06-28), so a rolling update is safe — the
    # old RWO Recreate-only deadlock (RollingUpdate + RWO = stuck init container)
    # no longer applies. Session lives in Postgres and cache/queue in the shared
    # valkey (../cache), so neither replica holds per-instance state.
    replicaCount: 2
    strategy:
      type: RollingUpdate

    # Pin to OVH kimsufi nodes: required by the seaweedfs-ovh CSI (OVH-only)
    # and co-located with the OVH-HA forgejo-db (cnpg_conventions R5).
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
    # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
    # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
      # Keep the two replicas on different hosts so a single node loss can't take
      # both down. Required (not preferred): with two off-CP workers they land one
      # each; if a worker is gone the second can still schedule elsewhere (the
      # off-CP rule above is only a soft preference), so this never blocks the
      # second replica — it only forbids co-location.
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: forgejo
                app.kubernetes.io/instance: forgejo
            topologyKey: kubernetes.io/hostname

    # Forgejo configuration (chart retains the legacy `gitea:` values key)
    gitea:
      admin:
        # Username and password from SOPS secret
        existingSecret: "forgejo-admin-password"
        email: "admin@allegedly.works"
        # Password set once on creation, never reset (SSO for normal use)
        passwordMode: initialOnlyNoReset

      # OAuth2 authentication sources
      oauth:
        - name: "authentik"
          provider: "openidConnect"
          existingSecret: "forgejo-oauth-client-secret"
          autoDiscoverUrl: "https://auth.allegedly.works/application/o/forgejo/.well-known/openid-configuration"
          iconUrl: "https://auth.allegedly.works/static/dist/assets/icons/icon.png"
          scopes: "email profile"
          # Map the Authentik `groups` claim (emitted by the default `profile`
          # scope mapping) to Forgejo site-admin: members of the `forgejo-admins`
          # Authentik group (tf/gitops/sso-providers/main.tf) are promoted to admin
          # on OIDC login, non-members demoted. The built-in local admin account is
          # unaffected (not an OAuth2 user). Takes effect on the user's next login.
          groupClaimName: "groups"
          adminGroup: "forgejo-admins"

      config:
        APP_NAME: "Forgejo: Beyond coding. We forge."
        RUN_MODE: prod

        server:
          DOMAIN: git.allegedly.works
          SSH_DOMAIN: git.allegedly.works
          ROOT_URL: https://git.allegedly.works
          HTTP_PORT: 3000
          SSH_PORT: 2222
          DISABLE_SSH: false
          START_SSH_SERVER: true
          LFS_START_SERVER: true

        # Session stays in Postgres (the CNPG forgejo-db is already HA), so it's
        # shared across replicas — no per-instance state. Cache + queue, however,
        # default to per-instance backends (memory / leveldb on the pod's PVC):
        # with >1 replica each instance would keep its own cache (stale reads) and,
        # worse, two leveldb queues on one shared volume would corrupt. Both move
        # to the shared, replicated forgejo-valkey-ovh (cluster/k8s/forgejo/cache)
        # so the deployment can scale to 2 replicas. (Switching the queue backend
        # abandons any in-flight leveldb queue items on the next restart — fine for
        # this instance's transient queues: webhook deliveries, mirror syncs.)
        session:
          PROVIDER: db

        cache:
          ENABLED: true
          ADAPTER: redis
          HOST: redis://forgejo-valkey-ovh-master.forgejo.svc.cluster.local:6379/0

        queue:
          TYPE: redis
          CONN_STR: redis://forgejo-valkey-ovh-master.forgejo.svc.cluster.local:6379/0

        # In-cluster CI (Forgejo Actions). Enables the server-side feature; a
        # registered act_runner (cluster/k8s/haku-ci) executes workflows. Used so
        # Haku can build its own UI image from haku-state source entirely
        # in-cluster — haku-state may hold private operator data, so its builds must
        # never go to BuildBuddy/RBE or any external CI. See haku/PLAN.md.
        actions:
          ENABLED: true

        metrics:
          ENABLED: true
          TOKEN: ""
          # TODO: Set a metrics token and add bearerTokenSecret to the ServiceMonitor
          # via a SOPS-managed secret (follow LiteLLM token pattern).

        security:
          INSTALL_LOCK: true
          SECRET_KEY: "change-this-secret-key-in-production"

        database:
          DB_TYPE: postgres
          HOST: forgejo-db-rw.forgejo:5432
          NAME: forgejo
          USER: forgejo

        oauth2_client:
          REGISTER_EMAIL_CONFIRM: false
          ENABLE_AUTO_REGISTRATION: true
          USERNAME: nickname
          UPDATE_AVATAR: true
          ACCOUNT_LINKING: login

        # Object storage on SeaweedFS S3: packages (container registry), LFS,
        # attachments, artifacts. Git repos stay on the seaweedfs-ovh PVC — git
        # needs a POSIX filesystem, so there's no S3 backend for repos. Creds
        # are injected via additionalConfigFromEnvs below.
        storage:
          STORAGE_TYPE: minio
          MINIO_ENDPOINT: seaweedfs-s3.seaweedfs.svc:8333
          MINIO_BUCKET: forgejo
          MINIO_LOCATION: us-east-1
          MINIO_USE_SSL: false
          MINIO_BUCKET_LOOKUP: path

      # SeaweedFS S3 credentials from the Reflector-mirrored s3-identity-forgejo
      # Secret (source in the seaweedfs namespace). FORGEJO__ is the chart's
      # env -> app.ini prefix.
      additionalConfigFromEnvs:
        - name: FORGEJO__storage__MINIO_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-identity-forgejo
              key: accessKey
        - name: FORGEJO__storage__MINIO_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-identity-forgejo
              key: secretKey

    # Trust cluster CA bundle (includes Let's Encrypt staging CA)
    deployment:
      # Reloader: auto-restart pods when secrets change
      annotations:
        reloader.stakater.com/auto: "true"
      env:
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/cluster-ca/ca-certificates.crt

    # Mount CA bundle (includes Let's Encrypt staging CA when in staging mode)
    extraVolumes:
      - name: cluster-ca
        configMap:
          name: cluster-internal-ca-bundle

    extraContainerVolumeMounts:
      - name: cluster-ca
        mountPath: /etc/ssl/certs/cluster-ca
        readOnly: true

    extraInitVolumeMounts:
      - name: cluster-ca
        mountPath: /etc/ssl/certs/cluster-ca
        readOnly: true

    # Service configuration
    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        type: ClusterIP
        port: 2222

    # Resources. Forgejo is a monolith: the web UI, API, git HTTP/SSH, the
    # container/package registry, AND the Actions coordinator all run in this one
    # process — so they share this CPU budget. The old 500m limit caused constant
    # CFS throttling under load (CI image pushes + the haku-ui app's reads + git
    # ops), making even trivial /api/v1/version take ~7s. Give it real headroom.
    resources:
      limits:
        cpu: "4"
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 512Mi

    # Persistence
    # Repos + LFS/packages/attachments/artifacts all live here, on SeaweedFS via
    # the seaweedfs-ovh CSI (object-backed; git needs a POSIX FS, so no S3 backend).
    persistence:
      enabled: true
      # Mount our pre-provisioned RWX claim (git-storage-pvc.yaml) instead of the
      # chart's default RWO gitea-shared-storage. This chart has no `existingClaim`:
      # it mounts whatever `claimName` points at and only creates the PVC itself when
      # `create: true`. So create:false + claimName makes it adopt our externally
      # managed PVC and create nothing. accessModes are immutable, so HA needed a
      # fresh claim — existing git data was copied old->new during the 2026-06-28
      # migration cutover. (The old gitea-shared-storage PVC has the chart's
      # helm.sh/resource-policy:keep annotation, so it survives as a rollback.)
      create: false
      # git repos on the SeaweedFS SSD tier (Phase 3, ovh_storage_tiering.md). Migrated
      # from forgejo-git-rwx (HDD) via VolSync rsync-TLS; read-zero-downtime rolling repoint.
      claimName: forgejo-git-rwx-ssd
      # The chart refuses replicaCount > 1 unless accessModes[0] is ReadWriteMany
      # (a guard against a single-writer FS under multiple replicas). create:false
      # means the chart won't actually create a PVC from this — our git-storage-pvc.yaml
      # owns the real RWX claim — but the assertion still reads this value.
      accessModes:
        - ReadWriteMany

    # PostgreSQL: external CNPG cluster (forgejo-db)
    postgresql:
      enabled: false

    postgresql-ha:
      enabled: false

    # Redis (disabled)
    redis-cluster:
      enabled: false

    # Valkey (disabled — using db sessions, memory cache, level queues)
    valkey-cluster:
      enabled: false

    # Memcached (disabled)
    memcached:
      enabled: false

    # Service account
    serviceAccount:
      create: true
