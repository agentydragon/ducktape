apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpap-data
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: forgejo
      namespace: ducktape-flux
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
    - name: cpap-sync
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: cpap-data
      namespace: flux-system
  interval: 10m
  path: ./cluster/k8s/forgejo/cpap-data
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: cpap-data
    namespace: ducktape-flux
  timeout: 10m
  wait: true
