apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-codex
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/forgejo/codex
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Wait for the Terraform apply (creates the codex Forgejo user + SSH key,
  # adopts ducktape/gaffer-private, adds collaboration + branch protection).
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: forgejo-codex
      namespace: flux-system
  dependsOn:
    - name: forgejo # Forgejo API must be up (provider target)
    - name: tofu-controller
    - name: tofu-state-db
