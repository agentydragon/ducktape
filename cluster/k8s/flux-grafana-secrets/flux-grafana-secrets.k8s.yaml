apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: flux-system
spec:
  client:
    useKubeAuth: true
  external:
    tenantNamespace: flux-system
    url: http://grafana-service.monitoring.svc.cluster.local:3000
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: flux-notifications
  namespace: flux-system
spec:
  instanceName: grafana
  role: Editor
  tokens:
    - name: flux-token
      secretName: grafana-flux-token
