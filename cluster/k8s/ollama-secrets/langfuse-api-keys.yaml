# Langfuse API keys for LiteLLM integration.
# Keys are generated by the langfuse-secrets Terraform module and stored at
# kv/langfuse/secrets in Vault. Langfuse bootstraps with the same keys via
# LANGFUSE_INIT_PROJECT_* env vars, so no manual step is required.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-api-keys
  namespace: ollama
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: langfuse-api-keys
    creationPolicy: Owner
  data:
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: kv/langfuse/secrets
        property: project_public_key
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: kv/langfuse/secrets
        property: project_secret_key
