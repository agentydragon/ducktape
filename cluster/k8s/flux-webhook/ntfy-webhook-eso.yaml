apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-webhook
  namespace: flux-system
  annotations:
    description: Flux failure notifications delivered through the self-hosted ntfy instance
    ntfy.ducktape.io/auth-generation: "1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: kubernetes-ntfy-secret-store
    kind: ClusterSecretStore
  target:
    name: ntfy-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        address: https://ntfy.allegedly.works/alerts
        # ntfy fills the X-Title/X-Message placeholders from Flux's webhook payload
        # (Template: yes). They are Go raw strings here so ESO's own template engine emits
        # them untouched instead of failing on the missing `involvedObject` key.
        headers: |
          Template: "yes"
          Authorization: "Bearer {{ .alertmanager_token }}"
          X-Title: "{{ `{{.involvedObject.kind}} {{.involvedObject.name}}` }}"
          X-Message: "{{ `{{.severity}}: {{.reason}} - {{.message}}` }}"
          X-Tags: "rotating_light"
  data:
    - secretKey: alertmanager_token
      remoteRef:
        key: ntfy-credentials
        property: alertmanager-token
