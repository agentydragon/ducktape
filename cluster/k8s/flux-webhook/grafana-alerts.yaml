---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: grafana
  namespace: flux-system
spec:
  type: grafana
  # notification-controller ≥1.7 sends the request to `address` as-is
  # (no auto-append of /api/annotations like older versions did), so the
  # full endpoint path is required here.
  address: https://grafana.allegedly.works/api/annotations
  secretRef:
    name: grafana-flux-token
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: grafana-annotations
  namespace: flux-system
spec:
  providerRef:
    name: grafana
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
