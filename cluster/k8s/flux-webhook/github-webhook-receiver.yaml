---
# Flux Receiver: GitHub webhooks → immediate reconciliation
#
# Handles two event types on a single URL (webhookPath is stable across events):
#   push            → reconcile flux-system GitRepository (eliminates 1-min poll lag)
#   registry_package → reconcile all GHCR ImageRepositories (eliminates 5-min poll lag)
#
# Both event types trigger reconciliation of all listed resources, which is harmless:
# an ImageRepository scan on a git push is a no-op, and a GitRepository reconciliation
# on an image push is a no-op.
#
# The GitHub webhook is auto-configured by terraform/gitops/flux-webhook-token
# (github_repository_webhook with events = ["push", "registry_package"]).
#
# Requirement for registry_package: each GHCR package must be linked to the
# ducktape repo in GitHub for the event to fire on this repo-level webhook.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: github
  namespace: flux-system
spec:
  type: github
  events:
    - push
    - registry_package
  secretRef:
    name: github-webhook-token
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: flux-system
      namespace: flux-system
    # Public Flux control objects retain a dedicated sparse checkout. Reconcile
    # it immediately on a Ducktape push rather than waiting for its poll.
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: ducktape
      namespace: ducktape-flux
    - apiVersion: image.toolkit.fluxcd.io/v1beta2
      kind: ImageRepository
      name: haku-openclaw-spike
    - apiVersion: image.toolkit.fluxcd.io/v1beta2
      kind: ImageRepository
      name: openclaw
