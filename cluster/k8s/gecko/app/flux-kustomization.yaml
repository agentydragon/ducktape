apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gecko
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  path: ./cluster/k8s/gecko/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: gecko-namespace
    - name: kubevirt
    - name: cdi
    - name: external-secrets-operator
    - name: seaweedfs-public-s3
    - name: local-path-provisioner
  wait: true
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: gecko-vm-images-s3-reader
      namespace: gecko
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      name: gecko-root
      namespace: gecko
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      name: gecko
      namespace: gecko
