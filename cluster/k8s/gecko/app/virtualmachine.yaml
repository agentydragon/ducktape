apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: gecko
  namespace: gecko
  labels:
    app.kubernetes.io/name: gecko
spec:
  runStrategy: Always
  # Own the root-disk DataVolume so KubeVirt sequences import -> boot (it won't
  # start virt-launcher until the import Succeeds, so the importer is the sole
  # consumer during import). immediate.requested:true makes CDI provision the
  # PVC up front rather than playing the WaitForFirstConsumer consumer-wait,
  # which deadlocks/races against the scheduler on local-path-ovh (a WFFC
  # storageclass) — see cluster/docs/lessons_learned and plan.md Next Actions.
  dataVolumeTemplates:
    - metadata:
        name: gecko-root
        annotations:
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"
      spec:
        source:
          s3:
            url: "https://s3.allegedly.works/vm-images/bootstrap/da37375538eb7da442add719d65dce838df2603b.qcow2"
            secretRef: gecko-vm-images-s3-reader
        pvc:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
          storageClassName: local-path-ovh
          volumeMode: Filesystem
  template:
    metadata:
      labels:
        kubevirt.io/domain: gecko
        app.kubernetes.io/name: gecko
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hil
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 2Gi
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: gecko-root
