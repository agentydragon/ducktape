apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: gecko-root
  namespace: gecko
  labels:
    app.kubernetes.io/name: gecko
  annotations:
    cdi.kubevirt.io/storage.bind.immediate.requested: "false"
spec:
  source:
    s3:
      url: "https://s3.allegedly.works/vm-images/bootstrap/da37375538eb7da442add719d65dce838df2603b.qcow2"
      secretRef: gecko-vm-images-s3-reader
  pvc:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
    storageClassName: local-path-ovh
    volumeMode: Filesystem
