apiVersion: v1
kind: ServiceAccount
metadata:
  name: gecko-secret-reader
  namespace: gecko
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gecko-vm-images-s3-reader
  namespace: seaweedfs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vm-images-s3-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gecko-vm-images-s3-reader
  namespace: seaweedfs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gecko-vm-images-s3-reader
subjects:
  - kind: ServiceAccount
    name: gecko-secret-reader
    namespace: gecko
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gecko-vm-images
  namespace: gecko
spec:
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: gecko-secret-reader
          namespace: gecko
      remoteNamespace: seaweedfs
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gecko-vm-images-s3-reader
  namespace: gecko
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gecko-vm-images
  target:
    name: gecko-vm-images-s3-reader
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: vm-images-s3-credentials
        property: cdiReaderAccessKey
    - secretKey: secretKey
      remoteRef:
        key: vm-images-s3-credentials
        property: cdiReaderSecretKey
