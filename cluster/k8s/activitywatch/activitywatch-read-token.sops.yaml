# Read-only bearer for the central ActivityWatch read route. The bearer-proxy
# sidecar (5603) checks it; the emberstack reflector mirrors this Secret into
# haku-console so its colocated egress fence can substitute it for the Haku
# sandbox's placeholder. Distinct from
# the write token so read and write are separate credentials -- and unlike the write
# token, no desktop reads it, so it is encrypted only to Flux (cluster-secrets) +
# admin via the generic cluster/k8s rule. Rotate by re-minting and re-encrypting.
#
# CLEANUP(added 2026-09-24): drop haku-egress-proxy from the reflection
#   annotations and the description below at the next re-encrypt; nothing there
#   reads the reflected copy. The document MAC covers annotation values, so they
#   cannot be edited without the cluster age key.
apiVersion: v1
kind: Secret
metadata:
    name: activitywatch-read-token
    namespace: activitywatch
    annotations:
        description: Read-only ActivityWatch bearer; checked by the bearer-proxy read route (5603) and mirrored to haku-console plus haku-egress-proxy for egress placeholder substitution.
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: haku-egress-proxy,haku-console
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: haku-egress-proxy,haku-console
type: Opaque
