apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # cdk8s-generated (cluster/cdk8s/activitywatch/app.py).
  - activitywatch.k8s.yaml
  - activitywatch-write-token.sops.yaml
  - activitywatch-read-token.sops.yaml
components:
  - ./image-pins

configMapGenerator:
  - name: activitywatch-readonly-proxy
    namespace: activitywatch
    files:
      - default.conf=readonly-proxy.conf
  - name: activitywatch-bearer-proxy
    namespace: activitywatch
    files:
      - default.conf.template=bearer-proxy.conf.template
