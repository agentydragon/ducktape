apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - syncthing-deployment.yaml
  - importer-cronjob.yaml
  - pvc.yaml
  - service.yaml
  - cilium-network-policy.yaml
  - syncthing-identity.yaml
  - syncthing-key.sops.yaml

configMapGenerator:
  - name: activitywatch-readonly-proxy
    namespace: activitywatch
    files:
      - default.conf=readonly-proxy.conf
  - name: activitywatch-syncthing-config
    namespace: activitywatch
    files:
      - config.xml=syncthing-config.xml
