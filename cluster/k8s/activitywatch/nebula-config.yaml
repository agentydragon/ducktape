apiVersion: v1
kind: ConfigMap
metadata:
  name: activitywatch-nebula-config
  namespace: activitywatch
data:
  config.yaml: |
    pki:
      ca: /etc/nebula/ca.crt
      cert: /etc/nebula/host.crt
      key: /etc/nebula/host.key
    static_host_map:
      "10.42.0.1":
        - "5.78.106.249:4242"
      "10.42.0.2":
        - "5.78.43.147:4242"
    lighthouse:
      am_lighthouse: false
      interval: 10
      hosts:
        - "10.42.0.1"
        - "10.42.0.2"
    relay:
      relays:
        - "10.42.0.1"
        - "10.42.0.2"
      use_relays: true
    listen:
      host: "0.0.0.0"
      port: 4242
    punchy:
      punch: true
      respond: true
    logging:
      level: info
      format: json
    timers:
      connection_alive_interval: 5
      pending_deletion_interval: 10
    tun:
      dev: nebula1
    firewall:
      outbound:
        - port: any
          proto: any
          host: any
      inbound:
        - port: any
          proto: any
          host: any
