apiVersion: apps/v1
kind: Deployment
metadata:
  name: activitywatch-syncthing
  namespace: activitywatch
  labels:
    app.kubernetes.io/name: activitywatch-syncthing
  annotations:
    description: OVH Syncthing receiver for ActivityWatch aw-sync databases from user devices.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: activitywatch-syncthing
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activitywatch-syncthing
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      nodeSelector:
        topology.kubernetes.io/region: hil-ovh
      containers:
        - name: syncthing
          image: syncthing/syncthing:2.0.10
          command:
            - /bin/sh
            - /scripts/syncthing-entrypoint.sh
          ports:
            - containerPort: 22000
              name: sync-tcp
              protocol: TCP
            - containerPort: 21027
              name: discovery
              protocol: UDP
          volumeMounts:
            - name: sync-inbox
              mountPath: /sync-inbox
            - name: identity
              mountPath: /identity
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: state
              mountPath: /var/syncthing
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: sync-inbox
          persistentVolumeClaim:
            claimName: activitywatch-sync-inbox
        - name: identity
          projected:
            sources:
              - configMap:
                  name: activitywatch-syncthing-identity
                  items:
                    - key: cert.pem
                      path: cert.pem
                    - key: device_id
                      path: device_id
              - secret:
                  name: activitywatch-syncthing-key
                  items:
                    - key: key.pem
                      path: key.pem
        - name: scripts
          configMap:
            name: activitywatch-syncthing-scripts
        - name: state
          emptyDir: {}
