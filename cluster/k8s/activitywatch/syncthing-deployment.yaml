apiVersion: apps/v1
kind: Deployment
metadata:
  name: activitywatch-syncthing
  namespace: activitywatch
  labels:
    app.kubernetes.io/name: activitywatch-syncthing
  annotations:
    description: OVH Syncthing receiver for ActivityWatch aw-sync databases from user devices.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: activitywatch-syncthing
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activitywatch-syncthing
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      nodeSelector:
        topology.kubernetes.io/region: hil-ovh
      initContainers:
        - name: stage-syncthing-config
          image: busybox:1.37
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /var/syncthing/config /var/syncthing/data
              cp /syncthing-config/config.xml /var/syncthing/config/config.xml
              chown -R 1000:1000 /var/syncthing
              chmod 0600 /var/syncthing/config/config.xml
          volumeMounts:
            - name: syncthing-config
              mountPath: /syncthing-config
              readOnly: true
            - name: state
              mountPath: /var/syncthing
      containers:
        - name: syncthing
          image: syncthing/syncthing:2.0.10
          command:
            - syncthing
            - --config
            - /var/syncthing/config
            - --data
            - /var/syncthing/data
            - serve
            - --no-browser
            - --no-upgrade
          ports:
            - containerPort: 22000
              name: sync-tcp
              protocol: TCP
            - containerPort: 21027
              name: discovery
              protocol: UDP
          volumeMounts:
            - name: sync-inbox
              mountPath: /sync-inbox
            - name: state
              mountPath: /var/syncthing
            - name: identity
              mountPath: /var/syncthing/config/cert.pem
              subPath: cert.pem
              readOnly: true
            - name: identity
              mountPath: /var/syncthing/config/key.pem
              subPath: key.pem
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
        - name: importer
          image: ghcr.io/agentydragon/aw-server:devel-20260706074016-af5147d # {"$imagepolicy": "flux-system:activitywatch"}
          command:
            - /usr/local/bin/aw-sync
            - --host
            - activitywatch-write.activitywatch.svc.cluster.local
            - --port
            - "5600"
            - --sync-dir
            - /sync-inbox
            - daemon
          volumeMounts:
            - name: sync-inbox
              mountPath: /sync-inbox
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: sync-inbox
          persistentVolumeClaim:
            claimName: activitywatch-sync-inbox
        - name: identity
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: activitywatch-syncthing-identity
                  items:
                    - key: cert.pem
                      path: cert.pem
              - secret:
                  name: activitywatch-syncthing-key
                  items:
                    - key: key.pem
                      path: key.pem
        - name: syncthing-config
          configMap:
            name: activitywatch-syncthing-config
        - name: state
          emptyDir: {}
