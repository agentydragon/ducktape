apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: activitywatch
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/activitywatch
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: activitywatch
    namespace: ducktape-flux
  timeout: 5m
  wait: true
