apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: sso-providers-tf
  namespace: ducktape-flux
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: ducktape
      namespace: ducktape-flux
  artifacts:
    - name: sso-providers-tf
      originRevision: "@repo"
      copy:
        - from: "@repo/cluster/k8s/authentik/sso-providers-tf/**"
          to: "@artifact/cluster/k8s/authentik/sso-providers-tf/"
          exclude:
            - flux-kustomization.yaml
