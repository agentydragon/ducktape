apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-servicemonitor
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/authentik/servicemonitor
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: authentik-servicemonitor

    namespace: ducktape-flux
  dependsOn:
    - name: authentik
      namespace: ducktape-flux
    - name: monitoring-stack
      namespace: ducktape-flux
