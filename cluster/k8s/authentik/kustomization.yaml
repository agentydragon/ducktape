apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - authentik-host-configmap.yaml
  - token-secret.yaml
  - httproute.yaml
  - networkpolicy.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: authentik-sso-blueprints
    files:
      - blueprints/users.yaml
      - blueprints/gitea-sso.yaml
      - blueprints/grafana-sso.yaml
      - blueprints/harbor-sso.yaml
      - blueprints/matrix-sso.yaml
      - blueprints/vault-sso.yaml
      - blueprints/inventree-sso.yaml
      - blueprints/loki-sso.yaml
      - blueprints/hubble-sso.yaml
      - blueprints/openclaw-sso.yaml
      - blueprints/alloy-otlp-sso.yaml
      - blueprints/gatus-sso.yaml
      - blueprints/kagent-sso.yaml
      - blueprints/headlamp-sso.yaml
      - blueprints/grocy-sso.yaml
      - blueprints/oauth-broker-sso.yaml
      - blueprints/filebrowser-sso.yaml
      - blueprints/headscale-sso.yaml
      - blueprints/openclaw-mitmproxy-sso.yaml
      - blueprints/proxmox-sso.yaml
      - blueprints/shared-proxy-outpost.yaml
      - blueprints/openclaw-agent-oauth2.yaml
    namespace: authentik
