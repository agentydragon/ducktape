# HTTPRoute for Tandoor via shared Authentik proxy outpost.
# Traffic flows: Gateway -> outpost (auth) -> tandoor backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tandoor
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "tandoor.allegedly.works"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
