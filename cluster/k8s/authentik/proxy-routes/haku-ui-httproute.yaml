# HTTPRoute for the agent-authored Haku UI via the shared Authentik proxy outpost.
# Traffic flows: Gateway -> outpost (auth, agentydragon-only) -> haku-ui backend
# (Service haku-ui in haku-sandbox, via the provider's internal_host).
# Operator-owned by construction: Kyverno forbids Haku creating routes in
# haku-sandbox, so this authentik-namespace route is the only public path to haku-ui.
# Security model: haku/docs/security.md (enforcement inventory #9; the CSP below
# closes the browser-side exfiltration channel).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: haku-ui
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "haku-ui.allegedly.works"
  rules:
    # /jupyter/* — the Lab workbench haku-ui reverse-proxies — carries ONE relaxation
    # over the strict SPA policy below: script-src gains 'unsafe-eval', because
    # JupyterLab's settings registry compiles JSON-schema validators with
    # `new Function` (ajv codegen); without it settings-dependent plugins fail
    # activation and Lab white-screens (observed 2026-08-01: "EvalError: ...
    # 'unsafe-eval' is not an allowed source of script: script-src 'self'").
    # Scope rationale: Jupyter is the arbitrary-code workbench by design
    # (operator-only behind Authentik) — eval in its pages adds nothing an open
    # kernel doesn't already grant, and the no-eval policy stays on the SPA routes.
    # worker-src blob: (Lab spawns blob: workers), img-src blob: (widget/canvas
    # outputs), and an explicit wss: connect entry (older Safari doesn't fold wss
    # into 'self') are included to avoid death-by-a-thousand-refreshes; the sidecar
    # sets the same frame-ancestors list (jupyter/jupyter_server_config.py in
    # haku-state) — this `set` overrides it at the edge, so keep them in sync.
    # Gateway API precedence: longest PathPrefix wins, so this rule takes /jupyter/*
    # and the catch-all below keeps everything else regardless of rule order.
    - matches:
        - path:
            type: PathPrefix
            value: /jupyter/
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Content-Security-Policy
                value: >-
                  default-src 'self'; script-src 'self' 'unsafe-eval';
                  style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;
                  font-src 'self' data:; connect-src 'self' wss://haku-ui.allegedly.works;
                  worker-src 'self' blob:; form-action 'self';
                  frame-ancestors 'self' https://haku.allegedly.works;
                  base-uri 'none'; object-src 'none'; webrtc 'block'
      backendRefs:
        - name: authentik-server
          port: 80
    # Inject a strict CSP on every haku-ui response, from OUTSIDE Haku's write scope.
    # haku-ui's code is Haku-authored (adversarial under prompt injection); without this,
    # its JS in the operator's browser could silently beacon personal data to third
    # parties (fetch / <img> / sendBeacon) — subresource loads obey the DOCUMENT's own
    # CSP, not the embedding console's (whose frame-src only fences navigations). This
    # route is haku-ui's only public door and `set` overrides anything the backend
    # sends, so the header is operator-enforced. Policy notes: 'unsafe-inline' style is
    # for Mantine's injected <style> tags; everything the SPA legitimately loads is
    # self-hosted (widen img-src by proxying, never by allowlisting third-party hosts);
    # frame-ancestors permits only the trusted console (and self, for direct visits);
    # `webrtc 'block'` is CSP3 future-proofing only — no current browser enforces it
    # (Chromium 141 logs "Unrecognized Content-Security-Policy directive 'webrtc'";
    # Firefox/Safari never shipped it), so the WebRTC channel is an accepted residual.
    # See haku/docs/security.md § Browser-side exfiltration + § Known gaps.
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Content-Security-Policy
                value: >-
                  default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
                  img-src 'self' data:; font-src 'self' data:; connect-src 'self';
                  form-action 'self'; frame-ancestors 'self' https://haku.allegedly.works;
                  base-uri 'none'; object-src 'none'; webrtc 'block'
      backendRefs:
        - name: authentik-server
          port: 80
