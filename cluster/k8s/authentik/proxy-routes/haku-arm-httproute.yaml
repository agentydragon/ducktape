# HTTPRoute for the Haku arm via the shared Authentik proxy outpost.
# Traffic flows: Gateway -> outpost (auth, agentydragon-only) -> haku-arm backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: haku-arm
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "haku-arm.allegedly.works"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
