# HTTPRoute for the public-coder-agent OpenClaw instance via the shared
# Authentik proxy outpost. Traffic flows: Gateway -> outpost (auth) -> agent.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-coder-agent
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "public-coder-agent.allegedly.works"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
      timeouts:
        request: "600s"
        backendRequest: "600s"
