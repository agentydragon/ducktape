apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: haku-ui
  namespace: authentik
spec:
  hostnames:
    - haku-ui.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
      filters:
        - responseHeaderModifier:
            set:
              - name: Content-Security-Policy
                value: "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://haku-ui.allegedly.works; worker-src 'self' blob:; form-action 'self'; frame-ancestors 'self' https://haku.allegedly.works; base-uri 'none'; object-src 'none'; webrtc 'block'"
          type: ResponseHeaderModifier
