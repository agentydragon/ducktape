# HTTPRoute for CLIProxyAPI's built-in management UI/API via the shared Authentik proxy
# outpost. Traffic flows: Gateway -> outpost (auth) -> cli-proxy-api. Pure gatekeeper —
# CLIProxyAPI has no notion of Authentik identity headers, so Authentik here only blocks
# unauthenticated access before the app's own management-key auth runs underneath (see
# cluster/k8s/cli-proxy-api/README.md "Remote recovery"). The existing
# cli-proxy-api.allegedly.works hostname (cli-proxy-api/httproute.yaml) is untouched and
# keeps routing /v1 straight to the backend, unauthenticated, for LiteLLM's model traffic.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cli-proxy-api-admin
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "cli-proxy-api-admin.allegedly.works"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
