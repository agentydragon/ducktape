# HTTPRoute for OpenClaw mitmproxy traffic viewer via shared Authentik proxy outpost.
# Traffic flows: Gateway → outpost (admin-only auth) → mitmproxy mitmweb backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agents-mitmproxy
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "agents-mitmproxy.allegedly.works"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
