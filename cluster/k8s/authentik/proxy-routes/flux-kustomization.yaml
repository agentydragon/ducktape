apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-proxy-routes
  namespace: ducktape-flux
spec:
  interval: 10m
  sourceRef:
    kind: ExternalArtifact
    name: authentik-proxy-routes

    namespace: ducktape-flux
  path: ./cluster/k8s/authentik/proxy-routes
  prune: true
  dependsOn:
    - name: gateway
      namespace: ducktape-flux
    - name: authentik
      namespace: ducktape-flux
