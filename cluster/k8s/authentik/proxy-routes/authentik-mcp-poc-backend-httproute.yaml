# HTTPRoute for the authentik-mcp-poc whoami backend, via the shared
# embedded Authentik proxy outpost. Traffic: Gateway → outpost (auth) →
# authentik-mcp-poc-backend.authentik-mcp-poc.svc:8080.
#
# The proxy provider (created by cluster/terraform/gitops/authentik-mcp-poc)
# has `jwt_federation_providers` pointing at the authentik-mcp-poc OAuth2
# provider, so the outpost accepts Bearer JWTs minted by the MCP server's
# OIDCProxy upstream.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-mcp-poc-backend
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "authentik-mcp-poc-backend.allegedly.works"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
