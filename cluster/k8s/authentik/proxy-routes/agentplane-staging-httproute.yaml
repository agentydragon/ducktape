# Agentplane staging via the shared Authentik proxy outpost: Gateway -> outpost
# (auth, agentydragon-only) -> agentplane-app in agentplane-staging, the
# provider's internal_host. The session stream is SSE, so the route's timeouts
# are long enough for a tab to stay attached.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentplane-staging
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "agentplane-staging.allegedly.works"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
      timeouts:
        request: "3600s"
        backendRequest: "3600s"
