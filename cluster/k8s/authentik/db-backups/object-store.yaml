apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: authentik-db-ovh
  namespace: authentik
  annotations:
    description: SeaweedFS S3 destination for Authentik CNPG base backups and WAL.
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://authentik-db-backups/
    endpointURL: http://seaweedfs-s3.seaweedfs.svc:8333
    s3Credentials:
      accessKeyId:
        name: authentik-db-backup-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: authentik-db-backup-s3
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
