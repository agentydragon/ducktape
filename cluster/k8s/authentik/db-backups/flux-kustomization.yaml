apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-db-backups
  namespace: ducktape-flux
  annotations:
    description: Creates the Authentik CNPG backup schedule and one-time pre-upgrade backup.
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./cluster/k8s/authentik/db-backups
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: authentik-db-backups
    namespace: ducktape-flux
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: authentik-db-backups
      namespace: authentik
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Identity
      name: authentik-db-backups
      namespace: authentik
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: authentik-db-backups
      namespace: authentik
    - apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      name: authentik-db-ovh
      namespace: authentik
  # Report the one-off baseline backup through this Kustomization, but do not
  # make Authentik availability depend on backup completion.
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Backup
      current: has(status.phase) && status.phase == 'completed'
      failed: has(status.phase) && status.phase == 'failed'
  dependsOn:
    - name: authentik-db
      namespace: ducktape-flux
    - name: cnpg-barman-cloud
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
    - name: authentik-namespace
      namespace: ducktape-flux
