apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Creates the Authentik CNPG backup schedule and its SeaweedFS storage.
  name: authentik-db-backups
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: authentik-db
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
    - name: authentik-namespace
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: authentik-db-backups
      namespace: authentik
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Identity
      name: authentik-db-backups
      namespace: authentik
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: authentik-db-backups
      namespace: authentik
    - apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      name: authentik-db-ovh
      namespace: authentik
  interval: 10m
  path: ./cluster/k8s/authentik/db-backups
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: authentik-db-backups
    namespace: ducktape-flux
  timeout: 15m
  wait: true
