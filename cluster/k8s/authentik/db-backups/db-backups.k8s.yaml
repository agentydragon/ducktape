apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  annotations:
    description: Dedicated SeaweedFS identity for Authentik CNPG backups.
  name: authentik-db-backups
  namespace: authentik
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: authentik-db-backups
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: S3Identity
      namespace: authentik
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: authentik
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: authentik
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: authentik-db-backups
  namespace: authentik
spec:
  identityRef:
    name: authentik-db-backups
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: authentik-db-backup-s3
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for Authentik.
  name: authentik-db-backups
  namespace: authentik
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: authentik-db-backups
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: authentik-db-backups
  reclaimPolicy: Retain
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  annotations:
    description: SeaweedFS S3 destination for Authentik CNPG base backups and WAL.
  name: authentik-db-ovh
  namespace: authentik
spec:
  configuration:
    data:
      compression: gzip
    destinationPath: s3://authentik-db-backups/
    endpointURL: http://seaweedfs-s3.seaweedfs.svc:8333
    s3Credentials:
      accessKeyId:
        key: AWS_ACCESS_KEY_ID
        name: authentik-db-backup-s3
      secretAccessKey:
        key: AWS_SECRET_ACCESS_KEY
        name: authentik-db-backup-s3
    wal:
      compression: gzip
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  annotations:
    description: Daily physical Authentik database backup; WAL archiving provides continuous recovery points.
  name: authentik-db-ovh-daily
  namespace: authentik
spec:
  backupOwnerReference: self
  cluster:
    name: authentik-db-ovh
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 0 2 * * *
