apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-db-ovh-daily
  namespace: authentik
  annotations:
    description: Daily physical Authentik database backup; WAL archiving provides continuous recovery points.
spec:
  # Six-field cron with seconds; run daily at 02:00 UTC.
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: authentik-db-ovh
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
