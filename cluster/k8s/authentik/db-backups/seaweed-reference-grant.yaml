# Permit only the Authentik backup resources to reference the Seaweed cluster.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: authentik-db-backups
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: S3Identity
      namespace: authentik
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: authentik
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: authentik
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
