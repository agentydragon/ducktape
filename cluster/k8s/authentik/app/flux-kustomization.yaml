apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: authentik-namespace
      namespace: ducktape-flux
    - name: authentik-db
      namespace: ducktape-flux
    - name: cert-manager
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: authentik
      namespace: authentik
    - apiVersion: apps/v1
      kind: Deployment
      name: authentik-server
      namespace: authentik
    - apiVersion: apps/v1
      kind: Deployment
      name: authentik-worker
      namespace: authentik
  interval: 10m0s
  path: ./cluster/k8s/authentik/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: authentik
    namespace: ducktape-flux
  timeout: 10m0s
  wait: true
