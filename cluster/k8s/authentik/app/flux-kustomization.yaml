apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m0s
  path: ./cluster/k8s/authentik/app
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 10m0s
  wait: true
  # Health checks ensure Authentik is fully operational before dependents start
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: authentik
      namespace: authentik
    - apiVersion: apps/v1
      kind: Deployment
      name: authentik-server
      namespace: authentik
    - apiVersion: apps/v1
      kind: Deployment
      name: authentik-worker
      namespace: authentik
  dependsOn:
    - name: authentik-namespace
      namespace: ducktape-flux
    - name: authentik-db # Wait for CNPG cluster ready and authentik-db-app secret to exist
    - name: authentik-secrets # Admin password, secret key, bootstrap token (SOPS)
      namespace: ducktape-flux
    - name: authentik-sso-secrets # Supporting identity and Google OAuth inputs
      namespace: ducktape-flux
    - name: cert-manager # Wait for cert-manager for TLS certificates
      namespace: ducktape-flux
    - name: gateway # Wait for Gateway API for external access
