apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - authentik-host-configmap.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - podmonitor.yaml
  - admin-password.sops.yaml
  - secret-key.sops.yaml
  - bootstrap-token.sops.yaml
  - user-password.sops.yaml
  - google-oauth.sops.yaml
  - auragon-google-email.sops.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: authentik-sso-blueprints
    files:
      - blueprints/users.yaml
      - blueprints/hubble-sso.yaml
      - blueprints/public-coder-agent-sso.yaml
      - blueprints/haku-openclaw-spike-sso.yaml
      - blueprints/agents-mitmproxy-sso.yaml
      - blueprints/proxmox-sso.yaml
      - blueprints/goldilocks-sso.yaml
      - blueprints/google-workspace-mcp-sso-retire.yaml
      - blueprints/plaid-link-sso.yaml
      - blueprints/embedded-outpost.yaml
      - blueprints/airlock-sso-retire.yaml
      - blueprints/sdr-sso.yaml
      - blueprints/adsb-sso.yaml
      - blueprints/claude-service-account.yaml
      - blueprints/fava-sso-retire.yaml
      - blueprints/activitywatch-sso.yaml
      - blueprints/haku-ui-sso.yaml
    namespace: authentik
