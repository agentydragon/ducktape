apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - authentik-host-configmap.yaml
  - token-secret.yaml
  - httproute.yaml
  - networkpolicy.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: authentik-sso-blueprints
    files:
      - blueprints/users.yaml
      - blueprints/hubble-sso.yaml
      - blueprints/openclaw-sso.yaml
      - blueprints/tandoor-sso.yaml
      - blueprints/filebrowser-sso.yaml
      - blueprints/agents-mitmproxy-sso.yaml
      - blueprints/proxmox-sso.yaml
      - blueprints/goldilocks-sso.yaml
      - blueprints/google-workspace-mcp-sso.yaml
      - blueprints/plaid-link-sso.yaml
      - blueprints/embedded-outpost.yaml
      - blueprints/airlock-sso.yaml
      - blueprints/sdr-sso.yaml
      - blueprints/adsb-sso.yaml
      - blueprints/claude-service-account.yaml
      - blueprints/openhands-sso.yaml
      - blueprints/fava-sso.yaml
      - blueprints/haku-ui-sso.yaml
    namespace: authentik
