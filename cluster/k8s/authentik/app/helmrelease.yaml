---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 24h
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 15m
  timeout: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: authentik
      version: "2026.2.1"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  values:
    # Global configuration
    global:
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: "authentik-db-app,authentik-secrets,authentik-user-password"
        configmap.reloader.stakater.com/reload: "authentik-sso-blueprints"

    # Mount SSO blueprint ConfigMap into worker for native blueprint processing
    blueprints:
      configMaps:
        - authentik-sso-blueprints

    # Authentik server configuration
    authentik:
      # Secret key will be available in the main authentik secret via ESO merge
      secret_key: ""

      # Error reporting
      error_reporting:
        enabled: false

      # PostgreSQL configuration — external CNPG cluster (authentik-db-ovh)
      postgresql:
        host: "authentik-db-ovh-rw"
        name: "authentik"
        user: "authentik"
        password: "" # Loaded via env var (AUTHENTIK_POSTGRESQL__PASSWORD from CNPG secret)

      # Redis configuration (optional for better performance)
      redis:
        host: ""

      # Bootstrap configuration (password and token from ESO)
      bootstrap:
        # Password will be injected via extraEnvFrom (ESO-generated)
        password: ""
        # Token will be injected via extraEnvFrom (ESO-generated)
        token: ""

      # Secrets now loaded per-component via server.envFrom and worker.envFrom

    # Server deployment — single replica (OVH memory too tight for 2+ with current requests)
    server:
      name: server
      replicas: 1

      # Colocate with the database. `authentik-db-ovh` is pinned to OVH, so an unpinned
      # server lands wherever the scheduler puts it — it was on `optiplex` (home), issuing
      # every one of Django's per-request queries across the home↔OVH link. Measured:
      # TCP connect from optiplex to the DB primary is 114ms, and an uncontended request for
      # the static OIDC discovery document took ttfb≈1.6s (~14 serialized round trips) while
      # TCP connect to the gateway itself was 4ms. The latency was almost entirely per-query
      # RTT, not the client network and not CPU. That also made `Home down` take SSO with it,
      # contradicting cluster/README.md's failure-mode table.
      #
      # Selects on the same key/value as the database's own placement
      # (db/postgres-cluster-ovh.yaml), so the two stay together by construction rather than
      # by both happening to resolve to the same nodes today. The DB cannot move anyway —
      # it is on node-local `local-path-ovh` storage.
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh

      # Preferred (not required) anti-affinity allows a surge pod to land on
      # an occupied node while still spreading replicas across nodes when possible.
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: server
                    app.kubernetes.io/instance: authentik
                topologyKey: kubernetes.io/hostname

      # Allow 20 min for DB migrations on first boot (default 10 min).
      # If the startup probe kills the pod mid-migration, the PostgreSQL
      # connection stays idle-in-transaction and blocks the next attempt.
      startupProbe:
        failureThreshold: 120
        periodSeconds: 10

      # Default 3s timeout is too tight — outpost API calls regularly take
      # 1s+ even with OVH-local PostgreSQL. Give enough headroom.
      #
      # Authentik's /-/health/live/ returns 500 whenever PostgreSQL is
      # unreachable, so with the default failureThreshold every transient
      # DB/DNS blip (CNPG failover, node churn) liveness-killed a healthy
      # server and turned a seconds-long blip into a ~90s reboot — the 503
      # windows that killed claude.ai MCP connectors
      # (debug/2026_06_claude_ai_connector_deauth.md). Ride out ~2min of DB
      # unavailability before restarting; readiness stays fast so the pod
      # drops out of the Service immediately.
      livenessProbe:
        timeoutSeconds: 10
        periodSeconds: 15
        failureThreshold: 8
      readinessProbe:
        timeoutSeconds: 10

      # Load ESO-generated secret key via envFrom (plus all global secrets)
      envFrom:
        - configMapRef:
            name: authentik-host
        - secretRef:
            name: authentik-bootstrap
        - secretRef:
            name: authentik-admin-password
        - secretRef:
            name: authentik-secret-key
        - secretRef:
            name: authentik-user-password

      env:
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-db-app
              key: password

      # Service configuration
      service:
        enabled: true
        type: ClusterIP
        port: 80

      # Ingress disabled — traffic routed via Gateway API HTTPRoute
      ingress:
        enabled: false

      # Resources
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    # Worker deployment — single replica
    worker:
      name: worker
      replicas: 1

      # Same reasoning as the server above: the worker is equally DB-bound, and it ran on
      # `optiplex` too.
      nodeSelector:
        topology.kubernetes.io/region: hil

      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: worker
                    app.kubernetes.io/instance: authentik
                topologyKey: kubernetes.io/hostname

      # Load ESO-generated secret key via envFrom (plus all global secrets)
      envFrom:
        - configMapRef:
            name: authentik-host
        - secretRef:
            name: authentik-bootstrap
        - secretRef:
            name: authentik-admin-password
        - secretRef:
            name: authentik-secret-key
        - secretRef:
            name: authentik-user-password

      env:
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-db-app
              key: password

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    # PostgreSQL — disabled; using external CloudNativePG cluster (authentik-db)
    postgresql:
      enabled: false

    # TODO: replace this chart-bundled Redis with an operator-managed
    # RedisReplication (redis.redis.opstreelabs.in/v1beta2) like grocy/tana-mcp/
    # manifold-mcp use. Then set redis.enabled: false and point Authentik at the
    # operator-managed Valkey via AUTHENTIK_REDIS__HOST / AUTHENTIK_REDIS__PASSWORD.
    redis:
      enabled: true

    # Service account
    serviceAccount:
      create: true
      name: authentik
