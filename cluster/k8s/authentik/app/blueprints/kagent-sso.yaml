version: 1
metadata:
  name: SSO - Kagent legacy proxy cleanup
  labels:
    blueprints.goauthentik.io/description: >-
      Tombstone for the standalone Authentik proxy outpost superseded by
      Kagent's chart-managed oauth2-proxy and Terraform-owned OIDC client.

# CLEANUP(added 2026-07-21): Delete this file and its configMapGenerator entry after
#   neither the `kagent` proxy provider nor `kagent-outpost` appears in Authentik. Do
#   not delete the `kagent` application: Terraform owns the live OIDC application with
#   that slug.
entries:
  - model: authentik_outposts.outpost
    state: absent
    identifiers:
      name: kagent-outpost

  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: kagent
