version: 1
metadata:
  name: SSO - Public Coder Agent
  labels:
    blueprints.goauthentik.io/description: "public-coder-agent proxy provider and application"

# Deviation from cluster/docs/sso.md, which prefers Terraform for new providers:
# every proxy provider here is blueprint-managed, and embedded-outpost.yaml --
# also a blueprint -- owns outpost membership. A Terraform provider would split
# ownership of one object graph across two systems, so this follows the
# established proxy pattern and moves with the rest under issue #987.

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: public-coder-agent-provider
    state: present
    identifiers:
      name: public-coder-agent
    attrs:
      external_host: "https://public-coder-agent.allegedly.works"
      internal_host: "http://public-coder-agent.public-coder-agent.svc.cluster.local:18789"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=1"

  - model: authentik_core.application
    id: public-coder-agent-app
    state: present
    identifiers:
      slug: public-coder-agent
    attrs:
      name: Public Coder Agent
      provider: !KeyOf public-coder-agent-provider
      meta_description: "OpenClaw coder agent -- opens pull requests against public repositories"
      meta_launch_url: "https://public-coder-agent.allegedly.works"
      open_in_new_tab: true

  # Single-user access, same as openclaw. The agent holds a GitHub token, so
  # widening this widens who can drive that token.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf public-coder-agent-app
      user: !Find [authentik_core.user, [username, agentydragon]]
      order: 0
