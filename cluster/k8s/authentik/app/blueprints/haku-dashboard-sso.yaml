version: 1
metadata:
  name: SSO - Haku dashboard (retired)
  labels:
    blueprints.goauthentik.io/description: "Tombstone: retire the haku-dashboard forward-auth proxy provider/application. The console now owns OAuth (operator browser OIDC + /mcp MultiAuth) and is reached by a plain HTTPRoute straight to its Service."

# CLEANUP(added 2026-07-12): delete this tombstone file AND its line in
#   cluster/k8s/authentik/app/kustomization.yaml once the `haku-dashboard` proxy provider +
#   application no longer appear in Authentik. The blueprint worker only deletes an object
#   when it sees a `state: absent` entry, so this file must stay wired through a few reconcile
#   cycles; the provider is also removed from blueprints/embedded-outpost.yaml in this change.
entries:
  # Delete the application first — that cascade-removes the single-user policy binding that
  # targeted it — then the proxy provider it fronted.
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: haku-dashboard

  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: haku-dashboard
