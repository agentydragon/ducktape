version: 1
metadata:
  name: Retire FileBrowser SSO
  labels:
    blueprints.goauthentik.io/description: "Delete the retired scanner file browser application and proxy provider"

entries:
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: scanner-filebrowser

  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: scanner-filebrowser
