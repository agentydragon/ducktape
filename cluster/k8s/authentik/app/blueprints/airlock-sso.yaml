version: 1
metadata:
  name: SSO - Airlock
  labels:
    blueprints.goauthentik.io/description: >-
      OAuth2 provider for the Airlock credential-broker SPA.
      Public client (PKCE, no client_secret) for authenticated administrator access.

entries:
  # OAuth2 provider — public client for the operator SPA (Authorization Code + PKCE).
  - model: authentik_providers_oauth2.oauth2provider
    id: airlock-provider
    state: present
    identifiers:
      name: airlock
    attrs:
      client_id: airlock-operator
      client_type: public
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_token_validity: "hours=24"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
      redirect_uris:
        - url: "https://airlock.allegedly.works/auth/callback"
          matching_mode: strict

  - model: authentik_core.application
    id: airlock-app
    state: present
    identifiers:
      slug: airlock
    attrs:
      name: Airlock
      provider: !KeyOf airlock-provider
      meta_description: "OAuth credential broker"
      meta_launch_url: "https://airlock.allegedly.works"
      open_in_new_tab: true

  # Only authentik Admins may access the Airlock UI.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf airlock-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
