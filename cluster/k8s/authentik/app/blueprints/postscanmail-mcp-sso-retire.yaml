version: 1
metadata:
  name: Retire PostScanMail MCP SSO
  labels:
    blueprints.goauthentik.io/description: "Delete the decommissioned PostScanMail MCP application and OAuth provider"

entries:
  # CLEANUP(added 2026-09-21): Remove after tofu reconciliation has destroyed the
  # PostScanMail resources and an Authentik blueprint reconciliation confirms both
  # this application and OAuth provider are absent.
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: postscanmail-mcp

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: postscanmail-mcp
