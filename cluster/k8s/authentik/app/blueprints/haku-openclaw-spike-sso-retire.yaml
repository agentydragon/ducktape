version: 1
metadata:
  name: Retire Haku OpenClaw Spike SSO
  labels:
    blueprints.goauthentik.io/description:
      "Delete the decommissioned Haku OpenClaw spike application and proxy provider"

entries:
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: haku-openclaw-spike

  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: haku-openclaw-spike
