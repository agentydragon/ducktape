version: 1
metadata:
  name: SSO - Plaid Link
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: plaid-link-provider
    state: present
    identifiers:
      name: plaid-link
    attrs:
      external_host: "https://plaid-mcp.allegedly.works"
      internal_host: "http://plaid-mcp.plaid-mcp.svc.cluster.local:8080"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=24"

  - model: authentik_core.application
    id: plaid-link-app
    state: present
    identifiers:
      slug: plaid-link
    attrs:
      name: Plaid Link
      provider: !KeyOf plaid-link-provider
      meta_description: "Human Plaid Link management UI for the synced Plaid database"
      meta_launch_url: "https://plaid-mcp.allegedly.works/link"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf plaid-link-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
