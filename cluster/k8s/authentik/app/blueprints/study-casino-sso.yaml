version: 1
metadata:
  name: SSO - Study Casino
  labels:
    blueprints.goauthentik.io/description: "Study Casino proxy provider, application, and outpost"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: study-casino-provider
    state: present
    identifiers:
      name: study-casino
    attrs:
      external_host: "https://casino.allegedly.works"
      internal_host: "http://study-casino.study-casino.svc.cluster.local:8080"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "days=30"
      # The PWA manifest is fetched by the browser in background contexts
      # (e.g. during installation) without session cookies, causing Authentik
      # to redirect it to the OAuth authorize endpoint — a cross-origin URL
      # that triggers a CORS error. Allow the manifest without auth.
      unauthenticated_paths:
        - /manifest.webmanifest

  - model: authentik_core.application
    id: study-casino-app
    state: present
    identifiers:
      slug: study-casino
    attrs:
      name: Study Casino
      provider: !KeyOf study-casino-provider
      meta_description: "Habit-tracking casino (personal)"
      meta_launch_url: "https://casino.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf study-casino-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0

  # The dedicated study-casino group is Terraform-managed because its
  # membership is derived from declarative authentik_user resources.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf study-casino-app
      group: !Find [authentik_core.group, [name, study-casino]]
      order: 1
