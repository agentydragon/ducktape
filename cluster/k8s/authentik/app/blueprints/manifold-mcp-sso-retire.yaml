# CLEANUP(added 2026-09-21): Remove this tombstone in a follow-up PR only after the
# tofu-controller and Authentik Blueprint worker have reconciled PR1, and both the
# application and OAuth2 provider are confirmed absent.
version: 1
metadata:
  name: Retire Manifold MCP SSO
  labels:
    blueprints.goauthentik.io/description: "Delete the decommissioned Manifold MCP application and OAuth2 provider"

entries:
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: manifold-mcp

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: manifold-mcp
