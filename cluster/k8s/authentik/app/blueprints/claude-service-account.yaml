# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Claude agent — read-only diagnostics: role + group only.
#
# Boundary with Terraform (tf/gitops/sso-providers/service_account_claude.tf):
#   TF owns:        user, API token, kubernetes_secret (reflected to claude-sandbox).
#   Blueprint owns: role + permissions, group (binds the TF user via !Find).
#
# Why this split: TF can't manage role permissions because both
# `authentik_rbac_permission_user` and `authentik_rbac_permission_role` are
# upstream-broken — the latter's `assign`/`unassign` detail actions return 405
# because authentik/rbac/urls.py registers the ViewSet without a {pk} capture,
# so DRF can't route them (broken since e28babb0b8, July 2024). The blueprint
# reconciles permissions onto the role via Authentik's internal Python APIs.
# Conversely, TF has no `authentik_token` data source, so the API token must be
# created by TF to surface its `.key` into the kubernetes_secret.
# See debug/authentik_rbac_permission_role/README.md for full diagnosis.
version: 1
metadata:
  name: Claude diagnostics service account
entries:
  # Diagnostics role with permissions.
  - model: authentik_rbac.role
    id: claude-role
    state: present
    identifiers:
      name: claude-diagnostics
    attrs:
      permissions:
        # Audit log — biggest gap vs kubectl (events are in DB, not pod logs)
        - authentik_events.view_event
        # Application and provider inventory
        - authentik_core.view_application
        - authentik_providers_proxy.view_proxyprovider
        # Identity
        - authentik_core.view_user
        - authentik_core.view_group
        - authentik_core.view_authenticatedsession
        # Outpost connectivity
        - authentik_outposts.view_outpost
        - authentik_outposts.view_outpostserviceconnection
        # Flows and policies
        - authentik_flows.view_flow
        - authentik_flows.view_flowstagebinding
        - authentik_policies.view_policy
        - authentik_policies.view_policybinding
        # System health (SystemTask was renamed to Task in authentik_tasks in 2026.x)
        - authentik_tasks.view_task
        - authentik_blueprints.view_blueprintinstance

  # Group that carries the role; binds the TF-managed user via !Find.
  - model: authentik_core.group
    state: present
    identifiers:
      name: claude-diagnostics
    attrs:
      roles:
        - !KeyOf claude-role
      users:
        - !Find [authentik_core.user, [username, claude-service-account]]
