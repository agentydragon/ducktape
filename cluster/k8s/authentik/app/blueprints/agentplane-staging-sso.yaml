version: 1
metadata:
  name: Retire Agentplane staging SSO
  labels:
    blueprints.goauthentik.io/description: "Delete the retired Agentplane staging application and proxy provider; the app owns its own OIDC login"

entries:
  # The app authenticates its own surface now (tf/gitops/sso-providers/provider_agentplane_staging.tf),
  # so the forward-auth provider and the application in front of it go. This entry keeps deleting
  # the slug on every reconcile, which is why the Terraform application is slugged `agentplane`.
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: agentplane-staging

  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: agentplane-staging
