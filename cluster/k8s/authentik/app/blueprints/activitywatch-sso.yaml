version: 1
metadata:
  name: SSO - ActivityWatch
  labels:
    blueprints.goauthentik.io/description: "ActivityWatch read-only web UI proxy provider, application, and single-user access binding"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: activitywatch-provider
    state: present
    identifiers:
      name: activitywatch
    attrs:
      external_host: "https://activitywatch.allegedly.works"
      internal_host: "http://activitywatch-readonly.activitywatch.svc.cluster.local:5600"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=24"

  - model: authentik_core.application
    id: activitywatch-app
    state: present
    identifiers:
      slug: activitywatch
    attrs:
      name: ActivityWatch
      provider: !KeyOf activitywatch-provider
      meta_description: "Personal activity history"
      meta_launch_url: "https://activitywatch.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf activitywatch-app
      user: !Find [authentik_core.user, [username, agentydragon]]
      order: 0
