version: 1
metadata:
  name: SSO - Airlock Scope Mappings (retired)
  labels:
    blueprints.goauthentik.io/description: >-
      Tombstone for the propose, read, and decide scopes formerly used by the
      retired Airlock MCP tool-approval service.

# CLEANUP(added 2026-07-15): Delete this file and its configMapGenerator entry
#   after Authentik no longer returns any of the three "airlock: *" scope mappings.
#   The blueprint worker must observe state: absent after the old providers stop
#   referencing the mappings; removing the file alone would orphan them.
entries:
  - model: authentik_providers_oauth2.scopemapping
    state: absent
    identifiers:
      name: "airlock: propose"

  - model: authentik_providers_oauth2.scopemapping
    state: absent
    identifiers:
      name: "airlock: read"

  - model: authentik_providers_oauth2.scopemapping
    state: absent
    identifiers:
      name: "airlock: decide"
