version: 1
metadata:
  name: Retire Browsertrix SSO
  labels:
    blueprints.goauthentik.io/description: "Delete the retired Browsertrix application and proxy provider"

entries:
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: browsertrix

  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: browsertrix
