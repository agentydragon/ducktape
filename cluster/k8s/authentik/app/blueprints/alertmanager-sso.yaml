version: 1
metadata:
  name: SSO - Alertmanager
  labels:
    blueprints.goauthentik.io/description: "Alertmanager dashboard proxy provider and application"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: alertmanager-provider
    state: present
    identifiers:
      name: alertmanager
    attrs:
      external_host: "https://alertmanager.allegedly.works"
      internal_host: "http://monitoring-alertmanager.monitoring.svc.cluster.local:9093"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=1"

  - model: authentik_core.application
    id: alertmanager-app
    state: present
    identifiers:
      slug: alertmanager
    attrs:
      name: Alertmanager
      provider: !KeyOf alertmanager-provider
      meta_description: "Alertmanager alerts and silences"
      meta_launch_url: "https://alertmanager.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf alertmanager-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
