version: 1
metadata:
  name: SSO - OpenClaw
  labels:
    blueprints.goauthentik.io/description: "Tombstone: removes the retired OpenClaw proxy provider, application, and policy bindings"

# CLEANUP(added 2026-07-31): delete this file once Authentik shows no `openclaw`
#   application or proxy provider across several worker reconciles (the worker
#   re-applies blueprints hourly, so allow at least two).
#
# The OpenClaw gateway was deleted along with the whole OpenShell stack — the
# instance was unused and wedged, and `public-coder-agent` is the reference
# agent now. Removing the `state: present` entries alone would not remove
# anything from Authentik; only these `state: absent` entries do.
#
# Order matters: the policy bindings reference the application, and the
# application references the provider, so they are torn down innermost-first.
entries:
  - model: authentik_policies.policybinding
    state: absent
    identifiers:
      target: !Find [authentik_core.application, [slug, openclaw]]
      user: !Find [authentik_core.user, [username, agentydragon]]
      order: 0

  # Superseded binding from the 2026-07-26 cleanup; it may already be gone, and
  # an absent entry for a missing object is a no-op.
  - model: authentik_policies.policybinding
    state: absent
    identifiers:
      target: !Find [authentik_core.application, [slug, openclaw]]
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: openclaw

  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: openclaw
