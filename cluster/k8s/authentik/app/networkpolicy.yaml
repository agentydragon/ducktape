# Restrict Authentik server to authorized cluster consumers.
# Unauthenticated /api/v3/ enables user enumeration, provider tampering,
# and backdoor user creation — restrict to prevent abuse from any cluster pod.
# Pod ports: 9000 (HTTP), 9443 (HTTPS), 9300 (metrics).
#
# Uses CiliumNetworkPolicy because standard K8s NetworkPolicy cannot match
# Cilium Gateway API traffic (reserved:ingress identity).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-server-ingress
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/name: authentik
  ingress:
    # Cilium Gateway API (reserved:ingress identity) → Authentik server
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP

    # authentik namespace: outposts call server API for config sync
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP
            - port: "9300"
              protocol: TCP

    # flux-system: tofu-controller tf-runner calls Authentik API
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP

    # monitoring: Grafana OIDC token exchange + Prometheus metrics scraping
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
            - port: "9300"
              protocol: TCP

    # gatus: health check probes (liveness endpoint)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gatus
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP

    # kubectl MCP servers: OIDC discovery + token exchange
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kubectl-sandbox-mcp
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kubectl-passthrough-mcp
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP

    # claude-sandbox: Claude agent reads Authentik API (events, apps, users,
    # outposts, flows, policies) via AUTHENTIK_API_TOKEN loaded at session start
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-sandbox
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
