---
# ConfigMap containing Authentik native blueprints for all SSO resources.
# Mounted into the Authentik worker via blueprints.configMaps in the HelmRelease.
# Blueprints use state: present (idempotent, re-applied every 60 min, no external state).
# Client secrets injected via !Env tags from authentik-sso-client-secrets K8s Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-sso-blueprints
  namespace: authentik
data:
  # --- Users, Custom Auth Flow, Brand ---
  users.yaml: |
    version: 1
    metadata:
      name: SSO - Users and Authentication
      labels:
        blueprints.goauthentik.io/description: "Custom auth flow (no MFA), user, brand"

    entries:
      # Custom authentication flow without MFA stage.
      # TODO: Re-enable MFA (TOTP/WebAuthn) once device enrollment is set up.
      - model: authentik_flows.flow
        id: custom-auth-flow
        state: present
        identifiers:
          slug: custom-authentication-flow
        attrs:
          name: authentication-flow
          title: "Welcome to allegedly.works!"
          designation: authentication

      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf custom-auth-flow
          stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
          order: 10

      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf custom-auth-flow
          stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
          order: 20

      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf custom-auth-flow
          stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
          order: 30

      # Grafana Admins group (referenced by Grafana OIDC role_attribute_path)
      - model: authentik_core.group
        id: grafana-admins
        state: present
        identifiers:
          name: Grafana Admins

      # Admin user
      - model: authentik_core.user
        state: present
        identifiers:
          username: agentydragon
        attrs:
          name: Rai
          email: agentydragon@gmail.com
          password: !Env USER_PASSWORD
          groups:
            - !Find [authentik_core.group, [name, authentik Admins]]
            - !KeyOf grafana-admins

      # Domain-matched brand for allegedly.works
      - model: authentik_brands.brand
        state: present
        identifiers:
          domain: allegedly.works
        attrs:
          default: false
          flow_authentication: !KeyOf custom-auth-flow
          branding_title: "allegedly.works"

  # --- Gitea OAuth2 SSO ---
  gitea-sso.yaml: |
    version: 1
    metadata:
      name: SSO - Gitea
      labels:
        blueprints.goauthentik.io/description: "Gitea OIDC provider and application"

    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: gitea-provider
        state: present
        identifiers:
          name: gitea-oauth2
        attrs:
          client_id: gitea
          client_secret: !Env GITEA_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          issuer_mode: per_provider
          include_claims_in_id_token: true
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          allowed_redirect_uris:
            - url: "https://git.allegedly.works/user/oauth2/authentik/callback"
              matching_mode: strict

      - model: authentik_core.application
        state: present
        identifiers:
          slug: gitea
        attrs:
          name: Gitea
          protocol_provider: !KeyOf gitea-provider
          meta_description: "Gitea Git Repository Management"
          meta_publisher: "Gitea"
          meta_icon: "https://cdn.simpleicons.org/gitea"
          open_in_new_tab: true

