apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-sso-secrets
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/authentik/sso-secrets
  prune: true
  wait: true
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: authentik-sso-client-secrets
      namespace: authentik
  dependsOn:
    - name: authentik-namespace
    - name: external-secrets-config
    - name: authentik-blueprint-sso-secrets
