apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db-ovh
  namespace: authentik
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    topologyKey: kubernetes.io/hostname
    # Prefer ordinary workers when this workload tolerates control planes.
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  storage:
    storageClass: local-path-ovh
    size: 8Gi

  # The plugin sidecar archives WAL continuously and provides physical base
  # backups to the Authentik-specific SeaweedFS ObjectStore.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-db-ovh

  monitoring:
    enablePodMonitor: true
