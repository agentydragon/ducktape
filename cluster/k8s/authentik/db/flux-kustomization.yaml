apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-db
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: cnpg
      namespace: ducktape-flux
    - name: authentik-namespace
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/authentik/db
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: authentik-db
    namespace: ducktape-flux
  timeout: 10m
  wait: true
