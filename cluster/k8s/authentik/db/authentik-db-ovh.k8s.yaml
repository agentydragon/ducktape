apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db-ovh
  namespace: authentik
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-db-app
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  monitoring:
    enablePodMonitor: true
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: authentik-db-ovh
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 8Gi
    storageClass: local-path-ovh-ssd
