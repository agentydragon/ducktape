apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sso-providers-tf
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/authentik/sso-providers-tf
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: sso-providers
      namespace: flux-system
  timeout: 10m
  dependsOn:
    - name: tofu-controller
    - name: tofu-state-db
    - name: authentik
    - name: authentik-sso-secrets
      namespace: ducktape-flux
