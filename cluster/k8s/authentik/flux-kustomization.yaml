apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/k8s/authentik
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  # Health checks ensure Authentik is fully operational before dependents start
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: authentik
      namespace: authentik
    - apiVersion: apps/v1
      kind: Deployment
      name: authentik-server
      namespace: authentik
    - apiVersion: apps/v1
      kind: Deployment
      name: authentik-worker
      namespace: authentik
  dependsOn:
    - name: cert-manager-issuer-config
    - name: authentik-namespace
    - name: authentik-db # Wait for CNPG cluster ready and authentik-db-authentik secret to exist
    - name: authentik-secrets
    - name: authentik-sso-secrets # SSO client secrets for blueprint !Env tags
    - name: authentik-token # Wait for API token generation in Vault
    - name: cert-manager # Wait for cert-manager for TLS certificates
    - name: gateway # Wait for Gateway API for external access
