version: 1
metadata:
  name: SSO - Approval Gate
  labels:
    blueprints.goauthentik.io/description: >-
      OAuth2 provider for approval-gate operator SPA.
      Public client (PKCE, no client_secret) issuing JWTs with "decide" and
      "read" scopes for operator access.

entries:
  # Remove old proxy provider (replaced by native OAuth2 for SPA).
  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: approval-gate

  # OAuth2 provider — public client for the operator SPA (Authorization Code + PKCE).
  - model: authentik_providers_oauth2.oauth2provider
    id: approval-gate-provider
    state: present
    identifiers:
      name: approval-gate
    attrs:
      client_id: approval-gate-operator
      client_type: public
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_token_validity: "hours=24"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "approval-gate: decide"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "approval-gate: read"]]
      redirect_uris:
        - url: "https://approval-gate.allegedly.works/auth/callback"
          matching_mode: strict

  - model: authentik_core.application
    id: approval-gate-app
    state: present
    identifiers:
      slug: approval-gate
    attrs:
      name: Approval Gate
      provider: !KeyOf approval-gate-provider
      meta_description: "MCP tool approval queue"
      meta_launch_url: "https://approval-gate.allegedly.works"
      open_in_new_tab: true

  # Only authentik Admins may access the approval gate UI.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf approval-gate-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
