version: 1
metadata:
  name: SSO - Airlock Upstream (OIDCProxy confidential client)
  labels:
    blueprints.goauthentik.io/description: >-
      Confidential OAuth2 client used by airlock's OIDCProxy to proxy
      authentication through Authentik. OIDCProxy handles DCR for
      downstream clients (e.g. Claude.ai web) and exchanges auth codes
      with this upstream provider.

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: airlock-upstream-provider
    state: present
    identifiers:
      name: airlock-upstream
    attrs:
      client_id: airlock-upstream
      client_secret: !Env AIRLOCK_UPSTREAM_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_token_validity: "hours=1"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "airlock: propose"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "airlock: read"]]
      # OIDCProxy handles redirect URIs dynamically via DCR — the upstream
      # provider just needs to accept the OIDCProxy's own callback URL.
      redirect_uris:
        - url: "https://airlock.allegedly.works/mcp/oauth/callback"
          matching_mode: strict

  - model: authentik_core.application
    id: airlock-upstream-app
    state: present
    identifiers:
      slug: airlock-upstream
    attrs:
      name: Airlock (Upstream)
      provider: !KeyOf airlock-upstream-provider
      meta_description: "OIDCProxy upstream auth for airlock MCP"

  # Only authentik Admins may authorize through this provider.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf airlock-upstream-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
