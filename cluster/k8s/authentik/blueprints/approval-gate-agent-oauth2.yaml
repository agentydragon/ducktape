version: 1
metadata:
  name: SSO - Approval Gate Agent (OAuth2 client_credentials)
  labels:
    blueprints.goauthentik.io/description: >-
      OAuth2 provider for approval-gate agent auth via client_credentials grant.
      Issues JWTs with "propose" and "read" scopes for agent tool access.

entries:
  # ── Custom scope mappings ──────────────────────────────────────────────────
  # Each mapping adds a scope name to the JWT's "scope" claim when requested.

  - model: authentik_providers_oauth2.scopemapping
    id: scope-propose
    state: present
    identifiers:
      name: "approval-gate: propose"
      scope_name: propose
    attrs:
      description: "Propose actions via approval gate backend tools"
      expression: "return {}"

  - model: authentik_providers_oauth2.scopemapping
    id: scope-read
    state: present
    identifiers:
      name: "approval-gate: read"
      scope_name: read
    attrs:
      description: "Read approval gate action state and logs"
      expression: "return {}"

  - model: authentik_providers_oauth2.scopemapping
    id: scope-decide
    state: present
    identifiers:
      name: "approval-gate: decide"
      scope_name: decide
    attrs:
      description: "Approve or reject pending actions"
      expression: "return {}"

  # ── OAuth2 provider for agent (client_credentials) ─────────────────────────

  - model: authentik_providers_oauth2.oauth2provider
    id: approval-gate-agent-provider
    state: present
    identifiers:
      name: approval-gate-agent
    attrs:
      client_id: approval-gate-agent
      client_secret: !Env APPROVAL_GATE_AGENT_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_token_validity: "hours=1"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf scope-propose
        - !KeyOf scope-read
      # No redirect_uris — client_credentials flow doesn't redirect.

  - model: authentik_core.application
    id: approval-gate-agent-app
    state: present
    identifiers:
      slug: approval-gate-agent
    attrs:
      name: Approval Gate Agent
      provider: !KeyOf approval-gate-agent-provider
      meta_description: "Machine-to-machine auth for approval gate agents"

  # ── Service account for client_credentials grant ───────────────────────────
  # Authentik requires a user bound to the application for client_credentials.

  - model: authentik_core.user
    id: approval-gate-service-account
    state: present
    identifiers:
      username: approval-gate-agent-sa
    attrs:
      name: "Approval Gate Agent (Service Account)"
      type: service_account
      is_active: true
      path: "service-accounts"

  # Bind service account to the application via a policy binding that allows it.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf approval-gate-agent-app
      user: !KeyOf approval-gate-service-account
      order: 0
