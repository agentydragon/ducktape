apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airlock-secrets
  namespace: airlock
spec:
  refreshInterval: 8760h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: airlock-secrets
    template:
      metadata:
        annotations:
          # Mirror to openclaw-gateway so the auth proxy sidecar can read
          # OAuth2 client credentials.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "openclaw-gateway"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "openclaw-gateway"
  data:
    - secretKey: client-id
      remoteRef:
        key: sso/openclaw-agent
        property: client_id
    - secretKey: client-secret
      remoteRef:
        key: sso/openclaw-agent
        property: client_secret
    - secretKey: oidc-client-secret
      remoteRef:
        key: sso/airlock-upstream
        property: client_secret
