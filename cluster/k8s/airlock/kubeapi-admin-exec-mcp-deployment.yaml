apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeapi-admin-exec-mcp
  namespace: airlock
  labels:
    app: airlock
    component: kubeapi-admin-exec-mcp
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airlock
      component: kubeapi-admin-exec-mcp
  template:
    metadata:
      labels:
        app: airlock
        component: kubeapi-admin-exec-mcp
    spec:
      imagePullSecrets:
        - name: harbor-pull-robot
      serviceAccountName: kubeapi-admin-exec-mcp
      automountServiceAccountToken: true
      containers:
        - name: kubeapi-admin-exec-mcp
          image: registry.allegedly.works/ducktape/openclaw-exec:devel-20260312072329-48ee228 # {"$imagepolicy": "flux-system:openclaw-exec"}
          imagePullPolicy: Always
          ports:
            - name: mcp
              containerPort: 8766
              protocol: TCP
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: exec-backend-token
                  key: password
            - name: INSTRUCTIONS
              value: >-
                This server lets you run commands on a container with a Kubernetes cluster-admin token mounted. Use `kubectl` to manage cluster resources. The service account token is auto-mounted at the standard path (`/var/run/secrets/kubernetes.io/serviceaccount/token`).
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8766
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8766
            initialDelaySeconds: 5
            periodSeconds: 10
