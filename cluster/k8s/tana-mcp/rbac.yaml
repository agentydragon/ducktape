apiVersion: v1
kind: ServiceAccount
metadata:
  name: tana-token-broker
  namespace: tana-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tana-token-broker-secret-writer
  namespace: tana-mcp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tana-token-broker-secret-writer
  namespace: tana-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tana-token-broker-secret-writer
subjects:
  - kind: ServiceAccount
    name: tana-token-broker
    namespace: tana-mcp
