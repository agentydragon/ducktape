apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - rbac.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: tana-mcp-nginx-config
    namespace: tana-mcp
    files:
      - default.conf=nginx-auth-proxy.conf
