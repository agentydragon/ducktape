apiVersion: apps/v1
kind: Deployment
metadata:
  name: wayback-cache
  namespace: wayback-cache
  labels:
    app.kubernetes.io/name: wayback-cache
    app.kubernetes.io/component: input
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wayback-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wayback-cache
        app.kubernetes.io/component: input
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: archive
          image: ghcr.io/agentydragon/wayback-archive:devel-20260612125324-df01b54 # {"$imagepolicy": "flux-system:wayback-archive"}
          imagePullPolicy: Always
          env:
            - name: RUST_LOG
              value: info
            - name: WAYBACK_CACHE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wayback-archive-db-app
                  key: uri
            - name: WAYBACK_CACHE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-identity-wayback-archive
                  key: accessKey
            - name: WAYBACK_CACHE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-identity-wayback-archive
                  key: secretKey
            - name: WAYBACK_CACHE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wayback-cache-token
                  key: token
          volumeMounts:
            - name: config
              mountPath: /etc/wayback-cache
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: authed
              containerPort: 8090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: wayback-cache-input-config
