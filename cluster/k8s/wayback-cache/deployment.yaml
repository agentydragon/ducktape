apiVersion: apps/v1
kind: Deployment
metadata:
  name: wayback-cache
  namespace: wayback-cache
  labels:
    app.kubernetes.io/name: wayback-cache
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wayback-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wayback-cache
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: archive
          image: ghcr.io/agentydragon/wayback-archive:devel-20260612090404-c9c047f # {"$imagepolicy": "flux-system:wayback-archive"}
          imagePullPolicy: Always
          env:
            - name: RUST_LOG
              value: info
            - name: WAYBACK_ARCHIVE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wayback-archive-db-app
                  key: uri
            - name: WAYBACK_ARCHIVE_WEB_UPSTREAM
              value: https://web.archive.org
            - name: WAYBACK_ARCHIVE_AVAILABILITY_UPSTREAM
              value: https://archive.org
            # Keep below the wayback proxy's 300s total upstream timeout while
            # allowing bursty eval requests to wait for scarce IA slots.
            - name: WAYBACK_ARCHIVE_MAX_QUEUE_WAIT_SECONDS
              value: "180"
            - name: WAYBACK_ARCHIVE_AVAILABILITY_TIMEOUT_SECONDS
              value: "15"
            - name: WAYBACK_ARCHIVE_CDX_TIMEOUT_SECONDS
              value: "45"
            - name: WAYBACK_ARCHIVE_REPLAY_TIMEOUT_SECONDS
              value: "60"
            - name: WAYBACK_ARCHIVE_MAX_BODY_BYTES
              value: "10485760"
            - name: WAYBACK_ARCHIVE_MAX_METADATA_BYTES
              value: "10485760"
            - name: WAYBACK_ARCHIVE_S3_ENDPOINT
              value: http://seaweedfs-s3.seaweedfs.svc:8333
            - name: WAYBACK_ARCHIVE_S3_BUCKET
              value: wayback-archive
            - name: WAYBACK_ARCHIVE_S3_REGION
              value: us-east-1
            - name: WAYBACK_ARCHIVE_S3_ALLOW_HTTP
              value: "true"
            - name: WAYBACK_ARCHIVE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-identity-wayback-archive
                  key: accessKey
            - name: WAYBACK_ARCHIVE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-identity-wayback-archive
                  key: secretKey
            - name: WAYBACK_ARCHIVE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wayback-cache-token
                  key: token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: authed
              containerPort: 8090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
