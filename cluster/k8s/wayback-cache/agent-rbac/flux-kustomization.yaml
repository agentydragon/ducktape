apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wayback-cache-agent-rbac
  namespace: flux-system
  annotations:
    description: Agent RBAC for wayback-cache namespace. Lightweight — only RoleBindings. Depends on namespace existing + agent RBAC base for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/wayback-cache/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: wayback-cache-namespace
    - name: claude-rbac
