# Shared pull-through cache for the Internet Archive Wayback Machine.
# See loom/plans/wayback_proxy.md. Two tiers:
#   tier 1 (:8080)          — PVC-backed proxy_cache; hits never touch IA.
#   tier 2 (127.0.0.1:8081) — loopback-only; every request reaching it is by
#                             construction a cold miss, so limit_req buckets pace
#                             exactly the traffic IA sees — content fetches and
#                             the slower CDX index queries throttled separately
#                             so neither starves the other.
# The cache is deliberately dumb: any path forwards verbatim to
# web.archive.org (CDX queries and /web/<ts>id_/ fetches alike). Date
# clamping is the per-agent wayback proxy's job (loom/wayback_proxy/).
# Workers must run as nginx (uid/gid 101): the deployment's fsGroup makes the
# /cache PVC group-writable for exactly that gid.
user nginx;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    # Custom format so cache and upstream behavior are directly countable from
    # the access log (the default 'combined' format hides both). Fields:
    #   cache=  $upstream_cache_status — HIT/MISS/EXPIRED/STALE/UPDATING or '-'
    #           (served without an upstream). Measures cache effectiveness.
    #   up=     $upstream_status — IA's HTTP status, comma-joined per
    #           proxy_next_upstream retry. Empty/'-' on a connection-level
    #           failure (e.g. IA RST), which is how we count "upstream refused
    #           TCP" vs IA returning an HTTP error.
    #    rt=/uct=/urt= total / upstream-connect / upstream-response seconds —
    #           surfaces the slow IA CDX latency and connect stalls.
    #   tries=  $upstream_addr — the upstream(s) tried (one per retry).
    log_format wayback '$remote_addr [$time_local] "$request" $status '
                       'cache=$upstream_cache_status up=$upstream_status '
                       'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time '
                       'tries=$upstream_addr bytes=$body_bytes_sent';
    access_log /dev/stdout wayback;

    # Bearer token for the gateway-facing listener (:8090). Injected at
    # container start by nginx:alpine's envsubst from $WAYBACK_CACHE_TOKEN
    # (NGINX_ENVSUBST_FILTER restricts substitution to this one var so nginx's
    # own $variables survive). In-cluster consumers use :8080 unauthenticated;
    # only the public HTTPRoute path is token-gated.
    # The "Bearer <64-hex>" key is ~71 bytes, over the 64-byte default bucket.
    map_hash_bucket_size 128;
    map $http_authorization $wayback_authed {
        default 0;
        "Bearer ${WAYBACK_CACHE_TOKEN}" 1;
    }

    # Snapshot bytes at a fixed 14-digit timestamp are immutable.
    # use_temp_path=off avoids cross-filesystem renames onto the PVC.
    proxy_cache_path /cache levels=1:2 keys_zone=wayback:64m max_size=18g
                     inactive=3650d use_temp_path=off;

    # Content fetches (immutable snapshot bytes) and CDX index queries are paced
    # separately: CDX is slow at IA (10-25s/query) but every clamp needs one, so
    # sharing one bucket made cold bursts queue CDX behind content and 504.
    limit_req_zone $server_name zone=ia_upstream:1m rate=30r/m;
    limit_req_zone $server_name zone=ia_cdx:1m rate=60r/m;

    # DNS resolved once at nginx startup; the Recreate deployment strategy
    # means a pod restart re-resolves if IA rotates IPs.
    #
    # HYPOTHESIS (2026-06-11): the dominant eval failure is web.archive.org
    # *refusing new TCP connections* per source IP — ~900 `connect() failed
    # (111: Connection refused)` per run, surfaced as 502. It's connection-level
    # (a RST on connect, not an HTTP 429/503) and stays flat when sample
    # concurrency is halved, so it tracks our *new-connection rate*, not request
    # volume. A bigger keepalive pool lets nginx reuse persistent upstream
    # connections instead of opening fresh ones for IA to reject. Size to cover
    # in-flight CDX concurrency (rate x IA latency ~= 60 r/m x ~20s ~= 20) with
    # headroom; keepalive_requests high so a hot connection isn't recycled after
    # nginx's default 1000; keepalive_timeout long enough to survive limit_req
    # pacing between requests. Validate by re-measuring the refused-connection
    # count in the new `wayback` access log; if it doesn't drop, IA is limiting
    # by source IP / total connections rather than new-connection rate.
    upstream ia {
        server web.archive.org:443;
        keepalive 64;
        keepalive_timeout 120s;
        keepalive_requests 10000;
    }

    server { # tier 1: PVC-backed cache
        listen 8080;

        proxy_cache wayback;
        proxy_cache_key $request_uri;
        proxy_cache_lock on; # collapse concurrent identical misses
        # Lock timeouts must ride out tier-2 limit_req delays
        # (burst 60 at 30r/m queues up to ~120s).
        proxy_cache_lock_timeout 300s;
        proxy_cache_lock_age 300s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header X-Wayback-Cache $upstream_cache_status always;

        # IA replies carry load-balancer cookies (wb-p-SERVER) and ad-hoc
        # cache-control; nginx refuses to cache anything with Set-Cookie by
        # default. Our cacheability rule is structural — snapshot bytes at a
        # fixed timestamp are immutable — so ignore origin caching headers
        # entirely, and never store or propagate cookies.
        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires;
        proxy_hide_header Set-Cookie;

        # /web/<ts>id_/<url> snapshot bytes: immutable -> ~forever. Cached
        # 302s are IA timestamp-canonicalization, equally stable. 404s are
        # cached briefly so transient IA flakiness doesn't stick.
        location / {
            proxy_cache_valid 200 302 3650d;
            proxy_cache_valid 404 1h;
            proxy_pass http://127.0.0.1:8081;
        }

        # CDX index queries are NOT strictly immutable (IA backfills old crawls
        # and applies takedowns retroactively), but every query clamps to a
        # historical `to=<as_of>` timestamp, so "closest capture ≤ as_of" is
        # effectively stable — backfill of old crawls and takedowns are rare.
        # CDX is the cache's bottleneck: highest-volume path, heavily throttled
        # at IA (10-25s/query), and the dominant source of cold-miss 502s. A
        # long (1y) TTL keeps that traffic off archive.org across runs; the
        # per-run evidence manifest — not this cache — is the reproducibility
        # record, so staleness here costs nothing.
        location /cdx/ {
            proxy_cache_valid 200 365d;
            proxy_pass http://127.0.0.1:8081;
        }
    }

    server { # gateway-facing: bearer-authed wrapper over tier 1
        listen 8090;
        location / {
            if ($wayback_authed = 0) {
                return 401;
            }
            proxy_pass http://127.0.0.1:8080;
            proxy_read_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server { # tier 2: loopback-only, rate-limited hop to IA
        listen 127.0.0.1:8081;
        server_name wayback-upstream;

        # Common IA upstream settings, inherited by both locations below. (A
        # location that set its own proxy_set_header would inherit none of these,
        # so neither does — they differ only in rate bucket and read timeout.)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # SO_KEEPALIVE on the pooled upstream sockets so idle keepalive
        # connections to IA are detected/dropped if IA silently closes them,
        # keeping the reused pool healthy between paced requests.
        proxy_socket_keepalive on;
        proxy_set_header Host web.archive.org;
        proxy_set_header User-Agent "ducktape-wayback-cache/1 (+agentydragon@gmail.com)";
        # Deterministic bytes: no content-encoding variants in the cache, so
        # per-agent evidence sha256s are stable.
        proxy_set_header Accept-Encoding "identity";
        proxy_ssl_server_name on;
        proxy_ssl_name web.archive.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        # IA returns sporadic 502/503/504 under load (a bad gateway behind its
        # own LB, not a real miss). Retry the same upstream a couple more times
        # before surfacing the failure; with one server in `upstream ia` these
        # are sequential re-attempts against IA. GET-only (CDX + content fetches
        # are idempotent), so non_idempotent is intentionally left off. Our own
        # limit_req 503s are generated before proxy_pass and so are unaffected.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 60s;

        # CDX index lookups are slow at IA (10-25s) and every clamp issues one:
        # give them a more generous bucket and a longer read timeout so a queued
        # query rides out the wait instead of 504-ing, and never competes with
        # content fetches for the same tokens.
        location /cdx/ {
            limit_req zone=ia_cdx burst=30;
            proxy_read_timeout 120s;
            proxy_pass https://ia;
        }

        location / {
            limit_req zone=ia_upstream burst=60; # delays up to 60 queued, then 503
            proxy_pass https://ia;
        }
    }
}
