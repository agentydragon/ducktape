apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wayback-cache
  namespace: ducktape-flux
spec:
  # Decommissioned by operator request; keep its configuration but stop reconciliation.
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./cluster/k8s/wayback-cache
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: wayback-cache
      namespace: wayback-cache
  dependsOn:
    - name: wayback-cache-namespace
      namespace: ducktape-flux
    - name: wayback-archive-db
    - name: seaweedfs-wayback-archive-bucket
      namespace: flux-system
    - name: seaweedfs-secrets
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: flux-image-automation-ghcr
      namespace: ducktape-flux
    - name: monitoring-stack # ServiceMonitor CRD
      namespace: flux-system
