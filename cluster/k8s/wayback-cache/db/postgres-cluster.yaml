apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wayback-archive-db
  namespace: wayback-cache
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  # CNPG 1.27+ kills isolated primaries by default (liveness probe).
  # Disable to prevent false positives from transient network blips.
  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh

  storage:
    storageClass: local-path-ovh
    size: 10Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: wayback_archive
      owner: wayback_archive
      # CNPG auto-generates credentials in secret wayback-archive-db-app.
