# The unauthed :8080 listener stays ClusterIP-only. The public HTTPRoute targets
# the bearer-authed :8090 listener for out-of-cluster eval/dev agents.
apiVersion: v1
kind: Service
metadata:
  name: wayback-cache
  namespace: wayback-cache
  labels:
    app.kubernetes.io/name: wayback-cache
    app.kubernetes.io/component: input
spec:
  selector:
    app.kubernetes.io/name: wayback-cache
    app.kubernetes.io/component: input
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    # Bearer-authed listener, target of the public HTTPRoute.
    - port: 8090
      targetPort: 8090
      protocol: TCP
      name: authed
