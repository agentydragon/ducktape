apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "false"
  name: session-backup
spec: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: session-backup-data
  namespace: session-backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: piraeus-ssd-2-autodiskful
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: session-backup-data-hdd
  namespace: session-backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: piraeus-hdd-2
  volumeMode: Filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: session-backup-hdd-copy
  name: session-backup-hdd-copy
  namespace: session-backup
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: session-backup-hdd-copy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-backup-hdd-copy
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: session-backup
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      containers:
        - command:
            - sleep
            - infinity
          image: docker.io/chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
          imagePullPolicy: IfNotPresent
          name: copy
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /source
              name: source
              readOnly: true
            - mountPath: /destination
              name: destination
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: session-backup-data
        - name: destination
          persistentVolumeClaim:
            claimName: session-backup-data-hdd
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: session-backup-hdd-copy
  namespace: session-backup
spec:
  egressDeny:
    - toEntities:
        - all
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: session-backup-hdd-copy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: session-backup
  name: session-backup
  namespace: session-backup
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: session-backup-rest-server-deployment-c82f8470
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-backup
        cdk8s.io/metadata.addr: session-backup-rest-server-deployment-c82f8470
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: DATA_DIRECTORY
              value: /data
            - name: PASSWORD_FILE
              value: /auth/.htpasswd
            - name: OPTIONS
              value: --append-only --private-repos
          image: docker.io/restic/rest-server:0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 15
            tcpSocket:
              port: 8000
          name: rest-server
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            tcpSocket:
              port: 8000
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /auth
              name: secret-session-backup-rest-server-auth
              readOnly: true
            - mountPath: /data
              name: pvc-session-backup-data
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
        - name: secret-session-backup-rest-server-auth
          secret:
            defaultMode: 288
            items:
              - key: .htpasswd
                path: .htpasswd
            secretName: session-backup-rest-server-auth
        - name: pvc-session-backup-data
          persistentVolumeClaim:
            claimName: session-backup-data
            readOnly: false
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: session-backup
  name: session-backup
  namespace: session-backup
spec:
  externalIPs: []
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    cdk8s.io/metadata.addr: session-backup-rest-server-deployment-c82f8470
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: session-backup
  namespace: session-backup
spec:
  hostnames:
    - ai-session-backups.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: session-backup
          port: 8000
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
          type: ResponseHeaderModifier
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: session-backup
  namespace: session-backup
spec:
  egressDeny:
    - toEntities:
        - all
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: session-backup
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: ai-session-archive-importer
            k8s:io.kubernetes.pod.namespace: session-backup
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
