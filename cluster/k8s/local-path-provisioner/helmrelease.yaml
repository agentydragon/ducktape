---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.containeroo.ch
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: local-path-provisioner
      version: "0.0.35"
      sourceRef:
        kind: HelmRepository
        name: local-path-provisioner
        namespace: flux-system
  values:
    # The chart's default `local-path` StorageClass is retired 2026-06-03
    # in favor of the region-pinned `local-path-ovh` and `local-path-proxmox`
    # SCs (defined as separate manifests in this directory). The provisioner
    # deployment + nodePathMap below are still used because both region-pinned
    # SCs declare `provisioner: cluster.local/local-path-provisioner`.
    storageClass:
      create: false
    nodePathMap:
      # Use /var/local-path-provisioner on all nodes
      # On Talos this is writable and persists across reboots
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/local-path-provisioner
      # OVH Kimsufi nodes carve a dedicated XFS data disk via Talos
      # UserVolumeConfig (cluster/terraform/main/ovh-nodes.tf), mounted at
      # /var/mnt/seaweedfs-data. All OVH-local SCs route here; which physical
      # media a PVC lands on is decided by the SC's allowedTopologies on the
      # `storage-tier` node label, not by the path:
      #   - local-path-ovh-hdd → storage-tier=hdd → KS-5 /dev/sdb (HDD)
      #   - local-path-ovh-ssd → storage-tier=ssd → KS-GAME 2nd NVMe (SSD)
      #   - local-path-ovh     → deprecated alias, now pinned to storage-tier=hdd
      # See cluster/docs/ovh_storage_tiering.md.
      #
      # List every node that should be eligible for OVH-local placement.
      - node: ovh-ns103656
        paths:
          - /var/mnt/seaweedfs-data/local-path
      - node: ovh-ns103711
        paths:
          - /var/mnt/seaweedfs-data/local-path
      - node: ovh-ns102453
        paths:
          - /var/mnt/seaweedfs-data/local-path
      - node: ovh-ns104952
        paths:
          - /var/mnt/seaweedfs-data/local-path
      - node: ovh-ns104963
        paths:
          - /var/mnt/seaweedfs-data/local-path
    # Configure helper pods to run in local-path-storage namespace (privileged)
    # This avoids PodSecurity restrictions in workload namespaces
    configmap:
      helperPodNamespace: local-path-storage
