apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-ovh-hdd
  annotations:
    description: OVH HIL node-local data disk, HDD-backed (KS-5 /dev/sdb). Media-scoped via storage-tier=hdd.
provisioner: cluster.local/local-path-provisioner
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
# Media is enforced by allowedTopologies on the storage-tier node label (set in
# cluster/terraform/main/ovh-nodes.tf, keyed to the actual data-disk hardware),
# NOT by the class name or PVC size. Both keys AND together (same term), so a PVC
# here binds only on an OVH HIL node whose data disk is HDD (a KS-5). The zone key
# keeps this class OVH-scoped even if storage-tier is used elsewhere (e.g. wyrm2).
# See cluster/docs/ovh_storage_tiering.md.
allowedTopologies:
  - matchLabelExpressions:
      - key: topology.kubernetes.io/zone
        values:
          - hil-ovh
      - key: storage-tier
        values:
          - hdd
