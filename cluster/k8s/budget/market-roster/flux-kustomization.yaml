apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: budget-market-roster
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/budget/market-roster
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: budget-namespace
