# Fava serves the budget Beancount ledger that the exporter CronJob commits to the
# Forgejo budget-ledger repo. A git-sync sidecar keeps a local checkout fresh; Fava
# reads /ledger/current/main.beancount and auto-reloads on change. Access is gated
# by authentik (agentydragon-only) via the proxy outpost -- Fava has no native auth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fava
  namespace: budget
  labels:
    app.kubernetes.io/name: fava
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fava
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fava
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65533 # git-sync's default uid; Fava runs as the same uid to read the checkout
        runAsGroup: 65533
        fsGroup: 65533
      initContainers:
        # One-time clone so /ledger/current/main.beancount exists before Fava starts.
        - name: git-sync-init
          image: registry.k8s.io/git-sync/git-sync:v4.3.0
          args:
            - --repo=http://forgejo-http.forgejo:3000/budget-ledger/ledger.git
            - --root=/ledger
            - --link=current
            - --depth=1
            - --one-time
          env:
            - name: GITSYNC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: budget-ledger-git-creds
                  key: username
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: budget-ledger-git-creds
                  key: password
          volumeMounts:
            - name: ledger
              mountPath: /ledger
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.3.0
          args:
            - --repo=http://forgejo-http.forgejo:3000/budget-ledger/ledger.git
            - --root=/ledger
            - --link=current
            - --depth=1
            - --period=300s
          env:
            - name: GITSYNC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: budget-ledger-git-creds
                  key: username
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: budget-ledger-git-creds
                  key: password
          volumeMounts:
            - name: ledger
              mountPath: /ledger
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: fava
          image: docker.io/yegle/fava:latest
          command:
            - fava
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - /ledger/current/main.beancount
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: ledger
              mountPath: /ledger
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: ledger
          emptyDir: {}
