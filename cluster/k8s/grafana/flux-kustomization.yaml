apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clickhouse-grafana
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: clickhouse
      namespace: ducktape-flux
    - name: grafana-instance
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/grafana
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: clickhouse-grafana
    namespace: ducktape-flux
  timeout: 5m
  wait: true
