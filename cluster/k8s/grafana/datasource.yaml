apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: clickhouse
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  valuesFrom:
    - targetPath: secureJsonData.password
      valueFrom:
        secretKeyRef:
          name: clickhouse-grafana-credentials
          key: password
  datasource:
    name: AIQuota Analytics
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      host: clickhouse.clickhouse.svc.cluster.local
      port: 8123
      protocol: http
      username: grafana
      defaultDatabase: aiquota
      secure: false
      validateSql: true
      queryTimeout: 60
    secureJsonData:
      password: ${password}
