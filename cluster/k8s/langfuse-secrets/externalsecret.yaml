apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: langfuse
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: langfuse-secrets
    creationPolicy: Owner
  data:
    - secretKey: nextauth-secret
      remoteRef:
        key: kv/langfuse/secrets
        property: nextauth_secret
    - secretKey: salt
      remoteRef:
        key: kv/langfuse/secrets
        property: salt
    - secretKey: encryption-key
      remoteRef:
        key: kv/langfuse/secrets
        property: encryption_key
    - secretKey: postgres-password
      remoteRef:
        key: kv/langfuse/secrets
        property: postgres_password
    - secretKey: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      remoteRef:
        key: kv/langfuse/secrets
        property: project_public_key
    - secretKey: LANGFUSE_INIT_PROJECT_SECRET_KEY
      remoteRef:
        key: kv/langfuse/secrets
        property: project_secret_key
    - secretKey: LANGFUSE_INIT_USER_PASSWORD
      remoteRef:
        key: kv/langfuse/secrets
        property: admin_password
