apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs-lvm
  namespace: ducktape-flux
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openebs-lvm-localpv
      namespace: openebs
  interval: 10m
  path: ./cluster/k8s/openebs-lvm
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: openebs-lvm
    namespace: ducktape-flux
  timeout: 5m
  wait: true
