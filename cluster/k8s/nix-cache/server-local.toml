listen = "[::]:8080"

[storage]
type = "local"
path = "/data"

[database]
# URL comes from ATTIC_SERVER_DATABASE_URL.

[compression]
type = "zstd"

[chunking]
nar-size-threshold = 65536
min-size = 16384
avg-size = 65536
max-size = 262144

[garbage-collection]
interval = "30 days"

# The JWT signing key comes from ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64.
