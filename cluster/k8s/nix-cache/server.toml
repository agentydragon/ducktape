listen = "[::]:8080"

[storage]
type = "s3"
region = "us-east-1"
bucket = "attic"
# Public S3 gateway (not the internal seaweedfs-s3.svc). Attic presigns
# single-chunk NAR downloads against this endpoint via a 307 redirect; the host
# must be resolvable by external clients (CI), so it can't be a .svc name.
# Multi-chunk NARs stream through Attic regardless. Its own chunk I/O also
# routes here. The filer-backed native IAM identity is accepted by this gateway.

endpoint = "https://s3.allegedly.works"
# Credentials sourced from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars.

[database]
# url read from ATTIC_SERVER_DATABASE_URL env var (serde default)

[compression]
type = "zstd"

[chunking]
nar-size-threshold = 65536
min-size = 16384
avg-size = 65536
max-size = 262144

[garbage-collection]
interval = "30 days"

# [jwt.signing] intentionally omitted — read from
# ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64 env var (serde default)
