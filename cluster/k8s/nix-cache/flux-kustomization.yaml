apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nix-cache
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: nix-cache
    namespace: ducktape-flux
  path: ./cluster/k8s/nix-cache
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: attic
      namespace: nix-cache
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: github-secrets-sync-pat
      namespace: nix-cache
  dependsOn:
    - name: cnpg
      namespace: ducktape-flux
    - name: external-creds
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: cert-manager
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
