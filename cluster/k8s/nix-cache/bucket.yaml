# SeaweedFS bucket holding attic's NAR chunks. Replication is per-volume
# (defaultReplication "001" on the seaweedfs cluster) so this bucket is
# automatically backed by replicated storage across both OVH nodes.
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: attic
  namespace: nix-cache
spec:
  name: attic
  # Handing the existing (freshly emptied) bucket to this tenant-local CR —
  # same precedent as seaweedfs/registry-cache-bucket/bucket.yaml.
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  access:
    - user: attic
      actions: [Read, Write, List, Tagging]
