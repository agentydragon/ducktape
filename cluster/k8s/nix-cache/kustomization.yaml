apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # cdk8s-generated (cluster/cdk8s/nix_cache/attic.py) -- see cluster/docs/cdk8s.md.
  - attic.k8s.yaml
  - jwt-token.sops.yaml
  - cache-keys.sops.yaml
components:
  - ./image-pins

configMapGenerator:
  - name: attic-config
    namespace: nix-cache
    files:
      - server.toml
  - name: attic-rotators-config
    namespace: nix-cache
    files:
      - rotators.yaml
