apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - nix-cache.k8s.yaml
  - jwt-token.sops.yaml
  - cache-keys.sops.yaml
components:
  - ./image-pins
configMapGenerator:
  - name: attic-config
    namespace: nix-cache
    files:
      - server.toml
  - name: attic-rotators-config
    namespace: nix-cache
    literals:
      - |
        rotators.yaml=tokens:
          - name: wyrm2 attic reader
            sub: wyrm2
            validity: 1 year
            pull:
              - main
              - gaffer
            push: []
            destination:
              storage: sops
              sops_file: secrets/hosts/wyrm2-attic.yaml
          - name: rugged attic reader
            sub: rugged
            validity: 1 year
            pull:
              - main
              - gaffer
            push: []
            destination:
              storage: sops
              sops_file: secrets/hosts/rugged-attic.yaml
          - name: iguana attic reader
            sub: iguana
            validity: 1 year
            pull:
              - main
              - gaffer
            push: []
            destination:
              storage: sops
              sops_file: secrets/hosts/iguana-attic.yaml
          - name: atlas attic reader
            sub: atlas
            validity: 1 year
            pull:
              - main
              - gaffer
            push: []
            destination:
              storage: sops
              sops_file: secrets/hosts/atlas-attic.yaml
          - name: gecko attic reader
            sub: gecko
            validity: 1 year
            pull:
              - main
              - gaffer
            push: []
            destination:
              storage: sops
              sops_file: secrets/hosts/gecko-attic.yaml
          - name: agent-box attic reader
            sub: agent-box
            validity: 1 year
            pull:
              - main
              - gaffer
            push: []
            destination:
              storage: sops
              sops_file: secrets/hosts/agent-box-attic.yaml
          - name: claude-web attic reader
            sub: claude-web
            validity: 1 year
            pull:
              - main
              - gaffer
            push: []
            destination:
              storage: sops
              sops_file: secrets/claude-web-attic.yaml
          - name: haku attic reader
            sub: haku
            validity: 1 year
            pull:
              - main
              - gaffer
            push: []
            destination:
              storage: sops
              sops_file: secrets/haku-attic.yaml
          - name: ducktape CI attic writer (main)
            sub: ducktape-ci
            validity: 1 year
            pull:
              - main
              - gaffer
            push:
              - main
              - public
            destination:
              secret:
                namespace: nix-cache
                name: attic-ducktape-ci-writer
                key: attic_token
              notification:
                workspace: github-secrets-sync
                annotation_key: ducktape.allegedly.works/attic-token-version
              storage: kubernetes
          - name: ducktape CI attic reader
            sub: ducktape-ci-reader
            validity: 1 year
            pull:
              - main
              - gaffer
            push: []
            destination:
              secret:
                namespace: nix-cache
                name: attic-ducktape-ci-reader
                key: attic_token
              notification:
                workspace: github-secrets-sync
                annotation_key: ducktape.allegedly.works/attic-reader-token-version
              storage: kubernetes
          - name: gaffer CI attic writer
            sub: gaffer-ci
            validity: 1 year
            pull:
              - gaffer
            push:
              - gaffer
            destination:
              secret:
                namespace: nix-cache
                name: attic-gaffer-ci-writer
                key: attic_token
              notification:
                workspace: github-secrets-sync
                annotation_key: gaffer.allegedly.works/attic-token-version
              storage: mirrored
              sops_file: secrets/ci/attic-gaffer-writer.sops.yaml
        attic_namespace: nix-cache
        attic_deployment: deploy/attic
        server_config: /config/server.toml
        token_field: attic_token
        rotate_below_hours: 24
        git_remote: https://github.com/agentydragon/ducktape.git
        git_username: x-access-token
        git_clone_depth: 1
        sops_config: .sops.yaml
        git_author_name: attic-jwt-rotation
        git_author_email: noreply@allegedly.works
