apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres-cluster.yaml
  - forgejo-images-creds-eso.yaml
  - jwt-token.sops.yaml
  - cache-keys.sops.yaml
  - bucket.yaml
  - iam.yaml
  - s3-credentials.yaml
  - seaweed-reference-grant.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
