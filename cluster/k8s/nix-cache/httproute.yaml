  name: nix-cache
  namespace: nix-cache
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "cache.allegedly.works"
  rules:
    - backendRefs:
        - name: attic
          port: 8080
