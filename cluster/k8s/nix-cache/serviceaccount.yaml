apiVersion: v1
kind: ServiceAccount
metadata:
  name: attic-jwt-rotator
  namespace: nix-cache
  annotations:
    description: Runs the Attic JWT rotation CronJobs. RBAC is `pods/exec` scoped to the nix-cache namespace so the rotator can `kubectl exec deploy/attic -- atticadm make-token …` without ever holding the HS256 signing secret.
imagePullSecrets:
  - name: forgejo-images-creds
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: attic-jwt-rotator
  namespace: nix-cache
rules:
  # `kubectl exec` requires get on pods (to resolve deploy/attic to a Pod
  # name) plus create on pods/exec (to open the exec stream).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Resolving `deploy/attic` to a pod first reads the Deployment.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: attic-jwt-rotator
  namespace: nix-cache
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: attic-jwt-rotator
subjects:
  - kind: ServiceAccount
    name: attic-jwt-rotator
    namespace: nix-cache
