apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nix-cache
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/nix-cache/app
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: attic
      namespace: nix-cache
  dependsOn:
    - name: attic-db
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: cert-manager
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
