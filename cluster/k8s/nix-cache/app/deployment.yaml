apiVersion: apps/v1
kind: Deployment
metadata:
  name: attic
  namespace: nix-cache
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: attic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attic
    spec:
      # Co-located with SeaweedFS and attic-db on OVH kimsufi workers.
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      containers:
        - name: attic
          # TODO: Pin to a versioned tag once attic publishes semver releases.
          image: ghcr.io/zhaofengli/attic:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: ATTIC_SERVER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: attic-db-app
                  key: uri
            - name: ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64
              valueFrom:
                secretKeyRef:
                  name: attic-jwt-token
                  key: jwt-token
          envFrom:
            - secretRef:
                name: attic-s3-credentials
          args:
            - "-f"
            - "/config/server.toml"
            - "--mode"
            - "monolithic"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: attic-config
        - name: tmp
          emptyDir: {}
