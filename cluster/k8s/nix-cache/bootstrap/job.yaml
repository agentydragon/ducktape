apiVersion: batch/v1
kind: Job
metadata:
  name: attic-bootstrap-caches
  namespace: nix-cache
  annotations:
    description: Idempotently ensure required Attic caches (gaffer, …) exist.
    # Force Flux to recreate the Job when its hash (script content) changes.
    # Same pattern as cluster/k8s/atuin/user-provisioner/job.yaml.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: attic-bootstrap-caches
    spec:
      # Reuses the attic-jwt-rotator ServiceAccount (defined alongside the
      # rotation CronJobs) — same pods/exec RBAC for invoking atticadm
      # against deploy/attic. The bootstrap Job doesn't touch SOPS or git,
      # so it doesn't need the rotator's github-pat.
      serviceAccountName: attic-jwt-rotator
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: ghcr.io/agentydragon/attic-jwt-rotation:devel-20260504011152-2b39247 # {"$imagepolicy": "flux-system:attic-jwt-rotation"}
          command: ["/usr/bin/bash", "/scripts/bootstrap.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: attic-bootstrap-script
            defaultMode: 0o755
