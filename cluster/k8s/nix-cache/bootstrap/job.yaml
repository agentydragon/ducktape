apiVersion: batch/v1
kind: Job
metadata:
  name: attic-bootstrap-caches
  namespace: nix-cache
  annotations:
    description: Idempotently ensure required Attic caches (main, gaffer, public) exist and print their public keys.
    # Force Flux to recreate the Job when its hash (image or args) changes.
    # Same pattern as cluster/k8s/atuin/user-provisioner/job.yaml.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: attic-bootstrap-caches
    spec:
      # Reuses the attic-jwt-rotator ServiceAccount (defined alongside the
      # rotation CronJobs) — same pods/exec RBAC for invoking atticadm
      # against deploy/attic. The bootstrap subcommand doesn't touch SOPS or
      # git, so it doesn't need the rotator's github-pat.
      serviceAccountName: attic-jwt-rotator
      # Keep the registry credential explicit on the Pod. The Secret is
      # reflected into nix-cache; this avoids relying on ServiceAccount
      # admission timing for the image pull.
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: git.allegedly.works/ducktape-ci/attic-jwt-rotation:devel-20260901115745-93ff613 # {"$imagepolicy": "flux-system:attic-jwt-rotation"}
          args:
            - "bootstrap-caches"
            - "--cache=main"
            - "--cache=gaffer"
            - "--public-cache=public"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
