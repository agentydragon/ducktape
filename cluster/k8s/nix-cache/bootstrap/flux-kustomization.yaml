apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nix-cache-bootstrap
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/nix-cache/bootstrap
  prune: true
  wait: true
  dependsOn:
    - name: nix-cache
      namespace: ducktape-flux
