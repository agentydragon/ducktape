apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nix-cache-bootstrap
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/nix-cache/bootstrap
  prune: true
  wait: true
  dependsOn:
    - name: nix-cache
      namespace: flux-system
