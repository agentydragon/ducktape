apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: attic-db
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: nix-cache-db

    namespace: ducktape-flux
  path: ./cluster/k8s/nix-cache/db
  prune: true
  wait: true
  dependsOn:
    - name: nix-cache-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
