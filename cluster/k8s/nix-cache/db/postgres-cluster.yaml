apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: attic-db
  namespace: nix-cache
spec:
  instances: 2

  # CNPG 1.27+ kills isolated primaries by default (liveness probe).
  # Disable to prevent false positives from transient network blips.
  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    # One PostgreSQL instance per OVH kimsufi node for real HA.
    topologyKey: kubernetes.io/hostname
    # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
    # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
    # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  storage:
    storageClass: local-path-ovh
    size: 2Gi

  monitoring:
    # TODO: Migrate to manually managed PodMonitor (enablePodMonitor is deprecated).
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: attic
      owner: attic
      # CNPG auto-generates credentials in secret attic-db-app
