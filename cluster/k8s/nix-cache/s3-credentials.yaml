# S3Credentials owns the credential values; Flux owns only this target shell.
apiVersion: v1
kind: Secret
metadata:
  name: attic-s3-credentials
  namespace: nix-cache
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
type: Opaque
---
# Permit only the SeaweedFS operator's S3Credentials resource to populate
# Attic's dedicated S3 Secret across namespaces.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: attic-s3-credentials
  namespace: nix-cache
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: seaweedfs
  to:
    - group: ""
      kind: Secret
      name: attic-s3-credentials
