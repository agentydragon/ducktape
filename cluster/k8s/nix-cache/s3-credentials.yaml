# Tenant-local S3Credentials (upstream's default topology — matches
# cluster/k8s/seaweedfs/registry-cache-bucket/iam.yaml): the identity stays
# centralized in seaweedfs, but credentials mint straight into this namespace,
# so the resulting Secret needs no cross-namespace write/grant.
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: attic
  namespace: nix-cache
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  identityRef:
    name: attic
  secretRef:
    name: attic-s3-credentials
    accessKeyField: AWS_ACCESS_KEY_ID
    secretKeyField: AWS_SECRET_ACCESS_KEY
  reclaimPolicy: Retain
