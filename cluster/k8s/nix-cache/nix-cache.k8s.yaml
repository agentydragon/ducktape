apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: auto
    rbac.ducktape.io/agent-readable-logs: "true"
  name: nix-cache
spec: {}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: nix-cache
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: attic-db
  namespace: nix-cache
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: attic
      owner: attic
  instances: 3
  monitoring:
    enablePodMonitor: true
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: attic-db
  postgresql:
    parameters:
      synchronous_commit: "off"
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    resizeInUseVolumes: false
    size: 8Gi
    storageClass: piraeus-ssd-local
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for nix-cache/attic-db.
  name: nix-cache-db-backups
  namespace: nix-cache
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: nix-cache-db-backups
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: nix-cache-db-backups
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for nix-cache/attic-db.
  name: nix-cache-db-backups
  namespace: nix-cache
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: nix-cache-db-backups
  namespace: nix-cache
spec:
  identityRef:
    name: nix-cache-db-backups
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: nix-cache-db-backups-s3-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  annotations:
    description: SeaweedFS S3 destination for nix-cache/attic-db base backups and WAL.
  name: attic-db
  namespace: nix-cache
spec:
  configuration:
    data:
      compression: gzip
    destinationPath: s3://nix-cache-db-backups/
    endpointURL: http://seaweedfs-s3.seaweedfs.svc:8333
    s3Credentials:
      accessKeyId:
        key: AWS_ACCESS_KEY_ID
        name: nix-cache-db-backups-s3-credentials
      secretAccessKey:
        key: AWS_SECRET_ACCESS_KEY
        name: nix-cache-db-backups-s3-credentials
    wal:
      compression: gzip
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: attic-db
  namespace: nix-cache
spec:
  backupOwnerReference: self
  cluster:
    name: attic-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 54 1 * * *
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: attic's NAR chunks; replicated per volume by the SeaweedFS cluster's defaultReplication.
  name: attic
  namespace: nix-cache
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: attic
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: attic
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  annotations:
    description: attic's NAR chunks; replicated per volume by the SeaweedFS cluster's defaultReplication.
  name: attic
  namespace: nix-cache
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: attic
  namespace: nix-cache
spec:
  identityRef:
    name: attic
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: attic-s3-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attic
  namespace: nix-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: attic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attic
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - -f
            - /config/server.toml
            - --mode
            - monolithic
          env:
            - name: ATTIC_SERVER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: attic-db-app
            - name: ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64
              valueFrom:
                secretKeyRef:
                  key: jwt-token
                  name: attic-jwt-token
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: AWS_ACCESS_KEY_ID
                  name: attic-s3-credentials
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_SECRET_ACCESS_KEY
                  name: attic-s3-credentials
          image: ghcr.io/zhaofengli/attic:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          name: attic
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 50m
              memory: 1280Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /config
              name: config
              readOnly: true
            - mountPath: /tmp
              name: tmp
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - configMap:
            name: attic-config
          name: config
        - emptyDir: {}
          name: tmp
---
apiVersion: v1
kind: Service
metadata:
  name: attic
  namespace: nix-cache
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: attic
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nix-cache
  namespace: nix-cache
spec:
  hostnames:
    - cache.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: attic
          port: 8080
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: attic-ducktape-ci-writer
  namespace: nix-cache
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: attic-ducktape-ci-reader
  namespace: nix-cache
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: attic-gaffer-ci-writer
  namespace: nix-cache
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: attic-github-secrets-notification
rules:
  - apiGroups:
      - opentofu.upbound.io
    resourceNames:
      - github-secrets-sync
    resources:
      - workspaces
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: attic-ci-token-notification-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: attic-github-secrets-notification
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: attic-jwt-rotator
    namespace: nix-cache
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: nix-cache
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-secrets-sync-pat
  namespace: nix-cache
spec:
  data:
    - remoteRef:
        key: github-agentydragon-2
        property: token
      secretKey: token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: github-secrets-sync-pat
    template:
      type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    description: Runs the Attic JWT rotation CronJobs. RBAC is `pods/exec` scoped to the nix-cache namespace so the rotator can `kubectl exec deploy/attic -- atticadm make-token …` without ever holding the HS256 signing secret.
  name: attic-jwt-rotator
  namespace: nix-cache
imagePullSecrets:
  - name: forgejo-images-creds
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: attic-jwt-rotator
  namespace: nix-cache
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - attic-gaffer-ci-writer
      - attic-ducktape-ci-reader
      - attic-ducktape-ci-writer
    resources:
      - secrets
    verbs:
      - get
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: attic-jwt-rotator
  namespace: nix-cache
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: attic-jwt-rotator
subjects:
  - kind: ServiceAccount
    name: attic-jwt-rotator
    namespace: nix-cache
---
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    description: Rotates all Attic JWTs (per-host readers, claude-web reader, ducktape CI reader and writer, and gaffer CI writer tokens) defined in rotators.yaml. Hourly cron; per-token freshness check skips entries with >24h remaining, so a real mint runs ~once per token per year. See rotate.py.
  name: attic-jwt-rotation
  namespace: nix-cache
spec:
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        spec:
          automountServiceAccountToken: true
          containers:
            - args:
                - rotate
                - --config
                - /config/rotators.yaml
              env:
                - name: GIT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: token
                      name: github-secrets-sync-pat
              image: git.allegedly.works/ducktape-ci/attic-jwt-rotation:unset
              name: rotate
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - mountPath: /config
                  name: rotators-config
                  readOnly: true
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: attic-jwt-rotator
          volumes:
            - configMap:
                name: attic-rotators-config
              name: rotators-config
      ttlSecondsAfterFinished: 86400
  schedule: 30 * * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    description: Idempotently ensure required Attic caches (main, gaffer, public) exist and print their public keys.
    kustomize.toolkit.fluxcd.io/force: enabled
  name: attic-bootstrap-caches
  namespace: nix-cache
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: attic-bootstrap-caches
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - bootstrap-caches
            - --cache=main
            - --cache=gaffer
            - --public-cache=public
            - --keypair-dir=/secrets/cache-keys
          image: git.allegedly.works/ducktape-ci/attic-jwt-rotation:unset
          name: bootstrap
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /secrets/cache-keys
              name: cache-keys
              readOnly: true
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: attic-jwt-rotator
      volumes:
        - name: cache-keys
          secret:
            secretName: attic-cache-keys
