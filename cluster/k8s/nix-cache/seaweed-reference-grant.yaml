# Permit the tenant-local Bucket and S3Credentials to reference the SeaweedFS
# cluster in its namespace.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: nix-cache
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: nix-cache
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: nix-cache
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
