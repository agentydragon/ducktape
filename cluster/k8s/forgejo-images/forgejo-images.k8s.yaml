apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: Holds the shared credential for the ducktape-ci Forgejo registry tenant (CI-pushed in-cluster images) and its provisioning Terraform.
  name: forgejo-images
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: forgejo-images
  namespace: flux-system
spec:
  approvePlan: auto
  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "forgejo_images"
      }
  interval: 15m
  path: ./tf/gitops/forgejo-images
  refreshBeforeApply: true
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: tofu-state-db-credentials
  serviceAccountName: tf-runner
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: flux-system
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
