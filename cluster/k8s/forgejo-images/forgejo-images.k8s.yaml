apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: Holds the shared credential for the ducktape-ci Forgejo registry tenant (CI-pushed in-cluster images) and its provisioning Terraform.
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: "off"
  name: forgejo-images
spec: {}
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: forgejo-images
  namespace: flux-system
spec:
  approvePlan: auto
  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "forgejo_images"
      }
  interval: 15m
  path: ./tf/gitops/forgejo-images
  refreshBeforeApply: true
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: tofu-state-db-credentials
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
  serviceAccountName: tf-runner
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  vars:
    - name: webhook_host
      value: flux-webhook.allegedly.works
    - name: receiver_name
      value: receiver
    - name: receiver_namespace
      value: forgejo-images
    - name: webhook_token_secret
      value: webhook-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: flux-system
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: webhook-token
  namespace: forgejo-images
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webhook-token
  namespace: forgejo-images
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: webhook-token
  refreshPolicy: CreatedOnce
  target:
    name: webhook-token
    template:
      data:
        token: "{{ .password }}"
      type: Opaque
---
apiVersion: notification.toolkit.fluxcd.io/v1
