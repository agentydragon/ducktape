apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: Holds the shared credential for the ducktape-ci Forgejo registry tenant (CI-pushed in-cluster images) and its provisioning Terraform.
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: "off"
  name: forgejo-images
spec: {}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: flux-system
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: webhook-token
  namespace: forgejo-images
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webhook-token
  namespace: forgejo-images
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: webhook-token
  refreshPolicy: CreatedOnce
  target:
    name: webhook-token
    template:
      data:
        token: "{{ .password }}"
      type: Opaque
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: receiver
  namespace: forgejo-images
spec:
  resourceFilter: req.action == 'created' && req.package.type == 'container'
