    namespace: forgejo-images
    annotations:
        description: Shared credential for the ducktape-ci Forgejo registry tenant. username/password read by tf/gitops/forgejo-images; .dockerconfigjson is auto-reflected as a kubelet imagePullSecret to every namespace in the reflection-auto-namespaces list below, while flux-system uses its reflected copy for ImageRepository authentication. Reflector rather than an ExternalSecret against kubernetes-flux-system-secret-store, because that store grants a namespace read access to every Secret in flux-system; this grants one dockerconfigjson.
