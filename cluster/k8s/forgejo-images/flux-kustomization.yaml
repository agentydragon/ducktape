apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: ducktape-ci Forgejo registry tenant — shared credential (read by consumers, including flux-system, via per-namespace ExternalSecrets against kubernetes-forgejo-images-secret-store) + Terraform that provisions the Forgejo user.
  name: forgejo-images
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo
      namespace: ducktape-flux
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: forgejo-images
      namespace: flux-system
  interval: 10m
  path: ./cluster/k8s/forgejo-images
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: forgejo-images
    namespace: ducktape-flux
  timeout: 10m
  wait: true
