apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-images
  namespace: flux-system
  annotations:
    description: ducktape-ci Forgejo registry tenant — shared credential (reflected to flux-system + consumers) + Terraform that provisions the Forgejo user.
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/forgejo-images
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: forgejo-images
      namespace: flux-system
  dependsOn:
    - name: forgejo # Forgejo API must be up (provider target)
    - name: tofu-controller
    - name: tofu-state-db
    - name: reflector # mirrors forgejo-images-creds to flux-system + image consumers
