apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-images
  namespace: ducktape-flux
  annotations:
    description: ducktape-ci Forgejo registry tenant — shared credential (read by consumers, including flux-system, via per-namespace ExternalSecrets against kubernetes-forgejo-images-secret-store) + Terraform that provisions the Forgejo user.
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/forgejo-images
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: forgejo-images
      namespace: flux-system
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo # Forgejo API must be up (provider target)
      namespace: ducktape-flux
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
