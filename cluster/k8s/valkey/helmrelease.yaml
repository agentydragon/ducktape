---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ot-helm
  namespace: flux-system
spec:
  interval: 24h
  url: https://ot-container-kit.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: valkey-system
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: redis-operator
      version: "0.24.0"
      sourceRef:
        kind: HelmRepository
        name: ot-helm
        namespace: flux-system
  values:
    redisOperator:
      imageTag: v0.25.0
      initContainerImageTag: v0.25.0
    featureGates:
      GenerateConfigInInitContainer: true
