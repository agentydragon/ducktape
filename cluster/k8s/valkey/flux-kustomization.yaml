apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: valkey
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/valkey
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: valkey
    namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: redis-operator
      namespace: valkey-system
