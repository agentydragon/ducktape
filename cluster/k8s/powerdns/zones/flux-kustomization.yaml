---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: powerdns-zones
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/powerdns/zones
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-info
  # Health check ensures DNS zone is created before external-dns tries to manage records
  healthChecks:
    - apiVersion: dns.k8s.codesink.net/v1alpha1
      kind: ClusterZone
      name: allegedly-works
  dependsOn:
    - name: powerdns-operator
    - name: reflector
  timeout: 5m
