apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: powerdns
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/powerdns"
  prune: true
  wait: true
  dependsOn:
    - name: dns-system-namespace
    - name: powerdns-secrets # Wait for API key generation
    - name: reflector # Wait for Reflector to handle secret copying
    - name: powerdns-db # Wait for CNPG cluster ready and powerdns-db-pdns secret to exist
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: powerdns
      namespace: dns-system
