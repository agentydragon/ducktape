apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gaffer-private-source
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  path: ./cluster/k8s/gaffer-private-source
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: flux-image-automation-ghcr
    - name: tofu-controller
    - name: tofu-state-db
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: gaffer-private-flux
      namespace: flux-system
