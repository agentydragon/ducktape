apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gaffer-private-source
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: flux-image-automation-ghcr
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/gaffer-private-source
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
