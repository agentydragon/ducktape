apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  annotations:
    description: Private companion monorepo. Reconciled from main branch via the ducktape-automation GitHub App (also used to push image-pin commits back here).
  name: gaffer-private
  namespace: flux-system
spec:
  interval: 1m
  provider: github
  ref:
    branch: main
  secretRef:
    name: ducktape-automation-github-app
  url: https://github.com/agentydragon/gaffer-private.git
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  annotations:
    description: Sibling of `all-images` for the gaffer-private GitRepository. Watches ImagePolicies whose marker comments target gaffer-private's manifests and commits image-tag bumps back to gaffer-private/main.
  name: gaffer-images
  namespace: flux-system
spec:
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@allegedly.works
        name: flux-image-automation
      messageTemplate: |-
        chore: update images [skip ci]

        {{ range $resource, $changes := .Changed.Objects -}}
        {{ range $_, $change := $changes -}}
        {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{ end -}}
        {{ end -}}
    push:
      branch: main
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: gaffer-private
  update:
    path: ./k8s
    strategy: Setters
