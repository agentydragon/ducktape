# Holds the Claude and Codex OAuth auth files that CLIProxyAPI refreshes in place.
# Single replica (Recreate strategy) because refresh tokens are rotated by this one writer.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cli-proxy-api-data
  namespace: cli-proxy-api
spec:
  # TODO: this PVC is currently Bound on the pre-split storageClassName: seaweedfs-ovh.
  # That field is immutable, so Flux applying seaweedfs-ovh-hdd here is a no-op on the
  # live object until migrated via
  # <cluster/docs/runbooks/seaweedfs_pvc_storageclass_migration.md>.
  accessModes:
    - ReadWriteOnce
  storageClassName: seaweedfs-ovh-hdd
  resources:
    requests:
      storage: 1Gi
