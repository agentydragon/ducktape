apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cli-proxy-api-agent-rbac
  namespace: flux-system
  annotations:
    description: Agent RBAC for cli-proxy-api. Time-boxed log read so Codex auth failures can be diagnosed at their source. Lightweight — only RoleBindings.
spec:
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/cli-proxy-api/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: cli-proxy-api
    - name: claude-rbac
