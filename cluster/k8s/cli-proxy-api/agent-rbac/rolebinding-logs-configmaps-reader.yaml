# Log read for the namespace that owns every Codex OAuth session.
#
# Why: CLIProxyAPI is the only place that can explain a Codex auth failure, and
# its errors surface to users several layers away, stripped of cause. A live
# example: `public-coder-agent` returned "The AI service is temporarily
# overloaded", and LiteLLM relayed `auth_unavailable: no auth available
# (providers=codex, model=gpt-5.6-sol)` — with sol dead while luna and terra
# answered 200. Which of entitlement, token refresh, or upstream capacity caused
# it is only visible in this namespace's logs.
#
# CLIProxyAPI holds its own Codex OAuth session on a PVC, so treat these logs as
# potentially credential-bearing: this grant is deliberately time-boxed, and it
# does not include `secrets` (the session lives in `config.sops.yaml`, which
# stays unreadable).
#
# CLEANUP(added 2026-07-30): revoke by 2026-08-06, or sooner once the sol auth
#   failure is root-caused. Tracked for revert in #3559.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-logs-configmaps-reader
  namespace: cli-proxy-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logs-configmaps-reader
subjects:
  - kind: Group
    name: oidc-ksbx-groups:kubectl-sandbox-users
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: oidc-ksbx-groups:haku
    apiGroup: rbac.authorization.k8s.io
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - kind: ServiceAccount
    name: haku-claude
    namespace: haku-claude-sandbox
