# Gateway, LiteLLM, and AIQuota reach CLIProxyAPI; the backend authenticates requests.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cli-proxy-api-ingress
  namespace: cli-proxy-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cli-proxy-api
  ingress:
    # cilium-envoy hostNetwork traffic carries reserved:ingress identity. Preserves the
    # existing cli-proxy-api.allegedly.works /v1 HTTPRoute (httproute.yaml), which routes
    # straight to this Service, unauthenticated, for LiteLLM's model traffic.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8317"
              protocol: TCP
    # LiteLLM's codex-*/chatgpt-* upstreams (k8s/litellm/app/proxy-config.yaml) call the
    # in-cluster Service by cluster DNS, not through the Gateway.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: litellm
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "8317"
              protocol: TCP
    # aiquota retrieves Claude and Codex subscription usage through the authenticated
    # CLIProxyAPI management endpoint.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cli-proxy-api
            app.kubernetes.io/name: aiquota
      toPorts:
        - ports:
            - port: "8317"
              protocol: TCP
    # Kubelet readiness/liveness tcpSocket probes (deployment.yaml) originate from the
    # node host.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8317"
              protocol: TCP
