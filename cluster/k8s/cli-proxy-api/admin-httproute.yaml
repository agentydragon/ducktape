  namespace: cli-proxy-api
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "cli-proxy-api-admin.allegedly.works"
  rules:
    - backendRefs:
        - name: cli-proxy-api
          port: 8317
