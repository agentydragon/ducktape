# CLIProxyAPI: Anthropic Messages (/v1/messages) <-> ChatGPT/Codex subscription backend,
# with tool-call translation (function_call -> tool_use). Backs the `codex-claude` wrapper
# and owns the Claude/Codex OAuth sessions used by the CLIProxyAPI integration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli-proxy-api
  namespace: cli-proxy-api
  labels:
    app.kubernetes.io/name: cli-proxy-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cli-proxy-api
  # Recreate: single owner of the refresh-rotated OAuth tokens on the PVC.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cli-proxy-api
    spec:
      automountServiceAccountToken: false
      # No explicit zone nodeSelector: the PVC's seaweedfs-ovh StorageClass already
      # pins scheduling to topology.kubernetes.io/zone=hil-ovh via WaitForFirstConsumer
      # + allowedTopologies (cluster/k8s/seaweedfs-csi/sc-seaweedfs-ovh.yaml), and the
      # already-bound PV carries that same zone in its own nodeAffinity.
      # hil-ovh's only schedulable workers (ovh-ns103711, ovh-ns102453) run hot enough
      # that the descheduler's LowNodeUtilization plugin (k8s/descheduler/helmrelease.yaml)
      # evicts this pod roughly every 15 minutes for node overutilization. As the
      # single-writer, Recreate-strategy holder of the Codex OAuth refresh token on its
      # PVC, it can't tolerate that churn — each eviction breaks the auto-refresh worker's
      # session. Allow the zone's otherwise-idle control-plane nodes as real overflow
      # capacity instead of only ever bouncing between the two contended workers.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: init-auth-dir
          image: busybox:1.37
          command: [sh, -c, "mkdir -p /data/auth"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: cli-proxy-api
          # Pinned by digest (eceasy/cli-proxy-api is a third-party Docker Hub image with
          # no version-tag discipline). Bump by repulling :latest and re-pinning.
          # Bumped 2026-09-09: the prior pin (BuiltAt 2026-08-17, v7.2.135) predates
          # this image's management API/UI (/v0/management/*, /management.html) --
          # cli-proxy-api-admin.allegedly.works 404'd on /management.html and only
          # answered the plain /v1 banner. This digest is :latest as pushed 2026-09-08.
          image: eceasy/cli-proxy-api@sha256:3990e4de484ac5caac80164ee3a60d0ba521320dcda193a2ef71a5ad2e2c768b
          workingDir: /CLIProxyAPI
          # The image has CMD [./CLIProxyAPI] but no ENTRYPOINT, so k8s `args` alone would
          # replace the binary. Set `command` explicitly and pass -config via args.
          command: ["./CLIProxyAPI"]
          args: [-config, /config/config.yaml]
          env:
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cli-proxy-api-management
                  key: management-password
            # Startup log showed: "failed to prepare static directory for management
            # asset error=mkdir /config/static: read-only file system" -- by default the
            # app downloads its management.html UI asset into a `static/` dir next to the
            # config file, but /config is a read-only Secret mount here. Point it at the
            # writable data PVC instead so the download (and the UI it serves) succeeds.
            - name: MANAGEMENT_STATIC_PATH
              value: /data/management-static/management.html
          ports:
            - name: http
              containerPort: 8317
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8317
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8317
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          secret:
            secretName: cli-proxy-api-config
        - name: data
          persistentVolumeClaim:
            claimName: cli-proxy-api-data
