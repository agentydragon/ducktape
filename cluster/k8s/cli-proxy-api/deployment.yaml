# CLIProxyAPI: Anthropic Messages (/v1/messages) <-> ChatGPT/Codex subscription backend,
# with tool-call translation (function_call -> tool_use). Backs the `codex-claude` wrapper
# and owns the Claude/Codex OAuth sessions used by the CLIProxyAPI integration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli-proxy-api
  namespace: cli-proxy-api
  labels:
    app.kubernetes.io/name: cli-proxy-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cli-proxy-api
  # Recreate: single owner of the refresh-rotated OAuth tokens on the PVC.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cli-proxy-api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: forgejo-images-creds
      # No explicit zone nodeSelector: the PVC's seaweedfs-ovh StorageClass already
      # pins scheduling to topology.kubernetes.io/zone=hil-ovh via WaitForFirstConsumer
      # + allowedTopologies (cluster/k8s/seaweedfs-csi/sc-seaweedfs-ovh.yaml), and the
      # already-bound PV carries that same zone in its own nodeAffinity.
      # hil-ovh's only schedulable workers (ovh-ns103711, ovh-ns102453) run hot enough
      # that the descheduler's LowNodeUtilization plugin (k8s/descheduler/helmrelease.yaml)
      # evicts this pod roughly every 15 minutes for node overutilization. As the
      # single-writer, Recreate-strategy holder of the Codex OAuth refresh token on its
      # PVC, it can't tolerate that churn — each eviction breaks the auto-refresh worker's
      # session. Allow the zone's otherwise-idle control-plane nodes as real overflow
      # capacity instead of only ever bouncing between the two contended workers.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: init-auth-dir
          image: busybox:1.37
          command: [sh, -c, "mkdir -p /data/auth"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: cli-proxy-api
          image: git.allegedly.works/ducktape-ci/cli-proxy-api:devel-20260909225434-a464157 # {"$imagepolicy": "flux-system:cli-proxy-api"}
          args: [-config, /config/config.yaml]
          env:
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cli-proxy-api-management
                  key: management-password
            - name: MANAGEMENT_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: cli-proxy-api-admin-oidc
                  key: MANAGEMENT_OIDC_ISSUER
            - name: MANAGEMENT_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cli-proxy-api-admin-oidc
                  key: MANAGEMENT_OIDC_CLIENT_ID
            - name: MANAGEMENT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cli-proxy-api-admin-oidc
                  key: MANAGEMENT_OIDC_CLIENT_SECRET
            - name: MANAGEMENT_OIDC_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: cli-proxy-api-admin-oidc
                  key: MANAGEMENT_OIDC_REDIRECT_URL
            - name: MANAGEMENT_OIDC_ALLOWED_SUBJECTS
              valueFrom:
                secretKeyRef:
                  name: cli-proxy-api-admin-oidc
                  key: MANAGEMENT_OIDC_ALLOWED_SUBJECTS
          ports:
            - name: http
              containerPort: 8317
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8317
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8317
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          secret:
            secretName: cli-proxy-api-config
        - name: data
          persistentVolumeClaim:
            claimName: cli-proxy-api-data
