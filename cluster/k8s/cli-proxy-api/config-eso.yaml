# CLIProxyAPI requires a single config file. ESO renders the API key from the
# SOPS-managed client-key Secret, so this template remains safe to review and edit.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cli-proxy-api-config
  namespace: cli-proxy-api
  annotations:
    description: >-
      CLIProxyAPI config.yaml rendered from the client-key Secret. Retry an upstream stream up
      to three times only before its first response byte reaches the caller. Remote management
      is enabled (see README.md "Remote recovery") and reachable only through the SSO-gated
      cli-proxy-api-admin.allegedly.works route.
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-cli-proxy-api-secret-store
    kind: ClusterSecretStore
  target:
    name: cli-proxy-api-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          host: "0.0.0.0"
          port: 8317
          auth-dir: "/data/auth"
          api-keys:
            - "{{ .client_key }}"
          debug: false
          streaming:
            bootstrap-retries: 3
          # Verified against upstream config.example.yaml (router-for-me/CLIProxyAPI):
          # allow-remote lifts the localhost-only restriction on the management API/UI
          # (GET/POST /v0/management/*, served on the same port). The MANAGEMENT_PASSWORD
          # env var (deployment.yaml; remote-management.secret-key) is unconditionally
          # required regardless of this flag; allow-remote only changes who may reach the
          # check. Public reachability is additionally gated by Authentik SSO — see
          # README.md "Remote recovery" and
          # cluster/k8s/authentik/proxy-routes/cli-proxy-api-admin-httproute.yaml.
          remote-management:
            allow-remote: true
  data:
    - secretKey: client_key
      remoteRef:
        key: cli-proxy-api-client-key
        property: client-key
