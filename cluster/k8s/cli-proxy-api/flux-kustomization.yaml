apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cli-proxy-api
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/cli-proxy-api
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: gateway
    - name: cert-manager-environment
