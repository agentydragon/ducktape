# HTTPRoute for Grocy via Authentik proxy outpost.
# Traffic flows: Gateway → outpost (auth) → grocy backend.
# The outpost service (ak-outpost-grocy-outpost) is auto-created by Authentik
# when the blueprint deploys the outpost.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grocy
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "grocy.allegedly.works"
  rules:
    - backendRefs:
        - name: ak-outpost-grocy-outpost
          port: 9000
