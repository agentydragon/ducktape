apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: atuin-db
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: atuin-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/atuin/db
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: atuin-db
    namespace: ducktape-flux
  timeout: 5m
  wait: true
