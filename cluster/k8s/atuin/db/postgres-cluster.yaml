apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: atuin-db
  namespace: atuin
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  storage:
    storageClass: local-path-ovh
    size: 2Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: atuin
      owner: atuin
      # CNPG auto-generates credentials in secret atuin-db-app
