apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: atuin
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: cert-manager-issuer-config
      namespace: ducktape-flux
    - name: atuin-namespace
      namespace: ducktape-flux
    - name: atuin-db
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: cert-manager-environment
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/atuin/app
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: atuin
    namespace: ducktape-flux
  timeout: 5m
  wait: true
