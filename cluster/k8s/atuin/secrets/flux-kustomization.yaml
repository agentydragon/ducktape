apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: atuin-secrets
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/atuin/secrets
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: atuin-secrets
    namespace: ducktape-flux
  timeout: 10m
  dependsOn:
    - name: atuin-namespace
      namespace: ducktape-flux
