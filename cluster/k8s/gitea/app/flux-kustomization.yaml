apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitea
  namespace: flux-system
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/gitea/app
  prune: true
  wait: true
  # Health check ensures Gitea is fully operational with SSO
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gitea
      namespace: gitea
  dependsOn:
    - name: gitea-namespace
    - name: gitea-db
    - name: gateway
    - name: cert-manager
    - name: vault
    - name: gitea-secrets
    - name: authentik # Wait for Authentik worker to apply SSO blueprints
    - name: authentik-blueprint-gitea-secret # Wait for OAuth secret to be synced from Vault
    # Gitea validates OIDC at init time (configure-gitea init container fetches discovery URL).
    # Other SSO apps (Harbor, Matrix, Grafana) validate lazily at first login, so they don't need this.
    - name: external-dns
