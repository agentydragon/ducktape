apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: cnpg
  namespace: ducktape-flux
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: ducktape
      namespace: ducktape-flux
  artifacts:
    - name: cnpg
      originRevision: "@repo"
      copy:
        - from: "@repo/cluster/k8s/cnpg/**"
          to: "@artifact/cluster/k8s/cnpg/"
          # Root Flux owns the consumer declaration, not its own artifact.
          exclude:
            - flux-kustomization.yaml
