apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clickhouse-grafana
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/analytics/grafana
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 5m
  wait: true
  dependsOn:
    - name: clickhouse
      namespace: ducktape-flux
    - name: grafana-instance
      namespace: ducktape-flux
