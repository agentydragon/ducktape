apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-crds
  namespace: ducktape-flux
spec:
  interval: 1h
  path: ./deploy/crds
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: external-secrets-source
    namespace: ducktape-flux
  timeout: 2m
  wait: true
