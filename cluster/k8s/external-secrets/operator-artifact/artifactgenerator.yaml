apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: external-secrets-operator
  namespace: ducktape-flux
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: ducktape
      namespace: ducktape-flux
  artifacts:
    - name: external-secrets-operator
      originRevision: "@repo"
      copy:
        - from: "@repo/cluster/k8s/external-secrets/operator/**"
          to: "@artifact/cluster/k8s/external-secrets/operator/"
          # Root Flux owns the consumer declaration, not its own artifact.
          exclude:
            - flux-kustomization.yaml
