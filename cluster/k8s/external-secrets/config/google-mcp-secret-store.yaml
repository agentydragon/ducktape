apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-google-mcp-secret-store
spec:
  # google-mcp mints its own caller-facing bearer (cluster/cdk8s/google_mcp.py); only
  # agentplane-staging's Action Service (the only caller) reads a copy.
  conditions:
    - namespaces: [agentplane-staging]
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: google-mcp
