apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-forgejo-images-secret-store
spec:
  # Every namespace that pulls a private git.allegedly.works/ducktape-ci/* image
  # reads the source Secret through here via its own ExternalSecret (named
  # forgejo-images-creds-eso.yaml, next to that namespace's other manifests) —
  # this replaced the old emberstack-reflector fan-out on
  # cluster/k8s/forgejo-images/registry-creds.sops.yaml, which required
  # SOPS-decrypting a shared ciphertext file to add a namespace. Keep this list
  # to genuine consumers.
  conditions:
    - namespaces:
        - activitywatch
        - agent-workspaces
        - agentplane-staging
        - agentplane-testing
        - agents-infra
        - airlock
        - cli-proxy-api
        - cpap-sync
        - flux-system
        - github-api-proxy
        - grocy-sf
        - grocy-vallejo
        - ha-mcp
        - haku-console
        - haku-egress-proxy
        - haku-mailbox
        - haku-openclaw-spike
        - home-assistant
        - inventree
        - litellm
        - loki-read-proxy
        - manifold-mcp
        - matrix
        - monitoring
        - nix-cache
        - osm-mcp
        - plaid-mcp
        - postscanmail-mcp
        - props
        - public-coder-agent
        - sdr
        - study-casino
        - tana-mcp
        - wayback-cache
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: forgejo-images
