apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-forgejo-images-secret-store
spec:
  # A namespace that only wants the forgejo-images-creds pull secret and nothing
  # else from forgejo-images belongs here, not on the reflector annotations in
  # cluster/k8s/forgejo-images/registry-creds.sops.yaml (which grants any
  # namespace on that list a plain kubelet imagePullSecret, and requires
  # SOPS-decrypting the source Secret to add one). Keep this list minimal.
  conditions:
    - namespaces:
        - claude-sandbox
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: forgejo-images
