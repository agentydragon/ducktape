apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-airlock-secret-store
spec:
  # Airlock brokers short-lived OAuth access tokens; the agentplane-staging egress proxy
  # (via its isolated credentials namespace) and google-mcp (the write-scoped Google Gmail/Calendar MCP backend,
  # cluster/cdk8s/google_mcp.py) consume them. See the header of external-secrets-config.yaml
  # for why an absent `conditions` is a cluster-wide read path.
  conditions:
    - namespaces: [agentplane-staging-egress-credentials, google-mcp]
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: airlock
