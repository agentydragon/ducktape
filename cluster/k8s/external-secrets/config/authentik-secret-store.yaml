# ESO Kubernetes-provider store reading Secrets from the authentik namespace, which
# holds every Authentik-managed provider's OAuth client credentials and other
# sensitive material. Keep `conditions` to exactly the namespaces that need one
# specific, narrowly-scoped credential -- this store's remote namespace is far more
# sensitive than most, so an omitted or careless addition here is a cluster-wide read
# of every Authentik client secret, not just one.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-authentik-secret-store
spec:
  conditions:
    # authentik-jwt-rotation (agents-infra): mints the grocy-sf-readonly agentplane
    # egress credential from grocy-mcp-oidc-sf's client_id/client_secret -- the same
    # credentials the grocy-mcp-sf MCP server itself uses to log in.
    - namespaces:
        - agents-infra
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: authentik
