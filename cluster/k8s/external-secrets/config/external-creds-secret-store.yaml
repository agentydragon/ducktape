apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-external-creds-secret-store
spec:
  # Source-side RoleBindings remain authoritative. Keep this defense-in-depth
  # list equal to the namespaces approved by external-creds grants.
  conditions:
    - namespaces:
        - agentplane-staging
        - agents-infra
        - flux-system
        - haku-console
        - haku-egress-proxy
        - litellm
        - monitoring
        - nix-cache
        - public-coder-agent
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      # Referent authentication resolves this identity in each consuming
      # ExternalSecret's namespace. Access still requires a source-side grant.
      auth:
        serviceAccount:
          name: external-creds-reader
      remoteNamespace: ducktape-flux
