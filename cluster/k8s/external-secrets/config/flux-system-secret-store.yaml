# ESO Kubernetes-provider store reading Secrets from the flux-system namespace.
# Used to mirror rotator-published tokens (authentik-jwt-rotation k8s_secret outputs)
# into consumer namespaces without coupling distribution to the rotator. The ESO
# ServiceAccount already has cluster-wide secret read.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-flux-system-secret-store
spec:
  # Widest store in the cluster: flux-system holds the GitHub App, four PATs,
  # the AWS Route 53 credentials and ci-age-key, so an absent `conditions`
  # here is a cluster-wide read path to all of them. Keep this list minimal.
  #
  # Before adding a namespace, check what it actually needs. A namespace that
  # only wants the forgejo-images-creds pull secret belongs on the reflector
  # annotations in cluster/k8s/forgejo-images/registry-creds.sops.yaml instead —
  # that grants one dockerconfigjson, where an entry here grants every Secret in
  # flux-system. haku-egress-proxy, haku-openclaw-spike and osm-mcp were each on
  # this list for exactly that reason and have moved.
  conditions:
    - namespaces:
        # alloy-otlp-bearer (ClusterExternalSecret, all three)
        - claude-sandbox
        - haku-claude-sandbox
        # also haku-mail-token, and forgejo-images-creds — the last of which
        # stays on ESO only because the two above already put it here.
        - haku-sandbox
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: flux-system
