# Every ClusterSecretStore here declares `conditions`. Without it a store is
# usable from ANY namespace, so an ExternalSecret added anywhere can pull any
# Secret out of the store's remoteNamespace — and the ESO ServiceAccount holds
# cluster-wide secret read, so the store, not RBAC, is the only thing bounding
# that. Keep each list to the namespaces that actually hold a consuming
# ExternalSecret — ESO refuses to reconcile into any namespace not listed here,
# so an omission shows up as a failing ExternalSecret. That every store declares
# `conditions` at all is enforced at admission by the
# `require-secret-store-conditions` Kyverno policy.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-openhands-secret-store
spec:
  conditions:
    - namespaces: [claude-sandbox, litellm, openhands]
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: openhands
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-cli-proxy-api-secret-store
spec:
  conditions:
    - namespaces: [cli-proxy-api, litellm]
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: cli-proxy-api
