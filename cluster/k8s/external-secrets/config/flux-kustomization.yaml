apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 30s
  path: ./cluster/k8s/external-secrets/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true
  # Health check ensures ClusterSecretStores are ready before dependents.
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: kubernetes-secret-store
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: kubernetes-openshell-system-secret-store
  dependsOn:
    - name: external-secrets-operator
      namespace: flux-system
    - name: openshell-namespace
      namespace: flux-system
