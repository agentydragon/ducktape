apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 30s
  path: ./cluster/k8s/external-secrets/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true
  # Health check ensures ClusterSecretStores are ready before dependents. Any one
  # store stands in for the set: they are applied by this Kustomization together,
  # so one reaching Valid means the operator is reconciling them. This was
  # kubernetes-secret-store until that store was deleted as unused.
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: kubernetes-flux-system-secret-store
  dependsOn:
    - name: external-secrets-operator
      namespace: flux-system
