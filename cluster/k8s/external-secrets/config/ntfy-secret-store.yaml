apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-ntfy-secret-store
spec:
  # This store is intentionally readable only by ExternalSecrets in the ntfy,
  # flux-system, and monitoring namespaces. The source Secret contains both
  # the Android credential and the Alertmanager/Flux publishing credential.
  conditions:
    - namespaces: [ntfy, flux-system, monitoring]
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: ntfy
