apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-claude-sandbox-secret-store
spec:
  # claude-sandbox holds shared agent credentials that other agent namespaces
  # read (see agents/shared-secrets/). CLEANUP(added 2026-08-04): drop
  # `agent-lab` once that time-boxed namespace is removed.
  conditions:
    - namespaces: [agent-lab, haku-egress-proxy, haku-sandbox, public-coder-agent]
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: claude-sandbox
