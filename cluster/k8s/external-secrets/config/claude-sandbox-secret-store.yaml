apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-claude-sandbox-secret-store
spec:
  # claude-sandbox holds shared agent credentials that other agent namespaces
  # read (see agents/shared-secrets/). haku-console reads the shared github-token
  # into its egress credential registry (#4942): the trusted Console now holds the
  # credential the retiring iron fence used to substitute.
  conditions:
    - namespaces: [haku-console, haku-egress-proxy, haku-sandbox, public-coder-agent]
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: claude-sandbox
