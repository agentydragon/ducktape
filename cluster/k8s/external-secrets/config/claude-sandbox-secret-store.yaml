apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-claude-sandbox-secret-store
spec:
  # claude-sandbox holds shared agent credentials that other agent namespaces
  # read. The GitHub PAT uses dedicated per-credential stores from external-creds;
  # this broad store remains only for the AnkiWeb credential.
  conditions:
    - namespaces: [haku-sandbox]
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: claude-sandbox
