apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: external-secrets-config
  namespace: ducktape-flux
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: ducktape
      namespace: ducktape-flux
  artifacts:
    - name: external-secrets-config
      originRevision: "@repo"
      copy:
        - from: "@repo/cluster/k8s/external-secrets/config/**"
          to: "@artifact/cluster/k8s/external-secrets/config/"
          exclude:
            - flux-kustomization.yaml
