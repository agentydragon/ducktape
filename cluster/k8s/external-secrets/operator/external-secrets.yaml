---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets-system
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets-system
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: external-secrets
      version: "2.0.1"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets-system
  values:
    # CRDs installed separately via external-secrets-crds Kustomization
    # This ensures kustomize-controller has CRDs in its cache
    installCRDs: false

    # Controller configuration
    replicaCount: 1
    concurrent: 8

    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi

    serviceMonitor:
      enabled: true
      namespace: monitoring
      additionalLabels:
        release: kube-prometheus-stack

    # Service account used by the Kubernetes-provider ClusterSecretStores to read
    # secrets from authentik / openhands.
    serviceAccount:
      create: true
      name: external-secrets

    # Webhook configuration using cert-manager for certificates
    webhook:
      create: true
      port: 9443
      certManager:
        enabled: true
        cert:
          issuerRef:
            group: cert-manager.io
            kind: Issuer
            name: external-secrets-selfsigned-issuer

    # Disable cert-controller since we're using cert-manager
    certController:
      create: false
