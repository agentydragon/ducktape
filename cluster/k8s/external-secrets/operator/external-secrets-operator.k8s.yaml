apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets-system
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets-system
spec:
  chart:
    spec:
      chart: external-secrets
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets-system
      version: 2.10.0
  install:
    remediation:
      retries: 3
  interval: 15m
  values:
    certController:
      create: false
    concurrent: 8
    installCRDs: false
    leaderElect: true
    priorityClassName: system-cluster-critical
    replicaCount: 2
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    serviceAccount:
      create: true
      name: external-secrets
    serviceMonitor:
      additionalLabels:
        release: kube-prometheus-stack
      enabled: true
      namespace: monitoring
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    webhook:
      certManager:
        cert:
          issuerRef:
            group: cert-manager.io
            kind: Issuer
            name: external-secrets-selfsigned-issuer
        enabled: true
      create: true
      port: 9443
      priorityClassName: system-cluster-critical
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
