---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 24h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.27.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  values:
    # The operator backs two failurePolicy: Fail webhooks (Cluster, Backup,
    # ScheduledBackup), so while it is down those writes are rejected outright — and
    # it is the operator reconciling every Postgres cluster here. Same treatment as
    # the other blocking-webhook backends.
    #
    # This is the operator Deployment only. Database placement is unaffected: each
    # Cluster carries its own affinity (docs/cnpg_conventions.md), and nothing here
    # would put Postgres on a control-plane node.
    priorityClassName: system-cluster-critical
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
        operator: Exists
