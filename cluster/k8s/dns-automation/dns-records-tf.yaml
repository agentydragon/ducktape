apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: dns-records
  namespace: flux-system
spec:
  interval: 15m
  path: ./cluster/terraform/gitops/dns-records
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  serviceAccountName: tf-runner
  approvePlan: "auto"

  backendConfig:
    customConfiguration: |
      backend "kubernetes" {
        secret_suffix = "dns-records"
        namespace     = "flux-system"
      }

  # Static variables
  vars:
    - name: route53_zone_id
      value: "Z02901943N8ZFQFOD9P5I"

  # AWS credentials as environment variables
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: aws-route53-credentials
