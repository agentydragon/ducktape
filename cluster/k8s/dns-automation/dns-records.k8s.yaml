apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: dns-records
  namespace: flux-system
spec:
  approvePlan: auto
  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "dns_records"
      }
  interval: 15m
  path: ./tf/gitops/dns-records
  refreshBeforeApply: true
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: tofu-state-db-credentials
      envFrom:
        - secretRef:
            name: aws-route53-credentials
  serviceAccountName: tf-runner
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  vars:
    - name: route53_zone_id
      value: Z02901943N8ZFQFOD9P5I
    - name: public_nodes
      value:
        ovh-ns102453:
          public_ip: 147.135.37.175
          role: worker
        ovh-ns103656:
          public_ip: 147.135.39.162
          role: control-plane
        ovh-ns103711:
          public_ip: 147.135.39.176
          role: worker
        ovh-ns104952:
          public_ip: 147.135.104.5
          role: control-plane
        ovh-ns104963:
          public_ip: 147.135.104.16
          role: control-plane
