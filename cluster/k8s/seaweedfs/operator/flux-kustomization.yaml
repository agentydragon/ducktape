apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs-operator
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/seaweedfs/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: seaweedfs-namespace
      namespace: flux-system
  wait: true
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: seaweedfs-operator
      namespace: seaweedfs
