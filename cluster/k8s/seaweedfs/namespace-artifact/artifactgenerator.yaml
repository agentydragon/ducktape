apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: seaweedfs-namespace
  namespace: ducktape-flux
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: ducktape
      namespace: ducktape-flux
  artifacts:
    - name: seaweedfs-namespace
      originRevision: "@repo"
      copy:
        - from: "@repo/cluster/k8s/seaweedfs/namespace/**"
          to: "@artifact/cluster/k8s/seaweedfs/namespace/"
          # Root Flux owns the consumer declaration, not its own artifact.
          exclude:
            - flux-kustomization.yaml
