apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs-authentik-db-backups-bucket
  namespace: ducktape-flux
  annotations:
    description: Provisions the private SeaweedFS S3 bucket and credentials for Authentik CNPG backups.
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/seaweedfs/authentik-db-backups-bucket
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: seaweedfs-authentik-db-backups-bucket
    namespace: ducktape-flux
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: authentik-db-backups
      namespace: seaweedfs
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Identity
      name: authentik-db-backups
      namespace: seaweedfs
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: authentik-db-backups
      namespace: seaweedfs
  dependsOn:
    - name: seaweedfs-cluster
      namespace: ducktape-flux
    - name: authentik-namespace
      namespace: ducktape-flux
