apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: registry-cache
  namespace: oci-cache
spec:
  name: registry-cache
  # The existing cache bucket is being handed to the tenant-local CR.
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  reclaimPolicy: Retain
  access:
    - user: registry-cache
      actions: [Read, Write, List, Tagging]
