# S3Credentials populates its target rather than creating it. Keep the empty
# Secret declaratively owned; the SeaweedFS operator owns the credential data.
apiVersion: v1
kind: Secret
metadata:
  name: public-coder-agent-volsync-s3
  namespace: public-coder-agent
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
type: Opaque
