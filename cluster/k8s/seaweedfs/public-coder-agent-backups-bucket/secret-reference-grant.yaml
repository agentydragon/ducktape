# The SeaweedFS operator owns S3Credentials in its own namespace, while this
# backup credential must be delivered directly to the workload namespace.
# Permit only that cross-namespace Secret reference.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: public-coder-agent-volsync-s3
  namespace: public-coder-agent
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: seaweedfs
  to:
    - group: ""
      kind: Secret
      name: public-coder-agent-volsync-s3
