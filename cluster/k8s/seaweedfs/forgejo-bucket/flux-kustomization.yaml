apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs-forgejo-bucket
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/seaweedfs/forgejo-bucket
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: seaweedfs-forgejo-bucket
    namespace: ducktape-flux
  dependsOn:
    - name: seaweedfs-cluster
      namespace: ducktape-flux
  # Legacy owner retained during the Forgejo storage ownership handoff. The
  # new Forgejo Kustomization owns the replacement Secret and adopted Bucket;
  # this legacy Kustomization must not block that rollout on its old failed
  # S3Credentials resource. Cleanup follows live verification.
  wait: false
  timeout: 5m
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: forgejo
      namespace: seaweedfs
