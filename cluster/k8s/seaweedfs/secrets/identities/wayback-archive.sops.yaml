    refreshInterval: 1m
    secretStoreRef:
        kind: SecretStore
        name: seaweedfs-identities
    target:
        name: s3-identity-wayback-archive-json
        template:
            type: Opaque
            data:
                identity: |
                    {"name":"{{ .name }}",
                     "credentials":[{"accessKey":"{{ .accessKey }}","secretKey":"{{ .secretKey }}"}],
                     "actions":[{{- $first := true -}}
                       {{- range splitList "," .actions -}}
                       {{- if not $first }},{{ end -}}"{{ . }}"{{- $first = false -}}
