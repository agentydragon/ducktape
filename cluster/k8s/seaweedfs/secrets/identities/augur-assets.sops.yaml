        seaweedfs.io/role: s3-identity-json
spec:
    refreshInterval: 1m
    secretStoreRef:
        kind: SecretStore
        name: seaweedfs-identities
    target:
        name: s3-identity-augur-assets-json
        template:
            type: Opaque
            data:
                identity: |
                    {"name":"{{ .name }}",
                     "credentials":[{"accessKey":"{{ .accessKey }}","secretKey":"{{ .secretKey }}"}],
                     "actions":[{{- $first := true -}}
                       {{- range splitList "," .actions -}}
                       {{- if not $first }},{{ end -}}"{{ . }}"{{- $first = false -}}
