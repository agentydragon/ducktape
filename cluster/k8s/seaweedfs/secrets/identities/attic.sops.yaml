# SeaweedFS s3 identity for "attic".
# Scoped to the attic bucket (declared by Bucket CR in
# cluster/k8s/nix-cache/app/bucket.yaml). The attic server (nix-cache ns) consumes
# the reflected Secret for its S3 backend credentials. Brought in line with the
# other tenants: previously a hand-rolled cred in nix-cache/app that registered no
# SeaweedFS identity, so it didn't survive the S3 rebuild (InvalidAccessKeyId).
apiVersion: v1
kind: Secret
metadata:
    name: s3-identity-attic
    namespace: seaweedfs
    labels:
        seaweedfs.io/role: s3-identity
    annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: nix-cache
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: nix-cache
type: Opaque
stringData:
    name: attic
    actions: Read:attic,Write:attic,List:attic,Tagging:attic
    accessKey: ENC[AES256_GCM,data:itrrw4lyWDz7F0ShJjL/CSgudtY=,iv:+oQQvxkyUi2ZUV76ueKie5G0fzjR822Xonl41x0xDxI=,tag:PveoryNJ88XlYED+vTB+/w==,type:str]
