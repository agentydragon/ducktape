# RBAC for the seaweedfs-identities SecretStore. The ESO operator
# authenticates as this ServiceAccount when reading source Secrets
# from this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: seaweedfs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-reader
  namespace: seaweedfs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-reader
  namespace: seaweedfs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-reader
subjects:
  - kind: ServiceAccount
    name: eso-reader
    namespace: seaweedfs
