apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # ESO infrastructure for per-tenant identity assembly. The SecretStore stays
  # hand-written (no namespaced SecretStore binding); the rest is cdk8s-generated
  # (cluster/cdk8s/seaweedfs/s3_config.py) -- see cluster/docs/cdk8s.md.
  - secretstore.yaml
  - s3-config.k8s.yaml
  # Per-tenant credentials. Legacy entries also contain an ExternalSecret that
  # renders static gateway JSON. Migrated entries contain only the SOPS Secret;
  # their S3Identity/S3Credentials CRs live with the corresponding Bucket CR.
  - identities/admin.sops.yaml
