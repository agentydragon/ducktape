apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # ESO infrastructure for per-tenant identity assembly.
  - secretstore.yaml
  - eso-reader-rbac.yaml
  - externalsecret-s3-config.yaml
  # Per-tenant credentials. Legacy entries also contain an ExternalSecret that
  # renders static gateway JSON. Migrated entries contain only the SOPS Secret;
  # their S3Identity/S3Credentials CRs live with the corresponding Bucket CR.
  - identities/admin.sops.yaml
  - identities/attic.sops.yaml
  - identities/augur-assets.sops.yaml
  - identities/forgejo.sops.yaml
  - identities/langfuse.sops.yaml
  - identities/listing-monitor-captures.sops.yaml
  - identities/loki.sops.yaml
  - identities/tempo.sops.yaml
  - identities/mimir.sops.yaml
  - identities/registry-cache.sops.yaml
  - identities/wayback-archive.sops.yaml
  - identities/public-coder-agent-archive.sops.yaml
