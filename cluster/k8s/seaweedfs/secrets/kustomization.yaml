apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # ESO infrastructure for per-tenant identity assembly.
  - secretstore.yaml
  - eso-reader-rbac.yaml
  - externalsecret-s3-config.yaml
  # Per-tenant identities. Each is an s3-identity Secret (name/actions plaintext,
  # accessKey/secretKey SOPS-encrypted) plus an ExternalSecret that assembles it
  # into the seaweedfs-identities SecretStore the S3 gateway reads.
  - identities/admin.sops.yaml
  - identities/attic.sops.yaml
  - identities/augur-assets.sops.yaml
  - identities/forgejo.sops.yaml
  - identities/langfuse.sops.yaml
  - identities/listing-monitor-captures.sops.yaml
  - identities/loki.sops.yaml
  - identities/tempo.sops.yaml
  - identities/mimir.sops.yaml
