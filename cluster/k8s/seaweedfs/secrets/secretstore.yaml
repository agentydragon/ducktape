# In-namespace SecretStore that the global + per-tenant ExternalSecrets
# read from. Provider = kubernetes (looks back at the same cluster);
# authenticates as the `eso-reader` ServiceAccount which has Role
# permission to read Secrets in this namespace.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: seaweedfs-identities
  namespace: seaweedfs
  annotations:
    description: Reads per-tenant s3-identity-* Secrets and the per-tenant intermediate Secrets that the assembly ExternalSecrets produce.
spec:
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-reader
          namespace: seaweedfs
      remoteNamespace: seaweedfs
