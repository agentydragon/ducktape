# Filer metadata store for SeaweedFS, hosting the postgres2 backend.
#
# Filer's previous leveldb2 setup lived in the pod's ephemeral writable
# layer (no PVC) — the 3.93 → 4.29 upgrade rolled the filer pod and
# wiped every bucket's filer metadata, orphaning .dat data in the
# volume servers. CNPG fixes this with persistent storage + 2-instance
# streaming replication, and removes the leveldb2 single-instance constraint
# so the filer can run HA (now 2 replicas — see ../cluster/seaweed.yaml).
#
# NOTE: there is no off-site / WAL-archive (PITR) backup yet — only the
# in-cluster streaming replication. That is a cluster-wide CNPG gap (no Cluster
# here configures barmanObjectStore; tracked in docs/cnpg_conventions.md). This
# DB is the SSOT for ALL SeaweedFS metadata, so it is the highest-value one to
# back up first.
#
# Profile: OVH-HA per cluster/docs/cnpg_conventions.md (two instances on
# separate kimsufi nodes, co-located with the SeaweedFS volume servers).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: seaweedfs-filer-db
  namespace: seaweedfs
spec:
  instances: 2

  # CNPG 1.27+ kills isolated primaries by default (liveness probe).
  # Disable to prevent false positives from transient network blips.
  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    # One PostgreSQL instance per OVH kimsufi node for real HA.
    topologyKey: kubernetes.io/hostname
    # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
    # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
    # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  storage:
    storageClass: local-path-ovh
    size: 2Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: seaweedfs
      owner: seaweedfs
      # CNPG auto-generates credentials in Secret seaweedfs-filer-db-app
      # (keys: host, port, username, password, dbname, uri, jdbc-uri).
      # The filer reads username + password from env vars
      # WEED_POSTGRES2_USERNAME / WEED_POSTGRES2_PASSWORD wired in the
      # Seaweed CR. hostname/port/database are static in filer.config.
