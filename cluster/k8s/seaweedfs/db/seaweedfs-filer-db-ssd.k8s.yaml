apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    description: SeaweedFS filer metadata DB on the SSD tier (physically cloned from the retired seaweedfs-filer-db, Case B git-latency migration)
  name: seaweedfs-filer-db-ssd
  namespace: seaweedfs
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
          weight: 100
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: seaweedfs
      owner: seaweedfs
      secret:
        name: seaweedfs-filer-db-ssd-creds
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  monitoring:
    enablePodMonitor: true
  probes:
    liveness:
      isolationCheck:
        enabled: false
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
  storage:
    size: 2Gi
    storageClass: local-path-ovh-ssd
