apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs-filer-db
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: seaweedfs-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/seaweedfs/db
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: seaweedfs-filer-db
    namespace: ducktape-flux
  timeout: 5m
  wait: true
