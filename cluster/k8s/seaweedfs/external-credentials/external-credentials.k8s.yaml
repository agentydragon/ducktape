apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: Externally managed SeaweedFS S3 credential source Secrets.
  labels:
    name: seaweedfs-credentials
  name: seaweedfs-credentials
---
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: claude-reader-s3-credentials
  namespace: seaweedfs-credentials
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: seaweedfs
  to:
    - group: ""
      kind: Secret
      name: claude-reader-s3-credentials
---
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: drivefs-artifacts-s3-credentials
  namespace: seaweedfs-credentials
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: seaweedfs
  to:
    - group: ""
      kind: Secret
      name: drivefs-artifacts-s3-credentials
