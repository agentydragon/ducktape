# Allow only SeaweedFS S3Credentials in the operator namespace to read this
# exact externally managed Secret.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: claude-reader-s3-credentials
  namespace: seaweedfs-credentials
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: seaweedfs
  to:
    - group: ""
      kind: Secret
      name: claude-reader-s3-credentials
