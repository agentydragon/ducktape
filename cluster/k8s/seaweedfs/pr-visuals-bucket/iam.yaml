apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: pr-visuals-writer
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: pr-visuals-writer
  namespace: flux-system
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  identityRef:
    name: pr-visuals-writer
  secretRef:
    name: pr-visuals-s3-credentials
  reclaimPolicy: Retain
