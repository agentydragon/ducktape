apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: pr-visuals
  namespace: flux-system
spec:
  name: pr-visuals
  # The existing bucket is being handed to the tenant-local CR.
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  reclaimPolicy: Retain
  access:
    - user: pr-visuals-writer
      actions: [Read, Write, List, Tagging]
    - user: anonymous
      actions: [Read]
