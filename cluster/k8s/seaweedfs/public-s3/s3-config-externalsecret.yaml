apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: public-s3-config
  namespace: seaweedfs
  annotations:
    description: >-
      Renders the consolidated public S3 gateway config from the credential
      Secrets: drivefs-artifacts (writer + reader), vm-images (ci-writer +
      cdi-reader), and claude (cross-bucket read; write only to loom-gym).
      Intentionally excludes admin and all in-cluster-only tenants. SeaweedFS
      scopes actions per identity, so co-hosting these on one public gateway
      does not let one identity's credentials reach another's buckets.
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: seaweedfs-identities
  target:
    name: public-s3-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        seaweedfs_s3_config.json: |
          {"identities":[
            {"name":"drivefs-artifacts-writer",
             "credentials":[{"accessKey":"{{ .writerAccessKey }}","secretKey":"{{ .writerSecretKey }}"}],
             "actions":["Read:drivefs-artifacts","Write:drivefs-artifacts","List:drivefs-artifacts","Tagging:drivefs-artifacts"]},
            {"name":"drivefs-artifacts-reader",
             "credentials":[{"accessKey":"{{ .readerAccessKey }}","secretKey":"{{ .readerSecretKey }}"}],
             "actions":["Read:drivefs-artifacts","List:drivefs-artifacts"]},
            {"name":"vm-images-ci-writer",
             "credentials":[{"accessKey":"{{ .ciWriterAccessKey }}","secretKey":"{{ .ciWriterSecretKey }}"}],
             "actions":["Read:vm-images","Write:vm-images","List:vm-images","Tagging:vm-images"]},
            {"name":"vm-images-cdi-reader",
             "credentials":[{"accessKey":"{{ .cdiReaderAccessKey }}","secretKey":"{{ .cdiReaderSecretKey }}"}],
             "actions":["Read:vm-images","List:vm-images"]},
            {"name":"claude-reader",
             "credentials":[{"accessKey":"{{ .claudeReaderAccessKey }}","secretKey":"{{ .claudeReaderSecretKey }}"}],
             "actions":["Read:attic","List:attic","Read:drivefs-artifacts","List:drivefs-artifacts","Read:vm-images","List:vm-images","Read:augur-assets","List:augur-assets","Read:listing-monitor-captures","List:listing-monitor-captures","Read:loom-gym","Write:loom-gym","List:loom-gym","Tagging:loom-gym"]}
          ]}
  dataFrom:
    - extract:
        key: drivefs-artifacts-s3-credentials
    - extract:
        key: vm-images-s3-credentials
    - extract:
        key: claude-reader-s3-credentials
