apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: public-s3-config
  namespace: seaweedfs
  annotations:
    description: >-
      Renders the consolidated public S3 gateway config from the credential
      Secrets: drivefs-artifacts (writer + reader), vm-images (ci-writer +
      cdi-reader), claude (cross-bucket read; write only to loom-gym), and
      attic (read/write to the attic nix-cache bucket). attic is here so the
      nix cache can point its storage endpoint at s3.allegedly.works: presigned
      single-chunk NAR download URLs then resolve for external clients (CI),
      and attic's own chunk I/O routes through this gateway. Intentionally
      excludes admin and all in-cluster-only tenants from this static config.
      Filer-backed operator-managed IAM identities are independently accepted
      by every gateway. SeaweedFS scopes actions per identity, so co-hosting
      credentials on one public gateway does not let one identity reach
      another's buckets.
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: seaweedfs-identities
  target:
    name: public-s3-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        seaweedfs_s3_config.json: |
          {"identities":[
            {"name":"drivefs-artifacts-writer",
             "credentials":[{"accessKey":"{{ .writerAccessKey }}","secretKey":"{{ .writerSecretKey }}"}],
             "actions":["Read:drivefs-artifacts","Write:drivefs-artifacts","List:drivefs-artifacts","Tagging:drivefs-artifacts"]},
            {"name":"drivefs-artifacts-reader",
             "credentials":[{"accessKey":"{{ .readerAccessKey }}","secretKey":"{{ .readerSecretKey }}"}],
             "actions":["Read:drivefs-artifacts","List:drivefs-artifacts"]},
            {"name":"vm-images-ci-writer",
             "credentials":[{"accessKey":"{{ .ciWriterAccessKey }}","secretKey":"{{ .ciWriterSecretKey }}"}],
             "actions":["Read:vm-images","Write:vm-images","List:vm-images","Tagging:vm-images"]},
            {"name":"vm-images-cdi-reader",
             "credentials":[{"accessKey":"{{ .cdiReaderAccessKey }}","secretKey":"{{ .cdiReaderSecretKey }}"}],
             "actions":["Read:vm-images","List:vm-images"]},
            {"name":"claude-reader",
             "credentials":[{"accessKey":"{{ .claudeReaderAccessKey }}","secretKey":"{{ .claudeReaderSecretKey }}"}],
             "actions":["Read:attic","List:attic","Read:drivefs-artifacts","List:drivefs-artifacts","Read:vm-images","List:vm-images","Read:augur-assets","List:augur-assets","Read:listing-monitor-captures","List:listing-monitor-captures","Read:wayback-archive","List:wayback-archive","Read:loom-gym","Write:loom-gym","List:loom-gym","Tagging:loom-gym"]},
            {"name":"attic",
             "credentials":[{"accessKey":"{{ .accessKey }}","secretKey":"{{ .secretKey }}"}],
             "actions":["Read:attic","Write:attic","List:attic","Tagging:attic"]},
            {"name":"pr-visuals-writer",
             "credentials":[{"accessKey":"{{ .prVisualsAccessKey }}","secretKey":"{{ .prVisualsSecretKey }}"}],
             "actions":["Read:pr-visuals","Write:pr-visuals","List:pr-visuals","Tagging:pr-visuals"]},
            {"name":"anonymous","actions":["Read:pr-visuals"]}
          ]}
  dataFrom:
    - extract:
        key: drivefs-artifacts-s3-credentials
    - extract:
        key: vm-images-s3-credentials
    - extract:
        key: claude-reader-s3-credentials
    # attic's own SeaweedFS identity (generic accessKey/secretKey keys, no
    # collision with the prefixed keys above). Lets public-s3 validate the
    # presigned NAR URLs attic signs with this key.
    - extract:
        key: s3-identity-attic
    - extract:
        key: pr-visuals-s3-credentials
