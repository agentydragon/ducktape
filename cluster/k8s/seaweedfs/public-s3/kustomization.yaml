apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Registers unchanged DriveFS reader/writer keys with native IAM. The
  # externally managed source Secret is applied by the dedicated
  # seaweedfs-external-credentials Kustomization.
  - drivefs-artifacts-iam.yaml
  # Registers the unchanged external Claude credential with native IAM and
  # declares its authorization policy.
  - claude-reader-iam.yaml
  # Credentialed tenants are native IAM; the remaining anonymous read rule is
  # public bootstrap configuration and needs no Secret or external provider.
  - bootstrap-config.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
