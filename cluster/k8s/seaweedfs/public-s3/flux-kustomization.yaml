apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs-public-s3
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/seaweedfs/public-s3
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: seaweedfs-public-s3
    # Gate on Bucket CRs managed in this repo that the public identities target.
    # Claude and DriveFS identities authenticate through native IAM; static
    # gateway configuration now contains only the credential-free anonymous read.
    namespace: ducktape-flux
  dependsOn:
    - name: seaweedfs-external-credentials
      namespace: ducktape-flux
    - name: seaweedfs-drivefs-artifacts-bucket
      namespace: ducktape-flux
    - name: vm-images-publisher
      namespace: ducktape-flux
    - name: seaweedfs-secrets
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: public-s3
      namespace: seaweedfs
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Identity
      name: claude-reader
      namespace: seaweedfs
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Identity
      name: drivefs-artifacts-writer
      namespace: seaweedfs
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Identity
      name: drivefs-artifacts-reader
      namespace: seaweedfs
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: claude-reader
      namespace: seaweedfs
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: drivefs-artifacts-writer
      namespace: seaweedfs
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: drivefs-artifacts-reader
      namespace: seaweedfs
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Policy
      name: claude-reader-buckets
      namespace: seaweedfs
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3PolicyBinding
      name: claude-reader-buckets
      namespace: seaweedfs
