apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-s3
  namespace: seaweedfs
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    # Single consolidated public S3 endpoint. Its gateway merges the mounted
    # static config with filer-backed IAM, so possession of any valid S3 key
    # can authenticate here; bucket policy still limits what that key can do.
    - "s3.allegedly.works"
  rules:
    - timeouts:
        request: "3600s"
        backendRequest: "3600s"
      backendRefs:
        - name: public-s3
          port: 8333
