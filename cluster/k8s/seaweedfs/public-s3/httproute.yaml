apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-s3
  namespace: seaweedfs
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    # Single consolidated public S3 endpoint. Backed by the `public-s3`
    # deployment, which mounts only the curated multi-identity config — never
    # point this at the operator-managed all-tenant `seaweedfs-s3` Service.
    - "s3.allegedly.works"
  rules:
    - timeouts:
        request: "3600s"
        backendRequest: "3600s"
      backendRefs:
        - name: public-s3
          port: 8333
