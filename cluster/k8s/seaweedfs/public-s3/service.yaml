apiVersion: v1
kind: Service
metadata:
  name: public-s3
  namespace: seaweedfs
  labels:
    app.kubernetes.io/name: public-s3
    app.kubernetes.io/component: s3
    app.kubernetes.io/part-of: seaweedfs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: public-s3
    app.kubernetes.io/component: s3
  ports:
    - name: s3-http
      protocol: TCP
      port: 8333
      targetPort: s3-http
    - name: s3-metrics
      protocol: TCP
      port: 9327
      targetPort: s3-metrics
