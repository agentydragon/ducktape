# Register the externally managed Claude web-session credential without
# rotating it. The source Secret lives outside the operator's namespace so the
# operator reads the pair without taking ownership of its contents.
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: claude-reader
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: claude-reader
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  identityRef:
    name: claude-reader
  # The fields are supplied by the externally managed Secret. The operator
  # registers the pair exactly as-is instead of generating a replacement.
  secretRef:
    name: claude-reader-s3-credentials
    namespace: seaweedfs-credentials
    accessKeyField: claudeReaderAccessKey
    secretKeyField: claudeReaderSecretKey
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Policy
metadata:
  name: claude-reader-buckets
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  reclaimPolicy: Retain
  statements:
    - sid: ListReadableBuckets
      effect: Allow
      actions:
        - s3:ListBucket
      resources:
        - attic
        - drivefs-artifacts
        - vm-images
        - loom-gym
    - sid: ReadBucketObjects
      effect: Allow
      actions:
        - s3:GetObject
      resources:
        - attic/*
        - drivefs-artifacts/*
        - vm-images/*
        - loom-gym/*
    - sid: WriteAndTagLoomGymObjects
      effect: Allow
      actions:
        - s3:PutObject
        - s3:DeleteObject
        - s3:GetObjectTagging
        - s3:PutObjectTagging
        - s3:DeleteObjectTagging
      resources:
        - loom-gym/*
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3PolicyBinding
metadata:
  name: claude-reader-buckets
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  policyRef:
    name: claude-reader-buckets
  subjects:
    - kind: S3Identity
      name: claude-reader
  reclaimPolicy: Retain
