# Register the externally managed DriveFS reader and writer keys without
# rotating either. They remain delivered by the current SOPS/manual paths;
# Bucket/drivefs-artifacts-bucket.yaml remains their native permission source.
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: drivefs-artifacts-writer
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: drivefs-artifacts-writer
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  identityRef:
    name: drivefs-artifacts-writer
  # These fields are supplied by the external source Secret. The operator
  # registers them verbatim instead of generating replacement credentials.
  secretRef:
    name: drivefs-artifacts-s3-credentials
    namespace: seaweedfs-credentials
    accessKeyField: writerAccessKey
    secretKeyField: writerSecretKey
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: drivefs-artifacts-reader
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: drivefs-artifacts-reader
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  identityRef:
    name: drivefs-artifacts-reader
  # Shares the same external Secret as the writer but registers only the
  # reader pair.
  secretRef:
    name: drivefs-artifacts-s3-credentials
    namespace: seaweedfs-credentials
    accessKeyField: readerAccessKey
    secretKeyField: readerSecretKey
  reclaimPolicy: Retain
