apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # cdk8s-generated (cluster/cdk8s/seaweedfs/{cluster,s3_config,filer_db}.py,
  # cluster/cdk8s/stateful_infra.py) -- see cluster/docs/cdk8s.md.
  - cluster.k8s.yaml
  - seaweedfs-filer-db-ssd-creds.sops.yaml
  # Per-tenant S3 credentials. Legacy entries also contain an ExternalSecret that renders
  # static gateway JSON. Migrated entries contain only the SOPS Secret; their
  # S3Identity/S3Credentials CRs live with the corresponding Bucket CR.
  - identities/admin.sops.yaml
