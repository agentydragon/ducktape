apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs-cluster
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  path: ./cluster/k8s/seaweedfs/cluster
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  dependsOn:
    - name: seaweedfs-operator
      namespace: flux-system
    - name: seaweedfs-secrets
      namespace: ducktape-flux
    - name: seaweedfs-filer-db # Filer is configured with postgres2 backend.
      namespace: flux-system
    - name: local-path-provisioner
      namespace: flux-system
  wait: false
  timeout: 5m
