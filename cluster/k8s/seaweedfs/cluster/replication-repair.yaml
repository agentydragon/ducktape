apiVersion: seaweed.seaweedfs.com/v1
kind: AdminScript
metadata:
  name: replication-repair
  namespace: seaweedfs
  annotations:
    description: Hourly copy-only repair of SeaweedFS volume replica placement.
spec:
  clusterRef:
    name: seaweedfs
  schedule: "17 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  restartPolicy: Never
  backoffLimit: 0
  startingDeadlineSeconds: 300
  activeDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Keep the boolean value attached: `-doDelete false` parses as true. The CLI
  # otherwise also deletes excess/misplaced replicas. Pruning after a node
  # returns remains a deliberate operator action.
  script: |
    lock
    volume.fix.replication -apply -doDelete=false -maxParallelization=2 -maxParallelizationPerServer=1 -retry=5
    unlock
