# SeaweedFS cluster — trial deployment on OVH Kimsufi nodes.
#
# Replication "001" (1 copy on different node, same rack) — survives a single
# node loss across our 2-node, single-rack topology.
#
# Volume server PVCs use local-path-ovh (zone=hil-ovh allowedTopologies),
# bound to /var/mnt/seaweedfs-data on /dev/sdb via Talos UserVolumeConfig.
#
# S3 runs as a standalone deployment (spec.s3, not filer.s3) for cleaner
# separation. Filer is enabled because S3 still needs a filer behind it
# for metadata; leveldb2 metadata is in-pod (single-instance, no HA) —
# trial only.
#
# All four components (master/volume/filer/s3) are pinned to OVH Kimsufi
# nodes via nodeSelector. Operator default would let pods land anywhere; we
# want them strictly on OVH boxes with a Talos data user volume.
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  # 4.x is required for the Bucket CR's access wiring: the filer's gRPC
  # server unconditionally registers `iam_pb.SeaweedIdentityAccessManagement`
  # starting at commit f41925b60 ("Embed IAM API into S3 server", in 4.03).
  # Before that, the operator's BucketAdmin couldn't call the IAM gRPC
  # service (Unimplemented), so every Bucket CR landed Failed regardless
  # of whether the bucket was fresh or pre-existing. The seaweedfs-operator
  # 1.0.19 image imports SeaweedFS at commit a1e5eb9da (between 4.23 and
  # 4.24), so 4.44 remains compatible with the operator's expected wire surface.
  #
  # Upgrade safety: changelog scan from 3.93 to 4.44 found no on-disk
  # format changes (leveldb2 filer store, volume .dat/.idx, s3-config.json
  # all stable), no breaking gRPC changes (only additions to filer_pb /
  # master_pb / iam_pb), and split-brain prevention via persistent
  # ClusterID is single-master-friendly (auto-generates on first start).
  image: chrislusf/seaweedfs:4.44
  volumeServerDiskCount: 1

  master:
    # 3-instance raft, spread across kimsufi hosts. Quorum 2/3 →
    # cluster survives any single-node outage. Tolerate the CP taint
    # matching volume + s3.
    replicas: 3
    # SeaweedFS derives each volume server's maximum logical volume count from
    # disk size / volumeSizeLimitMB. 30GB left the first two 1.8TiB servers at
    # 61/61 logical volumes after only a handful of collections, so new
    # replicated collections could not grow. 16GB keeps object chunks well below
    # the per-volume cap while leaving enough free slots for new collections.
    volumeSizeLimitMB: 16000
    # Accepted posture (operator decision 2026-09-02): single-NODE failure tolerance.
    # 001 = one extra copy on another volume server in the same rack; all three
    # HDD servers carry one rack label, so a rack-level failure at OVH (they are
    # physically in two racks) can take both copies. Rack-fault tolerance would
    # need the HDD group split per physical rack plus repl 010, which strands the
    # singleton H109A09 box with no bulk; whether OVH can supply a node in the
    # other rack is unknown. Not planned; revisit only if a fourth HDD node lands.
    defaultReplication: "001"
    metricsPort: 9321
    # QoS / eviction protection (see cluster/docs/lessons_learned/
    # 2026_06_19_seaweedfs_descheduler_dns_race_crashloop.md). Without requests
    # these pods are BestEffort: the descheduler's first eviction target (QoS
    # tiebreak) and the kernel OOM-killer's first victim under node memory
    # pressure. Requests sized above steady-state (raft metadata is light,
    # ~40Mi observed) so usage normally sits at/below request → kubelet ranks
    # them last for node-pressure eviction. Memory limit is a generous safety
    # cap; no CPU limit (avoid throttling raft). priorityClassName defers them
    # in the descheduler's primary (priority) sort and shields from preemption.
    priorityClassName: stateful-infra
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    # Hard anti-affinity — each master on a different host so raft quorum
    # can actually survive a node loss.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: master
                app.kubernetes.io/name: seaweedfs
            topologyKey: kubernetes.io/hostname

  # SSD tiering — cluster/docs/plans/ovh_storage_tiering.md. volumeTopology is the
  # sole volume-server source: the operator reconciles ONLY these groups (all-or-
  # nothing — it does NOT also honor a flat spec.volume, which we deliberately omit).
  # Each group requires dataCenter + rack and is fully self-contained (no inheritance
  # from a base spec.volume; topology-only deployment needs the operator's nil-safe
  # BaseVolumeSpec fallback, added in 1.0.20 — we run 1.0.30).
  volumeTopology:
    hdd:
      # 3 servers on the KS-5 HDD nodes; destination for the migrated bulk.
      # -disk=hdd matches the flat servers' default disk type ("" == hdd,
      # verified in seaweedfs 4.29 ToDiskType).
      #
      # The rack label is logical, not physical: OVH racks these boxes across
      # THREE racks (ovh_dedicated_server data source): 102453=H109A09,
      # 103656+103711=H109B04, and the ssd nodes 104952+104963=H108B01. This hdd
      # group carries ONE rack label (matching the flat servers, so volume.move
      # doesn't create transient same-rack placement mismatches). Deliberate:
      # repl 001 (same-rack, 2 nodes) needs >=2 nodes per rack, and a faithful
      # per-rack split would strand the singleton H109A09 (102453, the 3.6 TB
      # disk) with no bulk. Single-node tolerance is the accepted posture — see
      # defaultReplication above; the split + repl 010 sketch stays in
      # cluster/docs/plans/ovh_storage_tiering.md as an option, not a plan.
      replicas: 3
      dataCenter: "hil"
      rack: "hil-ovh-h109b04"
      priorityClassName: stateful-infra
      # Soft heap ceiling at ~90% of the memory limit below, same pattern as the
      # filer and s3 gateway. Go's GC (GOGC=100) does not know the cgroup limit
      # exists and lets the heap overshoot before the next cycle, so a hard limit
      # with no soft ceiling is a kernel OOM-kill waiting for a busy enough
      # moment -- which is what happened to volume-hdd-0 (OOMKilled 3x, most
      # recently 2026-08-17T22:02:46Z). volume-hdd-1 has since reached 1345Mi
      # against this 1536Mi limit (88%) over 30d. GOMEMLIMIT makes the runtime
      # trade CPU to stay under the cap instead of dying at it.
      env:
        - name: GOMEMLIMIT
          value: "1400MiB"
      requests:
        storage: 1800Gi
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
      storageClassName: local-path-ovh-hdd
      metricsPort: 9325
      extraArgs: ["-disk=hdd"]
      # Go read-only before the disk fills rather than trusting the slot cap —
      # the real safety bound once maxVolumeCounts overcommits (mirrors the ssd group).
      minFreeSpacePercent: 10
      # Overcommit the volume-slot count (same rationale as the ssd group). -max=0
      # auto-derives disk_size / volumeSizeLimitMB → only 112/113 slots on the 1.8 TiB
      # servers, which sat at 112/112 (full) while volumes were ~5% full (~0.85 GB of a
      # 16 GB cap). Thin volumes make over-committing ~free; disk-full is bounded by
      # minFreeSpacePercent, not the slot cap. 300 > the ~163 distinct HDD volumes, so a
      # single survivor can hold the full 2-copy set while a peer is repartitioned during
      # the data-disk mount rename (cluster/docs/plans/ovh_storage_tiering.md) — no
      # forced single-copy window — and 300 > the 3.6 TB node's auto 232, so no server is
      # capped below its previous count.
      maxVolumeCounts: 300
      nodeSelector:
        storage.allegedly.works/tier: hdd
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: seaweedfs
                  seaweedfs/topology: hdd
              topologyKey: kubernetes.io/hostname
    ssd:
      # 2 servers on the KS-GAME NVMe nodes; serves Forgejo git via the
      # seaweedfs-ovh-ssd StorageClass (diskType=ssd -> -disk=ssd).
      replicas: 2
      dataCenter: "hil"
      # Real OVH rack — both KS-GAME nodes (104952, 104963) are physically in
      # H108B01 (verified via the ovh_dedicated_server data source). This is the
      # one group whose rack label matches physical topology; repl 001 places the
      # 2 git copies across the 2 nodes in this rack.
      rack: "hil-ovh-h108b01"
      priorityClassName: stateful-infra
      # Soft heap ceiling at ~90% of the memory limit below, same pattern as the
      # filer and s3 gateway. Go's GC (GOGC=100) does not know the cgroup limit
      # exists and lets the heap overshoot before the next cycle, so a hard limit
      # with no soft ceiling is a kernel OOM-kill waiting for a busy enough
      # moment -- which is what happened to volume-hdd-0 (OOMKilled 3x, most
      # recently 2026-08-17T22:02:46Z). volume-hdd-1 has since reached 1345Mi
      # against this 1536Mi limit (88%) over 30d. GOMEMLIMIT makes the runtime
      # trade CPU to stay under the cap instead of dying at it.
      env:
        - name: GOMEMLIMIT
          value: "1400MiB"
      requests:
        storage: 250Gi
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
      storageClassName: local-path-ovh-ssd
      # MUST match the hdd group's metricsPort. Even in topology-only mode the
      # operator also emits a topology-less `seaweedfs-volume-peer` Service (and a
      # `seaweedfs-volume` ServiceMonitor) whose selector matches EVERY volume pod
      # but publishes a single port. With ssd on 9328 that Service scraped the two
      # ssd servers on 9325, which they do not serve: two permanently-failing
      # targets, enough to hold TargetDown above its 10% threshold indefinitely.
      # The ssd servers themselves were always scraped fine via their own
      # per-topology ServiceMonitor, so this was noise, not blindness.
      # Nothing else needs these to differ -- 8444 and 18444 are already identical
      # across both groups, and separate pods can share a port number freely.
      metricsPort: 9325
      extraArgs: ["-disk=ssd"]
      # NVMe#2 is one shared XFS pool (this ssd server + forgejo-db + filer-db);
      # go read-only before the disk fills so the fragile CNPG DBs keep a reserve.
      minFreeSpacePercent: 10
      # Overcommit the volume-slot count: -max=0 auto-derives only ~24 slots on
      # the 419 GB NVMe and SeaweedFS pre-grabs ~2-6 (mostly-empty) volumes per
      # collection. Thin volumes make over-committing ~free; disk-full is bounded
      # by minFreeSpacePercent, not the slot cap.
      maxVolumeCounts: 50
      nodeSelector:
        storage.allegedly.works/tier: ssd
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: seaweedfs
                  seaweedfs/topology: ssd
              topologyKey: kubernetes.io/hostname

  filer:
    # 2-replica HA. The filer is a stateless metadata gateway to the shared
    # postgres2 store (seaweedfs-filer-db-ssd), so both replicas serve identical
    # data and concurrent writes are handled by enableUpsert. HA lets the filer
    # roll / drain without a SeaweedFS-wide metadata stall, and (with the
    # affinity below) keeps it off the control-plane HDD nodes.
    # NOTE: the metadata DB still has no off-cluster WAL/PITR backup — only the
    # 2-instance CNPG streaming replication. That gap is independent of the
    # filer replica count but worth closing (it is the SSOT for all SeaweedFS
    # data; see the 2026_05_27 filer-metadata-loss lesson).
    replicas: 2
    # spec.filer.config is filled in from filer.toml via the kustomize
    # configMapGenerator + replacement in kustomization.yaml. The TOML
    # config lives in its own file so it can be syntax-checked and edited
    # outside of YAML string escaping.
    config: ""
    # Postgres credentials override filer.toml [postgres2] keys via viper's
    # env-var binding (WEED_<key>, dot→underscore). seaweedfs-filer-db-ssd-creds is a
    # committed Secret (../db/seaweedfs-filer-db-ssd-creds.sops.yaml) that CNPG syncs onto
    # the -ssd seaweedfs role (declared as the app user in that cluster's initdb stanza).
    # The -creds suffix is deliberate: CNPG auto-generates a bogus <cluster>-app Secret
    # (default user "app") for this cluster, so the committed one must not collide.
    env:
      # Soft heap ceiling ~90% of the memory limit below; see the sizing note
      # at requests/limits. Go's GC (GOGC=100) otherwise ignores the cgroup
      # limit and overshoots → kernel OOM-kill.
      - name: GOMEMLIMIT
        value: "700MiB"
      - name: WEED_POSTGRES2_USERNAME
        valueFrom:
          secretKeyRef:
            name: seaweedfs-filer-db-ssd-creds
            key: username
      - name: WEED_POSTGRES2_PASSWORD
        valueFrom:
          secretKeyRef:
            name: seaweedfs-filer-db-ssd-creds
            key: password
    metricsPort: 9326
    # QoS / eviction protection as on master. Now 2 replicas → a minAvailable:1
    # PDB (poddisruptionbudget.yaml) keeps the descheduler / node drains from
    # taking both filers down at once.
    #
    # Memory sizing: the filer is a metadata gateway to Postgres (postgres2
    # backend — metadata lives in the DB, not in-pod), so steady-state is
    # modest (~190Mi peak / ~136Mi current in our Mimir history). BUT the filer
    # idle floor jumped in SeaweedFS 4.18+: per upstream
    # https://github.com/seaweedfs/seaweedfs/issues/9035 the filer now uses
    # 250–360Mi idle (vs 80–90Mi in 4.17), and that issue's reporter OOM-loops
    # a 256Mi-limited filer every 3–5min. We run 4.29, and the old 256Mi
    # *request* sat exactly on that regression's floor. Sized on data, same
    # pattern as the s3 gateway below:
    #   - request 384Mi: above the 360Mi reported idle ceiling, so kubelet
    #     node-pressure eviction ranks it last.
    #   - limit 768Mi: ~2× the reported idle ceiling, ~4× our observed peak.
    #   - GOMEMLIMIT=700MiB (set in env above): soft ceiling so Go GCs harder
    #     instead of being OOM-killed at the cap.
    priorityClassName: stateful-infra
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 768Mi
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    affinity:
      # Hard anti-affinity — one filer per host, so the 2 replicas never share
      # a node and a single node loss can't take out both.
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: filer
                app.kubernetes.io/name: seaweedfs
            topologyKey: kubernetes.io/hostname
      # Soft off the control-plane HDD nodes: in normal operation both filers
      # land on the NVMe workers; CP stays a fallback if both workers are down.
      # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist

  s3:
    replicas: 2 # stateless S3 gateway — scales freely across the 3 kimsufi hosts
    configSecret:
      name: seaweedfs-s3-config
      key: seaweedfs_s3_config.json
    # `weed s3` only reads seaweedfs-s3-config at startup, so it must roll when ESO
    # reassembles that Secret (tenant added/rotated). NOTE: this annotation lands on
    # the *pod template*, not the Deployment's own metadata, and Reloader only reads
    # the workload-level annotation — so it is INERT here. The actual roll comes from
    # Reloader's cluster-wide `autoReloadAll: true` (see cluster/k8s/reloader/). Kept
    # for intent/future-proofing if the operator ever sets Deployment annotations.
    annotations:
      reloader.stakater.com/auto: "true"
    metricsPort: 9327
    # QoS / eviction protection. No PDB: it is stateless and freely
    # reschedulable, so descheduler moves are harmless.
    #
    # Memory is load-driven, NOT a fixed footprint: it tracks concurrent
    # in-flight transfers (our load is dominated by Mimir TSDB block range-GETs
    # — verified via SeaweedFS_s3_request_total) plus the in-process Iceberg
    # REST catalog. The in-memory chunk cache (-cacheCapacityMB) is off
    # (default 0), so there is nothing to cap there. The upstream Helm chart's
    # 128Mi/512Mi is sized for a *lightweight* gateway; ours is not. Mimir
    # query/compaction bursts drove the pre-limit pods to ~1.7Gi peak (observed
    # in our own Mimir history), so a 512Mi limit hard-OOM-looped the pod every
    # ~10min (exit 137). Sizing, on data:
    #   - request 512Mi: above steady-state (~400Mi) so kubelet node-pressure
    #     eviction ranks it last (same logic as the volume servers above).
    #   - limit 2Gi: comfortably above the observed ~1.7Gi burst peak.
    #   - GOMEMLIMIT=1800MiB: soft ceiling ~90% of the limit. Go's GC otherwise
    #     ignores the cgroup limit (GOGC=100 lets the heap overshoot before the
    #     next GC → kernel OOM-kill). This makes the runtime trade CPU to stay
    #     under the cap instead of dying — the "avoid container-OOM-on-own-limit"
    #     caveat from the 2026_06_19 descheduler RCA, done properly for s3.
    priorityClassName: stateful-infra
    env:
      - name: GOMEMLIMIT
        value: "1800MiB"
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 2Gi
    # weed s3 defaults -ip.bind to localhost — kubelet's readiness probe from
    # outside the pod gets "connection refused". Bind to 0.0.0.0 so probes
    # (and the Service ClusterIP) reach the API.
    extraArgs:
      - "-ip.bind=0.0.0.0"
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    # Allow kimsufi CPs as scheduling targets so s3 can spread across OVH
    # hosts when desirable. Stateless gateway — no I/O contention.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
