# SeaweedFS cluster — trial deployment on OVH Kimsufi nodes.
#
# Replication "001" (1 copy on different node, same rack) — survives a single
# node loss across our 2-node, single-rack topology.
#
# Volume server PVCs use local-path-ovh (zone=hil-ovh allowedTopologies),
# bound to /var/mnt/seaweedfs-data on /dev/sdb via Talos UserVolumeConfig.
#
# S3 runs as a standalone deployment (spec.s3, not filer.s3) for cleaner
# separation. Filer is enabled because S3 still needs a filer behind it
# for metadata; leveldb2 metadata is in-pod (single-instance, no HA) —
# trial only.
#
# All four components (master/volume/filer/s3) are pinned to OVH Kimsufi
# nodes via nodeSelector. Operator default would let pods land anywhere; we
# want them strictly on OVH boxes with a Talos data user volume.
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  # 4.x is required for the Bucket CR's access wiring: the filer's gRPC
  # server unconditionally registers `iam_pb.SeaweedIdentityAccessManagement`
  # starting at commit f41925b60 ("Embed IAM API into S3 server", in 4.03).
  # Before that, the operator's BucketAdmin couldn't call the IAM gRPC
  # service (Unimplemented), so every Bucket CR landed Failed regardless
  # of whether the bucket was fresh or pre-existing. The seaweedfs-operator
  # 1.0.19 image imports SeaweedFS at commit a1e5eb9da (between 4.23 and
  # 4.24), so 4.29 matches the operator's expected wire surface.
  #
  # Upgrade safety: changelog scan from 3.93 to 4.29 found no on-disk
  # format changes (leveldb2 filer store, volume .dat/.idx, s3-config.json
  # all stable), no breaking gRPC changes (only additions to filer_pb /
  # master_pb / iam_pb), and split-brain prevention via persistent
  # ClusterID is single-master-friendly (auto-generates on first start).
  image: chrislusf/seaweedfs:4.29
  volumeServerDiskCount: 1

  master:
    # 3-instance raft, spread across kimsufi hosts. Quorum 2/3 →
    # cluster survives any single-node outage. Tolerate the CP taint
    # matching volume + s3.
    replicas: 3
    # SeaweedFS derives each volume server's maximum logical volume count from
    # disk size / volumeSizeLimitMB. 30GB left the first two 1.8TiB servers at
    # 61/61 logical volumes after only a handful of collections, so new
    # replicated collections could not grow. 16GB keeps object chunks well below
    # the per-volume cap while leaving enough free slots for new collections.
    volumeSizeLimitMB: 16000
    defaultReplication: "001"
    metricsPort: 9321
    # QoS / eviction protection (see cluster/docs/lessons_learned/
    # 2026_06_19_seaweedfs_descheduler_dns_race_crashloop.md). Without requests
    # these pods are BestEffort: the descheduler's first eviction target (QoS
    # tiebreak) and the kernel OOM-killer's first victim under node memory
    # pressure. Requests sized above steady-state (raft metadata is light,
    # ~40Mi observed) so usage normally sits at/below request → kubelet ranks
    # them last for node-pressure eviction. Memory limit is a generous safety
    # cap; no CPU limit (avoid throttling raft). priorityClassName defers them
    # in the descheduler's primary (priority) sort and shields from preemption.
    priorityClassName: stateful-infra
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    # Hard anti-affinity — each master on a different host so raft quorum
    # can actually survive a node loss.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: master
                app.kubernetes.io/name: seaweedfs
            topologyKey: kubernetes.io/hostname

  volume:
    # Three volume servers spread across kimsufi hosts. KS-5 nodes use
    # /dev/sdb; KS-GAME nodes use their second NVMe. All mount the data volume
    # at /var/mnt/seaweedfs-data via Talos UserVolumeConfig
    # (cluster/terraform/main/ovh-nodes.tf). With replication=001 across
    # 3 hosts, we can lose one node and still have 2 surviving copies.
    replicas: 3
    # The operator routes requests.storage to the PVC volumeClaimTemplate and
    # cpu/memory to the container (filterContainerResources strips `storage`),
    # so adding compute requests here leaves the 1800Gi PVC untouched. QoS /
    # eviction protection as on master; volume holds the in-memory needle index
    # so memory is sized higher (≤435Mi observed). See the lessons_learned RCA.
    priorityClassName: stateful-infra
    requests:
      storage: 1800Gi # leaves headroom on the 2 TB /dev/sdb
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1536Mi
    storageClassName: local-path-ovh
    dataCenter: "hil"
    rack: "hil-ovh-h109b04"
    metricsPort: 9325
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    # Tolerate the CP taint so one volume server can land on the kimsufi
    # CP. Volume I/O is sequential and on a separate disk (sdb) from etcd
    # (sda), so contention with the control plane is minimal.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    # Hard anti-affinity so each volume server sits on a different kimsufi
    # node — that's what makes replication=001 actually no-SPOF. The
    # StatefulSet would otherwise co-locate replicas on whichever node the
    # scheduler picks first (verified live).
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: volume
                app.kubernetes.io/name: seaweedfs
            topologyKey: kubernetes.io/hostname

  filer:
    # Single replica today. postgres2 backend allows scaling later — once
    # the cluster has been operating on Postgres for a while and we've
    # established WAL/PITR backup is healthy, this can go to 2+.
    replicas: 1
    # spec.filer.config is filled in from filer.toml via the kustomize
    # configMapGenerator + replacement in kustomization.yaml. The TOML
    # config lives in its own file so it can be syntax-checked and edited
    # outside of YAML string escaping.
    config: ""
    # Postgres credentials override filer.toml [postgres2] keys via viper's
    # env-var binding (WEED_<key>, dot→underscore). CNPG auto-generates the
    # Secret seaweedfs-filer-db-app at cluster bootstrap.
    env:
      - name: WEED_POSTGRES2_USERNAME
        valueFrom:
          secretKeyRef:
            name: seaweedfs-filer-db-app
            key: username
      - name: WEED_POSTGRES2_PASSWORD
        valueFrom:
          secretKeyRef:
            name: seaweedfs-filer-db-app
            key: password
    metricsPort: 9326
    # QoS / eviction protection as on master (metadata gateway to postgres,
    # ~172Mi observed). Singleton, so deliberately NO PodDisruptionBudget —
    # a maxUnavailable:0 PDB on a 1-replica set would wedge node drains.
    priorityClassName: stateful-infra
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh

  s3:
    replicas: 2 # stateless S3 gateway — scales freely across the 3 kimsufi hosts
    configSecret:
      name: seaweedfs-s3-config
      key: seaweedfs_s3_config.json
    # `weed s3` only reads seaweedfs-s3-config at startup, so it must roll when ESO
    # reassembles that Secret (tenant added/rotated). NOTE: this annotation lands on
    # the *pod template*, not the Deployment's own metadata, and Reloader only reads
    # the workload-level annotation — so it is INERT here. The actual roll comes from
    # Reloader's cluster-wide `autoReloadAll: true` (see cluster/k8s/reloader/). Kept
    # for intent/future-proofing if the operator ever sets Deployment annotations.
    annotations:
      reloader.stakater.com/auto: "true"
    metricsPort: 9327
    # QoS / eviction protection. No PDB: it is stateless and freely
    # reschedulable, so descheduler moves are harmless.
    #
    # Memory is load-driven, NOT a fixed footprint: it tracks concurrent
    # in-flight transfers (our load is dominated by Mimir TSDB block range-GETs
    # — verified via SeaweedFS_s3_request_total) plus the in-process Iceberg
    # REST catalog. The in-memory chunk cache (-cacheCapacityMB) is off
    # (default 0), so there is nothing to cap there. The upstream Helm chart's
    # 128Mi/512Mi is sized for a *lightweight* gateway; ours is not. Mimir
    # query/compaction bursts drove the pre-limit pods to ~1.7Gi peak (observed
    # in our own Mimir history), so a 512Mi limit hard-OOM-looped the pod every
    # ~10min (exit 137). Sizing, on data:
    #   - request 512Mi: above steady-state (~400Mi) so kubelet node-pressure
    #     eviction ranks it last (same logic as the volume servers above).
    #   - limit 2Gi: comfortably above the observed ~1.7Gi burst peak.
    #   - GOMEMLIMIT=1800MiB: soft ceiling ~90% of the limit. Go's GC otherwise
    #     ignores the cgroup limit (GOGC=100 lets the heap overshoot before the
    #     next GC → kernel OOM-kill). This makes the runtime trade CPU to stay
    #     under the cap instead of dying — the "avoid container-OOM-on-own-limit"
    #     caveat from the 2026_06_19 descheduler RCA, done properly for s3.
    priorityClassName: stateful-infra
    env:
      - name: GOMEMLIMIT
        value: "1800MiB"
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 2Gi
    # weed s3 defaults -ip.bind to localhost — kubelet's readiness probe from
    # outside the pod gets "connection refused". Bind to 0.0.0.0 so probes
    # (and the Service ClusterIP) reach the API.
    extraArgs:
      - "-ip.bind=0.0.0.0"
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    # Allow kimsufi CPs as scheduling targets so s3 can spread across OVH
    # hosts when desirable. Stateless gateway — no I/O contention.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
