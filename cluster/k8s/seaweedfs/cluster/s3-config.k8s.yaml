apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: seaweedfs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-reader
  namespace: seaweedfs
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-reader
  namespace: seaweedfs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-reader
subjects:
  - kind: ServiceAccount
    name: eso-reader
    namespace: seaweedfs
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  annotations:
    description: Reads per-tenant s3-identity-* Secrets and the per-tenant intermediate Secrets that the assembly ExternalSecrets produce.
  name: seaweedfs-identities
  namespace: seaweedfs
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: eso-reader
          namespace: seaweedfs
      remoteNamespace: seaweedfs
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    description: Assembles the s3 gateway config Secret from per-tenant identity Secrets.
  name: seaweedfs-s3-config
  namespace: seaweedfs
spec:
  dataFrom:
    - find:
        name:
          regexp: ^s3-identity-.+-json$
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: seaweedfs-identities
  target:
    creationPolicy: Owner
    name: seaweedfs-s3-config
    template:
      data:
        seaweedfs_s3_config.json: |
          {"identities":[
            {{- $first := true -}}
            {{- range $sName, $sJson := . -}}
            {{- $sData := $sJson | fromJson -}}
            {{- if not $first }},{{ end -}}{{ $sData.identity }}{{- $first = false -}}
            {{- end -}}
          ]}
      type: Opaque
