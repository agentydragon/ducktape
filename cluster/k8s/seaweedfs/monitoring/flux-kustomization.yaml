apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seaweedfs-monitoring
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: seaweedfs-cluster
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/seaweedfs/monitoring
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: seaweedfs-monitoring
    namespace: ducktape-flux
  suspend: false
