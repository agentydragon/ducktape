# SeaweedFS master does not self-heal under-replicated volumes. The operator's
# replication-repair AdminScript attempts hourly, copy-only repair; this alert
# still exposes stalled jobs, missing destination slots, and any excess or
# misplaced replicas, which the script deliberately does not delete.
#
# `SeaweedFS_master_replica_placement_mismatch` is a leader-only, per-volume
# gauge (labels: collection, id) = 1 when a volume's replica count/placement
# does not match its target (under- or over-replicated), else 0. Only the
# leader emits it, so `sum()` counts mismatched volumes cluster-wide.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: seaweedfs-replication
  namespace: seaweedfs
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: seaweedfs-replication
      rules:
        - alert: SeaweedFSReplicaPlacementMismatch
          expr: sum(SeaweedFS_master_replica_placement_mismatch) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "SeaweedFS has {{ $value }} volume(s) off their replica count"
            description: >-
              {{ $value }} SeaweedFS volume(s) have not matched their target
              replica placement for 15m (replication 001 = 2 copies). The
              replication-repair AdminScript attempts copy-only repair hourly;
              check its CronJob/Job status and available volume slots if the
              mismatch persists. It never trims excess or misplaced replicas,
              so review those deliberately. Suspend the AdminScript and wait
              for any active Job before planned volume-server maintenance.
              For an immediate manual repair, inspect `volume.list` and run
              `volume.fix.replication -apply -doDelete=false` under `lock` from
              a master pod (`weed shell` reads commands on stdin).
