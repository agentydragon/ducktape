apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: analytics-backup
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: analytics-backup
  namespace: seaweedfs
spec:
  seaweedRef:
    name: seaweedfs
  identityRef:
    name: analytics-backup
  secretRef:
    name: s3-identity-analytics-backup
  reclaimPolicy: Retain
