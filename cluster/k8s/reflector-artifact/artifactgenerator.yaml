apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: reflector
  namespace: ducktape-flux
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: ducktape
      namespace: ducktape-flux
  artifacts:
    - name: reflector
      originRevision: "@repo"
      copy:
        - from: "@repo/cluster/k8s/reflector/**"
          to: "@artifact/cluster/k8s/reflector/"
          exclude:
            - flux-kustomization.yaml
