apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-secrets
  namespace: ducktape-flux
spec:
  suspend: false
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/paperless/secrets
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  timeout: 10m
  dependsOn:
    - name: paperless-namespace
      namespace: ducktape-flux
