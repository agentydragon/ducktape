apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  namespace: paperless
spec:
  accessModes:
    - ReadWriteOnce
  # Replicated/distributed storage so the pod is not node-pinned and can
  # reschedule across OVH nodes (see cluster/AGENTS.md § Storage Selection).
  # TODO: this PVC is currently Bound on the pre-split storageClassName: seaweedfs-ovh.
  # That field is immutable, so Flux applying seaweedfs-ovh-hdd here is a no-op on the
  # live object until migrated via
  # <cluster/docs/runbooks/seaweedfs_pvc_storageclass_migration.md>.
  storageClassName: seaweedfs-ovh-hdd
  resources:
    requests:
      storage: 50Gi
