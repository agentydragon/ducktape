apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless
  namespace: ducktape-flux
spec:
  suspend: false
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/paperless/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 10m
  dependsOn:
    - name: paperless-namespace
      namespace: ducktape-flux
    - name: paperless-secrets
      namespace: ducktape-flux
    - name: paperless-cache
      namespace: ducktape-flux
    - name: paperless-db
      namespace: ducktape-flux
    - name: gateway
      namespace: flux-system
