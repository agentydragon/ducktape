# The proxy's informer over the credentials it substitutes: every Secret in this namespace,
# which is why the namespace holds nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-egress-credentials-reader
  namespace: agentplane-egress-credentials
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
