# The staging proxy's identity (cluster/k8s/agentplane-staging/egress); a production proxy
# gets its own binding here.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-staging-egress
  namespace: agentplane-egress-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-egress-credentials-reader
subjects:
  - kind: ServiceAccount
    name: agentplane-egress
    namespace: agentplane-staging
