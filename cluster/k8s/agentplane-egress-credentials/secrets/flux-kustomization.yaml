apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-egress-credentials
  namespace: ducktape-flux
  annotations:
    description: The credentials the Agentplane egress proxy substitutes (the agentydragon-agent GitHub PAT via ESO) and the proxy ServiceAccount's read grant on them.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 2m
  path: ./cluster/k8s/agentplane-egress-credentials/secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: agentplane-egress-credentials-namespace
      namespace: ducktape-flux
    - name: external-creds # the source-side grant on the agentydragon-agent PAT
      namespace: ducktape-flux
    - name: external-secrets-config # the ClusterSecretStore the PAT is read through
      namespace: ducktape-flux
