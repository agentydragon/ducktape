apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: The credentials the Agentplane egress proxy substitutes (the agentydragon-agent GitHub PAT via ESO) and the proxy ServiceAccount's read grant on them.
  name: agentplane-egress-credentials
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: agentplane-egress-credentials-namespace
      namespace: ducktape-flux
    - name: external-creds
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/agentplane-egress-credentials/secrets
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: agentplane-egress-credentials
    namespace: ducktape-flux
  timeout: 2m
  wait: true
