apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: Holds the write-scoped Google OAuth token; never mirrored elsewhere.
  labels:
    goldilocks.fairwinds.com/enabled: "false"
    name: google-mcp
  name: google-mcp
spec: {}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: google-mcp-bearer
  namespace: google-mcp
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: google-mcp-bearer
  namespace: google-mcp
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: google-mcp-bearer
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Owner
    name: google-mcp-bearer
    template:
      data:
        bearer-token: "{{ .password }}"
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: ^agentplane-staging$
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: ^agentplane-staging$
      type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: google-mcp
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: google-mcp
  name: google-mcp
  namespace: google-mcp
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: google-mcp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: google-mcp
        cdk8s.io/metadata.addr: google-mcp-app-deployment-c8d4899e
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: GOOGLE_MCP_TOKEN_FILE
              value: /run/secrets/google-write-token/access_token
            - name: GOOGLE_MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  key: bearer-token
                  name: google-mcp-bearer
            - name: GOOGLE_MCP_HOST
              value: 0.0.0.0
            - name: GOOGLE_MCP_PORT
              value: "8080"
          image: git.allegedly.works/ducktape-ci/google-mcp:unset
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
          name: server
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /run/secrets/google-write-token
              name: google-token
              readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
        - name: google-token
          secret:
            optional: true
            secretName: google-write-access-token
---
apiVersion: v1
kind: Service
metadata:
  name: google-mcp
  namespace: google-mcp
spec:
  externalIPs: []
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    cdk8s.io/metadata.addr: google-mcp-app-deployment-c8d4899e
  type: ClusterIP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: google-mcp
  namespace: google-mcp
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toFQDNs:
        - matchName: gmail.googleapis.com
        - matchName: www.googleapis.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - gmail.googleapis.com
            - www.googleapis.com
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: google-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-actions
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
