apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-testing-namespace
  namespace: ducktape-flux
  annotations:
    description: Agentplane testing namespace + quota for sandboxed runner Pods and the integration app.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 2m
  path: ./cluster/k8s/agentplane-testing/namespace
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: agentplane-testing-namespace
    namespace: ducktape-flux
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: agentplane-testing
