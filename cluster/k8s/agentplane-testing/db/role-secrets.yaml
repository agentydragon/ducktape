# ESO-generated credentials for the two managed roles. The initdb-owned trajectory role keeps
# CNPG's postgres-app Secret; these Secrets use distinct names from the old clusters so the
# cutover cannot conflict with CNPG owner references while those clusters are being pruned.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgres-actions-generator
  namespace: agentplane-testing
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-actions
  namespace: agentplane-testing
spec:
  refreshInterval: 8760h
  target:
    name: postgres-actions
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "actions"
        password: "{{ .password }}"
        host: "postgres-rw.agentplane-testing.svc"
        port: "5432"
        dbname: "actions"
        uri: "postgresql://actions:{{ .password }}@postgres-rw.agentplane-testing.svc:5432/actions"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: postgres-actions-generator
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgres-egress-generator
  namespace: agentplane-testing
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-egress
  namespace: agentplane-testing
spec:
  refreshInterval: 8760h
  target:
    name: postgres-egress
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "egress"
        password: "{{ .password }}"
        host: "postgres-rw.agentplane-testing.svc"
        port: "5432"
        dbname: "egress"
        uri: "postgresql://egress:{{ .password }}@postgres-rw.agentplane-testing.svc:5432/egress"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: postgres-egress-generator
