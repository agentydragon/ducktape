# Public: the OAuth authorize step is inherently browser-facing (or, for the acceptance test,
# reached directly the same way a browser would), same as the real GitHub/Kubernetes MCP OAuth
# providers already linked in staging. Unlike the credentialless "everything" fixture, this one
# is OAuth-protected -- public reach only lets a caller complete a self-contained fake OAuth
# dance and call the harmless bounded `echo` tool on this fixture.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentplane-oauth-fixture
  namespace: agentplane-testing
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  hostnames:
    - agentplane-oauth-fixture-testing.allegedly.works
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: agentplane-oauth-fixture
          port: 8080
