# configMapGenerator input; not a standalone Kubernetes manifest (kubeconform-excluded).
# Reviewed credentialless remote binding; discovery supplies Actions at process startup.
# Keep this endpoint aligned with the existing mcp-everything Service (no runner MCP access).
allowed_service_account_namespaces:
  - agentplane-testing
identities:
  personal:
    enabled: true
mcp_servers:
  example:
    server_id: example
    provider: example
    server_url: http://agentplane-oauth-fixture.agentplane-testing.svc.cluster.local:8080/mcp
    client_id: agentplane-acceptance-client
    redirect_uri: https://agentplane-testing.allegedly.works/mcp-linkage/callback
action_groups:
  everything:
    title: Upstream Everything
    description: Credentialless MCP reference server for testing acceptance.
    executor:
      kind: mcp
      description: Community-built Everything image; no user account, workload token, or mounted credentials.
      config:
        transport: streamable-http
        url: http://agentplane-mcp-everything.agentplane-testing.svc.cluster.local:3001/mcp
        auth: none
  example:
    title: OAuth Example
    description: Self-contained OAuth-linked MCP fixture for testing acceptance of the linkage flow.
    executor:
      kind: mcp
      description: In-memory OAuth authorization server and MCP tool in one process; no real credentials.
      config:
        transport: streamable-http
        url: http://agentplane-oauth-fixture.agentplane-testing.svc.cluster.local:8080/mcp
        server_id: example
        auth: oauth
fixture_auto_allow:
  group: everything
