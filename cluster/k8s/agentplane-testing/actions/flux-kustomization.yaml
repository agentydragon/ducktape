apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-testing-actions
  namespace: ducktape-flux
  annotations:
    description: Action Service with a dedicated database on testing's shared PostgreSQL, direct Dex operator federation, workload-proxy ingress and the testing-only MCP fixture.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  path: ./cluster/k8s/agentplane-testing/actions
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: gateway
      namespace: ducktape-flux
    - name: agentplane-testing-dex
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: agentplane-testing-namespace
      namespace: ducktape-flux
    - name: agentplane-testing-db
      namespace: ducktape-flux
    - name: agentplane-testing-egress
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
