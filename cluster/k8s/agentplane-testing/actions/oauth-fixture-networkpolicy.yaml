# Cluster-internal only, no public route: the Action Service needs it for discovery/token
# exchange/tool calls, and the acceptance suite's "browser" GET to /authorize runs from the
# public-coder-devbox KubeVirt VM (cluster/k8s/agents/public-coder-agent/devbox/), a genuine
# pod-network endpoint reachable the same way any other pod is -- not an external host, so no
# port-forward or public exposure is needed. No fixture egress: it is entirely self-contained and
# mints its own tokens in memory.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-oauth-fixture
  namespace: agentplane-testing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-oauth-fixture
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-testing
            app.kubernetes.io/name: agentplane-actions
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: public-coder-agent
            app.kubernetes.io/name: public-coder-devbox
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egressDeny:
    - toEntities:
        - all
