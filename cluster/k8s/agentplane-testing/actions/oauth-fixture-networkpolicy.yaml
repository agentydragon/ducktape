# Public ingress via the Gateway (the OAuth authorize/token/well-known endpoints and the MCP
# tool endpoint all live on this one process); no fixture egress -- it is entirely self-contained
# and mints its own tokens in memory.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-oauth-fixture
  namespace: agentplane-testing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-oauth-fixture
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egressDeny:
    - toEntities:
        - all
