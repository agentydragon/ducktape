# Cluster-internal only, no public route. The Action Service reaches it for protected-resource
# discovery and tool calls. The fixture fetches Dex's signing keys through the internal Service;
# its public Dex issuer is metadata only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-oauth-fixture
  namespace: agentplane-testing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-oauth-fixture
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-testing
            app.kubernetes.io/name: agentplane-actions
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-testing
            app.kubernetes.io/name: agentplane-testing-dex
      toPorts:
        - ports:
            - port: "5556"
              protocol: TCP
  egressDeny:
    - toEntities:
        - all
