# Only the testing control-plane callers may reach this no-auth upstream reference server.
# Runner isolation stays unchanged; there is no public route or fixture egress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-mcp-everything
  namespace: agentplane-testing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-mcp-everything
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-testing
            app.kubernetes.io/name: agentplane-app
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-testing
            app.kubernetes.io/name: agentplane-actions
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
  egressDeny:
    - toEntities:
        - all
---
# Add only this destination to the callers' existing egress fences.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-mcp-everything-callers
  namespace: agentplane-testing
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - agentplane-app
          - agentplane-actions
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-testing
            app.kubernetes.io/name: agentplane-mcp-everything
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
