apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentplane-actions
  namespace: agentplane-testing
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentplane-testing-actions-token-reviewer
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentplane-testing-actions-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentplane-testing-actions-token-reviewer
subjects:
  - kind: ServiceAccount
    name: agentplane-actions
    namespace: agentplane-testing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-actions
  namespace: agentplane-testing
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - actionpolicysets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - actionpolicybindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - actionpolicysets/status
    verbs:
      - patch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - actionpolicybindings/status
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-actions
  namespace: agentplane-testing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-actions
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: agentplane-actions
    namespace: agentplane-testing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentplane-actions-settings
  namespace: agentplane-testing
data:
  settings.yaml: |
    allowed_service_account_namespaces:
      - agentplane-testing
    mcp_servers:
      example:
        server_id: example
        provider: example
        server_url: http://agentplane-oauth-fixture.agentplane-testing.svc.cluster.local:8080/mcp
        client_id: agentplane-testing-mcp
        client_secret_file: /etc/agentplane-mcp/client-secret
        redirect_uri: https://agentplane-testing.allegedly.works/mcp-linkage/callback
        scopes:
          - openid
    action_groups:
      everything:
        title: Upstream Everything
        description: Credentialless MCP reference server for testing acceptance.
        executor:
          kind: mcp
          description: Community-built Everything image; no user account, workload token, or mounted credentials.
          config:
            transport: streamable-http
            url: http://agentplane-mcp-everything.agentplane-testing.svc.cluster.local:3001/mcp
            auth: none
      example:
        title: OAuth Example
        description: Dex-backed OAuth-linked MCP fixture for testing acceptance of the linkage flow.
        executor:
          kind: mcp
          description: MCP tool protected by Dex-issued JWTs; no real credentials.
          config:
            transport: streamable-http
            url: http://agentplane-oauth-fixture.agentplane-testing.svc.cluster.local:8080/mcp
            server_id: example
            auth: oauth
immutable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    description: Direct Dex operator federation pins for the isolated testing Action Service.
  name: agentplane-action-federation
  namespace: agentplane-testing
data:
  action-federation: |
    {
      "mode": "direct",
      "service_url": "http://agentplane-actions.agentplane-testing.svc.cluster.local:8080",
      "login_jwks_uri": "https://agentplane-dex-testing.allegedly.works/dex/keys",
      "login_token_profile": "dex",
      "target": {
        "issuer": "https://agentplane-dex-testing.allegedly.works/dex",
        "audience": "agentplane-testing",
        "jwks_uri": "https://agentplane-dex-testing.allegedly.works/dex/keys",
        "token_profile": "dex"
      },
      "scope": "openid"
    }
  operator-oidc: |
    {
      "issuer": "https://agentplane-dex-testing.allegedly.works/dex",
      "audience": "agentplane-testing",
      "jwks_uri": "https://agentplane-dex-testing.allegedly.works/dex/keys",
      "token_profile": "dex"
    }
immutable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    configmap.reloader.stakater.com/reload: agentplane-action-federation,agentplane-actions-settings
    secret.reloader.stakater.com/reload: agentplane-mcp-oauth
  labels:
    app.kubernetes.io/name: agentplane-actions
  name: agentplane-actions
  namespace: agentplane-testing
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-actions-actions-deployment-c8e06651
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-actions
        cdk8s.io/metadata.addr: agentplane-actions-actions-deployment-c8e06651
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hil-ovh
      automountServiceAccountToken: true
      containers:
        - args:
            - --host=0.0.0.0
            - --port=8080
            - --token-audience=agentplane-egress
          env:
            - name: AGENTPLANE_ACTIONS_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DATABASE_URL
              value: postgresql://$(AGENTPLANE_ACTIONS_DB_USER):$(AGENTPLANE_ACTIONS_DB_PASSWORD)@$(AGENTPLANE_ACTIONS_DB_HOST):$(AGENTPLANE_ACTIONS_DB_PORT)/$(AGENTPLANE_ACTIONS_DB_NAME)
            - name: AGENTPLANE_ACTIONS_OPERATOR_OIDC
              valueFrom:
                configMapKeyRef:
                  key: operator-oidc
                  name: agentplane-action-federation
            - name: AGENTPLANE_ACTIONS_CONFIG_FILE
              value: /etc/agentplane-actions/settings.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-action-service:unset
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          name: actions
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/agentplane-mcp
              name: secret-agentplane-mcp-oauth
              readOnly: true
            - mountPath: /etc/agentplane-actions
              name: configmap-agentplane-actions-settings
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      initContainers:
        - env:
            - name: AGENTPLANE_ACTIONS_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DATABASE_URL
              value: postgresql://$(AGENTPLANE_ACTIONS_DB_USER):$(AGENTPLANE_ACTIONS_DB_PASSWORD)@$(AGENTPLANE_ACTIONS_DB_HOST):$(AGENTPLANE_ACTIONS_DB_PORT)/$(AGENTPLANE_ACTIONS_DB_NAME)
            - name: AGENTPLANE_ACTIONS_OPERATOR_OIDC
              valueFrom:
                configMapKeyRef:
                  key: operator-oidc
                  name: agentplane-action-federation
            - name: AGENTPLANE_ACTIONS_CONFIG_FILE
              value: /etc/agentplane-actions/settings.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-action-service-migrate:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-actions
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      volumes:
        - name: secret-agentplane-mcp-oauth
          secret:
            defaultMode: 288
            items:
              - key: client-secret
                path: client-secret
            secretName: agentplane-mcp-oauth
        - configMap:
            name: agentplane-actions-settings
          name: configmap-agentplane-actions-settings
---
apiVersion: v1
kind: Service
metadata:
  name: agentplane-actions
  namespace: agentplane-testing
spec:
  externalIPs: []
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    cdk8s.io/metadata.addr: agentplane-actions-actions-deployment-c8e06651
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentplane-actions-mcp
  namespace: agentplane-testing
spec:
  hostnames:
    - agentplane-actions-testing.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  rules:
    - backendRefs:
        - name: agentplane-actions
          port: 8080
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
          type: ResponseHeaderModifier
      matches:
        - path:
            type: Exact
            value: /mcp
        - path:
            type: Exact
            value: /.well-known/oauth-authorization-server
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
        - path:
            type: Exact
            value: /register
        - path:
            type: Exact
            value: /authorize
        - path:
            type: Exact
            value: /token
        - path:
            type: Exact
            value: /revoke
        - path:
            type: Exact
            value: /auth/callback
      timeouts:
        backendRequest: 3600s
        request: 3600s
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-actions
  namespace: agentplane-testing
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: claude.ai
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - claude.ai
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: postgres
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - agentplane-dex-testing.allegedly.works
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-oauth-fixture
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-actions
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-egress
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-app
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
