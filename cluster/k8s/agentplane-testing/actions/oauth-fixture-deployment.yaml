apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentplane-oauth-fixture
  namespace: agentplane-testing
  annotations:
    description: Dex-backed OAuth-protected MCP server for acceptance-testing MCP OAuth linkage; the fixture verifies Dex JWTs locally and has no credentials.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplane-oauth-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-oauth-fixture
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: forgejo-images-creds
      containers:
        - name: fixture
          image: git.allegedly.works/ducktape-ci/agentplane-oauth-fixture:devel-20260912151158-3579607 # {"$imagepolicy": "flux-system:agentplane-oauth-fixture"}
          env:
            # The MCP resource server remains cluster-internal. Dex's public issuer is advertised
            # to clients, while the fixture fetches signing keys over the internal Dex Service.
            - name: OAUTH_FIXTURE_BASE_URL
              value: http://agentplane-oauth-fixture.agentplane-testing.svc.cluster.local:8080
            - name: OAUTH_FIXTURE_AUTHORIZATION_SERVER
              value: https://agentplane-dex-testing.allegedly.works/dex
            - name: OAUTH_FIXTURE_JWKS_URI
              value: http://agentplane-testing-dex.agentplane-testing.svc.cluster.local:5556/dex/keys
            - name: OAUTH_FIXTURE_AUDIENCE
              value: agentplane-testing-mcp
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            # No readOnlyRootFilesystem: the aspect_rules_py launcher materialises its venv at
            # startup inside the image's own runfiles directory, so the root filesystem must stay
            # writable (see cluster/k8s/ssh-mcp/deployment.yaml for the same constraint).
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
