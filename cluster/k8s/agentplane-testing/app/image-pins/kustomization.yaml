apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  # The `:tag` suffix on every entry tells Setters to write back only the bare tag
  # value -- see cluster/k8s/litellm/app/image-pins/kustomization.yaml for why the
  # bare (full-reference) marker form is wrong here. Patches by image name across
  # every resource in this Kustomization, not just the Deployment -- also covers the
  # runner SandboxTemplate's two containers.
  - name: git.allegedly.works/ducktape-ci/agentplane-app
    newTag: devel-20260917104412-99b584a # {"$imagepolicy": "flux-system:agentplane-app:tag"}
  - name: git.allegedly.works/ducktape-ci/agentplane-app-migrate
    newTag: devel-20260917094945-3286e89 # {"$imagepolicy": "flux-system:agentplane-app-migrate:tag"}
  - name: git.allegedly.works/ducktape-ci/agentplane-runner
    newTag: devel-20260916050618-4dc503c # {"$imagepolicy": "flux-system:agentplane-runner:tag"}
  - name: git.allegedly.works/ducktape-ci/agentplane-egress-sidecar
    newTag: devel-20260915213533-d379783 # {"$imagepolicy": "flux-system:agentplane-egress-sidecar:tag"}
