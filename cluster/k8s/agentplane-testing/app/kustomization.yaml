apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Generated ConfigMaps carry no namespace of their own (cluster/validation/test_generator_namespace.py).
namespace: agentplane-testing
resources:
  - serviceaccount-agentplane-runner.yaml
  - sandboxtemplate-agentplane-runner.yaml
  - serviceaccount-agentplane-app.yaml
  - serviceaccount-agentplane-agent.yaml
  - role-agentplane-app.yaml
  - rolebinding-agentplane-app.yaml
  - clusterrole-agentplane-testing-app-token-reviewer.yaml
  - deployment-agentplane-app.yaml
  - service-agentplane-app.yaml
  - httproute.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: agentplane-app-config
    files:
      - config.yaml
