# The central egress proxy (x/agentplane/egress): every sandbox sidecar relays here with the Pod's
# projected token; the proxy proves it by TokenReview, decides the request from this namespace's
# EgressPolicy and EgressBinding resources, and substitutes credentials it reads from
# agentplane-egress-credentials. It intercepts TLS with the CA in certificate-agentplane-egress-ca.yaml,
# assembled into a writable confdir at startup (reloader restarts it when that Secret rotates).
# One replica with Recreate: the rules Service must reach the same enforcement Index, and
# identity caches are process-local. Shared history alone does not make enforcement replica-safe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentplane-egress
  namespace: agentplane-testing
  labels:
    app.kubernetes.io/name: agentplane-egress
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplane-egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-egress
    spec:
      # With the sandboxes it serves. Unpinned it floats, and when wyrm2 stopped it landed on
      # optiplex -- correct, and one mesh crossing per request away from everything it talks to.
      # The zone has five nodes, so this still reschedules; it just does not leave.
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      # Stateless and single-replica; allow control-plane nodes as overflow, as LiteLLM does.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      serviceAccountName: agentplane-egress
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: forgejo-images-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Migrations are part of the proxy Pod lifecycle: a new migration image rolls the
      # Deployment, and a failed migration keeps this Pod unavailable while Kubernetes retries
      # it. The migration takes a PostgreSQL advisory lock, so concurrent starts serialize.
      initContainers:
        - name: migrate
          image: git.allegedly.works/ducktape-ci/agentplane-egress-migrate:devel-20260911005717-ebffd47 # {"$imagepolicy": "flux-system:agentplane-egress-migrate"}
          imagePullPolicy: Always
          env:
            - name: AGENTPLANE_EGRESS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentplane-egress-db-app
                  key: uri
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: proxy
          image: git.allegedly.works/ducktape-ci/agentplane-egress:devel-20260911005723-ebffd47 # {"$imagepolicy": "flux-system:agentplane-egress"}
          imagePullPolicy: IfNotPresent
          args:
            - --namespace=agentplane-testing
            # The same namespace for now; see the app Deployment's note.
            - --sandbox-namespace=agentplane-testing
            - --credentials-namespace=agentplane-egress-credentials
            - --listen-port=8888
            - --admin-port=8081
            - --agent-api-port=8082
            - --ca-cert=/etc/agentplane-egress/ca/tls.crt
            - --ca-key=/etc/agentplane-egress/ca/tls.key
            - --confdir=/var/lib/agentplane-egress
            # Must equal the audience of the projected token in the runner SandboxTemplate
            # (../app/sandboxtemplate-agentplane-runner.yaml); a token for any other audience is refused.
            - --token-audience=agentplane-egress
          env:
            - name: AGENTPLANE_EGRESS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentplane-egress-db-app
                  key: uri
          ports:
            - name: proxy
              containerPort: 8888
              protocol: TCP
            - name: admin
              containerPort: 8081
              protocol: TCP
            - name: agent-api
              containerPort: 8082
              protocol: TCP
          # /healthz is 200 once the watches have synced; before that the proxy refuses everything.
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ca
              mountPath: /etc/agentplane-egress/ca
              readOnly: true
            - name: confdir
              mountPath: /var/lib/agentplane-egress
      volumes:
        - name: ca
          secret:
            secretName: agentplane-egress-ca
        - name: confdir
          emptyDir: {}
