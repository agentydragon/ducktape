# What the proxy reads here to decide a request: the policies, bindings and credentials. No Pods --
# a TokenReview proves the bearer and names the ServiceAccount its Pod runs as, which is the subject
# a binding names, so there is nothing left for the proxy to read off the object. No Secrets either:
# an EgressCredential names one, but the values live in agentplane-egress-credentials, where the
# proxy holds a separate read grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-egress
  namespace: agentplane-testing
rules:
  - apiGroups: ["agentplane.allegedly.works"]
    resources: ["egresspolicies", "egressbindings", "egresscredentials"]
    verbs: ["get", "list", "watch"]
