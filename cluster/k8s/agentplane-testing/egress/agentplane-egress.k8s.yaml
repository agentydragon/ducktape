apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentplane-egress
  namespace: agentplane-testing
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentplane-testing-egress-token-reviewer
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentplane-testing-egress-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentplane-testing-egress-token-reviewer
subjects:
  - kind: ServiceAccount
    name: agentplane-egress
    namespace: agentplane-testing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-egress
  namespace: agentplane-testing
rules:
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - egresspolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - egressbindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - egresscredentials
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-egress
  namespace: agentplane-testing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-egress
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: agentplane-egress
    namespace: agentplane-testing
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: agentplane-egress-root-ca
  namespace: agentplane-testing
spec:
  commonName: agentplane-egress-root-ca
  duration: 87600h
  isCA: true
  issuerRef:
    kind: ClusterIssuer
    name: cluster-ca-bootstrap
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 8760h
  secretName: agentplane-testing-egress-ca
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: cert-manager
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: cert-manager
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: agentplane-testing-egress-ca
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        key: ca.crt
        name: cluster-root-ca-secret
    - secret:
        key: tls.crt
        name: agentplane-testing-egress-ca
  target:
    configMap:
      key: ca-certificates.crt
      metadata:
        annotations:
          description: Trust bundle for agentplane-testing runner HTTPS traffic intercepted by the egress proxy
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - agentplane-testing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentplane-egress-settings
  namespace: agentplane-testing
data:
  settings.yaml: |
    allowed_service_account_namespaces:
      - agentplane-testing
immutable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: agentplane-egress
  name: agentplane-egress
  namespace: agentplane-testing
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-egress-egress-deployment-c8d52496
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-egress
        cdk8s.io/metadata.addr: agentplane-egress-egress-deployment-c8d52496
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hil-ovh
      automountServiceAccountToken: true
      containers:
        - args:
            - --rules-namespace=agentplane-testing
            - --credentials-namespace=agentplane-egress-credentials
            - --listen-port=8888
            - --admin-port=8081
            - --agent-api-port=8082
            - --ca-cert=/etc/agentplane-egress/ca/tls.crt
            - --ca-key=/etc/agentplane-egress/ca/tls.key
            - --confdir=/var/lib/agentplane-egress
            - --token-audience=agentplane-egress
          env:
            - name: AGENTPLANE_EGRESS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: postgres-egress
            - name: AGENTPLANE_EGRESS_CONFIG_FILE
              value: /etc/agentplane-egress/settings.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-egress:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
          name: proxy
          ports:
            - containerPort: 8888
              name: proxy
              protocol: TCP
            - containerPort: 8081
              name: admin
              protocol: TCP
            - containerPort: 8082
              name: agent-api
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/agentplane-egress/ca
              name: ca
              readOnly: true
            - mountPath: /var/lib/agentplane-egress
              name: confdir
            - mountPath: /etc/agentplane-egress/settings.yaml
              name: configmap-agentplane-egress-settings
              readOnly: true
              subPath: settings.yaml
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      initContainers:
        - env:
            - name: AGENTPLANE_EGRESS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: postgres-egress
          image: git.allegedly.works/ducktape-ci/agentplane-egress-migrate:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-egress
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - name: ca
          secret:
            secretName: agentplane-testing-egress-ca
        - emptyDir: {}
          name: confdir
        - configMap:
            name: agentplane-egress-settings
          name: configmap-agentplane-egress-settings
---
apiVersion: v1
kind: Service
metadata:
  name: agentplane-egress
  namespace: agentplane-testing
spec:
  externalIPs: []
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8082
    - name: proxy
      port: 8888
      protocol: TCP
      targetPort: 8888
  selector:
    cdk8s.io/metadata.addr: agentplane-egress-egress-deployment-c8d52496
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: agentplane-egress-admin
  namespace: agentplane-testing
spec:
  externalIPs: []
  ports:
    - name: admin
      port: 8081
      protocol: TCP
      targetPort: 8081
  selector:
    cdk8s.io/metadata.addr: agentplane-egress-egress-deployment-c8d52496
  type: ClusterIP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-egress
  namespace: agentplane-testing
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: postgres
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-egress
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-llm-ingress
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-actions
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEntities:
        - world
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-egress
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-runner
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-app
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-egress
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: agentplane-workload
  namespace: agentplane-testing
spec:
  description: The calling Sandbox Pod's short-lived, Pod-bound workload identity for first-party Agentplane destinations. It conveys no LiteLLM credential or operator, Agent, or Thread authority.
  source:
    authenticatedWorkloadToken: {}
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: github-pat
  namespace: agentplane-testing
spec:
  description: A GitHub personal access token belonging to the bot account agentydragon-agent. Requests carrying it act as that account and are attributable to it. The proxy does not narrow what the token itself may do — the rule's hosts and methods are the only limit it adds, so treat anything the token can reach on those hosts as reachable.
  source:
    secretRef:
      name: agentplane-github-pat
      key: token
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
    - header: Authorization
      method: basicPassword
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: basic
  namespace: agentplane-testing
spec:
  rules:
    - hosts:
        - agentplane-llm-ingress.agentplane-testing.svc.cluster.local
      methods:
        - GET
        - POST
      clusterInternal: true
      credentialRef:
        name: agentplane-workload
    - hosts:
        - agentplane-actions.agentplane-testing.svc.cluster.local
      methods:
        - GET
        - POST
      paths:
        - /mcp
        - /openapi.json
        - /v1/action-groups
        - /v1/action-groups/**
        - /v1/action-policy
        - /v1/action-requests
        - /v1/action-requests/**
      clusterInternal: true
      credentialRef:
        name: agentplane-workload
    - hosts:
        - agentplane-egress.agentplane-testing.svc.cluster.local
      methods:
        - GET
      paths:
        - /openapi.json
        - /v1/rules
      clusterInternal: true
      credentialRef:
        name: agentplane-workload
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: github-public
  namespace: agentplane-testing
spec:
  rules:
    - hosts:
        - api.github.com
        - github.com
        - "*.githubusercontent.com"
      methods:
        - GET
        - POST
      credentialRef:
        name: github-pat
