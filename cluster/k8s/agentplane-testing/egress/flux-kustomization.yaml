apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-testing-egress
  namespace: ducktape-flux
  annotations:
    description: Agentplane secure egress in agentplane-testing - the proxy Deployment with its identity, RBAC, interception CA and trust bundle, substituted GitHub and workload identities, and the seed policy and binding for every managed Sandbox. The sandbox side (sidecar, proxy environment) is in the runner SandboxTemplate under ../app.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  path: ./cluster/k8s/agentplane-testing/egress
  prune: true
  # Explicit checks include the generated ConfigMap; wait:true ignores healthChecks.
  # The Bundle is applied before trust-manager asynchronously creates this target.
  # Do not advertise egress readiness until runner Sandboxes can mount the bundle.
  healthChecks:
    - apiVersion: v1
      kind: ConfigMap
      name: agentplane-testing-egress-ca
      namespace: agentplane-testing
    - apiVersion: apps/v1
      kind: Deployment
      name: agentplane-egress
      namespace: agentplane-testing
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: agentplane-egress-root-ca
      namespace: agentplane-testing
    - apiVersion: trust.cert-manager.io/v1alpha1
      kind: Bundle
      name: agentplane-testing-egress-ca
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: agentplane-testing-namespace
      namespace: ducktape-flux
    # Bring the authenticated destination up before changing the model policy away from direct
    # LiteLLM. The app already depends on this egress Kustomization, so runner URLs change last.
    - name: agentplane-testing-llm-ingress
      namespace: ducktape-flux
    - name: agentplane-crds # the seed's EgressPolicy and EgressBinding
      namespace: ducktape-flux
    - name: external-creds # the source-side grant on the agentydragon-agent PAT
      namespace: ducktape-flux
    - name: external-secrets-config # the ClusterSecretStore the PAT is read through
      namespace: ducktape-flux
    - name: cert-manager-environment # the cluster-ca-bootstrap issuer the interception CA is signed by
      namespace: ducktape-flux
    - name: cert-manager-trust # trust-manager, for the Bundle
      namespace: ducktape-flux
    - name: reflector # mirrors the CA Secret into trust-manager's source namespace
      namespace: ducktape-flux
    - name: forgejo-images # reflects the proxy image's pull credential
      namespace: ducktape-flux
