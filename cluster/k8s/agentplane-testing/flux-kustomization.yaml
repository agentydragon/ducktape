apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Complete Agentplane testing environment, including namespace, database, Dex, egress, LLM ingress, Actions fixtures, app, runner template, and operator RBAC.
  name: agentplane-testing
  namespace: ducktape-flux
spec:
  deletionPolicy: Orphan
  dependsOn:
    - name: agentplane-crds
    - name: agent-sandbox-controller
    - name: cert-manager-environment
    - name: cert-manager-trust
    - name: claude-rbac
    - name: cnpg
    - name: external-creds
    - name: external-secrets-config
    - name: forgejo-images
    - name: gateway
    - name: litellm-keys-tf
    - name: local-path-provisioner
    - name: reflector
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      current: has(status.applied) && status.applied && has(status.observedGeneration) && status.observedGeneration == metadata.generation
      kind: Database
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: agentplane-testing
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: postgres
      namespace: agentplane-testing
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      name: actions
      namespace: agentplane-testing
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      name: egress
      namespace: agentplane-testing
    - apiVersion: apps/v1
      kind: Deployment
      name: agentplane-llm-ingress
      namespace: agentplane-testing
    - apiVersion: apps/v1
      kind: Deployment
      name: agentplane-egress
      namespace: agentplane-testing
    - apiVersion: apps/v1
      kind: Deployment
      name: agentplane-app
      namespace: agentplane-testing
    - apiVersion: apps/v1
      kind: Deployment
      name: agentplane-actions
      namespace: agentplane-testing
    - apiVersion: apps/v1
      kind: Deployment
      name: agentplane-mcp-everything
      namespace: agentplane-testing
    - apiVersion: apps/v1
      kind: Deployment
      name: agentplane-oauth-fixture
      namespace: agentplane-testing
    - apiVersion: apps/v1
      kind: Deployment
      name: agentplane-testing-dex
      namespace: agentplane-testing
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: agentplane-egress-root-ca
      namespace: agentplane-testing
    - apiVersion: trust.cert-manager.io/v1alpha1
      kind: Bundle
      name: agentplane-testing-egress-ca
    - apiVersion: trust.cert-manager.io/v1alpha1
      kind: Bundle
      name: agentplane-egress-upstream-ca
    - apiVersion: v1
      kind: ConfigMap
      name: agentplane-testing-egress-ca
      namespace: agentplane-testing
    - apiVersion: v1
      kind: ConfigMap
      name: agentplane-egress-upstream-ca
      namespace: agentplane-testing
  interval: 10m
  path: ./cluster/k8s/agentplane-testing
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: agentplane-testing
    namespace: ducktape-flux
  timeout: 10m
