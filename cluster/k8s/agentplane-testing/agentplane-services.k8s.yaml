apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    configmap.reloader.stakater.com/reload: agentplane-action-federation
    secret.reloader.stakater.com/reload: agentplane-oidc
  labels:
    app.kubernetes.io/name: agentplane-app
  name: agentplane-app
  namespace: agentplane-testing
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-services-app-deployment-c86e6176
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-app
        cdk8s.io/metadata.addr: agentplane-services-app-deployment-c86e6176
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hil-ovh
      automountServiceAccountToken: true
      containers:
        - args:
            - --namespace=agentplane-testing
            - --sandbox-namespace=agentplane-testing
            - --runner-port=7000
            - --host=0.0.0.0
            - --port=8080
          env:
            - name: AGENTPLANE_ACTION_FEDERATION
              valueFrom:
                configMapKeyRef:
                  key: action-federation
                  name: agentplane-action-federation
            - name: AGENTPLANE_CONFIG_FILE
              value: /etc/agentplane/config.yaml
            - name: AGENTPLANE_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-app
            - name: AGENTPLANE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-app
            - name: AGENTPLANE_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-app
            - name: AGENTPLANE_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-app
            - name: AGENTPLANE_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: postgres-app
            - name: AGENTPLANE_DATABASE_URL
              value: postgresql+asyncpg://$(AGENTPLANE_DB_USER):$(AGENTPLANE_DB_PASSWORD)@$(AGENTPLANE_DB_HOST):$(AGENTPLANE_DB_PORT)/$(AGENTPLANE_DB_NAME)
            - name: AGENTPLANE_OIDC_ISSUER
              value: https://agentplane-dex-testing.allegedly.works/dex
            - name: AGENTPLANE_OIDC_PUBLIC_BASE_URL
              value: https://agentplane-testing.allegedly.works
            - name: AGENTPLANE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client-id
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client-secret
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: session-secret
                  name: agentplane-oidc
            - name: AGENTPLANE_TOKEN_SUBJECTS
              value: '["system:serviceaccount:agentplane-testing:agentplane-agent"]'
          image: git.allegedly.works/ducktape-ci/agentplane-app:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
          name: app
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/agentplane
              name: configmap-agentplane-app-config
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      initContainers:
        - env:
            - name: AGENTPLANE_ACTION_FEDERATION
              valueFrom:
                configMapKeyRef:
                  key: action-federation
                  name: agentplane-action-federation
            - name: AGENTPLANE_CONFIG_FILE
              value: /etc/agentplane/config.yaml
            - name: AGENTPLANE_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-app
            - name: AGENTPLANE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-app
            - name: AGENTPLANE_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-app
            - name: AGENTPLANE_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-app
            - name: AGENTPLANE_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: postgres-app
            - name: AGENTPLANE_DATABASE_URL
              value: postgresql+asyncpg://$(AGENTPLANE_DB_USER):$(AGENTPLANE_DB_PASSWORD)@$(AGENTPLANE_DB_HOST):$(AGENTPLANE_DB_PORT)/$(AGENTPLANE_DB_NAME)
            - name: AGENTPLANE_OIDC_ISSUER
              value: https://agentplane-dex-testing.allegedly.works/dex
            - name: AGENTPLANE_OIDC_PUBLIC_BASE_URL
              value: https://agentplane-testing.allegedly.works
            - name: AGENTPLANE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client-id
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client-secret
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: session-secret
                  name: agentplane-oidc
            - name: AGENTPLANE_TOKEN_SUBJECTS
              value: '["system:serviceaccount:agentplane-testing:agentplane-agent"]'
          image: git.allegedly.works/ducktape-ci/agentplane-app-migrate:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-app
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      volumes:
        - configMap:
            name: agentplane-app-config
          name: configmap-agentplane-app-config
---
apiVersion: v1
