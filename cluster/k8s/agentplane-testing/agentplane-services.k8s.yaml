apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgres-actions-generator
  namespace: agentplane-testing
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-actions
  namespace: agentplane-testing
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: Password
          name: postgres-actions-generator
  refreshInterval: 8760h
  target:
    name: postgres-actions
    template:
      data:
        dbname: actions
        host: postgres-rw.agentplane-testing.svc
        password: "{{ .password }}"
        port: "5432"
        uri: postgresql://actions:{{ .password }}@postgres-rw.agentplane-testing.svc:5432/actions
        username: actions
      type: kubernetes.io/basic-auth
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgres-egress-generator
  namespace: agentplane-testing
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-egress
  namespace: agentplane-testing
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: Password
          name: postgres-egress-generator
  refreshInterval: 8760h
  target:
    name: postgres-egress
    template:
      data:
        dbname: egress
        host: postgres-rw.agentplane-testing.svc
        password: "{{ .password }}"
        port: "5432"
        uri: postgresql://egress:{{ .password }}@postgres-rw.agentplane-testing.svc:5432/egress
        username: egress
      type: kubernetes.io/basic-auth
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: agentplane-testing
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
          weight: 100
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
  bootstrap:
    initdb:
      database: app
      owner: app
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 1
  managed:
    roles:
      - ensure: present
        login: true
        name: actions
        passwordSecret:
          name: postgres-actions
      - ensure: present
        login: true
        name: egress
        passwordSecret:
          name: postgres-egress
  monitoring:
    enablePodMonitor: true
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 5Gi
    storageClass: local-path-ovh-ssd
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: actions
  namespace: agentplane-testing
spec:
  cluster:
    name: postgres
  databaseReclaimPolicy: delete
  name: actions
  owner: actions
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: egress
  namespace: agentplane-testing
spec:
  cluster:
    name: postgres
  databaseReclaimPolicy: delete
  name: egress
  owner: egress
---
