  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-services-llm-ingress-deployment-c86120fe
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-llm-ingress
        cdk8s.io/metadata.addr: agentplane-services-llm-ingress-deployment-c86120fe
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hil-ovh
      automountServiceAccountToken: true
      containers:
        - args:
            - --token-audience=agentplane-egress
            - --litellm-url=http://litellm.litellm.svc.cluster.local:4000
            - --host=0.0.0.0
            - --port=8080
          env:
            - name: AGENTPLANE_LLM_INGRESS_LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: litellm-key-cheap-experiments
            - name: AGENTPLANE_LLM_INGRESS_CONFIG_FILE
              value: /etc/agentplane-llm-ingress/settings.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-llm-ingress:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
          name: ingress
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/agentplane-llm-ingress/settings.yaml
              name: configmap-agentplane-llm-ingress-settings
              readOnly: true
              subPath: settings.yaml
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-llm-ingress
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - configMap:
            name: agentplane-llm-ingress-settings
          name: configmap-agentplane-llm-ingress-settings
