apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: agentplane-runner
  namespace: agentplane-testing
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-runner
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --state-dir
            - /state
            - --listen
            - 0.0.0.0:7000
            - --claude-binary
            - /usr/local/bin/claude
            - --anthropic-base-url
            - $(LITELLM_URL)
            - --codex-binary
            - /opt/codex/bin/codex
            - --openai-base-url
            - $(LITELLM_URL)/v1
            - --harness-env
            - HOME
            - --harness-env
            - PATH
            - --harness-env
            - HTTP_PROXY=http://127.0.0.1:3128
            - --harness-env
            - HTTPS_PROXY=http://127.0.0.1:3128
            - --harness-env
            - http_proxy=http://127.0.0.1:3128
            - --harness-env
            - https_proxy=http://127.0.0.1:3128
            - --harness-env
            - NO_PROXY=127.0.0.1,localhost
            - --harness-env
            - no_proxy=127.0.0.1,localhost
            - --harness-env
            - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
            - --harness-env
            - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
            - --harness-env
            - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
            - --harness-env
            - GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt
            - --harness-env
            - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          env:
            - name: LITELLM_URL
              value: http://agentplane-llm-ingress.agentplane-testing.svc.cluster.local:8080
            - name: ANTHROPIC_AUTH_TOKEN
              value: agentplane-credential-agentplane-workload
            - name: OPENAI_API_KEY
              value: agentplane-credential-agentplane-workload
          image: git.allegedly.works/ducktape-ci/agentplane-runner:unset
          name: runner
          ports:
            - containerPort: 7000
              name: runner
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /state
              name: state
            - mountPath: /etc/ssl/certs/ca-certificates.crt
              name: egress-ca
              readOnly: true
              subPath: ca-certificates.crt
        - env:
            - name: AGENTPLANE_EGRESS_SIDECAR_PROXY_HOST
              value: agentplane-egress.agentplane-testing.svc.cluster.local
            - name: AGENTPLANE_EGRESS_SIDECAR_PROXY_PORT
              value: "8888"
            - name: AGENTPLANE_EGRESS_SIDECAR_LISTEN_PORT
              value: "3128"
            - name: AGENTPLANE_EGRESS_SIDECAR_TOKEN_FILE
              value: /var/run/agentplane-egress/token
          image: git.allegedly.works/ducktape-ci/agentplane-egress-sidecar:unset
          name: egress-sidecar
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /var/run/agentplane-egress
              name: egress-token
              readOnly: true
      imagePullSecrets:
        - name: forgejo-images-creds
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-runner
      terminationGracePeriodSeconds: 60
      volumes:
        - configMap:
            name: agentplane-testing-egress-ca
          name: egress-ca
        - name: egress-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentplane-egress
                  expirationSeconds: 600
                  path: token
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: local-path-ovh-hdd
  volumeClaimTemplatesPolicy: Overrides
