apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: agentplane-workload
  namespace: agentplane-testing
spec:
  description: The calling Sandbox Pod's short-lived, Pod-bound workload identity for first-party Agentplane destinations. It conveys no LiteLLM credential or operator, Agent, or Thread authority.
  source:
    authenticatedWorkloadToken: {}
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: github-pat
  namespace: agentplane-testing
spec:
  description: A GitHub personal access token belonging to the bot account agentydragon-agent. Requests carrying it act as that account and are attributable to it. The proxy does not narrow what the token itself may do — the rule's hosts and methods are the only limit it adds, so treat anything the token can reach on those hosts as reachable.
  source:
    secretRef:
      name: agentplane-github-pat
      key: token
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
    - header: Authorization
      method: basicPassword
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: basic
  namespace: agentplane-testing
spec:
  rules:
    - hosts:
        - agentplane-llm-ingress.agentplane-testing.svc.cluster.local
      methods:
        - GET
        - POST
      clusterInternal: true
      credentialRef:
        name: agentplane-workload
    - hosts:
        - agentplane-actions.agentplane-testing.svc.cluster.local
      methods:
        - GET
        - POST
      paths:
        - /mcp
        - /openapi.json
        - /v1/action-groups
        - /v1/action-groups/**
        - /v1/action-policy
        - /v1/action-requests
        - /v1/action-requests/**
      clusterInternal: true
      credentialRef:
        name: agentplane-workload
    - hosts:
        - agentplane-egress.agentplane-testing.svc.cluster.local
      methods:
        - GET
      paths:
        - /openapi.json
        - /v1/rules
      clusterInternal: true
      credentialRef:
        name: agentplane-workload
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: github-public
  namespace: agentplane-testing
spec:
  rules:
    - hosts:
        - api.github.com
        - github.com
        - "*.githubusercontent.com"
      methods:
        - GET
        - POST
      credentialRef:
        name: github-pat
---
apiVersion: external-secrets.io/v1
