apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-testing-agent-rbac
  namespace: ducktape-flux
  annotations:
    description: Agent RBAC for agentplane-testing. Lightweight — a Role + RoleBinding giving the agent identities standing claim/sandbox/exec/port-forward access. Depends on namespace existing + agent RBAC base.
spec:
  interval: 10m
  path: ./cluster/k8s/agentplane-testing/agent-rbac
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: agentplane-testing-agent-rbac
    namespace: ducktape-flux
  timeout: 2m
  dependsOn:
    - name: agentplane-testing-namespace
      namespace: ducktape-flux
    - name: claude-rbac
      namespace: ducktape-flux
