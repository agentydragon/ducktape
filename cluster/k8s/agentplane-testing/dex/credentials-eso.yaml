# Generate all disposable testing credentials in-cluster. No credential value is committed;
# the app, Dex, and acceptance suite consume the generated Secrets.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-testing-dex-operator-password
  namespace: agentplane-testing
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-testing-dex-client-secret
  namespace: agentplane-testing
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-testing-mcp-client-secret
  namespace: agentplane-testing
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-testing-agentplane-session-secret
  namespace: agentplane-testing
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentplane-oidc
  namespace: agentplane-testing
  annotations:
    description: ESO-generated Dex client credentials and Agentplane session signing key.
spec:
  refreshInterval: 8760h
  target:
    name: agentplane-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        client-id: "agentplane-testing"
        client-secret: '{{ index . "client-secret" }}'
        session-secret: '{{ index . "session-secret" }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agentplane-testing-dex-client-secret
      rewrite:
        - regexp:
            source: password
            target: client-secret
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agentplane-testing-agentplane-session-secret
      rewrite:
        - regexp:
            source: password
            target: session-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentplane-mcp-oauth
  namespace: agentplane-testing
  annotations:
    description: ESO-generated credentials for the testing MCP client registered in Dex.
spec:
  refreshInterval: 8760h
  target:
    name: agentplane-mcp-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        client-id: "agentplane-testing-mcp"
        client-secret: '{{ index . "client-secret" }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agentplane-testing-mcp-client-secret
      rewrite:
        - regexp:
            source: password
            target: client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentplane-testing-acceptance-operator
  namespace: agentplane-testing
  annotations:
    description: Generates the acceptance password and Dex config together from one password value.
spec:
  refreshInterval: 8760h
  target:
    name: agentplane-testing-acceptance-operator
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: public-coder-agent
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: public-coder-agent
      data:
        login: "test-user@agentplane-testing.invalid"
        username: "test-user"
        password: "{{ .password }}"
        issuer: "https://agentplane-dex-testing.allegedly.works/dex"
        # Dex v2.45.1 encodes IDTokenSubject{user_id: "test-subject", conn_id: "local"}
        # as unpadded base64url protobuf, not the bare staticPasswords.userID.
        # TODO: derive this from readable user/connector IDs instead of hand-maintaining the encoded subject.
        subject: "Cgx0ZXN0LXN1YmplY3QSBWxvY2Fs"
        # Password generators are stateless: two ExternalSecret references generate different
        # values. Render both the plaintext credential and its hash in this one invocation.
        config.yaml: |
          issuer: https://agentplane-dex-testing.allegedly.works/dex
          storage:
            type: memory
          web:
            http: 0.0.0.0:5556
          oauth2:
            skipApprovalScreen: true
          enablePasswordDB: true
          staticClients:
            - id: agentplane-testing
              name: Agentplane testing
              secretEnv: DEX_CLIENT_SECRET
              redirectURIs:
                - https://agentplane-testing.allegedly.works/auth/callback
            - id: agentplane-testing-mcp
              name: Agentplane MCP testing
              secretEnv: MCP_CLIENT_SECRET
              redirectURIs:
                - https://agentplane-testing.allegedly.works/mcp-linkage/callback
          staticPasswords:
            - email: test-user@agentplane-testing.invalid
              hash: '{{ regexReplaceAll "^test-user:" (htpasswd "test-user" .password "bcrypt") "" }}'
              username: test-user
              preferredUsername: test-user
              userID: test-subject
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agentplane-testing-dex-operator-password
