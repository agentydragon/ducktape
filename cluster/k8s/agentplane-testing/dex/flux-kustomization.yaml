apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-testing-dex
  namespace: ducktape-flux
  annotations:
    description: Dex OIDC provider for the isolated manual Agentplane testing instance.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  path: ./cluster/k8s/agentplane-testing/dex
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: agentplane-testing-dex
    namespace: ducktape-flux
  dependsOn:
    - name: agentplane-testing-namespace
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
