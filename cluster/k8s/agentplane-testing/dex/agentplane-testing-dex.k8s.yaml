apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-testing-dex-operator-password
  namespace: agentplane-testing
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-testing-dex-client-secret
  namespace: agentplane-testing
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-testing-mcp-client-secret
  namespace: agentplane-testing
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-testing-agentplane-session-secret
  namespace: agentplane-testing
spec:
  allowRepeat: true
  digits: 16
  length: 64
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    description: ESO-generated Dex client credentials and Agentplane session signing key.
  name: agentplane-oidc
  namespace: agentplane-testing
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: client-secret
      sourceRef:
        generatorRef:
          kind: Password
          name: agentplane-testing-dex-client-secret
    - rewrite:
        - regexp:
            source: password
            target: session-secret
      sourceRef:
        generatorRef:
          kind: Password
          name: agentplane-testing-agentplane-session-secret
  refreshInterval: 8760h
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: agentplane-oidc
    template:
      data:
        client-id: agentplane-testing
        client-secret: '{{ index . "client-secret" }}'
        session-secret: '{{ index . "session-secret" }}'
      type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    description: ESO-generated credentials for the testing MCP client registered in Dex.
  name: agentplane-mcp-oauth
  namespace: agentplane-testing
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: client-secret
      sourceRef:
        generatorRef:
          kind: Password
          name: agentplane-testing-mcp-client-secret
  refreshInterval: 8760h
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: agentplane-mcp-oauth
    template:
      data:
        client-id: agentplane-testing-mcp
        client-secret: '{{ index . "client-secret" }}'
      type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    description: Generates the acceptance password and Dex config together from one password value.
  name: agentplane-testing-acceptance-operator
  namespace: agentplane-testing
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: Password
          name: agentplane-testing-dex-operator-password
  refreshInterval: 8760h
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: agentplane-testing-acceptance-operator
    template:
      data:
        config.yaml: |
          issuer: https://agentplane-dex-testing.allegedly.works/dex
          storage:
            type: memory
          web:
            http: 0.0.0.0:5556
          oauth2:
            skipApprovalScreen: true
          enablePasswordDB: true
          staticClients:
            - id: agentplane-testing
              name: Agentplane testing
              secretEnv: DEX_CLIENT_SECRET
              redirectURIs:
                - https://agentplane-testing.allegedly.works/auth/callback
            - id: agentplane-testing-mcp
              name: Agentplane MCP testing
              secretEnv: MCP_CLIENT_SECRET
              redirectURIs:
                - https://agentplane-testing.allegedly.works/mcp-linkage/callback
          staticPasswords:
            - email: test-user@agentplane-testing.invalid
              hash: '{{ regexReplaceAll "^test-user:" (htpasswd "test-user" .password "bcrypt") "" }}'
              username: test-user
              preferredUsername: test-user
              userID: test-subject
        issuer: https://agentplane-dex-testing.allegedly.works/dex
        login: test-user@agentplane-testing.invalid
        password: "{{ .password }}"
        subject: Cgx0ZXN0LXN1YmplY3QSBWxvY2Fs
        username: test-user
      engineVersion: v2
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: public-coder-agent
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: public-coder-agent
      type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    secret.reloader.stakater.com/reload: agentplane-testing-acceptance-operator,agentplane-oidc,agentplane-mcp-oauth
  labels:
    app.kubernetes.io/name: agentplane-testing-dex
  name: agentplane-testing-dex
  namespace: agentplane-testing
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-testing-dex-dex-deployment-c804b4bc
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-testing-dex
        cdk8s.io/metadata.addr: agentplane-testing-dex-dex-deployment-c804b4bc
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - dex
            - serve
            - /etc/dex/config.yaml
          env:
            - name: DEX_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client-id
                  name: agentplane-oidc
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client-secret
                  name: agentplane-oidc
            - name: MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client-secret
                  name: agentplane-mcp-oauth
          image: ghcr.io/dexidp/dex:v2.45.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /dex/healthz
              port: 5556
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
          name: dex
          ports:
            - containerPort: 5556
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /dex/healthz
              port: 5556
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/dex
              name: secret-agentplane-testing-acceptance-operator
              readOnly: true
            - mountPath: /tmp
              name: tmp
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
        - name: secret-agentplane-testing-acceptance-operator
          secret:
            items:
              - key: config.yaml
                path: config.yaml
            secretName: agentplane-testing-acceptance-operator
        - emptyDir: {}
          name: tmp
---
apiVersion: v1
kind: Service
metadata:
  name: agentplane-testing-dex
  namespace: agentplane-testing
spec:
  externalIPs: []
  ports:
    - name: http
      port: 5556
      protocol: TCP
      targetPort: 5556
  selector:
    cdk8s.io/metadata.addr: agentplane-testing-dex-dex-deployment-c804b4bc
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentplane-testing-dex
  namespace: agentplane-testing
spec:
  hostnames:
    - agentplane-dex-testing.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  rules:
    - backendRefs:
        - name: agentplane-testing-dex
          port: 5556
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
          type: ResponseHeaderModifier
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-testing-dex
  namespace: agentplane-testing
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
  egressDeny:
    - toEntities:
        - all
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-testing-dex
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5556"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-app
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "5556"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-oauth-fixture
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "5556"
              protocol: TCP
