apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentplane-testing-dex
  namespace: agentplane-testing
  labels:
    app.kubernetes.io/name: agentplane-testing-dex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplane-testing-dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-testing-dex
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          env:
            - name: DEX_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: agentplane-oidc
                  key: client-id
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentplane-oidc
                  key: client-secret
          ports:
            - name: http
              containerPort: 5556
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: agentplane-testing-dex
            items:
              - key: config.yaml
                path: config.yaml
        - name: tmp
          emptyDir: {}
