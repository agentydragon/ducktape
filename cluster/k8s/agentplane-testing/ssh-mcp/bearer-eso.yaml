apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentplane-ssh-mcp-bearer
  namespace: agentplane-testing
  annotations:
    description: Shared internal bearer for the Agentplane Action Service to call the SSH MCP backend.
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-external-creds-secret-store
    kind: ClusterSecretStore
  target:
    name: agentplane-ssh-mcp-bearer
    creationPolicy: Owner
  data:
    - secretKey: bearer-token
      remoteRef:
        # Provision this value in the ESO-backed external credential store; it is intentionally
        # not present in Git. Both consumers use the same generated Kubernetes Secret.
        key: agentplane-ssh-mcp-bearer
        property: bearer-token
