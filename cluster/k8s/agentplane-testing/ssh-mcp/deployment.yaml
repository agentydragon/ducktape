apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentplane-ssh-mcp
  namespace: agentplane-testing
  labels:
    app.kubernetes.io/name: agentplane-ssh-mcp
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplane-ssh-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-ssh-mcp
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: forgejo-images-creds
      containers:
        - name: server
          image: git.allegedly.works/ducktape-ci/agentplane-ssh-mcp:devel-20260911062617-5a3faf6 # {"$imagepolicy": "flux-system:agentplane-ssh-mcp"}
          imagePullPolicy: Always
          env:
            - name: SSH_MCP_CONFIG_FILE
              value: /etc/agentplane-ssh/settings.yaml
            - name: SSH_MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentplane-ssh-mcp-bearer
                  key: bearer-token
            - name: SSH_MCP_HOST
              value: 0.0.0.0
            - name: SSH_MCP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/agentplane-ssh
              readOnly: true
            - name: keys
              mountPath: /etc/agentplane-ssh/keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      volumes:
        - name: config
          configMap:
            name: agentplane-ssh-mcp-config
        - name: keys
          secret:
            # Provision this Secret through the cluster's approved secret workflow. Mounting the
            # whole optional Secret means an absent individual key remains an absent file, so the
            # target can stay listed as unavailable instead of making the pod fail admission.
            secretName: agentplane-ssh-keys
            optional: true
