apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentplane-llm-ingress
  namespace: agentplane-testing
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentplane-testing-llm-ingress-token-reviewer
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentplane-testing-llm-ingress-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentplane-testing-llm-ingress-token-reviewer
subjects:
  - kind: ServiceAccount
    name: agentplane-llm-ingress
    namespace: agentplane-testing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentplane-llm-ingress-settings
  namespace: agentplane-testing
data:
  settings.yaml: |
    allowed_service_account_namespaces:
      - agentplane-testing
immutable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    secret.reloader.stakater.com/reload: litellm-key-cheap-experiments
  labels:
    app.kubernetes.io/name: agentplane-llm-ingress
  name: agentplane-llm-ingress
  namespace: agentplane-testing
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-llm-ingress-llm-ingress-deployment-c8938b8e
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-llm-ingress
        cdk8s.io/metadata.addr: agentplane-llm-ingress-llm-ingress-deployment-c8938b8e
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hil-ovh
      automountServiceAccountToken: true
      containers:
        - args:
            - --token-audience=agentplane-egress
            - --litellm-url=http://litellm.litellm.svc.cluster.local:4000
            - --host=0.0.0.0
            - --port=8080
          env:
            - name: AGENTPLANE_LLM_INGRESS_LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: litellm-key-cheap-experiments
            - name: AGENTPLANE_LLM_INGRESS_CONFIG_FILE
              value: /etc/agentplane-llm-ingress/settings.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-llm-ingress:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
          name: ingress
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/agentplane-llm-ingress/settings.yaml
              name: configmap-agentplane-llm-ingress-settings
              readOnly: true
              subPath: settings.yaml
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-llm-ingress
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - configMap:
            name: agentplane-llm-ingress-settings
          name: configmap-agentplane-llm-ingress-settings
---
apiVersion: v1
kind: Service
metadata:
  name: agentplane-llm-ingress
  namespace: agentplane-testing
spec:
  externalIPs: []
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    cdk8s.io/metadata.addr: agentplane-llm-ingress-llm-ingress-deployment-c8938b8e
  type: ClusterIP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-llm-ingress
  namespace: agentplane-testing
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: litellm
            k8s:io.kubernetes.pod.namespace: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-llm-ingress
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-egress
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
