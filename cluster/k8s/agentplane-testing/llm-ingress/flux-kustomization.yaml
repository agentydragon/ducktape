apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-testing-llm-ingress
  namespace: ducktape-flux
  annotations:
    description: Workload-authenticated Agentplane LLM ingress in front of the existing LiteLLM deployment.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  path: ./cluster/k8s/agentplane-testing/llm-ingress
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: agentplane-testing-llm-ingress
    namespace: ducktape-flux
  dependsOn:
    - name: agentplane-testing-namespace
      namespace: ducktape-flux
    - name: litellm-keys-tf
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
