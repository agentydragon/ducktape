# Stakater Reloader - Automatically restart pods when secrets/configmaps change
# This enables proper secret rotation without manual intervention
# Reference: https://github.com/stakater/Reloader
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: flux-system
spec:
  interval: 24h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: kube-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: reloader
      version: "2.*"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  values:
    reloader:
      # Watch all namespaces
      watchGlobally: true
      # Enable for both secrets and configmaps
      enableHA: false
      # By default Reloader only fires on Update events to a watched
      # ConfigMap/Secret. A delete-then-recreate sequence (e.g.
      # tofu-controller re-creating an Authentik or Forgejo credential
      # secret as part of recovery — see the 2026-06-03 forgejo-props
      # incident in <../../docs/troubleshooting.md> § "Resource ID Desync
      # After Wiping a Backing Datastore") would otherwise be silently
      # ignored, leaving consumer pods on stale env values. These flags
      # map to --reload-on-create / --reload-on-delete on the operator.
      reloadOnCreate: true
      reloadOnDelete: true
      # Reload on ANY referenced ConfigMap/Secret change without requiring a
      # per-workload `reloader.stakater.com/auto` annotation. Required because
      # operator-managed Deployments — notably seaweedfs-s3, generated by the
      # SeaweedFS operator from the Seaweed CR — can only carry the annotation on
      # the *pod template* (spec.s3.annotations), which Reloader ignores: it reads
      # the annotation off the workload's own metadata. Without this, ESO
      # reassembling `seaweedfs-s3-config` when a tenant is added/rotated leaves the
      # s3 gateway on stale identities until a manual restart (the 2026-06-08 attic
      # `InvalidAccessKeyId` incident). Opt a workload out with
      # `reloader.stakater.com/auto: "false"`.
      autoReloadAll: true
      # The Altinity operator hot-reloads its generated ClickHouse user config.
      # Watching clickhouse causes a feedback loop: each generated users
      # ConfigMap update restarts ClickHouse, the new Pod IP changes the next
      # generated config, and Reloader restarts it again. Operator-managed
      # ClickHouse workloads therefore stay outside cluster-wide auto reloads.
      ignoreNamespaces: clickhouse
      # Use pod-template annotations, not Reloader's default env-var patch, to
      # force rollouts. The default mutates the container spec; operator-owned
      # workloads can reconcile that drift away. SeaweedFS proved this with
      # `seaweedfs-s3`: the operator reverted Reloader's env-var patch, leaving
      # stale S3 identities loaded. Annotation mode changes the pod-template hash
      # without touching the container spec, and a throwaway Seaweed experiment
      # confirmed the operator preserves that annotation across reconcile.
      # Full RCA: <../../docs/lessons_learned/2026_07_04_seaweedfs_s3_identity_stale_after_tenant_add.md>.
      reloadStrategy: annotations
      deployment:
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
