apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reloader
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: kyverno
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: reloader
      namespace: kube-system
  interval: 10m0s
  path: ./cluster/k8s/reloader
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: reloader
    namespace: ducktape-flux
  timeout: 5m
  wait: true
