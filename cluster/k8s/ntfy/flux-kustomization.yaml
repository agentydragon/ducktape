apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Self-hosted ntfy for Android and cluster alert notifications.
  name: ntfy
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: cnpg
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: ntfy
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: kubernetes-ntfy-secret-store
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: ntfy-db
      namespace: ntfy
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: ntfy-auth
      namespace: ntfy
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: alertmanager-ntfy-webhook
      namespace: monitoring
    - apiVersion: apps/v1
      kind: Deployment
      name: ntfy
      namespace: ntfy
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      name: ntfy
      namespace: ntfy
    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      name: ntfy
      namespace: ntfy
  interval: 10m
  path: ./cluster/k8s/ntfy
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: ntfy
    namespace: ducktape-flux
  timeout: 10m
  wait: true
