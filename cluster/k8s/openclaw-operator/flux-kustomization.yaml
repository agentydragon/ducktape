apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/openclaw-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openclaw-operator
      namespace: openclaw-operator
  timeout: 5m
