# OAuth client-state store for the ibkr-mcp OIDCProxy (DCR registrations +
# tokens), via mcp_infra PostgresPersistence. CNPG owns the database, role, and
# the ibkr-mcp-db-app Secret the server reads. OVH-HA profile (2 instances on
# separate kimsufi nodes) per cluster/docs/cnpg_conventions.md.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ibkr-mcp-db
  namespace: ibkr
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    topologyKey: kubernetes.io/hostname

  storage:
    storageClass: local-path-ovh
    size: 2Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: oauth_store
      owner: oauth_store
      # CNPG auto-generates credentials in Secret ibkr-mcp-db-app.
