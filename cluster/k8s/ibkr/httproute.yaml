# NOT behind the Authentik outpost — OIDCProxy runs inside the pod and drives
# the full MCP OAuth dance (DCR, PKCE, resource metadata). Only port 8765 (the
# MCP server) is exposed; the gateway socket stays pod-local.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ibkr-mcp
  namespace: ibkr
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "ibkr-mcp.allegedly.works"
  rules:
    - backendRefs:
        - name: ibkr-mcp
          port: 8765
      timeouts:
        request: "60s"
        backendRequest: "60s"
