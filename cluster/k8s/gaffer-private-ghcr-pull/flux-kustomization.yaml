apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gaffer-private-ghcr-pull
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  path: ./cluster/k8s/gaffer-private-ghcr-pull
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: gaffer-private
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: gaffer-private-ghcr-pull
      namespace: flux-system
