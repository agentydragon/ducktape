# ESO first renders a pull Secret from the SOPS-owned PAT, then distributes only
# that rendered Secret to the gaffer-private consumer namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gaffer-ghcr-pat-reader
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gaffer-ghcr-pat-reader
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["github-pat-ghcr-read"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gaffer-ghcr-pat-reader
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gaffer-ghcr-pat-reader
subjects:
  - kind: ServiceAccount
    name: gaffer-ghcr-pat-reader
    namespace: flux-system
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gaffer-ghcr-pull
  namespace: flux-system
spec:
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: gaffer-ghcr-pat-reader
          namespace: flux-system
      remoteNamespace: flux-system
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gaffer-ghcr-pull
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gaffer-ghcr-pull
  target:
    name: gaffer-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          description: Read-only GHCR pull credential for gaffer-private private images. Used directly by Flux ImageRepository scanning and distributed to consumer namespaces by ESO.
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "agentydragon:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: github-pat-ghcr-read
        property: token
---
# This identity cannot read the PAT. It can expose only the rendered pull
# Secret through the ClusterSecretStore below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gaffer-ghcr-pull-reader
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gaffer-ghcr-pull-reader
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gaffer-ghcr-pull"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gaffer-ghcr-pull-reader
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gaffer-ghcr-pull-reader
subjects:
  - kind: ServiceAccount
    name: gaffer-ghcr-pull-reader
    namespace: flux-system
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-gaffer-ghcr-pull-secret-store
spec:
  conditions:
    - namespaces:
        - augur
        - listing-monitor
        - thrive-scraper
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: gaffer-ghcr-pull-reader
          namespace: flux-system
      remoteNamespace: flux-system
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: gaffer-ghcr-pull
spec:
  namespaces:
    - augur
    - listing-monitor
    - thrive-scraper
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: kubernetes-gaffer-ghcr-pull-secret-store
    target:
      name: gaffer-ghcr-pull
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
    dataFrom:
      - extract:
          key: gaffer-ghcr-pull
