# ESO needs only the SOPS-owned GHCR PAT, then renders the Docker pull Secret
# which Reflector distributes to the three gaffer-private consumer namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gaffer-ghcr-pull-reader
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gaffer-ghcr-pull-reader
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["github-pat-ghcr-read"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gaffer-ghcr-pull-reader
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gaffer-ghcr-pull-reader
subjects:
  - kind: ServiceAccount
    name: gaffer-ghcr-pull-reader
    namespace: flux-system
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gaffer-ghcr-pull
  namespace: flux-system
spec:
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: gaffer-ghcr-pull-reader
          namespace: flux-system
      remoteNamespace: flux-system
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gaffer-ghcr-pull
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gaffer-ghcr-pull
  target:
    name: gaffer-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          description: Read-only GHCR pull credential for gaffer-private private images. Used directly by Flux ImageRepository scanning; reflected by Reflector into each consumer namespace as gaffer-ghcr-pull for kubelet image pulls.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: augur,listing-monitor,thrive-scraper
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: augur,listing-monitor,thrive-scraper
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "agentydragon:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: github-pat-ghcr-read
        property: token
