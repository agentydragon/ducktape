apiVersion: v1
kind: Namespace
metadata:
  name: vector-talos-logs
  labels:
    # Fixed-resource DaemonSet — opt out of Goldilocks/VPA recommendations.
    goldilocks.fairwinds.com/enabled: "false"
    # The receiver joins the host network so it can bind only 127.0.0.1:13333;
    # baseline forbids hostNetwork. This is an operator-only namespace: Flux is
    # its sole writer, while the Vector container itself remains unprivileged.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
