apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vector-talos-logs
resources:
  - namespace.yaml
  - daemonset.yaml
configMapGenerator:
  # Hash suffix (default) rewrites the DaemonSet's volume reference and rolls the pods
  # whenever vector.toml changes.
  - name: vector-talos-config
    files:
      - vector.toml
