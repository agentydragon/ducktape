apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vector-talos-logs
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: loki
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: vector-talos-logs
      namespace: vector-talos-logs
  interval: 10m
  path: ./cluster/k8s/vector-talos-logs
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: vector-talos-logs
    namespace: ducktape-flux
  timeout: 2m
  wait: true
