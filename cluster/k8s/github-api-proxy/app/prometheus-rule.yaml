apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: github-api-proxy
  namespace: github-api-proxy
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: github-api-proxy
      rules:
        - alert: GitHubProxyCaptureWriteFailed
          expr: max by (channel) (github_api_proxy_capture_write_failures_total{namespace="github-api-proxy"}) > 0
          labels:
            severity: warning
          annotations:
            summary: "Central GitHub proxy capture has lost {{ $labels.channel }} observations"
            description: >
              A private capture append failed. Readiness stays false until a
              controlled restart, but existing connections may continue and the
              quota mitigation remains active. Inspect storage and preserve the
              incomplete evidence before restarting; do not count this interval
              as complete observation coverage.
        - alert: GitHubProxyMetricsScrapeFailed
          expr: max(up{namespace="github-api-proxy",job="github-api-proxy/github-api-proxy"}) == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Central GitHub proxy metrics cannot be scraped"
            description: >
              All discovered proxy metrics targets have failed for two minutes.
              Check the Pod, private metrics listener and Alloy network path.
        - alert: GitHubProxyMetricsMissing
          expr: absent_over_time(up{namespace="github-api-proxy",job="github-api-proxy/github-api-proxy"}[5m])
          labels:
            severity: warning
          annotations:
            summary: "Central GitHub proxy observations are missing"
            description: >
              No proxy scrape result has been retained for five minutes. Check
              Pod discovery, the PodMonitor, Alloy collection and remote write.
              Missing telemetry cannot establish a healthy proxy or quiet quota.
        - record: github_api_proxy:capture_collection_physical_storage_budget:ratio
          expr: |
            sum by (namespace, persistentvolumeclaim) (
              label_replace(
                sum by (collection) (
                  max by (collection, instance) (
                    SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",type="normal"}
                  )
                ),
                "volumename", "$1", "collection", "(.+)"
              )
              * on (volumename) group_left(namespace, persistentvolumeclaim)
                max by (volumename, namespace, persistentvolumeclaim) (
                  kube_persistentvolumeclaim_info{
                    namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",
                    storageclass="seaweedfs-ovh"
                  }
                )
            )
            / on (namespace, persistentvolumeclaim)
              (
                max by (namespace, persistentvolumeclaim) (
                  kube_persistentvolumeclaim_resource_requests_storage_bytes{
                    namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"
                  }
                ) > 0
              )
        - alert: GitHubProxyCaptureCollectionStorageBudgetHigh
          expr: github_api_proxy:capture_collection_physical_storage_budget:ratio > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Central GitHub proxy collection exceeds 85% of its physical storage budget"
            description: >
              Reported normal-volume bytes, including replicas, exceed 85% of
              the PVC storage request. This is an operational budget, not free
              space or guaranteed write capacity. Captures append without
              automatic deletion. Check volume-server telemetry and arrange
              explicit retention or expansion; preserve investigation evidence.
        - alert: GitHubProxyCaptureStorageBudgetInputsMissing
          expr: |
            absent(github_api_proxy:capture_collection_physical_storage_budget:ratio{
              namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"
            })
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Central GitHub proxy collection storage budget cannot be observed"
            description: >
              The collection byte metric, PVC-to-collection mapping or positive
              PVC storage request is missing. Check SeaweedFS volume-server
              scrapes and kube-state-metrics. Absence is not zero usage. Partial
              volume-server loss can still undercount a present budget ratio.
