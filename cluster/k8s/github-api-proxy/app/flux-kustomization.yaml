apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-api-proxy
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: github-api-proxy-identity
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: seaweedfs-csi
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: reloader
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/github-api-proxy/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: github-api-proxy
    namespace: ducktape-flux
  timeout: 5m
  wait: true
