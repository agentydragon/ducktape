apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-api-proxy
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/github-api-proxy/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: github-api-proxy-secrets
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: seaweedfs-csi
      namespace: ducktape-flux
    - name: monitoring-stack
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: reloader
      namespace: ducktape-flux
