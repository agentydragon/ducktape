apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: github-api-proxy
resources:
  - capture-pvc.yaml
  - deployment.yaml
  - gateway.yaml
  - networkpolicy.yaml
  - podmonitor.yaml
  - prometheus-rule.yaml
  - service.yaml
configMapGenerator:
  - name: github-api-proxy-config
    files:
      - config.json
