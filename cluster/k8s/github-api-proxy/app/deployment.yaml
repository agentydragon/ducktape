apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-api-proxy
  namespace: github-api-proxy
  labels:
    app.kubernetes.io/name: github-api-proxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: github-api-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-api-proxy
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      imagePullSecrets:
        - name: forgejo-images-creds
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: git.allegedly.works/ducktape-ci/github-api-proxy:devel-20260906044947-6b41722 # {"$imagepolicy": "flux-system:github-api-proxy"}
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /run/github-api-proxy/config/config.json
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /run/github-api-proxy/config
              readOnly: true
            - name: clients
              mountPath: /run/github-api-proxy/clients
              readOnly: true
            - name: outer-tls
              mountPath: /run/github-api-proxy/outer-tls
              readOnly: true
            - name: interception-ca
              mountPath: /run/github-api-proxy/interception-ca
              readOnly: true
            - name: private-work
              mountPath: /run/github-api-proxy/work
            - name: capture
              mountPath: /var/lib/github-api-proxy
      volumes:
        - name: config
          configMap:
            name: github-api-proxy-config
        - name: clients
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: github-api-proxy-wyrm2-credentials
                  items:
                    - key: credentials.json
                      path: wyrm2.json
              - secret:
                  name: github-api-proxy-rugged-credentials
                  items:
                    - key: credentials.json
                      path: rugged.json
        - name: outer-tls
          secret:
            secretName: github-api-proxy-server-tls
            defaultMode: 0440
        - name: interception-ca
          secret:
            secretName: github-api-proxy-interception-ca
            defaultMode: 0440
        - name: private-work
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: capture
          persistentVolumeClaim:
            claimName: github-api-proxy-capture
