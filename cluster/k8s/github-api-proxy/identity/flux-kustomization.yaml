apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-api-proxy-identity
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: cert-manager-issuer-config
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/github-api-proxy/identity
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: github-api-proxy-identity
    namespace: ducktape-flux
  timeout: 5m
  wait: true
