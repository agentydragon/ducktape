# Keep both current images pinned while CI publishes the matching controller and runner built
# from the new upstream source. Their gRPC protocol changed, so independent image-policy updates
# could deploy an incompatible pair. After both new images are published, switch both values in
# one HelmRelease update; see third_party/tofu_controller/README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
  namespace: flux-system
spec:
  values:
    image:
      repository: ghcr.io/agentydragon/tofu-controller
      tag: devel-20261110095747-5ba4944
    runner:
      image:
        repository: ghcr.io/agentydragon/tf-runner
        tag: devel-20261110095440-5ba4944
