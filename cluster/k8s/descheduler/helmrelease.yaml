---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/descheduler
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: descheduler
      version: "0.35.0"
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: kube-system
  values:
    schedule: "*/15 * * * *"
    deschedulerPolicyAPIVersion: "descheduler/v1alpha2"
    deschedulerPolicy:
      metricsProviders:
        - source: KubernetesMetrics
      profiles:
        - name: default
          pluginConfig:
            # Without nodeFit, evicted pods that fit nowhere else reschedule
            # onto the same node and get evicted again next run — a 15-minute
            # churn loop whenever other nodes are down or unschedulable.
            - name: DefaultEvictor
              args:
                nodeFit: true
                # Pods whose priority is at or above this are never evicted, by
                # any plugin. Set to the `stateful-infra` value so SeaweedFS
                # master/volume/filer/s3 are exempt outright: a filer restart
                # desynchronizes every FUSE client's cached chunk locations, and
                # git then dies of SIGBUS on mmap'd packfiles cluster-wide — so
                # the cost of bouncing one is nothing like the "brief re-election"
                # a balance pass assumes. PriorityClass alone does not do this;
                # only `system-{cluster,node}-critical` are exempt by default, and
                # a lower class merely loses the QoS tiebreak. Given as a value
                # because the PriorityClass is owned by a different Flux
                # Kustomization; a validation test pins the two together.
                priorityThreshold:
                  value: 1000000
            - name: LowNodeUtilization
              args:
                metricsUtilization:
                  source: KubernetesMetrics
                thresholds:
                  cpu: 20
                  memory: 20
                targetThresholds:
                  cpu: 50
                  memory: 70
            - name: RemoveDuplicates
              args: {}
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 50
                includingInitContainers: true
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
                - RemoveDuplicates
            deschedule:
              enabled:
                - RemovePodsHavingTooManyRestarts
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    rbac:
      create: true
