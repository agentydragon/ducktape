apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: descheduler
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: kyverno
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: descheduler
      namespace: kube-system
  interval: 10m
  path: ./cluster/k8s/descheduler
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: descheduler
    namespace: ducktape-flux
  timeout: 5m
  wait: true
