apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: descheduler
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  dependsOn:
    - name: kyverno
      namespace: ducktape-flux
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: descheduler

    namespace: ducktape-flux
  path: "./cluster/k8s/descheduler"
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: descheduler
      namespace: kube-system
