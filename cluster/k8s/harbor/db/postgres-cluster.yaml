apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
spec:
  instances: 1

  probes:
    liveness:
      isolationCheck:
        enabled: false

  # Moved to OVH 2026-06-03: lets Harbor's DB come back up while Proxmox is
  # down. Previously pinned to region=proxmox + storageClass=local-path.
  # Still single-instance; bumping to 2 (proper OVH-HA per cnpg_conventions
  # R3) is a separate decision.
  affinity:
    nodeSelector:
      topology.kubernetes.io/region: hil

  storage:
    storageClass: local-path-ovh
    size: 5Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: registry
      owner: harbor
      # CNPG auto-generates credentials in secret harbor-db-app
