apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: harbor-oidc-config
  namespace: flux-system
spec:
  interval: 15m
  refreshBeforeApply: true
  path: ./tf/gitops/sso/harbor-config
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  serviceAccountName: tf-runner
  approvePlan: "auto"

  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "harbor_oidc_config"
      }
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tofu-state-db-credentials
              key: password

  vars:
    - name: authentik_url
      value: "https://auth.allegedly.works"
    - name: harbor_url
      value: "http://harbor-core.harbor:80"
