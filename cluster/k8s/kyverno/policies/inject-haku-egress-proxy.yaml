# Auto-inject the dedicated haku-egress-proxy proxy config into all pods in the
# haku-sandbox namespace. Mirrors inject-mitmproxy (claude-sandbox et al.) but
# points at haku-sandbox's own proxy + CA so the two sandboxes stay isolated.
#
# Uses RFC 6902 JSON patches (not patchStrategicMerge) to avoid volume merge
# conflicts with Kyverno autogen + Flux server-side dry-run on Deployments.
#
# Autogen is disabled: JSON patch "add /-" always appends, so if autogen
# mutates the Deployment template AND the Pod-level rule fires at Pod
# creation, volumes/env/mounts get duplicated. With autogen off, only
# Pod admission is mutated.
#
# All rules restrict to CREATE operations only, so injection happens once per pod
# and never on the Job controller's finalizer PATCH.
#
# CREATE-only is NOT sufficient on its own, which is why every rule also carries a
# precondition asserting the thing it is about to append is not already there.
# Kyverno's webhook is registered `reinvocationPolicy: IfNeeded`, so a webhook
# ordered after it that mutates the pod causes Kyverno to run AGAIN within the SAME
# CREATE, reading its own output as input. "add /-" appends unconditionally, so the
# second pass duplicated the volume and its mount, and the API server rejects a
# duplicate volume name outright:
#
#   Pod "haku-ui-0" is invalid: [spec.volumes[3].name: Duplicate value:
#   "haku-egress-proxy-ca-cert", spec.containers[0].volumeMounts[3].mountPath:
#   Invalid value: "/egress-proxy-ca": must be unique]
#
# That was a real outage (2026-08-05): haku-sandbox runs VPA in Auto mode, VPA's
# webhook sorts after Kyverno's and patches resource requests, and haku-ui sat at
# 1/2 with haku-ui-0 permanently uncreatable. It presented as intermittent because
# VPA patches nothing when its recommendation already matches the pod. Pinned by
# cluster/validation/test_proxy_injection.py, which applies each policy twice.
#
# Keep *.allegedly.works out of the proxy path. Those names resolve to the
# public hostNetwork Cilium Gateway IPs, but they are still cluster-owned
# services. If haku-egress-proxy CONNECTs to one of them, DNS can pick the proxy
# pod's own Gateway node; that same-node public-Gateway hairpin returns Envoy
# "Access denied" for the proxy identity. Direct sandbox egress to these hosts
# is still bounded by Cilium's cluster-only egress rule, not free internet
# access. Include both wildcard and suffix forms because NO_PROXY matching
# differs across curl, Go, Python, node, and git.
#
# In-cluster Forgejo (forgejo-http.forgejo) is deliberately NOT on the list: the
# sandbox holds only the inert haku-forgejo-token-placeholder, and the fence is
# what swaps it for the real credential at the Forgejo origins
# (haku/console config.yaml, haku_forgejo_token). A bypass here sends git
# straight to Forgejo with the placeholder and every clone fails
# "Credentials are incorrect or have expired". Gotcha: the `.svc` entries below
# still bypass forgejo-http.forgejo.svc.cluster.local, so anything that needs
# the credential must use the short service name, as haku-sandbox-setup.sh does.
#
# `.svc` and `kubernetes.default.svc` are listed alongside `.svc.cluster.local`
# because suffix matching is literal: the short in-cluster forms do NOT match the
# fully-qualified suffix, so `https://kubernetes.default.svc` — the default
# apiserver URL every in-cluster client library builds — went to the proxy and hung
# until it timed out (found from a haku sandbox, 2026-07-24). The FQDN form worked
# all along; this makes both work.
#
# NO_PROXY entry by entry — the value below is one flat string, so this is its
# key. Both env patches (containers and initContainers) inject the same value.
#
#   127.0.0.1, localhost    Loopback. A pod's own sidecars, health checks and
#                           127.0.0.1-bound helpers must not be shipped to a
#                           proxy living in another pod.
#   *.allegedly.works       Our own public names. Bypassed because of the
#   .allegedly.works        Gateway hairpin described above, not because they are
#                           trusted more than the internet. Two forms because
#                           NO_PROXY matching differs across curl, Go, Python,
#                           node and git.
#   .svc                    In-cluster Service names, in all three forms clients
#   .svc.cluster.local      actually construct. See the 2026-07-24 note above for
#   kubernetes.default.svc  why the short forms are listed separately.
#   10.0.0.0/8              Pod and Service CIDRs — the same in-cluster
#                           destinations, reached by IP instead of by name (a
#                           kubeconfig with a ClusterIP server, a hard-coded pod
#                           IP). Broadest entry here; it is what makes the list
#                           "all cluster addressing" rather than an enumeration.
#
# Everything on this list reaches its destination with no proxy in the path and
# no egress allowlist applied. That is accepted rather than overlooked: each
# entry is cluster-internal or cluster-published, and those services authenticate
# their own callers (bearer, mTLS, SSO). The fence this policy sets up is a fence
# over the public internet.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-haku-egress-proxy
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Inject haku-egress-proxy
    policies.kyverno.io/category: Networking
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Mutates pods in haku-sandbox to automatically inject the dedicated
      haku-egress-proxy proxy env vars (HTTP_PROXY, HTTPS_PROXY, NO_PROXY,
      SSL_CERT_FILE, CURL_CA_BUNDLE, REQUESTS_CA_BUNDLE, NODE_EXTRA_CA_CERTS)
      and mount the haku-egress-proxy trust bundle at /egress-proxy-ca/ca-certificates.crt.
spec:
  mutateExistingOnPolicyUpdate: false
  rules:
    - name: add-proxy-volume
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [haku-sandbox]
              operations: [CREATE]
      preconditions:
        all:
          - key: "{{ (request.object.spec.volumes || `[]`)[?name=='haku-egress-proxy-ca-cert'] | length(@) }}"
            operator: Equals
            value: 0
      mutate:
        patchesJson6902: |-
          - op: add
            path: "/spec/volumes/-"
            value:
              name: haku-egress-proxy-ca-cert
              configMap:
                name: haku-egress-proxy-ca-cert

    - name: add-proxy-env-and-mount-containers
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [haku-sandbox]
              operations: [CREATE]
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            preconditions:
              all:
                - key: "{{ (element.volumeMounts || `[]`)[?name=='haku-egress-proxy-ca-cert'] | length(@) }}"
                  operator: Equals
                  value: 0
            patchesJson6902: |-
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: HTTP_PROXY
                  value: "http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080"
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: HTTPS_PROXY
                  value: "http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080"
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: NO_PROXY
                  value: "127.0.0.1,localhost,*.allegedly.works,.allegedly.works,.svc,.svc.cluster.local,kubernetes.default.svc,10.0.0.0/8"
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: SSL_CERT_FILE
                  value: /egress-proxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: CURL_CA_BUNDLE
                  value: /egress-proxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: REQUESTS_CA_BUNDLE
                  value: /egress-proxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: NODE_EXTRA_CA_CERTS
                  value: /egress-proxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/containers/{{elementIndex}}/volumeMounts/-"
                value:
                  name: haku-egress-proxy-ca-cert
                  mountPath: /egress-proxy-ca
                  readOnly: true

    - name: add-proxy-env-and-mount-init-containers
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [haku-sandbox]
              operations: [CREATE]
      preconditions:
        any:
          - key: "{{ (request.object.spec.initContainers || `[]`) | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      mutate:
        foreach:
          - list: "request.object.spec.initContainers"
            preconditions:
              all:
                - key: "{{ (element.volumeMounts || `[]`)[?name=='haku-egress-proxy-ca-cert'] | length(@) }}"
                  operator: Equals
                  value: 0
            patchesJson6902: |-
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: HTTP_PROXY
                  value: "http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080"
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: HTTPS_PROXY
                  value: "http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080"
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: NO_PROXY
                  value: "127.0.0.1,localhost,*.allegedly.works,.allegedly.works,.svc,.svc.cluster.local,kubernetes.default.svc,10.0.0.0/8"
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: SSL_CERT_FILE
                  value: /egress-proxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: CURL_CA_BUNDLE
                  value: /egress-proxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: REQUESTS_CA_BUNDLE
                  value: /egress-proxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: NODE_EXTRA_CA_CERTS
                  value: /egress-proxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/volumeMounts/-"
                value:
                  name: haku-egress-proxy-ca-cert
                  mountPath: /egress-proxy-ca
                  readOnly: true
