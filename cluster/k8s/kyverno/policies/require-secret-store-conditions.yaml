apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-secret-store-conditions
  annotations:
    policies.kyverno.io/title: Require ClusterSecretStore Conditions
    policies.kyverno.io/category: Access Control
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ClusterSecretStore
    policies.kyverno.io/description: >-
      A ClusterSecretStore with no `spec.conditions` is usable from every
      namespace in the cluster. That is not a mild default here: the ESO
      ServiceAccount holds cluster-wide secret read, so the store — not RBAC — is
      the only thing bounding what an ExternalSecret can pull out of the store's
      `remoteNamespace`. An unfenced `kubernetes-flux-system-secret-store` means
      any namespace can read the GitHub App, the PATs, the AWS Route 53
      credentials and `ci-age-key`. This requires every store to name the
      namespaces allowed to use it. An empty `conditions: []` is rejected too,
      because ESO treats it exactly like an absent one, so it would read as a
      tightening while changing nothing.
spec:
  admission: true
  # No subject match, so request.userInfo is not needed. background: false keeps
  # this to admission — existing stores are already compliant (see the sibling
  # cluster/validation test), so there is nothing for a background scan to find
  # that CI does not already catch pre-merge.
  background: false
  # CLEANUP(added 2026-08-04): flip to Enforce once gaffer-private's
  # `kubernetes-seaweedfs-secret-store` declares conditions. It is applied to
  # this cluster from a repo this policy cannot fix, and Enforce would reject it
  # on every reconcile — breaking that Kustomization rather than the thing the
  # policy is aimed at. Audit reports it in the meantime.
  validationFailureAction: Audit
  rules:
    - name: require-conditions
      match:
        any:
          - resources:
              kinds:
                - ClusterSecretStore
              operations:
                - CREATE
                - UPDATE
      validate:
        message: >-
          ClusterSecretStore must declare spec.conditions naming the namespaces
          allowed to use it; without it the store is readable from every
          namespace and the ESO ServiceAccount has cluster-wide secret read.
          Store: {{request.object.metadata.name}} (remoteNamespace
          {{request.object.spec.provider.kubernetes.remoteNamespace || 'n/a'}}).
        deny:
          conditions:
            any:
              # Covers both the absent field and an empty list.
              - key: "{{ request.object.spec.conditions[] || `[]` | length(@) }}"
                operator: Equals
                value: 0
