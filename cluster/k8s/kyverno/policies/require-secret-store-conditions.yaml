apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-secret-store-conditions
  annotations:
    policies.kyverno.io/title: Require ClusterSecretStore Conditions
    policies.kyverno.io/category: Access Control
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ClusterSecretStore
    policies.kyverno.io/description: >-
      A ClusterSecretStore with no `spec.conditions` is usable from every
      namespace in the cluster. That is not a mild default here: the ESO
      ServiceAccount holds cluster-wide secret read, so the store — not RBAC — is
      the only thing bounding what an ExternalSecret can pull out of the store's
      `remoteNamespace`. An unfenced `kubernetes-flux-system-secret-store` means
      any namespace can read the GitHub App, the PATs, the AWS Route 53
      credentials and `ci-age-key`. This requires every store to name at least
      one namespace in `conditions[].namespaces`, which rejects the degenerate
      forms as well: an empty `conditions: []` (ESO treats it exactly like an
      absent one), a condition carrying no criteria at all, and a bare
      `namespaceSelector: {}` — an empty LabelSelector matches every namespace by
      the standard Kubernetes convention, so that one reads as a fence while
      being the widest setting available. Requiring an explicit list also rules
      out selector-based fences, which nothing here uses; relax it deliberately
      if that changes.
spec:
  admission: true
  # background: true so the Kyverno background controller also evaluates stores
  # that already exist. Enforce only sees what is applied from here on, and an
  # object that predates the policy and is never rewritten is never re-admitted —
  # a background scan is the only thing that would report one. Nothing in CI
  # checks this either; it is enforced here and nowhere else. The rule matches on
  # kind alone and reads no request.userInfo, which is what makes background
  # evaluation possible; the policies here that set background: false do so
  # because they need admission-only context.
  background: true
  # Enforce: every ClusterSecretStore reaching this cluster now declares
  # conditions, including `kubernetes-seaweedfs-secret-store`, which is applied
  # from gaffer-private and was the last holdout (gaffer-private#383). A store
  # that arrives without them is rejected at admission rather than merely
  # reported, so the fence cannot be dropped by a manifest edit.
  validationFailureAction: Enforce
  rules:
    - name: require-conditions
      match:
        any:
          - resources:
              kinds:
                - ClusterSecretStore
              operations:
                - CREATE
                - UPDATE
      validate:
        message: >-
          ClusterSecretStore must name the namespaces allowed to use it in
          spec.conditions[].namespaces; without at least one the store is
          readable from every namespace and the ESO ServiceAccount has
          cluster-wide secret read. Store: {{request.object.metadata.name}}
          (remoteNamespace
          {{request.object.spec.provider.kubernetes.remoteNamespace || 'n/a'}}).
        deny:
          conditions:
            any:
              # Flattened, so this covers an absent `conditions`, an empty list,
              # a condition with no criteria, an empty `namespaces: []`, and a
              # bare `namespaceSelector: {}` — which matches every namespace and
              # is therefore the widest setting, not a fence.
              - key: "{{ request.object.spec.conditions[].namespaces[] || `[]` | length(@) }}"
                operator: Equals
                value: 0
