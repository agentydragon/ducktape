# Default goldilocks' VPA resource policy to controlledValues: RequestsOnly on
# every auto-mode namespace.
#
# VPA scales a container's limits *in proportion to its requests*. A workload
# whose steady-state usage is far below its cold-start need therefore gets its
# limit dragged down with its request, and CFS quota is a hard rate limiter
# regardless of node load — so the container is throttled even on an idle node.
# On 2026-08-09 that admitted both LiteLLM replicas at a 150m CPU limit against
# a declared 1. Cold start (imports, model registration, a Prisma migration)
# could not finish inside the startup probe budget, the probe killed every
# attempt, and the loop fed itself: a container stuck in startup burns no CPU,
# so the recommendation never recovered. Both replicas crashlooped for six
# hours, the Service lost all backends, and every in-cluster model call failed
# with an immediate EPERM. An audit afterwards found 15 containers running a
# collapsed CPU limit, one of them (paperless) also behind a startup probe.
#
# RequestsOnly keeps VPA doing the part it is good at — right-sizing requests
# from observed usage — and leaves every limit exactly as the manifest declares.
#
# Defaulted here rather than per-namespace because goldilocks has no
# cluster-level setting for it: its precedence is workload annotation ->
# namespace annotation -> a hardcoded UpdateModeOff, and its only global flags
# are OnByDefault/DryRun/Include/ExcludeNamespaces/IgnoreControllerKind. Without
# this policy the annotation has to be repeated in every namespace, and a
# namespace added later silently gets the collapsing behaviour — which is
# exactly how the 15 above accumulated.
#
# Mutating the namespace (goldilocks' *input*) rather than the VPA object it
# writes: goldilocks stays the only writer of the VPA, so there is no
# controller-versus-webhook rewrite loop.
#
# The +() anchor adds the annotation only when absent, so it never fights a
# namespace that sets its own policy — see langfuse, which pins clickhouse to
# RequestsAndLimits because its limit comes from a chart preset this repo does
# not own.
#
# Admission-only (background: false), matching default-revision-history-limit:
# matching UPDATE means existing namespaces pick this up on their next Flux
# reconcile (an SSA apply is an UPDATE admission), after which goldilocks
# rebuilds each VPA with the new resourcePolicy.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: default-vpa-requests-only
  annotations:
    policies.kyverno.io/title: Default VPA to RequestsOnly
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Adds a goldilocks vpa-resource-policy annotation setting
      controlledValues: RequestsOnly to namespaces running goldilocks VPA in
      auto mode, so VPA never scales a container's limits down in proportion to
      its requests. Only applied when the namespace does not already declare its
      own policy.
spec:
  admission: true
  background: false
  rules:
    - name: default-vpa-requests-only
      match:
        any:
          - resources:
              kinds:
                - Namespace
              operations:
                - CREATE
                - UPDATE
              selector:
                matchLabels:
                  goldilocks.fairwinds.com/vpa-update-mode: auto
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              # Add-if-absent: never overwrites a namespace's own policy.
              +(goldilocks.fairwinds.com/vpa-resource-policy): >-
                {"containerPolicies": [{"containerName": "*", "controlledValues": "RequestsOnly"}]}
