# Keep Reloader from restarting Jobs owned by CloudNativePG.
#
# Reloader treats Jobs as reloadable workloads, but its Job strategy is
# destructive: it deletes the old Job and creates a new one. That is suitable
# for an ordinary one-shot Job, but not for a CNPG bootstrap or recovery Job,
# which is an operator-owned step in the Cluster reconciliation state machine.
# In particular, deleting a CNPG initdb Job can remove its Pod while CNPG is
# still waiting for that Job to complete.
#
# This policy is deliberately CREATE-only. It puts the opt-out on a CNPG Job
# before Reloader can observe it, and puts it back on any Job that Reloader
# attempts to delete and recreate. It does not mutate UPDATEs, so it cannot
# compete with CNPG's reconciliation of the Job or with Kubernetes' Job
# controller. Only the Job's top-level metadata is changed: Reloader reads
# workload annotations there, and mutating the Pod template is unnecessary.
#
# Both labels are required. `app.kubernetes.io/managed-by` identifies CNPG's
# objects, while `cnpg.io/jobRole` limits this to CNPG's role-bearing Jobs and
# avoids changing unrelated Jobs that happen to use the managed-by label.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ignore-cnpg-jobs-for-reloader
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Exclude CloudNativePG Jobs from Reloader
    policies.kyverno.io/category: Reliability
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Job
    policies.kyverno.io/description: >-
      Prevents Reloader from deleting and recreating CloudNativePG-owned Jobs.
      CNPG bootstrap and recovery Jobs are part of the operator reconciliation
      state machine, so replacing them can remove their Pod before the
      operation completes. The exclusion is applied at Job creation and is
      reapplied if a Job is recreated.
spec:
  admission: true
  background: false
  mutateExistingOnPolicyUpdate: false
  rules:
    - name: exclude-cnpg-jobs-from-reloader
      match:
        any:
          - resources:
              kinds:
                - Job
              operations:
                - CREATE
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/managed-by
                    operator: In
                    values:
                      - cloudnative-pg
                  - key: cnpg.io/jobRole
                    operator: Exists
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              reloader.stakater.com/auto: "false"
