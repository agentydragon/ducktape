apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  dependsOn:
    - name: kyverno # Policies require Kyverno CRDs to be installed
      namespace: ducktape-flux
  interval: 5m
  path: ./cluster/k8s/kyverno/policies
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: kyverno-policies

    namespace: ducktape-flux
  wait: true
  timeout: 2m
