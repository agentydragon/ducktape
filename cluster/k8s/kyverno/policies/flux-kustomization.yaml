apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: kyverno
      namespace: ducktape-flux
  interval: 5m
  path: ./cluster/k8s/kyverno/policies
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: kyverno-policies
    namespace: ducktape-flux
  timeout: 2m
  wait: true
