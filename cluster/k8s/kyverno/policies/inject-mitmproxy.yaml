# Auto-inject mitmproxy proxy config into pods that use the shared proxy.
# This makes any pod (e.g. `kubectl run --image=curlimages/curl`) work
# turnkey with HTTP_PROXY, HTTPS_PROXY, SSL trust, and the CA bundle mounted,
# without the pod spec needing to know about the proxy.
#
# Uses RFC 6902 JSON patches (not patchStrategicMerge) to avoid volume merge
# conflicts with Kyverno autogen + Flux server-side dry-run on Deployments.
#
# Autogen is disabled: JSON patch "add /-" always appends, so if autogen
# mutates the Deployment template AND the Pod-level rule fires at Pod
# creation, volumes/env/mounts get duplicated. With autogen off, only
# Pod admission is mutated.
#
# All rules restrict to CREATE operations only. The patchesJson6902 "add /-"
# (append) has no idempotency check — if the policy re-evaluates on UPDATE,
# it appends the same volume/env/mount a second time and the API server
# rejects the request (duplicate volume name / mount path / env var). This
# blocked the Kubernetes Job controller from PATCHing completed pods to
# remove the batch.kubernetes.io/job-tracking finalizer, which prevented
# Jobs from transitioning to Complete. Since proxy injection only needs to
# happen at pod creation, matching CREATE-only avoids the re-mutation
# entirely.
#
# CREATE-only is NOT sufficient on its own, which is why every rule also carries
# a precondition asserting the thing it is about to append is not already there.
# Kyverno's webhook is registered `reinvocationPolicy: IfNeeded`, so a webhook
# ordered after it that mutates the pod causes Kyverno to run AGAIN within the
# SAME CREATE, reading its own output as input — and "add /-" appends again:
#
#   Pod "haku-ui-0" is invalid: [spec.volumes[3].name: Duplicate value:
#   "haku-egress-proxy-ca-cert", spec.containers[0].volumeMounts[3].mountPath:
#   Invalid value: "/egress-proxy-ca": must be unique]
#
# That was a real outage in the sibling haku-egress-proxy policy (2026-08-05):
# haku-sandbox runs VPA in Auto mode, VPA's webhook sorts after Kyverno's and
# patches resource requests, and haku-ui sat at 1/2 with haku-ui-0 permanently
# uncreatable. It presented as intermittent because VPA patches nothing when its
# recommendation already matches the pod. This policy had the identical defect
# and is fixed alongside it; pinned by cluster/validation/test_proxy_injection.py,
# which applies each policy twice.
#
# NO_PROXY entry by entry, injected identically into containers and
# initContainers:
#
#   127.0.0.1, localhost    Loopback. A pod's own sidecars and health checks must
#                           not be shipped to a proxy in another pod.
#   .svc                    In-cluster Service names, in all three forms clients
#   .svc.cluster.local      actually construct. Suffix matching is literal, so
#   kubernetes.default.svc  the short forms do not match the qualified suffix and
#                           need listing separately — without them
#                           `https://kubernetes.default.svc`, the URL in-cluster
#                           client libraries build by default, goes to the proxy
#                           and hangs until timeout (diagnosed from a haku
#                           sandbox, 2026-07-24).
#   10.0.0.0/8              Pod and Service CIDRs — the same destinations reached
#                           by IP rather than by name.
#
# Everything on this list is reached with no proxy in the path and no egress
# allowlist applied. Accepted: it is all cluster addressing, and in-cluster
# services authenticate their own callers.
#
# This is the same cluster-addressing set as the other two injection policies,
# asserted by //cluster/validation:test_proxy_injection. One group that
# inject-haku-egress-proxy carries is deliberately absent here:
#
#   *.allegedly.works  Must NOT be unified: the loom/gym eval driver is supposed
#                      to reach docker-ci.allegedly.works *through* this proxy,
#                      which raw-tunnels it so docker mTLS survives end to end.
#                      Bypassing our own public names here would break that path.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-mitmproxy
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Inject mitmproxy
    policies.kyverno.io/category: Networking
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Mutates pods in claude-sandbox to automatically
      inject mitmproxy proxy env vars (HTTP_PROXY, HTTPS_PROXY, NO_PROXY,
      SSL_CERT_FILE, CURL_CA_BUNDLE, REQUESTS_CA_BUNDLE, NODE_EXTRA_CA_CERTS)
      and mount the mitmproxy trust bundle at /mitmproxy-ca/ca-certificates.crt.
spec:
  mutateExistingOnPolicyUpdate: false
  rules:
    - name: add-proxy-volume
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [claude-sandbox]
              operations: [CREATE]
      preconditions:
        all:
          - key: "{{ (request.object.spec.volumes || `[]`)[?name=='mitmproxy-ca-cert'] | length(@) }}"
            operator: Equals
            value: 0
      mutate:
        patchesJson6902: |-
          - op: add
            path: "/spec/volumes/-"
            value:
              name: mitmproxy-ca-cert
              configMap:
                name: mitmproxy-ca-cert

    - name: add-proxy-env-and-mount-containers
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [claude-sandbox]
              operations: [CREATE]
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            preconditions:
              all:
                - key: "{{ (element.volumeMounts || `[]`)[?name=='mitmproxy-ca-cert'] | length(@) }}"
                  operator: Equals
                  value: 0
            patchesJson6902: |-
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: HTTP_PROXY
                  value: "http://mitmproxy.agents-mitmproxy.svc.cluster.local:8080"
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: HTTPS_PROXY
                  value: "http://mitmproxy.agents-mitmproxy.svc.cluster.local:8080"
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: NO_PROXY
                  value: "127.0.0.1,localhost,.svc,.svc.cluster.local,kubernetes.default.svc,10.0.0.0/8"
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: SSL_CERT_FILE
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: CURL_CA_BUNDLE
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: REQUESTS_CA_BUNDLE
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: NODE_EXTRA_CA_CERTS
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/containers/{{elementIndex}}/volumeMounts/-"
                value:
                  name: mitmproxy-ca-cert
                  mountPath: /mitmproxy-ca
                  readOnly: true

    - name: add-proxy-env-and-mount-init-containers
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [claude-sandbox]
              operations: [CREATE]
      preconditions:
        any:
          - key: "{{ (request.object.spec.initContainers || `[]`) | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      mutate:
        foreach:
          - list: "request.object.spec.initContainers"
            preconditions:
              all:
                - key: "{{ (element.volumeMounts || `[]`)[?name=='mitmproxy-ca-cert'] | length(@) }}"
                  operator: Equals
                  value: 0
            patchesJson6902: |-
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: HTTP_PROXY
                  value: "http://mitmproxy.agents-mitmproxy.svc.cluster.local:8080"
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: HTTPS_PROXY
                  value: "http://mitmproxy.agents-mitmproxy.svc.cluster.local:8080"
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: NO_PROXY
                  value: "127.0.0.1,localhost,.svc,.svc.cluster.local,kubernetes.default.svc,10.0.0.0/8"
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: SSL_CERT_FILE
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: CURL_CA_BUNDLE
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: REQUESTS_CA_BUNDLE
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: NODE_EXTRA_CA_CERTS
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/volumeMounts/-"
                value:
                  name: mitmproxy-ca-cert
                  mountPath: /mitmproxy-ca
                  readOnly: true
