# Grant approved agent identities access in explicitly opted-in namespaces.
# The namespace labels are GitOps-owned data classifications and access grants,
# not merely descriptive metadata.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-agent-diagnostics-readers
  annotations:
    policies.kyverno.io/title: Generate agent diagnostics readers
    policies.kyverno.io/category: Access Control
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace, RoleBinding
    policies.kyverno.io/description: >-
      Generates namespaced, read-only metadata and optional pod-log
      RoleBindings when a GitOps-managed Namespace opts in.
spec:
  background: true
  rules:
    # Either label grants the common metadata baseline. The logs label means
    # metadata plus logs, so a namespace needs only one classification label.
    - name: generate-agent-readable-metadata
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  rbac.ducktape.io/agent-readable-metadata: "true"
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  rbac.ducktape.io/agent-readable-logs: "true"
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        name: agent-readable-metadata
        namespace: "{{request.object.metadata.name}}"
        data:
          metadata:
            labels:
              rbac.ducktape.io/managed-by: kyverno
              rbac.ducktape.io/access: agent-readable-metadata
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: agent-readable-namespace-metadata
          subjects:
            - kind: Group
              name: oidc-ksbx-groups:haku
              apiGroup: rbac.authorization.k8s.io
            - kind: ServiceAccount
              name: haku
              namespace: haku-sandbox
            - kind: ServiceAccount
              name: haku-claude
              namespace: haku-claude-sandbox
            - kind: Group
              name: oidc-ksbx-groups:kubectl-sandbox-users
              apiGroup: rbac.authorization.k8s.io
            - kind: ServiceAccount
              name: public-coder-agent-reader
              namespace: public-coder-agent

    - name: generate-agent-readable-logs
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  rbac.ducktape.io/agent-readable-logs: "true"
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        name: agent-readable-logs
        namespace: "{{request.object.metadata.name}}"
        data:
          metadata:
            labels:
              rbac.ducktape.io/managed-by: kyverno
              rbac.ducktape.io/access: agent-readable-logs
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: agent-readable-namespace-logs
          subjects:
            - kind: Group
              name: oidc-ksbx-groups:haku
              apiGroup: rbac.authorization.k8s.io
            - kind: ServiceAccount
              name: haku
              namespace: haku-sandbox
            - kind: ServiceAccount
              name: haku-claude
              namespace: haku-claude-sandbox
            - kind: Group
              name: oidc-ksbx-groups:kubectl-sandbox-users
              apiGroup: rbac.authorization.k8s.io
            - kind: ServiceAccount
              name: public-coder-agent-reader
              namespace: public-coder-agent
