# Grant Haku's diagnostics subjects access in explicitly opted-in namespaces.
# The namespace labels are GitOps-owned; they are access grants, not merely
# metadata.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-haku-diagnostics-readers
  annotations:
    policies.kyverno.io/title: Generate Haku diagnostics readers
    policies.kyverno.io/category: Access Control
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace, RoleBinding
    policies.kyverno.io/description: >-
      Generates namespaced, read-only diagnostics RoleBindings for Haku when a
      GitOps-managed Namespace opts in with the corresponding RBAC label.
spec:
  background: true
  rules:
    - name: generate-haku-logs-configmaps-reader
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  rbac.ducktape.io/haku-logs-configmaps: "true"
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        name: haku-logs-configmaps-reader
        namespace: "{{request.object.metadata.name}}"
        data:
          metadata:
            labels:
              rbac.ducktape.io/managed-by: kyverno
              rbac.ducktape.io/access: haku-logs-configmaps
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: logs-configmaps-reader
          subjects:
            - kind: Group
              name: oidc-ksbx-groups:haku
              apiGroup: rbac.authorization.k8s.io
            - kind: ServiceAccount
              name: haku
              namespace: haku-sandbox
            - kind: ServiceAccount
              name: haku-claude
              namespace: haku-claude-sandbox
    - name: generate-haku-namespace-diagnostics-reader
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  rbac.ducktape.io/haku-namespace-diagnostics: "true"
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        name: haku-namespace-diagnostics-reader
        namespace: "{{request.object.metadata.name}}"
        data:
          metadata:
            labels:
              rbac.ducktape.io/managed-by: kyverno
              rbac.ducktape.io/access: haku-namespace-diagnostics
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: namespace-diagnostics-reader
          subjects:
            - kind: Group
              name: oidc-ksbx-groups:haku
              apiGroup: rbac.authorization.k8s.io
            - kind: ServiceAccount
              name: haku
              namespace: haku-sandbox
            - kind: ServiceAccount
              name: haku-claude
              namespace: haku-claude-sandbox
