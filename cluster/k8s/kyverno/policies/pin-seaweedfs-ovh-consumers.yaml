# seaweedfs-csi-driver's node/mount/controller plugins are affinity-pinned to
# hil-ovh nodes only (affinity.nodeAffinity blocks in
# cluster/k8s/seaweedfs-csi/helmrelease.yaml), but the driver reports NO CSI
# topology info: NodeGetInfo carries no accessible_topology and every CSINode
# object shows topologyKeys=null for seaweedfs-csi-driver (checked against both
# the pinned v1.4.14 and current upstream v1.4.29 -- the driver implements no
# topology support at all, so this isn't a flag we're missing). That makes
# allowedTopologies on the seaweedfs-ovh* StorageClasses a no-op: nothing stops
# the scheduler from placing a pod with a seaweedfs-ovh/seaweedfs-ovh-ssd PVC
# onto a non-OVH node (e.g. wyrm2), where it then hangs forever in
# Pending/ContainerCreating with "CSINode wyrm2 does not contain driver
# seaweedfs-csi-driver". Hit litellm/ollama co-location already (its
# region=proxmox preference pulled a replica onto wyrm2). hil-ovh-only isn't
# purely a bug workaround either: wyrm2 is a different DC (SF vs hil-ovh's
# Oregon), so keeping SeaweedFS consumers in hil-ovh keeps their I/O in-DC,
# which is the right default regardless of the topology gap.
#
# This policy replaces the interim per-consumer fix (hand-added nodeSelector on
# codex/public-coder-agent) with one place that encodes that default for every
# consumer, present and future.
#
# CLEANUP (added 2026-08-26): remove this policy (and rely solely on
# StorageClass allowedTopologies) once seaweedfs-csi-driver's NodeGetInfo
# reports accessible_topology -- verify with:
#   kubectl get csinodes -o jsonpath='{.items[*].spec.drivers[?(@.name=="seaweedfs-csi-driver")].topologyKeys}'
# which is null today (checked against v1.4.14 and current upstream v1.4.29).
# Tracked upstream: seaweedfs/seaweedfs-csi-driver#300. Fix in progress:
# seaweedfs/seaweedfs-csi-driver#301 (maintainer's own PR, not yet merged).
#
# Matches literal StorageClass names (seaweedfs-ovh, seaweedfs-ovh-ssd) rather
# than the underlying `provisioner` field: simpler (no second chained
# PVC -> StorageClass -> provisioner apiCall) at the cost of needing an update
# here if another seaweedfs-ovh*-backed StorageClass shows up.
#
# Uses patchStrategicMerge, not RFC 6902 like the sibling inject-* policies in
# this directory, because the mutated field (spec.nodeSelector) is a map, not a
# list: strategic merge deep-merges by key, so it won't clobber an existing
# nodeSelector entry (e.g. codex/public-coder-agent's hand-added
# topology.kubernetes.io/region: hil) and re-applying the same key/value is
# naturally a no-op. That sidesteps the append-only failure mode the sibling
# policies guard against (RFC 6902 "add /-" duplicating itself when Kyverno's
# reinvocationPolicy: IfNeeded re-runs the webhook within the same CREATE) --
# no "already present" precondition guard is needed here for that reason.
#
# context.apiCall is the first use of a live API lookup in this policy
# directory, and this rule matches every Pod CREATE cluster-wide, so a lookup
# failure (PVC not yet created, transient apiserver error) must not block
# unrelated pod admission. `default: ""` on the apiCall makes a failed lookup
# resolve to an empty string, which the AnyIn precondition below treats as "no
# match" rather than an error; webhookConfiguration.failurePolicy: Ignore is a
# second line of defense so any other unexpected rule error fails open too.
# Worst case on failure: the pod schedules wherever it would have without this
# policy -- i.e. the pre-existing bug, not a new outage.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pin-seaweedfs-ovh-consumers
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Pin SeaweedFS-OVH consumers to hil-ovh
    policies.kyverno.io/category: Storage
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Mutates pods that mount a seaweedfs-ovh or seaweedfs-ovh-ssd PVC to add
      topology.kubernetes.io/zone=hil-ovh to spec.nodeSelector, since the
      seaweedfs-csi-driver node plugin only runs on hil-ovh nodes but reports
      no CSI topology, so allowedTopologies on the StorageClass cannot enforce
      this by itself.
spec:
  mutateExistingOnPolicyUpdate: false
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: pin-node-selector
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE]
      mutate:
        foreach:
          - list: "(request.object.spec.volumes || `[]`)[?persistentVolumeClaim!=null]"
            context:
              - name: storageClassName
                apiCall:
                  urlPath: "/api/v1/namespaces/{{request.namespace}}/persistentvolumeclaims/{{element.persistentVolumeClaim.claimName}}"
                  jmesPath: "spec.storageClassName || ''"
                  default: ""
            preconditions:
              all:
                - key: "{{ storageClassName }}"
                  operator: AnyIn
                  value: ["seaweedfs-ovh", "seaweedfs-ovh-ssd"]
            patchStrategicMerge:
              spec:
                nodeSelector:
                  topology.kubernetes.io/zone: hil-ovh
