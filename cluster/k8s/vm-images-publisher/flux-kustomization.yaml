apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vm-images-publisher
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/vm-images-publisher
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: vm-images-publisher
    # attic-reader-netrc.sops.yaml is SOPS-encrypted; without this, Flux applies
    # the ciphertext literally and the publisher's attic auth (netrc) is garbage.
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: seaweedfs-cluster
      namespace: ducktape-flux
  wait: true
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: vm-images
      namespace: vm-images-publisher
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: vm-images-ci-writer
      namespace: vm-images-publisher
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: vm-images-cdi-reader
      namespace: vm-images-publisher
    - apiVersion: batch/v1
      kind: CronJob
      name: vm-images-publisher
      namespace: vm-images-publisher
