apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vm-images-publisher
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/vm-images-publisher
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    # attic-reader-netrc.sops.yaml is SOPS-encrypted; without this, Flux applies
    # the ciphertext literally and the publisher's attic auth (netrc) is garbage.
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: external-secrets-operator
      namespace: ducktape-flux
    - name: seaweedfs-public-s3
      namespace: ducktape-flux
  wait: true
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: vm-images-s3-writer
      namespace: vm-images-publisher
    - apiVersion: batch/v1
      kind: CronJob
      name: vm-images-publisher
      namespace: vm-images-publisher
