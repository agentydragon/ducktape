# Cross-namespace fetch of vm-images-ci-writer keys from seaweedfs/vm-images-s3-credentials.
# Same pattern as cluster/k8s/gecko/app/vm-images-s3-reader.yaml but for writer keys.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
  namespace: vm-images-publisher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-images-publisher-s3-writer
  namespace: seaweedfs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vm-images-s3-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-images-publisher-s3-writer
  namespace: seaweedfs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-images-publisher-s3-writer
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: vm-images-publisher
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vm-images-credentials
  namespace: vm-images-publisher
spec:
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: secret-reader
          namespace: vm-images-publisher
      remoteNamespace: seaweedfs
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vm-images-s3-writer
  namespace: vm-images-publisher
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vm-images-credentials
  target:
    name: vm-images-s3-writer
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: vm-images-s3-credentials
        property: ciWriterAccessKey
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: vm-images-s3-credentials
        property: ciWriterSecretKey
