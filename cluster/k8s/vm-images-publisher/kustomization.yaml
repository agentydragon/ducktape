apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storage/bucket.yaml
  - storage/iam.yaml
  - storage/seaweed-reference-grant.yaml
  - attic-reader-netrc.sops.yaml
  - cronjob.yaml
configMapGenerator:
  - name: vm-images-publisher-scripts
    namespace: vm-images-publisher
    files:
      - publish.sh
generatorOptions:
  disableNameSuffixHash: false
