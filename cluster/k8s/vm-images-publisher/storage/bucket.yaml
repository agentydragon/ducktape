apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: vm-images
  namespace: vm-images-publisher
spec:
  name: vm-images
  # The physical bucket already exists; this CR is moving to the publisher's
  # namespace without deleting or recreating its data.
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  reclaimPolicy: Retain
  access:
    - user: vm-images-ci-writer
      actions: [Read, Write, List, Tagging]
    - user: vm-images-cdi-reader
      actions: [Read, List]
