# Permit the publisher-local Bucket and S3Credentials to reference the
# SeaweedFS cluster and identities in seaweedfs.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: vm-images
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: vm-images-publisher
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: vm-images-publisher
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
