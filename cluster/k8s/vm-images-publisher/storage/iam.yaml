  namespace: vm-images-publisher
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  identityRef:
    name: vm-images-cdi-reader
  secretRef:
    name: vm-images-cdi-reader-s3-credentials
  reclaimPolicy: Retain
