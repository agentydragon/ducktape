apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tana-litellm
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/litellm/tana
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 10m
  dependsOn:
    - name: litellm-namespace
      namespace: ducktape-flux
    - name: litellm-secrets
      namespace: ducktape-flux
    - name: langfuse-secrets
      namespace: ducktape-flux
    - name: gateway
      namespace: flux-system
    - name: reflector
      namespace: ducktape-flux
    - name: tana-mcp
      namespace: flux-system
    - name: reloader
      namespace: ducktape-flux
