apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tana-litellm
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/litellm/tana
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
    - name: litellm-namespace
    - name: litellm-secrets
    - name: langfuse-secrets
    - name: gateway
    - name: reflector
    - name: tana-mcp
    - name: reloader
