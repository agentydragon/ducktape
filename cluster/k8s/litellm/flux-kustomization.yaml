apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/litellm
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  dependsOn:
    - name: cert-manager-issuer-config
    - name: ollama
    - name: ollama-namespace
    - name: ollama-secrets
    - name: gateway
    - name: cert-manager-environment
