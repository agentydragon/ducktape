apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: litellm-keys
  namespace: flux-system
spec:
  approvePlan: auto
  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "litellm_keys"
      }
  interval: 15m
  path: ./tf/gitops/litellm-keys
  refreshBeforeApply: true
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: tofu-state-db-credentials
        - name: SOPS_AGE_KEY
          valueFrom:
            secretKeyRef:
              key: key
              name: litellm-clients-sops-age-key
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
  serviceAccountName: tf-runner
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  vars:
    - name: model_lanes
      value:
        antigravity_client_models:
          allowed_models:
            - antigravity/ant-messages/claude-opus-4-6-thinking
            - antigravity/ant-messages/claude-sonnet-4-6
            - antigravity/ant-messages/gemini-3.6-flash-high
            - antigravity/ant-messages/gemini-3.7-flash-high
            - antigravity/ant-messages/gemini-3.8-flash-high
            - antigravity/ant-messages/gemini-3-flash
            - antigravity/ant-messages/gemini-3.1-flash-image
            - antigravity/ant-messages/gemini-pro-agent
            - antigravity/ant-messages/gemini-3.1-pro-low
            - antigravity/ant-messages/gpt-oss-120b-medium
            - antigravity/ant-messages/gemini-3.1-flash-lite
            - antigravity/ant-messages/gemini-3.5-flash-lite
          fallback_models:
            - antigravity/ant-messages/gemini-3.5-flash-lite
        cheap_experiments_models:
          allowed_models:
            - google/goog-generate/gemini-3.7-flash
            - google/goog-generate/gemini-3.5-flash-lite
            - antigravity/ant-messages/gemini-3.1-flash-lite
            - antigravity/ant-messages/gemini-3.5-flash-lite
            - google/goog-embed/gemini-embedding-2
            - google/goog-embed/gemini-embedding-001
            - mistral/oai-chat/codestral-2508
            - mistral/oai-chat/codestral-latest
            - mistral/oai-chat/magistral-medium-latest
            - mistral/oai-chat/magistral-small-latest
            - mistral/oai-chat/ministral-14b-latest
            - mistral/oai-chat/ministral-14b-2512
            - mistral/oai-chat/ministral-8b-latest
            - mistral/oai-chat/ministral-8b-2512
            - mistral/oai-chat/ministral-3b-latest
            - mistral/oai-chat/ministral-3b-2512
            - mistral/oai-chat/mistral-code-fim-latest
            - mistral/oai-chat/mistral-code-latest
            - mistral/oai-chat/mistral-medium
            - mistral/oai-chat/mistral-medium-2604
            - mistral/oai-chat/mistral-medium-3
            - mistral/oai-chat/mistral-medium-3-5
            - mistral/oai-chat/mistral-medium-3.5
            - mistral/oai-chat/mistral-medium-latest
            - mistral/oai-chat/mistral-small-2603
            - mistral/oai-chat/mistral-small-latest
            - mistral/oai-chat/mistral-vibe-cli-fast
            - mistral/oai-chat/mistral-vibe-cli-latest
            - mistral/oai-chat/mistral-vibe-cli-with-tools
            - mistral/oai-chat/voxtral-small-2507
            - mistral/oai-chat/voxtral-small-latest
            - ollama/oai-chat/qwen3.8-flash-next-iq4xs-128k
            - ollama/olm-chat/qwen3.8-flash-next-iq4xs-128k
            - ollama/oai-chat/qwen3.8-flash-next-iq4xs-256k
