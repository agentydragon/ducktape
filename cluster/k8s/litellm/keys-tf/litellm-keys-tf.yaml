# Mints the Haku worker-lane LiteLLM virtual keys (tf/gitops/litellm-keys).
# Needs the master key (litellm-api-key CR) and a serving LiteLLM with its
# virtual-key DB; tofu-controller retries on its interval until LiteLLM is up.
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: litellm-keys
  namespace: flux-system
spec:
  interval: 15m
  approvePlan: "auto"
  refreshBeforeApply: true
  path: ./tf/gitops/litellm-keys
  dependsOn:
    - name: litellm-api-key
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  serviceAccountName: tf-runner
  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "litellm_keys"
      }
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tofu-state-db-credentials
              key: password
        # Narrow SOPS age private key (cluster/k8s/litellm/keys-tf/
        # litellm-clients-sops-age-key.sops.yaml) so sops_external can decrypt
        # secrets/litellm-clients-key.yaml. Single-purpose — decrypts only that
        # file; not the broad cluster SOPS key.
        - name: SOPS_AGE_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-clients-sops-age-key
              key: key
  vars: []
