apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-servicemonitor
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/litellm/servicemonitor
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: litellm-servicemonitor

    namespace: ducktape-flux
  dependsOn:
    - name: litellm
      namespace: ducktape-flux
    - name: monitoring-stack
      namespace: ducktape-flux
