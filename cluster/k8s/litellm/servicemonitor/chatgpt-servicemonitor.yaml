apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm-chatgpt
  namespace: litellm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-chatgpt
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      bearerTokenSecret:
        name: litellm-master-key
        key: api-key
