# Anthropic API key for LiteLLM's claude-* upstream models, mirrored from the
# spend-capped haku-cloud workspace key in flux-system — no second
# plaintext/sops copy. Consumed as ANTHROPIC_API_KEY in the litellm Deployment
# (referenced by proxy-config.yaml's anthropic models). Sharing the haku
# workspace is deliberate v1: the only claude-allowlisted virtual key is the
# haku dispatcher's classifier key, so all usage stays under the same cap the
# dispatcher used when it held the key directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-anthropic-key
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-flux-system-secret-store
    kind: ClusterSecretStore
  target:
    name: litellm-anthropic-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: haku-cloud-anthropic-api-key
        property: api-key
