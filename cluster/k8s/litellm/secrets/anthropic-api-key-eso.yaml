# Anthropic API key for LiteLLM's anthropic-api/ant-messages/* exposed models. Its dedicated
# SecretStore can read only ducktape-flux/llm-anthropic-haku.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-anthropic-key
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-external-creds-secret-store
    kind: ClusterSecretStore
  target:
    name: litellm-anthropic-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: llm-anthropic-haku
        property: api-key
