apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-groq-key
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef: { name: llm-groq, kind: SecretStore }
  target: { name: litellm-groq-key, creationPolicy: Owner }
  data:
    - secretKey: GROQ_API_KEY
      remoteRef: { key: llm-groq, property: api-key }
