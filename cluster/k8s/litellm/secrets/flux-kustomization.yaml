apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-secrets
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/litellm/secrets
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: litellm-keys
      namespace: flux-system
  timeout: 10m
  dependsOn:
    - name: litellm-namespace
    - name: external-secrets-config
    - name: tofu-controller
    - name: tofu-state-db
