apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-secrets
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/litellm/secrets
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  timeout: 5m
  dependsOn:
    - name: external-creds
      namespace: ducktape-flux
    - name: litellm-namespace
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
