# z.ai (GLM) API key for LiteLLM's z.ai upstream models. The dedicated
# SecretStore can read only ducktape-flux/llm-zai.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-zai-key
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: llm-zai
    kind: SecretStore
  target:
    name: litellm-zai-key
    creationPolicy: Owner
  data:
    - secretKey: ZAI_API_KEY
      remoteRef:
        key: llm-zai
        property: api-key
