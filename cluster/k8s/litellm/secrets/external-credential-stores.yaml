# Consumer-owned identities and namespace-local stores for the canonical LLM
# credentials approved by source-side RoleBindings in external-creds.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-anthropic-haku-reader
  namespace: litellm
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: llm-anthropic-haku
  namespace: litellm
spec:
  provider:
    kubernetes:
      server:
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt }
      auth:
        serviceAccount: { name: llm-anthropic-haku-reader }
      remoteNamespace: ducktape-flux
---
