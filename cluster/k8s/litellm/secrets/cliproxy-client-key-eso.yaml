# Mirrors the CLIProxyAPI client key (SSOT: cli-proxy-api/cli-proxy-api-client-key) into the
# litellm namespace so the main LiteLLM proxy can authenticate the codex-* upstream models in
# proxy-config.yaml via CLIPROXY_CLIENT_KEY. ESO mirror — we do not widen the declarative
# reflector annotations on the source Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxy-client-key
  namespace: litellm
  annotations:
    description: >-
      CLIProxyAPI client key mirrored into litellm for the codex-* upstream models, sourced
      from cli-proxy-api/cli-proxy-api-client-key via kubernetes-cli-proxy-api-secret-store.
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-cli-proxy-api-secret-store
    kind: ClusterSecretStore
  target:
    name: litellm-cliproxy-key
    creationPolicy: Owner
  data:
    - secretKey: CLIPROXY_CLIENT_KEY
      remoteRef:
        key: cli-proxy-api-client-key
        property: client-key
