apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: litellm-llama-cpp-api-key
  namespace: litellm
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-llama-cpp-api-key
  namespace: litellm
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: litellm-llama-cpp-api-key
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Owner
    name: litellm-llama-cpp-api-key
    template:
      data:
        api-key: "{{ .password }}"
      type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: litellm
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-anthropic-key
  namespace: litellm
spec:
  data:
    - remoteRef:
        key: llm-anthropic-haku
        property: api-key
      secretKey: api-key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    name: litellm-anthropic-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    description: CLIProxyAPI client key mirrored into litellm for the codex-* upstream models, sourced from cli-proxy-api/cli-proxy-api-client-key via kubernetes-cli-proxy-api-secret-store.
  name: cliproxy-client-key
  namespace: litellm
spec:
  data:
    - remoteRef:
        key: cli-proxy-api-client-key
        property: client-key
      secretKey: CLIPROXY_CLIENT_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-cli-proxy-api-secret-store
  target:
    creationPolicy: Owner
    name: litellm-cliproxy-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-groq-key
  namespace: litellm
spec:
  data:
    - remoteRef:
        key: llm-groq
        property: api-key
      secretKey: GROQ_API_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    name: litellm-groq-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-gemini-key
  namespace: litellm
spec:
  data:
    - remoteRef:
        key: llm-gemini
        property: api-key
      secretKey: GEMINI_API_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    name: litellm-gemini-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-mistral-key
  namespace: litellm
spec:
  data:
    - remoteRef:
        key: llm-mistral
        property: api-key
      secretKey: MISTRAL_API_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    name: litellm-mistral-key
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-tana-firebase-refresh-token-reader
  namespace: tana-mcp
rules:
  - apiGroups:
      - ""
    resourceNames:
      - tana-firebase-refresh-token
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-tana-firebase-refresh-token-reader
  namespace: tana-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: litellm-tana-firebase-refresh-token-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: external-creds-reader
    namespace: litellm
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-litellm-tana-firebase-refresh-token-secret-store
spec:
  conditions:
    - namespaces:
        - litellm
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-creds-reader
      remoteNamespace: tana-mcp
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tana-firebase-refresh-token
  namespace: litellm
spec:
  data:
    - remoteRef:
        key: tana-firebase-refresh-token
        property: refresh_token
      secretKey: refresh_token
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-litellm-tana-firebase-refresh-token-secret-store
  target:
    creationPolicy: Owner
    name: tana-firebase-refresh-token
