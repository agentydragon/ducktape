apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: litellm
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-anthropic-key
  namespace: litellm
spec:
  data:
    - remoteRef:
        key: llm-anthropic-haku
        property: api-key
      secretKey: api-key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    name: litellm-anthropic-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    description: CLIProxyAPI client key mirrored into litellm for the codex-* upstream models, sourced from cli-proxy-api/cli-proxy-api-client-key via kubernetes-cli-proxy-api-secret-store.
  name: cliproxy-client-key
  namespace: litellm
spec:
  data:
    - remoteRef:
        key: cli-proxy-api-client-key
        property: client-key
      secretKey: CLIPROXY_CLIENT_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-cli-proxy-api-secret-store
  target:
    creationPolicy: Owner
    name: litellm-cliproxy-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-groq-key
  namespace: litellm
spec:
