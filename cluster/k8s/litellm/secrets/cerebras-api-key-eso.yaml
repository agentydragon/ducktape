# ESO mirror of the canonical Cerebras credential in ducktape-flux.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-cerebras-key
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kubernetes-external-creds-secret-store, kind: ClusterSecretStore }
  target: { name: litellm-cerebras-key, creationPolicy: Owner }
  data:
    - secretKey: CEREBRAS_API_KEY
      remoteRef: { key: llm-cerebras, property: api-key }
