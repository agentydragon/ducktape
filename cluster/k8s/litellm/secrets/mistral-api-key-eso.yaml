# ESO mirror of the canonical Mistral credential in ducktape-flux.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-mistral-key
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kubernetes-external-creds-secret-store, kind: ClusterSecretStore }
  target: { name: litellm-mistral-key, creationPolicy: Owner }
  data:
    - secretKey: MISTRAL_API_KEY
      remoteRef: { key: llm-mistral, property: api-key }
