apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-gemini-key
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kubernetes-external-creds-secret-store, kind: ClusterSecretStore }
  target: { name: litellm-gemini-key, creationPolicy: Owner }
  data:
    - secretKey: GEMINI_API_KEY
      remoteRef: { key: llm-gemini, property: api-key }
