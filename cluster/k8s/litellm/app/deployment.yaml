# Replaced LiteLLM Helm chart (litellm-helm v1.82.0-stable.patch5 from oci://ghcr.io/berriai/litellm-helm).
# The chart handled Deployment, Service, ServiceAccount, ConfigMap, and optional DB/HPA/KEDA/ServiceMonitor.
# We only used the core subset; hand-written manifests are simpler and avoid the Helm indirection.
#
# TODO: LiteLLM supports virtual key management, per-key spend limits, and rate limiting via
# a PostgreSQL database. Consider enabling when multi-user/multi-team API key isolation is needed.
# See: https://docs.litellm.ai/docs/proxy/virtual_keys
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      serviceAccountName: litellm
      terminationGracePeriodSeconds: 90
      # litellm proxies to local Ollama for fallback paths and lives close
      # to ollama on the Proxmox GPU host. Pin to the proxmox region so it
      # only schedules where it belongs (and stays Pending when those
      # nodes are offline, rather than landing on a hil worker).
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      containers:
        - name: litellm
          image: litellm/litellm:1.82.1
          args: ["--config", "/etc/litellm/config.yaml"]
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4000"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: api-key
          # TODO: Re-enable langfuse-api-keys envFrom when Langfuse is unsuspended
          # (suspended 2026-03-31, see cluster/docs/plan.md).
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
            items:
              - key: config.yaml
                path: config.yaml
