# Replaced LiteLLM Helm chart (litellm-helm v1.82.0-stable.patch5 from oci://ghcr.io/berriai/litellm-helm).
# The chart handled Deployment, Service, ServiceAccount, ConfigMap, and optional DB/HPA/KEDA/ServiceMonitor.
# We only used the core subset; hand-written manifests are simpler and avoid the Helm indirection.
#
# Virtual keys / per-key budgets are enabled: DATABASE_URL points at the litellm-db
# CNPG cluster (../db/). LiteLLM runs the Prisma schema migration on startup; the
# Prisma's advisory lock protects schema migration when both pods start together.
# Keys are minted declaratively by tf/gitops/litellm-keys (see
# haku/archive/2026_08_multi_agent.md).
# Models deliberately stay in the generated config, NOT the DB — see
# general_settings.store_model_in_db in proxy-config.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  # This proxy is stateless -- every provider credential is a static key, so no
  # provider can block startup and normal rollouts preserve both serving replicas.
  # Keep it that way: the one provider that ever held OAuth state (litellm-chatgpt,
  # deleted 2026-08-06) needed a whole second single-replica Deployment to avoid
  # taking this one down with it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      serviceAccountName: litellm
      terminationGracePeriodSeconds: 90
      # Keep the public multi-provider proxy in OVH so external providers remain
      # available during a home outage. Ollama requests can cross the mesh to wyrm2.
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      # Stateless service; allow control-plane nodes as overflow capacity.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Spread the two replicas across nodes: co-located, a single drain takes
      # the Service to zero backends, which in-cluster clients see as an
      # immediate EPERM on connect (same end state as the 2026-08-09 outage).
      # ScheduleAnyway, not DoNotSchedule -- there is no PDB here, so a hard
      # constraint would only convert "both on one node" into "pending pod"
      # whenever hil-ovh is short a node. Same reasoning as the namespace's
      # deliberate lack of a VPA maxAllowed: don't add new ways to block
      # admission when the failure mode being guarded is already starvation.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      containers:
        - name: litellm
          image: litellm/litellm:1.90.2
          args: ["--config", "/etc/litellm/config.yaml"]
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4000"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: api-key
            # Virtual-key/spend DB (CNPG cluster litellm-db; secret auto-generated
            # by CNPG). Enables /key/generate, per-key budgets, kill-switch.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-db-app
                  key: uri
            # Encrypts credential material LiteLLM stores in the DB. Set once,
            # NEVER rotate — rotating orphans everything already encrypted with it.
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-salt-key
                  key: key
            # Anthropic key for the anthropic-api/ant-messages/* exposed models (ESO mirror of the
            # spend-capped haku-cloud workspace key; see secrets/anthropic-api-key-eso.yaml).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-anthropic-key
                  key: api-key
            # Groq key for the groq upstream models (Llama chat + Whisper ASR).
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-groq-key
                  key: GROQ_API_KEY
            # Google AI (Gemini) key for the gemini upstream chat models.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-gemini-key
                  key: GEMINI_API_KEY
            # Mistral API key for the Mistral model roster.
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-mistral-key
                  key: MISTRAL_API_KEY
            # CLIProxyAPI client key for the codex-* upstream models (ESO mirror of
            # cli-proxy-api-client-key; see secrets/cliproxy-client-key-eso.yaml).
            - name: CLIPROXY_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-cliproxy-key
                  key: CLIPROXY_CLIENT_KEY
            - name: LANGFUSE_OTEL_HOST
              value: "http://langfuse-web.langfuse.svc.cluster.local:3000"
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_INIT_PROJECT_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            # Cold startup includes LiteLLM imports, model registration, and a
            # Prisma migration. Allow several minutes for that path to finish.
            failureThreshold: 36
          resources:
            requests:
              # A starting value only: the default-vpa-requests-only Kyverno
              # policy puts this namespace on RequestsOnly, so VPA owns the
              # request from here (it settles around 180m) and the limits below
              # are what actually apply.
              cpu: 100m
              memory: 1Gi
            limits:
              # 2 CPU is the cold start budget the startup probe below waits
              # on, not a steady-state figure — see the namespace annotation.
              cpu: "2"
              # LiteLLM 1.90.2 with the virtual-key DB idles at ~1020Mi
              # (measured); this deployment previously ran uncapped.
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
            items:
              - key: config.yaml
                path: config.yaml
