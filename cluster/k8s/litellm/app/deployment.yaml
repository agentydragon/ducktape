# Replaced LiteLLM Helm chart (litellm-helm v1.82.0-stable.patch5 from oci://ghcr.io/berriai/litellm-helm).
# The chart handled Deployment, Service, ServiceAccount, ConfigMap, and optional DB/HPA/KEDA/ServiceMonitor.
# We only used the core subset; hand-written manifests are simpler and avoid the Helm indirection.
#
# Virtual keys / per-key budgets are enabled: DATABASE_URL points at the litellm-db
# CNPG cluster (../db/). LiteLLM runs the Prisma schema migration on startup; the
# RollingUpdate maxSurge:0/maxUnavailable:1 strategy below means pods restart one at a
# time, and Prisma's advisory lock covers the rare both-pods-restart case. Keys are
# minted declaratively by tf/gitops/litellm-keys (see haku/plans/multi_agent.md).
# Models deliberately stay in the generated config, NOT the DB — see
# general_settings.store_model_in_db in generate_litellm.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  # 2 replicas for HA. Ollama/z.ai/Langfuse are all remote, so those are cleanly
  # stateless. The one exception is the chatgpt provider's auth.json on the RWX
  # chatgpt-auth PVC: both replicas share it and either may refresh+rewrite it.
  #
  # TODO(chatgpt-token-race): shared-token concurrency hazard. LiteLLM rewrites
  # auth.json in place on refresh; with >1 replica two pods can refresh the same
  # account concurrently and, because OpenAI rotates refresh tokens, invalidate
  # each other's token — taking chatgpt models down until the seed is refreshed.
  # Accepted for now: access tokens last ~10 days so the race window is a few
  # seconds per refresh. Proper fix if it bites: move the chatgpt provider into a
  # dedicated single-replica proxy and route chatgpt models to it from here.
  #
  # maxSurge:0/maxUnavailable:1 keeps >=1 pod serving during rollout and caps
  # concurrent pods (writers) at replicas. type:Recreate is avoided because
  # server-side apply rejects transitioning the already-RollingUpdate live
  # Deployment to Recreate while the API-defaulted rollingUpdate block is present.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      serviceAccountName: litellm
      terminationGracePeriodSeconds: 90
      initContainers:
        # Seed the ChatGPT provider's OAuth token onto the writable PVC, but only
        # if absent — LiteLLM refreshes/rotates the token in place, and the seed
        # secret is not updated after rotation, so we must never clobber the live file.
        - name: seed-chatgpt-auth
          image: litellm/litellm:1.90.2
          command:
            - sh
            - -c
            - test -f /data/chatgpt/auth.json || cp /seed/auth.json /data/chatgpt/auth.json
          volumeMounts:
            - name: chatgpt-auth
              mountPath: /data/chatgpt
            - name: chatgpt-auth-seed
              mountPath: /seed
              readOnly: true
      # Prefer the Proxmox GPU host (co-located with ollama for its fallback
      # paths), but allow scheduling elsewhere (e.g. OVH) so external-provider
      # models (z.ai/GLM) keep serving when the home node is offline — ollama
      # is unreachable during a home outage regardless of where litellm runs.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - proxmox
      containers:
        - name: litellm
          image: litellm/litellm:1.90.2
          args: ["--config", "/etc/litellm/config.yaml"]
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4000"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: api-key
            # Virtual-key/spend DB (CNPG cluster litellm-db; secret auto-generated
            # by CNPG). Enables /key/generate, per-key budgets, kill-switch.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-db-app
                  key: uri
            # Encrypts credential material LiteLLM stores in the DB. Set once,
            # NEVER rotate — rotating orphans everything already encrypted with it.
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-salt-key
                  key: key
            # z.ai (GLM) key for the z.ai upstream models in proxy-config.yaml.
            - name: ZAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-zai-key
                  key: ZAI_API_KEY
            # Anthropic key for the claude-* upstream models (ESO mirror of the
            # spend-capped haku-cloud workspace key; see secrets/anthropic-api-key-eso.yaml).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-anthropic-key
                  key: api-key
            - name: LANGFUSE_OTEL_HOST
              value: "http://langfuse-web.langfuse.svc.cluster.local:3000"
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_INIT_PROJECT_SECRET_KEY
            # ChatGPT provider reads/writes $CHATGPT_TOKEN_DIR/auth.json on the
            # litellm-chatgpt-auth PVC (writable; auto-refreshed & rewritten).
            - name: CHATGPT_TOKEN_DIR
              value: /data/chatgpt
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "1"
              # LiteLLM 1.90.2 with the virtual-key DB idles at ~1020Mi
              # (measured); this deployment previously ran uncapped.
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: chatgpt-auth
              mountPath: /data/chatgpt
      volumes:
        - name: config
          configMap:
            name: litellm-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: chatgpt-auth
          persistentVolumeClaim:
            claimName: litellm-chatgpt-auth
        - name: chatgpt-auth-seed
          secret:
            secretName: litellm-chatgpt-auth-seed
