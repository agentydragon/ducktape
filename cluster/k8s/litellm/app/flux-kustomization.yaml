apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/litellm/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
    - name: litellm-secrets
    - name: litellm-db
    - name: gateway
    - name: cert-manager-environment
