apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/litellm/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: litellm
    namespace: ducktape-flux
  timeout: 10m
  dependsOn:
    - name: litellm-secrets
      namespace: ducktape-flux
    - name: litellm-db
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: cert-manager-environment
      namespace: ducktape-flux
