apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: external-secrets-config
    - name: forgejo-images
    - name: litellm-secrets
    - name: litellm-db
    - name: gateway
    - name: cert-manager-environment
    - name: langfuse-secrets
    - name: reflector
    - name: tana-mcp
    - name: monitoring-crds
  interval: 10m
  path: ./cluster/k8s/litellm/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: litellm
    namespace: ducktape-flux
  timeout: 10m
