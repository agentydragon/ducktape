apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm
  namespace: litellm
spec:
  endpoints:
    - bearerTokenSecret:
        key: api-key
        name: litellm-master-key
      interval: 15s
      path: /metrics
      port: http
      scrapeTimeout: 10s
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
