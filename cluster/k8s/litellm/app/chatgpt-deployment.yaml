apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-chatgpt
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm-chatgpt
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # SUSPENDED 2026-08-06 -- superseded by CLIProxyAPI. Scaled to 0 rather than
  # deleted so the auth PVC and its rotated refresh token survive while the
  # cutover is confirmed; the whole directory is meant to be removed once
  # Codex CLI is confirmed working through cli-proxy-api. See
  # <cluster/k8s/litellm/README.md> for why this existed and what replaced it.
  #
  # It was already down when it was suspended: crashlooping ~3h (31 restarts) on
  # 2026-08-06, startup probe never seeing :4000 -- the failure this whole
  # deployment exists to contain. LiteLLM builds the ChatGPT provider's
  # authenticator during ASGI startup, and on an expired token that call
  # synchronously enters the device-code flow, so the pod never binds its port
  # and the startup probe kills it (#3198).
  #
  # Re-authenticating is the part that never got better, and is why this is being
  # retired rather than repaired. LiteLLM has no in-place login: a new token means
  # running `codex login` interactively elsewhere, reshaping the result into
  # LiteLLM's *different* flat auth.json schema (see the seed Secret's description),
  # SOPS-encrypting it, committing, waiting for Flux, and then trusting this init
  # container to replace the PVC copy. That guard has been wrong twice --
  # `[ -f auth.json ]` could not replace a file holding only
  # `device_code_requested_at` (#3199), and `grep -q '"refresh_token"'` cannot
  # replace a present-but-revoked token (today). Both test the file's shape;
  # neither can test whether the credential works, which is the only property that
  # decides whether the pod starts.
  #
  # CLIProxyAPI replaces the whole ritual with one command against the running pod
  # (`-codex-device-login`), written straight to its PVC and picked up by a file
  # watcher without a restart.
  #
  # Still pointed at by 6 model entries in proxy-config.yaml (gpt-5.4-chatgpt,
  # gpt-5.5-chatgpt, gpt-5.6-{sol,terra,luna}-chatgpt, gpt-5.3-codex-spark-chatgpt)
  # and, through them, by the baked Codex CLI configs in
  # <cluster/k8s/agents/agent-sandbox/workspace-image/codex-config.toml> and
  # <x/codex_pod_image/home.nix>. Those keep failing until the entries are
  # repointed at cli-proxy-api's /v1/responses surface -- no image rebuild needed,
  # the model *names* can stay.
  #
  # The ChatGPT provider rotates a single OAuth refresh token. Recreate plus one
  # replica guarantees that rollouts never overlap token writers.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-chatgpt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-chatgpt
    spec:
      serviceAccountName: litellm
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      initContainers:
        # The seed is only disaster-recovery bootstrap material. LiteLLM rotates
        # the live token on the PVC, so preserve any complete auth file.
        - name: seed-chatgpt-auth
          image: litellm/litellm:1.90.2
          command:
            - sh
            - -c
            - grep -q '"refresh_token"' /data/chatgpt/auth.json || cp /seed/auth.json /data/chatgpt/auth.json
          volumeMounts:
            - name: chatgpt-auth
              mountPath: /data/chatgpt
            - name: chatgpt-auth-seed
              mountPath: /seed
              readOnly: true
      # The seaweedfs-ovh PVC can only mount on OVH nodes.
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      containers:
        - name: litellm
          image: litellm/litellm:1.90.2
          args: ["--config", "/etc/litellm/config.yaml"]
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4000"
            # Reusing the main master key adds no privilege to the main proxy and
            # avoids a second secret lifecycle solely for this private hop.
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: api-key
            - name: CHATGPT_TOKEN_DIR
              value: /data/chatgpt
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: chatgpt-auth
              mountPath: /data/chatgpt
      volumes:
        - name: config
          configMap:
            name: litellm-chatgpt-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: chatgpt-auth
          persistentVolumeClaim:
            claimName: litellm-chatgpt-auth
        - name: chatgpt-auth-seed
          secret:
            secretName: litellm-chatgpt-auth-seed
