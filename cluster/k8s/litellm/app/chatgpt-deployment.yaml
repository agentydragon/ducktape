apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-chatgpt
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm-chatgpt
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # The ChatGPT provider rotates a single OAuth refresh token. Recreate plus one
  # replica guarantees that rollouts never overlap token writers.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-chatgpt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-chatgpt
    spec:
      serviceAccountName: litellm
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      initContainers:
        # The seed is only disaster-recovery bootstrap material. LiteLLM rotates
        # the live token on the PVC, so never overwrite an existing auth file.
        - name: seed-chatgpt-auth
          image: litellm/litellm:1.90.2
          command:
            - sh
            - -c
            - test -f /data/chatgpt/auth.json || cp /seed/auth.json /data/chatgpt/auth.json
          volumeMounts:
            - name: chatgpt-auth
              mountPath: /data/chatgpt
            - name: chatgpt-auth-seed
              mountPath: /seed
              readOnly: true
      # The seaweedfs-ovh PVC can only mount on OVH nodes.
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      containers:
        - name: litellm
          image: litellm/litellm:1.90.2
          args: ["--config", "/etc/litellm/config.yaml"]
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4000"
            # Reusing the main master key adds no privilege to the main proxy and
            # avoids a second secret lifecycle solely for this private hop.
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: api-key
            - name: CHATGPT_TOKEN_DIR
              value: /data/chatgpt
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: chatgpt-auth
              mountPath: /data/chatgpt
      volumes:
        - name: config
          configMap:
            name: litellm-chatgpt-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: chatgpt-auth
          persistentVolumeClaim:
            claimName: litellm-chatgpt-auth
        - name: chatgpt-auth-seed
          secret:
            secretName: litellm-chatgpt-auth-seed
