spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-forgejo-images-secret-store
    kind: ClusterSecretStore
  target:
    name: forgejo-images-creds
    template:
      type: kubernetes.io/dockerconfigjson
      mergePolicy: Merge
  dataFrom:
    - extract:
        key: forgejo-images-creds
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: litellm
  name: litellm
  namespace: litellm
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: litellm
automountServiceAccountToken: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: litellm
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - litellm.allegedly.works
  rules:
    - timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: litellm
          port: 4000
