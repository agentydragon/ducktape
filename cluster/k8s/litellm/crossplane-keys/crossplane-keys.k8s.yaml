apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane-provider-credentials-reader
  namespace: litellm
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-crossplane-provider-credentials-reader
  namespace: litellm
rules:
  - apiGroups:
      - ""
    resourceNames:
      - litellm-master-key
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-crossplane-provider-credentials-reader
  namespace: litellm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: litellm-crossplane-provider-credentials-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: crossplane-provider-credentials-reader
    namespace: litellm
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-litellm-crossplane-provider-credentials-secret-store
spec:
  conditions:
    - namespaces:
        - litellm
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: crossplane-provider-credentials-reader
      remoteNamespace: litellm
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-crossplane-provider-credentials
  namespace: litellm
spec:
  data:
    - remoteRef:
        key: litellm-master-key
        property: api-key
      secretKey: api_key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-litellm-crossplane-provider-credentials-secret-store
  target:
    creationPolicy: Owner
    name: litellm-crossplane-provider-credentials
    template:
      data:
        credentials: '{"api_base":"http://litellm.litellm.svc.cluster.local:4000","api_key":"{{ .api_key }}"}'
      type: Opaque
---
apiVersion: litellm.m.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: litellm
spec:
  credentials:
    secretRef:
      key: credentials
      name: litellm-crossplane-provider-credentials
      namespace: litellm
    source: Secret
---
apiVersion: litellm.m.crossplane.io/v1alpha1
kind: Team
metadata:
  name: team-codex-clients
  namespace: litellm
spec:
  forProvider:
    routerSettings:
      fallbacks:
        - fallbackModels:
            - chatgpt-sub/ant-messages/gpt-6-luna
          model: "*"
    teamAlias: codex-clients
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: litellm.m.crossplane.io/v1alpha1
kind: Team
metadata:
  name: team-gemini-clients
  namespace: litellm
spec:
  forProvider:
    routerSettings:
      fallbacks:
        - fallbackModels:
            - google/goog-generate/gemini-3.5-flash-lite
          model: "*"
    teamAlias: gemini-clients
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: litellm.m.crossplane.io/v1alpha1
kind: Team
metadata:
  name: team-antigravity-clients
  namespace: litellm
spec:
  forProvider:
    routerSettings:
      fallbacks:
        - fallbackModels: []
          model: "*"
    teamAlias: antigravity-clients
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
