apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-db
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/litellm/db
  prune: true
  wait: true
  dependsOn:
    - name: litellm-namespace
    - name: cnpg
    - name: local-path-provisioner
