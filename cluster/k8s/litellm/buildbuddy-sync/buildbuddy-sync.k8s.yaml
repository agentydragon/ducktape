apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: litellm-buildbuddy-sync
  namespace: flux-system
spec:
  approvePlan: auto
  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "litellm_buildbuddy_sync"
      }
  interval: 15m
  path: ./tf/gitops/litellm-buildbuddy-sync
  refreshBeforeApply: true
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: tofu-state-db-credentials
        - name: TF_VAR_buildbuddy_api_key
          valueFrom:
            secretKeyRef:
              key: api-key
              name: buildbuddy-org-admin-api-key
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
  serviceAccountName: tf-runner
  sourceRef:
    kind: ExternalArtifact
    name: tf-gitops-litellm-buildbuddy-sync
    namespace: ducktape-flux
