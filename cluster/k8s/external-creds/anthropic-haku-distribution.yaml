# Anthropic Haku credential distribution. The source Role and target SecretStores
# limit each consumer to the one source Secret it needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-anthropic-haku-reader
  namespace: litellm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-anthropic-haku-reader
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-anthropic-haku-reader
  namespace: ducktape-flux
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["llm-anthropic-haku"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-anthropic-haku-litellm-reader
  namespace: ducktape-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llm-anthropic-haku-reader
subjects:
  - kind: ServiceAccount
    name: llm-anthropic-haku-reader
    namespace: litellm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-anthropic-haku-flux-reader
  namespace: ducktape-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llm-anthropic-haku-reader
subjects:
  - kind: ServiceAccount
    name: llm-anthropic-haku-reader
    namespace: flux-system
---
# These target-local stores are capabilities: their authenticated ServiceAccount
# can read only the matching source Secret in ducktape-flux.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: llm-anthropic-haku
  namespace: litellm
spec:
  provider:
    kubernetes:
      server:
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt }
      auth:
        serviceAccount: { name: llm-anthropic-haku-reader, namespace: litellm }
      remoteNamespace: ducktape-flux
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: llm-anthropic-haku
  namespace: flux-system
spec:
  provider:
    kubernetes:
      server:
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt }
      auth:
        serviceAccount: { name: llm-anthropic-haku-reader, namespace: flux-system }
      remoteNamespace: ducktape-flux
