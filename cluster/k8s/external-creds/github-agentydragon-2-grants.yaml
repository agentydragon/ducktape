# Source-controlled grants for the replacement agentydragon GitHub PAT. Each
# binding explicitly approves one consumer ServiceAccount. Consumer-local
# identities live with consumers; external-secrets-config owns the store.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-agentydragon-2-reader
  namespace: ducktape-flux
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["github-agentydragon-2"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-agentydragon-2-flux-system-reader
  namespace: ducktape-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-agentydragon-2-reader
subjects:
  - kind: ServiceAccount
    name: external-creds-reader
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-agentydragon-2-agents-infra-reader
  namespace: ducktape-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-agentydragon-2-reader
subjects:
  - kind: ServiceAccount
    name: external-creds-reader
    namespace: agents-infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-agentydragon-2-nix-cache-reader
  namespace: ducktape-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-agentydragon-2-reader
subjects:
  - kind: ServiceAccount
    name: external-creds-reader
    namespace: nix-cache
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-agentydragon-2-monitoring-reader
  namespace: ducktape-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-agentydragon-2-reader
subjects:
  - kind: ServiceAccount
    name: external-creds-reader
    namespace: monitoring
