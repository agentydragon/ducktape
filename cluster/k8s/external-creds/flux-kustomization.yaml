apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-creds
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: claude-rbac
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/external-creds
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: external-creds
    namespace: ducktape-flux
  timeout: 5m
