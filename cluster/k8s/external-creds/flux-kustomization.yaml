apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-creds
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/external-creds
  # CLEANUP(added 2026-08-30): Restore pruning after consumer ServiceAccounts
  # and SecretStores have moved to, and are inventoried by, their consumer
  # Kustomizations.
  prune: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: claude-rbac
  timeout: 5m
