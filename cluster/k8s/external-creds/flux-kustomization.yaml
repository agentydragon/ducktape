apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-creds
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/external-creds
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: claude-rbac
    - name: litellm-namespace
    - name: public-coder-agent-namespace
    - name: haku-egress-proxy-namespace
    - name: haku-console-namespace
    - name: external-secrets-operator
  timeout: 5m
