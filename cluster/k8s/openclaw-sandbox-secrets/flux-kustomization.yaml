apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw-sandbox-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/openclaw-sandbox-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  dependsOn:
    - name: openclaw-sandbox
    - name: external-secrets-config
    - name: ollama-secrets
