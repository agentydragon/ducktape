---
# ExternalSecret pulling all SSO client secrets from Vault into a single K8s Secret.
# Mounted as envFrom on Authentik worker+server so blueprints can use !Env tags.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-sso-client-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: authentik-sso-client-secrets
    creationPolicy: Owner
  data:
    - secretKey: GITEA_CLIENT_SECRET
      remoteRef:
        key: sso/gitea
        property: client_secret
    - secretKey: GRAFANA_CLIENT_SECRET
      remoteRef:
        key: sso/grafana
        property: client_secret
    - secretKey: HARBOR_CLIENT_SECRET
      remoteRef:
        key: sso/harbor
        property: client_secret
    - secretKey: MATRIX_CLIENT_SECRET
      remoteRef:
        key: sso/matrix
        property: client_secret
    - secretKey: VAULT_CLIENT_SECRET
      remoteRef:
        key: sso/vault
        property: client_secret
    - secretKey: INVENTREE_CLIENT_SECRET
      remoteRef:
        key: sso/inventree
        property: client_secret
    - secretKey: HEADSCALE_CLIENT_SECRET
      remoteRef:
        key: sso/headscale
        property: client_secret
    - secretKey: HEADLAMP_CLIENT_SECRET
      remoteRef:
        key: sso/headlamp
        property: client_secret
    - secretKey: GATUS_CLIENT_SECRET
      remoteRef:
        key: sso/gatus
        property: client_secret
    - secretKey: OPENCLAW_AGENT_CLIENT_SECRET
      remoteRef:
        key: sso/openclaw-agent
        property: client_secret
    - secretKey: USER_PASSWORD
      remoteRef:
        key: kv/users/agentydragon
        property: user_password
