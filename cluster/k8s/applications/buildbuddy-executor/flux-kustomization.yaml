apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: buildbuddy-executor
  namespace: flux-system
spec:
  # Suspended: GPU worker node was running out of RAM (3×4Gi executor pods prevented
  # ollama from scheduling). Re-enable when node has more memory headroom.
  suspend: true
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/applications/buildbuddy-executor"
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: buildbuddy-executor
      namespace: buildbuddy-executor
  dependsOn:
    - name: sealed-secrets
