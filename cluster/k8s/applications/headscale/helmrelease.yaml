---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: wrenix
  namespace: headscale
spec:
  type: oci
  url: oci://codeberg.org/wrenix/helm-charts
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headscale
  namespace: headscale
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  valuesFrom:
    # Injects headscale.config.oidc.client_secret from Vault (via ExternalSecret).
    # client_secret is kept out of ConfigMaps by merging it here at deploy time.
    - kind: Secret
      name: headscale-oidc-client-secret
      valuesKey: values.yaml
    # Injects headscale.config.database.postgres.password from CNPG-generated secret
    # (via ESO ExternalSecret headscale-db-values in headscale-secrets kustomization).
    - kind: Secret
      name: headscale-db-values
      valuesKey: values.yaml
  chart:
    spec:
      chart: headscale
      version: "1.0.14"
      sourceRef:
        kind: HelmRepository
        name: wrenix
        namespace: headscale
  values:
    headscale:
      certmanager:
        enabled: false # TLS terminated at Gateway
      config:
        server_url: https://headscale.allegedly.works
        # TLS terminated at ingress
        tls_cert_path: ""
        tls_key_path: ""
        # DNS
        dns:
          magic_dns: true
          base_domain: tailnet.allegedly.works
          nameservers:
            global:
              - 1.1.1.1
              - 8.8.8.8
        # Logging
        log:
          format: text
          level: info
        # OIDC authentication via Authentik — client_secret injected via valuesFrom
        oidc:
          only_start_if_oidc_is_available: true
          issuer: "https://auth.allegedly.works/application/o/headscale/"
          client_id: "headscale"
          scope: ["openid", "profile", "email"]
          expiry: "180d"
          use_expiry_from_token: false
          pkce:
            enabled: true
            method: S256

    # PostgreSQL database config injected via valuesFrom (headscale-db-values secret).
    # persistence disabled — database is external CNPG; keys stored in headscale-keys Secret.
    persistence:
      enabled: false

    service:
      type: ClusterIP
      derp:
        type: NodePort
        port: 3478

    # Ingress disabled — traffic routed via Gateway API HTTPRoute
    ingress:
      enabled: false
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: "${LETSENCRYPT_ISSUER}"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        external-dns.alpha.kubernetes.io/hostname: headscale.allegedly.works
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
        nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
      hosts:
        - host: headscale.allegedly.works
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: headscale-tls
          hosts:
            - headscale.allegedly.works

    nodeSelector:
      topology.kubernetes.io/region: hetzner
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
