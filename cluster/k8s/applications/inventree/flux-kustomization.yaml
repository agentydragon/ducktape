apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inventree
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/applications/inventree"
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: inventree
      namespace: inventree
  dependsOn:
    - name: inventree-namespace
    - name: inventree-secrets
    - name: authentik-blueprint-inventree-secret
    - name: gateway
    - name: external-dns
    - name: authentik
