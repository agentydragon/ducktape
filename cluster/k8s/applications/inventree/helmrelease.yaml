---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: inventree-charts
  namespace: inventree
spec:
  interval: 24h
  url: https://inventree.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: inventree
  namespace: inventree
spec:
  interval: 15m
  timeout: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: inventree
      version: "0.4.1"
      sourceRef:
        kind: HelmRepository
        name: inventree-charts
        namespace: inventree

  values:
    image:
      repository: registry.allegedly.works/inventree/inventree
      tag: latest
      pullPolicy: Always

    imagePullSecrets:
      - name: harbor-ci-robot

    global:
      siteUrl: "https://inventree.allegedly.works"

      adminSecret: "inventree-admin-password"

      dbSecrets:
        - name: INVENTREE_DB_ENGINE
          value: "postgresql"
        - name: INVENTREE_DB_NAME
          value: "inventree"
        - name: INVENTREE_DB_USER
          value: "inventree"
        - name: INVENTREE_DB_HOST
          value: "inventree-postgres"
        - name: INVENTREE_DB_PORT
          value: "5432"
        - name: INVENTREE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: inventree-db-password
              key: db_password

      ssoConfig:
        backends:
          - "allauth.socialaccount.providers.openid_connect"
        providerSecretName: "inventree-sso-providers"

    plugins:
      enabled: true

    # Auto-enable rai_plugin without requiring a UI toggle.
    # INVENTREE_PLUGINS_MANDATORY makes the plugin always active (like builtin mandatory plugins).
    env:
      INVENTREE_PLUGINS_MANDATORY: "raiplugin"

    # Pin server to Proxmox nodes (PVE)
    nodeSelector:
      topology.kubernetes.io/region: proxmox

    # Pin worker to Proxmox nodes (PVE)
    worker:
      nodeSelector:
        topology.kubernetes.io/region: proxmox

    # Ingress entry populates nginx server_name and INVENTREE_TRUSTED_ORIGINS
    # in the chart templates. The Ingress resource itself is unused (no
    # IngressClass controller) — traffic is routed via Gateway API HTTPRoute.
    ingress:
      main:
        enabled: true
        hosts:
          - host: inventree.allegedly.works
            paths:
              - path: /
                pathType: Prefix

    service:
      type: ClusterIP
      port: 8000
