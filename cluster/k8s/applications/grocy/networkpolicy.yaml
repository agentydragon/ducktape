# Restrict Grocy ingress to the Authentik shared proxy outpost only.
# Grocy trusts X-authentik-username for user identity — any pod that
# can reach port 80 can impersonate any user.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grocy-ingress
  namespace: grocy
spec:
  podSelector:
    matchLabels:
      app: grocy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              goauthentik.io/outpost-name: shared-proxy-outpost
      ports:
        - port: 80
          protocol: TCP
