---
# Harbor CI robot credentials for imagePullSecrets in the inventree namespace.
# Same robot account as other namespaces — K8s secrets are namespace-scoped.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-ci-robot
  namespace: inventree
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-ci-robot
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"registry.allegedly.works":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: kv/harbor/ci-robot
        property: username
    - secretKey: password
      remoteRef:
        key: kv/harbor/ci-robot
        property: password
