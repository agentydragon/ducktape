---
# InvenTree admin credentials — password generated by inventree-admin Terraform module
# and stored at kv/inventree/admin in Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventree-admin-password
  namespace: inventree
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: inventree-admin-password
    creationPolicy: Owner
    template:
      data:
        INVENTREE_ADMIN_USER: admin
        INVENTREE_ADMIN_PASSWORD: "{{ .admin_password }}"
        INVENTREE_ADMIN_EMAIL: "admin@allegedly.works"
  data:
    - secretKey: admin_password
      remoteRef:
        key: inventree/admin
        property: admin_password
