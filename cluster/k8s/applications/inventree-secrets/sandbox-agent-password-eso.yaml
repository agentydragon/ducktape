---
# InvenTree sandbox-agent password — provisioned by inventree-tokens Terraform module
# and stored at kv/inventree/sandbox-agent in Vault.
# Shared by openclaw-sandbox and claude-sandbox via the inventree-token-provisioner Job.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventree-sandbox-agent-password
  namespace: inventree
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: inventree-sandbox-agent-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: inventree/sandbox-agent
        property: password
