apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inventree-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/applications/inventree-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: inventree-admin
      namespace: flux-system
  dependsOn:
    - name: inventree-namespace
    - name: external-secrets-config
    - name: tofu-controller
    - name: vault-token
