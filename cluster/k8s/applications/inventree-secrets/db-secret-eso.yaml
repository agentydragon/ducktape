---
# InvenTree database credentials — password generated by inventree-admin Terraform module
# and stored at kv/inventree/db in Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventree-db-password
  namespace: inventree
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: inventree-db-password
    creationPolicy: Owner
    template:
      data:
        db_password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: inventree/db
        property: db_password
