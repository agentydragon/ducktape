---
# Creates the InvenTree sandbox-agent user via Django ORM and writes its API token
# to the inventree namespace. Reflector mirrors the Secret to openclaw-sandbox and
# claude-sandbox automatically via the annotation-based reflection policy.
# Script body lives in provision.sh (ConfigMap generated by kustomization.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: inventree-token-provisioner
  namespace: inventree
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: inventree-token-provisioner
    spec:
      restartPolicy: OnFailure
      serviceAccountName: inventree-token-provisioner
      containers:
        - name: provisioner
          image: bitnami/kubectl:latest
          command: ["/bin/bash", "/scripts/provision.sh"]
          env:
            - name: SANDBOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventree-sandbox-agent-password
                  key: password
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: inventree-token-provisioner-script
