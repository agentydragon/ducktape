apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventree-token-provisioner
  namespace: inventree
---
# Allows the provisioner Job to:
#   - find running InvenTree pods and exec into them (to create the user via Django ORM)
#   - write the resulting inventree-api-token Secret to the inventree namespace
#     (Reflector then mirrors it to openclaw-sandbox and claude-sandbox)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inventree-token-provisioner
  namespace: inventree
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inventree-token-provisioner
  namespace: inventree
subjects:
  - kind: ServiceAccount
    name: inventree-token-provisioner
    namespace: inventree
roleRef:
  kind: Role
  name: inventree-token-provisioner
  apiGroup: rbac.authorization.k8s.io
