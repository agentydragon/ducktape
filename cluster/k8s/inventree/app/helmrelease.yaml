---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: inventree-charts
  namespace: inventree
spec:
  interval: 24h
  url: https://inventree.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: inventree
  namespace: inventree
spec:
  interval: 15m
  timeout: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: inventree
      version: "0.4.3"
      sourceRef:
        kind: HelmRepository
        name: inventree-charts
        namespace: inventree

  values:
    image:
      repository: registry.allegedly.works/ducktape/inventree
      tag: latest
      pullPolicy: Always

    imagePullSecrets:
      - name: harbor-pull-robot

    global:
      siteUrl: "https://inventree.allegedly.works"

      adminSecret: "inventree-admin-password"

      dbSecrets:
        - name: INVENTREE_DB_ENGINE
          value: "postgresql"
        - name: INVENTREE_DB_NAME
          value: "inventree"
        - name: INVENTREE_DB_USER
          value: "inventree"
        - name: INVENTREE_DB_HOST
          value: "inventree-db-rw"
        - name: INVENTREE_DB_PORT
          value: "5432"
        - name: INVENTREE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: inventree-db-app
              key: password

      ssoConfig:
        backends:
          - "allauth.socialaccount.providers.openid_connect"
        providerSecretName: "inventree-sso-providers"

    plugins:
      enabled: true

    env:
      # Auto-enable rai_plugin (always active, like builtin mandatory plugins)
      INVENTREE_PLUGINS_MANDATORY: "raiplugin"
      # SSO settings: global_settings_overrides makes these read-only in UI
      INVENTREE_GLOBAL_SETTINGS: '{"LOGIN_ENABLE_SSO": true, "LOGIN_ENABLE_SSO_REG": true}'
      # Trust X-Forwarded-Proto from Gateway (TLS terminates at Envoy)
      INVENTREE_USE_X_FORWARDED_PROTO: "true"
      # Console email backend — no SMTP server needed. Unblocks SSO user
      # registration which requires is_email_configured()==True.
      INVENTREE_EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"

    # Pin server to Proxmox nodes (PVE)
    nodeSelector:
      topology.kubernetes.io/region: proxmox

    # Pin worker to Proxmox nodes (PVE)
    worker:
      nodeSelector:
        topology.kubernetes.io/region: proxmox

    # Ingress entry populates INVENTREE_TRUSTED_ORIGINS in chart templates.
    # The Ingress resource itself is unused (no IngressClass controller) —
    # traffic is routed via Gateway API HTTPRoute directly to gunicorn.
    # The tls field makes the chart generate https:// in TRUSTED_ORIGINS.
    ingress:
      main:
        enabled: true
        hosts:
          - host: inventree.allegedly.works
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - inventree.allegedly.works

    service:
      type: ClusterIP
      port: 8000
