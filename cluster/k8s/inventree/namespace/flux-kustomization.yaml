apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inventree-namespace
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  suspend: true
  interval: 1h
  path: ./cluster/k8s/inventree/namespace
  prune: false
  sourceRef:
    kind: ExternalArtifact
    name: inventree-namespace
    namespace: ducktape-flux
  timeout: 1m
