apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inventree-token-provisioner
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  suspend: true
  interval: 10m
  path: ./cluster/k8s/inventree/token-provisioner
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  # Explicitly health-check the InvenTree HelmRelease so the Job starts only after
  # InvenTree pods are ready (HelmRelease wait:true guarantees this).
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: inventree
      namespace: inventree
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: inventree # InvenTree HelmRelease is fully deployed
    - name: inventree-secrets # SOPS-managed sandbox-agent password
    - name: claude-rbac
      namespace: ducktape-flux # claude-sandbox namespace exists
