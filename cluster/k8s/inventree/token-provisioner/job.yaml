# Fetches the InvenTree admin API token and writes it to the inventree namespace.
# An ESO ClusterExternalSecret (token-eso.yaml) mirrors the Secret to claude-sandbox
# and claude-sandbox.
# Script is baked into the InvenTree token-provisioner image via Bazel.
apiVersion: batch/v1
kind: Job
metadata:
  name: inventree-token-provisioner
  namespace: inventree
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: inventree-token-provisioner
    spec:
      restartPolicy: OnFailure
      serviceAccountName: inventree-token-provisioner
      containers:
        - name: provisioner
          image: ghcr.io/agentydragon/inventree-token-provisioner:devel-20260717000419-6162a72 # {"$imagepolicy": "flux-system:token-provisioner"}
          imagePullPolicy: Always
          env:
            - name: INVENTREE_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: inventree-admin-password
                  key: INVENTREE_ADMIN_USER
            - name: INVENTREE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventree-admin-password
                  key: INVENTREE_ADMIN_PASSWORD
