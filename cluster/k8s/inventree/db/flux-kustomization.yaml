apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inventree-db
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  suspend: true
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: ExternalArtifact
    name: inventree-db
    namespace: ducktape-flux
  path: ./cluster/k8s/inventree/db
  prune: true
  wait: true
  dependsOn:
    - name: inventree-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
