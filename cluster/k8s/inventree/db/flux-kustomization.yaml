apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inventree-db
  namespace: flux-system
spec:
  retryInterval: 1m
  suspend: true
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/inventree/db
  prune: true
  wait: true
  dependsOn:
    - name: inventree-namespace
    - name: cnpg
    - name: proxmox-csi
