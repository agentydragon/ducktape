apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: inventree-db
  namespace: inventree
spec:
  instances: 1

  probes:
    liveness:
      isolationCheck:
        enabled: false

  storage:
    storageClass: local-path
    size: 5Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: inventree
      owner: inventree
      # CNPG auto-generates credentials in secret inventree-db-app
