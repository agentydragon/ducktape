apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-bench-cephfs
  namespace: forgejo-ceph-bench
spec:
  accessModes: [ReadWriteMany]
  storageClassName: rook-cephfs-trial
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-bench-seaweedfs
  namespace: forgejo-ceph-bench
spec:
  accessModes: [ReadWriteMany]
  storageClassName: seaweedfs-ovh-ssd
  resources:
    requests:
      storage: 10Gi
