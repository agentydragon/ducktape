apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rook-ceph-trial-loop-device
  namespace: rook-ceph
  annotations:
    description: Creates one disposable 50 GiB loop-backed OSD device on each OVH HDD node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rook-ceph-trial-loop-device
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rook-ceph-trial-loop-device
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
        storage.allegedly.works/tier: hdd
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: loop-device
          image: quay.io/ceph/ceph:v20.2.2-20260616
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            seccompProfile:
              type: Unconfined
          command: [/bin/bash, -ceu]
          args:
            - |
              backing=/host-data/rook-ceph-trial/osd.img
              link=/dev/rook-ceph-trial-osd
              mkdir -p "$(dirname "$backing")"
              if [[ ! -f "$backing" ]]; then
                fallocate -l 50G "$backing"
              fi
              device="$(losetup -j "$backing" | head -n1 | cut -d: -f1)"
              if [[ -z "$device" ]]; then
                device="$(losetup --find --show --direct-io=on "$backing")"
              fi
              ln -sfn "$device" "$link"
              test -b "$link"
              echo "ready: $link -> $device ($backing)"
              exec sleep infinity
          readinessProbe:
            exec:
              command: [/bin/bash, -ceu, "test -b /dev/rook-ceph-trial-osd"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: host-dev
              mountPath: /dev
            - name: host-data
              mountPath: /host-data
      volumes:
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: host-data
          hostPath:
            path: /var/mnt/local-path-ovh-hdd
            type: Directory
---
