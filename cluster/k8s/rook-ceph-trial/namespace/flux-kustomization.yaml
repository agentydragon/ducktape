apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-trial-namespace
  namespace: flux-system
spec:
  suspend: true # rook-ceph storage trial complete (2026-07-17); winding down, see debug/git_storage_latency_and_ha.md
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/rook-ceph-trial/namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
