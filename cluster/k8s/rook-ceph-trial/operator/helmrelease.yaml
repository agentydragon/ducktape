apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rook-release
  namespace: rook-ceph
spec:
  interval: 24h
  url: https://charts.rook.io/release
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 30m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: rook-ceph
      version: "1.19.6"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: rook-ceph
  values:
    crds:
      enabled: true
    allowLoopDevices: true
    currentNamespaceOnly: true
    priorityClassName: system-cluster-critical
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        memory: 512Mi
    csi:
      rookUseCsiOperator: true
      enableRbdDriver: false
      enableCephfsDriver: true
      disableCsiDriver: "false"
      enableCSIHostNetwork: false
      enableCephfsSnapshotter: false
      enableRBDSnapshotter: false
      enableNFSSnapshotter: false
      enableVolumeGroupSnapshot: false
      provisionerReplicas: 2
      cephFSPluginUpdateStrategy: RollingUpdate
      cephFSPluginUpdateStrategyMaxUnavailable: 1
