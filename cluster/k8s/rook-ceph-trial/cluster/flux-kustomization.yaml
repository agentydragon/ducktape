apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-trial-cluster
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  path: ./cluster/k8s/rook-ceph-trial/cluster
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: rook-ceph-trial-loop-devices
    - name: rook-ceph-trial-operator
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
