apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-trial-filesystem
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./cluster/k8s/rook-ceph-trial/filesystem
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: rook-ceph-trial-cluster
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephFilesystem
      name: trialfs-ssd
      namespace: rook-ceph
