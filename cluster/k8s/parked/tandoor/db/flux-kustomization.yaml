apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tandoor-db
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  dependsOn:
    - name: tandoor-namespace
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/parked/tandoor/db
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: tandoor-db
    namespace: ducktape-flux
  suspend: true
  timeout: 5m
  wait: true
