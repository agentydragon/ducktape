apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    ducktape.org/parked: "true"
  name: inventree
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: forgejo-images
      namespace: ducktape-flux
    - name: inventree-namespace
      namespace: ducktape-flux
    - name: inventree-db
      namespace: ducktape-flux
    - name: sso-providers-tf
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: authentik
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: inventree
      namespace: inventree
  interval: 10m
  path: ./cluster/k8s/parked/inventree/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: inventree-app
    namespace: ducktape-flux
  suspend: true
  timeout: 10m
  wait: true
