apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    ducktape.org/parked: "true"
  name: inventree-namespace
  namespace: ducktape-flux
spec:
  interval: 1h
  path: ./cluster/k8s/parked/inventree/namespace
  prune: false
  sourceRef:
    kind: ExternalArtifact
    name: inventree-namespace
    namespace: ducktape-flux
  suspend: true
  timeout: 1m
