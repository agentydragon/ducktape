apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: buildbuddy-executor
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: buildbuddy-executor
      namespace: buildbuddy-executor
  interval: 10m
  path: ./cluster/k8s/parked/buildbuddy-executor
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  suspend: true
  timeout: 5m
  wait: true
