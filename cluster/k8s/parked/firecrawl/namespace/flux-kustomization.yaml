apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: firecrawl-namespace
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  interval: 1h
  path: ./cluster/k8s/parked/firecrawl/namespace
  prune: false
  sourceRef:
    kind: ExternalArtifact
    name: firecrawl-namespace
    namespace: ducktape-flux
  suspend: true
  timeout: 1m
