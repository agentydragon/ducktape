apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    ducktape.org/parked: "true"
  name: firecrawl-db
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: firecrawl-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/parked/firecrawl/db
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: firecrawl-db
    namespace: ducktape-flux
  suspend: true
  timeout: 10m
  wait: true
