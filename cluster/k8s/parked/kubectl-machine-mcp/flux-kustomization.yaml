apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubectl-machine-mcp
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  dependsOn:
    - name: gateway
      namespace: ducktape-flux
    - name: agent-machine-access-tf
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kubectl-machine-mcp
      namespace: kubectl-machine-mcp
  interval: 10m
  path: ./cluster/k8s/parked/kubectl-machine-mcp
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: kubectl-machine-mcp
    namespace: ducktape-flux
  suspend: true
  timeout: 5m
  wait: true
