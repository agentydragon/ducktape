apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authelia
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/parked/authelia/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: authelia-app
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: authelia
      namespace: authelia
  timeout: 5m
  dependsOn:
    - name: gateway
      namespace: ducktape-flux
    - name: cert-manager-environment
      namespace: ducktape-flux
