apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: browsertrix-retained
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  interval: 10m
  path: ./cluster/k8s/parked/browsertrix/retained
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: browsertrix-retained
    namespace: ducktape-flux
  suspend: true
  timeout: 5m
