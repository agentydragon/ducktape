kind: Secret
metadata:
    name: s3-identity-browsertrix
    namespace: seaweedfs
    labels:
        seaweedfs.io/role: s3-identity
    annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: browsertrix
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: browsertrix
type: Opaque
stringData:
