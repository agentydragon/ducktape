apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: browsertrix-namespace
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  suspend: true
  interval: 10m
  retryInterval: 1m
  timeout: 1m
  path: ./cluster/k8s/parked/browsertrix/namespace
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: browsertrix-namespace
    namespace: ducktape-flux
