apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    ducktape.org/parked: "true"
  name: browsertrix
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: browsertrix-namespace
      namespace: ducktape-flux
    - name: seaweedfs-browsertrix-bucket
      namespace: ducktape-flux
    - name: seaweedfs-secrets
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
    - name: seaweedfs-csi
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: browsertrix
      namespace: browsertrix
  interval: 10m
  path: ./cluster/k8s/parked/browsertrix/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: browsertrix-app
    namespace: ducktape-flux
  suspend: true
  timeout: 25m
  wait: true
