apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    ducktape.org/parked: "true"
  name: budget
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: budget-ledger
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: authentik
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/parked/budget
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: budget
    namespace: ducktape-flux
  suspend: true
  timeout: 5m
  wait: true
