apiVersion: v1
kind: ConfigMap
metadata:
  name: openhands-config-toml
  namespace: openhands
data:
  config.toml: |
    [core]
    runtime = "kubernetes"

    [sandbox]
    # Use the same image for sandbox pods so agent code is available.
    runtime_container_image = "ghcr.io/all-hands-ai/openhands:main"

    [kubernetes]
    namespace = "openhands-sandboxes"
    ingress_domain = "allegedly.works"
    pvc_storage_size = "5Gi"
    pvc_storage_class = "local-path-proxmox"
    resource_cpu_request = "500m"
    resource_memory_request = "1Gi"
    resource_memory_limit = "4Gi"
    node_selector_key = "kubernetes.io/hostname"
    node_selector_val = "wyrm2"
