apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    ducktape.org/parked: "true"
  name: openhands
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: openhands-namespace
      namespace: ducktape-flux
    - name: openhands-sandboxes
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: authentik
      namespace: ducktape-flux
    - name: external-secrets-operator
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/parked/openhands/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: openhands-app
    namespace: ducktape-flux
  suspend: true
  timeout: 5m
  wait: true
