apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    ducktape.org/parked: "true"
  name: openhands-sandboxes
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/parked/openhands/sandboxes
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: openhands-sandboxes
    namespace: ducktape-flux
  suspend: true
