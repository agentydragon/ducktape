apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openhands-namespace
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  suspend: true
  interval: 10m
  path: ./cluster/k8s/parked/openhands/namespace
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: openhands-namespace
    namespace: ducktape-flux
  timeout: 2m
