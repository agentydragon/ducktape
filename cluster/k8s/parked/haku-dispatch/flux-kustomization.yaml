apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    ducktape.org/parked: "true"
  name: haku-dispatch
  namespace: ducktape-flux
spec:
  deletionPolicy: WaitForTermination
  dependsOn:
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: external-secrets-operator
      namespace: ducktape-flux
    - name: litellm
      namespace: ducktape-flux
    - name: litellm-keys-tf
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: workers-litellm
      namespace: haku-dispatch
    - apiVersion: apps/v1
      kind: Deployment
      name: dispatcher
      namespace: haku-dispatch
  interval: 10m
  path: ./haku/x/dispatch/deploy
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  suspend: true
  timeout: 10m
  wait: true
