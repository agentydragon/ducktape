apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    ducktape.org/parked: "true"
  name: augur-evidence
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: forgejo
      namespace: ducktape-flux
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
    - name: budget-namespace
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: augur-evidence
      namespace: flux-system
  interval: 10m
  path: ./cluster/k8s/parked/augur-evidence
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: augur-evidence
    namespace: ducktape-flux
  suspend: true
  timeout: 10m
  wait: true
