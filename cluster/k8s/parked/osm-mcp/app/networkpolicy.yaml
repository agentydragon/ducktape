apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: osm-mcp-ingress
  namespace: osm-mcp
  annotations:
    description: "Default-deny ingress for osm-mcp. Unlike every other MCP deployment in this cluster, there is no Gateway HTTPRoute and no Authentik OAuth fronting it — osmmcp holds no secret and serves no PII (public OSM data only), so the only gate is this NetworkPolicy: reachable exclusively from haku-console's namespace."
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: osm-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
      toPorts:
        - ports:
            - port: "7082"
              protocol: TCP
