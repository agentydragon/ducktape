apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: osm-mcp
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: osm-mcp
    namespace: ducktape-flux
  path: ./cluster/k8s/parked/osm-mcp
  prune: true
  wait: true
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: osm-mcp
    - apiVersion: apps/v1
      kind: Deployment
      name: osm-mcp
      namespace: osm-mcp
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    # forgejo-images-creds-eso.yaml extracts the source Secret from the
    # forgejo-images namespace, so it must exist first.
    - name: forgejo-images
      namespace: ducktape-flux
