apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-workspace
  namespace: codex-pod
  annotations:
    description: "Persistent /workspace (work tree + codex state) for the codex pod. HOME is baked into the image, so this is only the work dir."
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: seaweedfs-ovh
  resources:
    requests:
      storage: 80Gi
