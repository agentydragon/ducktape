apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postscanmail-mcp
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: postscanmail-mcp
    namespace: ducktape-flux
  path: ./cluster/k8s/parked/postscanmail-mcp
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: postscanmail-mcp
      namespace: postscanmail-mcp
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: valkey
      namespace: ducktape-flux
    - name: agent-machine-access-tf
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: monitoring-crds # the ServiceMonitor CRD
      namespace: ducktape-flux
