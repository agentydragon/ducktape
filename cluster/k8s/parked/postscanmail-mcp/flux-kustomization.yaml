apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    ducktape.org/parked: "true"
  name: postscanmail-mcp
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: valkey
      namespace: ducktape-flux
    - name: agent-machine-access-tf
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: postscanmail-mcp
      namespace: postscanmail-mcp
  interval: 10m
  path: ./cluster/k8s/parked/postscanmail-mcp
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: postscanmail-mcp
    namespace: ducktape-flux
  suspend: true
  timeout: 5m
  wait: true
