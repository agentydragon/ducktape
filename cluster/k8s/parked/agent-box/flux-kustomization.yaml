apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-box
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: kubevirt
      namespace: ducktape-flux
    - name: cdi
      namespace: ducktape-flux
    - name: external-secrets-operator
      namespace: ducktape-flux
    - name: seaweedfs-public-s3
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: agent-box
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: agent-box-vm-images-s3-reader
      namespace: agent-box
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      name: agent-box-root
      namespace: agent-box
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      name: agent-box
      namespace: agent-box
  interval: 10m
  path: ./cluster/k8s/parked/agent-box
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: agent-box
    namespace: ducktape-flux
  suspend: true
  timeout: 30m
  wait: true
