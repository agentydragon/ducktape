apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-box-namespace
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  # The retired VM stack and its namespace were intentionally deleted.
  # Keep this controller paused so Flux does not recreate the empty namespace.
  suspend: true
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  path: ./cluster/k8s/parked/agent-box/namespace
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: agent-box-namespace

    namespace: ducktape-flux
  wait: true
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: agent-box
