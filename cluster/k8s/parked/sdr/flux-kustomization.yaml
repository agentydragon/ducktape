apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sdr
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: authentik
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/parked/sdr
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: sdr
    namespace: ducktape-flux
  suspend: true
  timeout: 5m
  wait: true
