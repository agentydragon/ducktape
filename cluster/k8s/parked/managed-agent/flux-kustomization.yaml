apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-managed-agent
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: forgejo-images
      namespace: ducktape-flux
    - name: agent-shared-secrets
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: haku-namespace
      namespace: ducktape-flux
    - name: haku-rbac
      namespace: ducktape-flux
    - name: haku-state
      namespace: ducktape-flux
    - name: haku-egress-proxy
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: haku-managed-agent
      namespace: haku-sandbox
  interval: 10m
  path: ./cluster/k8s/parked/managed-agent
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: haku-managed-agent
    namespace: ducktape-flux
  suspend: true
  timeout: 5m
  wait: true
