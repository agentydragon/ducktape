apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-namespace
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  interval: 10m
  path: ./cluster/k8s/parked/paperless/namespace
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: paperless-namespace
    namespace: ducktape-flux
  suspend: true
