apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    ducktape.org/parked: "true"
  name: gecko
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: gecko-namespace
      namespace: ducktape-flux
    - name: kubevirt
      namespace: ducktape-flux
    - name: cdi
      namespace: ducktape-flux
    - name: external-secrets-operator
      namespace: ducktape-flux
    - name: seaweedfs-public-s3
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: gecko-vm-images-s3-reader
      namespace: gecko
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      name: gecko-root
      namespace: gecko
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      name: gecko
      namespace: gecko
  interval: 10m
  path: ./cluster/k8s/parked/gecko/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: gecko
    namespace: ducktape-flux
  suspend: true
  timeout: 30m
  wait: true
