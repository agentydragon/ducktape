apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gecko-namespace
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: gecko
  interval: 10m
  path: ./cluster/k8s/parked/gecko/namespace
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: gecko-namespace
    namespace: ducktape-flux
  suspend: true
  timeout: 2m
  wait: true
