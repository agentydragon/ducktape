apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: docker-ci
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  dependsOn:
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: claude-rbac
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: docker-ci
      namespace: docker-ci
  interval: 10m
  path: ./cluster/k8s/parked/docker-ci
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: docker-ci
    namespace: ducktape-flux
  suspend: true
  timeout: 5m
  wait: true
