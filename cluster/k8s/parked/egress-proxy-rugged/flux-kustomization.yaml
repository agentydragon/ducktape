apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: egress-proxy-rugged
  namespace: ducktape-flux
  annotations:
    ducktape.org/parked: "true"
spec:
  interval: 10m
  path: ./cluster/k8s/parked/egress-proxy-rugged
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: egress-proxy-rugged
    namespace: ducktape-flux
  suspend: true
  timeout: 5m
  wait: true
