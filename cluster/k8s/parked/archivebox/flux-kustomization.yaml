apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: archivebox
  namespace: ducktape-flux
  annotations:
    description: Suspended ArchiveBox experiment; former Authentik header SSO and split local/SeaweedFS CSI storage.
    ducktape.org/parked: "true"
spec:
  # Retain the declaration without allowing Flux to recreate retired objects.
  suspend: true
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./cluster/k8s/parked/archivebox
  prune: true
  # Captured web archives are user data. Removing this experimental controller
  # must not implicitly delete the Deployment, namespace, or either PVC.
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: archivebox
    namespace: ducktape-flux
  dependsOn:
    - name: seaweedfs-csi
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: archivebox
    - apiVersion: apps/v1
      kind: Deployment
      name: archivebox
      namespace: archivebox
