apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: firecrawl-namespace
  namespace: ducktape-flux
spec:
  suspend: true
  interval: 1h
  path: ./cluster/k8s/firecrawl/namespace
  prune: false
  sourceRef:
    kind: ExternalArtifact
    name: firecrawl-namespace
    namespace: ducktape-flux
  timeout: 1m
