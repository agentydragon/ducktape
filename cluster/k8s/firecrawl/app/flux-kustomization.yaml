apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: firecrawl
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/firecrawl/app
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: firecrawl
      namespace: firecrawl
  dependsOn:
    - name: firecrawl-namespace
    - name: firecrawl-db
