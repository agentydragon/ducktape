apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-system
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: goldilocks
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/kube-system
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: kube-system
    namespace: ducktape-flux
