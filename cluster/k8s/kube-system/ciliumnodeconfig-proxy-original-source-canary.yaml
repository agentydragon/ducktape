# Canary for the local-Gateway TLS reset root cause
# (cluster/debug/agentplane_oidc/local_gateway_tls_rca.md): with source-address
# preservation on, the policy proxy's upstream socket for an SNI-policed
# connection mirrors its own downstream 4-tuple whenever the destination is a
# hostNetwork listener on the caller's node, and the handshake never completes.
# Scoped to the two hil-ovh nodes hosting the agentplane-staging app and Actions
# Pods. The override is read by the agent's `build-config` init container, so it
# takes effect only once the cilium-agent Pod on a selected node is recreated.
#
# CLEANUP(added 2026-09-11): delete once cluster/terraform/main/cilium-values.yaml
#   sets `envoy.useOriginalSourceAddress: false` and `//cluster:bootstrap` has
#   rolled it, so the setting has one owner.
apiVersion: cilium.io/v2
kind: CiliumNodeConfig
metadata:
  name: proxy-original-source-canary
  namespace: kube-system
spec:
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/hostname
        operator: In
        values:
          - ovh-ns103711
          - ovh-ns102453
  defaults:
    proxy-use-original-source-address: "false"
