---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: backube
  namespace: flux-system
spec:
  interval: 24h
  url: https://backube.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync-system
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: volsync
      version: "0.15.0"
      sourceRef:
        kind: HelmRepository
        name: backube
        namespace: flux-system
      interval: 12h
  # The VolSync chart protects /metrics with Kubernetes token auth, but its
  # generated ServiceMonitor does not send a bearer token. Alloy already has
  # RBAC for GET /metrics, so patch the scrape endpoint to use Alloy's mounted
  # service-account token instead of disabling VolSync metrics auth.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ServiceMonitor
              name: volsync
            patch: |
              - op: add
                path: /spec/endpoints/0/bearerTokenFile
                value: /var/run/secrets/kubernetes.io/serviceaccount/token
  values:
    manageCRDs: true
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
