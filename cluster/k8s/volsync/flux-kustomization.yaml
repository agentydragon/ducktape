apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: snapshot-controller
      namespace: ducktape-flux
  healthCheckExprs:
    - apiVersion: v1
      current: has(data.token) && data.token != ''
      kind: Secret
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: volsync
      namespace: volsync-system
  interval: 10m
  path: ./cluster/k8s/volsync
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: volsync
    namespace: ducktape-flux
  timeout: 5m
  wait: true
