apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: proxmox-proxy-agent-rbac
  namespace: flux-system
  annotations:
    description: Agent RBAC for proxmox-proxy namespace. Lightweight — only RoleBindings. Depends on namespace existing + agent RBAC base for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/proxmox-proxy/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: proxmox-proxy
    - name: claude-rbac
