apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: proxmox-proxy
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: gateway
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/proxmox-proxy
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: proxmox-proxy
    namespace: ducktape-flux
  suspend: false
  timeout: 5m
  wait: true
