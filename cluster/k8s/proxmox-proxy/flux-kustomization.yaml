apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: proxmox-proxy
  namespace: ducktape-flux
spec:
  suspend: false
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: proxmox-proxy

    namespace: ducktape-flux
  path: ./cluster/k8s/proxmox-proxy
  prune: true
  wait: true
  dependsOn:
    - name: gateway
      namespace: ducktape-flux
