apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reflector
  namespace: ducktape-flux
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: reflector
      namespace: reflector-system
  interval: 10m
  path: ./cluster/k8s/reflector
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: reflector
    namespace: ducktape-flux
  timeout: 5m
  wait: true
