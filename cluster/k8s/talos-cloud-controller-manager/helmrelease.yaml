apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: talos-cloud-controller-manager
  namespace: kube-system
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: talos-cloud-controller-manager
      sourceRef:
        kind: HelmRepository
        name: siderolabs
        namespace: kube-system
  values:
    enabledControllers:
      - cloud-node
      - cloud-node-lifecycle
      - node-csr-approval
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node.cloudprovider.kubernetes.io/uninitialized
        operator: Exists
        effect: NoSchedule
    transformations:
      - name: ovh-nodes
        nodeSelector:
          - matchExpressions:
              - key: "topology.kubernetes.io/region"
                operator: In
                values: ["hil"]
        features:
          publicIPDiscovery: true
