apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: optiplex
      initContainers:
        - name: initialize-config
          image: ghcr.io/home-assistant/home-assistant:2026.7.2
          command: ["python", "/bootstrap/install_oidc.py"]
          args: ["--config-dir", "/config"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.7.2
          env:
            - name: TZ
              value: America/Los_Angeles
          ports:
            - name: backend
              containerPort: 8124
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              port: backend
              path: /
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              port: backend
              path: /
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
        - name: caddy
          image: caddy:2.10.0-alpine
          env:
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: home-assistant-metrics-token
                  key: password
          ports:
            - name: http
              containerPort: 8123
          readinessProbe:
            httpGet:
              port: http
              path: /
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: configuration
          configMap:
            name: home-assistant-configuration
        - name: bootstrap
          configMap:
            name: home-assistant-bootstrap
        - name: caddy-config
          configMap:
            name: home-assistant-caddy
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  selector:
    app.kubernetes.io/name: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: http
