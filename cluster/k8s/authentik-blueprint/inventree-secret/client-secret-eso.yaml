---
# ExternalSecret for InvenTree OIDC credentials from Vault
# Credentials are generated by terraform/gitops/sso-secrets/main.tf
# and stored at kv/sso/inventree in Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventree-oauth-client-secret
  namespace: inventree
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: inventree-oauth-client-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        client_id: "{{ .client_id }}"
        client_secret: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: sso/inventree
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: sso/inventree
        property: client_secret
