apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: artifact-generators
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: flux-system
      namespace: flux-system
  interval: 10m
  path: ./cluster/k8s/artifact-generators
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  wait: true
