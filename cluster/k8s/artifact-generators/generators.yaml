apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: agentplane-staging-actions
  namespace: ducktape-flux
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: ducktape
      namespace: ducktape-flux
  artifacts:
    - name: agentplane-staging-actions
      originRevision: "@repo"
      copy:
        - from: "@repo/cluster/k8s/agentplane-staging/actions/**"
          to: "@artifact/cluster/k8s/agentplane-staging/actions/"
          # Root Flux owns the consumer declaration, not its own artifact.
          exclude:
            - flux-kustomization.yaml
---
