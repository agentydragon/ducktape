apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    description: Read-only ClickHouse operator and observability resource status.
  name: agent-clickhouse-diagnostics-reader
  namespace: clickhouse
rules:
  - apiGroups:
      - clickhouse.altinity.com
    resources:
      - clickhouseinstallations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - clickhouse-keeper.altinity.com
    resources:
      - clickhousekeeperinstallations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - grafana.integreatly.org
    resources:
      - grafanadashboards
      - grafanadatasources
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - podmonitors
      - servicemonitors
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    description: Binds Haku and public-coder to secret-free ClickHouse status.
  name: agent-clickhouse-diagnostics-reader
  namespace: clickhouse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-clickhouse-diagnostics-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:haku
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:haku
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:public-coder
  - kind: ServiceAccount
    name: claude-ai
    namespace: agentplane-staging
---
apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: clickhouse-keeper
  namespace: clickhouse
spec:
  defaults:
    templates:
      podTemplate: keeper
      dataVolumeClaimTemplate: keeper-data
  configuration:
    settings:
      keeper_server/coordination_settings/raft_logs_level: warning
      listen_host: 0.0.0.0
      logger/console: "true"
      logger/level: information
    clusters:
      - name: keeper
        layout:
          replicas:
            - name: "0"
            - name: "1"
            - name: "2"
              templates:
                dataVolumeClaimTemplate: keeper-data-control-plane
  templates:
    podTemplates:
      - name: keeper
        metadata:
          labels:
            app.kubernetes.io/instance: clickhouse-keeper
            app.kubernetes.io/name: clickhouse-keeper
        spec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: clickhouse-keeper
                      app.kubernetes.io/name: clickhouse-keeper
                  topologyKey: kubernetes.io/hostname
          containers:
            - image: clickhouse/clickhouse-keeper:26.8.3.105@sha256:d9aced52deafda7ca716983bc80766641bcde30c23f3f7abdf6cacc9f244bd74
              imagePullPolicy: IfNotPresent
              name: clickhouse-keeper
              resources:
                limits:
                  cpu: "1"
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 101
                runAsNonRoot: true
                runAsUser: 101
                seccompProfile:
                  type: RuntimeDefault
          nodeSelector:
            storage.allegedly.works/tier: hdd
            topology.kubernetes.io/zone: hil-ovh
          securityContext:
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - effect: NoSchedule
              key: node-role.kubernetes.io/control-plane
              operator: Exists
    volumeClaimTemplates:
      - name: keeper-data
        reclaimPolicy: Retain
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: local-path-ovh-hdd-retain
      - name: keeper-data-control-plane
        reclaimPolicy: Retain
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: local-path-ovh-hdd-retain
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: clickhouse-finance-agent-credentials
  namespace: clickhouse
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    description: Read-only finance-agent access to typed AIQuota history; never mounted by a sandbox.
  name: clickhouse-finance-agent-credentials
  namespace: clickhouse
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: clickhouse-finance-agent-credentials
  refreshPolicy: CreatedOnce
  target:
    name: clickhouse-finance-agent-credentials
    template:
      data:
        password: "{{ .password }}"
      type: Opaque
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: clickhouse
  namespace: clickhouse
spec:
  defaults:
    replicasUseFQDN: "yes"
    templates:
      podTemplate: clickhouse
      dataVolumeClaimTemplate: data
  configuration:
    zookeeper:
      nodes:
        - host: keeper-clickhouse-keeper.clickhouse.svc.cluster.local
          port: 2181
      session_timeout_ms: 30000
      operation_timeout_ms: 10000
    users:
      admin/access_management: 1
      admin/networks/ip:
        - 0.0.0.0/0
        - ::/0
      admin/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: clickhouse-admin-credentials
      admin/profile: default
      admin/quota: default
      aiquota_ingest/grants/query:
        - GRANT INSERT ON aiquota.raw_http_observations
        - GRANT SELECT(event_id, observed_at, source, quota_windows, token_activity, reset_credits) ON aiquota.raw_http_observations
        - GRANT SELECT, INSERT ON aiquota.aiquota_windows
        - GRANT SELECT, INSERT ON aiquota.token_activity_daily
        - GRANT SELECT, INSERT ON aiquota.reset_credits
        - GRANT CREATE, DROP TABLE, DROP VIEW ON aiquota.*
        - GRANT ALTER ADD COLUMN ON aiquota.*
        - GRANT CLUSTER ON *.*
      aiquota_ingest/networks/ip:
        - 0.0.0.0/0
        - ::/0
      aiquota_ingest/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: clickhouse-aiquota-credentials
      aiquota_ingest/profile: ingest
      aiquota_ingest/quota: ingest
      default/networks/ip:
        - 127.0.0.1/32
        - ::1/128
      finance_agent_aiquota/grants/query:
        - GRANT SELECT ON aiquota.aiquota_windows
      finance_agent_aiquota/networks/ip:
        - 0.0.0.0/0
        - ::/0
      finance_agent_aiquota/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: clickhouse-finance-agent-credentials
      finance_agent_aiquota/profile: readonly
      finance_agent_aiquota/quota: readonly
      grafana/grants/query:
        - GRANT SELECT ON aiquota.*
      grafana/networks/ip:
        - 0.0.0.0/0
        - ::/0
      grafana/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: clickhouse-grafana-credentials
      grafana/profile: grafana_readonly
      grafana/quota: readonly
      langfuse/grants/query:
        - GRANT SELECT, INSERT ON langfuse.*
        - GRANT ALTER UPDATE, ALTER DELETE ON langfuse.*
        - GRANT CREATE, DROP TABLE, DROP VIEW ON langfuse.*
        - GRANT ALTER ADD COLUMN, ALTER MODIFY COLUMN, ALTER VIEW MODIFY QUERY ON langfuse.*
        - GRANT ALTER ADD INDEX, ALTER DROP INDEX, ALTER MATERIALIZE INDEX ON langfuse.*
        - GRANT SELECT ON system.replicas
        - GRANT SHOW COLUMNS ON system.replicas
        - GRANT SELECT(database, table, name, partition, partition_id, active, rows) ON system.parts
        - GRANT SELECT(database, table, is_done) ON system.mutations
        - GRANT SELECT(database, name, engine) ON system.tables
        - GRANT SELECT ON system.processes
        - GRANT SELECT ON system.query_log*
        - GRANT READ ON REMOTE
        - GRANT CLUSTER ON *.*
        - GRANT SYSTEM SYNC REPLICA ON langfuse.*
        - GRANT SYSTEM MERGES ON langfuse.*
        - GRANT ALTER SETTINGS ON langfuse.*
      langfuse/networks/ip:
        - 0.0.0.0/0
        - ::/0
      langfuse/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: clickhouse-langfuse-credentials
      public_coder_analytics/grants/query:
        - GRANT SELECT ON aiquota.aiquota_windows
        - GRANT SELECT ON aiquota.raw_http_observations
      public_coder_analytics/networks/ip:
        - 0.0.0.0/0
        - ::/0
      public_coder_analytics/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: clickhouse-public-coder-credentials
      public_coder_analytics/profile: readonly
      public_coder_analytics/quota: readonly
    profiles:
      grafana_readonly/max_execution_time: 60
      grafana_readonly/max_memory_usage: 1073741824
      grafana_readonly/max_threads: 4
      grafana_readonly/readonly: 2
      ingest/async_insert: 1
      ingest/async_insert_busy_timeout_ms: 5000
      ingest/max_execution_time: 30
      ingest/max_memory_usage: 536870912
      ingest/max_threads: 2
      ingest/wait_for_async_insert: 1
      readonly/max_execution_time: 60
      readonly/max_memory_usage: 1073741824
      readonly/max_threads: 4
      readonly/readonly: 1
    quotas:
      ingest/interval/duration: 3600
      ingest/interval/errors: 1000
      ingest/interval/queries: 100000
      readonly/interval/duration: 3600
      readonly/interval/errors: 1000
      readonly/interval/queries: 10000
    settings:
      prometheus/asynchronous_metrics: "true"
      prometheus/endpoint: /metrics
      prometheus/events: "true"
      prometheus/metrics: "true"
      prometheus/port: 9363
      prometheus/status_info: "true"
    files:
      zz-system-logs.xml: |
        <clickhouse>
          <!-- ClickHouse's own telemetry was 85% of its write volume and 94% of its
               part-creation ops: 24h of system.part_log showed 83k inserts / 30k merges /
               25 GiB for system.*, against 4.9k inserts / 4.4 GiB of real tenant data,
               all on a shared 7200 RPM spindle. Server metrics already reach Prometheus
               through the endpoint configured above, which makes the *metric_log tables
               redundant rather than merely expensive. -->
          <metric_log remove="1"/>
          <asynchronous_metric_log remove="1"/>
          <query_metric_log remove="1"/>
          <trace_log remove="1"/>
          <text_log remove="1"/>
          <processors_profile_log remove="1"/>
          <background_schedule_pool_log remove="1"/>
          <aggregated_zookeeper_log remove="1"/>
          <zookeeper_connection_log remove="1"/>
          <opentelemetry_span_log remove="1"/>
          <query_views_log remove="1"/>
          <asynchronous_insert_log remove="1"/>
          <!-- Kept: query_log (the langfuse user holds SELECT on it), part_log (cheap
               once the tables above stop generating parts for it to log, and it is what
               diagnoses merge pressure), error_log, crash_log. -->
          <query_log>
            <max_size_rows>8192</max_size_rows>
            <reserved_size_rows>8192</reserved_size_rows>
          </query_log>
        </clickhouse>
    clusters:
      - name: default
        secret:
          valueFrom:
            secretKeyRef:
              name: clickhouse-admin-credentials
              key: cluster-secret
        layout:
          shardsCount: 1
          replicasCount: 2
  templates:
    podTemplates:
      - name: clickhouse
        metadata:
          labels:
            app.kubernetes.io/instance: clickhouse
            app.kubernetes.io/name: clickhouse
        spec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: clickhouse
                      app.kubernetes.io/name: clickhouse
                  topologyKey: kubernetes.io/hostname
          containers:
            - image: clickhouse/clickhouse-server:26.8.3.105@sha256:d73903d1b61dfe825fc3810542f252966f33d3fd8efb3b3edcbbafb46b524b04
              imagePullPolicy: IfNotPresent
              name: clickhouse
              ports:
                - containerPort: 9363
                  name: metrics
                  protocol: TCP
              resources:
                limits:
                  cpu: "4"
                  memory: 12Gi
                requests:
                  cpu: 500m
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 101
                runAsNonRoot: true
                runAsUser: 101
                seccompProfile:
                  type: RuntimeDefault
          nodeSelector:
            storage.allegedly.works/tier: hdd
            topology.kubernetes.io/zone: hil-ovh
          securityContext:
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 120
    volumeClaimTemplates:
      - name: data
        reclaimPolicy: Retain
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 500Gi
          storageClassName: local-path-ovh-hdd-retain
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: clickhouse
  namespace: clickhouse
spec:
  podMetricsEndpoints:
    - path: /metrics
      port: metrics
      scrapeTimeout: 15s
  selector:
    matchLabels:
      app.kubernetes.io/instance: clickhouse
      app.kubernetes.io/name: clickhouse
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    description: Stable client endpoint for the shared ClickHouse installation.
  name: clickhouse
  namespace: clickhouse
spec:
  ports:
    - name: http
      port: 8123
      protocol: TCP
      targetPort: 8123
    - name: native
      port: 9000
      protocol: TCP
      targetPort: 9000
  selector:
    clickhouse.altinity.com/app: chop
    clickhouse.altinity.com/chi: clickhouse
    clickhouse.altinity.com/namespace: clickhouse
    clickhouse.altinity.com/ready: "yes"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress
  namespace: clickhouse
spec:
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
        - port: 9009
          protocol: TCP
        - port: 9363
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cli-proxy-api
          podSelector:
            matchLabels:
              app.kubernetes.io/name: aiquota
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: public-coder-agent
          podSelector:
            matchLabels:
              app.kubernetes.io/name: public-coder-agent-proxy
      ports:
        - port: 8123
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentplane-staging
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agentplane-egress
      ports:
        - port: 8123
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: grafana
      ports:
        - port: 8123
          protocol: TCP
        - port: 9363
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - port: 8123
          protocol: TCP
        - port: 9363
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-node
      ports:
        - port: 9363
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: langfuse
          podSelector:
            matchLabels:
              app.kubernetes.io/name: langfuse
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: clickhouse
      app.kubernetes.io/name: clickhouse
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keeper-ingress
  namespace: clickhouse
spec:
  ingress:
    - from:
        - podSelector: {}
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: clickhouse-keeper
      app.kubernetes.io/name: clickhouse-keeper
  policyTypes:
    - Ingress
