# Keep the UID guard while Flux prunes the retired PVC and CSI deletes its PV.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: clickhouse-retired-pvc-uid-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["persistentvolumeclaims"]
        resourceNames: ["data-piraeus-hdd-chi-clickhouse-default-0-0-0"]
  validations:
    - expression: "oldObject.metadata.uid == '05bb6184-88de-4de2-a74c-abe6c9da5663'"
      message: "Only the reviewed retired ClickHouse PVC UID may be deleted"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: clickhouse-retired-pvc-uid-guard
spec:
  policyName: clickhouse-retired-pvc-uid-guard
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: clickhouse
