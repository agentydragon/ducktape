# Temporary, UID-pinned handoff of the retired 0-0 PVC to Flux. The subsequent
# cleanup removes the PVC from this Kustomization after this guard is observed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: clickhouse-retired-pvc-uid-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["persistentvolumeclaims"]
        resourceNames: ["data-piraeus-hdd-chi-clickhouse-default-0-0-0"]
  validations:
    - expression: "oldObject.metadata.uid == '05bb6184-88de-4de2-a74c-abe6c9da5663'"
      message: "Only the reviewed retired ClickHouse PVC UID may be deleted"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: clickhouse-retired-pvc-uid-guard
spec:
  policyName: clickhouse-retired-pvc-uid-guard
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: clickhouse
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-05bb6184-88de-4de2-a74c-abe6c9da5663
  uid: fb4d1fb2-50a5-4596-8fa9-6f4103442ebf
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  persistentVolumeReclaimPolicy: Delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-piraeus-hdd-chi-clickhouse-default-0-0-0
  namespace: clickhouse
  uid: 05bb6184-88de-4de2-a74c-abe6c9da5663
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
spec:
  volumeName: pvc-05bb6184-88de-4de2-a74c-abe6c9da5663
