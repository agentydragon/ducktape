apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-ingress
  namespace: clickhouse
spec:
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
        - port: 9009
          protocol: TCP
        - port: 9363
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cli-proxy-api
          podSelector:
            matchLabels:
              app.kubernetes.io/name: aiquota
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: public-coder-agent
          podSelector:
            matchLabels:
              app.kubernetes.io/name: public-coder-agent-proxy
      ports:
        - port: 8123
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: grafana
      ports:
        - port: 8123
          protocol: TCP
        - port: 9363
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - port: 8123
          protocol: TCP
        - port: 9363
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: langfuse
          podSelector:
            matchLabels:
              app.kubernetes.io/name: langfuse
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: clickhouse
      app.kubernetes.io/name: clickhouse
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-keeper-ingress
  namespace: clickhouse
spec:
  ingress:
    - from:
        - podSelector: {}
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: clickhouse-keeper
      app.kubernetes.io/name: clickhouse-keeper
  policyTypes:
    - Ingress
