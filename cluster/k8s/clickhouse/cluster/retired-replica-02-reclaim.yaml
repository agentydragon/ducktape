# Keep the UID guard while Flux prunes the retired 0-2 PVC and CSI deletes its PV.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: clickhouse-retired-02-pvc-uid-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["persistentvolumeclaims"]
        resourceNames: ["data-piraeus-hdd-chi-clickhouse-default-0-2-0"]
  validations:
    - expression: "oldObject.metadata.uid == '78e612e7-7cac-41b5-be69-f2712daa1dcf'"
      message: "Only the reviewed retired ClickHouse PVC UID may be deleted"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: clickhouse-retired-02-pvc-uid-guard
spec:
  policyName: clickhouse-retired-02-pvc-uid-guard
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: clickhouse
