# Public, secret-free ClickHouse control-plane diagnostics for Haku and public-coder.
#
# The main resources include their observed status. This intentionally grants no
# Secrets, pod exec, writes, or status-subresource mutation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-clickhouse-diagnostics-reader
  namespace: clickhouse
  annotations:
    description: Read-only ClickHouse operator and observability resource status.
rules:
  - apiGroups: ["clickhouse.altinity.com"]
    resources: ["clickhouseinstallations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["clickhouse-keeper.altinity.com"]
    resources: ["clickhousekeeperinstallations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["grafana.integreatly.org"]
    resources:
      - grafanadashboards
      - grafanadatasources
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - podmonitors
      - servicemonitors
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-clickhouse-diagnostics-reader
  namespace: clickhouse
  annotations:
    description: Binds Haku and public-coder to secret-free ClickHouse status.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-clickhouse-diagnostics-reader
subjects:
  - kind: Group
    name: oidc-ksbx-groups:haku
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: haku:access-profile:haku
    apiGroup: rbac.authorization.k8s.io
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - kind: Group
    name: haku:access-profile:public-coder
    apiGroup: rbac.authorization.k8s.io
