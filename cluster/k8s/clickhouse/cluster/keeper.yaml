apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: clickhouse-keeper
  namespace: clickhouse
spec:
  configuration:
    clusters:
      - name: keeper
        layout:
          replicas:
            - name: "0"
            - name: "1"
            - name: "2"
              # Replica 2's original local PV was bound to ovh-ns102453 before
              # the control-plane toleration existed, where replica 0 already
              # satisfies the required hostname anti-affinity. Give only this
              # replica a fresh claim so WaitForFirstConsumer can place it on
              # the third HDD node, ovh-ns103656.
              templates:
                dataVolumeClaimTemplate: keeper-data-control-plane
    settings:
      logger/level: information
      logger/console: "true"
      listen_host: 0.0.0.0
      keeper_server/coordination_settings/raft_logs_level: warning
  defaults:
    templates:
      podTemplate: keeper
      dataVolumeClaimTemplate: keeper-data
  templates:
    podTemplates:
      - name: keeper
        metadata:
          labels:
            app.kubernetes.io/name: clickhouse-keeper
            app.kubernetes.io/instance: clickhouse-keeper
        spec:
          nodeSelector:
            topology.kubernetes.io/zone: hil-ovh
            storage.allegedly.works/tier: hdd
          # hil-ovh has two HDD workers plus one HDD control-plane node. The
          # three-member Keeper quorum requires distinct hosts, so permit only
          # this lightweight infrastructure workload onto the third node.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: clickhouse-keeper
                      app.kubernetes.io/instance: clickhouse-keeper
                  topologyKey: kubernetes.io/hostname
          securityContext:
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: clickhouse-keeper
              image: clickhouse/clickhouse-keeper:26.3.20.7@sha256:4e8d13c17390e1e941ac265a26b773141cdeb6cf783915088df009b1730c88dc
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 101
                runAsGroup: 101
                seccompProfile:
                  type: RuntimeDefault
    volumeClaimTemplates:
      - name: keeper-data
        reclaimPolicy: Retain
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: local-path-ovh-hdd-retain
          resources:
            requests:
              storage: 2Gi
      - name: keeper-data-control-plane
        reclaimPolicy: Retain
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: local-path-ovh-hdd-retain
          resources:
            requests:
              storage: 2Gi
