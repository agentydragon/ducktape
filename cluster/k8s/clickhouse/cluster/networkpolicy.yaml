apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-ingress
  namespace: clickhouse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
      app.kubernetes.io/instance: clickhouse
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
        - port: 9009
          protocol: TCP
        - port: 9363
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cli-proxy-api
          podSelector:
            matchLabels:
              app.kubernetes.io/name: aiquota
      ports:
        - port: 8123
          protocol: TCP
    # The agent app itself cannot reach ClickHouse. Its credential-bearing
    # egress proxy is the only cross-namespace client admitted for the native
    # read-only public_coder_analytics account.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: public-coder-agent
          podSelector:
            matchLabels:
              app.kubernetes.io/name: public-coder-agent-proxy
      ports:
        - port: 8123
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [grafana, alloy]
      ports:
        - port: 8123
          protocol: TCP
        - port: 9363
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: langfuse
          podSelector:
            matchLabels:
              app.kubernetes.io/name: langfuse
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-keeper-ingress
  namespace: clickhouse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse-keeper
      app.kubernetes.io/instance: clickhouse-keeper
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
