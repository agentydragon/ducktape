apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: clickhouse
  namespace: clickhouse
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
      app.kubernetes.io/instance: clickhouse
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 15s
