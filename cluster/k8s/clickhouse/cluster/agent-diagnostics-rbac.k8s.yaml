apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    description: Read-only ClickHouse operator and observability resource status.
  name: agent-clickhouse-diagnostics-reader
  namespace: clickhouse
rules:
  - apiGroups:
      - clickhouse.altinity.com
    resources:
      - clickhouseinstallations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - clickhouse-keeper.altinity.com
    resources:
      - clickhousekeeperinstallations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - grafana.integreatly.org
    resources:
      - grafanadashboards
      - grafanadatasources
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - podmonitors
      - servicemonitors
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    description: Binds Haku and public-coder to secret-free ClickHouse status.
  name: agent-clickhouse-diagnostics-reader
  namespace: clickhouse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-clickhouse-diagnostics-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:haku
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:haku
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:public-coder
