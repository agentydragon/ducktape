apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clickhouse-namespace
  namespace: ducktape-flux
spec:
  dependsOn: []
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: clickhouse
  interval: 10m
  path: ./cluster/k8s/clickhouse/namespace
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: clickhouse-namespace
    namespace: ducktape-flux
  wait: true
