apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clickhouse-schema
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/clickhouse/schema
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 20m
  wait: true
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: clickhouse-aiquota-schema-v7
      namespace: clickhouse
  dependsOn:
    - name: clickhouse
      namespace: ducktape-flux
