apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-aiquota-schema-v9
  namespace: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse-schema
    app.kubernetes.io/instance: clickhouse
    app.kubernetes.io/component: schema
  annotations:
    description: Bootstraps the langfuse and aiquota databases with ClickHouse distributed DDL. Table/view schema inside each database is owned by its app.
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-schema
        app.kubernetes.io/instance: clickhouse
        app.kubernetes.io/component: schema
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema
          image: clickhouse/clickhouse-server:26.8.3.105@sha256:d73903d1b61dfe825fc3810542f252966f33d3fd8efb3b3edcbbafb46b524b04
          imagePullPolicy: IfNotPresent
          command: [clickhouse-client]
          args:
            - --host=clickhouse.clickhouse.svc.cluster.local
            - --port=9000
            - --connect_timeout=10
            - --receive_timeout=60
            - --multiquery
            - --queries-file=/schema/schema.sql
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-admin-credentials
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-admin-credentials
                  key: password
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: schema
          configMap:
            name: clickhouse-aiquota-schema
        - name: tmp
          emptyDir: {}
