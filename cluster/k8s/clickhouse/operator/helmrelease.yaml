apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: altinity-clickhouse-operator
  namespace: flux-system
spec:
  type: oci
  url: oci://ghcr.io/altinity/clickhouse-operator-helm-chart
  interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: clickhouse
spec:
  interval: 30m
  timeout: 10m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: altinity-clickhouse-operator
      version: "0.27.3"
      sourceRef:
        kind: HelmRepository
        name: altinity-clickhouse-operator
        namespace: flux-system
      interval: 12h
  valuesFrom:
    - kind: Secret
      name: clickhouse-operator-values
      valuesKey: values.yaml
  values:
    watchNamespaces:
      - clickhouse
      # Keep the old namespace watched while Flux prunes the former
      # analytics installation during the rebuild. Remove this entry after
      # the old ClickHouse resources and namespace are gone.
      - analytics
    rbac:
      namespaceScoped: true
    crdHook:
      # The chart invokes /bin/sh in this image; the official kubectl image is distroless.
      image:
        repository: bitnamilegacy/kubectl
        tag: "1.33.4@sha256:ed0b31a0508da84ee655c5c6e01bd3897fc56ad6cf69debb27fa1893a06d2246"
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
    operator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    metrics:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    podSecurityContext:
      # Altinity images declare USER nobody; use its numeric UID for runAsNonRoot validation.
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    serviceMonitor:
      enabled: true
