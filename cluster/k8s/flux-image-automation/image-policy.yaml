apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: props-backend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: props-backend
  filterTags:
    # Tags pushed by CI: devel-YYYY-MM-DDTHHMMSSZ-{sha7} — alphabetical order == chronological
    pattern: '^devel-\d{4}-\d{2}-\d{2}T\d{6}Z-[0-9a-f]{7}$'
  policy:
    alphabetical:
      order: asc
