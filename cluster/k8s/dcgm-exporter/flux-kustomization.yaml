apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dcgm-exporter
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: nvidia-device-plugin
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: dcgm-exporter
      namespace: dcgm-exporter
  interval: 10m
  path: ./cluster/k8s/dcgm-exporter
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: dcgm-exporter
    namespace: ducktape-flux
  timeout: 2m
  wait: true
