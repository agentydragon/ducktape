apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dcgm-exporter
resources:
  - namespace.yaml
  - daemonset.yaml
  - podmonitor.yaml
configMapGenerator:
  # Hash suffix rewrites the DaemonSet volume ref and rolls pods when counters.csv changes.
  - name: dcgm-counters
    files:
      - counters.csv
