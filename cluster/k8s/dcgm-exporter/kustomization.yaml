apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dcgm-exporter
resources:
  # Generated by cluster/cdk8s/dcgm_exporter/exporter.py.
  - dcgm-exporter.k8s.yaml
  - podmonitor.yaml
configMapGenerator:
  # Hash suffix rewrites the DaemonSet volume ref and rolls pods when counters.csv changes.
  - name: dcgm-counters
    files:
      - counters.csv
