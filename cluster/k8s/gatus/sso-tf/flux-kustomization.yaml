apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus-sso-tf
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/gatus/sso-tf
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: gatus-sso
      namespace: flux-system
  timeout: 10m
  dependsOn:
    - name: tofu-controller
    - name: tofu-state-db
    - name: authentik
