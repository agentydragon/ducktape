apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres-cluster.yaml
  - helmrelease.yaml
  - env-configmap.yaml
  - networkpolicy.yaml
  - cnp-dns-visibility.yaml
  - httproute.yaml
  - servicemonitor.yaml
configMapGenerator:
  - name: gatus-config
    namespace: gatus
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
