apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus-servicemonitor
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/gatus/servicemonitor
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: gatus-servicemonitor

    namespace: ducktape-flux
  dependsOn:
    - name: gatus
      namespace: ducktape-flux
    - name: monitoring-stack
      namespace: ducktape-flux
