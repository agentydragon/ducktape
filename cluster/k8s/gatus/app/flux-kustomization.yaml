apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: gatus-namespace
      namespace: ducktape-flux
    - name: gatus-db
      namespace: ducktape-flux
    - name: gatus-sso-tf
      namespace: ducktape-flux
    - name: litellm-secrets
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gatus
      namespace: gatus
  interval: 10m
  path: ./cluster/k8s/gatus/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: gatus
    namespace: ducktape-flux
  timeout: 10m
  wait: true
