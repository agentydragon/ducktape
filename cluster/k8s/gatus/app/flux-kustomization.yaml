apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/gatus/app
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gatus
      namespace: gatus
  dependsOn:
    - name: gatus-namespace
      namespace: ducktape-flux
    - name: gatus-db
      namespace: ducktape-flux
    - name: gatus-sso-tf
      namespace: ducktape-flux
    - name: litellm-secrets
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
