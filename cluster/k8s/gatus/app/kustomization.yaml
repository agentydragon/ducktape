apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmrelease.yaml
  - env-configmap.yaml
  - networkpolicy.yaml
  - cnp-dns-visibility.yaml
  - httproute.yaml

configMapGenerator:
  - name: gatus-config
    namespace: gatus
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
