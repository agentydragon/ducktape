---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: twin
  namespace: gatus
spec:
  interval: 24h
  url: https://twin.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: gatus
      version: "1.5.0"
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: gatus
  values:
    externalConfigMap: gatus-config

    env:
      GATUS_DB_URI:
        valueFrom:
          secretKeyRef:
            name: gatus-db-app
            key: uri

    envFrom:
      - secretRef:
          name: litellm-api-key
      - secretRef:
          name: gatus-oidc-secret

    podAnnotations:
      reloader.stakater.com/auto: "true"

    ingress:
      enabled: false

    # Storage moved off the local SQLite PVC onto the gatus-db CNPG
    # cluster on OVH-HA (cluster/k8s/gatus/db/).
    persistence:
      enabled: false

    # ServiceMonitor split into gatus/servicemonitor/ to avoid
    # blocking Gatus deploys on monitoring-stack readiness.
    serviceMonitor:
      enabled: false

    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
