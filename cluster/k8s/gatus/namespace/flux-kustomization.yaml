apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus-namespace
  namespace: ducktape-flux
spec:
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: gatus
  interval: 10m
  path: ./cluster/k8s/gatus/namespace
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: gatus-namespace
    namespace: ducktape-flux
  timeout: 5m
  wait: true
