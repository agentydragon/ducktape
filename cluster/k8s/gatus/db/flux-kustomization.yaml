apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus-db
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: gatus-db

    namespace: ducktape-flux
  path: ./cluster/k8s/gatus/db
  prune: true
  wait: true
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: gatus-db
      namespace: gatus
  dependsOn:
    - name: gatus-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
