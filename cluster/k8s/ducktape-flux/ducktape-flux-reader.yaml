# Permanent public-Flux diagnostics for trusted agent identities.
#
# This intentionally grants only the two public control-plane CRDs in the
# ducktape-flux namespace. In particular it grants no access to the
# controller-only SOPS key Secret, ConfigMaps, Pods, logs, exec, or writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ducktape-flux-reader
  namespace: ducktape-flux
  annotations:
    description: Read-only public Ducktape Flux diagnostics.
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: public-coder-agent-ducktape-flux-reader
  namespace: ducktape-flux
  annotations:
    description: Binds public-coder-agent-reader to public Ducktape Flux diagnostics.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ducktape-flux-reader
subjects:
  - kind: ServiceAccount
    name: public-coder-agent-reader
    namespace: public-coder-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haku-ducktape-flux-reader
  namespace: ducktape-flux
  annotations:
    description: Binds the Haku OIDC group to public Ducktape Flux diagnostics.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ducktape-flux-reader
subjects:
  - kind: Group
    name: oidc-ksbx-groups:haku
    apiGroup: rbac.authorization.k8s.io
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - kind: ServiceAccount
    name: haku-claude
    namespace: haku-claude-sandbox
