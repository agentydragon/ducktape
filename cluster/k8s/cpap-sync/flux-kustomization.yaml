apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpap-sync
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/cpap-sync
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  timeout: 30m
  dependsOn:
    - name: kubevirt
      namespace: ducktape-flux
  wait: true
  healthChecks:
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      name: cpap-gateway
      namespace: cpap-sync
