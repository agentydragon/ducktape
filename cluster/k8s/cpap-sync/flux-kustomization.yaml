apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cpap-sync
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: kubevirt
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      name: cpap-gateway
      namespace: cpap-sync
  interval: 10m
  path: ./cluster/k8s/cpap-sync
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: cpap-sync
    namespace: ducktape-flux
  timeout: 30m
  wait: true
