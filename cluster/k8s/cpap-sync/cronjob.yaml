apiVersion: batch/v1
kind: CronJob
metadata:
  name: cpap-sync
  namespace: cpap-sync
  annotations:
    description: >-
      Connects to the ez Share WiFi SD card through the cpap-card gateway Service and syncs all EDF data files into the cpap-data Forgejo repo (partial clone + commit + push; credentials from the cpap-data-git-write secret).
spec:
  schedule: "0 10 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cpap-sync
            app.kubernetes.io/component: sync
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: optiplex
          automountServiceAccountToken: false
          volumes:
            - name: workdir
              emptyDir: {}
          containers:
            - name: sync
              image: ghcr.io/agentydragon/cpap-sync:devel-20260827010217-ad9239c # {"$imagepolicy": "flux-system:cpap-sync"}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                # The aspect py_binary launcher materializes its venv under the
                # image runfiles directory at startup, so this container needs
                # a writable root filesystem despite the other hardening here.
                seccompProfile:
                  type: RuntimeDefault
              args:
                - --base-url
                - http://cpap-card.cpap-sync.svc.cluster.local
                - --git-url
                - $(GIT_REPO_URL)
                - --wifi-interface
                - ""
              env:
                # The clone (initial re-seed: the card's full history) lands in
                # TMPDIR — keep it on the emptyDir, not the container layer.
                - name: TMPDIR
                  value: /workdir
                - name: GIT_REPO_URL
                  valueFrom:
                    secretKeyRef:
                      name: cpap-data-git-write
                      key: repo_url
                - name: GIT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: cpap-data-git-write
                      key: username
                - name: GIT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cpap-data-git-write
                      key: password
              volumeMounts:
                - name: workdir
                  mountPath: /workdir
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  # git pack-objects on the initial ~0.5-1GB seed push.
                  memory: 512Mi
