apiVersion: batch/v1
kind: CronJob
metadata:
  name: cpap-sync
  namespace: cpap-sync
  annotations:
    description: >-
      Connects to the ez Share WiFi SD card in the ResMed CPAP and syncs all EDF data files into the cpap-data Forgejo repo (partial clone + commit + push; credentials from the cpap-data-git-write secret).
spec:
  schedule: "0 10 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            kubernetes.io/hostname: optiplex
          securityContext:
            runAsUser: 0
          volumes:
            - name: workdir
              emptyDir: {}
          containers:
            - name: sync
              image: ghcr.io/agentydragon/cpap-sync:devel-20260717000149-6162a72 # {"$imagepolicy": "flux-system:cpap-sync"}
              args:
                - --git-url
                - $(GIT_REPO_URL)
                - --wifi-interface
                - $(CPAP_WIFI_INTERFACE)
                - --wifi-ssid
                - $(CPAP_WIFI_SSID)
              env:
                # The clone (initial re-seed: the card's full history) lands in
                # TMPDIR — keep it on the emptyDir, not the container layer.
                - name: TMPDIR
                  value: /workdir
                - name: CPAP_WIFI_INTERFACE
                  value: wlx9cefd5f62ee0
                - name: CPAP_WIFI_SSID
                  value: Rai CPAP ez Share
                - name: CPAP_WIFI_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cpap-ezshare
                      key: wifi_password
                - name: GIT_REPO_URL
                  valueFrom:
                    secretKeyRef:
                      name: cpap-data-git-write
                      key: repo_url
                - name: GIT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: cpap-data-git-write
                      key: username
                - name: GIT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cpap-data-git-write
                      key: password
              securityContext:
                capabilities:
                  add: ["NET_ADMIN", "NET_RAW"]
              volumeMounts:
                - name: workdir
                  mountPath: /workdir
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  # git pack-objects on the initial ~0.5-1GB seed push.
                  memory: 512Mi
