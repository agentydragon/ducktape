apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "false"
    name: cpap-sync
    pod-security.kubernetes.io/enforce: baseline
  name: cpap-sync
spec: {}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: cpap-sync
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-secret-reader
  namespace: cpap-sync
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cpap-sync-cpap-data-git-write-reader
  namespace: forgejo
rules:
  - apiGroups:
      - ""
    resourceNames:
      - cpap-data-git-write
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cpap-sync-cpap-data-git-write-reader
  namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cpap-sync-cpap-data-git-write-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: forgejo-secret-reader
    namespace: cpap-sync
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-cpap-sync-cpap-data-git-write-secret-store
spec:
  conditions:
    - namespaces:
        - cpap-sync
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: forgejo-secret-reader
      remoteNamespace: forgejo
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cpap-data-git-write
  namespace: cpap-sync
spec:
  dataFrom:
    - extract:
        key: cpap-data-git-write
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-cpap-sync-cpap-data-git-write-secret-store
  target:
    creationPolicy: Owner
    name: cpap-data-git-write
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cpap-sync-cpap-data-git-read-reader
  namespace: forgejo
rules:
  - apiGroups:
      - ""
    resourceNames:
      - cpap-data-git-read
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cpap-sync-cpap-data-git-read-reader
  namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cpap-sync-cpap-data-git-read-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: forgejo-secret-reader
    namespace: cpap-sync
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-cpap-sync-cpap-data-git-read-secret-store
spec:
  conditions:
    - namespaces:
        - cpap-sync
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: forgejo-secret-reader
      remoteNamespace: forgejo
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cpap-data-git-read
  namespace: cpap-sync
spec:
  dataFrom:
    - extract:
        key: cpap-data-git-read
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-cpap-sync-cpap-data-git-read-secret-store
  target:
    creationPolicy: Owner
    name: cpap-data-git-read
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: claude-sandbox
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: claude-sandbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: cpap-sync
imagePullSecrets:
  - name: forgejo-images-creds
---
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    description: Connects to the ez Share WiFi SD card through the cpap-card gateway Service and syncs all EDF data files into the cpap-data Forgejo repo (partial clone + commit + push; credentials from the cpap-data-git-write secret).
  name: cpap-sync
  namespace: cpap-sync
spec:
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: sync
            app.kubernetes.io/name: cpap-sync
        spec:
          automountServiceAccountToken: false
          containers:
            - args:
                - --base-url
                - http://cpap-card.cpap-sync.svc:80
                - --git-url
                - $(GIT_REPO_URL)
                - --wifi-interface
                - ""
              env:
                - name: TMPDIR
                  value: /workdir
                - name: GIT_REPO_URL
                  valueFrom:
                    secretKeyRef:
                      key: repo_url
                      name: cpap-data-git-write
                - name: GIT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: cpap-data-git-write
                - name: GIT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: cpap-data-git-write
              image: git.allegedly.works/ducktape-ci/cpap-sync:unset
              name: sync
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - mountPath: /workdir
                  name: workdir
          nodeSelector:
            kubernetes.io/hostname: optiplex
          restartPolicy: OnFailure
          volumes:
            - emptyDir: {}
              name: workdir
  schedule: 0 10 * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    description: Internal ClusterIP facade for the CPAP card HTTP API exposed by the KubeVirt gateway VM on the OptiPlex.
  name: cpap-card
  namespace: cpap-sync
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 18080
  selector:
    kubevirt.io/domain: cpap-gateway
  type: ClusterIP
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  annotations:
    description: Always-on KubeVirt gateway for the CPAP ez Share WiFi card. The USB adapter stays physically attached to OptiPlex and is passed through to this VM; the VM exposes only the card's HTTP API to the sync Service.
    ducktape.org/auto-restart-template-changes: "true"
  labels:
    app.kubernetes.io/name: cpap-gateway
  name: cpap-gateway
  namespace: cpap-sync
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpap-gateway
        kubevirt.io/domain: cpap-gateway
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          autoattachGraphicsDevice: false
          disks:
            - bootOrder: 1
              disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cpap-secret
              serial: cpapsecret
          hostDevices:
            - deviceName: kubevirt.io/cpap-wifi
              name: cpap-wifi
          interfaces:
            - masquerade: {}
              name: default
              ports:
                - name: http
                  port: 18080
        firmware:
          bootloader:
            efi:
              secureBoot: false
        resources:
          requests:
            memory: 768Mi
      networks:
        - name: default
          pod: {}
      nodeSelector:
        kubernetes.io/hostname: optiplex
      volumes:
        - containerDisk:
            image: git.allegedly.works/ducktape-ci/cpap-gateway:unset
            imagePullPolicy: IfNotPresent
          name: rootdisk
        - name: cpap-secret
          secret:
            secretName: cpap-ezshare
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    description: Identity for the generic KubeVirt VM image restart controller.
  name: vm-image-restart
  namespace: cpap-sync
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    description: Durable rollout state and bounded retry count for the configured VM.
  name: vm-image-restart-state
  namespace: cpap-sync
immutable: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    description: Narrow permissions for restarting and observing the configured VM.
  name: vm-image-restart
  namespace: cpap-sync
rules:
  - apiGroups:
      - kubevirt.io
    resourceNames:
      - cpap-gateway
    resources:
      - virtualmachines
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kubevirt.io
    resourceNames:
      - cpap-gateway
    resources:
      - virtualmachineinstances
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resourceNames:
      - vm-image-restart-state
    resources:
      - configmaps
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-image-restart
  namespace: cpap-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-image-restart
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: vm-image-restart
    namespace: cpap-sync
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Applies staged image/template changes to one configured stateless KubeVirt VM.
  labels:
    app.kubernetes.io/name: vm-image-restart
  name: vm-image-restart
  namespace: cpap-sync
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: vm-image-restart
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vm-image-restart
        cdk8s.io/metadata.addr: cpap-sync-vm-image-restart-controller-deployment-c82c8636
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: TARGET_NAMESPACE
              value: cpap-sync
            - name: TARGET_VM_NAME
              value: cpap-gateway
            - name: STATE_CONFIGMAP_NAME
              value: vm-image-restart-state
          image: git.allegedly.works/ducktape-ci/vm-image-restart:unset
          imagePullPolicy: IfNotPresent
          name: vm-image-restart
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: vm-image-restart
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    description: Allows the restart controller to reach only DNS and the Kubernetes API.
  name: vm-image-restart-egress
  namespace: cpap-sync
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vm-image-restart
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    description: The sync Job may resolve DNS, reach the in-cluster CPAP gateway Service, and push to Forgejo through the cluster gateway.
  name: cpap-sync-egress
  namespace: cpap-sync
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toPorts:
        - ports:
            - port: "18080"
              protocol: TCP
      toServices:
        - k8sService:
            namespace: cpap-sync
            serviceName: cpap-card
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cpap-sync
            kubevirt.io/domain: cpap-gateway
      toPorts:
        - ports:
            - port: "18080"
              protocol: TCP
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "3000"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cpap-sync
