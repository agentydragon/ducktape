apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: cpap-sync
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: cpap-sync
imagePullSecrets:
  - name: forgejo-images-creds
---
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    description: Connects to the ez Share WiFi SD card through the cpap-card gateway Service and syncs all EDF data files into the cpap-data Forgejo repo (partial clone + commit + push; credentials from the cpap-data-git-write secret).
  name: cpap-sync
  namespace: cpap-sync
spec:
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: sync
            app.kubernetes.io/name: cpap-sync
        spec:
          automountServiceAccountToken: false
          containers:
            - args:
                - --base-url
                - http://cpap-card.cpap-sync.svc.cluster.local
                - --git-url
                - $(GIT_REPO_URL)
                - --wifi-interface
                - ""
              env:
                - name: TMPDIR
                  value: /workdir
                - name: GIT_REPO_URL
                  valueFrom:
                    secretKeyRef:
                      key: repo_url
                      name: cpap-data-git-write
                - name: GIT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: cpap-data-git-write
                - name: GIT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: cpap-data-git-write
              image: git.allegedly.works/ducktape-ci/cpap-sync:unset
              name: sync
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - mountPath: /workdir
                  name: workdir
          nodeSelector:
            kubernetes.io/hostname: optiplex
          restartPolicy: OnFailure
          volumes:
            - emptyDir: {}
              name: workdir
  schedule: 0 10 * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    description: Internal ClusterIP facade for the CPAP card HTTP API exposed by the KubeVirt gateway VM on the OptiPlex.
  name: cpap-card
  namespace: cpap-sync
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 18080
  selector:
    kubevirt.io/domain: cpap-gateway
  type: ClusterIP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    description: The sync Job may resolve DNS, reach the in-cluster CPAP gateway Service, and push to Forgejo through the cluster gateway.
  name: cpap-sync-egress
  namespace: cpap-sync
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toPorts:
        - ports:
            - port: "18080"
              protocol: TCP
      toServices:
        - k8sService:
            namespace: cpap-sync
            serviceName: cpap-card
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cpap-sync
            k8s:kubevirt.io/domain: cpap-gateway
      toPorts:
        - ports:
            - port: "18080"
              protocol: TCP
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "3000"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cpap-sync
