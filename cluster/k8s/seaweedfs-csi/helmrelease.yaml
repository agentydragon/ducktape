apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: seaweedfs-csi-driver
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/seaweedfs/seaweedfs-csi-driver
  ref:
    tag: v1.4.30
  ignore: |
    /*
    !/deploy/helm/seaweedfs-csi-driver
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-csi-driver
  namespace: seaweedfs-csi-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    # Deviation: upgrades do not wait for resource health. The mount DaemonSet is
    # `updateStrategy: OnDelete` (chart default, and deliberate — rolling it kills
    # the node's FUSE mounts and consumers do not self-heal, #4616). Flux assesses
    # health with kstatus, which reports a DaemonSet InProgress while
    # updatedNumberScheduled < desiredNumberScheduled and has no OnDelete
    # exemption, so any values change here hangs until the timeout and then
    # Stalls the release — which also wedges the Kustomization that health-checks
    # it. (Helm's own readiness checker does exempt OnDelete; Flux does not use
    # it.) Adding resource requests in #4626 triggered exactly this.
    #
    # The cost is that a genuinely broken upgrade of the controller or node
    # DaemonSet is no longer caught by the release going NotReady. Reverting this
    # requires either dropping OnDelete or a per-resource wait exemption.
    disableWait: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: deploy/helm/seaweedfs-csi-driver
      sourceRef:
        kind: GitRepository
        name: seaweedfs-csi-driver
        namespace: flux-system
  values:
    seaweedfsFiler: "seaweedfs-filer.seaweedfs.svc.cluster.local:8888"
    # Chart-created StorageClass disabled (storageClassName left empty): the
    # chart's storageclass.yaml template has no allowedTopologies support (only
    # name/provisioner/volumeBindingMode/parameters), so the default
    # `seaweedfs-ovh` class is hand-authored instead, alongside
    # `seaweedfs-ovh-ssd`, in sc-seaweedfs-ovh.yaml -- same name, same
    # provisioner/volumeBindingMode as the chart would have produced, plus
    # allowedTopologies. See that file for the topology rationale.
    storageClassName: ""

    # Node label keys the driver reports as each node's CSI accessible_topology
    # (NodeGetInfo) and that csi-provisioner requires to honour StorageClass
    # allowedTopologies (--feature-gates=Topology=true, gated on this being
    # non-empty). Picks up seaweedfs/seaweedfs-csi-driver#301 (merged to master
    # 2026-08-26, released v1.4.30): before this, NodeGetInfo reported no
    # topology at all and CSINode showed topologyKeys=null for every node, so
    # nothing stopped the scheduler from placing a seaweedfs-ovh*-PVC pod on a
    # non-OVH node (cluster/k8s/kyverno/policies/ formerly carried a
    # pin-seaweedfs-ovh-consumers ClusterPolicy working around exactly this,
    # now removed in favor of the StorageClasses' own allowedTopologies).
    # `topology.kubernetes.io/zone` matches the node label OVH nodes actually
    # carry (cluster/terraform/main/ovh-nodes.tf nodeLabels, value "hil-ovh")
    # and what sc-seaweedfs-ovh*.yaml's allowedTopologies matches on.
    topologyKeys: ["topology.kubernetes.io/zone"]

    # Bound the per-mount in-memory write buffer. `weed mount` accumulates dirty
    # pages as chunks of -chunkSizeLimitMB (2MB) and allocates a new in-memory one
    # only while `memChunkCounter < 4*writableChunkLimit`
    # (weed/mount/page_writer/upload_pipeline.go), where writableChunkLimit is
    # exactly this value; past that, chunks spill to the on-disk swap file under
    # -cacheDir. So the ceiling is 4 x concurrentWriters x 2MB *per weed-mount
    # process*, and the mount pod runs one such process per PVC on the node --
    # at the default 128 that is 1GiB each, unbounded in aggregate.
    #
    # 64 -> 512MiB/process. The busiest mount observed held ~245Mi of Go heap
    # (~122 chunks); 64 allows 256 chunks, ~2x that. Dropping to 32 would cap at
    # 128 chunks, i.e. right at the observed working set, pushing a normally-loaded
    # mount onto the disk swap path for no benefit.
    #
    # The knob that would bound this properly is `weed mount -writeBufferSizeMB`
    # (a real accountant with a disk evictor, weed/mount/weedfs.go). The CSI driver
    # does not pass it -- it is absent from buildMountArgs' argsMap on v1.4.30,
    # so it is unreachable without an upstream change.
    #
    # NOTE: GOMEMLIMIT is not an alternative here. The env var is inherited by every
    # forked weed-mount child and applied per process, so a pod-level budget divided
    # by a child count that varies with PVC scheduling has no correct static value.
    #
    # Rollout: this is a top-level chart value and lands as --concurrentWriters on
    # the *node* DaemonSet (templates/daemonset.yaml), which is RollingUpdate -- so
    # it rolls on apply. That is safe: the node plugin serves CSI RPCs and holds no
    # FUSE mounts (those are in the mount DaemonSet), so the only window is a few
    # seconds per node where NodeStage/NodePublish is unavailable and a starting pod
    # retries. The node plugin builds the mount args and sends them to the mount
    # service per volume, so the new value applies to newly staged volumes; volumes
    # already mounted keep 128 until their weed-mount process restarts.
    concurrentWriters: 64

    # Keep the image tags explicit and in sync with the source tag so the
    # deployed plugin and mount-service versions are auditable.
    seaweedfsCsiPlugin:
      image: chrislusf/seaweedfs-csi-driver
      tag: v1.4.30

    # Restrict the FUSE mount service + CSI node daemons to OVH kimsufi
    # nodes. Pods consuming seaweedfs-ovh PVCs must schedule on OVH; we
    # don't want phantom daemonsets on non-OVH nodes until we know the backend
    # is suitable.
    mountService:
      enabled: true
      image: chrislusf/seaweedfs-mount
      tag: v1.4.30
      # QoS / eviction protection. Without requests this pod is BestEffort: the
      # kubelet's first eviction target and the kernel OOM-killer's first victim
      # (max oom_score_adj) under node memory pressure. It holds the weed-mount
      # FUSE processes for every SeaweedFS volume on the node, so its death is
      # catastrophic and silent -- consumers keep a dead mount ("transport
      # endpoint is not connected") while their own readiness stays green. That
      # is exactly how it died on 2026-08-23, breaking ~half of all git for
      # ~14.5h (agentydragon/ducktape#4616). No CPU limit (never throttle the
      # live data path). priorityClassName (system-node-critical, chart default)
      # already shields from preemption and defers eviction in the priority sort.
      #
      # Sized on measured usage, not estimate. A pod's footprint scales with the
      # number of PVCs the scheduler put on its node (one weed-mount process
      # each), so the busiest node is the one that matters -- 6 mounts on
      # ovh-ns104952, over 30d: p50 434Mi, p90 607Mi, p99 705Mi, max 1728Mi.
      #   - request 640Mi: above that p90, so kubelet node-pressure eviction
      #     ranks it last. (The previous 384Mi predates this measurement and was
      #     below the busiest node's *median*.)
      #   - limit 2Gi: the observed 1728Mi peak was taken under the old
      #     concurrentWriters=128 ceiling, so halving that should keep a 6-mount
      #     node near ~1.2GiB -- but that is an estimate, and a limit reserves
      #     nothing. For a pod whose death silently breaks every volume on the
      #     node, headroom is the right trade.
      resources:
        requests:
          cpu: 100m
          memory: 640Mi
        limits:
          memory: 2Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["hil-ovh"]
      # ovh-ns103656 is a control plane carrying the control-plane NoSchedule
      # taint, and the nodeAffinity above already admits it (it is hil-ovh).
      # Without a matching toleration that node serves SeaweedFS but cannot
      # mount it: seaweedfs-volume-hdd-2 runs there and already tolerates this
      # taint, yet the node's CSINode advertises no seaweedfs-csi-driver, so a
      # CP-tolerating pod with a SeaweedFS PVC hangs in ContainerCreating.
      # Not an etcd-contention risk -- etcd rides the install disk and SeaweedFS
      # the separate data disk, which is why
      # <cluster/docs/lessons_learned/2026_06_19_etcd_hdd_io_contention.md> kept
      # SeaweedFS on /dev/sdb and pinned only ephemeral-write batch jobs off the
      # control planes. Measured on ovh-ns103656: the mount pod writes ~0.8 KiB/s
      # to the install disk (6.0 GiB over 85 days, logs + FUSE metadata) against
      # the 490-988 KiB/s writers that RCA actually pinned off.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    node:
      enabled: true
      # BestEffort -> Burstable so the CSI node plugin (NodeStage/NodePublish,
      # the path that mounts volumes into pods) isn't an early eviction/OOM
      # target either. Steady state ~40Mi; see mountService above and #4616.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["hil-ovh"]
      # Control-plane toleration; rationale under mountService above.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    controller:
      replicas: 1
      # BestEffort -> Burstable; provisioning/attach path (not the live data
      # path, but no reason to leave it first-to-evict). Steady state ~85Mi.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["hil-ovh"]
      # Control-plane toleration; rationale under mountService above.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
