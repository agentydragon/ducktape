apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-csi-driver
  namespace: seaweedfs-csi-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: deploy/helm/seaweedfs-csi-driver
      sourceRef:
        kind: GitRepository
        name: seaweedfs-csi-driver
        namespace: flux-system
  values:
    seaweedfsFiler: "seaweedfs-filer.seaweedfs.svc.cluster.local:8888"
    storageClassName: seaweedfs-ovh
    storageClassVolumeBindingMode: WaitForFirstConsumer

    # Chart appVersion (v1.4.15) doesn't exist on Docker Hub yet; pin both
    # plugin and mount-service images to the latest published tag.
    seaweedfsCsiPlugin:
      image: chrislusf/seaweedfs-csi-driver
      tag: v1.4.14

    # Restrict the FUSE mount service + CSI node daemons to OVH kimsufi
    # nodes. Pods consuming seaweedfs-ovh PVCs must schedule on OVH; we
    # don't want phantom daemonsets on non-OVH nodes until we know the backend
    # is suitable.
    mountService:
      enabled: true
      image: chrislusf/seaweedfs-mount
      tag: v1.4.14
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["hil-ovh"]

    node:
      enabled: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["hil-ovh"]

    controller:
      replicas: 1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["hil-ovh"]
