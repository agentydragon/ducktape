apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: seaweedfs-ovh
  annotations:
    description: >-
      SeaweedFS CSI (RWX, distributed), media-blind (HDD bulk). Default for app
      data volumes. See sc-seaweedfs-ovh-ssd.yaml for the SSD-pinned tier.
provisioner: seaweedfs-csi-driver
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
# See sc-seaweedfs-ovh-ssd.yaml's allowedTopologies comment for the rationale
# (identical here).
allowedTopologies:
  - matchLabelExpressions:
      - key: topology.kubernetes.io/zone
        values: ["hil-ovh"]
allowVolumeExpansion: true
