apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-index-read-token
  namespace: agentplane-index
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentplane-index-read-token
  namespace: agentplane-index
spec:
  refreshPolicy: CreatedOnce
  target:
    name: agentplane-index-read-token
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agentplane-index-read-token
