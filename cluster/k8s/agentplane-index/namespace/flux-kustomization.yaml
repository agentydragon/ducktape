apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-index-namespace
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  path: ./cluster/k8s/agentplane-index/namespace
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
