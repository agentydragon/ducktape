apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: "Complete Agentplane repository-index service: namespace, ESO credentials, CNPG databases, and both index workers."
  name: agentplane-index
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: cnpg
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
    - name: ollama
      namespace: ducktape-flux
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      current: has(status.applied) && status.applied && has(status.observedGeneration) && status.observedGeneration == metadata.generation && has(status.extensions) && status.extensions.exists(e, e.name == 'vector' && e.applied)
      kind: Database
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: agentplane-index
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: agentplane-index-db
      namespace: agentplane-index
    - apiVersion: apps/v1
      kind: Deployment
      name: ducktape
      namespace: agentplane-index
  interval: 10m
  path: ./cluster/k8s/agentplane-index
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: agentplane-index
    namespace: ducktape-flux
  timeout: 10m
  wait: false
