apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: Single-repository semantic indexes for ducktape and haku-state.
  labels:
    goldilocks.fairwinds.com/enabled: "false"
    name: agentplane-index
    rbac.ducktape.io/agent-readable-logs: "true"
  name: agentplane-index
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-index-read-token
  namespace: agentplane-index
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentplane-index-read-token
  namespace: agentplane-index
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agentplane-index-read-token
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Owner
    name: agentplane-index-read-token
    template:
      data:
        token: "{{ .password }}"
      type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: agentplane-index
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: agentplane-index-db
  namespace: agentplane-index
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: ducktape
      owner: indexer
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  monitoring:
    enablePodMonitor: true
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 20Gi
    storageClass: local-path-ovh-ssd
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: agentplane-index-ducktape
  namespace: agentplane-index
spec:
  cluster:
    name: agentplane-index-db
  databaseReclaimPolicy: retain
  extensions:
    - ensure: present
      name: vector
  name: ducktape
  owner: indexer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ducktape
  namespace: agentplane-index
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  name: ducktape
  namespace: agentplane-index
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ducktape
      app.kubernetes.io/name: agentplane-index
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ducktape
        app.kubernetes.io/name: agentplane-index
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: agentplane-index-db-app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: agentplane-index-db-app
            - name: AGENTPLANE_INDEX_DATABASE_URL
              value: postgresql+asyncpg://$(DB_USERNAME):$(DB_PASSWORD)@agentplane-index-db-rw.agentplane-index.svc/ducktape
            - name: AGENTPLANE_INDEX_REPOSITORY_URL
              value: https://github.com/agentydragon/ducktape.git
            - name: AGENTPLANE_INDEX_BRANCH
              value: devel
            - name: AGENTPLANE_INDEX_IGNORE
              value: |
                props/specimens/
                *.gz
            - name: AGENTPLANE_INDEX_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: agentplane-index-read-token
          envFrom:
            - configMapRef:
                name: agentplane-index-config
          image: git.allegedly.works/ducktape-ci/agentplane-index:unset
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          name: index
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /var/lib/agentplane-index
              name: repository
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/region: hil
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ducktape
      volumes:
        - emptyDir:
            sizeLimit: 4Gi
          name: repository
---
apiVersion: v1
kind: Service
metadata:
  name: ducktape
  namespace: agentplane-index
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/instance: ducktape
    app.kubernetes.io/name: agentplane-index
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
