apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-index-app
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/agentplane-index/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: agentplane-index-db
      namespace: ducktape-flux
    - name: agentplane-index-secrets
      namespace: ducktape-flux
    - name: agentplane-index-sources
      namespace: ducktape-flux
    - name: ollama
      namespace: ducktape-flux
