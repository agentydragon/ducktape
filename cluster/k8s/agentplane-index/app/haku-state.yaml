apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-state
  namespace: agentplane-index
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-state
  namespace: agentplane-index
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplane-index
      app.kubernetes.io/instance: haku-state
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-index
        app.kubernetes.io/instance: haku-state
    spec:
      serviceAccountName: haku-state
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/region: hil
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: index
          image: git.allegedly.works/ducktape-ci/agentplane-index:devel-20260911011107-7e211be # {"$imagepolicy": "flux-system:agentplane-index"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: agentplane-index-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: agentplane-index-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentplane-index-db-app
                  key: password
            - name: AGENTPLANE_INDEX_DATABASE_URL
              value: postgresql+asyncpg://$(DB_USERNAME):$(DB_PASSWORD)@agentplane-index-db-rw.agentplane-index.svc/haku_state
            - name: AGENTPLANE_INDEX_SOURCE_NAME
              value: agentplane-index-haku-state
            - name: AGENTPLANE_INDEX_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentplane-index-read-token
                  key: token
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: haku-state
  namespace: agentplane-index
spec:
  selector:
    app.kubernetes.io/name: agentplane-index
    app.kubernetes.io/instance: haku-state
  ports:
    - name: http
      port: 8080
      targetPort: http
