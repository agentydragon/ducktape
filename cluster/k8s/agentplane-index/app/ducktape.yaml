apiVersion: v1
kind: ServiceAccount
metadata:
  name: ducktape
  namespace: agentplane-index
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ducktape
  namespace: agentplane-index
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplane-index
      app.kubernetes.io/instance: ducktape
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-index
        app.kubernetes.io/instance: ducktape
    spec:
      serviceAccountName: ducktape
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/region: hil
      # The worker reads its repository itself; nothing here talks to the API server.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: index
          image: git.allegedly.works/ducktape-ci/agentplane-index:devel-20260912113031-12cdb93 # {"$imagepolicy": "flux-system:agentplane-index"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: agentplane-index-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: agentplane-index-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentplane-index-db-app
                  key: password
            - name: AGENTPLANE_INDEX_DATABASE_URL
              value: postgresql+asyncpg://$(DB_USERNAME):$(DB_PASSWORD)@agentplane-index-db-rw.agentplane-index.svc/ducktape
            - name: AGENTPLANE_INDEX_REPOSITORY_URL
              value: https://github.com/agentydragon/ducktape.git
            - name: AGENTPLANE_INDEX_BRANCH
              value: devel
            # gitignore syntax. Specimens duplicate code indexed at its real path; the .gz
            # reference blobs are not text and would only cost the clone read.
            - name: AGENTPLANE_INDEX_IGNORE
              value: |
                props/specimens/
                *.gz
            - name: AGENTPLANE_INDEX_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentplane-index-read-token
                  key: token
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: repository
              mountPath: /var/lib/agentplane-index
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
      volumes:
        # A bare clone, fetched incrementally; a pod restart re-clones once.
        - name: repository
          emptyDir:
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ducktape
  namespace: agentplane-index
spec:
  selector:
    app.kubernetes.io/name: agentplane-index
    app.kubernetes.io/instance: ducktape
  ports:
    - name: http
      port: 8080
      targetPort: http
