apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: agentplane-index-db
  namespace: agentplane-index
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  probes:
    liveness:
      isolationCheck:
        enabled: false
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  storage:
    storageClass: local-path-ovh-ssd
    size: 20Gi
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: ducktape
      owner: indexer
      # CNPG owns Secret agentplane-index-db-app (username/password).
