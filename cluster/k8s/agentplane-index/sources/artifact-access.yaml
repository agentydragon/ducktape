apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agentplane-index-artifacts
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: source-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentplane-index
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agentplane-index
      ports:
        - protocol: TCP
          port: 9090
