apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-index-sources
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/agentplane-index/sources
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: agentplane-index-namespace
      namespace: ducktape-flux
    - name: haku-state
      namespace: ducktape-flux
