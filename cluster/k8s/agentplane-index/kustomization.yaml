apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - agentplane-index.k8s.yaml
components:
  - ./image-pins
configMapGenerator:
  - name: agentplane-index-config
    namespace: agentplane-index
    literals:
      - AGENTPLANE_INDEX_CHECKOUT_DIR=/var/lib/agentplane-index/repository
      - AGENTPLANE_INDEX_GIT_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - AGENTPLANE_INDEX_EMBEDDING_URL=http://ollama.ollama.svc.cluster.local:11434/v1
      - AGENTPLANE_INDEX_EMBEDDING_MODEL=qwen3-embedding:4b
      - AGENTPLANE_INDEX_EMBEDDING_API_KEY=ollama
      - |-
        AGENTPLANE_INDEX_QUERY_INSTRUCTION="Instruct: Given a search query, retrieve relevant passages that answer the query
        Query: "
      - AGENTPLANE_INDEX_EMBEDDING_TIMEOUT_SECONDS=120
