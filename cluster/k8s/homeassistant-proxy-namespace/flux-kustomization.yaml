apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homeassistant-proxy-namespace
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/homeassistant-proxy-namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: homeassistant-proxy
