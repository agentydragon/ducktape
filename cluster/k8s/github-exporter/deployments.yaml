apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-exporter-agentydragon
  namespace: monitoring
  labels:
    app.kubernetes.io/name: github-exporter
    app.kubernetes.io/component: quota
    github_account: agentydragon
  annotations:
    description: GitHub API rate-limit exporter for the agentydragon account.
    secret.reloader.stakater.com/reload: github-exporter-agentydragon-token
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: github-exporter
      app.kubernetes.io/component: quota
      github_account: agentydragon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-exporter
        app.kubernetes.io/component: quota
        github_account: agentydragon
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: githubexporter/github-exporter:v2.3.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: GITHUB_TOKEN_FILE
              value: /var/run/secrets/github/token
            - name: GITHUB_RATE_LIMIT_ENABLED
              value: "true"
            - name: FETCH_REPO_RELEASES_ENABLED
              value: "false"
            - name: LISTEN_PORT
              value: "9171"
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 9171
              protocol: TCP
          volumeMounts:
            - name: github-token
              mountPath: /var/run/secrets/github
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: github-token
          secret:
            secretName: github-exporter-agentydragon-token
            defaultMode: 0440
            items:
              - key: token
                path: token
---
