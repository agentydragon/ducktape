apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secrets.yaml
  - deployments.yaml
  - services.yaml
  - servicemonitor.yaml
  - graphql-deployments.yaml
  - graphql-services.yaml
  - graphql-servicemonitor.yaml
  - dashboard.yaml

configMapGenerator:
  - name: github-exporter-dashboard
    namespace: monitoring
    files:
      - dashboard.json

configurations:
  - kustomizeconfig
