# The exporter receives a namespace-local copy of the centralized
# agentydragon-agent PAT through the resource-scoped SecretStore owned by
# external-creds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-exporter-agentydragon-agent-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: github-agentydragon-agent
  target:
    name: github-exporter-agentydragon-agent-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: token
      remoteRef:
        key: github-agentydragon-agent
        property: token
