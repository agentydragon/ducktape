# The exporter receives a namespace-local copy of the centralized
# agentydragon-agent PAT through its source-approved credential edge.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-agentydragon-agent-reader
  namespace: monitoring
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: github-agentydragon-agent
  namespace: monitoring
spec:
  provider:
    kubernetes:
      server:
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt }
      auth:
        serviceAccount:
          name: github-agentydragon-agent-reader
      remoteNamespace: ducktape-flux
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-exporter-agentydragon-agent-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: github-agentydragon-agent
  target:
    name: github-exporter-agentydragon-agent-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: token
      remoteRef:
        key: github-agentydragon-agent
        property: token
