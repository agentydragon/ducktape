# The exporter receives copies of the two canonical SOPS Secrets through
# namespace-local, resource-scoped Kubernetes-provider SecretStores. This
# avoids widening a shared ClusterSecretStore to the whole monitoring namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-exporter-secret-reader
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-exporter-agentydragon-secret-reader
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["github-secrets-sync-pat"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-exporter-agentydragon-secret-reader
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-exporter-agentydragon-secret-reader
subjects:
  - kind: ServiceAccount
    name: github-exporter-secret-reader
    namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-exporter-agentydragon-agent-secret-reader
  namespace: claude-sandbox
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["github-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-exporter-agentydragon-agent-secret-reader
  namespace: claude-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-exporter-agentydragon-agent-secret-reader
subjects:
  - kind: ServiceAccount
    name: github-exporter-secret-reader
    namespace: monitoring
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: github-exporter-agentydragon
  namespace: monitoring
  annotations:
    description: Scoped ESO store for the agentydragon GitHub quota exporter token.
spec:
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: github-exporter-secret-reader
          namespace: monitoring
      remoteNamespace: flux-system
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: github-exporter-agentydragon-agent
  namespace: monitoring
  annotations:
    description: Scoped ESO store for the agentydragon-agent GitHub quota exporter token.
spec:
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: github-exporter-secret-reader
          namespace: monitoring
      remoteNamespace: claude-sandbox
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-exporter-agentydragon-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: github-exporter-agentydragon
  target:
    name: github-exporter-agentydragon-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: token
      remoteRef:
        key: github-secrets-sync-pat
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-exporter-agentydragon-agent-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: github-exporter-agentydragon-agent
  target:
    name: github-exporter-agentydragon-agent-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: token
      remoteRef:
        key: github-token
        property: token
