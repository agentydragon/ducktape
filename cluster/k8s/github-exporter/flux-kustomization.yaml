apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: GitHub API rate-limit metrics for the human and agent accounts.
  name: github-exporter
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: forgejo-images
      namespace: ducktape-flux
    - name: monitoring-namespace
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
    - name: grafana-instance
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: external-creds
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: github-exporter-agentydragon-token
      namespace: monitoring
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: github-exporter-agentydragon-agent-token
      namespace: monitoring
    - apiVersion: apps/v1
      kind: Deployment
      name: github-exporter-agentydragon
      namespace: monitoring
    - apiVersion: apps/v1
      kind: Deployment
      name: github-exporter-agentydragon-agent
      namespace: monitoring
  interval: 10m
  path: ./cluster/k8s/github-exporter
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: github-exporter
    namespace: ducktape-flux
  timeout: 5m
  wait: true
