apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: evidence-market-roster
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/evidence/market-roster
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: evidence-namespace
