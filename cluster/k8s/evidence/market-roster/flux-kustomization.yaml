apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: evidence-market-roster
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/evidence/market-roster
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: evidence-market-roster
    namespace: ducktape-flux
  timeout: 2m
  dependsOn:
    - name: evidence-namespace
