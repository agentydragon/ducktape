apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: evidence-market-roster
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/evidence
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: evidence-market-roster
    namespace: ducktape-flux
  timeout: 2m
  wait: true
