apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coredns-custom
  namespace: ducktape-flux
spec:
  interval: 10m0s
  path: ./cluster/k8s/coredns-custom
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: coredns-custom
    namespace: ducktape-flux
  timeout: 5m
  wait: true
