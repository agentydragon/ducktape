apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # cdk8s-generated (cluster/cdk8s/tana_mcp.py) -- see cluster/docs/cdk8s.md.
  - tana-mcp.k8s.yaml
  - tana-firebase-refresh-token.sops.yaml
  # Hand-written: no RedisReplication or PrometheusRule binding exists for cdk8s.
  - facade-valkey-ovh-instance.yaml
  - facade-prometheusrule.yaml
components:
  - ./image-pins
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: tana-mcp-nginx-config
    namespace: tana-mcp
    files:
      - default.conf=nginx-auth-proxy.conf
