apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - forgejo-images-creds-eso.yaml
  - namespace.yaml
  - external-creds-reader.yaml
  - tana-pat-eso.yaml
  - tana-firebase-refresh-token-eso.yaml
  - firebase-resigner-config.yaml
  - deployment.yaml
  - service.yaml
  - firebase-resigner-service-account.yaml
  - facade-configmap.yaml
  - facade-deployment.yaml
  - facade-httproute.yaml
  - facade-service.yaml
  - facade-valkey-ovh-instance.yaml
  - facade-servicemonitor.yaml
  - facade-prometheusrule.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: tana-mcp-nginx-config
    namespace: tana-mcp
    files:
      - default.conf=nginx-auth-proxy.conf
