apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: tana-mcp
  annotations:
    description: ESO referent identity for credentials approved by external-creds.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tana-agentydragon-gmail-com-account-pat
  namespace: tana-mcp
  annotations:
    description: ESO copy of the canonical Tana PAT from external-creds.
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  data:
    - secretKey: token
      remoteRef:
        key: tana-agentydragon-gmail-com-account-pat
        property: token
  target:
    name: tana-agentydragon-gmail-com-account-pat
    creationPolicy: Owner
    deletionPolicy: Retain
