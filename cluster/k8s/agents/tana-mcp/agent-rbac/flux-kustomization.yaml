apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tana-mcp-agent-rbac
  namespace: flux-system
  annotations:
    description: Agent RBAC for tana-mcp namespace. Lightweight — only RoleBindings. Depends on namespace existing + claude-rbac for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/agents/tana-mcp/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: tana-mcp
    - name: claude-rbac
