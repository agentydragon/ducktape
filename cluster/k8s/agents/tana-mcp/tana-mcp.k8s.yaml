apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "true"
    goldilocks.fairwinds.com/vpa-update-mode: auto
    rbac.ducktape.io/agent-readable-logs: "true"
  name: tana-mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    description: ESO referent identity for credentials approved by external-creds.
  name: external-creds-reader
  namespace: tana-mcp
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    description: ESO copy of the canonical Tana PAT from external-creds.
  name: tana-agentydragon-gmail-com-account-pat
  namespace: tana-mcp
spec:
  data:
    - remoteRef:
        key: tana-agentydragon-gmail-com-account-pat
        property: token
      secretKey: token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: tana-agentydragon-gmail-com-account-pat
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: tana-mcp
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tana-firebase-resigner-config
  namespace: tana-mcp
data:
  API_KEY: AIzaSyA9LtJM6Ga9VAwCfj9w_mNORdOaq2yLshQ
  FETCH_CUSTOM_TOKEN_URL: https://app.tana.inc/functions/fetchCustomToken
  HEALTHY_POLL_SECONDS: "60.0"
  REQUEST_TIMEOUT_SECONDS: "30.0"
  RESEED_URL: http://127.0.0.1:9090/reseed
  SECRET_KEY: refresh_token
  SECRET_NAME: tana-firebase-refresh-token
  SECRET_NAMESPACE: tana-mcp
  TANA_HEALTH_URL: http://127.0.0.1:8262/health
  TANA_MCP_URL: http://127.0.0.1:8262/mcp
  UNHEALTHY_POLL_SECONDS: "5.0"
  UNHEALTHY_THRESHOLD: "3"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tana-firebase-resigner
  namespace: tana-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tana-firebase-resigner
  namespace: tana-mcp
rules:
  - apiGroups:
      - ""
    resourceNames:
      - tana-firebase-refresh-token
    resources:
      - secrets
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tana-firebase-resigner
  namespace: tana-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tana-firebase-resigner
subjects:
  - kind: ServiceAccount
    name: tana-firebase-resigner
    namespace: tana-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: tana-mcp
  name: tana-mcp
  namespace: tana-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tana-mcp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tana-mcp
    spec:
      containers:
        - env:
            - name: RESOLUTION
              value: 1280x800x24
          image: git.allegedly.works/ducktape-ci/tana-desktop:unset
          livenessProbe:
            exec:
              command:
                - /usr/bin/curl
                - --fail
                - --silent
                - http://127.0.0.1:8262/health
            failureThreshold: 5
            periodSeconds: 30
          name: tana-desktop
          ports:
            - containerPort: 8262
              name: mcp
              protocol: TCP
            - containerPort: 6080
              name: novnc
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /usr/bin/curl
                - --fail
                - --silent
                - http://127.0.0.1:8262/health
            periodSeconds: 15
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 200m
              memory: 1Gi
          startupProbe:
            exec:
              command:
                - /usr/bin/curl
                - --fail
                - --silent
                - http://127.0.0.1:8262/health
            failureThreshold: 120
            periodSeconds: 10
          volumeMounts:
            - mountPath: /home/tana/.config/tana
              name: tana-config
        - image: nginx:alpine
          livenessProbe:
            httpGet:
              path: /health
              port: 8263
            periodSeconds: 30
          name: proxy
          ports:
            - containerPort: 8263
              name: mcp-proxy
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8263
            periodSeconds: 10
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - mountPath: /etc/nginx/conf.d
              name: nginx-config
              readOnly: true
        - env:
            - name: PAT
              valueFrom:
                secretKeyRef:
                  key: token
                  name: tana-agentydragon-gmail-com-account-pat
          envFrom:
            - configMapRef:
                name: tana-firebase-resigner-config
          image: git.allegedly.works/ducktape-ci/tana-firebase-resigner:unset
          name: firebase-resigner
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      serviceAccountName: tana-firebase-resigner
      volumes:
        - emptyDir: {}
          name: tana-config
        - configMap:
            name: tana-mcp-nginx-config
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: tana-mcp
  namespace: tana-mcp
spec:
  ports:
    - name: mcp-proxy
      port: 8263
      protocol: TCP
      targetPort: mcp-proxy
    - name: novnc
      port: 6080
      protocol: TCP
      targetPort: novnc
  selector:
    app.kubernetes.io/name: tana-mcp
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tana-mcp-facade-config
  namespace: tana-mcp
data:
  FASTMCP_ENABLE_RICH_LOGGING: "false"
  FASTMCP_LOG_LEVEL: INFO
  FORWARDED_ALLOW_IPS: 10.42.0.0/16,10.244.0.0/16,127.0.0.1
  MCP_FACADE_AUTH__OIDC_ISSUER: https://auth.allegedly.works/application/o/tana-mcp-facade/
  MCP_FACADE_AUTH__PUBLIC_BASE_URL: https://tana-mcp-facade.allegedly.works
  MCP_FACADE_FACADE_NAME: Tana MCP Facade
  MCP_FACADE_LOGGING__MCP_MESSAGES: "true"
  MCP_FACADE_LOGGING__MCP_PAYLOADS: "false"
  MCP_FACADE_LOGGING__MCP_PAYLOAD_LENGTH: "true"
  MCP_FACADE_PERSISTENCE__DB: "0"
  MCP_FACADE_PERSISTENCE__HOST: mcp-valkey-ovh-master.tana-mcp.svc.cluster.local
  MCP_FACADE_PERSISTENCE__KIND: valkey
  MCP_FACADE_UPSTREAM__KIND: http
  MCP_FACADE_UPSTREAM__URL: http://tana-mcp.tana-mcp.svc.cluster.local:8263/mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Public Authentik-backed MCP facade for Tana, running the shared mcp-oauth-facade image. Access is enforced by Authentik group membership; the server injects a static downstream PAT.
    goldilocks.fairwinds.com/vpa-resource-policy: |
      {"containerPolicies":[{"containerName":"server","minAllowed":{"cpu":"25m"},"controlledValues":"RequestsOnly"}]}
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: tana-mcp-facade
  name: tana-mcp-facade
  namespace: tana-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tana-mcp-facade
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tana-mcp-facade
    spec:
      containers:
        - env:
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client_id
                  name: tana-mcp-facade-oidc
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client_secret
                  name: tana-mcp-facade-oidc
            - name: MCP_FACADE_UPSTREAM__BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: tana-agentydragon-gmail-com-account-pat
          envFrom:
            - configMapRef:
                name: tana-mcp-facade-config
          image: git.allegedly.works/ducktape-ci/mcp-oauth-facade:unset
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            periodSeconds: 20
          name: server
          ports:
            - containerPort: 8765
              name: http
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          readinessProbe:
            failureThreshold: 4
            httpGet:
              path: /readyz
              port: 8765
            periodSeconds: 15
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 5
      imagePullSecrets:
        - name: forgejo-images-creds
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tana-mcp-facade
  namespace: tana-mcp
spec:
  hostnames:
    - tana-mcp-facade.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: tana-mcp-facade
          port: 8765
      timeouts:
        backendRequest: 60s
        request: 60s
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: tana-mcp-facade
  name: tana-mcp-facade
  namespace: tana-mcp
spec:
  ports:
    - name: http
      port: 8765
      protocol: TCP
      targetPort: 8765
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: metrics
  selector:
    app.kubernetes.io/name: tana-mcp-facade
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tana-mcp-facade
  namespace: tana-mcp
spec:
  endpoints:
    - path: /metrics
      port: metrics
      scrapeTimeout: 10s
  selector:
    matchLabels:
      app.kubernetes.io/name: tana-mcp-facade
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: kube-prometheus-stack
  name: tana-mcp-facade
  namespace: tana-mcp
spec:
  groups:
    - name: tana-mcp-facade
      rules:
        - alert: TanaMcpFacadeUpstreamDown
          annotations:
            description: |
              The upstream tools/list probe for facade {{ $labels.facade }} has been failing for >5m. Clients see no tools. For Tana this usually means the desktop renderer is rejecting the PAT (validateToken); check the firebase-resigner logs and the tana-mcp pod sign-in.
            summary: MCP facade {{ $labels.facade }} cannot reach its upstream
          expr: mcp_facade_upstream_up == 0
          for: 5m
          labels:
            severity: warning
        - alert: TanaMcpFacadeNoTools
          annotations:
            description: |
              Facade {{ $labels.facade }} reached its upstream but it advertised no tools for >5m. The upstream MCP server is up but empty.
            summary: MCP facade {{ $labels.facade }} reachable but exposes zero tools
          expr: mcp_facade_upstream_up == 1 and mcp_facade_upstream_tools == 0
          for: 5m
          labels:
            severity: warning
        - alert: TanaMcpFacadeProbeStale
          annotations:
            description: |
              No successful upstream probe for facade {{ $labels.facade }} in >10m (probe loop wedged or upstream persistently failing).
            summary: MCP facade {{ $labels.facade }} has no recent successful probe
          expr: time() - mcp_facade_upstream_last_success_timestamp_seconds > 600
          for: 5m
          labels:
            severity: warning
