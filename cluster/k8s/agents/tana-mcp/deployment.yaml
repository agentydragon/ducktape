apiVersion: apps/v1
kind: Deployment
metadata:
  name: tana-mcp
  namespace: tana-mcp
  labels:
    app.kubernetes.io/name: tana-mcp
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tana-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tana-mcp
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      serviceAccountName: tana-firebase-resigner
      containers:
        # Tana Desktop running under Xvfb with noVNC for graphical admin access
        - name: tana-desktop
          image: ghcr.io/agentydragon/tana-desktop:devel-20260603203137-5af6401 # {"$imagepolicy": "flux-system:tana-mcp"}
          ports:
            - name: mcp
              containerPort: 8262
              protocol: TCP
            - name: novnc
              containerPort: 6080
              protocol: TCP
          env:
            - name: RESOLUTION
              value: "1280x800x24"
          volumeMounts:
            - name: tana-config
              mountPath: /home/tana/.config/tana
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 4Gi
          # Tana only serves /health on loopback inside the container. Kubelet
          # httpGet probes target the pod IP, which stays unreachable even when
          # Tana is healthy, so probe from inside the container instead.
          # Generous startup probe: /health won't respond until Tana is logged in
          # and MCP server is enabled (done manually via noVNC).
          startupProbe:
            exec:
              command:
                - /usr/bin/curl
                - --fail
                - --silent
                - http://127.0.0.1:8262/health
            failureThreshold: 120
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /usr/bin/curl
                - --fail
                - --silent
                - http://127.0.0.1:8262/health
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /usr/bin/curl
                - --fail
                - --silent
                - http://127.0.0.1:8262/health
            periodSeconds: 15
        # nginx sidecar: rewrites Host/Origin to localhost so Tana's MCP server
        # accepts requests from cluster clients. Probe the proxy over HTTP so
        # readiness reflects the actual cluster-facing path on :8263, not just
        # that the port is open.
        - name: proxy
          image: nginx:alpine
          ports:
            - name: mcp-proxy
              containerPort: 8263
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8263
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8263
            periodSeconds: 10
        # firebase_resigner: when the in-pod Tana's Firebase session is dead
        # (probes /health on loopback), swap the SOPS-managed refresh token
        # for an ID token, mint a Tana custom token via the fetchCustomToken
        # Cloud Function, and deliver it to the desktop container's reseed
        # receiver as a tana://auth deep-link. See
        # cluster/docs/plans/tana_mcp_sane_signin.md.
        - name: firebase-resigner
          image: ghcr.io/agentydragon/tana-firebase-resigner:devel-20260826233144-738852a # {"$imagepolicy": "flux-system:tana-firebase-resigner"}
          env:
            - name: FIREBASE_API_KEY
              # Tana web bundle's REACT_APP_FIREBASE_API_KEY for project
              # tagr-prod. Firebase web API keys are public identifiers per
              # Google's docs, so this is config, not a secret.
              value: AIzaSyA9LtJM6Ga9VAwCfj9w_mNORdOaq2yLshQ
            - name: TARGET_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Server-held PAT: readiness then also requires that Tana's MCP
            # accepts it (POST /mcp initialize -> 200), so a renderer that
            # drifts off the matching account drives a re-sign instead of
            # silently leaving the facade serving zero tools.
            - name: TANA_PAT
              valueFrom:
                secretKeyRef:
                  name: tana-agentydragon-gmail-com-account-pat
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              # TODO(vpa-memory-audit): 128Mi -> 256Mi. VPA observed a 121Mi
              # request / 153Mi upper bound, i.e. already over the old limit.
              memory: 256Mi
      volumes:
        # Tana's ~/.config/tana is just workspace cache + Firebase auth
        # IndexedDB. Both are re-derivable on cold start: workspace from the
        # upstream Tana RTDB, Firebase session re-minted by the
        # firebase_resigner sidecar from the SOPS-managed refresh token. So
        # this can stay an emptyDir — see
        # cluster/docs/plans/tana_mcp_sane_signin.md.
        - name: tana-config
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: tana-mcp-nginx-config
