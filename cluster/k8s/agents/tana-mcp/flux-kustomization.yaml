apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tana-mcp
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: valkey
      namespace: ducktape-flux
    - name: agent-machine-access-tf
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: tana-mcp
      namespace: tana-mcp
    - apiVersion: apps/v1
      kind: Deployment
      name: tana-mcp-facade
      namespace: tana-mcp
  interval: 10m
  path: ./cluster/k8s/agents/tana-mcp
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: tana-mcp
    namespace: ducktape-flux
  timeout: 5m
  wait: true
