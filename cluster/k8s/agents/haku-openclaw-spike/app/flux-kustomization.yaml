apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-openclaw-spike-app
  namespace: ducktape-flux
  annotations:
    description: Isolated OpenClaw gateway using Claude Code subscription inference through the Haku credential proxy.
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/agents/haku-openclaw-spike/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: haku-openclaw-spike-namespace
    - name: haku-egress-proxy
      namespace: flux-system
    # Reflector mirrors forgejo-images-creds here; forgejo-images dependsOn
    # reflector, so this one entry covers the source secret and the mirror.
    - name: forgejo-images
      namespace: flux-system
    - name: flux-image-automation-forgejo
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: haku-openclaw-spike
      namespace: haku-openclaw-spike
