apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-openclaw-spike-app
  namespace: ducktape-flux
  annotations:
    description: Isolated OpenClaw gateway using Claude Code subscription inference through the Haku credential proxy.
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/agents/haku-openclaw-spike/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: haku-openclaw-spike-namespace
    - name: haku-egress-proxy
      namespace: ducktape-flux
    # forgejo-images-creds-eso.yaml extracts the source Secret from the
    # forgejo-images namespace, so it must exist first.
    - name: forgejo-images
      namespace: ducktape-flux
    - name: flux-image-automation-forgejo
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: haku-openclaw-spike
      namespace: haku-openclaw-spike
