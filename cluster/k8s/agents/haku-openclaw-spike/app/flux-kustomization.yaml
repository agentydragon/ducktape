apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Isolated OpenClaw gateway using Claude Code subscription inference through the Haku credential proxy.
  name: haku-openclaw-spike-app
  namespace: ducktape-flux
spec:
  deletionPolicy: Orphan
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: haku-openclaw-spike-namespace
    - name: haku-egress-proxy
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: flux-image-automation-forgejo
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: haku-openclaw-spike-backups
      namespace: haku-openclaw-spike
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: haku-openclaw-spike-backups
      namespace: haku-openclaw-spike
    - apiVersion: apps/v1
      kind: Deployment
      name: haku-openclaw-spike
      namespace: haku-openclaw-spike
  interval: 10m
  path: ./cluster/k8s/agents/haku-openclaw-spike/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: haku-openclaw-spike-app
    namespace: ducktape-flux
  timeout: 10m
  wait: true
