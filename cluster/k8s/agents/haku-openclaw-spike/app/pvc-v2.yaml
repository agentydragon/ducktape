apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: haku-openclaw-spike-state-v2
  namespace: haku-openclaw-spike
  annotations:
    description: >-
      Worker-local (optiplex SSD) replacement for the OpenClaw spike state,
      migrating it off the ovh-ns103656 HDD (which fell over under
      I/O contention with etcd+kubelet). WaitForFirstConsumer binds it on
      optiplex when the VolSync restore mover is created; it must not be mounted
      by the Deployment before the restore completes.
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-home-ssd
  resources:
    requests:
      # local-path does not enforce PVC requests as quotas; this request leaves
      # headroom for state growth on the worker's shared local storage.
      storage: 40Gi
