apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy-ingress.yaml
  - networkpolicy-egress.yaml

generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: haku-openclaw-spike-config
    namespace: haku-openclaw-spike
    files:
      - openclaw.json
      - claude.json
  # Separate ConfigMap for kubeconfig so it can be mounted at ~/.kube/config
  # where kubectl finds it by default, matching public-coder-agent's convention.
  # The source file is named kube-client-config because cluster/.gitignore
  # ignores `kubeconfig*` to keep terraform-generated cluster credentials out
  # of git; Bazel globs the filesystem rather than git, so it built fine locally
  # and CI -- which only has what is committed -- failed.
  - name: haku-openclaw-spike-kubeconfig
    namespace: haku-openclaw-spike
    files:
      - config=kube-client-config
