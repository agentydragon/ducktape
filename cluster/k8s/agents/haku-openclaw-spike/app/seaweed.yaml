apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: haku-openclaw-spike-backups
  namespace: haku-openclaw-spike
  annotations:
    description: Haku OpenClaw spike VolSync backup bucket.
spec:
  name: haku-openclaw-spike-backups
  # The physical bucket is populated; adopt it instead of creating a second
  # bucket during the Flux ownership handoff.
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  # Restic retention/pruning is managed by VolSync, not by Bucket deletion.
  reclaimPolicy: Retain
  access:
    - user: haku-openclaw-spike-backups
      actions: [Read, Write, List, Tagging]
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: haku-openclaw-spike-backups
  namespace: haku-openclaw-spike
  annotations:
    description: Haku OpenClaw spike VolSync SeaweedFS credentials.
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  # The IAM username is cluster-global. Without a same-namespace S3Identity,
  # the operator treats this as the existing identity named above.
  identityRef:
    name: haku-openclaw-spike-backups
  # Generate credentials directly where the VolSync SecretStore reads them.
  secretRef:
    name: haku-openclaw-spike-volsync-s3-credentials
    accessKeyField: AWS_ACCESS_KEY_ID
    secretKeyField: AWS_SECRET_ACCESS_KEY
  reclaimPolicy: Retain
---
# Permit only this app's tenant-local Bucket and S3Credentials to reference the
# SeaweedFS cluster in its namespace.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: haku-openclaw-spike
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: haku-openclaw-spike
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: haku-openclaw-spike
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
