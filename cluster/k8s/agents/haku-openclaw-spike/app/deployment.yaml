apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-openclaw-spike
  namespace: haku-openclaw-spike
  labels:
    app.kubernetes.io/name: haku-openclaw-spike
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-openclaw-spike
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-openclaw-spike
    spec:
      automountServiceAccountToken: false
      # State is on the worker-local state-v2 PVC. Exclude control-plane nodes so
      # the agent cannot move its I/O back onto the etcd/kubelet hosts.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      imagePullSecrets:
        - name: forgejo-images-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-state
          image: git.allegedly.works/ducktape-ci/haku-openclaw-spike:devel-20260904061451-7b384e6 # {"$imagepolicy": "flux-system:haku-openclaw-spike"}
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /home/openclaw/.openclaw /home/openclaw/.cache/npm /home/openclaw/.local
              cp /cfg/openclaw.json /home/openclaw/.openclaw/openclaw.json
              rm -f /home/openclaw/.openclaw/openclaw.json.last-good /home/openclaw/.openclaw/openclaw.json.bak*
              if [ ! -e /home/openclaw/.claude.json ]; then
                cp /cfg/claude.json /home/openclaw/.claude.json
              fi

              git config --global user.name haku
              git config --global user.email haku@allegedly.works
              umask 077
              cat > /home/openclaw/.netrc <<NETRC
              machine forgejo-http.forgejo
              login ${HAKU_GIT_USERNAME}
              password ${HAKU_GIT_PASSWORD}
              machine github.com
              login x-access-token
              password ${GH_PAT}
              NETRC

              # Bazel's downloader uses the JVM trust store rather than the
              # mounted system PEM bundle. Import the interception root into a
              # small workspace-owned store and point the Bazel server at it.
              truststore=/home/openclaw/egress-truststore.p12
              rm -f "$truststore"
              tmp="$(mktemp -d)"
              csplit -sz -f "$tmp/c" -b '%02d.pem' /etc/ssl/certs/ca-certificates.crt \
                '/-----BEGIN CERTIFICATE-----/' '{*}'
              for cert in "$tmp"/c*.pem; do
                if openssl x509 -noout -subject -in "$cert" 2>/dev/null \
                  | grep -q haku-egress-proxy-root-ca; then
                  keytool -importcert -noprompt -storepass changeit -storetype PKCS12 \
                    -keystore "$truststore" -alias haku-egress-proxy -file "$cert"
                fi
              done
              rm -rf "$tmp"
              #
              # rules_python shells out to a pip that trusts only its vendored
              # certifi, so the container also exports PIP_CERT and friends.
              # Repository rules inherit the pod environment anyway, but an
              # undeclared variable never enters a repo's marker file, so a
              # repository cached from a pre-fix TLS failure would keep serving
              # that failure; --repo_env ties the cached fetch to the trust
              # settings and refetches when they change.
              cat > /home/openclaw/.bazelrc <<BAZELRC
              startup --host_jvm_args=-Djavax.net.ssl.trustStore=$truststore
              startup --host_jvm_args=-Djavax.net.ssl.trustStorePassword=changeit
              startup --host_jvm_args=-Djavax.net.ssl.trustStoreType=PKCS12
              # Keep Bazel's output base + disk cache on the ephemeral /bazel-cache
              # emptyDir, never the persistent state PVC: a single agent run accreted
              # a 65G output base of regenerable build artifacts on the PVC before this
              # migration. Ephemeral means re-fetched per pod start, and the volume's
              # sizeLimit caps runaway growth (the enforcement gap in #4717).
              startup --output_user_root=/bazel-cache/output
              build --disk_cache=/bazel-cache/disk
              build --repo_env=SSL_CERT_FILE
              build --repo_env=REQUESTS_CA_BUNDLE
              build --repo_env=PIP_CERT
              BAZELRC
          env:
            - name: HOME
              value: /home/openclaw
            - name: CLAUDE_CODE_OAUTH_TOKEN
              value: sk-ant-oat01-proxy-haku-openclaw-placeholder
            - name: HAKU_GIT_USERNAME
              value: haku
            - name: HAKU_GIT_PASSWORD
              value: proxy-haku-forgejo-placeholder
            - name: GH_PAT
              value: proxy-github-placeholder
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /cfg
              readOnly: true
            - name: state
              mountPath: /home/openclaw
            - name: trust
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: openclaw
          image: git.allegedly.works/ducktape-ci/haku-openclaw-spike:devel-20260904061451-7b384e6 # {"$imagepolicy": "flux-system:haku-openclaw-spike"}
          env:
            - name: HOME
              value: /home/openclaw
            - name: NPM_CONFIG_PREFIX
              value: /home/openclaw/.local
            - name: NPM_CONFIG_CACHE
              value: /home/openclaw/.cache/npm
            - name: OPENCLAW_LOG_LEVEL
              value: debug
            # Authentik authenticates proxied browser traffic. Local backend
            # clients have no proxy identity headers, so use OpenClaw's
            # documented trusted-proxy local-password fallback.
            - name: OPENCLAW_GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-openclaw-spike-gateway-password
                  key: password
            # All four are non-secret placeholders. The dedicated iron-proxy
            # replaces them only in matching Authorization headers for their
            # exact destination hosts.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              value: sk-ant-oat01-proxy-haku-openclaw-placeholder
            # OpenClaw clears ambient Claude credentials by default so auth
            # profiles cannot accidentally inherit host credentials. This
            # deployment intentionally supplies its proxy-mediated OAuth token
            # through the environment, so preserve that one variable for the
            # managed Claude CLI child process.
            - name: OPENCLAW_LIVE_CLI_BACKEND_PRESERVE_ENV
              value: CLAUDE_CODE_OAUTH_TOKEN
            - name: HAKU_CONSOLE_TOKEN
              value: proxy-haku-console-placeholder
            - name: HAKU_GIT_USERNAME
              value: haku
            - name: HAKU_GIT_PASSWORD
              value: proxy-haku-forgejo-placeholder
            # Deliberately not GITHUB_TOKEN or GH_TOKEN: OpenClaw strips those
            # exact names from tool environments. Use this like a real token;
            # iron-proxy replaces it only in GitHub Authorization headers.
            - name: GH_PAT
              value: proxy-github-placeholder
            # Read-only kubeconfig mounted at ~/.kube/config where kubectl
            # finds it by default. Its token field is the placeholder above's
            # sibling: iron-proxy swaps in the real Authentik JWT for
            # kubeapi.allegedly.works only. The pod still has
            # automountServiceAccountToken: false -- there is no SA token here,
            # and this path grants exactly what RBAC binds to oidc-ksbx-groups:haku.
            - name: HAKU_STATE_REPO_URL
              value: http://forgejo-http.forgejo:3000/haku/haku-state.git
            - name: NODE_USE_ENV_PROXY
              value: "1"
            # Keep both cases: Node honors the uppercase variables, while
            # curl/libcurl (and therefore Git over plain HTTP) require the
            # lowercase form and intentionally ignore uppercase HTTP_PROXY.
            - name: HTTP_PROXY
              value: http://haku-openclaw-spike-proxy.haku-egress-proxy.svc.cluster.local:8181
            - name: HTTPS_PROXY
              value: http://haku-openclaw-spike-proxy.haku-egress-proxy.svc.cluster.local:8181
            - name: NO_PROXY
              value: 127.0.0.1,localhost
            - name: http_proxy
              value: http://haku-openclaw-spike-proxy.haku-egress-proxy.svc.cluster.local:8181
            - name: https_proxy
              value: http://haku-openclaw-spike-proxy.haku-egress-proxy.svc.cluster.local:8181
            - name: no_proxy
              value: 127.0.0.1,localhost
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-certificates.crt
            # Python is the other runtime that ignores the mounted system
            # bundle: pip trusts only its vendored certifi, and the hermetic
            # interpreter rules_python downloads carries its own OpenSSL whose
            # compiled-in CA path is not Debian's. Without these, every pip
            # fetch fails TLS against the egress proxy even though pypi.org and
            # files.pythonhosted.org are allowlisted -- which reads as "no route
            # to PyPI" rather than as a trust fault.
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: PIP_CERT
              value: /etc/ssl/certs/ca-certificates.crt
          ports:
            - name: gateway
              containerPort: 18789
          # Without this the Deployment reports 1/1 Running whenever a process
          # exists, which hid two different outages during the 2026.8.1 recovery:
          # a gateway crash-looping every ~4 minutes, and one that started but
          # never bound its port. /healthz answers 200 unauthenticated on a
          # serving gateway (/readyz and / are auth-gated at 403), so it checks
          # that the HTTP server is really handling requests, not just that
          # something holds the port.
          #
          # Readiness only, deliberately no liveness or startup probe: startup is
          # IO-bound on the state PVC and legitimately takes many minutes -- a
          # gateway on the OVH HDD was measured reading ~940 KB/s, hundreds of MB
          # in, still progressing. A restarting probe would kill that and never
          # let it finish. A failing readiness probe restarts nothing; it just
          # makes "not serving yet" visible, which is the whole point.
          readinessProbe:
            httpGet:
              path: /healthz
              port: gateway
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              # Provisional high limit after an earlier VPA memory observation;
              # investigate resident-memory growth before treating it as normal.
              memory: 16Gi
          volumeMounts:
            - name: config
              mountPath: /cfg
              readOnly: true
            # Kubeconfig at ~/.kube/config where kubectl finds it by default.
            # subPath is required because the PVC (volume 'state') owns /home/openclaw.
            - name: kubeconfig
              mountPath: /home/openclaw/.kube/config
              subPath: config
              readOnly: true
            # The complete home is persistent: OpenClaw state/workspace plus
            # Claude Code's native transcripts and resumable session metadata.
            - name: state
              mountPath: /home/openclaw
            # Ephemeral Bazel output base + disk cache (targeted by the init
            # bazelrc), kept off the persistent state volume.
            - name: bazel-cache
              mountPath: /bazel-cache
            - name: trust
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
            - name: tmp
              mountPath: /tmp
      nodeSelector:
        topology.kubernetes.io/region: home
      volumes:
        - name: config
          configMap:
            name: haku-openclaw-spike-config
        - name: kubeconfig
          configMap:
            name: haku-openclaw-spike-kubeconfig
        - name: state
          persistentVolumeClaim:
            claimName: haku-openclaw-spike-state-v2
        - name: trust
          configMap:
            name: haku-egress-proxy-ca-cert
        - name: tmp
          emptyDir: {}
        # Ephemeral, capped Bazel output base + disk cache -- deliberately NOT the
        # state PVC and NOT local-path (which enforces no size, #4717). sizeLimit
        # bounds the regenerable cache so a runaway build evicts the pod rather than
        # filling the node disk.
        - name: bazel-cache
          emptyDir:
            sizeLimit: 30Gi
