# Encrypted, deduplicated Restic snapshots of the OpenClaw spike state to its
# dedicated private SeaweedFS S3 bucket. Direct copies are crash-consistent.
#
# sourcePVC is the optiplex home worker PVC (state-v2, local-path-home-ssd). The
# Direct mover mounts that already-bound PVC, so the PV's own node affinity forces
# the mover (and its WaitForFirstConsumer cache) onto optiplex -- no explicit
# moverAffinity needed. (The restore side did pin its mover: its destination PVC
# was unbound, so the mover's placement is what chose the node.)
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: haku-openclaw-spike-state-restic
  namespace: haku-openclaw-spike
spec:
  sourcePVC: haku-openclaw-spike-state-v2
  trigger:
    # 03:23 UTC, away from interactive use and staggered from public-coder's 09:17.
    schedule: "23 03 * * *"
  restic:
    repository: haku-openclaw-spike-volsync-restic
    copyMethod: Direct
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    cacheStorageClassName: local-path-home-ssd
    cacheAccessModes: [ReadWriteOnce]
    cacheCapacity: 1Gi
    moverPodLabels:
      app.kubernetes.io/name: haku-openclaw-spike-volsync
    moverResources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
