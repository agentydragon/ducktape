# S3Credentials and the SOPS-managed Restic password create source Secrets in
# this namespace. ESO narrows its access to exactly those Secrets and renders
# the combined repository Secret VolSync requires.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-openclaw-spike-volsync-repository-reader
  namespace: haku-openclaw-spike
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haku-openclaw-spike-volsync-repository-reader
  namespace: haku-openclaw-spike
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - haku-openclaw-spike-volsync-s3
      - haku-openclaw-spike-volsync-restic-password
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haku-openclaw-spike-volsync-repository-reader
  namespace: haku-openclaw-spike
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haku-openclaw-spike-volsync-repository-reader
subjects:
  - kind: ServiceAccount
    name: haku-openclaw-spike-volsync-repository-reader
    namespace: haku-openclaw-spike
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: haku-openclaw-spike-volsync-s3
  namespace: haku-openclaw-spike
spec:
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: haku-openclaw-spike-volsync-repository-reader
          namespace: haku-openclaw-spike
      remoteNamespace: haku-openclaw-spike
