apiVersion: batch/v1
kind: CronJob
metadata:
  name: claude-jwt-rotation
  namespace: agents-infra
  annotations:
    description: >-
      Rotates the Claude Code web k8s bearer JWT. Runs hourly; rotate.sh
      sparse-clones the existing SOPS file, reads the unencrypted
      `expires_unencrypted` field (no decryption needed), and skips
      rotation if remaining validity > 24h. The plaintext expires_unencrypted
      is set from the JWT's own exp claim at write-time, so the freshness
      check is authoritative without expanding the file's decryption set
      to in-cluster keys. Authentik token is actually minted only every
      ~44 days (validity 45d − 1d threshold) but a failed rotation
      self-heals within an hour. Replaces claude-cert-rotation;
      see ../../../docs/lessons_learned/.
spec:
  schedule: "15 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: claude-jwt-rotator
          restartPolicy: OnFailure
          volumes:
            - name: authentik-client
              secret:
                secretName: kubectl-sandbox-client-credentials
            - name: github-pat
              secret:
                secretName: github-secrets-sync-pat
            - name: rotate-script
              configMap:
                name: claude-jwt-rotation-script
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              # Initial placeholder matching the ImagePolicy filterTags
              # regex (^devel-\d{14}-[0-9a-f]{7}$). Flux rewrites the field
              # to the latest published tag on first reconcile after a
              # push-images.yml CI run.
              image: ghcr.io/agentydragon/claude-jwt-rotation:devel-00000000000000-0000000 # {"$imagepolicy": "flux-system:claude-jwt-rotation"}
              command: ["/usr/bin/bash", "/scripts/rotate.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: authentik-client
                  mountPath: /var/run/secrets/authentik-client
                  readOnly: true
                - name: github-pat
                  mountPath: /var/run/secrets/github-pat
                  readOnly: true
                - name: rotate-script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
