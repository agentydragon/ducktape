apiVersion: batch/v1
kind: CronJob
metadata:
  name: claude-jwt-rotation
  namespace: agents-infra
  annotations:
    description: >-
      Rotates the Claude Code web k8s bearer JWT. Calls the Authentik
      `kubectl-sandbox-client-credentials` OAuth2 provider via client_credentials
      grant and commits the SOPS-encrypted JWT to git. Replaces the old
      claude-cert-rotation CronJob; see ../../../docs/lessons_learned/ for why.
spec:
  schedule: "0 0 1,15 * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: claude-jwt-rotator
          restartPolicy: OnFailure
          volumes:
            - name: authentik-client
              secret:
                secretName: kubectl-sandbox-client-credentials
            - name: github-pat
              secret:
                secretName: github-secrets-sync-pat
            - name: rotate-script
              configMap:
                name: claude-jwt-rotation-script
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              image: ghcr.io/agentydragon/claude-jwt-rotation:devel # {"$imagepolicy": "flux-system:claude-jwt-rotation"}
              command: ["/usr/bin/bash", "/scripts/rotate.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: authentik-client
                  mountPath: /var/run/secrets/authentik-client
                  readOnly: true
                - name: github-pat
                  mountPath: /var/run/secrets/github-pat
                  readOnly: true
                - name: rotate-script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
