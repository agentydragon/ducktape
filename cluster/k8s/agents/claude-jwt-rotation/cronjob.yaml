apiVersion: batch/v1
kind: CronJob
metadata:
  name: claude-jwt-rotation
  namespace: agents-infra
  annotations:
    description: >-
      Rotates the Claude Code web k8s bearer JWT. Runs hourly; rotate.sh
      sparse-clones the existing SOPS file, sops-decrypts it, and skips
      rotation if the JWT's exp claim has > 24h of validity remaining
      (and nbf is in the past). So an Authentik token is actually minted
      only every ~44 days (validity 45d − 1d threshold) but a failed
      rotation self-heals within an hour. Replaces claude-cert-rotation;
      see ../../../docs/lessons_learned/.
spec:
  schedule: "15 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: claude-jwt-rotator
          restartPolicy: OnFailure
          volumes:
            - name: authentik-client
              secret:
                secretName: kubectl-sandbox-client-credentials
            - name: github-pat
              secret:
                secretName: github-secrets-sync-pat
            - name: sops-age
              # Mirrored from flux-system/sops-age-cluster-secrets via reflector
              # annotations on the TF-managed source secret (see
              # cluster/terraform/main/persistent-auth.tf). Lets rotate.sh
              # sops-decrypt the existing JWT file to inspect its `exp`.
              secret:
                secretName: sops-age-cluster-secrets
            - name: rotate-script
              configMap:
                name: claude-jwt-rotation-script
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              # Initial placeholder matching the ImagePolicy filterTags
              # regex (^devel-\d{14}-[0-9a-f]{7}$). Flux rewrites the field
              # to the latest published tag on first reconcile after a
              # push-images.yml CI run.
              image: ghcr.io/agentydragon/claude-jwt-rotation:devel-00000000000000-0000000 # {"$imagepolicy": "flux-system:claude-jwt-rotation"}
              command: ["/usr/bin/bash", "/scripts/rotate.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: authentik-client
                  mountPath: /var/run/secrets/authentik-client
                  readOnly: true
                - name: github-pat
                  mountPath: /var/run/secrets/github-pat
                  readOnly: true
                - name: sops-age
                  mountPath: /var/run/secrets/sops-age
                  readOnly: true
                - name: rotate-script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
