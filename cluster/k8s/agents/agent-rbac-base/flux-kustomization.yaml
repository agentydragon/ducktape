apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Lightweight base for agent RBAC. Claude sandbox namespace + shared ClusterRoles. Must not depend on service or database kustomizations.
  name: claude-rbac
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: kyverno-policies
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: claude-sandbox
  interval: 10m
  path: ./cluster/k8s/agents/agent-rbac-base
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: claude-rbac
    namespace: ducktape-flux
  timeout: 2m
