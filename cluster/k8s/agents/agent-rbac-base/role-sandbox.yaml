apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-sandbox-admin
  namespace: claude-sandbox
rules:
  # Full access within claude-sandbox namespace (including secrets)
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/attach
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - events
    verbs: ["*"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["*"]

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["*"]

  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - clusters
      - publications
      - subscriptions
    verbs: ["*"]

  # Disposable agent workspaces (agents/agent-sandbox/): agents stamp and
  # dispose their own Sandboxes/claims; templates and warm pools stay
  # GitOps-owned but are readable/patchable like the rest of the namespace.
  - apiGroups: ["agents.x-k8s.io", "extensions.agents.x-k8s.io"]
    resources:
      - sandboxes
      - sandboxtemplates
      - sandboxclaims
      - sandboxwarmpools
    verbs: ["*"]
