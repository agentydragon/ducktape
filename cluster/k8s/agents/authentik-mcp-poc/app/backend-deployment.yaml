apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-mcp-poc-backend
  namespace: authentik-mcp-poc
  labels:
    app: authentik-mcp-poc
    component: backend
  annotations:
    description: "Whoami backend sitting behind the Authentik proxy outpost. Trusts X-Authentik-* headers injected by the outpost."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-mcp-poc
      component: backend
  template:
    metadata:
      labels:
        app: authentik-mcp-poc
        component: backend
    spec:
      # Don't auto-inject `<SERVICE>_PORT=tcp://...` env vars. The same-namespace
      # `authentik-mcp-poc-backend` Service injects
      # `AUTHENTIK_MCP_POC_BACKEND_PORT=tcp://10.x.x.x:8080`, which collides
      # with the `port: int` field on `BackendSettings` (env_prefix
      # `AUTHENTIK_MCP_POC_BACKEND_`) and crashes pydantic-settings on startup.
      enableServiceLinks: false
      containers:
        - name: backend
          image: ghcr.io/agentydragon/authentik-mcp-poc-backend:devel-20260413030152-e437889 # {"$imagepolicy": "flux-system:authentik-mcp-poc-backend"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
