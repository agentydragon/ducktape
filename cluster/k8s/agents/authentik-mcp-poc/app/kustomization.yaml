apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Namespace is owned by the sibling `namespace/` Kustomization (layer 1);
# the OIDC client-credentials secret is written into it by the sibling
# `tf/` Kustomization (layer 2). This `app/` Kustomization is layer 3 and
# only fills the namespace with the runtime objects.
resources:
  - server-deployment.yaml
  - server-service.yaml
  - server-httproute.yaml
  - backend-deployment.yaml
  - backend-service.yaml
