apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: squid-egress-spike-namespace
  namespace: ducktape-flux
spec:
  interval: 1h
  path: ./cluster/k8s/agents/squid-egress-spike/namespace
  prune: false
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 2m
