apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: squid-egress-spike-app
  namespace: ducktape-flux
  annotations:
    description: Squid ssl_bump spike — destination-scoped credential substitution, proxy-stamped identity, and memory caching, measured against a header-echoing origin.
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/agents/squid-egress-spike/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: squid-egress-spike-namespace
    - name: forgejo-images
      namespace: flux-system
    - name: flux-image-automation-forgejo
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: squid-spike
      namespace: squid-egress-spike
    - apiVersion: apps/v1
      kind: Deployment
      name: echo-origin
      namespace: squid-egress-spike
