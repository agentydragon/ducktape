apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plaid-db-mcp
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/agents/plaid-db-mcp/app
  prune: true
  wait: true
  dependsOn:
    - name: gateway
    - name: plaid-mcp-db
    - name: valkey
    - name: agent-machine-access-tf
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: plaid-db-mcp
      namespace: plaid-mcp
