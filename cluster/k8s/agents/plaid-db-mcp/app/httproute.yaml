apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plaid-db-mcp
  namespace: plaid-mcp
  annotations:
    description: "Authentik-gated Postgres MCP for querying the synced Plaid database through the read-only plaid_ro role."
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "plaid-db.allegedly.works"
  rules:
    - backendRefs:
        - name: plaid-db-mcp
          port: 8765
      timeouts:
        request: "60s"
        backendRequest: "60s"
