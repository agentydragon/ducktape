apiVersion: batch/v1
kind: Job
metadata:
  name: plaid-mcp-db-readonly-provisioner
  namespace: plaid-mcp
  annotations:
    description: "Applies read-only object GRANTs for plaid_ro after the CNPG cluster creates the role."
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # No `ttlSecondsAfterFinished`, for the same reason as the study-casino twin:
  # a TTL would turn this change-driven GRANT script into an on-schedule one.
  # The cost is that a failed run holds this Kustomization unready until someone
  # deletes the Job -- see cluster/docs/troubleshooting.md, "A failed Job wedges
  # its Flux Kustomization". Re-run by editing readonly-role.sql, which re-hashes
  # the ConfigMap and lets the `force` annotation recreate the Job.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: plaid-mcp-db-readonly-provisioner
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -x
              exec psql \
                --set=ON_ERROR_STOP=1 \
                -f /sql/readonly-role.sql
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: plaid-mcp-db-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: plaid-mcp-db-app
                  key: password
            - name: PGHOST
              value: plaid-mcp-db-rw.plaid-mcp.svc
            - name: PGDATABASE
              value: plaidmcp
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: plaid-mcp-db-readonly-sql
