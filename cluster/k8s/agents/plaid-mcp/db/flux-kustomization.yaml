apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plaid-mcp-db
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/agents/plaid-mcp/db
  prune: true
  wait: true
  dependsOn:
    - name: cnpg
    - name: plaid-mcp-namespace
    - name: local-path-provisioner
    - name: external-secrets-config
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: plaid-mcp-db
      namespace: plaid-mcp
