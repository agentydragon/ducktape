# Stable read-only password for the Plaid Postgres MCP. ESO generates it once;
# symbols are disabled so the templated DATABASE_URL is safe without URL escaping.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: plaid-mcp-db-readonly-generator
  namespace: plaid-mcp
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaid-mcp-db-readonly
  namespace: plaid-mcp
spec:
  refreshInterval: 8760h
  target:
    name: plaid-mcp-db-readonly
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: augur,haku-sandbox
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: augur,haku-sandbox
      data:
        username: "plaid_ro"
        password: "{{ .password }}"
        host: "plaid-mcp-db-rw.plaid-mcp.svc"
        port: "5432"
        dbname: "plaidmcp"
        DATABASE_URL: "postgresql://plaid_ro:{{ .password }}@plaid-mcp-db-rw.plaid-mcp.svc:5432/plaidmcp"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: plaid-mcp-db-readonly-generator
