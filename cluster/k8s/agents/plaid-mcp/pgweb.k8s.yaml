apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: plaid-pgweb-auth
  namespace: plaid-mcp
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaid-pgweb-auth
  namespace: plaid-mcp
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: plaid-pgweb-auth
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Owner
    name: plaid-pgweb-auth
    template:
      data:
        password: "{{ .password }}"
      type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: pgweb over the Plaid sync database as the read-only plaid_ro role, for sandboxes that reach it through the agentplane-staging egress proxy.
  labels:
    app.kubernetes.io/name: plaid-pgweb
  name: plaid-pgweb
  namespace: plaid-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plaid-pgweb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plaid-pgweb
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --readonly
            - --no-ssh
            - --no-idle-timeout
            - --query-timeout=60
            - --skip-open
          env:
            - name: PGWEB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: plaid-mcp-db-readonly
            - name: PGWEB_LOCK_SESSION
              value: "true"
            - name: PGWEB_AUTH_USER
              value: plaid
            - name: PGWEB_AUTH_PASS
              valueFrom:
                secretKeyRef:
                  key: password
                  name: plaid-pgweb-auth
          image: ghcr.io/sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
          imagePullPolicy: IfNotPresent
          livenessProbe:
            initialDelaySeconds: 20
            periodSeconds: 20
            tcpSocket:
              port: 8081
          name: pgweb
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
            tcpSocket:
              port: 8081
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: plaid-pgweb
  name: plaid-pgweb
  namespace: plaid-mcp
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081
  selector:
    app.kubernetes.io/name: plaid-pgweb
  type: ClusterIP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    description: Default-deny for plaid-pgweb pods. Only the agentplane-staging egress proxy may reach pgweb, and pgweb reaches only DNS and the Plaid CNPG cluster.
  name: plaid-pgweb
  namespace: plaid-mcp
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: plaid-mcp-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plaid-pgweb
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-egress
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
