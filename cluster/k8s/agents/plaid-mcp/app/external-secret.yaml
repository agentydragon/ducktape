# Mirror the Plaid app credentials + per-item access tokens from the `airlock`
# namespace (where airlock writes and refreshes them) into `plaid-mcp` via ESO's
# Kubernetes provider, reusing the shared `kubernetes-airlock-secret-store`
# ClusterSecretStore. `extract` copies every key of the source secret, so the
# deployment's env (client_id/client_secret, access_token) maps straight through.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaid-client-credentials
  namespace: plaid-mcp
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: kubernetes-airlock-secret-store
    kind: ClusterSecretStore
  target:
    name: plaid-client-credentials
  dataFrom:
    - extract:
        key: plaid-client-credentials
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaid-chase-access-token
  namespace: plaid-mcp
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: kubernetes-airlock-secret-store
    kind: ClusterSecretStore
  target:
    name: plaid-chase-access-token
  dataFrom:
    - extract:
        key: plaid-chase-access-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaid-bofa-access-token
  namespace: plaid-mcp
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: kubernetes-airlock-secret-store
    kind: ClusterSecretStore
  target:
    name: plaid-bofa-access-token
  dataFrom:
    - extract:
        key: plaid-bofa-access-token
