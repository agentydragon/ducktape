apiVersion: v1
kind: ServiceAccount
metadata:
  name: plaid-mcp
  namespace: plaid-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plaid-mcp-secret-manager
  namespace: plaid-mcp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plaid-mcp-secret-manager
  namespace: plaid-mcp
subjects:
  - kind: ServiceAccount
    name: plaid-mcp
    namespace: plaid-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plaid-mcp-secret-manager
