apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plaid-mcp-ingress
  namespace: plaid-mcp
  annotations:
    description: "Default-deny ingress for plaid-mcp pods. Only the Cilium ingress entity (cilium-envoy serving the cluster Gateway HTTPRoute) can reach the facade on port 8765. The upstream server port 8080 has no allow rule, so other pods cannot reach it across the pod network — only the in-pod facade reaches it via loopback (localhost), which Cilium does not police."
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plaid-mcp
  ingress:
    # cilium-envoy hostNetwork traffic into pods carries reserved:ingress identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
