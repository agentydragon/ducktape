apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# plaid-client-credentials and plaid-{chase,bofa}-access-token are NOT listed
# here: they are reflected into this namespace from `airlock` by the emberstack
# reflector. plaid-mcp-oidc (facade Authentik creds) is created by the
# agent-machine-access Terraform module.
resources:
  - configmap.yaml
  - valkey-kimsufi-instance.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
