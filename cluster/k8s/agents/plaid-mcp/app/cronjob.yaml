apiVersion: batch/v1
kind: CronJob
metadata:
  name: plaid-mcp-sync
  namespace: plaid-mcp
  annotations:
    description: "v0 synchronous full-refresh Plaid sync. Keeps Postgres fresh within 12 hours; no real-time balance endpoint calls."
spec:
  schedule: "17 */12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: plaid-mcp-sync
        spec:
          serviceAccountName: plaid-mcp
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/agentydragon/plaid-mcp-sync:devel-20260828051318-b968fc8 # {"$imagepolicy": "flux-system:plaid-mcp-sync"}
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
              env:
                - name: PLAID_MCP_PLAID_ENV
                  valueFrom:
                    configMapKeyRef:
                      name: plaid-mcp-config
                      key: PLAID_MCP_PLAID_ENV
                - name: PLAID_MCP_PUBLIC_BASE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: plaid-mcp-config
                      key: PLAID_MCP_PUBLIC_BASE_URL
                - name: PLAID_MCP_TRANSACTION_DAYS
                  valueFrom:
                    configMapKeyRef:
                      name: plaid-mcp-config
                      key: PLAID_MCP_TRANSACTION_DAYS
                - name: PLAID_MCP_INVESTMENT_TRANSACTION_DAYS
                  valueFrom:
                    configMapKeyRef:
                      name: plaid-mcp-config
                      key: PLAID_MCP_INVESTMENT_TRANSACTION_DAYS
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: plaid-mcp-db-app
                      key: uri
                - name: PLAID_MCP_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: plaid-client-credentials
                      key: client_id
                - name: PLAID_MCP_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: plaid-client-credentials
                      key: client_secret
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
