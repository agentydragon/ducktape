apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plaid-mcp
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/agents/plaid-mcp/app
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: plaid-mcp
      namespace: plaid-mcp
  dependsOn:
    - name: forgejo-images
      namespace: ducktape-flux
    - name: plaid-mcp-namespace
      namespace: ducktape-flux
    - name: plaid-mcp-db
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
