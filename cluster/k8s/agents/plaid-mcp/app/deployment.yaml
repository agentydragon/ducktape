apiVersion: apps/v1
kind: Deployment
metadata:
  name: plaid-mcp
  namespace: plaid-mcp
  labels:
    app.kubernetes.io/name: plaid-mcp
  annotations:
    description: "Plaid self-contained link web UI. Authentik proxy outpost protects browser access; no bespoke Plaid MCP tools are exposed in v0. The app writes access-token Secrets and syncs linked Items into the plaid-mcp Postgres database."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plaid-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plaid-mcp
    spec:
      serviceAccountName: plaid-mcp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plaid-web
          image: ghcr.io/agentydragon/plaid-mcp-server:devel-20260828051312-b968fc8 # {"$imagepolicy": "flux-system:plaid-mcp-server"}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PLAID_MCP_PLAID_ENV
              valueFrom:
                configMapKeyRef:
                  name: plaid-mcp-config
                  key: PLAID_MCP_PLAID_ENV
            - name: PLAID_MCP_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: plaid-mcp-config
                  key: PLAID_MCP_PUBLIC_BASE_URL
            - name: PLAID_MCP_TRANSACTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: plaid-mcp-config
                  key: PLAID_MCP_TRANSACTION_DAYS
            - name: PLAID_MCP_INVESTMENT_TRANSACTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: plaid-mcp-config
                  key: PLAID_MCP_INVESTMENT_TRANSACTION_DAYS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plaid-mcp-db-app
                  key: uri
            - name: PLAID_MCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: plaid-client-credentials
                  key: client_id
            - name: PLAID_MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: plaid-client-credentials
                  key: client_secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
