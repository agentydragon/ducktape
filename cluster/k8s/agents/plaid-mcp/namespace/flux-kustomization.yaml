apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plaid-mcp-namespace
  namespace: ducktape-flux
spec:
  interval: 10m
  sourceRef:
    kind: ExternalArtifact
    name: plaid-mcp-namespace

    namespace: ducktape-flux
  path: ./cluster/k8s/agents/plaid-mcp/namespace
  prune: false
  deletionPolicy: Orphan
  timeout: 2m
