---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Plaid Spend serves its Authentik-protected browser UI and desktop API from the same configured card view and subscribes to committed plaid_spend_changed invalidations.
  labels:
    app.kubernetes.io/name: plaid-spend
  name: plaid-spend
  namespace: plaid-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plaid-spend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plaid-spend
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: PLAID_SPEND_CONFIG_PATH
              valueFrom:
                configMapKeyRef:
                  key: PLAID_SPEND_CONFIG_PATH
                  name: plaid-spend-config
            - name: PLAID_SPEND_API_OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  key: PLAID_SPEND_API_OIDC_ISSUER
                  name: plaid-spend-config
            - name: PLAID_SPEND_API_OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  key: PLAID_SPEND_API_OIDC_CLIENT_ID
                  name: plaid-spend-config
            - name: PLAID_SPEND_API_OIDC_DISCOVERED_ISSUER
              valueFrom:
                configMapKeyRef:
                  key: PLAID_SPEND_API_OIDC_DISCOVERED_ISSUER
                  name: plaid-spend-config
            - name: PLAID_SPEND_API_OIDC_JWKS_URI
              valueFrom:
                configMapKeyRef:
                  key: PLAID_SPEND_API_OIDC_JWKS_URI
                  name: plaid-spend-config
            - name: PLAID_SPEND_WEB_OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  key: PLAID_SPEND_WEB_OIDC_ISSUER
                  name: plaid-spend-config
            - name: PLAID_SPEND_WEB_OIDC_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  key: PLAID_SPEND_WEB_OIDC_PUBLIC_BASE_URL
                  name: plaid-spend-config
            - name: PLAID_SPEND_WEB_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client_id
                  name: plaid-spend-web-oidc-config
            - name: PLAID_SPEND_WEB_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client_secret
                  name: plaid-spend-web-oidc-config
            - name: PLAID_SPEND_WEB_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: session_secret
                  name: plaid-spend-web-oidc-config
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: plaid-mcp-db-spend
            - name: PLAID_SPEND_COINBASE__API_KEY
              valueFrom:
                secretKeyRef:
                  key: api_key
                  name: coinbase-api-credentials
                  optional: true
            - name: PLAID_SPEND_COINBASE__API_SECRET
              valueFrom:
                secretKeyRef:
                  key: api_secret
                  name: coinbase-api-credentials
                  optional: true
          image: git.allegedly.works/ducktape-ci/plaid-spend:unset
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          name: plaid-spend
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /etc/plaid-spend
              name: config
              readOnly: true
      imagePullSecrets:
        - name: forgejo-images-creds
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: plaid-spend
      volumes:
        - name: config
          secret:
            secretName: plaid-spend-policy
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: plaid-spend
  name: plaid-spend
  namespace: plaid-mcp
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: plaid-spend
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    description: Authentik-authenticated web view and desktop API for Plaid card spend.
  name: plaid-spend
  namespace: plaid-mcp
spec:
  hostnames:
    - plaid-spend.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: plaid-spend
          port: 8080
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
          type: ResponseHeaderModifier
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    description: Only the cluster Gateway may reach the Plaid spend API. Outbound access is limited to the Plaid database, the Authentik Gateway, and Coinbase HTTPS.
  name: plaid-spend-ingress
  namespace: plaid-mcp
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: plaid-mcp-db
            k8s:io.kubernetes.pod.namespace: plaid-mcp
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - auth.allegedly.works
    - toFQDNs:
        - matchName: api.coinbase.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - api.coinbase.com
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plaid-spend
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
