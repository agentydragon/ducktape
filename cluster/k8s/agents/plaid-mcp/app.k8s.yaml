apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: plaid-mcp
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plaid-mcp-config
  namespace: plaid-mcp
data:
  PLAID_MCP_INVESTMENT_TRANSACTION_DAYS: "730"
  PLAID_MCP_PLAID_ENV: production
  PLAID_MCP_PUBLIC_BASE_URL: https://plaid-mcp.allegedly.works
  PLAID_MCP_TRANSACTION_DAYS: "730"
  PLAID_MCP_WEBHOOK_URL: https://plaid-mcp.allegedly.works/webhooks/plaid
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plaid-mcp
  namespace: plaid-mcp
imagePullSecrets:
  - name: forgejo-images-creds
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plaid-mcp-secret-manager
  namespace: plaid-mcp
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plaid-mcp-secret-manager
  namespace: plaid-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plaid-mcp-secret-manager
subjects:
  - kind: ServiceAccount
    name: plaid-mcp
    namespace: plaid-mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plaid-link-oidc-reader
  namespace: plaid-mcp
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plaid-link-oidc-reader
  namespace: authentik
rules:
  - apiGroups:
      - ""
    resourceNames:
      - plaid-link-oidc-config
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plaid-link-oidc-reader
  namespace: authentik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plaid-link-oidc-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: plaid-link-oidc-reader
    namespace: plaid-mcp
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-plaid-link-oidc-secret-store
spec:
  conditions:
    - namespaces:
        - plaid-mcp
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: plaid-link-oidc-reader
      remoteNamespace: authentik
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaid-link-oidc-config
  namespace: plaid-mcp
spec:
  dataFrom:
    - extract:
        key: plaid-link-oidc-config
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-plaid-link-oidc-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: plaid-link-oidc-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Plaid Link UI authenticates users with Authentik OIDC; verified webhooks queue transaction syncs, with the daily Cron catching up the mirror.
  labels:
    app.kubernetes.io/name: plaid-mcp
  name: plaid-mcp
  namespace: plaid-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plaid-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plaid-mcp
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: PLAID_MCP_PLAID_ENV
              valueFrom:
                configMapKeyRef:
                  key: PLAID_MCP_PLAID_ENV
                  name: plaid-mcp-config
            - name: PLAID_MCP_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  key: PLAID_MCP_PUBLIC_BASE_URL
                  name: plaid-mcp-config
            - name: PLAID_MCP_WEBHOOK_URL
              valueFrom:
                configMapKeyRef:
                  key: PLAID_MCP_WEBHOOK_URL
                  name: plaid-mcp-config
            - name: PLAID_MCP_TRANSACTION_DAYS
              valueFrom:
                configMapKeyRef:
                  key: PLAID_MCP_TRANSACTION_DAYS
                  name: plaid-mcp-config
            - name: PLAID_MCP_INVESTMENT_TRANSACTION_DAYS
              valueFrom:
                configMapKeyRef:
                  key: PLAID_MCP_INVESTMENT_TRANSACTION_DAYS
                  name: plaid-mcp-config
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: plaid-mcp-db-app
            - name: PLAID_MCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client_id
                  name: plaid-client-credentials
            - name: PLAID_MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client_secret
                  name: plaid-client-credentials
            - name: PLAID_MCP_OIDC_ISSUER
              value: https://auth.allegedly.works/application/o/plaid-link/
            - name: PLAID_MCP_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client_id
                  name: plaid-link-oidc-config
            - name: PLAID_MCP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client_secret
                  name: plaid-link-oidc-config
            - name: PLAID_MCP_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: session_secret
                  name: plaid-link-oidc-config
          image: git.allegedly.works/ducktape-ci/plaid-mcp-server:unset
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          name: plaid-web
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
      imagePullSecrets:
        - name: forgejo-images-creds
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: plaid-mcp
---
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    description: Daily catch-up sync for transactions, accounts, holdings and liabilities. Transaction history uses Plaid cursors; no real-time balance endpoint calls.
  name: plaid-mcp-sync
  namespace: plaid-mcp
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: plaid-mcp-sync
        spec:
          automountServiceAccountToken: true
          containers:
            - env:
                - name: PLAID_MCP_PLAID_ENV
                  valueFrom:
                    configMapKeyRef:
                      key: PLAID_MCP_PLAID_ENV
                      name: plaid-mcp-config
                - name: PLAID_MCP_PUBLIC_BASE_URL
                  valueFrom:
                    configMapKeyRef:
                      key: PLAID_MCP_PUBLIC_BASE_URL
                      name: plaid-mcp-config
                - name: PLAID_MCP_WEBHOOK_URL
                  valueFrom:
                    configMapKeyRef:
                      key: PLAID_MCP_WEBHOOK_URL
                      name: plaid-mcp-config
                - name: PLAID_MCP_TRANSACTION_DAYS
                  valueFrom:
                    configMapKeyRef:
                      key: PLAID_MCP_TRANSACTION_DAYS
                      name: plaid-mcp-config
                - name: PLAID_MCP_INVESTMENT_TRANSACTION_DAYS
                  valueFrom:
                    configMapKeyRef:
                      key: PLAID_MCP_INVESTMENT_TRANSACTION_DAYS
                      name: plaid-mcp-config
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      key: uri
                      name: plaid-mcp-db-app
                - name: PLAID_MCP_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      key: client_id
                      name: plaid-client-credentials
                - name: PLAID_MCP_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: client_secret
                      name: plaid-client-credentials
              image: git.allegedly.works/ducktape-ci/plaid-mcp-sync:unset
              imagePullPolicy: Always
              name: sync
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: plaid-mcp
  schedule: 17 0 * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: plaid-mcp
  name: plaid-mcp
  namespace: plaid-mcp
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: plaid-mcp
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    description: Plaid Link UI; browser access authenticates with Authentik OIDC.
  name: plaid-mcp
  namespace: plaid-mcp
spec:
  hostnames:
    - plaid-mcp.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: plaid-mcp
          port: 8080
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
          type: ResponseHeaderModifier
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    description: Default-deny ingress for plaid-mcp pods. Only the cluster Gateway can reach the public Link UI and Plaid webhook routes.
  name: ingress
  namespace: plaid-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plaid-mcp
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
