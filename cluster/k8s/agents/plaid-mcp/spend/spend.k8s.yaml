apiVersion: v1
kind: ConfigMap
metadata:
  name: plaid-spend-config
  namespace: plaid-mcp
data:
  PLAID_SPEND_API_OIDC_CLIENT_ID: plaid-spend-desktop
  PLAID_SPEND_API_OIDC_DISCOVERED_ISSUER: https://auth.allegedly.works/application/o/plaid-spend-desktop/
  PLAID_SPEND_API_OIDC_ISSUER: https://auth.allegedly.works/application/o/plaid-spend-desktop/
  PLAID_SPEND_API_OIDC_JWKS_URI: https://auth.allegedly.works/application/o/plaid-spend-desktop/jwks/
  PLAID_SPEND_CARDS_CONFIG_PATH: /etc/plaid-spend/cards.json
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plaid-spend
  namespace: plaid-mcp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Separate Plaid spend API; reads one SOPS-managed shared card configuration and subscribes to committed plaid_spend_changed invalidations.
  labels:
    app.kubernetes.io/name: plaid-spend
  name: plaid-spend
  namespace: plaid-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plaid-spend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plaid-spend
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: PLAID_SPEND_CARDS_CONFIG_PATH
              valueFrom:
                configMapKeyRef:
                  key: PLAID_SPEND_CARDS_CONFIG_PATH
                  name: plaid-spend-config
            - name: PLAID_SPEND_API_OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  key: PLAID_SPEND_API_OIDC_ISSUER
                  name: plaid-spend-config
            - name: PLAID_SPEND_API_OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  key: PLAID_SPEND_API_OIDC_CLIENT_ID
                  name: plaid-spend-config
            - name: PLAID_SPEND_API_OIDC_DISCOVERED_ISSUER
              valueFrom:
                configMapKeyRef:
                  key: PLAID_SPEND_API_OIDC_DISCOVERED_ISSUER
                  name: plaid-spend-config
            - name: PLAID_SPEND_API_OIDC_JWKS_URI
              valueFrom:
                configMapKeyRef:
                  key: PLAID_SPEND_API_OIDC_JWKS_URI
                  name: plaid-spend-config
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: plaid-mcp-db-spend
          image: git.allegedly.works/ducktape-ci/plaid-spend:unset
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          name: plaid-spend
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /etc/plaid-spend
              name: cards
              readOnly: true
      imagePullSecrets:
        - name: forgejo-images-creds
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: plaid-spend
      volumes:
        - name: cards
          secret:
            secretName: plaid-spend-cards
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: plaid-spend
  name: plaid-spend
  namespace: plaid-mcp
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: plaid-spend
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    description: Public entry point for the Authentik-authenticated Plaid Spend API.
  name: plaid-spend
  namespace: plaid-mcp
spec:
  hostnames:
    - plaid-spend.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: plaid-spend
          port: 8080
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
          type: ResponseHeaderModifier
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    description: Only the cluster Gateway may reach the Plaid spend API.
  name: plaid-spend-ingress
  namespace: plaid-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plaid-spend
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
