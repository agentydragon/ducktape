apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plaid-mcp
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: forgejo-images
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: valkey
      namespace: ducktape-flux
    - name: agent-machine-access-tf
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: plaid-mcp-db
      namespace: plaid-mcp
    - apiVersion: apps/v1
      kind: Deployment
      name: plaid-mcp
      namespace: plaid-mcp
    - apiVersion: apps/v1
      kind: Deployment
      name: plaid-db-mcp
      namespace: plaid-mcp
  interval: 10m
  path: ./cluster/k8s/agents/plaid-mcp
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: plaid-mcp
    namespace: ducktape-flux
  timeout: 10m
  wait: true
