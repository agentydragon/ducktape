apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: manifold-mcp-servicemonitor
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/manifold-mcp/servicemonitor
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: manifold-mcp
    - name: monitoring-stack
