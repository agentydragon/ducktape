apiVersion: apps/v1
kind: Deployment
metadata:
  name: manifold-mcp
  namespace: manifold-mcp
  labels:
    app.kubernetes.io/name: manifold-mcp
  annotations:
    description: "Authentik-gated Manifold Markets MCP. Pod has two long-running containers in the same network namespace: a sidecar that wraps the stdio-only bmorphism/manifold-mcp-server as Streamable HTTP on localhost:8080 (via supergateway), and the shared mcp-oauth-facade fronting it with OIDCProxy. Only agentydragon is allowed at the OAuth consent step."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: manifold-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manifold-mcp
    spec:
      imagePullSecrets:
        - name: forgejo-images-creds
      # No Kubernetes API access; don't mount a SA token.
      automountServiceAccountToken: false
      containers:
        - name: manifold-mcp-server
          image: git.allegedly.works/ducktape-ci/manifold-mcp-server:devel-20260828071638-20a40e4 # {"$imagepolicy": "flux-system:manifold-mcp-server"}
          imagePullPolicy: Always
          ports:
            - name: bridge
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: manifold-mcp-api-key
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: facade
          image: git.allegedly.works/ducktape-ci/mcp-oauth-facade:devel-20260828071754-20a40e4 # {"$imagepolicy": "flux-system:mcp-oauth-facade"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
            # Prometheus metrics, cluster-internal only (not on the HTTPRoute).
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: manifold-mcp-config
          env:
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: manifold-mcp-oidc
                  key: client_id
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: manifold-mcp-oidc
                  key: client_secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 20
            periodSeconds: 20
