apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: manifold-mcp-namespace
  namespace: ducktape-flux
spec:
  interval: 10m
  sourceRef:
    kind: ExternalArtifact
    name: manifold-mcp-namespace

    namespace: ducktape-flux
  path: ./cluster/k8s/agents/manifold-mcp/namespace
  prune: true
  timeout: 2m
