apiVersion: v1
kind: Namespace
metadata:
  labels:
    name: agent-workspaces
  name: agent-workspaces
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-workspaces-quota
  namespace: agent-workspaces
spec:
  hard:
    configmaps: "20"
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "15"
    pods: "12"
    requests.cpu: "8"
    requests.memory: 16Gi
    requests.storage: 150Gi
    services: "12"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: agent-workspaces-limits
  namespace: agent-workspaces
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 10m
        memory: 16Mi
      type: Container
    - max:
        cpu: "8"
        memory: 16Gi
      type: Pod
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: agent-workspaces
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: codex
  namespace: agent-workspaces
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: agent-workspace
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - sleep
            - infinity
          env:
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: litellm-key-agent-workspaces-codex
          image: git.allegedly.works/ducktape-ci/agent-workspace:unset
          name: workspace
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /workspace
              name: workspace
          workingDir: /workspace
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: forgejo-images-creds
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: seaweedfs-ovh
  volumeClaimTemplatesPolicy: Overrides
---
apiVersion: kyverno.io/v2
kind: CleanupPolicy
metadata:
  name: workspace-janitor
  namespace: agent-workspaces
spec:
  conditions:
    all:
      - key: "{{ time_since('', '{{ target.metadata.creationTimestamp }}', '') }}"
        operator: GreaterThan
        value: 168h
  match:
    any:
      - resources:
          kinds:
            - agents.x-k8s.io/v1beta1/Sandbox
            - extensions.agents.x-k8s.io/v1beta1/SandboxClaim
  schedule: 40 * * * *
