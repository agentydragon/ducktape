apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-workspaces-namespace
  namespace: flux-system
  annotations:
    description: Dedicated namespace + quota for disposable agent workspaces (claude-sandbox is Claude's own in-cluster scratch space, not a hosting namespace).
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 2m
  path: ./cluster/k8s/agents/agent-sandbox/workspaces/namespace
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: agent-workspaces
