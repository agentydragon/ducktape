apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-sandbox-workspaces
  namespace: flux-system
  annotations:
    description: Disposable agent workspace template + warm pool in claude-sandbox. See agents/agent-sandbox/README.md for usage.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  path: ./cluster/k8s/agents/agent-sandbox/workspaces
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: agent-sandbox-controller # CRDs + controller
    - name: claude-rbac # claude-sandbox namespace + quota
    - name: claude-zai-key # zai-api-key Secret the template's env references
