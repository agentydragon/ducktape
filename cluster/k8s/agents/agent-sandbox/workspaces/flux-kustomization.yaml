apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Disposable agent workspace template + warm pool in agent-workspaces. See agents/agent-sandbox/README.md for usage.
  name: agent-workspaces-app
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: agent-sandbox-controller
      namespace: ducktape-flux
    - name: litellm-keys-tf
      namespace: ducktape-flux
    - name: kyverno-policies
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: agent-workspaces
  interval: 10m
  path: ./cluster/k8s/agents/agent-sandbox/workspaces
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: agent-workspaces-app
    namespace: ducktape-flux
  timeout: 5m
  wait: true
