# One pre-warmed codex-lane workspace (see sandboxwarmpool-zai.yaml for the
# cost/latency tradeoff).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: codex
  namespace: agent-workspaces
spec:
  replicas: 1
  updateStrategy:
    type: Recreate
  sandboxTemplateRef:
    name: codex
