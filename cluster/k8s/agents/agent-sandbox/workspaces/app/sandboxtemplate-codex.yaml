# codex LLM lane: OpenAI Codex-account models via the cluster LiteLLM. The
# networkPolicyManagement/dnsPolicy/storageClassName settings are load-bearing.
# The codex CLI picks up
# the baked ~/.codex/config.toml (workspace-image/codex-config.toml), whose
# provider reads the key from LITELLM_API_KEY.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: codex
  namespace: agent-workspaces
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: agent-workspace
    spec:
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: forgejo-images-creds
      # No explicit region nodeSelector: the workspace volumeClaimTemplate's
      # seaweedfs-ovh StorageClass already pins scheduling to
      # topology.kubernetes.io/zone=hil-ovh via WaitForFirstConsumer +
      # allowedTopologies (cluster/k8s/seaweedfs-csi/sc-seaweedfs-ovh.yaml).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workspace
          image: git.allegedly.works/ducktape-ci/agent-workspace:devel-20260905183746-7c436f7 # {"$imagepolicy": "flux-system:agent-workspace"}
          command: ["sleep", "infinity"]
          workingDir: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # LiteLLM virtual key (alias agent-workspaces-codex,
            # `chatgpt/oai-responses/*` models, no budget cap) minted by
            # tf/gitops/litellm-keys and reflected into this namespace; deleting
            # that TF resource is the lane's kill switch.
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-key-agent-workspaces-codex
                  key: api-key
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
  volumeClaimTemplatesPolicy: Overrides
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        storageClassName: seaweedfs-ovh
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
