# One pre-warmed workspace so a SandboxClaim is ready in seconds instead of a
# cold image pull + PVC bind. Costs one idle pod (500m/1Gi requests) inside the
# namespace quota; bump replicas only if claims routinely outpace warmup.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: workspace
  namespace: agent-workspaces
spec:
  replicas: 1
  updateStrategy:
    type: Recreate
  sandboxTemplateRef:
    name: workspace
