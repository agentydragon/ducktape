apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-workspaces-secrets
  namespace: flux-system
  annotations:
    description: ESO-mirrored credentials for agent workspaces (z.ai key referenced by the workspace SandboxTemplate).
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  path: ./cluster/k8s/agents/agent-sandbox/workspaces/secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: agent-workspaces-namespace
    - name: external-secrets-config
