# Mirrors the z.ai (GLM) API key into agent-workspaces for the workspace
# SandboxTemplate's ANTHROPIC_AUTH_TOKEN env. Same source as
# ../../../claude-zai-key/ (openhands-secrets via the openhands
# ClusterSecretStore) — no second plaintext/sops copy to keep in sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zai-api-key
  namespace: agent-workspaces
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-openhands-secret-store
    kind: ClusterSecretStore
  target:
    name: zai-api-key
    creationPolicy: Owner
  data:
    - secretKey: ZAI_API_KEY
      remoteRef:
        key: openhands-secrets
        property: ZAI_API_KEY
