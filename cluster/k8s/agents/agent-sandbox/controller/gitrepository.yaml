# Upstream publishes no Helm repo/OCI chart artifact — the chart lives only in
# the source tree, so the HelmRelease pulls it from a pinned tag here. The git
# tag and values.image.tag below must move together.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: agent-sandbox
  namespace: agent-sandbox-system
spec:
  interval: 1h
  url: https://github.com/kubernetes-sigs/agent-sandbox
  ref:
    tag: v0.5.1
  ignore: |
    /*
    !/helm
