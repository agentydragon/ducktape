apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-sandbox
  namespace: agent-sandbox-system
spec:
  interval: 10m
  chart:
    spec:
      chart: ./helm
      # Deliberately NOT reconcileStrategy: Revision — it repackages the chart
      # as 0.1.0+<git-sha> and the chart stamps .Chart.Version into helm.sh/chart
      # labels, where '+' is invalid (every object then fails SSA; observed live
      # 2026-07-16). ChartVersion is correct anyway: the source is a pinned tag,
      # so chart contents only change when the tag bumps.
      sourceRef:
        kind: GitRepository
        name: agent-sandbox
      interval: 5m
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    namespace:
      # namespace.yaml owns it; the chart's copy would fight Flux SSA.
      create: false
    image:
      # Must match the GitRepository tag (gitrepository.yaml).
      tag: v0.5.1
    controller:
      # One controller with --extensions; the split release manifests are not
      # Flux-safe at v0.5.1 (see ../README.md).
      extensions: true
    nodeSelector:
      # Always-on OVH capacity, same as the workspaces it manages.
      topology.kubernetes.io/region: hil
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
