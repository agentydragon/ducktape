apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-sandbox-controller
  namespace: ducktape-flux
  annotations:
    description: kubernetes-sigs/agent-sandbox v0.5.5 combined release asset (Sandbox, SandboxTemplate, SandboxClaim, SandboxWarmPool CRDs).
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  path: ./cluster/k8s/agents/agent-sandbox/controller
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: agent-sandbox-controller
    namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: agent-sandbox-controller
      namespace: agent-sandbox-system
