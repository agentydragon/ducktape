apiVersion: v1
kind: Namespace
metadata:
  name: agent-sandbox-system
  labels:
    name: agent-sandbox-system
    goldilocks.fairwinds.com/enabled: "false"
    rbac.ducktape.io/agent-readable-metadata: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-sandbox-controller
  template:
    metadata:
      labels:
        app: agent-sandbox-controller
    spec:
      # Keep the controller and the workspaces on always-on OVH capacity.
      nodeSelector:
        topology.kubernetes.io/region: hil
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-sandbox-controller
          image: registry.k8s.io/agent-sandbox/agent-sandbox-controller:v0.5.5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
