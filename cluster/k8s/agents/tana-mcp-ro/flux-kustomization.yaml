apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tana-mcp-ro
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/agents/tana-mcp-ro
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: tana-mcp-ro
      namespace: tana-mcp
  # tana-mcp provides the namespace, the upstream service, and the PAT secret
  # this facade injects.
  dependsOn:
    - name: tana-mcp
