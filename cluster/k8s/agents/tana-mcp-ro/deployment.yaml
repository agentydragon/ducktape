apiVersion: apps/v1
kind: Deployment
metadata:
  name: tana-mcp-ro
  namespace: tana-mcp
  labels:
    app.kubernetes.io/name: tana-mcp-ro
  annotations:
    description: "Cluster-internal read-only Tana MCP facade for background agents (haku). Exposes only read tools (MCP_FACADE_TOOLS__ALLOW) and injects the full Tana PAT server-side, so callers never see it. Client auth is a static bearer (haku-tana-ro-token, reflected into haku-sandbox), not Authentik — there is no public HTTPRoute."
    reloader.stakater.com/auto: "true"
    # CPU: VPA manages requests only — no CPU limit so fastmcp's ~6 CPU-second
    # import isn't throttled (see tana-mcp-facade for the full rationale).
    goldilocks.fairwinds.com/vpa-resource-policy: >
      {"containerPolicies":[{"containerName":"server","minAllowed":{"cpu":"25m"},"controlledValues":"RequestsOnly"}]}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tana-mcp-ro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tana-mcp-ro
    spec:
      enableServiceLinks: false
      containers:
        - name: server
          image: ghcr.io/agentydragon/mcp-oauth-facade:devel-20260610075322-2c51610 # {"$imagepolicy": "flux-system:mcp-oauth-facade"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
            # Prometheus metrics, cluster-internal only (not on any route).
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tana-mcp-ro-config
          env:
            # Server-held PAT injected to the upstream — never exposed to callers.
            - name: MCP_FACADE_UPSTREAM__BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tana-agentydragon-gmail-com-account-pat
                  key: token
            # Static bearer callers must present (distinct from the PAT).
            - name: MCP_FACADE_CLIENT_AUTH__STATIC_BEARER
              valueFrom:
                secretKeyRef:
                  name: haku-tana-ro-token
                  key: token
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          # /readyz is 200 only when the background probe recently listed >0
          # tools from the upstream, so a bad PAT flips the pod NotReady instead
          # of silently serving an empty tool list.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8765
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            periodSeconds: 20
