# Non-secret structured config for the read-only Tana facade (tana-mcp-ro),
# mounted at MCP_FACADE_CONFIG_FILE. The upstream and the bearer secrets stay in
# env (see deployment.yaml) so no single nested field is split across sources.
facade_name: Tana MCP (read-only)
# Read-only allowlist (default-deny): only these tools are exposed; every Tana
# write tool (edit_node, move_node, trash_node, create_tag, set_field_content,
# import_tana_paste, set_tag_checkbox, …) is hidden and rejected.
# get_or_create_calendar_node is intentionally excluded: it can create a daily
# node (a write side effect). Confirm this set against the live tools/list —
# "recent edits / recent daily notes" are synthesized from search_nodes +
# calendar-node traversal, not a first-class tool.
tools:
  allow:
    - search_nodes
    - read_node
    - get_children
    - open_node
    - list_tags
    - list_workspaces
    - get_tag_schema
