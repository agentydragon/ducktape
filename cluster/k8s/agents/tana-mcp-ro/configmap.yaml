apiVersion: v1
kind: ConfigMap
metadata:
  name: tana-mcp-ro-config
  namespace: tana-mcp
data:
  MCP_FACADE_FACADE_NAME: "Tana MCP (read-only)"
  MCP_FACADE_UPSTREAM__KIND: "http"
  MCP_FACADE_UPSTREAM__URL: "http://tana-mcp.tana-mcp.svc.cluster.local:8263/mcp"
  # Read-only allowlist (default-deny): only these tools are exposed; every Tana
  # write tool (edit_node, move_node, trash_node, create_tag, set_field_content,
  # import_tana_paste, set_tag_checkbox, …) is hidden and rejected.
  # get_or_create_calendar_node is intentionally excluded: it can create a daily
  # node (a write side effect). When wiring a consumer, confirm this set against
  # the live tools/list — "recent edits / recent daily notes" are synthesized
  # from search_nodes + calendar-node traversal, not a first-class tool.
  MCP_FACADE_TOOLS__ALLOW: >-
    ["search_nodes","read_node","get_children","open_node","list_tags","list_workspaces","get_tag_schema"]
