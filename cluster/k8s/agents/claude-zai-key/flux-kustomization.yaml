apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-zai-key
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/claude-zai-key
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  dependsOn:
    - name: claude-rbac
    - name: external-secrets-config
