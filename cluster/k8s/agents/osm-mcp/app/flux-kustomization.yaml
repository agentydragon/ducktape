apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: osm-mcp
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/agents/osm-mcp/app
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: osm-mcp
      namespace: osm-mcp
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: osm-mcp-namespace
      namespace: ducktape-flux
    # forgejo-images-creds-eso.yaml extracts the source Secret from the
    # forgejo-images namespace, so it must exist first.
    - name: forgejo-images
      namespace: ducktape-flux
