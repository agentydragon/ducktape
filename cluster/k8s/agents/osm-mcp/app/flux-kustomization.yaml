apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: osm-mcp
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/agents/osm-mcp/app
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: osm-mcp
      namespace: osm-mcp
  dependsOn:
    - name: osm-mcp-namespace
      namespace: ducktape-flux
    # Reflector mirrors the forgejo-images-creds pull secret into this
    # namespace, so the source credential must exist first. forgejo-images
    # itself dependsOn reflector, so this covers both.
    - name: forgejo-images
      namespace: flux-system
