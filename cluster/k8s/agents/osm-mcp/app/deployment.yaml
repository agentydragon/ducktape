apiVersion: apps/v1
kind: Deployment
metadata:
  name: osm-mcp
  namespace: osm-mcp
  labels:
    app.kubernetes.io/name: osm-mcp
  annotations:
    description: "osmmcp (github.com/NERVsystems/osmmcp): geocoding via Nominatim, routing via OSRM, place lookup via Overpass — all public, anonymous, read-only APIs. No secret, no per-operator identity, so unlike every other MCP deployment here it is not OAuth-fronted: reachable only from haku-console's namespace via CiliumNetworkPolicy."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: osm-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osm-mcp
    spec:
      # No Kubernetes API access; don't mount a SA token.
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: osm-mcp
          image: ghcr.io/agentydragon/osm-mcp:devel-00000000000000-0000000 # {"$imagepolicy": "flux-system:osm-mcp"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7082
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /ready
              port: 7082
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7082
            initialDelaySeconds: 15
            periodSeconds: 20
