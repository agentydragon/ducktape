apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: osm-mcp-agent-rbac
  namespace: flux-system
  annotations:
    description: Agent RBAC for osm-mcp namespace. Lightweight — only RoleBindings. Depends on namespace existing + agent RBAC base for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/agents/osm-mcp/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: osm-mcp-namespace
    - name: claude-rbac
