apiVersion: v1
kind: Namespace
metadata:
  name: openclaw-sandbox
  annotations:
    description: >-
      Retained only to hold ibkr-flex-query-credentials, whose SOPS document
      pins this namespace. No workloads run here since the OpenClaw/OpenShell
      teardown on 2026-07-31 — the privileged Pod Security labels OpenShell's
      supervisor needed are gone with it.
  labels:
    name: openclaw-sandbox
    environment: development
