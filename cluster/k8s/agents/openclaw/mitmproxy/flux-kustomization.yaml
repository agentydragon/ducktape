apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw-mitmproxy
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/openclaw/mitmproxy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  dependsOn:
    - name: openclaw-mitmproxy-namespace
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
