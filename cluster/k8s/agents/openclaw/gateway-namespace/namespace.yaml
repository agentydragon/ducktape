# CLEANUP(added 2026-07-31): delete this whole directory once
#   `openclaw-anthropic-api-key`, `openclaw-openai-api-key`,
#   `openclaw-telegram-bot-token` and `ibkr-flex-query-credentials` no longer
#   live in an `openclaw-*` namespace — either re-homed under
#   `agents/shared-secrets/` or revoked upstream. Nothing else here survives the
#   2026-07-31 teardown; this namespace exists only because the SOPS documents
#   pin it. See ../README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: openclaw-gateway
  annotations:
    description: >-
      Retained only to hold the OpenClaw-era API keys and bot token, whose SOPS
      documents pin this namespace. No workloads run here since the
      OpenClaw/OpenShell teardown on 2026-07-31.
  labels:
    name: openclaw-gateway
    # No workloads, so nothing for Goldilocks to right-size.
    goldilocks.fairwinds.com/enabled: "false"
