apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw-gateway-namespace
  namespace: flux-system
spec:
  suspend: false
  interval: 1h
  path: ./cluster/k8s/agents/openclaw/gateway-namespace
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
