apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw-sandbox-secrets
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  path: ./cluster/k8s/agents/openclaw/sandbox-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: openclaw-sandbox
    - name: external-secrets-config
    - name: ollama-secrets
