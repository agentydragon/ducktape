apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
  namespace: openclaw-gateway
spec:
  image:
    repository: ghcr.io/agentydragon/openclaw
    tag: devel-20260728031657-59f5024 # {"$imagepolicy": "flux-system:openclaw:tag"}
    pullPolicy: IfNotPresent
  env:
    # Direct OpenAI Platform credential used only by memorySearch embeddings
    # below. Agent turns use the dedicated LiteLLM credential and provider.
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: openclaw-openai-api-key
          key: api-key
    - name: OPENCLAW_LITELLM_API_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-key-openclaw
          key: api-key
    # The upstream image uses Node.js 24, whose native fetch/http clients can
    # honor the proxy variables injected by Kyverno.
    - name: NODE_USE_ENV_PROXY
      value: "1"
    - name: OPENSHELL_GATEWAY
      value: openclaw
    - name: OPENSHELL_GATEWAY_ENDPOINT
      value: "https://openshell-gateway.openshell-system.svc.cluster.local:8080"
  config:
    mergeMode: overwrite
    raw:
      agents:
        defaults:
          model:
            # ChatGPT/Codex subscription route exposed by the main LiteLLM
            # proxy. This is a custom provider, so OpenClaw owns the agent loop
            # instead of auto-selecting the Codex app-server runtime.
            primary: "litellm-subscription/codex-gpt-5.6-luna"
          sandbox:
            mode: all
            backend: openshell
            scope: agent
            workspaceAccess: rw
          skills: []
          memorySearch:
            # Embeddings are not available through Codex OAuth; retain the
            # separate OpenAI Platform credential for this feature only.
            provider: openai
            experimental:
              sessionMemory: true
            sources:
              - memory
              - sessions
      models:
        providers:
          litellm-subscription:
            baseUrl: "http://litellm.litellm.svc.cluster.local:4000/v1"
            apiKey: "${OPENCLAW_LITELLM_API_KEY}"
            # This Codex OAuth lane is exposed by LiteLLM as Anthropic Messages
            # and forwarded to CLIProxyAPI, which translates tool calls. The
            # `/v1/responses` bridge cannot front this lane; the native
            # Responses lane uses a separate litellm-chatgpt OAuth owner.
            api: anthropic-messages
            agentRuntime:
              id: openclaw
            request:
              allowPrivateNetwork: true
            models:
              - id: codex-gpt-5.6-luna
                name: GPT-5.6 Luna (Codex subscription via LiteLLM)
                reasoning: true
                input:
                  - text
                  - image
                contextWindow: 200000
                maxTokens: 64000
      commands:
        config: false
        mcp: false
        restart: false
      cron:
        enabled: false
      hooks:
        internal:
          entries:
            session-memory:
              enabled: true
              messages: 15
              llmSlug: false
      tools:
        # This first deployment can maintain its workspace and memory, but has
        # no command execution, browser, MCP, cron, or outbound action tools.
        allow:
          - apply_patch
          - edit
          - exec
          - memory_get
          - memory_search
          - process
          - read
          - session_status
          - write
        fs:
          workspaceOnly: true
        sessions:
          visibility: agent
        elevated:
          enabled: false
      plugins:
        entries:
          openshell:
            enabled: true
            config:
              # Compatibility boundary for OpenClaw 2026.7.1 + OpenShell
              # 0.0.90. The mounted wrapper shortens only OpenClaw-generated
              # runtime IDs and delegates every operation to the pinned CLI.
              command: /opt/openclaw/bin/openshell-compat
              # TODO: Consider building and digest-pinning our own OpenShell
              # sandbox image instead of using the mutable community image.
              from: openclaw
              mode: mirror
              gateway: openclaw
              gatewayEndpoint: "https://openshell-gateway.openshell-system.svc.cluster.local:8080"
              providers:
                - agentydragon-github
              autoProviders: false
      gateway:
        mode: local
        auth:
          mode: trusted-proxy
          trustedProxy:
            userHeader: x-authentik-username
            requiredHeaders:
              - x-authentik-email
              - x-forwarded-host
              - x-forwarded-proto
            allowUsers:
              - agentydragon
            # The operator's nginx sidecar is a TCP proxy on loopback. Network
            # policy makes Authentik the only external path to that sidecar.
            allowLoopback: true
        controlUi:
          # OpenClaw 2026.7.1 cannot map trusted-proxy users to persistent
          # device scopes. Preserve the Control UI's requested admin scopes
          # after Authentik + allowUsers authentication instead.
          dangerouslyDisableDeviceAuth: true
          allowedOrigins:
            - "https://openclaw.allegedly.works"
  storage:
    persistence:
      enabled: true
      size: 20Gi
      # OpenClaw owns a single-writer state directory with SQLite indexes.
      # Keep it on local Proxmox storage and back up the PVC separately.
      storageClass: local-path-proxmox
      orphan: true
  resources:
    requests:
      cpu: "250m"
      memory: "768Mi"
    limits:
      cpu: "2"
      memory: "4Gi"
  chromium:
    enabled: false
  observability:
    metrics:
      enabled: false
  extraVolumes:
    - name: openshell-cli-config
      secret:
        secretName: openshell-cli-config
        defaultMode: 0444
        items:
          - key: metadata.json
            path: metadata.json
          - key: oidc_token.json
            path: oidc_token.json
          - key: ca.crt
            path: mtls/ca.crt
    - name: openshell-cli-compat
      configMap:
        name: openshell-cli-compat
        defaultMode: 0555
        items:
          - key: openshell-compat
            path: openshell-compat
  extraVolumeMounts:
    - name: openshell-cli-config
      mountPath: /home/openclaw/.config/openshell/gateways/openclaw
      readOnly: true
    - name: openshell-cli-compat
      mountPath: /opt/openclaw/bin
      readOnly: true
  security:
    networkPolicy:
      additionalEgress:
        # Internet egress is forced through the shared mitmproxy.
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: agents-mitmproxy
          ports:
            - port: 8080
              protocol: TCP
        # OpenClaw delegates command execution to the in-cluster OpenShell
        # gateway. The gateway's OIDC token and private CA are mounted above.
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: openshell-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: openshell
                  app.kubernetes.io/instance: openshell
          ports:
            - port: 8080
              protocol: TCP
        # Agent inference goes to the in-cluster LiteLLM proxy. Its
        # `codex-gpt-5.6-luna` route forwards Anthropic Messages requests to
        # CLIProxyAPI's independently refreshed ChatGPT/Codex OAuth session.
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: litellm
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: litellm
          ports:
            - port: 4000
              protocol: TCP
  availability:
    nodeSelector:
      topology.kubernetes.io/region: proxmox
