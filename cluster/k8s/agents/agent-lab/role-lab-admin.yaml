# Full CRUD inside agent-lab only. The experiment has to stand up whole agent
# harnesses (OpenClaw, Hermes, others) on top of whichever sandbox mechanism is
# being tested, so the API-group list is the union of every harness/sandbox CRD
# installed in this cluster rather than a per-experiment allowlist.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-lab-admin
  namespace: agent-lab
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/attach
      - pods/portforward
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - serviceaccounts
      - events
    verbs: ["*"]

  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: ["*"]

  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: ["*"]

  # Harnesses bring their own ServiceAccount + Role, and S4 (no arbitrary
  # egress) is tested by writing NetworkPolicies here.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings]
    verbs: ["*"]

  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies, ingresses]
    verbs: ["*"]

  - apiGroups: ["external-secrets.io"]
    resources: [externalsecrets, secretstores]
    verbs: ["*"]

  # Sandbox mechanisms under test.
  - apiGroups: ["openshell.lenshq.io"]
    resources: [openshellsandboxes, openshellpolicies, openshellproviders, openshellproviderprofiles]
    verbs: ["*"]

  - apiGroups: ["agents.x-k8s.io", "extensions.agents.x-k8s.io"]
    resources: [sandboxes, sandboxclaims, sandboxtemplates, sandboxwarmpools]
    verbs: ["*"]

  # Agent harnesses under test.
  - apiGroups: ["openclaw.rocks"]
    resources: [openclawinstances, openclawselfconfigs]
    verbs: ["*"]

  - apiGroups: ["kagent.dev"]
    resources:
      - agentharnesses
      - sandboxagents
      - agents
      - memories
      - modelconfigs
      - modelproviderconfigs
      - mcpservers
      - remotemcpservers
      - toolservers
    verbs: ["*"]
