apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-lab-quota
  namespace: agent-lab
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
    services: "15"
    configmaps: "30"
    persistentvolumeclaims: "15"
    requests.storage: 40Gi
