apiVersion: v1
kind: LimitRange
metadata:
  name: agent-lab-limits
  namespace: agent-lab
spec:
  limits:
    - max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 10m
        memory: 16Mi
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
    - max:
        cpu: "8"
        memory: 16Gi
      type: Pod
