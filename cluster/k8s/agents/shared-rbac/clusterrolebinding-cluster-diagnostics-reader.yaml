apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-cluster-diagnostics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-diagnostics-reader
subjects:
  - kind: ServiceAccount
    name: default
    namespace: openclaw-sandbox
  - kind: Group
    name: oidc-ksbx-groups:kubectl-sandbox-users
    apiGroup: rbac.authorization.k8s.io
  # Haku background agent: secret-free cluster-wide diagnostics. This class grants
  # no secrets/pods-log/configmaps, so Haku reads no new credential material through
  # it. Log/configmap reads are granted separately per infra namespace, not here.
  - kind: Group
    name: oidc-ksbx-groups:haku
    apiGroup: rbac.authorization.k8s.io
  # agent-box Codex VM: secret-free cluster diagnostics only. Namespace/log
  # expansion stays explicit in per-namespace RoleBindings.
  - kind: Group
    name: oidc-ksbx-groups:agent-box-codex
    apiGroup: rbac.authorization.k8s.io
  # agent-box zai VM (Claude Code via LiteLLM/z.ai): same secret-free diagnostics.
  - kind: Group
    name: oidc-ksbx-groups:agent-box-zai
    apiGroup: rbac.authorization.k8s.io
