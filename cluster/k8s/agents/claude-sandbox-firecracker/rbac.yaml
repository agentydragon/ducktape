apiVersion: v1
kind: ServiceAccount
metadata:
  name: firecracker-manager
  namespace: claude-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: firecracker-manager
  namespace: claude-sandbox
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, delete, get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: firecracker-manager
  namespace: claude-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: firecracker-manager
subjects:
  - kind: ServiceAccount
    name: firecracker-manager
    namespace: claude-sandbox
