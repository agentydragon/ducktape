apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-sandbox-firecracker
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/claude-sandbox-firecracker
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: claude-rbac
    - name: claude-sandbox-secrets
    - name: kvm-device-plugin
