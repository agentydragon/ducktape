apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-workspace
  namespace: haku-workspaces
  annotations:
    description: >-
      In-cluster identity for Haku sandbox pods so `kubectl` works out of the box —
      Haku operates its own compute in haku-sandbox from inside the box. Bound to
      haku-sandbox-admin (haku-sandbox CRUD), the same grant the managed-agent worker
      gets; cluster-diagnostics-reader is a follow-up. Granted NOTHING in
      haku-workspaces, so the box cannot edit its own SandboxTemplate or create claims.
automountServiceAccountToken: false
