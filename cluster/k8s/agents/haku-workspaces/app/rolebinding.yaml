# Grants the Haku sandbox pods' ServiceAccount full CRUD in haku-sandbox (Haku's
# own compute namespace) — the same haku-sandbox-admin grant the managed-agent
# worker gets — so `kubectl` in the box operates Haku's compute out of the box.
# Lives in haku-sandbox (where the Role is); subjects the SA from haku-workspaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haku-workspace-sandbox-admin
  namespace: haku-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haku-sandbox-admin # cluster/k8s/haku/rbac/role.yaml
subjects:
  - kind: ServiceAccount
    name: haku-workspace
    namespace: haku-workspaces
