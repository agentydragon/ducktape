apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-workspaces-namespace
  namespace: flux-system
  annotations:
    description: Dedicated namespace + quota for the Haku sandbox warm pool (an in-cluster exec target the sandbox-provisioning MCP hands out; Haku has no RBAC here so all claims go through the MCP).
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 2m
  path: ./cluster/k8s/agents/haku-workspaces/namespace
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: haku-workspaces
