apiVersion: v1
kind: LimitRange
metadata:
  name: haku-workspaces-limits
  namespace: haku-workspaces
spec:
  limits:
    - max:
        cpu: "6"
        memory: 12Gi
      min:
        cpu: 10m
        memory: 16Mi
      default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: 500m
        memory: 1Gi
      type: Container
    - max:
        cpu: "6"
        memory: 12Gi
      type: Pod
