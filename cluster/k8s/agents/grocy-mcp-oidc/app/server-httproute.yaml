# HTTPRoute for the Grocy MCP server itself.
# NOT behind the Authentik outpost — OIDCProxy runs inside the pod and drives
# the full MCP OAuth dance (DCR, PKCE, resource metadata). The outpost only
# protects the downstream Grocy calls the server makes on behalf of users.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grocy-mcp-oidc-server
  namespace: grocy-mcp-oidc
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "grocy-mcp.allegedly.works"
  rules:
    - backendRefs:
        - name: grocy-mcp-oidc-server
          port: 8765
      timeouts:
        request: "60s"
        backendRequest: "60s"
