apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Namespace comes from the sibling `namespace/` Kustomization (layer 1);
# the OIDC client-credentials secret is written into it by the
# `agent-machine-access-tf` Terraform run (layer 2). This `app/`
# Kustomization is layer 3 and only fills the namespace with runtime
# objects.
resources:
  - server-deployment.yaml
  - server-service.yaml
  - server-httproute.yaml
