apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grocy-mcp-oidc-namespace
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/agents/grocy-mcp-oidc/namespace
  prune: false
  wait: true
