apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubectl-sandbox-mcp-namespace
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/agents/kubectl-sandbox-mcp/namespace
  prune: false
  wait: true
