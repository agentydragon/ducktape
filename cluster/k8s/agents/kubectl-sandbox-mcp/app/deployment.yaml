apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-sandbox-mcp
  namespace: kubectl-sandbox-mcp
  labels:
    app.kubernetes.io/name: kubectl-sandbox-mcp
  annotations:
    description: "containers/kubernetes-mcp-server in OAuth passthrough mode. Authentik issues tokens with a hardcoded groups=[kubectl-sandbox-users] claim — admins get sandbox-only access. No token exchange; the scoping happens at token-issue time via Authentik scope mapping."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubectl-sandbox-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubectl-sandbox-mcp
    spec:
      serviceAccountName: kubectl-sandbox-mcp
      enableServiceLinks: false
      containers:
        - name: server
          image: ghcr.io/containers/kubernetes-mcp-server:v0.0.63
          imagePullPolicy: IfNotPresent
          args:
            # Config is public-only — public OAuth2 client (PKCE) and no token
            # exchange, so no client_secret. Scoping is done via Authentik scope
            # mapping that hardcodes the `groups` claim on issued tokens.
            - --config=/etc/kubectl-sandbox-mcp/00-public.toml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: public
              mountPath: /etc/kubectl-sandbox-mcp/00-public.toml
              subPath: 00-public.toml
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: public
          configMap:
            name: kubectl-sandbox-mcp-public
