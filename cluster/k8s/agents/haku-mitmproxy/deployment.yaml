apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-mitmproxy
  namespace: haku-mitmproxy
  labels:
    app.kubernetes.io/name: haku-mitmproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-mitmproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-mitmproxy
    spec:
      initContainers:
        - name: mitmproxy-ca-init
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              cat /mitmproxy-ca-key/mitmproxy-ca.key /mitmproxy-ca-cert/ca-cert.pem > /mitmproxy-data/mitmproxy-ca.pem
              cp /mitmproxy-ca-cert/ca-cert.pem /mitmproxy-data/mitmproxy-ca-cert.pem
          volumeMounts:
            - name: mitmproxy-ca-cert
              mountPath: /mitmproxy-ca-cert
              readOnly: true
            - name: mitmproxy-ca-key
              mountPath: /mitmproxy-ca-key
              readOnly: true
            - name: mitmproxy-data
              mountPath: /mitmproxy-data
      containers:
        - name: mitmproxy
          image: mitmproxy/mitmproxy:11
          command:
            - mitmweb
            - --listen-host
            - "0.0.0.0"
            - --listen-port
            - "8080"
            - --web-host
            - "0.0.0.0"
            - --web-port
            - "8081"
            - --set
            - confdir=/mitmproxy-data
          ports:
            - name: proxy
              containerPort: 8080
            - name: web
              containerPort: 8081
          volumeMounts:
            - name: mitmproxy-data
              mountPath: /mitmproxy-data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mitmproxy-ca-cert
          configMap:
            name: haku-mitmproxy-ca-cert
        - name: mitmproxy-ca-key
          secret:
            secretName: haku-mitmproxy-ca-key
        - name: mitmproxy-data
          emptyDir: {}
