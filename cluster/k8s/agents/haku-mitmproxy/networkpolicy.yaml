# Allow haku-sandbox proxy clients to reach mitmproxy (port 8080) and the
# Authentik outpost to reach the mitmweb UI (port 8081) for proxy auth.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-authentik-mitmproxy-ingress
  namespace: haku-mitmproxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: haku-mitmproxy
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haku-sandbox
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - port: 8081
          protocol: TCP
  policyTypes:
    - Ingress
