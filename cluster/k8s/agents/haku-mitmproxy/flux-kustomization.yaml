apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-mitmproxy
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/haku-mitmproxy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  dependsOn:
    - name: haku-mitmproxy-namespace
    - name: cert-manager-environment
    - name: cert-manager-trust
    - name: reflector
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
