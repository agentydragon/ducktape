apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: haku-mitmproxy-ca-cert
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: cluster-root-ca-secret
        key: ca.crt
    - secret:
        name: haku-mitmproxy-ca
        key: tls.crt
  target:
    configMap:
      key: ca-certificates.crt
      metadata:
        annotations:
          description: Trust bundle for haku-mitmproxy-inspected sandbox HTTPS traffic
    # haku-ci egresses through this same proxy (its Bazel/toolchain builds), so it
    # needs the same CA to trust the intercepted TLS.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - haku-sandbox
            - haku-ci
