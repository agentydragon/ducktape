# Allow egress to cloud LLM API providers.
# Additive with the operator's default-deny NetworkPolicy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cloud-api-egress
  namespace: agents-mitmproxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mitmproxy
  egress:
    # Cilium FQDN egress rules need the proxy pod to query CoreDNS first.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: generativelanguage.googleapis.com
        - matchName: api.openai.com
        - matchName: api.anthropic.com
        - matchName: api.telegram.org
        - matchPattern: "*.telegram.org"
        - matchName: github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Package registries for ad-hoc tooling installs inside sandbox pods
    # (e.g. `pip install fastmcp`, `npx <mcp-server>`). PyPI: `pypi.org`
    # (index/metadata) + `files.pythonhosted.org` (wheels/sdists); npm:
    # `registry.npmjs.org`.
    - toFQDNs:
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
        - matchName: registry.npmjs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Allow forwarding to any in-cluster Service. Sandbox bench Jobs and
    # other workloads keep mitmproxy in-path even when targeting cluster
    # endpoints (e.g. `ollama.ollama:11434`); without this rule mitmproxy
    # was the bottleneck because it couldn't reach the in-cluster
    # destination. NO_PROXY in the inject policy still permits explicit
    # bypass for Service FQDNs that already match (`*.svc.cluster.local`
    # and `10.0.0.0/8`).
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # The loom/gym eval driver (in claude-sandbox) reaches the docker-ci DinD by
    # its public name through this proxy, which raw-tunnels it (ignore_hosts in
    # deployment.yaml) so docker mTLS passes end-to-end. Allow mitmproxy to reach
    # the daemon's mTLS port to establish that CONNECT tunnel.
    - toFQDNs:
        - matchName: docker-ci.allegedly.works
      toPorts:
        - ports:
            - port: "2376"
              protocol: TCP
