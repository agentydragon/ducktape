apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents-mitmproxy
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: agents-mitmproxy-namespace
      namespace: ducktape-flux
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: cert-manager-trust
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/agents/mitmproxy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
