# Force external egress from shared-proxy sandboxes through mitmproxy.
# Allows: DNS, cluster-internal traffic, kube-apiserver, mitmproxy port 8080.
# Blocks: direct external internet access.
#
# openshell-sandboxes is intentionally absent. Its pods are OpenShell sandboxes,
# whose supervisor proxy enforces the OpenShell policy and replaces credential
# placeholders on approved requests. Chaining the generic proxy in front of it
# prevents OpenShell from seeing and authorizing the original HTTPS requests.
#
# KNOWN GAP (intentionally left open for now; may be closed later):
# This constrains egress from the sandbox *pods*, but not what a sandboxed agent
# can launch elsewhere. Cluster-internal traffic is allowed (below), so an agent
# that can reach the docker-ci DinD — and obtain its mTLS client cert — can
# `docker run` a container there whose egress is NOT forced through mitmproxy.
# Such a container has unrestricted internet access, so a sandboxed agent can use
# it to fetch/exfiltrate outside the proxy, defeating this egress control. Closing
# it means either denying sandbox pods access to docker-ci, or running agent
# workloads on a locked-down "docker-for-agents" daemon that forces every
# container's egress through mitmproxy. See also loom/gym/TODO.md (the loom eval's
# per-sandbox archive clamp rests on the same assumption).
#
# To add a new shared-proxy sandbox namespace, add it to the namespaces list below
# and ensure the corresponding trust-manager Bundle target + Kyverno injection
# are configured (already handled by inject-mitmproxy ClusterPolicy).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: sandbox-force-proxy-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: In
        values:
          - claude-sandbox
          - openclaw-sandbox
  egress:
    # DNS resolution (CoreDNS in kube-system)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # All cluster-internal traffic (pod-to-service, bypasses proxy via NO_PROXY)
    - toEntities:
        - cluster
    # Kubernetes API server
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # mitmproxy — all external internet traffic must go through here.
    # Label `app.kubernetes.io/name: mitmproxy` matches the deployment selector
    # in <deployment.yaml>; the previous selector `app: mitmproxy` did not
    # match any pod, so claude-sandbox couldn't actually reach mitmproxy and
    # external pip/curl through HTTP_PROXY timed out.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agents-mitmproxy
            k8s:app.kubernetes.io/name: mitmproxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
