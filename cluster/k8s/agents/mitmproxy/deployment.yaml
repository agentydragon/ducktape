apiVersion: apps/v1
kind: Deployment
metadata:
  name: mitmproxy
  namespace: agents-mitmproxy
  labels:
    app.kubernetes.io/name: mitmproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mitmproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mitmproxy
    spec:
      initContainers:
        - name: mitmproxy-ca-init
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              cat /mitmproxy-ca-key/mitmproxy-ca.key /mitmproxy-ca-cert/ca-cert.pem > /mitmproxy-data/mitmproxy-ca.pem
              cp /mitmproxy-ca-cert/ca-cert.pem /mitmproxy-data/mitmproxy-ca-cert.pem
          volumeMounts:
            - name: mitmproxy-ca-cert
              mountPath: /mitmproxy-ca-cert
              readOnly: true
            - name: mitmproxy-ca-key
              mountPath: /mitmproxy-ca-key
              readOnly: true
            - name: mitmproxy-data
              mountPath: /mitmproxy-data
      containers:
        - name: mitmproxy
          image: mitmproxy/mitmproxy:11
          command:
            - mitmweb
            - --listen-host
            - "0.0.0.0"
            - --listen-port
            - "8080"
            - --web-host
            - "0.0.0.0"
            - --web-port
            - "8081"
            - --set
            - confdir=/mitmproxy-data
            # Raw-tunnel the docker-ci DinD mTLS endpoint instead of intercepting
            # it: the loom/gym eval driver in claude-sandbox reaches the daemon by
            # its public name through this proxy, and docker mTLS must pass
            # end-to-end (interception would break the client-cert handshake). The
            # sandbox-escape implication is documented in ccnp-sandbox-proxy-egress.yaml.
            - --ignore-hosts
            - docker-ci\.allegedly\.works
          ports:
            - name: proxy
              containerPort: 8080
            - name: web
              containerPort: 8081
          volumeMounts:
            - name: mitmproxy-data
              mountPath: /mitmproxy-data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mitmproxy-ca-cert
          configMap:
            name: mitmproxy-ca-cert
        - name: mitmproxy-ca-key
          secret:
            secretName: mitmproxy-ca-key
        - name: mitmproxy-data
          emptyDir: {}
---
# Allow Authentik outpost to reach mitmweb UI (port 8081) for proxy auth.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-authentik-mitmproxy-ingress
  namespace: agents-mitmproxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mitmproxy
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - port: 8081
          protocol: TCP
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: Service
metadata:
  name: mitmproxy
  namespace: agents-mitmproxy
spec:
  selector:
    app.kubernetes.io/name: mitmproxy
  ports:
    - name: proxy
      port: 8080
      targetPort: 8080
    - name: web
      port: 8081
      targetPort: 8081
