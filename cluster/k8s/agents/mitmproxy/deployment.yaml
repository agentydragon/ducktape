apiVersion: apps/v1
kind: Deployment
metadata:
  name: mitmproxy
  namespace: agents-mitmproxy
  labels:
    app.kubernetes.io/name: mitmproxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mitmproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mitmproxy
    spec:
      initContainers:
        - name: mitmproxy-ca-init
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              cat /mitmproxy-ca/tls.key /mitmproxy-ca/tls.crt > /mitmproxy-data/mitmproxy-ca.pem
              cp /mitmproxy-ca/tls.crt /mitmproxy-data/mitmproxy-ca-cert.pem
          volumeMounts:
            - name: mitmproxy-ca
              mountPath: /mitmproxy-ca
              readOnly: true
            - name: mitmproxy-data
              mountPath: /mitmproxy-data
      containers:
        - name: mitmproxy
          # >=12.2.3 (mitmproxy#8214): the leaf's AuthorityKeyIdentifier now
          # copies the CA cert's SubjectKeyIdentifier instead of recomputing it
          # as SHA-1. cert-manager mints CA SKIs per RFC 7093 (truncated
          # SHA-256), so on <12.2.3 every intercepted leaf's AKID mismatched the
          # CA SKI and strict clients rejected the chain ("unable to get local
          # issuer certificate"). See
          # cluster/docs/lessons_learned/2026_06_25_mitmproxy_ca_ski_aki_mismatch.md.
          image: mitmproxy/mitmproxy:12.2.3
          command:
            - mitmweb
            - --listen-host
            - "0.0.0.0"
            - --listen-port
            - "8080"
            - --web-host
            - "0.0.0.0"
            - --web-port
            - "8081"
            - --set
            - confdir=/mitmproxy-data
            # Raw-tunnel the docker-ci DinD mTLS endpoint instead of intercepting
            # it: the loom/gym eval driver in claude-sandbox reaches the daemon by
            # its public name through this proxy, and docker mTLS must pass
            # end-to-end (interception would break the client-cert handshake). The
            # sandbox-escape implication is documented in ccnp-sandbox-proxy-egress.yaml.
            - --ignore-hosts
            - docker-ci\.allegedly\.works
          ports:
            - name: proxy
              containerPort: 8080
            - name: web
              containerPort: 8081
          volumeMounts:
            - name: mitmproxy-data
              mountPath: /mitmproxy-data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mitmproxy-ca
          secret:
            secretName: mitmproxy-ca
        - name: mitmproxy-data
          emptyDir: {}
