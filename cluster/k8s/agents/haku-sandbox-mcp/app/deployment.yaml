apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-sandbox-mcp
  namespace: haku-sandbox-mcp
  labels:
    app.kubernetes.io/name: haku-sandbox-mcp
  annotations:
    description: "Sandbox-provisioning MCP (haku/sandbox_mcp). Claims a warm Haku sandbox in haku-sandbox, bootstraps it, runs bounded bash via pods/exec, and disposes it. StaticBearerGuard on /mcp; cluster-internal, fronted by haku-console. Its SA holds the claim/exec RBAC into haku-sandbox."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-sandbox-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-sandbox-mcp
    spec:
      serviceAccountName: haku-sandbox-mcp
      # The server loads its Kubernetes identity from this token (manages claims
      # + pods/exec in haku-sandbox).
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/agentydragon/haku-sandbox-mcp:devel-20260812005214-0e981d8 # {"$imagepolicy": "flux-system:haku-sandbox-mcp"}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          env:
            - name: HAKU_SANDBOX_MCP_CONFIG_FILE
              value: /etc/haku-sandbox-mcp/config.yaml
            - name: HAKU_SANDBOX_MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-sandbox-mcp-bearer
                  key: bearer-token
          volumeMounts:
            - name: config
              mountPath: /etc/haku-sandbox-mcp
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: haku-sandbox-mcp-config
