apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: haku-sandbox-mcp-ingress
  namespace: haku-sandbox-mcp
  annotations:
    description: "Default-deny ingress for the sandbox-provisioning MCP. Only haku-console (which proxies the /mcp surface) may reach port 8765; the StaticBearerGuard is the second gate. No HTTPRoute — the server is cluster-internal only."
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haku-sandbox-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
