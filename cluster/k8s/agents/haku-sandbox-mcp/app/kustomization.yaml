apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - bearer.sops.yaml
  - deployment.yaml
  - service.yaml
  - role.yaml
  - rolebinding.yaml
  - networkpolicy.yaml
# The server's runtime config lives in a native config.yaml (with the reviewed
# per-claim bootstrap script) generated into the ConfigMap, not inlined here.
configMapGenerator:
  - name: haku-sandbox-mcp-config
    files:
      - config.yaml
generatorOptions:
  disableNameSuffixHash: true
