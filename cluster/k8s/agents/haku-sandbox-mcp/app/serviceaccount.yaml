# Identity the sandbox-provisioning MCP loads in-cluster to manage SandboxClaims
# + pods/exec in haku-sandbox (RBAC granted by role.yaml + rolebinding.yaml
# there). Unlike the console/manifold facades, this SA token IS mounted (the
# server needs the Kubernetes API).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-sandbox-mcp
  namespace: haku-sandbox-mcp
