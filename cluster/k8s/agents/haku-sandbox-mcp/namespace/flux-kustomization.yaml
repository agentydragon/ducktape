apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-sandbox-mcp-namespace
  namespace: flux-system
  annotations:
    description: Namespace for the sandbox-provisioning MCP server (haku/sandbox_mcp) that hands out Haku sandboxes in haku-sandbox.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 2m
  path: ./cluster/k8s/agents/haku-sandbox-mcp/namespace
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: haku-sandbox-mcp
