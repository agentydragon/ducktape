apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buildbuddy-api-key
  namespace: claude-sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    name: buildbuddy-api-key
    # Reuse the existing Flux-managed Secret during the staged ownership handoff.
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef:
        key: buildbuddy-api-key
        property: api-key
