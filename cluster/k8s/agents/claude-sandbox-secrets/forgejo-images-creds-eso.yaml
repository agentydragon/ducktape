# Mirror the ducktape-ci Forgejo registry pull credential into claude-sandbox so
# firecracker-manager (and the VM pods it spawns) and the loom-gym-eval Job can
# pull private Forgejo images. Reads straight from the source Secret in
# forgejo-images via the scoped kubernetes-forgejo-images-secret-store, so
# claude-sandbox never needs adding to the reflector annotations on
# cluster/k8s/forgejo-images/registry-creds.sops.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: claude-sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-forgejo-images-secret-store
    kind: ClusterSecretStore
  target:
    name: forgejo-images-creds
    template:
      type: kubernetes.io/dockerconfigjson
      mergePolicy: Merge
  dataFrom:
    - extract:
        key: forgejo-images-creds
