apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-telegram-bot-token
  namespace: claude-sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-external-creds-secret-store
    kind: ClusterSecretStore
  target:
    name: openclaw-telegram-bot-token
    # This target already exists without an ExternalSecret owner reference.
    # Orphan lets ESO refresh it in place; deleting this ExternalSecret leaves
    # the target Secret behind, which then needs explicit cleanup.
    creationPolicy: Orphan
  data:
    - secretKey: token
      remoteRef:
        key: openclaw-telegram-bot-token
        property: token
