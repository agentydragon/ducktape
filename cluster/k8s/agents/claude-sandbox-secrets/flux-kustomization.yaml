apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-sandbox-secrets
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/agents/claude-sandbox-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: claude-rbac
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: ollama-secrets
      namespace: ducktape-flux
