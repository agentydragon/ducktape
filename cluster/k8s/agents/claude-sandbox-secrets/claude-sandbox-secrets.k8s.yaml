apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: claude-sandbox
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-telegram-bot-token
  namespace: claude-sandbox
spec:
  data:
    - remoteRef:
        key: openclaw-telegram-bot-token
        property: token
      secretKey: token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Orphan
    name: openclaw-telegram-bot-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buildbuddy-api-key
  namespace: claude-sandbox
spec:
  data:
    - remoteRef:
        key: buildbuddy-api-key
        property: api-key
      secretKey: api-key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Orphan
    deletionPolicy: Retain
    name: buildbuddy-api-key
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-secret-reader
  namespace: claude-sandbox
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-sandbox-claude-forgejo-credentials-reader
  namespace: forgejo
rules:
  - apiGroups:
      - ""
    resourceNames:
      - claude-forgejo-credentials
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-sandbox-claude-forgejo-credentials-reader
  namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-sandbox-claude-forgejo-credentials-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: forgejo-secret-reader
    namespace: claude-sandbox
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-claude-sandbox-claude-forgejo-credentials-secret-store
spec:
  conditions:
    - namespaces:
        - claude-sandbox
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: forgejo-secret-reader
      remoteNamespace: forgejo
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-forgejo-credentials
  namespace: claude-sandbox
spec:
  dataFrom:
    - extract:
        key: claude-forgejo-credentials
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-claude-sandbox-claude-forgejo-credentials-secret-store
  target:
    creationPolicy: Owner
    name: claude-forgejo-credentials
