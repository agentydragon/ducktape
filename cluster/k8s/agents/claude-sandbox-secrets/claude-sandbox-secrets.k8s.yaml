apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: claude-sandbox
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-telegram-bot-token
  namespace: claude-sandbox
spec:
  data:
    - remoteRef:
        key: openclaw-telegram-bot-token
        property: token
      secretKey: token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Orphan
    name: openclaw-telegram-bot-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buildbuddy-api-key
  namespace: claude-sandbox
spec:
  data:
    - remoteRef:
        key: buildbuddy-api-key
        property: api-key
      secretKey: api-key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Orphan
    deletionPolicy: Retain
    name: buildbuddy-api-key
