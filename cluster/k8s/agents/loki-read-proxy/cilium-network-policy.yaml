# The proxy's only access control: it has no auth of its own. Ingress is
# restricted to Haku sandbox pods; egress is restricted to loki-read
# (plus DNS), so a compromised proxy cannot pivot anywhere else either.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-read-proxy
  namespace: loki-read-proxy
  annotations:
    description: "Ingress to the Loki read proxy only from haku-sandbox pods; egress only to loki-read and kube-dns. This policy IS the proxy's access control — the app itself is unauthenticated."
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki-read-proxy
  ingress:
    # Haku agent sandboxes → proxy (namespace-filtered log reads)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-sandbox
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # kube-dns (resolve loki-gateway.loki.svc)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # loki-read (UPSTREAM_URL) — bypasses loki-gateway's nginx entirely.
    # See ducktape#4750: nginx's resolver can get permanently pinned to a
    # dead CoreDNS pod IP after CoreDNS reschedules; this proxy only ever
    # queries, so it never needed gateway's read/write path routing.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: read
            k8s:io.kubernetes.pod.namespace: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
