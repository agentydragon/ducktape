# Who may reach the proxy at all. Anonymous requests are authorized only by the
# proxy's static allowlist, so this ingress fence is their access control;
# token-bearing requests are additionally authorized by the caller's Kubernetes
# RBAC. Ingress is restricted to Haku sandbox pods; egress is restricted to
# loki-read, the kube-apiserver (SelfSubjectAccessReview) and DNS, so a
# compromised proxy cannot pivot anywhere else either.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-read-proxy
  namespace: loki-read-proxy
  annotations:
    description: "Ingress to the Loki read proxy only from haku-sandbox pods; egress only to loki-read, kube-apiserver (SelfSubjectAccessReview for bearer requests) and kube-dns. This policy is the whole access control for anonymous (allowlist) requests."
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki-read-proxy
  ingress:
    # Haku agent sandboxes → proxy (namespace-filtered log reads)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-sandbox
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # kube-dns (resolve loki-gateway.loki.svc)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # loki-read (UPSTREAM_URL) — bypasses loki-gateway's nginx entirely.
    # See ducktape#4750: nginx's resolver can get permanently pinned to a
    # dead CoreDNS pod IP after CoreDNS reschedules; this proxy only ever
    # queries, so it never needed gateway's read/write path routing.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: read
            k8s:io.kubernetes.pod.namespace: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP

    # kube-apiserver: SelfSubjectAccessReview with the caller's bearer token.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
