apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-read-proxy
  namespace: loki-read-proxy
  labels:
    app.kubernetes.io/name: loki-read-proxy
  annotations:
    description: "Read-only namespace-filtering Loki query proxy for agents. Exposes only GET query/query_range and requires an exact namespace matcher in every query; Loki itself is auth_enabled:false, so agents must never reach it directly. A request with a Kubernetes bearer token is authorized by that token's RBAC (SelfSubjectAccessReview for get pods/log in the namespace); an anonymous request by the static NAMESPACE_ALLOWLIST, fenced by the CiliumNetworkPolicy next to it."
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki-read-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-read-proxy
    spec:
      imagePullSecrets:
        - name: forgejo-images-creds
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: git.allegedly.works/ducktape-ci/loki-read-proxy:devel-20260828071811-20a40e4 # {"$imagepolicy": "flux-system:loki-read-proxy"}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Namespaces an *anonymous* request may query. A request carrying
            # a Kubernetes bearer token ignores this list: its namespaces are
            # authorized by the token's RBAC instead.
            # cluster/validation:test_cluster_integration asserts every
            # Namespace with rbac.ducktape.io/agent-readable-logs=true is
            # included here, so the GitOps label and Loki policy cannot drift.
            # csi-proxmox and cpap-sync are separately reviewed Haku-only
            # exceptions retained from the original proxy policy.
            - name: NAMESPACE_ALLOWLIST
              value: "activitywatch,airlock,analytics,authentik,cert-manager,clickhouse,cli-proxy-api,cnpg-system,cpap-sync,csi-proxmox,docker-ci,flux-system,gatus,grocy-sf,grocy-vallejo,haku-ci,kube-system,litellm,local-path-storage,loki,monitoring,node-feature-discovery,nvidia-device-plugin,oci-cache,openebs,osm-mcp,plaid-mcp,proxmox-proxy,props,study-casino,tana-mcp"
            # Points at loki-read directly, bypassing loki-gateway's nginx —
            # matches how Grafana's own datasource reaches Loki. nginx's DNS
            # resolver can get permanently pinned to a dead CoreDNS pod IP
            # after CoreDNS reschedules (ducktape#4750); this proxy only
            # ever queries, so it never needed gateway's read/write path
            # routing in the first place.
            # Must stay in sync with the egress CiliumNetworkPolicy in this
            # directory, which only allows loki-read.
            - name: UPSTREAM_URL
              value: "http://loki-read.loki.svc:3100"
            # The pod mounts no ServiceAccount token (bearer requests are
            # authorized with the caller's own token), so the apiserver CA
            # comes from the kube-root-ca.crt ConfigMap volume below.
            - name: KUBERNETES_CA_FILE
              value: /var/run/kube-root-ca/ca.crt
          volumeMounts:
            - name: kube-root-ca
              mountPath: /var/run/kube-root-ca
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: kube-root-ca
          configMap:
            name: kube-root-ca.crt
