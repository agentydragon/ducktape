apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-read-proxy
  namespace: loki-read-proxy
  labels:
    app.kubernetes.io/name: loki-read-proxy
  annotations:
    description: "Read-only namespace-filtering Loki query proxy for the Haku agent. Exposes only GET query/query_range and requires an exact allowlisted namespace matcher in every query; Loki itself is auth_enabled:false, so agents must never reach it directly. No auth of its own — the CiliumNetworkPolicy next to it is the access control."
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki-read-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-read-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: ghcr.io/agentydragon/loki-read-proxy:devel-20260820155429-7d1b05b # {"$imagepolicy": "flux-system:loki-read-proxy"}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Namespaces agents may query through this network-isolated proxy.
            # cluster/validation:test_cluster_integration asserts every
            # Namespace with rbac.ducktape.io/agent-readable-logs=true is
            # included here, so the GitOps label and Loki policy cannot drift.
            # csi-proxmox and cpap-sync are separately reviewed Haku-only
            # exceptions retained from the original proxy policy.
            - name: NAMESPACE_ALLOWLIST
              value: "activitywatch,airlock,analytics,authentik,cert-manager,cli-proxy-api,cnpg-system,cpap-sync,csi-proxmox,docker-ci,flux-system,gatus,grocy-sf,grocy-vallejo,haku-ci,kube-system,litellm,local-path-storage,loki,monitoring,node-feature-discovery,nvidia-device-plugin,oci-cache,openebs,osm-mcp,plaid-mcp,proxmox-proxy,props,study-casino,tana-mcp"
            # Points at loki-read directly, bypassing loki-gateway's nginx —
            # matches how Grafana's own datasource reaches Loki. nginx's DNS
            # resolver can get permanently pinned to a dead CoreDNS pod IP
            # after CoreDNS reschedules (ducktape#4750); this proxy only
            # ever queries, so it never needed gateway's read/write path
            # routing in the first place.
            # Must stay in sync with the egress CiliumNetworkPolicy in this
            # directory, which only allows loki-read.
            - name: UPSTREAM_URL
              value: "http://loki-read.loki.svc:3100"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
