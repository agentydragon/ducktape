apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-read-proxy
  namespace: loki-read-proxy
  labels:
    app.kubernetes.io/name: loki-read-proxy
  annotations:
    description: "Read-only namespace-filtering Loki query proxy for the Haku agent. Exposes only GET query/query_range and requires an exact allowlisted namespace matcher in every query; Loki itself is auth_enabled:false, so agents must never reach it directly. No auth of its own — the CiliumNetworkPolicy next to it is the access control."
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki-read-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-read-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: ghcr.io/agentydragon/loki-read-proxy:devel-20260731195105-a284fd9 # {"$imagepolicy": "flux-system:loki-read-proxy"}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Namespaces Haku may read logs from. The first ten mirror the
            # infrastructure set Haku already has logs/configmaps RBAC for
            # (agent-rbac `logs-configmaps-reader` bindings); cpap-sync and
            # plaid-mcp deliberately go beyond that set (operator-reviewed:
            # Haku operates both services and needs their logs to debug them).
            - name: NAMESPACE_ALLOWLIST
              value: "flux-system,monitoring,kube-system,cnpg-system,cert-manager,local-path-storage,openebs,csi-proxmox,node-feature-discovery,nvidia-device-plugin,cpap-sync,plaid-mcp"
            # Must stay in sync with the egress CiliumNetworkPolicy in this
            # directory, which only allows the Loki gateway.
            - name: UPSTREAM_URL
              value: "http://loki-gateway.loki.svc:80"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
