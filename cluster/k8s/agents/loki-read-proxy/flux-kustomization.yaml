apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Read-only namespace-filtering Loki query proxy so Haku can read logs for allowlisted namespaces without touching Loki (auth_enabled:false) directly.
  name: loki-read-proxy
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: loki-read-proxy
      namespace: loki-read-proxy
  interval: 10m
  path: ./cluster/k8s/agents/loki-read-proxy
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: loki-read-proxy
    namespace: ducktape-flux
  timeout: 5m
  wait: true
