apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-machine-access-tf
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/agents/machine-access-tf
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: agent-machine-access
      namespace: flux-system
  timeout: 10m
  dependsOn:
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
    - name: authentik
      namespace: ducktape-flux
    # The HA OAuth Secret is retained as a rollback tombstone until the static
    # bearer migration's expiry window; its namespace must still exist.
    - name: ha-mcp-namespace
      namespace: ducktape-flux
