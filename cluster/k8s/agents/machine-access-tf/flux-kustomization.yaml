apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-machine-access-tf
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/agents/machine-access-tf
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: agent-machine-access
      namespace: flux-system
  timeout: 10m
  dependsOn:
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
    - name: authentik
      namespace: ducktape-flux
    # TF writes grocy-mcp-oidc secrets into per-household namespaces.
    - name: grocy-sf
      namespace: ducktape-flux
    - name: grocy-vallejo
      namespace: ducktape-flux
    - name: tana-mcp
      namespace: ducktape-flux
    # TF writes the `kubectl-sandbox-mcp` secret into the `kubectl-sandbox-mcp`
    # namespace, so that namespace must exist first.
    - name: kubectl-sandbox-mcp-namespace
      namespace: ducktape-flux
    # Same for manifold-mcp.
    - name: manifold-mcp-namespace
      namespace: ducktape-flux
    # Same for postscanmail-mcp.
    - name: postscanmail-mcp-namespace
      namespace: ducktape-flux
    # TF writes the `ha-mcp-oidc` Secret into the HA-MCP namespace.
    - name: ha-mcp-namespace
      namespace: ducktape-flux
    # Same for plaid-mcp.
    - name: plaid-mcp-namespace
      namespace: ducktape-flux
    # TF writes the `haku-console-oidc` secret (MCP OIDCProxy + operator-login client
    # credentials + session secret) into the `haku-console` namespace.
    - name: haku-console-namespace
      namespace: ducktape-flux
    # TF also writes public-coder-agent's proxy-held Haku Console bearer into this namespace.
    - name: public-coder-agent-namespace
      namespace: ducktape-flux
