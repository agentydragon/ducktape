apiVersion: v1
kind: Namespace
metadata:
  name: gmail-labeling
  labels:
    # Single low-traffic server; VPA recommendations add no value here.
    goldilocks.fairwinds.com/enabled: "false"
  annotations:
    description: >-
      Holds the gmail-labeling MCP server and its Airlock-provisioned gmail.modify
      access token. Deliberately separate from haku-sandbox so Haku never holds the
      Gmail write token — it reaches this server only via a static bearer.
