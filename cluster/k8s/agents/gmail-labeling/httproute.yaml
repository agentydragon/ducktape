apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gmail-labeling
  namespace: gmail-labeling
  annotations:
    description: >-
      Public bearer-gated route to the gmail-labeling MCP server. The server enforces
      a static bearer (haku-gmail-labeling-token) and exposes only namespace-scoped
      label tools, with the gmail.modify token injected server-side — the bearer is the
      only gate. Exists so Haku's Claude Code web home can reach it directly via
      `fastmcp call https://gmail-labeling.allegedly.works/mcp --auth <bearer>`.
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "gmail-labeling.allegedly.works"
  rules:
    - backendRefs:
        - name: gmail-labeling
          port: 8080
      timeouts:
        request: "60s"
        backendRequest: "60s"
