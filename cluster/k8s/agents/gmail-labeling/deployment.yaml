apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmail-labeling
  namespace: gmail-labeling
  labels:
    app.kubernetes.io/name: gmail-labeling
  annotations:
    description: >-
      Namespace-scoped Gmail label MCP server for the Haku background agent. Manages
      only labels under the `haku/` prefix (enforced in-process), creating/applying/
      removing/renaming/deleting them. Holds the Airlock-provisioned gmail.modify
      access token (mounted, read-only); callers authenticate with a static bearer
      (haku-gmail-labeling-token, reflected into haku-sandbox). Exposed publicly via a
      bearer-gated HTTPRoute (gmail-labeling.allegedly.works) so Haku's Claude Code web
      home can reach it with fastmcp.
    # Restart only when the bearer rotates — NOT on gmail.modify token rotation, which
    # the server picks up by re-reading the mounted secret (google-auth refresh_handler).
    secret.reloader.stakater.com/reload: "haku-gmail-labeling-token"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gmail-labeling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gmail-labeling
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: server
          image: ghcr.io/agentydragon/gmail-labeling:latest # {"$imagepolicy": "flux-system:gmail-labeling"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GMAIL_LABELING_ALLOWED_PREFIX
              value: "haku/"
            - name: GMAIL_LABELING_GMAIL_TOKEN_DIR
              value: /etc/gmail-token
            # Static bearer callers must present (the only gate; distinct from the
            # gmail.modify token, which never leaves this pod).
            - name: GMAIL_LABELING_STATIC_BEARER
              valueFrom:
                secretKeyRef:
                  name: haku-gmail-labeling-token
                  key: token
          volumeMounts:
            # gmail.modify access token (access_token + expires_at), written by Airlock
            # into the airlock namespace and mirrored here by ESO. Rotates in place;
            # the server re-reads it via google-auth's refresh_handler.
            - name: gmail-token
              mountPath: /etc/gmail-token
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
      volumes:
        - name: gmail-token
          secret:
            secretName: gmail-modify-access-token
