# CLEANUP(2026-04-13): Delete this file by 2026-04-14. Ad-hoc debug grant
#   added to let the Claude agent investigate the Authentik MCP POC JWT
#   federation failure (see <../../../../x/authentik_mcp_poc/NOTES.md>) —
#   specifically: read authentik-server logs, exec into it to dump proxy
#   provider state, and read the OIDC client_secret in `authentik-mcp-poc`
#   so we can replay the token swap manually. Once the root cause is
#   fixed, delete this file, remove it from kustomization.yaml, and commit.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-authentik-debug
  namespace: authentik
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods/exec
    # Both `get` and `create` are required: kubectl exec opens a websocket
    # upgrade via GET first, then falls back to POST (mapped to `create`).
    # RBAC denies the request at the GET check unless `get` is granted.
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-authentik-debug
  namespace: authentik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-authentik-debug
subjects:
  - kind: ServiceAccount
    name: claude-code-web
    namespace: default
---
# Secret read + pod exec in the POC namespace (the OIDC client credentials
# the MCP server consumes, plus the ability to drop into the server pod
# and introspect the runtime token store during debug). Intentionally
# scoped narrower than the authentik ns Role so we don't accidentally
# expand persistent secret read.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-authentik-mcp-poc-secrets-debug
  namespace: authentik-mcp-poc
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-authentik-mcp-poc-secrets-debug
  namespace: authentik-mcp-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-authentik-mcp-poc-secrets-debug
subjects:
  - kind: ServiceAccount
    name: claude-code-web
    namespace: default
