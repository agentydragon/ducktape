apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-claude-token-reader
  namespace: authentik
  annotations:
    description: >-
      Allows Claude's kubectl identity to read the claude-authentik-api-token
      secret written by the sso-providers Terraform module.
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["claude-authentik-api-token"]
    verbs: ["get"]
