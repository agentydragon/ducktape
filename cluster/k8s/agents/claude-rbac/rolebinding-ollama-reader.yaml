apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-ollama-reader
  namespace: ollama
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ollama-reader
subjects:
  - kind: ServiceAccount
    name: claude-code-web
    namespace: default
  - kind: ServiceAccount
    name: default
    namespace: claude-sandbox
  - kind: Group
    name: oidc-ksbx-groups:kubectl-sandbox-users
    apiGroup: rbac.authorization.k8s.io
