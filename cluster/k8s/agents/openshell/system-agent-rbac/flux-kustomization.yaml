apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openshell-system-agent-rbac
  namespace: flux-system
  annotations:
    description: Time-boxed read-only log access for the agent-lab experiments on the OpenShell control plane in openshell-system. Remove after 2026-07-30.
spec:
  interval: 10m
  path: ./cluster/k8s/agents/openshell/system-agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  # Isolated from agent-lab per the agent RBAC convention: a missing or
  # suspended openshell-system namespace must not block the lab namespace
  # itself from applying.
  dependsOn:
    - name: openshell-namespace
    - name: agent-lab
