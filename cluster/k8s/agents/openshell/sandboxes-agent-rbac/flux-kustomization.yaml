apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openshell-sandboxes-agent-rbac
  namespace: flux-system
  annotations:
    description: Time-boxed log/exec access for the agent-lab experiments on sandbox pods, which the OpenShell operator always places in openshell-sandboxes. Remove after 2026-07-30.
spec:
  interval: 10m
  path: ./cluster/k8s/agents/openshell/sandboxes-agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  # Isolated from agent-lab per the agent RBAC convention: a missing or
  # suspended openshell-sandboxes namespace must not block the lab namespace
  # itself from applying.
  dependsOn:
    - name: openshell-sandboxes
    - name: agent-lab
