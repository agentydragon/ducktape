apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openshell-operator
  namespace: flux-system
  annotations:
    description: OpenShell gateway and Kubernetes-native provider/sandbox operator for OpenClaw.
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/agents/openshell/operator
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
    - name: openclaw-gateway-namespace
    - name: openclaw-sandbox
    - name: agent-sandbox-controller
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openshell
      namespace: openclaw-gateway
