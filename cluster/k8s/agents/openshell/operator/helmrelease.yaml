apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openshell
  namespace: openclaw-gateway
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: openshell-operator
      version: "0.4.0"
      sourceRef:
        kind: HelmRepository
        name: openshell-operator
        namespace: openclaw-gateway
      interval: 12h
  # The bundled gateway chart does not expose storageClassName for its
  # StatefulSet claim. This cluster deliberately has no default StorageClass.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: openshell-gateway
            patch: |
              - op: add
                path: /spec/volumeClaimTemplates/0/spec/storageClassName
                value: local-path-ovh
  values:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    openshellGateway:
      server:
        sandboxNamespace: openclaw-sandbox
        workspaceDefaultStorageSize: 4Gi
      networkPolicy:
        enabled: true
