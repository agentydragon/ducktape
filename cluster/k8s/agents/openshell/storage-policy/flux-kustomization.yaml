apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openshell-storage-policy
  namespace: flux-system
  annotations:
    description: Storage defaults for OpenShell-managed Agent Sandbox claims.
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/agents/openshell/storage-policy
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: kyverno
    - name: agent-sandbox-controller
    - name: openshell-sandboxes
