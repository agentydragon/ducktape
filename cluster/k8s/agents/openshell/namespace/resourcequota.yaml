apiVersion: v1
kind: ResourceQuota
metadata:
  name: openshell-quota
  namespace: openshell-system
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    services: "10"
    configmaps: "20"
    persistentvolumeclaims: "10"
    requests.storage: 40Gi
