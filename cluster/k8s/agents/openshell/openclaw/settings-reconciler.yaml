# OpenShell 0.0.90 exposes gateway-global feature settings through its API, but
# neither the gateway Helm chart nor the Kubernetes operator has a declarative
# field for them. Reapply the supported CLI operation periodically so the
# Providers v2 contract is repaired after database replacement or manual drift.
#
# Providers v2 exposes the GitHub provider's `GITHUB_TOKEN` credential as an
# opaque placeholder inside attached sandboxes. OpenShell's supervisor proxy
# substitutes the real token only on policy-approved requests.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openshell-global-settings
  namespace: openclaw-gateway
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openshell-global-settings
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              # kustomization.yaml keeps this on the same Flux ImagePolicy as
              # OpenClaw; the derivative image pins the matching 0.0.90 CLI.
              image: ghcr.io/agentydragon/openclaw
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/openshell
              args:
                - settings
                - set
                - --global
                - --key
                - providers_v2_enabled
                - --value
                - "true"
                - --yes
              env:
                - name: HOME
                  value: /home/openclaw
                - name: OPENSHELL_GATEWAY
                  value: openclaw
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: openshell-cli-config
                  mountPath: /home/openclaw/.config/openshell/gateways/openclaw
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: openshell-cli-config
              secret:
                secretName: openshell-cli-config
                # OpenShell looks for the private CA at mtls/ca.crt. Keep this
                # layout identical to the long-running OpenClaw mount.
                items:
                  - key: metadata.json
                    path: metadata.json
                  - key: oidc_token.json
                    path: oidc_token.json
                  - key: ca.crt
                    path: mtls/ca.crt
            - name: tmp
              emptyDir: {}
