apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openshell-github-credentials
  namespace: openclaw-gateway
  annotations:
    description: Adapts the reflected agentydragon-agent PAT to OpenShell's GitHub provider schema.
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-openclaw-gateway-secret-store
    kind: ClusterSecretStore
  target:
    name: openshell-github-credentials
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          openshell.lenshq.io/allow-provider-ref: "true"
  data:
    - secretKey: api_token
      remoteRef:
        key: github-token
        property: token
