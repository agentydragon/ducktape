apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openshell-github-credentials
  namespace: openshell-system
  annotations:
    description: Adapts the agentydragon-agent PAT to OpenShell's GitHub runtime environment.
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-claude-sandbox-secret-store
    kind: ClusterSecretStore
  target:
    name: openshell-github-credentials
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          openshell.lenshq.io/allow-provider-ref: "true"
  data:
    # OpenShell injects provider credential keys literally. `api_token` is the
    # profile field name, while provider instances must store an env key such
    # as GITHUB_TOKEN (the form used by NVIDIA's GitHub provider example).
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: github-token
        property: token
