# Render the operator's generated bearer and private CA into OpenShell's native
# on-disk CLI configuration. Mounting this Secret lets the stock `openshell`
# binary authenticate without a bootstrap command or token in the image.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openshell-cli-config
  namespace: openclaw-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-openclaw-gateway-secret-store
    kind: ClusterSecretStore
  target:
    name: openshell-cli-config
    creationPolicy: Owner
    template:
      data:
        metadata.json: |
          {
            "name": "openclaw",
            "gateway_endpoint": "https://openshell-gateway.openclaw-gateway.svc.cluster.local:8080",
            "is_remote": true,
            "gateway_port": 8080,
            "auth_mode": "oidc",
            "oidc_issuer": "http://openshell-issuer:8081",
            "oidc_client_id": "openshell-operator",
            "oidc_audience": "openshell-operator"
          }
        oidc_token.json: |
          {
            "access_token": "{{ .token }}",
            "issuer": "http://openshell-issuer:8081",
            "client_id": "openshell-operator"
          }
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: token
      remoteRef:
        key: openshell-openshell-operator-token
        property: token
    - secretKey: ca
      remoteRef:
        key: openshell-server-tls
        property: ca.crt
