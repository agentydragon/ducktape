apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openshell-openclaw
  namespace: flux-system
  annotations:
    description: Secret-backed GitHub credential provider injected through the OpenShell proxy.
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/agents/openshell/openclaw
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  dependsOn:
    - name: openshell-operator
    - name: agent-shared-secrets
    - name: external-secrets-config
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: openshell-cli-config
      namespace: openclaw-gateway
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: openshell-github-credentials
      namespace: openshell-system
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: openshell-client-tls
      namespace: openshell-sandboxes
    - apiVersion: openshell.lenshq.io/v1alpha1
      kind: OpenShellProvider
      name: agentydragon-github
      namespace: openshell-system
