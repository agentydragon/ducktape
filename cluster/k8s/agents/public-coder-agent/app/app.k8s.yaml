apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: Second OpenClaw agent, egress-confined to a CONNECT proxy and reachable only through the Authentik proxy outpost. Opens pull requests against public repositories as agentydragon-agent.
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: auto
    name: public-coder-agent
    rbac.ducktape.io/agent-readable-metadata: "true"
  name: public-coder-agent
spec: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: public-coder-agent
imagePullSecrets:
  - name: forgejo-images-creds
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-coder-agent-config
  namespace: public-coder-agent
data:
  openclaw.json5: |
    {
      "agents": {
        "ownership": "explicit",
        "defaults": {
          "userTimezone": "America/Los_Angeles",
          "model": {
            "primary": "litellm/chatgpt/oai-responses/gpt-6-luna"
          },
          "sandbox": {
            "mode": "off"
          },
          "maxConcurrent": 16,
          "subagents": {
            "maxConcurrent": 16,
            "maxChildrenPerAgent": 16
          },
          "skills": [],
          "verboseDefault": "full"
        },
        "entries": {
          "coder": {
            "name": "Coder"
          },
          "haku_console_tpm": {
            "name": "Haku Console TPM",
            "model": {
              "primary": "litellm/chatgpt/oai-responses/gpt-6-astra"
            }
          }
        }
      },
      "bindings": [
        {
          "agentId": "coder",
          "match": {
            "channel": "matrix"
          }
        }
      ],
      "memory": {
        "search": {
          "enabled": true,
          "sources": [
            "memory"
          ],
          "provider": "openai-compatible",
          "model": "ollama/olm-embed/qwen3-embedding-4b",
          "remote": {
            "baseUrl": "http://litellm.litellm.svc.cluster.local:4000/v1",
            "apiKey": "${OPENCLAW_LITELLM_API_KEY}"
          }
        }
      },
      "commands": {
        "config": false,
        "mcp": false,
        "restart": false
      },
      "channels": {
        "matrix": {
          "enabled": true,
          "homeserver": "https://matrix.allegedly.works",
          "proxy": "http://public-coder-agent-proxy.public-coder-agent.svc:8080",
          "userId": "@public-coder-agent:allegedly.works",
          "dm": {
            "policy": "allowlist",
            "allowFrom": [
              "@agentydragon:allegedly.works"
            ],
            "sessionScope": "per-room"
          },
          "groupPolicy": "disabled",
          "autoJoin": "always",
          "threadReplies": "always"
        }
      },
      "cron": {
        "enabled": true,
        "triggers": {
          "enabled": true
        }
      },
      "gateway": {
        "auth": {
          "mode": "trusted-proxy",
          "trustedProxy": {
            "allowLoopback": true,
            "allowUsers": [
              "agentydragon"
            ],
            "requiredHeaders": [
              "x-authentik-email",
              "x-forwarded-host",
              "x-forwarded-proto"
            ],
            "userHeader": "x-authentik-username",
            "deviceAutoApprove": {
              "enabled": true,
              "scopes": [
                "operator.read",
                "operator.write",
                "operator.approvals",
                "operator.questions",
                "operator.admin"
              ]
            }
          }
        },
        "bind": "lan",
        "controlUi": {
          "allowedOrigins": [
            "https://public-coder-agent.allegedly.works"
          ]
        },
        "mode": "local",
        "trustedProxies": [
          "10.0.0.0/8"
        ]
      },
      "hooks": {
        "internal": {
          "entries": {
            "session-memory": {
              "enabled": true,
              "llmSlug": false,
              "messages": 15
            }
          }
        }
      },
      "models": {
        "providers": {
          "litellm": {
            "agentRuntime": {
              "id": "openclaw"
            },
            "api": "openai-responses",
            "apiKey": "${OPENCLAW_LITELLM_API_KEY}",
            "baseUrl": "http://litellm.litellm.svc.cluster.local:4000/v1",
            "models": [
              {
                "contextWindow": 872000,
                "id": "chatgpt/oai-responses/gpt-6-astra",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 128000,
                "name": "GPT-6 Astra (Codex subscription via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 372000,
                "id": "chatgpt/oai-responses/gpt-6-luna",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 128000,
                "name": "GPT-6 Luna (Codex subscription via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 372000,
                "id": "chatgpt/oai-responses/gpt-6-sol",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 128000,
                "name": "GPT-6 Sol (Codex subscription via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 1048576,
                "id": "google/goog-generate/gemini-3.7-flash",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 65536,
                "name": "Gemini 3.7 Flash (Google AI via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 1048576,
                "id": "google/goog-generate/gemini-3.5-flash-lite",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 65536,
                "name": "Gemini 3.5 Flash-Lite (Google AI via LiteLLM)",
                "reasoning": false
              },
              {
                "contextWindow": 200000,
                "id": "antigravity/ant-messages/claude-opus-4-6-thinking",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 64000,
                "name": "Claude Opus 4.6 (Thinking) (Google Antigravity via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 200000,
                "id": "antigravity/ant-messages/claude-sonnet-4-6",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 64000,
                "name": "Claude Sonnet 4.6 (Thinking) (Google Antigravity via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 1048576,
                "id": "antigravity/ant-messages/gemini-3.6-flash-high",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 65536,
                "name": "Gemini 3.6 Flash (Google Antigravity via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 1048576,
                "id": "antigravity/ant-messages/gemini-3.7-flash-high",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 65536,
                "name": "Gemini 3.7 Flash (Google Antigravity via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 1048576,
                "id": "antigravity/ant-messages/gemini-3.8-flash-high",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 65536,
                "name": "Gemini 3.8 Flash (Google Antigravity via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 1048576,
                "id": "antigravity/ant-messages/gemini-3-flash",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 65536,
                "name": "Gemini 3 Flash (Google Antigravity via LiteLLM)",
                "reasoning": false
              },
              {
                "contextWindow": 1048576,
                "id": "antigravity/ant-messages/gemini-pro-agent",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 65535,
                "name": "Gemini 3.1 Pro (High) (Google Antigravity via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 1048576,
                "id": "antigravity/ant-messages/gemini-3.1-pro-low",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 65535,
                "name": "Gemini 3.1 Pro (Low) (Google Antigravity via LiteLLM)",
                "reasoning": false
              },
              {
                "contextWindow": 114000,
                "id": "antigravity/ant-messages/gpt-oss-120b-medium",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 32768,
                "name": "GPT-OSS 120B (Medium) (Google Antigravity via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 1048576,
                "id": "antigravity/ant-messages/gemini-3.1-flash-lite",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 65535,
                "name": "Gemini 3.1 Flash Lite (Google Antigravity via LiteLLM)",
                "reasoning": false
              }
            ],
            "request": {
              "allowPrivateNetwork": true
            }
          }
        }
      },
      "mcp": {
        "servers": {
          "haku-console": {
            "url": "https://haku.allegedly.works/mcp",
            "transport": "streamable-http",
            "supportsParallelToolCalls": true,
            "requestTimeoutMs": 70000,
            "headers": {
              "Authorization": "Bearer ${HAKU_CONSOLE_TOKEN}"
            }
          }
        }
      },
      "plugins": {
        "entries": {
          "matrix": {
            "enabled": true
          },
          "brave": {
            "enabled": true,
            "config": {
              "webSearch": {
                "apiKey": {
                  "source": "env",
                  "id": "BRAVE_API_KEY"
                },
                "mode": "web"
              }
            }
          },
          "canvas": {
            "enabled": false
          },
          "device-pair": {
            "enabled": false
          },
          "file-transfer": {
            "enabled": false
          },
          "talk-voice": {
            "enabled": false
          },
          "ollama": {
            "enabled": false
          }
        }
      },
      "tools": {
        "sessions": {
          "visibility": "all"
        },
        "agentToAgent": {
          "enabled": true,
          "allow": [
            "haku_console_tpm",
            "coder"
          ]
        },
        "web": {
          "search": {
            "enabled": true,
            "provider": "brave",
            "maxResults": 5,
            "timeoutSeconds": 30,
            "cacheTtlMinutes": 15
          }
        }
      }
    }
immutable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-coder-agent-kubeconfig
  namespace: public-coder-agent
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://haku-kubeapi.allegedly.works
          proxy-url: http://public-coder-agent-proxy.public-coder-agent.svc:8080
          certificate-authority: /etc/ssl/certs/ca-certificates.crt
    contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          namespace: public-coder-agent
          user: haku-agent
    current-context: in-cluster
    users:
      - name: haku-agent
        user:
          token: proxy-haku-console-placeholder
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: public-coder-agent-github-token
  namespace: public-coder-agent
spec:
  data:
    - remoteRef:
        key: github-agentydragon-agent
        property: token
      secretKey: GITHUB_TOKEN
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: public-coder-agent-github-token
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: public-coder-agent-gateway-password-generator
  namespace: public-coder-agent
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: public-coder-agent-gateway-password
  namespace: public-coder-agent
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: public-coder-agent-gateway-password-generator
  refreshInterval: 8760h
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: public-coder-agent-gateway-password
    template:
      data:
        password: "{{ .password }}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    description: Worker-local replacement for the archived Public Coder OpenClaw state. WaitForFirstConsumer binds it to ovh-ns102453 when the one-off restore Pod is created; it must not be mounted by the Deployment before restore.
  name: public-coder-agent-state-v2
  namespace: public-coder-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 80Gi
  storageClassName: local-path-ovh-hdd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    description: Heap snapshots and Node diagnostic reports for the OpenClaw gateway
  name: public-coder-agent-diagnostics
  namespace: public-coder-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path-ovh-hdd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: public-coder-agent
  name: public-coder-agent
  namespace: public-coder-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: public-coder-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-coder-agent
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ovh-ns102453
      automountServiceAccountToken: false
      containers:
        - env:
            - name: HOME
              value: /home/openclaw
            - name: OPENCLAW_CONFIG_PATH
              value: /home/openclaw/.openclaw/openclaw.json5
            - name: NPM_CONFIG_PREFIX
              value: /home/openclaw/.local
            - name: NPM_CONFIG_CACHE
              value: /home/openclaw/.cache/npm
            - name: OPENCLAW_MEMORY_INDEX_CONCURRENCY
              value: "1"
            - name: OPENCLAW_MEMORY_RETRY_BASE_DELAY_MS
              value: "30000"
            - name: OPENCLAW_MEMORY_RETRY_MAX_DELAY_MS
              value: "120000"
            - name: OPENCLAW_AGENT_DB_STARTUP_INTEGRITY_CHECK
              value: none
            - name: OPENCLAW_AGENT_DB_MAINTENANCE_LEASE_MS
              value: "86400000"
            - name: OPENCLAW_DATABASE_VERIFY
              value: "off"
            - name: OPENCLAW_LOG_LEVEL
              value: debug
            - name: GITHUB_TOKEN
              value: proxy-github-placeholder
            - name: GH_PAT
              value: proxy-github-placeholder
            - name: HAKU_CONSOLE_TOKEN
              value: proxy-haku-console-placeholder
            - name: CLICKHOUSE_PUBLIC_CODER_USER
              value: public_coder_analytics
            - name: CLICKHOUSE_PUBLIC_CODER_PASSWORD
              value: proxy-clickhouse-public-coder-password
            - name: AIQUOTA_API_BEARER_TOKEN
              value: proxy-aiquota-api-bearer-placeholder
            - name: BRAVE_API_KEY
              value: proxy-brave-search-api-key-placeholder
            - name: OPENCLAW_LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: litellm-key-public-coder-agent
            - name: OPENCLAW_GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: public-coder-agent-gateway-password
            - name: MATRIX_PASSWORD
              value: proxy-matrix-password-placeholder
            - name: NODE_USE_ENV_PROXY
              value: "1"
            - name: HTTP_PROXY
              value: http://public-coder-agent-proxy.public-coder-agent.svc:8080
            - name: HTTPS_PROXY
              value: http://public-coder-agent-proxy.public-coder-agent.svc:8080
            - name: NO_PROXY
              value: 127.0.0.1,localhost,litellm.litellm.svc,litellm.litellm.svc.cluster.local
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: PIP_CERT
              value: /etc/ssl/certs/ca-certificates.crt
          image: git.allegedly.works/ducktape-ci/public-coder-agent:unset
          name: openclaw
          ports:
            - containerPort: 18789
              name: gateway
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: gateway
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 768Mi
          volumeMounts:
            - mountPath: /home/openclaw/.openclaw
              name: data
            - mountPath: /home/openclaw/.kube
              name: kubeconfig
              readOnly: true
            - mountPath: /etc/ssl/certs/ca-certificates.crt
              name: trust
              readOnly: true
              subPath: ca-certificates.crt
            - mountPath: /home/openclaw/.ssh
              name: ssh
              readOnly: true
            - mountPath: /tmp
              name: tmp
            - mountPath: /diag
              name: diagnostics
      imagePullSecrets:
        - name: forgejo-images-creds
      initContainers:
        - command:
            - sh
            - -c
            - |
              cp /cfg/openclaw.json5 /state/openclaw.json5
              rm -f /state/openclaw.json5.last-good /state/openclaw.json5.bak*
          image: git.allegedly.works/ducktape-ci/public-coder-agent:unset
          name: seed-config
          volumeMounts:
            - mountPath: /cfg
              name: cfg
            - mountPath: /state
              name: data
      securityContext:
        fsGroup: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: public-coder-agent-state-v2
        - configMap:
            name: public-coder-agent-kubeconfig
          name: kubeconfig
        - configMap:
            name: public-coder-agent-config
          name: cfg
        - configMap:
            name: public-coder-agent-proxy-ca-cert
          name: trust
        - name: ssh
          projected:
            defaultMode: 288
            sources:
              - configMap:
                  name: public-coder-agent-ssh
              - secret:
                  name: public-coder-agent-devbox-ssh-key
        - emptyDir: {}
          name: tmp
        - name: diagnostics
          persistentVolumeClaim:
            claimName: public-coder-agent-diagnostics
---
apiVersion: v1
kind: Service
metadata:
  name: public-coder-agent
  namespace: public-coder-agent
spec:
  ports:
    - name: gateway
      port: 18789
      protocol: TCP
      targetPort: 18789
  selector:
    app.kubernetes.io/name: public-coder-agent
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-coder-agent-egress
  namespace: public-coder-agent
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 8080
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: public-coder-agent-proxy
    - ports:
        - port: 2222
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: public-coder-agent-sshpiper
    - ports:
        - port: 4000
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
  podSelector:
    matchLabels:
      app.kubernetes.io/name: public-coder-agent
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-coder-agent-ingress
  namespace: public-coder-agent
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              app.kubernetes.io/component: server
              app.kubernetes.io/instance: authentik
      ports:
        - port: 18789
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: public-coder-agent
  policyTypes:
    - Ingress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    description: Read-only diagnostic access for the public-coder access profile.
  name: public-coder-agent-reader
  namespace: public-coder-agent
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - events
      - services
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
      - ingresses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
      - ocirepositories
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - kubevirt.io
    resourceNames:
      - public-coder-devbox
    resources:
      - virtualmachines
    verbs:
      - get
  - apiGroups:
      - kubevirt.io
    resourceNames:
      - public-coder-devbox
    resources:
      - virtualmachineinstances
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    description: Binds public-coder and its Haku superset to the reader Role.
  name: public-coder-agent-reader
  namespace: public-coder-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: public-coder-agent-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:haku
  - apiGroup: rbac.authorization.k8s.io
