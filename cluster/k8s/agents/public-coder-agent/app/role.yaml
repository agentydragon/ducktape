# Namespace-scoped read-only Role for the public-coder-agent namespace.
#
# Deliberately narrow to start: the agent can observe its own deployment,
# pods, config, events, and the resources that commonly fail in ways that
# are visible here (PVCs, network policies, the proxy deployment). No
# secrets, no exec, no write verbs.
#
# Expand by adding RoleBindings in other namespaces that reference the
# deploy-owned access-profile group, or by graduating to a ClusterRole when the
# scope warrants it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: public-coder-agent-reader
  namespace: public-coder-agent
  annotations:
    description: Read-only diagnostic access for the public-coder access profile.
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - services
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs: ["get", "list", "watch"]
  # Flux kustomizations and sources — useful for diagnosing reconciliation.
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "ocirepositories"]
    verbs: ["get", "list", "watch"]
  # Pod metrics (metrics.k8s.io) — nodes_top / pods_top equivalents.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # The devbox is the public-coder agent's ephemeral build machine. Restrict
  # image-rollout inspection and restart to this one named KubeVirt VM/VMI;
  # deleting the VMI (not the VM) lets runStrategy: Always recreate it from
  # the current Flux-updated containerDisk template.
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    resourceNames: ["public-coder-devbox"]
    verbs: ["get"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    resourceNames: ["public-coder-devbox"]
    # A named VMI waiter establishes its resource version with a list+watch;
    # resourceNames requires the caller to field-select this exact VMI.
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: public-coder-agent-reader
  namespace: public-coder-agent
  annotations:
    description: Binds public-coder and its Haku superset to the reader Role.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: public-coder-agent-reader
subjects:
  - kind: Group
    name: oidc-ksbx-groups:haku
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: haku:access-profile:haku
    apiGroup: rbac.authorization.k8s.io
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - kind: Group
    name: haku:access-profile:public-coder
    apiGroup: rbac.authorization.k8s.io
