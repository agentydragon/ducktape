# Consumer-owned identity and store for the source-approved
# agentydragon-agent GitHub PAT.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-agentydragon-agent-reader
  namespace: public-coder-agent
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: github-agentydragon-agent
  namespace: public-coder-agent
spec:
  provider:
    kubernetes:
      server:
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt }
      auth:
        serviceAccount: { name: github-agentydragon-agent-reader }
      remoteNamespace: ducktape-flux
