apiVersion: v1
kind: ConfigMap
metadata:
  name: public-coder-agent-kubeconfig
  namespace: public-coder-agent
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://haku-kubeapi.allegedly.works
          proxy-url: http://public-coder-agent-proxy.public-coder-agent.svc.cluster.local:8080
          certificate-authority: /etc/ssl/certs/ca-certificates.crt
    contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          namespace: public-coder-agent
          user: haku-agent
    current-context: in-cluster
    users:
      - name: haku-agent
        user:
          token: proxy-haku-console-placeholder
