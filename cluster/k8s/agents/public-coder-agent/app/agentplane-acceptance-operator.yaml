# On-demand login bootstrap via Console SAR; never a pod-mounted operator identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-acceptance-operator-reader
  namespace: public-coder-agent
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["agentplane-acceptance-operator", "agentplane-testing-acceptance-operator"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-acceptance-operator-reader
  namespace: public-coder-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-acceptance-operator-reader
subjects:
  - kind: Group
    name: haku:access-profile:public-coder
    apiGroup: rbac.authorization.k8s.io
