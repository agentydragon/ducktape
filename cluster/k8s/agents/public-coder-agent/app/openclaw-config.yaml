# Declarative OpenClaw config, planted into the state PVC by an init container.
#
# gateway.bind is "all" (not loopback as in the lab rig): the Authentik outpost
# reaches this pod over the cluster network, so the gateway must listen on the
# pod IP. What keeps that safe is not the bind address but networkpolicy.yaml,
# which admits only the outpost's pods -- without it any pod could forge
# x-authentik-username and be trusted as agentydragon.
#
# Two lanes on one LiteLLM key: the Codex subscription models and the z.ai GLM
# models. Only the 5.6 group is offered from the Codex lane. contextWindow/maxTokens are measured, not
# published: openai_utils/probe_context_window.py binary-searches the live
# serving path and all three 5.6 models reject identically just above
# 372,000 total context. Published figures disagree in both directions --
# the raw models are ~1.05M, Codex product docs say 272K -- and neither is
# what this chain accepts. cluster/validation/test_codex_context_window.py
# pins every declaration in the repo to the same measured numbers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-coder-agent-config
  namespace: public-coder-agent
data:
  #
  # The GLM entries are NOT measured -- probe_context_window.py has only been run
  # against the codex-* routes. 200000/96000 is a deliberately conservative
  # placeholder, and the pinning test covers only codex-gpt-5.6-* for that reason.
  # Run the probe against the glm-*-anthropic routes before trusting these.
  openclaw.json: |
    {
      "agents": {
        "defaults": {
          "model": {
            "primary": "litellm-subscription/codex-gpt-5.6-luna"
          },
          "sandbox": {
            "mode": "off"
          },
          "skills": []
        },
        "list": [
          {
            "id": "coder",
            "name": "Coder"
          }
        ]
      },
      "commands": {
        "config": false,
        "mcp": false,
        "restart": false
      },
      "cron": {
        "enabled": false
      },
      "gateway": {
        "auth": {
          "mode": "trusted-proxy",
          "trustedProxy": {
            "allowLoopback": true,
            "allowUsers": [
              "agentydragon"
            ],
            "requiredHeaders": [
              "x-authentik-email",
              "x-forwarded-host",
              "x-forwarded-proto"
            ],
            "userHeader": "x-authentik-username"
          }
        },
        "bind": "all",
        "controlUi": {
          "allowedOrigins": [
            "https://public-coder-agent.allegedly.works"
          ],
          "dangerouslyDisableDeviceAuth": true
        },
        "mode": "local",
        "trustedProxies": [
          "10.0.0.0/8"
        ]
      },
      "hooks": {
        "internal": {
          "entries": {
            "session-memory": {
              "enabled": true,
              "llmSlug": false,
              "messages": 15
            }
          }
        }
      },
      "models": {
        "providers": {
          "litellm-subscription": {
            "agentRuntime": {
              "id": "openclaw"
            },
            "api": "anthropic-messages",
            "apiKey": "${OPENCLAW_LITELLM_API_KEY}",
            "baseUrl": "http://litellm.litellm.svc.cluster.local:4000/v1",
            "models": [
              {
                "contextWindow": 372000,
                "id": "codex-gpt-5.6-luna",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 128000,
                "name": "GPT-5.6 Luna (Codex subscription via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 372000,
                "id": "codex-gpt-5.6-terra",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 128000,
                "name": "GPT-5.6 Terra (Codex subscription via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 372000,
                "id": "codex-gpt-5.6-sol",
                "input": [
                  "text",
                  "image"
                ],
                "maxTokens": 128000,
                "name": "GPT-5.6 Sol (Codex subscription via LiteLLM)",
                "reasoning": true
              }
            ],
            "request": {
              "allowPrivateNetwork": true
            }
          },
          "litellm-zai": {
            "agentRuntime": {
              "id": "openclaw"
            },
            "api": "anthropic-messages",
            "apiKey": "${OPENCLAW_LITELLM_API_KEY}",
            "baseUrl": "http://litellm.litellm.svc.cluster.local:4000/v1",
            "models": [
              {
                "contextWindow": 200000,
                "id": "glm-4.5-anthropic",
                "input": [
                  "text"
                ],
                "maxTokens": 96000,
                "name": "GLM-4.5 (z.ai via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 200000,
                "id": "glm-4.5-air-anthropic",
                "input": [
                  "text"
                ],
                "maxTokens": 96000,
                "name": "GLM-4.5-AIR (z.ai via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 200000,
                "id": "glm-4.6-anthropic",
                "input": [
                  "text"
                ],
                "maxTokens": 96000,
                "name": "GLM-4.6 (z.ai via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 200000,
                "id": "glm-4.7-anthropic",
                "input": [
                  "text"
                ],
                "maxTokens": 96000,
                "name": "GLM-4.7 (z.ai via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 200000,
                "id": "glm-5-anthropic",
                "input": [
                  "text"
                ],
                "maxTokens": 96000,
                "name": "GLM-5 (z.ai via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 200000,
                "id": "glm-5-turbo-anthropic",
                "input": [
                  "text"
                ],
                "maxTokens": 96000,
                "name": "GLM-5-TURBO (z.ai via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 200000,
                "id": "glm-5.1-anthropic",
                "input": [
                  "text"
                ],
                "maxTokens": 96000,
                "name": "GLM-5.1 (z.ai via LiteLLM)",
                "reasoning": true
              },
              {
                "contextWindow": 200000,
                "id": "glm-5.2-anthropic",
                "input": [
                  "text"
                ],
                "maxTokens": 96000,
                "name": "GLM-5.2 (z.ai via LiteLLM)",
                "reasoning": true
              }
            ],
            "request": {
              "allowPrivateNetwork": true
            }
          }
        }
      },
      "tools": {
        "allow": [
          "exec",
          "process",
          "read",
          "write",
          "edit",
          "apply_patch",
          "memory_get",
          "memory_search",
          "session_status"
        ],
        "elevated": {
          "enabled": false
        },
        "fs": {
          "workspaceOnly": true
        },
        "sessions": {
          "visibility": "agent"
        }
      }
    }
