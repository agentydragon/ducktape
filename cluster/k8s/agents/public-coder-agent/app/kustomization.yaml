apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-creds-reader.yaml
  - github-token-eso.yaml
  - gateway-password-eso.yaml
  - pvc.yaml
  - pvc-v2.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy-egress.yaml
  - networkpolicy-ingress.yaml

# STYLE.md: config blobs live in their native file, not embedded in YAML.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: public-coder-agent-config
    # Generated resources get no namespace of their own, and every hand-written
    # manifest here carries an explicit metadata.namespace instead. Without this
    # the apply fails "ConfigMap/... namespace not specified" and Flux applies
    # *nothing* from this directory -- which wedged the agent on a stale
    # Deployment for three hours.
    namespace: public-coder-agent
    files:
      - openclaw.json5
  - name: public-coder-agent-kubeconfig
    namespace: public-coder-agent
    files:
      - config=agent-kubeconfig.yaml
  - name: public-coder-agent-bazelrc
    namespace: public-coder-agent
    files:
      - bazelrc
