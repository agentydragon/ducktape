apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - github-token-eso.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy-egress.yaml
  - networkpolicy-ingress.yaml

# STYLE.md: config blobs live in their native file, not embedded in YAML.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: public-coder-agent-config
    files:
      - openclaw.json
