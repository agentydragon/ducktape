apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # keep-sorted start
  - ../proxy
  - ../sshpiper
  - devbox-ssh-key.sops.yaml
  # cdk8s-generated (cluster/cdk8s/public_coder_agent_config.py) -- see cluster/docs/cdk8s.md.
  - namespace.k8s.yaml
  - public-coder-agent-config.k8s.yaml
  - public-coder-agent-kubeconfig.k8s.yaml
  - public-coder-agent.k8s.yaml
  # keep-sorted end
components:
  - ./image-pins

# STYLE.md: config blobs live in their native file, not embedded in YAML.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: public-coder-agent-ssh
    namespace: public-coder-agent
    files:
      - config=ssh_config
      - known_hosts=ssh_known_hosts
