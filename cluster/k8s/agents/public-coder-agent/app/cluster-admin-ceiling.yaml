# Static maximum execution ceiling for operator-approved Haku grants.
#
# This ClusterRoleBinding does not give the Agent standing Kubernetes access. Haku Console still
# evaluates every request against the fixed standing SAR group or an active Agent-owned grant
# before haku-kube-api-proxy sends it upstream. The personal-cluster deployment deliberately makes
# that inline authorization boundary authoritative so future useful grants do not each require a
# separate GitOps RBAC expansion.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: haku-kube-api-proxy-cluster-admin-ceiling
  annotations:
    description: Gives only the Haku authorization proxy a cluster-admin execution ceiling.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: haku-kube-api-proxy
    namespace: haku-console
