# The egress fence. This is the enforcement layer; the HTTP_PROXY variables in
# deployment.yaml are convenience only -- an agent that unsets them does not gain
# egress, it loses its only route out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-coder-agent-egress
  namespace: public-coder-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: public-coder-agent
  policyTypes: [Egress]
  egress:
    # Scoped to kube-dns specifically: an unscoped port-53 rule lets the agent
    # tunnel arbitrary payloads to any public resolver, which is egress the
    # proxy allowlist never sees.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: public-coder-agent-proxy
      ports:
        - { port: 8080, protocol: TCP }
    # The colocated Console egress fence's workload listener (#4942/#4943). Reachable, not the
    # default route: HTTP_PROXY in the Deployment still names the iron proxy above, and the spike
    # runbook (haku/egress/docs/github_spike.md) drives GitHub requests through this listener
    # per-request. The sidecar shares the Console pod's network namespace, so the Console pod
    # label selects it.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haku-console
          podSelector:
            matchLabels:
              app.kubernetes.io/name: haku-console
      ports:
        - { port: 8888, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - { port: 4000, protocol: TCP }
    # Private in-cluster SSH to the dedicated NixOS devbox. This is intentionally
    # not an external SSH route; the VM's own egress remains proxy-fenced.
    - to:
        - podSelector:
            matchLabels:
              kubevirt.io/domain: public-coder-devbox
      ports:
        - { port: 22, protocol: TCP }
