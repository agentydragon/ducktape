# OpenClaw as a plain Deployment rather than an OpenClawInstance.
#
# Deviation from the retired operator-managed gateway, and the reason for it: the operator's
# generated NetworkPolicy always contains an egress rule for 443/TCP with no
# destination selector, and spec.security.networkPolicy offers only additive
# fields (additionalEgress, allowedEgressCIDRs) with no way to disable it.
# Kubernetes NetworkPolicies are unions of allows, so that rule cannot be
# subtracted -- an operator-managed instance cannot be egress-confined. Owning
# the Deployment means owning networkpolicy-egress.yaml outright.
#
# The cost is losing the operator's autoUpdate and CRD ergonomics. Everything
# else (image, config, state layout) is identical to the operator's shape.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-coder-agent
  namespace: public-coder-agent
  labels:
    app.kubernetes.io/name: public-coder-agent
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # Keep the replica count GitOps-owned; the worker-local state claim is
  # selected by the affinity and PVC declarations below.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: public-coder-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-coder-agent
    spec:
      securityContext:
        fsGroup: 1000
      # Keep Public Coder on the worker class that serves its local state PVC;
      # do not allow it to fall back onto control-plane nodes.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - ovh-ns102453
      # Flux advances both container images after the Nix image workflow publishes them.
      initContainers:
        # Seed the GitOps config into the state PVC before startup. Remove the
        # gateway's own config backups so the ConfigMap remains authoritative;
        # see docs/personal_agents/findings/harness_behaviour.md F19.
        - name: seed-config
          image: ghcr.io/agentydragon/openclaw:devel-20260904000643-36581b3 # {"$imagepolicy": "flux-system:openclaw"}
          command:
            - sh
            - -c
            - |
              cp /cfg/openclaw.json5 /state/openclaw.json5
              rm -f /state/openclaw.json5.last-good /state/openclaw.json5.bak*
          volumeMounts:
            - name: cfg
              mountPath: /cfg
            - name: data
              mountPath: /state
      containers:
        - name: openclaw
          image: ghcr.io/agentydragon/openclaw:devel-20260904000643-36581b3 # {"$imagepolicy": "flux-system:openclaw"}
          env:
            # The image does not set HOME to the state dir; without it the
            # gateway looks under the wrong home directory and exits "Missing config".
            - name: HOME
              value: /home/openclaw
            - name: OPENCLAW_CONFIG_PATH
              value: /home/openclaw/.openclaw/openclaw.json5
            - name: NPM_CONFIG_PREFIX
              value: /home/openclaw/.local
            - name: NPM_CONFIG_CACHE
              value: /home/openclaw/.cache/npm
            # Keep provider, compaction, and agent-loop debug records on
            # stdout so cluster logging captures them in Loki. OpenClaw's
            # sensitive-value redaction remains enabled at its default.
            - name: OPENCLAW_LOG_LEVEL
              value: debug
            # A placeholder, not a credential. The real PAT lives in the egress
            # proxy, which swaps this value into `Authorization` on the way out to
            # GitHub — in `Bearer <value>` and inside base64 `Basic user:<value>`
            # alike, so both the REST API and the git transport work. The agent
            # cannot read the token from its environment or from /proc, which is
            # what F7 previously left exposed.
            #
            # The agent has to be told the contract, because the proxy only acts on
            # requests carrying the placeholder: authenticate to GitHub with
            # $GH_PAT as if it were a real token. A request without it is not a
            # failure, just an unauthenticated request.
            #
            # Still not named `GITHUB_TOKEN`/`GH_TOKEN`: OpenClaw strips both from
            # the exec tool's environment via a hardcoded denylist, so the agent
            # would never see it. See docs/personal_agents/findings/ F7, F10, F16.
            - name: GH_PAT
              value: "proxy-github-placeholder"
            # Non-secret Haku Console bearer placeholder. The real static-Agent credential exists
            # only in Haku Console and this agent's iron-proxy, which replaces this value only in
            # Authorization headers sent to the exact haku.allegedly.works host.
            - name: HAKU_CONSOLE_TOKEN
              value: "proxy-haku-console-placeholder"
            # Native ClickHouse reader credentials for normalized and raw
            # AIQuota history. This is deliberately a non-secret placeholder: the
            # sibling Iron proxy swaps it only inside Authorization for the
            # private ClickHouse ClusterIP host. See ../proxy/iron.yaml.
            - name: CLICKHOUSE_PUBLIC_CODER_USER
              value: "public_coder_analytics"
            - name: CLICKHOUSE_PUBLIC_CODER_PASSWORD
              value: "proxy-clickhouse-public-coder-password"
            # This placeholder grants access only when iron-proxy substitutes
            # it for aiquota.allegedly.works' two read-only API paths. The
            # actual shared bearer is mounted only into the proxy container.
            - name: AIQUOTA_API_BEARER_TOKEN
              value: "proxy-aiquota-api-bearer-placeholder"
            # This is likewise an inert placeholder. The real Brave Search API
            # key is mounted only in the egress proxy and substituted solely in
            # X-Subscription-Token requests to api.search.brave.com.
            - name: BRAVE_API_KEY
              value: "proxy-brave-search-api-key-placeholder"
            # Unlike the GitHub PAT above, this must be the real credential.
            # Either half of the BuildBuddy setup can use proxy substitution on
            # its own: a local Bazel client sends its authenticated gRPC traffic
            # through iron-proxy, and `bb remote` authenticates its local control
            # channel through the same path. Combining them is different:
            # `bb remote` serializes the key into the command executed on its
            # hosted runner as `--remote_header=x-buildbuddy-api-key=...`, where
            # the nested Bazel process uses BuildBuddy BES, cache, and RBE. That
            # runner is outside this pod's proxy, so a placeholder reaches
            # BuildBuddy unchanged and is rejected. Giving the agent the real
            # key is the accepted cost of supporting remote Bazel together with
            # remote execution; revisit this if either layer is removed.
            - name: BUILDBUDDY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: buildbuddy-api-key
                  key: api-key
            - name: OPENCLAW_LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-key-public-coder-agent
                  key: api-key
            # Authentik authenticates proxied browser traffic. OpenClaw's
            # subagent completion path calls the local gateway directly and
            # therefore uses the documented trusted-proxy local-password
            # fallback instead of proxy identity headers.
            - name: OPENCLAW_GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: public-coder-agent-gateway-password
                  key: password
            # OpenClaw's password login puts this value in the Matrix JSON body.
            # It is a proxy placeholder: iron-proxy replaces it with the real
            # controller-owned password only on the Matrix login endpoint.
            - name: MATRIX_PASSWORD
              value: "proxy-matrix-password-placeholder"
            # Node does not honour proxy environment variables by default.
            - name: NODE_USE_ENV_PROXY
              value: "1"
            - name: HTTP_PROXY
              value: "http://public-coder-agent-proxy.public-coder-agent.svc.cluster.local:8080"
            - name: HTTPS_PROXY
              value: "http://public-coder-agent-proxy.public-coder-agent.svc.cluster.local:8080"
            # LiteLLM is in-cluster and must not go through the proxy. Do not
            # bypass every Service DNS name or the cluster Service CIDR:
            # ClickHouse is intentionally sent through Iron so its password
            # placeholder cannot reach the ClusterIP service unchanged.
            - name: NO_PROXY
              value: "127.0.0.1,localhost,litellm.litellm.svc,litellm.litellm.svc.cluster.local"
            # The proxy terminates TLS, so its root must be trusted. The bundle
            # from ../proxy/trust-bundle.yaml is mounted over the system trust
            # store below, which covers every OpenSSL and GnuTLS client at once —
            # so the four per-tool variables that used to live here are gone.
            #
            # That is not tidying. `GIT_SSL_CAINFO` is one of the names OpenClaw
            # strips from the exec tool's environment, and git links GnuTLS, which
            # reads neither `SSL_CERT_FILE` (an OpenSSL variable) nor
            # `CURL_CA_BUNDLE` (read by the curl binary, not by libcurl) — so git
            # through this proxy could not verify at all. F17.
            #
            # Node is the exception: it carries its own roots and ignores the
            # system store. Point it at the MOUNTED path — Node ignores a
            # nonexistent file silently and then fails with
            # SELF_SIGNED_CERT_IN_CHAIN, which reads like a trust problem rather
            # than a typo. F18.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-certificates.crt
            # Python is the other runtime that ignores the mounted system
            # bundle: pip trusts only its vendored certifi, and hermetic
            # interpreters carry their own OpenSSL whose compiled-in CA path
            # is not Debian's. Without these, pip fetches fail TLS against the
            # egress proxy even though pypi.org is allowlisted. Mirrors the
            # same vars in haku-openclaw-spike.
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: PIP_CERT
              value: /etc/ssl/certs/ca-certificates.crt
          ports:
            - name: gateway
              containerPort: 18789
          volumeMounts:
            - name: data
              mountPath: /home/openclaw/.openclaw
            # Kubeconfig with a non-secret placeholder. iron-proxy substitutes the Agent's Haku
            # bearer only for haku-kubeapi.allegedly.works; no Kubernetes credential is mounted.
            - name: kubeconfig
              mountPath: /home/openclaw/.kube
              readOnly: true
            # Over the system trust store, not alongside it. The Bundle is built
            # with useDefaultCAs, so it already contains the public roots plus the
            # cluster root plus this proxy's interception root — replacing the
            # distro file loses nothing.
            - name: trust
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
            # The #4943 fence trust anchor, deliberately in the exact shape the fleet
            # inject-haku-egress-proxy policy would inject (same volume name, same mountPath):
            # carrying the policy's own wiring is what its every rule preconditions on, so if
            # the fleet injection ever widens to this namespace (#4670 adoption), this pod reads
            # as already wired and no port-8080 env is appended over the iron values above.
            # Pinned by //cluster/validation:test_haku_public_coder_contract. The fence trust stays a
            # per-request opt-in until the fence owns this pod's egress.
            - name: haku-egress-proxy-ca-cert
              mountPath: /egress-proxy-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: public-coder-agent-state-v2
        - name: kubeconfig
          configMap:
            name: public-coder-agent-kubeconfig
        - name: cfg
          configMap:
            name: public-coder-agent-config
        - name: trust
          configMap:
            name: public-coder-agent-proxy-ca-cert
        # Delivered here by the haku-egress-proxy trust-manager Bundle
        # (../../haku-egress-proxy/trust-bundle.yaml namespaceSelector).
        - name: haku-egress-proxy-ca-cert
          configMap:
            name: haku-egress-proxy-ca-cert
        - name: tmp
          emptyDir: {}
