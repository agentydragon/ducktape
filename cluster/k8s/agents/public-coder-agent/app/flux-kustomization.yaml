apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: OpenClaw coder agent at public-coder-agent.allegedly.works -- Authentik-gated, egress-confined to its own proxy.
  name: public-coder-agent-app
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  deletionPolicy: Orphan
  dependsOn:
    - name: public-coder-agent-namespace
      namespace: ducktape-flux
    - name: public-coder-agent-proxy
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: external-creds
      namespace: ducktape-flux
    - name: litellm-keys-tf
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: public-coder-agent
      namespace: public-coder-agent
  interval: 10m
  path: ./cluster/k8s/agents/public-coder-agent/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: public-coder-agent-app
    namespace: ducktape-flux
  timeout: 5m
