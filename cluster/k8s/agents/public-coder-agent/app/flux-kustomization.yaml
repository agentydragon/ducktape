apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: public-coder-agent-app
  namespace: ducktape-flux
  annotations:
    description: OpenClaw coder agent at public-coder-agent.allegedly.works -- Authentik-gated, egress-confined to its own proxy.
spec:
  interval: 10m
  path: ./cluster/k8s/agents/public-coder-agent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  timeout: 5m
  retryInterval: 1m
  dependsOn:
    # The proxy layer owns the trust Bundle this pod mounts, so it must land first.
    - name: public-coder-agent-proxy
      namespace: ducktape-flux
    # Reflects the BuildBuddy API key consumed directly by the agent. It cannot
    # remain proxy-only while `bb remote` forwards the key to a hosted runner.
    - name: agent-shared-secrets
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: litellm-keys-tf
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: public-coder-agent
      namespace: public-coder-agent
