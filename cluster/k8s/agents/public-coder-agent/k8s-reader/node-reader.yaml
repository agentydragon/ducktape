# Cluster-scoped node inventory for scheduling and health diagnostics.
#
# Nodes are cluster infrastructure rather than Git-managed application state,
# so this is intentionally the sole cluster-wide grant for the public coder.
# In particular, it does not include nodes/proxy, node logs, metrics, or any
# write verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: public-coder-agent-node-reader
  annotations:
    description: Read-only node inventory for public-coder-agent diagnostics.
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: public-coder-agent-node-reader
  annotations:
    description: Binds public-coder and its Haku superset to read-only node inventory.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: public-coder-agent-node-reader
subjects:
  - kind: Group
    name: oidc-ksbx-groups:haku
    apiGroup: rbac.authorization.k8s.io
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - kind: ServiceAccount
    name: haku-claude
    namespace: haku-claude-sandbox
  - kind: ServiceAccount
    name: public-coder-agent-reader
    namespace: public-coder-agent
