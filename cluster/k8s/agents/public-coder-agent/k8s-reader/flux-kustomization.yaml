apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: public-coder-agent-k8s-reader
  namespace: ducktape-flux
  annotations:
    description: Read-only ServiceAccount and RBAC for agent-mediated cluster diagnostics.
spec:
  interval: 10m
  path: ./cluster/k8s/agents/public-coder-agent/k8s-reader
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: public-coder-agent-k8s-reader
    namespace: ducktape-flux
  timeout: 5m
  retryInterval: 1m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: public-coder-agent-namespace
