apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: public-coder-devbox
  namespace: public-coder-agent
  labels:
    app.kubernetes.io/name: public-coder-devbox
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: public-coder-devbox
        app.kubernetes.io/name: public-coder-devbox
    spec:
      nodeSelector:
        # No region pin: the cluster's own KubeVirt CR (cluster/k8s/kubevirt/app/kubevirt.yaml)
        # already scopes where VMs can run (region in [hil, home], no control-plane nodes), and
        # kubevirt.io/schedulable=true only appears on nodes that CR actually placed virt-handler
        # on. Restating region: hil here was redundant with that and needlessly excluded home-region
        # capacity (e.g. optiplex) that the cluster already permits.
        kubevirt.io/schedulable: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      domain:
        # 4 cores / 8Gi limit, 2 cores / 4Gi request: the two hil, kubevirt.io/schedulable=true
        # nodes (ovh-ns102453, ovh-ns103711) are 8-core/32Gi OVH KS-5 boxes already carrying the
        # rest of the cluster -- the original 8-core/8Gi *request* never fit either node's free
        # capacity (one short on CPU, the other on memory), which is why this VM's virt-launcher
        # pod sat Pending/Unschedulable. Heavy compute already runs on BuildBuddy RBE, not this
        # box, so it doesn't need to request that much locally.
        cpu:
          cores: 4
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
          requests:
            cpu: "2"
            memory: 4Gi
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
            - name: proxy-ca
              serial: pcproxyca
              disk:
                bus: virtio
            - name: hostexecd-token
              serial: pctoken
              disk:
                bus: virtio
            - name: buildbuddy-api-key
              serial: pcbuildbuddy
              disk:
                bus: virtio
            - name: ssh-host-key
              serial: pchostkey
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            # This is an ephemeral VM disk (accepted tradeoff: no Bazel/BuildBuddy
            # cache, checkout, or other local state survives an image update or VM
            # restart). Flux ImageUpdateAutomation rewrites this tag after
            # .github/workflows/public-coder-devbox-image.yml publishes a new one --
            # see the public-coder-devbox ImagePolicy in
            # ../../../flux-image-automation-forgejo/. Until the workflow's first run
            # completes, this placeholder tag doesn't exist yet and the pod sits in
            # ImagePullBackOff -- expected, and self-resolving once CI publishes.
            image: git.allegedly.works/ducktape-ci/public-coder-devbox:devel-20260909033928-796cb40 # {"$imagepolicy": "flux-system:public-coder-devbox"}
            imagePullPolicy: IfNotPresent
        - name: proxy-ca
          configMap:
            name: public-coder-agent-proxy-ca-cert
        - name: hostexecd-token
          secret:
            secretName: public-coder-devbox-hostexecd-token
        - name: buildbuddy-api-key
          secret:
            # Reflected from claude-sandbox/buildbuddy-api-key by the existing
            # shared-secret reflector policy.
            secretName: buildbuddy-api-key
        - name: ssh-host-key
          secret:
            secretName: public-coder-devbox-ssh-host-key
