apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: public-coder-devbox
  namespace: public-coder-agent
  labels:
    app.kubernetes.io/name: public-coder-devbox
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: public-coder-devbox
        app.kubernetes.io/name: public-coder-devbox
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hil
        kubevirt.io/schedulable: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      domain:
        cpu:
          cores: 8
        resources:
          limits:
            cpu: "8"
          requests:
            cpu: "2"
            memory: 8Gi
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
            - name: proxy-ca
              serial: pcproxyca
              disk:
                bus: virtio
            - name: hostexecd-token
              serial: pctoken
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            # This is an ephemeral VM disk (accepted tradeoff: no Bazel/BuildBuddy
            # cache, checkout, or other local state survives an image update or VM
            # restart). Flux ImageUpdateAutomation rewrites this tag after
            # .github/workflows/public-coder-devbox-image.yml publishes a new one --
            # see the public-coder-devbox ImagePolicy in
            # ../../../flux-image-automation-forgejo/. Until the workflow's first run
            # completes, this placeholder tag doesn't exist yet and the pod sits in
            # ImagePullBackOff -- expected, and self-resolving once CI publishes.
            image: git.allegedly.works/ducktape-ci/public-coder-devbox:unpublished # {"$imagepolicy": "flux-system:public-coder-devbox"}
            imagePullPolicy: IfNotPresent
        - name: proxy-ca
          configMap:
            name: public-coder-agent-proxy-ca-cert
        - name: hostexecd-token
          secret:
            secretName: public-coder-devbox-hostexecd-token
