apiVersion: v1
kind: Service
metadata:
  annotations:
    description: ClusterIP for operator port-forward access (e.g. nixos-rebuild switch per docs/kubevirt_nixos_vm.md) and for ssh-mcp's public-coder-devbox targets (cluster/k8s/ssh-mcp); not public.
  labels:
    app.kubernetes.io/name: public-coder-devbox
  name: public-coder-devbox-ssh
  namespace: public-coder-agent
spec:
  externalIPs: []
  ports:
    - name: ssh
      port: 22
      protocol: TCP
      targetPort: 22
  selector:
    kubevirt.io/domain: public-coder-devbox
  type: ClusterIP
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  annotations:
    ducktape.org/auto-restart-template-changes: "true"
  labels:
    app.kubernetes.io/name: public-coder-devbox
  name: public-coder-devbox
  namespace: public-coder-agent
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-coder-devbox
        kubevirt.io/domain: public-coder-devbox
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      domain:
        cpu:
          cores: 4
        devices:
          disks:
            - bootOrder: 1
              disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: bazel-cache
              serial: pcbazelcache
            - disk:
                bus: virtio
              name: proxy-ca
              serial: pcproxyca
            - disk:
                bus: virtio
              name: buildbuddy-api-key
              serial: pcbuildbuddy
            - disk:
                bus: virtio
              name: ssh-host-key
              serial: pchostkey
          interfaces:
            - masquerade: {}
              name: default
              ports:
                - name: ssh
                  port: 22
        firmware:
          bootloader:
            efi:
              secureBoot: false
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
          requests:
            cpu: "2"
            memory: 4Gi
      networks:
        - name: default
          pod: {}
      nodeSelector:
        kubevirt.io/schedulable: "true"
        topology.kubernetes.io/region: proxmox
      volumes:
        - containerDisk:
            image: git.allegedly.works/ducktape-ci/public-coder-devbox:unset
            imagePullPolicy: IfNotPresent
          name: rootdisk
        - name: bazel-cache
          persistentVolumeClaim:
            claimName: public-coder-devbox-bazel-cache
        - configMap:
            name: public-coder-agent-proxy-ca-cert
          name: proxy-ca
        - name: buildbuddy-api-key
          secret:
            secretName: buildbuddy-api-key
        - name: ssh-host-key
          secret:
            secretName: public-coder-devbox-ssh-host-key
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    description: Identity for the generic KubeVirt VM image restart controller.
  name: vm-image-restart
  namespace: public-coder-agent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    description: Durable rollout state and bounded retry count for the configured VM.
  name: vm-image-restart-state
  namespace: public-coder-agent
immutable: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    description: Narrow permissions for restarting and observing the configured VM.
  name: vm-image-restart
  namespace: public-coder-agent
rules:
  - apiGroups:
      - kubevirt.io
    resourceNames:
      - public-coder-devbox
    resources:
      - virtualmachines
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kubevirt.io
    resourceNames:
      - public-coder-devbox
    resources:
      - virtualmachineinstances
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resourceNames:
      - vm-image-restart-state
    resources:
      - configmaps
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-image-restart
  namespace: public-coder-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-image-restart
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: vm-image-restart
    namespace: public-coder-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Applies staged image/template changes to one configured stateless KubeVirt VM.
  labels:
    app.kubernetes.io/name: vm-image-restart
  name: vm-image-restart
  namespace: public-coder-agent
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: vm-image-restart
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vm-image-restart
        cdk8s.io/metadata.addr: public-coder-de-vm-image-restart-controller-deployment-c813fed8
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: TARGET_NAMESPACE
              value: public-coder-agent
            - name: TARGET_VM_NAME
              value: public-coder-devbox
            - name: STATE_CONFIGMAP_NAME
              value: vm-image-restart-state
          image: git.allegedly.works/ducktape-ci/vm-image-restart:unset
          imagePullPolicy: IfNotPresent
          name: vm-image-restart
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: vm-image-restart
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    description: Allows the restart controller to reach only DNS and the Kubernetes API.
  name: vm-image-restart-egress
  namespace: public-coder-agent
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vm-image-restart
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    description: Separately deletable local Bazel output, repository, and action cache for public-coder-devbox. Stop the VM before deleting this claim to reset it.
  name: public-coder-devbox-bazel-cache
  namespace: public-coder-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: lvm-proxmox-hdd-block
  volumeMode: Block
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buildbuddy-api-key
  namespace: public-coder-agent
spec:
  data:
    - remoteRef:
        key: buildbuddy-api-key
        property: api-key
      secretKey: api-key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Orphan
    deletionPolicy: Retain
    name: buildbuddy-api-key
