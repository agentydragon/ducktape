apiVersion: v1
kind: Service
metadata:
  name: public-coder-devbox-ssh
  namespace: public-coder-agent
  annotations:
    description: ClusterIP for operator port-forward access (e.g. nixos-rebuild switch per docs/kubevirt_nixos_vm.md) and for ssh-mcp's public-coder-devbox targets (cluster/k8s/ssh-mcp); not public.
  labels:
    app.kubernetes.io/name: public-coder-devbox
spec:
  type: ClusterIP
  selector:
    kubevirt.io/domain: public-coder-devbox
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
