apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: KubeVirt build/test devbox for public-coder-agent (Bazel/BuildBuddy/direnv), with an ephemeral containerDisk root apart from the sshd host key and SSH access through ../sshpiper.
  name: public-coder-agent-devbox
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: public-coder-agent-namespace
      namespace: ducktape-flux
    - name: public-coder-agent-proxy
      namespace: ducktape-flux
    - name: kubevirt
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      name: public-coder-devbox
      namespace: public-coder-agent
  interval: 10m
  path: ./cluster/k8s/agents/public-coder-agent/devbox
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: public-coder-agent-devbox
    namespace: ducktape-flux
  timeout: 30m
  wait: true
