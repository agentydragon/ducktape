apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: public-coder-devbox-app
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  path: ./cluster/k8s/agents/public-coder-agent/devbox/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: public-coder-agent-proxy
      namespace: ducktape-flux
    # The VM does not consume the agent's LiteLLM Secret or Deployment. The
    # main agent app retains its own dependency on litellm-keys-tf.
    - name: kubevirt
      namespace: ducktape-flux
    - name: cdi
      namespace: ducktape-flux
    - name: external-secrets-operator
      namespace: ducktape-flux
    - name: seaweedfs-public-s3
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  wait: true
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: public-coder-devbox-vm-images-s3-reader
      namespace: public-coder-agent
    - apiVersion: v1
      kind: ConfigMap
      name: public-coder-agent-proxy-ca-cert
      namespace: public-coder-agent
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      name: public-coder-devbox-root
      namespace: public-coder-agent
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      name: public-coder-devbox
      namespace: public-coder-agent
