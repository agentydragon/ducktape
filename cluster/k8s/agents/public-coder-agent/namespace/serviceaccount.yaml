apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: public-coder-agent
# ducktape-ci is a private tenant in the in-cluster Forgejo registry; forgejo-images-creds
# is reflected into this namespace by cluster/k8s/forgejo-images/. Same pattern as
# cpap-sync/serviceaccount.yaml -- workloads that don't set their own imagePullSecrets
# (e.g. the devbox VM's containerDisk pull; a Deployment can also set it directly, as
# proxy/deployment.yaml does) need it here to pull ducktape-ci/* images.
imagePullSecrets:
  - name: forgejo-images-creds
