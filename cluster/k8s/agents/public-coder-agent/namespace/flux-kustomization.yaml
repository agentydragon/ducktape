apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: public-coder-agent-namespace
  namespace: flux-system
spec:
  interval: 1h
  path: ./cluster/k8s/agents/public-coder-agent/namespace
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
