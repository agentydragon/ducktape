# TODO: consider moving iron-proxy into its own namespace (separate from the
# agent app) for cleaner blast-radius isolation — the proxy holds all mediated
# credentials and the agent app does not need to share its namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # cdk8s-generated (cluster/cdk8s/public_coder_proxy.py) -- see cluster/docs/cdk8s.md.
  - public-coder-agent-proxy.k8s.yaml
components:
  - ./image-pins
configMapGenerator:
  - name: public-coder-agent-proxy-config
    namespace: public-coder-agent
    files:
      - iron.yaml
