apiVersion: v1
kind: Service
metadata:
  name: public-coder-agent-proxy
  namespace: public-coder-agent
spec:
  selector:
    app.kubernetes.io/name: public-coder-agent-proxy
  ports:
    - name: proxy
      port: 8080
      targetPort: 8080
    # iron-proxy's Prometheus metrics. mitmproxy's `mitmweb` UI on 8081 goes with
    # it — it was never routed, and a browsable log of the agent's intercepted
    # traffic is not a thing to leave reachable in-cluster.
    - name: metrics
      port: 9090
      targetPort: 9090
