# Public roots + cluster root + this proxy's interception root, published into
# the agent's namespace so its TLS clients accept the intercepted connections.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: public-coder-agent-proxy-ca-cert
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: cluster-root-ca-secret
        key: ca.crt
    - secret:
        name: public-coder-agent-proxy-ca
        key: tls.crt
  target:
    configMap:
      key: ca-certificates.crt
      metadata:
        annotations:
          description: Trust bundle for public-coder-agent HTTPS traffic intercepted by its egress proxy
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - public-coder-agent
