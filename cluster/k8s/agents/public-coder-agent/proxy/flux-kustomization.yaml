apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: OpenClaw Iron proxy plus interception CA.
  name: public-coder-agent-proxy
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: public-coder-agent-namespace
      namespace: ducktape-flux
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: cert-manager-trust
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: agent-machine-access-tf
      namespace: ducktape-flux
    - name: matrix
      namespace: ducktape-flux
    - name: aiquota
      namespace: ducktape-flux
    - name: litellm-keys-tf
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: public-coder-agent-proxy
      namespace: public-coder-agent
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: public-coder-agent-proxy-root-ca
      namespace: public-coder-agent
  interval: 1h
  path: ./cluster/k8s/agents/public-coder-agent/proxy
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: public-coder-agent-proxy
    namespace: ducktape-flux
  timeout: 5m
  wait: true
