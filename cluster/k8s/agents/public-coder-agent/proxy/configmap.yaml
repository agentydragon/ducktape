# iron-proxy configuration. The proxy holds the GitHub PAT; the agent holds only
# a placeholder and never possesses the credential.
#
# `replace` mode rather than `inject`: the agent presents `$GH_PAT` on requests
# it wants authenticated, exactly as it would a real token, and the proxy swaps
# the value on the way out. That keeps the agent's model of its own situation
# accurate — there is a credential, it is mediated, it cannot be read — where
# `inject` would attach it invisibly and leave an agent that looks for a
# credential finding none. Full rationale and the measurements behind every
# choice here: plans/personal_agents/credential_proxy_options.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-coder-agent-proxy-config
  namespace: public-coder-agent
data:
  iron.yaml: |
    # Explicit forward proxy: consumers point HTTP_PROXY at the Service. The
    # built-in DNS interception mode is off — nothing here hijacks resolution.
    dns:
      enabled: false

    proxy:
      tunnel_listen: ":8080"

    tls:
      mode: "mitm"
      # The interception root from ../certificate.yaml, owned by cert-manager so
      # it cannot drift the way a self-generated mitmproxy CA did. ECDSA P-256 is
      # fine — verified against this exact image.
      ca_cert: "/ca/tls.crt"
      ca_key: "/ca/tls.key"

    transforms:
      # Defence in depth only. Destination enforcement is cnp-egress.yaml, applied
      # to this pod by Cilium, so a CONNECT to a non-allowlisted host fails at the
      # network layer whatever this file says. Keep the two lists in step.
      - name: allowlist
        config:
          domains:
            - "github.com"
            - "api.github.com"
            - "codeload.github.com"
            - "objects.githubusercontent.com"
            - "raw.githubusercontent.com"
            - "pypi.org"
            - "files.pythonhosted.org"
            - "registry.npmjs.org"

      - name: secrets
        config:
          secrets:
            - source:
                type: env
                var: GITHUB_TOKEN
              replace:
                # Substituted inside `Bearer <placeholder>` and inside base64
                # `Basic <user>:<placeholder>` alike — the latter is how git over
                # HTTPS authenticates, verified with a real multi-megabyte push.
                proxy_value: "proxy-github-placeholder"
                match_headers: ["Authorization"]
                # `require: true` is deliberately absent. It rejects requests to a
                # matching host that lack the placeholder — which sounds right, but
                # in explicit-proxy mode it is evaluated against the header-less
                # CONNECT and so rejects every HTTPS request with 403.
              rules:
                - host: "api.github.com"
                - host: "github.com"
                - host: "codeload.github.com"

    log:
      level: "info"
