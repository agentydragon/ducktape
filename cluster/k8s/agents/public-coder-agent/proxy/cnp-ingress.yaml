# The proxy confers every credential it mediates to callers that present the corresponding
# non-secret placeholder. Keep that capability reachable only from the OpenClaw Agent pod.
# Namespace co-tenancy is not authority to use this Service, and the metrics port remains closed
# until a reviewed scraper needs it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-public-coder-agent-proxy-ingress
  namespace: public-coder-agent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: public-coder-agent-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: public-coder-agent
            k8s:app.kubernetes.io/name: public-coder-agent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
