# Egress proxy for the coder agent, and the holder of its GitHub credential.
#
# Deviation from agents/haku-zones-mitmproxy, which this used to mirror: it runs
# iron-proxy rather than mitmproxy, because it now does two jobs. It is still the
# TLS-intercepting forward proxy, and it additionally swaps a placeholder for the
# real GitHub PAT on the way out, so the agent container holds no credential at
# all. mitmproxy could do that too, through an addon we wrote and tested;
# iron-proxy was chosen because the substitution is a maintained project's product
# rather than forty lines of ours, and because it handles the base64 `Basic` shape
# that git over HTTPS uses, which our addon did not.
#
# Destinations are deliberately unrestricted for this agent — see cnp-egress.yaml
# for why, and for the confined configuration kept ready to restore. What is not
# unrestricted is the credential: iron.yaml scopes the substitution to GitHub
# hosts, so wider egress widens what data can leave, not what the token can do.
#
# Evidence for every choice here, including a real agent opening a pull request
# from behind this configuration:
# plans/personal_agents/findings/egress_and_tls.md F15-F18.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-coder-agent-proxy
  namespace: public-coder-agent
  labels:
    app.kubernetes.io/name: public-coder-agent-proxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: public-coder-agent-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-coder-agent-proxy
    spec:
      containers:
        - name: iron-proxy
          # Pinned, not :latest — this process holds the credential. 0.49.0 is the
          # version every measurement in F15-F18 was taken against.
          image: ironsh/iron-proxy:0.49.0
          args: ["-config", "/etc/iron-proxy/iron.yaml"]
          env:
            # The real credential lives here and nowhere else. It reaches the
            # agent's traffic only as a substitution performed by this process.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: public-coder-agent-github-token
                  key: GITHUB_TOKEN
          ports:
            - name: proxy
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/iron-proxy
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: public-coder-agent-proxy-config
        # iron-proxy reads the CA certificate and key straight from these paths,
        # so unlike mitmproxy it needs no initContainer to assemble a combined
        # PEM. It rejects a CA without keyCertSign at startup, loudly.
        - name: ca
          secret:
            secretName: public-coder-agent-proxy-ca
