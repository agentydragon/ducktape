# Egress proxy for the coder agent. Mirrors agents/haku-zones-mitmproxy;
# deviation: a single consuming namespace, and the allowlist is git hosting plus
# package indexes only (its LLM path is in-cluster LiteLLM, which bypasses the
# proxy entirely — see the app NetworkPolicy).
#
# The proxy itself enforces nothing about destinations. The allowlist is
# cnp-egress.yaml, applied to *this* pod's egress by Cilium, so a CONNECT to a
# non-allowlisted host fails at the network layer rather than in proxy config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-coder-agent-proxy
  namespace: public-coder-agent
  labels:
    app.kubernetes.io/name: public-coder-agent-proxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: public-coder-agent-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-coder-agent-proxy
    spec:
      initContainers:
        - name: mitmproxy-ca-init
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              cat /mitmproxy-ca/tls.key /mitmproxy-ca/tls.crt > /mitmproxy-data/mitmproxy-ca.pem
              cp /mitmproxy-ca/tls.crt /mitmproxy-data/mitmproxy-ca-cert.pem
          volumeMounts:
            - name: mitmproxy-ca
              mountPath: /mitmproxy-ca
              readOnly: true
            - name: mitmproxy-data
              mountPath: /mitmproxy-data
      containers:
        - name: mitmproxy
          # >=12.2.3 for the CA SKI/AKI fix — see
          # cluster/docs/lessons_learned/2026_06_25_mitmproxy_ca_ski_aki_mismatch.md.
          image: mitmproxy/mitmproxy:12.2.3
          command:
            - mitmweb
            - --listen-host
            - "0.0.0.0"
            - --listen-port
            - "8080"
            - --web-host
            - "0.0.0.0"
            - --web-port
            - "8081"
            - --set
            - confdir=/mitmproxy-data
          ports:
            - name: proxy
              containerPort: 8080
            - name: web
              containerPort: 8081
          volumeMounts:
            - name: mitmproxy-data
              mountPath: /mitmproxy-data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mitmproxy-ca
          secret:
            secretName: public-coder-agent-proxy-ca
        - name: mitmproxy-data
          emptyDir: {}
