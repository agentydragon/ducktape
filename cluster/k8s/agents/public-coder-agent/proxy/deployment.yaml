# Egress proxy for the coder agent, and the holder of its mediated credentials.
#
# Deviation from agents/haku-zones-mitmproxy, which this used to mirror: it runs
# iron-proxy rather than mitmproxy, because it now does two jobs. It is still the
# TLS-intercepting forward proxy, and it additionally swaps a placeholder for the
# real credentials on the way out, so the agent container does not hold them.
# mitmproxy could do that too, through an addon we wrote and tested;
# iron-proxy was chosen because the substitution is a maintained project's product
# rather than forty lines of ours, and because it handles the base64 `Basic` shape
# that git over HTTPS uses, which our addon did not.
#
# Destinations are deliberately unrestricted for this agent — see cnp-egress.yaml
# for why, and for the confined configuration kept ready to restore. What is not
# unrestricted is the credential: iron.yaml scopes the substitution to GitHub
# hosts, so wider egress widens what data can leave, not what the token can do.
#
# Evidence for every choice here, including a real agent opening a pull request
# from behind this configuration:
# plans/personal_agents/findings/egress_and_tls.md F15-F18.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-coder-agent-proxy
  namespace: public-coder-agent
  labels:
    app.kubernetes.io/name: public-coder-agent-proxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: public-coder-agent-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-coder-agent-proxy
    spec:
      # Private package in the in-cluster Forgejo registry. The credential is
      # reflected into this namespace by cluster/k8s/forgejo-images/.
      imagePullSecrets:
        - name: forgejo-images-creds
      # Matches haku-{claude-oauth,openclaw-spike}-proxy, which run the same image.
      # This namespace sets no pod-security.kubernetes.io labels, so only the
      # cluster-default baseline applies and none of this is enforced for us --
      # it has to be stated here. The deliberate waiver for this agent is about
      # egress destinations (cnp-egress.yaml); it does not extend to pod security,
      # and this pod holds the densest credential set of the three proxies.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iron-proxy
          # Bootstrap on upstream 0.49.0. Once CI publishes the commit-pinned
          # Forgejo image, Flux replaces this reference through the policy below.
          # TODO(public-coder-agent): Return to the first official release containing
          # https://github.com/ironsh/iron-proxy/commit/c90f4fe31607552ed05675fc7ad239d94b431af2
          # and remove the temporary image build after verifying ALPN still negotiates h2.
          image: git.allegedly.works/ducktape-ci/iron-proxy:devel-20260809231643-86f9b6c # {"$imagepolicy": "flux-system:iron-proxy"}
          args: ["-config", "/etc/iron-proxy/iron.yaml"]
          env:
            # The real GitHub credential lives here and nowhere else. It reaches
            # the agent's traffic only as a substitution performed here.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: public-coder-agent-github-token
                  key: GITHUB_TOKEN
            # Dedicated Haku Console bearer, held by the proxy rather than the agent. iron.yaml
            # substitutes it only for the exact public Haku host's Authorization header.
            - name: HAKU_CONSOLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-public-coder-agent
                  key: token
            # Read-only K8s SA token, held by the proxy. iron.yaml substitutes it
            # only for kubeapi.allegedly.works. The agent never possesses the
            # real token — same pattern as GITHUB_TOKEN.
            - name: KUBERNETES_READER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: public-coder-agent-reader-token
                  key: token
            # Matrix password login is the one credential that lives in a JSON
            # body rather than Authorization. iron.yaml swaps the app's
            # placeholder only on the Matrix login endpoint.
            - name: MATRIX_BOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: public-coder-agent-matrix-bot-password
                  key: password
          ports:
            - name: proxy
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/iron-proxy
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: public-coder-agent-proxy-config
        # iron-proxy reads the CA certificate and key straight from these paths,
        # so unlike mitmproxy it needs no initContainer to assemble a combined
        # PEM. It rejects a CA without keyCertSign at startup, loudly.
        - name: ca
          secret:
            secretName: public-coder-agent-proxy-ca
