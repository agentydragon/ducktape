# Time-boxed access to drive and debug the public-coder-agent instance.
#
# Two jobs, both of which need a shell in the agent's own pod:
#
# **Test-driving the agent.** Confirming it can autonomously open a pull
#    request end to end means issuing it a task, which is an `openclaw agent`
#    invocation inside the pod.
#
# No write verbs on any object: no delete, no patch, no create except the exec
# subresource itself. This cannot reconfigure the agent, only observe and drive
# it. Note that driving it *does* let it act with its GitHub token -- that is
# the point of the test-drive, and the token's blast radius is bounded by the
# agent having its own GitHub account that pushes to its own forks.
#
# CLEANUP(added 2026-07-29, delete verbs added same day): remove after
# 2026-07-31. Tracked in the revert PR
# (#3559), which removes this directory alongside the other experiment grants.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: public-coder-agent-debug
  namespace: public-coder-agent
  annotations:
    description: Time-boxed read-and-exec access for the autonomous-PR test-drive. Remove after 2026-07-31.
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: ["get", "list", "watch"]
  # `create` alone is not enough: kubectl tries the WebSocket transport first,
  # which authorizes as **get** on pods/exec and only then falls back to SPDY.
  # With create-only every exec 403s while `kubectl auth can-i` still says yes.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: ["get", "create"]
  # Delete-to-recreate, for exactly one failure shape seen on this instance:
  # storageClassName is immutable on a bound PVC, so #3563's change from
  # seaweedfs-ovh to local-path-ovh-hdd could not apply. #3565 renamed the PVC
  # so Flux would create a correct one, and that deadlocked -- the stalled
  # Deployment makes the kustomization fail early, before the rename it needs is
  # ever applied. Breaking that cycle means removing the stuck object, and no
  # amount of git state can do it.
  #
  # Delete only. No create and no patch on these, so this cannot author a pod or
  # a volume, only remove one that GitOps will then recreate from the committed
  # spec. That keeps the declarative contract intact: the cluster still converges
  # to git, this just unsticks it.
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: public-coder-agent-debug
  namespace: public-coder-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: public-coder-agent-debug
subjects:
  - kind: Group
    name: oidc-ksbx-groups:haku
    apiGroup: rbac.authorization.k8s.io
