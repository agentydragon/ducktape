apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: public-coder-agent-agent-rbac
  namespace: ducktape-flux
  annotations:
    description: Time-boxed read-and-exec access to the public-coder-agent instance for the autonomous-PR test-drive. Remove after 2026-07-31.
spec:
  interval: 10m
  path: ./cluster/k8s/agents/public-coder-agent/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 2m
  # Independent of the app layer per the agent RBAC convention: a failing app
  # kustomization must not block the RBAC that exists to debug it.
  dependsOn:
    - name: public-coder-agent-namespace
