apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: public-coder-agent-backups
  namespace: public-coder-agent
  annotations:
    description: Public Coder's tenant-local SeaweedFS backup bucket.
spec:
  name: public-coder-agent-backups
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  reclaimPolicy: Retain
  access:
    - user: public-coder-agent-backups
      actions: [Read, Write, List, Tagging]
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: public-coder-agent-backups
  namespace: public-coder-agent
  annotations:
    description: Public Coder's tenant-local SeaweedFS backup credentials.
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  identityRef:
    name: public-coder-agent-backups
  secretRef:
    name: public-coder-agent-seaweedfs-credentials
    accessKeyField: AWS_ACCESS_KEY_ID
    secretKeyField: AWS_SECRET_ACCESS_KEY
  reclaimPolicy: Retain
---
# Permit only Public Coder's tenant-local Bucket and S3Credentials to reference
# the SeaweedFS cluster in its namespace.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: public-coder-agent-backups
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: public-coder-agent
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: public-coder-agent
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
