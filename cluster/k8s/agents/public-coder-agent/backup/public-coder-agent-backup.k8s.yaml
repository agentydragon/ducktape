apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Public Coder's tenant-local SeaweedFS backup bucket.
  name: public-coder-agent-backups
  namespace: public-coder-agent
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: public-coder-agent-backups
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: public-coder-agent-backups
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  annotations:
    description: Public Coder's tenant-local SeaweedFS backup credentials.
  name: public-coder-agent-backups
  namespace: public-coder-agent
spec:
  identityRef:
    name: public-coder-agent-backups
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: public-coder-agent-seaweedfs-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: public-coder-agent-backups
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: public-coder-agent
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: public-coder-agent
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-coder-agent-volsync-egress
  namespace: public-coder-agent
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 8333
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
          podSelector:
            matchLabels:
              app.kubernetes.io/component: s3
              app.kubernetes.io/instance: seaweedfs
              app.kubernetes.io/managed-by: seaweedfs-operator
              app.kubernetes.io/name: seaweedfs
  podSelector:
    matchLabels:
      app.kubernetes.io/name: public-coder-agent-volsync
  policyTypes:
    - Egress
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-coder-agent-volsync-repository-reader
  namespace: public-coder-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: public-coder-agent-volsync-repository-reader
  namespace: public-coder-agent
rules:
  - apiGroups:
      - ""
    resourceNames:
      - public-coder-agent-volsync-s3
      - public-coder-agent-seaweedfs-credentials
      - public-coder-agent-volsync-restic-password
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: public-coder-agent-volsync-repository-reader
  namespace: public-coder-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: public-coder-agent-volsync-repository-reader
subjects:
  - kind: ServiceAccount
    name: public-coder-agent-volsync-repository-reader
    namespace: public-coder-agent
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: public-coder-agent-volsync-s3
  namespace: public-coder-agent
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: public-coder-agent-volsync-repository-reader
          namespace: public-coder-agent
      remoteNamespace: public-coder-agent
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: public-coder-agent-state-v2-restic
  namespace: public-coder-agent
spec:
  data:
    - remoteRef:
        key: public-coder-agent-seaweedfs-credentials
        property: AWS_ACCESS_KEY_ID
      secretKey: AWS_ACCESS_KEY_ID
    - remoteRef:
        key: public-coder-agent-seaweedfs-credentials
        property: AWS_SECRET_ACCESS_KEY
      secretKey: AWS_SECRET_ACCESS_KEY
    - remoteRef:
        key: public-coder-agent-volsync-restic-password
        property: RESTIC_PASSWORD
      secretKey: RESTIC_PASSWORD
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: public-coder-agent-volsync-s3
  target:
    creationPolicy: Owner
    name: public-coder-agent-state-v2-restic
    template:
      mergePolicy: Merge
      templateFrom:
        - literal: |
            RESTIC_REPOSITORY: s3:http://seaweedfs-s3.seaweedfs.svc:8333/public-coder-agent-backups
            AWS_DEFAULT_REGION: us-east-1
      type: Opaque
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: public-coder-agent-state-v2-restic
  namespace: public-coder-agent
spec:
  restic:
    cacheAccessModes:
      - ReadWriteOnce
    cacheCapacity: 1Gi
    cacheStorageClassName: local-path-ovh-hdd
    copyMethod: Direct
    moverAffinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - ovh-ns102453
    moverPodLabels:
      app.kubernetes.io/name: public-coder-agent-volsync
    moverResources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    moverSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    pruneIntervalDays: 7
    repository: public-coder-agent-state-v2-restic
    retain:
      daily: 7
      monthly: 6
      weekly: 4
  sourcePVC: public-coder-agent-state-v2
  trigger:
    schedule: 17 09 * * *
