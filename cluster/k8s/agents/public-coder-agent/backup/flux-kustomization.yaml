apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: public-coder-agent-backup
  namespace: ducktape-flux
  annotations:
    description: >-
      Restic/VolSync backup of Public Coder's worker-local OpenClaw state to
      its dedicated private SeaweedFS S3 bucket.
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  wait: true
  path: ./cluster/k8s/agents/public-coder-agent/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: seaweedfs-public-coder-agent-backups-bucket
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: volsync
      namespace: ducktape-flux
