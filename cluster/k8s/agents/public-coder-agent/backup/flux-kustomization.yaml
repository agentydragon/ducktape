apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Restic/VolSync backup of Public Coder's worker-local OpenClaw state to its dedicated private SeaweedFS S3 bucket.
  name: public-coder-agent-backup
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: seaweedfs-public-coder-agent-backups-bucket
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: volsync
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: public-coder-agent-backups
      namespace: public-coder-agent
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: public-coder-agent-backups
      namespace: public-coder-agent
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: public-coder-agent-state-v2-restic
      namespace: public-coder-agent
  interval: 10m
  path: ./cluster/k8s/agents/public-coder-agent/backup
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: public-coder-agent-backup
    namespace: ducktape-flux
  timeout: 5m
  wait: true
