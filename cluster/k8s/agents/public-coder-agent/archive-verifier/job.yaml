apiVersion: batch/v1
kind: Job
metadata:
  name: public-coder-agent-state-archive-verify-20260817
  namespace: public-coder-agent
  labels:
    app.kubernetes.io/name: public-coder-agent-archive-verifier
spec:
  # Do not retry a long object-store read automatically.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-coder-agent-archive-verifier
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: ovh-ns102453
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: rclone/rclone:1.75.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -o pipefail
              umask 077
              bucket=public-coder-agent-archive
              prefix=rescue/20260817T093035Z
              partial="${prefix}/public-coder-agent-state.tar.partial"
              checksum="${prefix}/public-coder-agent-state.tar.partial.sha256"
              marker="${prefix}/public-coder-agent-state.tar.verified.json"
              expected=/tmp/expected.sha256
              actual=/tmp/actual.sha256
              fifo=/tmp/archive.sha256.fifo
              rclone --config '' cat archive:"$bucket/$checksum" > "$expected"
              grep -Eq '^[[:xdigit:]]{64}  -$' "$expected"
              mkfifo "$fifo"
              sha256sum "$fifo" | sed 's#  .*#  -#' > "$actual" &
              hasher_pid=$!
              # Verification reads only the retained S3 object; it never mounts the
              # stranded control-plane PVC. Keep Seaweed HDD reads bounded while
              # still completing verification in about an hour and a quarter.
              rclone --config '' cat --bwlimit 10M archive:"$bucket/$partial" | tee "$fifo" | tar -tf - >/dev/null
              wait "$hasher_pid"
              cmp "$expected" "$actual"
              checksum_value="$(cut -d ' ' -f 1 "$actual")"
              printf '{"archive":"%s","sha256":"%s"}\n' "$partial" "$checksum_value" > /tmp/verified.json
              rclone --config '' copyto /tmp/verified.json archive:"$bucket/$marker"
          env:
            - name: RCLONE_CONFIG_ARCHIVE_TYPE
              value: s3
            - name: RCLONE_CONFIG_ARCHIVE_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_ARCHIVE_ENDPOINT
              value: http://seaweedfs-s3.seaweedfs.svc:8333
            - name: RCLONE_CONFIG_ARCHIVE_NO_CHECK_BUCKET
              value: "true"
            - name: RCLONE_CONFIG_ARCHIVE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-identity-public-coder-agent-archive
                  key: accessKey
            - name: RCLONE_CONFIG_ARCHIVE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-identity-public-coder-agent-archive
                  key: secretKey
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
