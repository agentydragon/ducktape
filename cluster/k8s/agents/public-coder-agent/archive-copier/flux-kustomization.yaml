apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: public-coder-agent-archive-copier
  namespace: ducktape-flux
  annotations:
    description: >-
      One-shot, rate-limited logical archive of the stranded Public Coder PVC.
      Kept suspended until the source node is sufficiently reachable for a
      deliberate rescue window.
spec:
  suspend: false
  interval: 1h
  retryInterval: 5m
  timeout: 12h
  wait: true
  path: ./cluster/k8s/agents/public-coder-agent/archive-copier
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: seaweedfs-public-coder-agent-archive-bucket
      namespace: ducktape-flux
