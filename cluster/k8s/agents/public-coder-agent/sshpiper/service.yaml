apiVersion: v1
kind: Service
metadata:
  name: public-coder-agent-sshpiper
  namespace: public-coder-agent
  annotations:
    description: ClusterIP for the Agent's SSH route to the devbox. Not published outside the cluster; reachability is decided by cnp-ingress.yaml, not by this Service existing.
  labels:
    app.kubernetes.io/name: public-coder-agent-sshpiper
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: public-coder-agent-sshpiper
  ports:
    - name: ssh
      protocol: TCP
      port: 2222
      targetPort: 2222
