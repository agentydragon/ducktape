apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: attic-jwt-rotation
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/attic-jwt-rotation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # nix-cache provides the attic deployment that the rotators kubectl-exec into.
    - name: nix-cache
    # github-secrets-sync provides the GitHub PAT (reflected from flux-system to
    # nix-cache by emberstack reflector via reflection-auto-namespaces).
    - name: github-secrets-sync-secrets
  timeout: 2m
