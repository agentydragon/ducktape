apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: attic-jwt-rotation
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/agents/attic-jwt-rotation
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  dependsOn:
    # nix-cache provides the attic deployment that the rotators kubectl-exec into.
    - name: nix-cache
      namespace: ducktape-flux
    - name: external-creds
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: github-secrets-sync-pat
      namespace: nix-cache
  timeout: 2m
