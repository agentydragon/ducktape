apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: nix-cache
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-secrets-sync-pat
  namespace: nix-cache
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    name: github-secrets-sync-pat
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: token
      remoteRef:
        key: github-agentydragon-2
        property: token
