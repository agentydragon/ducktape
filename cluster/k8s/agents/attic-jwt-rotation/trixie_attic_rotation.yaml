# Deb packages for the attic-jwt-rotation CronJob image.
#
# The rotator (rotate.py) exec's the running attic pod to mint JWTs:
# `kubectl exec deploy/attic -- atticadm make-token …`, sidestepping the upstream
# attic image's nix-only binaries. Apt-installed: git for the sparse-clone +
# commit/push of rotated SOPS files, ca-certificates for HTTPS to GitHub. The
# Python interpreter comes from the py_image_layer in BUILD.bazel; `kubectl` and
# `sops` come from static-binary tar layers there too.
#
# Regenerate the lock file after any change:
#   bazel run @trixie_attic_rotation//:lock
version: 1

sources:
  - channel: trixie main
    url: https://snapshot.debian.org/archive/debian/20260301T000000Z
  - channel: trixie-security main
    url: https://snapshot.debian.org/archive/debian-security/20260301T000000Z

archs:
  - "amd64"

packages:
  - "ca-certificates"
  - "git"
