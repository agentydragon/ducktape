# Attic JWT tokens rotated by rotate.py (CronJob attic-jwt-rotation, ns nix-cache).
# Each token is minted via `kubectl exec deploy/attic -- atticadm make-token` (the
# HS256 signing key never leaves the attic pod) and written SOPS-encrypted to its
# sops_file. `pull`/`push` list the caches the token may read/write; `push` defaults
# to empty, so read-only tokens omit it.
tokens:
  - name: wyrm2 attic reader
    sops_file: secrets/hosts/wyrm2-attic.yaml
    sub: wyrm2
    validity: 1 year
    pull: [main, gaffer]
  - name: rugged attic reader
    sops_file: secrets/hosts/rugged-attic.yaml
    sub: rugged
    validity: 1 year
    pull: [main, gaffer]
  - name: iguana attic reader
    sops_file: secrets/hosts/iguana-attic.yaml
    sub: iguana
    validity: 1 year
    pull: [main, gaffer]
  - name: atlas attic reader
    sops_file: secrets/hosts/atlas-attic.yaml
    sub: atlas
    validity: 1 year
    pull: [main, gaffer]
  - name: gecko attic reader
    sops_file: secrets/hosts/gecko-attic.yaml
    sub: gecko
    validity: 1 year
    pull: [main, gaffer]
  - name: agent-box attic reader
    sops_file: secrets/hosts/agent-box-attic.yaml
    sub: agent-box
    validity: 1 year
    pull: [main, gaffer]
  - name: claude-web attic reader
    sops_file: secrets/claude-web-attic.yaml
    sub: claude-web
    validity: 1 year
    pull: [main, gaffer]
  - name: haku attic reader
    sops_file: secrets/haku-attic.yaml
    sub: haku
    validity: 1 year
    pull: [main, gaffer]
  # ducktape CI writer pulls both caches:
  #  - main:r is an extra substituter for the nix-attic-push workflow, so paths
  #    cache.nixos.org can't serve (the unfree CUDA stack: cuda-merged/ollama for
  #    wyrm2) are pulled from a prior run instead of rebuilt locally.
  #  - gaffer:r is needed because evaluating flake outputs that reference
  #    nix/packages/gaffer.nix triggers builtins.fetchClosure against
  #    cache.allegedly.works/gaffer to substitute the private drivefs/drivectl
  #    closures bundled into NixOS/home configs.
  - name: ducktape CI attic writer (main)
    sops_file: secrets/ci/attic-main-writer.sops.yaml
    sub: ducktape-ci
    validity: 1 year
    pull: [main, gaffer]
    push: [main]
  - name: gaffer CI attic writer
    sops_file: secrets/ci/attic-gaffer-writer.sops.yaml
    sub: gaffer-ci
    validity: 1 year
    pull: [gaffer]
    push: [gaffer]
