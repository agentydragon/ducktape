apiVersion: batch/v1
kind: Job
metadata:
  name: ha-mcp-token-provisioner
  namespace: home-assistant
  annotations:
    description: "Validates and repairs the dedicated Home Assistant long-lived token consumed by HA-MCP."
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-mcp-token-provisioner
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ha-mcp-token-provisioner
      enableServiceLinks: true
      containers:
        - name: provision-token
          image: ghcr.io/agentydragon/ha-mcp-token-provisioner:latest # {"$imagepolicy": "flux-system:ha-mcp-token-provisioner"}
          imagePullPolicy: Always
          env:
            - name: HOME_ASSISTANT_LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-assistant-break-glass
                  key: password
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
