apiVersion: batch/v1
kind: Job
metadata:
  name: ha-mcp-token-provisioner
  namespace: home-assistant
  annotations:
    description: "Validates and repairs the dedicated Home Assistant long-lived token consumed by HA-MCP."
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # Idempotent repair loop -- it validates the token and only rewrites it when
  # broken -- so re-running on a cadence is the intended behaviour, not a side
  # effect. That makes the TTL safe here, and the TTL is what lets a failed run
  # recover: Flux's `wait: true` blocks on every object it applies, so a Failed
  # Job holds this Kustomization (and ha-mcp + ha-mcp-servicemonitor behind it)
  # unready forever. Job specs are immutable, so re-applying an unchanged
  # manifest is a no-op, and the `force` annotation above only fires on a
  # manifest change -- neither retries after an *environmental* failure. The TTL
  # deletes the finished Job; the next reconcile recreates and re-runs it.
  #
  # Deliberately NOT applied to change-driven provisioners (the readonly-role
  # GRANT Jobs): for those the TTL would convert a run-on-change script into a
  # run-on-schedule one. See study-casino/db/readonly-role-provisioner-job.yaml.
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-mcp-token-provisioner
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ha-mcp-token-provisioner
      enableServiceLinks: true
      containers:
        - name: provision-token
          image: ghcr.io/agentydragon/ha-mcp-token-provisioner:devel-20260827010609-ad9239c # {"$imagepolicy": "flux-system:ha-mcp-token-provisioner"}
          imagePullPolicy: Always
          env:
            - name: HOME_ASSISTANT_LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-assistant-break-glass
                  key: password
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
