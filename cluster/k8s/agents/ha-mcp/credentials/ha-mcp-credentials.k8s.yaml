apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: home-assistant
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ha-mcp-token-provisioner
  namespace: home-assistant
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ha-mcp-token-provisioner
  namespace: ha-mcp
rules:
  - apiGroups:
      - ""
    resourceNames:
      - ha-mcp-home-assistant-token
    resources:
      - secrets
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ha-mcp-token-provisioner
  namespace: ha-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ha-mcp-token-provisioner
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: ha-mcp-token-provisioner
    namespace: home-assistant
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    description: Validates and repairs the dedicated Home Assistant long-lived token consumed by HA-MCP.
    kustomize.toolkit.fluxcd.io/force: enabled
  name: ha-mcp-token-provisioner
  namespace: home-assistant
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-mcp-token-provisioner
        cdk8s.io/metadata.addr: ha-mcp-credentials-provisioner-job-c862fdfd
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: HOME_ASSISTANT_LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: home-assistant-break-glass
          image: git.allegedly.works/ducktape-ci/ha-mcp-token-provisioner:unset
          imagePullPolicy: Always
          name: provision-token
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: OnFailure
      securityContext:
        fsGroupChangePolicy: Always
        runAsNonRoot: true
      serviceAccountName: ha-mcp-token-provisioner
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
  ttlSecondsAfterFinished: 3600
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ha-mcp-token-provisioner
  namespace: home-assistant
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ha-mcp-token-provisioner
            cdk8s.io/metadata.addr: ha-mcp-credentials-provisioner-cronjob-c8c687cb
        spec:
          automountServiceAccountToken: true
          containers:
            - env:
                - name: HOME_ASSISTANT_LOCAL_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: home-assistant-break-glass
              image: git.allegedly.works/ducktape-ci/ha-mcp-token-provisioner:unset
              imagePullPolicy: Always
              name: provision-token
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 20m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                privileged: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
          dnsPolicy: ClusterFirst
          hostNetwork: false
          imagePullSecrets:
            - name: forgejo-images-creds
          restartPolicy: OnFailure
          securityContext:
            fsGroupChangePolicy: Always
            runAsNonRoot: true
          serviceAccountName: ha-mcp-token-provisioner
          setHostnameAsFQDN: false
          shareProcessNamespace: false
          terminationGracePeriodSeconds: 30
  schedule: 0 4 * * 0
  startingDeadlineSeconds: 10
  successfulJobsHistoryLimit: 3
  suspend: false
