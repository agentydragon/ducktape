apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ha-mcp-credentials
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/agents/ha-mcp/credentials
  prune: true
  wait: true
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: ha-mcp-token-provisioner
      namespace: home-assistant
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: home-assistant
      namespace: ducktape-flux
    - name: ha-mcp-namespace
      namespace: ducktape-flux
