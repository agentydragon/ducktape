apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ha-mcp-credentials
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/agents/ha-mcp/credentials
  prune: true
  wait: true
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: ha-mcp-token-provisioner
      namespace: home-assistant
  dependsOn:
    - name: home-assistant
    - name: ha-mcp-namespace
