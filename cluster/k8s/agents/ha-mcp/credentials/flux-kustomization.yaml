apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ha-mcp-credentials
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: external-secrets-config
    - name: forgejo-images
    - name: home-assistant
    - name: ha-mcp-namespace
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: ha-mcp-token-provisioner
      namespace: home-assistant
  interval: 10m
  path: ./cluster/k8s/agents/ha-mcp/credentials
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: ha-mcp-credentials
    namespace: ducktape-flux
  timeout: 5m
  wait: true
