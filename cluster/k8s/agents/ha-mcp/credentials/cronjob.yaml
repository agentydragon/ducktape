# Weekly validation repairs the token after expiry, revocation, or a Home Assistant restore.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ha-mcp-token-provisioner
  namespace: home-assistant
spec:
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ha-mcp-token-provisioner
        spec:
          restartPolicy: OnFailure
          serviceAccountName: ha-mcp-token-provisioner
          enableServiceLinks: true
          containers:
            - name: provision-token
              image: ghcr.io/agentydragon/ha-mcp-token-provisioner:devel-20260827014057-8427d07 # {"$imagepolicy": "flux-system:ha-mcp-token-provisioner"}
              imagePullPolicy: Always
              env:
                - name: HOME_ASSISTANT_LOCAL_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: home-assistant-break-glass
                      key: password
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
