apiVersion: v1
kind: ServiceAccount
metadata:
  name: ha-mcp-token-provisioner
  namespace: home-assistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ha-mcp-token-provisioner
  namespace: ha-mcp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ha-mcp-home-assistant-token"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ha-mcp-token-provisioner
  namespace: ha-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ha-mcp-token-provisioner
subjects:
  - kind: ServiceAccount
    name: ha-mcp-token-provisioner
    namespace: home-assistant
