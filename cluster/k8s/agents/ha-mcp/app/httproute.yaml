apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ha-mcp
  namespace: ha-mcp
  annotations:
    description: "Authentik-gated Home Assistant MCP facade. Only agentydragon is allowed at the OAuth consent step."
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "ha-mcp.allegedly.works"
  rules:
    - backendRefs:
        - name: ha-mcp
          port: 8765
      timeouts:
        request: "120s"
        backendRequest: "120s"
