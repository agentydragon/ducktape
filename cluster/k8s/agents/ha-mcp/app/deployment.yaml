apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-mcp
  namespace: ha-mcp
  labels:
    app.kubernetes.io/name: ha-mcp
  annotations:
    description: "Writable Home Assistant MCP server behind the shared Authentik OAuth facade. The upstream HA token remains server-side; only agentydragon may complete OAuth, and Haku applies its own per-call approval policy."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ha-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-mcp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: ha-mcp
          image: ghcr.io/homeassistant-ai/ha-mcp:7.14.0@sha256:198fa1567c6661d3b4b20cff10dfaf0c6ddecd2c4dbf13828df2a1ce23eac2fd
          imagePullPolicy: IfNotPresent
          args:
            - ha-mcp-web
          ports:
            - name: upstream
              containerPort: 8086
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ha-mcp-config
          env:
            - name: HOMEASSISTANT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ha-mcp-home-assistant-token
                  key: token
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: upstream
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: upstream
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
        - name: facade
          image: ghcr.io/agentydragon/mcp-oauth-facade:devel-20260718112225-8d4faeb # {"$imagepolicy": "flux-system:mcp-oauth-facade"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ha-mcp-config
          env:
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ha-mcp-oidc
                  key: client_id
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ha-mcp-oidc
                  key: client_secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
