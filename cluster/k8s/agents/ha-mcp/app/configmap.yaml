apiVersion: v1
kind: ConfigMap
metadata:
  name: ha-mcp-config
  namespace: ha-mcp
data:
  HOMEASSISTANT_URL: "http://home-assistant.home-assistant.svc.cluster.local:8123"
  MCP_HOST: "0.0.0.0"
  MCP_PORT: "8086"
  MCP_SECRET_PATH: "/mcp"
  MCP_HEALTHZ: "true"
  MCP_SERVER_NAME: "Home Assistant"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  BACKUP_HINT: "normal"
  HA_MCP_CONFIG_DIR: "/data"
  HAMCP_BACKUP_DIR: "/data/backups"
  ENABLE_TOOL_SEARCH: "false"
  READ_ONLY_MODE: "false"
  ENABLE_BETA_FEATURES: "false"
  ENABLE_CODE_MODE: "false"
  HAMCP_ENABLE_FILESYSTEM_TOOLS: "false"
  ENABLE_YAML_CONFIG_EDITING: "false"
  HAMCP_ENABLE_DEV_MODE: "false"
  ENABLE_TOOL_SECURITY_POLICIES: "false"
  MCP_FACADE_FACADE_NAME: "Home Assistant MCP Facade"
  MCP_FACADE_UPSTREAM__KIND: "http"
  MCP_FACADE_UPSTREAM__URL: "http://localhost:8086/mcp"
  # Client auth is a cluster-internal static bearer (MCP_FACADE_CLIENT_AUTH__STATIC_BEARER,
  # injected from the ha-mcp-bearer Secret in deployment.yaml), not the public Authentik OAuth
  # gate. FacadeSettings requires exactly one of `auth` / `client_auth`, so the MCP_FACADE_AUTH__*
  # keys are absent by design. With no OAuth there is no client registration or token state to
  # keep, so the facade needs no persistence backend and the Valkey is gone with it.
