apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ha-mcp
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: external-secrets-config
    - name: forgejo-images
    - name: ha-mcp-namespace
    - name: monitoring-crds
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ha-mcp
      namespace: ha-mcp
  interval: 10m
  path: ./cluster/k8s/agents/ha-mcp/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: ha-mcp
    namespace: ducktape-flux
  timeout: 5m
  wait: true
