apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ha-mcp
  # In flux-system, not ducktape-flux: decryption.secretRef resolves in the
  # Kustomization's OWN namespace, and sops-age-cluster-secrets exists only here.
  # Same placement as haku-sandbox-mcp-app, the other static-bearer MCP facade.
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/agents/ha-mcp/app
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ha-mcp
      namespace: ha-mcp
  # bearer.sops.yaml is SOPS-encrypted; without this Flux applies the ENC[...] ciphertext
  # literally and the facade rejects every call from haku-console.
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: home-assistant
      namespace: flux-system
    - name: ha-mcp-namespace
      namespace: ducktape-flux
    - name: ha-mcp-credentials
      namespace: ducktape-flux
