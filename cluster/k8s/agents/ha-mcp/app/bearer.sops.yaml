# StaticBearerGuard token for the HA MCP facade's /mcp mount. Minted fresh in this
# repo (agents may author a SOPS Secret by encrypting to the rule's public keys; see
# cluster/AGENTS.md "Annotating a SOPS-encrypted Secret"). The emberstack reflector
# mirrors it into haku-console so the console presents the SAME token
# (HAKU_CONSOLE_MCP_CREDENTIAL_HA_MCP_BEARER) when it calls this MCP — one source of
# truth, no drift (same pattern as tana's account PAT).
apiVersion: v1
kind: Secret
metadata:
    name: ha-mcp-bearer
    namespace: ha-mcp
    annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: haku-console
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: haku-console
