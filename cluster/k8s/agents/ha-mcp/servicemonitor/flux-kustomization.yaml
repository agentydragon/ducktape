apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ha-mcp-servicemonitor
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/agents/ha-mcp/servicemonitor
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  dependsOn:
    - name: ha-mcp
      namespace: flux-system
    - name: monitoring-stack
      namespace: flux-system
