apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ha-mcp-namespace
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/agents/ha-mcp/namespace
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: ha-mcp-namespace

    namespace: ducktape-flux
