apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-home
  namespace: codex-nix-pvc-uid-pod
  annotations:
    description: "Persistent home and workspace volume for the codex-nix-pvc-uid-pod spike."
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: seaweedfs-ovh
  resources:
    requests:
      storage: 80Gi
