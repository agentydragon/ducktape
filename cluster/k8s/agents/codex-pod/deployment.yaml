apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-pod
  namespace: codex-pod
  labels:
    app.kubernetes.io/name: codex-pod
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO workspace PVC — don't run two pods against it
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-pod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-pod
    spec:
      automountServiceAccountToken: false
      # Private Forgejo package — ducktape-ci credential reflected into this
      # namespace from cluster/k8s/forgejo-images/.
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/region: hil
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: codex
          # Flux image-automation setter: the marker MUST be a trailing comment on
          # the image line (kyaml Setters ignores an own-line comment above it).
          image: git.allegedly.works/ducktape-ci/codex-pod:devel # {"$imagepolicy": "flux-system:codex-pod"}
          # HOME (/home/codex) + all static config are baked into the image by
          # home-manager. The only runtime step is planting the SSH private key
          # (secret → 0600; a mount can't satisfy ssh's ownership/perms). Access
          # is via `kubectl exec`, which inherits the container env.
          command: ["/bin/bash", "-c"]
          args:
            - |
              install -D -m600 /run/codex-secret/id_ed25519 "$HOME/.ssh/id_ed25519"
              exec sleep infinity
          env:
            # Shared BuildBuddy key (bbr reads BUILDBUDDY_API_KEY), reflected into
            # this namespace from shared-secrets/buildbuddy-api-key. Optional so a
            # brief pre-reflection window doesn't block pod start.
            - name: BUILDBUDDY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: buildbuddy-api-key
                  key: api-key
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: identity
              mountPath: /run/codex-secret
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 20Gi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: codex-workspace
        - name: identity
          secret:
            secretName: codex-bootstrap-identity
            defaultMode: 0444
