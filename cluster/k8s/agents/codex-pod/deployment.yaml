apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-pod
  namespace: codex-pod
  labels:
    app.kubernetes.io/name: codex-pod
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO home PVC — don't run two pods against it
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-pod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-pod
    spec:
      automountServiceAccountToken: false
      # Private Forgejo package — ducktape-ci credential reflected into this
      # namespace from cluster/k8s/forgejo-images/.
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/region: hil
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Plant the SOPS-decrypted codex identity into the home PVC as
        # 0600 1000:1000 (fsGroup makes the PVC group-writable by 1000, so no
        # root is needed). The main container then sees ~/.ssh/id_ed25519.
        - name: plant-identity
          # {"$imagepolicy": "flux-system:codex-pod"}
          image: git.allegedly.works/ducktape-ci/codex-pod:devel
          command: ["/bin/bash", "-lc"]
          args:
            - |
              install -d -m 0700 /home/codex/.ssh
              install -m 0600 /run/codex-bootstrap/id_ed25519 /home/codex/.ssh/id_ed25519
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/codex
            - name: bootstrap-identity
              mountPath: /run/codex-bootstrap
              readOnly: true
      containers:
        - name: codex
          # {"$imagepolicy": "flux-system:codex-pod"}
          image: git.allegedly.works/ducktape-ci/codex-pod:devel
          command: ["/bin/bash", "/run/codex-pod-scripts/start-sshd.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/codex
            - name: authorized-keys
              mountPath: /etc/ssh/authorized_keys/codex
              subPath: authorized_keys
              readOnly: true
            - name: scripts
              mountPath: /run/codex-pod-scripts
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 20Gi
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: codex-home
        - name: bootstrap-identity
          secret:
            secretName: codex-bootstrap-identity
            defaultMode: 0444
        - name: authorized-keys
          configMap:
            name: codex-pod-authorized-keys
        - name: scripts
          configMap:
            name: codex-pod-scripts
            defaultMode: 0555
