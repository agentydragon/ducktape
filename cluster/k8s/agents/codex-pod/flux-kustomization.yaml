apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: codex-pod
  namespace: flux-system
  annotations:
    description: Codex agent pod running the Nix-built codex-pod image, auto-rolled by Flux image automation.
spec:
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/agents/codex-pod
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  timeout: 2m
  dependsOn:
    # Forgejo registry credential must be reflected into codex-pod (imagePullSecret)
    # and flux-system (image scan) before the pod can pull.
    - name: forgejo-images
    # Mints + reflects the codex-claude virtual key (litellm-codex-clients-key) consumed
    # by codex-claude as CODEX_LITELLM_KEY. The key itself is optional (pre-reflection
    # window) but this orders it.
    - name: litellm-keys-tf
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: codex-pod
      namespace: codex-pod
