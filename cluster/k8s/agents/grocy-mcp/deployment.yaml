apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocy-mcp
  namespace: grocy-mcp
  labels:
    app: grocy-mcp
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grocy-mcp
  template:
    metadata:
      labels:
        app: grocy-mcp
    spec:
      volumes:
        - name: envoy-config
          configMap:
            name: grocy-envoy-config
      containers:
        # Envoy reverse proxy sidecar with envoy.filters.http.credential_injector
        # using the oauth2 extension. Fetches a Bearer JWT from Authentik via the
        # M2M client_credentials flow (client_id + base64(username:app_password)
        # as client_secret), caches it, and injects Authorization: Bearer on
        # forwarded requests to grocy.allegedly.works.
        #
        # Config comes from the grocy-envoy-config ConfigMap (generated by
        # kustomize configMapGenerator from envoy.yaml). ${CLIENT_ID} in the
        # template is substituted at apply time by Flux postBuild.substituteFrom
        # reading the grocy-envoy-vars ConfigMap in flux-system (provisioned by
        # the agent-machine-access TF module).
        #
        # CLIENT_SECRET_B64 is read directly by Envoy from this container's env
        # var via core.v3.DataSource.environment_variable, so the sensitive
        # value never appears in the rendered bootstrap file.
        - name: grocy-auth-proxy
          image: envoyproxy/envoy:distroless-v1.32-latest
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--log-level"
            - "info"
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLIENT_SECRET_B64
              valueFrom:
                secretKeyRef:
                  name: grocy-machine-credentials
                  key: client_secret_b64
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
        # MCP server: saya6k/mcp-grocy-api (40+ Grocy tools over streamable HTTP).
        #
        # Two image quirks we work around here:
        #
        # 1. The ghcr.io/saya6k/mcp-grocy-api image is a Home Assistant add-on.
        #    Its s6-overlay run script (`rootfs/etc/s6-overlay/app/run`)
        #    overwrites every relevant env var with `bashio::config ...` reads
        #    from an HA supervisor config.yaml we don't provide. Without HA
        #    supervisor those reads return empty, and `set -e` kills the
        #    container on the first failed check. Fix: bypass s6-overlay and
        #    run `node build/index.js` directly, so env vars from this Pod
        #    spec reach Node.js unchanged.
        #
        # 2. `src/index.ts::run()` unconditionally creates a StdioServerTransport
        #    BEFORE starting the HTTP server. In Kubernetes without a TTY the
        #    container's stdin is closed immediately, which causes the stdio
        #    transport to see EOF, and the Node process exits before it gets
        #    to start the HTTP server. Fix: keep stdin alive by piping from
        #    `sleep infinity`. The sleep process never writes anything, so the
        #    JSON-RPC stdio reader blocks harmlessly, and the HTTP server on
        #    port 3000 starts normally for Airlock to talk to.
        - name: grocy-mcp
          image: ghcr.io/saya6k/mcp-grocy-api:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args: ["sleep infinity | node build/index.js"]
          workingDir: /app
          ports:
            - name: mcp
              containerPort: 3000
              protocol: TCP
          env:
            - name: GROCY_BASE_URL
              value: "http://localhost:8080"
            - name: GROCY_APIKEY_VALUE
              value: "proxy-handles-auth"
            - name: ENABLE_HTTP_SERVER
              value: "true"
            - name: HTTP_SERVER_PORT
              value: "3000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
