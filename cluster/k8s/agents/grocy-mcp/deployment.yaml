apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocy-mcp
  namespace: grocy-mcp
  labels:
    app: grocy-mcp
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grocy-mcp
  template:
    metadata:
      labels:
        app: grocy-mcp
    spec:
      containers:
        # Sidecar: translates GROCY-API-KEY requests into Bearer JWT via
        # Authentik M2M token exchange.
        - name: grocy-auth-proxy
          image: ghcr.io/agentydragon/grocy-auth-proxy:latest # {"$imagepolicy": "flux-system:grocy-auth-proxy"}
          imagePullPolicy: Always
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: UPSTREAM_URL
              valueFrom:
                secretKeyRef:
                  name: grocy-machine-credentials
                  key: upstream_url
            - name: TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: grocy-machine-credentials
                  key: token_url
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grocy-machine-credentials
                  key: client_id
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: grocy-machine-credentials
                  key: username
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grocy-machine-credentials
                  key: app_password
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
        # MCP server: saya6k/mcp-grocy-api (40+ Grocy tools over streamable HTTP).
        #
        # The ghcr.io/saya6k/mcp-grocy-api image is a Home Assistant add-on: its
        # s6-overlay run script (`rootfs/etc/s6-overlay/app/run`) overwrites every
        # relevant env var with `bashio::config ...` reads from an HA supervisor
        # config.yaml we don't provide. Without HA supervisor, those reads return
        # empty, and `set -e` kills the container on the first node check.
        #
        # Override entrypoint/command so we bypass s6-overlay entirely and run
        # `node build/index.js` directly with the env vars the Pod spec already
        # provides. /app is the WORKDIR baked into the image.
        - name: grocy-mcp
          image: ghcr.io/saya6k/mcp-grocy-api:latest
          imagePullPolicy: Always
          command: ["node"]
          args: ["build/index.js"]
          workingDir: /app
          ports:
            - name: mcp
              containerPort: 3000
              protocol: TCP
          env:
            - name: GROCY_BASE_URL
              value: "http://localhost:8080"
            - name: GROCY_APIKEY_VALUE
              value: "proxy-handles-auth"
            - name: ENABLE_HTTP_SERVER
              value: "true"
            - name: HTTP_SERVER_PORT
              value: "3000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
