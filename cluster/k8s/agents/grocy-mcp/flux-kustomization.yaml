apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grocy-mcp
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/agents/grocy-mcp
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: grocy-mcp
      namespace: grocy-mcp
  # ${CLIENT_ID} in envoy.yaml (wrapped into the grocy-envoy-config
  # ConfigMap by kustomize configMapGenerator) is substituted from the
  # grocy-envoy-vars ConfigMap in flux-system, populated by the
  # agent-machine-access TF module. The sensitive client_secret_b64 is
  # NOT substituted here — Envoy reads it directly from an env var on the
  # container via DataSource.environment_variable.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: grocy-envoy-vars
  dependsOn:
    - name: agent-machine-access-tf
    - name: reflector
