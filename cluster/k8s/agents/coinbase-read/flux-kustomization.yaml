apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coinbase-read
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: reflector
      namespace: ducktape-flux
    - name: haku-namespace
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/agents/coinbase-read
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: coinbase-read
    namespace: ducktape-flux
  timeout: 5m
