apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coinbase-read
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/coinbase-read
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    # Reflector mirrors the Secret into haku-sandbox; haku-namespace creates
    # haku-sandbox (the reflection target).
    - name: reflector
    - name: haku-namespace
