apiVersion: v1
kind: Namespace
metadata:
  name: coinbase-read
  annotations:
    description: >-
      ESO destination for the read-only Coinbase CDP API key
      (coinbase-read-api-credentials), distributed from the canonical external-creds
      source and separately into haku-sandbox for Haku. Decoupled from any
      consuming service so the credential survives service suspend/teardown.
