# Mirror the rotator-published alloy-otlp bearer into every agent sandbox
# namespace, where the session OTLP forwarder (devinfra/claude/
# ensure_otel_forwarder.sh) reads it to authenticate Claude Code telemetry
# relayed to alloy-otlp.allegedly.works. Same pattern as haku-mail-token
# (cluster/k8s/haku/mailbox/app): source is the flux-system Secret the
# authentik-jwt-rotation CronJob writes via its k8s_secret output.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: alloy-otlp-bearer
spec:
  # Least privilege: only namespaces whose sessions run the OTLP forwarder.
  # (openclaw-sandbox deliberately excluded — nothing there consumes the bearer,
  # and its Kustomization is currently suspended.)
  namespaces:
    - claude-sandbox
    - haku-sandbox
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      name: kubernetes-flux-system-secret-store
      kind: ClusterSecretStore
    target:
      name: alloy-otlp-bearer
    data:
      - secretKey: token
        remoteRef:
          key: alloy-otlp-bearer
          property: token
