apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: alloy-otlp-bearer
spec:
  externalSecretSpec:
    data:
      - remoteRef:
          key: alloy-otlp-bearer
          property: token
        secretKey: token
    refreshInterval: 1m
    secretStoreRef:
      kind: ClusterSecretStore
      name: kubernetes-flux-system-secret-store
    target:
      name: alloy-otlp-bearer
  namespaces:
    - claude-sandbox
    - haku-sandbox
