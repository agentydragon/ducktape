apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: postscanmail-valkey-kimsufi
  namespace: postscanmail-mcp
  annotations:
    description: Kimsufi Valkey for PostScan Mail MCP facade OAuth state
spec:
  clusterSize: 2
  kubernetesConfig:
    image: valkey/valkey:8-alpine
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path-ovh
        resources:
          requests:
            storage: 1Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values: ["hil-ovh"]
      # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
      # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
      # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: postscanmail-valkey-kimsufi
          topologyKey: kubernetes.io/hostname
