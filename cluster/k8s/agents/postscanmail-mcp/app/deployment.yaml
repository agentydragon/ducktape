apiVersion: apps/v1
kind: Deployment
metadata:
  name: postscanmail-mcp
  namespace: postscanmail-mcp
  labels:
    app.kubernetes.io/name: postscanmail-mcp
  annotations:
    description: "Authentik-gated PostScan Mail MCP. Two long-running containers in the same network namespace: a Python FastMCP sidecar that wraps the PostScan Mail REST API as Streamable HTTP on localhost:8080, and the shared mcp-oauth-facade fronting it with OIDCProxy. Only agentydragon is allowed at the OAuth consent step."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postscanmail-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postscanmail-mcp
    spec:
      # No Kubernetes API access; don't mount a SA token.
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: postscanmail-mcp-server
          image: ghcr.io/agentydragon/postscanmail-mcp-server:devel-20260601212442-287c475 # {"$imagepolicy": "flux-system:postscanmail-mcp-server"}
          imagePullPolicy: Always
          ports:
            - name: bridge
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: postscanmail-mcp-api-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: facade
          image: ghcr.io/agentydragon/mcp-oauth-facade:devel-20260609182829-b23cf2b # {"$imagepolicy": "flux-system:mcp-oauth-facade"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          envFrom:
            - configMapRef:
                name: postscanmail-mcp-config
          env:
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: postscanmail-mcp-oidc
                  key: client_id
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postscanmail-mcp-oidc
                  key: client_secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 20
            periodSeconds: 20
