apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postscanmail-mcp-ingress
  namespace: postscanmail-mcp
  annotations:
    description: "Default-deny ingress for postscanmail-mcp pods. Only the Cilium ingress entity (cilium-envoy serving the cluster Gateway HTTPRoute) can reach the facade on port 8765. Bridge port 8080 has no allow rule, so other pods cannot reach it across the pod network — only the in-pod facade reaches it via loopback (localhost), which Cilium does not police."
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postscanmail-mcp
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
    # monitoring: Prometheus metrics scraping
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
