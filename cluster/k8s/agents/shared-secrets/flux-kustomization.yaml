apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-shared-secrets
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/agents/shared-secrets
  # CLEANUP(added 2026-08-30): Restore pruning once external-creds owns
  # claude-sandbox/github-token and this Kustomization's live inventory no
  # longer lists it.
  prune: false
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  timeout: 5m
  dependsOn:
    - name: claude-rbac
      namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
