# BuildBuddy API key, and the only copy of it in this repo.
#
# Flux applies it here and the reflector fans it into the agent namespaces
# that run bbr. The in-cluster tofu-controller reads it from claude-sandbox to
# set the ducktape BUILDBUDDY_API_KEY GitHub Actions secret, so CI is fed from
# this file too rather than from a separately-maintained value. Workstations
# and agent sessions decrypt it directly for $BUILDBUDDY_API_KEY and the
# generated buildbuddy.bazelrc, which is why .sops.yaml gives this one file
# the user and agent keys on top of the usual cluster pair.
apiVersion: v1
kind: Secret
metadata:
    name: buildbuddy-api-key
    namespace: claude-sandbox
    annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: codex-pod,public-coder-agent
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: codex-pod,public-coder-agent
type: Opaque
stringData:
