# Brave Search API key, and the only copy of it in this repo. It authenticates
# to an external platform rather than to anything this cluster owns, so it is
# shared here instead of living under the one agent that used it first.
#
# Flux applies it and the agent egress proxies consume it in-cluster; the
# workstations decrypt this same file as $BRAVE_API_KEY through
# ducktape.sopsEnv, which is why .sops.yaml gives it the user keys on top of
# the usual cluster pair. Rotating the subscription means editing one file.
#
# Agent containers never receive it. They get a non-secret placeholder that
# their proxy substitutes into X-Subscription-Token on api.search.brave.com.
apiVersion: v1
kind: Secret
metadata:
    name: brave-search-api-key
    namespace: claude-sandbox
    annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: public-coder-agent
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: public-coder-agent
type: Opaque
