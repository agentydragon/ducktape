# Brave Search API key. It authenticates to an external platform rather than to
# anything this cluster owns, so it is shared here instead of living under the
# one agent that happens to use it first. The workstation copy of the same key
# is secrets/shared/brave-search.yaml; rotation touches both.
#
# Only egress proxies consume this. Agent containers receive a non-secret
# placeholder that their proxy substitutes into X-Subscription-Token on
# api.search.brave.com.
apiVersion: v1
kind: Secret
metadata:
    name: brave-search-api-key
    namespace: claude-sandbox
    annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: public-coder-agent
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: public-coder-agent
