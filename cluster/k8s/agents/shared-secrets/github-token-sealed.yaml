---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-token
  namespace: claude-sandbox
spec:
  encryptedData:
    token: 
  template:
    metadata:
      annotations:
        description: GitHub PAT for agentydragon-agent (same value as secrets/github-pat-agentydragon-agent.yaml)
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: openclaw-gateway
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: openclaw-gateway
      name: github-token
      namespace: claude-sandbox
    type: Opaque
