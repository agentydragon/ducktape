apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-jwt-rotation
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/agents/authentik-jwt-rotation
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  dependsOn:
    - name: github-secrets-sync-secrets
      namespace: ducktape-flux
    - name: agent-machine-access-tf
      namespace: ducktape-flux
  timeout: 2m
