# Mirrors grocy-sf.tf's Terraform-materialized grocy-mcp-oidc-sf Secret (authentik
# namespace) into agents-infra, so the grocy-sf-readonly rotation (rotations.yaml) can
# mount the same client credentials the grocy-mcp-sf MCP server itself uses to log in.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grocy-mcp-oidc-sf
  namespace: agents-infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-authentik-secret-store
  target:
    name: grocy-mcp-oidc-sf
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_id
      remoteRef:
        key: grocy-mcp-oidc-sf
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: grocy-mcp-oidc-sf
        property: client_secret
    - secretKey: grocy_proxy_client_id
      remoteRef:
        key: grocy-mcp-oidc-sf
        property: grocy_proxy_client_id
