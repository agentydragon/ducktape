apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-jwt-rotation
  namespace: agents-infra
  annotations:
    description: >-
      Rotates every Authentik client_credentials JWT listed in rotations.yaml (the ConfigMap-mounted source of truth). Runs hourly; rotate.py reads each output's unencrypted `expires_unencrypted` field (no decryption needed) and skips entries with > rotate_below_hours remaining, so a real mint runs only ~every 44 days per token. Entries with a `probe` also verify the published in-cluster Secret's token against its real endpoint each run and re-mint on 401/403. Everything minted this cycle lands in one commit.
spec:
  schedule: "15 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A Job whose pod can never start (e.g. it pins a kustomize-hashed
      # ConfigMap that a newer generation pruned) stays active forever --
      # history limits and TTL apply only to finished Jobs. The deadline
      # fails it; the TTL then garbage-collects it.
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      template:
        spec:
          # The SA token is used only to read back the published Secrets for
          # probes (published-secrets-reader Role in flux-system, get on the
          # four rotator-published Secret names — nothing else).
          serviceAccountName: authentik-jwt-rotation
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          volumes:
            - name: rotations-config
              configMap:
                name: authentik-jwt-rotations-config
            - name: github-pat
              secret:
                secretName: github-secrets-sync-pat
            - name: claude-web-k8s-creds
              secret:
                secretName: kubectl-sandbox-client-credentials
            - name: haku-k8s-creds
              secret:
                secretName: haku-client-credentials
            - name: agent-box-codex-creds
              secret:
                secretName: agent-box-codex-client-credentials
            - name: agent-box-zai-creds
              secret:
                secretName: agent-box-zai-client-credentials
            - name: haku-grocy-creds
              secret:
                secretName: haku-grocy-client-credentials
            - name: haku-mail-creds
              secret:
                secretName: haku-mail-client-credentials
            - name: alloy-otlp-creds
              secret:
                secretName: alloy-otlp-client-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              # Initial placeholder matching the ImagePolicy filterTags regex
              # (^devel-\d{14}-[0-9a-f]{7}$). Flux rewrites the field to the
              # latest published tag on first reconcile after a push-images.yml run.
              image: ghcr.io/agentydragon/authentik-jwt-rotation:devel-20260715071406-2ac2ae8 # {"$imagepolicy": "flux-system:authentik-jwt-rotation"}
              args: ["--config", "/config/rotations.yaml"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: rotations-config
                  mountPath: /config
                  readOnly: true
                - name: github-pat
                  mountPath: /var/run/secrets/github-pat
                  readOnly: true
                - name: claude-web-k8s-creds
                  mountPath: /var/run/secrets/authentik/claude-web-k8s
                  readOnly: true
                - name: haku-k8s-creds
                  mountPath: /var/run/secrets/authentik/haku-k8s
                  readOnly: true
                - name: agent-box-codex-creds
                  mountPath: /var/run/secrets/authentik/agent-box-codex
                  readOnly: true
                - name: agent-box-zai-creds
                  mountPath: /var/run/secrets/authentik/agent-box-zai
                  readOnly: true
                - name: haku-grocy-creds
                  mountPath: /var/run/secrets/authentik/haku-grocy
                  readOnly: true
                - name: haku-mail-creds
                  mountPath: /var/run/secrets/authentik/haku-mail
                  readOnly: true
                - name: alloy-otlp-creds
                  mountPath: /var/run/secrets/authentik/alloy-otlp
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
