# Rotations driven by the authentik-jwt-rotation CronJob. Each entry mints (and
# for proxy consumers, exchanges) an Authentik client_credentials JWT and commits
# it SOPS-encrypted. credentials_dir points at a mounted *-client-credentials
# secret (see cronjob.yaml volumeMounts).
rotations:
  - name: claude-web-k8s
    provider_slug: kubectl-sandbox-client-credentials
    scopes: openid profile email groups
    expected_group: kubectl-sandbox-users
    credentials_dir: /var/run/secrets/authentik/claude-web-k8s
    sops_file: secrets/claude-web-k8s-jwt.yaml
    token_field: jwt
  - name: haku-k8s
    provider_slug: kubectl-sandbox-client-credentials
    scopes: openid profile email groups
    credential_mode: user_password
    expected_group: haku
    # Assert the token carries the audience kubectl-machine-mcp validates (the
    # provider-default aud = its client_id). Haku's Anthropic-hosted managed agent
    # reaches the cluster through that passthrough MCP with a static_bearer vault
    # credential carrying this token (tf/gitops/haku-cloud-agent); the same aud also
    # keeps the direct kubeapi.allegedly.works path working.
    expected_audiences:
      - kubectl-sandbox-client-credentials
    credentials_dir: /var/run/secrets/authentik/haku-k8s
    sops_file: secrets/haku-k8s-jwt.yaml
    token_field: jwt
    # Also publish the token as an in-cluster k8s Secret so the haku-cloud-agent
    # tofu root can read it (env var) and write it into Haku's Anthropic vault as a
    # static_bearer credential. `token-exp` is the monotonic signal tofu uses for
    # the write-only token_wo_version, so a rotation re-sends the new token.
    # TODO: the token now lives SOPS-encrypted in two places — secrets/haku-k8s-jwt.yaml
    #   (bare, for the CLI/write_kubeconfig path) and this k8s Secret manifest (for
    #   Flux). That duplication is annoying. Nicer would be a single SOPS file that
    #   Flux can turn into a Secret directly (Flux only decrypts+applies files that
    #   are already k8s manifests; it won't synthesize a Secret from a bare jwt:
    #   file). Revisit if Flux/an operator grows a "SOPS data file -> Secret" path.
    k8s_secret:
      path: cluster/k8s/haku/cloud-agent-tf/haku-kube-token.sops.yaml
      name: haku-cloud-kube-token
      namespace: flux-system
  - name: agent-box-codex
    # Source JWT for the self-hosted Codex user on the agent-box VM. Issued by
    # the shared kubectl-sandbox-client-credentials provider using the
    # agent-box-codex Authentik service account, whose machine-principal mapping
    # emits only the agent-box-codex k8s group.
    provider_slug: kubectl-sandbox-client-credentials
    scopes: openid profile email groups
    credential_mode: user_password
    expected_group: agent-box-codex
    expected_audiences:
      - kubectl-sandbox-client-credentials
    credentials_dir: /var/run/secrets/authentik/agent-box-codex
    sops_file: secrets/agent-box-codex-k8s-jwt.yaml
    token_field: jwt
  - name: agent-box-zai
    # Source JWT for the self-hosted zai (Claude Code via LiteLLM/z.ai) user on the
    # agent-box VM. Issued by the shared kubectl-sandbox-client-credentials provider
    # using the agent-box-zai Authentik service account, whose machine-principal
    # mapping emits only the agent-box-zai k8s group.
    provider_slug: kubectl-sandbox-client-credentials
    scopes: openid profile email groups
    credential_mode: user_password
    expected_group: agent-box-zai
    expected_audiences:
      - kubectl-sandbox-client-credentials
    credentials_dir: /var/run/secrets/authentik/agent-box-zai
    sops_file: secrets/agent-box-zai-k8s-jwt.yaml
    token_field: jwt
  - name: haku-grocy
    # Source JWT for haku's read-only access to the grocy-sf MCP. Issued by the
    # dedicated grocy-mcp-haku-sf provider (30-day validity; shares grocy-mcp-sf's
    # signing key so the MCP's JWKS validates it, and the MCP accepts its issuer via
    # GROCY_MCP_AUTH__EXTRA_JWT_ISSUERS). No exchange_scopes — the MCP runs the
    # jwt-bearer exchange into the grocy-sf proxy itself. The outpost then injects
    # X-authentik-username=haku → the read-only `haku` Grocy user (empty perms).
    provider_slug: grocy-mcp-haku-sf
    scopes: openid profile email
    credential_mode: user_password
    expected_audiences:
      - grocy-mcp-haku-sf
    credentials_dir: /var/run/secrets/authentik/haku-grocy
    sops_file: secrets/haku-grocy-jwt.yaml
    token_field: jwt
    # Also publish the JWT (+ exp) as an in-cluster Secret so tf/gitops/haku-cloud-agent
    # can hand it to the Anthropic vault as the grocy-sf MCP bearer (read via a no-fail
    # lookup — absent secret just disables the grocy credential). Mirrors haku-k8s. ESO
    # mirrors this Secret into haku-sandbox for the self-hosted Haku home (a standalone
    # ClusterExternalSecret, decoupled from the rotator — see cluster/k8s/haku/agent-worker).
    k8s_secret:
      path: cluster/k8s/haku/cloud-agent-tf/haku-grocy-sf-token.sops.yaml
      name: haku-cloud-grocy-sf-token
      namespace: flux-system
  - name: haku-mail
    # JWT for haku's mailbox (Stalwart, cluster/k8s/haku/mailbox). The server's
    # OIDC directory validates tokens against the dedicated stalwart-haku
    # provider and pins requireAudience to its client_id; haku presents this as
    # an HTTP bearer on JMAP. Same `haku` SA/app-password as haku-grocy; the
    # provider determines the audience.
    provider_slug: stalwart-haku
    scopes: openid profile email
    credential_mode: user_password
    expected_audiences:
      - stalwart-haku
    # Stalwart's OIDC directory requires a non-empty "email" claim to resolve
    # a JWT to a mailbox account (requireScopes.email); an empty claim 403s at
    # /jmap/session even though the token authenticates fine. Asserting it here
    # fails the mint loudly instead of silently shipping a broken token, and
    # forces a re-mint if the stamped claim ever stops matching (e.g. if the
    # Authentik user's email attribute is unset again).
    expected_claims:
      email: haku@allegedly.works
    credentials_dir: /var/run/secrets/authentik/haku-mail
    sops_file: secrets/haku-mail-jwt.yaml
    token_field: jwt
    # Publish as an in-cluster Secret; the haku-mail-token ClusterExternalSecret
    # (cluster/k8s/haku/mailbox/app) mirrors it into haku-sandbox for Haku.
    k8s_secret:
      path: cluster/k8s/haku/mailbox/app/haku-mail-token.sops.yaml
      name: haku-mail-token
      namespace: flux-system
  - name: alloy-otlp
    provider_slug: alloy-otlp-client-credentials
    scopes: openid profile email
    exchange_scopes: openid profile email ak_proxy
    credentials_dir: /var/run/secrets/authentik/alloy-otlp
    sops_file: secrets/alloy-otlp-bearer-token.yaml
    token_field: token
    # Also publish in-cluster; the alloy-otlp-bearer ClusterExternalSecret
    # (cluster/k8s/agents/alloy-otlp-bearer) mirrors it into the agent sandbox
    # namespaces for the session OTLP forwarder (devinfra/claude/otlp_forwarder.py).
    k8s_secret:
      path: cluster/k8s/agents/alloy-otlp-bearer/alloy-otlp-bearer.sops.yaml
      name: alloy-otlp-bearer
      namespace: flux-system
      # The proxy-scoped bearer is not a k8s-auth JWT; keep the key aligned with
      # the ClusterExternalSecret's remoteRef.property and the forwarder's
      # jsonpath (both read `token`). Without this the default (`jwt`) would
      # silently break the mirror on the first automated mint.
      token_key: token
