# Rotations driven by the authentik-jwt-rotation CronJob. Each entry mints (and
# for proxy consumers, exchanges) an Authentik client_credentials JWT and commits
# it SOPS-encrypted. credentials_dir points at a mounted *-client-credentials
# secret (see cronjob.yaml volumeMounts).
rotations:
  - name: claude-web-k8s
    provider_slug: kubectl-sandbox-client-credentials
    scopes: openid profile email groups
    expected_group: kubectl-sandbox-users
    credentials_dir: /var/run/secrets/authentik/claude-web-k8s
    sops_file: secrets/claude-web-k8s-jwt.yaml
    token_field: jwt
  - name: haku-k8s
    provider_slug: kubectl-sandbox-client-credentials
    scopes: openid profile email groups
    credential_mode: user_password
    expected_group: haku
    # Assert the token carries the audience kubectl-machine-mcp validates (the
    # provider-default aud = its client_id). Haku's Anthropic-hosted managed agent
    # reaches the cluster through that passthrough MCP with a static_bearer vault
    # credential carrying this token (tf/gitops/haku-cloud-agent); the same aud also
    # keeps the direct kubeapi.allegedly.works path working.
    expected_audiences:
      - kubectl-sandbox-client-credentials
    credentials_dir: /var/run/secrets/authentik/haku-k8s
    sops_file: secrets/haku-k8s-jwt.yaml
    token_field: jwt
    # Also publish the token as an in-cluster k8s Secret so the haku-cloud-agent
    # tofu root can read it (env var) and write it into Haku's Anthropic vault as a
    # static_bearer credential. `token-exp` is the monotonic signal tofu uses for
    # the write-only token_wo_version, so a rotation re-sends the new token.
    # TODO: the token now lives SOPS-encrypted in two places — secrets/haku-k8s-jwt.yaml
    #   (bare, for the CLI/write_kubeconfig path) and this k8s Secret manifest (for
    #   Flux). That duplication is annoying. Nicer would be a single SOPS file that
    #   Flux can turn into a Secret directly (Flux only decrypts+applies files that
    #   are already k8s manifests; it won't synthesize a Secret from a bare jwt:
    #   file). Revisit if Flux/an operator grows a "SOPS data file -> Secret" path.
    k8s_secret:
      path: cluster/k8s/haku/cloud-agent-tf/haku-kube-token.sops.yaml
      name: haku-cloud-kube-token
      namespace: flux-system
  - name: haku-grocy
    # Source JWT for haku's read-only access to the grocy-sf MCP. Issued by the
    # grocy-mcp-sf provider so its iss matches the MCP's JWTVerifier; the MCP runs
    # the jwt-bearer exchange into the grocy-sf proxy itself, so no exchange_scopes
    # here. The outpost then injects X-authentik-username=haku → the read-only
    # `haku` Grocy user (empty perms). aud defaults to the provider client_id.
    provider_slug: grocy-mcp-sf
    scopes: openid profile email
    credential_mode: user_password
    expected_audiences:
      - grocy-mcp-sf
    credentials_dir: /var/run/secrets/authentik/haku-grocy
    sops_file: secrets/haku-grocy-jwt.yaml
    token_field: jwt
  - name: alloy-otlp
    provider_slug: alloy-otlp-client-credentials
    scopes: openid profile email
    exchange_scopes: openid profile email ak_proxy
    credentials_dir: /var/run/secrets/authentik/alloy-otlp
    sops_file: secrets/alloy-otlp-bearer-token.yaml
    token_field: token
