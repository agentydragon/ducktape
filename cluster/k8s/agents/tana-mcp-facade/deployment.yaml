apiVersion: apps/v1
kind: Deployment
metadata:
  name: tana-mcp-facade
  namespace: tana-mcp
  labels:
    app.kubernetes.io/name: tana-mcp-facade
  annotations:
    description: "Public Authentik-backed MCP facade for Tana, running the shared mcp-oauth-facade image. Access is enforced by Authentik group membership; the server injects a static downstream PAT."
    reloader.stakater.com/auto: "true"
    # CPU: VPA manages requests only — no CPU limit so cold-start bursts aren't
    # throttled. fastmcp takes ~6 CPU-seconds to import; at a 60m limit that's
    # 100s wall time even on an idle node (cgroups CFS is a hard rate limiter
    # regardless of node load). CPU is compressible: without a limit the pod
    # bursts freely on idle capacity and gets its fair share when contended.
    # controlledValues applies to every resource in the policy, so memory
    # limits are NOT VPA-managed here either — the declared limit below is what
    # applies. (An earlier version of this comment claimed the opposite.)
    goldilocks.fairwinds.com/vpa-resource-policy: >
      {"containerPolicies":[{"containerName":"server","minAllowed":{"cpu":"25m"},"controlledValues":"RequestsOnly"}]}

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tana-mcp-facade
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tana-mcp-facade
    spec:
      enableServiceLinks: false
      containers:
        - name: server
          image: ghcr.io/agentydragon/mcp-oauth-facade:devel-20260718112225-8d4faeb # {"$imagepolicy": "flux-system:mcp-oauth-facade"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
            # Prometheus metrics, cluster-internal only (not on the HTTPRoute).
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tana-mcp-facade-config
          env:
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tana-mcp-facade-oidc
                  key: client_id
            - name: MCP_FACADE_AUTH__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tana-mcp-facade-oidc
                  key: client_secret
            - name: MCP_FACADE_UPSTREAM__BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tana-agentydragon-gmail-com-account-pat
                  key: token
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              # TODO(vpa-memory-audit): 256Mi -> 512Mi. VPA observed a 259Mi
              # request / 272Mi upper bound, i.e. already over the old limit.
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          # Readiness reflects upstream tool availability, not just process
          # liveness: /readyz is 200 only when the background probe recently
          # listed >0 tools from the upstream. When Tana rejects the PAT (the
          # recurring failure) the facade goes NotReady instead of silently
          # serving an empty tool list. failureThreshold rides over a single
          # probe blip; the /readyz staleness window debounces flapping.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8765
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            periodSeconds: 20
