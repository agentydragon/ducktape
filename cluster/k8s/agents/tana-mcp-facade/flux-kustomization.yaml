apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tana-mcp-facade
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/agents/tana-mcp-facade
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: tana-mcp-facade
      namespace: tana-mcp
  dependsOn:
    - name: forgejo-images
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: tana-mcp
      namespace: ducktape-flux
    - name: valkey
      namespace: ducktape-flux
    - name: agent-machine-access-tf
      namespace: ducktape-flux
