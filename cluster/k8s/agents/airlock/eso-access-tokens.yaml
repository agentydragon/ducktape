# ClusterExternalSecrets distribute airlock OAuth access tokens to sandbox namespaces.
# Airlock writes the source secrets into the `airlock` namespace; ESO mirrors them here.
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: oura-access-token
spec:
  namespaces:
    - openclaw-sandbox
    - claude-sandbox
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      name: kubernetes-airlock-secret-store
      kind: ClusterSecretStore
    target:
      name: oura-access-token
    dataFrom:
      - extract:
          key: oura-access-token
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: google-access-token
spec:
  namespaces:
    - openclaw-sandbox
    - claude-sandbox
    - haku-sandbox
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      name: kubernetes-airlock-secret-store
      kind: ClusterSecretStore
    target:
      name: google-access-token
    dataFrom:
      - extract:
          key: google-access-token
---
# gmail.modify access token (write) for the gmail-labeling MCP server. Delivered
# ONLY to the gmail-labeling namespace — deliberately NOT to any sandbox, so no
# agent ever holds a Gmail write token directly.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: gmail-modify-access-token
spec:
  namespaces:
    - gmail-labeling
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      name: kubernetes-airlock-secret-store
      kind: ClusterSecretStore
    target:
      name: gmail-modify-access-token
    dataFrom:
      - extract:
          key: gmail-modify-access-token
