# Airlock writes google-access-token (read-only Google scopes) into the `airlock`
# namespace; ESO mirrors it into the sandbox namespaces where the agents read it.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: google-access-token
spec:
  namespaces:
    - claude-sandbox
    - haku-sandbox
    # agentplane-staging's egress proxy substitutes this into a sandbox's Gmail/Calendar
    # requests (cluster/cdk8s/agentplane/egress.py's `google-readonly` EgressCredential).
    - agentplane-staging
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      name: kubernetes-airlock-secret-store
      kind: ClusterSecretStore
    target:
      name: google-access-token
    dataFrom:
      - extract:
          key: google-access-token
