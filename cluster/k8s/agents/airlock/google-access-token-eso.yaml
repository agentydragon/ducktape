# Airlock writes google-access-token (read-only Google scopes) into the `airlock`
# namespace; ESO mirrors it where its consumers read it. Never into a namespace an agent can
# read Secrets in (docs/personal_agents/verdicts.md): agents reach Google through a proxy that
# presents the token for them.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: google-access-token
spec:
  namespaces:
    # agentplane-staging's egress proxy substitutes this into a sandbox's Google read
    # requests (cluster/cdk8s/agentplane/egress_staging_credentials.py's `google-readonly`
    # EgressCredential). The proxy's Secret watch is scoped to its isolated credentials
    # namespace (cluster/cdk8s/agentplane/egress_credentials.py's STAGING_NAMESPACE), not the
    # app namespace. Not agentplane-testing: testing reaches no real account.
    - agentplane-staging-egress-credentials
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      name: kubernetes-airlock-secret-store
      kind: ClusterSecretStore
    target:
      name: google-access-token
    dataFrom:
      - extract:
          key: google-access-token
