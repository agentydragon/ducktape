# Airlock writes google-access-token (read-only Google scopes) into the `airlock`
# namespace; ESO mirrors it where its consumers read it.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: google-access-token
spec:
  namespaces:
    # Haku reads it directly (Drive, Tasks, Gmail/Calendar REST fallback) -- an agent-readable
    # token, the pattern docs/personal_agents/verdicts.md rules out; add no agent namespace here.
    - haku-sandbox
    # agentplane-staging/-testing's egress proxies substitute this into a sandbox's
    # Gmail/Calendar requests (cluster/cdk8s/agentplane/egress.py's `google-readonly`
    # EgressCredential, present in both environments). Each proxy's own Secret watch is
    # scoped to its isolated credentials namespace
    # (cluster/cdk8s/agentplane/egress_credentials.py's STAGING_NAMESPACE/
    # TESTING_NAMESPACE), not the app namespace itself -- nothing there ever mounted
    # this Secret.
    - agentplane-staging-egress-credentials
    - agentplane-testing-egress-credentials
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      name: kubernetes-airlock-secret-store
      kind: ClusterSecretStore
    target:
      name: google-access-token
    dataFrom:
      - extract:
          key: google-access-token
