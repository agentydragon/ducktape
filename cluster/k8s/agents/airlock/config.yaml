backends:
  kubeapi_admin:
    url: http://kubeapi-admin-exec-mcp.airlock.svc.cluster.local:8766/mcp
  google_workspace_mcp:
    url: http://google-workspace-mcp.google-workspace-mcp.svc.cluster.local:8000/mcp

public_base_url: "https://airlock.allegedly.works"
oidc_issuer: "https://auth.allegedly.works/application/o/airlock/"
oidc_client_id: "airlock-operator"
predicate_path: "/etc/airlock/predicate.py"
port: 8765
default_wait_mode:
  mode: yield_after_ms
  timeout_ms: 30000

oauth:
  target_namespace: airlock
  managed_by: airlock
  providers:
    - name: oura
      provider_type: oauth2
      display_name: Oura Ring
      authorize_url: https://cloud.ouraring.com/oauth/authorize
      token_url: https://api.ouraring.com/oauth/token
      scopes:
        - email
        - personal
        - daily
        - heartrate
        - workout
        - tag
        - session
        - spo2
      # TODO(shared-callback): migrate to the shared /oauth/callback — register
      # https://airlock.allegedly.works/oauth/callback on the Oura OAuth app, then drop
      # this line. Until then the legacy /oauth/callback/<name> route serves it.
      redirect_uri: https://airlock.allegedly.works/oauth/callback/oura
      refresh_secret:
        name: oura-tokens
      access_secret:
        name: oura-access-token
      refresh_margin_seconds: 3600
    - name: google
      provider_type: oauth2
      display_name: Google
      authorize_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      scopes:
        - https://www.googleapis.com/auth/gmail.readonly
        - https://www.googleapis.com/auth/drive.readonly
        - https://www.googleapis.com/auth/drive.activity.readonly
        - https://www.googleapis.com/auth/calendar.readonly
        - https://www.googleapis.com/auth/tasks.readonly
        - https://www.googleapis.com/auth/contacts.readonly
        - https://www.googleapis.com/auth/documents.readonly
        - https://www.googleapis.com/auth/spreadsheets.readonly
        - https://www.googleapis.com/auth/presentations.readonly
        - https://www.googleapis.com/auth/youtube.readonly
      # TODO(shared-callback): migrate to the shared /oauth/callback — register
      # https://airlock.allegedly.works/oauth/callback on this Google OAuth client, then
      # drop this line.
      redirect_uri: https://airlock.allegedly.works/oauth/callback/google
      refresh_secret:
        name: google-tokens
      access_secret:
        name: google-access-token
      refresh_margin_seconds: 300
      extra_auth_params:
        access_type: offline
        prompt: consent
    # Separate Google grant for haku-console's in-process `gmail` + `google_calendar` MCP
    # servers (haku/console/tools/gmail.py, google_calendar.py): calendar event creation,
    # Gmail reads, thread label changes, draft creation, label CRUD — behind haku-console's
    # operator-approval queue. Kept distinct from `google` (read-only, Haku's) so no
    # other consumer's token is ever upgraded to this scope set. Its access token
    # (haku-console-google-access-token) is delivered ONLY to the haku-console
    # namespace. Carries the same read-only scopes as `google` too (not just the
    # write scopes the three tools need) so haku-console can read across the same
    # surface without a second grant/consent round-trip later.
    - name: haku_console_google
      provider_type: oauth2
      display_name: Google (haku-console — calendar + gmail, privileged)
      authorize_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      scopes:
        - https://www.googleapis.com/auth/calendar.events
        - https://www.googleapis.com/auth/gmail.modify
        - https://www.googleapis.com/auth/gmail.compose
        - https://www.googleapis.com/auth/gmail.readonly
        - https://www.googleapis.com/auth/drive.readonly
        - https://www.googleapis.com/auth/drive.activity.readonly
        - https://www.googleapis.com/auth/calendar.readonly
        - https://www.googleapis.com/auth/tasks.readonly
        - https://www.googleapis.com/auth/contacts.readonly
        - https://www.googleapis.com/auth/documents.readonly
        - https://www.googleapis.com/auth/spreadsheets.readonly
        - https://www.googleapis.com/auth/presentations.readonly
        - https://www.googleapis.com/auth/youtube.readonly
      # Piggyback on the `google` provider's already-registered redirect URI (same
      # OAuth client), so this needs NO new redirect URI in the Google console. The
      # callback resolves the provider from OAuth `state`, not this path.
      redirect_uri: https://airlock.allegedly.works/oauth/callback/google
      refresh_secret:
        name: haku-console-google-tokens
      access_secret:
        name: haku-console-google-access-token
      refresh_margin_seconds: 300
      extra_auth_params:
        access_type: offline
        prompt: consent
    - name: bsc
      provider_type: oauth2
      display_name: Blue Shield of California (FHIR sandbox)
      authorize_url: https://dev-ext.blueshieldca.com/as/authorization.oauth2
      token_url: https://dev-ext.blueshieldca.com/as/token.oauth2/
      use_pkce: true
      aud: https://api-dev.blueshieldca.com/bsc/fhir-sandbox/fhir-server/api/v4/cloud/
      # Scopes per https://dev-ext.blueshieldca.com/.well-known/openid-configuration:
      # PatientEOB (claims/reimbursements), PatientRead (everything else), interop
      # (catch-all per CMS rule), openid (ID token / fhirUser context).
      # BSC's PingFederate doesn't expose `offline_access` as a scope, but the
      # refresh_token grant is configured per-client and may still issue one.
      scopes:
        - openid
        - interop
        - PatientEOB
        - PatientRead
      # TODO(shared-callback): migrate to the shared /oauth/callback — register
      # https://airlock.allegedly.works/oauth/callback on the BSC OAuth app, then drop
      # this line. Until then the legacy /oauth/callback/<name> route serves it.
      redirect_uri: https://airlock.allegedly.works/oauth/callback/bsc
      refresh_secret:
        name: bsc-tokens
      access_secret:
        name: bsc-access-token
      refresh_margin_seconds: 300
