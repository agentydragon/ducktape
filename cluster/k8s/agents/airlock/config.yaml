public_base_url: "https://airlock.allegedly.works"
oidc_issuer: "https://auth.allegedly.works/application/o/airlock-server/"
port: 8765

oauth:
  target_namespace: airlock
  managed_by: airlock
  providers:
    - name: oura
      provider_type: oauth2
      display_name: Oura Ring
      authorize_url: https://cloud.ouraring.com/oauth/authorize
      token_url: https://api.ouraring.com/oauth/token
      scopes:
        - email
        - personal
        - daily
        - heartrate
        - workout
        - tag
        - session
        - spo2
      # TODO(shared-callback): migrate to the shared /oauth/callback — register
      # https://airlock.allegedly.works/oauth/callback on the Oura OAuth app, then drop
      # this line. Until then the legacy /oauth/callback/<name> route serves it.
      redirect_uri: https://airlock.allegedly.works/oauth/callback/oura
      refresh_secret:
        name: oura-tokens
      access_secret:
        name: oura-access-token
      refresh_margin_seconds: 3600
    - name: google
      provider_type: oauth2
      display_name: Google
      authorize_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      scopes:
        - https://www.googleapis.com/auth/gmail.readonly
        - https://www.googleapis.com/auth/drive.readonly
        - https://www.googleapis.com/auth/drive.activity.readonly
        - https://www.googleapis.com/auth/calendar.readonly
        - https://www.googleapis.com/auth/tasks.readonly
        - https://www.googleapis.com/auth/contacts.readonly
        - https://www.googleapis.com/auth/documents.readonly
        - https://www.googleapis.com/auth/spreadsheets.readonly
        - https://www.googleapis.com/auth/presentations.readonly
        - https://www.googleapis.com/auth/youtube.readonly
      # TODO(shared-callback): migrate to the shared /oauth/callback — register
      # https://airlock.allegedly.works/oauth/callback on this Google OAuth client, then
      # drop this line.
      redirect_uri: https://airlock.allegedly.works/oauth/callback/google
      refresh_secret:
        name: google-tokens
      access_secret:
        name: google-access-token
      refresh_margin_seconds: 300
      extra_auth_params:
        access_type: offline
        prompt: consent
    # A separate provider, not a widened `google` grant: the `google` access token above is
    # what agentplane's egress proxies present on sandboxes' Google reads (see
    # google-access-token-eso.yaml), so adding write scopes to that same token would hand
    # write-capable Gmail/Calendar to every holder of it. This provider's token is instead mirrored only into the google-mcp namespace
    # (google-write-access-token-eso.yaml), which fronts it behind an approval-gated MCP server
    # (x/google_mcp_server) -- see plans/personal_agents/personal_data_agent.md and
    # docs/personal_agents/verdicts.md for why that boundary matters. Scopes match what
    # haku-console's own google_mail/google_calendar connections already use
    # (cluster/cdk8s/haku/console_config.py). Reuses the same Google OAuth client as `google`
    # above (see deployment.yaml's GOOGLE_WRITE_CLIENT_ID/SECRET) -- scope is a per-authorize-flow
    # parameter, not fixed to the client registration, so this needs no second hand-created GCP
    # OAuth client; the GCP Console consent screen must have these scopes registered before this
    # provider's one-time consent flow can complete.
    - name: google-write
      provider_type: oauth2
      display_name: Google (write access)
      authorize_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      scopes:
        - https://www.googleapis.com/auth/gmail.modify
        - https://www.googleapis.com/auth/gmail.compose
        - https://www.googleapis.com/auth/gmail.settings.basic
        - https://www.googleapis.com/auth/calendar.events
      redirect_uri: https://airlock.allegedly.works/oauth/callback/google-write
      refresh_secret:
        name: google-write-tokens
      access_secret:
        name: google-write-access-token
      refresh_margin_seconds: 300
      extra_auth_params:
        access_type: offline
        prompt: consent
    - name: bsc
      provider_type: oauth2
      display_name: Blue Shield of California (FHIR sandbox)
      authorize_url: https://dev-ext.blueshieldca.com/as/authorization.oauth2
      token_url: https://dev-ext.blueshieldca.com/as/token.oauth2/
      use_pkce: true
      aud: https://api-dev.blueshieldca.com/bsc/fhir-sandbox/fhir-server/api/v4/cloud/
      # Scopes per https://dev-ext.blueshieldca.com/.well-known/openid-configuration:
      # PatientEOB (claims/reimbursements), PatientRead (everything else), interop
      # (catch-all per CMS rule), openid (ID token / fhirUser context).
      # BSC's PingFederate doesn't expose `offline_access` as a scope, but the
      # refresh_token grant is configured per-client and may still issue one.
      scopes:
        - openid
        - interop
        - PatientEOB
        - PatientRead
      # TODO(shared-callback): migrate to the shared /oauth/callback — register
      # https://airlock.allegedly.works/oauth/callback on the BSC OAuth app, then drop
      # this line. Until then the legacy /oauth/callback/<name> route serves it.
      redirect_uri: https://airlock.allegedly.works/oauth/callback/bsc
      refresh_secret:
        name: bsc-tokens
      access_secret:
        name: bsc-access-token
      refresh_margin_seconds: 300
