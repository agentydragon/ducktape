backends:
  kubeapi_admin:
    url: http://kubeapi-admin-exec-mcp.airlock.svc.cluster.local:8766/mcp
  google_workspace_mcp:
    url: http://google-workspace-mcp.google-workspace-mcp.svc.cluster.local:8000/mcp

public_base_url: "https://airlock.allegedly.works"
oidc_issuer: "https://auth.allegedly.works/application/o/airlock/"
oidc_client_id: "airlock-operator"
predicate_path: "/etc/airlock/predicate.py"
port: 8765
default_wait_mode:
  mode: yield_after_ms
  timeout_ms: 30000

oauth:
  target_namespace: airlock
  managed_by: airlock
  providers:
    - name: oura
      provider_type: oauth2
      display_name: Oura Ring
      authorize_url: https://cloud.ouraring.com/oauth/authorize
      token_url: https://api.ouraring.com/oauth/token
      scopes:
        - email
        - personal
        - daily
        - heartrate
        - workout
        - tag
        - session
        - spo2
      redirect_uri: https://airlock.allegedly.works/oauth/callback/oura
      refresh_secret:
        name: oura-tokens
      access_secret:
        name: oura-access-token
      refresh_margin_seconds: 3600
    - name: google
      provider_type: oauth2
      display_name: Google
      authorize_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      scopes:
        - https://www.googleapis.com/auth/gmail.readonly
        - https://www.googleapis.com/auth/drive.readonly
        - https://www.googleapis.com/auth/drive.activity.readonly
        - https://www.googleapis.com/auth/calendar.readonly
        - https://www.googleapis.com/auth/tasks.readonly
        - https://www.googleapis.com/auth/contacts.readonly
        - https://www.googleapis.com/auth/documents.readonly
        - https://www.googleapis.com/auth/spreadsheets.readonly
        - https://www.googleapis.com/auth/presentations.readonly
        - https://www.googleapis.com/auth/youtube.readonly
      redirect_uri: https://airlock.allegedly.works/oauth/callback/google
      refresh_secret:
        name: google-tokens
      access_secret:
        name: google-access-token
      refresh_margin_seconds: 300
      extra_auth_params:
        access_type: offline
        prompt: consent
    - name: bsc
      provider_type: oauth2
      display_name: Blue Shield of California (FHIR sandbox)
      authorize_url: https://dev-ext.blueshieldca.com/as/authorization.oauth2
      token_url: https://dev-ext.blueshieldca.com/as/token.oauth2/
      use_pkce: true
      aud: https://api-dev.blueshieldca.com/bsc/fhir-sandbox/fhir-server/api/v4/cloud/
      # Scopes per https://dev-ext.blueshieldca.com/.well-known/openid-configuration:
      # PatientEOB (claims/reimbursements), PatientRead (everything else), interop
      # (catch-all per CMS rule), openid (ID token / fhirUser context).
      # BSC's PingFederate doesn't expose `offline_access` as a scope, but the
      # refresh_token grant is configured per-client and may still issue one.
      scopes:
        - openid
        - interop
        - PatientEOB
        - PatientRead
      redirect_uri: https://airlock.allegedly.works/oauth/callback/bsc
      refresh_secret:
        name: bsc-tokens
      access_secret:
        name: bsc-access-token
      refresh_margin_seconds: 300
