# Airlock serves only its browser OAuth broker over port 8765.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: airlock-ingress
  namespace: airlock
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: airlock
      app.kubernetes.io/component: server
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
    # Kubelet liveness/readiness probes originate from the node host.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
