# Airlock's session-signing key is app-local. A key rotation invalidates existing
# browser sessions but does not need to update Authentik or another credential store.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: airlock-session-secret
  namespace: airlock
spec:
  allowRepeat: true
  digits: 16
  length: 64
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airlock-session-secret
  namespace: airlock
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: airlock-session-secret
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Orphan
    immutable: true
    name: airlock-session-secret
    template:
      data:
        session-secret: "{{ .password }}"
      type: Opaque
