apiVersion: apps/v1
kind: Deployment
metadata:
  name: airlock
  namespace: airlock
  labels:
    app.kubernetes.io/name: airlock
    app.kubernetes.io/component: server
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airlock
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airlock
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: airlock
      securityContext:
        fsGroup: 1000
      containers:
        - name: airlock
          image: ghcr.io/agentydragon/airlock:devel-20260515210919-a51187a # {"$imagepolicy": "flux-system:airlock"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: "/etc/airlock/config.yaml"
            - name: EXEC_BACKEND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: exec-backend-token
                  key: password
            - name: OURA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oura-client-credentials
                  key: client_id
            - name: OURA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oura-client-credentials
                  key: client_secret
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-client-credentials
                  key: client_id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-client-credentials
                  key: client_secret
            - name: OIDC_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: airlock-oidc-proxy-credentials
                  key: client_id
            - name: OIDC_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: airlock-oidc-proxy-credentials
                  key: client_secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: airlock-db-app
                  key: uri
            - name: FASTMCP_HOME
              # OIDC token cache for the OIDCProxy sidecar. Tokens are lost on pod
              # restart (users must re-authenticate via PKCE), which is acceptable.
              value: "/data/fastmcp"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/airlock
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: airlock-config
