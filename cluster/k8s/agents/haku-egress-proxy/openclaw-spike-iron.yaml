dns:
  enabled: false

proxy:
  tunnel_listen: ":8181"
  # Forgejo generates a full-history Git pack before returning response
  # headers. The default 30s cap aborts that request with HTTP 502, while
  # shallow fetches finish in time. Keep a bounded but practical limit.
  upstream_response_header_timeout: "5m"

tls:
  mode: "mitm"
  ca_cert: "/ca/tls.crt"
  ca_key: "/ca/tls.key"

transforms:
  - name: allowlist
    config:
      domains:
        - "api.anthropic.com"
        - "haku.allegedly.works"
        # The kube-apiserver, via the terminate+re-encrypt Gateway route.
        # NOT api.allegedly.works: that route is TLS passthrough to the
        # apiserver's cluster-CA cert, which this MITM proxy cannot validate
        # on the upstream leg. kubeapi.allegedly.works terminates the public
        # LE wildcard at the Gateway and was added for exactly this class of
        # caller -- see cluster/k8s/kube-api-proxy/README.md.
        - "kubeapi.allegedly.works"
        - "forgejo-http.forgejo"
        - "pypi.org"
        - "files.pythonhosted.org"
        - "registry.npmjs.org"
        - "cache.nixos.org"
        - "nixos.org"
        - "channels.nixos.org"
        - "releases.bazel.build"
        - "bcr.bazel.build"
        - "api.github.com"
        - "github.com"
        - "codeload.github.com"
        - "objects.githubusercontent.com"
        - "release-assets.githubusercontent.com"
        - "raw.githubusercontent.com"
        - "ftp.gnu.org"
        - "static.rust-lang.org"
        - "index.crates.io"
        - "static.crates.io"
        - "nodejs.org"
        - "snapshot.debian.org"
        - "code.forgejo.org"
        - "data.forgejo.org"
        - "ghcr.io"
        - "pkg-containers.githubusercontent.com"
  - name: secrets
    config:
      secrets:
        - source:
            type: env
            var: CLAUDE_CODE_OAUTH_TOKEN
          replace:
            proxy_value: "sk-ant-oat01-proxy-haku-openclaw-placeholder"
            match_headers: ["Authorization"]
          rules:
            - host: "api.anthropic.com"
        - source:
            type: env
            var: HAKU_GIT_PASSWORD
          replace:
            # iron-proxy also substitutes the placeholder inside base64 Basic
            # authorization, which is how git-over-HTTP carries this password.
            proxy_value: "proxy-haku-forgejo-placeholder"
            match_headers: ["Authorization"]
          rules:
            - host: "forgejo-http.forgejo"
        - source:
            type: env
            var: HAKU_CONSOLE_TOKEN
          replace:
            proxy_value: "proxy-haku-console-placeholder"
            match_headers: ["Authorization"]
          rules:
            - host: "haku.allegedly.works"
        - source:
            type: env
            var: GITHUB_TOKEN
          replace:
            # The placeholder may appear as a Bearer token for API requests or
            # inside base64 Basic auth for Git over HTTPS.
            proxy_value: "proxy-github-placeholder"
            match_headers: ["Authorization"]
          rules:
            - host: "api.github.com"
            - host: "github.com"
            - host: "codeload.github.com"
        - source:
            type: env
            var: HAKU_KUBE_JWT
          replace:
            # An Authentik client_credentials JWT for the `haku` k8s group,
            # minted and rotated by agents/authentik-jwt-rotation. The apiserver
            # derives oidc-ksbx-groups:haku from it, so what this runtime may do
            # in the cluster is RBAC on that group -- this proxy only delivers
            # the bearer, it cannot tell `get pods` from `delete ns`.
            proxy_value: "proxy-haku-kube-placeholder"
            match_headers: ["Authorization"]
          rules:
            - host: "kubeapi.allegedly.works"

log:
  level: "info"
