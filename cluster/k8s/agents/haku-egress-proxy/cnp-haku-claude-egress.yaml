# The credential-holding Claude proxy can resolve DNS and connect only to the exact hosts
# for which an Authorization substitution is defined, plus the githubusercontent hosts a
# GitHub clone redirects to. Those redirect targets deliberately get **no** substitution
# rule: they serve pre-signed URLs, so an Authorization header is unnecessary there and
# sending the PAT to them would widen where the credential travels for no gain.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-haku-claude-oauth-proxy-egress
  namespace: haku-egress-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haku-claude-oauth-proxy
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: api.anthropic.com
              - matchName: api.github.com
              - matchName: codeload.github.com
              - matchName: github.com
              - matchName: objects.githubusercontent.com
              - matchName: raw.githubusercontent.com
              - matchName: release-assets.githubusercontent.com
    - toFQDNs:
        - matchName: api.anthropic.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: github.com
        - matchName: objects.githubusercontent.com
        - matchName: raw.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
