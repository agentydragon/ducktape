# The credential-holding Claude proxy can resolve DNS and connect only to the exact hosts
# for which an Authorization substitution is defined, plus the githubusercontent hosts a
# GitHub clone redirects to. Those redirect targets deliberately get **no** substitution
# rule: they serve pre-signed URLs, so an Authorization header is unnecessary there and
# sending the PAT to them would widen where the credential travels for no gain.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-haku-claude-oauth-proxy-egress
  namespace: haku-egress-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haku-claude-oauth-proxy
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: api.anthropic.com
              - matchName: api.github.com
              - matchName: codeload.github.com
              - matchName: github.com
              - matchName: objects.githubusercontent.com
              - matchName: raw.githubusercontent.com
              - matchName: release-assets.githubusercontent.com
              # aiquota's read API, for which a substitution rule is defined below
              # (claude-iron.yaml). Its bearer is held here, never in the sandbox.
              - matchName: aiquota.allegedly.works
              # ActivityWatch read API, likewise substitution-ruled below. Read-only
              # bearer held here, never in the sandbox.
              - matchName: activitywatch-read.allegedly.works
    - toFQDNs:
        - matchName: api.anthropic.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: github.com
        - matchName: objects.githubusercontent.com
        - matchName: raw.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
        # aiquota: listed to match the egress-allowlist pin convention
        # (cluster/validation/test_egress_allowlists.py). The toFQDNs entry itself
        # enforces nothing — aiquota resolves to node IPs toFQDNs can't select — the
        # toEntities rule below admits the connection and the DNS rule above fences
        # the name, exactly as alloy-otlp / haku-mailbox are handled elsewhere.
        - matchName: aiquota.allegedly.works
        # activitywatch-read: same node-IP *.allegedly.works case as aiquota — listed
        # for the pin convention; the toEntities rule admits and the DNS rule fences.
        - matchName: activitywatch-read.allegedly.works
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # aiquota.allegedly.works resolves to the OVH nodes' ExternalIPs (Envoy binds
    # 443 there in hostNetwork mode), which carry reserved:remote-node — or
    # reserved:host when this pod happens to share a node, since it has no
    # nodeSelector. A toFQDNs rule cannot reach them: policy-cidr-match-mode is
    # unset cluster-wide, so its CIDR-derived selectors never match node IPs. The
    # DNS allowlist above still bounds which names resolve; this reaches the
    # in-cluster public gateway the resolved name points at. See
    # ../../../docs/cilium_network_policy.md and the public-coder proxy cnp-egress.
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
