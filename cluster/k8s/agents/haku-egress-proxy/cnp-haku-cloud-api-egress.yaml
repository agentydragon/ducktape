# Allow the haku-egress-proxy egress to the external endpoints Haku workloads need.
# Additive with the operator's default-deny NetworkPolicy.
#
# The registry FQDNs (ghcr.io, *.githubusercontent.com, Docker Hub) cover
# image-related pod egress; Gmail/Calendar reach Google's APIs; the Managed
# Agents self-hosted worker (haku/runtime/managed_agent/self_hosted) reaches Anthropic's work
# queue at api.anthropic.com. Plaid Postgres is reached cluster-internally (not
# via this proxy) — see the `toEntities: cluster` rule in ccnp-haku-proxy-egress.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-haku-cloud-api-egress
  namespace: haku-egress-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haku-egress-proxy
  egress:
    # Cilium FQDN egress rules need the proxy pod to query CoreDNS first.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        # Container image registries (base-image + tooling pulls: dind base images,
        # ghcr tools).
        # TODO(pull-through-cache): these OCI-registry hosts can leave this allowlist
        #   entirely once an in-cluster pull-through mirror exists again — the mirror
        #   fetches from origin under ITS own egress and dind points at it via
        #   `--registry-mirror`, so the runner/proxy no longer needs Docker Hub / ghcr
        #   here. (This re-homes the `haku-ci-pull-through-cache` TODO deleted with
        #   haku-ci/networkpolicy.yaml; tracked in cluster/docs/plan.md. registry:2 is
        #   single-upstream, so Docker Hub and ghcr need one proxy each — or Harbor
        #   proxy-cache projects, once Harbor is back.)
        - matchName: ghcr.io
        - matchName: pkg-containers.githubusercontent.com
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudflare.docker.com
        # Docker Hub 307-redirects blob/config GETs to BOTH cloudFLARE and
        # cloudFRONT fronts — both required (the easily-confused pair; missing
        # cloudfront makes blob pulls dial-timeout with "No such image").
        - matchName: production.cloudfront.docker.com
        - matchName: index.docker.io
        - matchName: gmail.googleapis.com
        - matchName: www.googleapis.com
        # Google Tasks API — Haku reads the operator's task list (the Tasks
        # playbook). www.googleapis.com covers Calendar/Drive; Tasks is on its
        # own host. (A 403 here is a token-scope gap, not this allowlist — but
        # the host must still be reachable once the scope is granted.)
        - matchName: tasks.googleapis.com
        # Haku mailbox read API (bearer-gated, read-only; see haku/mailbox/README.md)
        # so sandbox pods can poll inbound operator mail.
        - matchName: haku-mailbox.allegedly.works
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Package registries for ad-hoc tooling installs inside sandbox pods
    # (e.g. `pip install fastmcp`, `npx <mcp-server>`). PyPI: `pypi.org`
    # (index/metadata) + `files.pythonhosted.org` (wheels/sdists); npm:
    # `registry.npmjs.org`.
    # Note: unlike the OCI registries above, the egress proxy's HTTP cache (Squid,
    # deferred proxy-config PR) speeds up REPEAT fetches of these but does NOT let them
    # leave the allowlist — the proxy still fetches from origin. Dropping them needs a
    # dedicated pull-through mirror with its own egress (devpi/bandersnatch for PyPI,
    # Verdaccio for npm). Lower priority than the OCI mirror; TODO(pull-through-cache).
    - toFQDNs:
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
        - matchName: registry.npmjs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Nix binary cache + channels — so Haku runtimes that install/refresh their
    # Nix closure (e.g. the agent-haku devtools/fastmcp install) hit the public
    # cache instead of building from source. cache.nixos.org serves nars;
    # nixos.org redirects channel/installer fetches.
    # TODO(pull-through-cache): cache.nixos.org can leave this allowlist once clients
    #   use the cluster's own nix cache (cache.allegedly.works) as an upstream
    #   substituter — that cache reaches nixos.org under its own egress. (nixos.org /
    #   channels.nixos.org are redirect/channel fetches, not nar content, so they'd
    #   still be needed unless the pin is fully flake-locked.)
    - toFQDNs:
        - matchName: cache.nixos.org
        - matchName: nixos.org
        - matchName: channels.nixos.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Bazel registry + release artifacts, GitHub source/release archives, and the
    # Node.js toolchain — the haku-ci Bazel cold-fetch closure (NO RBE). Added ahead
    # of the haku-ci rehoming (next PR) so the proxy allowlist is ready when the
    # runner starts egressing through it.
    - toFQDNs:
        - matchName: releases.bazel.build
        - matchName: bcr.bazel.build
        - matchName: github.com
        - matchName: codeload.github.com
        - matchName: objects.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
        - matchName: raw.githubusercontent.com
        - matchName: nodejs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Forgejo Actions: `uses:` actions from data.forgejo.org, act_runner +
    # job-container images from code.forgejo.org.
    - toFQDNs:
        - matchName: code.forgejo.org
        - matchName: data.forgejo.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Managed Agents self-hosted worker (haku/runtime/managed_agent/self_hosted) long-polls
    # Anthropic's work queue via `ant beta:worker poll`.
    - toFQDNs:
        - matchName: api.anthropic.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Allow forwarding to any in-cluster Service. Sandbox workloads keep
    # mitmproxy in-path even when targeting cluster endpoints; NO_PROXY in the
    # inject policy still permits explicit bypass for Service FQDNs that already
    # match (`*.svc.cluster.local` and `10.0.0.0/8`).
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "11434"
              protocol: TCP
