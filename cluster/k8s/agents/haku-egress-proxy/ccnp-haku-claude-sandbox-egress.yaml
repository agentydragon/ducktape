# Console-owned Claude runners are isolated from Haku's general sandbox namespace.
# They can reach Haku Console's runner bridge, the OAuth-substituting proxy, the in-cluster
# Forgejo they check haku-state out of, and the apiserver their ServiceAccount is bound
# against — but have no direct internet, general cluster access, or general-purpose proxy.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: haku-claude-sandbox-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: In
        values:
          - haku-claude-sandbox
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
            k8s:app.kubernetes.io/name: haku-console
      toPorts:
        # Cilium evaluates the destination endpoint after Service translation.
        # haku-console Service port 9090 targets the API container's `api` port 8080.
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-egress-proxy
            k8s:app.kubernetes.io/name: haku-claude-oauth-proxy
      toPorts:
        - ports:
            - port: "8180"
              protocol: TCP
    # kubectl. Haku's runtime already treats local kubectl as approval-free, because the
    # apiserver's RBAC *is* the boundary — so the grant is haku-sandbox-admin, shared with the
    # haku SA on one binding (cluster/k8s/haku/rbac/rolebinding-haku.yaml), and this is only the
    # route to it. Deliberately not `toEntities: cluster`: reaching the API is not the same as
    # reaching everything in the cluster, and the named destinations here stay the whole of it.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # haku-state, so the session starts with Haku's manual rather than an empty workspace.
    # In-cluster and plaintext, the way the haku-sandbox exec target already clones it — so no
    # credential passes through the OAuth-substituting proxy, which knows one host and one
    # header and has no business rewriting git auth. The runner writes the same haku Forgejo
    # account into ~/.netrc; a public git.allegedly.works route is deliberately NOT opened,
    # since it would hairpin out through the Gateway for a service one hop away.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo
            k8s:app.kubernetes.io/name: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
