# Console-owned Haku Agent runners are isolated from Haku's general sandbox namespace.
# They can reach Haku Console's runner-protocol endpoint, the OAuth-substituting proxy, the in-cluster
# Forgejo they check haku-state out of, and the Console's authorization proxy — but
# have no direct internet, general cluster access, or general-purpose proxy.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: haku-agent-runner-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haku-harness-runner
      haku.allegedly.works/access-profile-id: haku
    matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: In
        values:
          - haku-runtime-sandbox
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
            k8s:app.kubernetes.io/name: haku-console
      toPorts:
        # Cilium evaluates the destination endpoint after Service translation.
        # haku-console Service port 9090 targets the API container's `api` port 8080.
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-egress-proxy
            k8s:app.kubernetes.io/name: haku-claude-oauth-proxy
      toPorts:
        - ports:
            - port: "8180"
              protocol: TCP
    # Colocated Console egress fence (#4670): the runner's HTTPS_PROXY now points here
    # (haku-egress-proxy.haku-console.svc:8888), carrying its inference to the in-cluster LiteLLM
    # gateway and its GitHub traffic. The sidecar shares the Console pod's network namespace, so it
    # is selected by the Console pod label on the proxy's container port. The haku-claude-oauth-proxy
    # rule above stays until that iron proxy retires, so reverting the runner's proxy needs no policy
    # change.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
            k8s:app.kubernetes.io/name: haku-console
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
    # Kubernetes access is mediated by the Haku Console authorization proxy. The runner writes
    # an ephemeral tokenFile kubeconfig only when Console selects this route; no ServiceAccount
    # token is mounted in the runner pod and there is no direct apiserver path. The proxy's TLS
    # listener, because kubectl sends credentials only to an https server.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
            k8s:app.kubernetes.io/name: haku-kube-api-proxy
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # haku-state, so the session starts with Haku's manual rather than an empty workspace.
    # In-cluster and plaintext, the way the haku-sandbox exec target already clones it — so no
    # credential passes through the OAuth-substituting proxy, which knows one host and one
    # header and has no business rewriting git auth. The runner writes the same haku Forgejo
    # account into ~/.netrc; a public git.allegedly.works route is deliberately NOT opened,
    # since it would hairpin out through the Gateway for a service one hop away.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo
            k8s:app.kubernetes.io/name: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
