apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-haku-claude-oauth-proxy-ingress
  namespace: haku-egress-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: haku-claude-oauth-proxy
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haku-claude-sandbox
      ports:
        - port: 8180
          protocol: TCP
  policyTypes:
    - Ingress
