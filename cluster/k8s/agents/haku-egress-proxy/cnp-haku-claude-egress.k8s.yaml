apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-haku-claude-oauth-proxy-egress
  namespace: haku-egress-proxy
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: activitywatch-read.allegedly.works
              - matchName: aiquota.allegedly.works
              - matchName: api.anthropic.com
              - matchName: api.github.com
              - matchName: codeload.github.com
              - matchName: github.com
              - matchName: objects.githubusercontent.com
              - matchName: raw.githubusercontent.com
              - matchName: release-assets.githubusercontent.com
    - toFQDNs:
        - matchName: api.anthropic.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: github.com
        - matchName: objects.githubusercontent.com
        - matchName: raw.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
        - matchName: aiquota.allegedly.works
        - matchName: activitywatch-read.allegedly.works
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haku-claude-oauth-proxy
