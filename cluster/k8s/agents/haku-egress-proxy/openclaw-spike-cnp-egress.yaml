apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-haku-openclaw-spike-proxy-egress
  namespace: haku-egress-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haku-openclaw-spike-proxy
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Public HTTPS is still application-layer allowlisted by iron-proxy. Include
    # remote-node/host because allegedly.works is served from node ExternalIPs,
    # which Cilium does not classify as world.
    #
    # This is the whole L3/L4 story for this proxy: it may open 443 to anything.
    # Confinement lives entirely in openclaw-spike-iron.yaml's `allowlist`
    # transform, so this fence is single-layer. A toFQDNs list here would add a
    # second layer for true-world hosts but could not express
    # haku.allegedly.works (node identity, see cluster/docs/cilium_network_policy.md),
    # which is why the rule is written this way rather than as an allowlist.
    - toEntities:
        - world
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo
            k8s:app.kubernetes.io/name: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
