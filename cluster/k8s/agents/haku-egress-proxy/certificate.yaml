apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: haku-egress-proxy-root-ca
  namespace: haku-egress-proxy
spec:
  isCA: true
  commonName: haku-egress-proxy-root-ca
  secretName: haku-egress-proxy-ca
  duration: 87600h # 10 years
  renewBefore: 8760h # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      # haku-console: the colocated egress proxy sidecar (#4942) intercepts with this same shared
      # CA, so fenced sandboxes — which already trust it via haku-egress-proxy-ca-cert — trust the
      # colocated listener too. When the iron/mitmproxy fence retires (#4670 end state) this CA's
      # ownership moves out of this directory with it.
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: cert-manager,haku-console
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: cert-manager,haku-console
  issuerRef:
    name: cluster-ca-bootstrap
    kind: ClusterIssuer
