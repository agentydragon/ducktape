apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-egress-proxy
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/agents/haku-egress-proxy
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 5m
  dependsOn:
    - name: haku-egress-proxy-namespace
      namespace: ducktape-flux
    - name: haku-runtime-namespace
      namespace: ducktape-flux
    - name: haku-openclaw-spike-namespace
      namespace: ducktape-flux
    - name: haku-state # proxy-held Forgejo and Haku Console credentials
      namespace: ducktape-flux
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: cert-manager-trust
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
