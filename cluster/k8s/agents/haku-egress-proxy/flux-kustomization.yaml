apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-egress-proxy
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agents/haku-egress-proxy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  dependsOn:
    - name: haku-egress-proxy-namespace
    - name: haku-claude-namespace
    - name: haku-openclaw-spike-namespace
      namespace: ducktape-flux
    - name: haku-state # proxy-held Forgejo and Haku Console credentials
    - name: cert-manager-environment
    - name: cert-manager-trust
    - name: reflector
    - name: external-secrets-config
    - name: forgejo-images
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
