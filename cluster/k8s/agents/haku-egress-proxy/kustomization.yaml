apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate.yaml
  - trust-bundle.yaml
  - deployment.yaml
  - service.yaml
  - claude-iron-deployment.yaml
  - claude-iron-service.yaml
  - claude-networkpolicy.yaml
  - claude-code-oauth-token.sops.yaml
  - claude-github-token-eso.yaml
  - openclaw-spike-github-token-eso.yaml
  - openclaw-spike-iron-deployment.yaml
  - openclaw-spike-iron-service.yaml
  - openclaw-spike-networkpolicy.yaml
  - openclaw-spike-cnp-egress.yaml
  - openclaw-spike-kube-token-probe-rbac.yaml
  # Step two of a deliberate two-step, now complete. authentik-jwt-rotation
  # landed openclaw-spike-kube-token.sops.yaml in 2bb0c7fbd (rotations.yaml:
  # haku-k8s-openclaw), so listing it is safe. Holding it back was not an
  # oversight: listing the file before the rotator's first run breaks
  # `kustomize build` for this whole namespace, which is the sole egress path
  # for the spike. But nothing triggered step two, and the gap is silent --
  # without this line the Secret is never applied, HAKU_KUBE_JWT stays unset
  # (it is an optional secretKeyRef), iron-proxy has nothing to substitute, and
  # kubectl reaches the apiserver carrying the literal placeholder and 401s.
  - openclaw-spike-kube-token.sops.yaml
  - networkpolicy.yaml
  - cnp-haku-cloud-api-egress.yaml
  - cnp-haku-claude-egress.yaml
  - ccnp-haku-proxy-egress.yaml
  - ccnp-haku-claude-sandbox-egress.yaml

configMapGenerator:
  - name: haku-claude-oauth-proxy-config
    namespace: haku-egress-proxy
    files:
      - iron.yaml=claude-iron.yaml
  - name: haku-openclaw-spike-proxy-config
    namespace: haku-egress-proxy
    files:
      - iron.yaml=openclaw-spike-iron.yaml

patches:
  # The encrypted object was moved byte-for-byte from the compatibility spike so no plaintext
  # credential is needed during this refactor. Kustomize can relocate its plaintext metadata;
  # Flux decrypts the value only after the rendered manifest is built.
  - target:
      kind: Secret
      name: haku-agent-sdk-oauth-token
    patch: |-
      - op: replace
        path: /metadata/name
        value: haku-claude-oauth-token
      - op: replace
        path: /metadata/namespace
        value: haku-egress-proxy
