---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    description: Lets the authentik-jwt-rotation CronJob read back the one Secret it publishes here, so its probe can verify the live token against kubeapi.allegedly.works. Nothing else in this namespace is readable.
  name: authentik-jwt-rotation-published-secrets-reader
  namespace: haku-egress-proxy
rules:
  - apiGroups:
      - ""
    resourceNames:
      - haku-openclaw-spike-kube-token
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-jwt-rotation-published-secrets-reader
  namespace: haku-egress-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-jwt-rotation-published-secrets-reader
subjects:
  - kind: ServiceAccount
    name: authentik-jwt-rotation
    namespace: agents-infra
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: haku-sandbox-force-proxy-egress
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - cluster
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: haku-egress-proxy
            k8s:io.kubernetes.pod.namespace: haku-egress-proxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: haku-console
            k8s:io.kubernetes.pod.namespace: haku-console
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - haku-sandbox
