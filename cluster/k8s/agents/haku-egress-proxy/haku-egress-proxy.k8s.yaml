apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: auto
    name: haku-egress-proxy
  name: haku-egress-proxy
spec: {}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: haku-egress-proxy
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: haku-egress-proxy-root-ca
  namespace: haku-egress-proxy
spec:
  commonName: haku-egress-proxy-root-ca
  duration: 87600h
  isCA: true
  issuerRef:
    kind: ClusterIssuer
    name: cluster-ca-bootstrap
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 8760h
  secretName: haku-egress-proxy-ca
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: cert-manager
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: cert-manager
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: haku-egress-proxy-ca-cert
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        key: ca.crt
        name: cluster-root-ca-secret
    - secret:
        key: tls.crt
        name: haku-egress-proxy-ca
  target:
    configMap:
      key: ca-certificates.crt
      metadata:
        annotations:
          description: Trust bundle for haku-egress-proxy-inspected sandbox HTTPS traffic
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - haku-sandbox
            - haku-ci
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: haku-egress-proxy
  name: haku-egress-proxy
  namespace: haku-egress-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-egress-proxy
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: haku-egress-proxy
                topologyKey: kubernetes.io/hostname
              weight: 100
      automountServiceAccountToken: false
      containers:
        - command:
            - mitmdump
            - --listen-host
            - 0.0.0.0
            - --listen-port
            - "8080"
            - --set
            - confdir=/mitmproxy-data
            - --set
            - stream_large_bodies=1m
            - --ignore-hosts
            - api\.anthropic\.com
          image: mitmproxy/mitmproxy:12.2.3
          name: mitmproxy
          ports:
            - containerPort: 8080
              name: proxy
              protocol: TCP
          readinessProbe:
            periodSeconds: 5
            tcpSocket:
              port: proxy
          resources:
            limits:
              cpu: 500m
              memory: 3Gi
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            - mountPath: /mitmproxy-data
              name: mitmproxy-data
      initContainers:
        - command:
            - sh
            - -c
            - |
              cat /mitmproxy-ca/tls.key /mitmproxy-ca/tls.crt > /mitmproxy-data/mitmproxy-ca.pem
              cp /mitmproxy-ca/tls.crt /mitmproxy-data/mitmproxy-ca-cert.pem
          image: busybox:1.38
          name: mitmproxy-ca-init
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - mountPath: /mitmproxy-ca
              name: mitmproxy-ca
              readOnly: true
            - mountPath: /mitmproxy-data
              name: mitmproxy-data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: mitmproxy-ca
          secret:
            secretName: haku-egress-proxy-ca
        - emptyDir: {}
          name: mitmproxy-data
---
apiVersion: v1
kind: Service
metadata:
  name: haku-egress-proxy
  namespace: haku-egress-proxy
spec:
  ports:
    - name: proxy
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: haku-egress-proxy
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: haku-egress-proxy
  namespace: haku-egress-proxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-egress-proxy
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-authentik-egress-proxy-ingress
  namespace: haku-egress-proxy
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haku-sandbox
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haku-ci
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - port: 8081
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: haku-egress-proxy
  policyTypes:
    - Ingress
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: haku-sandbox-force-proxy-egress
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - cluster
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: haku-egress-proxy
            k8s:io.kubernetes.pod.namespace: haku-egress-proxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - haku-sandbox
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
