# Dedicated Claude Code egress proxy. This application config is mounted through
# configMapGenerator; it is not a Kubernetes manifest (kubeconform-excluded,
# cluster-manifest-ignored). The sandbox receives only the token-shaped placeholder;
# the real subscription OAuth token exists only in this trusted pod.
dns:
  enabled: false

proxy:
  tunnel_listen: ":8180"

tls:
  mode: "mitm"
  ca_cert: "/ca/tls.crt"
  ca_key: "/ca/tls.key"

transforms:
  - name: secrets
    config:
      secrets:
        - source:
            type: env
            var: CLAUDE_CODE_OAUTH_TOKEN
          replace:
            proxy_value: "sk-ant-oat01-placeholder"
            match_headers: ["Authorization"]
          rules:
            - host: "api.anthropic.com"
        - source:
            type: env
            var: GITHUB_TOKEN
          replace:
            # The placeholder may appear as a Bearer token for API requests or
            # inside base64 Basic auth for Git over HTTPS — the same rule the OpenClaw
            # spike already runs, where both shapes are exercised.
            proxy_value: "github-token-placeholder"
            match_headers: ["Authorization"]
          rules:
            - host: "api.github.com"
            - host: "github.com"
            - host: "codeload.github.com"
        - source:
            type: env
            var: AIQUOTA_API_BEARER_TOKEN
          replace:
            # The API deliberately has one bearer for its normalized and raw
            # read responses. Restrict its proxy replacement to the two GET
            # paths rather than turning this into general authenticated access
            # to aiquota.allegedly.works. Mirrors the public-coder proxy rule.
            proxy_value: "aiquota-token-placeholder"
            match_headers: ["Authorization"]
          rules:
            # Explicit HTTPS proxy clients perform this header-less CONNECT
            # preflight before the inner GET request is visible to Iron.
            - host: "aiquota.allegedly.works"
              methods: ["CONNECT"]
            - host: "aiquota.allegedly.works"
              methods: ["GET"]
              paths: ["/v1/quotas", "/v1/providers/*/raw"]

log:
  level: "info"
