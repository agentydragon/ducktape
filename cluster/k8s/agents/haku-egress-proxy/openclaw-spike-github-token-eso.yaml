# The agentydragon-agent GitHub PAT, shared with public-coder-agent. The real
# credential is consumed only by the Haku OpenClaw spike's egress proxy; the
# OpenClaw pod receives a non-secret placeholder that iron-proxy replaces in
# Authorization headers for exact GitHub hosts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-openclaw-spike-github-token
  namespace: haku-egress-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: github-agentydragon-agent
  target:
    name: haku-openclaw-spike-github-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: github-agentydragon-agent
        property: token
