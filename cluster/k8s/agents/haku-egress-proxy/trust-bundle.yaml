apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: haku-egress-proxy-ca-cert
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: cluster-root-ca-secret
        key: ca.crt
    - secret:
        name: haku-egress-proxy-ca
        key: tls.crt
  target:
    configMap:
      key: ca-certificates.crt
      metadata:
        annotations:
          description: Trust bundle for haku-egress-proxy-inspected sandbox HTTPS traffic
    # Written into Haku trust domains. The CLIProxyAPI-backed aiquota path
    # connects directly to the in-cluster management service and does not
    # trust or use this inspected egress listener.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - haku-sandbox
            - haku-claude-sandbox
            - haku-openclaw-spike
            - haku-ci
