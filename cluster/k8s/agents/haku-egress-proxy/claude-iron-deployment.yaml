apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-claude-oauth-proxy
  namespace: haku-egress-proxy
  labels:
    app.kubernetes.io/name: haku-claude-oauth-proxy
  annotations:
    description: Holds the real Claude subscription OAuth token and substitutes it for the sandbox placeholder only on api.anthropic.com Authorization headers.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-claude-oauth-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-claude-oauth-proxy
    spec:
      # Pull secret, hardening, args, resources and mounts come from
      # iron-proxy-common.yaml, applied by this namespace's kustomization.
      containers:
        - name: iron-proxy
          # Was the only one of the three iron-proxy deployments without an
          # $imagepolicy marker, so it silently stopped tracking the image its
          # two siblings roll on. Still on the pre-rename path until Flux writes
          # the first tag pushed as `iron-proxy`.
          image: git.allegedly.works/ducktape-ci/iron-proxy:devel-20260809231643-86f9b6c # {"$imagepolicy": "flux-system:iron-proxy"}
          env:
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-claude-oauth-token
                  key: CLAUDE_CODE_OAUTH_TOKEN
          ports:
            - name: proxy
              containerPort: 8180
            - name: metrics
              containerPort: 9090
      volumes:
        - name: config
          configMap:
            name: haku-claude-oauth-proxy-config
        - name: ca
          secret:
            secretName: haku-egress-proxy-ca
