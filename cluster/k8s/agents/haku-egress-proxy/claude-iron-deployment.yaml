apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-claude-oauth-proxy
  namespace: haku-egress-proxy
  labels:
    app.kubernetes.io/name: haku-claude-oauth-proxy
  annotations:
    description: Holds the real Claude subscription OAuth token and substitutes it for the sandbox placeholder only on api.anthropic.com Authorization headers.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-claude-oauth-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-claude-oauth-proxy
    spec:
      imagePullSecrets:
        - name: forgejo-images-creds
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iron-proxy
          # Was the only one of the three iron-proxy deployments without an
          # $imagepolicy marker, so it silently stopped tracking the image its
          # two siblings roll on. Still on the pre-rename path until Flux writes
          # the first tag pushed as `iron-proxy`.
          image: git.allegedly.works/ducktape-ci/iron-proxy:devel-20260819201301-06b8b19 # {"$imagepolicy": "flux-system:iron-proxy"}
          args: ["-config", "/etc/iron-proxy/iron.yaml"]
          env:
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-claude-oauth-token
                  key: CLAUDE_CODE_OAUTH_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-claude-github-token
                  key: GITHUB_TOKEN
            # The same bearer aiquota-api authenticates with, reflected here from
            # cli-proxy-api solely for iron-proxy to substitute into the sandbox's
            # placeholder on the two read endpoints; the runtime never receives it.
            # Optional like the openclaw spike's kube token: this proxy is the ONLY
            # egress path for haku-runtime-sandbox, so a late-reflecting secret must
            # not take Anthropic and GitHub down with it. Unset simply means no
            # substitution — aiquota 401s, everything else is untouched.
            - name: AIQUOTA_API_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiquota-api-bearer-haku-claude
                  key: bearer-token
                  optional: true
            # The central ActivityWatch read-only bearer, reflected here from the
            # activitywatch namespace solely for iron-proxy to substitute into the
            # sandbox's placeholder on the read route; the runtime never receives it.
            # Optional for the same reason as the tokens above: this proxy is the only
            # egress path for haku-runtime-sandbox, so a late-reflecting secret must not
            # take Anthropic and GitHub down with it. Unset means no substitution --
            # activitywatch-read 401s, everything else is untouched.
            - name: AW_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: activitywatch-read-token
                  key: token
                  optional: true
          ports:
            - name: proxy
              containerPort: 8180
            - name: metrics
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/iron-proxy
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: haku-claude-oauth-proxy-config
        - name: ca
          secret:
            secretName: haku-egress-proxy-ca
