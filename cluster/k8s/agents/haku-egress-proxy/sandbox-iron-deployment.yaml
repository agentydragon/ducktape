apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-sandbox-iron-proxy
  namespace: haku-egress-proxy
  labels:
    app.kubernetes.io/name: haku-sandbox-iron-proxy
  annotations:
    description: Egress fence for the haku exec-target sandboxes, on the same iron-proxy the Claude runner pool uses.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-sandbox-iron-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-sandbox-iron-proxy
    spec:
      imagePullSecrets:
        - name: forgejo-images-creds
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iron-proxy
          image: git.allegedly.works/ducktape-ci/iron-proxy:devel-20260819201301-06b8b19 # {"$imagepolicy": "flux-system:iron-proxy"}
          args: ["-config", "/etc/iron-proxy/iron.yaml"]
          ports:
            - name: proxy
              containerPort: 8182
            - name: metrics
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              # The mitmproxy this replaces needed 3Gi and had outgrown its limit
              # twice, because it buffers response bodies (`stream_large_bodies`
              # is a sizing workaround, not a fix) and retains flows. iron holds
              # neither, so this starts at the same 512Mi its two sibling iron
              # listeners run on rather than inheriting mitmproxy's ceiling.
              # Bazel and package fetches are the large-body traffic here; if the
              # working set turns out not to be bounded, that is the thing to
              # measure before raising this.
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/iron-proxy
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: haku-sandbox-iron-proxy-config
        - name: ca
          secret:
            secretName: haku-egress-proxy-ca
