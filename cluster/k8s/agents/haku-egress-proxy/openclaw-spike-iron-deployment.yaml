apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-openclaw-spike-proxy
  namespace: haku-egress-proxy
  labels:
    app.kubernetes.io/name: haku-openclaw-spike-proxy
  annotations:
    description: Holds Haku OpenClaw spike credentials and substitutes placeholders only for exact destination hosts.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-openclaw-spike-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-openclaw-spike-proxy
    spec:
      # Pull secret, hardening, args, resources and mounts come from
      # iron-proxy-common.yaml, applied by this namespace's kustomization.
      containers:
        - name: iron-proxy
          image: git.allegedly.works/ducktape-ci/iron-proxy:devel-20260809231643-86f9b6c # {"$imagepolicy": "flux-system:iron-proxy"}
          env:
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-claude-oauth-token
                  key: CLAUDE_CODE_OAUTH_TOKEN
            - name: HAKU_GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-forgejo-git
                  key: password
            - name: HAKU_CONSOLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-agent-api
                  key: token
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-openclaw-spike-github-token
                  key: GITHUB_TOKEN
            # Rotated roughly every 44 days by agents/authentik-jwt-rotation,
            # which commits the Secret SOPS-encrypted straight into THIS
            # namespace -- deliberately not via the shared claude-sandbox store
            # that carries GITHUB_TOKEN above. That store is conditioned to four
            # namespaces including public-coder-agent, the one deliberately
            # unconfined fence in the cluster; a cluster-API bearer has exactly
            # one consumer and should be readable by exactly one namespace.
            # reloader.stakater.com/auto restarts this pod when Flux applies a
            # rotation -- without it, kubectl would start 401ing ~44 days after
            # it last worked with nothing visibly changed.
            - name: HAKU_KUBE_JWT
              valueFrom:
                secretKeyRef:
                  name: haku-openclaw-spike-kube-token
                  key: jwt
                  # Optional so this can land before the rotator's first run
                  # publishes the Secret. A required ref would leave the pod
                  # unschedulable -- and this proxy is the ONLY egress path for
                  # the spike, so a missing kube token would take out Anthropic,
                  # Forgejo and GitHub too. Unset simply means no substitution:
                  # kubectl 401s, everything else is untouched.
                  optional: true
          ports:
            - name: proxy
              containerPort: 8181
            - name: metrics
              containerPort: 9090
      volumes:
        - name: config
          configMap:
            name: haku-openclaw-spike-proxy-config
        - name: ca
          secret:
            secretName: haku-egress-proxy-ca
