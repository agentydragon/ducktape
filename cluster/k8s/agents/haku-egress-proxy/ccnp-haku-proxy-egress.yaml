# Force all external egress from the haku-sandbox namespace through the
# dedicated haku-egress-proxy. Allows: DNS, cluster-internal traffic,
# kube-apiserver, haku-egress-proxy port 8080. Blocks: direct external
# internet access.
#
# Everything in the namespace EXCEPT the exec-target sandboxes: those carry
# `app.kubernetes.io/name: haku-sandbox` (stamped by the `haku` SandboxTemplate)
# and reach the internet through their own iron listener instead, admitted by
# ccnp-haku-sandbox-box-egress.yaml. Excluding them here rather than admitting
# them to both proxies keeps one fence per workload, so which proxy is in the
# path is enforced and not merely conventional — HTTP_PROXY decides which one a
# client dials, but only Cilium decides which one it may reach.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: haku-sandbox-force-proxy-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: In
        values:
          - haku-sandbox
      - key: "k8s:app.kubernetes.io/name"
        operator: NotIn
        values:
          - haku-sandbox
  egress:
    # DNS resolution (CoreDNS in kube-system)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # All cluster-internal traffic (pod-to-service, bypasses proxy via NO_PROXY).
    # This is also how haku-sandbox reaches the Plaid Postgres cluster-internally.
    - toEntities:
        - cluster
    # Kubernetes API server
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Shared proxy for existing sandbox traffic.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-egress-proxy
            k8s:app.kubernetes.io/name: haku-egress-proxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
