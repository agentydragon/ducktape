apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant-proxy
  namespace: homeassistant-proxy
  labels:
    app.kubernetes.io/name: homeassistant-proxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homeassistant-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homeassistant-proxy
    spec:
      # No Kubernetes API access; don't mount a SA token.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: homeassistant-proxy
          image: ghcr.io/agentydragon/homeassistant-proxy:devel-20260522024329-b644a41 # {"$imagepolicy": "flux-system:homeassistant-proxy"}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HOMEASSISTANT_PROXY_CONFIG
              value: /etc/homeassistant-proxy/config.yaml
            - name: UV_PYTHON_PREFERENCE
              value: only-system
            - name: HOMEASSISTANT_PROXY_HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homeassistant-proxy-ha-token
                  key: token
            - name: HOMEASSISTANT_PROXY_TOKEN_MCP_AGENT
              valueFrom:
                secretKeyRef:
                  name: homeassistant-proxy-tokens
                  key: mcp_agent
          volumeMounts:
            - name: config
              mountPath: /etc/homeassistant-proxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: homeassistant-proxy-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: tmp
          emptyDir: {}
