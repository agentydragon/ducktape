apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-passthrough-mcp
  namespace: kubectl-passthrough-mcp
  labels:
    app.kubernetes.io/name: kubectl-passthrough-mcp
  annotations:
    description: "containers/kubernetes-mcp-server in OAuth passthrough mode. Caller's Authentik JWT is forwarded directly to kube-apiserver; server itself is unprivileged."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubectl-passthrough-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubectl-passthrough-mcp
    spec:
      serviceAccountName: kubectl-passthrough-mcp
      containers:
        - name: server
          image: ghcr.io/containers/kubernetes-mcp-server:v0.0.63
          imagePullPolicy: IfNotPresent
          args:
            # Config is public-only — the OAuth2 provider is public (PKCE),
            # and passthrough mode does no token exchange, so no secrets needed.
            - --config=/etc/kubectl-passthrough-mcp/00-public.toml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: public
              mountPath: /etc/kubectl-passthrough-mcp/00-public.toml
              subPath: 00-public.toml
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: public
          configMap:
            name: kubectl-passthrough-mcp-public
