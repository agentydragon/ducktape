apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "false"
  name: kubectl-passthrough-mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    description: Service account for kubectl-passthrough-mcp pod. No k8s permissions — server uses passthrough OAuth token for kube-apiserver calls.
  name: kubectl-passthrough-mcp
  namespace: kubectl-passthrough-mcp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubectl-passthrough-mcp-public
  namespace: kubectl-passthrough-mcp
data:
  00-public.toml: |
    require_oauth = true
    authorization_url = "https://auth.allegedly.works/application/o/kubectl-passthrough-mcp/"
    oauth_audience = "kubectl-passthrough-mcp"
    # Passthrough forwards the caller's JWT as-is to kube-apiserver. No STS
    # credentials needed because there's no token exchange on this server.
    cluster_auth_mode = "passthrough"
    cluster_provider_strategy = "in-cluster"
    server_url = "https://kubectl-passthrough-mcp.allegedly.works"
    port = "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: containers/kubernetes-mcp-server in OAuth passthrough mode. Caller's Authentik JWT is forwarded directly to kube-apiserver; server itself is unprivileged.
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: kubectl-passthrough-mcp
  name: kubectl-passthrough-mcp
  namespace: kubectl-passthrough-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubectl-passthrough-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubectl-passthrough-mcp
    spec:
      containers:
        - args:
            - --config=/etc/kubectl-passthrough-mcp/00-public.toml
          image: ghcr.io/containers/kubernetes-mcp-server:v0.0.66
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          name: server
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - mountPath: /etc/kubectl-passthrough-mcp/00-public.toml
              name: public
              readOnly: true
              subPath: 00-public.toml
      serviceAccountName: kubectl-passthrough-mcp
      volumes:
        - configMap:
            name: kubectl-passthrough-mcp-public
          name: public
---
apiVersion: v1
kind: Service
metadata:
  name: kubectl-passthrough-mcp
  namespace: kubectl-passthrough-mcp
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: kubectl-passthrough-mcp
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubectl-passthrough-mcp
  namespace: kubectl-passthrough-mcp
spec:
  hostnames:
    - kubectl-passthrough-mcp.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: kubectl-passthrough-mcp
          port: 8080
      timeouts:
        backendRequest: 60s
        request: 60s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-ksbx-agentydragon-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: oidc-ksbx:agentydragon
