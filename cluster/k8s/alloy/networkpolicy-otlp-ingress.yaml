apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-otlp-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Ingress
  ingress:
    # Allow OTLP/HTTP from OpenClaw gateway pod.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openclaw
      ports:
        - port: 4318
          protocol: TCP
    # Allow OTLP/HTTP from Authentik shared proxy outpost (proxies external clients).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              goauthentik.io/outpost-name: shared-proxy-outpost
      ports:
        - port: 4318
          protocol: TCP
