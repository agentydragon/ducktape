apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix-agent-rbac
  namespace: ducktape-flux
  annotations:
    description: Agent RBAC for matrix namespace. Lightweight — only RoleBindings. Depends on namespace existing + agent RBAC base for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/matrix/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 2m
  dependsOn:
    - name: matrix-namespace
      namespace: ducktape-flux
    - name: claude-rbac
      namespace: ducktape-flux
