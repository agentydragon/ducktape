apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: auto
  name: matrix
spec: {}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-db
  namespace: matrix
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: synapse
      localeCType: C
      localeCollate: C
      owner: synapse
  instances: 2
  monitoring:
    enablePodMonitor: true
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: matrix-db
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    resizeInUseVolumes: false
    size: 10Gi
    storageClass: piraeus-ssd-local
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for matrix/matrix-db.
  name: matrix-db-backups
  namespace: matrix
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: matrix-db-backups
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: matrix-db-backups
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for matrix/matrix-db.
  name: matrix-db-backups
  namespace: matrix
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: matrix-db-backups
  namespace: matrix
spec:
  identityRef:
    name: matrix-db-backups
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: matrix-db-backups-s3-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  annotations:
    description: SeaweedFS S3 destination for matrix/matrix-db base backups and WAL.
  name: matrix-db
  namespace: matrix
spec:
  configuration:
    data:
      compression: gzip
    destinationPath: s3://matrix-db-backups/
    endpointURL: http://seaweedfs-s3.seaweedfs.svc:8333
    s3Credentials:
      accessKeyId:
        key: AWS_ACCESS_KEY_ID
        name: matrix-db-backups-s3-credentials
      secretAccessKey:
        key: AWS_SECRET_ACCESS_KEY
        name: matrix-db-backups-s3-credentials
    wal:
      compression: gzip
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: matrix-db
  namespace: matrix
spec:
  backupOwnerReference: self
  cluster:
    name: matrix-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 8 4 * * *
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matrix-synapse-media
  namespace: matrix
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: piraeus-ssd-2-autodiskful
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ananace-charts
  namespace: matrix
spec:
  interval: 24h
  url: https://ananace.gitlab.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix-synapse
  namespace: matrix
spec:
  chart:
    spec:
      chart: matrix-synapse
      sourceRef:
        kind: HelmRepository
        name: ananace-charts
        namespace: matrix
      version: 3.12.37
  install:
    strategy:
      name: RetryOnFailure
  interval: 15m
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    config:
      enableRegistration: false
      reportStats: false
    externalPostgresql:
      database: synapse
      existingSecret: matrix-db-app
      existingSecretPasswordKey: password
      host: matrix-db-rw
      port: 5432
      username: synapse
    image:
      pullPolicy: IfNotPresent
      repository: matrixdotorg/synapse
      tag: v1.160.0
    persistence:
      enabled: true
      existingClaim: matrix-synapse-media
    postgresql:
      enabled: false
    publicServerName: matrix.allegedly.works
    redis:
      auth:
        enabled: true
        existingSecret: synapse-redis-password
        existingSecretPasswordKey: redis-password
      enabled: true
      master:
        nodeSelector:
          topology.kubernetes.io/zone: hil-ovh
        persistence:
          enabled: false
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
    serverName: allegedly.works
    service:
      port: 8008
      type: ClusterIP
    serviceAccount:
      create: true
    signingkey:
      existingSecret: synapse-signing-key
      existingSecretKey: signing.key
      job:
        enabled: false
    synapse:
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      strategy:
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
        type: RollingUpdate
    workers:
      default:
        enabled: false
  valuesFrom:
    - kind: Secret
      name: matrix-oidc-config
      valuesKey: values.yaml
    - kind: Secret
      name: synapse-macaroon-secret
      targetPath: config.macaroonSecretKey
      valuesKey: macaroon_secret_key
    - kind: Secret
      name: synapse-registration-secret
      targetPath: config.registrationSharedSecret
      valuesKey: registration_shared_secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse
  namespace: matrix
spec:
  hostnames:
    - matrix.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: matrix-synapse
          port: 8008
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: federation
  namespace: matrix
spec:
  hostnames:
    - allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: matrix-synapse
          port: 8008
      matches:
        - path:
            type: PathPrefix
            value: /_matrix
    - backendRefs:
        - name: matrix-synapse
          port: 8008
      matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: element-web-config
  namespace: matrix
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "https://matrix.allegedly.works",
          "server_name": "allegedly.works"
        }
      },
      "brand": "Element",
      "integrations_ui_url": "https://scalar.vector.im/",
      "integrations_rest_url": "https://scalar.vector.im/api",
      "integrations_widgets_urls": [
        "https://scalar.vector.im/_matrix/integrations/v1",
        "https://scalar.vector.im/api",
        "https://scalar-staging.vector.im/_matrix/integrations/v1",
        "https://scalar-staging.vector.im/api",
        "https://scalar-staging.riot.im/scalar/api"
      ],
      "hosting_signup_link": "https://element.io/matrix-services?utm_source=element-web&utm_medium=web",
      "bug_report_endpoint_url": "https://element.io/bugreports/submit",
      "uisi_autorageshake_app": "element-auto-uisi",
      "showLabsSettings": true,
      "features": {},
      "map_style_url": "https://api.maptiler.com/maps/streets/style.json?key=fU3vlMsMn4Jb6dnEIFsx",
      "sso_redirect_options": {
        "immediate": true
      }
    }
immutable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: element-web
  name: element-web
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: element-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: element-web
    spec:
      automountServiceAccountToken: false
      containers:
        - image: vectorim/element-web:v1.12.27
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          name: element-web
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /app/config.json
              name: config
              readOnly: true
              subPath: config.json
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - configMap:
            name: element-web-config
          name: config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: element-web
  name: element-web
  namespace: matrix
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app.kubernetes.io/name: element-web
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: element-web
  namespace: matrix
spec:
  hostnames:
    - chat.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: element-web
          port: 80
