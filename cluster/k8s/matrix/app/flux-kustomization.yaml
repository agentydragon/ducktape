apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: matrix-namespace
      namespace: ducktape-flux
    - name: matrix-db
    - name: sso-providers-tf
      namespace: ducktape-flux
    - name: reflector
    - name: gateway
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: matrix-synapse
      namespace: matrix
  interval: 10m
  path: ./cluster/k8s/matrix/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: matrix-app
    namespace: ducktape-flux
  timeout: 10m
  wait: true
