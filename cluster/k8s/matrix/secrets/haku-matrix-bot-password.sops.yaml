# Password for the @haku:allegedly.works bot account.
#
# Two consumers: provision-matrix-users sets it once when creating the account,
# and haku-console logs in with it to obtain its own access token. Reflected
# into haku-console rather than duplicated as a second SOPS file, so there is
# one value to rotate.
#
# Rotating it is not free: Synapse purges every device and access token when a
# password is set, so haku-console is logged out until it next logs in.
apiVersion: v1
kind: Secret
metadata:
    name: haku-matrix-bot-password
    namespace: matrix
    annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: haku-console
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: haku-console
