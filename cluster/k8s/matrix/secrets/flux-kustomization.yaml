apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix-secrets
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/matrix/secrets
  prune: true
  # Deliberately no `wait: true`. This path carries provision-matrix-users-job,
  # which registers users against Synapse and therefore cannot succeed until the
  # app is up — while the app depends on this Kustomization for Synapse's signing
  # key and shared secrets. Health-gating here would deadlock the two. The job is
  # annotated force:enabled, so it is recreated each reconcile until it passes.
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: matrix-namespace
      namespace: ducktape-flux
