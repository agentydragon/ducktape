apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix-secrets
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/matrix/secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: matrix-namespace
      namespace: ducktape-flux
