apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix-secrets
  # CLEANUP(added 2026-08-09): Move to ducktape-flux with the rest of the matrix
  #   Kustomizations once `sops-age-cluster-secrets` actually exists there.
  #   Flux resolves spec.decryption.secretRef in the Kustomization's own
  #   namespace, and the reflection that puts the age identity in ducktape-flux
  #   is step 1 of the handoff described in
  #   cluster/terraform/main/persistent-auth.tf — added to that Terraform but not
  #   yet applied, so this Kustomization failed with `secrets
  #   "sops-age-cluster-secrets" not found` when it was created there. Being new
  #   and stateless, it is the ideal candidate for that file's step 2 ("move and
  #   verify a single low-impact SOPS controller").
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/matrix/secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: matrix-namespace
      namespace: ducktape-flux
