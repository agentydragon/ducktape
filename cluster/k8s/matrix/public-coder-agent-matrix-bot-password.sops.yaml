# Password for the @public-coder-agent:allegedly.works Matrix bot account.
#
# The Matrix user provisioner sets this only on initial account creation. The
# password is reflected into public-coder-agent, where iron-proxy uses it to
# replace OpenClaw's login placeholder and obtain/cache its own access token.
# Re-sending the password on every reconcile would revoke that token and all
# other devices for the account.
apiVersion: v1
kind: Secret
metadata:
    name: public-coder-agent-matrix-bot-password
    namespace: matrix
    annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: public-coder-agent
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: public-coder-agent
