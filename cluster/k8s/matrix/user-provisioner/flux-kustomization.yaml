apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix-user-provisioner
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/matrix/user-provisioner
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 5m
  # The job registers users against Synapse's admin API, so it must not start
  # until Synapse answers. Depending on the app Kustomization (which is
  # wait:true over the HelmRelease) gives that ordering; the health check states
  # it directly rather than relying on that transitively.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: matrix-synapse
      namespace: matrix
  dependsOn:
    - name: matrix # Synapse is deployed and healthy
    - name: matrix-secrets # registration shared secret, admin and bot passwords
    - name: external-secrets-config # ClusterSecretStore/ClusterExternalSecret for the token mirror
