# Distribution of the bot access token is decoupled from the provisioner, which
# just writes one plain Secret in the matrix namespace. ESO mirrors it into
# haku-console, where the Matrix sync loop reads it. Same shape as
# inventree/token-provisioner/token-eso.yaml.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-matrix-secret-store
spec:
  conditions:
    - namespaces: [haku-console]
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: default
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: matrix
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: haku-matrix-token
spec:
  namespaces:
    - haku-console
  externalSecretSpec:
    # The provisioner replaces the token whenever Synapse stops accepting it, so
    # the mirror needs to notice reasonably promptly rather than on a long poll.
    refreshInterval: 1m
    secretStoreRef:
      name: kubernetes-matrix-secret-store
      kind: ClusterSecretStore
    target:
      name: haku-matrix-token
    dataFrom:
      - extract:
          key: haku-matrix-token
