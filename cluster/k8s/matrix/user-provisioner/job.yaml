apiVersion: batch/v1
kind: Job
metadata:
  name: provision-matrix-users
  namespace: matrix
  annotations:
    # Recreate job on each reconciliation to ensure idempotent provisioning
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision
          # Script baked in via Bazel (//cluster/provisioners/matrix_user_provisioner:image).
          image: ghcr.io/agentydragon/matrix-user-provisioner:devel-20260827010203-ad9239c # {"$imagepolicy": "flux-system:matrix-user-provisioner"}
          imagePullPolicy: Always
          env:
            - name: REGISTRATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: synapse-registration-secret
                  key: registration_shared_secret
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synapse-admin-credentials
                  key: password
            - name: BOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-matrix-bot-password
                  key: password
            - name: PUBLIC_CODER_AGENT_BOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: public-coder-agent-matrix-bot-password
                  key: password
