apiVersion: batch/v1
kind: Job
metadata:
  name: provision-matrix-users
  namespace: matrix
  annotations:
    # Recreate job on each reconciliation to ensure idempotent provisioning
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: forgejo-images-creds
      containers:
        - name: provision
          # Script baked in via Bazel (//cluster/provisioners/matrix_user_provisioner:image).
          image: git.allegedly.works/ducktape-ci/matrix-user-provisioner:devel-20260901093700-4f5b4a7 # {"$imagepolicy": "flux-system:matrix-user-provisioner"}
          imagePullPolicy: Always
          env:
            - name: REGISTRATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: synapse-registration-secret
                  key: registration_shared_secret
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synapse-admin-credentials
                  key: password
            - name: PUBLIC_CODER_AGENT_BOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: public-coder-agent-matrix-bot-password
                  key: password
