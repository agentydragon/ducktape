apiVersion: v1
kind: ServiceAccount
metadata:
  name: matrix-user-provisioner
  namespace: matrix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matrix-user-provisioner
  namespace: matrix
  annotations:
    description: >-
      Lets the provisioner keep haku-matrix-token in step with Synapse — it
      mints a fresh bot access token whenever the stored one stops
      authenticating, so it needs to read what is there and write a replacement.
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matrix-user-provisioner
  namespace: matrix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: matrix-user-provisioner
subjects:
  - kind: ServiceAccount
    name: matrix-user-provisioner
    namespace: matrix
