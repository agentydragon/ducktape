apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix-db
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: ExternalArtifact
    name: matrix-db
    namespace: ducktape-flux
  path: ./cluster/k8s/matrix/db
  prune: true
  wait: true
  dependsOn:
    - name: matrix-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
