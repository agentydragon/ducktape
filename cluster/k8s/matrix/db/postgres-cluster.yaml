apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-db
  namespace: matrix
spec:
  instances: 1

  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/region: proxmox

  storage:
    # Matches the proxmox nodeSelector above, and the class Synapse's media
    # store already uses. The plain `local-path` class this used before the
    # namespace was parked no longer exists — it was split per location.
    storageClass: local-path-proxmox
    size: 10Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: synapse
      owner: synapse
      localeCType: C
      localeCollate: C
      # CNPG auto-generates credentials in secret matrix-db-app
