apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-synapse
  namespace: matrix
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "matrix.allegedly.works"
  rules:
    - backendRefs:
        - name: matrix-synapse
          port: 8008
---
# Federation and well-known endpoints on the apex domain.
# More specific path matches take priority over the website catch-all route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-federation
  namespace: matrix
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "allegedly.works"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/_matrix"
      backendRefs:
        - name: matrix-synapse
          port: 8008
    - matches:
        - path:
            type: PathPrefix
            value: "/.well-known/matrix"
      backendRefs:
        - name: matrix-synapse
          port: 8008
