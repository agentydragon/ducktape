apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-ingress-canary
  annotations:
    description: Restrict Talos host ingress while preserving public services and Nebula access.
spec:
  # Talos machine configuration sets node-vendor on every Talos node.
  nodeSelector:
    matchLabels:
      node-vendor: talos
  ingress:
    # Node, Pod and health identities need the existing cluster paths.
    - fromEntities:
        - cluster
        - health
    # Nebula DNS also serves clients that are not Kubernetes nodes. CIDR
    # matches the source IP on every device, not Nebula authentication.
    # The public interface has rp_filter disabled; independently verify
    # anti-spoofing before relying on this as an interface trust boundary.
    - fromCIDR:
        - 10.42.0.0/16
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
            - port: "53"
              protocol: UDP
    # Public Gateway, SMTP, Forgejo SSH, GitLab SSH, Kubernetes and Talos APIs.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "2222"
              protocol: TCP
            - port: "2223"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "50000"
              protocol: TCP
            - port: "4242"
              protocol: UDP
    - fromEntities:
        - world
      icmps:
        - fields:
            - type: 0
            - type: 3
            - type: 8
            - type: 11
            - type: 12
            - family: IPv6
              type: 1
            - family: IPv6
              type: 2
            - family: IPv6
              type: 3
            - family: IPv6
              type: 4
            - family: IPv6
              type: 128
            - family: IPv6
              type: 129
            - family: IPv6
              type: 133
            - family: IPv6
              type: 134
            - family: IPv6
              type: 135
            - family: IPv6
              type: 136
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-ingress-optiplex
  annotations:
    description: Restrict host ingress on optiplex while preserving home LAN and Nebula access.
spec:
  # Cilium's host endpoint includes this Piraeus node label; Kubernetes'
  # kubernetes.io/hostname label is not present on the host endpoint.
  nodeSelector:
    matchLabels:
      linbit.com/hostname: optiplex
  ingress:
    # Node, Pod and health identities need the existing cluster paths.
    - fromEntities:
        - cluster
        - health
    # Home Assistant and other local devices use the home LAN and Nebula.
    # As with the common rule, source CIDRs do not authenticate an interface.
    - fromCIDR:
        - 192.168.1.0/24
        - 10.42.0.0/16
    # Nebula DNS also serves clients that are not Kubernetes nodes. CIDR
    # matches the source IP on every device, not Nebula authentication.
    # The public interface has rp_filter disabled; independently verify
    # anti-spoofing before relying on this as an interface trust boundary.
    - fromCIDR:
        - 10.42.0.0/16
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
            - port: "53"
              protocol: UDP
    # Public Gateway, SMTP, Forgejo SSH, GitLab SSH, Kubernetes and Talos APIs.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "2222"
              protocol: TCP
            - port: "2223"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "50000"
              protocol: TCP
            - port: "4242"
              protocol: UDP
    - fromEntities:
        - world
      icmps:
        - fields:
            - type: 0
            - type: 3
            - type: 8
            - type: 11
            - type: 12
            - family: IPv6
              type: 1
            - family: IPv6
              type: 2
            - family: IPv6
              type: 3
            - family: IPv6
              type: 4
            - family: IPv6
              type: 128
            - family: IPv6
              type: 129
            - family: IPv6
              type: 133
            - family: IPv6
              type: 134
            - family: IPv6
              type: 135
            - family: IPv6
              type: 136
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-ingress-home
  annotations:
    description: Allow home LAN and Nebula clients to reach home-profile Talos nodes.
spec:
  nodeSelector:
    matchLabels:
      network.allegedly.works/host-firewall-profile: home
  ingress:
    # Preserve Home Assistant, local discovery and Nebula clients. These CIDRs
    # match source addresses and do not authenticate the incoming interface.
    - fromCIDR:
        - 192.168.1.0/24
        - 10.42.0.0/16
