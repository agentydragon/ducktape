apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keda
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: kyverno
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: keda
      namespace: keda
  interval: 10m
  path: ./cluster/k8s/keda
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: keda
    namespace: ducktape-flux
  timeout: 5m
  wait: true
