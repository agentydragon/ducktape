# The Agentplane integration app: the sandbox inventory over this namespace's
# Sandboxes and the runner bridge that dials each runner Pod on port 7000.
# Kubernetes is the inventory; every session's events are copied into the
# trajectory store (../db) as they arrive. Reached straight from the gateway
# (httproute.yaml): the app authenticates its own callers, by an operator's OIDC
# session or a reviewed Kubernetes token. One replica: the bridge holds live
# runner attachments in memory, and a second replica would supersede them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentplane-app
  namespace: agentplane-staging
  labels:
    app.kubernetes.io/name: agentplane-app
  annotations:
    # A re-minted client secret otherwise leaves the pod on the old one, and every login 401s.
    secret.reloader.stakater.com/reload: agentplane-oidc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplane-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-app
    spec:
      # With the database (cnpg_conventions R5); it had no pin at all while the database was
      # Proxmox-single, which is the rule already unmet rather than a new constraint.
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      serviceAccountName: agentplane-app
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: forgejo-images-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: git.allegedly.works/ducktape-ci/agentplane-app:devel-20260905073402-4272b75 # {"$imagepolicy": "flux-system:agentplane-app"}
          imagePullPolicy: IfNotPresent
          args:
            - --namespace=agentplane-staging
            # The same namespace for now: the split the flag exists for is a separate change, which
            # moves the Sandboxes, their template and the runner ServiceAccount out of here.
            - --sandbox-namespace=agentplane-staging
            - --template=agentplane-runner
            - --runner-port=7000
            - --host=0.0.0.0
            - --port=8080
          env:
            - name: AGENTPLANE_CONFIG_FILE
              value: /etc/agentplane/config.yaml
            - name: AGENTPLANE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: agentplane-db-app
                  key: username
            - name: AGENTPLANE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentplane-db-app
                  key: password
            - name: AGENTPLANE_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: agentplane-db-app
                  key: host
            - name: AGENTPLANE_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: agentplane-db-app
                  key: port
            - name: AGENTPLANE_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: agentplane-db-app
                  key: dbname
            - name: AGENTPLANE_DATABASE_URL
              value: "postgresql+asyncpg://$(AGENTPLANE_DB_USER):$(AGENTPLANE_DB_PASSWORD)@$(AGENTPLANE_DB_HOST):$(AGENTPLANE_DB_PORT)/$(AGENTPLANE_DB_NAME)"
            # The operator's way in. Setting the issuer is what enables the login at all; the path
            # is the Authentik application's slug, and the app pins the id token's `iss` to it.
            # Client, secret and session key come from the Terraform-minted Secret
            # (tf/gitops/sso-providers/provider_agentplane_staging.tf), reflected into this
            # namespace. The other way in, a Kubernetes token, admits only the subjects named in
            # AGENTPLANE_TOKEN_SUBJECTS below: the audience `--token-audience` defaults to gates
            # nothing on its own, because whoever mints a token chooses what audience it carries.
            - name: AGENTPLANE_OIDC_ISSUER
              value: https://auth.allegedly.works/application/o/agentplane/
            - name: AGENTPLANE_OIDC_PUBLIC_BASE_URL
              value: https://agentplane-staging.allegedly.works
            - name: AGENTPLANE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: agentplane-oidc
                  key: client-id
            - name: AGENTPLANE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentplane-oidc
                  key: client-secret
            - name: AGENTPLANE_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentplane-oidc
                  key: session-secret
            # Every identity allowed to present a Kubernetes token to this app. RBAC gates which
            # ServiceAccount a principal may mint a token for, so a subject left off this list is
            # refused however its token was minted; empty would leave the OIDC login the only way in.
            - name: AGENTPLANE_TOKEN_SUBJECTS
              value: '["system:serviceaccount:agentplane-staging:agentplane-agent"]'
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/agentplane
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: agentplane-app-config
