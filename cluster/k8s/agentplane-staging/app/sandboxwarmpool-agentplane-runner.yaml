# The pool every SandboxClaim references: a claim carries only a warmPoolRef, and this
# pool's template is where the runner Pod is defined. Zero replicas, so nothing is
# pre-warmed and each claim gets a Sandbox created for it on demand.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: agentplane-runner
  namespace: agentplane-staging
spec:
  replicas: 0
  updateStrategy:
    type: Recreate
  sandboxTemplateRef:
    name: agentplane-runner
