# Agentplane runner sandbox: the Pod and volume every Sandbox the integration
# app stamps is copied from (the app reads this template at creation; no claim
# or warm pool references it), driven over port 7000. The Pod is pinned to wyrm2
# (region proxmox) so the local-path-proxmox state PVC binds where it runs; a
# suspended Sandbox (operatingMode: Suspended) drops the Pod and keeps the PVC,
# so it resumes only there. Both harnesses reach models through the cluster
# LiteLLM with the cheap-experiments key, directly: the credentialless egress
# design governs external systems, not the model endpoint (x/agentplane/app/README.md).
# Everything else outside the cluster goes through the egress sidecar: the harness
# children's HTTP(S)_PROXY, declared in the runner's --harness-env below, is the
# sidecar on loopback, which relays to the central proxy (../egress) with the Pod's
# projected token, and they trust the proxy's interception CA through the
# trust-manager bundle mounted over the system store. Those values belong here
# because this file is what makes them true -- the sidecar's port and the bundle's
# path are declared in it. The token volume is mounted into the sidecar only. networkPolicyManagement
# is Unmanaged because the CiliumNetworkPolicy next to this file is the runner's fence.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: agentplane-runner
  namespace: agentplane-staging
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-runner
    spec:
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      serviceAccountName: agentplane-runner
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: git.allegedly.works/ducktape-ci/agentplane-runner:devel-20260904051630-4a92451 # {"$imagepolicy": "flux-system:agentplane-runner"}
          # The image's entrypoint is the runner's Bazel launcher, which finds its runfiles next to
          # its own real path; a command override through a symlink loses them and the container
          # exits at once. Only the arguments are set here.
          args:
            - --state-dir
            - /state
            - --listen
            - 0.0.0.0:7000
            - --claude-binary
            - /usr/local/bin/claude
            - --anthropic-base-url
            - $(LITELLM_URL)
            - --codex-binary
            - /opt/codex/bin/codex
            - --openai-base-url
            - $(LITELLM_URL)/v1
            # The environment a harness child starts from: a bare NAME takes the runner's value,
            # NAME=value sets one. The runner inherits nothing implicitly, so what is not named
            # here does not reach the agent -- the LiteLLM key above all. HOME and PATH come from
            # the image, which keeps a change there from needing an edit here.
            - --harness-env
            - HOME
            - --harness-env
            - PATH
            # Both spellings of each, since clients disagree on case. NO_PROXY is loopback (the
            # sidecar itself and the runner's own listeners) and in-cluster Service names in the
            # forms clients build; LiteLLM is deliberately not among them, so model traffic takes
            # the sidecar like everything else and the proxy is what holds the key.
            - --harness-env
            - HTTP_PROXY=http://127.0.0.1:3128
            - --harness-env
            - HTTPS_PROXY=http://127.0.0.1:3128
            - --harness-env
            - http_proxy=http://127.0.0.1:3128
            - --harness-env
            - https_proxy=http://127.0.0.1:3128
            - --harness-env
            - NO_PROXY=127.0.0.1,localhost,.svc,.svc.cluster.local,.cluster.local
            - --harness-env
            - no_proxy=127.0.0.1,localhost,.svc,.svc.cluster.local,.cluster.local
            # The trust bundle, mounted over the system store below and named explicitly for the
            # clients that read an env pointer (Node, Python, curl, requests, git's libcurl).
            - --harness-env
            - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
            - --harness-env
            - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
            - --harness-env
            - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
            - --harness-env
            - GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt
            - --harness-env
            - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          ports:
            - name: runner
              containerPort: 7000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: LITELLM_URL
              value: http://litellm.litellm.svc.cluster.local:4000
            # Not the key: the placeholder the litellm-cheap-experiments EgressCredential derives
            # from its name. Both harnesses send it as `Authorization: Bearer`, and the proxy puts
            # the real key there on the way out. Nothing in this Pod can read the key, so a runner
            # spends the budget only through requests the proxy admitted.
            - name: ANTHROPIC_AUTH_TOKEN
              value: agentplane-credential-litellm-cheap-experiments
            - name: OPENAI_API_KEY
              value: agentplane-credential-litellm-cheap-experiments
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: state
              mountPath: /state
            - name: egress-ca
              # Public roots + cluster root + the proxy's interception root (../egress/trust-bundle.yaml),
              # over the image's own bundle at the path every client falls back to, whether or not it
              # reads the env pointers the runner passes on. A subPath mount does not follow ConfigMap updates: a CA
              # rotation reaches a sandbox at its next Pod, which suspend/resume or re-creation gives.
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
        - name: egress-sidecar
          image: git.allegedly.works/ducktape-ci/agentplane-egress-sidecar:devel-20260903051147-10297f8 # {"$imagepolicy": "flux-system:agentplane-egress-sidecar"}
          # The image's entrypoint is the sidecar's Bazel launcher (see the runner above); only
          # settings are given, as environment.
          env:
            - name: AGENTPLANE_EGRESS_SIDECAR_PROXY_HOST
              value: agentplane-egress.agentplane-staging.svc.cluster.local
            - name: AGENTPLANE_EGRESS_SIDECAR_PROXY_PORT
              value: "8888"
            - name: AGENTPLANE_EGRESS_SIDECAR_LISTEN_PORT
              value: "3128"
            - name: AGENTPLANE_EGRESS_SIDECAR_TOKEN_FILE
              value: /var/run/agentplane-egress/token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: egress-token
              mountPath: /var/run/agentplane-egress
              readOnly: true
      volumes:
        - name: egress-ca
          configMap:
            name: agentplane-egress-ca
        # The Pod's identity to the central proxy: a ServiceAccount token bound to this Pod, with
        # the proxy's audience, rotated by kubelet (the sidecar re-reads it per request). It proves
        # the Pod, and the proxy follows the Pod to its Sandbox; it is mounted into the sidecar only.
        - name: egress-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentplane-egress
                  expirationSeconds: 600
                  path: token
  volumeClaimTemplatesPolicy: Overrides
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        storageClassName: local-path-proxmox
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
