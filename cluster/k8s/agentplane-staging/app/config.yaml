# The app's settings file (x/agentplane/app/main.py `Settings`), mounted by the Deployment.
# Native subscription routes authorized by the staging key in tf/gitops/litellm-keys.
models:
  claude:
    - anthropic-max20/ant-messages/claude-opus-5
    - anthropic-max20/ant-messages/claude-sonnet-5
    - anthropic-max20/ant-messages/claude-fable-5
    - anthropic-max20/ant-messages/claude-haiku-4-5-20251001
  codex:
    - chatgpt/oai-responses/gpt-6-astra
    - chatgpt/oai-responses/gpt-5.4
    - chatgpt/oai-responses/gpt-5.5
    - chatgpt/oai-responses/gpt-5.6-sol
    - chatgpt/oai-responses/gpt-5.6-terra
    - chatgpt/oai-responses/gpt-5.6-luna
    - chatgpt/oai-responses/gpt-5.3-codex-spark

# Rendered into the image-owned agent-instruction template; deployments may use different service names.
agent_egress_rules_url: http://agentplane-egress.agentplane-staging.svc.cluster.local/v1/rules
agent_actions_service_url: http://agentplane-actions.agentplane-staging.svc.cluster.local:8080

# App-owned launch presets. Names are resolved here; the Sandbox CR and runner receive only the
# concrete template, policies, bootstrap source, and SessionSpec fields.
thread_presets:
  public-coder-codex:
    title: Public coder / Codex
    provider: codex
    model: chatgpt/oai-responses/gpt-5.6-luna
    cwd: /state/workspaces/{session_id}
    reasoning_effort: medium
    instructions: >-
      Work as a public-repository coding agent. Keep private cluster data out of the workspace and outputs.
sandbox_presets:
  public-coder:
    title: Public coder
    template: agentplane-runner
    policies:
      - basic
      - github-public
    thread_preset: public-coder-codex
    bootstrap: |
      marker=/state/workspaces/.agentplane-public-coder-ready
      mkdir -p /state/workspaces
      if [ ! -f "$marker" ]; then
        printf '%s\n' 'public-coder workspace initialized' > "$marker"
      fi

# Granted to every sandbox before whatever the operator picks: without the model endpoint a
# sandbox has no agent, so it is not a choice (cluster/k8s/agentplane-staging/egress).
default_policies:
  - basic
# The egress proxy's admin port (x/agentplane/egress `Settings.admin_port`), asked for each
# sandbox's recent decisions; until the proxy Deployment lands the page shows the rules alone.
egress_admin_url: http://agentplane-egress-admin.agentplane-staging.svc:8081
