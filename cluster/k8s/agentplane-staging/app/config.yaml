# The app's settings file (x/agentplane/app/main.py `Settings`), mounted by the Deployment.
# What the session form offers per harness: routes the cheap-experiments key may call
# (tf/gitops/litellm-keys), one native model per provider so far.
models:
  claude:
    - anthropic-api/ant-messages/claude-haiku-4-5-20251001
  codex:
    - chatgpt/oai-responses/gpt-5.6-luna

# Platform operation guidance is prepended to every session, including direct API launches. Keep
# workload- and task-specific constraints in the selected thread preset or the launch request.
agent_instructions: |
  You are running inside an Agentplane sandbox. Outbound access is policy-controlled and goes
  through the configured HTTP proxy. Before using a protected service, discover its allowed
  destinations, paths, and credential presentation from
  http://agentplane-egress.agentplane-staging.svc.cluster.local/v1/rules with Authorization: Bearer
  agentplane-credential-agentplane-workload. That value is an inert credential placeholder, not a
  secret: send it in the allowed request through the configured proxy. Never read, print, persist,
  or ask for the substituted credential, and do not bypass the proxy.

  The Actions Service is available to sandbox workloads at
  http://agentplane-actions.agentplane-staging.svc.cluster.local:8080. Use its REST API with the
  workload placeholder above. Discover Actions with GET /v1/action-groups and, when needed,
  GET /v1/action-groups/{group}/actions/{action}. To request an Action, POST
  /v1/action-requests with an idempotency_key that is unique for the intended request, an action
  object containing group and name, and arguments that match the discovered schema. Keep the
  returned request ID and idempotency key. A receipt in decision_pending is queued for an operator
  decision, not successful execution. To follow an existing request, read GET
  /v1/action-requests/{id} and GET /v1/action-requests/{id}/events?after_sequence={last sequence};
  advance the cursor only after recording returned events. If a submission response is uncertain,
  retry with the same idempotency key; never create a replacement request. Do not call operator
  routes or make a decision yourself. Report only facts you observed from the service, including
  the request ID and state when the task asks for them.

# App-owned launch presets. Names are resolved here; the Sandbox CR and runner receive only the
# concrete template, policies, bootstrap source, and SessionSpec fields.
thread_presets:
  public-coder-codex:
    title: Public coder / Codex
    provider: codex
    model: chatgpt/oai-responses/gpt-5.6-luna
    cwd: /state/workspaces/{session_id}
    reasoning_effort: medium
    instructions: >-
      Work as a public-repository coding agent. Keep private cluster data out of the workspace and outputs.
sandbox_presets:
  public-coder:
    title: Public coder
    template: agentplane-runner
    policies:
      - github-public
    thread_preset: public-coder-codex
    bootstrap: |
      marker=/state/workspaces/.agentplane-public-coder-ready
      mkdir -p /state/workspaces
      if [ ! -f "$marker" ]; then
        printf '%s\n' 'public-coder workspace initialized' > "$marker"
      fi

# Granted to every sandbox before whatever the operator picks: without the model endpoint a
# sandbox has no agent, so it is not a choice (cluster/k8s/agentplane-staging/egress).
default_policies:
  - litellm
  - agentplane-actions
  - egress-rules
# The egress proxy's admin port (x/agentplane/egress `Settings.admin_port`), asked for each
# sandbox's recent decisions; until the proxy Deployment lands the page shows the rules alone.
egress_admin_url: http://agentplane-egress-admin.agentplane-staging.svc:8081
