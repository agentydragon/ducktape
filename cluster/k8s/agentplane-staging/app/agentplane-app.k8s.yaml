apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: agentplane-staging
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentplane-agent
  namespace: agentplane-staging
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentplane-app
  namespace: agentplane-staging
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentplane-runner
  namespace: agentplane-staging
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentplane-staging-app-token-reviewer
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentplane-staging-app-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentplane-staging-app-token-reviewer
subjects:
  - kind: ServiceAccount
    name: agentplane-app
    namespace: agentplane-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-app
  namespace: agentplane-staging
rules:
  - apiGroups:
      - extensions.agents.x-k8s.io
    resources:
      - sandboxtemplates
    verbs:
      - get
      - list
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - create
      - get
      - list
      - watch
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - patch
      - delete
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - egresspolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - egressbindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - egresscredentials
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - egressbindings
    verbs:
      - create
      - delete
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - actionpolicysets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - actionpolicybindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - actionpolicybindings
    verbs:
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-app
  namespace: agentplane-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-app
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: agentplane-app
    namespace: agentplane-staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    configmap.reloader.stakater.com/reload: agentplane-action-federation
    secret.reloader.stakater.com/reload: agentplane-oidc
  labels:
    app.kubernetes.io/name: agentplane-app
  name: agentplane-app
  namespace: agentplane-staging
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-app-app-deployment-c8cfebd4
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-app
        cdk8s.io/metadata.addr: agentplane-app-app-deployment-c8cfebd4
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hil-ovh
      automountServiceAccountToken: true
      containers:
        - args:
            - --namespace=agentplane-staging
            - --sandbox-namespace=agentplane-staging
            - --runner-port=7000
            - --host=0.0.0.0
            - --port=8080
          env:
            - name: AGENTPLANE_ACTION_FEDERATION
              valueFrom:
                configMapKeyRef:
                  key: action-federation
                  name: agentplane-action-federation
            - name: AGENTPLANE_CONFIG_FILE
              value: /etc/agentplane/config.yaml
            - name: AGENTPLANE_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-app
            - name: AGENTPLANE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-app
            - name: AGENTPLANE_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-app
            - name: AGENTPLANE_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-app
            - name: AGENTPLANE_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: postgres-app
            - name: AGENTPLANE_DATABASE_URL
              value: postgresql+asyncpg://$(AGENTPLANE_DB_USER):$(AGENTPLANE_DB_PASSWORD)@$(AGENTPLANE_DB_HOST):$(AGENTPLANE_DB_PORT)/$(AGENTPLANE_DB_NAME)
            - name: AGENTPLANE_OIDC_ISSUER
              value: https://auth.allegedly.works/application/o/agentplane/
            - name: AGENTPLANE_OIDC_PUBLIC_BASE_URL
              value: https://agentplane-staging.allegedly.works
            - name: AGENTPLANE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client-id
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client-secret
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: session-secret
                  name: agentplane-oidc
            - name: AGENTPLANE_TOKEN_SUBJECTS
              value: '["system:serviceaccount:agentplane-staging:agentplane-agent"]'
          image: git.allegedly.works/ducktape-ci/agentplane-app:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
          name: app
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/agentplane
              name: configmap-agentplane-app-config
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      initContainers:
        - env:
            - name: AGENTPLANE_ACTION_FEDERATION
              valueFrom:
                configMapKeyRef:
                  key: action-federation
                  name: agentplane-action-federation
            - name: AGENTPLANE_CONFIG_FILE
              value: /etc/agentplane/config.yaml
            - name: AGENTPLANE_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-app
            - name: AGENTPLANE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-app
            - name: AGENTPLANE_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-app
            - name: AGENTPLANE_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-app
            - name: AGENTPLANE_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: postgres-app
            - name: AGENTPLANE_DATABASE_URL
              value: postgresql+asyncpg://$(AGENTPLANE_DB_USER):$(AGENTPLANE_DB_PASSWORD)@$(AGENTPLANE_DB_HOST):$(AGENTPLANE_DB_PORT)/$(AGENTPLANE_DB_NAME)
            - name: AGENTPLANE_OIDC_ISSUER
              value: https://auth.allegedly.works/application/o/agentplane/
            - name: AGENTPLANE_OIDC_PUBLIC_BASE_URL
              value: https://agentplane-staging.allegedly.works
            - name: AGENTPLANE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client-id
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client-secret
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: session-secret
                  name: agentplane-oidc
            - name: AGENTPLANE_TOKEN_SUBJECTS
              value: '["system:serviceaccount:agentplane-staging:agentplane-agent"]'
          image: git.allegedly.works/ducktape-ci/agentplane-app-migrate:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-app
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentplane-app
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      volumes:
        - configMap:
            name: agentplane-app-config
          name: configmap-agentplane-app-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: agentplane-app
  name: agentplane-app
  namespace: agentplane-staging
spec:
  externalIPs: []
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    cdk8s.io/metadata.addr: agentplane-app-app-deployment-c8cfebd4
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentplane-staging
  namespace: agentplane-staging
spec:
  hostnames:
    - agentplane-staging.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  rules:
    - backendRefs:
        - name: agentplane-app
          port: 8080
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
          type: ResponseHeaderModifier
      timeouts:
        backendRequest: 3600s
        request: 3600s
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-runner
  namespace: agentplane-staging
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-egress
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-runner
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-app
  namespace: agentplane-staging
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - auth.allegedly.works
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: server
            app.kubernetes.io/instance: authentik
            app.kubernetes.io/name: authentik
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
          serverNames:
            - auth.allegedly.works
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-runner
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-egress
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-actions
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: postgres
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-app
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentplane-app
  namespace: agentplane-staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplane-app
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: agentplane-runner
  namespace: agentplane-staging
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-runner
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --state-dir
            - /state
            - --listen
            - 0.0.0.0:7000
            - --claude-binary
            - /usr/local/bin/claude
            - --anthropic-base-url
            - $(LITELLM_URL)
            - --codex-binary
            - /opt/codex/bin/codex
            - --openai-base-url
            - $(LITELLM_URL)/v1
            - --harness-env
            - HOME
            - --harness-env
            - PATH
            - --harness-env
            - HTTP_PROXY=http://127.0.0.1:3128
            - --harness-env
            - HTTPS_PROXY=http://127.0.0.1:3128
            - --harness-env
            - http_proxy=http://127.0.0.1:3128
            - --harness-env
            - https_proxy=http://127.0.0.1:3128
            - --harness-env
            - NO_PROXY=127.0.0.1,localhost
            - --harness-env
            - no_proxy=127.0.0.1,localhost
            - --harness-env
            - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
            - --harness-env
            - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
            - --harness-env
            - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
            - --harness-env
            - GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt
            - --harness-env
            - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          env:
            - name: LITELLM_URL
              value: http://agentplane-llm-ingress.agentplane-staging.svc.cluster.local:8080
            - name: ANTHROPIC_AUTH_TOKEN
              value: agentplane-credential-agentplane-workload
            - name: OPENAI_API_KEY
              value: agentplane-credential-agentplane-workload
          image: git.allegedly.works/ducktape-ci/agentplane-runner:unset
          name: runner
          ports:
            - containerPort: 7000
              name: runner
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /state
              name: state
            - mountPath: /etc/ssl/certs/ca-certificates.crt
              name: egress-ca
              readOnly: true
              subPath: ca-certificates.crt
        - env:
            - name: AGENTPLANE_EGRESS_SIDECAR_PROXY_HOST
              value: agentplane-egress.agentplane-staging.svc.cluster.local
            - name: AGENTPLANE_EGRESS_SIDECAR_PROXY_PORT
              value: "8888"
            - name: AGENTPLANE_EGRESS_SIDECAR_LISTEN_PORT
              value: "3128"
            - name: AGENTPLANE_EGRESS_SIDECAR_TOKEN_FILE
              value: /var/run/agentplane-egress/token
          image: git.allegedly.works/ducktape-ci/agentplane-egress-sidecar:unset
          name: egress-sidecar
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /var/run/agentplane-egress
              name: egress-token
              readOnly: true
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-runner
      terminationGracePeriodSeconds: 60
      volumes:
        - configMap:
            name: agentplane-egress-ca
          name: egress-ca
        - name: egress-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentplane-egress
                  expirationSeconds: 600
                  path: token
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: local-path-ovh-hdd
  volumeClaimTemplatesPolicy: Overrides
