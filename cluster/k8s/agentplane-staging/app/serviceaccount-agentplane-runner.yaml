# The runner Pods' identity, with no RBAC: it exists so the sidecar's projected token names a
# Pod of this template rather than the namespace default, and so nothing granted to default
# ever reaches a sandbox. The token is bound to the Pod; the proxy checks that binding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentplane-runner
  namespace: agentplane-staging
automountServiceAccountToken: false
