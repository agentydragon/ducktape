# The identity an agent presents to the app's API. No Pod runs as it and it holds no RoleBinding:
# it exists so that `kubectl -n agentplane-staging create token agentplane-agent
# --audience=agentplane` yields a token TokenReview resolves to a name the app labels its grants
# with. What that name may do is the app's business, not Kubernetes'; minting the token grants
# nothing in the cluster. Who may mint it is in ../agent-rbac/role-agentplane-operator.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentplane-agent
  namespace: agentplane-staging
automountServiceAccountToken: false
