apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-staging-app
  namespace: ducktape-flux
  annotations:
    description: Agentplane integration app (Deployment, Service, RBAC) and the runner SandboxTemplate (runner + egress sidecar) + Cilium fences in agentplane-staging; the app stamps one standalone Sandbox per sandbox from the template; no claims or warm pool.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  path: ./cluster/k8s/agentplane-staging/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: agentplane-staging-actions # destination verifier ready before the BFF
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: agent-sandbox-controller # CRDs + controller
      namespace: ducktape-flux
    - name: agentplane-staging-namespace
      namespace: ducktape-flux
    - name: agentplane-staging-db # the app composes its database URL from the CNPG app Secret
      namespace: ducktape-flux
    - name: forgejo-images # reflects the runner image's pull credential
      namespace: ducktape-flux
    - name: litellm-keys-tf # writes the staging subscription key
      namespace: ducktape-flux
    - name: agentplane-staging-egress # the proxy the sidecar relays to and the CA bundle the runner mounts
      namespace: ducktape-flux
    - name: gateway # the HTTPRoute's parent
      namespace: ducktape-flux
    # TF mints the OAuth2 provider and agentplane-oidc Secret; Reflector mirrors the Secret into
    # this namespace. The Actions Kustomization owns the non-secret federation ConfigMap, which
    # this Deployment reads after its dependency has reconciled.
    - name: sso-providers-tf
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
