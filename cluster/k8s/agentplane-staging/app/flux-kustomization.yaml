apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-staging-app
  namespace: ducktape-flux
  annotations:
    description: Agentplane integration app (Deployment, Service, RBAC) and the runner SandboxTemplate + Cilium fences in agentplane-staging; the app creates one SandboxClaim per sandbox against a zero-replica pool, so nothing is pre-warmed.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  path: ./cluster/k8s/agentplane-staging/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: agent-sandbox-controller # CRDs + controller
      namespace: ducktape-flux
    - name: agentplane-staging-namespace
      namespace: ducktape-flux
    - name: forgejo-images # reflects the runner image's pull credential
      namespace: ducktape-flux
    - name: litellm-keys-tf # writes the standing cheap-experiments key copy
      namespace: ducktape-flux
