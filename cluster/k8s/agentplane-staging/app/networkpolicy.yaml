# Runner Pods reach DNS and the cluster LiteLLM only; their port 7000 is open
# only to Pods in this namespace (the integration app). Nothing else in either
# direction. LiteLLM is admitted on its container port (4000, the Service's
# targetPort) - cluster/docs/cilium_network_policy.md § Egress to a ClusterIP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-runner
  namespace: agentplane-staging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-runner
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: litellm
            k8s:app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
---
# The app takes browser traffic only through the Authentik proxy outpost, and
# reaches DNS, the API server for the inventory, and the runner Pods on 7000.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-app
  namespace: agentplane-staging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-app
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            app.kubernetes.io/name: authentik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The API server's service proxy, which is how the agent reaches the API (see
    # ../agent-rbac/role-agentplane-operator.yaml). The API server authorizes the caller before
    # proxying, so this admits only identities holding services/proxy on this Service. The API
    # server is host-networked on the Talos control-plane nodes, and its ingress traffic carries
    # the remote-node identity there: Cilium's own note is that the kube-apiserver entity "may
    # not work for ingress traffic in some Kubernetes distributions", and with it alone the
    # proxy's dial to the Pod timed out. remote-node admits host-network processes on every other
    # node to this port; the API server's authorization stays the gate for the proxy path.
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-runner
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP
