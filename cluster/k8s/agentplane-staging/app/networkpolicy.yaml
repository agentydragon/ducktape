# Runner Pods reach DNS, the cluster LiteLLM (the model endpoint stays direct:
# x/agentplane/app/README.md), and the egress proxy's listener, which the sidecar
# relays to; their port 7000 is open only to Pods in this namespace (the
# integration app). Nothing else in either direction: everything outside the
# cluster is reached through the proxy or not at all. The runner container can
# open TCP to the proxy too - it shares the Pod's identity with the sidecar - but
# without the sidecar's token the proxy refuses it (the ADR's accepted limit).
# Services are admitted on their container port (LiteLLM 4000, proxy 8888) -
# cluster/docs/cilium_network_policy.md § Egress to a ClusterIP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-runner
  namespace: agentplane-staging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-runner
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: litellm
            k8s:app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-egress
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
---
# The app takes browser traffic straight from the gateway and reaches DNS, the
# API server for the inventory, Authentik over its public origin for the OIDC
# handshake, the runner Pods on 7000, the egress proxy's admin port for
# /decisions, and its trajectory store.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-app
  namespace: agentplane-staging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-app
  ingress:
    # cilium-envoy is hostNetwork and its egress to a backend Pod carries the reserved:ingress
    # identity -- not the gateway's namespace, not host, not remote-node
    # (cluster/docs/cilium_network_policy.md § Gateway API backends).
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # Discovery, the token exchange and userinfo, against the issuer's public origin
    # (https://auth.allegedly.works) -- the same URL the browser is redirected to, which is what
    # the discovery document names and the app pins. That resolves to the gateway's address, so
    # the hop lands on a node's hostNetwork Envoy rather than on the authentik Pod: hence host and
    # remote-node beside world, as the egress proxy next door already found (../egress/networkpolicy.yaml).
    - toEntities:
        - world
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-runner
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-egress
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            k8s:cnpg.io/cluster: agentplane-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
