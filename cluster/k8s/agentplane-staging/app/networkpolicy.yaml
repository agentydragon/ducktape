# Runner Pods reach DNS and the egress proxy's listener, which the sidecar relays
# to; their port 7000 is open only to Pods in this namespace (the integration
# app). Nothing else in either direction, the model endpoint included: the authenticated LLM
# ingress is reached through the proxy, and it alone holds the LiteLLM key
# (x/agentplane/llm_ingress/README.md). The runner container can open TCP to the proxy
# too - it shares the Pod's identity with the sidecar - but without the sidecar's
# token the proxy refuses it (the ADR's accepted limit). The proxy is admitted on
# its container port 8888 - cluster/docs/cilium_network_policy.md § Egress to a
# ClusterIP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-runner
  namespace: agentplane-staging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-runner
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-egress
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
---
# The app takes browser traffic straight from the gateway and reaches DNS, the
# API server for the inventory, Authentik over its public origin for the OIDC
# handshake, the runner Pods on 7000, the egress proxy's admin port for
# /decisions, and its trajectory store.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-app
  namespace: agentplane-staging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-app
  ingress:
    # cilium-envoy is hostNetwork and its egress to a backend Pod carries the reserved:ingress
    # identity -- not the gateway's namespace, not host, not remote-node
    # (cluster/docs/cilium_network_policy.md § Gateway API backends).
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # Public Authentik origin resolves to hostNetwork Gateway node IPs. FQDN/CIDR
    # selectors cannot match those identities with the cluster's current Cilium
    # configuration. TLS SNI restricts the node:443 rule to this one origin;
    # TLS remains end-to-end (no terminatingTLS secret or MITM).
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - auth.allegedly.works
    # Gateway Service traffic is checked against the selected backend, with
    # the client's original SNI. See cluster/debug/agentplane_oidc/gateway_service_probe.md.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            app.kubernetes.io/name: authentik
            app.kubernetes.io/instance: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
          serverNames:
            - auth.allegedly.works
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-runner
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-egress
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Separate BFF/operator transport boundary. The Action Service still requires its own configured
    # operator authenticator; network reachability grants no review authority.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-actions
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            k8s:cnpg.io/cluster: agentplane-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
