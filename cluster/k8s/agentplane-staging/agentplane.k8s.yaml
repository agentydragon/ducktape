metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: agentplane-egress
  name: agentplane-egress
  namespace: agentplane-staging
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-egress-deployment-c84e690f
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-egress
        cdk8s.io/metadata.addr: agentplane-egress-deployment-c84e690f
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hil-ovh
      automountServiceAccountToken: true
      containers:
        - args:
            - --rules-namespace=agentplane-staging
            - --credentials-namespace=agentplane-staging-egress-credentials
            - --listen-port=8888
            - --admin-port=8081
            - --agent-api-port=8082
            - --ca-cert=/etc/agentplane-egress/ca/tls.crt
            - --ca-key=/etc/agentplane-egress/ca/tls.key
            - --confdir=/var/lib/agentplane-egress
            - --upstream-ca-file=/etc/agentplane-egress/upstream-ca/ca-certificates.crt
            - --token-audience=agentplane-egress
          env:
            - name: AGENTPLANE_EGRESS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: postgres-egress
            - name: AGENTPLANE_EGRESS_CONFIG_FILE
              value: /etc/agentplane-egress/settings.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-egress:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
          name: proxy
          ports:
            - containerPort: 8888
              name: proxy
              protocol: TCP
            - containerPort: 8081
              name: admin
              protocol: TCP
            - containerPort: 8082
              name: agent-api
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/agentplane-egress/ca
              name: ca
              readOnly: true
            - mountPath: /etc/agentplane-egress/upstream-ca
              name: upstream-ca
              readOnly: true
            - mountPath: /var/lib/agentplane-egress
              name: confdir
            - mountPath: /etc/agentplane-egress/settings.yaml
              name: configmap-agentplane-egress-settings
              readOnly: true
              subPath: settings.yaml
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      initContainers:
        - env:
            - name: AGENTPLANE_EGRESS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: postgres-egress
          image: git.allegedly.works/ducktape-ci/agentplane-egress-migrate:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-egress
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - name: ca
          secret:
            secretName: agentplane-egress-ca
        - configMap:
            name: agentplane-staging-egress-upstream-ca
          name: upstream-ca
        - emptyDir: {}
          name: confdir
        - configMap:
            name: agentplane-egress-settings
          name: configmap-agentplane-egress-settings
---
apiVersion: v1
kind: Service
metadata:
  name: agentplane-egress
  namespace: agentplane-staging
spec:
  externalIPs: []
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8082
    - name: proxy
      port: 8888
      protocol: TCP
      targetPort: 8888
  selector:
    cdk8s.io/metadata.addr: agentplane-egress-deployment-c84e690f
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: agentplane-egress-admin
  namespace: agentplane-staging
spec:
  externalIPs: []
  ports:
    - name: admin
      port: 8081
      protocol: TCP
      targetPort: 8081
  selector:
    cdk8s.io/metadata.addr: agentplane-egress-deployment-c84e690f
  type: ClusterIP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-egress
  namespace: agentplane-staging
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: postgres
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-egress
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-llm-ingress
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-actions
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: forgejo
            k8s:io.kubernetes.pod.namespace: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEntities:
        - world
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-egress
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-runner
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-app
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-egress
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentplane-egress
  namespace: agentplane-staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplane-egress
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: agentplane-workload
  namespace: agentplane-staging
spec:
  description: The calling Sandbox Pod's short-lived, Pod-bound workload identity for first-party Agentplane destinations. It conveys no LiteLLM credential or operator, Agent, or Thread authority.
  source:
    authenticatedWorkloadToken: {}
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: github-pat
  namespace: agentplane-staging
spec:
  description: A GitHub personal access token belonging to the bot account agentydragon-agent. Requests carrying it act as that account and are attributable to it. The proxy does not narrow what the token itself may do — the rule's hosts and methods are the only limit it adds, so treat anything the token can reach on those hosts as reachable.
  source:
    secretRef:
      name: agentplane-github-pat
      key: token
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
    - header: Authorization
      method: basicPassword
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: kubernetes-workload
  namespace: agentplane-staging
spec:
  description: "The calling Sandbox Pod's own ServiceAccount, minted for the Kubernetes API server rather than for this proxy. Requests carrying it are authorized by the API server as that account and by nothing here: what the sandbox may do is the RBAC bound to it, and this proxy adds only the rule's hosts, methods and paths on top."
  source:
    projectedWorkloadToken:
      audience: https://localhost:7445
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: basic
  namespace: agentplane-staging
spec:
  rules:
    - hosts:
        - agentplane-llm-ingress.agentplane-staging.svc.cluster.local
      methods:
        - GET
        - POST
      clusterInternal: true
      credentialRef:
        name: agentplane-workload
    - hosts:
        - agentplane-actions.agentplane-staging.svc.cluster.local
      methods:
        - GET
        - POST
      paths:
        - /mcp
        - /openapi.json
        - /v1/action-groups
        - /v1/action-groups/**
        - /v1/action-policy
        - /v1/action-requests
        - /v1/action-requests/**
      clusterInternal: true
      credentialRef:
        name: agentplane-workload
    - hosts:
        - agentplane-egress.agentplane-staging.svc.cluster.local
      methods:
        - GET
      paths:
        - /openapi.json
        - /v1/rules
      clusterInternal: true
      credentialRef:
        name: agentplane-workload
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: kubernetes
  namespace: agentplane-staging
spec:
  rules:
    - hosts:
        - kubernetes.default.svc.cluster.local
      clusterInternal: true
      credentialRef:
        name: kubernetes-workload
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: packages
  namespace: agentplane-staging
spec:
  rules:
    - hosts:
        - pypi.org
        - files.pythonhosted.org
        - registry.npmjs.org
        - nodejs.org
        - index.crates.io
        - static.crates.io
        - static.rust-lang.org
        - releases.bazel.build
        - bcr.bazel.build
        - cache.nixos.org
        - nixos.org
        - channels.nixos.org
        - ftp.gnu.org
        - snapshot.debian.org
        - code.forgejo.org
        - data.forgejo.org
        - ghcr.io
        - pkg-containers.githubusercontent.com
      methods:
        - GET
        - HEAD
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: github-public
  namespace: agentplane-staging
spec:
  rules:
    - hosts:
        - api.github.com
        - github.com
        - "*.githubusercontent.com"
      methods:
        - GET
        - POST
      credentialRef:
        name: github-pat
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: agentplane-staging
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
