apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: Agentplane staging - sandboxed runner Pods (one per Sandbox) and the integration app that drives them.
  labels:
    goldilocks.fairwinds.com/enabled: "false"
    name: agentplane-staging
    rbac.ducktape.io/agent-readable-logs: "true"
  name: agentplane-staging
spec: {}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agentplane-staging-quota
  namespace: agentplane-staging
spec:
  hard:
    limits.cpu: "12"
    limits.memory: 24Gi
    requests.cpu: "4"
    requests.memory: 8Gi
    requests.storage: 80Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: agentplane-staging-limits
  namespace: agentplane-staging
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 10m
        memory: 16Mi
      type: Container
    - max:
        cpu: "4"
        memory: 8Gi
      type: Pod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentplane-app-config
  namespace: agentplane-staging
data:
  config.yaml: |
    models:
      HARNESS_CLAUDE:
        - anthropic-max20/ant-messages/claude-opus-5
        - anthropic-max20/ant-messages/claude-sonnet-5
        - anthropic-max20/ant-messages/claude-fable-5
        - anthropic-max20/ant-messages/claude-haiku-4-5-20251001
      HARNESS_CODEX:
        - chatgpt/oai-responses/gpt-6-astra
        - chatgpt/oai-responses/gpt-5.4
        - chatgpt/oai-responses/gpt-5.5
        - chatgpt/oai-responses/gpt-5.6-sol
        - chatgpt/oai-responses/gpt-5.6-terra
        - chatgpt/oai-responses/gpt-5.6-luna
    agent_egress_api_url: http://agentplane-egress.agentplane-staging.svc.cluster.local
    agent_actions_service_url: http://agentplane-actions.agentplane-staging.svc.cluster.local:8080
    thread_presets:
      public-coder-codex:
        title: Public coder / Codex
        harness: HARNESS_CODEX
        model: chatgpt/oai-responses/gpt-5.6-luna
        cwd: /state/workspaces/{session_id}
        reasoning_effort: medium
        instructions: Work as a public-repository coding agent. Keep private cluster data out of the workspace and outputs.
    sandbox_presets:
      public-coder:
        title: Public coder
        template: agentplane-runner
        policies:
          - basic
          - github-public
        action_policy_sets:
          - public-github-reads
          - public-ducktape-reads
          - public-ducktape-fork-reads
          - public-gaffer-private-reads
        thread_preset: public-coder-codex
        bootstrap: |
          marker=/state/workspaces/.agentplane-public-coder-ready
          mkdir -p /state/workspaces
          if [ ! -f "$marker" ]; then
            printf '%s\n' 'public-coder workspace initialized' > "$marker"
          fi
    default_policies:
      - basic
    egress_admin_url: http://agentplane-egress-admin.agentplane-staging.svc:8081
    action_federation:
      mode: exchange
      service_url: http://agentplane-actions.agentplane-staging.svc.cluster.local:8080
      token_endpoint: https://auth.allegedly.works/application/o/token/
      login_jwks_uri: https://auth.allegedly.works/application/o/agentplane/jwks/
      target:
        issuer: https://auth.allegedly.works/application/o/agentplane-actions/
        audience: agentplane-actions
        jwks_uri: https://auth.allegedly.works/application/o/agentplane-actions/jwks/
      scope: openid
immutable: false
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgres-actions-generator
  namespace: agentplane-staging
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-actions
  namespace: agentplane-staging
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: Password
          name: postgres-actions-generator
  refreshInterval: 8760h
  target:
    name: postgres-actions
    template:
      data:
        dbname: actions
        host: postgres-rw.agentplane-staging.svc
        password: "{{ .password }}"
        port: "5432"
        uri: postgresql://actions:{{ .password }}@postgres-rw.agentplane-staging.svc:5432/actions
        username: actions
      type: kubernetes.io/basic-auth
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgres-egress-generator
  namespace: agentplane-staging
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-egress
  namespace: agentplane-staging
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: Password
          name: postgres-egress-generator
  refreshInterval: 8760h
  target:
    name: postgres-egress
    template:
      data:
        dbname: egress
        host: postgres-rw.agentplane-staging.svc
        password: "{{ .password }}"
        port: "5432"
        uri: postgresql://egress:{{ .password }}@postgres-rw.agentplane-staging.svc:5432/egress
        username: egress
      type: kubernetes.io/basic-auth
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgres-electric-generator
  namespace: agentplane-staging
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-electric
  namespace: agentplane-staging
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: Password
          name: postgres-electric-generator
  refreshInterval: 8760h
  target:
    name: postgres-electric
    template:
      data:
        dbname: app
        host: postgres-rw.agentplane-staging.svc
        password: "{{ .password }}"
        port: "5432"
        uri: postgresql://electric:{{ .password }}@postgres-rw.agentplane-staging.svc:5432/app
        username: electric
      type: kubernetes.io/basic-auth
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: agentplane-staging
spec:
  affinity:
    enablePodAntiAffinity: true
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
          weight: 100
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: preferred
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: app
      owner: app
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  managed:
    roles:
      - ensure: present
        login: true
        name: actions
        passwordSecret:
          name: postgres-actions
      - ensure: present
        login: true
        name: egress
        passwordSecret:
          name: postgres-egress
      - ensure: present
        login: true
        name: electric
        passwordSecret:
          name: postgres-electric
        replication: true
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      max_slot_wal_keep_size: 512MB
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 5Gi
    storageClass: local-path-ovh-ssd
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: actions
  namespace: agentplane-staging
spec:
  cluster:
    name: postgres
  databaseReclaimPolicy: delete
  name: actions
  owner: actions
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: egress
  namespace: agentplane-staging
spec:
  cluster:
    name: postgres
  databaseReclaimPolicy: delete
  name: egress
  owner: egress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentplane-electric-storage
  namespace: agentplane-staging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: seaweedfs-ovh
  volumeMode: Filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: agentplane-electric
  name: agentplane-electric
  namespace: agentplane-staging
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-electric-deployment-c86a4b11
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-electric
        cdk8s.io/metadata.addr: agentplane-electric-deployment-c86a4b11
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hil-ovh
      automountServiceAccountToken: false
      containers:
        - env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-electric
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-electric
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-electric
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-electric
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: postgres-electric
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
            - name: ELECTRIC_INSECURE
              value: "true"
            - name: ELECTRIC_PORT
              value: "3000"
            - name: ELECTRIC_STORAGE
              value: fast_file
            - name: ELECTRIC_STORAGE_DIR
              value: /var/lib/electric
            - name: ELECTRIC_PERSISTENT_STATE
              value: file
            - name: ELECTRIC_MANUAL_TABLE_PUBLISHING
              value: "true"
            - name: ELECTRIC_REPLICATION_STREAM_ID
              value: agentplane_conversation
            - name: ELECTRIC_MAX_SHAPES
              value: "1024"
          image: docker.io/electricsql/electric:1.8.1@sha256:9b4cebe2d8f51fb3ebaeb156e443ba09deaa7c9e731f146e81f7e48238bae211
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
          name: electric
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /var/lib/electric
              name: pvc-agentplane-electric-storage
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: Always
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      volumes:
        - name: pvc-agentplane-electric-storage
          persistentVolumeClaim:
            claimName: agentplane-electric-storage
            readOnly: false
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: agentplane-electric
  name: agentplane-electric
  namespace: agentplane-staging
spec:
  externalIPs: []
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    cdk8s.io/metadata.addr: agentplane-electric-deployment-c86a4b11
  type: ClusterIP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-electric
  namespace: agentplane-staging
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: postgres
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-electric
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-app
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
