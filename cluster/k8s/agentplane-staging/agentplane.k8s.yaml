apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: agentplane-runner
  namespace: agentplane-staging
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-runner
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --state-dir
            - /state
            - --listen
            - 0.0.0.0:7000
            - --claude-binary
            - /usr/local/bin/claude
            - --anthropic-base-url
            - $(LITELLM_URL)
            - --codex-binary
            - /opt/codex/bin/codex
            - --openai-base-url
            - $(LITELLM_URL)/v1
            - --harness-env
            - HOME
            - --harness-env
            - PATH
            - --harness-env
            - HTTP_PROXY
            - --harness-env
            - HTTPS_PROXY
            - --harness-env
            - http_proxy
            - --harness-env
            - https_proxy
            - --harness-env
            - NO_PROXY
            - --harness-env
            - no_proxy
            - --harness-env
            - SSL_CERT_FILE
            - --harness-env
            - NODE_EXTRA_CA_CERTS
            - --harness-env
            - CURL_CA_BUNDLE
            - --harness-env
            - GIT_SSL_CAINFO
            - --harness-env
            - REQUESTS_CA_BUNDLE
          env:
            - name: LITELLM_URL
              value: http://agentplane-llm-ingress.agentplane-staging.svc.cluster.local:8080
            - name: HTTP_PROXY
              value: http://127.0.0.1:3128
            - name: HTTPS_PROXY
              value: http://127.0.0.1:3128
            - name: http_proxy
              value: http://127.0.0.1:3128
            - name: https_proxy
              value: http://127.0.0.1:3128
            - name: NO_PROXY
              value: 127.0.0.1,localhost
            - name: no_proxy
              value: 127.0.0.1,localhost
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-certificates.crt
            - name: CURL_CA_BUNDLE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: GIT_SSL_CAINFO
              value: /etc/ssl/certs/ca-certificates.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: ANTHROPIC_AUTH_TOKEN
              value: agentplane-credential-agentplane-workload
            - name: OPENAI_API_KEY
              value: agentplane-credential-agentplane-workload
          image: git.allegedly.works/ducktape-ci/agentplane-runner:unset
          name: runner
          ports:
            - containerPort: 7000
              name: runner
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /state
              name: state
            - mountPath: /etc/ssl/certs/ca-certificates.crt
              name: egress-ca
              readOnly: true
              subPath: ca-certificates.crt
        - env:
            - name: AGENTPLANE_EGRESS_SIDECAR_PROXY_HOST
              value: agentplane-egress.agentplane-staging.svc.cluster.local
            - name: AGENTPLANE_EGRESS_SIDECAR_PROXY_PORT
              value: "8888"
            - name: AGENTPLANE_EGRESS_SIDECAR_LISTEN_PORT
              value: "3128"
            - name: AGENTPLANE_EGRESS_SIDECAR_TOKEN_FILE
              value: /var/run/agentplane-egress/token
            - name: AGENTPLANE_EGRESS_SIDECAR_AUDIENCE_TOKEN_FILES
              value: '{"https://localhost:7445": "/var/run/agentplane-egress/kubernetes-token"}'
          image: git.allegedly.works/ducktape-ci/agentplane-egress-sidecar:unset
          name: egress-sidecar
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /var/run/agentplane-egress
              name: egress-token
              readOnly: true
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-runner
      terminationGracePeriodSeconds: 60
      volumes:
        - configMap:
            name: agentplane-egress-ca
          name: egress-ca
        - name: egress-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentplane-egress
                  expirationSeconds: 600
                  path: token
              - serviceAccountToken:
                  audience: https://localhost:7445
                  expirationSeconds: 600
                  path: kubernetes-token
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: local-path-ovh-hdd
  volumeClaimTemplatesPolicy: Overrides
