    - namespaces:
        - agentplane-staging-egress-credentials
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-creds-reader
      remoteNamespace: haku-sandbox
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-forgejo-git
  namespace: agentplane-staging-egress-credentials
spec:
  data:
    - remoteRef:
        key: haku-forgejo-git
        property: password
      secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-agentplane-staging-forgejo-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: haku-forgejo-git
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: forgejo-haku
  namespace: agentplane-staging
spec:
  description: "The password of the `haku` account on the internal Forgejo, the service user that owns haku-state and haku's mirrors. Requests carrying it act as that account with its full authority -- it is the account's own password, not a scoped token, so it reaches every repository haku can reach and the web UI besides. The proxy narrows nothing but the host: treat a sandbox bound to this as holding haku's Forgejo account."
  source:
    secretRef:
      name: haku-forgejo-git
      key: password
  targets:
    - header: Authorization
      method: basicPassword
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: forgejo-haku
  namespace: agentplane-staging
spec:
  rules:
    - hosts:
        - forgejo-http.forgejo.svc.cluster.local
      clusterInternal: true
      credentialRef:
        name: forgejo-haku
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: google-readonly
  namespace: agentplane-staging
spec:
  description: "A Google OAuth access token minted and refreshed by Airlock (cluster/k8s/agents/airlock), mirrored into this namespace by ESO: the token of Airlock's `google` provider, whose scopes are all `.readonly` (Gmail, Calendar, Drive, Drive Activity, Tasks, Contacts, Docs, Sheets, Slides, YouTube). What the token was actually granted is whatever the operator consented to at Airlock, which can be narrower than that list -- an API outside it answers 403 `insufficientPermissions`. `google-readonly`'s rules restrict where the proxy presents it."
  source:
    secretRef:
      name: google-access-token
      key: access_token
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: google-readonly
  namespace: agentplane-staging
spec:
  rules:
    - hosts:
        - gmail.googleapis.com
        - tasks.googleapis.com
        - people.googleapis.com
        - docs.googleapis.com
        - sheets.googleapis.com
        - slides.googleapis.com
        - youtube.googleapis.com
      methods:
        - GET
      credentialRef:
        name: google-readonly
    - hosts:
        - www.googleapis.com
      methods:
        - GET
      paths:
        - /calendar/v3/**
        - /drive/v3/**
        - /youtube/v3/**
      credentialRef:
        name: google-readonly
    - hosts:
        - driveactivity.googleapis.com
      methods:
        - POST
      paths:
        - /v2/activity:query
      credentialRef:
        name: google-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-staging-egress-grocy-sf-reader
  namespace: agents-infra
rules:
  - apiGroups:
      - ""
    resourceNames:
      - agentplane-grocy-sf-readonly
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-staging-egress-grocy-sf-reader
  namespace: agents-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-staging-egress-grocy-sf-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: external-creds-reader
    namespace: agentplane-staging-egress-credentials
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-agentplane-staging-grocy-sf-secret-store
spec:
  conditions:
    - namespaces:
        - agentplane-staging-egress-credentials
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-creds-reader
      remoteNamespace: agents-infra
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grocy-sf-readonly
  namespace: agentplane-staging-egress-credentials
spec:
  data:
    - remoteRef:
        key: agentplane-grocy-sf-readonly
        property: password
      secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-agentplane-staging-grocy-sf-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: grocy-sf-readonly
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: grocy-sf-readonly
  namespace: agentplane-staging
spec:
  description: The app password of `agentplane-grocy-sf-readonly`, an Authentik service account admitted to the grocy-sf application (tf/gitops/agent-machine-access/grocy-sf.tf), copied into this namespace by ESO. Send it as HTTP Basic under that username. Grocy knows the account as a user with no permissions, and `grocy-sf-readonly`'s rule presents the password only on GETs to Grocy's read routes.
  source:
    secretRef:
      name: grocy-sf-readonly
      key: password
  targets:
    - header: Authorization
      method: basicPassword
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: grocy-sf-readonly
  namespace: agentplane-staging
spec:
  rules:
    - hosts:
        - grocy-sf.allegedly.works
      methods:
        - GET
      paths:
        - /api/objects/**
        - /api/stock/**
        - /api/user
        - /api/system/info
        - /api/system/db-changed-time
        - /api/files/**
      credentialRef:
        name: grocy-sf-readonly
