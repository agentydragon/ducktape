apiVersion: v1
kind: ConfigMap
metadata:
  name: agentplane-actions-settings
  namespace: agentplane-staging
data:
  settings.yaml: |
    operator_oidc:
      issuer: https://auth.allegedly.works/application/o/agentplane-actions/
      audience: agentplane-actions
      jwks_uri: https://auth.allegedly.works/application/o/agentplane-actions/jwks/
    allowed_service_account_namespaces:
      - agentplane-staging
    web_push:
      subject: mailto:agentydragon@gmail.com
      public_base_url: https://agentplane-staging.allegedly.works
      allowed_push_hosts:
        - fcm.googleapis.com
        - updates.push.services.mozilla.com
    mcp_servers:
      github:
        server_id: github
        server_url: https://api.githubcopilot.com/mcp/
        client_id: configured-by-secret
        client_secret_file: /etc/agentplane-github/client_secret
        redirect_uri: https://agentplane-staging.allegedly.works/mcp-linkage/callback
      kubernetes:
        server_id: kubernetes
        server_url: https://kubectl-passthrough-mcp.allegedly.works/mcp
        client_id: kubectl-passthrough-mcp
        redirect_uri: https://agentplane-staging.allegedly.works/mcp-linkage/callback
      grocy_sf:
        server_id: grocy_sf
        server_url: https://grocy-mcp-sf.allegedly.works/mcp
        client_id: cb57e244-c13c-4eac-a299-e052698b774e
        redirect_uri: https://agentplane-staging.allegedly.works/mcp-linkage/callback
    action_groups:
      github:
        title: GitHub MCP
        description: GitHub's operator-linked MCP tools; every Action remains subject to operator approval.
        executor:
          kind: mcp
          description: GitHub MCP executed with the linked operator GitHub account.
          config:
            transport: streamable-http
            url: https://api.githubcopilot.com/mcp/
            server_id: github
            auth: oauth
      kubernetes:
        title: Kubernetes MCP
        description: Kubernetes passthrough MCP tools; every Action remains subject to operator approval.
        executor:
          kind: mcp
          description: Kubernetes MCP executed with the linked operator Kubernetes identity.
          config:
            transport: streamable-http
            url: https://kubectl-passthrough-mcp.allegedly.works/mcp
            server_id: kubernetes
            auth: oauth
      grocy_sf:
        title: Grocy SF MCP
        description: Grocy SF household MCP tools; every Action remains subject to operator approval.
        executor:
          kind: mcp
          description: Grocy SF MCP executed with the linked operator Grocy account.
          config:
            transport: streamable-http
            url: https://grocy-mcp-sf.allegedly.works/mcp
            server_id: grocy_sf
            auth: oauth
      sandbox:
        title: Sandbox
        description: Sandboxes that run as the calling ServiceAccount, and bounded commands in them. A sandbox reaches what its caller's EgressBindings allow and is admitted back to this service as that same caller, so it confers no authority the caller did not hold.
        executor:
          kind: sandbox
          description: Stamped and exec'd by this service, as the caller, in its own namespace.
          namespace: agentplane-staging
          environments:
            runner:
              template: agentplane-runner
              container: runner
              default_cwd: /state
              description: "The shared runner image: python, git and the agent harnesses."
          default_environment: runner
      ssh:
        title: SSH
        description: SSH commands on configured targets; every Action remains subject to operator approval.
        executor:
          kind: mcp
          description: Standalone SSH MCP backend; Agentplane retains approval and execution authority.
          config:
            transport: streamable-http
            url: http://ssh-mcp.ssh-mcp.svc.cluster.local:8080/mcp
            auth: static_bearer
            bearer_file: /run/secrets/ssh-mcp/bearer-token
      home_assistant:
        title: Home Assistant MCP
        description: Home Assistant tools; every Action remains subject to operator approval.
        executor:
          kind: mcp
          description: Standalone Home Assistant MCP backend (ha-mcp).
          config:
            transport: streamable-http
            url: http://ha-mcp.ha-mcp.svc.cluster.local:8765/mcp
            auth: static_bearer
            bearer_file: /run/secrets/ha-mcp/bearer-token
      tana:
        title: Tana MCP
        description: Tana read/write tools; every Action remains subject to operator approval.
        executor:
          kind: mcp
          description: Standalone Tana MCP backend (tana-mcp).
          config:
            transport: streamable-http
            url: http://tana-mcp.tana-mcp.svc.cluster.local:8263/mcp
            auth: static_bearer
            bearer_file: /run/secrets/tana-mcp/bearer-token
      gmail:
        title: Gmail
        description: Gmail read/write tools; every Action remains subject to operator approval.
        executor:
          kind: mcp
          description: Standalone Gmail MCP backend (google-mcp), on a write-scoped Google credential.
          config:
            transport: streamable-http
            url: http://google-mcp.google-mcp.svc.cluster.local:8080/gmail/mcp
            auth: static_bearer
            bearer_file: /run/secrets/google-mcp/bearer-token
      google_calendar:
        title: Google Calendar
        description: Google Calendar read/write tools; every Action remains subject to operator approval.
        executor:
          kind: mcp
          description: Standalone Google Calendar MCP backend (google-mcp), on a write-scoped Google credential.
          config:
            transport: streamable-http
            url: http://google-mcp.google-mcp.svc.cluster.local:8080/calendar/mcp
            auth: static_bearer
            bearer_file: /run/secrets/google-mcp/bearer-token
immutable: false
