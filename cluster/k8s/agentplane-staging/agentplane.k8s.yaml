            value: /mcp
        - path:
            type: Exact
            value: /.well-known/oauth-authorization-server
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
        - path:
            type: Exact
            value: /register
        - path:
            type: Exact
            value: /authorize
        - path:
            type: Exact
            value: /token
        - path:
            type: Exact
            value: /revoke
        - path:
            type: Exact
            value: /auth/callback
      timeouts:
        backendRequest: 3600s
        request: 3600s
