# Subjects are the Haku and public-coder agent identities plus the interactive
# kubectl sandbox group. The public-coder subject is intentionally explicit here
# because this Role grants staging Sandbox lifecycle and TokenRequest access,
# beyond the read-only diagnostics bindings generated by Kyverno.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-agentplane-operator
  namespace: agentplane-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-operator
subjects:
  - kind: Group
    name: oidc-ksbx-groups:haku
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: haku:access-profile:haku
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: haku:access-profile:public-coder
    apiGroup: rbac.authorization.k8s.io
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - kind: Group
    name: oidc-ksbx-groups:kubectl-sandbox-users
    apiGroup: rbac.authorization.k8s.io
