# Subjects are the Haku agent's identities and the interactive kubectl sandbox
# group, as the generate-agent-diagnostics-readers Kyverno policy
# (cluster/k8s/kyverno/policies/) names them; the public-coder lane is left
# out, since it has no business in staging runners.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-agentplane-operator
  namespace: agentplane-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-operator
subjects:
  - kind: Group
    name: oidc-ksbx-groups:haku
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: haku:access-profile:haku
    apiGroup: rbac.authorization.k8s.io
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - kind: Group
    name: oidc-ksbx-groups:kubectl-sandbox-users
    apiGroup: rbac.authorization.k8s.io
