# What an agent needs to test Agentplane on staging without an operator:
# create and delete Sandboxes, suspend and resume them (patch), exec into
# and port-forward to runner Pods. Reads of metadata and logs come from the
# Kyverno-generated bindings the namespace label opts into; the pod verbs here
# are what exec and port-forward need beyond that.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-operator
  namespace: agentplane-staging
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates"]
    verbs: ["get"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # The credential the agent presents to the app's API, at
  # https://agentplane-staging.allegedly.works: a token scoped to the app's audience, which
  # TokenReview resolves to system:serviceaccount:agentplane-staging:agentplane-agent. Minting it
  # is not assuming that account -- it holds no RoleBinding, so the token is an identity for the
  # app and nothing in the cluster (../app/serviceaccount-agentplane-agent.yaml).
  #
  #   TOKEN=$(kubectl -n agentplane-staging create token agentplane-agent --audience=agentplane)
  #   curl -H "Authorization: Bearer $TOKEN" https://agentplane-staging.allegedly.works/sandboxes
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["agentplane-agent"]
    verbs: ["create"]
