# What an agent needs to test Agentplane on staging without an operator:
# create and delete Sandboxes, suspend and resume them (patch), exec into
# and port-forward to runner Pods. Reads of metadata and logs come from the
# Kyverno-generated bindings the namespace label opts into; the pod verbs here
# are what exec and port-forward need beyond that.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-operator
  namespace: agentplane-staging
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates"]
    verbs: ["get"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # The app's API, through the API server's service proxy: the agent's kubeconfig goes through a
  # proxy that cannot upgrade connections, so port-forward and exec are not a path to it. The
  # proxy subresource is addressed by the bare Service name or with a port number or port name
  # appended, so all three spellings are named. The verbs are the HTTP methods the app's API takes:
  # GET for reads and event streams, POST to create sandboxes and sessions, send inputs, and
  # suspend or resume, DELETE for the sandboxes the agent made.
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["agentplane-app", "agentplane-app:8080", "agentplane-app:http"]
    verbs: ["get", "create", "delete"]
