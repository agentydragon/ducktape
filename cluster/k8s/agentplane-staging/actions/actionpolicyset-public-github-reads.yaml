# The console's `public_github_reads` policy (cluster/k8s/haku/console/config.yaml) as an Action
# Service set; a binding attaches it to a caller, on its own it grants nothing.
#
# Any repository confirmed genuinely public — not bounded to a fixed owner/repo allowlist.
# `type: github_public_repository` positively confirms the target repository's visibility with a
# live, unauthenticated GitHub API call before approving (see github_policy/repository.py) rather
# than inferring "public" from the absence of a restriction: the operator's GitHub OAuth token
# behind the `github` ActionGroup can also reach private repos it can see
# (agentydragon/gaffer-private included), so a bare owner/repo match here would let a call read
# any of those just by naming it. The target repository is derived the same way as the
# repository-scoped sets (owner/repo arguments and no query-level `repo:` qualifier for
# search_pull_requests; one unquoted `repo:owner/repo` qualifier for search_code), then checked for
# public visibility instead of compared against a configured pair. Same tool list as the
# repository-scoped sets — get_job_logs included.
apiVersion: agentplane.allegedly.works/v1alpha1
kind: ActionPolicySet
metadata:
  name: public-github-reads
  namespace: agentplane-staging
  annotations:
    description: Reviewed GitHub reads of any repository a live unauthenticated lookup confirms public.
spec:
  autoApproveIf:
    - type: github_public_repository
      actions:
        github:
          - actions_get
          - actions_list
          - find_duplicate
          - get_commit
          - get_file_blame
          - get_file_contents
          - get_job_logs
          - get_label
          - get_latest_release
          - get_release_by_tag
          - get_tag
          - issue_dependency_read
          - issue_read
          - list_branches
          - list_commits
          - list_issue_fields
          - list_issue_types
          - list_issues
          - list_pull_requests
          - list_releases
          - list_repository_collaborators
          - list_tags
          - pull_request_read
          - search_issues
          - search_pull_requests
          - search_code
