# Destination-side SandboxPrincipal resolution: TokenReview proves the Pod-bound bearer, then the
# live Pod owner reference proves the Sandbox. No Thread/Agent reads and no Secrets. The policy
# informer watches the sets and bindings it evaluates and the labeled caller ServiceAccounts, and
# writes back only each object's Ready condition.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-actions
  namespace: agentplane-staging
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentplane.allegedly.works"]
    resources: ["actionpolicysets", "actionpolicybindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentplane.allegedly.works"]
    resources: ["actionpolicysets/status", "actionpolicybindings/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-actions
  namespace: agentplane-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-actions
subjects:
  - kind: ServiceAccount
    name: agentplane-actions
    namespace: agentplane-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentplane-staging-actions-token-reviewer
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentplane-staging-actions-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentplane-staging-actions-token-reviewer
subjects:
  - kind: ServiceAccount
    name: agentplane-actions
    namespace: agentplane-staging
