# Workload calls arrive only from the central egress proxy after exact placeholder substitution.
# The integration app is admitted separately for the session-bound BFF/operator adapter.
# Public traffic arrives through the Gateway's protocol-only HTTPRoute.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-actions
  namespace: agentplane-staging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-actions
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-egress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-app
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: fcm.googleapis.com
        - matchName: updates.push.services.mozilla.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - fcm.googleapis.com
            - updates.push.services.mozilla.com
    # Claude's credentialless CIMD document; no wildcard hosts, ports, or redirects.
    - toFQDNs:
        - matchName: claude.ai
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - claude.ai
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ssh-mcp
            app.kubernetes.io/name: ssh-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            k8s:cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Same public-origin Gateway path as the BFF: only Authentik SNI on node:443.
    # The resolver fetches /application/o/agentplane-actions/jwks/ over HTTPS.
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - auth.allegedly.works
    # GitHub MCP discovery advertises github.com as its OAuth authorization server.
    - toFQDNs:
        - matchName: api.githubcopilot.com
        - matchName: github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - api.githubcopilot.com
            - github.com
    # The Kubernetes MCP server uses the public Gateway/remote-node path.
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - kubectl-passthrough-mcp.allegedly.works
    # Gateway Service traffic is checked against the selected backend, with
    # the client's original SNI. See cluster/docs/cilium_network_policy.md
    # § Egress through the Gateway Service.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            app.kubernetes.io/name: authentik
            app.kubernetes.io/instance: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
          serverNames:
            - auth.allegedly.works
