# The principal a Connection enrolled from the Claude.ai MCP connector acts as, picked by the
# operator at OAuth consent. No Pod runs as it and it holds no RoleBinding: the label is what makes
# it an Action caller, and removing the label or the object is how it is disabled. What it may do
# without an operator is an ActionPolicyBinding naming it; on its own it grants nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-ai
  namespace: agentplane-staging
  labels:
    agentplane.allegedly.works/action-caller: "true"
  annotations:
    description: The principal for Connections enrolled from the Claude.ai MCP connector, selected at OAuth consent.
automountServiceAccountToken: false
