# The console's `public_gaffer_private_reads` policy (cluster/k8s/haku/console/config.yaml) as an
# Action Service set; a binding attaches it to a caller, on its own it grants nothing.
#
# A caller bound here may also inspect the private Gaffer repository. Keep this as a separate
# repository-scoped set so adding one private source does not widen the Ducktape boundary or
# accidentally grant access to other repositories. Both search tools require their policy's
# repository boundary: owner/repo arguments (and no query-level qualifier) for PR searches, or one
# unquoted `repo:agentydragon/gaffer-private` qualifier for code searches.
apiVersion: agentplane.allegedly.works/v1alpha1
kind: ActionPolicySet
metadata:
  name: public-gaffer-private-reads
  namespace: agentplane-staging
  annotations:
    description: Reviewed GitHub reads scoped to the private agentydragon/gaffer-private.
spec:
  autoApproveIf:
    - type: github_repository
      owner: agentydragon
      repository: gaffer-private
      actions:
        github:
          - actions_get
          - actions_list
          - find_duplicate
          - get_commit
          - get_file_blame
          - get_file_contents
          - get_job_logs
          - get_label
          - get_latest_release
          - get_release_by_tag
          - get_tag
          - issue_dependency_read
          - issue_read
          - list_branches
          - list_commits
          - list_issue_fields
          - list_issue_types
          - list_issues
          - list_pull_requests
          - list_releases
          - list_repository_collaborators
          - list_tags
          - pull_request_read
          - search_issues
          - search_pull_requests
          - search_code
