apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentplane-actions
  namespace: agentplane-staging
  labels:
    app.kubernetes.io/name: agentplane-actions
  annotations:
    secret.reloader.stakater.com/reload: agentplane-mcp-oauth,haku-console-github-mcp-client-credentials
    configmap.reloader.stakater.com/reload: agentplane-action-federation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplane-actions
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-actions
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      serviceAccountName: agentplane-actions
      imagePullSecrets:
        - name: forgejo-images-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: git.allegedly.works/ducktape-ci/agentplane-action-service-migrate:devel-20260910201014-a525e23 # {"$imagepolicy": "flux-system:agentplane-action-service-migrate"}
          imagePullPolicy: Always
          env: &database-env
            - name: AGENTPLANE_ACTIONS_OAUTH
              valueFrom:
                secretKeyRef:
                  name: agentplane-mcp-oauth
                  key: oauth
            - name: AGENTPLANE_ACTIONS_MCP_SERVERS__GITHUB__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: haku-console-github-mcp-client-credentials
                  key: client_id
            - name: AGENTPLANE_ACTIONS_OPERATOR_OIDC
              valueFrom:
                configMapKeyRef:
                  name: agentplane-action-federation
                  key: operator-oidc
            - name: AGENTPLANE_ACTIONS_CONFIG_FILE
              value: /etc/agentplane-actions/settings.yaml
            - name: AGENTPLANE_ACTIONS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: agentplane-actions-db-app
                  key: username
            - name: AGENTPLANE_ACTIONS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentplane-actions-db-app
                  key: password
            - name: AGENTPLANE_ACTIONS_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: agentplane-actions-db-app
                  key: host
            - name: AGENTPLANE_ACTIONS_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: agentplane-actions-db-app
                  key: port
            - name: AGENTPLANE_ACTIONS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: agentplane-actions-db-app
                  key: dbname
            - name: AGENTPLANE_ACTIONS_DATABASE_URL
              value: "postgresql://$(AGENTPLANE_ACTIONS_DB_USER):$(AGENTPLANE_ACTIONS_DB_PASSWORD)@$(AGENTPLANE_ACTIONS_DB_HOST):$(AGENTPLANE_ACTIONS_DB_PORT)/$(AGENTPLANE_ACTIONS_DB_NAME)"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext: &container-security
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: actions
          image: git.allegedly.works/ducktape-ci/agentplane-action-service:devel-20260910210141-466d02d # {"$imagepolicy": "flux-system:agentplane-action-service"}
          imagePullPolicy: Always
          args:
            - --host=0.0.0.0
            - --port=8080
            - --token-audience=agentplane-egress
          env: *database-env
          volumeMounts:
            - name: oauth
              mountPath: /etc/agentplane-mcp
              readOnly: true
            - name: github-mcp-client
              mountPath: /etc/agentplane-github
              readOnly: true
            - name: settings
              mountPath: /etc/agentplane-actions
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext: *container-security
      volumes:
        - name: github-mcp-client
          secret:
            secretName: haku-console-github-mcp-client-credentials
            defaultMode: 0440
            items:
              - key: client_secret
                path: client_secret
        - name: oauth
          secret:
            secretName: agentplane-mcp-oauth
            defaultMode: 0440
            items:
              - key: client-secret
                path: client-secret
              - key: jwt-signing-key
                path: jwt-signing-key
              - key: encryption-key
                path: encryption-key
        - name: settings
          configMap:
            name: agentplane-actions-settings
