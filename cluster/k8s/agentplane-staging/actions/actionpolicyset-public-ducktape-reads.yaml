# The console's `public_ducktape_reads` policy (cluster/k8s/haku/console/config.yaml) as an Action
# Service set; a binding attaches it to a caller, on its own it grants nothing.
#
# A caller bound here may inspect this public source repository, but not use the operator's GitHub
# credential to read other public or private repositories. search_pull_requests is safe only with
# its matching owner/repo arguments and no query-level `repo:` qualifier; search_code is safe only
# with one unquoted `repo:agentydragon/ducktape` qualifier. The `github_repository` evaluator
# verifies those distinct boundaries before allowing either search.
apiVersion: agentplane.allegedly.works/v1alpha1
kind: ActionPolicySet
metadata:
  name: public-ducktape-reads
  namespace: agentplane-staging
  annotations:
    description: Reviewed GitHub reads scoped to agentydragon/ducktape.
spec:
  autoApproveIf:
    - type: github_repository
      owner: agentydragon
      repository: ducktape
      actions:
        github:
          - actions_get
          - actions_list
          - find_duplicate
          - get_commit
          - get_file_blame
          - get_file_contents
          - get_job_logs
          - get_label
          - get_latest_release
          - get_release_by_tag
          - get_tag
          - issue_dependency_read
          - issue_read
          - list_branches
          - list_commits
          - list_issue_fields
          - list_issue_types
          - list_issues
          - list_pull_requests
          - list_releases
          - list_repository_collaborators
          - list_tags
          - pull_request_read
          - search_issues
          - search_pull_requests
          - search_code
