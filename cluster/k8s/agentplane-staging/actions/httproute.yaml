# The Actions service owns OAuth and bearer verification; no browser forward-auth hop.
# Keep REST/operator endpoints off this public origin.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentplane-actions-mcp
  namespace: agentplane-staging
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  hostnames:
    - agentplane-actions-staging.allegedly.works
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
        - path:
            type: Exact
            value: /.well-known/oauth-authorization-server
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
        - path:
            type: Exact
            value: /register
        - path:
            type: Exact
            value: /authorize
        - path:
            type: Exact
            value: /token
        - path:
            type: Exact
            value: /revoke
        - path:
            type: Exact
            value: /auth/callback
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: agentplane-actions
          port: 8080
      timeouts:
        request: 3600s
        backendRequest: 3600s
