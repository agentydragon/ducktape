apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentplane-actions
  namespace: agentplane-staging
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentplane-staging-actions-token-reviewer
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentplane-staging-actions-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentplane-staging-actions-token-reviewer
subjects:
  - kind: ServiceAccount
    name: agentplane-actions
    namespace: agentplane-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-actions
  namespace: agentplane-staging
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - actionpolicysets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - actionpolicybindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - actionpolicysets/status
    verbs:
      - patch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - actionpolicybindings/status
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-actions
  namespace: agentplane-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-actions
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: agentplane-actions
    namespace: agentplane-staging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentplane-actions-settings
  namespace: agentplane-staging
data:
  settings.yaml: |
    allowed_service_account_namespaces:
      - agentplane-staging
    web_push:
      subject: mailto:agentydragon@gmail.com
      public_base_url: https://agentplane-staging.allegedly.works
      allowed_push_hosts:
        - fcm.googleapis.com
        - updates.push.services.mozilla.com
    mcp_servers:
      github:
        server_id: github
        provider: github
        server_url: https://api.githubcopilot.com/mcp/
        client_id: configured-by-secret
        client_secret_file: /etc/agentplane-github/client_secret
        redirect_uri: https://agentplane-staging.allegedly.works/mcp-linkage/callback
      kubernetes:
        server_id: kubernetes
        provider: kubernetes
        server_url: https://kubectl-passthrough-mcp.allegedly.works/mcp
        client_id: kubectl-passthrough-mcp
        redirect_uri: https://agentplane-staging.allegedly.works/mcp-linkage/callback
    action_groups:
      github:
        title: GitHub MCP
        description: GitHub's operator-linked MCP tools; every Action remains subject to operator approval.
        executor:
          kind: mcp
          description: GitHub MCP executed with the linked operator GitHub account.
          config:
            transport: streamable-http
            url: https://api.githubcopilot.com/mcp/
            server_id: github
            auth: oauth
      kubernetes:
        title: Kubernetes MCP
        description: Kubernetes passthrough MCP tools; every Action remains subject to operator approval.
        executor:
          kind: mcp
          description: Kubernetes MCP executed with the linked operator Kubernetes identity.
          config:
            transport: streamable-http
            url: https://kubectl-passthrough-mcp.allegedly.works/mcp
            server_id: kubernetes
            auth: oauth
      ssh:
        title: SSH
        description: SSH commands on configured targets; every Action remains subject to operator approval.
        executor:
          kind: mcp
          description: Standalone SSH MCP backend; Agentplane retains approval and execution authority.
          config:
            transport: streamable-http
            url: http://ssh-mcp.ssh-mcp.svc.cluster.local:8080/mcp
            auth: static_bearer
            bearer_file: /run/secrets/ssh-mcp/bearer-token
immutable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    description: OIDC federation configuration for the Agentplane app and Action Service
  name: agentplane-action-federation
  namespace: agentplane-staging
data:
  action-federation: |
    {
      "mode": "exchange",
      "service_url": "http://agentplane-actions.agentplane-staging.svc.cluster.local:8080",
      "token_endpoint": "https://auth.allegedly.works/application/o/token/",
      "login_jwks_uri": "https://auth.allegedly.works/application/o/agentplane/jwks/",
      "target": {
        "issuer": "https://auth.allegedly.works/application/o/agentplane-actions/",
        "audience": "agentplane-actions",
        "jwks_uri": "https://auth.allegedly.works/application/o/agentplane-actions/jwks/"
      },
      "scope": "openid"
    }
  operator-oidc: |
    {
      "issuer": "https://auth.allegedly.works/application/o/agentplane-actions/",
      "audience": "agentplane-actions",
      "jwks_uri": "https://auth.allegedly.works/application/o/agentplane-actions/jwks/"
    }
immutable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    configmap.reloader.stakater.com/reload: agentplane-action-federation,agentplane-actions-settings
    secret.reloader.stakater.com/reload: agentplane-mcp-oauth,haku-console-github-mcp-client-credentials,agentplane-staging-web-push-vapid,ssh-mcp-bearer
  labels:
    app.kubernetes.io/name: agentplane-actions
  name: agentplane-actions
  namespace: agentplane-staging
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-actions-actions-deployment-c8e06651
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-actions
        cdk8s.io/metadata.addr: agentplane-actions-actions-deployment-c8e06651
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hil-ovh
      automountServiceAccountToken: true
      containers:
        - args:
            - --host=0.0.0.0
            - --port=8080
            - --token-audience=agentplane-egress
          env:
            - name: AGENTPLANE_ACTIONS_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DATABASE_URL
              value: postgresql://$(AGENTPLANE_ACTIONS_DB_USER):$(AGENTPLANE_ACTIONS_DB_PASSWORD)@$(AGENTPLANE_ACTIONS_DB_HOST):$(AGENTPLANE_ACTIONS_DB_PORT)/$(AGENTPLANE_ACTIONS_DB_NAME)
            - name: AGENTPLANE_ACTIONS_OPERATOR_OIDC
              valueFrom:
                configMapKeyRef:
                  key: operator-oidc
                  name: agentplane-action-federation
            - name: AGENTPLANE_ACTIONS_CONFIG_FILE
              value: /etc/agentplane-actions/settings.yaml
            - name: AGENTPLANE_ACTIONS_WEB_PUSH__PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  key: private-key-pem
                  name: agentplane-staging-web-push-vapid
            - name: AGENTPLANE_ACTIONS_OAUTH
              valueFrom:
                secretKeyRef:
                  key: oauth
                  name: agentplane-mcp-oauth
            - name: AGENTPLANE_ACTIONS_MCP_SERVERS__GITHUB__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client_id
                  name: haku-console-github-mcp-client-credentials
          image: git.allegedly.works/ducktape-ci/agentplane-action-service:unset
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          name: actions
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/agentplane-mcp
              name: secret-agentplane-mcp-oauth
              readOnly: true
            - mountPath: /etc/agentplane-actions
              name: configmap-agentplane-actions-settings
              readOnly: true
            - mountPath: /etc/agentplane-github
              name: secret-haku-console-github-mcp-client-credentials
              readOnly: true
            - mountPath: /run/secrets/ssh-mcp
              name: secret-ssh-mcp-bearer
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      initContainers:
        - env:
            - name: AGENTPLANE_ACTIONS_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: postgres-actions
            - name: AGENTPLANE_ACTIONS_DATABASE_URL
              value: postgresql://$(AGENTPLANE_ACTIONS_DB_USER):$(AGENTPLANE_ACTIONS_DB_PASSWORD)@$(AGENTPLANE_ACTIONS_DB_HOST):$(AGENTPLANE_ACTIONS_DB_PORT)/$(AGENTPLANE_ACTIONS_DB_NAME)
            - name: AGENTPLANE_ACTIONS_OPERATOR_OIDC
              valueFrom:
                configMapKeyRef:
                  key: operator-oidc
                  name: agentplane-action-federation
            - name: AGENTPLANE_ACTIONS_CONFIG_FILE
              value: /etc/agentplane-actions/settings.yaml
            - name: AGENTPLANE_ACTIONS_WEB_PUSH__PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  key: private-key-pem
                  name: agentplane-staging-web-push-vapid
            - name: AGENTPLANE_ACTIONS_OAUTH
              valueFrom:
                secretKeyRef:
                  key: oauth
                  name: agentplane-mcp-oauth
            - name: AGENTPLANE_ACTIONS_MCP_SERVERS__GITHUB__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client_id
                  name: haku-console-github-mcp-client-credentials
          image: git.allegedly.works/ducktape-ci/agentplane-action-service-migrate:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-actions
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentplane-actions
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      volumes:
        - name: secret-agentplane-mcp-oauth
          secret:
            defaultMode: 288
            items:
              - key: client-secret
                path: client-secret
              - key: encryption-key
                path: encryption-key
              - key: jwt-signing-key
                path: jwt-signing-key
            secretName: agentplane-mcp-oauth
        - configMap:
            name: agentplane-actions-settings
          name: configmap-agentplane-actions-settings
        - name: secret-haku-console-github-mcp-client-credentials
          secret:
            defaultMode: 288
            items:
              - key: client_secret
                path: client_secret
            secretName: haku-console-github-mcp-client-credentials
        - name: secret-ssh-mcp-bearer
          secret:
            items:
              - key: bearer-token
                path: bearer-token
            secretName: ssh-mcp-bearer
---
apiVersion: v1
kind: Service
metadata:
  name: agentplane-actions
  namespace: agentplane-staging
spec:
  externalIPs: []
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    cdk8s.io/metadata.addr: agentplane-actions-actions-deployment-c8e06651
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentplane-actions-mcp
  namespace: agentplane-staging
spec:
  hostnames:
    - agentplane-actions-staging.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  rules:
    - backendRefs:
        - name: agentplane-actions
          port: 8080
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
          type: ResponseHeaderModifier
      matches:
        - path:
            type: Exact
            value: /mcp
        - path:
            type: Exact
            value: /.well-known/oauth-authorization-server
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
        - path:
            type: Exact
            value: /register
        - path:
            type: Exact
            value: /authorize
        - path:
            type: Exact
            value: /token
        - path:
            type: Exact
            value: /revoke
        - path:
            type: Exact
            value: /auth/callback
      timeouts:
        backendRequest: 3600s
        request: 3600s
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-actions
  namespace: agentplane-staging
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: claude.ai
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - claude.ai
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: postgres
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toFQDNs:
        - matchName: fcm.googleapis.com
        - matchName: updates.push.services.mozilla.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - fcm.googleapis.com
            - updates.push.services.mozilla.com
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: ssh-mcp
            k8s:io.kubernetes.pod.namespace: ssh-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - auth.allegedly.works
    - toFQDNs:
        - matchName: api.githubcopilot.com
        - matchName: github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - api.githubcopilot.com
            - github.com
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - api.github.com
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - kubectl-passthrough-mcp.allegedly.works
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: server
            app.kubernetes.io/instance: authentik
            app.kubernetes.io/name: authentik
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
          serverNames:
            - auth.allegedly.works
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-actions
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-egress
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-app
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentplane-actions
  namespace: agentplane-staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentplane-actions
