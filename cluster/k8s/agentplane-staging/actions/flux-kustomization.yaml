apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-staging-actions
  namespace: ducktape-flux
  annotations:
    description: Action Service with a dedicated database on staging's shared PostgreSQL, migration init gate, workload-proxy ingress and public OAuth/MCP endpoint.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  path: ./cluster/k8s/agentplane-staging/actions
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: gateway
      namespace: ducktape-flux
    - name: sso-providers-tf
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: agentplane-staging-namespace
      namespace: ducktape-flux
    - name: agentplane-staging-db
      namespace: ducktape-flux
    - name: agentplane-staging-egress
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
