apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-staging-actions
  namespace: ducktape-flux
  annotations:
    description: Standalone Action Service, isolated PostgreSQL contract, migration init gate, shared SandboxPrincipal RBAC, and central-proxy-only workload ingress.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  path: ./cluster/k8s/agentplane-staging/actions
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: agentplane-staging-namespace
      namespace: ducktape-flux
    - name: agentplane-staging-egress
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
