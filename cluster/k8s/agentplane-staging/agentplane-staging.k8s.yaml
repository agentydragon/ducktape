apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: agentplane-staging
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: app
      owner: app
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  managed:
    roles:
      - ensure: present
        login: true
        name: actions
        passwordSecret:
          name: postgres-actions
      - ensure: present
        login: true
        name: egress
        passwordSecret:
          name: postgres-egress
      - ensure: present
        login: true
        name: mcp_edge
        passwordSecret:
          name: postgres-mcp-edge
      - ensure: present
        login: true
        name: notifications
        passwordSecret:
          name: postgres-notifications
      - ensure: present
        login: true
        name: sandbox_service
        passwordSecret:
          name: postgres-sandbox-service
      - ensure: present
        login: true
        name: session_dispatcher
        passwordSecret:
          name: postgres-session-dispatcher
      - ensure: present
        login: true
        name: central_sampler
        passwordSecret:
          name: postgres-central-sampler
      - ensure: present
        login: true
        name: electric
        passwordSecret:
          name: postgres-electric
        replication: true
  monitoring:
    enablePodMonitor: true
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: postgres
  postgresql:
    parameters:
      max_connections: "300"
      max_slot_wal_keep_size: 512MB
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    resizeInUseVolumes: true
    size: 16Gi
    storageClass: piraeus-ssd-local
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: actions
  namespace: agentplane-staging
spec:
  cluster:
    name: postgres
  databaseReclaimPolicy: delete
  name: actions
  owner: actions
