kind: ClusterSecretStore
metadata:
  name: kubernetes-agentplane-staging-ha-mcp-bearer-secret-store
spec:
  conditions:
    - namespaces:
        - agentplane-staging
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-creds-reader
      remoteNamespace: ha-mcp
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-mcp-client-bearer
  namespace: agentplane-staging
spec:
  data:
    - remoteRef:
        key: ha-mcp-bearer
        property: bearer-token
      secretKey: bearer-token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-agentplane-staging-ha-mcp-bearer-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: ha-mcp-client-bearer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-staging-github-mcp-client-reader
  namespace: haku-console
rules:
  - apiGroups:
      - ""
    resourceNames:
      - haku-console-github-mcp-client-credentials
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-staging-github-mcp-client-reader
  namespace: haku-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-staging-github-mcp-client-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: external-creds-reader
    namespace: agentplane-staging
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-agentplane-staging-github-mcp-client-secret-store
spec:
  conditions:
    - namespaces:
        - agentplane-staging
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-creds-reader
      remoteNamespace: haku-console
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-console-github-mcp-client-credentials
  namespace: agentplane-staging
spec:
  data:
    - remoteRef:
        key: haku-console-github-mcp-client-credentials
        property: client_id
      secretKey: client_id
    - remoteRef:
        key: haku-console-github-mcp-client-credentials
        property: client_secret
      secretKey: client_secret
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-agentplane-staging-github-mcp-client-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: haku-console-github-mcp-client-credentials
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-staging-session-secret
  namespace: agentplane-staging
spec:
  allowRepeat: true
  digits: 16
  length: 64
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    description: ESO-generated Agentplane staging session-signing key.
  name: agentplane-staging-session-secret
  namespace: agentplane-staging
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agentplane-staging-session-secret
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
    name: agentplane-staging-session-secret
    template:
      data:
        session-secret: "{{ .password }}"
      type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    description: The principal for Connections enrolled from the Claude.ai MCP connector, selected at OAuth consent.
  labels:
    agentplane.allegedly.works/use-action-service: "true"
  name: claude-ai
  namespace: agentplane-staging
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    description: "The principal for the 'haku' sandbox preset: agents that clone haku-state and work from it, the way Haku itself does."
  labels:
    agentplane.allegedly.works/use-action-service: "true"
  name: haku-agent
  namespace: agentplane-staging
automountServiceAccountToken: false
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: PolicySet
metadata:
  annotations:
    description: The reviewed read-only subset of GitHub MCP's default catalog; every other GitHub Action stays on the human path.
  name: github-reads
  namespace: agentplane-staging
spec:
  rules:
    - policy:
        actions:
          github:
            - find_duplicate
            - get_commit
            - get_file_blame
            - get_file_contents
            - get_label
            - get_latest_release
            - get_me
            - get_release_by_tag
            - get_tag
            - get_team_members
            - get_teams
            - issue_dependency_read
            - issue_read
            - list_branches
            - list_commits
            - list_issue_fields
            - list_issue_types
            - list_issues
            - list_pull_requests
            - list_releases
            - list_repository_collaborators
            - list_tags
            - pull_request_read
            - search_code
            - search_commits
            - search_issues
            - search_pull_requests
            - search_repositories
            - search_users
            - ui_get
        type: exact_actions
      type: action_auto_approve
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: PolicySet
metadata:
  annotations:
    description: The caller's own GitHub identity read, with no repository or mutation surface.
  name: github-identity-reads
  namespace: agentplane-staging
spec:
  rules:
    - policy:
        actions:
          github:
            - get_me
        type: exact_actions
      type: action_auto_approve
