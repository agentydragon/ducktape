metadata:
  labels:
    app.kubernetes.io/name: agentplane-egress
  name: agentplane-egress
  namespace: agentplane-staging
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-egress-deployment-c84e690f
