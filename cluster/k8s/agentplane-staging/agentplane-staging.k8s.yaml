apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: Agentplane staging - sandboxed runner Pods (one per Sandbox) and the integration app that drives them.
  labels:
    goldilocks.fairwinds.com/enabled: "false"
    name: agentplane-staging
    rbac.ducktape.io/agent-readable-logs: "true"
  name: agentplane-staging
spec: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: agentplane-runner-ca
  namespace: agentplane-staging
spec:
  commonName: agentplane-runner-ca
  duration: 87600h
  isCA: true
  issuerRef:
    kind: ClusterIssuer
    name: cluster-internal-ca
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 8760h
  secretName: agentplane-runner-ca
  usages:
    - cert sign
    - crl sign
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: agentplane-runner-ca
  namespace: agentplane-staging
spec:
  ca:
    secretName: agentplane-runner-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: agentplane-runner-gateway
  namespace: agentplane-staging
spec:
  duration: 24h
  issuerRef:
    kind: Issuer
    name: agentplane-runner-ca
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 8h
  secretName: agentplane-runner-gateway-tls
  uris:
    - spiffe://agentplane/runner-gateway
  usages:
    - digital signature
    - client auth
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otel-egress
  namespace: agentplane-staging
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alloy
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
  endpointSelector:
    matchLabels:
      agentplane.io/otel-class: service
      agentplane.io/otel-emitter: "true"
---
