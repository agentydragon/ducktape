            - xhigh
        - model: chatgpt/oai-responses/gpt-6-luna
          display_name: GPT-6 Luna
          reasoning_efforts:
            - minimal
            - low
            - medium
            - high
            - xhigh
        - model: chatgpt/oai-responses/gpt-6-sol
          display_name: GPT-6 Sol
          reasoning_efforts:
            - minimal
