apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: agentplane-workload
  namespace: agentplane-staging
spec:
  description: The calling Sandbox Pod's short-lived, Pod-bound workload identity for first-party Agentplane destinations. It conveys no LiteLLM credential or operator, Agent, or Thread authority.
  source:
    authenticatedWorkloadToken: {}
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: agentplane-notifications-workload
  namespace: agentplane-staging
spec:
  description: The calling Sandbox Pod's short-lived, Pod-bound identity minted specifically for the Agentplane Notifications API audience.
  source:
    projectedWorkloadToken:
      audience: agentplane-notifications
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: github-pat
  namespace: agentplane-staging
spec:
  description: A GitHub personal access token belonging to the bot account agentydragon-agent. Requests carrying it act as that account and are attributable to it. The proxy does not narrow what the token itself may do — the rule's hosts and methods are the only limit it adds, so treat anything the token can reach on those hosts as reachable.
  source:
    secretRef:
      name: agentplane-github-pat
      key: token
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
    - header: Authorization
      method: basicPassword
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: buildbuddy
  namespace: agentplane-staging
spec:
  description: The shared BuildBuddy API key, copied into this environment's isolated egress-credentials namespace by ESO. BuildBuddy uses this key for its JSON-over-HTTP API and gRPC services, presented as the literal value of the `x-buildbuddy-api-key` header/metadata entry. Its authority is the account's BuildBuddy permissions; the egress policy limits where it is sent.
  source:
    secretRef:
      name: buildbuddy-api-key
      key: api-key
  targets:
    - header: x-buildbuddy-api-key
      method: wholeValue
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: ollama
  namespace: agentplane-staging
spec:
  description: Direct Ollama inference and model metadata at http://ollama.ollama.svc.cluster.local:11435. Uses the existing token-authenticated proxy, not the unauthenticated Ollama port. Shared local GPUs; avoid unbounded or concurrent load experiments.
  source:
    secretRef:
      name: ollama-direct-token
      key: token
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: litellm-cheap-experiments
  namespace: agentplane-staging
spec:
  description: The shared LiteLLM cheap-experiments virtual key at http://litellm.litellm.svc.cluster.local:4000. LiteLLM enforces its model allowlist and shared spending budget; this is not an admin key.
  source:
    secretRef:
      name: litellm-key-cheap-experiments
      key: api-key
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: kubernetes-workload
  namespace: agentplane-staging
spec:
  description: "The calling Sandbox Pod's own ServiceAccount, minted for the Kubernetes API server rather than for this proxy. Requests carrying it are authorized by the API server as that account and by nothing here: what the sandbox may do is the RBAC bound to it, and this proxy adds only the rule's hosts, methods and paths on top."
  source:
    projectedWorkloadToken:
      audience: https://localhost:7445
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: inference-experiments
  namespace: agentplane-staging
spec:
  rules:
    - hosts:
        - ollama.ollama.svc.cluster.local
      methods:
        - GET
      paths:
        - /api/tags
        - /api/ps
        - /api/version
        - /v1/models
      clusterInternal: true
      credentialRef:
        name: ollama
    - hosts:
        - ollama.ollama.svc.cluster.local
      methods:
        - POST
      paths:
        - /api/show
        - /api/chat
        - /api/generate
        - /api/embed
        - /api/embeddings
        - /v1/chat/completions
        - /v1/completions
        - /v1/responses
        - /v1/embeddings
      clusterInternal: true
      credentialRef:
        name: ollama
    - hosts:
        - litellm.litellm.svc.cluster.local
      methods:
        - GET
      paths:
        - /v1/models
        - /models
        - /model/info
      clusterInternal: true
      credentialRef:
        name: litellm-cheap-experiments
    - hosts:
        - litellm.litellm.svc.cluster.local
      methods:
        - POST
      paths:
        - /v1/chat/completions
        - /v1/completions
        - /v1/responses
        - /v1/messages
        - /v1/messages/count_tokens
        - /v1/embeddings
        - /v1/audio/transcriptions
      clusterInternal: true
      credentialRef:
        name: litellm-cheap-experiments
