      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-egress
        cdk8s.io/metadata.addr: agentplane-egress-deployment-c84e690f
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - --rules-namespace=agentplane-staging
            - --credentials-namespace=agentplane-staging-egress-credentials
            - --listen-port=8888
            - --admin-port=8081
            - --agent-api-port=8082
            - --ca-cert=/etc/agentplane-egress/ca/tls.crt
            - --ca-key=/etc/agentplane-egress/ca/tls.key
            - --confdir=/var/lib/agentplane-egress
            - --upstream-ca-file=/etc/agentplane-egress/upstream-ca/ca-certificates.crt
            - --token-audience=agentplane-egress
          env:
            - name: AGENTPLANE_EGRESS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: postgres-egress
            - name: AGENTPLANE_EGRESS_CONFIG_FILE
              value: /etc/agentplane-egress/settings/settings.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-egress:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
          name: proxy
          ports:
            - containerPort: 8888
              name: proxy
              protocol: TCP
            - containerPort: 8081
              name: admin
              protocol: TCP
            - containerPort: 8082
              name: agent-api
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/agentplane-egress/ca
              name: ca
              readOnly: true
            - mountPath: /etc/agentplane-egress/upstream-ca
              name: upstream-ca
              readOnly: true
            - mountPath: /var/lib/agentplane-egress
              name: confdir
            - mountPath: /etc/agentplane-egress/settings
              name: configmap-agentplane-egress-settings
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      initContainers:
        - env:
            - name: AGENTPLANE_EGRESS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: postgres-egress
          image: git.allegedly.works/ducktape-ci/agentplane-egress-migrate:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-egress
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - name: ca
          secret:
            secretName: agentplane-egress-ca
        - configMap:
            name: agentplane-staging-egress-upstream-ca
          name: upstream-ca
        - emptyDir: {}
          name: confdir
        - configMap:
            name: agentplane-egress-settings
          name: configmap-agentplane-egress-settings
