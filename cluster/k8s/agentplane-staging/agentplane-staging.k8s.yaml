            - name: AGENTPLANE_TOKEN_SUBJECTS
              value: '["system:serviceaccount:agentplane-staging:agentplane-agent"]'
            - name: AGENTPLANE_CONNECTION_SERVICE_URL
              value: http://mcp-edge.agentplane-staging.svc:8080/
          image: git.allegedly.works/ducktape-ci/agentplane-app-migrate:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
