            - name: OTEL_TRACES_SAMPLER
              value: parentbased_always_on
            - name: AGENTPLANE_CONFIG_FILE
              value: /etc/agentplane/config.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-app:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
