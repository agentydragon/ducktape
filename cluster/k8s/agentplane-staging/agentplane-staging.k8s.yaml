            - mountPath: /var/run/secrets/agentplane-session-dispatcher
              name: session-dispatcher-token
              readOnly: true
            - mountPath: /var/run/secrets/agentplane-notifications
              name: notifications-token
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      initContainers:
        - env:
            - name: AGENTPLANE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: postgres-app
            - name: AGENTPLANE_ELECTRIC_URL
              value: http://electric.agentplane-staging.svc:3000
            - name: AGENTPLANE_OIDC_ISSUER
              value: https://auth.allegedly.works/application/o/agentplane-staging/
            - name: AGENTPLANE_OIDC_PUBLIC_BASE_URL
              value: https://agentplane-staging.allegedly.works
            - name: AGENTPLANE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client-id
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client-secret
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: session-secret
                  name: agentplane-staging-session-secret
            - name: AGENTPLANE_TOKEN_SUBJECTS
              value: '["system:serviceaccount:agentplane-staging:agentplane-agent"]'
          image: git.allegedly.works/ducktape-ci/agentplane-app-migrate:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
