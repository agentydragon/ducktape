      paths:
        - /api/connection
        - /api/info
        - /api/objects
        - /api/query
        - /api/schemas
        - /api/tables/**
      clusterInternal: true
      credentialRef:
        name: plaid-pgweb
    - hosts:
        - plaid-pgweb.plaid-mcp.svc.cluster.local
      methods:
        - POST
      paths:
        - /api/query
      clusterInternal: true
      credentialRef:
        name: plaid-pgweb
---
apiVersion: cilium.io/v2
