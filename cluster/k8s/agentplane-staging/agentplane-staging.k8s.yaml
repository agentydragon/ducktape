        - configMap:
            name: agentplane-egress-ca
          name: egress-ca
        - configMap:
            name: agentplane-sandbox-tool-config
          name: tool-config
        - name: egress-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentplane-egress
                  expirationSeconds: 600
                  path: token
              - serviceAccountToken:
                  audience: https://localhost:7445
                  expirationSeconds: 600
                  path: kubernetes-token
              - serviceAccountToken:
                  audience: agentplane-notifications
                  expirationSeconds: 600
                  path: notifications-token
        - emptyDir:
            sizeLimit: 20Gi
          name: home
