apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: forgejo-finance-agent
  namespace: agentplane-staging
spec:
  rules:
    - hosts:
        - forgejo-http.forgejo.svc.cluster.local
        - forgejo-http.forgejo.svc
        - forgejo-http.forgejo
      clusterInternal: true
      credentialRef:
        name: forgejo-finance-agent
    - hosts:
        - git.allegedly.works
      credentialRef:
        name: forgejo-finance-agent
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: google-readonly
  namespace: agentplane-staging
spec:
  description: "A Google OAuth access token minted and refreshed by Airlock (cluster/k8s/agents/airlock), mirrored into this namespace by ESO: the token of Airlock's `google` provider, whose scopes are all `.readonly` (Gmail, Calendar, Drive, Drive Activity, Tasks, Contacts, Docs, Sheets, Slides, YouTube). What the token was actually granted is whatever the operator consented to at Airlock, which can be narrower than that list -- an API outside it answers 403 `insufficientPermissions`. `google-readonly`'s rules restrict where the proxy presents it."
  source:
    secretRef:
      name: google-access-token
      key: access_token
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: google-readonly
  namespace: agentplane-staging
spec:
  rules:
    - hosts:
        - docs.googleapis.com
        - gmail.googleapis.com
        - people.googleapis.com
        - sheets.googleapis.com
        - slides.googleapis.com
        - tasks.googleapis.com
        - youtube.googleapis.com
      methods:
        - GET
      credentialRef:
        name: google-readonly
    - hosts:
        - www.googleapis.com
      methods:
        - GET
      paths:
        - /calendar/v3/**
        - /drive/v3/**
        - /youtube/v3/**
      credentialRef:
        name: google-readonly
    - hosts:
        - driveactivity.googleapis.com
      methods:
        - POST
      paths:
        - /v2/activity:query
      credentialRef:
        name: google-readonly
---
