  description: The password of the `finance-agent` account on the internal Forgejo, the service user that owns the finance-agent repo (tf/gitops/finance-agent) -- Rai's personal financial-leash agent workspace. Requests carrying it act as that account with its full authority, but the account owns exactly one repo, so the blast radius is that repo alone.
