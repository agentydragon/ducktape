---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: agentplane-egress-ca
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        key: ca.crt
        name: cluster-root-ca-secret
    - secret:
        key: tls.crt
        name: agentplane-egress-ca
  target:
    additionalFormats:
      pkcs12:
        key: ca-certificates.p12
    configMap:
      key: ca-certificates.crt
      metadata:
        annotations:
          description: Trust bundle for agentplane-staging runner HTTPS traffic intercepted by the egress proxy
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - agentplane-staging
            - public-coder-agent
