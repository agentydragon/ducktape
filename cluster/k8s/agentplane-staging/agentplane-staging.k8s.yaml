apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: policy-controller
  name: policy-controller
  namespace: agentplane-staging
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-policy-controller-deployment-c883d3e9
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        agentplane.io/otel-class: service
        agentplane.io/otel-emitter: "true"
        app.kubernetes.io/name: policy-controller
        cdk8s.io/metadata.addr: agentplane-policy-controller-deployment-c883d3e9
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: AGENTPLANE_POLICY_CONTROLLER_POLICY_NAMESPACE
              value: agentplane-staging
            - name: AGENTPLANE_POLICY_CONTROLLER_METRICS_BIND_ADDRESS
              value: :8080
            - name: AGENTPLANE_POLICY_CONTROLLER_HEALTH_PROBE_BIND_ADDRESS
              value: :8081
            - name: AGENTPLANE_POLICY_CONTROLLER_SUBJECT_NAMESPACES
              value: agentplane-staging
            - name: OTEL_SERVICE_NAME
              value: policy-controller
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=agentplane,deployment.environment.name=agentplane-staging
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.monitoring.svc.cluster.local:4317
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_always_on
          image: git.allegedly.works/ducktape-ci/agentplane-policy-controller:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
          name: policy-controller
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: policy-controller
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
