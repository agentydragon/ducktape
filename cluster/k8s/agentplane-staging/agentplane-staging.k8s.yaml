apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agentplane-staging-actions-launcher-grants
spec:
  failurePolicy: Fail
  matchConditions:
    - expression: request.userInfo.username == 'system:serviceaccount:agentplane-staging:actions'
      name: action-service
  matchConstraints:
    resourceRules:
      - apiGroups:
          - agentplane.allegedly.works
        apiVersions:
          - "*"
        operations:
          - CREATE
        resources:
          - sandboxes
          - policysets
          - policybindings
  validations:
    - expression: variables.grant || !object.spec.?policySets.orValue([]).exists(set, set.endsWith('.launcher'))
      message: A Sandbox this service launches is bound to no launcher grant.
    - expression: "!variables.grant || (size(variables.owners) == 1 && variables.owners[0].apiVersion.startsWith('agentplane.allegedly.works/') && variables.owners[0].kind == 'Sandbox' && object.metadata.name == variables.owners[0].name + '.launcher')"
      message: A launcher grant is owned by one Sandbox and named for it.
    - expression: request.resource.resource != 'policybindings' || object.spec.policySets == [object.metadata.name]
      message: A launcher grant's PolicyBinding binds only its own PolicySet.
    - expression: request.resource.resource != 'policysets' || (size(variables.owners) == 1 && object.spec.rules.all(r, (r.type == 'session_inbox_access' && has(r.operations) && r.operations == ['send_message'] && has(r.targets) && !has(r.targets.inboxTags) && !has(r.targets.allSandboxes) && has(r.targets.sandboxes) && size(r.targets.sandboxes) == 1 && has(r.targets.sandboxes[0].uid) && r.targets.sandboxes[0].name == variables.owners[0].name && r.targets.sandboxes[0].uid == variables.owners[0].uid) || (r.type == 'action_auto_approve' && has(r.policy) && r.policy.type == 'argument_schema' && r.policy.actions.all(group, group == 'orchestration_v1' && r.policy.actions[group].all(action, action in ['open_session', 'submit_input', 'interrupt_turn', 'change_model', 'change_reasoning_effort', 'get_session', 'list_sessions', 'read_turns', 'wait_for_turn'])) && has(r.policy.schema) && r.policy.schema.all(key, key in ['type', 'required', 'properties']) && has(r.policy.schema.type) && r.policy.schema.type == 'object' && has(r.policy.schema.required) && r.policy.schema.required == ['sandbox'] && has(r.policy.schema.properties) && r.policy.schema.properties.all(key, key == 'sandbox') && has(r.policy.schema.properties.sandbox) && r.policy.schema.properties.sandbox.all(key, key == 'const') && 'const' in r.policy.schema.properties.sandbox && r.policy.schema.properties.sandbox['const'].all(key, key in ['name', 'uid']) && 'name' in r.policy.schema.properties.sandbox['const'] && 'uid' in r.policy.schema.properties.sandbox['const'] && r.policy.schema.properties.sandbox['const'].name == variables.owners[0].name && r.policy.schema.properties.sandbox['const'].uid == variables.owners[0].uid)))
      message: A launcher grant's rules name only its Sandbox, by name and UID, and only orchestration_v1 Actions.
  variables:
    - expression: object.metadata.?ownerReferences.orValue([])
      name: owners
    - expression: request.resource.resource != 'sandboxes'
      name: grant
