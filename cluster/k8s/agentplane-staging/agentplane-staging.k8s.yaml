    secret.reloader.stakater.com/reload: agentplane-oidc,agentplane-staging-session-secret
  labels:
    app.kubernetes.io/name: app
  name: app
  namespace: agentplane-staging
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-app-deployment-c8d92233
  strategy:
