apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    configmap.reloader.stakater.com/reload: agentplane-app-config
    secret.reloader.stakater.com/reload: agentplane-oidc,agentplane-staging-session-secret
  labels:
    app.kubernetes.io/name: agentplane-app
  name: agentplane-app
  namespace: agentplane-staging
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-app-deployment-c8d92233
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-app
        cdk8s.io/metadata.addr: agentplane-app-deployment-c8d92233
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - --namespace=agentplane-staging
            - --sandbox-namespace=agentplane-staging
            - --sandbox-service-target=agentplane-sandbox-service.agentplane-staging.svc.cluster.local:8080
            - --host=0.0.0.0
            - --port=8080
          env:
            - name: AGENTPLANE_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-app
            - name: AGENTPLANE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-app
            - name: AGENTPLANE_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-app
            - name: AGENTPLANE_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-app
            - name: AGENTPLANE_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: postgres-app
            - name: AGENTPLANE_DATABASE_URL
              value: postgresql+asyncpg://$(AGENTPLANE_DB_USER):$(AGENTPLANE_DB_PASSWORD)@$(AGENTPLANE_DB_HOST):$(AGENTPLANE_DB_PORT)/$(AGENTPLANE_DB_NAME)
            - name: AGENTPLANE_ELECTRIC_URL
              value: http://agentplane-electric.agentplane-staging.svc:3000
            - name: AGENTPLANE_OIDC_ISSUER
              value: https://auth.allegedly.works/application/o/agentplane-staging/
            - name: AGENTPLANE_OIDC_PUBLIC_BASE_URL
              value: https://agentplane-staging.allegedly.works
            - name: AGENTPLANE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client-id
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client-secret
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: session-secret
                  name: agentplane-staging-session-secret
            - name: AGENTPLANE_TOKEN_SUBJECTS
              value: '["system:serviceaccount:agentplane-staging:agentplane-agent"]'
            - name: AGENTPLANE_CONFIG_FILE
              value: /etc/agentplane/config.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-app:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
          name: app
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/agentplane
              name: configmap-agentplane-app-config
              readOnly: true
            - mountPath: /var/run/secrets/agentplane-sandbox-service
              name: sandbox-service-token
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      initContainers:
        - env:
            - name: AGENTPLANE_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-app
            - name: AGENTPLANE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-app
            - name: AGENTPLANE_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-app
            - name: AGENTPLANE_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-app
            - name: AGENTPLANE_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: postgres-app
            - name: AGENTPLANE_DATABASE_URL
              value: postgresql+asyncpg://$(AGENTPLANE_DB_USER):$(AGENTPLANE_DB_PASSWORD)@$(AGENTPLANE_DB_HOST):$(AGENTPLANE_DB_PORT)/$(AGENTPLANE_DB_NAME)
            - name: AGENTPLANE_ELECTRIC_URL
              value: http://agentplane-electric.agentplane-staging.svc:3000
            - name: AGENTPLANE_OIDC_ISSUER
              value: https://auth.allegedly.works/application/o/agentplane-staging/
            - name: AGENTPLANE_OIDC_PUBLIC_BASE_URL
              value: https://agentplane-staging.allegedly.works
            - name: AGENTPLANE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client-id
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client-secret
                  name: agentplane-oidc
            - name: AGENTPLANE_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: session-secret
                  name: agentplane-staging-session-secret
            - name: AGENTPLANE_TOKEN_SUBJECTS
              value: '["system:serviceaccount:agentplane-staging:agentplane-agent"]'
          image: git.allegedly.works/ducktape-ci/agentplane-app-migrate:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-app
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      volumes:
        - configMap:
            name: agentplane-app-config
          name: configmap-agentplane-app-config
        - name: sandbox-service-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentplane-sandbox-service
                  expirationSeconds: 3600
                  path: token
