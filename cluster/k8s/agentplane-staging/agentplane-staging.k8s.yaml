  name: buildbuddy-api-key
  namespace: agentplane-staging
spec:
  data:
    - remoteRef:
        key: buildbuddy-api-key
        property: api-key
      secretKey: api-key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: buildbuddy-api-key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-ducktape-egress-sidecar
  namespace: agentplane-staging
data:
  settings.yaml: |
    proxy_host: egress.agentplane-staging.svc.cluster.local
    proxy_port: 8888
    listen_port: 3128
    readiness_host: 0.0.0.0
    readiness_port: 3129
    token_file: /var/run/agentplane-egress/token
    audience_token_files:
      https://localhost:7445: /var/run/agentplane-egress/kubernetes-token
      agentplane-notifications: /var/run/agentplane-egress/notifications-token
      agentplane-runner-control: /var/run/agentplane-egress/runner-control-token
      agentplane-runner-ingress: /var/run/agentplane-egress/runner-ingress-token
    platform_routes:
      control:
        listen_port: 3130
        upstream: runner-gateway.agentplane-staging.svc.cluster.local:8080
        token_file: /var/run/agentplane-egress/runner-control-token
      ingress:
        listen_port: 3131
        upstream: history-service.agentplane-staging.svc.cluster.local:8081
        token_file: /var/run/agentplane-egress/runner-ingress-token
immutable: false
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: SandboxTemplate
metadata:
  name: runner-ducktape
  namespace: agentplane-staging
spec:
  pod:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-runner
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --state-dir
            - /state
            - --claude-binary
            - /bin/claude
            - --anthropic-base-url
            - $(LITELLM_URL)
            - --codex-binary
            - /bin/codex
            - --openai-base-url
            - $(LITELLM_URL)/v1
            - --control-target
            - 127.0.0.1:3130
            - --control-bearer
            - platform-route
            - --ingress-target
            - 127.0.0.1:3131
            - --ingress-bearer
            - platform-route
            - --launch-file
            - /run/agentplane/sandbox/launch.json
            - --platform-instructions-file
            - /etc/agentplane/platform-instructions/platform-instructions.md
            - --harness-env
            - HOME
            - --harness-env
            - PATH
            - --harness-env
            - TZ
            - --harness-env
            - HTTP_PROXY
            - --harness-env
            - HTTPS_PROXY
            - --harness-env
            - http_proxy
            - --harness-env
            - https_proxy
            - --harness-env
            - NO_PROXY
            - --harness-env
            - no_proxy
            - --harness-env
            - SSL_CERT_FILE
            - --harness-env
            - NODE_EXTRA_CA_CERTS
            - --harness-env
            - CURL_CA_BUNDLE
            - --harness-env
            - GIT_SSL_CAINFO
            - --harness-env
            - REQUESTS_CA_BUNDLE
            - --harness-env
            - KUBECONFIG
            - --harness-env
            - BBR_BUILDBUDDY_API_KEY_FILE
            - --harness-inherit-env
            - TZDIR
          env:
            - name: LITELLM_URL
              value: http://llm-ingress.agentplane-staging.svc.cluster.local:8080
            - name: BBR_BUILDBUDDY_API_KEY_FILE
              value: /run/buildbuddy/api-key
            - name: HTTP_PROXY
              value: http://127.0.0.1:3128
            - name: HTTPS_PROXY
              value: http://127.0.0.1:3128
            - name: http_proxy
              value: http://127.0.0.1:3128
            - name: https_proxy
              value: http://127.0.0.1:3128
            - name: NO_PROXY
              value: 127.0.0.1,localhost
            - name: no_proxy
              value: 127.0.0.1,localhost
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-certificates.crt
            - name: CURL_CA_BUNDLE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: GIT_SSL_CAINFO
              value: /etc/ssl/certs/ca-certificates.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: KUBECONFIG
              value: /etc/kubernetes/kubeconfig
            - name: ANTHROPIC_AUTH_TOKEN
              value: agentplane-credential-agentplane-workload
            - name: OPENAI_API_KEY
              value: agentplane-credential-agentplane-workload
            - name: TZ
              value: America/Los_Angeles
          image: git.allegedly.works/ducktape-ci/runner-ducktape:unset
          name: runner
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /state
              name: state
            - mountPath: /state/workspaces
              name: workspace
            - mountPath: /etc/agentplane/platform-instructions
              name: platform-instructions
              readOnly: true
            - mountPath: /etc/ssl/certs/ca-certificates.crt
              name: egress-ca
              readOnly: true
              subPath: ca-certificates.crt
            - mountPath: /etc/ssl/certs/java/cacerts
              name: egress-ca
              readOnly: true
              subPath: ca-certificates.p12
            - mountPath: /etc/kubernetes/kubeconfig
              name: tool-config
              readOnly: true
              subPath: kubeconfig
            - mountPath: /run/buildbuddy
              name: buildbuddy-api-key
              readOnly: true
          workingDir: /state
        - env:
            - name: AGENTPLANE_EGRESS_SIDECAR_CONFIG_FILE
              value: /etc/agentplane-egress-sidecar/settings.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-egress-sidecar:unset
          name: egress-sidecar
          readinessProbe:
            failureThreshold: 1
            httpGet:
              path: /readyz
              port: 3129
            periodSeconds: 2
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /var/run/agentplane-egress
              name: egress-token
              readOnly: true
            - mountPath: /etc/agentplane-egress-sidecar
              name: egress-sidecar-settings
              readOnly: true
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: runner
      terminationGracePeriodSeconds: 60
      volumes:
        - configMap:
            name: agentplane-egress-ca
          name: egress-ca
        - configMap:
            name: sandbox-tool-config
          name: tool-config
        - name: egress-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentplane-egress
                  expirationSeconds: 600
                  path: token
              - serviceAccountToken:
                  audience: https://localhost:7445
                  expirationSeconds: 600
                  path: kubernetes-token
              - serviceAccountToken:
                  audience: agentplane-notifications
                  expirationSeconds: 600
                  path: notifications-token
              - serviceAccountToken:
                  audience: agentplane-runner-control
                  expirationSeconds: 600
                  path: runner-control-token
              - serviceAccountToken:
                  audience: agentplane-runner-ingress
                  expirationSeconds: 600
                  path: runner-ingress-token
        - configMap:
            name: runner-ducktape-egress-sidecar
          name: egress-sidecar-settings
        - configMap:
            name: runner-platform-instructions
          name: platform-instructions
        - name: buildbuddy-api-key
          secret:
            defaultMode: 288
            secretName: buildbuddy-api-key
  stateVolume:
    name: state
    layout:
      type: DirectoryTree
    claim:
      storageClassName: local-path-ovh-hdd
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  workspaceVolume:
    name: workspace
    claim:
      storageClassName: local-path-ovh-hdd
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      volumeMode: Filesystem
    layout:
      type: DirectoryTree
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: notifications-github-webhook
  namespace: agentplane-staging
spec:
  hostnames:
    - agentplane-notifications-staging.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  rules:
    - backendRefs:
        - name: notifications
          port: 8080
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
          type: ResponseHeaderModifier
      matches:
        - path:
            type: Exact
            value: /v1/webhooks/github
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notifications-github-webhook
  namespace: agentplane-staging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: notifications
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
