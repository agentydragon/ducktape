            - name: AGENTPLANE_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: session-secret
                  name: agentplane-staging-session-secret
            - name: AGENTPLANE_TOKEN_SUBJECTS
              value: '["system:serviceaccount:agentplane-staging:agentplane-agent"]'
            - name: AGENTPLANE_CONNECTION_SERVICE_URL
              value: http://mcp-edge.agentplane-staging.svc:8080/
            - name: AGENTPLANE_RUNNER_GATEWAY_CONTROL_TARGET
