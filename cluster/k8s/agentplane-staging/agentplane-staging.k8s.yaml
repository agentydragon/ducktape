  source:
    secretRef:
      name: public-coder-haku-console
      key: token
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-public-coder-clickhouse-reader
  namespace: clickhouse
rules:
  - apiGroups:
      - ""
    resourceNames:
      - clickhouse-public-coder-credentials
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-public-coder-clickhouse-reader
  namespace: clickhouse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-public-coder-clickhouse-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: external-creds-reader
    namespace: agentplane-staging-egress-credentials
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-agentplane-public-coder-clickhouse-secret-store
spec:
  conditions:
    - namespaces:
        - agentplane-staging-egress-credentials
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-creds-reader
      remoteNamespace: clickhouse
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: public-coder-clickhouse
  namespace: agentplane-staging-egress-credentials
spec:
  data:
    - remoteRef:
        key: clickhouse-public-coder-credentials
        property: password
      secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-agentplane-public-coder-clickhouse-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: public-coder-clickhouse
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: public-coder-clickhouse
  namespace: agentplane-staging
spec:
  description: The existing read-only ClickHouse public_coder_analytics password. Present as the Basic password with that username.
  source:
    secretRef:
      name: public-coder-clickhouse
      key: password
  targets:
    - header: Authorization
      method: basicPassword
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-public-coder-matrix-reader
  namespace: matrix
rules:
  - apiGroups:
      - ""
    resourceNames:
      - public-coder-agent-matrix-bot-password
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-public-coder-matrix-reader
  namespace: matrix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-public-coder-matrix-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: external-creds-reader
    namespace: agentplane-staging-egress-credentials
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-agentplane-public-coder-matrix-secret-store
spec:
  conditions:
    - namespaces:
        - agentplane-staging-egress-credentials
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-creds-reader
      remoteNamespace: matrix
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: public-coder-matrix
  namespace: agentplane-staging-egress-credentials
spec:
  data:
    - remoteRef:
        key: public-coder-agent-matrix-bot-password
        property: password
      secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-agentplane-public-coder-matrix-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: public-coder-matrix
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: public-coder-matrix
  namespace: agentplane-staging
spec:
  description: The existing public-coder Matrix bot login password, only in the exact login password field. Login responses can contain session tokens; this does not hide those from the client.
  source:
    secretRef:
      name: public-coder-matrix
      key: password
  targets:
    - field: password
      method: jsonField
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: brave-search
  namespace: agentplane-staging-egress-credentials
spec:
  data:
    - remoteRef:
        key: brave-search-api-key
        property: api-key
      secretKey: api-key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: brave-search
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: brave-search
  namespace: agentplane-staging
spec:
  description: The shared Brave Search API key, substituted only at Brave's API in X-Subscription-Token.
  source:
    secretRef:
      name: brave-search
      key: api-key
  targets:
    - header: X-Subscription-Token
      method: wholeValue
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: PolicySet
metadata:
  name: public-coder-openclaw
  namespace: agentplane-staging
spec:
  rules:
    - type: egress
      hosts:
        - github.com
        - api.github.com
        - codeload.github.com
      credentialRef:
        name: github-pat
    - type: egress
      hosts:
        - haku-kubeapi.allegedly.works
      credentialRef:
        name: public-coder-haku-console
    - type: egress
      hosts:
        - clickhouse.clickhouse.svc.cluster.local
      clusterInternal: true
      credentialRef:
        name: public-coder-clickhouse
    - type: egress
      hosts:
        - aiquota.allegedly.works
      methods:
        - GET
      paths:
        - /v1/quotas
        - /v1/providers/*/raw
      credentialRef:
        name: aiquota-read
    - type: egress
      hosts:
        - api.search.brave.com
      credentialRef:
        name: brave-search
    - type: egress
      hosts:
        - matrix.allegedly.works
      methods:
        - POST
      paths:
        - /_matrix/client/v3/login
      credentialRef:
        name: public-coder-matrix
    - type: egress
      hosts:
        - egress.agentplane-staging.svc.cluster.local
      methods:
        - GET
      paths:
        - /v1/rules
        - /openapi.json
      clusterInternal: true
      credentialRef:
        name: agentplane-workload
    - type: egress
      hosts:
        - actions.agentplane-staging.svc.cluster.local
      methods:
        - GET
        - POST
      paths:
        - /mcp
        - /openapi.json
        - /v1/action-groups
        - /v1/action-groups/**
        - /v1/action-policy
        - /v1/action-requests
        - /v1/action-requests/**
      clusterInternal: true
      credentialRef:
        name: agentplane-workload
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: PolicyBinding
metadata:
  name: public-coder-openclaw
  namespace: agentplane-staging
spec:
  subject:
    namespace: public-coder-agent
    name: openclaw
  policySets:
    - public-coder-openclaw
    - inference-experiments
    - public-internet
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: public-coder-openclaw
  namespace: agentplane-staging
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            clickhouse.altinity.com/app: chop
            clickhouse.altinity.com/chi: clickhouse
            clickhouse.altinity.com/namespace: clickhouse
            clickhouse.altinity.com/ready: "yes"
            k8s:io.kubernetes.pod.namespace: clickhouse
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: egress
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: public-coder-agent
            io.cilium.k8s.policy.serviceaccount: openclaw
            k8s:io.kubernetes.pod.namespace: public-coder-agent
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: public-coder-openclaw
  namespace: clickhouse
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: clickhouse
      app.kubernetes.io/name: clickhouse
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: egress
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-staging-credentials
  namespace: agentplane-staging
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: server
            app.kubernetes.io/name: authentik
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: activitywatch
            k8s:io.kubernetes.pod.namespace: activitywatch
      toPorts:
        - ports:
            - port: "5603"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: aiquota
            k8s:io.kubernetes.pod.namespace: cli-proxy-api
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            clickhouse.altinity.com/app: chop
            clickhouse.altinity.com/chi: clickhouse
            clickhouse.altinity.com/namespace: clickhouse
            clickhouse.altinity.com/ready: "yes"
            k8s:io.kubernetes.pod.namespace: clickhouse
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: haku-mailbox
            k8s:io.kubernetes.pod.namespace: haku-mailbox
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: plaid-pgweb
            k8s:io.kubernetes.pod.namespace: plaid-mcp
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: egress
