    restartPolicy: Always
    securityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    shareProcessNamespace: false
    terminationGracePeriodSeconds: 60
    volumes:
      - configMap:
          name: agentplane-egress-ca
        name: egress-ca
      - configMap:
          name: sandbox-tool-config
        name: tool-config
      - name: egress-token
        projected:
          sources:
            - serviceAccountToken:
                audience: agentplane-egress
                expirationSeconds: 600
                path: token
            - serviceAccountToken:
                audience: https://localhost:7445
                expirationSeconds: 600
                path: kubernetes-token
            - serviceAccountToken:
                audience: agentplane-notifications
                expirationSeconds: 600
                path: notifications-token
            - serviceAccountToken:
                audience: agentplane-runner-ingress
                expirationSeconds: 600
                path: runner-ingress-token
      - configMap:
          name: sandbox-egress-sidecar
        name: egress-sidecar-settings
      - emptyDir:
          sizeLimit: 20Gi
        name: home
