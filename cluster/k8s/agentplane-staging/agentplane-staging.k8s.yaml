apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: agentplane-sandbox-service
  name: agentplane-sandbox-service
  namespace: agentplane-staging
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-sandbox-service-deployment-c8b904d8
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-sandbox-service
        cdk8s.io/metadata.addr: agentplane-sandbox-service-deployment-c8b904d8
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: AGENTPLANE_SANDBOX_SERVICE_CONFIG_FILE
              value: /etc/agentplane-sandbox-service/config.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-sandbox-service:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
          name: sandbox-service
          ports:
            - containerPort: 8080
              name: grpc
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/agentplane-sandbox-service
              name: configmap-agentplane-sandbox-service-config
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-sandbox-service
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      volumes:
        - configMap:
            name: agentplane-sandbox-service-config
          name: configmap-agentplane-sandbox-service-config
