apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: Agentplane staging - sandboxed runner Pods (one per Sandbox) and the integration app that drives them.
  labels:
    goldilocks.fairwinds.com/enabled: "false"
    name: agentplane-staging
    rbac.ducktape.io/agent-readable-logs: "true"
  name: agentplane-staging
spec: {}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: agentplane-staging
spec:
  hard:
    limits.cpu: "18"
    limits.memory: 28Gi
    requests.cpu: "4"
    requests.memory: 8Gi
    requests.storage: 80Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limits
  namespace: agentplane-staging
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 10m
        memory: 16Mi
      type: Container
    - max:
        cpu: "4"
        memory: 8Gi
      type: Pod
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgres-actions-generator
  namespace: agentplane-staging
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-actions
  namespace: agentplane-staging
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: postgres-actions-generator
  refreshInterval: 8760h
  target:
    name: postgres-actions
    template:
      data:
        dbname: actions
        host: postgres-rw.agentplane-staging.svc
        password: "{{ .password }}"
        port: "5432"
        uri: postgresql://actions:{{ .password }}@postgres-rw.agentplane-staging.svc:5432/actions
        username: actions
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgres-egress-generator
  namespace: agentplane-staging
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-egress
  namespace: agentplane-staging
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: postgres-egress-generator
  refreshInterval: 8760h
  target:
    name: postgres-egress
    template:
      data:
        dbname: egress
        host: postgres-rw.agentplane-staging.svc
        password: "{{ .password }}"
        port: "5432"
        uri: postgresql://egress:{{ .password }}@postgres-rw.agentplane-staging.svc:5432/egress
        username: egress
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgres-notifications-generator
  namespace: agentplane-staging
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-notifications
  namespace: agentplane-staging
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: postgres-notifications-generator
  refreshInterval: 8760h
  target:
    name: postgres-notifications
    template:
      data:
        dbname: notifications
        host: postgres-rw.agentplane-staging.svc
        password: "{{ .password }}"
        port: "5432"
        uri: postgresql://notifications:{{ .password }}@postgres-rw.agentplane-staging.svc:5432/notifications
        username: notifications
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgres-electric-generator
  namespace: agentplane-staging
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-electric
  namespace: agentplane-staging
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: postgres-electric-generator
  refreshInterval: 8760h
  target:
    name: postgres-electric
    template:
      data:
        dbname: app
        host: postgres-rw.agentplane-staging.svc
        password: "{{ .password }}"
        port: "5432"
        uri: postgresql://electric:{{ .password }}@postgres-rw.agentplane-staging.svc:5432/app
        username: electric
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: agentplane-staging
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: app
      owner: app
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  managed:
    roles:
      - ensure: present
        login: true
        name: actions
        passwordSecret:
          name: postgres-actions
      - ensure: present
        login: true
        name: egress
        passwordSecret:
          name: postgres-egress
      - ensure: present
        login: true
        name: notifications
        passwordSecret:
          name: postgres-notifications
      - ensure: present
        login: true
        name: electric
        passwordSecret:
          name: postgres-electric
        replication: true
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      max_slot_wal_keep_size: 512MB
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 5Gi
    storageClass: local-path-ovh-ssd
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: actions
  namespace: agentplane-staging
spec:
  cluster:
    name: postgres
  databaseReclaimPolicy: delete
  name: actions
  owner: actions
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: egress
  namespace: agentplane-staging
spec:
  cluster:
    name: postgres
  databaseReclaimPolicy: delete
  name: egress
  owner: egress
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: notifications
  namespace: agentplane-staging
spec:
  cluster:
    name: postgres
  databaseReclaimPolicy: delete
  name: notifications
  owner: notifications
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: agentplane-electric
  name: agentplane-electric
  namespace: agentplane-staging
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-electric-deployment-c86a4b11
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentplane-electric
        cdk8s.io/metadata.addr: agentplane-electric-deployment-c86a4b11
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-electric
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-electric
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-electric
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-electric
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: postgres-electric
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
            - name: ELECTRIC_DB_POOL_SIZE
              value: "10"
            - name: ELECTRIC_INSECURE
              value: "true"
            - name: ELECTRIC_PORT
              value: "3000"
            - name: ELECTRIC_STORAGE
              value: fast_file
            - name: ELECTRIC_STORAGE_DIR
              value: /var/lib/electric
            - name: ELECTRIC_PERSISTENT_STATE
              value: file
            - name: ELECTRIC_MANUAL_TABLE_PUBLISHING
              value: "true"
            - name: ELECTRIC_REPLICATION_STREAM_ID
              value: agentplane_conversation
            - name: ELECTRIC_MAX_SHAPES
              value: "1024"
          image: docker.io/electricsql/electric:1.8.1@sha256:9b4cebe2d8f51fb3ebaeb156e443ba09deaa7c9e731f146e81f7e48238bae211
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
          name: electric
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /var/lib/electric
              name: storage
      dnsPolicy: ClusterFirst
      hostNetwork: false
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: Always
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      volumes:
        - emptyDir:
            sizeLimit: 5120Mi
          name: storage
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: agentplane-electric
  name: agentplane-electric
  namespace: agentplane-staging
spec:
  externalIPs: []
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    cdk8s.io/metadata.addr: agentplane-electric-deployment-c86a4b11
  type: ClusterIP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-electric
  namespace: agentplane-staging
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: postgres
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-electric
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-app
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
