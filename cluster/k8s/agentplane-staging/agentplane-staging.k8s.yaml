apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: policy-controller
  namespace: agentplane-staging
spec:
  groups:
    - name: policy-controller
      rules:
        - alert: AgentplanePolicyBindingExpiryOverdue
          annotations:
            description: The Policy Controller deletes a PolicyBinding at its expiresAt; this one has outlived it, so its grants are still live. Check the agentplane-policy-controller Deployment and its logs.
            summary: PolicyBinding {{ $labels.name }} still grants after its expiresAt
          expr: time() - kube_customresource_agentplane_policybinding_expires_at{namespace="agentplane-staging"} > 300
          labels:
            severity: warning
