apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: sandbox-controller
  name: sandbox-controller
  namespace: agentplane-staging
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-sandbox-controller-deployment-c8a54474
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-controller
        cdk8s.io/metadata.addr: agentplane-sandbox-controller-deployment-c8a54474
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - --namespace=agentplane-staging
            - --runner-gateway-target={sandbox}-control.{namespace}.svc:8080
            - --runner-gateway-token-file=/var/run/secrets/agentplane-runner-gateway/token
          image: git.allegedly.works/ducktape-ci/agentplane-sandbox-controller:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
          name: sandbox-controller
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /var/run/secrets/agentplane-runner-gateway
              name: runner-gateway-token
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: sandbox-controller
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
        - name: runner-gateway-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentplane-runner-gateway
                  expirationSeconds: 3600
                  path: token
