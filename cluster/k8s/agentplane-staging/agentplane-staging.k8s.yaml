apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: agentplane-testing
  namespace: agentplane-staging
spec:
  rules:
    - hosts:
        - agentplane-app.agentplane-testing.svc.cluster.local
      clusterInternal: true
    - hosts:
        - agentplane-testing.allegedly.works
        - agentplane-dex-testing.allegedly.works
      clusterInternal: true
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentplane-egress-to-testing-app
  namespace: agentplane-staging
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-app
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - agentplane-testing.allegedly.works
            - agentplane-dex-testing.allegedly.works
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-testing-dex
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "5556"
              protocol: TCP
          serverNames:
            - agentplane-dex-testing.allegedly.works
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-egress
---
apiVersion: agentplane.allegedly.works/v1alpha1
