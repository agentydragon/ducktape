apiVersion: agentplane.allegedly.works/v1alpha1
kind: PolicySet
metadata:
  annotations:
    description: Auto-approves only GitHub MCP rerun_failed_jobs calls for agentydragon/ducktape; dispatch, whole-run rerun, cancellation and log deletion remain on the human path.
  name: ducktape-pr-failed-jobs
  namespace: agentplane-staging
spec:
  rules:
    - policy:
        actions:
          github:
            - actions_run_trigger
        schema:
          properties:
            method:
              const: rerun_failed_jobs
            owner:
              const: agentydragon
            repo:
              const: ducktape
            run_id:
              minimum: 1
              type: integer
          required:
            - method
            - owner
            - repo
            - run_id
          type: object
        type: argument_schema
      type: action_auto_approve
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: PolicySet
metadata:
  annotations:
    description: Auto-approves only GitHub MCP create_branch and create_pull_request calls targeting agentydragon/gaffer-private; existing branches cannot be overwritten, the PR is not merged, and other writes remain human-approved.
  name: gaffer-private-branch-and-pr-creation
  namespace: agentplane-staging
spec:
  rules:
    - policy:
        actions:
          github:
            - create_branch
        schema:
          additionalProperties: false
          properties:
            branch:
              minLength: 1
              type: string
            from_branch:
              minLength: 1
              type: string
            owner:
              const: agentydragon
            repo:
              const: gaffer-private
          required:
            - owner
            - repo
            - branch
          type: object
        type: argument_schema
      type: action_auto_approve
    - policy:
        actions:
          github:
            - create_pull_request
        schema:
          additionalProperties: false
          properties:
            base:
              minLength: 1
              type: string
            body:
              type: string
            draft:
              type: boolean
            head:
              minLength: 1
              type: string
            maintainer_can_modify:
              const: false
            owner:
              const: agentydragon
            repo:
              const: gaffer-private
            title:
              minLength: 1
              type: string
          required:
            - owner
            - repo
            - title
            - head
            - base
          type: object
        type: argument_schema
      type: action_auto_approve
