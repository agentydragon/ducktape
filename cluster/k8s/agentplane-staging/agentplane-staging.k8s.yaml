              name: configmap-app-config
              readOnly: true
            - mountPath: /var/run/secrets/agentplane-runner-gateway
              name: runner-gateway-token
              readOnly: true
            - mountPath: /var/run/secrets/agentplane-history-service
              name: history-service-token
