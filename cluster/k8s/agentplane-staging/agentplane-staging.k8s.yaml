        - gmail.googleapis.com
        - people.googleapis.com
        - sheets.googleapis.com
        - slides.googleapis.com
        - tasks.googleapis.com
        - youtube.googleapis.com
      methods:
        - GET
      credentialRef:
        name: google-readonly
    - hosts:
        - www.googleapis.com
      methods:
        - GET
      paths:
        - /calendar/v3/**
        - /drive/v3/**
        - /youtube/v3/**
      credentialRef:
        name: google-readonly
    - hosts:
        - driveactivity.googleapis.com
      methods:
        - POST
      paths:
        - /v2/activity:query
      credentialRef:
        name: google-readonly
