apiVersion: agentplane.allegedly.works/v1alpha1
kind: SandboxTemplate
metadata:
  name: runner-vm
  namespace: agentplane-staging
spec:
  vm:
    template:
      metadata:
        labels:
          app.kubernetes.io/name: agentplane-runner
      spec:
        domain:
          cpu:
            cores: 1
          devices:
            autoattachGraphicsDevice: false
            disks:
              - bootOrder: 1
                disk:
                  bus: virtio
                name: rootdisk
              - disk:
                  bus: virtio
                name: config
                serial: agentplane-config
              - disk:
                  bus: virtio
                name: trust
                serial: agentplane-trust
              - disk:
                  bus: virtio
                name: workspace
                serial: workspace
            interfaces:
              - masquerade: {}
                name: default
                ports:
                  - port: 22
          firmware:
            bootloader:
              efi:
                secureBoot: false
          resources:
            requests:
              memory: 1536Mi
        networks:
          - name: default
            pod: {}
        nodeSelector:
          kubevirt.io/schedulable: "true"
        volumes:
          - containerDisk:
              image: git.allegedly.works/ducktape-ci/agentplane-runner-vm:unset
              imagePullPolicy: IfNotPresent
            name: rootdisk
          - configMap:
              name: runner-vm-config
            name: config
          - configMap:
              name: agentplane-egress-ca
            name: trust
  stateVolume:
    name: state
    layout:
      type: DirectoryTree
    claim:
      storageClassName: local-path-ovh-hdd
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  workspaceVolume:
    name: workspace
    claim:
      storageClassName: local-path-ovh-hdd
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      volumeMode: Filesystem
    layout:
      type: RawDiskImage
      filesystem: ext4
