            - --notifications-token-file=/var/run/secrets/agentplane-notifications/token
            - --host=0.0.0.0
            - --port=8080
          env:
            - name: AGENTPLANE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: postgres-app
            - name: AGENTPLANE_ELECTRIC_URL
