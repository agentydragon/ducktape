        - matchLabels:
            app.kubernetes.io/name: plaid-pgweb
            k8s:io.kubernetes.pod.namespace: plaid-mcp
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-egress
