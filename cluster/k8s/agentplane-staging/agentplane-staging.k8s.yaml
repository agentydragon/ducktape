apiVersion: agentplane.allegedly.works/v1alpha1
kind: SandboxTemplate
metadata:
  name: runner-vm
  namespace: agentplane-staging
spec:
  vm:
    template:
      metadata:
        labels:
          app.kubernetes.io/name: agentplane-runner
          agentplane.io/otel-emitter: "true"
          agentplane.io/otel-class: runner
      spec:
        domain:
          cpu:
            cores: 1
          devices:
            autoattachGraphicsDevice: false
            disks:
              - bootOrder: 1
                disk:
                  bus: virtio
                name: rootdisk
              - disk:
                  bus: virtio
                name: config
                serial: agentplane-config
              - disk:
                  bus: virtio
                name: trust
                serial: agentplane-trust
              - disk:
                  bus: virtio
                name: runner
                serial: agentplane-runner
              - disk:
                  bus: virtio
                name: workspace
                serial: workspace
            interfaces:
              - masquerade: {}
                name: default
                ports:
                  - port: 22
                  - port: 9090
          firmware:
            bootloader:
              efi:
                secureBoot: false
          resources:
            requests:
              memory: 8192Mi
        networks:
          - name: default
            pod: {}
        volumes:
          - containerDisk:
              image: git.allegedly.works/ducktape-ci/agentplane-runner-vm:unset
              imagePullPolicy: IfNotPresent
            name: rootdisk
          - configMap:
              name: runner-vm-config
            name: config
          - configMap:
              name: agentplane-egress-ca
            name: trust
          - containerDisk:
              image: git.allegedly.works/ducktape-ci/agentplane-runner-disk:unset
              imagePullPolicy: IfNotPresent
            name: runner
  stateVolume:
    name: state
    layout:
      type: DirectoryTree
    claim:
      storageClassName: piraeus-ssd-2-autodiskful
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      volumeMode: Filesystem
  workspaceVolume:
    name: workspace
    claim:
      storageClassName: piraeus-ssd-2-autodiskful
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      volumeMode: Block
    layout:
      type: BlockFilesystem
      filesystem: ext4
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: runner
  namespace: agentplane-staging
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: egress
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-runner
  ingress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: platform-route-clients
  namespace: agentplane-staging
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: history-service
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alloy
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-runner
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: platform-route-ingress
  namespace: agentplane-staging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: history-service
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-runner
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: platform-route-agentplane-staging-telemetry
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentplane-runner
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: runner-listener
  namespace: agentplane-staging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agentplane-runner
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: runner-gateway
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
