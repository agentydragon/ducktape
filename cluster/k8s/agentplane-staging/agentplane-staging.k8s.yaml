  target:
    configMap:
      key: ca-certificates.crt
      metadata:
        annotations:
          description: "Trust bundle the agentplane-staging egress proxy verifies destinations with: public roots plus this cluster's CA"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - agentplane-staging
