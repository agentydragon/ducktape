# Shared PostgreSQL for staging's trajectory, ActionRequest, and egress history stores. Each
# service has its own logical database and login; sharing stops at the CNPG cluster. The
# trajectory database is created by initdb, while databases.yaml and the managed roles below
# declare the actions and egress stores. All three are disposable and have no backups.
#
# The SSD tier because a write lands here for every event of every turn (R3).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: agentplane-staging
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    # Soft anti-affinity off control-plane nodes (their etcd is on a rotational HDD; co-located
    # I/O starves etcd fsync -- 2026-06-28 outage).
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  storage:
    storageClass: local-path-ovh-ssd
    size: 5Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: app
      owner: app

  managed:
    roles:
      - name: actions
        ensure: present
        login: true
        passwordSecret:
          name: postgres-actions
      - name: egress
        ensure: present
        login: true
        passwordSecret:
          name: postgres-egress
