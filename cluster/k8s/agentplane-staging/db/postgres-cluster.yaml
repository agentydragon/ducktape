# Shared PostgreSQL for staging's trajectory, ActionRequest, and egress history stores. Each
# service has its own logical database and login; sharing stops at the CNPG instance. The
# trajectory database is created by initdb, while databases.yaml and the managed roles below
# declare the actions and egress stores. All three are disposable and have no backups.
#
# One instance on the OVH tier: a deliberate deviation from both profiles R2 permits, and the
# record of it, as study-casino-db's manifest is for its own (cnpg_conventions R2 inventory).
#
# It was Proxmox-single, one instance on wyrm2 beside the runner Pods, until stopping that node
# took the whole namespace with it. The move is to a tier that is always on; the second instance
# is not, because staging is experimental and its trajectories are expendable (Rai).
#
# What that costs, stated rather than assumed: this has neither replication CNPG gives (one
# instance) nor the storage-level replication Proxmox-single leans on (ZFS under
# local-path-proxmox; local-path-ovh-ssd is plain node-local NVMe). It survives a node reboot,
# because the volume is on that node's disk, and not a node loss. R2's own reasoning does not
# bite here -- it forbids clusters that span regions, because a failover can promote the remote
# replica and send every write across the mesh, and a single instance cannot fail over at all.
#
# The SSD tier because a write lands here for every event of every turn (R3).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: agentplane-staging
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    # Soft anti-affinity off control-plane nodes (their etcd is on a rotational HDD; co-located
    # I/O starves etcd fsync -- 2026-06-28 outage).
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  storage:
    storageClass: local-path-ovh-ssd
    size: 5Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: app
      owner: app

  managed:
    roles:
      - name: actions
        ensure: present
        login: true
        passwordSecret:
          name: postgres-actions
      - name: egress
        ensure: present
        login: true
        passwordSecret:
          name: postgres-egress
