# ESO-generated credentials for the two managed roles. The initdb-owned trajectory role keeps
# CNPG's agentplane-db-app Secret; these Secrets use distinct names from the old clusters so the
# cutover cannot conflict with CNPG owner references while those clusters are being pruned.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-db-actions-generator
  namespace: agentplane-staging
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentplane-db-actions
  namespace: agentplane-staging
spec:
  refreshInterval: 8760h
  target:
    name: agentplane-db-actions
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "agentplane_actions"
        password: "{{ .password }}"
        host: "agentplane-db-rw.agentplane-staging.svc"
        port: "5432"
        dbname: "agentplane_actions"
        uri: "postgresql://agentplane_actions:{{ .password }}@agentplane-db-rw.agentplane-staging.svc:5432/agentplane_actions"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agentplane-db-actions-generator
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentplane-db-egress-generator
  namespace: agentplane-staging
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentplane-db-egress
  namespace: agentplane-staging
spec:
  refreshInterval: 8760h
  target:
    name: agentplane-db-egress
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "agentplane_egress"
        password: "{{ .password }}"
        host: "agentplane-db-rw.agentplane-staging.svc"
        port: "5432"
        dbname: "agentplane_egress"
        uri: "postgresql://agentplane_egress:{{ .password }}@agentplane-db-rw.agentplane-staging.svc:5432/agentplane_egress"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agentplane-db-egress-generator
