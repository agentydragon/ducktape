# The services retain separate ownership and schemas while sharing one disposable PostgreSQL
# instance. Deleting either CR deliberately drops that staging database.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: actions
  namespace: agentplane-staging
spec:
  cluster:
    name: postgres
  name: actions
  owner: actions
  databaseReclaimPolicy: delete
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: egress
  namespace: agentplane-staging
spec:
  cluster:
    name: postgres
  name: egress
  owner: egress
  databaseReclaimPolicy: delete
