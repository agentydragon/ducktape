# Sized for a handful of concurrent runner sandboxes (each requests 500m/1Gi,
# limits 2/4Gi, plus a 10Gi state PVC per the agentplane-runner SandboxTemplate)
# with room for the integration app, its database (three CNPG Services), and the
# egress proxy (its listener and admin Services) alongside them.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agentplane-staging-quota
  namespace: agentplane-staging
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "12"
    limits.memory: 24Gi
    pods: "8"
    services: "8"
    configmaps: "10"
    persistentvolumeclaims: "8"
    requests.storage: 80Gi
