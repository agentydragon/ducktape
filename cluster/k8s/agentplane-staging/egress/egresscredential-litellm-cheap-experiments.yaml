# The cheap-experiments LiteLLM virtual key, presented by sandboxes that never hold it. The
# placeholder they send is `agentplane-credential-litellm-cheap-experiments`, derived from this
# object's name.
#
# Two targets because the two harnesses reach LiteLLM through different SDKs: Claude Code carries
# ANTHROPIC_AUTH_TOKEN as `Authorization: Bearer <credential>`, and the Anthropic SDK sends
# `x-api-key: <credential>` where it is given an API key instead. A target fires only where a
# request actually presents the placeholder in that position, so declaring the second costs the
# first nothing. Codex sends the Bearer form.
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: litellm-cheap-experiments
  namespace: agentplane-staging
spec:
  description: >-
    The LiteLLM virtual key every model call in this namespace is billed to. Its budget and model
    allowlist (tf/gitops/litellm-keys) are the only limit on what it can spend, and they are the
    kill switch for the whole namespace — the proxy adds the rule's host, and nothing else.
  source:
    secretRef:
      name: litellm-key-cheap-experiments
      key: api-key
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
    - header: x-api-key
      method: wholeValue
