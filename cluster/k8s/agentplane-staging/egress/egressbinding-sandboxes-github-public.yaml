# Every Sandbox the integration app manages (x/agentplane/app/inventory.py stamps the label)
# may reach public GitHub; nothing else, until another binding says so. granted-by names who
# made the binding: flux for a seed; a binding the app creates at runtime names the requester
# and carries an ownerReference to its Sandbox so it goes with it.
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressBinding
metadata:
  name: sandboxes-github-public
  namespace: agentplane-staging
  labels:
    agentplane.allegedly.works/granted-by: flux
spec:
  subjects:
    - sandboxSelector:
        matchLabels:
          agentplane.allegedly.works/managed: "true"
  policies:
    - github-public
  approval:
    state: approved
    by: rai
    at: "2026-09-03T00:00:00Z"
