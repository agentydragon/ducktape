# GitHub's API and HTTPS git for public repositories, as agentydragon-agent: reads and the
# POSTs that open pull requests and push over smart HTTP. The sandbox sends the placeholder
# in Authorization; the proxy swaps in the PAT.
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressPolicy
metadata:
  name: github-public
  namespace: agentplane-staging
spec:
  rules:
    - hosts:
        - api.github.com
        - github.com
        - "*.githubusercontent.com"
      methods: [GET, POST]
      credential:
        secretRef:
          name: agentplane-github-pat
          key: token
        header: Authorization
        placeholder: agentplane-credential:github-pat
