# The sidecar forward proxy and the ordinary agent-facing API share one Service but terminate on
# different listeners. Port 80 must never target the proxy port, or the Service would recurse.
apiVersion: v1
kind: Service
metadata:
  name: agentplane-egress
  namespace: agentplane-staging
spec:
  selector:
    app.kubernetes.io/name: agentplane-egress
  ports:
    - name: http
      port: 80
      targetPort: agent-api
    - name: proxy
      port: 8888
      targetPort: proxy
