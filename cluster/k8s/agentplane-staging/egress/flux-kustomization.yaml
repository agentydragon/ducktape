apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentplane-staging-egress
  namespace: ducktape-flux
  annotations:
    description: Agentplane secure egress in agentplane-staging - the proxy's identity and RBAC and the seed policy and binding for every managed Sandbox. The credentials it substitutes live in agentplane-egress-credentials; the proxy Deployment and the sandbox sidecar are not here yet.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 2m
  path: ./cluster/k8s/agentplane-staging/egress
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  dependsOn:
    - name: agentplane-staging-namespace
      namespace: ducktape-flux
    - name: agentplane-crds # the seed's EgressPolicy and EgressBinding
      namespace: ducktape-flux
