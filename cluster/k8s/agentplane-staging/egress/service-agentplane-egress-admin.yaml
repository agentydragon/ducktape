# The cluster-internal read side: /decisions for the integration app's per-sandbox view and
# /healthz. Separate from the listener so nothing that can reach the proxy can read decisions.
apiVersion: v1
kind: Service
metadata:
  name: agentplane-egress-admin
  namespace: agentplane-staging
spec:
  selector:
    app.kubernetes.io/name: agentplane-egress
  ports:
    - name: admin
      port: 8081
      targetPort: admin
