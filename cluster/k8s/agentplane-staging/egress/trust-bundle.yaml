# Public roots + cluster root + the proxy's interception root, written as ConfigMap
# agentplane-egress-ca into agentplane-staging, where the runner SandboxTemplate mounts it over the
# runner container's system bundle so every TLS client there accepts intercepted connections.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: agentplane-egress-ca
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: cluster-root-ca-secret
        key: ca.crt
    - secret:
        name: agentplane-egress-ca
        key: tls.crt
  target:
    configMap:
      key: ca-certificates.crt
      metadata:
        annotations:
          description: Trust bundle for agentplane-staging runner HTTPS traffic intercepted by the egress proxy
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - agentplane-staging
