# What the proxy reads here to decide a request: the policies and bindings, the Sandboxes they
# name, and the Pods whose tokens it verifies (a TokenReview proves the Pod; the Pod's owner is
# the Sandbox). No Secrets: the credentials it substitutes live in
# agentplane-egress-credentials, where it holds a separate read grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-egress
  namespace: agentplane-staging
rules:
  - apiGroups: ["agentplane.allegedly.works"]
    resources: ["egresspolicies", "egressbindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentplane.allegedly.works"]
    resources: ["egressbindings/status"]
    verbs: ["patch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
