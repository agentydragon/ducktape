# The caller's authenticated Pod-bound workload token, presented to the LLM ingress by central
# egress without ever entering the runner container. Both harnesses carry only this object's derived
# placeholder as an ordinary Bearer; central substitutes the token retained from the sidecar's
# already-authenticated request/tunnel context.
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: agentplane-workload
  namespace: agentplane-staging
spec:
  description: >-
    The calling Sandbox Pod's short-lived, Pod-bound workload identity for first-party Agentplane
    destinations. It conveys no LiteLLM credential or operator, Agent, or Thread authority.
  source:
    authenticatedWorkloadToken: {}
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
