# The agentydragon-agent PAT, presented by sandboxes that never hold it. The placeholder they send
# is `agentplane-credential-github-pat`, derived from this object's name and written nowhere.
#
# Two targets because one PAT travels two ways to GitHub: `Authorization: Bearer <credential>` to the
# API, and the password half of `Basic base64(x-access-token:<credential>)` for git over HTTPS, which
# is what a credential helper and `gh` send without asking us. A target fires only where a request
# actually presents the placeholder in that position, so declaring the git one costs API traffic
# nothing.
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: github-pat
  namespace: agentplane-staging
spec:
  description: >-
    A GitHub personal access token belonging to the bot account agentydragon-agent. Requests
    carrying it act as that account and are attributable to it. The proxy does not narrow what the
    token itself may do — the rule's hosts and methods are the only limit it adds, so treat anything
    the token can reach on those hosts as reachable.
  source:
    secretRef:
      name: agentplane-github-pat
      key: token
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
    - header: Authorization
      method: basicPassword
