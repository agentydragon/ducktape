# The agentydragon-agent GitHub PAT the github-public policy substitutes. The proxy alone
# mounts it; a sandbox only ever sends the placeholder. Same canonical Secret
# (ducktape-flux/github-agentydragon-agent) the Haku egress fence and public-coder-agent
# read, delivered here through the source-approved grant in
# cluster/k8s/external-creds/github-agentydragon-agent-grants.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentplane-github-pat
  namespace: agentplane-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    name: agentplane-github-pat
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: github-agentydragon-agent
        property: token
