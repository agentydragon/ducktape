apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: buildbuddy-executor
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: buildbuddy-executor
automountServiceAccountToken: false
imagePullSecrets:
  - name: forgejo-images-creds
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  annotations:
    description: Static trusted-code BuildBuddy worker. Privileged Docker test actions run inside the guest; the guest has no outer Kubernetes token or host filesystem mounts.
  labels:
    app.kubernetes.io/name: buildbuddy-kvm-worker
  name: buildbuddy-kvm-worker
  namespace: buildbuddy-executor
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildbuddy-kvm-worker
        kubevirt.io/domain: buildbuddy-kvm-worker
    spec:
      domain:
        cpu:
          cores: 8
          features:
            - name: svm
              policy: require
          model: host-passthrough
        devices:
          autoattachGraphicsDevice: false
          disks:
            - bootOrder: 1
              disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: work
              serial: work
            - disk:
                bus: virtio
              name: buildbuddy-key
              serial: bbkey
          interfaces:
            - masquerade: {}
              name: default
              ports: []
        firmware:
          bootloader:
            efi:
              secureBoot: false
        resources:
          limits:
            cpu: "8"
            memory: 24Gi
          requests:
            cpu: "8"
            memory: 24Gi
      networks:
        - name: default
          pod: {}
      nodeSelector:
        kubernetes.io/hostname: wyrm2
      volumes:
        - containerDisk:
            image: git.allegedly.works/ducktape-ci/buildbuddy-kvm-worker:unset
            imagePullPolicy: IfNotPresent
          name: rootdisk
        - emptyDisk:
            capacity: 80Gi
          name: work
        - name: buildbuddy-key
          secret:
            secretName: buildbuddy-api-key
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buildbuddy-kvm-worker
  namespace: buildbuddy-executor
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: remote.buildbuddy.io
        - matchName: buildbuddy.bbcr.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - remote.buildbuddy.io
            - buildbuddy.bbcr.io
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: zot
            k8s:io.kubernetes.pod.namespace: oci-cache
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
  endpointSelector:
    matchLabels:
      kubevirt.io/domain: buildbuddy-kvm-worker
  ingress:
    - {}
