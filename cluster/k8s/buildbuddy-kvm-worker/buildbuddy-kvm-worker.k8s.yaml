  executor.service: |
    [Unit]
    Description=BuildBuddy remote execution worker
    Wants=network-online.target
    After=network-online.target docker.service
    Requires=docker.service
    RequiresMountsFor=/buildbuddy /run/buildbuddy-key
    ConditionKernelCommandLine=apparmor=0
    ConditionPathExists=/etc/buildbuddy/executor.yaml

    [Service]
    Type=simple
    ExecStart=/usr/local/libexec/buildbuddy-kvm-worker/run-executor
    # Leave 2m beyond the executor shutdown window for Docker to exit cleanly.
    ExecStop=/usr/bin/docker stop --time 86595 buildbuddy-kvm-worker-executor
    ExecStopPost=/usr/bin/rm -f /run/buildbuddy-executor/environment
    Restart=always
    RestartSec=10
    # KubeVirt allows 4m45s beyond this timeout for the remaining guest shutdown.
    TimeoutStopSec=24h 5min 15s

    [Install]
    WantedBy=multi-user.target
  executor.yaml: |
    # Test actions run nested Kubernetes/KubeVirt with privileged pods. The executor
    # lives inside a VM so those privileges are confined to the guest.
    docker_cap_add: ALL
    # Bounds drain for the pinned 24h task limit, 1m action termination grace, and 15s cleanup.
    # BuildBuddy applies action timeouts after input download, so preparation stalls share this bound.
    max_shutdown_duration: 24h1m15s
    executor:
      app_target: grpcs://remote.buildbuddy.io:443
      api_key: "${BUILDBUDDY_API_KEY}"
      millicpu: 4000
      # 7 GiB of the VM's 8 GiB; sizing evidence is beside the VM memory in cluster/cdk8s/buildbuddy_kvm_worker.py.
      memory_bytes: 7516192768
      max_concurrent_tasks: 1
      max_task_timeout: 24h
      max_termination_grace_period: 1m
      shutdown_cleanup_duration: 15s
      root_directory: /buildbuddy/remotebuilds
      local_cache_directory: /buildbuddy/filecache
      local_cache_size_bytes: 40000000000
      docker_socket: /var/run/docker.sock
      default_isolation_type: docker
      enable_bare_runner: false
      enable_firecracker: false
      enable_oci: false
      enable_podman: false
      docker_inherit_user_ids: true
      docker_volumes:
        - /buildbuddy/k3s:/var/lib/k3s-env
        - /etc/rancher/k3s:/etc/rancher/k3s:ro
      docker_devices:
        - path_on_host: /dev
          path_in_container: /dev
          cgroup_permissions: rwm
      container_image_name_rewrites:
        - prefix: ghcr.io/
          replacement: oci-cache.oci-cache.svc.cluster.local:80/ghcr/
  k3s.yaml: |
    disable-default-registry-endpoint: true
  modprobe.conf: |
    options kvm_amd nested=1
    options kvm_intel nested=1
    options loop max_loop=64
  modules-load.conf: |
    br_netfilter
    bridge
    ip6_tables
    ip6table_nat
    ip_tables
    iptable_nat
    loop
    nf_conntrack
    nf_nat
    overlay
    tun
    vhost_net
    vhost_vsock
    vxlan
  registries.yaml: |
    mirrors:
      docker.io:
        endpoint:
          - http://oci-cache.oci-cache.svc.cluster.local
        rewrite:
          ^(.*)$: docker-hub/$1
      ghcr.io:
        endpoint:
          - http://oci-cache.oci-cache.svc.cluster.local
        rewrite:
          ^(.*)$: ghcr/$1
      quay.io:
        endpoint:
          - http://oci-cache.oci-cache.svc.cluster.local
        rewrite:
          ^(.*)$: quay/$1
      registry.k8s.io:
        endpoint:
          - http://oci-cache.oci-cache.svc.cluster.local
        rewrite:
          ^(.*)$: k8s/$1
      gcr.io:
        endpoint:
          - http://oci-cache.oci-cache.svc.cluster.local
        rewrite:
          ^(.*)$: gcr/$1
  run-executor.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    readonly key_file=/run/buildbuddy-key/api-key
    readonly environment_dir=/run/buildbuddy-executor
    readonly environment_file="$environment_dir/environment"
    readonly executor_name=buildbuddy-kvm-worker-executor
    readonly executor_image=buildbuddy.bbcr.io/public/buildbuddy-executor-enterprise@sha256:465d670159f7f2be756eb31815d7c6be54ce812de74a5cc49d3f6bda1fc7b078

    if [[ ! -s "$key_file" ]]; then
      echo "BuildBuddy API key is missing from the mounted bbkey disk" >&2
      exit 1
    fi

    install -d -o root -g root -m 0700 "$environment_dir"
    umask 077
    api_key="$(/usr/bin/tr -d '\r\n' <"$key_file")"
    if [[ -z "$api_key" ]]; then
      echo "BuildBuddy API key is empty" >&2
      exit 1
    fi
    printf 'BUILDBUDDY_API_KEY=%s\n' "$api_key" >"$environment_file"
    unset api_key

    if /usr/bin/docker container inspect "$executor_name" >/dev/null 2>&1; then
      /usr/bin/docker container rm --force "$executor_name"
    fi

    exec /usr/bin/docker run \
      --rm \
      --name "$executor_name" \
      --pull=missing \
      --network host \
      --env "MY_HOSTNAME=$(hostname)" \
      --env MY_POOL=kvm-vm \
      --env-file "$environment_file" \
      --volume /etc/buildbuddy/executor.yaml:/config.yaml:ro \
      --volume /var/run/docker.sock:/var/run/docker.sock \
      --volume /buildbuddy:/buildbuddy \
      "$executor_image" \
      --config_file=/config.yaml \
      --server_type=buildbuddy-executor
  sysctl.conf: |
    net.bridge.bridge-nf-call-iptables = 1
    net.bridge.bridge-nf-call-ip6tables = 1
    net.ipv4.ip_forward = 1
    vm.overcommit_memory = 1
    kernel.panic = 10
    kernel.panic_on_oops = 1
---
apiVersion: pool.kubevirt.io/v1beta1
kind: VirtualMachinePool
metadata:
  labels:
    app.kubernetes.io/part-of: buildbuddy-kvm-worker
  name: buildbuddy-kvm-worker
  namespace: buildbuddy-executor
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: buildbuddy-kvm-worker
  virtualMachineTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: buildbuddy-kvm-worker
    spec:
      dataVolumeTemplates:
        - metadata:
            name: work
          spec:
            source:
              blank: {}
            storage:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 80Gi
              storageClassName: piraeus-ssd-local-delete
              volumeMode: Filesystem
      runStrategy: Always
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: buildbuddy-kvm-worker
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: cpu-feature.node.kubevirt.io/svm
                        operator: In
                        values:
                          - "true"
                  - matchExpressions:
                      - key: cpu-feature.node.kubevirt.io/vmx
                        operator: In
                        values:
                          - "true"
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/part-of
                        operator: In
                        values:
                          - buildbuddy-kvm-worker
                  topologyKey: kubernetes.io/hostname
          domain:
            cpu:
              cores: 4
              features:
                - name: svm
                  policy: optional
                - name: vmx
                  policy: optional
              model: host-passthrough
            devices:
              autoattachGraphicsDevice: false
              disks:
                - bootOrder: 1
                  disk:
                    bus: virtio
                  name: rootdisk
                - disk:
                    bus: virtio
                  name: work
                  serial: work
                - disk:
                    bus: virtio
                  name: buildbuddy-key
                  serial: bbkey
                - disk:
                    bus: virtio
                  name: worker-config
                  serial: bbconfig
                - disk:
                    bus: virtio
                  name: cloudinit
                  serial: cloudinit
              interfaces:
                - masquerade: {}
                  name: default
                  ports: []
            firmware:
              bootloader:
                efi:
                  secureBoot: false
            resources:
              limits:
                cpu: "4"
                memory: 8Gi
              requests:
                cpu: "4"
                memory: 8Gi
          networks:
            - name: default
              pod: {}
          nodeSelector:
            topology.kubernetes.io/region: hil
          readinessProbe:
            failureThreshold: 3
            httpGet:
              httpHeaders:
                - name: server-type
                  value: buildbuddy-executor
              path: /readyz
              port: 8080
            periodSeconds: 10
            successThreshold: 1
          terminationGracePeriodSeconds: 87000
          tolerations:
            - effect: NoSchedule
              key: node-role.kubernetes.io/control-plane
              operator: Exists
          volumes:
            - containerDisk:
                image: quay.io/containerdisks/ubuntu:24.04@sha256:ea164c514b308286bdc179b403298efd2d8ae549af518a82a029e1bbb027f3a4
                imagePullPolicy: IfNotPresent
              name: rootdisk
            - dataVolume:
                name: work
              name: work
            - name: buildbuddy-key
              secret:
                secretName: buildbuddy-api-key
            - configMap:
                name: buildbuddy-kvm-worker
              name: worker-config
            - cloudInitNoCloud:
                userData: |
                  #cloud-config
                  apt:
                    primary:
                    - arches:
                      - amd64
                      uri: https://archive.ubuntu.com/ubuntu
                    security:
                    - arches:
                      - amd64
                      uri: https://security.ubuntu.com/ubuntu
                  package_update: true
                  packages:
                  - docker.io
                  fs_setup:
                  - device: /dev/disk/by-id/virtio-work
                    filesystem: ext4
                    overwrite: false
                  mounts:
                  - - /dev/disk/by-id/virtio-work
                    - /buildbuddy
                    - ext4
                    - defaults
                    - '0'
                    - '2'
                  - - /dev/disk/by-id/virtio-bbkey
                    - /run/buildbuddy-key
                    - iso9660
                    - ro
                    - '0'
                    - '0'
                  - - /dev/disk/by-id/virtio-bbconfig
                    - /run/buildbuddy-config
                    - iso9660
                    - ro
                    - '0'
                    - '0'
                  write_files:
                  - path: /etc/systemd/journald.conf.d/90-buildbuddy-kvm-worker.conf
                    permissions: '0644'
                    content: '# KubeVirt''s guest-console-log collector forwards ttyS0 output to Kubernetes
                      logs.

                      # Do not type credentials into the root-autologin serial console; echoed input
                      and

                      # journal messages are included in that existing stream.

                      [Journal]

                      ForwardToConsole=yes

                      TTYPath=/dev/ttyS0

                      MaxLevelConsole=info

                      SystemMaxUse=32M

                      SystemKeepFree=192M

                      RuntimeMaxUse=16M

                      '
                  runcmd:
                  - - systemctl
                    - restart
                    - systemd-journald.service
                  - - apt-get
                    - install
                    - -y
                    - --no-install-recommends
                    - prometheus-node-exporter
                  - - bash
                    - /run/buildbuddy-config/bootstrap.sh
                  power_state:
                    mode: reboot
                    delay: now
                    condition:
                    - test
                    - -f
                    - /var/run/reboot-required
                  ssh_pwauth: false
                  disable_root: true
              name: cloudinit
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buildbuddy-kvm-worker
  namespace: buildbuddy-executor
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: remote.buildbuddy.io
        - matchName: buildbuddy.bbcr.io
        - matchName: archive.ubuntu.com
        - matchName: security.ubuntu.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - remote.buildbuddy.io
            - buildbuddy.bbcr.io
            - archive.ubuntu.com
            - security.ubuntu.com
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: zot
            k8s:io.kubernetes.pod.namespace: oci-cache
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: buildbuddy-kvm-worker
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alloy-node
