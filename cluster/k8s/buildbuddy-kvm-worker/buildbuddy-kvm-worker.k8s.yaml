apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: buildbuddy-kvm-worker
  namespace: buildbuddy-executor
spec:
  groups:
    - name: buildbuddy-kvm-worker
      rules:
        - alert: BuildBuddyKvmPoolEmpty
