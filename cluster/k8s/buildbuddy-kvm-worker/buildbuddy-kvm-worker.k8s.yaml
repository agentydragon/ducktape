            summary: No KVM worker is ready
          expr: absent(up{namespace="buildbuddy-executor",service="buildbuddy-kvm-worker-metrics",endpoint="metrics"} == 1)
          for: 2m
          labels:
            severity: critical
        - alert: BuildBuddyKvmAutoscalerMetricsMissing
