apiVersion: v1
kind: ConfigMap
metadata:
  name: buildbuddy-kvm-worker
  namespace: buildbuddy-executor
data:
  executor.yaml: |
    # Test actions run nested Kubernetes/KubeVirt with privileged pods. The executor
    # lives inside a VM so those privileges are confined to the guest.
    docker_cap_add: ALL
    # Bounds drain for the pinned 24h task limit, 1m action termination grace, and 15s cleanup.
    # BuildBuddy applies action timeouts after input download, so preparation stalls share this bound.
    max_shutdown_duration: 24h1m15s
    executor:
      app_target: grpcs://remote.buildbuddy.io:443
      api_key: "${BUILDBUDDY_API_KEY}"
      millicpu: 4000
      # 7 GiB of the VM's 8 GiB; sizing evidence is beside the VM memory in cluster/cdk8s/buildbuddy_kvm_worker.py.
      memory_bytes: 7516192768
      max_concurrent_tasks: 2
      runner_pool:
        # Retain the K3s/KubeVirt baseline; the executor clamps this to its allocated RAM.
        max_runner_memory_usage_bytes: 10000000000
      max_task_timeout: 24h
      max_termination_grace_period: 1m
      shutdown_cleanup_duration: 15s
      root_directory: /buildbuddy/remotebuilds
      local_cache_directory: /buildbuddy/filecache
      local_cache_size_bytes: 40000000000
      docker_socket: /var/run/docker.sock
      default_isolation_type: docker
      enable_bare_runner: false
      enable_firecracker: false
      enable_oci: false
      enable_podman: false
      docker_inherit_user_ids: true
      docker_volumes:
        - /buildbuddy/k3s:/var/lib/k3s-env
        - /etc/rancher/k3s:/etc/rancher/k3s:ro
      docker_devices:
        - path_on_host: /dev
          path_in_container: /dev
          cgroup_permissions: rwm
      container_image_name_rewrites:
        - prefix: ghcr.io/
          replacement: oci-cache.oci-cache.svc.cluster.local:80/ghcr/
  k3s.yaml: |
    disable-default-registry-endpoint: true
  pool: |
    kvm-vm
  registries.yaml: |
    mirrors:
      docker.io:
        endpoint:
          - http://oci-cache.oci-cache.svc.cluster.local
        rewrite:
          ^(.*)$: docker-hub/$1
      ghcr.io:
        endpoint:
          - http://oci-cache.oci-cache.svc.cluster.local
        rewrite:
          ^(.*)$: ghcr/$1
      quay.io:
        endpoint:
          - http://oci-cache.oci-cache.svc.cluster.local
        rewrite:
          ^(.*)$: quay/$1
      registry.k8s.io:
        endpoint:
          - http://oci-cache.oci-cache.svc.cluster.local
        rewrite:
          ^(.*)$: k8s/$1
      gcr.io:
        endpoint:
          - http://oci-cache.oci-cache.svc.cluster.local
        rewrite:
          ^(.*)$: gcr/$1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: buildbuddy-executor
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: pool.kubevirt.io/v1beta1
kind: VirtualMachinePool
metadata:
  labels:
    app.kubernetes.io/part-of: buildbuddy-kvm-worker
  name: buildbuddy-kvm-worker
  namespace: buildbuddy-executor
spec:
  maxUnavailable: 1
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/part-of: buildbuddy-kvm-worker
  virtualMachineTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: buildbuddy-kvm-worker
    spec:
      dataVolumeTemplates:
        - metadata:
            name: work
          spec:
            source:
              blank: {}
            storage:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 80Gi
              storageClassName: piraeus-ssd-local-delete
              volumeMode: Filesystem
      runStrategy: Always
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: buildbuddy-kvm-worker
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: cpu-feature.node.kubevirt.io/svm
                        operator: In
                        values:
                          - "true"
                  - matchExpressions:
                      - key: cpu-feature.node.kubevirt.io/vmx
                        operator: In
                        values:
                          - "true"
          domain:
            cpu:
              cores: 4
              features:
                - name: svm
                  policy: optional
                - name: vmx
                  policy: optional
              model: host-passthrough
            devices:
              autoattachGraphicsDevice: false
              disks:
                - bootOrder: 1
                  disk:
                    bus: virtio
                  name: rootdisk
                - disk:
                    bus: virtio
                  name: work
                  serial: work
                - disk:
                    bus: virtio
                  name: buildbuddy-key
                  serial: bbkey
                - disk:
                    bus: virtio
                  name: worker-config
                  serial: bbconfig
              interfaces:
                - masquerade: {}
                  name: default
                  ports: []
            firmware:
              bootloader:
                efi:
                  secureBoot: false
            resources:
              limits:
                cpu: "4"
                memory: 8Gi
              requests:
                cpu: "2"
                memory: 8Gi
          networks:
            - name: default
              pod: {}
          readinessProbe:
            failureThreshold: 3
            httpGet:
              httpHeaders:
                - name: server-type
                  value: buildbuddy-executor
              path: /readyz
              port: 8080
            periodSeconds: 10
            successThreshold: 1
          terminationGracePeriodSeconds: 87000
          tolerations:
            - effect: NoSchedule
              key: node-role.kubernetes.io/control-plane
              operator: Exists
          volumes:
            - containerDisk:
                image: git.allegedly.works/ducktape-ci/buildbuddy-kvm-worker-spike@sha256:8490616944d9817efd3a756a22ad54824639e3d615c7fd3de76deb9b053a0268
                imagePullPolicy: IfNotPresent
                imagePullSecret: forgejo-images-creds
              name: rootdisk
            - dataVolume:
                name: work
              name: work
            - name: buildbuddy-key
              secret:
                secretName: buildbuddy-api-key
            - configMap:
                name: buildbuddy-kvm-worker
              name: worker-config
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buildbuddy-kvm-worker
  namespace: buildbuddy-executor
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: remote.buildbuddy.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - remote.buildbuddy.io
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: zot
            k8s:io.kubernetes.pod.namespace: oci-cache
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: buildbuddy-kvm-worker
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alloy-node
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9100"
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/part-of: buildbuddy-kvm-worker
  name: buildbuddy-kvm-worker-metrics
  namespace: buildbuddy-executor
spec:
  ports:
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: 9090
    - name: node-metrics
      port: 9100
      protocol: TCP
      targetPort: 9100
  selector:
    app.kubernetes.io/part-of: buildbuddy-kvm-worker
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: buildbuddy-kvm-worker
  namespace: buildbuddy-executor
spec:
  endpoints:
    - path: /metrics
      port: metrics
    - path: /metrics
      port: node-metrics
  selector:
    matchLabels:
      app.kubernetes.io/part-of: buildbuddy-kvm-worker
---
