apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tofu-state-db
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: tofu-state-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      current: has(status.applied) && status.applied && has(status.observedGeneration) && status.observedGeneration == metadata.generation
      kind: Database
  interval: 10m
  path: ./cluster/k8s/tofu-state/db
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: tofu-state-db
    namespace: ducktape-flux
  timeout: 5m
  wait: true
