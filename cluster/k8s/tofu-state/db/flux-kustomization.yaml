apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tofu-state-db
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/tofu-state/db
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: >-
        has(status) && has(status.applied) && status.applied &&
        has(status.observedGeneration) && status.observedGeneration == metadata.generation
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: tofu-state-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
