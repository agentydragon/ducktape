# Root-scoped Terraform state credentials. Each Password generator is immutable
# after first reconciliation; CNPG consumes the resulting basic-auth Secret.
# A later cutover permits Reflector to copy only that root's credential to its
# destination namespace.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tofu-state-agent-machine-access-generator
  namespace: tofu-state
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tofu-state-agent-machine-access-credentials
  namespace: tofu-state
spec:
  refreshPolicy: CreatedOnce
  target:
    name: tofu-state-agent-machine-access-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "tfstate_agent_machine_access"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tofu-state-agent-machine-access-generator
