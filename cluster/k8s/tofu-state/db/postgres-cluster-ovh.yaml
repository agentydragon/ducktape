apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tofu-state-db-ovh
  namespace: tofu-state
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    topologyKey: kubernetes.io/hostname

  storage:
    storageClass: local-path-ovh
    size: 1Gi

  monitoring:
    enablePodMonitor: true

  managed:
    roles:
      - name: tfstate
        ensure: present
        login: true
        passwordSecret:
          name: tofu-state-db-credentials
