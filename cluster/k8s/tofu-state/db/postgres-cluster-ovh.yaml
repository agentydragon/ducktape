apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tofu-state-db-ovh
  namespace: tofu-state
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  probes:
    liveness:
      isolationCheck:
        enabled: false

  postgresql:
    # A tf-runner holds a session-scoped advisory lock for the length of a plan
    # or apply. When its node drops off the network the session survives — no
    # RST from a vanished peer — and every later run on that state fails with
    # "error acquiring the state lock" until the kernel reaps the socket. On the
    # defaults (tcp_keepalive_time 7200 + 9 probes x 75s) that is 2h11m, and
    # tofu-controller retries into the lock the whole time: a single node loss
    # wedged sso-providers, dns-records, agent-machine-access and
    # alloy-otlp-bearer-token on 2026-09-16, and through sso-providers-tf ->
    # forgejo -> forgejo-images, 55 Kustomizations behind them.
    #
    # Probing an idle connection detects a dead peer in ~2min instead. A live
    # runner answers the probes, so a long plan is never cut off; only a peer
    # that is actually gone is. idle_session_timeout is the wrong knob here — it
    # would kill a healthy runner that is idle between statements mid-apply.
    parameters:
      tcp_keepalives_idle: "60"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "6"

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    topologyKey: kubernetes.io/hostname
    # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
    # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
    # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  storage:
    storageClass: local-path-ovh
    size: 1Gi

  monitoring:
    enablePodMonitor: true

  managed:
    roles:
      - name: tfstate
        ensure: present
        login: true
        passwordSecret:
          name: tofu-state-db-credentials
