apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tofu-state-db-ovh
  namespace: tofu-state
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    topologyKey: kubernetes.io/hostname
    # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
    # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
    # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  storage:
    storageClass: local-path-ovh
    size: 1Gi

  monitoring:
    enablePodMonitor: true

  postgresql:
    pg_hba:
      # Isolate the Ollama state login and database in both directions before
      # CNPG's default host rule. Other state runners keep their existing access.
      - hostssl tfstate_ollama_bearer_token tfstate_ollama_bearer_token all scram-sha-256
      - host all tfstate_ollama_bearer_token all reject
      - host tfstate_ollama_bearer_token all all reject

  managed:
    roles:
      - name: tfstate
        ensure: present
        login: true
        passwordSecret:
          name: tofu-state-db-credentials
      - name: tfstate_ollama_bearer_token
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inRoles: []
        passwordSecret:
          name: tofu-state-ollama-bearer-token-credentials
      # The abandoned state-isolation pilot created these login roles.  Keep
      # their absence declarative after the matching Database tombstones drop
      # the databases they own.
      - name: tfstate_agent_machine_access
        ensure: absent
      - name: tfstate_alloy_otlp_bearer_token
        ensure: absent
      - name: tfstate_augur_evidence
        ensure: absent
      - name: tfstate_budget_ledger
        ensure: absent
      - name: tfstate_cpap_data
        ensure: absent
      - name: tfstate_dns_records
        ensure: absent
      - name: tfstate_flux_webhook_token
        ensure: absent
      - name: tfstate_forgejo_agentydragon
        ensure: absent
      - name: tfstate_forgejo_agentydragon_repos
        ensure: absent
      - name: tfstate_forgejo_claude
        ensure: absent
      - name: tfstate_forgejo_images
        ensure: absent
      - name: tfstate_gatus_sso
        ensure: absent
      - name: tfstate_github_branch_protection
        ensure: absent
      - name: tfstate_github_secrets_sync
        ensure: absent
      - name: tfstate_haku_state
        ensure: absent
      - name: tfstate_infra_drift
        ensure: absent
      - name: tfstate_litellm_api_key
        ensure: absent
      - name: tfstate_litellm_keys
        ensure: absent
      - name: tfstate_sso_providers
        ensure: absent
      - name: tfstate_thrive_scrape
        ensure: absent
