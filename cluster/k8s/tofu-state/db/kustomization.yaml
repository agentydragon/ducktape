apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# credentials.sops.yaml holds the tfstate PG role password. CNPG reconciles
# the tfstate role from this Secret via spec.managed.roles in
# postgres-cluster-ovh.yaml, so a SOPS rotation auto-propagates to PG via
# ALTER ROLE. Terraform CR runners (PGPASSWORD env) and cluster/.envrc read
# the same Secret directly.
resources:
  - credentials.sops.yaml
  - postgres-cluster-ovh.yaml
