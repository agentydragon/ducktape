apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubevirt-operator
  namespace: ducktape-flux
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: virt-operator
      namespace: kubevirt
  interval: 10m
  path: ./cluster/k8s/kubevirt/operator
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: kubevirt-operator
    namespace: ducktape-flux
  timeout: 10m
  wait: true
