apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  annotations:
    description: Containerized Data Importer for KubeVirt VM disk image imports.
  name: cdi
spec:
  config:
    featureGates:
      - HonorWaitForFirstConsumer
      - WebhookPvcRendering
    podResourceRequirements:
      limits:
        cpu: 750m
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 128Mi
    scratchSpaceStorageClass: local-path-ovh
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      topology.kubernetes.io/region: hil
  workload:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io/region
                  operator: In
                  values:
                    - hil
                    - home
                    - proxmox
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
