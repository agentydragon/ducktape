apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cdi
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: cdi-operator
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cdi-apiserver
      namespace: cdi
    - apiVersion: apps/v1
      kind: Deployment
      name: cdi-deployment
      namespace: cdi
    - apiVersion: apps/v1
      kind: Deployment
      name: cdi-uploadproxy
      namespace: cdi
  interval: 10m
  path: ./cluster/k8s/kubevirt/cdi
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: cdi
    namespace: ducktape-flux
  timeout: 10m
  wait: true
