apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cdi-operator
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/kubevirt/cdi-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cdi-operator
      namespace: cdi
