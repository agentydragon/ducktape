apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # cdk8s-generated (cluster/cdk8s/ollama/app.py). The RoleBinding's ServiceAccount
  # subject is cross-namespace (claude-sandbox), so namespace is set per-generator
  # below rather than via a top-level `namespace:` transformer, which would rewrite
  # that subject too.
  - ollama.k8s.yaml

configMapGenerator:
  - name: gpt-oss-scripts
    namespace: ollama
    options:
      disableNameSuffixHash: true
    files:
      - setup-gpt-oss-v2.sh
  - name: ollama-auth-proxy
    namespace: ollama
    options:
      disableNameSuffixHash: true
    files:
      - default.conf.template=nginx-auth-proxy.conf.template
      - nginx.conf
