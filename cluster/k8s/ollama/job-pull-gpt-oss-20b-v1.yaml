apiVersion: batch/v1
kind: Job
metadata:
  name: pull-gpt-oss-20b-v1
  namespace: ollama
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      containers:
        - name: pull
          image: ollama/ollama:latest
          command: ["ollama", "pull", "gpt-oss:20b"]
          env:
            - name: OLLAMA_HOST
              value: "http://ollama.ollama.svc.cluster.local:11434"
