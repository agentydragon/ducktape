apiVersion: v1
kind: ConfigMap
metadata:
  name: gpt-oss-modelfiles
  namespace: ollama
data:
  Modelfile-256k: |
    FROM gpt-oss:20b

    # Extend context to 256k via linear RoPE position interpolation.
    # rope_freq_scale = native_ctx / target_ctx = 128k / 256k = 0.5
    # Note: NTK-aware scaling (rope_freq_base) would be better but requires
    # knowing the model's native base from the GGUF metadata.
    PARAMETER num_ctx 262144
    PARAMETER rope_freq_scale 0.5

  Modelfile-512k: |
    FROM gpt-oss:20b

    # Extend context to 512k via linear RoPE position interpolation.
    # rope_freq_scale = native_ctx / target_ctx = 128k / 512k = 0.25
    # WARNING: KV cache at q8_0 for a 20B model ≈ 40 GB at 512k context.
    # Requires sufficient GPU VRAM + CPU RAM for offloaded layers.
    PARAMETER num_ctx 524288
    PARAMETER rope_freq_scale 0.25
