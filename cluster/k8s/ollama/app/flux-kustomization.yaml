apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama
  namespace: ducktape-flux
spec:
  # CLEANUP(added 2026-07-17): Un-suspend (remove this `suspend` line) once the
  #   wyrm2 GPU inference experiments in cluster/docs/inference/ are done —
  #   check by 2026-07-31. Suspended so Flux stops re-reconciling ollama back to
  #   1 replica; it holds both RTX 5090s and preempts the vLLM bench pods during
  #   their crash/restart gaps. While suspended, ollama runs 0 replicas.
  suspend: true
  interval: 10m
  path: ./cluster/k8s/ollama/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 10m
  dependsOn:
    - name: ollama-namespace
      namespace: ducktape-flux
    - name: ollama-secrets
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: nvidia-device-plugin
      namespace: ducktape-flux
