apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/ollama/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 10m
  dependsOn:
    - name: ollama-namespace
      namespace: ducktape-flux
    - name: ollama-secrets
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: nvidia-device-plugin
      namespace: ducktape-flux
