apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/ollama/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
    - name: ollama-namespace
    - name: ollama-secrets
    - name: gateway
    - name: cert-manager-environment
    - name: nvidia-device-plugin
