apiVersion: batch/v1
kind: Job
metadata:
  name: setup-gpt-oss-v1
  namespace: ollama
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      volumes:
        - name: modelfiles
          configMap:
            name: gpt-oss-modelfiles
      containers:
        - name: setup
          image: ollama/ollama:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ollama pull gpt-oss:20b
              ollama pull gpt-oss:120b
              ollama create gpt-oss-256k -f /modelfiles/Modelfile-256k
              ollama create gpt-oss-512k -f /modelfiles/Modelfile-512k
          env:
            - name: OLLAMA_HOST
              value: "http://ollama.ollama.svc.cluster.local:11434"
          volumeMounts:
            - name: modelfiles
              mountPath: /modelfiles
