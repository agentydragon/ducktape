apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: litellm
  namespace: ollama
spec:
  type: oci
  url: oci://ghcr.io/berriai/litellm-helm
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: ollama
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: litellm-helm
      version: "1.81.13"
      sourceRef:
        kind: HelmRepository
        name: litellm
        namespace: ollama
  values:
    proxy_config:
      model_list:
        - model_name: gpt-oss-20b-128k
          litellm_params:
            model: ollama/gpt-oss:20b
            api_base: http://ollama.ollama.svc.cluster.local:11434
      general_settings:
        master_key: os.environ/LITELLM_MASTER_KEY
    masterkeySecretName: ollama-api-key
    masterkeySecretKey: api-key
    # No standalone database needed for simple proxying
    db:
      deployStandalone: false
    migrationJob:
      enabled: false
