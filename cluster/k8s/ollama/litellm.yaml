apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: litellm
  namespace: ollama
spec:
  type: oci
  url: oci://ghcr.io/berriai
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: ollama
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: litellm-helm
      version: "1.81.13"
      sourceRef:
        kind: HelmRepository
        name: litellm
        namespace: ollama
  values:
    # Chart 1.81.13 defaults to image tag main-v1.81.13 which doesn't exist
    # on ghcr.io (upstream issue BerriAI/litellm#15288). Pin to main-stable.
    image:
      tag: "main-stable"
    proxy_config:
      model_list:
        - model_name: gpt-oss-20b-128k
          litellm_params:
            model: ollama/gpt-oss:20b
            api_base: http://ollama.ollama.svc.cluster.local:11434
        - model_name: gpt-oss-20b-1m
          litellm_params:
            model: ollama/gpt-oss:20b
            api_base: http://ollama.ollama.svc.cluster.local:11434
            extra_body:
              options:
                num_ctx: 1048576
        # RoPE-scaled variants (Modelfile-based): proper position interpolation
        # for context beyond the model's native 128k training window.
        - model_name: gpt-oss-20b-256k
          litellm_params:
            model: ollama/gpt-oss-256k
            api_base: http://ollama.ollama.svc.cluster.local:11434
        - model_name: gpt-oss-20b-512k
          litellm_params:
            model: ollama/gpt-oss-512k
            api_base: http://ollama.ollama.svc.cluster.local:11434
        - model_name: gpt-oss-120b-128k
          litellm_params:
            model: ollama/gpt-oss:120b
            api_base: http://ollama.ollama.svc.cluster.local:11434
      general_settings:
        master_key: os.environ/LITELLM_MASTER_KEY
      litellm_settings:
        drop_params: true
        success_callback: ["langfuse"]
      environment_variables:
        LANGFUSE_HOST: "http://langfuse-web.langfuse.svc.cluster.local:3000"
    masterkeySecretName: ollama-api-key
    masterkeySecretKey: api-key
    # Inject LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY from ESO-synced secret.
    # The secret won't exist until Langfuse API keys are seeded in Vault —
    # see cluster/k8s/props/plan.md for the required manual step.
    environmentSecrets:
      - langfuse-api-keys
    # No standalone database needed for simple proxying
    db:
      deployStandalone: false
    migrationJob:
      enabled: false
