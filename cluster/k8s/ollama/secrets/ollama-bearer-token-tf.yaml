apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: ollama-bearer-token
  namespace: ollama
spec:
  interval: 15m
  approvePlan: "auto"
  destroyResourcesOnDeletion: false
  refreshBeforeApply: true
  path: ./tf/gitops/ollama-bearer-token
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  serviceAccountName: tf-runner
  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate_ollama_bearer_token@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate_ollama_bearer_token?sslmode=require"
        schema_name = "ollama_bearer_token"
      }
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tofu-state-ollama-bearer-token-credentials
              key: password
  vars: []
