apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama-secrets
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/ollama/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: ollama-direct-token
      namespace: ollama
  timeout: 10m
  dependsOn:
    - name: ollama-namespace
      namespace: ducktape-flux
    - name: external-secrets-config # langfuse ESO remains
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
