apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama-secrets
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/ollama/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: litellm-api-key
      namespace: flux-system
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: ollama-bearer-token
      namespace: flux-system
  timeout: 10m
  dependsOn:
    - name: ollama-namespace
      namespace: ducktape-flux
    - name: external-secrets-config # langfuse ESO remains
      namespace: ducktape-flux
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
