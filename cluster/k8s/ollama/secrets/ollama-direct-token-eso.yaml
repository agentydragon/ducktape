# ESO owns a fresh direct-Ollama bearer token. The separate name makes this
# cutover safe: Flux can prune the Terraform-owned Secret only after every
# consumer has switched to this target.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ollama-direct-token
  namespace: ollama
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ollama-direct-token
  namespace: ollama
spec:
  # A direct-API credential is generated once, not periodically rotated.
  refreshInterval: 8760h
  target:
    name: ollama-direct-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: claude-sandbox
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: claude-sandbox
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ollama-direct-token
