apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ollama-reader
  namespace: ollama
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/portforward
      - services
      - configmaps
      - events
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["infra.contrib.fluxcd.io"]
    resources: ["terraforms"]
    verbs: ["get", "list", "watch"]
