apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: gateway
      namespace: ducktape-flux
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: nvidia-runtimeclass
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: claude-rbac
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: ollama-direct-token
      namespace: ollama
  interval: 10m
  path: ./cluster/k8s/ollama
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: ollama-app
    namespace: ducktape-flux
  timeout: 10m
