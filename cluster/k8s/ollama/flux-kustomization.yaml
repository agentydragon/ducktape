apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/ollama
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: litellm
      namespace: ollama
  dependsOn:
    - name: cert-manager-issuer-config
    - name: ollama-namespace
    - name: ollama-secrets
    - name: gateway
    - name: cert-manager-environment
    - name: nvidia-device-plugin
