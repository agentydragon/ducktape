apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama-namespace
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/ollama/namespace
  prune: false # Preserve the namespace during the ownership handoff to ollama.
  sourceRef:
    kind: ExternalArtifact
    name: ollama-namespace
    namespace: ducktape-flux
  timeout: 2m
