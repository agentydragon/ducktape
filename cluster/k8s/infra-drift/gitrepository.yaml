# Dedicated source: the shared flux-system GitRepository sparse-checks-out only
# deployment paths (cluster/k8s/, tf/gitops/, ...), so cluster/terraform/ is
# absent from its artifact and the runner fails with "terraform path not
# found". Its sparseCheckout cannot be extended either — gotk-sync.yaml is
# flux-generated and marked DO NOT EDIT.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: infra-drift-source
  namespace: flux-system
  annotations:
    description: >-
      Filtered checkout of the metal tofu root, its module tree, the SOPS
      secrets it reads and nebula-mesh.json, for the infra-drift plan-only
      Terraform CR.
spec:
  interval: 10m
  ref:
    branch: devel
  url: https://github.com/agentydragon/ducktape.git
  # `ignore` rather than `sparseCheckout`: nebula.tf's locals read the repo-root
  # nebula-mesh.json, and sparseCheckout takes directories only. Exclude-all
  # then re-include, spelling out each parent — gitignore cannot re-include a
  # path whose parent directory is excluded.
  ignore: |
    /*
    !/nebula-mesh.json
    # data.sops_file.ovh_{credentials,rescue_ssh} and, if -target ever stops
    # pruning them, the nebula certs under secrets/nebula/. Ciphertext only.
    !/secrets
    !/cluster
    /cluster/*
    !/cluster/terraform
    # Every file()-family call in the root, wherever it sits: -target does not
    # prune configuration evaluation. talos-cloud-controller-manager for
    # talos-ccm.tf's locals, flux-system for null_resource.flux_bootstrap's
    # triggers. The rest of cluster/k8s (10 MB) reads nothing.
    !/cluster/k8s
    /cluster/k8s/*
    !/cluster/k8s/talos-cloud-controller-manager
    !/cluster/k8s/flux-system
    # module "wyrm2_image": `tofu init` installs every module block in the
    # config, whether or not -target keeps it in the plan graph.
    !/terraform
    /terraform/*
    !/terraform/modules
