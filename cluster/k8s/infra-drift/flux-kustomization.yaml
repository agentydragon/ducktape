apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-drift
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: infra-drift
      namespace: flux-system
  interval: 10m
  path: ./cluster/k8s/infra-drift
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: infra-drift
    namespace: ducktape-flux
  timeout: 10m
