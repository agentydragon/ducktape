apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-rbac-read-only
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/claude-rbac-read-only
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: claude-rbac
  timeout: 2m
