apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: props
  namespace: ducktape-flux
spec:
  # Props is intentionally parked. Flip this to false to revive the package.
  suspend: true
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./props/deploy
  prune: true
  wait: true
  deletionPolicy: WaitForTermination
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: cnpg
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: external-secrets-operator
      namespace: ducktape-flux
    - name: forgejo
      namespace: ducktape-flux
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: forgejo-props
      namespace: flux-system
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: props-registry-pull
      namespace: props
    - apiVersion: apps/v1
      kind: Deployment
      name: props
      namespace: props
