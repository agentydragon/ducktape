apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: ExternalArtifact
    name: headlamp-app
    namespace: ducktape-flux
  path: ./cluster/k8s/headlamp
  prune: true
  wait: true
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: headlamp
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: headlamp
      namespace: headlamp
  dependsOn:
    - name: gateway
      namespace: ducktape-flux
    - name: sso-providers-tf
      namespace: ducktape-flux
