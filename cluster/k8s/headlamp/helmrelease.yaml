---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: headlamp
      # 0.45.0 ships the Prometheus details-view plugin, enabled by default.
      version: "0.45.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: headlamp
  values:
    replicaCount: 1

    podAnnotations:
      reloader.stakater.com/auto: "true"

    config:
      # OIDC mode: Headlamp redirects to Authentik, JWT forwarded to K8s API server
      # which validates it via oidc-issuer-url (in Talos machine config).
      # Each user gets their own K8s identity (oidc:<username>).
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: true
          name: headlamp-oidc-secret
      watchPlugins: true

    httpRoute:
      enabled: true
      parentRefs:
        - name: cluster-gateway
          namespace: gateway-system
      hostnames:
        - "headlamp.allegedly.works"

    ingress:
      enabled: false

    nodeSelector:
      topology.kubernetes.io/region: hil
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    pluginsManager:
      enabled: true
      version: "0.1.1"
      configContent: |
        plugins:
          - name: headlamp_flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: "0.7.0"
          - name: headlamp_cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: "0.1.1"
          - name: headlamp_kyverno
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_kyverno
            version: "0.1.0"
          - name: headlamp_keda
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_keda
            version: "0.1.2"
          - name: headlamp_kubevirt
            source: https://artifacthub.io/packages/headlamp/headlamp-kubevirt/headlamp_kubevirt
            version: "0.3.1"
        installOptions:
          parallel: true
          maxConcurrent: 2
