apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: gateway
    namespace: ducktape-flux
  path: ./cluster/k8s/gateway
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager
      namespace: ducktape-flux
    - name: kyverno
      namespace: ducktape-flux
    - name: cert-manager-issuer-config
      namespace: ducktape-flux
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  healthChecks:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: cluster-gateway
      namespace: gateway-system
