apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sshpiper-crds
  namespace: ducktape-flux
  annotations:
    description: The sshpiper Pipe CRD, cluster-scoped so any namespace running an sshpiperd can declare routes. Vendored verbatim from tg123/sshpiper at the tag the deployed image is pinned to.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 2m
  path: ./cluster/k8s/sshpiper-crds
  # Pruning a CRD deletes every instance with it; removing one is a deliberate manual step, as
  # for the other CRD Kustomizations (agentplane-crds, external-secrets-crds).
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
