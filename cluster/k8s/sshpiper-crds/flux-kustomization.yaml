apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: The sshpiper Pipe CRD, sourced from the tag used by the deployed image.
  name: sshpiper-crds
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./plugin/kubernetes
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: sshpiper-source
    namespace: ducktape-flux
  timeout: 2m
  wait: true
