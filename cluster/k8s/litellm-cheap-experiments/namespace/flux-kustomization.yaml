apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-cheap-experiments-namespace
  namespace: ducktape-flux
  annotations:
    description: Dedicated namespace for the temporary-grant LiteLLM agent key.
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/litellm-cheap-experiments/namespace
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: litellm-cheap-experiments-namespace
    namespace: ducktape-flux
  timeout: 2m
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: litellm-cheap-experiments
