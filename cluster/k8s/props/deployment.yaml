apiVersion: apps/v1
kind: Deployment
metadata:
  name: props
  labels:
    app: props
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: props
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: props
        app.kubernetes.io/component: backend
    spec:
      imagePullSecrets:
        - name: harbor-ci-robot
      containers:
        - name: props-backend
          image: registry.allegedly.works/props/props-backend:latest # {"$imagepolicy": "flux-system:props-backend"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PROPS_CONFIG_FILE
              value: /etc/props/config.toml
            - name: PROPS_LOG_OUTPUT
              value: stderr
            - name: PROPS_REGISTRY_UPSTREAM_URL
              value: http://props-registry:5000
            - name: PROPS_REGISTRY_HOST
              value: props
            - name: PROPS_REGISTRY_PORT
              value: "8000"
            - name: PGHOST
              value: props-postgresql
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: eval_results
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: props-postgresql
                  key: postgres-password
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: props-openai-api-key
                  key: api-key
                  optional: true
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: props-ollama-api-key
                  key: api-key
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/props
              readOnly: true
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      volumes:
        - name: config
          configMap:
            name: props-config
