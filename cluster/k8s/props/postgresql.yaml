---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami-oci
spec:
  type: oci
  url: oci://registry-1.docker.io/bitnamicharts
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: props-postgresql
spec:
  interval: 10m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: postgresql
      version: "18.1.13"
      sourceRef:
        kind: HelmRepository
        name: bitnami-oci
      interval: 24h
  values:
    auth:
      database: eval_results
      username: postgres
    primary:
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      persistence:
        enabled: true
        size: 10Gi
