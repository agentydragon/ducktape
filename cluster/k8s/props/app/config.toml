auto_migrate = true
auto_sync_specimens = true
backend_url = "http://props:8000"
# Agents reach the LLM proxy (split out of the backend) here, not the dashboard,
# so the API server can roll without disrupting in-flight agents. See
# cluster/k8s/props/app/llm-proxy-deployment.yaml.
llm_proxy_url = "http://props-llm-proxy:8000"
# Default evaluator: the grader supervisor auto-grades critic runs with this
# model. glm-4.6 (z.ai via LiteLLM) so grading runs without the home GPU host.
grader_model = "glm-4.6"

[executor]
type = "kubernetes"
namespace = "props"
image_pull_secret = "props-forgejo-robot"

[agent_env]
# Agents connect to the CNPG primary (read-write) service. Must match the
# backend's PGHOST (deployment.yaml). The old Bitnami "props-postgresql"
# service no longer exists since the CNPG migration, so a stale value here
# makes every critic/grader crash at Database.from_env() before any work.
PGHOST = "props-db-rw"
PGPORT = "5432"
PGDATABASE = "eval_results"

[upstreams.ollama]
url = "http://ollama.ollama.svc.cluster.local:11434/v1"
api_key_env = "OLLAMA_API_KEY"

# In-cluster LiteLLM. Chat-shaped models use props' /v1/chat/completions
# endpoint directly so LiteLLM stays on its native chat path.
[upstreams.litellm]
url = "http://litellm.litellm.svc.cluster.local:4000/v1"
api_key_env = "LITELLM_API_KEY"

[[models]]
name = "gpt-oss-20b-128k"
upstream = "ollama"
upstream_model = "gpt-oss:20b"
input_usd_per_1m_tokens = 0
cached_input_usd_per_1m_tokens = 0
output_usd_per_1m_tokens = 0
context_window_tokens = 131072
max_output_tokens = 131072
max_parallel_agents = 3

# z.ai GLM-4.6 via LiteLLM (api.z.ai coding plan). Pricing = z.ai list rates.
[[models]]
name = "glm-4.6"
upstream = "litellm"
upstream_model = "glm-4.6"
api_shape = "chat_completions"
input_usd_per_1m_tokens = 0.39
cached_input_usd_per_1m_tokens = 0.39
output_usd_per_1m_tokens = 1.74
context_window_tokens = 200000
max_output_tokens = 131072
max_parallel_agents = 2
