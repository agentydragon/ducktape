apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: props

configMapGenerator:
  - name: props-config
    files:
      - config.toml
    options:
      disableNameSuffixHash: true

resources:
  - rbac-executor.yaml
  - deployment.yaml
  - service.yaml
  - llm-proxy-deployment.yaml
  - llm-proxy-service.yaml
  - registry-proxy-deployment.yaml
  - registry-proxy-service.yaml
  - httproute.yaml
  - registry-httproute.yaml
  - rolebinding-ollama-consumer.yaml
