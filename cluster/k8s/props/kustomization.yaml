apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: props

resources:
  - postgresql.yaml
  - deployment.yaml
  - service.yaml
  - registry-deployment.yaml
  - registry-pvc.yaml
  - registry-service.yaml
  - backup-cronjob.yaml
  - backup-pvc.yaml
  - httproute.yaml
  - rolebinding-ollama-consumer.yaml

configMapGenerator:
  - name: props-config
    options:
      disableNameSuffixHash: true
    files:
      - config.toml
