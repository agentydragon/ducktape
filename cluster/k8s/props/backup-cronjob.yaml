apiVersion: batch/v1
kind: CronJob
metadata:
  name: props-backup
  labels:
    app: props-backup
    app.kubernetes.io/component: backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: props-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            topology.kubernetes.io/region: proxmox
          containers:
            - name: backup
              image: docker.io/bitnami/postgresql:17
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/props_${TIMESTAMP}.sql.gz"
                  echo "Starting backup: ${BACKUP_FILE}"
                  pg_dump -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" | gzip > "${BACKUP_FILE}"
                  echo "Backup complete: $(du -h "${BACKUP_FILE}" | cut -f1)"
                  # Clean up old backups
                  DELETED=$(find /backups -name "props_*.sql.gz" -mtime +7 -delete -print | wc -l)
                  echo "Deleted ${DELETED} backups older than 7 days"
              env:
                - name: PGHOST
                  value: props-postgresql
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: eval_results
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: props-postgresql
                      key: postgres-password
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: props-backup
