apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: props-postgresql
  namespace: props
spec:
  interval: 10m
  chart:
    spec:
      chart: postgresql
      version: "18.1.13"
      sourceRef:
        kind: HelmRepository
        name: bitnami-oci
        namespace: props
  values:
    auth:
      database: eval_results
      username: postgres
    primary:
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      resources:
        requests:
          memory: 128Mi
          cpu: 100m
      persistence:
        enabled: true
        size: 10Gi
        storageClass: proxmox-csi-retain
