apiVersion: apps/v1
kind: Deployment
metadata:
  name: props-registry
  labels:
    app: props-registry
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: props-registry
      app.kubernetes.io/component: registry
  template:
    metadata:
      labels:
        app: props-registry
        app.kubernetes.io/component: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          env:
            # Without this, registry:2 returns absolute Location headers
            # with the internal hostname (props-registry:5000) during blob
            # uploads. External clients (e.g. CI) can't resolve that hostname.
            # Relative URLs work correctly through the backend proxy.
            - name: REGISTRY_HTTP_RELATIVEURLS
              value: "true"
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          livenessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: props-registry
