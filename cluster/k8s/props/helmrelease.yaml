apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: props
  namespace: props
spec:
  interval: 10m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: props/helm
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
      interval: 5m
  values:
    nodeSelector:
      topology.kubernetes.io/region: proxmox
    image:
      repository: registry.allegedly.works/props/props-backend
      tag: latest # {"$imagepolicy": "flux-system:props-backend:tag"}
      pullPolicy: Always
    imagePullSecrets:
      - name: harbor-ci-robot
    config:
      auto_migrate: true
      auto_sync_specimens: true
      backend_url: "http://props:8000"
      grader_model: ""
      agent_env:
        PGHOST: "props-postgresql"
        PGPORT: "5432"
        PGDATABASE: "eval_results"
      executor:
        type: "kubernetes"
        namespace: "props"
      upstreams:
        ollama:
          url: "http://litellm.ollama.svc.cluster.local:4000/v1"
          api_key_env: "OLLAMA_API_KEY"
      models:
        - name: "gpt-oss-20b-128k"
          upstream: "ollama"
          upstream_model: "gpt-oss-20b-128k"
          input_usd_per_1m_tokens: 0
          cached_input_usd_per_1m_tokens: 0
          output_usd_per_1m_tokens: 0
          context_window_tokens: 131072
          max_output_tokens: 131072
    existingSecrets:
      openaiApiKey:
        name: "props-openai-api-key"
        key: "api-key"
      ollamaApiKey:
        name: "props-ollama-api-key"
        key: "api-key"
    postgresql:
      enabled: true
      auth:
        database: eval_results
        username: postgres
      primary:
        nodeSelector:
          topology.kubernetes.io/region: proxmox
        persistence:
          enabled: true
          size: 10Gi
    # Ingress disabled — traffic routed via Gateway API HTTPRoute
    ingress:
      enabled: false
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: "${LETSENCRYPT_ISSUER}"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - host: props.allegedly.works
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - props.allegedly.works
          secretName: props-tls
    backup:
      enabled: true
      schedule: "0 3 * * *"
      retention:
        days: 7
      persistence:
        enabled: true
        size: 5Gi
        storageClassName: proxmox-csi-retain
    registry:
      enabled: true
      persistence:
        enabled: true
        storageClassName: proxmox-csi-retain
        size: 50Gi
