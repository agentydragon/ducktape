apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: talos-image-factory
  namespace: oci-cache
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: talos-image-factory
  ingress:
    # The Gateway may reach only the public auth proxy for general requests.
    # Nginx accepts GET/HEAD under /image/ and /v2/ and requires Basic auth.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Only release/version metadata is public. Cilium also blocks the Gateway
    # from reaching any other unauthenticated Factory API on this port.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "^/versions$"
              - method: HEAD
                path: "^/versions$"
              - method: GET
                path: "^/version/[^/]+/(extensions|overlays)/official$"
              - method: HEAD
                path: "^/version/[^/]+/(extensions|overlays)/official$"
    # kubectl port-forward reaches the Pod from the node host identity. Keep
    # the full write-capable API available there, not through the Gateway.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "2122"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: oci-cache
            app.kubernetes.io/name: zot
      toPorts:
        - ports:
            # Cilium enforces on Zot's targetPort, not the Service port 80.
            - port: "5000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
