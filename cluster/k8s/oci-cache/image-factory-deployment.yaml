apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos-image-factory
  namespace: oci-cache
  labels:
    app.kubernetes.io/name: talos-image-factory
  annotations:
    description: >-
      Self-hosted Talos Image Factory. It reads GHCR through Zot's pull-through
      cache and stores schematic, installer, and build-cache OCI artifacts in
      dedicated Zot repositories backed by SeaweedFS.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: talos-image-factory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talos-image-factory
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-factory
          image: ghcr.io/siderolabs/image-factory:v1.7.0
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/image-factory/config.json"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 2122
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/image-factory
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: talos-image-factory-config
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
