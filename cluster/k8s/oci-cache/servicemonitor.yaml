apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: zot
  namespace: oci-cache
  annotations:
    description: Zot OCI-cache application metrics scraped into Mimir by Alloy.
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
