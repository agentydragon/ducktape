apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oci-cache-namespace
  namespace: ducktape-flux
spec:
  interval: 1h
  path: ./cluster/k8s/oci-cache/namespace
  prune: false
  # The Namespace is about to be adopted by the consolidated oci-cache
  # Kustomization. Orphan it if this owner is removed during that handoff.
  deletionPolicy: Orphan
  sourceRef:
    kind: ExternalArtifact
    name: oci-cache-namespace
    namespace: ducktape-flux
  timeout: 1m
