apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oci-cache-namespace
  namespace: ducktape-flux
spec:
  interval: 1h
  path: ./cluster/k8s/oci-cache/namespace
  prune: false
  sourceRef:
    kind: ExternalArtifact
    name: oci-cache-namespace
    namespace: ducktape-flux
  timeout: 1m
