apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: talos-image-factory
  namespace: oci-cache
  annotations:
    description: >-
      Public read-only release metadata plus Basic-authenticated Talos image
      artifacts. Schematic writes are available only through port-forward.
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "talos-image-factory.allegedly.works"
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /versions
        - method: HEAD
          path:
            type: Exact
            value: /versions
      backendRefs:
        - name: talos-image-factory-internal
          port: 8080
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /version/
        - method: HEAD
          path:
            type: PathPrefix
            value: /version/
      backendRefs:
        - name: talos-image-factory-internal
          port: 8080
    - backendRefs:
        - name: talos-image-factory
          port: 8080
