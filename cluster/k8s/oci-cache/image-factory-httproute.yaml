apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: talos-image-factory
  namespace: oci-cache
  annotations:
    description: >-
      Public Talos Image Factory API and artifact endpoint. The community
      edition has no authentication; build concurrency and pod resources are
      bounded in the Deployment and Factory config.
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "talos-image-factory.allegedly.works"
  rules:
    - backendRefs:
        - name: talos-image-factory
          port: 8080
