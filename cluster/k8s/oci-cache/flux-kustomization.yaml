apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Zot OCI pull-through cache and its namespace-local monitoring.
  name: oci-cache
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  deletionPolicy: Orphan
  dependsOn:
    - name: valkey
      namespace: ducktape-flux
    - name: seaweedfs-registry-cache-bucket
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: zot
      namespace: oci-cache
  interval: 10m
  path: ./cluster/k8s/oci-cache
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: oci-cache
    namespace: ducktape-flux
  timeout: 5m
  wait: true
