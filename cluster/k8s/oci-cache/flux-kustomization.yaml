apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oci-cache
  namespace: ducktape-flux
  annotations:
    description: Zot OCI pull-through cache and its namespace-local monitoring.
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: oci-cache
    namespace: ducktape-flux
  path: ./cluster/k8s/oci-cache
  prune: true
  # Do not delete the cache namespace if this Flux owner is removed later.
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: zot
      namespace: oci-cache
    - apiVersion: apps/v1
      kind: Deployment
      name: talos-image-factory
      namespace: oci-cache
  dependsOn:
    # Namespace, app, and ServiceMonitor are managed together here.
    - name: valkey
      namespace: ducktape-flux
    # S3 backend: tenant-local Bucket and operator-generated credentials.
    - name: seaweedfs-registry-cache-bucket
      namespace: ducktape-flux
    # Public Factory endpoint is served by the shared Cilium Gateway.
    - name: gateway
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
