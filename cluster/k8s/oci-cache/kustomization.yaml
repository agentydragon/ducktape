apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oci-cache
resources:
  - namespace.yaml
  - valkey-instance.yaml
  - deployment.yaml
  - image-factory-deployment.yaml
  - image-factory-service.yaml
  - image-factory-httproute.yaml
  - image-factory-networkpolicy.yaml
  - image-factory-servicemonitor.yaml
  - service.yaml
  - httproute.yaml
  - puller-credential.sops.yaml
  - servicemonitor.yaml
configMapGenerator:
  - name: oci-cache-zot-config
    files:
      - config.json
  - name: oci-cache-public-auth-proxy
    files:
      - public-auth-proxy.conf
  - name: talos-image-factory-config
    files:
      - config.json=image-factory-config.json
generatorOptions:
  # Stable names; workload reloader annotations restart Zot/Factory on config changes.
  disableNameSuffixHash: true
