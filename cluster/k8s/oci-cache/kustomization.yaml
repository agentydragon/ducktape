apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oci-cache
resources:
  # cdk8s-generated (cluster/cdk8s/oci_cache/zot.py) -- see cluster/docs/cdk8s.md.
  - oci-cache.k8s.yaml
  # Hand-written: no RedisReplication binding exists for cdk8s.
  - valkey-instance.yaml
  - puller-credential.sops.yaml
configMapGenerator:
  - name: oci-cache-zot-config
    files:
      - config.json
  - name: oci-cache-public-auth-proxy
    files:
      - public-auth-proxy.conf
generatorOptions:
  # Stable names; the Deployment's reloader annotation restarts Zot on config change.
  disableNameSuffixHash: true
