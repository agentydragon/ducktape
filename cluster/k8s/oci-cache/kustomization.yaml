apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level `namespace:`: it would move the registry-cache ResourceReferenceGrant
# out of `seaweedfs`. Every resource states its own namespace.
resources:
  # cdk8s-generated (cluster/cdk8s/oci_cache/zot.py) -- see cluster/docs/cdk8s.md.
  - oci-cache.k8s.yaml
  - puller-credential.sops.yaml
configMapGenerator:
  - name: oci-cache-zot-config
    namespace: oci-cache
    files:
      - config.json
  - name: oci-cache-public-auth-proxy
    namespace: oci-cache
    files:
      - public-auth-proxy.conf
generatorOptions:
  # Stable names; the Deployment's reloader annotation restarts Zot on config change.
  disableNameSuffixHash: true
