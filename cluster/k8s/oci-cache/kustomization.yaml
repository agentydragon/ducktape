apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oci-cache
resources:
  - namespace.yaml
  - valkey-instance.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - puller-credential.sops.yaml
  - servicemonitor.yaml
configMapGenerator:
  - name: oci-cache-zot-config
    files:
      - config.json
  - name: oci-cache-public-auth-proxy
    files:
      - public-auth-proxy.conf
generatorOptions:
  # Stable names; the Deployment's reloader annotation restarts Zot on config change.
  disableNameSuffixHash: true
