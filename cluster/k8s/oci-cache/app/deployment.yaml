apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: oci-cache
  labels:
    app.kubernetes.io/name: zot
  annotations:
    description: >-
      Zot OCI pull-through cache. On-demand mirror for docker.io, ghcr.io,
      quay.io, registry.k8s.io and gcr.io addressed by path prefix
      (/docker-hub, /ghcr, /quay, /k8s, /gcr). Durable content in the
      SeaweedFS registry-cache bucket (S3); dedupe index in the oci-cache-valkey
      RedisReplication. No PVC — the only local state is ephemeral upload
      staging on emptyDir, so the pod reschedules freely. The in-cluster
      Service is intentionally unauthenticated for Docker registry-mirror
      compatibility; the public endpoint is authenticated by the nginx sidecar.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zot
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.11
          imagePullPolicy: IfNotPresent
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            # docker/distribution S3 driver reads the AWS default credential
            # chain when accesskey/secretkey are omitted from config.json.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-identity-registry-cache
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-identity-registry-cache
                  key: secretKey
          volumeMounts:
            - name: config
              mountPath: /etc/zot
              readOnly: true
            - name: cache
              mountPath: /var/lib/zot
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: "1"
          # TCP probe only confirms Zot is listening. Pull-through behavior is
          # covered by the README smoke tests.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # Public basic-auth wrapper. Zot itself must stay unauthenticated on the
        # in-cluster Service because dockerd's Docker Hub registry-mirror probe
        # does not send client Docker-config credentials for the mirror host.
        - name: public-auth-proxy
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: public-auth
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: public-auth-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: public-auth
              mountPath: /etc/nginx/auth
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: public-auth
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: public-auth
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: oci-cache-zot-config
        - name: public-auth-config
          configMap:
            name: oci-cache-public-auth-proxy
        - name: public-auth
          secret:
            secretName: puller-credential
            items:
              - key: htpasswd
                path: htpasswd
        - name: cache
          emptyDir:
            sizeLimit: 5Gi
