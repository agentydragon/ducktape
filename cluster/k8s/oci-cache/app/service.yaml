apiVersion: v1
kind: Service
metadata:
  name: oci-cache
  namespace: oci-cache
  labels:
    app.kubernetes.io/name: zot
spec:
  selector:
    app.kubernetes.io/name: zot
  ports:
    # Exposed on 80 (→ container 5000) for conventional registry addressing by
    # unrestricted consumers. NOTE: this does NOT let a port-restricted egress
    # policy reach the mirror on :80 — Cilium's socket-LB enforces egress on the
    # backend targetPort (5000), not this Service port. So haku-ci's force-proxy
    # egress allows 5000 explicitly (see cluster/k8s/haku-ci/ccnp-force-proxy-egress.yaml).
    # Plain HTTP.
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    # Authenticated public entrypoint. The HTTPRoute for
    # oci-cache.allegedly.works targets this port; in-cluster Docker mirrors
    # must use the unauthenticated `http` port above.
    - name: public-auth
      port: 8080
      targetPort: public-auth
      protocol: TCP
