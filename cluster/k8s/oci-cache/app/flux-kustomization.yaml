apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oci-cache
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/oci-cache/app
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: zot
      namespace: oci-cache
  dependsOn:
    - name: oci-cache-namespace
    # RedisReplication CRD (Opstree operator)
    - name: valkey
    # S3 backend: bucket + the s3-identity-registry-cache Secret that Reflector
    # mirrors into oci-cache for Zot's AWS_* env.
    - name: seaweedfs-registry-cache-bucket
    - name: seaweedfs-secrets
