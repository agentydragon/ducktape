apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oci-cache
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: oci-cache-app
    namespace: ducktape-flux
  path: ./cluster/k8s/oci-cache/app
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: zot
      namespace: oci-cache
  dependsOn:
    - name: oci-cache-namespace
      namespace: ducktape-flux
    # RedisReplication CRD (Opstree operator)
    - name: valkey
      namespace: ducktape-flux
    # S3 backend: tenant-local Bucket and operator-generated credentials.
    - name: seaweedfs-registry-cache-bucket
      namespace: ducktape-flux
