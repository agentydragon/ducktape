apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: oci-cache-valkey
  namespace: oci-cache
  annotations:
    description: >-
      Shared dedupe/metadata cache for the Zot OCI pull-through cache. Zot's
      cacheDriver points here (remoteCache); the durable content lives in S3, so
      this holds only rebuildable metadata/dedupe state. Losing it is acceptable
      but may cause brief cache misses or require a Zot restart/Valkey flush for
      stale metadb entries. Uses OVH HDD node-local storage so the operator can
      rebuild a fresh Valkey replica without depending on the SeaweedFS CSI path.
spec:
  clusterSize: 2
  kubernetesConfig:
    image: valkey/valkey:8-alpine
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  redisConfig:
    maxMemoryPercentOfLimit: 80
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path-ovh-hdd
        resources:
          requests:
            storage: 2Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values: ["hil-ovh"]
      # Soft off control-plane nodes (their etcd is on a rotational HDD;
      # co-located I/O starves etcd fsync — 2026-06-28 outage).
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: oci-cache-valkey
          topologyKey: kubernetes.io/hostname
