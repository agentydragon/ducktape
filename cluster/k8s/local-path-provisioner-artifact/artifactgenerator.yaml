apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: local-path-provisioner
  namespace: ducktape-flux
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: ducktape
      namespace: ducktape-flux
  artifacts:
    - name: local-path-provisioner
      originRevision: "@repo"
      copy:
        - from: "@repo/cluster/k8s/local-path-provisioner/**"
          to: "@artifact/cluster/k8s/local-path-provisioner/"
          # Root Flux owns the consumer declaration, not its own artifact.
          exclude:
            - flux-kustomization.yaml
