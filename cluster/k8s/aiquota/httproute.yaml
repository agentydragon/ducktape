apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aiquota-api
  namespace: cli-proxy-api
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "aiquota.allegedly.works"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aiquota-api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: aiquota-api
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: aiquota-api
          port: 8080
