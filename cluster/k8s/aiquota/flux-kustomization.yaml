apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: aiquota API with Claude and Codex quota through the CLIProxyAPI integration.
  name: aiquota
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: external-secrets-config
    - name: forgejo-images
    - name: cli-proxy-api
    - name: external-secrets-operator
    - name: clickhouse-schema
  interval: 10m
  path: ./cluster/k8s/aiquota
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: aiquota
    namespace: ducktape-flux
  timeout: 5m
  wait: true
