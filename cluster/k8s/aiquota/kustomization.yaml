apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - aiquota.k8s.yaml
  - aiquota-api-bearer.sops.yaml
components:
  - ./image-pins
configMapGenerator:
  - name: aiquota-api-config
    namespace: cli-proxy-api
    literals:
      - |
        config.toml=[cli_proxy_api]
        url = "http://cli-proxy-api.cli-proxy-api.svc:8317/v0/management"

        [claude]
        enabled = true

        [codex]
        enabled = true

        [zai]
        enabled = false
