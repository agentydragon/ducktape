apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - aiquota.k8s.yaml
  - aiquota-api-bearer.sops.yaml
components:
  - ./image-pins
configMapGenerator:
  - name: aiquota-api-config
    namespace: cli-proxy-api
    literals:
      - |
        config.toml=# The CLIProxyAPI integration keeps the Claude and Codex OAuth credentials and
        # performs the authenticated usage requests. The legacy Claude setup token
        # remains owned by Haku's existing egress proxy, not by this Deployment.

        [cli_proxy_api]
        url = "http://cli-proxy-api.cli-proxy-api.svc.cluster.local:8317/v0/management"

        [claude]
        enabled = true

        [codex]
        enabled = true

        [zai]
        enabled = false
  - name: aiquota-schema
    namespace: cli-proxy-api
    files:
      - schema.sql
