apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - aiquota.k8s.yaml
  - aiquota-api-bearer.sops.yaml
components:
  - ./image-pins
configMapGenerator:
  - name: aiquota-api-config
    namespace: cli-proxy-api
    files:
      - config.toml
  - name: aiquota-schema
    namespace: cli-proxy-api
    files:
      - schema.sql
