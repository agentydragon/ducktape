# The CLIProxyAPI integration keeps the Codex OAuth credential and performs the
# authenticated usage request. The value is a non-secret sentinel; the
# dedicated proxy substitutes the long-lived Claude setup token only on the
# exact Anthropic Authorization header. This Deployment cannot refresh/write it.

[cli_proxy_api]
url = "http://cli-proxy-api.cli-proxy-api.svc.cluster.local:8317/v0/management"

[claude]
enabled = true
access_token = "aiquota-claude-oauth-placeholder"

[codex]
enabled = true

[zai]
enabled = false
