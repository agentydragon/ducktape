apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiquota-api
  namespace: cli-proxy-api
  labels:
    app.kubernetes.io/name: aiquota
  annotations:
    description: Claude and Codex subscription quota API via the CLIProxyAPI integration.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiquota
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiquota
    spec:
      imagePullSecrets:
        - name: forgejo-images-creds
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Applies aiquota/schema.sql (idempotent CREATE/ALTER ... IF NOT EXISTS)
      # before the API server starts. Kubernetes runs this to completion first
      # and retries it on failure, so a schema change ships in the same image
      # rollout as the code that needs it — no separate Job/version to bump.
      initContainers:
        - name: migrate
          image: git.allegedly.works/ducktape-ci/aiquota-migrate:devel-20260915082842-a8b1ac6 # {"$imagepolicy": "flux-system:aiquota-migrate"}
          imagePullPolicy: Always
          env:
            - name: AIQUOTA_CLICKHOUSE_URL
              value: http://clickhouse.clickhouse.svc.cluster.local:8123
            - name: AIQUOTA_CLICKHOUSE_DATABASE
              value: aiquota
            - name: AIQUOTA_CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clickhouse-aiquota-credentials
                  key: username
            - name: AIQUOTA_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-aiquota-credentials
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: aiquota-api
          image: git.allegedly.works/ducktape-ci/aiquota-api:devel-20260915082842-a8b1ac6 # {"$imagepolicy": "flux-system:aiquota-api"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AIQUOTA_API_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiquota-api-bearer
                  key: bearer-token
            - name: AIQUOTA_CLIPROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cli-proxy-api-management
                  key: management-password
            - name: AIQUOTA_CLICKHOUSE_URL
              value: http://clickhouse.clickhouse.svc.cluster.local:8123
            - name: AIQUOTA_CLICKHOUSE_DATABASE
              value: aiquota
            - name: AIQUOTA_CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clickhouse-aiquota-credentials
                  key: username
            - name: AIQUOTA_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-aiquota-credentials
                  key: password
            - name: AIQUOTA_POLL_INTERVAL_SECONDS
              value: "300"
            # History endpoints restate the same months on every call; hourly is
            # frequent enough to watch the current day accrue.
            - name: AIQUOTA_HISTORY_INTERVAL_SECONDS
              value: "3600"
            # App-owned Authentik authorization-code flow for the browser UI and
            # `/api/v1/*`; the bearer-only `/v1/*` surface remains for clients.
            - name: AIQUOTA_OAUTH_ISSUER
              value: https://auth.allegedly.works/application/o/aiquota/
            - name: AIQUOTA_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: aiquota-oidc
                  key: client_id
            - name: AIQUOTA_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aiquota-oidc
                  key: client_secret
            - name: AIQUOTA_OAUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: aiquota-oidc
                  key: session_secret
          volumeMounts:
            - name: config
              mountPath: /etc/aiquota
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: aiquota-api-config
