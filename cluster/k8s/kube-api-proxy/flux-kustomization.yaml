apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-api-proxy
  namespace: ducktape-flux
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kubeapi-proxy
      namespace: default
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      name: kubeapi-allegedly-works
      namespace: default
  interval: 10m
  path: ./cluster/k8s/kube-api-proxy
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: kube-api-proxy
    namespace: ducktape-flux
