apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kube-api-proxy
  namespace: kube-api-proxy
  annotations:
    external-dns.alpha.kubernetes.io/hostname: api.allegedly.works
    description: |
      Exposes the k8s API at https://api.allegedly.works on the standard
      port 443, behind the cluster Cilium Gateway. This exists so Claude
      Code web sandboxes — which can only reach port 443 outbound through
      Anthropic's TLS-inspecting egress proxy — can talk to the k8s API.

      The Gateway terminates TLS with the *.allegedly.works wildcard cert
      (already provisioned on the https-wildcard listener; no new
      Certificate is needed). The HTTP backend is the kube-api-proxy
      Deployment, which re-encrypts and forwards to the in-cluster
      `kubernetes` Service.
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  hostnames:
    - "api.allegedly.works"
  rules:
    - backendRefs:
        - name: kube-api-proxy
          port: 80
