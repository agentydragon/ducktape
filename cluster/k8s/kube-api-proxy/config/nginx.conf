worker_processes auto;
error_log /dev/stderr warn;
events {
    worker_connections 1024;
}

# Plain-HTTP listener used by the Cilium Gateway HTTPRoute
# (api.allegedly.works on :443). The Gateway terminates TLS for the client;
# nginx here re-encrypts to the in-cluster `kubernetes` Service and forwards
# to the apiserver. This path exists so Claude Code web sandboxes — which
# can only reach port 443 outbound through Anthropic's TLS-inspecting egress
# proxy — can talk to the k8s API without needing a non-standard port.
#
# Runs in a regular (non-hostNetwork) Deployment. The Deployment proxies to
# `kubernetes.default.svc.cluster.local:443` rather than to 127.0.0.1:6443,
# so the pod does not need host networking and does not have to live on a
# control-plane node.
http {
    # Map for WebSocket / SPDY upgrade — required for `kubectl exec`,
    # `kubectl attach`, `kubectl port-forward`, and `kubectl logs -f`.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Allow large request bodies — `kubectl apply` of big manifests and
    # `kubectl cp` both push multi-megabyte payloads.
    client_max_body_size 64m;

    # Long timeouts for watches / streaming APIs (default 60s breaks watches).
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    upstream kube_apiserver {
        server kubernetes.default.svc.cluster.local:443;
    }

    server {
        listen 8080;
        access_log off;

        location / {
            proxy_pass https://kube_apiserver;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name kubernetes.default.svc.cluster.local;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Disable buffering so streaming endpoints (watch, logs -f, exec)
            # actually stream instead of accumulating in nginx.
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
