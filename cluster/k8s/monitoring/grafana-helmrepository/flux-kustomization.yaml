apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-helmrepository
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/monitoring/grafana-helmrepository
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: grafana-helmrepository
    namespace: ducktape-flux
  timeout: 5m
  wait: true
