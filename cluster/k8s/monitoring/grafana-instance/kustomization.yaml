apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # cdk8s-generated (cluster/cdk8s/monitoring/grafana_instance.py).
  - grafana-instance.k8s.yaml
configMapGenerator:
  - name: flux-cluster-dashboard
    namespace: monitoring
    files:
      - flux-cluster.json
  - name: rugged-power-dashboard
    namespace: monitoring
    files:
      - rugged-power.json
  - name: cluster-storage-io-dashboard
    namespace: monitoring
    files:
      - cluster-storage-io.json
  - name: interface-flap-frequency-dashboard
    namespace: monitoring
    files:
      - interface-flap-frequency.json
configurations:
  - kustomizeconfig
