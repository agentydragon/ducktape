apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db-ovh
  namespace: monitoring
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  monitoring:
    enablePodMonitor: true
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 2Gi
    storageClass: local-path-ovh
---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  labels:
    dashboards: grafana
  name: grafana
  namespace: monitoring
spec:
  client:
    useKubeAuth: true
  config:
    auth.generic_oauth:
      allow_sign_up: "true"
      api_url: http://authentik-server.authentik/application/o/userinfo/
      auth_url: https://auth.allegedly.works/application/o/authorize/
      client_id: ${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
      client_secret: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      enabled: "true"
      name: Authentik
      role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || 'Viewer'
      scopes: openid email profile
      token_url: http://authentik-server.authentik/application/o/token/
    auth.jwt:
      auto_sign_up: "true"
      email_claim: sub
      enabled: "true"
      expect_claims: '{"aud": "operator.grafana.com"}'
      header_name: Authorization
      jwk_set_bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      jwk_set_url: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}/openid/v1/jwks
      role_attribute_path: contains(sub, 'system:serviceaccount:monitoring:grafana-operator') && 'GrafanaAdmin' || 'None'
      username_claim: sub
    database:
      host: grafana-db-ovh-rw.monitoring.svc.cluster.local:5432
      name: grafana
      password: ${GF_DATABASE_PASSWORD}
      ssl_mode: require
      type: postgres
      user: grafana
    plugins:
      preinstall: grafana-clock-panel,grafana-clickhouse-datasource@4.20.0
    security:
      admin_password: ${GF_SECURITY_ADMIN_PASSWORD}
      admin_user: ${GF_SECURITY_ADMIN_USER}
    server:
      root_url: https://grafana.allegedly.works
  deployment:
    spec:
      template:
        metadata:
          annotations:
            reloader.stakater.com/auto: "true"
        spec:
          containers:
            - env:
                - name: SSL_CERT_DIR
                  value: /etc/ssl/certs:/var/run/secrets/kubernetes.io/serviceaccount
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      key: admin-user
                      name: grafana-admin-password
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: admin-password
                      name: grafana-admin-password
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: grafana-db-app
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                      name: grafana-oidc-config
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                      name: grafana-oidc-config
              name: grafana
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  hostnames:
    - grafana.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: mimir
  namespace: monitoring
spec:
  datasource:
    access: proxy
    editable: true
    isDefault: true
    name: Mimir
    type: prometheus
    uid: mimir
    url: http://mimir-gateway.monitoring.svc.cluster.local/prometheus
  instanceSelector:
    matchLabels:
      dashboards: grafana
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
  namespace: monitoring
spec:
  datasource:
    access: proxy
    editable: true
    isDefault: false
    jsonData:
      maxLines: 1000
    name: Loki
    type: loki
    url: http://loki-read.loki.svc.cluster.local:3100
  instanceSelector:
    matchLabels:
      dashboards: grafana
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tempo
  namespace: monitoring
spec:
  datasource:
    access: proxy
    editable: true
    isDefault: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: loki
        filterBySpanID: false
        filterByTraceID: true
        spanEndTimeShift: 1h
        spanStartTimeShift: -1h
    name: Tempo
    type: tempo
    url: http://tempo.monitoring.svc.cluster.local:3200
  instanceSelector:
    matchLabels:
      dashboards: grafana
---
