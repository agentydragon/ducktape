apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-cluster.yaml
  - cert-manager.yaml
  - authentik.yaml
  - cloudnative-pg.yaml
  - cilium-agent.yaml
  - etcd.yaml
  - gpu.yaml
  - node-exporter-full.yaml
  - rugged-power.yaml

configMapGenerator:
  - name: flux-cluster-dashboard
    namespace: monitoring
    files:
      - flux-cluster.json
  - name: rugged-power-dashboard
    namespace: monitoring
    files:
      - rugged-power.json

configurations:
  - kustomizeconfig
