apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cluster-storage-io
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - inputName: DS_MIMIR
      datasourceName: Mimir
    - inputName: DS_LOKI
      datasourceName: Loki
  configMapRef:
    name: cluster-storage-io-dashboard
    key: cluster-storage-io.json
