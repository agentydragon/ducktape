apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-instance
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/monitoring/grafana-instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: grafana-deployment
      namespace: monitoring
  timeout: 5m
  dependsOn:
    - name: grafana-operator
      namespace: ducktape-flux
    - name: grafana-db
      namespace: ducktape-flux
    - name: monitoring-stack-secrets
      namespace: ducktape-flux
    - name: sso-providers-tf
      namespace: flux-system
