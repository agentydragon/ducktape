apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-rules
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/monitoring/rules
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: monitoring-rules

    namespace: ducktape-flux
  dependsOn:
    - name: monitoring-stack
      namespace: ducktape-flux
