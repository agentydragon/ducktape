apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: prometheus-operator-source
  namespace: ducktape-flux
  annotations:
    description: Prometheus Operator CRDs, split out of the kube-prometheus-stack
      HelmRelease so a ServiceMonitor's dependency is the CRD and not Prometheus
      being healthy. The tag tracks kube-prometheus-stack's appVersion - bump
      both together.
spec:
  interval: 1h
  url: https://github.com/prometheus-operator/prometheus-operator.git
  ref:
    tag: v0.94.0
