apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-crds
  namespace: ducktape-flux
spec:
  interval: 1h
  path: ./example/prometheus-operator-crd-full
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: prometheus-operator-source
    namespace: ducktape-flux
  timeout: 5m
  wait: true
