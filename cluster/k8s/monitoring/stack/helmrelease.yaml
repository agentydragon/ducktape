apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m # Prometheus stack upgrades can be slow
  install:
    # TODO(roaming-nodes): Roaming nodes (iguana/rugged) are often offline,
    # so DaemonSets (node-exporter) have perpetually Pending pods. Helm waits
    # for all pods to be ready, causing timeout. disableWait is a blunt
    # workaround — need a general solution for every HelmRelease with a
    # DaemonSet. Options: taint roaming nodes + add tolerations to DaemonSets
    # that should run there, or use nodeAffinity to exclude roaming entirely.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.3.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  values:
    # Shorten resource names: "kube-prometheus-stack-*" → "monitoring-*"
    fullnameOverride: monitoring
    # Remove redundant "-prometheus"/"-alertmanager" suffix from CR names
    # (avoids e.g. "prometheus-monitoring-prometheus" → "prometheus-monitoring")
    cleanPrometheusOperatorObjectNames: true

    # Global settings
    defaultRules:
      create: true
      rules:
        alertmanager: true
        # Static Talos etcd endpoints are scraped by monitoring/etcd; keep the
        # chart's stock etcd rule bundle disabled until the scrape is verified.
        etcd: false
        configReloaders: true
        general: true
        k8s: true
        kubeApiserverAvailability: true
        kubeApiserverSlos: true
        kubelet: true
        # kube-proxy is intentionally absent: Cilium runs kube-proxy replacement,
        # so the stock KubeProxyDown rule would always be noise here.
        kubeProxy: false
        kubePrometheusGeneral: true
        kubePrometheusNodeRecording: true
        kubernetesApps: true
        kubernetesResources: true
        kubernetesStorage: true
        kubernetesSystem: true
        kubeScheduler: true
        kubeStateMetrics: true
        network: true
        node: true
        nodeExporterAlerting: true
        nodeExporterRecording: true
        prometheus: false # Prometheus disabled; Mimir Ruler evaluates rules
        prometheusOperator: true

    # Alertmanager configuration
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
            equal:
              - namespace
              - alertname
          - source_matchers:
              - severity = warning
            target_matchers:
              - severity = info
            equal:
              - namespace
              - alertname
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
            equal:
              - namespace
          - target_matchers:
              - alertname = InfoInhibitor
        # ntfy is the DEFAULT receiver and suppression is an explicit denylist below.
        #
        # This used to be an allowlist (`receiver: "null"` by default, one child route
        # naming the alertnames that page). That fails silently in the direction that
        # matters: an alert not named in the allowlist is discarded with no signal
        # anywhere, so a newly added rule looks healthy and fires into nothing. It cost
        # a 45h haku-console connector outage whose alert had been built, verified
        # firing, and never routed; and it silently dropped ControlPlaneLeasePutLatency
        # when that alert was renamed and the allowlist regex kept the old names.
        # Defaulting to ntfy makes the failure mode "too loud" rather than "silent".
        #
        # The denylist started as an exact reproduction of the old delivered set (116
        # names, 21 of them critical) so the inversion itself was a behavioral no-op.
        # It is now being pruned deliberately, a batch at a time.
        #
        # Every candidate is checked against 7 DAYS of ALERTS history before removal,
        # not a spot check. A 3h sample said TanaMcpFacadeProbeStale was quiet; over 7d
        # it fires 7286 min (~72% of the week), and enabling it would have planted a
        # permanently-firing alert in a channel whose daily quota is the thing that
        # broke on 2026-08-05. Query:
        #   max by (alertname) (count_over_time(ALERTS{alertstate="firing"}[7d]))
        #
        # Deviation worth knowing: a NEW alertname, from a chart upgrade or a new rule,
        # is not in the denylist and therefore pages. That asymmetry is the point of the
        # inversion -- silence is the failure mode that cost a 45h connector outage.
        route:
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 2h
          receiver: ntfy
          # One alert per ntfy message. ntfy.sh caps a published message at
          # ~4KB; a group_by of ["namespace"] bundled every flux-system alert
          # (21+ FluxKustomizationNotReady during a storm) into one notification
          # that, expanded by the X-Template "alertmanager" renderer, exceeded
          # the cap and was rejected with HTTP 400 code 40041 ("message or title
          # is too large after replacing template"). Alertmanager treats 4xx as
          # unrecoverable, so alerts were silently dropped exactly when many were
          # firing. group_by ["..."] disables aggregation so each alert is its
          # own small message.
          #
          # Gotcha: this trades a size limit for a rate limit. One message per
          # alert instance against ntfy.sh's free daily quota is what produced
          # the 429 (code 42908) outage that took paging down for 23h on
          # 2026-08-05. It holds only while the delivered set stays this small --
          # revisit group_by (["alertname"] bounds both) before widening the
          # denylist, not after.
          group_by: ["..."]
          routes:
            # Everything below here is suppressed. Grouped by family so pruning is
            # a line edit rather than a diff against one 3KB regex.
            - receiver: "null"
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
            - receiver: "null"
              matchers:
                - alertname =~ "AlertmanagerClusterFailedToSendAlerts|AlertmanagerFailedToSendAlerts"
            - receiver: "null"
              matchers:
                - alertname =~ "ExternalSecretNotReady"
            - receiver: "null"
              matchers:
                - alertname =~ "CDIDataImportCronOutdated|CDIDataVolumeUnusualRestartCount|CDIDefaultStorageClassDegraded|CDIMultipleDefaultVirtStorageClasses|CDINoDefaultStorageClass|CDINotReady|CDIOperatorDown|CDIStorageProfilesIncomplete"
            - receiver: "null"
              matchers:
                - alertname =~ "ConfigReloaderSidecarErrors|PrometheusOperatorListErrors|PrometheusOperatorNodeLookupErrors|PrometheusOperatorNotReady|PrometheusOperatorReconcileErrors|PrometheusOperatorRejectedResources|PrometheusOperatorStatusUpdateErrors|PrometheusOperatorSyncFailed|PrometheusOperatorWatchErrors|TargetDown"
            - receiver: "null"
              matchers:
                - alertname =~ "NodeBondingDegraded|NodeCPUHighUsage|NodeClockSkewDetected|NodeDiskIOSaturation|NodeFilesystemAlmostOutOfSpace|NodeHighNumberConntrackEntriesUsed|NodeMemoryHighUtilization|NodeMemoryMajorPagesFaults|NodeNetworkInterfaceFlapping|NodeNetworkReceiveErrs|NodeNetworkTransmitErrs|NodeSystemSaturation|NodeSystemdServiceCrashlooping|NodeSystemdServiceFailed|NodeTextFileCollectorScrapeError"
            - receiver: "null"
              matchers:
                - alertname =~ "KubeAPITerminatedRequests|KubeAggregatedAPIDown|KubeAggregatedAPIErrors|KubeCPUOvercommit|KubeCPUQuotaOvercommit|KubeClientErrors|KubeContainerWaiting|KubeDaemonSetMisScheduled|KubeDaemonSetNotScheduled|KubeDaemonSetRolloutStuck|KubeDeploymentGenerationMismatch|KubeDeploymentReplicasMismatch|KubeDeploymentRolloutStuck|KubeHpaMaxedOut|KubeHpaReplicasMismatch|KubeJobFailed|KubeJobNotCompleted|KubeMemoryOvercommit|KubeMemoryQuotaOvercommit|KubeNodeEviction|KubeNodeNotReady|KubeNodePressure|KubeNodeReadinessFlapping|KubeNodeUnreachable|KubePodCrashLooping|KubePodNotReady|KubeQuotaAlmostFull|KubeQuotaExceeded|KubeQuotaFullyUsed|KubeStatefulSetGenerationMismatch|KubeStatefulSetReplicasMismatch|KubeStatefulSetUpdateNotRolledOut|KubeVersionMismatch|KubeletClientCertificateRenewalErrors|KubeletDown|KubeletPlegDurationHigh|KubeletPodStartUpLatencyHigh|KubeletServerCertificateRenewalErrors|KubeletTooManyPods"
            - receiver: "null"
              matchers:
                - alertname =~ "CPUThrottlingHigh|TanaMcpFacadeProbeStale"
        receivers:
          - name: "null"
          - name: ntfy
            webhook_configs:
              - send_resolved: true
                url_file: /etc/alertmanager/secrets/alertmanager-ntfy-webhook/address
                # Select ntfy's built-in alertmanager message template (firing/
                # resolved formatting) so previews show a readable title + body
                # instead of the raw webhook JSON. Sent as a header rather than a
                # URL query param to keep the ntfy topic URL fully inside the
                # SOPS secret. Rendered into Alertmanager's native config (not the
                # AlertmanagerConfig CRD), so http_headers is supported.
                http_config:
                  http_headers:
                    X-Template:
                      values: ["alertmanager"]
        templates:
          - /etc/alertmanager/config/*.tmpl
      ingress:
        enabled: false
      alertmanagerSpec:
        replicas: 2
        secrets:
          - alertmanager-ntfy-webhook
        storage:
          volumeClaimTemplate:
            metadata:
              name: db
            spec:
              storageClassName: local-path-ovh
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
        # Chart auto-generates podAntiAffinity when replicas > 1
        nodeSelector:
          topology.kubernetes.io/zone: hil-ovh
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        retention: 120h

    # Grafana disabled — managed by grafana-operator (cluster/k8s/monitoring/grafana-instance/).
    # Dashboards, datasources, and service accounts are GrafanaDashboard/GrafanaDatasource/
    # GrafanaServiceAccount CRs. JWT auth eliminates admin password bootstrap dependency.
    grafana:
      enabled: false

    # Prometheus Operator configuration
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

      # Admission webhook resource limits
      admissionWebhooks:
        patch:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

    # Prometheus disabled — Alloy scrapes metrics and pushes to Mimir.
    # Mimir Ruler evaluates alerting/recording rules.
    # Operator kept for CRD management (ServiceMonitor, PrometheusRule, etc.).
    prometheus:
      enabled: false

    # Node exporter configuration
    prometheus-node-exporter:
      fullnameOverride: prometheus-node-exporter
    nodeExporter:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

    # Kube-state-metrics configuration
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      rbac:
        extraRules:
          - apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["list", "watch"]
          - apiGroups: ["kustomize.toolkit.fluxcd.io"]
            resources: ["kustomizations"]
            verbs: ["list", "watch"]
          - apiGroups: ["helm.toolkit.fluxcd.io"]
            resources: ["helmreleases"]
            verbs: ["list", "watch"]
          - apiGroups: ["source.toolkit.fluxcd.io"]
            resources: ["gitrepositories"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: flux_kustomization_ready
                    help: Flux Kustomization Ready condition status.
                    each:
                      type: StateSet
                      stateSet:
                        labelName: status
                        path: [status, conditions, "[type=Ready]", status]
                        list: ["True", "False", "Unknown"]
                  # Flux does not clear the Ready condition when a Kustomization is
                  # suspended, so a deliberately-disabled service reports Ready=False
                  # forever. Exposing spec.suspend lets the *NotReady alerts exclude
                  # them; without it they are indistinguishable from real failures.
                  - name: flux_kustomization_suspended
                    help: Whether the Flux Kustomization is suspended (spec.suspend).
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, suspend]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: flux_helmrelease_ready
                    help: Flux HelmRelease Ready condition status.
                    each:
                      type: StateSet
                      stateSet:
                        labelName: status
                        path: [status, conditions, "[type=Ready]", status]
                        list: ["True", "False", "Unknown"]
                  - name: flux_helmrelease_suspended
                    help: Whether the Flux HelmRelease is suspended (spec.suspend).
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: flux_gitrepository_ready
                    help: Flux GitRepository Ready condition status.
                    each:
                      type: StateSet
                      stateSet:
                        labelName: status
                        path: [status, conditions, "[type=Ready]", status]
                        list: ["True", "False", "Unknown"]
                  - name: flux_gitrepository_suspended
                    help: Whether the Flux GitRepository is suspended (spec.suspend).
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, suspend]
                  - name: flux_gitrepository_artifact_size_bytes
                    help: Flux GitRepository artifact size in bytes.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, artifact]
                        valueFrom: [size]
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 512Mi

    # Disable components we don't need
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    kubeControllerManager:
      enabled: true
    coreDns:
      enabled: true
    kubeEtcd:
      # Static Talos etcd endpoints are managed in cluster/k8s/monitoring/etcd.
      enabled: false
    kubeScheduler:
      enabled: true
    kubeProxy:
      # kube-proxy is intentionally absent: Cilium runs kube-proxy replacement,
      # so do not create the stock kube-proxy Service/ServiceMonitor.
      enabled: false
