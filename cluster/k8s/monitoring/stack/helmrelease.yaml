apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m # Prometheus stack upgrades can be slow
  install:
    # TODO(roaming-nodes): Roaming nodes (iguana/rugged) are often offline,
    # so DaemonSets (node-exporter) have perpetually Pending pods. Helm waits
    # for all pods to be ready, causing timeout. disableWait is a blunt
    # workaround — need a general solution for every HelmRelease with a
    # DaemonSet. Options: taint roaming nodes + add tolerations to DaemonSets
    # that should run there, or use nodeAffinity to exclude roaming entirely.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.3.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  values:
    # Shorten resource names: "kube-prometheus-stack-*" → "monitoring-*"
    fullnameOverride: monitoring
    # Remove redundant "-prometheus"/"-alertmanager" suffix from CR names
    # (avoids e.g. "prometheus-monitoring-prometheus" → "prometheus-monitoring")
    cleanPrometheusOperatorObjectNames: true

    # Global settings
    defaultRules:
      create: true
      rules:
        alertmanager: true
        # Static Talos etcd endpoints are scraped by monitoring/etcd; keep the
        # chart's stock etcd rule bundle disabled until the scrape is verified.
        etcd: false
        configReloaders: true
        general: true
        k8s: true
        kubeApiserverAvailability: true
        kubeApiserverSlos: true
        kubelet: true
        kubeProxy: true
        kubePrometheusGeneral: true
        kubePrometheusNodeRecording: true
        kubernetesApps: true
        kubernetesResources: true
        kubernetesStorage: true
        kubernetesSystem: true
        kubeScheduler: true
        kubeStateMetrics: true
        network: true
        node: true
        nodeExporterAlerting: true
        nodeExporterRecording: true
        prometheus: false # Prometheus disabled; Mimir Ruler evaluates rules
        prometheusOperator: true

    # Alertmanager configuration
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
            equal:
              - namespace
              - alertname
          - source_matchers:
              - severity = warning
            target_matchers:
              - severity = info
            equal:
              - namespace
              - alertname
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
            equal:
              - namespace
          - target_matchers:
              - alertname = InfoInhibitor
        route:
          group_by: ["namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "null"
          routes:
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
            - receiver: ntfy
              matchers:
                - alertname =~ "FluxKustomizationNotReady|FluxHelmReleaseNotReady|FluxGitRepositoryNotReady|FluxMainGitRepositoryArtifactLarge|ControlPlaneSystemDiskBusy|ControlPlanePodSystemDiskWriterHigh|ControlPlaneLeasePutLatencyHigh|ControlPlaneLeasePutLatencyCritical"
              repeat_interval: 2h
        receivers:
          - name: "null"
          - name: ntfy
            webhook_configs:
              - send_resolved: true
                url_file: /etc/alertmanager/secrets/alertmanager-ntfy-webhook/address
        templates:
          - /etc/alertmanager/config/*.tmpl
      ingress:
        enabled: false
      alertmanagerSpec:
        replicas: 2
        secrets:
          - alertmanager-ntfy-webhook
        storage:
          volumeClaimTemplate:
            metadata:
              name: db
            spec:
              storageClassName: local-path-ovh
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
        # Chart auto-generates podAntiAffinity when replicas > 1
        nodeSelector:
          topology.kubernetes.io/zone: hil-ovh
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        retention: 120h

    # Grafana disabled — managed by grafana-operator (cluster/k8s/monitoring/grafana-instance/).
    # Dashboards, datasources, and service accounts are GrafanaDashboard/GrafanaDatasource/
    # GrafanaServiceAccount CRs. JWT auth eliminates admin password bootstrap dependency.
    grafana:
      enabled: false

    # Prometheus Operator configuration
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

      # Admission webhook resource limits
      admissionWebhooks:
        patch:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

    # Prometheus disabled — Alloy scrapes metrics and pushes to Mimir.
    # Mimir Ruler evaluates alerting/recording rules.
    # Operator kept for CRD management (ServiceMonitor, PrometheusRule, etc.).
    prometheus:
      enabled: false

    # Node exporter configuration
    prometheus-node-exporter:
      fullnameOverride: prometheus-node-exporter
    nodeExporter:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

    # Kube-state-metrics configuration
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      rbac:
        extraRules:
          - apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["list", "watch"]
          - apiGroups: ["kustomize.toolkit.fluxcd.io"]
            resources: ["kustomizations"]
            verbs: ["list", "watch"]
          - apiGroups: ["helm.toolkit.fluxcd.io"]
            resources: ["helmreleases"]
            verbs: ["list", "watch"]
          - apiGroups: ["source.toolkit.fluxcd.io"]
            resources: ["gitrepositories"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: flux_kustomization_ready
                    help: Flux Kustomization Ready condition status.
                    each:
                      type: StateSet
                      stateSet:
                        labelName: status
                        path: [status, conditions, "[type=Ready]", status]
                        list: ["True", "False", "Unknown"]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: flux_helmrelease_ready
                    help: Flux HelmRelease Ready condition status.
                    each:
                      type: StateSet
                      stateSet:
                        labelName: status
                        path: [status, conditions, "[type=Ready]", status]
                        list: ["True", "False", "Unknown"]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: flux_gitrepository_ready
                    help: Flux GitRepository Ready condition status.
                    each:
                      type: StateSet
                      stateSet:
                        labelName: status
                        path: [status, conditions, "[type=Ready]", status]
                        list: ["True", "False", "Unknown"]
                  - name: flux_gitrepository_artifact_size_bytes
                    help: Flux GitRepository artifact size in bytes.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, artifact]
                        valueFrom: [size]
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 512Mi

    # Disable components we don't need
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    kubeControllerManager:
      enabled: true
    coreDns:
      enabled: true
    kubeEtcd:
      # Static Talos etcd endpoints are managed in cluster/k8s/monitoring/etcd.
      enabled: false
    kubeScheduler:
      enabled: true
    kubeProxy:
      enabled: true
