apiVersion: v1
kind: Secret
metadata:
  annotations:
    description: Long-lived service-account token for monitoring control-plane ServiceMonitors.
    kubernetes.io/service-account.name: alloy
  name: alloy-control-plane-token
  namespace: monitoring
type: kubernetes.io/service-account-token
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 12h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      version: 91.3.0
  install:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: 3
  interval: 30m
  timeout: 10m
  upgrade:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: 3
  values:
    alertmanager:
      alertmanagerSpec:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
                weight: 100
        nodeSelector:
          topology.kubernetes.io/zone: hil-ovh
        replicas: 2
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        retention: 120h
        secrets:
          - alertmanager-ntfy-webhook
        storage:
          volumeClaimTemplate:
            metadata:
              name: db
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
              storageClassName: local-path-ovh
        tolerations:
          - effect: NoSchedule
            key: node-role.kubernetes.io/control-plane
            operator: Exists
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - equal:
              - namespace
              - alertname
            source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
          - equal:
              - namespace
              - alertname
            source_matchers:
              - severity = warning
            target_matchers:
              - severity = info
          - equal:
              - namespace
            source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
          - target_matchers:
              - alertname = InfoInhibitor
        receivers:
          - name: "null"
          - name: ntfy
            webhook_configs:
              - http_config:
                  bearer_token_file: /etc/alertmanager/secrets/alertmanager-ntfy-webhook/token
                  http_headers:
                    X-Template:
                      values:
                        - alertmanager
                send_resolved: true
                url_file: /etc/alertmanager/secrets/alertmanager-ntfy-webhook/address
        route:
          group_by:
            - ...
          group_interval: 5m
          group_wait: 30s
          receiver: ntfy
          repeat_interval: 2h
          routes:
            - matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
              receiver: "null"
            - matchers:
                - alertname = "TargetDown"
                - job = "node-exporter"
              receiver: "null"
            - matchers:
                - alertname =~ "CDIStorageProfilesIncomplete|KubeVersionMismatch|NodeFilesystemAlmostOutOfSpace|TanaMcpFacadeProbeStale|CPUThrottlingHigh|KubeQuotaFullyUsed|KubeContainerWaiting|NodeMemoryMajorPagesFaults"
              receiver: "null"
            - matchers:
                - alertname =~ "KubePodNotReady|KubePodCrashLooping|KubeJobFailed|KubeDaemonSetRolloutStuck|KubeDeploymentReplicasMismatch|KubeDeploymentRolloutStuck"
              receiver: "null"
            - matchers:
                - alertname =~ "AlertmanagerClusterFailedToSendAlerts|AlertmanagerFailedToSendAlerts"
              receiver: "null"
        templates:
          - /etc/alertmanager/config/*.tmpl
      enabled: true
      ingress:
        enabled: false
    cleanPrometheusOperatorObjectNames: true
    coreDns:
      enabled: true
      serviceMonitor:
        authorization: null
    crds:
      enabled: false
    defaultRules:
      create: true
      disabled:
        KubeNodeNotReady: true
        KubeNodeUnreachable: true
        KubePodNotReady: true
        KubeletInstanceUnreachable: true
        TargetDown: true
      node:
        fsSelector: fstype!="",mountpoint!="/var/lib/colibri"
      rules:
        alertmanager: true
        configReloaders: true
        etcd: false
        general: true
        k8s: true
        kubeApiserverAvailability: true
        kubeApiserverSlos: true
        kubePrometheusGeneral: true
        kubePrometheusNodeRecording: true
        kubeProxy: false
        kubeScheduler: true
        kubeStateMetrics: true
        kubelet: true
        kubernetesApps: true
        kubernetesResources: true
        kubernetesStorage: true
        kubernetesSystem: true
        network: true
        node: true
        nodeExporterAlerting: true
        nodeExporterRecording: true
        prometheus: false
        prometheusOperator: true
    fullnameOverride: monitoring
    grafana:
      enabled: false
    kube-state-metrics:
      customResourceState:
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  kind: Kustomization
                  version: v1
                labelsFromPath:
                  name:
                    - metadata
                    - name
                  namespace:
                    - metadata
                    - namespace
                metrics:
                  - each:
                      stateSet:
                        labelName: status
                        list:
                          - "True"
                          - "False"
                          - Unknown
                        path:
                          - status
                          - conditions
                          - "[type=Ready]"
                          - status
                      type: StateSet
                    help: Flux Kustomization Ready condition status.
                    name: flux_kustomization_ready
                  - each:
                      gauge:
                        nilIsZero: true
                        path:
                          - spec
                          - suspend
                      type: Gauge
                    help: Whether the Flux Kustomization is suspended (spec.suspend).
                    name: flux_kustomization_suspended
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  kind: HelmRelease
                  version: v2
                labelsFromPath:
                  name:
                    - metadata
                    - name
                  namespace:
                    - metadata
                    - namespace
                metrics:
                  - each:
                      stateSet:
                        labelName: status
                        list:
                          - "True"
                          - "False"
                          - Unknown
                        path:
                          - status
                          - conditions
                          - "[type=Ready]"
                          - status
                      type: StateSet
                    help: Flux HelmRelease Ready condition status.
                    name: flux_helmrelease_ready
                  - each:
                      gauge:
                        nilIsZero: true
                        path:
                          - spec
                          - suspend
                      type: Gauge
                    help: Whether the Flux HelmRelease is suspended (spec.suspend).
                    name: flux_helmrelease_suspended
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  kind: GitRepository
                  version: v1
                labelsFromPath:
                  name:
                    - metadata
                    - name
                  namespace:
                    - metadata
                    - namespace
                metrics:
                  - each:
                      stateSet:
                        labelName: status
                        list:
                          - "True"
                          - "False"
                          - Unknown
                        path:
                          - status
                          - conditions
                          - "[type=Ready]"
                          - status
                      type: StateSet
                    help: Flux GitRepository Ready condition status.
                    name: flux_gitrepository_ready
                  - each:
                      gauge:
                        nilIsZero: true
                        path:
                          - spec
                          - suspend
                      type: Gauge
                    help: Whether the Flux GitRepository is suspended (spec.suspend).
                    name: flux_gitrepository_suspended
                  - each:
                      gauge:
                        path:
                          - status
                          - artifact
                        valueFrom:
                          - size
                      type: Gauge
                    help: Flux GitRepository artifact size in bytes.
                    name: flux_gitrepository_artifact_size_bytes
        enabled: true
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - nodes=[storage.allegedly.works/tier]
      rbac:
        extraRules:
          - apiGroups:
              - apiextensions.k8s.io
            resources:
              - customresourcedefinitions
            verbs:
              - list
              - watch
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
            resources:
              - kustomizations
            verbs:
              - list
              - watch
          - apiGroups:
              - helm.toolkit.fluxcd.io
            resources:
              - helmreleases
            verbs:
              - list
              - watch
          - apiGroups:
              - source.toolkit.fluxcd.io
            resources:
              - gitrepositories
            verbs:
              - list
              - watch
      resources:
        limits:
          cpu: 100m
          memory: 512Mi
        requests:
          cpu: 10m
          memory: 128Mi
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: true
      serviceMonitor:
        authorization:
          credentials:
            key: token
            name: alloy-control-plane-token
          type: Bearer
        tlsConfig:
          ca:
            configMap:
              key: ca.crt
              name: kube-root-ca.crt
          insecureSkipVerify: true
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: true
      serviceMonitor:
        authorization:
          credentials:
            key: token
            name: alloy-control-plane-token
          type: Bearer
        tlsConfig:
          ca:
            configMap:
              key: ca.crt
              name: kube-root-ca.crt
          insecureSkipVerify: true
    kubelet:
      enabled: false
    nodeExporter:
      enabled: true
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 32Mi
    prometheus:
      enabled: false
      serviceAccount:
        createTokenSecret: false
    prometheus-node-exporter:
      fullnameOverride: prometheus-node-exporter
      securityContext:
        fsGroup: 45321
        runAsGroup: 45321
        runAsNonRoot: true
        runAsUser: 65534
    prometheusOperator:
      admissionWebhooks:
        patch:
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
      enabled: true
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress
  namespace: monitoring
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9090
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9090
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gatus
      ports:
        - port: 9090
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
