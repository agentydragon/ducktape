apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-stack
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: monitoring-namespace
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
    - name: ntfy
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
  healthCheckExprs:
    - apiVersion: v1
      current: has(data.token) && data.token != ''
      kind: Secret
  healthChecks:
    - apiVersion: v1
      kind: Secret
      name: alloy-control-plane-token
      namespace: monitoring
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
  interval: 10m
  path: ./cluster/k8s/monitoring/stack
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: monitoring-stack
    namespace: ducktape-flux
  timeout: 10m
