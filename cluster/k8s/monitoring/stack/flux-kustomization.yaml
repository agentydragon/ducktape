apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-stack
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/monitoring/stack
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
  timeout: 10m
  dependsOn:
    - name: monitoring-namespace
      namespace: ducktape-flux
    - name: gateway
    - name: cert-manager-environment
    - name: monitoring-stack-secrets
      namespace: ducktape-flux
    - name: sso-providers-tf
    - name: grafana-db
      namespace: ducktape-flux
