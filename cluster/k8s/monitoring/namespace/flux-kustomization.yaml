apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-namespace
  namespace: ducktape-flux
spec:
  dependsOn: []
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: monitoring
  interval: 10m
  path: ./cluster/k8s/monitoring/namespace
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: monitoring-namespace
    namespace: ducktape-flux
  wait: true
