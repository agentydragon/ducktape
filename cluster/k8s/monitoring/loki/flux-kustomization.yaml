apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/monitoring/loki
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: monitoring-loki
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: loki
      namespace: loki
  timeout: 10m
  dependsOn:
    - name: grafana-helmrepository
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
