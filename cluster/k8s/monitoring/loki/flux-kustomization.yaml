apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: grafana-helmrepository
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: loki
      namespace: loki
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: loki
      namespace: loki
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: loki
      namespace: loki
  interval: 10m
  path: ./cluster/k8s/monitoring/loki
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: monitoring-loki
    namespace: ducktape-flux
  timeout: 10m
