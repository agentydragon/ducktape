apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - minio-credentials.sops.yaml
  - helmrelease.yaml
  - promtail-helmrelease.yaml
  - cilium-network-policy.yaml
  # External access handled by Authentik proxy outpost (native blueprint in k8s/authentik/app/blueprints/).
  # Traffic flows: Gateway → ak-outpost-loki-outpost (auth) → loki backend.
  # Grafana accesses Loki internally via cluster service (unaffected).
