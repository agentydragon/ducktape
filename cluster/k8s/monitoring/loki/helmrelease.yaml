apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: loki
      version: "6.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  values:
    deploymentMode: SimpleScalable

    loki:
      auth_enabled: false

      commonConfig:
        replication_factor: 2

      storage:
        type: s3
        s3:
          endpoint: http://seaweedfs-s3.seaweedfs.svc:8333
          region: us-east-1
          s3ForcePathStyle: true
          insecure: true
        bucketNames:
          chunks: loki
          ruler: loki
          admin: loki

      schemaConfig:
        configs:
          - from: "2026-04-06"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      limits_config:
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 20
        per_stream_rate_limit: 5MB
        per_stream_rate_limit_burst: 10MB
        # Enables /loki/api/v1/index/volume, which the Grafana Loki
        # Explore app uses for its log-volume sparkline and label
        # drilldowns. Without it the UI shows "Log volume has not been
        # configured".
        volume_enabled: true

      compactor:
        retention_enabled: true
        retention_delete_delay: 2h
        compaction_interval: 10m
        delete_request_store: s3

    singleBinary:
      replicas: 0

    # SimpleScalable: write owns the ingester WAL (needs PVC), backend's disk
    # is shipper/compactor cache (emptyDir is fine), read is stateless.
    # All pinned to OVH kimsufi zone so the PVCs land on local-path-ovh.

    write:
      replicas: 2
      annotations:
        goldilocks.fairwinds.com/enabled: "false"
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
      # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
      # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      persistence:
        storageClass: local-path-ovh
        size: 10Gi
      extraEnvFrom:
        - secretRef:
            name: loki-s3-credentials
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    read:
      replicas: 2
      annotations:
        goldilocks.fairwinds.com/enabled: "false"
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
      # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
      # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      extraEnvFrom:
        - secretRef:
            name: loki-s3-credentials
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

    backend:
      replicas: 2
      annotations:
        goldilocks.fairwinds.com/enabled: "false"
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
      # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
      # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      persistence:
        volumeClaimsEnabled: false
      extraEnvFrom:
        - secretRef:
            name: loki-s3-credentials
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

    gateway:
      enabled: true
      # Loki canary's default target is loki-gateway. Keep the internal gateway
      # enabled for read/write API routing; the chart labels the nginx gateway
      # service out of ServiceMonitor discovery.
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
      # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
      # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist

    # Disable bundled monitoring (we have kube-prometheus-stack)
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: false
      rules:
        enabled: false
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false

    # Disable test pod
    test:
      enabled: false

    # Disable chunk cache (single binary, not needed)
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
