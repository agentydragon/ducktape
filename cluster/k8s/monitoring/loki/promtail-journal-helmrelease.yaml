apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail-journal
  namespace: loki
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    # Same rationale as the pod-log promtail: roaming nodes (rugged, iguana) may
    # be offline, so don't block the release on their Pending/Terminating pods.
    disableWait: true
  chart:
    spec:
      chart: promtail
      version: "6.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  # Deviation from the stock promtail chart (whose default is pod-log tailing): this
  # release is journal-only. It scrapes the systemd journal on the NixOS nodes
  # (wyrm2, rugged, iguana) so kernel messages — notably the RTX 5090
  # `Xid 79 "GPU has fallen off the bus"` events — reach Loki with cluster
  # retention instead of dying with the node's ~5-day local journal. Talos nodes
  # have no journald and are handled separately (cluster/k8s/vector-talos-logs/);
  # the main pod-log promtail (promtail-helmrelease.yaml) is untouched and still
  # runs on every node.
  values:
    # Restrict to systemd/journald nodes; label set in nix/nixos/hosts/*/default.nix.
    nodeSelector:
      node-vendor: nixos
    tolerations:
      - effect: NoSchedule
        operator: Exists

    # SYNC(roaming-node-count): 2 roaming nodes (rugged, iguana) + 1 rollout slot.
    # Kept identical to promtail-helmrelease.yaml — see the full rationale there.
    # Update when the roaming node count changes; cluster/README.md § Node Types
    # and cluster/docs/mesh_membership.md carry the matching SYNC marker.
    #
    # This DaemonSet is *more* exposed than the pod-log one, not less: its
    # nodeSelector is NixOS-only, and two of the three NixOS nodes (rugged,
    # iguana) are the roaming laptops. With the chart default maxUnavailable: 1 a
    # single offline laptop deadlocks the rollout. It has not deadlocked yet only
    # because its last change happened while those nodes were up.
    #
    # 3 exceeds the desired count here (Kubernetes clamps it), which is the
    # intended effect: no roaming node should ever gate a journal rollout.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 3

    config:
      clients:
        - url: http://loki-write.loki.svc.cluster.local:3100/loki/api/v1/push
      snippets:
        # Disable the chart's default Kubernetes pod-log scrape — the main promtail
        # already collects pod logs on every node; this release must not double-collect.
        scrapeConfigs: ""
        extraScrapeConfigs: |
          - job_name: journal
            journal:
              path: /var/log/journal
              max_age: 12h
              labels:
                job: systemd-journal
            relabel_configs:
              - source_labels: ['__journal__systemd_unit']
                target_label: unit
              - source_labels: ['__journal__hostname']
                target_label: node
              - source_labels: ['__journal_priority_keyword']
                target_label: level

    extraVolumes:
      - name: journal
        hostPath:
          path: /var/log/journal
      - name: machine-id
        hostPath:
          path: /etc/machine-id
    extraVolumeMounts:
      - name: journal
        mountPath: /var/log/journal
        readOnly: true
      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true

    resources:
      requests:
        cpu: 50m
        # Keep memory well above the tail working set: with a tight cap, cgroup v2
        # page-cache eviction thrashes the node disk and can starve co-located etcd
        # (see promtail-helmrelease.yaml and
        # cluster/debug/2026-06-10-etcd-io-contention/).
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
