apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  chart:
    spec:
      chart: alloy
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 1.x
  interval: 30m
  values:
    alloy:
      configMap:
        create: false
        key: config.alloy
        name: alloy-config
      extraPorts:
        - name: otlp-http
          port: 4318
          protocol: TCP
          targetPort: 4318
    controller:
      replicas: 1
      type: deployment
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
    serviceMonitor:
      enabled: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-otlp-ingress
  namespace: monitoring
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              app.kubernetes.io/component: server
              app.kubernetes.io/instance: authentik
      ports:
        - port: 4318
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Ingress
