apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mimir
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: monitoring-crds
      namespace: ducktape-flux
    - name: grafana-helmrepository
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: mimir-blocks
      namespace: monitoring
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: mimir-ruler
      namespace: monitoring
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: mimir
      namespace: monitoring
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mimir
      namespace: monitoring
  interval: 10m
  path: ./cluster/k8s/monitoring/mimir
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: monitoring-mimir
    namespace: ducktape-flux
  suspend: false
  timeout: 10m
