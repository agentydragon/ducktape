apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mimir
  namespace: ducktape-flux
spec:
  suspend: false
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/monitoring/mimir
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: monitoring-mimir
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mimir
      namespace: monitoring
  timeout: 10m
  dependsOn:
    - name: monitoring-crds # the chart's metaMonitoring.serviceMonitor
      namespace: ducktape-flux
    - name: grafana-helmrepository
      namespace: ducktape-flux
    # seaweedfs-cluster provides the Seaweed CR + Bucket CRD that our
    # mimir-blocks / mimir-ruler Bucket resources reference (buckets.yaml).
    - name: seaweedfs-cluster
      namespace: ducktape-flux
