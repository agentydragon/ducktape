apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: mimir
  namespace: seaweedfs
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Mimir blocks.
  name: mimir-blocks
  namespace: monitoring
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: mimir
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: mimir-blocks
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: mimir
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: monitoring
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: monitoring
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Mimir ruler state.
  name: mimir-ruler
  namespace: monitoring
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: mimir
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: mimir-ruler
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  annotations:
    description: Mimir's tenant-local SeaweedFS credentials.
  name: mimir
  namespace: monitoring
spec:
  identityRef:
    name: mimir
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: mimir-seaweedfs-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: mimir-s3-credentials
  namespace: monitoring
type: Opaque
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: monitoring
spec:
  chart:
    spec:
      chart: mimir-distributed
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 6.x
  install:
    remediation:
      retries: 3
  interval: 30m
  timeout: 10m
  values:
    alertmanager:
      enabled: false
    chunks-cache:
      enabled: false
    compactor:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      persistentVolume:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    continuous_test:
      enabled: false
    distributor:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    gateway:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
      service:
        labels:
          prometheus.io/service-monitor: "false"
    global:
      extraEnvFrom:
        - secretRef:
            name: mimir-seaweedfs-credentials
    index-cache:
      enabled: false
    ingester:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: ingester
                  app.kubernetes.io/instance: mimir
                  app.kubernetes.io/name: mimir
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      persistentVolume:
        size: 10Gi
        storageClass: local-path-ovh
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      zoneAwareReplication:
        enabled: false
    kafka:
      enabled: false
    metaMonitoring:
      dashboards:
        enabled: false
      grafanaAgent:
        enabled: false
      serviceMonitor:
        enabled: true
    metadata-cache:
      enabled: false
    mimir:
      structuredConfig:
        blocks_storage:
          s3:
            bucket_name: mimir-blocks
        common:
          storage:
            backend: s3
            s3:
              access_key_id: ${AWS_ACCESS_KEY_ID}
              bucket_name: mimir-blocks
              endpoint: seaweedfs-s3.seaweedfs.svc:8333
              insecure: true
              region: us-east-1
              secret_access_key: ${AWS_SECRET_ACCESS_KEY}
        ingest_storage:
          enabled: false
        ingester:
          push_grpc_method_enabled: true
          ring:
            replication_factor: 2
        limits:
          compactor_blocks_retention_period: 365d
          ingestion_burst_size: 500000
          ingestion_rate: 100000
          max_global_series_per_user: 0
          out_of_order_time_window: 30m
          ruler_max_rules_per_rule_group: 60
        multitenancy_enabled: false
        ruler:
          alertmanager_url: dns+http://alertmanager-operated.monitoring.svc.cluster.local:9093/
          rule_path: /data/rules
        ruler_storage:
          backend: s3
          s3:
            access_key_id: ${AWS_ACCESS_KEY_ID}
            bucket_name: mimir-ruler
            endpoint: seaweedfs-s3.seaweedfs.svc:8333
            insecure: true
            region: us-east-1
            secret_access_key: ${AWS_SECRET_ACCESS_KEY}
    minio:
      enabled: false
    overrides_exporter:
      enabled: false
    querier:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    query_frontend:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    query_scheduler:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    results-cache:
      enabled: false
    rollout_operator:
      enabled: false
    ruler:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      enabled: true
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    store_gateway:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      persistentVolume:
        emptyDir:
          sizeLimit: 10Gi
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
      zoneAwareReplication:
        enabled: false
