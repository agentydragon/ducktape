apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-control-plane-auth
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/monitoring/control-plane-auth
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: monitoring-control-plane-auth
    namespace: ducktape-flux
  timeout: 10m
  dependsOn:
    - name: monitoring-namespace
      namespace: ducktape-flux
    - name: monitoring-alloy
      namespace: ducktape-flux
