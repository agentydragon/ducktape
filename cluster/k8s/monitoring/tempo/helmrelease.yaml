apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: tempo
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  values:
    tempo:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

      storage:
        trace:
          backend: s3
          s3:
            endpoint: seaweedfs-s3.seaweedfs.svc:8333
            bucket: tempo
            insecure: true

      # Metrics-generator: powers TraceQL metrics queries (rate(), count_over_time(), etc.)
      # in Grafana's Explore Traces app. Without this, queries over "recent" (not yet
      # flushed to object storage) data fail with:
      #   error finding generators in Querier.queryRangeRecent: error finding generators: empty ring
      # because there are no metrics-generator instances registered in the ring.
      metricsGenerator:
        enabled: true
        remoteWriteUrl: "http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push"
        processor:
          local_blocks: {}
          service_graphs: {}
          span_metrics: {}

      overrides:
        defaults:
          metrics_generator:
            processors:
              - local-blocks
              - service-graphs
              - span-metrics

      extraEnvFrom:
        - secretRef:
            name: tempo-s3-credentials

    persistence:
      enabled: false

    nodeSelector:
      topology.kubernetes.io/region: hil

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    serviceMonitor:
      enabled: true
