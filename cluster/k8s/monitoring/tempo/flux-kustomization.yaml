apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tempo
  namespace: ducktape-flux
spec:
  suspend: false
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/monitoring/tempo
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: monitoring-tempo
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: tempo
      namespace: monitoring
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: tempo
      namespace: monitoring
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tempo
      namespace: monitoring
  timeout: 5m
  dependsOn:
    - name: monitoring-crds # the chart's serviceMonitor.enabled
      namespace: ducktape-flux
    - name: grafana-helmrepository
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
