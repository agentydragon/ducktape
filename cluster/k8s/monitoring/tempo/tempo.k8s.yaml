apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Tempo's tenant-local SeaweedFS trace bucket.
  name: tempo
  namespace: monitoring
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: tempo
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: tempo
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: tempo
  namespace: seaweedfs
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  annotations:
    description: Tempo's tenant-local SeaweedFS credentials.
  name: tempo
  namespace: monitoring
spec:
  identityRef:
    name: tempo
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: tempo-seaweedfs-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: tempo
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: monitoring
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: monitoring
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: tempo-s3-credentials
  namespace: monitoring
type: Opaque
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  chart:
    spec:
      chart: tempo
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 1.x
  interval: 30m
  values:
    nodeSelector:
      topology.kubernetes.io/region: hil
    persistence:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
    serviceMonitor:
      enabled: true
    tempo:
      extraEnvFrom:
        - secretRef:
            name: tempo-seaweedfs-credentials
      metricsGenerator:
        enabled: true
        processor:
          local_blocks: {}
          service_graphs: {}
          span_metrics: {}
        remoteWriteUrl: http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push
      overrides:
        defaults:
          metrics_generator:
            processors:
              - local-blocks
              - service-graphs
              - span-metrics
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      storage:
        trace:
          backend: s3
          s3:
            bucket: tempo
            endpoint: seaweedfs-s3.seaweedfs.svc:8333
            insecure: true
