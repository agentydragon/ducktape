apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: langfuse
  namespace: langfuse
  annotations:
    description: Langfuse event, export, and media objects.
spec:
  name: langfuse
  # The physical bucket is populated; adopt it during the ownership handoff.
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  reclaimPolicy: Retain
  access:
    - user: langfuse
      actions: [Read, Write, List, Tagging]
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: langfuse
  namespace: langfuse
  annotations:
    description: Langfuse's tenant-local SeaweedFS credentials.
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  # The IAM identity name is cluster-global. Without a same-namespace
  # S3Identity, the operator uses the existing identity named langfuse.
  identityRef:
    name: langfuse
  # Use a new Secret during the staged handoff. The existing Secret is
  # populated by the old cross-namespace S3Credentials object and cannot be
  # adopted here.
  secretRef:
    name: langfuse-seaweedfs-credentials
    accessKeyField: s3-access-key-id
    secretKeyField: s3-secret-access-key
  reclaimPolicy: Retain
---
# Permit only Langfuse's tenant-local Bucket and S3Credentials to reference the
# SeaweedFS cluster in its namespace.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: langfuse
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: langfuse
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: langfuse
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
