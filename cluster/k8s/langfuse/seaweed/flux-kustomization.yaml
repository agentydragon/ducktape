apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: langfuse-seaweed
  namespace: ducktape-flux
spec:
  suspend: false
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/langfuse/seaweed
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: langfuse-seaweed
    namespace: ducktape-flux
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: langfuse
      namespace: langfuse
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: langfuse
      namespace: langfuse
  dependsOn:
    - name: langfuse-namespace
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
