apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 24h
  url: https://langfuse.github.io/langfuse-k8s
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 15m
  timeout: 20m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: langfuse
      version: "1.5.33"
      sourceRef:
        kind: HelmRepository
        name: langfuse
        namespace: langfuse
  values:
    langfuse:
      features:
        # SSO-only: email/password login is disabled below via
        # AUTH_DISABLE_USERNAME_PASSWORD. Signup must stay enabled so the
        # Authentik-gated SSO flow can establish the session on first login;
        # access is bounded by the langfuse application's admins-group policy
        # binding in Authentik (tf/gitops/sso-providers/provider_langfuse.tf).
        signUpDisabled: false
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      # Langfuse is stateless at the pod level and uses external storage. Allow
      # control-plane nodes as overflow capacity, while the affinity below keeps
      # ordinary placement on workers.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
      # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
      # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      nextauth:
        url: "https://langfuse.allegedly.works"
        secret:
          secretKeyRef:
            name: langfuse-secrets
            key: nextauth-secret
      salt:
        secretKeyRef:
          name: langfuse-secrets
          key: salt
      encryptionKey:
        secretKeyRef:
          name: langfuse-secrets
          key: encryption-key

      web:
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
        # The image runs initialization before its health endpoints are
        # available; give it time to finish instead of restarting it during
        # startup.
        livenessProbe:
          initialDelaySeconds: 300

      worker:
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
        livenessProbe:
          initialDelaySeconds: 300

      # Headless initialization — bootstrap org/project/user on first startup.
      # API keys live in langfuse-secrets so LiteLLM can consume the same keys
      # later without a manual copy step.
      additionalEnv:
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1536"
        # The shared ClickHouse uses the canonical default logical cluster
        # name, so Langfuse can keep automatic migrations enabled.
        - name: CLICKHOUSE_CLUSTER_NAME
          value: "default"
        # --- Authentik SSO (generic OIDC relying party) ---
        # Client credentials come from the langfuse-oidc-config secret, minted
        # by tf/gitops/sso-providers/provider_langfuse.tf in the authentik
        # namespace and reflected here by emberstack reflector.
        - name: AUTH_CUSTOM_NAME
          value: "Authentik"
        - name: AUTH_CUSTOM_ISSUER
          # No trailing slash: next-auth builds the discovery URL as
          # ${AUTH_CUSTOM_ISSUER}/.well-known/openid-configuration, and a
          # trailing slash yields a double slash that Authentik 301-redirects —
          # openid-client doesn't follow redirects on discovery (OAuthSignin).
          value: "https://auth.allegedly.works/application/o/langfuse"
        - name: AUTH_CUSTOM_SCOPE
          value: "openid email profile"
        - name: AUTH_CUSTOM_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: langfuse-oidc-config
              key: client-id
        - name: AUTH_CUSTOM_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: langfuse-oidc-config
              key: client-secret
        # Link the SSO identity to the headless-init admin user (same email)
        # so login lands on the existing org/project instead of an empty one.
        - name: AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING
          value: "true"
        # SSO-only: disable email/password login and signup entirely.
        - name: AUTH_DISABLE_USERNAME_PASSWORD
          value: "true"
        - name: LANGFUSE_INIT_ORG_ID
          value: "langfuse-default-org"
        - name: LANGFUSE_INIT_ORG_NAME
          value: "Default"
        - name: LANGFUSE_INIT_PROJECT_ID
          value: "langfuse-litellm-project"
        - name: LANGFUSE_INIT_PROJECT_NAME
          value: "litellm"
        - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
        - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_PROJECT_SECRET_KEY
        # Email matches the Authentik identity (agentydragon@gmail.com) so the
        # SSO account links to this org owner. Headless init adds this user as
        # an owner of langfuse-default-org on startup.
        - name: LANGFUSE_INIT_USER_EMAIL
          value: "agentydragon@gmail.com"
        - name: LANGFUSE_INIT_USER_NAME
          value: "Rai"
        - name: LANGFUSE_INIT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_USER_PASSWORD

    postgresql:
      deploy: false
      host: langfuse-db-rw
      auth:
        username: langfuse
        database: langfuse
        existingSecret: langfuse-db-app
        secretKeys:
          userPasswordKey: password

    # ClickHouse is managed centrally in the clickhouse namespace.
    clickhouse:
      deploy: false
      host: clickhouse.clickhouse.svc.cluster.local
      httpPort: 8123
      nativePort: 9000
      database: langfuse
      auth:
        username: langfuse
        existingSecret: clickhouse-langfuse-credentials
        existingSecretKey: password
      migration:
        url: clickhouse://clickhouse.clickhouse.svc.cluster.local:9000
        ssl: false
        autoMigrate: true
      clusterEnabled: true

    redis:
      deploy: false
      host: langfuse-valkey-ovh-master.langfuse.svc.cluster.local
      port: 6379
      auth:
        username: null
        password: null

    s3:
      deploy: false
      storageProvider: s3
      bucket: langfuse
      region: auto
      endpoint: "http://seaweedfs-s3.seaweedfs.svc:8333"
      forcePathStyle: true
      accessKeyId:
        secretKeyRef:
          name: langfuse-s3-credentials
          key: s3-access-key-id
      secretAccessKey:
        secretKeyRef:
          name: langfuse-s3-credentials
          key: s3-secret-access-key
      eventUpload:
        prefix: events/
      batchExport:
        prefix: exports/
      mediaUpload:
        prefix: media/

    # Ingress disabled — using Gateway API HTTPRoute
    ingress:
      enabled: false
