apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 15m
  timeout: 20m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: langfuse
      version: "1.5.33"
      sourceRef:
        kind: HelmRepository
        name: langfuse
        namespace: langfuse
  values:
    langfuse:
      features:
        # SSO-only: email/password login is disabled below via
        # AUTH_DISABLE_USERNAME_PASSWORD. Signup must stay enabled so the
        # Authentik-gated SSO flow can establish the session on first login;
        # access is bounded by the langfuse application's admins-group policy
        # binding in Authentik (tf/gitops/sso-providers/provider_langfuse.tf).
        signUpDisabled: false
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
      # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
      # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      nextauth:
        url: "https://langfuse.allegedly.works"
        secret:
          secretKeyRef:
            name: langfuse-secrets
            key: nextauth-secret
      salt:
        secretKeyRef:
          name: langfuse-secrets
          key: salt
      encryptionKey:
        secretKeyRef:
          name: langfuse-secrets
          key: encryption-key

      web:
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi

      worker:
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi

      # Headless initialization — bootstrap org/project/user on first startup.
      # API keys live in langfuse-secrets so LiteLLM can consume the same keys
      # later without a manual copy step.
      additionalEnv:
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1536"
        # --- Authentik SSO (generic OIDC relying party) ---
        # Client credentials come from the langfuse-oidc-config secret, minted
        # by tf/gitops/sso-providers/provider_langfuse.tf in the authentik
        # namespace and reflected here by emberstack reflector.
        - name: AUTH_CUSTOM_NAME
          value: "Authentik"
        - name: AUTH_CUSTOM_ISSUER
          # No trailing slash: next-auth builds the discovery URL as
          # ${AUTH_CUSTOM_ISSUER}/.well-known/openid-configuration, and a
          # trailing slash yields a double slash that Authentik 301-redirects —
          # openid-client doesn't follow redirects on discovery (OAuthSignin).
          value: "https://auth.allegedly.works/application/o/langfuse"
        - name: AUTH_CUSTOM_SCOPE
          value: "openid email profile"
        - name: AUTH_CUSTOM_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: langfuse-oidc-config
              key: client-id
        - name: AUTH_CUSTOM_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: langfuse-oidc-config
              key: client-secret
        # Link the SSO identity to the headless-init admin user (same email)
        # so login lands on the existing org/project instead of an empty one.
        - name: AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING
          value: "true"
        # SSO-only: disable email/password login and signup entirely.
        - name: AUTH_DISABLE_USERNAME_PASSWORD
          value: "true"
        - name: LANGFUSE_INIT_ORG_ID
          value: "langfuse-default-org"
        - name: LANGFUSE_INIT_ORG_NAME
          value: "Default"
        - name: LANGFUSE_INIT_PROJECT_ID
          value: "langfuse-litellm-project"
        - name: LANGFUSE_INIT_PROJECT_NAME
          value: "litellm"
        - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
        - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_PROJECT_SECRET_KEY
        # Email matches the Authentik identity (agentydragon@gmail.com) so the
        # SSO account links to this org owner. Headless init adds this user as
        # an owner of langfuse-default-org on startup.
        - name: LANGFUSE_INIT_USER_EMAIL
          value: "agentydragon@gmail.com"
        - name: LANGFUSE_INIT_USER_NAME
          value: "Rai"
        - name: LANGFUSE_INIT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_USER_PASSWORD

    postgresql:
      deploy: false
      host: langfuse-db-rw
      auth:
        username: langfuse
        database: langfuse
        existingSecret: langfuse-db-app
        secretKeys:
          userPasswordKey: password

    # TODO(reliability): ClickHouse replication (3-node cluster) for
    # durability. Currently single-node on OVH local-path.
    clickhouse:
      deploy: true
      auth:
        existingSecret: langfuse-secrets
        existingSecretKey: clickhouse-password
      replicaCount: 1
      resources:
        requests:
          # A starting value only: the namespace is on RequestsOnly via the
          # default-vpa-requests-only Kyverno policy, so VPA owns the request
          # from here and the limits below are what actually apply.
          cpu: 200m
          memory: 1Gi
          ephemeral-storage: 50Mi
        limits:
          # Cold start loads every part's metadata and immediately schedules
          # the merges that accumulated while the server was down, so the
          # budget that matters is the startup one, not steady state. The
          # server must bind HTTP within the liveness probe's 10s + 3x10s or
          # the kubelet kills it and the next start begins cold again.
          cpu: "2"
          # Resident set sits ~1.6Gi and VPA's own upper bound reached ~2.5Gi.
          memory: 3Gi
          ephemeral-storage: 2Gi
      # Disable ClickHouse's built-in self-profiling system logs. These grew
      # to 3.8 GiB in ~2 weeks, causing OOMKills at the 1.5 GiB limit.
      # Uses `remove="1"` to fully strip log table definitions from merged
      # config. See: https://kb.altinity.com/altinity-kb-setup-and-maintenance/altinity-kb-system-tables-eat-my-disk/
      extraOverrides: |
        <clickhouse>
          <logger>
            <level>information</level>
          </logger>
          <trace_log remove="1" />
          <text_log remove="1" />
          <metric_log remove="1" />
          <asynchronous_metric_log remove="1" />
          <part_log remove="1" />
          <latency_log remove="1" />
          <query_metric_log remove="1" />
          <error_log remove="1" />
          <query_log>
            <!-- `ttl` is the retention control here. `max_size_rows` is the
                 in-memory flush threshold, not a cap on stored rows: lowering
                 it makes the table flush more often and accumulate parts,
                 which is the opposite of the intent. -->
            <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
          </query_log>
        </clickhouse>
      clusterEnabled: false
      zookeeper:
        replicaCount: 1
        resourcesPreset: small
        nodeSelector:
          topology.kubernetes.io/zone: hil-ovh
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
        # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
        # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        persistence:
          storageClass: local-path-ovh
          size: 8Gi
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
      # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
      # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      persistence:
        storageClass: local-path-ovh
        size: 20Gi

    redis:
      deploy: false
      host: langfuse-valkey-ovh-master.langfuse.svc.cluster.local
      port: 6379
      auth:
        username: null
        password: null

    s3:
      deploy: false
      storageProvider: s3
      bucket: langfuse
      region: auto
      endpoint: "http://seaweedfs-s3.seaweedfs.svc:8333"
      forcePathStyle: true
      accessKeyId:
        secretKeyRef:
          name: langfuse-s3-credentials
          key: s3-access-key-id
      secretAccessKey:
        secretKeyRef:
          name: langfuse-s3-credentials
          key: s3-secret-access-key
      eventUpload:
        prefix: events/
      batchExport:
        prefix: exports/
      mediaUpload:
        prefix: media/

    # Ingress disabled — using Gateway API HTTPRoute
    ingress:
      enabled: false
