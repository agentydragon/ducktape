---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 24h
  url: https://langfuse.github.io/langfuse-k8s
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 15m
  timeout: 20m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: langfuse
      version: "1.5.33"
      sourceRef:
        kind: HelmRepository
        name: langfuse
        namespace: langfuse
  values:
    langfuse:
      features:
        signUpDisabled: true
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      nextauth:
        url: "https://langfuse.allegedly.works"
        secret:
          secretKeyRef:
            name: langfuse-secrets
            key: nextauth-secret
      salt:
        secretKeyRef:
          name: langfuse-secrets
          key: salt
      encryptionKey:
        secretKeyRef:
          name: langfuse-secrets
          key: encryption-key

      web:
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi

      worker:
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi

      # Headless initialization — bootstrap org/project/user on first startup.
      # API keys live in langfuse-secrets so LiteLLM can consume the same keys
      # later without a manual copy step.
      additionalEnv:
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1536"
        - name: LANGFUSE_INIT_ORG_ID
          value: "langfuse-default-org"
        - name: LANGFUSE_INIT_ORG_NAME
          value: "Default"
        - name: LANGFUSE_INIT_PROJECT_ID
          value: "langfuse-litellm-project"
        - name: LANGFUSE_INIT_PROJECT_NAME
          value: "litellm"
        - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
        - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_PROJECT_SECRET_KEY
        - name: LANGFUSE_INIT_USER_EMAIL
          value: "admin@allegedly.works"
        - name: LANGFUSE_INIT_USER_NAME
          value: "admin"
        - name: LANGFUSE_INIT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_USER_PASSWORD

    postgresql:
      deploy: false
      host: langfuse-db-rw
      auth:
        username: langfuse
        database: langfuse
        existingSecret: langfuse-db-app
        secretKeys:
          userPasswordKey: password

    # TODO(reliability): ClickHouse replication (3-node cluster) for
    # durability. Currently single-node on OVH local-path.
    clickhouse:
      deploy: true
      auth:
        existingSecret: langfuse-secrets
        existingSecretKey: clickhouse-password
      replicaCount: 1
      resourcesPreset: medium
      # Disable ClickHouse's built-in self-profiling system logs. These grew
      # to 3.8 GiB in ~2 weeks, causing OOMKills at the 1.5 GiB limit.
      # Uses `remove="1"` to fully strip log table definitions from merged
      # config. See: https://kb.altinity.com/altinity-kb-setup-and-maintenance/altinity-kb-system-tables-eat-my-disk/
      extraOverrides: |
        <clickhouse>
          <logger>
            <level>information</level>
          </logger>
          <trace_log remove="1" />
          <text_log remove="1" />
          <metric_log remove="1" />
          <asynchronous_metric_log remove="1" />
          <query_log>
            <max_size_rows>8192</max_size_rows>
            <reserved_size_rows>8192</reserved_size_rows>
          </query_log>
        </clickhouse>
      clusterEnabled: false
      zookeeper:
        replicaCount: 1
        resourcesPreset: small
        nodeSelector:
          topology.kubernetes.io/zone: hil-ovh
        persistence:
          storageClass: local-path-ovh
          size: 8Gi
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      persistence:
        storageClass: local-path-ovh
        size: 20Gi

    redis:
      deploy: false
      host: langfuse-valkey-ovh-master.langfuse.svc.cluster.local
      port: 6379
      auth:
        username: null
        password: null

    s3:
      deploy: false
      storageProvider: s3
      bucket: langfuse
      region: auto
      endpoint: "http://seaweedfs-s3.seaweedfs.svc:8333"
      forcePathStyle: true
      accessKeyId:
        secretKeyRef:
          name: langfuse-secrets
          key: s3-access-key-id
      secretAccessKey:
        secretKeyRef:
          name: langfuse-secrets
          key: s3-secret-access-key
      eventUpload:
        prefix: events/
      batchExport:
        prefix: exports/
      mediaUpload:
        prefix: media/

    # Ingress disabled — using Gateway API HTTPRoute
    ingress:
      enabled: false
