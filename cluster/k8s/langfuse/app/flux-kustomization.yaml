apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: langfuse
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: langfuse-namespace
      namespace: ducktape-flux
    - name: langfuse-secrets
      namespace: ducktape-flux
    - name: langfuse-cache
      namespace: ducktape-flux
    - name: langfuse-db
      namespace: ducktape-flux
    - name: clickhouse
      namespace: ducktape-flux
    - name: langfuse-seaweed
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: claude-rbac
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: langfuse
      namespace: langfuse
  interval: 10m
  path: ./cluster/k8s/langfuse/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: langfuse-app
    namespace: ducktape-flux
  suspend: false
  timeout: 20m
