apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: langfuse
  namespace: flux-system
spec:
  suspend: false
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/langfuse/app
  prune: true
  # Temporary controller-handoff guard. Remove after this Kustomization
  # has been recreated in ducktape-flux.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 20m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: langfuse
      namespace: langfuse
  dependsOn:
    - name: langfuse-namespace
      namespace: ducktape-flux
    - name: langfuse-secrets
      namespace: ducktape-flux
    - name: langfuse-cache
    - name: langfuse-db
    - name: seaweedfs-langfuse-bucket
    - name: gateway
