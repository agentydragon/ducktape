apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: langfuse
  namespace: ducktape-flux
spec:
  suspend: false
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/langfuse/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  timeout: 20m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: langfuse
      namespace: langfuse
  dependsOn:
    - name: langfuse-namespace
      namespace: ducktape-flux
    - name: langfuse-secrets
      namespace: ducktape-flux
    - name: langfuse-cache
      namespace: ducktape-flux
    - name: langfuse-db
      namespace: ducktape-flux
    - name: clickhouse
      namespace: ducktape-flux
    - name: seaweedfs-langfuse-bucket
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
