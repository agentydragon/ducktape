apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: langfuse-db
  namespace: langfuse
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  # CNPG 1.27+ kills isolated primaries by default (liveness probe).
  # Disable to prevent false positives from transient network blips.
  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  storage:
    storageClass: local-path-ovh
    size: 10Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: langfuse
      owner: langfuse
      # CNPG auto-generates credentials in secret langfuse-db-app
