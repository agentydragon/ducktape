apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: langfuse-secrets
  namespace: flux-system
spec:
  suspend: false
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/langfuse/secrets
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
    - name: langfuse-namespace
