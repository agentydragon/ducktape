apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: langfuse-secrets
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: langfuse-namespace
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/langfuse/secrets
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: langfuse-secrets
    namespace: ducktape-flux
  suspend: false
  timeout: 10m
