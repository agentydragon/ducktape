apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: langfuse-db
  namespace: ducktape-flux
spec:
  suspend: false
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: langfuse-db
    namespace: ducktape-flux
  path: ./cluster/k8s/langfuse/db
  prune: true
  wait: true
  dependsOn:
    - name: langfuse-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
