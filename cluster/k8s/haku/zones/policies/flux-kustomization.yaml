apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-zones-policies
  namespace: flux-system
spec:
  retryInterval: 1m
  dependsOn:
    - name: kyverno # ClusterPolicy CRD
  interval: 10m
  path: ./cluster/k8s/haku/zones/policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 2m
