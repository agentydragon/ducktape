apiVersion: v1
kind: LimitRange
metadata:
  name: haku-sandbox-zai-limits
  namespace: haku-sandbox-zai
spec:
  limits:
    - max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 10m
        memory: 16Mi
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      type: Container
    - max:
        cpu: "2"
        memory: 4Gi
      type: Pod
