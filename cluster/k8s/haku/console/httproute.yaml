# Public route for the Haku console. Traffic flows directly: Gateway -> console Service,
# with NO Authentik forward-auth outpost in front (that proxy provider was retired — see
# cluster/k8s/authentik/app/blueprints/haku-dashboard-sso.yaml tombstone). The console owns
# its auth: the operator browser logs in via Authentik OIDC (operator_oidc -> session, guarded
# by OperatorSessionMiddleware) and agents authenticate to /mcp via MultiAuth (OIDCProxy DCR +
# static bearer). Single-user access is Authentik's application access policy on the console's
# OAuth2 providers.
#
# The Service targets the nginx `static` container (:8081), which serves the SPA and proxies
# /api, /healthz, /mcp, /auth, and the /.well-known/oauth-* discovery paths to the FastAPI
# container (:8080) — see haku/console/default.conf.template.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: haku-console
  namespace: haku-console
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "haku.allegedly.works"
  rules:
    - backendRefs:
        - name: haku-console
          port: 8080
      # The MCP streamable-HTTP/SSE stream and the OAuth dance can outlast the default.
      timeouts:
        request: "120s"
        backendRequest: "120s"
