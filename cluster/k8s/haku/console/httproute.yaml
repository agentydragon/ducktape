# Public route for the Haku console. Traffic flows Gateway -> standalone static Service -> API
# Service, with no Authentik forward-auth outpost in front. The Console owns
# its auth: the operator browser logs in via Authentik OIDC (operator_oidc -> session, guarded
# by OperatorSessionMiddleware) and agents authenticate to /mcp via MultiAuth (OIDCProxy DCR +
# static bearer). Single-user access is Authentik's application access policy on the console's
# OAuth2 providers.
#
# The static Service targets nginx (:8081), which serves the SPA and proxies /api, /healthz,
# /mcp, /auth, and the /.well-known/oauth-* discovery paths to the API Service (:8080) — see
# haku/console/default.conf.template.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: haku-console
  namespace: haku-console
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      # Do not attach this backend route to the plaintext listener: the gateway's HTTP-only route
      # owns port 80 and redirects it to HTTPS.
      sectionName: https-wildcard
  hostnames:
    - "haku.allegedly.works"
  rules:
    - filters:
        # Set at the TLS-aware edge so both nginx-served SPA responses and FastAPI responses carry
        # the policy; neither same-pod HTTP hop can reliably infer that it terminated HTTPS.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000"
      backendRefs:
        - name: haku-console-static
          port: 8080
      # The MCP streamable-HTTP/SSE stream and the OAuth dance can outlast the default. It must
      # also clear the `sandbox` server's exec_sandbox budget: max_exec_timeout_seconds is 300s
      # (agent_sandbox in cluster/k8s/haku/console/config.yaml) and Console itself waits up to
      # timeout_seconds+15s for that command (haku/sandbox/kubernetes_client.py,
      # KubernetesWebSocketExecRunner.run) — a 120s route timeout was cutting off legitimate
      # long-running execs at 2 minutes instead of letting them run the allotted 5.
      timeouts:
        request: "360s"
        backendRequest: "360s"
