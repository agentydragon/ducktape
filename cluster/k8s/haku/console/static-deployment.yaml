# The public, unprivileged Haku Console shell. It is deliberately a separate
# Deployment from the trusted API: updating a fingerprinted SPA must not restart
# operator authentication, MCP streams, or Console background workers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-console-static
  namespace: haku-console
  labels:
    app.kubernetes.io/name: haku-console-static
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-console-static
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-console-static
    spec:
      # This pod holds no Kubernetes, database, OAuth, or MCP credential. The
      # namespace default ServiceAccount is not useful to nginx, so do not mount
      # its bearer token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: static
          image: ghcr.io/agentydragon/haku-console-static:devel-20260905072155-2aaf52a # {"$imagepolicy": "flux-system:haku-console-static"}
          imagePullPolicy: Always
          env:
            # The nginx entrypoint renders /etc/nginx/templates/default.conf.template
            # with these origins at startup, keeping frame-src environment-specific
            # while the Console itself remains unframeable via frame-ancestors 'none'.
            - name: HAKU_CONSOLE_HAKU_UI_URL
              value: https://haku-ui.allegedly.works
            - name: HAKU_CONSOLE_AUTH_ORIGIN
              value: https://auth.allegedly.works
            # nginx has no same-pod loopback peer after the split. This Service
            # name resolves even before the API has Ready endpoints, allowing the
            # static shell to roll independently while backend probes stay separate.
            - name: HAKU_CONSOLE_API_UPSTREAM
              value: haku-console.haku-console.svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # Probe nginx's own SPA response, not /healthz, which is intentionally
          # proxied to the API. The shell can roll independently of API health.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # The SPA is baked into the image, but the nginx entrypoint writes
            # the envsubst-rendered runtime config here before nginx starts.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nginx-conf
          emptyDir: {}
