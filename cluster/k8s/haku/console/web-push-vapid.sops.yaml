apiVersion: v1
kind: Secret
metadata:
    name: haku-console-web-push-vapid
    namespace: haku-console
    annotations:
        description: 'VAPID (RFC 8292) private key that identifies haku-console to browser push services. The console signs every Web Push notification of a pending tool-call approval with it; the public half is derived from this key and handed to each browser at subscribe time, which binds it to that subscription. Rotating this key therefore invalidates every stored push_subscriptions row and each device must re-subscribe from console Settings -> Notifications. Not an authorization credential: a push is a prompt to decide, and the decision still goes through the approving operator''s own Authentik session. Lives in haku-console (NOT haku-sandbox) like every other console secret, so Haku cannot read it. Rotate with `openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt` and re-sops this file. See haku/console/web_push.py.'
type: Opaque
stringData:
    private-key-pem: ENC[AES256_GCM,data:,iv:srszOA+RlEH7WBu5XGRWkxEIpj2/OF7QtCi0MK5Cy54=,tag:VXwFVn2EqDnHiOhtzbgY8w==,type:str]
