# Non-secret haku-console config. Secret values stay in env/Kubernetes Secrets.
#
# Console-owned Agent Sandbox runtimes. Every value is explicit deployment
# wiring; the application deliberately has no topology/path/proxy defaults. The
# placeholders are non-secret—the real bearers stay in the trusted Console/egress path.
# https, never http: client-go attaches kubeconfig credentials only to a TLS server, so a
# plain-http proxy URL makes every sandbox kubectl request unauthenticated (401).
runner_kubernetes_proxy_url: https://haku-kube-api-proxy.haku-console.svc.cluster.local:8443
haku_agent_workspace_setup: /usr/local/bin/haku-sandbox-setup.sh

git_ca_bundle: /etc/ssl/certs/ca-certificates.crt
recall_indexes:
  # `index_id` is the durable search/grant boundary. Source and remote configuration belong in
  # Git rather than being inferred from an environment-variable name; only the Git credential is
  # secret and therefore remains an env reference.
  # Sync contract: each entry is mirrored verbatim into its chunk pod's own config slice
  # (indexer-chunk-<index>-config.yaml) — the derivation tests fail this file against the slices
  # on any drift.
  haku_state:
    index_id: haku-state
    index_type: git
    repo_url: http://forgejo-http.forgejo:3000/haku/haku-state.git
    branch: main
    mirror_path: /tmp/haku-recall-index/haku-state.git
  haku_conversations:
    index_id: haku-conversations
    index_type: chat
  # Public upstream source for code and deployment-context recall. It intentionally has no
  # credential references: the console clones the canonical public repository over HTTPS.
  # The Git reducer skips binary blobs and blobs larger than 1 MiB.
  ducktape_public:
    index_id: ducktape-public
    index_type: git
    repo_url: https://github.com/agentydragon/ducktape.git
    branch: devel
    mirror_path: /tmp/haku-recall-index/ducktape.git

harnesses:
  claude_code:
    agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2
    namespace: haku-runtime-sandbox
    warm_pool: haku-claude
    claim_prefix: claude
    harness_label: claude
    cwd: /workspace
    session_ttl_seconds: 7200
    # Colocated Console egress fence (#4670): replaces the dedicated haku-claude-oauth-proxy iron
    # proxy. Claude Code's inference now goes to the in-cluster LiteLLM gateway (-> CLIProxyAPI) as a
    # FENCED destination — the `claude-litellm` credential + its allow_prohibited_address configuration grant
    # policy below admit and substitute it; the real bearers stay in Console.
    https_proxy: http://haku-egress-proxy.haku-console.svc.cluster.local:8888
    # The sidecar mints leaves with the shared haku-egress-proxy CA, which the mounted
    # haku-egress-proxy-ca-cert bundle already carries, so the runner trusts the fence with no CA
    # change. Retiring that external CA for a console-minted one is a separate follow-up.
    ca_bundle: /egress-proxy-ca/ca-certificates.crt
    # Only cluster-internal control-plane hosts stay direct. LiteLLM is deliberately NOT here: its
    # traffic goes through the fence for key substitution, admitted despite its internal ClusterIP by
    # the LiteLLM configuration grant's allow_prohibited_address flag (#5073). Forgejo is deliberately
    # NOT here either (#4710): the CLI's runtime git/REST traffic to both Forgejo origins traverses
    # the fence, admitted by the haku-forgejo configuration grant (allow_prohibited_address for the
    # internal service). The shared bootstrap derives the same bearer-userinfo proxy from the
    # claim-owned session token before its haku-state checkout, because it runs before this
    # launch-selected environment is handed to the harness.
    no_proxy: 127.0.0.1,localhost,haku-console.haku-console.svc.cluster.local,haku-kube-api-proxy.haku-console.svc.cluster.local
    # Claude connects directly to Console's existing streamable-HTTP MCP endpoint with the
    # per-session bearer injected into this sandbox through SandboxClaim.spec.env. Its MCP variable
    # is an alias of the runner bearer, not a second credential. Console resolves it to the session's
    # immutable Agent/profile identity, so the runtime is not bound to one static Agent and the Agent
    # may use the same token through curl or another MCP client.
    mcp_url: http://haku-console.haku-console.svc.cluster.local:9090/mcp
    implementation:
      kind: claude_code
      # Claude Code -> in-cluster LiteLLM (Anthropic Messages surface) -> CLIProxyAPI, running the
      # agent on the flat-rate Claude subscription models (anthropic-max20/ant-messages/*, #5086) served by
      # CLIProxyAPI's Claude OAuth session — not the ChatGPT/Codex lane the codex runner uses. Never
      # api.anthropic.com — the subscription OAuth stays in CLIProxyAPI. ANTHROPIC_BASE_URL is the
      # internal LiteLLM host, reached through the fence (see the no_proxy + claude-litellm credential
      # above/below). sonnet-5 is Haku's standing primary (haku/base/agent_shared.yaml); haiku is the
      # cheap background tier. The haku-console-claude key allowlist (tf/gitops/litellm-keys) admits
      # exactly this anthropic-max20/ant-messages/* lane.
      api_base_url: http://litellm.litellm.svc.cluster.local:4000
      model: anthropic-max20/ant-messages/claude-sonnet-5
      haiku_model: anthropic-max20/ant-messages/claude-haiku-4-5-20251001
      # Inert placeholder the fence swaps for the real haku-console-claude LiteLLM virtual key on the
      # LiteLLM origin only (the `claude-litellm` credential below); the sandbox never holds the key.
      auth_token_placeholder: proxy-litellm-haku-console-claude-placeholder
      environment:
        # Assert to the CLI that the LiteLLM lane passes the tool-search betas through, so
        # the ~150 console MCP schemas defer instead of inlining ~273k tokens per session
        # (#5155). The CLI never probes the gateway for this.
        ENABLE_TOOL_SEARCH: "true"
  codex_app_server:
    agent_id: 43a833f3-2b1c-4a04-9b8c-1df0cedfb79e
    namespace: haku-runtime-sandbox
    warm_pool: haku-public-coder-codex
    claim_prefix: codex
    harness_label: codex
    cwd: /workspace
    session_ttl_seconds: 7200
    # Colocated Console egress fence (#4670): Codex's two credentialed hosts — the internal LiteLLM
    # model gateway and GitHub — are registered in `egress_decide` below with matching configuration
    # grants. LiteLLM's grant carries `allow_prohibited_address` because it resolves into the cluster
    # service CIDR, the boundary the fence otherwise denies.
    https_proxy: http://haku-egress-proxy.haku-console.svc.cluster.local:8888
    # The Codex sandbox now mounts the fence's trust bundle (haku-egress-proxy-ca-cert — full
    # public + cluster + interception roots) at this path in place of the former dedicated runner
    # proxy's CA
    # (sandboxtemplate-haku-public-coder-codex.yaml), so every TLS client — GnuTLS git included —
    # trusts the fence.
    ca_bundle: /etc/ssl/certs/ca-certificates.crt
    # Control-plane traffic (Console bridge/MCP, the Kubernetes auth proxy) stays direct. LiteLLM is
    # deliberately NOT in no_proxy: its model traffic must traverse the fence for the virtual-key
    # substitution, and the fence admits its cluster-internal resolution through the configuration
    # policy's allow_prohibited_address. Other cluster-internal hosts stay direct.
    no_proxy: 127.0.0.1,localhost,haku-console.haku-console.svc.cluster.local,haku-kube-api-proxy.haku-console.svc.cluster.local
    mcp_url: http://haku-console.haku-console.svc.cluster.local:9090/mcp
    implementation:
      kind: codex_app_server
      # The runner pins wire_api=responses, so this must be a `chatgpt/oai-responses/*`
      # LiteLLM entry, never `chatgpt/ant-messages/*` (the Messages lane, which fails every
      # turn at /v1/responses) — cross-checked by cluster/k8s/litellm/app/test_litellm_config.py.
      model: chatgpt/oai-responses/gpt-5.6-luna
      reasoning_effort: low
      provider_id: haku
      provider_name: Haku OpenAI-compatible
      # The sandbox has no direct LiteLLM egress. Its inert OPENAI_API_KEY placeholder reaches this
      # endpoint only through the runner-specific proxy, which substitutes the real virtual key.
      api_base_url: http://litellm.litellm.svc.cluster.local:4000/v1
      api_key_env_var: OPENAI_API_KEY
      github_token_placeholder: proxy-github-placeholder

# Auto-approval is an explicit per-Agent policy graph. Exact-tool atoms grant standing authority
# only to the named tools; newly reflected tools remain manual-approval by default. Conditional
# atoms remain typed code-owned evaluators. `haku_v1` preserves Haku's reviewed authority as of
# 2026-07-31; other Agents receive no auto-approval unless assigned a root policy below.
auto_approval_policies:
  - id: gmail_reads
    type: exact_tools
    tools:
      gmail:
        - threads_list
        - threads_get
        - messages_get
        - labels_list
        - labels_get
        - filters_list
        - filters_get
        - drafts_list
        - drafts_get
  - id: google_calendar_reads
    type: exact_tools
    tools:
      google_calendar:
        - get_event
        - list_events
        - list_event_instances
  - id: grocy_reads
    type: exact_tools
    tools:
      grocy-sf:
        - entities_get
        - entities_list
        - file_get
        - get_below_minimum_stock
        - get_current_user
        - get_db_changed_time
        - get_expired_stock
        - get_expiring_stock
        - get_product_stock
        - get_system_info
        - list_volatile_stock
        - locations_list
        - product_groups_list
        - products_list
        - quantity_units_list
        - shopping_list_get
        - shopping_lists_list
        - stock_entries_list
        - stock_get
  # GitHub MCP's normal endpoint exposes its default catalog, including writes. This is the
  # explicit 2026-08-14 upstream read-only subset: new upstream tools intentionally stay manual
  # until reviewed here. `ui_get` reads an MCP App UI resource, not GitHub repository state.
  - id: github_reads
    type: exact_tools
    tools:
      github:
        - get_me
        - get_team_members
        - get_teams
        - ui_get
        - find_duplicate
        - get_label
        - issue_dependency_read
        - issue_read
        - list_issue_fields
        - list_issue_types
        - list_issues
        - search_issues
        - list_pull_requests
        - pull_request_read
        - search_pull_requests
        - get_commit
        - get_file_blame
        - get_file_contents
        - get_latest_release
        - get_release_by_tag
        - get_tag
        - list_branches
        - list_commits
        - list_releases
        - list_repository_collaborators
        - list_tags
        - search_code
        - search_commits
        - search_repositories
        - search_users
  # `get_me` returns only the authenticated caller's own GitHub identity and has no
  # repository or mutation surface. Keep it separate so every configured Agent can
  # use the identity read without widening repository-scoped GitHub policies.
  - id: github_identity_reads
    type: exact_tools
    tools:
      github:
        - get_me
  # public-coder-agent may inspect this public source repository, but not use the Operator's GitHub
  # credential to read other public or private repositories. search_pull_requests is safe only
  # with its matching owner/repo arguments and no query-level `repo:` qualifier; search_code is
  # safe only with one unquoted `repo:agentydragon/ducktape` qualifier. Its typed policy evaluator
  # verifies those distinct boundaries before allowing either search.
  - id: public_ducktape_reads
    type: github_repository
    server: github
    owner: agentydragon
    repository: ducktape
    tools: &repo_read_tools
      - actions_get
      - actions_list
      - find_duplicate
      - get_commit
      - get_file_blame
      - get_file_contents
      - get_job_logs
      - get_label
      - get_latest_release
      - get_release_by_tag
      - get_tag
      - issue_dependency_read
      - issue_read
      - list_branches
      - list_commits
      - list_issue_fields
      - list_issue_types
      - list_issues
      - list_pull_requests
      - list_releases
      - list_repository_collaborators
      - list_tags
      - pull_request_read
      - search_issues
      - search_pull_requests
      - search_code
  # The coder Agent's own fork, used to stage branches before opening PRs into
  # agentydragon/ducktape. It already has write access here (that's how it opens PRs), so a
  # read grant on its own fork's content adds no exposure beyond what it can already write.
  # Same tool list/boundary as public_ducktape_reads — only the trusted owner differs.
  - id: public_ducktape_fork_reads
    type: github_repository
    server: github
    owner: agentydragon-agent
    repository: ducktape
    tools: *repo_read_tools
  # public-coder-agent may also inspect the private Gaffer repository. Keep this as a separate
  # repository-scoped atom so adding one private source does not widen the Ducktape boundary or
  # accidentally grant access to other repositories. Both search tools require their policy's
  # repository boundary: owner/repo arguments (and no query-level qualifier) for PR searches, or
  # one unquoted `repo:agentydragon/gaffer-private` qualifier for code searches.
  - id: public_gaffer_private_reads
    type: github_repository
    server: github
    owner: agentydragon
    repository: gaffer-private
    tools: *repo_read_tools
  # Any repository confirmed genuinely public — not bounded to a fixed owner/repo allowlist.
  # `type: github_public_repository` positively confirms the target repository's visibility with a
  # live, unauthenticated GitHub API call before approving (see
  # haku/console/auto_approval/github.py) rather than inferring "public" from the absence
  # of a restriction: the operator's GitHub OAuth token behind this connection can also reach
  # private repos it can see (agentydragon/gaffer-private included), so a bare owner/repo match
  # here would let a call read any of those just by naming it. The target repository is derived
  # the same way as the fixed-repo policies above (owner/repo arguments and no query-level `repo:`
  # qualifier for search_pull_requests; one unquoted `repo:owner/repo` qualifier for search_code),
  # then checked for public visibility instead of compared against a configured pair. Same tool
  # list as the fixed-repo policies (*repo_read_tools) — get_job_logs included.
  - id: public_github_reads
    type: github_public_repository
    server: github
    tools: *repo_read_tools
  - id: public_coder_github_reads
    type: any_of
    policies:
      - public_ducktape_reads
      - public_ducktape_fork_reads
      - public_gaffer_private_reads
      - public_github_reads
  # Side-effect-free reads on the shared `grants` server (#4918): `kubernetes_can_i` (SAR access
  # inspection) and `get_grant`. `get_grant` is actor-scoped by construction — it returns only a
  # grant owned by and applicable to the calling Agent (else not-found), and an Operator cannot call
  # it over MCP at all — so auto-approving it never exposes another principal's grant. `list_grants`
  # is auto-approved separately, only for the explicit own scope (see `grants_own_list`).
  # `create_grant` (widening — it issues new temporary authority) stays manual; `revoke_grants`
  # (own-relinquish, narrowing) is click-free via `grants_own_revoke`.
  - id: kubernetes_reads
    type: exact_tools
    tools:
      grants:
        - kubernetes_can_i
        - get_grant
  # An Agent listing its OWN grants — `list_grants(principal=self)` — is click-free (argument-
  # conditional, the same shape as `public_*_github_reads` confirming a safe scope before approving).
  # The read is actor-scoped regardless (the grant service filters to the caller's own grants), so
  # this only removes the click; omitting `principal` (the reserved broader read) stays manual.
  - id: grants_own_list
    type: grant_self_list
    server: grants
  # `whoami` returns the caller's own resolved console/MCP principal (durable Agent id + live session
  # id + access profile, or Operator id). It takes no arguments and has no side effects — a pure
  # identity read of what Console already authenticated the caller as, exposing nothing another
  # principal cannot see about itself — so it is unconditionally click-free. Distinct from
  # `kubernetes_reads` only in intent (identity, not a grant/SAR read); a dedicated atom keeps that
  # boundary legible, bundled with `grants_own_list` into `grants_self_introspection` below.
  - id: grants_whoami
    type: exact_tools
    tools:
      grants:
        - whoami
  # DRY bundle of the caller's own self-reads on the `grants` server: its own identity (`whoami`) and
  # its own grants (`list_grants(principal=self)`). Both atoms above are individually click-free; this
  # `any_of` lets each Agent profile reference one self-introspection policy instead of repeating the
  # pair. A further self-read (e.g. an own-SAR summary) is added here once.
  - id: grants_self_introspection
    type: any_of
    policies:
      - grants_whoami
      - grants_own_list
  # An Agent's `revoke_grants` only ever relinquishes its OWN grants: the tool filters to the caller
  # (`release_applicable_grants` on the trusted request principal), and `owner_agent_id` is operator-
  # only and rejected for an Agent. So it is a narrowing self-service operation — it reduces the
  # Agent's own temporary authority — and is click-free, while `create_grant` (widening) stays manual.
  - id: grants_own_revoke
    type: exact_tools
    tools:
      grants:
        - revoke_grants
  # public-coder's profile already declares recall_index_ids: [ducktape-public] below, but that
  # grant was dead without server access — haku_index wasn't in its in_process_server_ids. This is
  # narrower than haku_recall_reads: haku_index enforces per-call index scoping against the caller's
  # granted recall_index_ids server-side, so this can never reach haku-state/haku-conversations; it
  # deliberately omits haku_conversations, which reads Haku's own session transcripts.
  - id: public_coder_recall_reads
    type: exact_tools
    tools:
      haku_index:
        - search
        - index_status
  # Never grants standing authority: it only checks whether the calling Agent's own Kubernetes SAR
  # identity already covers a kubectl-passthrough-mcp call, and if so auto-*denies* it with a
  # message to use that direct path instead of the operator's broader passthrough credential. A
  # denial here always falls back to manual for anything not already covered — this narrows toward
  # what the Agent could already do unattended, never widens it.
  #
  # public-coder only for now. Haku's Claude Code runtime (and any other claude.ai-hosted variant)
  # would need verified kubectl access in its own environment, and instructions to actually reach
  # for it (or for the haku sandbox's own kube-api-proxy) instead of kubectl-passthrough-mcp, before
  # a redirect here is actionable there rather than a dead end. See TODO.md.
  - id: kubectl_passthrough_redundancy_check
    type: kubernetes_passthrough
    server: kubectl-passthrough-mcp
  - id: public_coder_safe_reads
    type: any_of
    policies:
      - public_coder_github_reads
      - github_identity_reads
      - kubernetes_reads
      - grants_self_introspection
      - grants_own_revoke
      - public_coder_recall_reads
      - kubectl_passthrough_redundancy_check
  - id: tana_safe_tools
    type: exact_tools
    tools:
      tana-rw:
        - get_or_create_calendar_node
        - search_nodes
        - read_node
        - get_children
        - open_node
        - list_tags
        - list_workspaces
        - get_tag_schema
  - id: postscanmail_reads
    type: exact_tools
    tools:
      postscanmail-mcp:
        - list_items
        - list_automation_rules
  - id: home_assistant_reads
    type: exact_tools
    tools:
      home-assistant:
        - ha_config_get_automation
        - ha_config_get_calendar_events
        - ha_config_get_category
        - ha_config_get_label
        - ha_config_get_scene
        - ha_config_get_script
        - ha_config_list_dashboard_resources
        - ha_config_list_groups
        - ha_config_list_helpers
        # ha_eval_template is deliberately absent: evaluating arbitrary Jinja
        # inside Home Assistant is execution, not a read, so it does not belong
        # in standing authority. It stays available under operator approval.
        - ha_get_addon
        - ha_get_automation_traces
        - ha_get_blueprint
        - ha_get_camera_image
        - ha_get_device
        - ha_get_entity
        - ha_get_entity_exposure
        - ha_get_hacs_info
        - ha_get_history
        - ha_get_integration
        - ha_get_logs
        - ha_get_operation_status
        - ha_get_overview
        - ha_get_skill_guide
        - ha_get_state
        - ha_get_system_health
        - ha_get_todo
        - ha_get_zone
        - ha_list_floors_areas
        - ha_list_services
        - ha_search
  # Standing authority for exactly one write: the desk light (a Govee H6006 — color modes
  # color_temp + rgb, with an effect list) on, off, or recoloured/dimmed. Service data such as
  # rgb_color, brightness and effect rides the same call and cannot redirect it, so it needs no
  # separate listing; only keys that would retarget the call are rejected. Every
  # other Home Assistant service, every other entity, and any `data` key that could retarget the
  # call stay operator-gated. This needs its own policy kind because every HA write goes through the
  # single generic `ha_call_service` tool, so an exact_tools entry would hand over locks, the alarm
  # panel and `homeassistant.restart` along with the lamp.
  - id: home_assistant_desk_light_control
    type: home_assistant_entity_control
    server: home-assistant
    entities:
      light.h6006_pegboard:
        - turn_on
        - turn_off
        - toggle
  - id: haku_sandbox_control
    type: exact_tools
    tools:
      sandbox:
        - provision_sandbox
        - exec_sandbox
        - get_sandbox_info
        - list_sandboxes
        - dispose_sandbox
  - id: managed_gmail_labels
    type: gmail_label_namespace
    server: gmail
    label_prefix: haku/
  # Reading back what happened and what is written down: the frames of a past session, the real
  # session outcome and sandbox provisioning state of a worker Haku dispatched (#5193), and semantic search over
  # the same sessions plus haku-state.
  # One atom because they are one authority — every tool here reads a corpus Haku can already reach
  # (it has a haku-state clone, and `read_session_frames`/`session_outcome`/`get_worker_provisioning`
  # span the sessions in its
  # read scope), so this adds discoverability rather than reachability. `session_outcome` is a
  # side-effect-free read of the worker session Haku already opened through `dispatch_worker`, so it
  # is pass-through here exactly like the other conversation reads. Both cross rooms and sessions but
  # are fenced identically per conversation by the profile-DAG read scope over `can_read_profiles`
  # (haku/recall_index/README.md § Read scoping).
  - id: haku_recall_reads
    type: exact_tools
    tools:
      haku_conversations:
        - list_sessions
        - list_turns
        - read_conversation_items
        - read_session_frames
        - session_outcome
      workers:
        - get_worker_provisioning
      haku_index:
        - search
        - index_status
  - id: haku_v1
    type: any_of
    policies:
      - haku_recall_reads
      - gmail_reads
      - google_calendar_reads
      - grocy_reads
      - github_reads
      - github_identity_reads
      - tana_safe_tools
      - postscanmail_reads
      - home_assistant_reads
      - home_assistant_desk_light_control
      - haku_sandbox_control
      - managed_gmail_labels
      - kubernetes_reads
      - grants_self_introspection
      - grants_own_revoke
  - id: manual_review
    type: never
# Access profiles, not credential bindings, own durable Agent authority. A static bearer and a
# DCR/OAuth binding assigned to `haku` therefore resolve the same policy/capability bundle.
access_profiles:
  - id: haku
    auto_approval_policy: haku_v1
    allowed_harnesses:
      - claude_code
    can_read_profiles:
      - public-coder
    recall_index_ids:
      - haku-state
      - haku-conversations
      - ducktape-public
    # This is server authorization, not a Recall-index grant and not an auto-approval rule.
    # The configured Claude runtime's static Haku Agent is assigned this profile.
    in_process_server_ids:
      - haku_conversations
      - grants
      - sandbox
      # Haku is the orchestrator that fans subtasks onto workers (#5193). `dispatch_worker` stays
      # operator-approved per call; this only lets Haku reach the server to ask.
      - workers
      - haku_session_sandboxes
  - id: public-coder
    auto_approval_policy: public_coder_safe_reads
    allowed_harnesses:
      - codex_app_server
    can_read_profiles: []
    recall_index_ids:
      - ducktape-public
    in_process_server_ids:
      - grants
      - haku_index
      - haku_session_sandboxes
  - id: manual-review
    auto_approval_policy: manual_review
    allowed_harnesses: []
    can_read_profiles: []
    # Even the fallback profile may ASK for a grant: every `grants` call queues for the operator,
    # and create_grant is never auto-approvable (operator ruling on #4986; pinned in
    # //cluster/validation:test_haku_deployment_config_contract). Consolidating onto one `grants` server (#4918) means
    # this profile may now also ASK for a kubernetes grant, not only HTTP egress — still manual-only.
    in_process_server_ids:
      - grants
default_access_profile_id: manual-review
# Evaluate configured Kubernetes access as a synthetic, non-login access-profile identity. The
# username satisfies Console's explicit SAR subject schema; RBAC grants the same deploy-owned group.
# `system:authenticated` preserves Kubernetes's standard authenticated discovery surface after
# Console has authenticated the Agent bearer. None of these values is caller-supplied request data.
# Agent requests execute through the separate haku-kube-api-proxy identity.
kubernetes_authorization:
  subjects_by_access_profile:
    haku:
      username: haku:access-profile:haku
      groups:
        - haku:access-profile:haku
        - system:authenticated
    public-coder:
      username: haku:access-profile:public-coder
      groups:
        - haku:access-profile:public-coder
        - system:authenticated
# One or more temporary grants begin only when an approved create_grant call executes. Every item
# in that call shares one start and expiry. This deploy-owned bound is authoritative even if a
# client constructs a wider duration than the tool schema recommends.
kubernetes_grant_max_lifetime_seconds: 3600
# The colocated egress fence's decision endpoint (#4670, #4942). Absent keeps it fail-closed (503)
# and the proxy denying; wiring it here turns on Console-authorized egress. Secret values stay in
# env references (haku/console/deployment.yaml); handles, placeholders, match headers and
# prohibited CIDRs are inert and committable by design.
egress_decide:
  # The shared-fence bearer the colocated sidecar presents in Authorization on every localhost
  # decide call. It authenticates the sidecar only and carries no Agent identity. Every data-plane
  # request must also present a live per-session bridge bearer, which is the sole source of
  # Agent/session attribution.
  # Console-owned egress credential registry (#4951): a grant redeems a credential by naming its
  # handle, and the endpoint returns the placeholder->value substitution only for its `principal`
  # at an origin in `origins`. First entry: the bot GitHub token (mirrors the retiring
  # iron fence's substitution). The sandbox only ever holds `github-token-placeholder`.
  credentials:
    github_bot:
      handle: github-bot
      placeholder: github-token-placeholder
      match_headers: [authorization]
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: https
          host: api.github.com
          port: 443
        - scheme: https
          host: github.com
          port: 443
        - scheme: https
          host: codeload.github.com
          port: 443
    # The Console-launched Claude runner's LiteLLM virtual key: Claude Code's inference reaches the
    # in-cluster LiteLLM gateway (-> CLIProxyAPI, anthropic-max20/ant-messages/* Claude-subscription models)
    # through the fence, which swaps this placeholder for the real haku-console-claude key on the
    # LiteLLM origin only. The runner holds only the inert placeholder. Value reflected from the
    # litellm-keys-tf Terraform mint (deployment.yaml env). Origin is plain http:4000, internal.
    claude_litellm:
      handle: claude-litellm
      placeholder: proxy-litellm-haku-console-claude-placeholder
      match_headers: [authorization]
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: http
          host: litellm.litellm.svc.cluster.local
          port: 4000
    # End-to-end substitution smoke test (haku/egress/docs/test_substitution.md): both sides of
    # this swap are committed EXAMPLE- literals — the placeholder here and the deployment's
    # literal HAKU_EGRESS_CREDENTIAL_SUBSTITUTION_SMOKE value — so watching the swap arrive at
    # the public echo host exercises the whole decide→substitute path with no secret anywhere.
    substitution_smoke:
      handle: substitution-smoke
      placeholder: EXAMPLE-EGRESS-SMOKE-PLACEHOLDER
      match_headers: [authorization]
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: https
          host: postman-echo.com
          port: 443
    # The Console-launched Codex runner's egress credentials are held by this colocated fence
    # (#4670), authored against the public-coder Agent. The live bridge bearer selects that Agent
    # at request time; the sidecar's shared-fence credential authenticates the fence only. The
    # sandbox only ever holds the inert placeholder plus its session bearer.
    #   The public-coder LiteLLM virtual key, substituted only on the internal LiteLLM model gateway;
    #   its configuration grant carries allow_prohibited_address because the gateway is a cluster ClusterIP.
    codex_litellm:
      handle: codex-litellm
      placeholder: proxy-litellm-public-coder-placeholder
      match_headers: [authorization]
      principal: { kind: agent, agent_id: 43a833f3-2b1c-4a04-9b8c-1df0cedfb79e }
      origins:
        - scheme: http
          host: litellm.litellm.svc.cluster.local
          port: 4000
    #   Codex's GitHub access is the same agentydragon-agent PAT as `github-bot`, presented under a
    #   different inert placeholder (the Codex sandbox holds proxy-github-placeholder). A second
    #   presentation of one credential is a second entry whose nested `value` setting receives the
    #   same Secret under its own handle and placeholder (decide_config.EgressCredentialEntry).
    codex_github_bot:
      handle: codex-github-bot
      placeholder: proxy-github-placeholder
      match_headers: [authorization]
      principal: { kind: agent, agent_id: 43a833f3-2b1c-4a04-9b8c-1df0cedfb79e }
      origins:
        - scheme: https
          host: api.github.com
          port: 443
        - scheme: https
          host: github.com
          port: 443
        - scheme: https
          host: codeload.github.com
          port: 443
    # The haku Forgejo credential (the existing haku-forgejo-git Secret — the full haku Forgejo user)
    # substituted into the haku Agent's Forgejo egress (git-over-HTTP + REST API), reachable at the
    # internal forgejo-http.forgejo service and the public git.allegedly.works. The sandbox only ever
    # holds `haku-forgejo-token-placeholder`.
    haku_forgejo_token:
      handle: haku-forgejo-token
      placeholder: haku-forgejo-token-placeholder
      match_headers: [authorization]
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: http
          host: forgejo-http.forgejo
          port: 3000
        - scheme: http
          host: forgejo-http.forgejo.svc.cluster.local
          port: 3000
        - scheme: https
          host: git.allegedly.works
          port: 443
    # Read-only ActivityWatch access for Haku's time-use queries. The sandbox carries only this
    # inert bearer placeholder in AW_READ_TOKEN; the Console resolves the reflected Secret and
    # substitutes it only at the exact read origin. The route itself enforces the same GET plus
    # query-POST read-only boundary, so this credential cannot be used for writes.
    activitywatch_read_token:
      handle: activitywatch-read-token
      placeholder: activitywatch-read-token-placeholder
      match_headers: [authorization]
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: https
          host: activitywatch-read.allegedly.works
          port: 443
  # Configuration-file HTTP grants (#4941), evaluated before database grants; admissions carry
  # `config_file:<id>` provenance.
  grants:
    # The reachability half of the substitution smoke test — exactly GET /headers at the public
    # echo host, redeeming the inert credential above.
    - id: substitution-smoke
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: https
          host: postman-echo.com
          port: 443
      coverage:
        methods: [GET]
        path_regex: /headers
      credential_handle: substitution-smoke
    # The GitHub egress path was validated in PR #5223, merged August 30, 2026. These haku-scoped
    # entries remain for the separate iron-proxy exercise; moving that workload onto this colocated
    # fence still requires a live bridge bearer for the intended Agent.
    # Coverage: the GitHub API and git-over-HTTPS smart-HTTP endpoints, redeeming the bot
    # credential at both — Bearer on the API, Basic (decoded/swapped/re-encoded proxy-side) on
    # github.com. No path pin: git smart HTTP needs /info/refs?service=git-upload-pack through to
    # the pack endpoints. codeload.github.com is deliberately not configured — the registry can
    # redeem there, but reaching it takes a temporary grant.
    - id: haku-github-api
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: https
          host: api.github.com
          port: 443
      coverage:
        methods: [DELETE, GET, HEAD, PATCH, POST, PUT]
      credential_handle: github-bot
    - id: haku-github-git
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: https
          host: github.com
          port: 443
      coverage:
        methods: [GET, POST]
      credential_handle: github-bot
    # The Console-launched Claude runner's model access: its inference reaches the in-cluster LiteLLM
    # gateway (-> CLIProxyAPI). LiteLLM resolves to a ClusterIP, so this entry carries
    # allow_prohibited_address (#5073) to lift the decide oracle's private-address denial for THIS
    # origin only — exactly as codex-litellm below does for the Codex runner. GET+POST: Claude Code
    # POSTs /v1/messages and (with gateway discovery) GETs /v1/models. Redeems the LiteLLM key.
    - id: haku-claude-litellm
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: http
          host: litellm.litellm.svc.cluster.local
          port: 4000
      coverage:
        methods: [GET, POST]
      credential_handle: claude-litellm
      allow_prohibited_address: true
    # The Console-launched Claude runner reached these under the iron fence; keep them configured so it
    # keeps the same reach (archive/tarball downloads via codeload; git clone / raw-file / release
    # redirects on the githubusercontent CDN, which serve pre-signed URLs and carry NO credential).
    # Distinct from the codex- GitHub entries below only in credential (github-bot vs codex-github-bot):
    # each runtime's live bridge bearer resolves to its own Agent, so the proxy is handed only the
    # credentials for that Agent.
    - id: haku-github-codeload
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: https
          host: codeload.github.com
          port: 443
      coverage:
        methods: [GET, HEAD]
      credential_handle: github-bot
    - id: haku-githubusercontent
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: https
          host: objects.githubusercontent.com
          port: 443
        - scheme: https
          host: raw.githubusercontent.com
          port: 443
        - scheme: https
          host: release-assets.githubusercontent.com
          port: 443
      coverage:
        methods: [GET, HEAD]
    # The Console-launched Codex runner's configured reachability. codex- ids keep these distinct
    # from the haku- GitHub entries above: each live bridge bearer resolves to one Agent, so a
    # request matches only that Agent's entries and receives only those credentials.
    #   The internal LiteLLM model gateway is Codex's model access. allow_prohibited_address admits
    #   its cluster-internal resolution (litellm.litellm.svc → a ClusterIP inside prohibited_cidrs),
    #   scoped to this exact origin — unrestricted methods, matching the host-only substitution
    #   contract so a denied method is never a broken model turn.
    - id: codex-litellm
      principal: { kind: agent, agent_id: 43a833f3-2b1c-4a04-9b8c-1df0cedfb79e }
      origins:
        - scheme: http
          host: litellm.litellm.svc.cluster.local
          port: 4000
      coverage:
        methods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
      credential_handle: codex-litellm
      allow_prohibited_address: true
    - id: codex-github-api
      principal: { kind: agent, agent_id: 43a833f3-2b1c-4a04-9b8c-1df0cedfb79e }
      origins:
        - scheme: https
          host: api.github.com
          port: 443
      coverage:
        methods: [DELETE, GET, HEAD, PATCH, POST, PUT]
      credential_handle: codex-github-bot
    - id: codex-github-git
      principal: { kind: agent, agent_id: 43a833f3-2b1c-4a04-9b8c-1df0cedfb79e }
      origins:
        - scheme: https
          host: github.com
          port: 443
      coverage:
        methods: [GET, POST]
      credential_handle: codex-github-bot
    #   Archive/tarball downloads a git clone redirects to; reached freely under iron, so configured.
    - id: codex-github-codeload
      principal: { kind: agent, agent_id: 43a833f3-2b1c-4a04-9b8c-1df0cedfb79e }
      origins:
        - scheme: https
          host: codeload.github.com
          port: 443
      coverage:
        methods: [GET, HEAD]
      credential_handle: codex-github-bot
    #   githubusercontent CDN (pre-signed URLs) — pure reachability, no credential, matching iron.
    - id: codex-githubusercontent
      principal: { kind: agent, agent_id: 43a833f3-2b1c-4a04-9b8c-1df0cedfb79e }
      origins:
        - scheme: https
          host: objects.githubusercontent.com
          port: 443
        - scheme: https
          host: raw.githubusercontent.com
          port: 443
        - scheme: https
          host: release-assets.githubusercontent.com
          port: 443
      coverage:
        methods: [GET, HEAD]
    # GitHub Actions job-log and artifact downloads: the api.github.com log/artifact endpoints 302
    # to a numbered fleet of GitHub-owned Azure storage accounts with a SAS token in the URL, so
    # this is pure reachability — no credential redeems here. The fleet hostname is not constant,
    # hence the host-pattern origin (a configuration-only capability; Agent-requestable grants stay
    # exact-origin). Pattern deliberately pins the full account-name shape, never a bare
    # blob.core.windows.net suffix any Azure tenant can register under.
    - id: codex-actions-results
      principal: { kind: agent, agent_id: 43a833f3-2b1c-4a04-9b8c-1df0cedfb79e }
      origin_patterns:
        - scheme: https
          host_pattern: productionresults[a-z0-9]*\.blob\.core\.windows\.net
          port: 443
      coverage:
        methods: [GET]
        path_regex: /actions-results/.*
    # The haku Agent's in-cluster + public Forgejo egress (git-over-HTTP + the REST API), redeeming
    # the `haku-forgejo-token` credential. allow_prohibited_address lifts the private-address denial
    # for the internal http origins (#5073, as the *-litellm entries do); it is a no-op for the
    # public host.
    - id: haku-forgejo
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: http
          host: forgejo-http.forgejo
          port: 3000
        - scheme: http
          host: forgejo-http.forgejo.svc.cluster.local
          port: 3000
        - scheme: https
          host: git.allegedly.works
          port: 443
      coverage:
        methods: [DELETE, GET, HEAD, PATCH, POST, PUT]
      credential_handle: haku-forgejo-token
      allow_prohibited_address: true
    # ActivityWatch's bearer-proxy allows all GET reads, plus POST only for the large query body.
    # Keep those as separate grants so the POST path can never widen to another write endpoint.
    - id: haku-activitywatch-read
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: https
          host: activitywatch-read.allegedly.works
          port: 443
      coverage:
        methods: [GET]
      credential_handle: activitywatch-read-token
    - id: haku-activitywatch-query
      principal: { kind: agent, agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2 }
      origins:
        - scheme: https
          host: activitywatch-read.allegedly.works
          port: 443
      coverage:
        methods: [POST]
        path_regex: /api/0/query/.*
      credential_handle: activitywatch-read-token
  # Cluster pod + service CIDRs, denied in resolved answers on top of the always-prohibited classes
  # (loopback, link-local, multicast, private/RFC1918/ULA — which already cover 10/8). Named per the
  # field's contract so the internal boundary is legible and survives a re-IP off 10/8.
  prohibited_cidrs: [10.42.0.0/16, 10.244.0.0/16]
#
# The one Agent Sandbox environment the `sandbox` server hands out: the Haku pool in
# cluster/k8s/haku/workspaces/ and the reviewed bootstrap each claim runs. Each claim records the
# pod-describing fields it was created for, so editing one of those leaves live claims usable and
# flags them in `warnings`; the budgets below are read live and are never recorded
# (haku/sandbox/README.md).
agent_sandbox:
  sandbox:
    namespace: haku-sandbox
    warm_pool: haku
    container: workspace
    default_cwd: /workspace/haku-state
    # initial_ttl must exceed provisioning_timeout + bootstrap.timeout; exec
    # extension must be >= max_exec_timeout (validated at startup).
    initial_ttl_seconds: 28800
    exec_ttl_extension_seconds: 7200
    provisioning_timeout_seconds: 600
    max_exec_timeout_seconds: 300
    max_output_bytes: 100000
  bootstrap:
    cwd: /workspace
    timeout_seconds: 300
    # The reviewed per-claim bootstrap is one baked script — egress CA trust, git identity,
    # git credentials, and the haku-state checkout — kept in its native file
    # (cluster/k8s/haku/workspaces/image/haku-sandbox-setup.sh) rather than inlined here, so
    # shfmt/shellcheck lint it. Read that file for what each step does and why. Changing
    # bootstrap behavior therefore means an image rebuild + rollout, not a ConfigMap edit.
    script: |
      set -euo pipefail
      /usr/local/bin/haku-sandbox-setup.sh
#
# Static machine Agents: each has a fixed durable Agent UUID, globally reserved display name, and
# bearer bound to one Operator. The bearer and controller-fed Authentik user id are secret leaves,
# omitted here and overlaid directly through `HAKU_CONSOLE__STATIC_AGENTS__<slot>__{TOKEN,
# OPERATOR_SUBJECT}`. The externally stable operator subject is a startup-only Authentik
# `sub`/user_id seed; the app immediately resolves it to a canonical Operator UUID and never uses
# it as live request authority.
static_agents:
  haku:
    agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2
    display_name: Haku
    access_profile_id: haku
  public_coder:
    agent_id: 43a833f3-2b1c-4a04-9b8c-1df0cedfb79e
    display_name: public-coder-agent
    # Coder may read the explicitly named Ducktape and Gaffer repositories without interrupting
    # the Operator. Everything else remains approval-wrapped, and Coder cannot approve its own
    # requests.
    access_profile_id: public-coder
# Prompts belong to Agents (#4431 stage 6): each launchable Agent names its identity template,
# mounted from this same ConfigMap. A template `{% include %}`s siblings from the same directory —
# that is how the shared conversation_prompt_fragment.md.j2 rides along without being a config key. Haku's
# identity and what only Haku is told stay in its template; the craft it authors for itself lives
# in haku-state, which it can write and these it cannot.
launchable_agents:
  - agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2
    system_prompt_template: /etc/haku-console/config/haku_system_prompt.md.j2
  - agent_id: 43a833f3-2b1c-4a04-9b8c-1df0cedfb79e
    system_prompt_template: /etc/haku-console/config/public_coder_system_prompt.md.j2
# Matrix invites/messages have no harness selector. This explicit route applies only when the
# adapter creates a conversation for a new room; existing conversations retain their own kind.
matrix_launch:
  default_agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2
  default_harness_kind: claude_code
operator_connection_providers:
  google_mail:
    kind: google
  google_calendar:
    kind: google
operator_connections:
  google_mail:
    display_name: Google Mail
    provider: google_mail
    scopes:
      - https://www.googleapis.com/auth/gmail.modify
      - https://www.googleapis.com/auth/gmail.compose
      - https://www.googleapis.com/auth/gmail.settings.basic
  google_calendar:
    display_name: Google Calendar
    provider: google_calendar
    scopes:
      - https://www.googleapis.com/auth/calendar.events
mcp:
  servers:
    # The root endpoint exposes GitHub's normal default toolsets, including writes. Haku receives
    # transparent access only to the explicit github_reads policy above; every other tool stays in
    # the Console's per-call operator approval queue; tools in agent_tool_denylist are unavailable
    # to Agents entirely.
    github:
      id: github
      # GitHub's hosted MCP catalog is expensive to reflect and changes infrequently. Keep the
      # shared 60-second default for other servers, but refresh GitHub at most every 15 minutes.
      catalog_refresh_interval_seconds: 900
      # GitHub Copilot delegation mutates repositories and creates external Agent jobs; keep it
      # unavailable to every Haku Agent even when a client retains an older tool schema.
      agent_tool_denylist:
        - assign_copilot_to_issue
        - create_pull_request_with_copilot
        - get_copilot_job_status
        - request_copilot_review
      backend:
        kind: remote_mcp
        url: https://api.githubcopilot.com/mcp/
        # Actions is not in GitHub MCP's default toolsets. Keep the default catalog and add its
        # read/write Actions catalog; policy still decides which calls receive standing authority.
        headers:
          X-MCP-Toolsets: default,actions
        auth:
          kind: remote_server_oauth
          # Scopes deliberately omitted (NOT `scopes: []`, which sends an explicit
          # *empty*-scope OAuth request per mcp/operator_oauth.py's `oauth.scopes is not
          # None` check -- that was this line's actual effect, confirmed 2026-08-18).
          # Omitting the field makes the flow ask GitHub's server for its own default,
          # which per github-mcp-server's docs is "the full supported set." The real
          # permission boundary is (1) whichever scopes the OAuth App is configured to
          # allow on GitHub's own side (fenced there, operator, 2026-08-18) and (2)
          # haku-console's own approval policy: github_reads auto-approves reads, every
          # write stays in the per-call operator approval queue.
          client_registration:
            kind: preregistered
            token_endpoint_auth_method: client_secret_post
    grocy_sf:
      id: grocy-sf
      backend:
        kind: remote_mcp
        url: https://grocy-mcp-sf.allegedly.works/mcp
        auth:
          kind: remote_server_oauth
          client_registration:
            kind: dynamic
            client_name: Haku Console
    tana_rw:
      id: tana-rw
      backend:
        kind: remote_mcp
        # Haku Console authenticates directly with the account PAT. The credential lives only in
        # haku-console; inner Haku agents receive proxied tool schemas/results, never the PAT.
        url: http://tana-mcp.tana-mcp.svc.cluster.local:8263/mcp
        auth:
          kind: static_bearer
    # `sandbox` (haku/console/tools/sandbox.py): claim a warm Haku sandbox from the `agent_sandbox`
    # pool above, bootstrap it, run bounded bash via pods/exec, dispose it. Credential-free —
    # Console's own ServiceAccount holds the claim/exec RBAC (cluster/k8s/haku/workspaces/app/
    # haku-console-sandbox-role.yaml), so there is no bearer to reflect and no second process to
    # keep alive. By operator directive the whole named surface in `haku_sandbox_control`
    # auto-approves so Haku drives its own box tap-free — exec_sandbox = arbitrary bash, but
    # ≈ the direct `kubectl exec` Haku's SA can already run in haku-sandbox, and dispose_sandbox
    # only releases the ephemeral claim Haku itself created (re-clonable checkout, rebuildable
    # cache). The `haku_sandbox_control` exact-tools policy above records that reviewed authority;
    # `in_process_server_ids` on the profile is what grants access to the server at all.
    sandbox:
      id: sandbox
      backend:
        kind: in_process
        credential:
          kind: none
    # Multi-agent v0 (#5193/#5194): `dispatch_worker` opens a hosted worker session for a launchable
    # Agent on a harness — reusing the same createConversation launch + session/sandbox allocation the
    # operator-initiated flow uses — seeds the opening prompt, and returns its session id immediately.
    # The worker runs under its OWN Agent perimeter (its grants + fence identity), not the caller's;
    # dispatch never widens its reach. Credential-free (Console's own session runtime). `dispatch_worker`
    # is in NO auto-approval policy, so every spawn queues for the operator, exactly like `create_grant`.
    # Granted to the `haku` orchestrator profile below; the intended first worker is public-coder/codex.
    workers:
      id: workers
      backend:
        kind: in_process
        credential:
          kind: none
    # The Console-launched session inventory is a separate lifecycle from the Agent Sandbox
    # workbox server above. Its terminate tool remains explicitly approval-gated: no
    # auto-approval policy names this server.
    haku_session_sandboxes:
      id: haku_session_sandboxes
      backend:
        kind: in_process
        credential:
          kind: none
    # One server fronting every temporary-grant domain (#4918): create/list/get/release/revoke over
    # the shared #4889 envelope, each payload tagged with its `domain` (kubernetes | http), plus the
    # kubernetes SAR check `kubernetes_can_i` (side-effect-free). HTTP egress grants (#4670; first
    # exercised by the #4943 spike) are evaluated by the egress decide endpoint after configuration-file
    # policy; kubernetes grants are RBAC-like scope/rule coverage. Both ledgers are Console's own
    # Postgres — credential-free. Exposed to EVERY access profile (operator ruling on #4986): any
    # Agent may ask. `create_grant` is deliberately in NO auto-approval policy: grant creation
    # requires a manually approved source ToolCall (an auto-approved call cannot mint a grant).
    # `revoke_grants` auto-approves for an Agent — which relinquishes only its own grants, a
    # narrowing self-service operation (`grants_own_revoke`) — and the reads auto-approve per their
    # atoms (`kubernetes_can_i`/`get_grant` via `kubernetes_reads`, own-scoped `list_grants` via
    # `grants_own_list`, `whoami` via `grants_whoami`).
    grants:
      id: grants
      backend:
        kind: in_process
        credential:
          kind: none
    # postscanmail-mcp (x/postscanmail_mcp_server): the PostScan Mail Developer API behind the
    # shared mcp-oauth-facade OIDCProxy — same facade shape as tana-mcp-facade, so
    # haku-console reaches it via operator OAuth (DCR against the facade's own OAuth surface,
    # using dynamic client registration). Restricted to agentydragon by the facade's Authentik group policy
    # (tf/gitops/agent-machine-access/postscanmail-mcp.tf). Reads (list_items,
    # list_automation_rules) auto-approve for the agent; every mutating/paid/destructive action
    # (set_automation_rule, request_*/cancel_* — open & rescan are paid, discard & shred remove
    # mail) queues for operator approval — see `postscanmail_reads` above. Reached via the
    # public hostname like the other remote facades; no Terraform or NetworkPolicy change.
    postscanmail_mcp:
      id: postscanmail-mcp
      backend:
        kind: remote_mcp
        url: https://postscanmail-mcp.allegedly.works/mcp
        auth:
          kind: remote_server_oauth
          client_registration:
            kind: dynamic
            client_name: Haku Console
    # Writable Home Assistant management through homeassistant-ai/ha-mcp. The upstream Home
    # Assistant token remains in the ha-mcp pod; haku-console authenticates with a static bearer
    # reflected from ha-mcp/ha-mcp-bearer, exactly like tana-rw. Read tools
    # auto-approve (the readOnlyHint subset, minus ha_report_issue — see `home_assistant_reads`
    # above); every state-changing/control tool stays operator-gated. Schemas exercised 2026-07-20.
    #
    # A static bearer rather than operator OAuth: Haku is the only consumer and ha-mcp is our own
    # in-cluster service, so there is no consent boundary OAuth would buy.
    home_assistant:
      id: home-assistant
      backend:
        kind: remote_mcp
        url: http://ha-mcp.ha-mcp.svc.cluster.local:8765/mcp
        auth:
          kind: static_bearer
    # osmmcp (github.com/NERVsystems/osmmcp): geocoding via Nominatim, routing via OSRM,
    # place lookup via Overpass — all public, anonymous, read-only APIs. No secret, no
    # per-operator identity, so unlike every other remote server here it isn't
    # OAuth-fronted: reachable only from haku-console's own namespace via
    # CiliumNetworkPolicy (cluster/k8s/agents/osm-mcp/), not a public HTTPRoute.
    #
    # Unwired for now (operator, 2026-07-19): not yet tested properly and possibly clunky —
    # first live use found routing `mode` is a no-op (the public OSRM demo serves only the
    # car profile; the URL's profile segment is decorative), so foot/bike distances and
    # durations are silently car values, and route geometry is returned as a path on the
    # SERVER pod's own /tmp (osmmcp is local-first). Findings + interim recipes:
    # haku-state memory/improvements/geocoding-geo-search-api.md. Re-enable by
    # uncommenting once routing has a properly profiled backend and a real test pass
    # (the deployment and its NetworkPolicy stay up; add an explicit exact-tools atom when
    # reconnecting it).
    # - id: osm
    #   backend:
    #     kind: remote_mcp
    #     url: http://osm-mcp.osm-mcp.svc.cluster.local:7082/mcp
    #     auth:
    #       kind: none
    # kubectl-passthrough-mcp forwards the approving operator's own OAuth token straight
    # to kube-apiserver (cluster_auth_mode=passthrough) — no group override, no scoped
    # credential of its own. RBAC is agentydragon's real cluster-admin binding
    # (oidc-ksbx-agentydragon-admin, cluster/k8s/agents/kubectl-passthrough-mcp/app/).
    # Every kubectl-shaped tool (pods_*, resources_*, nodes_*, events_list,
    # configuration_view — see cluster/k8s/agents/kubectl-passthrough-mcp/) runs with full
    # cluster-admin once approved; the approval click in trusted console chrome is the
    # only gate, by design — see haku/docs/security.md.
    kubectl_passthrough_mcp:
      id: kubectl-passthrough-mcp
      backend:
        kind: remote_mcp
        url: https://kubectl-passthrough-mcp.allegedly.works/mcp
        auth:
          kind: remote_server_oauth
          client_registration:
            kind: preregistered
            # Authentik has no open Dynamic Client Registration endpoint (kubernetes-mcp-server
            # just mirrors Authentik's own OAuth metadata, which omits registration_endpoint),
            # so DCR would 401 against the guessed {server}/register fallback. Use the
            # pre-registered public/PKCE client_id from the kubectl_passthrough_mcp Authentik
            # provider instead (tf/gitops/agent-machine-access/main.tf) — it already allows
            # multiple redirect URIs (CLI localhost, kubernetes-mcp-server's own callback, and
            # haku-console's operator-auth callback), safe to share since PKCE plus per-request
            # redirect_uri validation secure each caller independently.
            client_id: kubectl-passthrough-mcp
    # In-process FastMCP servers (haku/console/tools/*.py) attached via an in-memory transport,
    # not remote MCP servers. Calls default to manual approval;
    # reviewed policies may auto-approve exact calls (currently Gmail label operations).
    #
    # `gmail` + `google_calendar` execute as the acting Operator's own Google account. Each resolves
    # its own logical connection, Google OAuth application, and least-privilege grant from the
    # console's connection store, self-refreshed in-process. They are connected, stored, and
    # disconnected separately in the console's Access tab.
    #
    # `gmail`: reads mirror Gmail's REST API and return its resource shapes verbatim
    # (threads_list, threads_get, messages_get, labels_list, labels_get); writes are
    # drafts_create, threads_modify_labels, and label CRUD (labels_create, labels_patch,
    # labels_delete).
    gmail:
      id: gmail
      backend:
        kind: in_process
        credential:
          kind: operator_connection
          connection: google_mail
    # `google_calendar`: recurrence-aware get/list/instances reads + approval-gated create_event.
    google_calendar:
      id: google_calendar
      backend:
        kind: in_process
        credential:
          kind: operator_connection
          connection: google_calendar
    # `haku_index` (haku/console/tools/recall_index.py): semantic search over haku-state,
    # public Ducktape source, and Haku's own past conversations. Listing it here is what builds
    # the searcher, and the
    # console refuses to start unless an embedder is configured too (`HAKU_CONSOLE__EMBEDDER__*`,
    # Ollama) — search embeds its query. Keeping the corpora current is the role-flagged
    # haku-indexer Deployments (haku/console/indexer.py): one chunk Deployment per index below,
    # plus the shared embed drain. Each chunk pod mounts only its own index's slice of the
    # recall_indexes registry above (indexer-chunk-<index>-config.yaml, derivation-tested against
    # these entries) — the conversations corpus from the console's tables, haku-state through a
    # read-only mirror whose typed Git credentials are supplied to its dedicated chunk worker, and Ducktape from GitHub
    # without a credential. The embed role fills the shared vector queue those chunks land in.
    haku_index:
      id: haku_index
      backend:
        kind: in_process
        credential:
          kind: none
    # `haku_conversations` (haku/console/tools/conversations.py): read Haku's own past sessions
    # out of the console's rollout store, so a replacement session can consult what its
    # predecessor actually did instead of only the last few room messages. Read-only, and
    # credential-free — the corpus is the console's own database.
    haku_conversations:
      id: haku_conversations
      backend:
        kind: in_process
        credential:
          kind: none
    # `hostexec` (haku/console/tools/hostexec.py): run an approved shell command on an
    # operator machine (wyrm2/rugged/atlas) under the operator's OWN Authentik identity. There
    # is no standing credential: `operator_login_identity` makes each call resolve the acting
    # Operator's stored console-login token (captured via offline_access) and exchange it
    # (jwt-bearer) for a short-lived, single-use, per-host token that hostexecd verifies
    # against Authentik's JWKS. This catalog entry only selects the auth mode; the in-scope
    # hosts + their exec URLs / audiences are the top-level `hostexec:` block below. Every
    # call is manual-approval (no auto-approve policy). See haku/hostexec/README.md.
    hostexec:
      id: hostexec
      backend:
        kind: in_process
        credential:
          kind: operator_login_identity
# In-scope operator machines for the `hostexec` in-process server (catalog entry above). Non-secret
# deploy topology. Each host maps to an outbound daemon identity; no node listener or address is
# configured in the console.
# `audience_client_id` is the Authentik `hostexec-<host>` provider the operator's token is exchanged
# for (tf/gitops/agent-machine-access/hostexec.tf).
hostexec:
  hosts:
    wyrm2:
      daemon_id: wyrm2
      audience_client_id: hostexec-wyrm2
    rugged:
      daemon_id: rugged
      audience_client_id: hostexec-rugged
    # atlas: Proxmox VE (Debian), not NixOS — hostexecd is installed by the ansible/roles/hostexecd
    # role (ansible/atlas.yaml) rather than nix/nixos/modules/hostexecd.nix.
    atlas:
      daemon_id: atlas
      audience_client_id: hostexec-atlas
node_daemons:
  daemons:
    wyrm2:
      display_name: wyrm2
      backends: [hostexec]
    rugged:
      display_name: rugged
      backends: [hostexec]
    atlas:
      display_name: atlas
      backends: [hostexec]
