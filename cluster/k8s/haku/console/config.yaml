# Non-secret haku-console config. Secret values stay in env/Kubernetes Secrets.
#
# Static machine Agents: each has a fixed durable Agent UUID, globally reserved display name, and
# bearer bound to one Operator. The bearer and controller-fed Authentik user id are named env vars,
# not literals — values live in the haku-console-agent / haku-console-oidc Secrets.
# The externally stable `operator_subject_env` label names a startup-only Authentik `sub`/user_id
# seed; the app immediately resolves it to a canonical Operator UUID and never uses it as live
# request authority.
static_agents:
  - agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2
    display_name: Haku
    token_env_var: HAKU_CONSOLE_AGENT_HAKU_TOKEN
    operator_subject_env: HAKU_CONSOLE_AGENT_HAKU_OPERATOR
mcp:
  servers:
    - id: grocy-sf
      server_url: https://grocy-mcp-sf.allegedly.works/mcp
      auth:
        kind: remote_server_oauth
        client_name: Haku Console
    - id: tana-rw
      server_url: https://tana-mcp-facade.allegedly.works/mcp
      auth:
        kind: remote_server_oauth
        client_name: Haku Console
    # kubectl-passthrough-mcp forwards the approving operator's own OAuth token straight
    # to kube-apiserver (cluster_auth_mode=passthrough) — no group override, no scoped
    # credential of its own. RBAC is agentydragon's real cluster-admin binding
    # (oidc-ksbx-agentydragon-admin, cluster/k8s/agents/kubectl-passthrough-mcp/app/).
    # Every kubectl-shaped tool (pods_*, resources_*, nodes_*, events_list,
    # configuration_view — see cluster/k8s/agents/kubectl-passthrough-mcp/) runs with full
    # cluster-admin once approved; the approval click in trusted console chrome is the
    # only gate, by design — see haku/docs/security.md.
    - id: kubectl-passthrough-mcp
      server_url: https://kubectl-passthrough-mcp.allegedly.works/mcp
      auth:
        kind: remote_server_oauth
        client_name: Haku Console
        # Authentik has no open Dynamic Client Registration endpoint (kubernetes-mcp-server
        # just mirrors Authentik's own OAuth metadata, which omits registration_endpoint),
        # so DCR would 401 against the guessed {server}/register fallback. Use the
        # pre-registered public/PKCE client_id from the kubectl_passthrough_mcp Authentik
        # provider instead (tf/gitops/agent-machine-access/main.tf) — it already allows
        # multiple redirect URIs (CLI localhost, kubernetes-mcp-server's own callback, and
        # haku-console's operator-auth callback), safe to share since PKCE plus per-request
        # redirect_uri validation secure each caller independently.
        static_client_id: kubectl-passthrough-mcp
    # In-process FastMCP servers (haku/console/tools/*.py) attached via an in-memory transport,
    # not remote MCP servers — no server_url/operator_oauth. Calls default to manual approval;
    # reviewed policies may auto-approve exact calls (currently Gmail label operations).
    #
    # `gmail` + `google_calendar` execute as the acting Operator's own Google account:
    # `provider_connection: google` makes each call resolve that Operator's per-Operator Google
    # access token from the console's own connection store (haku/console/provider_connection.py),
    # self-refreshed in-process — replacing the Airlock-brokered haku_console_google token. The
    # Operator links Google once from the console's Access tab (calendar.events + gmail.modify +
    # gmail.compose + gmail.settings.basic + Google's read scopes). Until an Operator connects,
    # both servers are degraded.
    #
    # `gmail`: reads mirror Gmail's REST API and return its resource shapes verbatim
    # (threads_list, threads_get, messages_get, labels_list, labels_get); writes are
    # drafts_create, threads_modify_labels, and label CRUD (labels_create, labels_patch,
    # labels_delete).
    - id: gmail
      auth:
        kind: provider_connection
        provider: google
    # `google_calendar`: recurrence-aware get/list/instances reads + approval-gated create_event.
    - id: google_calendar
      auth:
        kind: provider_connection
        provider: google
    # `haku_routine` (haku/console/tools/routine.py): launch_routine fires the Haku claude-code-web
    # routine via the haku-routine-launch-token secret (HAKU_CONSOLE_LAUNCH_ROUTINE__*), not the
    # Google grant. Superseding the bespoke launch-routine capability tier. It carries its own
    # credential, so it needs no operator-resolved backend auth.
    - id: haku_routine
      auth:
        kind: none
    # `hostexec` (haku/console/tools/hostexec.py): run an approved shell command on an
    # operator machine (wyrm2/rugged) under the operator's OWN Authentik identity. There
    # is no standing credential: `operator_identity` makes each call resolve the acting
    # Operator's stored console-login token (captured via offline_access) and exchange it
    # (jwt-bearer) for a short-lived, single-use, per-host token that hostexecd verifies
    # against Authentik's JWKS. The in-scope hosts + their exec URLs / audiences come from
    # HAKU_CONSOLE_HOSTEXEC (deployment.yaml); this catalog entry only selects the auth
    # mode. Every call is manual-approval (no auto-approve policy). See haku/hostexec/PLAN.md.
    - id: hostexec
      auth:
        kind: operator_identity
