# Non-secret haku-console config. Secret values stay in env/Kubernetes Secrets.
#
# Console-owned Claude Agent Sandbox runtime. Every value is explicit deployment
# wiring; the application deliberately has no topology/path/proxy defaults. The
# placeholder is non-secret—the real OAuth bearer exists only in iron-proxy.
claude_runtime:
  namespace: haku-claude-sandbox
  warm_pool: haku-claude
  cwd: /workspace
  session_ttl_seconds: 7200
  oauth_placeholder: sk-ant-oat01-proxy-haku-claude-placeholder
  https_proxy: http://haku-claude-oauth-proxy.haku-egress-proxy.svc.cluster.local:8180
  ca_bundle: /egress-proxy-ca/ca-certificates.crt
  # forgejo-http.forgejo is spelled out because the bare service name does not end in `.svc`,
  # so the suffix entries above do not cover it — and a git fetch from the agent's own shell
  # would be routed at the OAuth proxy, which is FQDN-pinned to api.anthropic.com and would
  # drop it. The bootstrap itself is unaffected (it runs with pod env, which has no proxy).
  no_proxy: 127.0.0.1,localhost,.svc,.svc.cluster.local,kubernetes.default.svc,10.0.0.0/8,forgejo-http.forgejo,forgejo-http.forgejo.svc.cluster.local
  # Claude Code connects directly to Console's existing streamable-HTTP MCP endpoint using the
  # shared static Haku Agent below. The bearer is loaded from that Agent's existing env-backed
  # secret; this ConfigMap names only the endpoint and durable Agent identity.
  mcp_url: http://haku-console.haku-console.svc.cluster.local:9090/mcp
  mcp_static_agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2
  # Mounted from this same ConfigMap. Haku's identity and the Matrix harness contract;
  # the craft it authors for itself lives in haku-state, which it can write and this it cannot.
  system_prompt_template: /etc/haku-console/config/matrix_system_prompt.md.j2

# Auto-approval is an explicit per-Agent policy graph. Exact-tool atoms grant standing authority
# only to the named tools; newly reflected tools remain manual-approval by default. Conditional
# atoms remain typed code-owned evaluators. `haku_v1` preserves Haku's reviewed authority as of
# 2026-07-31; other Agents receive no auto-approval unless assigned a root policy below.
auto_approval_policies:
  - id: gmail_reads
    type: exact_tools
    tools:
      gmail:
        - threads_list
        - threads_get
        - messages_get
        - labels_list
        - labels_get
        - filters_list
        - filters_get
        - drafts_list
        - drafts_get
  - id: google_calendar_reads
    type: exact_tools
    tools:
      google_calendar:
        - get_event
        - list_events
        - list_event_instances
  - id: grocy_reads
    type: exact_tools
    tools:
      grocy-sf:
        - entities_get
        - entities_list
        - file_get
        - get_below_minimum_stock
        - get_current_user
        - get_db_changed_time
        - get_expired_stock
        - get_expiring_stock
        - get_product_stock
        - get_system_info
        - list_volatile_stock
        - locations_list
        - product_groups_list
        - products_list
        - quantity_units_list
        - shopping_list_get
        - shopping_lists_list
        - stock_entries_list
        - stock_get
  - id: tana_safe_tools
    type: exact_tools
    tools:
      tana-rw:
        - get_or_create_calendar_node
        - search_nodes
        - read_node
        - get_children
        - open_node
        - list_tags
        - list_workspaces
        - get_tag_schema
  - id: postscanmail_reads
    type: exact_tools
    tools:
      postscanmail-mcp:
        - list_items
        - list_automation_rules
  - id: home_assistant_reads
    type: exact_tools
    tools:
      home-assistant:
        - ha_config_get_automation
        - ha_config_get_calendar_events
        - ha_config_get_category
        - ha_config_get_label
        - ha_config_get_scene
        - ha_config_get_script
        - ha_config_list_dashboard_resources
        - ha_config_list_groups
        - ha_config_list_helpers
        # ha_eval_template is deliberately absent: evaluating arbitrary Jinja
        # inside Home Assistant is execution, not a read, so it does not belong
        # in standing authority. It stays available under operator approval.
        - ha_get_addon
        - ha_get_automation_traces
        - ha_get_blueprint
        - ha_get_camera_image
        - ha_get_device
        - ha_get_entity
        - ha_get_entity_exposure
        - ha_get_hacs_info
        - ha_get_history
        - ha_get_integration
        - ha_get_logs
        - ha_get_operation_status
        - ha_get_overview
        - ha_get_skill_guide
        - ha_get_state
        - ha_get_system_health
        - ha_get_todo
        - ha_get_zone
        - ha_list_floors_areas
        - ha_list_services
        - ha_search
  - id: haku_sandbox_control
    type: exact_tools
    tools:
      sandbox-mcp:
        - provision_sandbox
        - exec_sandbox
        - get_sandbox_info
        - list_sandboxes
        - dispose_sandbox
  - id: managed_gmail_labels
    type: gmail_label_namespace
    server: gmail
    label_prefix: haku/
  # Reading back what happened and what is written down: the rollout of a past session, and
  # semantic search over the same sessions plus haku-state. One atom because they are one
  # authority — every tool here reads a corpus Haku can already reach (it has a haku-state clone,
  # and `read_rollout` already spans every session), so search adds discoverability rather than
  # reachability. Worth knowing that both are unscoped across rooms and operators
  # (haku/state_index/README.md § Read scoping).
  - id: haku_recall_reads
    type: exact_tools
    tools:
      haku_conversations:
        - list_conversations
        - read_rollout
        - list_turns
      haku_index:
        - search
        - index_status
  - id: haku_v1
    type: any_of
    policies:
      - haku_recall_reads
      - gmail_reads
      - google_calendar_reads
      - grocy_reads
      - tana_safe_tools
      - postscanmail_reads
      - home_assistant_reads
      - haku_sandbox_control
      - managed_gmail_labels
  - id: manual_review
    type: never
#
# Static machine Agents: each has a fixed durable Agent UUID, globally reserved display name, and
# bearer bound to one Operator. The bearer and controller-fed Authentik user id are named env vars,
# not literals — values live in the haku-console-agent / haku-console-oidc Secrets.
# The externally stable `operator_subject_env` label names a startup-only Authentik `sub`/user_id
# seed; the app immediately resolves it to a canonical Operator UUID and never uses it as live
# request authority.
static_agents:
  - agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2
    display_name: Haku
    token_env_var: HAKU_CONSOLE_AGENT_HAKU_TOKEN
    operator_subject_env: HAKU_CONSOLE_AGENT_HAKU_OPERATOR
    auto_approval_policy: haku_v1
  - agent_id: 43a833f3-2b1c-4a04-9b8c-1df0cedfb79e
    display_name: public-coder-agent
    token_env_var: HAKU_CONSOLE_AGENT_PUBLIC_CODER_AGENT_TOKEN
    operator_subject_env: HAKU_CONSOLE_AGENT_PUBLIC_CODER_AGENT_OPERATOR
    # Coder may submit exact privileged calls for operator review, but receives no standing
    # authority: every tool remains approval-wrapped and Coder cannot approve its own requests.
    auto_approval_policy: manual_review
operator_connection_providers:
  google_mail:
    kind: google
    client_id_env_var: HAKU_CONSOLE_GOOGLE_MAIL_CLIENT_ID
    client_secret_env_var: HAKU_CONSOLE_GOOGLE_MAIL_CLIENT_SECRET
  google_calendar:
    kind: google
    client_id_env_var: HAKU_CONSOLE_GOOGLE_CALENDAR_CLIENT_ID
    client_secret_env_var: HAKU_CONSOLE_GOOGLE_CALENDAR_CLIENT_SECRET
operator_connections:
  google_mail:
    display_name: Google Mail
    provider: google_mail
    scopes:
      - https://www.googleapis.com/auth/gmail.modify
      - https://www.googleapis.com/auth/gmail.compose
      - https://www.googleapis.com/auth/gmail.settings.basic
  google_calendar:
    display_name: Google Calendar
    provider: google_calendar
    scopes:
      - https://www.googleapis.com/auth/calendar.events
mcp:
  servers:
    - id: grocy-sf
      backend:
        kind: remote_mcp
        url: https://grocy-mcp-sf.allegedly.works/mcp
        auth:
          kind: remote_server_oauth
          client_registration:
            kind: dynamic
            client_name: Haku Console
    - id: tana-rw
      backend:
        kind: remote_mcp
        # Haku Console authenticates directly with the account PAT. The credential lives only in
        # haku-console; inner Haku agents receive proxied tool schemas/results, never the PAT.
        url: http://tana-mcp.tana-mcp.svc.cluster.local:8263/mcp
        auth:
          kind: static_bearer
          bearer_token_secret: tana-account-pat
    - id: sandbox-mcp
      backend:
        kind: remote_mcp
        # Cluster-internal Haku sandbox provisioner (haku/sandbox_mcp). The static bearer lives
        # only in haku-console (reflected from haku-sandbox-mcp); inner Haku agents get proxied
        # provision/exec/dispose tool schemas + results, never the bearer. By operator directive,
        # the whole named surface in the `haku_sandbox_control` policy auto-approves so Haku
        # drives its own box tap-free — exec_sandbox = arbitrary bash, but ≈ the direct `kubectl
        # exec` Haku's SA can already run in haku-sandbox, and dispose_sandbox only releases the
        # ephemeral claim Haku itself created (re-clonable checkout, rebuildable cache). The
        # `haku_sandbox_control` exact-tools policy above records this reviewed authority.
        url: http://haku-sandbox-mcp.haku-sandbox-mcp.svc.cluster.local:8765/mcp
        auth:
          kind: static_bearer
          bearer_token_secret: sandbox-mcp-bearer
    # postscanmail-mcp (x/postscanmail_mcp_server): the PostScan Mail Developer API behind the
    # shared mcp-oauth-facade OIDCProxy — same facade shape as tana-mcp-facade, so
    # haku-console reaches it via operator OAuth (DCR against the facade's own OAuth surface,
    # using dynamic client registration). Restricted to agentydragon by the facade's Authentik group policy
    # (tf/gitops/agent-machine-access/postscanmail-mcp.tf). Reads (list_items,
    # list_automation_rules) auto-approve for the agent; every mutating/paid/destructive action
    # (set_automation_rule, request_*/cancel_* — open & rescan are paid, discard & shred remove
    # mail) queues for operator approval — see `postscanmail_reads` above. Reached via the
    # public hostname like the other remote facades; no Terraform or NetworkPolicy change.
    - id: postscanmail-mcp
      backend:
        kind: remote_mcp
        url: https://postscanmail-mcp.allegedly.works/mcp
        auth:
          kind: remote_server_oauth
          client_registration:
            kind: dynamic
            client_name: Haku Console
    # Writable Home Assistant management through homeassistant-ai/ha-mcp. The upstream Home
    # Assistant token remains in the ha-mcp pod; haku-console authenticates with a static bearer
    # reflected from ha-mcp/ha-mcp-bearer, exactly like tana-rw and sandbox-mcp. Read tools
    # auto-approve (the readOnlyHint subset, minus ha_report_issue — see `home_assistant_reads`
    # above); every state-changing/control tool stays operator-gated. Schemas exercised 2026-07-20.
    #
    # Was operator OAuth with dynamic client registration until 2026-08-09. That broke on
    # 2026-08-06: the facade's registration store went away and every refresh 404'd, so the
    # connection sat `degraded` with `attempts: 1, next_retry_at: null` — the console stops and
    # waits for the operator by design, so it never self-heals. Haku is the only consumer and
    # ha-mcp is our own in-cluster service, so there was no consent boundary OAuth was buying.
    - id: home-assistant
      backend:
        kind: remote_mcp
        url: http://ha-mcp.ha-mcp.svc.cluster.local:8765/mcp
        auth:
          kind: static_bearer
          bearer_token_secret: ha-mcp-bearer
    # osmmcp (github.com/NERVsystems/osmmcp): geocoding via Nominatim, routing via OSRM,
    # place lookup via Overpass — all public, anonymous, read-only APIs. No secret, no
    # per-operator identity, so unlike every other remote server here it isn't
    # OAuth-fronted: reachable only from haku-console's own namespace via
    # CiliumNetworkPolicy (cluster/k8s/agents/osm-mcp/), not a public HTTPRoute.
    #
    # Unwired for now (operator, 2026-07-19): not yet tested properly and possibly clunky —
    # first live use found routing `mode` is a no-op (the public OSRM demo serves only the
    # car profile; the URL's profile segment is decorative), so foot/bike distances and
    # durations are silently car values, and route geometry is returned as a path on the
    # SERVER pod's own /tmp (osmmcp is local-first). Findings + interim recipes:
    # haku-state memory/improvements/geocoding-geo-search-api.md. Re-enable by
    # uncommenting once routing has a properly profiled backend and a real test pass
    # (the deployment and its NetworkPolicy stay up; add an explicit exact-tools atom when
    # reconnecting it).
    # - id: osm
    #   backend:
    #     kind: remote_mcp
    #     url: http://osm-mcp.osm-mcp.svc.cluster.local:7082/mcp
    #     auth:
    #       kind: none
    # kubectl-passthrough-mcp forwards the approving operator's own OAuth token straight
    # to kube-apiserver (cluster_auth_mode=passthrough) — no group override, no scoped
    # credential of its own. RBAC is agentydragon's real cluster-admin binding
    # (oidc-ksbx-agentydragon-admin, cluster/k8s/agents/kubectl-passthrough-mcp/app/).
    # Every kubectl-shaped tool (pods_*, resources_*, nodes_*, events_list,
    # configuration_view — see cluster/k8s/agents/kubectl-passthrough-mcp/) runs with full
    # cluster-admin once approved; the approval click in trusted console chrome is the
    # only gate, by design — see haku/docs/security.md.
    - id: kubectl-passthrough-mcp
      backend:
        kind: remote_mcp
        url: https://kubectl-passthrough-mcp.allegedly.works/mcp
        auth:
          kind: remote_server_oauth
          client_registration:
            kind: preregistered
            # Authentik has no open Dynamic Client Registration endpoint (kubernetes-mcp-server
            # just mirrors Authentik's own OAuth metadata, which omits registration_endpoint),
            # so DCR would 401 against the guessed {server}/register fallback. Use the
            # pre-registered public/PKCE client_id from the kubectl_passthrough_mcp Authentik
            # provider instead (tf/gitops/agent-machine-access/main.tf) — it already allows
            # multiple redirect URIs (CLI localhost, kubernetes-mcp-server's own callback, and
            # haku-console's operator-auth callback), safe to share since PKCE plus per-request
            # redirect_uri validation secure each caller independently.
            client_id: kubectl-passthrough-mcp
    # In-process FastMCP servers (haku/console/tools/*.py) attached via an in-memory transport,
    # not remote MCP servers. Calls default to manual approval;
    # reviewed policies may auto-approve exact calls (currently Gmail label operations).
    #
    # `gmail` + `google_calendar` execute as the acting Operator's own Google account. Each resolves
    # its own logical connection, Google OAuth application, and least-privilege grant from the
    # console's connection store, self-refreshed in-process. They are connected, stored, and
    # disconnected separately in the console's Access tab.
    #
    # `gmail`: reads mirror Gmail's REST API and return its resource shapes verbatim
    # (threads_list, threads_get, messages_get, labels_list, labels_get); writes are
    # drafts_create, threads_modify_labels, and label CRUD (labels_create, labels_patch,
    # labels_delete).
    - id: gmail
      backend:
        kind: in_process
        credential:
          kind: operator_connection
          connection: google_mail
    # `google_calendar`: recurrence-aware get/list/instances reads + approval-gated create_event.
    - id: google_calendar
      backend:
        kind: in_process
        credential:
          kind: operator_connection
          connection: google_calendar
    # `haku_routine` (haku/console/tools/routine.py): launch_routine fires the Haku claude-code-web
    # routine via the haku-routine-launch-token secret (HAKU_CONSOLE_LAUNCH_ROUTINE__*), not the
    # Google grant. Superseding the bespoke launch-routine capability tier. It carries its own
    # credential, so it needs no operator-resolved backend auth.
    - id: haku_routine
      backend:
        kind: in_process
        credential:
          kind: none
    # `haku_index` (haku/console/tools/state_index.py): semantic search over haku-state's files
    # and Haku's own past conversations. Listing it here is what builds the searcher — and with
    # it loads the embedding model into the console process, since search embeds its query.
    # Read-only and credential-free: the corpus is the console's own database.
    - id: haku_index
      backend:
        kind: in_process
        credential:
          kind: none
    # `haku_conversations` (haku/console/tools/conversations.py): read Haku's own past sessions
    # out of the console's rollout store, so a replacement session can consult what its
    # predecessor actually did instead of only the last few room messages. Read-only, and
    # credential-free — the corpus is the console's own database.
    - id: haku_conversations
      backend:
        kind: in_process
        credential:
          kind: none
    # `hostexec` (haku/console/tools/hostexec.py): run an approved shell command on an
    # operator machine (wyrm2/rugged) under the operator's OWN Authentik identity. There
    # is no standing credential: `operator_login_identity` makes each call resolve the acting
    # Operator's stored console-login token (captured via offline_access) and exchange it
    # (jwt-bearer) for a short-lived, single-use, per-host token that hostexecd verifies
    # against Authentik's JWKS. This catalog entry only selects the auth mode; the in-scope
    # hosts + their exec URLs / audiences are the top-level `hostexec:` block below. Every
    # call is manual-approval (no auto-approve policy). See haku/hostexec/PLAN.md.
    - id: hostexec
      backend:
        kind: in_process
        credential:
          kind: operator_login_identity
# In-scope operator machines for the `hostexec` in-process server (catalog entry above). Non-secret
# deploy topology. Each host maps to an outbound daemon identity; no node listener or address is
# configured in the console.
# `audience_client_id` is the Authentik `hostexec-<host>` provider the operator's token is exchanged
# for (tf/gitops/agent-machine-access/hostexec.tf).
hostexec:
  hosts:
    wyrm2:
      daemon_id: wyrm2
      audience_client_id: hostexec-wyrm2
    rugged:
      daemon_id: rugged
      audience_client_id: hostexec-rugged
node_daemons:
  daemons:
    wyrm2:
      display_name: wyrm2
      token_env_var: HAKU_CONSOLE_NODE_DAEMON_WYRM2_TOKEN
      backends: [hostexec]
    rugged:
      display_name: rugged
      token_env_var: HAKU_CONSOLE_NODE_DAEMON_RUGGED_TOKEN
      backends: [hostexec]
