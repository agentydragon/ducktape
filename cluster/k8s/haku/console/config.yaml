# Non-secret haku-console config. Secret values stay in env/Kubernetes Secrets.
mcp:
  servers:
    - id: grocy-sf
      server_url: https://grocy-mcp-sf.allegedly.works/mcp
      operator_oauth:
        client_name: Haku Console
    - id: tana-rw
      server_url: https://tana-mcp-facade.allegedly.works/mcp
      operator_oauth:
        client_name: Haku Console
    # Implemented in-process (haku/console/tools/google.py) as a real FastMCP server
    # attached via an in-memory transport, not a remote MCP server — no server_url/
    # operator_oauth. Holds the Airlock-issued haku_console_google token
    # (calendar.events + gmail.modify + gmail.compose + google's read scopes) mounted
    # at HAKU_CONSOLE_GOOGLE_TOKEN_DIR. Tools: create_calendar_event,
    # batch_modify_gmail_thread_labels, create_gmail_draft.
    - id: google
