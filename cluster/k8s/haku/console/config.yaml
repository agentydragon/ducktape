# Non-secret haku-console config. Secret values stay in env/Kubernetes Secrets.
#
# Static machine Agents: each has a fixed durable Agent UUID, globally reserved display name, and
# bearer bound to one Operator. The bearer and controller-fed Authentik user id are named env vars,
# not literals — values live in the haku-console-agent / haku-console-oidc Secrets.
# The externally stable `operator_subject_env` label names a startup-only Authentik `sub`/user_id
# seed; the app immediately resolves it to a canonical Operator UUID and never uses it as live
# request authority.
static_agents:
  - agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2
    display_name: Haku
    token_env_var: HAKU_CONSOLE_AGENT_HAKU_TOKEN
    operator_subject_env: HAKU_CONSOLE_AGENT_HAKU_OPERATOR
operator_connection_providers:
  google_mail:
    kind: google
    client_id_env_var: HAKU_CONSOLE_GOOGLE_MAIL_CLIENT_ID
    client_secret_env_var: HAKU_CONSOLE_GOOGLE_MAIL_CLIENT_SECRET
  google_calendar:
    kind: google
    client_id_env_var: HAKU_CONSOLE_GOOGLE_CALENDAR_CLIENT_ID
    client_secret_env_var: HAKU_CONSOLE_GOOGLE_CALENDAR_CLIENT_SECRET
operator_connections:
  google_mail:
    display_name: Google Mail
    provider: google_mail
    scopes:
      - https://www.googleapis.com/auth/gmail.modify
      - https://www.googleapis.com/auth/gmail.compose
      - https://www.googleapis.com/auth/gmail.settings.basic
  google_calendar:
    display_name: Google Calendar
    provider: google_calendar
    scopes:
      - https://www.googleapis.com/auth/calendar.events
mcp:
  servers:
    - id: grocy-sf
      backend:
        kind: remote_mcp
        url: https://grocy-mcp-sf.allegedly.works/mcp
        auth:
          kind: remote_server_oauth
          client_registration:
            kind: dynamic
            client_name: Haku Console
    - id: tana-rw
      backend:
        kind: remote_mcp
        # Cluster-internal callers authenticate directly with the account PAT. The credential
        # lives only in haku-console; Haku receives proxied tool schemas/results, never the PAT.
        url: http://tana-mcp.tana-mcp.svc.cluster.local:8263/mcp
        auth:
          kind: static_bearer
          bearer_token_secret: tana-account-pat
    # postscanmail-mcp (x/postscanmail_mcp_server): the PostScan Mail Developer API behind the
    # shared mcp-oauth-facade OIDCProxy — same facade shape as tana-mcp-facade / ibkr-mcp, so
    # haku-console reaches it via operator OAuth (DCR against the facade's own OAuth surface,
    # using dynamic client registration). Restricted to agentydragon by the facade's Authentik group policy
    # (tf/gitops/agent-machine-access/postscanmail-mcp.tf). Reads (list_items,
    # list_automation_rules) auto-approve for the agent; every mutating/paid/destructive action
    # (set_automation_rule, request_*/cancel_* — open & rescan are paid, discard & shred remove
    # mail) queues for operator approval — see haku/console/auto_approval.py. Reached via the
    # public hostname like the other remote facades; no Terraform or NetworkPolicy change.
    - id: postscanmail-mcp
      backend:
        kind: remote_mcp
        url: https://postscanmail-mcp.allegedly.works/mcp
        auth:
          kind: remote_server_oauth
          client_registration:
            kind: dynamic
            client_name: Haku Console
    # Writable Home Assistant management through homeassistant-ai/ha-mcp. The
    # upstream Home Assistant token remains in the ha-mcp pod; callers authenticate
    # to the shared facade through operator OAuth. Read tools now auto-approve
    # (the readOnlyHint subset, minus ha_report_issue — see auto_approval.py); every
    # state-changing/control tool stays operator-gated. Schemas exercised 2026-07-20.
    - id: home-assistant
      backend:
        kind: remote_mcp
        url: https://ha-mcp.allegedly.works/mcp
        auth:
          kind: remote_server_oauth
          client_registration:
            kind: dynamic
            client_name: Haku Console
    # osmmcp (github.com/NERVsystems/osmmcp): geocoding via Nominatim, routing via OSRM,
    # place lookup via Overpass — all public, anonymous, read-only APIs. No secret, no
    # per-operator identity, so unlike every other remote server here it isn't
    # OAuth-fronted: reachable only from haku-console's own namespace via
    # CiliumNetworkPolicy (cluster/k8s/agents/osm-mcp/), not a public HTTPRoute.
    #
    # Unwired for now (operator, 2026-07-19): not yet tested properly and possibly clunky —
    # first live use found routing `mode` is a no-op (the public OSRM demo serves only the
    # car profile; the URL's profile segment is decorative), so foot/bike distances and
    # durations are silently car values, and route geometry is returned as a path on the
    # SERVER pod's own /tmp (osmmcp is local-first). Findings + interim recipes:
    # haku-state memory/improvements/geocoding-geo-search-api.md. Re-enable by
    # uncommenting once routing has a properly profiled backend and a real test pass
    # (the deployment and its NetworkPolicy stay up; auto_approval.py keeps the osm
    # policy for that day).
    # - id: osm
    #   backend:
    #     kind: remote_mcp
    #     url: http://osm-mcp.osm-mcp.svc.cluster.local:7082/mcp
    #     auth:
    #       kind: none
    # kubectl-passthrough-mcp forwards the approving operator's own OAuth token straight
    # to kube-apiserver (cluster_auth_mode=passthrough) — no group override, no scoped
    # credential of its own. RBAC is agentydragon's real cluster-admin binding
    # (oidc-ksbx-agentydragon-admin, cluster/k8s/agents/kubectl-passthrough-mcp/app/).
    # Every kubectl-shaped tool (pods_*, resources_*, nodes_*, events_list,
    # configuration_view — see cluster/k8s/agents/kubectl-passthrough-mcp/) runs with full
    # cluster-admin once approved; the approval click in trusted console chrome is the
    # only gate, by design — see haku/docs/security.md.
    - id: kubectl-passthrough-mcp
      backend:
        kind: remote_mcp
        url: https://kubectl-passthrough-mcp.allegedly.works/mcp
        auth:
          kind: remote_server_oauth
          client_registration:
            kind: preregistered
            # Authentik has no open Dynamic Client Registration endpoint (kubernetes-mcp-server
            # just mirrors Authentik's own OAuth metadata, which omits registration_endpoint),
            # so DCR would 401 against the guessed {server}/register fallback. Use the
            # pre-registered public/PKCE client_id from the kubectl_passthrough_mcp Authentik
            # provider instead (tf/gitops/agent-machine-access/main.tf) — it already allows
            # multiple redirect URIs (CLI localhost, kubernetes-mcp-server's own callback, and
            # haku-console's operator-auth callback), safe to share since PKCE plus per-request
            # redirect_uri validation secure each caller independently.
            client_id: kubectl-passthrough-mcp
    # In-process FastMCP servers (haku/console/tools/*.py) attached via an in-memory transport,
    # not remote MCP servers. Calls default to manual approval;
    # reviewed policies may auto-approve exact calls (currently Gmail label operations).
    #
    # `gmail` + `google_calendar` execute as the acting Operator's own Google account. Each resolves
    # its own logical connection, Google OAuth application, and least-privilege grant from the
    # console's connection store, self-refreshed in-process. They are connected, stored, and
    # disconnected separately in the console's Access tab.
    #
    # `gmail`: reads mirror Gmail's REST API and return its resource shapes verbatim
    # (threads_list, threads_get, messages_get, labels_list, labels_get); writes are
    # drafts_create, threads_modify_labels, and label CRUD (labels_create, labels_patch,
    # labels_delete).
    - id: gmail
      backend:
        kind: in_process
        credential:
          kind: operator_connection
          connection: google_mail
    # `google_calendar`: recurrence-aware get/list/instances reads + approval-gated create_event.
    - id: google_calendar
      backend:
        kind: in_process
        credential:
          kind: operator_connection
          connection: google_calendar
    # `haku_routine` (haku/console/tools/routine.py): launch_routine fires the Haku claude-code-web
    # routine via the haku-routine-launch-token secret (HAKU_CONSOLE_LAUNCH_ROUTINE__*), not the
    # Google grant. Superseding the bespoke launch-routine capability tier. It carries its own
    # credential, so it needs no operator-resolved backend auth.
    - id: haku_routine
      backend:
        kind: in_process
        credential:
          kind: none
    # `hostexec` (haku/console/tools/hostexec.py): run an approved shell command on an
    # operator machine (wyrm2/rugged) under the operator's OWN Authentik identity. There
    # is no standing credential: `operator_login_identity` makes each call resolve the acting
    # Operator's stored console-login token (captured via offline_access) and exchange it
    # (jwt-bearer) for a short-lived, single-use, per-host token that hostexecd verifies
    # against Authentik's JWKS. This catalog entry only selects the auth mode; the in-scope
    # hosts + their exec URLs / audiences are the top-level `hostexec:` block below. Every
    # call is manual-approval (no auto-approve policy). See haku/hostexec/PLAN.md.
    - id: hostexec
      backend:
        kind: in_process
        credential:
          kind: operator_login_identity
# In-scope operator machines for the `hostexec` in-process server (catalog entry above). Non-secret
# deploy topology. Each host maps to an outbound daemon identity; no node listener or address is
# configured in the console.
# `audience_client_id` is the Authentik `hostexec-<host>` provider the operator's token is exchanged
# for (tf/gitops/agent-machine-access/hostexec.tf).
hostexec:
  hosts:
    wyrm2:
      daemon_id: wyrm2
      audience_client_id: hostexec-wyrm2
    rugged:
      daemon_id: rugged
      audience_client_id: hostexec-rugged
node_daemons:
  daemons:
    wyrm2:
      display_name: wyrm2
      token_env_var: HAKU_CONSOLE_NODE_DAEMON_WYRM2_TOKEN
      backends: [hostexec]
    rugged:
      display_name: rugged
      token_env_var: HAKU_CONSOLE_NODE_DAEMON_RUGGED_TOKEN
      backends: [hostexec]
