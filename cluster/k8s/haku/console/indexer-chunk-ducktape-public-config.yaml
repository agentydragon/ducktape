# The ducktape-public chunk pod's config slice: exactly its one index's definition, projected from
# the `recall_indexes` registry in config.yaml (which the console still reads whole). Sync
# contract: edit the registry entry there and mirror it here — the derivation tests
# (haku/console/test_deployment_config.py, cluster/validation/test_haku_manifest_contracts.py)
# fail on any drift, an extra entry, or a console-only key.
git_ca_bundle: /etc/ssl/certs/ca-certificates.crt
recall_indexes:
  - index_id: ducktape-public
    index_type: git
    repo_url: https://github.com/agentydragon/ducktape.git
    branch: devel
    mirror_path: /tmp/haku-recall-index/ducktape.git
