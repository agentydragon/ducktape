# Console may ask Kubernetes whether a fixed deploy-configured subject is authorized.
#
# SubjectAccessReview is advisory only: this permission cannot mutate cluster state and does not
# give Console the reviewed subject's authority. The separate proxy ServiceAccount below is the
# only identity that executes an allowed request.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: haku-console-subject-access-reviewer
  annotations:
    description: Allows Haku Console to evaluate configured Kubernetes SAR subjects.
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: haku-console-subject-access-reviewer
  annotations:
    description: Binds only the Haku Console ServiceAccount to SubjectAccessReview creation.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: haku-console-subject-access-reviewer
subjects:
  - kind: ServiceAccount
    name: haku-console
    namespace: haku-console
---
# Execution identity for the standalone authorization proxy. Its projected token is rotated by
# Kubernetes and is never forwarded to, mounted into, or otherwise exposed to an Agent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-kube-api-proxy
  namespace: haku-console
  annotations:
    description: Executes only Kubernetes requests authorized synchronously by Haku Console.
automountServiceAccountToken: true
