apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-console
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  deletionPolicy: Orphan
  dependsOn:
    - name: haku-workspaces
    - name: haku-console-namespace
    - name: cnpg
    - name: local-path-provisioner
    - name: forgejo-images
    - name: haku-state
    - name: gateway
    - name: agent-machine-access-tf
    - name: reflector
    - name: external-creds
    - name: external-secrets-config
    - name: ssh-mcp
    - name: monitoring-crds
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      current: has(status.applied) && status.applied && has(status.observedGeneration) && status.observedGeneration == metadata.generation
      kind: Database
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: haku-console-db
      namespace: haku-console
    - apiVersion: batch/v1
      kind: Job
      name: haku-console-migration
      namespace: haku-console
    - apiVersion: batch/v1
      kind: Job
      name: haku-console-db-indexer-provisioner
      namespace: haku-console
  interval: 10m
  path: ./cluster/k8s/haku/console
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: haku-console
    namespace: ducktape-flux
  timeout: 20m
  wait: true
