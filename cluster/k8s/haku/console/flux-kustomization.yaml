apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-console
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/haku/console
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: haku-console-namespace # the console's own trusted namespace (not haku-sandbox)
    - name: haku-console-credentials # mirrors connected MCP server credentials into haku-console
    - name: haku-state # provisions haku-state-git-write into the haku-console namespace
    - name: gateway
    - name: authentik
