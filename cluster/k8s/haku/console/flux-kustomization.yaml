apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-console
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/haku/console
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: haku-console-namespace # the console's own trusted namespace (not haku-sandbox)
      namespace: ducktape-flux
    - name: haku-console-db # distributed approval ledger
      namespace: ducktape-flux
    - name: haku-state # provisions the shared haku-ui/backend -> haku-console MCP static-Agent token
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: authentik
      namespace: ducktape-flux
    # TF mints the console's Authentik OAuth2 providers + the haku-console-oidc Secret
    # (operator_oidc + mcp_oauth client credentials + session secret) into this namespace;
    # the pod's build_authentik_auth does a synchronous OIDC discovery fetch at startup, so
    # the provider must exist first.
    - name: agent-machine-access-tf
      namespace: ducktape-flux
