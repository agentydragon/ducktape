apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-console
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: haku-workspaces
    - name: haku-console-migration
    - name: haku-console-namespace
    - name: haku-console-db
    - name: haku-state
    - name: gateway
    - name: agent-machine-access-tf
    - name: reflector
    - name: external-creds
    - name: external-secrets-config
    - name: ssh-mcp
    - name: monitoring-crds
  interval: 10m
  path: ./cluster/k8s/haku/console
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: haku-console
    namespace: ducktape-flux
  timeout: 5m
  wait: true
