# Internal bearers shared by the Console API and its colocated egress proxy sidecar (#4942).
# proxy-token: the static proxy-identity bearer the sidecar presents on every localhost decide
#   call; the Console's egress_decide.proxy_token_env_var resolves the same value to authenticate
#   it. fence-credential-haku: the Agent-bound fence credential the sidecar presents; the Console
#   derives the haku Agent (8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2) from it via
#   egress_decide.fence_credentials. Both are endpoint-scoped opaque bearers (never MCP/session
#   credentials); minted here and rotatable independently — a fresh value on either key just needs
#   the Console and sidecar to read the same Secret, which they do. Not the credentials the proxy
#   redeems for upstreams: those are the egress credential registry (github-bot via ESO).
