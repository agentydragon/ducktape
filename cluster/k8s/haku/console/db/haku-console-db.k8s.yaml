apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: haku-console-db-indexer-generator
  namespace: haku-console
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-console-db-indexer
  namespace: haku-console
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: Password
          name: haku-console-db-indexer-generator
  refreshInterval: 8760h
  target:
    name: haku-console-db-indexer
    template:
      data:
        DATABASE_URL: postgresql+asyncpg://haku_indexer:{{ .password }}@haku-console-db-rw.haku-console.svc:5432/approval_store
        password: "{{ .password }}"
        username: haku_indexer
      type: kubernetes.io/basic-auth
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: haku-console-db
  namespace: haku-console
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
          weight: 100
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: approval_store
      owner: approval_store
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  managed:
    roles:
      - comment: "haku-indexer worker: recall_index schema read/write (see cluster/k8s/haku/console/indexer-role.sql)"
        ensure: present
        login: true
        name: haku_indexer
        passwordSecret:
          name: haku-console-db-indexer
  monitoring:
    enablePodMonitor: true
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 2Gi
    storageClass: local-path-ovh
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: haku-console-db-approval-store
  namespace: haku-console
spec:
  cluster:
    name: haku-console-db
  databaseReclaimPolicy: retain
  extensions:
    - ensure: present
      name: vector
  name: approval_store
  owner: approval_store
