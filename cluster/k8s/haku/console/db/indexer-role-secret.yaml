# Password for the haku_indexer managed role, ESO-generated once (the plaid-mcp
# readonly-secret pattern; symbols disabled so the templated URL needs no escaping).
# Listed before the Cluster in kustomization.yaml so the managed-role passwordSecret
# exists when CNPG reconciles it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: haku-console-db-indexer-generator
  namespace: haku-console
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# The haku-indexer worker's database credential. Its object-level privileges are the
# narrow set the indexer-role provisioner Job grants — never the application owner's.
# DATABASE_URL is the SQLAlchemy asyncpg form the worker consumes directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-console-db-indexer
  namespace: haku-console
spec:
  refreshInterval: 8760h
  target:
    name: haku-console-db-indexer
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "haku_indexer"
        password: "{{ .password }}"
        DATABASE_URL: "postgresql+asyncpg://haku_indexer:{{ .password }}@haku-console-db-rw.haku-console.svc:5432/approval_store"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: haku-console-db-indexer-generator
