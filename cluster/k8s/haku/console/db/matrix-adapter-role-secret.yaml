# Password for the haku_matrix_adapter managed role, ESO-generated once (the
# indexer-role-secret pattern; symbols disabled so the templated URL needs no
# escaping). Listed before the Cluster in kustomization.yaml so the managed-role
# passwordSecret exists when CNPG reconciles it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: haku-console-db-matrix-adapter-generator
  namespace: haku-console
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# The haku-matrix-adapter worker's database credential. Its object-level privileges
# are the narrow set the matrix-adapter-role provisioner Job grants — never the
# application owner's. DATABASE_URL is the SQLAlchemy asyncpg form the worker
# consumes directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-console-db-matrix-adapter
  namespace: haku-console
spec:
  refreshInterval: 8760h
  target:
    name: haku-console-db-matrix-adapter
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "haku_matrix_adapter"
        password: "{{ .password }}"
        DATABASE_URL: "postgresql+asyncpg://haku_matrix_adapter:{{ .password }}@haku-console-db-rw.haku-console.svc:5432/approval_store"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: haku-console-db-matrix-adapter-generator
