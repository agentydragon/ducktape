# Distributed approval ledger for haku-console MCP tool calls. The app runs
# Alembic migrations at startup; CNPG owns the database, role, and Secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: haku-console-db
  namespace: haku-console
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    # This instance currently has a local PV on a control plane. Keep it
    # restartable there until its replica migration, but prefer workers for any
    # placement not constrained by that PV.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  storage:
    storageClass: local-path-ovh
    size: 2Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: approval_store
      owner: approval_store
      # CNPG auto-generates credentials in Secret haku-console-db-app.
