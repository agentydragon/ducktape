# Distributed approval ledger for haku-console MCP tool calls. The app runs
# Alembic migrations at startup; CNPG owns the database, role, and Secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: haku-console-db
  namespace: haku-console
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  storage:
    storageClass: local-path-ovh
    size: 2Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: approval_store
      owner: approval_store
      # CNPG auto-generates credentials in Secret haku-console-db-app.

  managed:
    roles:
      # The haku-indexer worker's narrow credential: recall-index read/write plus read-only
      # chat-source access. CNPG owns role existence and password sync; the object GRANTs are
      # applied by the indexer-role provisioner Job in ../ (they target the recall_index schema,
      # which exists only after the migration Job has run).
      - name: haku_indexer
        ensure: present
        login: true
        passwordSecret:
          name: haku-console-db-indexer
        comment: "haku-indexer worker: recall_index schema read/write + SELECT on conversation_item (see cluster/k8s/haku/console/indexer-role.sql)"
      # The haku-matrix-adapter worker's narrow credential: the Matrix channel's own tables,
      # the conversation seam, and the identity/authority reads a room bind needs. Object
      # GRANTs are applied by the matrix-adapter-role provisioner Job in ../ (they target
      # tables the migration Job creates).
      - name: haku_matrix_adapter
        ensure: present
        login: true
        passwordSecret:
          name: haku-console-db-matrix-adapter
        comment: "haku-matrix-adapter worker: matrix/channel tables read/write + conversation seam + identity reads (see cluster/k8s/haku/console/matrix-adapter-role.sql)"
