# Declares the `vector` extension in the console's database for the semantic index
# (`haku/recall_index`), whose Alembic migration creates `vector` columns and fails without it.
#
# **Adopts an existing database.** `approval_store` was created by the Cluster's
# `bootstrap.initdb` and predates this CR, which reconciles rather than creates it — hence
# `databaseReclaimPolicy: retain`: with `delete`, removing this file would drop the console's
# whole database.
#
# The extension has to be declared rather than created by the app: pgvector is not a trusted
# extension, so `CREATE EXTENSION vector` needs the superuser connection CNPG's reconciler holds,
# while the migration runs as `approval_store`. pgvector 0.8.1 already ships in
# `ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie`.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: haku-console-db-approval-store
  namespace: haku-console
spec:
  cluster:
    name: haku-console-db
  name: approval_store
  owner: approval_store
  databaseReclaimPolicy: retain
  extensions:
    - name: vector
      ensure: present
