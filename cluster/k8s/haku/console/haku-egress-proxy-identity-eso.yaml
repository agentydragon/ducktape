# The shared fence bearer used by the Console API and its colocated egress proxy sidecar (#4942).
# ESO generates it once (the plaid-mcp readonly-secret pattern; symbols disabled so it travels
# cleanly in the Authorization header). It authenticates the shared fence only and carries no
# Agent identity; a live sandbox bridge bearer is required separately.
#
# The endpoint-scoped opaque bearer is compared in-memory by load_egress_decide /
# HttpDecideService (secrets.compare_digest), registered nowhere DB-side, and never valid for
# MCP/session/operator APIs. Regeneration is safe: the deployment's Reloader annotation on this
# Secret restarts the pod and both containers read the identical new value.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: haku-egress-fence-credential-generator
  namespace: haku-console
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-egress-proxy-identity
  namespace: haku-console
spec:
  # A generated password is stable for the generator's lifetime; the long interval avoids an
  # automatic rotation that would needlessly restart the console.
  refreshInterval: 8760h
  target:
    name: haku-egress-proxy-identity
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: haku-egress-fence-credential-generator
      rewrite:
        - regexp:
            source: "^password$"
            target: "fence-credential"
