apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: haku-console

resources:
  - agent-diagnostics-rbac.yaml
  - deployment.yaml
  - serviceaccount.yaml
  - haku-console-google-calendar-client-credentials.sops.yaml
  - haku-console-google-client-credentials.sops.yaml
  - haku-console-github-mcp-client-credentials.sops.yaml
  - node-daemon-atlas.sops.yaml
  - node-daemon-rugged.sops.yaml
  - node-daemon-wyrm2.sops.yaml
  - httproute.yaml
  - indexer-chunk-ducktape-public-deployment.yaml
  - indexer-chunk-haku-state-deployment.yaml
  - indexer-embed-deployment.yaml
  - indexer-role-provisioner-job.yaml
  - kube-api-proxy.yaml
  - kubernetes-authorization-rbac.yaml
  - routine-launch-token.sops.yaml
  - service.yaml
  - static-deployment.yaml
  - static-metadata.yaml
  - static-service.yaml
  - web-push-vapid.sops.yaml
  - external-creds-reader.yaml

configMapGenerator:
  - name: haku-console-config
    files:
      - config.yaml
  # One instance, one config slice (#4886): each per-index chunk Deployment mounts only its own
  # index's definition, so one index's config change (or parse breakage) never touches another
  # index's pod. The slices are derivation-tested projections of config.yaml's recall_indexes.
  - name: haku-indexer-chunk-haku-state-config
    files:
      - config.yaml=indexer-chunk-haku-state-config.yaml
  - name: haku-indexer-chunk-ducktape-public-config
    files:
      - config.yaml=indexer-chunk-ducktape-public-config.yaml
  - name: haku-console-db-indexer-sql
    files:
      - indexer-role.sql
