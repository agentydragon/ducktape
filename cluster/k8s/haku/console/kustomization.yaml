apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: haku-console

resources:
  - agent-diagnostics-rbac.yaml
  - deployment.yaml
  - serviceaccount.yaml
  - haku-console-google-calendar-client-credentials.sops.yaml
  - haku-console-google-client-credentials.sops.yaml
  - haku-console-github-mcp-client-credentials.sops.yaml
  - node-daemon-rugged.sops.yaml
  - node-daemon-wyrm2.sops.yaml
  - httproute.yaml
  - indexer-deployment.yaml
  - indexer-embed-deployment.yaml
  - indexer-role-provisioner-job.yaml
  - matrix-adapter-deployment.yaml
  - matrix-adapter-role-provisioner-job.yaml
  - kube-api-proxy.yaml
  - kubernetes-authorization-rbac.yaml
  - routine-launch-token.sops.yaml
  - service.yaml
  - static-deployment.yaml
  - static-metadata.yaml
  - static-service.yaml
  - web-push-vapid.sops.yaml
  # Colocated egress proxy (#4942): sidecar listener Service, its ESO-generated shared proxy/fence
  # bearers, and the github-bot credential the Console substitutes for the egress credential registry.
  - egress-proxy-service.yaml
  - haku-egress-proxy-identity-eso.yaml
  - haku-egress-github-token-eso.yaml

configMapGenerator:
  - name: haku-console-config
    files:
      - config.yaml
      - haku_system_prompt.md.j2
      - public_coder_system_prompt.md.j2
      - chat_prompt_fragment.md.j2
  - name: haku-console-db-indexer-sql
    files:
      - indexer-role.sql
  - name: haku-console-db-matrix-adapter-sql
    files:
      - matrix-adapter-role.sql
