apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: haku-console

resources:
  - deployment.yaml
  - routine-launch-token.sops.yaml
  - service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: haku-console-nginx
    files:
      - default.conf=nginx.conf
