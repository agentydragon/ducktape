---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: haku-console
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haku-console-config
  namespace: haku-console
data:
  config.yaml: |
    auto_approval_policies:
      - id: kubernetes_reads
        type: exact_tools
        tools:
          grants:
            - kubernetes_can_i
            - get_grant
      - id: grants_own_list
        type: grant_self_list
        server: grants
      - id: grants_whoami
        type: exact_tools
        tools:
          grants:
            - whoami
      - id: grants_self_introspection
        type: any_of
        policies:
          - grants_whoami
          - grants_own_list
      - id: grants_own_revoke
        type: exact_tools
        tools:
          grants:
            - revoke_grants
      - id: public_coder_v1
        type: any_of
        policies:
          - kubernetes_reads
          - grants_self_introspection
          - grants_own_revoke
      - id: haku_sandbox_control
        type: exact_tools
        tools:
          sandbox:
            - provision_sandbox
            - exec_sandbox
            - get_sandbox_info
            - list_sandboxes
            - dispose_sandbox
      - id: haku_v1
        type: any_of
        policies:
          - haku_sandbox_control
          - kubernetes_reads
          - grants_self_introspection
          - grants_own_revoke
      - id: manual_review
        type: never
    access_profiles:
      - id: haku
        auto_approval_policy: haku_v1
        in_process_server_ids:
          - grants
          - sandbox
      - id: public-coder
        auto_approval_policy: public_coder_v1
        in_process_server_ids:
          - grants
      - id: manual-review
        auto_approval_policy: manual_review
        in_process_server_ids:
          - grants
    default_access_profile_id: manual-review
    kubernetes_authorization:
      subjects_by_access_profile:
        haku:
          username: haku:access-profile:haku
          groups:
            - haku:access-profile:haku
            - system:authenticated
        public-coder:
          username: haku:access-profile:public-coder
          groups:
            - haku:access-profile:public-coder
            - system:authenticated
    kubernetes_grant_max_lifetime_seconds: 3600
    agent_sandbox:
      sandbox:
        namespace: haku-sandbox
        warm_pool: haku
        container: workspace
        default_cwd: /workspace/haku-state
        initial_ttl_seconds: 28800
        exec_ttl_extension_seconds: 7200
        provisioning_timeout_seconds: 600
        max_exec_timeout_seconds: 300
        max_output_bytes: 100000
      bootstrap:
        cwd: /workspace
        timeout_seconds: 300
        script: |
          set -euo pipefail
          /usr/local/bin/haku-sandbox-setup.sh
    static_agents:
      haku:
        agent_id: 8d5b0cba-a9ab-4c93-8c31-70d5c7af45c2
        display_name: Haku
        access_profile_id: haku
      public_coder:
        agent_id: 43a833f3-2b1c-4a04-9b8c-1df0cedfb79e
        display_name: public-coder-agent
        access_profile_id: public-coder
    mcp:
      servers:
        sandbox:
          id: sandbox
          backend:
            kind: in_process
            credential:
              kind: none
        grants:
          id: grants
          backend:
            kind: in_process
            credential:
              kind: none
immutable: false
---
