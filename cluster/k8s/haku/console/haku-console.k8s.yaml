        kind: google
      google_calendar:
        kind: google
    operator_connections:
      google_mail:
        display_name: Google Mail
        provider: google_mail
        scopes:
          - https://www.googleapis.com/auth/gmail.modify
          - https://www.googleapis.com/auth/gmail.compose
          - https://www.googleapis.com/auth/gmail.settings.basic
      google_calendar:
        display_name: Google Calendar
        provider: google_calendar
        scopes:
          - https://www.googleapis.com/auth/calendar.events
    mcp:
      servers:
        github:
          id: github
          catalog_refresh_interval_seconds: 900
          agent_tool_denylist:
            - assign_copilot_to_issue
            - create_pull_request_with_copilot
            - get_copilot_job_status
            - request_copilot_review
          backend:
            kind: remote_mcp
            url: https://api.githubcopilot.com/mcp/
            headers:
              X-MCP-Toolsets: default,actions
            auth:
              kind: remote_server_oauth
              client_registration:
                kind: preregistered
                token_endpoint_auth_method: client_secret_post
        grocy_sf:
          id: grocy-sf
          backend:
            kind: remote_mcp
            url: https://grocy-mcp-sf.allegedly.works/mcp
            auth:
              kind: remote_server_oauth
              client_registration:
                kind: dynamic
                client_name: Haku Console
        tana:
          id: tana
          backend:
            kind: remote_mcp
            url: http://tana-mcp.tana-mcp.svc.cluster.local:8263/mcp
            auth:
              kind: static_bearer
        sandbox:
          id: sandbox
          backend:
            kind: in_process
            credential:
              kind: none
        grants:
          id: grants
          backend:
            kind: in_process
            credential:
              kind: none
        ssh:
          id: ssh
          backend:
            kind: remote_mcp
            url: http://ssh-mcp.ssh-mcp.svc.cluster.local:8080/mcp
            auth:
              kind: static_bearer
        home_assistant:
          id: home-assistant
          backend:
            kind: remote_mcp
            url: http://ha-mcp.ha-mcp.svc.cluster.local:8765/mcp
            auth:
              kind: static_bearer
        kubectl_passthrough_mcp:
          id: kubectl-passthrough-mcp
          backend:
            kind: remote_mcp
            url: https://kubectl-passthrough-mcp.allegedly.works/mcp
            auth:
              kind: remote_server_oauth
              client_registration:
                kind: preregistered
                client_id: kubectl-passthrough-mcp
        gmail:
          id: gmail
          backend:
            kind: in_process
            credential:
              kind: operator_connection
              connection: google_mail
        google_calendar:
          id: google_calendar
          backend:
            kind: in_process
            credential:
              kind: operator_connection
              connection: google_calendar
immutable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    configmap.reloader.stakater.com/reload: haku-console-config
    secret.reloader.stakater.com/reload: aiquota-api-bearer-haku-console,ha-mcp-bearer,haku-console-agent-api,haku-console-github-mcp-client-credentials,haku-console-google-calendar-client-credentials,haku-console-google-client-credentials,haku-console-oidc,haku-console-public-coder-agent,haku-console-web-push-vapid,haku-routine-launch-token,ssh-mcp-bearer,tana-agentydragon-gmail-com-account-pat
  labels:
    app.kubernetes.io/name: haku-console
  name: haku-console
  namespace: haku-console
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-console
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-console
        cdk8s.io/metadata.addr: haku-console-console-deployment-c8971d9a
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hil-ovh
      automountServiceAccountToken: true
      containers:
        - env:
            - name: HAKU_CONSOLE__IMAGE_TAG
              valueFrom:
                configMapKeyRef:
                  key: image-tag
