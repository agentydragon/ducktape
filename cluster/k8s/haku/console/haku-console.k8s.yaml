apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Fail-closed Haku Agent Kubernetes authorization boundary.
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: haku-kube-api-proxy
  name: haku-kube-api-proxy
  namespace: haku-console
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-kube-api-proxy
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-kube-api-proxy
        cdk8s.io/metadata.addr: haku-console-kube-api-proxy-deployment-c88884fb
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: HAKU_KUBE_AUTHORIZATION_URL
              value: https://haku.allegedly.works/api/internal/kubernetes/authorize
            - name: HAKU_KUBE_AUTHORIZATION_TIMEOUT
              value: 3s
            - name: HAKU_KUBE_REQUEST_TIMEOUT
              value: 30s
            - name: HAKU_KUBE_STREAM_REVALIDATION_INTERVAL
              value: 5s
            - name: HAKU_KUBE_MAX_REQUEST_BYTES
              value: "10485760"
            - name: HAKU_KUBE_TLS_CERT_FILE
              value: /etc/haku-kube-api-proxy-tls/tls.crt
            - name: HAKU_KUBE_TLS_KEY_FILE
              value: /etc/haku-kube-api-proxy-tls/tls.key
          image: git.allegedly.works/ducktape-ci/haku-kube-api-proxy:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
          name: proxy
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 8443
              name: https
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/haku-kube-api-proxy-tls
              name: secret-haku-kube-api-proxy-tls
              readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: haku-kube-api-proxy
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 20
      volumes:
        - name: secret-haku-kube-api-proxy-tls
          secret:
            secretName: haku-kube-api-proxy-tls
---
