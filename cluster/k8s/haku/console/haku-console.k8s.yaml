apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    description: Applies the object GRANTs for haku_indexer (indexer-role.sql). The role itself is managed declaratively by CNPG (haku-console-db managed.roles); this runs in the app layer because the recall_index schema exists only after the migration Job.
    kustomize.toolkit.fluxcd.io/force: enabled
  name: haku-console-db-indexer-provisioner
  namespace: haku-console
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-console-db-indexer-provisioner
        cdk8s.io/metadata.addr: haku-console-console-indexer-provisioner-c807e4ac
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hil-ovh
      automountServiceAccountToken: false
      containers:
        - args:
            - --set=ON_ERROR_STOP=1
            - -f
            - /sql/indexer-role.sql
          command:
            - psql
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: haku-console-db-app
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: haku-console-db-app
            - name: PGHOST
              value: haku-console-db-rw.haku-console.svc
            - name: PGDATABASE
              value: approval_store
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
          imagePullPolicy: IfNotPresent
          name: psql
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - mountPath: /sql
              name: configmap-haku-console-db-indexer-sql
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Never
      securityContext:
        fsGroupChangePolicy: Always
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            name: haku-console-db-indexer-sql
          name: configmap-haku-console-db-indexer-sql
