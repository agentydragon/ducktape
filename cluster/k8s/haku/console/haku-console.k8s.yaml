apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "true"
    goldilocks.fairwinds.com/vpa-update-mode: auto
    name: haku-console
  name: haku-console
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: haku-console
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: haku-console-db-indexer-generator
  namespace: haku-console
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-console-db-indexer
  namespace: haku-console
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: haku-console-db-indexer-generator
  refreshInterval: 8760h
  target:
    name: haku-console-db-indexer
    template:
      data:
        DATABASE_URL: postgresql+asyncpg://haku_indexer:{{ .password }}@haku-console-db-rw.haku-console.svc:5432/approval_store
        password: "{{ .password }}"
        username: haku_indexer
      type: kubernetes.io/basic-auth
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: haku-console-db
  namespace: haku-console
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: approval_store
      owner: approval_store
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  managed:
    roles:
      - comment: "haku-indexer worker: recall_index schema read/write (see cluster/k8s/haku/console/indexer-role.sql)"
        ensure: present
        login: true
        name: haku_indexer
        passwordSecret:
          name: haku-console-db-indexer
  monitoring:
    enablePodMonitor: true
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 2Gi
    storageClass: local-path-ovh
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: haku-console-db-approval-store
  namespace: haku-console
spec:
  cluster:
    name: haku-console-db
  databaseReclaimPolicy: retain
  extensions:
    - ensure: present
      name: vector
  name: approval_store
  owner: approval_store
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-console-migration
  namespace: haku-console
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  name: haku-console-migration
  namespace: haku-console
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-console-migration
        cdk8s.io/metadata.addr: haku-console-migration-job-c884b6d8
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hil-ovh
      automountServiceAccountToken: false
      containers:
        - args:
            - migrate
          env:
            - name: HAKU_CONSOLE_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: haku-console-db-app
            - name: HAKU_CONSOLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: haku-console-db-app
            - name: HAKU_CONSOLE_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: haku-console-db-app
            - name: HAKU_CONSOLE_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: haku-console-db-app
            - name: HAKU_CONSOLE_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: haku-console-db-app
            - name: HAKU_CONSOLE__DATABASE_URL
              value: postgresql+asyncpg://$(HAKU_CONSOLE_DB_USER):$(HAKU_CONSOLE_DB_PASSWORD)@$(HAKU_CONSOLE_DB_HOST):$(HAKU_CONSOLE_DB_PORT)/$(HAKU_CONSOLE_DB_NAME)
          image: git.allegedly.works/ducktape-ci/haku-console:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          terminationMessagePolicy: FallbackToLogsOnError
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: Never
      securityContext:
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: haku-console-migration
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-console
  namespace: haku-console
automountServiceAccountToken: true
---
