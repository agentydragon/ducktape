apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: auto
    name: haku-console
  name: haku-console
spec: {}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: haku-console
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: haku-console-db
  namespace: haku-console
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: approval_store
      owner: approval_store
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  monitoring:
    enablePodMonitor: true
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: haku-console-db
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    resizeInUseVolumes: false
    size: 3Gi
    storageClass: piraeus-ssd-local
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for haku-console/haku-console-db.
  name: haku-console-db-backups
  namespace: haku-console
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: haku-console-db-backups
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: haku-console-db-backups
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for haku-console/haku-console-db.
  name: haku-console-db-backups
  namespace: haku-console
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: haku-console-db-backups
  namespace: haku-console
spec:
  identityRef:
    name: haku-console-db-backups
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: haku-console-db-backups-s3-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  annotations:
    description: SeaweedFS S3 destination for haku-console/haku-console-db base backups and WAL.
  name: haku-console-db
  namespace: haku-console
spec:
  configuration:
    data:
      compression: gzip
    destinationPath: s3://haku-console-db-backups/
    endpointURL: http://seaweedfs-s3.seaweedfs.svc:8333
    s3Credentials:
      accessKeyId:
        key: AWS_ACCESS_KEY_ID
        name: haku-console-db-backups-s3-credentials
      secretAccessKey:
        key: AWS_SECRET_ACCESS_KEY
        name: haku-console-db-backups-s3-credentials
    wal:
      compression: gzip
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: haku-console-db
  namespace: haku-console
spec:
  backupOwnerReference: self
  cluster:
    name: haku-console-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 29 4 * * *
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: haku-console-db-approval-store
  namespace: haku-console
spec:
  cluster:
    name: haku-console-db
  databaseReclaimPolicy: retain
  extensions:
    - ensure: present
      name: vector
  name: approval_store
  owner: approval_store
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migration
  namespace: haku-console
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  name: migration
  namespace: haku-console
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-console-migration
        cdk8s.io/metadata.addr: haku-console-migration-job-c884b6d8
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - migrate
          env:
            - name: HAKU_CONSOLE__DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: haku-console-db-app
          image: git.allegedly.works/ducktape-ci/haku-console:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          terminationMessagePolicy: FallbackToLogsOnError
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Never
      securityContext:
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: migration
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-console
  namespace: haku-console
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    description: Read-only Console workload, event, and public ConfigMap metadata.
  name: agent-haku-console-metadata-reader
  namespace: haku-console
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    description: Binds Haku and public-coder to narrow Console metadata diagnostics.
  name: agent-haku-console-metadata-reader
  namespace: haku-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-haku-console-metadata-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:haku
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:haku
  - apiGroup: ""
    kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - apiGroup: ""
    kind: ServiceAccount
    name: claude-ai
    namespace: agentplane-staging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: haku-console
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
  namespace: haku-console
data:
  config.yaml: |
    access_profiles:
      - id: manual-review
    default_access_profile_id: manual-review
immutable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    configmap.reloader.stakater.com/reload: config
    secret.reloader.stakater.com/reload: haku-console-oidc,haku-routine-launch-token
  labels:
    app.kubernetes.io/name: haku-console
  name: haku-console
  namespace: haku-console
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-console
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-console
        cdk8s.io/metadata.addr: haku-console-console-deployment-c8971d9a
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: HAKU_CONSOLE__IMAGE_TAG
              valueFrom:
                configMapKeyRef:
                  key: image-tag
                  name: image-metadata
            - name: HAKU_CONSOLE__LAUNCH_ROUTINE__ROUTINE_ID
              value: trig_0158pCMU1XBhoALBWikwSyK4
            - name: HAKU_CONSOLE__LAUNCH_ROUTINE__TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: haku-routine-launch-token
                  optional: false
            - name: HAKU_CONSOLE__HAKU_UI_URL
              value: https://haku-ui.allegedly.works
            - name: HAKU_CONSOLE__AUTH_ORIGIN
              value: https://auth.allegedly.works
            - name: HAKU_CONSOLE__PUBLIC_BASE_URL
              value: https://haku.allegedly.works
            - name: HAKU_CONSOLE__STATIC_IMAGE_TAG_FILE
              value: /etc/haku-console/static-metadata/image-tag
            - name: HAKU_CONSOLE__DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: haku-console-db-app
            - name: HAKU_CONSOLE__OPERATOR_OIDC__ISSUER
              value: https://auth.allegedly.works/application/o/haku-console/
            - name: HAKU_CONSOLE__OPERATOR_OIDC__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: operator_client_id
                  name: haku-console-oidc
                  optional: false
            - name: HAKU_CONSOLE__OPERATOR_OIDC__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: operator_client_secret
                  name: haku-console-oidc
                  optional: false
            - name: HAKU_CONSOLE__OPERATOR_OIDC__SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: operator_session_secret
                  name: haku-console-oidc
                  optional: false
            - name: HAKU_CONSOLE__OPERATOR_IDENTITY__TRUST_DOMAIN
              value: auth.allegedly.works/authentik-user-id/v1
            - name: HAKU_CONSOLE_CONFIG_FILE
              value: /etc/haku-console/config/config.yaml
          image: git.allegedly.works/ducktape-ci/haku-console:unset
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
          name: server
          ports:
            - containerPort: 8080
              name: api
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 3072Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          startupProbe:
            failureThreshold: 60
            periodSeconds: 5
            tcpSocket:
              port: 8080
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /etc/haku-console/config
              name: configmap-config
              readOnly: true
            - mountPath: /etc/haku-console/static-metadata
              name: configmap-static-metadata
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: haku-console
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 25
      volumes:
        - emptyDir: {}
          name: tmp
        - configMap:
            name: config
          name: configmap-config
        - configMap:
            name: static-metadata
          name: configmap-static-metadata
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: haku-console
  name: haku-console
  namespace: haku-console
spec:
  externalIPs: []
  ports:
    - name: api
      port: 8080
      protocol: TCP
      targetPort: 8080
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: haku-console
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: haku-console
  namespace: haku-console
spec:
  endpoints:
    - path: /metrics
      port: metrics
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-console
---
