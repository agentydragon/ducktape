---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: haku-console-static
  name: static
  namespace: haku-console
spec:
  externalIPs: []
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8081
  selector:
    app.kubernetes.io/name: haku-console-static
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: haku-console
  namespace: haku-console
spec:
  hostnames:
    - haku.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  rules:
    - backendRefs:
        - name: static
          port: 8080
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
          type: ResponseHeaderModifier
      timeouts:
        backendRequest: 360s
        request: 360s
