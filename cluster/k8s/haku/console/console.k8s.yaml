apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: auto
    name: haku-console
  name: haku-console
spec: {}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: haku-console
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-secret-reader
  namespace: haku-console
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haku-console-agent-api-reader
  namespace: forgejo
rules:
  - apiGroups:
      - ""
    resourceNames:
      - haku-console-agent-api
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haku-console-agent-api-reader
  namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haku-console-agent-api-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: forgejo-secret-reader
    namespace: haku-console
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-haku-console-agent-api-secret-store
spec:
  conditions:
    - namespaces:
        - haku-console
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: forgejo-secret-reader
      remoteNamespace: forgejo
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-console-agent-api
  namespace: haku-console
spec:
  dataFrom:
    - extract:
        key: haku-console-agent-api
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-haku-console-agent-api-secret-store
  target:
    creationPolicy: Owner
    name: haku-console-agent-api
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: haku-sandbox,haku-egress-proxy
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: haku-sandbox,haku-egress-proxy
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: haku-console-db
  namespace: haku-console
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: approval_store
      owner: approval_store
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  monitoring:
    enablePodMonitor: true
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 2Gi
    storageClass: local-path-ovh
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: haku-console-db-approval-store
  namespace: haku-console
spec:
  cluster:
    name: haku-console-db
  databaseReclaimPolicy: retain
  extensions:
    - ensure: present
      name: vector
  name: approval_store
  owner: approval_store
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migration
  namespace: haku-console
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  name: migration
  namespace: haku-console
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-console-migration
        cdk8s.io/metadata.addr: haku-console-migration-job-c884b6d8
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - migrate
          env:
            - name: HAKU_CONSOLE_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: haku-console-db-app
            - name: HAKU_CONSOLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: haku-console-db-app
            - name: HAKU_CONSOLE_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: haku-console-db-app
            - name: HAKU_CONSOLE_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: haku-console-db-app
            - name: HAKU_CONSOLE_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: haku-console-db-app
            - name: HAKU_CONSOLE__DATABASE_URL
              value: postgresql+asyncpg://$(HAKU_CONSOLE_DB_USER):$(HAKU_CONSOLE_DB_PASSWORD)@$(HAKU_CONSOLE_DB_HOST):$(HAKU_CONSOLE_DB_PORT)/$(HAKU_CONSOLE_DB_NAME)
          image: git.allegedly.works/ducktape-ci/haku-console:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          terminationMessagePolicy: FallbackToLogsOnError
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Never
      securityContext:
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: migration
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-console
  namespace: haku-console
automountServiceAccountToken: true
