# A change-driven release gate: this exact Console image migrates the schema before
# Flux rolls the API/static workloads that depend on it. Preserve a failed Job for
# diagnosis; deleting it is the deliberate retry path (cluster/docs/troubleshooting.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: haku-console-migration
  namespace: haku-console
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # A migration failure is a release failure, not a transient workload retry. Keep its
  # one attempt and its logs until an operator has diagnosed or deliberately retried it.
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-console-migration
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      serviceAccountName: haku-console-migration
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # This must remain image-coupled with the API Deployment. A versioned Job name
          # would instead bind rollout state to repository HEAD and duplicate alembic_version.
          image: ghcr.io/agentydragon/haku-console:devel-20260905072109-2aaf52a # {"$imagepolicy": "flux-system:haku-console"}
          imagePullPolicy: Always
          args: ["migrate"]
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: HAKU_CONSOLE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: username
            - name: HAKU_CONSOLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: password
            - name: HAKU_CONSOLE_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: host
            - name: HAKU_CONSOLE_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: port
            - name: HAKU_CONSOLE_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: dbname
            # The migration command deliberately consumes no other Console setting or secret.
            - name: HAKU_CONSOLE__DATABASE_URL
              value: "postgresql+asyncpg://$(HAKU_CONSOLE_DB_USER):$(HAKU_CONSOLE_DB_PASSWORD)@$(HAKU_CONSOLE_DB_HOST):$(HAKU_CONSOLE_DB_PORT)/$(HAKU_CONSOLE_DB_NAME)"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
