apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-console-migration
  namespace: haku-console
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  name: haku-console-migration
  namespace: haku-console
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-console-migration
        cdk8s.io/metadata.addr: haku-console-migration-migration-job-c8746582
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - hil-ovh
      automountServiceAccountToken: false
      containers:
        - args:
            - migrate
          env:
            - name: HAKU_CONSOLE_DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: haku-console-db-app
            - name: HAKU_CONSOLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: haku-console-db-app
            - name: HAKU_CONSOLE_DB_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: haku-console-db-app
            - name: HAKU_CONSOLE_DB_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: haku-console-db-app
            - name: HAKU_CONSOLE_DB_NAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: haku-console-db-app
            - name: HAKU_CONSOLE__DATABASE_URL
              value: postgresql+asyncpg://$(HAKU_CONSOLE_DB_USER):$(HAKU_CONSOLE_DB_PASSWORD)@$(HAKU_CONSOLE_DB_HOST):$(HAKU_CONSOLE_DB_PORT)/$(HAKU_CONSOLE_DB_NAME)
          image: git.allegedly.works/ducktape-ci/haku-console:unset
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          terminationMessagePolicy: FallbackToLogsOnError
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: Never
      securityContext:
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: haku-console-migration
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
