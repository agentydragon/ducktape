# This ConfigMap is deliberately separate from the API Deployment's pod template.
# Flux changes it with the static image tag; projected-volume refresh lets the API
# report the selected frontend revision without a static-only rollout restarting the API.
# It is deploy desired-state metadata, not an attestation that every static endpoint
# has already finished rolling to this image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: static-metadata
  namespace: haku-console
data:
  image-tag: devel-20261005104201-0c56c93 # {"$imagepolicy": "flux-system:haku-console-static:tag"}
