# The Haku console: a FastAPI dashboard that replaced the static nginx haku-dashboard.
# Unlike the dashboard (nginx + a git-sync sidecar), the app owns git itself —
# it clones haku-state into an emptyDir at /data at startup and pushes back. Access
# is gated by Authentik (agentydragon-only) via the proxy outpost — the app has no
# native auth.
#
# Trust boundary: runs in its OWN `haku-console` namespace, NOT haku-sandbox. As
# reviewed/released ducktape code it sits outside Haku's RBAC (Haku can't read its
# secrets/logs or patch it) and outside the haku-mitmproxy egress fence (which keys
# on the haku-sandbox namespace) — so it gets ordinary egress and can later hold
# secrets Haku may not read. See haku/PLAN.md → "The agent-authored console". It
# still runs locked down (uid/gid 1000, non-root, no service-account token, all
# capabilities dropped). readOnlyRootFilesystem is intentionally NOT set: the aspect
# py_binary launcher materializes its venv on the rootfs at startup (same as
# grocy-mcp), so the root fs must be writable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-console
  namespace: haku-console
  labels:
    app.kubernetes.io/name: haku-console
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-console
    spec:
      automountServiceAccountToken: false
      # Don't inject the kubelet's {SVCNAME}_* service-link env vars: the haku-console
      # Service's HAKU_CONSOLE_PORT=tcp://<clusterIP>:8080 collides with the app's
      # HAKU_CONSOLE_ settings prefix (it parsed into the port:int field → crash).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: ghcr.io/agentydragon/haku-console:devel-20260626151907-e26eae8 # {"$imagepolicy": "flux-system:haku-console"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME # libgit2/git config + temp writes land in the writable emptyDir
              value: /tmp
            - name: HAKU_CONSOLE_GIT_REPO_URL
              valueFrom:
                secretKeyRef:
                  name: haku-state-git-write
                  key: repo_url
            - name: HAKU_CONSOLE_GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: haku-state-git-write
                  key: username
            - name: HAKU_CONSOLE_GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-state-git-write
                  key: password
            # Capability tier: the launch-routine action. The console builds both the
            # (public) fire URL and the claude.ai/code page deep-link from this routine
            # (trigger) id; the bearer comes from the haku-console-only secret so Haku
            # can't read it. See haku/PLAN.md → "The agent-authored console".
            - name: HAKU_CONSOLE_LAUNCH_ROUTINE__ROUTINE_ID
              value: trig_0158pCMU1XBhoALBWikwSyK4
            - name: HAKU_CONSOLE_LAUNCH_ROUTINE__TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-routine-launch-token
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp # HOME=/tmp: libgit2/git config + scratch
              mountPath: /tmp
            - name: data # the haku-state clone
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
