# The Haku Console API: reviewed FastAPI code behind the separately deployed static frontend.
# The console is the trusted outer shell — it serves config + the capability tier
# (launch-routine) and frames Haku's own UI (haku-ui) as a sandboxed cross-origin
# iframe. It writes nothing to haku-state (feedback/trace writes moved into haku-ui)
# and holds no Git credential: recall-index maintenance — and the Forgejo credential
# it needs — lives in the separate haku-indexer Deployment, while this pod only reads
# the committed index state for `haku_index.search`/`index_status`. It likewise runs
# no Matrix client and holds no Matrix credential: the channel adapter is the
# separate haku-matrix-adapter Deployment.
# The haku-console-static Deployment serves the bundled SPA and proxies public backend requests
# here through this Service. Keeping it out of this pod means a frontend-only image update does
# not restart the API, MCP streams, or background workers.
# The app owns its auth: the operator browser logs in via Authentik OIDC
# (operator_oidc -> signed session cookie, guarded by OperatorSessionMiddleware) and
# agents authenticate to /mcp via MultiAuth (OIDCProxy DCR + static bearer). The
# forward-auth proxy outpost that used to gate haku.allegedly.works is retired; the
# HTTPRoute now points straight at this Service (single-user access is Authentik's
# application access policy on the console's OAuth2 providers).
#
# Trust boundary: runs in its OWN `haku-console` namespace, NOT haku-sandbox. As
# reviewed/released ducktape code it sits outside Haku's RBAC (Haku can't read its
# secrets/logs or patch it) and outside the haku-egress-proxy egress fence (which keys
# on the haku-sandbox namespace) — so it gets ordinary egress and can later hold
# secrets Haku may not read. See haku/PLAN.md → "The agent-authored console". It
# still runs locked down (uid/gid 1000, non-root, no service-account token, all
# capabilities dropped). readOnlyRootFilesystem is intentionally NOT set: the aspect
# py_binary launcher materializes its venv on the rootfs at startup (same as
# grocy-mcp), so the root fs must be writable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-console
  namespace: haku-console
  labels:
    app.kubernetes.io/name: haku-console
  annotations:
    # Restart only for the API's own mounted ConfigMap and credentials. In particular,
    # do NOT use reloader's blanket auto mode: the projected static-image metadata
    # changes on every frontend release and must not restart API/MCP/background work.
    configmap.reloader.stakater.com/reload: haku-console-config
    secret.reloader.stakater.com/reload: haku-routine-launch-token,haku-console-oidc,haku-console-web-push-vapid,tana-agentydragon-gmail-com-account-pat,ha-mcp-bearer,haku-console-db-app,haku-console-agent-api,haku-console-public-coder-agent,haku-console-node-daemon-wyrm2,haku-console-node-daemon-rugged,haku-console-google-client-credentials,haku-console-google-calendar-client-credentials,haku-console-github-mcp-client-credentials,haku-egress-proxy-identity,haku-egress-github-token
spec:
  replicas: 2
  strategy:
    # `maxUnavailable: 0` is the point of this: a replacement that never becomes Ready leaves the
    # running version serving, so a bad release is a no-op rather than an outage. This replaced
    # Recreate, which deleted every pod before starting one — on 2026-08-10 a transiently missing
    # reflected Secret (`ha-mcp-bearer`, absent for ~2min while its source namespace churned) took
    # the whole console down, where rolling would have been invisible.
    #
    # What Recreate bought and this gives up: an atomic version boundary. The static image keeps
    # only its own fingerprinted assets, so during a roll a browser can load the new shell from one
    # pod and 404 on its chunk against the other. That window is the roll's length, the blast
    # radius is one page load, and a refresh after the roll fixes it — a worse failure than nothing,
    # a much better one than every deploy being an outage. Session persistence would close it; see
    # this directory's README § Rolling release compatibility for why that remains a follow-up.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-console
    spec:
      # Same zone as this console's Postgres and the public ingress. Unpinned, a replica landed
      # 166ms from the database, which every read pays several round trips of: 4.6ms of query
      # took ~2s. Costs no availability — the database is node-pinned here anyway.
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      # Narrow runtime identity: create/delete/get SandboxClaims and read
      # their assigned Sandbox + Pod in the dedicated haku-runtime-sandbox namespace so the
      # Operator UI can explain provisioning. It has no list/watch, Secret, log, exec, or
      # SandboxTemplate access.
      serviceAccountName: haku-console
      automountServiceAccountToken: true
      # Room for a graceful shutdown to hand chat-session leases back before SIGKILL: the app
      # bounds uvicorn's graceful wait to 10s (app.main), then the lifespan releases this
      # replica's leases. Must stay above that 10s plus lifespan teardown; the default 30s hid
      # the dependency.
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # mitmproxy reads its interception CA from confdir/mitmproxy-ca.pem (key+cert
        # concatenated). Assemble it once from the shared egress-interception CA so the colocated
        # proxy (below) serves leaves fenced sandboxes already trust via haku-egress-proxy-ca-cert
        # — the same shape as the iron/mitmproxy fence's own CA init.
        - name: egress-proxy-ca-init
          image: busybox:1.37
          command:
            - sh
            - -c
            - cat /egress-proxy-ca/tls.key /egress-proxy-ca/tls.crt > /egress-proxy-confdir/mitmproxy-ca.pem
          volumeMounts:
            - name: egress-proxy-ca
              mountPath: /egress-proxy-ca
              readOnly: true
            - name: egress-proxy-confdir
              mountPath: /egress-proxy-confdir
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: server
          image: ghcr.io/agentydragon/haku-console:devel-20260828043457-ca1114f # {"$imagepolicy": "flux-system:haku-console"}
          imagePullPolicy: Always
          ports:
            - name: api
              containerPort: 8080
          env:
            # Runtime deployment metadata for the Settings panel. Tags come from the same Flux
            # policies as the images, preserving reproducible image contents while exposing the
            # commits selected by this pod manifest.
            - name: HAKU_CONSOLE_IMAGE_TAG
              value: devel-20260828043457-ca1114f # {"$imagepolicy": "flux-system:haku-console:tag"}
            # Capability tier: the launch-routine action. The console builds both the
            # (public) fire URL and the claude.ai/code page deep-link from this routine
            # (trigger) id; the bearer comes from the haku-console-only secret so Haku
            # can't read it. See haku/PLAN.md → "The agent-authored console".
            - name: HAKU_CONSOLE_LAUNCH_ROUTINE__ROUTINE_ID
              value: trig_0158pCMU1XBhoALBWikwSyK4
            - name: HAKU_CONSOLE_LAUNCH_ROUTINE__TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-routine-launch-token
                  key: token
            # Web Push: the VAPID key the console signs approval notifications with. Its
            # public half is derived at startup and handed to each browser at subscribe
            # time, so rotating this key makes every enrolled device re-subscribe from
            # Settings -> Notifications. Unset would simply disable notifications.
            # See haku/console/notifications/push.py.
            - name: HAKU_CONSOLE_WEB_PUSH__PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: haku-console-web-push-vapid
                  key: private-key-pem
            - name: HAKU_CONSOLE_WEB_PUSH__SUBJECT
              value: mailto:agentydragon@gmail.com
            # Where `haku_index.search` embeds its queries: Ollama's OpenAI-compatible
            # endpoint, in its own namespace. The console is outside the haku-egress-proxy
            # fence, so this is ordinary cluster egress. Index maintenance runs in the
            # role-flagged haku-indexer Deployments — a per-index chunk pod for each source
            # sweep (only the haku-state pod holds a Git credential), batch embedding with its
            # own embedder wiring on the shared embed pod; this pod holds neither the sync loops
            # nor any Git credential.
            - name: HAKU_CONSOLE_EMBEDDER__BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434/v1"
            # Also the index's `model_key`, so it must be exactly what Ollama reports — the
            # client fails closed on a mismatch rather than reading a second vector space out
            # of the corpus. Keep it equal to the haku-indexer-embed Deployment's value: search
            # joins `content_embeddings` on this key, so a mismatch searches a space the worker
            # never writes.
            - name: HAKU_CONSOLE_EMBEDDER__MODEL
              value: "qwen3-embedding:4b"
            # Query-side only, which is why it stays on this pod after the indexer split:
            # Qwen3-Embedding is instruction-aware — queries carry a task instruction,
            # documents do not — and only `search` embeds queries (`embed_query`, request
            # path). The haku-indexer-embed worker embeds documents plain and deliberately
            # has no counterpart to this variable. Check the wording against the tag Ollama
            # actually serves.
            - name: HAKU_CONSOLE_EMBEDDER__QUERY_INSTRUCTION
              value: "Instruct: Given a search query, retrieve relevant passages\nQuery: "
            # Free-form UI (Phase 1b): the Authentik-gated origin of Haku's own UI
            # service (haku-sandbox). The console embeds it in a sandboxed cross-origin
            # iframe and sets a CSP frame-src for it; it never renders Haku's UI itself.
            # Lights up once the haku-ui workload serves (cluster/k8s/haku/workloads +
            # the haku-ui Authentik route). See haku/console/docs/containment.md.
            - name: HAKU_CONSOLE_HAKU_UI_URL
              value: https://haku-ui.allegedly.works
            - name: HAKU_CONSOLE_AUTH_ORIGIN
              value: https://auth.allegedly.works
            - name: HAKU_CONSOLE_PUBLIC_BASE_URL
              value: https://haku.allegedly.works
            - name: HAKU_CONSOLE_CONFIG_FILE
              value: /etc/haku-console/config/config.yaml
            # Flux updates the standalone static Deployment and this ConfigMap together. The tag
            # is projected as a file, so /api/deployment can report the frontend revision without
            # making a frontend-only image update roll this API Deployment.
            - name: HAKU_CONSOLE_STATIC_IMAGE_TAG_FILE
              value: /etc/haku-console/static-metadata/image-tag
            # Config-first rollout for the approval-wait bound. Current images ignore unknown
            # environment variables; the follow-up image requires this value at startup.
            - name: HAKU_CONSOLE_MAX_WAIT_FOR_RESULT_MS
              value: "60000"
            - name: HAKU_CONSOLE_MCP_OPERATOR_OAUTH_TOKEN_TIMEOUT_SECONDS
              value: "30"
            # Direct tana-rw credential. It is resolved only while Console calls the internal
            # Tana MCP backend and is never mounted into the inner Haku workload.
            - name: HAKU_CONSOLE_MCP_CREDENTIAL_TANA_ACCOUNT_PAT
              valueFrom:
                secretKeyRef:
                  name: tana-agentydragon-gmail-com-account-pat
                  key: token
            # ha-mcp static bearer — the SAME token the facade validates, reflected from
            # ha-mcp/ha-mcp-bearer into this namespace (emberstack reflector).
            - name: HAKU_CONSOLE_MCP_CREDENTIAL_HA_MCP_BEARER
              valueFrom:
                secretKeyRef:
                  name: ha-mcp-bearer
                  key: bearer-token
            - name: HAKU_CONSOLE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: username
            - name: HAKU_CONSOLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: password
            - name: HAKU_CONSOLE_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: host
            - name: HAKU_CONSOLE_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: port
            - name: HAKU_CONSOLE_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: dbname
            - name: HAKU_CONSOLE_DATABASE_URL
              value: "postgresql+asyncpg://$(HAKU_CONSOLE_DB_USER):$(HAKU_CONSOLE_DB_PASSWORD)@$(HAKU_CONSOLE_DB_HOST):$(HAKU_CONSOLE_DB_PORT)/$(HAKU_CONSOLE_DB_NAME)"
            # Haku's own backend static agent: the `haku` entry in config.yaml's `static_agents`
            # references these two env vars — the bearer (below) and controller-fed stable external
            # user key (further down). config.yaml owns the durable Agent UUID and display name.
            - name: HAKU_CONSOLE_AGENT_HAKU_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-agent-api
                  key: token
            # public-coder-agent's dedicated static-Agent bearer. The same generated value reaches
            # only its iron-proxy; the OpenClaw container uses a non-secret placeholder.
            - name: HAKU_CONSOLE_AGENT_PUBLIC_CODER_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-public-coder-agent
                  key: token
            - name: HAKU_CONSOLE_NODE_DAEMON_WYRM2_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-node-daemon-wyrm2
                  key: token
            - name: HAKU_CONSOLE_NODE_DAEMON_RUGGED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-node-daemon-rugged
                  key: token
            # Two in-process MCP servers execute as the acting Operator's own Google account:
            # `gmail` (Gmail reads mirroring the REST API, draft creation, thread-label changes,
            # label CRUD — haku/console/tools/gmail.py) and `google_calendar` (recurrence-aware
            # event reads + approval-gated creation — google_calendar.py). Each call resolves that
            # Operator's per-Operator Google token from the console's own connection store
            # (haku/console/oauth/provider_connection.py), self-refreshed in-process.
            #
            # Each integration has its own Google OAuth application/client so Calendar can complete
            # sensitive-scope verification independently of restricted Gmail. The console runs both
            # per-Operator authorization-code flows itself. optional: true keeps only the integration
            # whose secret is absent degraded. Register the same console callback URI on each client.
            - name: HAKU_CONSOLE_GOOGLE_MAIL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: haku-console-google-client-credentials
                  key: client_id
                  optional: true
            - name: HAKU_CONSOLE_GOOGLE_MAIL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: haku-console-google-client-credentials
                  key: client_secret
                  optional: true
            - name: HAKU_CONSOLE_GOOGLE_CALENDAR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: haku-console-google-calendar-client-credentials
                  key: client_id
                  optional: true
            - name: HAKU_CONSOLE_GOOGLE_CALENDAR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: haku-console-google-calendar-client-credentials
                  key: client_secret
                  optional: true
            # GitHub's hosted MCP server does not support Dynamic Client Registration. Its
            # organization-owned GitHub App therefore supplies this pre-registered confidential
            # client. The optional references keep the console deployable while the App is being
            # registered; the GitHub entry is enabled only after both values exist.
            - name: HAKU_CONSOLE_GITHUB_MCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: haku-console-github-mcp-client-credentials
                  key: client_id
                  optional: true
            - name: HAKU_CONSOLE_GITHUB_MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: haku-console-github-mcp-client-credentials
                  key: client_secret
                  optional: true
            # The Operator the `haku` static agent acts as when it reaches an operator_oauth server:
            # reflecting grocy-sf/kubectl schemas and executing its own auto-approved
            # operator_oauth calls (a machine agent has no operator token of its own). The value is the
            # controller-fed Authentik user id. Haku resolves it through the configured identity
            # trust domain to a canonical Operator UUID; it never becomes live request authority.
            - name: HAKU_CONSOLE_AGENT_HAKU_OPERATOR
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: operator_subject
            # Coder's manually approved calls execute as the same canonical Operator. This is a
            # startup identity seed, not authority carried by the Agent request.
            - name: HAKU_CONSOLE_AGENT_PUBLIC_CODER_AGENT_OPERATOR
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: operator_subject
            # Agent-facing MCP OAuth: an Authentik-backed OIDCProxy (DCR + PKCE) for claude.ai /
            # the `claude` CLI on /mcp, composed with the static agent bearer via MultiAuth. The
            # provider + client secret are minted by tf/gitops/agent-machine-access (application
            # slug `haku-console-mcp`, redirect https://haku.allegedly.works/mcp/auth/callback).
            # The MCP public URL is derived in-app from HAKU_CONSOLE_PUBLIC_BASE_URL + /mcp. Keep a
            # single canonical public origin: FastMCP itself is not aware of the outer ASGI mount.
            - name: HAKU_CONSOLE_MCP_OAUTH__OIDC_ISSUER
              value: https://auth.allegedly.works/application/o/haku-console-mcp/
            - name: HAKU_CONSOLE_MCP_OAUTH__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: mcp_client_id
            - name: HAKU_CONSOLE_MCP_OAUTH__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: mcp_client_secret
            # OIDCProxy dynamic-client-registration + token state, shared across the 2 replicas so
            # a claude.ai DCR registration survives a re-schedule (process-local file storage would
            # strand it per-pod and is not a valid Haku OAuth mode). Backed by the console's own
            # Postgres (py-key-value's PostgreSQLStore auto-creates its table), so there is no
            # separate valkey to run. The URL is the asyncpg
            # form (plain postgresql://), NOT the SQLAlchemy asyncpg URL the ORM uses.
            - name: HAKU_CONSOLE_MCP_OAUTH__PERSISTENCE__KIND
              value: postgres
            - name: HAKU_CONSOLE_MCP_OAUTH__PERSISTENCE__URL
              value: "postgresql://$(HAKU_CONSOLE_DB_USER):$(HAKU_CONSOLE_DB_PASSWORD)@$(HAKU_CONSOLE_DB_HOST):$(HAKU_CONSOLE_DB_PORT)/$(HAKU_CONSOLE_DB_NAME)"
            # Operator browser login (Authentik OIDC), replacing the forward-auth proxy outpost:
            # the console authenticates the operator itself (authorization-code -> signed session
            # cookie) and OperatorSessionMiddleware guards /api/*. Provider + secrets minted by
            # tf/gitops/agent-machine-access (application slug `haku-console`, redirect
            # https://haku.allegedly.works/auth/callback). This is required in every runtime; the
            # console refuses to start without app-owned operator auth.
            - name: HAKU_CONSOLE_OPERATOR_OIDC__ISSUER
              value: https://auth.allegedly.works/application/o/haku-console/
            - name: HAKU_CONSOLE_OPERATOR_OIDC__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: operator_client_id
            - name: HAKU_CONSOLE_OPERATOR_OIDC__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: operator_client_secret
            - name: HAKU_CONSOLE_OPERATOR_OIDC__SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: operator_session_secret
            # Explicit name for the Authentik user-id namespace shared by the exact browser and MCP
            # issuers above (both providers are provisioned with sub_mode=user_id).
            - name: HAKU_CONSOLE_OPERATOR_IDENTITY__TRUST_DOMAIN
              value: auth.allegedly.works/authentik-user-id/v1
            # Colocated egress fence (#4942, #4670). config.yaml's `egress_decide` section names
            # these env vars; `load_egress_decide` reads them at startup and the decide endpoint
            # (loopback :8079, served by app._serve) resolves them per request. Values are shared
            # with the egress-proxy sidecar below where the sidecar must present the same bearer:
            #   - proxy identity bearer the sidecar presents (proxy_token_env_var)
            - name: HAKU_EGRESS_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-egress-proxy-identity
                  key: proxy-token
            #   - the haku Agent's fence credential the endpoint resolves to that Agent
            #     (egress_decide.fence_credentials[].token_env_var)
            - name: HAKU_EGRESS_FENCE_HAKU
              valueFrom:
                secretKeyRef:
                  name: haku-egress-proxy-identity
                  key: fence-credential-haku
            #   - the github-bot registry credential's real value (#4951 EgressCredentialEntry
            #     value_env_var). The Console holds it and substitutes it into decide responses;
            #     the sandbox only ever presents the inert `github-token-placeholder`. Synced from
            #     the same operator account the retiring iron fence used (haku-egress-github-token
            #     ESO). Optional (#4970): an unset value is skipped with a warning by
            #     load_egress_decide, so a not-yet-synced ESO Secret degrades the github-bot handle
            #     rather than crash-looping the console (the endpoint still serves reachability
            #     verdicts). optional: true keeps a missing Secret from blocking pod startup, so the
            #     skip path is actually reached; the proxy-token and fence credentials below stay
            #     required (load_egress_decide fails loud on those).
            - name: HAKU_EGRESS_CREDENTIAL_GITHUB_BOT
              valueFrom:
                secretKeyRef:
                  name: haku-egress-github-token
                  key: token
                  optional: true
            #   - the substitution-smoke registry credential: a committed EXAMPLE- literal rather
            #     than a Secret, deliberately — both sides of that swap are inert so the fence's
            #     substitution path is drivable end to end against a public echo host with no real
            #     credential anywhere (haku/egress/docs/test_substitution.md). Identity secrets
            #     above stay Secret-backed and fail-loud.
            - name: HAKU_EGRESS_CREDENTIAL_SUBSTITUTION_SMOKE
              value: EXAMPLE-EGRESS-SMOKE-SUBSTITUTED
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              # TODO(vpa-memory-audit): 512Mi -> 3Gi. VPA observed a 1.29Gi
              # request / 1.74Gi upper bound, so the old limit was under half
              # what this actually uses and only survived because VPA was
              # silently raising it. A Node static-file + API server wanting
              # 1.3Gi resident looks wrong — check for a leak before accepting.
              memory: 3Gi
          # The image-coupled migration Job completes before this workload reconciles. Keep a
          # startupProbe anyway: normal boot still constructs authenticated clients and validates
          # read compatibility with the schema before binding its port. Five minutes (60 x 5s)
          # separates "still starting" from "wedged" without blunting steady-state detection.
          startupProbe:
            tcpSocket:
              port: api
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp # writable scratch (/tmp) for the app
              mountPath: /tmp
            - name: config
              mountPath: /etc/haku-console/config
              readOnly: true
            - name: static-metadata
              mountPath: /etc/haku-console/static-metadata
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        # Colocated egress proxy (#4942): the embedded mitmproxy adapter (haku/egress) gating every
        # fenced-workload request against Console's decide endpoint. It reaches that endpoint over
        # the shared pod loopback (127.0.0.1:8079) — no Service exposes it, so no sandbox has a
        # route to the oracle (acceptance criterion 14). Same pod as Console, so the two roll as one
        # release unit and the decide API needs no versioning (#4670 § Topology). Fails closed on
        # any decision-path error; the fenced-workload-facing listener is 8888, published by
        # egress-proxy-service.yaml for the force-proxy fence.
        - name: egress-proxy
          image: ghcr.io/agentydragon/haku-egress-proxy:devel-20260827233513-5715f92 # {"$imagepolicy": "flux-system:haku-egress-proxy"}
          imagePullPolicy: Always
          env:
            - name: HAKU_EGRESS_DECIDE_URL
              value: http://127.0.0.1:8079
            - name: HAKU_EGRESS_LISTEN_PORT
              value: "8888"
            - name: HAKU_EGRESS_CONFDIR
              value: /egress-proxy-confdir
            # The proxy-identity bearer Console authenticates, and the haku Agent's fence credential
            # Console resolves to that Agent — the same two values the server container reads above.
            - name: HAKU_EGRESS_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-egress-proxy-identity
                  key: proxy-token
            - name: HAKU_EGRESS_FENCE_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: haku-egress-proxy-identity
                  key: fence-credential-haku
          ports:
            - name: proxy
              containerPort: 8888
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              # Sized for the first github-only spike (#4943); the embedded runner does not yet set
              # mitmproxy's stream_large_bodies, so broad adoption (dind layer pulls) needs that plus
              # a higher ceiling — see this directory's README § Colocated egress proxy.
              memory: 1Gi
          volumeMounts:
            # Writable: mitmproxy derives its public CA files and caches per-host leaves in confdir.
            - name: egress-proxy-confdir
              mountPath: /egress-proxy-confdir
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: haku-console-config
        - name: static-metadata
          configMap:
            name: haku-console-static-metadata
        # The shared egress-interception CA (key+cert), reflected from the haku-egress-proxy
        # Certificate into this namespace; the init container turns it into confdir/mitmproxy-ca.pem.
        - name: egress-proxy-ca
          secret:
            secretName: haku-egress-proxy-ca
        # mitmproxy confdir: the assembled CA plus the dynamic per-host leaves it caches at runtime.
        - name: egress-proxy-confdir
          emptyDir: {}
