# The Haku Console API: reviewed FastAPI code behind the separately deployed static frontend.
# The console is the trusted outer shell — it serves config + the capability tier
# (launch-routine) and frames Haku's own UI (haku-ui) as a sandboxed cross-origin
# iframe. It writes nothing to haku-state (feedback/trace writes moved into haku-ui);
# Recall storage remains in the database for now, but the deployed console has no Recall
# MCP server or index-maintenance worker wiring.
# The haku-console-static Deployment serves the bundled SPA and proxies public backend requests
# here through this Service. Keeping it out of this pod means a frontend-only image update does
# not restart the API, MCP streams, or background workers.
# The app owns its auth: the operator browser logs in via Authentik OIDC
# (operator_oidc -> signed session cookie, guarded by OperatorSessionMiddleware) and
# agents authenticate to /mcp via MultiAuth (OIDCProxy DCR + static bearer). The
# forward-auth proxy outpost that used to gate haku.allegedly.works is retired; the
# HTTPRoute now points straight at this Service (single-user access is Authentik's
# application access policy on the console's OAuth2 providers).
#
# Trust boundary: runs in its OWN `haku-console` namespace, NOT haku-sandbox. As
# reviewed/released ducktape code it sits outside Haku's RBAC (Haku can't read its
# secrets/logs or patch it) and outside the haku-egress-proxy egress fence (which keys
# on the haku-sandbox namespace) — so it gets ordinary egress and can later hold
# secrets Haku may not read. See haku/PLAN.md → "The agent-authored console". It
# still runs locked down (uid/gid 1000, non-root, no service-account token, all
# capabilities dropped). readOnlyRootFilesystem is intentionally NOT set: the aspect
# py_binary launcher materializes its venv on the rootfs at startup (same as
# grocy-mcp), so the root fs must be writable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-console
  namespace: haku-console
  labels:
    app.kubernetes.io/name: haku-console
  annotations:
    # Restart only for the API's own mounted ConfigMap and credentials. In particular,
    # do NOT use reloader's blanket auto mode: the projected static-image metadata
    # changes on every frontend release and must not restart API/MCP/background work.
    configmap.reloader.stakater.com/reload: haku-console-config
    secret.reloader.stakater.com/reload: haku-routine-launch-token,haku-console-oidc,haku-console-web-push-vapid,tana-agentydragon-gmail-com-account-pat,ha-mcp-bearer,haku-console-db-app,haku-console-agent-api,haku-console-public-coder-agent,haku-console-node-daemon-wyrm2,haku-console-node-daemon-rugged,haku-console-node-daemon-atlas,haku-console-google-client-credentials,haku-console-google-calendar-client-credentials,haku-console-github-mcp-client-credentials,aiquota-api-bearer-haku-console,ssh-mcp-bearer
spec:
  replicas: 2
  strategy:
    # Keep one replica serving while allowing the controller to free capacity for
    # its replacement. Requiring a surge pod deadlocked secret-triggered rollouts
    # when the eligible nodes lacked spare CPU or memory.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-console
    spec:
      # Same zone as this console's Postgres and the public ingress. Unpinned, a replica landed
      # 166ms from the database, which every read pays several round trips of: 4.6ms of query
      # took ~2s. Costs no availability — the database is node-pinned here anyway.
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      # Narrow runtime identity: SubjectAccessReview for the Kubernetes-grant flow, plus
      # claim/exec RBAC on the haku-sandbox pool (cluster/k8s/haku/workspaces/app/
      # haku-console-sandbox-role.yaml). It has no Secret, log, exec, or SandboxTemplate
      # access outside that pool.
      serviceAccountName: haku-console
      automountServiceAccountToken: true
      # Private Forgejo package — ducktape-ci credential reflected into this
      # namespace from cluster/k8s/forgejo-images/.
      imagePullSecrets:
        - name: forgejo-images-creds
      # Room for a graceful shutdown to hand chat-session leases back before SIGKILL: the app
      # bounds uvicorn's graceful wait to 10s (app.main), then the lifespan releases this
      # replica's leases. Must stay above that 10s plus lifespan teardown; the default 30s hid
      # the dependency.
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: git.allegedly.works/ducktape-ci/haku-console:devel-20260911030937-7503b6c # {"$imagepolicy": "flux-system:haku-console"}
          imagePullPolicy: Always
          ports:
            - name: api
              containerPort: 8080
          env:
            # Runtime deployment metadata for the Settings panel. Tags come from the same Flux
            # policies as the images, preserving reproducible image contents while exposing the
            # commits selected by this pod manifest.
            - name: HAKU_CONSOLE__IMAGE_TAG
              value: devel-20260911030937-7503b6c # {"$imagepolicy": "flux-system:haku-console:tag"}
            - name: HAKU_CONSOLE__AIQUOTA_URL
              value: "http://aiquota-api.cli-proxy-api.svc.cluster.local:8080"
            - name: HAKU_CONSOLE__AIQUOTA_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiquota-api-bearer-haku-console
                  key: bearer-token
            # Capability tier: the launch-routine action. The console builds both the
            # (public) fire URL and the claude.ai/code page deep-link from this routine
            # (trigger) id; the bearer comes from the haku-console-only secret so Haku
            # can't read it. See haku/PLAN.md → "The agent-authored console".
            - name: HAKU_CONSOLE__LAUNCH_ROUTINE__ROUTINE_ID
              value: trig_0158pCMU1XBhoALBWikwSyK4
            - name: HAKU_CONSOLE__LAUNCH_ROUTINE__TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-routine-launch-token
                  key: token
            # Web Push: the VAPID key the console signs approval notifications with. Its
            # public half is derived at startup and handed to each browser at subscribe
            # time, so rotating this key makes every enrolled device re-subscribe from
            # Settings -> Notifications. Unset would simply disable notifications.
            # See haku/console/notifications/push.py.
            - name: HAKU_CONSOLE__WEB_PUSH__PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: haku-console-web-push-vapid
                  key: private-key-pem
            - name: HAKU_CONSOLE__WEB_PUSH__SUBJECT
              value: mailto:agentydragon@gmail.com
            # Free-form UI (Phase 1b): the Authentik-gated origin of Haku's own UI
            # service (haku-sandbox). The console embeds it in a sandboxed cross-origin
            # iframe and sets a CSP frame-src for it; it never renders Haku's UI itself.
            # Lights up once the haku-ui workload serves (cluster/k8s/haku/workloads +
            # the haku-ui Authentik route). See haku/console/docs/containment.md.
            - name: HAKU_CONSOLE__HAKU_UI_URL
              value: https://haku-ui.allegedly.works
            - name: HAKU_CONSOLE__AUTH_ORIGIN
              value: https://auth.allegedly.works
            - name: HAKU_CONSOLE__PUBLIC_BASE_URL
              value: https://haku.allegedly.works
            - name: HAKU_CONSOLE_CONFIG_FILE
              value: /etc/haku-console/config/config.yaml
            # Flux updates the standalone static Deployment and this ConfigMap together. The tag
            # is projected as a file, so /api/deployment can report the frontend revision without
            # making a frontend-only image update roll this API Deployment.
            - name: HAKU_CONSOLE__STATIC_IMAGE_TAG_FILE
              value: /etc/haku-console/static-metadata/image-tag
            # Config-first rollout for the approval-wait bound. Current images ignore unknown
            # environment variables; the follow-up image requires this value at startup.
            - name: HAKU_CONSOLE__MAX_WAIT_FOR_RESULT_MS
              value: "60000"
            - name: HAKU_CONSOLE__MCP_OPERATOR_OAUTH_TOKEN_TIMEOUT_SECONDS
              value: "30"
            # Direct tana-rw credential. It is resolved only while Console calls the internal
            # Tana MCP backend and is never mounted into the inner Haku workload.
            - name: HAKU_CONSOLE__MCP__SERVERS__TANA_RW__BACKEND__AUTH__TOKEN
              valueFrom:
                secretKeyRef:
                  name: tana-agentydragon-gmail-com-account-pat
                  key: token
            # ha-mcp static bearer — the SAME token the facade validates, reflected from
            # ha-mcp/ha-mcp-bearer into this namespace (emberstack reflector).
            - name: HAKU_CONSOLE__MCP__SERVERS__HOME_ASSISTANT__BACKEND__AUTH__TOKEN
              valueFrom:
                secretKeyRef:
                  name: ha-mcp-bearer
                  key: bearer-token
            - name: HAKU_CONSOLE__MCP__SERVERS__SSH__BACKEND__AUTH__TOKEN
              valueFrom:
                secretKeyRef:
                  name: ssh-mcp-bearer
                  key: bearer-token
            - name: HAKU_CONSOLE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: username
            - name: HAKU_CONSOLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: password
            - name: HAKU_CONSOLE_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: host
            - name: HAKU_CONSOLE_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: port
            - name: HAKU_CONSOLE_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: dbname
            - name: HAKU_CONSOLE__DATABASE_URL
              value: "postgresql+asyncpg://$(HAKU_CONSOLE_DB_USER):$(HAKU_CONSOLE_DB_PASSWORD)@$(HAKU_CONSOLE_DB_HOST):$(HAKU_CONSOLE_DB_PORT)/$(HAKU_CONSOLE_DB_NAME)"
            # Haku's own backend static agent: the `haku` entry in config.yaml's `static_agents`
            # references these two env vars — the bearer (below) and controller-fed stable external
            # user key (further down). config.yaml owns the durable Agent UUID and display name.
            - name: HAKU_CONSOLE__STATIC_AGENTS__HAKU__TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-agent-api
                  key: token
            # public-coder-agent's dedicated static-Agent bearer. The same generated value reaches
            # only its iron-proxy; the OpenClaw container uses a non-secret placeholder.
            - name: HAKU_CONSOLE__STATIC_AGENTS__PUBLIC_CODER__TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-public-coder-agent
                  key: token
            - name: HAKU_CONSOLE__NODE_DAEMONS__DAEMONS__WYRM2__TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-node-daemon-wyrm2
                  key: token
            - name: HAKU_CONSOLE__NODE_DAEMONS__DAEMONS__RUGGED__TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-node-daemon-rugged
                  key: token
            - name: HAKU_CONSOLE__NODE_DAEMONS__DAEMONS__ATLAS__TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-node-daemon-atlas
                  key: token
            # Two in-process MCP servers execute as the acting Operator's own Google account:
            # `gmail` (Gmail reads mirroring the REST API, draft creation, thread-label changes,
            # label CRUD — haku/console/tools/gmail.py) and `google_calendar` (recurrence-aware
            # event reads + approval-gated creation — google_calendar.py). Each call resolves that
            # Operator's per-Operator Google token from the console's own connection store
            # (haku/console/oauth/provider_connection.py), self-refreshed in-process.
            #
            # Each integration has its own Google OAuth application/client so Calendar can complete
            # sensitive-scope verification independently of restricted Gmail. The console runs both
            # per-Operator authorization-code flows itself. optional: true keeps only the integration
            # whose secret is absent degraded. Register the same console callback URI on each client.
            - name: HAKU_CONSOLE__OPERATOR_CONNECTION_PROVIDERS__GOOGLE_MAIL__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: haku-console-google-client-credentials
                  key: client_id
                  optional: true
            - name: HAKU_CONSOLE__OPERATOR_CONNECTION_PROVIDERS__GOOGLE_MAIL__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: haku-console-google-client-credentials
                  key: client_secret
                  optional: true
            - name: HAKU_CONSOLE__OPERATOR_CONNECTION_PROVIDERS__GOOGLE_CALENDAR__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: haku-console-google-calendar-client-credentials
                  key: client_id
                  optional: true
            - name: HAKU_CONSOLE__OPERATOR_CONNECTION_PROVIDERS__GOOGLE_CALENDAR__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: haku-console-google-calendar-client-credentials
                  key: client_secret
                  optional: true
            # GitHub's hosted MCP server does not support Dynamic Client Registration. Its
            # organization-owned GitHub App therefore supplies this pre-registered confidential
            # client. The optional references keep the console deployable while the App is being
            # registered; the GitHub entry is enabled only after both values exist.
            - name: HAKU_CONSOLE__MCP__SERVERS__GITHUB__BACKEND__AUTH__CLIENT_REGISTRATION__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: haku-console-github-mcp-client-credentials
                  key: client_id
                  optional: true
            - name: HAKU_CONSOLE__MCP__SERVERS__GITHUB__BACKEND__AUTH__CLIENT_REGISTRATION__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: haku-console-github-mcp-client-credentials
                  key: client_secret
                  optional: true
            # The Operator the `haku` static agent acts as when it reaches an operator_oauth server:
            # reflecting grocy-sf/kubectl schemas and executing its own auto-approved
            # operator_oauth calls (a machine agent has no operator token of its own). The value is the
            # controller-fed Authentik user id. Haku resolves it through the configured identity
            # trust domain to a canonical Operator UUID; it never becomes live request authority.
            - name: HAKU_CONSOLE__STATIC_AGENTS__HAKU__OPERATOR_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: operator_subject
            # Coder's manually approved calls execute as the same canonical Operator. This is a
            # startup identity seed, not authority carried by the Agent request.
            - name: HAKU_CONSOLE__STATIC_AGENTS__PUBLIC_CODER__OPERATOR_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: operator_subject
            # Agent-facing MCP OAuth: an Authentik-backed OIDCProxy (DCR + PKCE) for claude.ai /
            # the `claude` CLI on /mcp, composed with the static agent bearer via MultiAuth. The
            # provider + client secret are minted by tf/gitops/agent-machine-access (application
            # slug `haku-console-mcp`, redirect https://haku.allegedly.works/mcp/auth/callback).
            # The MCP public URL is derived in-app from HAKU_CONSOLE__PUBLIC_BASE_URL + /mcp. Keep a
            # single canonical public origin: FastMCP itself is not aware of the outer ASGI mount.
            - name: HAKU_CONSOLE__MCP_OAUTH__OIDC_ISSUER
              value: https://auth.allegedly.works/application/o/haku-console-mcp/
            - name: HAKU_CONSOLE__MCP_OAUTH__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: mcp_client_id
            - name: HAKU_CONSOLE__MCP_OAUTH__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: mcp_client_secret
            # OIDCProxy dynamic-client-registration + token state, shared across the 2 replicas so
            # a claude.ai DCR registration survives a re-schedule (process-local file storage would
            # strand it per-pod and is not a valid Haku OAuth mode). Backed by the console's own
            # Postgres (py-key-value's PostgreSQLStore auto-creates its table), so there is no
            # separate valkey to run. The URL is the asyncpg
            # form (plain postgresql://), NOT the SQLAlchemy asyncpg URL the ORM uses.
            - name: HAKU_CONSOLE__MCP_OAUTH__PERSISTENCE__KIND
              value: postgres
            - name: HAKU_CONSOLE__MCP_OAUTH__PERSISTENCE__URL
              value: "postgresql://$(HAKU_CONSOLE_DB_USER):$(HAKU_CONSOLE_DB_PASSWORD)@$(HAKU_CONSOLE_DB_HOST):$(HAKU_CONSOLE_DB_PORT)/$(HAKU_CONSOLE_DB_NAME)"
            # Operator browser login (Authentik OIDC), replacing the forward-auth proxy outpost:
            # the console authenticates the operator itself (authorization-code -> signed session
            # cookie) and OperatorSessionMiddleware guards /api/*. Provider + secrets minted by
            # tf/gitops/agent-machine-access (application slug `haku-console`, redirect
            # https://haku.allegedly.works/auth/callback). This is required in every runtime; the
            # console refuses to start without app-owned operator auth.
            - name: HAKU_CONSOLE__OPERATOR_OIDC__ISSUER
              value: https://auth.allegedly.works/application/o/haku-console/
            - name: HAKU_CONSOLE__OPERATOR_OIDC__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: operator_client_id
            - name: HAKU_CONSOLE__OPERATOR_OIDC__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: operator_client_secret
            - name: HAKU_CONSOLE__OPERATOR_OIDC__SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: haku-console-oidc
                  key: operator_session_secret
            # Explicit name for the Authentik user-id namespace shared by the exact browser and MCP
            # issuers above (both providers are provisioned with sub_mode=user_id).
            - name: HAKU_CONSOLE__OPERATOR_IDENTITY__TRUST_DOMAIN
              value: auth.allegedly.works/authentik-user-id/v1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              # TODO(vpa-memory-audit): 512Mi -> 3Gi. VPA observed a 1.29Gi
              # request / 1.74Gi upper bound, so the old limit was under half
              # what this actually uses and only survived because VPA was
              # silently raising it. A Node static-file + API server wanting
              # 1.3Gi resident looks wrong — check for a leak before accepting.
              memory: 3Gi
          # The image-coupled migration Job completes before this workload reconciles. Keep a
          # startupProbe anyway: normal boot still constructs authenticated clients and validates
          # read compatibility with the schema before binding its port. Five minutes (60 x 5s)
          # separates "still starting" from "wedged" without blunting steady-state detection.
          startupProbe:
            tcpSocket:
              port: api
            failureThreshold: 60
            periodSeconds: 5
          # httpGet /healthz, not tcpSocket: the port stays open even after FastMCP's
          # StreamableHTTPSessionManager task group wedges (see
          # haku/console/identity/fastmcp_adapter.py's `mcp_session_manager_liveness` docstring for
          # the upstream bug), so a bare TCP check never notices a replica stuck 500ing every /mcp
          # request. /healthz fails once that happens, so readiness pulls the replica out of the
          # Service quickly and liveness restarts it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp # writable scratch (/tmp) for the app
              mountPath: /tmp
            - name: config
              mountPath: /etc/haku-console/config
              readOnly: true
            - name: static-metadata
              mountPath: /etc/haku-console/static-metadata
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: haku-console-config
        - name: static-metadata
          configMap:
            name: haku-console-static-metadata
