# The Haku console: reviewed FastAPI API code plus a baked nginx static frontend.
# The console is the trusted outer shell — it serves config + the capability tier
# (launch-routine) and frames Haku's own UI (haku-ui) as a sandboxed cross-origin
# iframe. It holds NO haku-state git credential (feedback/trace writes moved into
# haku-ui). nginx serves the bundled SPA image and proxies API calls to localhost.
# Access is gated by Authentik (agentydragon-only) via the proxy outpost — the app
# has no native auth.
#
# Trust boundary: runs in its OWN `haku-console` namespace, NOT haku-sandbox. As
# reviewed/released ducktape code it sits outside Haku's RBAC (Haku can't read its
# secrets/logs or patch it) and outside the haku-egress-proxy egress fence (which keys
# on the haku-sandbox namespace) — so it gets ordinary egress and can later hold
# secrets Haku may not read. See haku/PLAN.md → "The agent-authored console". It
# still runs locked down (uid/gid 1000, non-root, no service-account token, all
# capabilities dropped). readOnlyRootFilesystem is intentionally NOT set: the aspect
# py_binary launcher materializes its venv on the rootfs at startup (same as
# grocy-mcp), so the root fs must be writable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-console
  namespace: haku-console
  labels:
    app.kubernetes.io/name: haku-console
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-console
    spec:
      automountServiceAccountToken: false
      # Don't inject the kubelet's {SVCNAME}_* service-link env vars: the haku-console
      # Service's HAKU_CONSOLE_PORT=tcp://<clusterIP>:8080 collides with the app's
      # HAKU_CONSOLE_ settings prefix (it parsed into the port:int field → crash).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: ghcr.io/agentydragon/haku-console:devel-20260705085652-82d4375 # {"$imagepolicy": "flux-system:haku-console"}
          imagePullPolicy: Always
          ports:
            - name: api
              containerPort: 8080
          env:
            # Capability tier: the launch-routine action. The console builds both the
            # (public) fire URL and the claude.ai/code page deep-link from this routine
            # (trigger) id; the bearer comes from the haku-console-only secret so Haku
            # can't read it. See haku/PLAN.md → "The agent-authored console".
            - name: HAKU_CONSOLE_LAUNCH_ROUTINE__ROUTINE_ID
              value: trig_0158pCMU1XBhoALBWikwSyK4
            - name: HAKU_CONSOLE_LAUNCH_ROUTINE__TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-routine-launch-token
                  key: token
            # Free-form UI (Phase 1b): the Authentik-gated origin of Haku's own UI
            # service (haku-sandbox). The console embeds it in a sandboxed cross-origin
            # iframe and sets a CSP frame-src for it; it never renders Haku's UI itself.
            # Lights up once the haku-ui workload serves (cluster/k8s/haku/workloads +
            # the haku-ui Authentik route). See haku/console/docs/containment.md.
            - name: HAKU_CONSOLE_HAKU_UI_URL
              value: https://haku-ui.allegedly.works
            - name: HAKU_CONSOLE_AUTH_ORIGIN
              value: https://auth.allegedly.works
            - name: HAKU_CONSOLE_MCP_APPROVAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-app
                  key: uri
            - name: HAKU_CONSOLE_AGENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-agent-api
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp # writable scratch (/tmp) for the app
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: static
          image: ghcr.io/agentydragon/haku-console-static:devel-20260705085601-82d4375 # {"$imagepolicy": "flux-system:haku-console-static"}
          imagePullPolicy: Always
          env:
            # The nginx entrypoint renders /etc/nginx/templates/default.conf.template
            # with these origins at startup, keeping frame-src environment-specific
            # while the console itself remains unframeable via frame-ancestors 'none'.
            - name: HAKU_CONSOLE_HAKU_UI_URL
              value: https://haku-ui.allegedly.works
            - name: HAKU_CONSOLE_AUTH_ORIGIN
              value: https://auth.allegedly.works
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # The SPA is baked into the image, but the nginx entrypoint still writes
            # the envsubst-rendered runtime config here before nginx starts.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
