apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-console-servicemonitor
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./cluster/k8s/haku/console/servicemonitor
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: haku-console # the Service whose `metrics` port this selects
    - name: monitoring-stack # the ServiceMonitor CRD
