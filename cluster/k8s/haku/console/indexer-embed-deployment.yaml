# The haku-indexer worker, embed role: drains the shared embedding queue with
# the same image as the chunk-role Deployment (indexer-deployment.yaml), so an
# embedder outage backs up one pod's queue without touching source sweeps or the
# Console perimeter.
#
# Replicas may overlap freely — with each other, and with console replicas of a
# release that still ran the loop: every drain claims its batch with
# `FOR UPDATE SKIP LOCKED`, so concurrent drains take disjoint batches and
# conflict-safe insertion keeps even a claimless legacy reader from publishing
# a conflicting vector.
#
# Narrow identity by design: no ServiceAccount token and nothing the chunk role
# holds beyond the shared haku_indexer database role — no Git credential slots
# and no registry ConfigMap. Its only extra surface is the embedder endpoint,
# which the chunk pod in turn does not carry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-indexer-embed
  namespace: haku-console
  labels:
    app.kubernetes.io/name: haku-indexer-embed
  annotations:
    secret.reloader.stakater.com/reload: haku-console-db-indexer
spec:
  replicas: 1
  strategy:
    # A replacement that cannot start (schema-incompatible image, bad config) crash-loops
    # while the previous replica keeps draining the queue; batch claims make the surge
    # overlap safe.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-indexer-embed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-indexer-embed
    spec:
      # Same zone as the console's Postgres (cnpg_conventions R5). The embedder hop to
      # Ollama on wyrm2 stays cross-zone either way; batch embedding tolerates it.
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: indexer
          image: ghcr.io/agentydragon/haku-indexer:devel-20260828140953-647c0d8 # {"$imagepolicy": "flux-system:haku-indexer"}
          imagePullPolicy: Always
          args: ["--role=embed"]
          env:
            # The narrow haku_indexer role (db/indexer-role-secret.yaml), never the
            # application owner: the worker cannot read the approval ledger, identity,
            # or OAuth state.
            - name: HAKU_INDEXER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: haku-console-db-indexer
                  key: DATABASE_URL
            # Where this role computes vectors: Ollama's OpenAI-compatible endpoint,
            # ordinary cluster egress. `model` is the index's `model_key` and must equal
            # the console API's — search joins vectors on it, so a mismatch writes a
            # space search never reads. No query instruction here: this role embeds
            # documents, which instruction-aware models take plain.
            - name: HAKU_INDEXER_EMBEDDER__BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434/v1"
            - name: HAKU_INDEXER_EMBEDDER__MODEL
              value: "qwen3-embedding:4b"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
