apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tana-agentydragon-gmail-com-account-pat
  namespace: haku-console
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-external-creds-secret-store
    kind: ClusterSecretStore
  target:
    name: haku-console-tana-pat
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: tana-agentydragon-gmail-com-account-pat
        property: token
