apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: haku-dashboard-sync
    namespace: haku-sandbox
    files:
      - sync/sync.sh
  - name: haku-dashboard-nginx
    namespace: haku-sandbox
    files:
      - nginx/default.conf
