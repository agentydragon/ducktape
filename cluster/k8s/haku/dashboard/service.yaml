apiVersion: v1
kind: Service
metadata:
  name: haku-dashboard
  namespace: haku-sandbox
  labels:
    app.kubernetes.io/name: haku-dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: haku-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
