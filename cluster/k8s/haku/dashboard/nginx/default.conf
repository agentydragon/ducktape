# Serve ONLY haku-state's dashboard/ directory — never the rest of the repo
# (items/, intake/, memory/, log/, .git). Haku publishes exactly what it writes
# under dashboard/.
server {
    listen 8080;
    server_name _;
    root /data/dashboard;
    index index.html;
    autoindex off;
    location / {
        try_files $uri $uri/ =404;
    }
}
