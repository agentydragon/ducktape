# Retain is deliberate: when an eight-hour sliding deadline expires, agent-sandbox v0.5.1 removes
# the Pod/Sandbox but leaves SandboxClaim Ready=False/ClaimExpired so info can explain what
# happened. Reap only this tool's labeled tombstones seven days after their last-renewed deadline;
# active claims have a future shutdownTime and cannot match.
apiVersion: kyverno.io/v2
kind: CleanupPolicy
metadata:
  name: haku-sandbox-claim-tombstones
  namespace: haku-sandbox
spec:
  schedule: "47 * * * *"
  match:
    any:
      - resources:
          kinds:
            - extensions.agents.x-k8s.io/v1beta1/SandboxClaim
          selector:
            matchLabels:
              app.kubernetes.io/managed-by: haku-console-sandbox-mcp
  conditions:
    all:
      - key: "{{ time_since('', '{{ target.spec.lifecycle.shutdownTime }}', '') }}"
        operator: GreaterThan
        value: 168h
