apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haku-console-sandbox
  namespace: haku-sandbox
  annotations:
    description: "Least-privilege backing authority for haku-console's autonomous reserve/exec/info tools. It may manage claims from the haku-bash pool, inspect their controller-owned Sandbox/Pod, and exec into the pod; it cannot create arbitrary Pods or mutate pool/template definitions. Application-side labels and pool checks narrow the handles further."
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
