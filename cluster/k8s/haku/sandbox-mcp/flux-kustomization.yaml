apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-sandbox-mcp-access
  namespace: flux-system
  annotations:
    description: "Dedicated ServiceAccount/RBAC and retained-claim janitor for haku-console's autonomous agent-sandbox tools; the haku-bash template and warm pool remain haku-state-owned."
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  path: ./cluster/k8s/haku/sandbox-mcp
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: haku-namespace
    - name: haku-console-namespace
    - name: agent-sandbox-controller
    - name: kyverno-policies
