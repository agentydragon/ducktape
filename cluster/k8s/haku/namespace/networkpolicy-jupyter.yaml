# Admit ingress to haku-jupyter ONLY from haku-ui pods. There is no public route to
# the sidecar at all (operator, 2026-08-01: "haku-ui can just proxy to it") — the ui
# backend reverse-proxies /jupyter/ to the Service, so auth rides haku-ui's existing
# Authentik front. haku-sandbox has default-allow ingress, and while jupyter holds no
# forward-auth header trust, an open in-cluster door to arbitrary code execution with
# Haku's git credential is a needlessly wide surface — hence this fence.
#
# Operator-owned (Haku has no netpol RBAC); selects the `app: haku-jupyter` label
# of Haku's Deployment (haku-state k8s/haku-jupyter).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: haku-jupyter-ingress-haku-ui-only
  namespace: haku-sandbox
spec:
  endpointSelector:
    matchLabels:
      app: haku-jupyter
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-sandbox
            app: haku-ui
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
