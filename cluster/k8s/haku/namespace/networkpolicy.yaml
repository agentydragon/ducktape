# One ingress boundary for the whole namespace: haku-sandbox is a single trust domain (Haku's code
# at Haku's privilege — operator ruling 2026-07-30), and the only way in from outside is the
# Authentik proxy outpost. Selecting every endpoint flips the namespace to default-deny ingress; the
# union of allows below is exactly {same-namespace, outpost}.
#
# What it protects: cross-namespace forgery of the X-authentik-username header haku-ui trusts, and
# the jupyter sidecar, an unauthenticated exec listener whose only legitimate caller is haku-ui's
# /jupyter/* reverse proxy (same namespace). In-namespace header forgery is a non-threat — same
# actor, nothing to gain over its own git credential.
#
# Kubelet probes and operator `kubectl port-forward` arrive via the host entity, which Cilium admits
# independently of these rules. A future cross-namespace consumer = one explicit fromEndpoints entry
# here.
#
# Egress is unchanged — the mitmproxy CCNP owns that direction.
# Operator-owned (Haku has no netpol RBAC). Security model: haku/docs/security.md.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: haku-sandbox-ingress
  namespace: haku-sandbox
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-sandbox
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            app.kubernetes.io/name: authentik
