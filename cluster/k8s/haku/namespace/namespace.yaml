apiVersion: v1
kind: Namespace
metadata:
  name: haku-sandbox
  labels:
    goldilocks.fairwinds.com/enabled: "true"
    goldilocks.fairwinds.com/vpa-update-mode: "auto"
    name: haku-sandbox
    # Pin the cluster-default (Talos) baseline profile explicitly. The Haku egress fence
    # depends on it: baseline forbids hostNetwork/hostPort/host*, which is what stops a
    # pod (Haku has full CRUD here) from escaping the namespace-scoped force-proxy CCNP
    # via the host netns. Making it a visible label documents that load-bearing assumption
    # and stops it silently drifting to privileged. See haku/workspaces/sandboxtemplate-haku.yaml.
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    # RequestsOnly — VPA scales limits in proportion to requests, so a low
    # steady-state recommendation can collapse a limit below what cold start
    # needs (2026-08-09 LiteLLM outage). Limits stay as declared here.
    goldilocks.fairwinds.com/vpa-resource-policy: >
      {"containerPolicies": [{"containerName": "*", "controlledValues": "RequestsOnly"}]}
