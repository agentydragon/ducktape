apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-mailbox
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: forgejo-images
      namespace: ducktape-flux
    - name: haku-mailbox-namespace
      namespace: ducktape-flux
    - name: haku-mailbox-db
      namespace: ducktape-flux
    - name: cert-manager
      namespace: ducktape-flux
    - name: agent-machine-access-tf
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: cert-manager-issuer-config
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/haku/mailbox/app
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: haku-mailbox-app
    namespace: ducktape-flux
  timeout: 5m
  wait: true
