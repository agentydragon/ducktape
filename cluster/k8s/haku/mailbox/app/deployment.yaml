# Stalwart mailserver: haku's mailbox (haku@allegedly.works), receive-only.
# Haku is a mail *user*, never the server admin: all policy (the SPF-gated
# sender whitelist, listeners, the OIDC directory) is the operator-owned
# provisioning plan mounted into this Pod. An init container applies it with a
# temporary fallback admin before production starts. Authentication is
# exclusively Authentik OIDC bearer tokens (the stalwart-haku provider); no
# mailbox password exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-mailbox
  namespace: haku-mailbox
  labels:
    app.kubernetes.io/name: haku-mailbox
  annotations:
    # Restart on rotation of the mounted STARTTLS certificate and DB
    # credentials so the normal server re-reads them.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-mailbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-mailbox
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        # OVH-only resilience: inbound mail must not depend on Proxmox, and the
        # CNPG store is pinned to hil-ovh — co-locate with it (same pin as
        # other OVH-pinned apps, e.g. paperless).
        topology.kubernetes.io/zone: hil-ovh
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: initialize
          image: ghcr.io/agentydragon/stalwart:devel-20260712224645-ee1a7eb # {"$imagepolicy": "flux-system:stalwart"}
          command: ["/bin/sh", "/etc/stalwart/initialize.sh"]
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: STALWART_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-mailbox-db-app
                  key: password
            - name: STALWART_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-mailbox-admin
                  key: password
            - name: STALWART_PUBLIC_URL
              value: https://haku-mailbox.allegedly.works
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
      containers:
        - name: stalwart
          # In-repo repack of stalwartlabs/stalwart with stalwart-cli layered
          # in (//cluster/k8s/haku/mailbox/image) — upstream ships the CLI
          # only as a distroless image, unusable from the pod. Published by
          # the push-images workflow; Flux image automation tracks the tag
          # (the initial placeholder resolves after the first devel push).
          image: ghcr.io/agentydragon/stalwart:devel-20260712224645-ee1a7eb # {"$imagepolicy": "flux-system:stalwart"}
          command: ["/usr/local/bin/stalwart", "--config", "/etc/stalwart/config.json"]
          # Surface crash output in pod status (.lastState.terminated.message):
          # pods/log in this namespace is RBAC-fenced to the operator, but pod
          # status is diagnostics-readable — without this, an initialization failure
          # is a black box to agent sessions.
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: smtp
              containerPort: 2525
            - name: http
              containerPort: 8080
            - name: imap
              containerPort: 1143
          env:
            - name: STALWART_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-mailbox-db-app # CNPG-generated app credentials
                  key: password
            - name: STALWART_PUBLIC_URL
              value: https://haku-mailbox.allegedly.works
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Loopback exec probes avoid the kubelet-to-pod-IP path that caused
          # healthy Stalwart endpoints to reset and be SIGTERMed repeatedly.
          startupProbe:
            exec:
              command: ["curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz/live"]
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz/live"]
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz/ready"]
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: haku-mailbox-config
            defaultMode: 0555
        - name: tls
          secret:
            secretName: mx-allegedly-works-tls
        - name: tmp
          emptyDir: {}
