apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace transformer: haku-mail-token.sops.yaml targets flux-system (the
# rotator's publication point); everything else carries namespace: haku-mailbox
# explicitly.
resources:
  - certificate.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - haku-mailbox-admin.sops.yaml
  - haku-mail-token.sops.yaml
  - haku-mail-token-eso.yaml
configMapGenerator:
  # Hash-suffixed name: config/plan/wrapper changes roll the deployment.
  - name: haku-mailbox-config
    namespace: haku-mailbox
    files:
      - config.json
      - mailbox-plan.ndjson.tmpl
      - bootstrap-and-run.sh
