# Two internal Services on purpose: SMTP is reachable only from the per-node
# TCP ingress DaemonSet, while HTTP and IMAP keep their existing consumers.
# Public port 25 is provided by smtp-ingress.yaml's hostPort, not externalIPs:
# cross-node externalIP forwarding would SNAT the sending MTA and break SPF.
apiVersion: v1
kind: Service
metadata:
  name: haku-mailbox-smtp
  namespace: haku-mailbox
  annotations:
    description: >-
      Cluster-internal SMTP backend for the per-node haku-mailbox-smtp-ingress
      proxies. The proxies carry the sending MTA address in PROXY protocol so
      Stalwart can evaluate SPF against the real peer.
spec:
  selector:
    app.kubernetes.io/name: haku-mailbox
  ports:
    - name: smtp
      port: 2525
      targetPort: smtp
---
apiVersion: v1
kind: Service
metadata:
  name: haku-mailbox
  namespace: haku-mailbox
  annotations:
    description: >-
      Stalwart's cluster-internal listeners: HTTP (JMAP + management API,
      exposed publicly only via the cluster-gateway HTTPRoute
      haku-mailbox.allegedly.works) and plaintext IMAP for haku-sandbox
      clients (himalaya) — no route, no externalIPs, OAUTHBEARER-only auth.
spec:
  selector:
    app.kubernetes.io/name: haku-mailbox
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: imap
      port: 1143
      targetPort: imap
