# Two Services on purpose: externalIPs exposes EVERY port of a Service on the
# public node IPs, so SMTP gets its own externalIPs Service while the HTTP
# listener (JMAP + management API) stays ClusterIP-only, reachable solely
# through the cluster-gateway HTTPRoute.
apiVersion: v1
kind: Service
metadata:
  name: haku-mailbox-smtp
  namespace: haku-mailbox
  annotations:
    description: >-
      Inbound SMTP entrypoint: externalIPs on the public OVH gateway nodes make
      port 25 on any of them DNAT (via Cilium kube-proxy replacement) to the
      Stalwart pod, so MX -> mx.allegedly.works (the wildcard/apex A records)
      works regardless of which node the pod runs on.
spec:
  selector:
    app.kubernetes.io/name: haku-mailbox
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
  # The same public-OVH-node roster as public_gateway_ips in
  # tf/gitops/dns-records/main.tf (externalIPs accepts only literal IPs, so the
  # list is duplicated); cluster/validation/test_dns_records.py pins both
  # copies to the nebula-mesh.json roster.
  externalIPs:
    - 147.135.37.175 # ovh-ns102453
    - 147.135.39.162 # ovh-ns103656
    - 147.135.39.176 # ovh-ns103711
    - 147.135.104.5 # ovh-ns104952
    - 147.135.104.16 # ovh-ns104963
---
apiVersion: v1
kind: Service
metadata:
  name: haku-mailbox
  namespace: haku-mailbox
  annotations:
    description: >-
      Stalwart's cluster-internal listeners: HTTP (JMAP + management API,
      exposed publicly only via the cluster-gateway HTTPRoute
      haku-mailbox.allegedly.works) and plaintext IMAP for haku-sandbox
      clients (himalaya) — no route, no externalIPs, OAUTHBEARER-only auth.
spec:
  selector:
    app.kubernetes.io/name: haku-mailbox
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: imap
      port: 1143
      targetPort: imap
