apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-mailbox-bootstrap
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/haku/mailbox/bootstrap
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: haku-mailbox-namespace
    - name: haku-mailbox-db
    - name: cert-manager
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
