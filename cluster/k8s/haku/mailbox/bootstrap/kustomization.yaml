apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate.yaml
  - haku-mailbox-admin.sops.yaml
  - bootstrap-job.yaml
configMapGenerator:
  - name: haku-mailbox-bootstrap-config
    namespace: haku-mailbox
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - bootstrap.sh
      - config.json
      - mailbox-plan.ndjson
