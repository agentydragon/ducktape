apiVersion: batch/v1
kind: Job
metadata:
  name: haku-mailbox-bootstrap
  namespace: haku-mailbox
  annotations:
    description: Seeds an empty Stalwart datastore before the production Flux layer is applied.
  labels:
    app.kubernetes.io/name: haku-mailbox-bootstrap
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-mailbox-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bootstrap
          image: ghcr.io/agentydragon/stalwart:devel-20260702101457-150370a # {"$imagepolicy": "flux-system:stalwart"}
          command: ["/bin/sh", "/etc/stalwart/bootstrap.sh"]
          env:
            - name: STALWART_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-mailbox-db-app
                  key: password
            - name: STALWART_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-mailbox-admin
                  key: password
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: haku-mailbox-bootstrap-config
            defaultMode: 0555
        - name: tls
          secret:
            secretName: mx-allegedly-works-tls
        - name: tmp
          emptyDir: {}
