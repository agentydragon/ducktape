apiVersion: v1
kind: Namespace
metadata:
  # The Haku mailbox's own trusted namespace — deliberately NOT haku-sandbox.
  # The Stalwart mailserver here enforces the inbound-email perimeter (DMARC-
  # gated sender whitelist, operator-owned provisioning plan), so it sits
  # OUTSIDE Haku's RBAC and OUTSIDE the haku-egress-proxy egress fence: Haku must
  # not be able to patch the server, edit the whitelist, read the admin/TLS
  # secrets, or touch the CNPG store. Haku is a mail *user* only, authenticated
  # via its Authentik-issued bearer. See cluster/k8s/haku/mailbox/README.md.
  name: haku-mailbox
  labels:
    goldilocks.fairwinds.com/enabled: "true"
    goldilocks.fairwinds.com/vpa-update-mode: "auto"
    name: haku-mailbox
    # The per-public-node SMTP ingress must bind hostPort 25. Pod Security's
    # baseline profile forbids every hostPort, so this trusted, operator-only
    # namespace needs privileged admission even though its workloads retain
    # restrictive container security contexts and Cilium policies.
    pod-security.kubernetes.io/enforce: privileged
