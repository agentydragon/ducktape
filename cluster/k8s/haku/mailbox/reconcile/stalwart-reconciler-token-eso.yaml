# Mirror the rotator-published reconciler JWT into the trusted mailbox
# namespace. The token never enters haku-sandbox.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: stalwart-reconciler-token
spec:
  namespaces:
    - haku-mailbox
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      name: kubernetes-flux-system-secret-store
      kind: ClusterSecretStore
    target:
      name: stalwart-reconciler-token
    data:
      - secretKey: jwt
        remoteRef:
          key: stalwart-reconciler-token
          property: jwt
