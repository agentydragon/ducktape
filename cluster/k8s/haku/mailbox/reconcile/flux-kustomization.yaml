apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-mailbox-reconcile
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/haku/mailbox/reconcile
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: haku-mailbox
    - name: agent-machine-access-tf
    - name: authentik-jwt-rotation
    - name: external-secrets-config
