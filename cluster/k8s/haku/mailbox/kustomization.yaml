apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace transformer: haku-mail-token.sops.yaml targets flux-system (the
# rotator's publication point); everything else carries namespace: haku-mailbox
# explicitly.
resources:
  # cdk8s-generated (cluster/cdk8s/haku/mailbox.py) -- see cluster/docs/cdk8s.md.
  - haku-mailbox.k8s.yaml
  - haku-mailbox-admin.sops.yaml
  - haku-mail-token.sops.yaml
  # Hand-written: no ClusterExternalSecret binding exists for cdk8s yet.
  - haku-mail-token-eso.yaml
components:
  - ./image-pins
configMapGenerator:
  - name: haku-mailbox-config
    namespace: haku-mailbox
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - initialize.sh
      - config.json
      - mailbox-plan.ndjson
  - name: haku-mailbox-smtp-ingress
    namespace: haku-mailbox
    files:
      - nginx.conf
