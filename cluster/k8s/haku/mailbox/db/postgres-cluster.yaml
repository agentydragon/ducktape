# Store for the Stalwart mailserver (data + blobs + search + settings all live
# in Postgres — no PVC on the app; see ../README.md). OVH-HA CNPG profile per
# cluster/docs/cnpg_conventions.md: mail must stay OVH-resilient.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: haku-mailbox-db
  namespace: haku-mailbox
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  # CNPG 1.27+ kills isolated primaries by default (liveness probe).
  # Disable to prevent false positives from transient network blips.
  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    # This instance currently has a local PV on a control plane. Keep it
    # restartable there until its replica migration, but prefer workers for any
    # placement not constrained by that PV.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  storage:
    storageClass: local-path-ovh
    size: 10Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: stalwart
      owner: stalwart
      # CNPG auto-generates credentials in secret haku-mailbox-db-app
