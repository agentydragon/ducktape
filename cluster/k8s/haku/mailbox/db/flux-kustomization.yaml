apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-mailbox-db
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/haku/mailbox/db
  prune: true
  wait: true
  sourceRef:
    kind: ExternalArtifact
    name: haku-mailbox-db
    namespace: ducktape-flux
  dependsOn:
    - name: haku-mailbox-namespace
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
