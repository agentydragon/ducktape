# Consumer-owned identity and store for the source-approved Anthropic Haku
# credential used by the cloud-agent Terraform runner.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-anthropic-haku-reader
  namespace: flux-system
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: llm-anthropic-haku
  namespace: flux-system
spec:
  provider:
    kubernetes:
      server:
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt }
      auth:
        serviceAccount: { name: llm-anthropic-haku-reader }
      remoteNamespace: ducktape-flux
