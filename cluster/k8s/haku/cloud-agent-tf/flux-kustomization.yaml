apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-cloud-agent
  namespace: ducktape-flux
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/haku/cloud-agent-tf
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    # Decrypt the SOPS Secrets in this dir (anthropic-api-key, haku-kube-token);
    # without this Flux applies the raw ENC[...] ciphertext and the runner gets a
    # bogus key/token (401).
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: haku-cloud-agent
      namespace: flux-system
  dependsOn:
    - name: external-creds
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: tofu-controller
      namespace: ducktape-flux
    - name: tofu-state-db
      namespace: ducktape-flux
    # The agent reaches the cluster through this MCP; its first deployment run
    # needs it serving.
    - name: kubectl-machine-mcp
      namespace: ducktape-flux
