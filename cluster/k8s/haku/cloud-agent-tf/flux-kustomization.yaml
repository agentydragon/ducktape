apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-cloud-agent
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/haku/cloud-agent-tf
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Decrypt the SOPS Secrets in this dir (anthropic-api-key, haku-kube-token);
  # without this Flux applies the raw ENC[...] ciphertext and the runner gets a
  # bogus key/token (401).
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: haku-cloud-agent
      namespace: flux-system
  dependsOn:
    - name: tofu-controller
    - name: tofu-state-db
    # The agent reaches the cluster through this MCP; its first deployment run
    # needs it serving.
    - name: kubectl-machine-mcp
    # The tofu root now hard-reads gmail-labeling/haku-gmail-labeling-token (the
    # gmail-labeling MCP bearer); this kustomization applies it, so it reconciles first.
    - name: gmail-labeling
