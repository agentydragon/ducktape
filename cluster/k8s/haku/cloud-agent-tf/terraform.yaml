apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: haku-cloud-agent
  namespace: flux-system
spec:
  interval: 15m
  refreshBeforeApply: true
  path: ./tf/gitops/haku-cloud-agent
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  serviceAccountName: tf-runner
  approvePlan: "auto"

  # Publish the provisioned resource IDs (agent_id, deployment_id, environment_id,
  # vault_id — see tf/gitops/haku-cloud-agent/outputs.tf) into an in-cluster Secret
  # so they have one canonical, machine-readable source instead of being copy-pasted
  # literals that drift. The IDs are identifiers, not credentials; the Secret is
  # gated by flux-system RBAC. Consumers: the cloud-agent runbook reads deployment_id
  # from here for `ant beta:deployments run` (a future in-cluster runner would read it
  # the same way). Empty `outputs` => all four outputs are written.
  writeOutputsToSecret:
    name: haku-cloud-agent-ids

  # The static_bearer credential's haku-k8s JWT is read in-cluster by the tofu
  # root itself (kubernetes_secret_v1 data source from the haku-cloud-kube-token
  # Secret; see tf/gitops/haku-cloud-agent/main.tf) — not via spec.vars, whose
  # valueFrom the tf-controller doesn't resolve here.

  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "haku_cloud_agent"
      }
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tofu-state-db-credentials
              key: password
        # The claude-managed-agents provider reads ANTHROPIC_API_KEY directly.
        # Dedicated, spend-capped Anthropic workspace; regular key, not admin.
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: haku-cloud-anthropic-api-key
              key: api-key
