apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: haku-cloud-agent
  namespace: flux-system
spec:
  interval: 15m
  refreshBeforeApply: true
  path: ./tf/gitops/haku-cloud-agent
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  serviceAccountName: tf-runner
  approvePlan: "auto"

  # haku-k8s Authentik JWT (rotated by authentik-jwt-rotation into the
  # haku-cloud-kube-token Secret) + its exp epoch. tofu writes the token into the
  # Anthropic vault as a static_bearer credential; the exp drives the write-only
  # token_wo_version so each rotation re-sends. Passed via the controller's native
  # vars (NOT runner TF_VAR_* env — the tf-controller forbids that). See the root's main.tf.
  vars:
    - name: haku_kube_token
      valueFrom:
        secretKeyRef:
          name: haku-cloud-kube-token
          key: jwt
    - name: haku_kube_token_wo_version
      valueFrom:
        secretKeyRef:
          name: haku-cloud-kube-token
          key: token-exp

  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "haku_cloud_agent"
      }
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tofu-state-db-credentials
              key: password
        # The claude-managed-agents provider reads ANTHROPIC_API_KEY directly.
        # Dedicated, spend-capped Anthropic workspace; regular key, not admin.
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: haku-cloud-anthropic-api-key
              key: api-key
