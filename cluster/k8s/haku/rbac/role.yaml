# Haku's only write-capable RBAC. Deliberately an explicit resource allowlist with NO
# httproutes/gateways/networkpolicies — Haku must never open a public door or loosen its
# own fences. Invariants + full enforcement inventory: haku/docs/security.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haku-sandbox-admin
  namespace: haku-sandbox
  annotations:
    description: "Full CRUD within the haku-sandbox compute sandbox (mirrors claude-sandbox-admin): pods/log/exec/attach/portforward, services, configmaps, secrets, PVCs, events, plus apps and batch workloads. portforward (like exec/attach) is for in-namespace debugging — e.g. curling a haku-ui pod's HTTP directly to reproduce a routing bug; it opens no public door. The namespace is network-isolated behind its own mitmproxy; secrets here are still expected to hold only read-only credentials Haku may fully use. Security model: haku/docs/security.md."
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/attach
      - pods/portforward
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - events
    verbs: ["*"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["*"]

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["*"]
