apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haku-sandbox-admin
  namespace: haku-sandbox
  annotations:
    description: "Full CRUD within the haku-sandbox compute sandbox (mirrors claude-sandbox-admin): pods/log/exec/attach, services, configmaps, secrets, PVCs, events, plus apps and batch workloads. The namespace is network-isolated behind its own mitmproxy; secrets here are still expected to hold only read-only credentials Haku may fully use."
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/attach
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - events
    verbs: ["*"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["*"]

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["*"]
