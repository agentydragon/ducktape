# Haku's only write-capable RBAC. Deliberately an explicit resource allowlist with NO
# httproutes/gateways/networkpolicies — Haku must never open a public door or loosen its
# own fences. Invariants + full enforcement inventory: haku/docs/security.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haku-sandbox-admin
  namespace: haku-sandbox
  annotations:
    description: "Full CRUD within the haku-sandbox compute sandbox (mirrors claude-sandbox-admin): pods/log/exec/attach, services, configmaps, secrets, PVCs, events, plus apps and batch workloads. The namespace is network-isolated behind its own mitmproxy; secrets here are still expected to hold only read-only credentials Haku may fully use. Security model: haku/docs/security.md."
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/attach
      - pods/portforward
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - events
    verbs: ["*"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["*"]

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["*"]

  # Direct kubectl parity for the semantic haku_sandbox MCP tools: Haku may create/renew/delete
  # claims with its own OIDC identity and inspect what the controller assigned. Pool/template
  # definitions stay GitOps-owned by haku-state; Sandboxes stay controller-owned.
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources:
      - sandboxclaims
    verbs: ["*"]

  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources:
      - sandboxtemplates
      - sandboxwarmpools
    verbs: ["get", "list", "watch"]

  - apiGroups: ["agents.x-k8s.io"]
    resources:
      - sandboxes
    verbs: ["get", "list", "watch"]
