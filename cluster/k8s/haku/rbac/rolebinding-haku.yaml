# Bind Haku's shared compute identity to haku-sandbox-admin — full CRUD in haku-sandbox.
# Used by the sandbox exec-target pods, the managed-agent worker, and the Console-owned
# Claude runner alike.
#
# TWO SUBJECTS, ONE GRANT. A ServiceAccount is namespaced, so Haku's identity exists once per
# namespace it runs a pod in; its *permissions* do not. Both subjects sit on this binding rather
# than parallel roles, so "what can Haku do to the cluster" has one answer and one place to change.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haku
  namespace: haku-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haku-sandbox-admin # cluster/k8s/haku/rbac/role.yaml
subjects:
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  # cluster/k8s/haku/claude-namespace/serviceaccount.yaml — same agent, Console-owned runtime.
  - kind: ServiceAccount
    name: haku-claude
    namespace: haku-claude-sandbox
