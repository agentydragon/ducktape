apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku
  namespace: haku-sandbox
  annotations:
    description: >-
      Haku's own compute identity in haku-sandbox — carried by whatever Haku workload runs
      here: the sandbox exec-target pods the provisioning MCP hands out
      (cluster/k8s/haku/workspaces/) and the managed-agent worker
      (cluster/k8s/haku/managed-agent/). Bound to haku-sandbox-admin (full CRUD in this
      namespace) by rolebinding-haku.yaml, so `kubectl` works out of the box. Deliberately
      NOT tied to one runtime — it's Haku operating its own compute; the exec-target pods
      don't run an agent harness. cluster-diagnostics read is a follow-up.
