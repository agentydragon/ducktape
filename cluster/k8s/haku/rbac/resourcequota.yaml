# Shared by everything in haku-sandbox: the managed-agent worker,
# haku-ui, AND the sandbox warm pool (cluster/k8s/haku/workspaces/) — a claimed box runs a
# LOCAL Bazel build of haku-state (no RBE; --spawn_strategy=local), so it's sized like the
# haku-ci runner (req 1 / limit 3 CPU, 2/6Gi) rather than a thin exec target. The pool
# folding in is why this is bigger than a plain agent namespace; bump further only if warm
# replicas or concurrent claims grow. The LimitRange (max pod 4 CPU / 8Gi) still caps any
# single pod.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: haku-sandbox-quota
  namespace: haku-sandbox
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "20"
    services: "15"
    configmaps: "30"
    persistentvolumeclaims: "18"
    requests.storage: 140Gi
