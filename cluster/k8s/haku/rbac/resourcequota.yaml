apiVersion: v1
kind: ResourceQuota
metadata:
  name: haku-sandbox-quota
  namespace: haku-sandbox
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
    services: "15"
    configmaps: "30"
    persistentvolumeclaims: "15"
    requests.storage: 20Gi
