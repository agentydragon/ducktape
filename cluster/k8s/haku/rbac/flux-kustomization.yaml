apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-rbac
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/haku/rbac
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: haku-rbac
    namespace: ducktape-flux
  timeout: 2m
  dependsOn:
    - name: haku-namespace
      namespace: ducktape-flux
