apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-ui-image-webhook
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: haku-state
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/haku/ui-image-webhook
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: haku-ui-image-webhook
    namespace: ducktape-flux
