apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: haku-ui-forgejo
  namespace: flux-system
spec:
  # Forgejo's `package` webhook (container-registry push) and `push` webhook (git push to
  # haku-state) — both provisioned by tf/gitops/haku-state — hit this receiver, which
  # force-reconciles every polling leg of the haku-ui deploy chain: registry scan →
  # ImageUpdateAutomation tag-bump commit → GitRepository fetch → workloads apply
  # (kustomize-controller reconciles on the new source artifact by itself, so it needs no
  # entry here). The receiver is `generic` (payload ignored), so either event pokes all
  # listed resources; the cross-pokes are harmless no-op reconciles.
  #
  # Operator-owned (NOT in Haku's haku-state): a Receiver lists resources to
  # force-reconcile, which the notification-controller patches cluster-wide — a
  # cross-namespace primitive we deliberately keep out of Haku's hands. The
  # image-automation objects it triggers are Haku's own (haku-sandbox), referenced
  # cross-namespace.
  #
  # type: generic — Flux has no Forgejo/Gitea receiver type, and Forgejo's HMAC headers
  # (X-Gitea-Signature / X-Hub-Signature-256) don't match generic-hmac's X-Signature.
  # Security is therefore the unguessable sha256(token) webhook path; a leaked URL only
  # triggers harmless re-scans/re-fetches. The token is the forgejo-webhook-token
  # Secret (flux-system), which the Forgejo webhook URLs also derive their path from.
  type: generic
  secretRef:
    name: forgejo-webhook-token
  resources:
    - apiVersion: image.toolkit.fluxcd.io/v1beta2
      kind: ImageRepository
      name: haku-ui
      namespace: haku-sandbox
    # haku-anki's registry scan rides the same package webhook.
    - apiVersion: image.toolkit.fluxcd.io/v1beta2
      kind: ImageRepository
      name: haku-anki
      namespace: haku-sandbox
    # ImageUpdateAutomation is NOT in notification-controller's defaultFluxAPIVersions
    # map, so the explicit apiVersion is load-bearing (an omitted apiVersion fails to
    # resolve), unlike the entries above/below where it's convention.
    - apiVersion: image.toolkit.fluxcd.io/v1beta2
      kind: ImageUpdateAutomation
      name: haku-ui
      namespace: haku-sandbox
    # The apply leg: fetch the tag-bump commit (and any haku-state push) immediately;
    # the haku-state-workloads Kustomization then reconciles off the fresh artifact.
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: haku-state
      namespace: flux-system
    # ImageUpdateAutomation's own git source. It clones directly when reconciling, but a
    # fresh artifact keeps anything else consuming this source current too.
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: haku-state-write
      namespace: haku-sandbox
