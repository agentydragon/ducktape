apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Forgejo API token Reflector mirrors into haku-ci's KEDA scaler. Split out of haku/managed-agent so haku-ci doesn't depend on the (parked) worker.
  name: haku-forgejo-tea
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: haku-rbac
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/haku/forgejo-tea
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: haku-forgejo-tea
    namespace: ducktape-flux
  timeout: 5m
  wait: true
