apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-agent-worker
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/haku/agent-worker
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: haku-worker
      namespace: haku-sandbox
  dependsOn:
    - name: haku-namespace
    - name: haku-rbac
    - name: haku-state # provides the haku-state-git-write secret in haku-sandbox
    - name: haku-egress-proxy # injects the egress proxy + CA the worker imports
