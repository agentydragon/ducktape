# Validator-owned credentials, ESO-generated once (plaid-mcp pattern).
#
# Haku's bearer for POST /jobs + DELETE /jobs/<id> — reflected into haku-sandbox.
# This token gates dispatch, not reads (Haku reads the DB with its read-only
# role); leaking it grants "submit prompts to the classifier gate", nothing
# more.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dispatcher-haku-token-generator
  namespace: haku-dispatch
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcher-haku-token
  namespace: haku-dispatch
spec:
  refreshInterval: 8760h
  target:
    name: dispatcher-haku-token
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: haku-sandbox
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: haku-sandbox
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: dispatcher-haku-token-generator
---
# HMAC key for per-job result tokens (haku/dispatch/result_tokens.py) —
# dispatcher-internal, never leaves this namespace; workers receive only
# derived per-job tokens.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dispatcher-result-hmac-generator
  namespace: haku-dispatch
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcher-result-hmac
  namespace: haku-dispatch
spec:
  refreshInterval: 8760h
  target:
    name: dispatcher-result-hmac
    template:
      data:
        secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: dispatcher-result-hmac-generator
