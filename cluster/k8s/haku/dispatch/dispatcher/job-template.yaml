# Reviewed Job template the dispatcher stamps into zone namespaces
# (haku/dispatch/k8s_jobs.py fills the placeholder tokens — nothing else
# about the pod is decided at runtime). Mounted via configMapGenerator; NOT a
# live manifest (kubeconform-excluded, cluster-manifest-ignored).
#
# Credential surface, deliberately: the per-job LiteLLM key and result token
# arrive only via the same-named per-job Secret (secretKeyRef/volume — pod
# specs are Haku-visible), the ServiceAccount has no k8s API grants and no
# mounted token, and there is no PVC (zone quota forbids them).
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: haku-zone-worker
    haku.allegedly.works/zone: ${ZONE}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-zone-worker
        haku.allegedly.works/zone: ${ZONE}
    spec:
      restartPolicy: Never
      serviceAccountName: haku-zone-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/agentydragon/haku-zone-worker:devel-20260705005142-42ce51e # {"$imagepolicy": "flux-system:haku-zone-worker"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: JOB_ID
              value: ${JOB_NAME}
            - name: MODEL
              value: ${MODEL}
            # Harness is zone-shaped: zai speaks the Anthropic wire shape via
            # Claude Code CLI (haku/dispatch/README.md → worker image).
            - name: HARNESS
              value: claude
            - name: DISPATCHER_URL
              value: http://dispatcher.haku-dispatch.svc.cluster.local:8000
            - name: ANTHROPIC_BASE_URL
              value: http://workers-litellm.haku-dispatch.svc.cluster.local:4000
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${JOB_NAME}
                  key: ANTHROPIC_AUTH_TOKEN
            - name: RESULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${JOB_NAME}
                  key: RESULT_TOKEN
          volumeMounts:
            - name: prompt
              mountPath: /prompt
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: prompt
          secret:
            secretName: ${JOB_NAME}
            items:
              - key: prompt.md
                path: prompt.md
