# Workers-LiteLLM proxy config (second-layer LiteLLM for Haku worker zones —
# haku/plans/multi_agent.md → key containment). Chains to the main LiteLLM via
# the litellm_proxy/ provider; the upstream credential per model group is that
# zone's static key (mounted only into this deployment). Workers authenticate
# with validator-minted per-job virtual keys whose model allowlist enforces
# their zone. Model names must match the main instance's
# cluster/k8s/litellm/app/proxy-config.yaml.
#
# oai zone models (*-chatgpt) are added when haku-sandbox-oai lands
# (build-order step 5).
#
# TODO(langfuse): point LANGFUSE_* at a dedicated haku-workers Langfuse project
# once it exists; until then only prometheus is wired.
model_list:
  - model_name: glm-4.5-anthropic
    litellm_params:
      model: litellm_proxy/glm-4.5-anthropic
      api_base: http://litellm.litellm.svc.cluster.local:4000
      api_key: os.environ/ZAI_ZONE_KEY
  - model_name: glm-4.5-air-anthropic
    litellm_params:
      model: litellm_proxy/glm-4.5-air-anthropic
      api_base: http://litellm.litellm.svc.cluster.local:4000
      api_key: os.environ/ZAI_ZONE_KEY
  - model_name: glm-4.6-anthropic
    litellm_params:
      model: litellm_proxy/glm-4.6-anthropic
      api_base: http://litellm.litellm.svc.cluster.local:4000
      api_key: os.environ/ZAI_ZONE_KEY
  - model_name: glm-4.7-anthropic
    litellm_params:
      model: litellm_proxy/glm-4.7-anthropic
      api_base: http://litellm.litellm.svc.cluster.local:4000
      api_key: os.environ/ZAI_ZONE_KEY
  - model_name: glm-5-anthropic
    litellm_params:
      model: litellm_proxy/glm-5-anthropic
      api_base: http://litellm.litellm.svc.cluster.local:4000
      api_key: os.environ/ZAI_ZONE_KEY
  - model_name: glm-5-turbo-anthropic
    litellm_params:
      model: litellm_proxy/glm-5-turbo-anthropic
      api_base: http://litellm.litellm.svc.cluster.local:4000
      api_key: os.environ/ZAI_ZONE_KEY
  - model_name: glm-5.1-anthropic
    litellm_params:
      model: litellm_proxy/glm-5.1-anthropic
      api_base: http://litellm.litellm.svc.cluster.local:4000
      api_key: os.environ/ZAI_ZONE_KEY
  - model_name: glm-5.2-anthropic
    litellm_params:
      model: litellm_proxy/glm-5.2-anthropic
      api_base: http://litellm.litellm.svc.cluster.local:4000
      api_key: os.environ/ZAI_ZONE_KEY
litellm_settings:
  drop_params: true
  callbacks:
    - prometheus
general_settings:
  store_model_in_db: false
