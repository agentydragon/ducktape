apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-workspace
  namespace: haku-sandbox
  annotations:
    description: >-
      In-cluster identity for Haku sandbox pods (the exec target the sandbox-provisioning
      MCP hands out) so `kubectl` works out of the box — Haku operates its own compute in
      haku-sandbox from inside the box. Bound to haku-sandbox-admin (full CRUD in
      haku-sandbox), the same pattern as the haku-managed-agent worker; cluster-diagnostics
      read is a follow-up. A dedicated SA (not the scanner's) keeps the sandbox identity
      semantically distinct. The pod template automounts its token.
