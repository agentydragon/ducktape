# The exact API access Console needs to hand out sandboxes from this pool, scoped to
# the pool namespace (derived from haku/sandbox/kubernetes_client.py): create/adopt +
# GC SandboxClaims, read the assigned Sandbox + Pod, and open exec sessions. No
# secrets, no other verbs. Lives in haku-sandbox (where the claims/pods are), applied
# by this pool kustomization; bound to Console's SA by haku-console-sandbox-rolebinding.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haku-console-sandbox
  namespace: haku-sandbox
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # `get` (not just `create`) is required: Console execs via kubernetes_asyncio,
  # whose helper (connect_get_namespaced_pod_exec) opens the stream with an HTTP
  # GET, so the apiserver authorizes it as `get pods/exec`. kubectl/client-go POST
  # and need `create`; keep both so either handshake style works.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
