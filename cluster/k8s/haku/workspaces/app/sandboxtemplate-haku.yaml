# The Haku sandbox: an in-cluster EXEC TARGET the sandbox-provisioning MCP hands
# out. The agent (Claude Code web / claude.ai / a managed agent) execs
# `bazel run //cli:...` / `bazel test //...` in here THROUGH the MCP, against a
# git-synced haku-state checkout. It does NOT run the agent loop. haku-state
# builds locally (no BuildBuddy/RBE — source never leaves the cluster), so the
# image is the local toolchain (../image/).
#
# Trust model (see haku/docs/security.md + haku-state improvements/
# sandbox-provisioning-mcp.md): the pool lives IN haku-sandbox, where Haku already has
# full CRUD — so Haku CAN edit this template and create pods/claims directly. That's
# safe because the network fence does NOT rest on pod-spec or namespace write-isolation:
# it's the cluster-scoped haku-sandbox-force-proxy CCNP (selects the namespace, enforced
# at the Cilium datapath) + the cluster-default baseline PodSecurity (forbids
# hostNetwork/hostPort/host*), both OUTSIDE Haku's RBAC (its haku-sandbox-admin Role has
# no cilium/networkpolicy/PSS verbs). Every pod in haku-sandbox is force-proxied and
# baseline-confined regardless of who wrote it, so Haku can't craft an un-fenced pod; and
# a Haku direct-exec ≈ the arbitrary bash exec_sandbox already grants. The MCP approval
# gate still governs the one party it must — the kubeconfig-less external harness (a plain
# claude.ai chat), which can only reach the box THROUGH the MCP.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: haku
  namespace: haku-sandbox
spec:
  # Unmanaged so the controller doesn't stamp its own RFC1918-blocking policy
  # that would fight the haku-egress-proxy fence applied at the namespace level
  # (the existing haku-sandbox-force-proxy CCNP).
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: haku-sandbox
    spec:
      # Controller defaults DNS to public resolvers only; restore cluster DNS so
      # forgejo-http.forgejo (module fetch + haku-state clone) resolves.
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: forgejo-images-creds
      # No region nodeSelector: any always-on node (hil/home/proxmox) is fine now that
      # /workspace is an emptyDir (below) rather than a region-pinned PVC. Roaming nodes
      # (iguana, rugged) stay excluded on their own via their existing
      # `node-role.kubernetes.io/roaming=true:NoSchedule` taint — no explicit exclusion
      # needed here.
      # TODO(operator, 2026-07-25): roaming nodes are often offline (see cluster/README.md
      # Node Types), so scheduling a sandbox there needs more thought (claim durability
      # across a node going away mid-session, re-provisioning UX) before adding the
      # toleration that would let a claim land on one. Not done as part of this change.
      # Haku's own k8s identity so `kubectl` works out of the box — Haku operates its
      # normal compute in haku-sandbox from here. The shared `haku` SA
      # (cluster/k8s/haku/rbac/serviceaccount-haku.yaml) is bound to haku-sandbox-admin
      # and is the same identity the managed-agent worker runs as.
      serviceAccountName: haku
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workspace
          image: git.allegedly.works/ducktape-ci/haku-sandbox-image:devel-20260725052952-ad87431 # {"$imagepolicy": "flux-system:haku-sandbox-image"}
          command: ["sleep", "infinity"]
          workingDir: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # The haku Forgejo account credential — ONE cred for BOTH in-cluster
            # git fetches (the ducktape_haku module git_override on every bazel
            # invocation + the haku-state clone), both over forgejo-http.forgejo.
            # The haku account can read both repos, so a single .netrc line covers
            # them. Same secret the managed-agent worker uses; minted into this
            # namespace by tf/gitops/haku-state (never baked, never hand-minted).
            # The per-claim haku-sandbox-setup.sh writes it into ~/.netrc.
            - name: HAKU_GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: haku-forgejo-git
                  key: username
            - name: HAKU_GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-forgejo-git
                  key: password
            # The haku-console agent bearer, so the CLI's console-MCP client
            # (`cli/console.py`, which prefers this env var over a kubectl secret
            # read) authenticates with no kubectl and no per-run token fetch —
            # `bazel run //cli:haku -- read --all` works out of the box. Same
            # credential the agent already drives the console with; keeping it on
            # the pod env grants no authority the sandbox lacked.
            - name: HAKU_CONSOLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haku-console-agent-api
                  key: token
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 6Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      # emptyDir, not a PVC: /workspace only ever holds a shallow (--depth 1) haku-state
      # git checkout, which haku-sandbox-setup.sh unconditionally fetch+reset --hard's on
      # every claim anyway — nothing here needs to survive a pod restart. Was a 30Gi
      # seaweedfs-ovh PVC; that added PVC provisioning/binding latency and made /workspace
      # a network filesystem for no benefit (Bazel's project-file scan intermittently
      # ENOENTs against SeaweedFS — see haku/plans/sandbox_run_runtime.md's "cold/warm
      # build cost" probe notes). sizeLimit kept at the same 30Gi ceiling as the old PVC
      # request.
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 30Gi
