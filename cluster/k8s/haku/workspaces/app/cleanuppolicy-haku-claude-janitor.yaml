# Backstop for Console-owned Claude sessions whose normal claim deletion did not run.
# Reap at the CR layer because the Agent Sandbox controller recreates deleted Pods.
#
# 7 days by creationTimestamp, matching the haku-sandbox janitor — not 24h. The console now
# slides each live session's `shutdownTime` forward on its lease heartbeat
# (haku/console/x/sandbox_claims.py `renew`), so the controller's own deadline is the fine-grained
# reaper: a tended session lives, and one nobody tends is reclaimed ~`session_ttl_seconds` after
# the last heartbeat. A 24h age fence would kill a healthy long-lived session it can't tell from a
# leak; this leaves that to the deadline and only catches a claim the controller never collected.
apiVersion: kyverno.io/v2
kind: CleanupPolicy
metadata:
  name: haku-claude-workspace-janitor
  namespace: haku-claude-sandbox
spec:
  schedule: "50 * * * *"
  match:
    any:
      - resources:
          kinds:
            - agents.x-k8s.io/v1beta1/Sandbox
            - extensions.agents.x-k8s.io/v1beta1/SandboxClaim
  conditions:
    all:
      - key: "{{ time_since('', '{{ target.metadata.creationTimestamp }}', '') }}"
        operator: GreaterThan
        value: 168h
