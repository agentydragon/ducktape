# Zero-replica pool for the #4943 GitHub egress spike: SandboxClaims require a warmPoolRef,
# and a claim with no warm pod available cold-starts from the pool's template — so this
# holds no idle pod and exists only so the operator's spike claim
# (haku/egress/docs/github_spike.md) has something to reference. Deleted with the template
# (see its CLEANUP marker).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: haku-egress-spike
  namespace: haku-sandbox
spec:
  replicas: 0
  updateStrategy:
    type: Recreate
  sandboxTemplateRef:
    name: haku-egress-spike
