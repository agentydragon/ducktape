# Claude Code runtime for the Console chat vertical slice. Session identity and a
# one-use runner bearer arrive declaratively through SandboxClaim.spec.env; the
# real Claude OAuth token never enters this namespace.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: haku-claude
  namespace: haku-claude-sandbox
spec:
  networkPolicyManagement: Unmanaged
  # Claims may inject the session id and one-use bridge token. Agent Sandbox v0.5.1
  # cold-starts claims with env, which is accepted for this first slice.
  envVarsInjectionPolicy: Allowed
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: haku-claude-runner
    spec:
      dnsPolicy: ClusterFirst
      # Haku's own Kubernetes identity, so `kubectl` works from the session the way it does
      # from a haku-sandbox exec target. A second SA object only because a ServiceAccount is
      # namespaced; the permissions are the haku SA's own binding, shared
      # (cluster/k8s/haku/rbac/rolebinding-haku.yaml).
      serviceAccountName: haku-claude
      automountServiceAccountToken: true
      enableServiceLinks: false
      # Deliberately outside haku-sandbox: Haku's general compute authority must not
      # inherit access to the Claude OAuth-substituting proxy — the CCNP that admits this
      # namespace to it keys on the namespace, so the split is the fence. Still deferred:
      # the Haku Console agent bearer and the general sandbox MCP integrations.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/agentydragon/haku-claude-runner:devel-20260815001308-086dc8f # {"$imagepolicy": "flux-system:haku-claude-runner"}
          imagePullPolicy: Always
          workingDir: /workspace
          env:
            - name: HAKU_AGENT_SDK_RUNNER_WEBSOCKET_URL
              value: ws://haku-console.haku-console.svc.cluster.local:9090/internal/claude/runner
            # The shared per-claim bootstrap (cluster/k8s/haku/workspaces/image/haku-sandbox-setup.sh,
            # baked into the runner image) writes ~/.netrc and checks haku-state out into /workspace,
            # so this session starts with Haku's manual instead of an empty directory. Same haku
            # Forgejo account the haku-sandbox exec target uses; minted by tf/gitops/haku-state and
            # reflected into this namespace, never hand-minted.
            - name: HAKU_GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: haku-forgejo-git
                  key: username
            - name: HAKU_GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-forgejo-git
                  key: password
            # No JVM in this image and no Bazel on this box, so the truststore step has nothing
            # to do. Explicit rather than probed, so a haku-sandbox image that lost its JVM still
            # fails loudly there.
            - name: HAKU_SETUP_BAZEL_TRUST
              value: "0"
            # The placeholder the egress proxy swaps for the real agentydragon-agent PAT on
            # exact GitHub hosts (claude-iron.yaml). Not a secret: on its own it authenticates
            # nothing, which is why it can sit in a manifest and in the agent's ~/.netrc.
            # `GITHUB_TOKEN` too, so API callers and `gh` find it where they look; the netrc
            # entry the bootstrap writes is what git uses.
            - name: HAKU_GITHUB_TOKEN
              value: proxy-haku-claude-github-placeholder
            - name: GITHUB_TOKEN
              value: proxy-haku-claude-github-placeholder
            # ducktape is a read-only source Haku consults. github.com is now reachable *from
            # the agent's shell*, which has the proxy in its environment — but not from the
            # bootstrap, which runs with pod env and deliberately has no proxy vars, so a clone
            # here would still fail. Left skipped so the bootstrap's exit status keeps meaning
            # "the workspace is ready"; the agent can clone it itself when it wants it.
            - name: HAKU_DUCKTAPE_SKIP
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/runner
            - name: claude-config
              mountPath: /claude-config
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: egress-proxy-ca
              mountPath: /egress-proxy-ca
              readOnly: true
      volumes:
        - name: home
          emptyDir: {}
        - name: claude-config
          emptyDir: {}
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir: {}
        - name: egress-proxy-ca
          configMap:
            name: haku-egress-proxy-ca-cert
