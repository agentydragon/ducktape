# Claude Code runtime for the Console chat vertical slice. Session identity and its exact-session
# Console bearer arrive declaratively through SandboxClaim.spec.env. The bearer is the Agent's own
# delegated authority for both the runner bridge and MCP, so Claude and its child commands
# intentionally inherit it. The real Claude OAuth token remains outside this namespace.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: haku-claude
  namespace: haku-runtime-sandbox
spec:
  networkPolicyManagement: Unmanaged
  # Claims inject the session id and exact-session bearer under the runner name plus an MCP alias
  # carrying the same value. Agent Sandbox v0.5.1 cold-starts claims with env. The alias keeps
  # old/new runner rolls compatible while Claude, curl, or another CLI use the same authority.
  envVarsInjectionPolicy: Allowed
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: haku-harness-runner
        haku.allegedly.works/access-profile-id: haku
    spec:
      dnsPolicy: ClusterFirst
      # Console maps the exact-session bearer to Haku's pinned profile and SARs Haku's canonical
      # compute identity before the separate proxy executes a request. No Kubernetes credential is
      # mounted into this pod.
      automountServiceAccountToken: false
      # Deliberately outside haku-sandbox: Haku's general compute authority must not inherit access
      # to the Claude OAuth-substituting proxy — the CCNP admits only this template's
      # Haku access-profile label within the shared runtime namespace.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/agentydragon/haku-harness-runner:devel-20260827005124-ad9239c # {"$imagepolicy": "flux-system:haku-harness-runner"}
          imagePullPolicy: Always
          # Harness selection is immutable for the runner lifetime. It is not inferred from the
          # native payload, which stays opaque inside the bridge envelope.
          args: ["--harness", "claude"]
          workingDir: /workspace
          env:
            - name: HAKU_AGENT_SDK_RUNNER_WEBSOCKET_URL
              value: ws://haku-console.haku-console.svc.cluster.local:9090/internal/claude/runner
            # The shared per-claim bootstrap (cluster/k8s/haku/workspaces/image/haku-sandbox-setup.sh,
            # baked into the runner image) writes ~/.netrc and checks haku-state out into /workspace,
            # so this session starts with Haku's manual instead of an empty directory. Same haku
            # Forgejo account the haku-sandbox exec target uses; minted by tf/gitops/haku-state and
            # reflected into this namespace, never hand-minted.
            - name: HAKU_GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: haku-forgejo-git
                  key: username
            - name: HAKU_GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-forgejo-git
                  key: password
            # No JVM in this image and no Bazel on this box, so the truststore step has nothing
            # to do. Explicit rather than probed, so a haku-sandbox image that lost its JVM still
            # fails loudly there.
            - name: HAKU_SETUP_BAZEL_TRUST
              value: "0"
            # The placeholder the egress proxy swaps for the real agentydragon-agent PAT on
            # exact GitHub hosts (claude-iron.yaml). Not a secret: on its own it authenticates
            # nothing, which is why it can sit in a manifest and in the agent's ~/.netrc.
            # `GITHUB_TOKEN` too, so API callers and `gh` find it where they look; the netrc
            # entry the bootstrap writes is what git uses.
            - name: HAKU_GITHUB_TOKEN
              value: github-token-placeholder
            - name: GITHUB_TOKEN
              value: github-token-placeholder
            # Inert placeholder the egress proxy swaps for aiquota's real shared
            # bearer, and only on aiquota.allegedly.works' two read paths
            # (claude-iron.yaml). Lets the agent read its own AI-usage quotas via
            # `curl -H "Authorization: Bearer $AIQUOTA_API_BEARER_TOKEN"
            # https://aiquota.allegedly.works/v1/quotas` without ever holding the key.
            - name: AIQUOTA_API_BEARER_TOKEN
              value: aiquota-token-placeholder
            # Inert placeholder the egress proxy swaps for the central ActivityWatch
            # read-only bearer, and only on activitywatch-read.allegedly.works' read
            # methods (claude-iron.yaml). Lets the agent read the operator's own
            # activity history via `curl -H "Authorization: Bearer $AW_READ_TOKEN"
            # https://activitywatch-read.allegedly.works/api/0/buckets/` without ever
            # holding the key.
            - name: AW_READ_TOKEN
              value: activitywatch-read-token-placeholder
            # ducktape is a read-only source Haku consults. github.com is reachable from the
            # agent's shell, which has the proxy in its environment, but not from the bootstrap,
            # which runs with pod env and deliberately has no proxy vars — so a clone here would
            # fail and cost the bootstrap's exit status its meaning. The agent clones it itself.
            - name: HAKU_DUCKTAPE_SKIP
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/runner
            - name: claude-config
              mountPath: /claude-config
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: egress-proxy-ca
              mountPath: /egress-proxy-ca
              readOnly: true
      volumes:
        - name: home
          emptyDir: {}
        - name: claude-config
          emptyDir: {}
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir: {}
        - name: egress-proxy-ca
          configMap:
            name: haku-egress-proxy-ca-cert
