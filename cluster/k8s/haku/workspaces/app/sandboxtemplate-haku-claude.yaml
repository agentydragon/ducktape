# Claude Code runtime for the Console chat vertical slice. Session identity and its exact-session
# Console bearer arrive declaratively through SandboxClaim.spec.env. The bearer is the Agent's own
# delegated authority for both the runner protocol and MCP, so Claude and its child commands
# intentionally inherit it. The real Claude OAuth token remains outside this namespace.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: haku-claude
  namespace: haku-runtime-sandbox
spec:
  networkPolicyManagement: Unmanaged
  # Claims inject the session id and the exact-session bearer. Agent Sandbox v0.5.1 cold-starts
  # claims with env; Claude, curl, or another CLI in the sandbox use the same authority.
  envVarsInjectionPolicy: Allowed
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: haku-harness-runner
        haku.allegedly.works/access-profile-id: haku
    spec:
      dnsPolicy: ClusterFirst
      # Console maps the exact-session bearer to Haku's pinned profile and SARs Haku's canonical
      # compute identity before the separate proxy executes a request. No Kubernetes credential is
      # mounted into this pod.
      automountServiceAccountToken: false
      # Deliberately outside haku-sandbox: Haku's general compute authority must not inherit access
      # to the Claude OAuth-substituting proxy — the CCNP admits only this template's
      # Haku access-profile label within the shared runtime namespace.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/agentydragon/haku-harness-runner:devel-20260830002452-45ba709 # {"$imagepolicy": "flux-system:haku-harness-runner"}
          imagePullPolicy: Always
          # Harness selection is immutable for the runner lifetime. It is not inferred from the
          # native payload, which stays opaque inside the runner protocol envelope.
          args: ["--harness", "claude"]
          workingDir: /workspace
          env:
            - name: HAKU_RUNNER_WEBSOCKET_URL
              value: ws://haku-console.haku-console.svc.cluster.local:9090/internal/claude/runner
            # CLEANUP(added 2026-08-29): pre-rename spelling for runner images that predate
            # HAKU_RUNNER_WEBSOCKET_URL; drop once the pinned haku-harness-runner image reads the
            # new name — one release after this template and the image converge.
            - name: HAKU_AGENT_SDK_RUNNER_WEBSOCKET_URL
              value: ws://haku-console.haku-console.svc.cluster.local:9090/internal/claude/runner
            # The shared per-claim bootstrap (cluster/k8s/haku/workspaces/image/haku-sandbox-setup.sh,
            # baked into the runner image) writes ~/.netrc and checks haku-state out into /workspace,
            # so this session starts with Haku's manual instead of an empty directory. The colocated
            # egress fence replaces this inert password only in Authorization headers for the approved
            # Forgejo origins; the real haku credential stays in Console.
            - name: HAKU_GIT_USERNAME
              value: haku
            - name: HAKU_GIT_PASSWORD
              value: haku-forgejo-token-placeholder
            # No JVM in this image and no Bazel on this box, so the truststore step has nothing
            # to do. Explicit rather than probed, so a haku-sandbox image that lost its JVM still
            # fails loudly there.
            - name: HAKU_SETUP_BAZEL_TRUST
              value: "0"
            # The placeholder the colocated Console egress fence swaps for the real agentydragon-agent
            # PAT on exact GitHub hosts (the `github-bot` credential in haku-console config.yaml's
            # egress_decide). Not a secret: on its own it authenticates nothing, which is why it can
            # sit in a manifest and in the agent's ~/.netrc. `GITHUB_TOKEN` too, so API callers and
            # `gh` find it where they look; the netrc entry the bootstrap writes is what git uses.
            - name: HAKU_GITHUB_TOKEN
              value: github-token-placeholder
            - name: GITHUB_TOKEN
              value: github-token-placeholder
            # The runner's model access (ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN/ANTHROPIC_MODEL) and
            # its GitHub identity are injected declaratively by Console from config.yaml's claude_code
            # implementation (haku/console/config.py). The AIQuota and ActivityWatch read tokens the
            # iron fence used are deferred from this reroute — see PR — pending an ESO source.
            # ducktape is a read-only source Haku consults. The bootstrap intentionally skips this
            # optional source; the agent clones it itself with the launch-selected proxy when needed.
            - name: HAKU_DUCKTAPE_SKIP
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/runner
            - name: claude-config
              mountPath: /claude-config
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: egress-proxy-ca
              mountPath: /egress-proxy-ca
              readOnly: true
      volumes:
        - name: home
          emptyDir: {}
        - name: claude-config
          emptyDir: {}
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir: {}
        - name: egress-proxy-ca
          configMap:
            name: haku-egress-proxy-ca-cert
