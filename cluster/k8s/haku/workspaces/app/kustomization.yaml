apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - forgejo-images-creds-eso.yaml
  - activitywatch-read-token-eso.yaml
  - sandboxtemplate-haku.yaml
  - sandboxwarmpool-haku.yaml
  - cleanuppolicy-haku-janitor.yaml
  # Cross-namespace RBAC lives here rather than under a namespace-transforming
  # workload kustomization. Console's exec-target sandbox bindings live in haku-sandbox.
  - haku-console-sandbox-role.yaml
  - haku-console-sandbox-rolebinding.yaml
