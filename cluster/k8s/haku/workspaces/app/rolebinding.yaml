# Grants the Haku sandbox pods' ServiceAccount full CRUD in haku-sandbox (Haku's own
# compute namespace) — the same haku-sandbox-admin grant the haku-managed-agent worker
# gets — so `kubectl` in the box operates Haku's compute out of the box. Both the SA and
# this binding live in haku-sandbox (no cross-namespace binding).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haku-workspace-sandbox-admin
  namespace: haku-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haku-sandbox-admin # cluster/k8s/haku/rbac/role.yaml
subjects:
  - kind: ServiceAccount
    name: haku-workspace
    namespace: haku-sandbox
