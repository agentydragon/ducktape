# The #4943 GitHub egress spike box: one exec target in haku-sandbox whose only difference
# from the `haku` template is WHICH proxy its clients are pointed at — the colocated
# Console egress proxy (haku-console:8888, #4942) instead of the port-8080 fence the fleet
# Kyverno policy injects. Proving real GitHub traffic through this box end to end is the
# gate for repointing the fleet injection (cluster/k8s/haku/console/README.md § Deferred).
# Operator procedure: haku/egress/docs/github_spike.md.
#
# CLEANUP(added 2026-08-27): delete this template, its warm pool, and the spike runbook once
#   the fleet inject-haku-egress-proxy HTTP_PROXY repoint to
#   haku-egress-proxy.haku-console.svc:8888 lands (#4670 adoption step).
#
# Routing mechanism — no Kyverno change: the pod carries its complete proxy wiring itself,
# and inject-haku-egress-proxy's every rule preconditions on that wiring being absent (the
# volume rule on a `haku-egress-proxy-ca-cert` volume, the env rules on that volumeMount),
# so the fleet policy skips this pod entirely instead of appending the port-8080 values
# after — and therefore over — these. Pinned by
# cluster/validation/kyverno/test_proxy_injection.py
# (test_pod_carrying_its_own_wiring_is_left_alone). Everything except HTTP_PROXY/HTTPS_PROXY
# is byte-identical to what the fleet policy would inject — same NO_PROXY, same CA bundle
# (the colocated sidecar issues from the same reflected haku-egress-proxy CA the trust
# bundle carries) — so the proxy URL is the only experiment variable.
#
# Same enforcement story as the `haku` template: the fence is the namespace-scoped
# force-proxy CCNP (which already admits haku-console:8888) plus baseline PodSecurity, not
# this pod spec. No Forgejo/Console credentials: this box only talks GitHub through the
# fence, holding nothing but the inert `github-token-placeholder` the decide service
# substitutes server-side.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: haku-egress-spike
  namespace: haku-sandbox
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: haku-egress-spike
    spec:
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: forgejo-images-creds
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workspace
          image: git.allegedly.works/ducktape-ci/haku-sandbox-image:devel-20260827091746-d668137 # {"$imagepolicy": "flux-system:haku-sandbox-image"}
          command: ["sleep", "infinity"]
          workingDir: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: HTTP_PROXY
              value: "http://haku-egress-proxy.haku-console.svc.cluster.local:8888"
            - name: HTTPS_PROXY
              value: "http://haku-egress-proxy.haku-console.svc.cluster.local:8888"
            - name: NO_PROXY
              value: "127.0.0.1,localhost,*.allegedly.works,.allegedly.works,*.forgejo,.forgejo,.svc,.svc.cluster.local,kubernetes.default.svc,10.0.0.0/8"
            - name: SSL_CERT_FILE
              value: /egress-proxy-ca/ca-certificates.crt
            - name: CURL_CA_BUNDLE
              value: /egress-proxy-ca/ca-certificates.crt
            - name: REQUESTS_CA_BUNDLE
              value: /egress-proxy-ca/ca-certificates.crt
            - name: NODE_EXTRA_CA_CERTS
              value: /egress-proxy-ca/ca-certificates.crt
            # The inert placeholder the decide service substitutes for the real github-bot
            # credential on scanned Authorization headers (config.yaml egress_decide) — Bearer
            # and git-over-HTTPS Basic forms alike. Worthless on its own, which is why it can
            # sit in a manifest. Both names so API callers and `gh` find it where they look.
            - name: GITHUB_TOKEN
              value: github-token-placeholder
            - name: HAKU_GITHUB_TOKEN
              value: github-token-placeholder
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            # The injection-suppressing mount: same volume name and mountPath the fleet policy
            # would add, and the thing its per-container precondition checks for.
            - name: haku-egress-proxy-ca-cert
              mountPath: /egress-proxy-ca
              readOnly: true
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: haku-egress-proxy-ca-cert
          configMap:
            name: haku-egress-proxy-ca-cert
