# Codex app-server runtime for the Console-launched public-coder Agent. The exact-session Console
# bearer arrives through SandboxClaim.spec.env; the provider and GitHub credentials remain in
# their trusted in-cluster services and this pod receives only scoped/placeholder values.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: haku-public-coder-codex
  namespace: haku-runtime-sandbox
spec:
  networkPolicyManagement: Unmanaged
  envVarsInjectionPolicy: Allowed
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: haku-harness-runner
        haku.allegedly.works/access-profile-id: public-coder
    spec:
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/agentydragon/haku-harness-runner:devel-20260829063043-b4251b5 # {"$imagepolicy": "flux-system:haku-harness-runner"}
          imagePullPolicy: Always
          args: ["--harness", "codex-app-server"]
          workingDir: /workspace
          env:
            - name: HAKU_RUNNER_WEBSOCKET_URL
              value: ws://haku-console.haku-console.svc.cluster.local:9090/internal/claude/runner
            # CLEANUP(added 2026-08-29): pre-rename spelling for runner images that predate
            # HAKU_RUNNER_WEBSOCKET_URL; drop once the pinned haku-harness-runner image reads the
            # new name — one release after this template and the image converge.
            - name: HAKU_AGENT_SDK_RUNNER_WEBSOCKET_URL
              value: ws://haku-console.haku-console.svc.cluster.local:9090/internal/claude/runner
            # The shared image retains Haku's legacy image-level setup only for rolling
            # compatibility. This Agent owns an empty workspace and disables that fallback even
            # when an old Console does not yet send the Agent-owned launch field.
            - name: HAKU_RUNNER_SETUP
              value: ""
            # Inert provider placeholder. The real public-coder LiteLLM virtual key remains in
            # the least-credential runner proxy, which replaces this value only in Authorization
            # headers sent to the exact in-cluster LiteLLM host. The Codex process and its children never
            # receive provider bearer bytes.
            - name: OPENAI_API_KEY
              value: proxy-litellm-public-coder-placeholder
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/runner
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: egress-proxy-ca
              # The colocated Console egress fence's trust bundle (haku-egress-proxy-ca-cert: the
              # shared public + cluster + haku-egress-proxy interception roots), replacing the
              # retiring iron proxy's CA as the Codex runner moves onto the fence (#4670). At
              # /etc/ssl/certs it covers Git's GnuTLS linkage (which reads no SSL_CERT_FILE);
              # Node/Python/curl also receive explicit env pointers from Console (ca_bundle) at this
              # same path.
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
      volumes:
        - name: home
          emptyDir: {}
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir: {}
        - name: egress-proxy-ca
          configMap:
            name: haku-egress-proxy-ca-cert
