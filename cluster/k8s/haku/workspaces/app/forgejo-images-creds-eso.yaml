# Mirror the ducktape-ci Forgejo registry pull credential into haku-sandbox so
# the Haku sandbox pods can pull the sandbox image from the private registry.
# Reflects the source secret's ready-made .dockerconfigjson verbatim and only
# stamps the type on top (no reassembly, no hardcoded host); sources the
# flux-system copy (itself an ExternalSecret against the scoped
# kubernetes-forgejo-images-secret-store — cluster/k8s/forgejo-images/).
#
# Reads through the wide flux-system store rather than the scoped one, unlike
# the sibling proxies: haku-sandbox is on the flux-system store's allowlist
# regardless, for alloy-otlp-bearer and haku-mail-token, so switching stores
# would narrow nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: haku-sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-flux-system-secret-store
    kind: ClusterSecretStore
  target:
    name: forgejo-images-creds
    template:
      type: kubernetes.io/dockerconfigjson
      mergePolicy: Merge
  dataFrom:
    - extract:
        key: forgejo-images-creds
