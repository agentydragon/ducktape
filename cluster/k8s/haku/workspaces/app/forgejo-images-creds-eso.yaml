# Mirror the ducktape-ci Forgejo registry pull credential into haku-sandbox so
# the Haku sandbox pods can pull the sandbox image from the private registry.
# Reflects the source secret's ready-made .dockerconfigjson verbatim and only
# stamps the type on top (no reassembly, no hardcoded host); sources the
# reflector-mirrored copy in flux-system.
#
# The sibling proxies moved to reflector to get off the flux-system store's
# allowlist, but haku-sandbox stays on ESO deliberately: it is on that allowlist
# regardless, for alloy-otlp-bearer and haku-mail-token. Converting this one
# would remove nothing it can already read, so it would be churn rather than a
# narrowing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: haku-sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-flux-system-secret-store
    kind: ClusterSecretStore
  target:
    name: forgejo-images-creds
    template:
      type: kubernetes.io/dockerconfigjson
      mergePolicy: Merge
  dataFrom:
    - extract:
        key: forgejo-images-creds
