# Haku's compute identity on the Console-owned Claude runtime.
#
# The *same agent* as the `haku` SA in haku-sandbox
# (cluster/k8s/haku/rbac/serviceaccount-haku.yaml) on a different harness, so it takes its
# permissions from that SA's binding rather than from grants of its own
# (cluster/k8s/haku/rbac/rolebinding-haku.yaml lists both). A second object exists only because a
# ServiceAccount is namespaced and a pod may name one only from its own namespace.
#
# The runner cannot simply live in haku-sandbox: this namespace is the one wired to the
# OAuth-substituting proxy (cluster/k8s/agents/haku-egress-proxy/claude-iron.yaml) and the CCNP
# admitting it keys on the namespace, so moving Haku's general compute here would hand every Haku
# pod the subscription token substitution.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-claude
  namespace: haku-claude-sandbox
  annotations:
    description: >-
      Haku's own Kubernetes identity inside the Console-owned Claude runner, so `kubectl`
      works from the session the same way it does from a haku-sandbox exec target. Bound to
      haku-sandbox-admin in haku-sandbox — the same single binding the `haku` SA has, and
      deliberately no grant in this namespace: full CRUD here would let a session create
      further pods behind the subscription-token proxy.
