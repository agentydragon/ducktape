# Haku's compute identity on the Console-owned Claude runtime.
#
# It is the *same agent* as the `haku` SA in haku-sandbox
# (cluster/k8s/haku/rbac/serviceaccount-haku.yaml), running on a different harness — so it
# gets its permissions from that SA's binding rather than from grants of its own
# (cluster/k8s/haku/rbac/rolebinding-haku.yaml lists both). A second object exists only
# because a ServiceAccount is namespaced and a pod may name one only from its own namespace;
# there is nothing to share at the identity layer, so everything above it is shared instead.
#
# Why this namespace rather than moving the runner into haku-sandbox, which would need no
# second SA at all: this namespace is the one wired to the OAuth-substituting proxy
# (cluster/k8s/agents/haku-egress-proxy/claude-iron.yaml), and the CCNP that admits it keys
# on the namespace. Putting Haku's general compute here would hand every Haku pod the
# subscription token substitution — the exact thing the split prevents.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haku-claude
  namespace: haku-claude-sandbox
  annotations:
    description: >-
      Haku's own Kubernetes identity inside the Console-owned Claude runner, so `kubectl`
      works from the session the same way it does from a haku-sandbox exec target. Bound to
      haku-sandbox-admin in haku-sandbox — the same single binding the `haku` SA has, and
      deliberately no grant in this namespace: full CRUD here would let a session create
      further pods behind the subscription-token proxy.
