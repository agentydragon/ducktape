apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: haku-self-hosted-agent
  namespace: flux-system
spec:
  interval: 15m
  refreshBeforeApply: true
  path: ./tf/gitops/haku-self-hosted-agent
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  serviceAccountName: tf-runner
  # CREATE is non-destructive (new env/agent/vault/deployment alongside the live
  # imperative one; the running worker is untouched until the manual cutover —
  # see README). Auto-apply is therefore safe; if the first plan rejects the
  # self_hosted env config or the deployment `schedule` shape, fix main.tf to the
  # provider schema (the failure is non-destructive — all creates).
  approvePlan: "auto"

  # Publish the provisioned resource IDs (environment_id, agent_id, vault_id,
  # deployment_id — see tf/gitops/haku-self-hosted-agent/outputs.tf) so consumers
  # have one canonical source. The worker's ANTHROPIC_ENVIRONMENT_ID is set from
  # environment_id at cutover. Empty `outputs` => all four are written.
  writeOutputsToSecret:
    name: haku-self-hosted-agent-ids

  # The tana-ro + gmail-labeling static_bearer tokens are read in-cluster by the
  # tofu root itself (kubernetes_secret_v1 data sources from tana-mcp +
  # gmail-labeling; see main.tf) — the tf-runner SA has cluster-wide secret read.

  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "haku_self_hosted_agent"
      }
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tofu-state-db-credentials
              key: password
        # Shared with haku-cloud-agent: the same dedicated, spend-capped Anthropic
        # workspace key. Owned/decrypted by the haku-cloud-agent kustomization (this
        # module's flux-kustomization dependsOn it so the Secret exists first).
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: haku-cloud-anthropic-api-key
              key: api-key
