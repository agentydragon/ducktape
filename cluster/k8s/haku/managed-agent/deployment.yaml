apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-managed-agent
  namespace: haku-sandbox
  labels:
    app.kubernetes.io/name: haku-managed-agent
  annotations:
    description: "Anthropic Managed Agents self-hosted worker (Runtime B; ducktape haku/runtime/managed_agent/self_hosted). Long-polls Anthropic's work queue (worker.py on the anthropic Python SDK) and runs tool calls in-sandbox. The haku-sandbox perimeter (haku-egress-proxy egress, RBAC, ResourceQuota) is the fence; the worker holds only the environment key, never the org API key."
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-managed-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-managed-agent
    spec:
      imagePullSecrets:
        - name: forgejo-images-creds
      # Shared Haku compute identity (cluster/k8s/haku/rbac/serviceaccount-haku.yaml),
      # the same SA the sandbox exec-target pods run as.
      serviceAccountName: haku
      # The worker's `bash` tool runs `kubectl` with this SA's in-cluster token.
      automountServiceAccountToken: true
      # The image is a full-NixOS closure but we do NOT boot it: the pod runs the
      # worker process directly (`/sw/bin/haku-managed-agent-run`, see nixos.nix)
      # as the non-root `haku` uid with all caps dropped. Booting systemd PID 1 in
      # an unprivileged container can't mount the API filesystems (/proc, /dev,
      # /run) and we don't need it — k8s supplies supervision + log capture.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # haku
        runAsGroup: 100 # users (haku's primary group)
        seccompProfile:
          type: RuntimeDefault
        # /workspace emptyDir is chowned to gid 100 (haku's primary group) so the
        # worker can write the git clones.
        fsGroup: 100
      containers:
        - name: worker
          image: git.allegedly.works/ducktape-ci/haku-managed-agent:devel-20260901115337-93ff613 # {"$imagepolicy": "flux-system:haku-managed-agent"}
          imagePullPolicy: Always
          command: ["/sw/bin/haku-managed-agent-run"] # run the worker closure directly (no systemd)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # entrypoint writes ~/.netrc and git config under $HOME; without a
            # login shell k8s won't set it, so pin it to haku's home.
            - name: HOME
              value: /home/haku
            # The self-hosted environment is provisioned imperatively via `ant`
            # (haku/runtime/managed_agent/self_hosted/provision.sh), NOT Terraform — the
            # claude-managed-agents provider has no self_hosted support. This is the live
            # env; if it is ever recreated, update this ID and regenerate the
            # haku-environment-key secret in lockstep.
            - name: ANTHROPIC_ENVIRONMENT_ID
              value: env_015uqL9WAMSDytQEWWmLG9zF # live haku-selfhosted env (not secret)
            - name: ANTHROPIC_ENVIRONMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: haku-environment-key
                  key: environment_key
            # haku-state clone (read+write) + the single git credential the
            # entrypoint threads into ~/.netrc. Reuses the haku-console secret's
            # username/password; the URL is spelled here rather than taken from its
            # repo_url key because it must carry the FQDN host explained at HAKU_GIT_HOST.
            - name: HAKU_STATE_REPO_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000/haku/haku-state.git
            - name: HAKU_GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: haku-forgejo-git
                  key: username
            - name: HAKU_GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-forgejo-git
                  key: password
            # .netrc machine line for git auth. Must match the host in both clone
            # URLs (.netrc matches on host, ignoring the :3000 port). Both repos are
            # reached via the in-cluster Forgejo Service in its FQDN form: the
            # haku-sandbox Kyverno policy (inject-haku-egress-proxy) no longer keeps
            # the short forgejo-http.forgejo out of the egress fence, and this worker
            # holds a real Forgejo token but no proxy credential, so it would get a
            # 407 there. The `.svc.cluster.local` suffix stays on NO_PROXY, so the
            # FQDN reaches Forgejo directly as before.
            - name: HAKU_GIT_HOST
              value: forgejo-http.forgejo.svc.cluster.local
            # ducktape clone (read-only: haku/base + run.md, the live manual).
            # The Forgejo mirror agentydragon/ducktape (the `haku` user has read
            # via collaborator grant). GitHub is unreachable from the worker
            # (egress proxy blocks it), so we clone the in-cluster mirror, authed
            # by the .netrc above. NOTE: the mirror is bumped manually for now —
            # see the README TODO; it is not yet turnkey-synced from GitHub.
            - name: HAKU_DUCKTAPE_REPO_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000/agentydragon/ducktape.git
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: workspace # git clones + agent workdir (entrypoint: /workspace)
              mountPath: /workspace
            - name: home # $HOME (.netrc, .gitconfig, ant config) — see HOME env
              mountPath: /home/haku
            - name: forgejo-tea # ~/.config/tea/config.yml from forgejo-token-rotation
              mountPath: /home/haku/.config/tea
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir: {}
        # The image has no /home/haku: `createHome` runs at NixOS activation,
        # which we skip (we exec the worker directly, not systemd). Mount a
        # writable emptyDir there (fsGroup 100 makes it haku-writable).
        - name: home
          emptyDir: {}
        - name: forgejo-tea
          secret:
            secretName: haku-forgejo-tea
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
