apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-console-namespace
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/haku/console-namespace
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: haku-console-namespace
    namespace: ducktape-flux
  timeout: 2m
