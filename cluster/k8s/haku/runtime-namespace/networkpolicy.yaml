# Console-owned harness runners accept no inbound connections. Their egress is selected by
# access-profile pod labels in profile-owned CiliumClusterwideNetworkPolicies, so co-tenancy in
# this namespace is capacity rather than authority.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: haku-runtime-sandbox-ingress
  namespace: haku-runtime-sandbox
spec:
  endpointSelector: {}
  # The empty rule element is load-bearing: it allows nothing while putting selected endpoints
  # into ingress default-deny (Cilium docs § "Ingress/Egress Default Deny"). A bare `ingress: []`
  # is rejected by Cilium's rule validation (Valid=False) and enforces nothing.
  ingress:
    - {}
---
# Public-coder runners establish bridge/MCP through Console, use the shared exact-session
# Kubernetes proxy, and reach GitHub/LiteLLM only through the Console egress fence.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: public-coder-runner-egress
  namespace: haku-runtime-sandbox
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haku-harness-runner
      haku.allegedly.works/access-profile-id: public-coder
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
            k8s:app.kubernetes.io/name: haku-console
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
    # Colocated Console egress fence (#4670): the runner's HTTPS_PROXY now points at
    # haku-egress-proxy.haku-console.svc:8888. The sidecar shares the Console pod's network
    # namespace, so it is selected by the same haku-console pod label on the fence container port.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
            k8s:app.kubernetes.io/name: haku-console
      toPorts:
        - ports:
            - { port: "8888", protocol: TCP }
    # Console-selected Kubernetes access is mediated by the shared authorization proxy; the pod
    # has no ServiceAccount token and the runner writes a tokenFile kubeconfig only for this URL.
    # The proxy's TLS listener, because kubectl sends credentials only to an https server.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
            k8s:app.kubernetes.io/name: haku-kube-api-proxy
      toPorts:
        - ports:
            - { port: "8443", protocol: TCP }
