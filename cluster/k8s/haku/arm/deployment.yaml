# Interactive Haku "arm": a FastAPI dashboard replacing the static haku-dashboard.
# Unlike the dashboard (nginx + a git-sync sidecar), the app owns git itself —
# it clones haku-state into an emptyDir at /data at startup and pushes back. Access
# is gated by Authentik (agentydragon-only) via the proxy outpost — the app has no
# native auth. Runs with Haku's exact perimeter (haku-sandbox namespace, uid/gid 1000,
# non-root, no service-account token, all capabilities dropped). readOnlyRootFilesystem
# is intentionally NOT set: the aspect py_binary launcher materializes its venv on the
# rootfs at startup (same as grocy-mcp), so the root fs must be writable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-arm
  namespace: haku-sandbox
  labels:
    app.kubernetes.io/name: haku-arm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-arm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-arm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: ghcr.io/agentydragon/haku-arm:devel-00000000000000-0000000 # {"$imagepolicy": "flux-system:haku-arm"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME # libgit2/git config + temp writes land in the writable emptyDir
              value: /tmp
            - name: HAKU_ARM_GIT_REPO_URL
              valueFrom:
                secretKeyRef:
                  name: haku-state-git-write
                  key: repo_url
            - name: HAKU_ARM_GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: haku-state-git-write
                  key: username
            - name: HAKU_ARM_GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: haku-state-git-write
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp # HOME=/tmp: libgit2/git config + scratch
              mountPath: /tmp
            - name: data # the haku-state clone
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
