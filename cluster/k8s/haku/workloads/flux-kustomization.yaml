apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-workloads
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: haku-state
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/haku/workloads
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: haku-workloads
    namespace: ducktape-flux
  timeout: 5m
  wait: false
