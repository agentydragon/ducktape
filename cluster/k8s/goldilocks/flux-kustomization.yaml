apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: goldilocks
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: vpa
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: goldilocks
      namespace: goldilocks
  interval: 10m
  path: ./cluster/k8s/goldilocks
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: goldilocks
    namespace: ducktape-flux
  timeout: 5m
  wait: true
