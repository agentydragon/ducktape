apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "true"
    goldilocks.fairwinds.com/vpa-update-mode: auto
  name: goldilocks
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: goldilocks
spec:
  chart:
    spec:
      chart: goldilocks
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: flux-system
      version: 11.1.0
  install:
    remediation:
      retries: 3
  interval: 30m
  values:
    controller:
      flags:
        on-by-default: "true"
      resources:
        limits:
          cpu: 200m
          memory: 512Mi
        requests:
          cpu: 25m
          memory: 256Mi
    dashboard:
      enabled: true
      replicaCount: 1
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 25m
          memory: 128Mi
    vpa:
      enabled: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goldilocks-dashboard-ingress
  namespace: goldilocks
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              app.kubernetes.io/component: server
              app.kubernetes.io/name: authentik
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: dashboard
      app.kubernetes.io/name: goldilocks
  policyTypes:
    - Ingress
