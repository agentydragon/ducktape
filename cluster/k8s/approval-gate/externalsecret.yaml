apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: approval-gate-secrets
  namespace: approval-gate
spec:
  refreshInterval: 8760h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: approval-gate-secrets
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "openclaw"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "openclaw"
  data:
    - secretKey: agent-api-key
      remoteRef:
        key: kv/approval-gate
        property: agent-api-key
    - secretKey: operator-api-key
      remoteRef:
        key: kv/approval-gate
        property: operator-api-key
