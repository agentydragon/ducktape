# CiliumNetworkPolicy for the approval-gate namespace pods.
#
# approval-gate server (component: server, port 8765):
#   Authentik outpost (authentik namespace) — proxies operator UI, sets X-Authentik-Jwt header
#   OpenClaw pods (openclaw-gateway namespace) — auth-proxy sidecar obtains OAuth2 JWT
#     via client_credentials grant and forwards as Authorization: Bearer to /mcp
#   Both present JWTs verified by JWTVerifier against the Authentik JWKS endpoint.
#
# kubeapi-admin-exec-mcp (component: kubeapi-admin-exec-mcp, port 8766):
#   Only the approval-gate server (same namespace) connects to it.
#
# The host entity covers kubelet liveness/readiness probes for both pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: approval-gate-ingress
  namespace: approval-gate
spec:
  endpointSelector:
    matchLabels:
      app: approval-gate
      component: server
  ingress:
    # Kubelet health probes (liveness/readiness) originate from the node host.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
    # Operator UI + /mcp: Authentik (operator JWT) and OpenClaw (agent JWT).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openclaw-gateway
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubeapi-admin-exec-mcp-ingress
  namespace: approval-gate
spec:
  endpointSelector:
    matchLabels:
      app: approval-gate
      component: kubeapi-admin-exec-mcp
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8766"
              protocol: TCP
    # Only the approval-gate server pod connects to the exec backend.
    - fromEndpoints:
        - matchLabels:
            app: approval-gate
            component: server
      toPorts:
        - ports:
            - port: "8766"
              protocol: TCP
