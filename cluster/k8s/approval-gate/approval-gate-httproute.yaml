# HTTPRoute for the approval gate. Traffic flows directly: Gateway → backend.
# Auth is handled by the SPA's native OIDC integration (no proxy outpost).
# Agent MCP traffic uses OAuth2 JWTs (client_credentials grant) with JWTVerifier.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: approval-gate
  namespace: approval-gate
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "approval-gate.allegedly.works"
  rules:
    - backendRefs:
        - name: approval-gate
          port: 8765
      timeouts:
        request: "120s"
        backendRequest: "120s"
