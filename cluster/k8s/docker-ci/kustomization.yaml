apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - server-tls.sops.yaml
  - deployment.yaml
  - service.yaml
  - tlsroute.yaml
  - cronjobs.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: docker-ci-public-certs
    files:
      - certs/ca.pem
      - certs/server-cert.pem
    namespace: docker-ci
