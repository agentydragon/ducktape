apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: docker-ci-agent-rbac
  namespace: flux-system
  annotations:
    description: Agent RBAC for docker-ci namespace. Lightweight — only RoleBindings. Depends on namespace existing + claude-rbac for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/docker-ci/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: docker-ci
    - name: claude-rbac
