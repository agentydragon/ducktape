apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: docker-ci
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape

    namespace: ducktape-flux
  path: ./cluster/k8s/docker-ci
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: docker-ci
      namespace: docker-ci
  dependsOn:
    # No storage dep (emptyDir, not a CSI PVC). Needs the cluster-internal-ca
    # ClusterIssuer for the mTLS Certificates and agent-rbac-base for the
    # claude-sandbox namespace the client Certificate lives in.
    - name: cert-manager-environment
      namespace: ducktape-flux
    - name: claude-rbac
      namespace: ducktape-flux
