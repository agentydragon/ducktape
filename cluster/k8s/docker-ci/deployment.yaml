apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-ci
  namespace: docker-ci
  labels:
    app.kubernetes.io/name: docker-ci
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: docker-ci
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docker-ci
    spec:
      # OVH workers (Proxmox is the cold-spare region; this daemon's image cache
      # is disposable so it lives wherever it can schedule).
      nodeSelector:
        topology.kubernetes.io/region: hil
      containers:
        - name: dind
          image: docker:27-dind
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --host=tcp://0.0.0.0:2376
            - --tlsverify
            - --tlscacert=/certs/ca.pem
            - --tlscert=/certs/server-cert.pem
            - --tlskey=/certs/server-key.pem
            - --storage-driver=overlay2
          securityContext:
            privileged: true
          ports:
            - containerPort: 2376
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
            - name: server-tls
              mountPath: /certs/server-key.pem
              subPath: server-key.pem
              readOnly: true
            - name: public-certs
              mountPath: /certs/ca.pem
              subPath: ca.pem
              readOnly: true
            - name: public-certs
              mountPath: /certs/server-cert.pem
              subPath: server-cert.pem
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            # Sandbox containers run *inside* this daemon, so their cpu/mem count
            # against this cgroup — these limits bound eval concurrency (each agent
            # is 1 cpu / 2Gi + its proxy). Keep eval-side concurrency in step.
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        # Disposable overlay2 layer cache. emptyDir (not a PVC) keeps the daemon
        # reschedulable onto any OVH worker on node failure — no node-pinned PV to
        # strand it; the cost is a cold re-pull after a restart. overlay2 needs a
        # local fs, so a networked backend (SeaweedFS) is not an option here anyway.
        - name: docker-data
          emptyDir:
            sizeLimit: 30Gi
        - name: server-tls
          secret:
            secretName: docker-ci-server-tls
        - name: public-certs
          configMap:
            name: docker-ci-public-certs
