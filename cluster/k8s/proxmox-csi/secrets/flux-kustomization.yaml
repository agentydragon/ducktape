apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: proxmox-csi-secrets
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/proxmox-csi/secrets"
  prune: true
  wait: true
  dependsOn:
    - name: proxmox-csi-namespace
    - name: sealed-secrets
