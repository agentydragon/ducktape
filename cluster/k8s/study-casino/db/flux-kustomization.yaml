apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: study-casino-db
  namespace: ducktape-flux
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  path: ./cluster/k8s/study-casino/db
  prune: true
  wait: true
  dependsOn:
    - name: cnpg
      namespace: ducktape-flux
    - name: study-casino-namespace
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
