apiVersion: apps/v1
kind: Deployment
metadata:
  name: study-casino
  namespace: study-casino
  labels:
    app.kubernetes.io/name: study-casino
  annotations:
    description: "Habit-tracking casino app. Serves PWA + /sync endpoint with OIDC auth (Authorization Code flow, confidential client)."
spec:
  # Single replica because the PVC is RWO and SQLite WAL doesn't tolerate
  # concurrent writers across processes.
  replicas: 1
  strategy:
    # Recreate instead of RollingUpdate so the old pod releases the PVC
    # before the new one tries to mount it.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: study-casino
  template:
    metadata:
      labels:
        app.kubernetes.io/name: study-casino
    spec:
      # Don't auto-inject `<SERVICE>_PORT=tcp://...` env vars. The same-namespace
      # `study-casino` Service would inject `STUDY_CASINO_PORT=tcp://...`, which
      # collides with the `port: int` field on Settings (env_prefix
      # `STUDY_CASINO_`) and crashes pydantic-settings on startup.
      enableServiceLinks: false
      containers:
        - name: app
          image: ghcr.io/agentydragon/study-casino:devel-20260427120153-ede2e00 # {"$imagepolicy": "flux-system:study-casino"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: STUDY_CASINO_DATA_DIR
              value: /data
            - name: STUDY_CASINO_OIDC_ISSUER
              value: "https://auth.allegedly.works/application/o/study-casino/"
            - name: STUDY_CASINO_OIDC_CLIENT_ID
              value: "study-casino"
            - name: STUDY_CASINO_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: study-casino-oidc
                  key: oidc_client_secret
            - name: STUDY_CASINO_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: study-casino-oidc
                  key: session_secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: study-casino-data
