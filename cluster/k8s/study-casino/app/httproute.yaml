apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: study-casino
  namespace: study-casino
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "casino.allegedly.works"
  rules:
    # Hermetic font files — content-stable; cache forever.
    - matches:
        - path:
            type: PathPrefix
            value: /fonts/
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: "public, max-age=31536000, immutable"
      backendRefs:
        - name: study-casino
          port: 8080
    # Vite's content-hashed bundle output (after frontend migrates to Vite):
    # /assets/<name>-<hash>.{js,css,…}. URL changes whenever bytes change,
    # so safe to cache forever.
    - matches:
        - path:
            type: PathPrefix
            value: /assets/
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: "public, max-age=31536000, immutable"
      backendRefs:
        - name: study-casino
          port: 8080
    # Everything else (index.html, sw.js, manifest, icon, current /main.js,
    # API endpoints): do not store. Bazel-normalized mtimes can make app-shell
    # validators lie across deploys, while hashed /assets/ remain immutable
    # above.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: "no-store"
      backendRefs:
        - name: study-casino
          port: 8080
