apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: study-casino
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: study-casino-namespace
      namespace: ducktape-flux
    - name: study-casino-db
      namespace: ducktape-flux
    - name: claude-rbac
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: study-casino
      namespace: study-casino
  interval: 10m
  path: ./cluster/k8s/study-casino/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: study-casino-app
    namespace: ducktape-flux
  suspend: false
  timeout: 5m
  wait: true
