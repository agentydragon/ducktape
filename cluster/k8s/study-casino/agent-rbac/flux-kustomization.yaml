apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: study-casino-agent-rbac
  namespace: ducktape-flux
  annotations:
    description: Agent RBAC for study-casino namespace. Lightweight — only RoleBindings. Depends on namespace existing + agent RBAC base for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/study-casino/agent-rbac
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: study-casino-agent-rbac
    namespace: ducktape-flux
  timeout: 2m
  dependsOn:
    - name: study-casino-namespace
      namespace: ducktape-flux
    - name: claude-rbac
      namespace: ducktape-flux
