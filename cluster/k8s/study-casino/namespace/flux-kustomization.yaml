apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: study-casino-namespace
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/study-casino/namespace
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: study-casino-namespace
    namespace: ducktape-flux
  timeout: 1m
  wait: true
