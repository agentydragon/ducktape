apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-box
  namespace: ducktape-flux
spec:
  # Keep this controller inactive while the unschedulable legacy VM is retired.
  # Its VM and local disk remain untouched until explicitly deleted.
  suspend: true
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  path: ./cluster/k8s/agent-box/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: agent-box-namespace
      namespace: ducktape-flux
    - name: kubevirt
      namespace: ducktape-flux
    - name: cdi
      namespace: ducktape-flux
    - name: external-secrets-operator
      namespace: ducktape-flux
    - name: seaweedfs-public-s3
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
  wait: true
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: agent-box-vm-images-s3-reader
      namespace: agent-box
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      name: agent-box-root
      namespace: agent-box
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      name: agent-box
      namespace: agent-box
