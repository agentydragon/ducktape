apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Home Assistant with encrypted Restic/VolSync backups and its dedicated private SeaweedFS S3 bucket.
  name: home-assistant
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: local-path-provisioner
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
    - name: volsync
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: sso-providers-tf
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: home-assistant-backups
      namespace: home-assistant
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: S3Credentials
      name: home-assistant-backups
      namespace: home-assistant
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: home-assistant-config-restic-tenant
      namespace: home-assistant
  interval: 10m
  path: ./cluster/k8s/home-assistant
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: home-assistant
    namespace: ducktape-flux
  timeout: 10m
  wait: true
