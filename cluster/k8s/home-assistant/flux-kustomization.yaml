apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: ducktape-flux
  annotations:
    description: >-
      Home Assistant with encrypted Restic/VolSync backups and its dedicated
      private SeaweedFS S3 bucket.
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/home-assistant
  prune: true
  wait: true
  healthChecks:
    - apiVersion: seaweed.seaweedfs.com/v1
      kind: Bucket
      name: home-assistant-backups
      namespace: seaweedfs
  sourceRef:
    kind: ExternalArtifact
    name: home-assistant
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: local-path-provisioner
      namespace: ducktape-flux
    - name: seaweedfs-cluster
      namespace: ducktape-flux
    - name: volsync
      namespace: ducktape-flux
    - name: monitoring-stack
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: sso-providers-tf
      namespace: ducktape-flux
