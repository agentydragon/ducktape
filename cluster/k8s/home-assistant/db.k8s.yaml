apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-assistant-db
  namespace: home-assistant
spec:
  affinity:
    nodeSelector:
      kubernetes.io/hostname: optiplex
  bootstrap:
    initdb:
      database: homeassistant
      owner: homeassistant
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 1
  monitoring:
    enablePodMonitor: true
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: home-assistant-db
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 10Gi
    storageClass: piraeus-ssd-local
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for home-assistant/home-assistant-db.
  name: home-assistant-db-backups
  namespace: home-assistant
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: home-assistant-db-backups
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: home-assistant-db-backups
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for home-assistant/home-assistant-db.
  name: home-assistant-db-backups
  namespace: home-assistant
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: home-assistant-db-backups
  namespace: home-assistant
spec:
  identityRef:
    name: home-assistant-db-backups
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: home-assistant-db-backups-s3-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  annotations:
    description: SeaweedFS S3 destination for home-assistant/home-assistant-db base backups and WAL.
  name: home-assistant-db
  namespace: home-assistant
spec:
  configuration:
    data:
      compression: gzip
    destinationPath: s3://home-assistant-db-backups/
    endpointURL: http://seaweedfs-s3.seaweedfs.svc:8333
    s3Credentials:
      accessKeyId:
        key: AWS_ACCESS_KEY_ID
        name: home-assistant-db-backups-s3-credentials
      secretAccessKey:
        key: AWS_SECRET_ACCESS_KEY
        name: home-assistant-db-backups-s3-credentials
    wal:
      compression: gzip
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: home-assistant-db
  namespace: home-assistant
spec:
  backupOwnerReference: self
  cluster:
    name: home-assistant-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 19 3 * * *
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  name: recorder-import
  namespace: home-assistant
spec:
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - sh
            - /scripts/load.sh
          env:
            - name: RECORDER_DB_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: home-assistant-db-app
          image: ghcr.io/dimitri/pgloader:3.6.9
          name: load
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - mountPath: /work
              name: work
            - mountPath: /scripts
              name: scripts
              readOnly: true
      initContainers:
        - command:
            - python3
            - /scripts/prepare.py
          env:
            - name: RECORDER_DB_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: home-assistant-db-app
          image: ghcr.io/home-assistant/home-assistant:2026.9.2
          name: prepare
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /work
              name: work
            - mountPath: /scripts
              name: scripts
              readOnly: true
      nodeSelector:
        kubernetes.io/hostname: optiplex
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config-piraeus
        - emptyDir: {}
          name: work
        - configMap:
            name: recorder-import
          name: scripts
