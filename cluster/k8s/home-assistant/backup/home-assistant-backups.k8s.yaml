apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: home-assistant-backups
  namespace: seaweedfs
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Home Assistant's tenant-local SeaweedFS backup bucket.
  name: home-assistant-backups
  namespace: home-assistant
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: home-assistant-backups
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: home-assistant-backups
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  annotations:
    description: Home Assistant's tenant-local SeaweedFS backup credentials.
  name: home-assistant-backups
  namespace: home-assistant
spec:
  identityRef:
    name: home-assistant-backups
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: home-assistant-seaweedfs-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: home-assistant-backups
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: home-assistant
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: home-assistant
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
