apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: home-assistant-backups
  namespace: home-assistant
  annotations:
    description: Home Assistant's tenant-local SeaweedFS backup bucket.
spec:
  name: home-assistant-backups
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  reclaimPolicy: Retain
  access:
    - user: home-assistant-backups
      actions: [Read, Write, List, Tagging]
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: home-assistant-backups
  namespace: home-assistant
  annotations:
    description: Home Assistant's tenant-local SeaweedFS backup credentials.
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  identityRef:
    name: home-assistant-backups
  secretRef:
    name: home-assistant-seaweedfs-credentials
    accessKeyField: AWS_ACCESS_KEY_ID
    secretKeyField: AWS_SECRET_ACCESS_KEY
  reclaimPolicy: Retain
---
# Permit only Home Assistant's tenant-local Bucket and S3Credentials to
# reference the SeaweedFS cluster in its namespace.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: home-assistant-backups
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: home-assistant
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: home-assistant
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
