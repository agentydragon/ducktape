# Compose the new operator-owned S3 credentials with the existing SOPS-managed
# Restic fields without changing the old rollback Secret during the handoff.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-assistant-backup-secret-reader
  namespace: home-assistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-assistant-backup-secret-reader
  namespace: home-assistant
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - home-assistant-config-restic
      - home-assistant-seaweedfs-credentials
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-assistant-backup-secret-reader
  namespace: home-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: home-assistant-backup-secret-reader
subjects:
  - kind: ServiceAccount
    name: home-assistant-backup-secret-reader
    namespace: home-assistant
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: home-assistant-backup-secrets
  namespace: home-assistant
spec:
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: home-assistant-backup-secret-reader
          namespace: home-assistant
      remoteNamespace: home-assistant
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-config-restic-tenant
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: home-assistant-backup-secrets
  target:
    name: home-assistant-config-restic-tenant
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: home-assistant-config-restic
        property: RESTIC_REPOSITORY
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: home-assistant-config-restic
        property: RESTIC_PASSWORD
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: home-assistant-config-restic
        property: AWS_DEFAULT_REGION
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: home-assistant-seaweedfs-credentials
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: home-assistant-seaweedfs-credentials
        property: AWS_SECRET_ACCESS_KEY
