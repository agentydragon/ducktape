# The SeaweedFS operator owns S3Credentials in its own namespace, while this
# backup credential is delivered directly to the workload namespace.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: home-assistant-config-restic
  namespace: home-assistant
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: seaweedfs
  to:
    - group: ""
      kind: Secret
      name: home-assistant-config-restic
