apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storage.yaml
  - forgejo-images-credentials.yaml
  - metrics-secret.yaml
  - break-glass-credentials.sops.yaml
  - home-assistant.yaml
  - onboarding-job.yaml
  - httproute.yaml
  - monitoring.yaml
  - networkpolicy.yaml
  - volsync-backup.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: home-assistant-configuration
    namespace: home-assistant
    options:
      # The configuration is mounted with subPath; a content hash forces the
      # Deployment to restart when this file changes.
      disableNameSuffixHash: false
    files:
      - configuration.yaml=configuration.yaml.conf
  - name: home-assistant-provisioner-config
    namespace: home-assistant
    files:
      - provisioner.yaml
  - name: home-assistant-caddy
    namespace: home-assistant
    files:
      - Caddyfile
