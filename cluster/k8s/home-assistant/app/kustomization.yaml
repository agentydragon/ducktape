apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storage.yaml
  - metrics-secret.yaml
  - break-glass-credentials.sops.yaml
  - home-assistant.yaml
  - onboarding-job.yaml
  - httproute.yaml
  - monitoring.yaml
  - networkpolicy.yaml
  - volsync-backup.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: home-assistant-configuration
    namespace: home-assistant
    files:
      - configuration.yaml=configuration.yaml.conf
  - name: home-assistant-bootstrap
    namespace: home-assistant
    files:
      - bootstrap_onboarding.py
      - install_oidc.py
  - name: home-assistant-caddy
    namespace: home-assistant
    files:
      - Caddyfile
