apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: ducktape-flux
  annotations:
    description: >-
      Home Assistant with encrypted Restic/VolSync backups to its dedicated
      private SeaweedFS S3 bucket.
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./cluster/k8s/home-assistant/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: home-assistant-namespace
      namespace: ducktape-flux
    - name: local-path-provisioner
      namespace: ducktape-flux
    - name: seaweedfs-home-assistant-backups-bucket
      namespace: ducktape-flux
    - name: volsync
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: sso-providers-tf
      namespace: ducktape-flux
