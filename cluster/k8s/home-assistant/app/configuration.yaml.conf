default_config:

homeassistant:
  country: US

# Caddy restricts this otherwise-unauthed endpoint to the Prometheus bearer
# token. Keeping the token outside Home Assistant avoids a manually-created HA
# long-lived access token during first boot.
prometheus:
  requires_auth: false
  namespace: hass

auth_oidc:
  client_id: home-assistant
  discovery_url: https://auth.allegedly.works/application/o/home-assistant/.well-known/openid-configuration
  display_name: Authentik
  claims:
    username: preferred_username
    groups: groups
  roles:
    admin: home-assistant-admins
    user: home-assistant-users
  features:
    automatic_user_linking: false
    automatic_person_creation: true
    default_redirect: false
    force_https: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
