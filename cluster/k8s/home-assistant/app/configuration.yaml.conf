default_config:

homeassistant:
  country: US

# Caddy restricts this otherwise-unauthed endpoint to the Prometheus bearer
# token. Keeping the token outside Home Assistant avoids a manually-created HA
# long-lived access token during first boot.
prometheus:
  requires_auth: false
  namespace: hass

auth_oidc:
  client_id: home-assistant
  discovery_url: https://auth.allegedly.works/application/o/home-assistant/.well-known/openid-configuration
  display_name: Authentik
  claims:
    username: preferred_username
    groups: groups
  roles:
    admin: home-assistant-admins
    user: home-assistant-users
  features:
    automatic_user_linking: false
    automatic_person_creation: true
    default_redirect: false
    force_https: true

# History lives in the home-assistant-db CNPG Cluster (cluster/cdk8s/home_assistant/db.py).
# `purge_keep_days` is global, so it is set to the location horizon and the automation below
# trims everything else to 30 days; an entity no longer in `states` keeps the 365 days.
recorder:
  db_url: !env_var RECORDER_DB_URL
  purge_keep_days: 365

automation: !include automations.yaml
# Kept apart from the UI-managed automations.yaml.
automation retention:
  - id: recorder_retention_non_location
    alias: Trim non-location history to 30 days
    description: Keeps raw GPS history (device_tracker, person) for the recorder's 365 days.
    triggers:
      - trigger: time
        at: "04:12:00"
    actions:
      - action: recorder.purge_entities
        target:
          entity_id: >-
            {{ states | rejectattr('domain', 'in', ['device_tracker', 'person'])
               | map(attribute='entity_id') | list }}
        data:
          keep_days: 30
script: !include scripts.yaml
scene: !include scenes.yaml
