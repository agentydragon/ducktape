apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      imagePullSecrets:
        - name: forgejo-images-creds
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: optiplex
      initContainers:
        - name: provision-components
          image: git.allegedly.works/ducktape-ci/homeassistant-provisioner:devel-20260919010000-6eca0e6 # {"$imagepolicy": "flux-system:homeassistant-provisioner"}
          imagePullPolicy: Always
          command: ["/homeassistant/provisioner/provision_bin"]
          env:
            - name: HOME_ASSISTANT_PROVISIONER_CONFIG_FILE
              value: /etc/homeassistant/provisioner.yaml
            - name: HOME_ASSISTANT_PROVISIONER_ONBOARDING_ENABLED
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: provisioner-config
              mountPath: /etc/homeassistant/provisioner.yaml
              subPath: provisioner.yaml
              readOnly: true
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.9.2
          env:
            - name: TZ
              value: America/Los_Angeles
            # Home Assistant's HTTP settings are converged through the admin API
            # after startup. This keeps the empty-PVC bootstrap port aligned with
            # Caddy while the API applies the loopback/proxy settings.
            - name: SETUP_PORT
              value: "8124"
          ports:
            - name: backend
              containerPort: 8124
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              port: backend
              path: /
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              port: backend
              path: /
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
        - name: caddy
          image: caddy:2.11.4-alpine
          env:
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: home-assistant-metrics-token
                  key: password
          ports:
            - name: http
              containerPort: 8123
          readinessProbe:
            httpGet:
              port: http
              path: /
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: configuration
          configMap:
            name: home-assistant-configuration
        - name: provisioner-config
          configMap:
            name: home-assistant-provisioner-config
        - name: caddy-config
          configMap:
            name: home-assistant-caddy
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  selector:
    app.kubernetes.io/name: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: http
