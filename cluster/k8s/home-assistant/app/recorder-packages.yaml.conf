recorder_retention:
  automation:
    - id: recorder_trim_non_location_history
      alias: Trim non-location recorder history
      description: Keep 30 days of history except device trackers and people, which use the 365-day recorder retention.
      triggers:
        - trigger: time
          at: "03:00:00"
      actions:
        - action: recorder.purge_entities
          data:
            keep_days: 30
            entity_globs: >-
              {{ states
                 | map(attribute='entity_id')
                 | map('regex_replace', '\\..*$', '.*')
                 | unique
                 | reject('match', '^(device_tracker|person)\\.')
                 | list }}
