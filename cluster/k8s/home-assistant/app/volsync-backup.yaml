# Encrypted, deduplicated snapshots of Home Assistant's OptiPlex-local state
# in the dedicated SeaweedFS S3 bucket. Home Assistant's own backup integration
# remains the source of application-consistent restore points in this PVC.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: home-assistant-config-restic
  namespace: home-assistant
spec:
  sourcePVC: home-assistant-config
  trigger:
    schedule: "17 */6 * * *"
  restic:
    repository: home-assistant-config-restic
    copyMethod: Direct
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    cacheStorageClassName: local-path-home-ssd
    cacheAccessModes: [ReadWriteOnce]
    cacheCapacity: 1Gi
    moverPodLabels:
      app.kubernetes.io/name: home-assistant-config-restic
    moverResources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      seccompProfile:
        type: RuntimeDefault
    moverAffinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [optiplex]
