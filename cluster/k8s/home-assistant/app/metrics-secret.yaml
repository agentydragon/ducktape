apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: home-assistant-metrics-token
  namespace: home-assistant
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-metrics-token
  namespace: home-assistant
spec:
  refreshPolicy: CreatedOnce
  target:
    name: home-assistant-metrics-token
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: home-assistant-metrics-token
