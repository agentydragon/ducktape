apiVersion: batch/v1
kind: Job
metadata:
  name: home-assistant-onboarding
  namespace: home-assistant
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        # Bump when bootstrap behavior changes so Flux replaces the immutable Job.
        home-assistant.allegedly.works/bootstrap-revision: "3"
      labels:
        app.kubernetes.io/name: home-assistant-onboarding
    spec:
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: optiplex
      containers:
        - name: onboarding
          image: git.allegedly.works/ducktape-ci/homeassistant-provisioner:devel-20260919041754-b69d60e # {"$imagepolicy": "flux-system:homeassistant-provisioner"}
          imagePullPolicy: Always
          command: ["/homeassistant/provisioner/provision_bin"]
          env:
            - name: HOME_ASSISTANT_PROVISIONER_CONFIG_FILE
              value: /etc/homeassistant/provisioner.yaml
            - name: HOME_ASSISTANT_PROVISIONER_LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-assistant-break-glass
                  key: password
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: provisioner-config
              mountPath: /etc/homeassistant/provisioner.yaml
              subPath: provisioner.yaml
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: provisioner-config
          configMap:
            name: home-assistant-provisioner-config
