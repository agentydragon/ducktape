apiVersion: batch/v1
kind: Job
metadata:
  name: home-assistant-onboarding
  namespace: home-assistant
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        # Bump when bootstrap behavior changes so Flux replaces the immutable Job.
        home-assistant.allegedly.works/bootstrap-revision: "3"
      labels:
        app.kubernetes.io/name: home-assistant-onboarding
    spec:
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: optiplex
      containers:
        - name: onboarding
          image: git.allegedly.works/ducktape-ci/homeassistant-provisioner:devel-20260919010000-6eca0e6 # {"$imagepolicy": "flux-system:homeassistant-provisioner"}
          imagePullPolicy: Always
          env:
            - name: HOME_ASSISTANT_LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-assistant-break-glass
                  key: password
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
