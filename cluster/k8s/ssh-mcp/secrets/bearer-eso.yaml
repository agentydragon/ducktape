apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ssh-mcp-bearer
  namespace: ssh-mcp
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ssh-mcp-bearer
  namespace: ssh-mcp
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ssh-mcp-bearer
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "^haku-console$,^agentplane-staging$"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "^haku-console$,^agentplane-staging$"
      data:
        bearer-token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ssh-mcp-bearer
