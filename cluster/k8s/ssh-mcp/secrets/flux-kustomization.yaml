apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ssh-mcp-secrets
  namespace: ducktape-flux
  annotations:
    description: Shared SSH MCP bearer and backend image pull credentials.
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/ssh-mcp/secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: ssh-mcp-namespace
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
