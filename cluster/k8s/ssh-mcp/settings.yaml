# configMapGenerator input; not a standalone Kubernetes manifest (kubeconform-excluded).
known_hosts_file: /etc/ssh-mcp/known_hosts
command_timeout_seconds: 300
connect_timeout_seconds: 10
output_limit_bytes: 65536
max_concurrent_executions: 4
# Target identity is the (host, user) tuple. Missing key files keep the target visible
# through list_targets with an unavailable error.
targets:
  - host: wyrm2.nebula.allegedly.works
    user: agentydragon
    identity_file: /etc/ssh-mcp/keys/wyrm2-agentydragon
  - host: wyrm2.nebula.allegedly.works
    user: root
    identity_file: /etc/ssh-mcp/keys/wyrm2-root
  - host: rugged.nebula.allegedly.works
    user: agentydragon
    identity_file: /etc/ssh-mcp/keys/rugged-agentydragon
  - host: rugged.nebula.allegedly.works
    user: root
    identity_file: /etc/ssh-mcp/keys/rugged-root
  # public-coder-devbox: an in-cluster KubeVirt VM, reached over its own ClusterIP Service
  # (cluster/k8s/agents/public-coder-agent/devbox/service.yaml) rather than a Nebula hostAlias.
  - host: public-coder-devbox-ssh.public-coder-agent.svc.cluster.local
    user: root
    identity_file: /etc/ssh-mcp/keys-public-coder-devbox/public-coder-devbox-root
  - host: public-coder-devbox-ssh.public-coder-agent.svc.cluster.local
    user: coder
    identity_file: /etc/ssh-mcp/keys-public-coder-devbox/public-coder-devbox-coder
  # atlas: a Nebula peer like wyrm2/rugged, but not a Kubernetes node (Proxmox VE, ansible-
  # managed). Its sshd host key has never been captured -- see the known_hosts comment below --
  # so these targets stay listed and fail closed until an operator captures it.
  - host: atlas.nebula.allegedly.works
    user: root
    identity_file: /etc/ssh-mcp/keys-atlas/atlas-root
  - host: atlas.nebula.allegedly.works
    user: agentydragon
    identity_file: /etc/ssh-mcp/keys-atlas/atlas-agentydragon
