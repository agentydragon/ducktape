apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Standalone SSH MCP backend for haku-console and Agentplane staging.
  name: ssh-mcp
  namespace: ducktape-flux
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: ssh-mcp-namespace
    - name: external-secrets-config
    - name: forgejo-images
  interval: 10m
  path: ./cluster/k8s/ssh-mcp
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: ssh-mcp
    namespace: ducktape-flux
  timeout: 5m
  wait: true
