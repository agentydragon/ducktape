apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ssh-mcp
  namespace: ducktape-flux
  annotations:
    description: Standalone SSH MCP backend for haku-console and Agentplane staging.
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./cluster/k8s/ssh-mcp
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  sourceRef:
    kind: ExternalArtifact
    name: ssh-mcp
    namespace: ducktape-flux
  dependsOn:
    - name: ssh-mcp-namespace
      namespace: ducktape-flux
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
