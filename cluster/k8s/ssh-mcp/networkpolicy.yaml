# Cluster-internal MCP backend. Only haku-console and Agentplane staging are callers; SSH egress is
# constrained to port 22 on cluster nodes, which is where the Nebula-addressed targets live
# (nebula-mesh.json at the repo root). Which of those nodes a target actually names is decided by
# settings.yaml, and reaching one still requires a key the Secret holds.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ssh-mcp
  namespace: ssh-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ssh-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentplane-staging
            app.kubernetes.io/name: agentplane-actions
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: haku-console
            app.kubernetes.io/name: haku-console
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Gotcha: wyrm2 and rugged are cluster nodes whose InternalIPs are their Nebula addresses
    # (10.42.0.20 / 10.42.0.30). Cilium gives node IPs the host/remote-node identity, and a
    # CIDR selector does not match those unless the agent runs with
    # `policy-cidr-match-mode: nodes` -- which this cluster does not set. A `toCIDR` rule
    # naming those addresses therefore selects nothing and every SSH connection times out.
    # Keep this as entities until that flag is set cluster-wide.
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
