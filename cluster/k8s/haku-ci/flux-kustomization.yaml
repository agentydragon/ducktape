apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haku-ci
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: forgejo
      namespace: ducktape-flux
    - name: keda
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: haku-forgejo-tea
      namespace: ducktape-flux
  interval: 10m
  path: ./cluster/k8s/haku-ci
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: haku-ci
    namespace: ducktape-flux
  timeout: 5m
  wait: false
