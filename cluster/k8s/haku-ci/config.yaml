# act_runner (forgejo-runner) daemon config. Jobs run in a standard "act" image
# (catthehacker/ubuntu) that carries node + git + the docker CLI, talking to the
# rootless dind sidecar via DOCKER_HOST. node+git let JS actions (actions/checkout)
# run; the docker CLI reaches dind for `docker build`/`docker push`. capacity:1 keeps
# builds serial (bounded blast radius + resource use). See README for builder notes.
log:
  level: info
runner:
  capacity: 1
  timeout: 30m
  # `<label>:docker://<image>` runs jobs in that container image. Must carry the
  # docker CLI (to reach the dind sidecar) AND node+git (so actions/checkout and
  # other JS actions run). The standard act image bundles all three.
  labels:
    - "haku-ci:docker://catthehacker/ubuntu:act-latest"
container:
  # How the RUNNER reaches the dind daemon: it shares the pod network namespace
  # with the dind sidecar, so localhost works here.
  docker_host: "tcp://localhost:2375"
  # How JOB CONTAINERS reach the dind daemon. They run on a per-job docker bridge
  # network (not the pod netns), so `localhost` is the job container itself — the
  # default unix socket doesn't exist and `docker build`/`push` fail. Map
  # host.docker.internal to the host-gateway (the dind/pod) and point DOCKER_HOST
  # at it so the in-container docker CLI talks to the dind sidecar.
  #
  # The build steps (bazel/bazelisk, npm, pip, git) run INSIDE these job containers,
  # so their egress must go through haku-egress-proxy and trust its CA. A folded
  # scalar (>-) can't carry inline comments (they'd become literal args), so the
  # per-arg rationale — each entry is either load-bearing (why) or a trim candidate
  # (TODO) — lives here, arg-group by arg-group:
  #
  #   --add-host + -e DOCKER_HOST  → REQUIRED. Reach dind from the per-job bridge net
  #     (see the DOCKER_HOST note above); nothing to trim.
  #   -e HTTP_PROXY / HTTPS_PROXY  → REQUIRED. act/forgejo-runner do NOT forward the
  #     runner's own proxy env into job containers (nektos/act#1578), so egress has to
  #     be injected per-job here. Can only disappear by baking them into a custom job
  #     image's ENV.
  #   -e NO_PROXY  → REQUIRED (keeps dind + the in-cluster Forgejo git/registry direct),
  #     but the LIST is a trim candidate. TODO(check): confirm each entry is load-bearing
  #     — loopback + host.docker.internal are; `10.0.0.0/8` and the explicit
  #     forgejo-http.forgejo{,.svc.cluster.local} may be redundant with the `.forgejo` /
  #     `.svc.cluster.local` suffixes (NO_PROXY suffix-match semantics differ per tool —
  #     Go vs curl vs python — so verify against a real job before dropping any).
  #   -e SSL_CERT_FILE / CURL_CA_BUNDLE / GIT_SSL_CAINFO  → belt-and-suspenders, likely
  #     TRIMMABLE. These point curl/git/openssl at the CA, but the `/etc/ssl/certs` mount
  #     below already makes it the system default those tools read. TODO(after 1st green):
  #     drop.
  #   -e REQUESTS_CA_BUNDLE / NODE_EXTRA_CA_CERTS  → needed ONLY by tools that ignore the
  #     system store (python-requests, node). TODO(after 1st green): a pure Bazel build
  #     may never invoke either (Bazel fetches via its JDK downloader → cacerts, handled
  #     in the build image, NOT here); drop whichever the build doesn't touch.
  #   -v …:/egress-proxy-ca/ca-certificates.crt  → provides the path the CA env vars point
  #     at; trim together with those env vars.
  #   -v …:/etc/ssl/certs/ca-certificates.crt  → REQUIRED. Overlays the CA onto the system
  #     trust store so system-store readers (curl/git) trust the proxy's bumped TLS with no
  #     per-tool var — this is the mount that makes the three env vars above redundant.
  #
  # NOTE: Bazel's Java repository downloader reads none of these (it uses the JDK
  # truststore) — the haku-state build image must import the CA into cacerts
  # (`keytool -importcert` / `update-ca-certificates`).
  #
  # The clean end-state that erases most of this: a custom job image with the CA baked
  # in (update-ca-certificates) + proxy ENV, collapsing `options` to --add-host +
  # -e DOCKER_HOST. Deferred pending the first green build (operator decision, PR #2799).
  #
  # Folded scalar (>-): reads as one arg per line but act_runner sees a single
  # space-joined string. One `-e`/`-v` per line — keep them contiguous (a blank line in
  # a folded scalar becomes a newline and would corrupt the options string).
  options: >-
    --add-host host.docker.internal:host-gateway
    -e DOCKER_HOST=tcp://host.docker.internal:2375
    -e HTTP_PROXY=http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
    -e HTTPS_PROXY=http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
    -e NO_PROXY=127.0.0.1,localhost,host.docker.internal,forgejo-http.forgejo,forgejo-http.forgejo.svc.cluster.local,.forgejo,.svc.cluster.local,10.0.0.0/8
    -e SSL_CERT_FILE=/egress-proxy-ca/ca-certificates.crt
    -e CURL_CA_BUNDLE=/egress-proxy-ca/ca-certificates.crt
    -e GIT_SSL_CAINFO=/egress-proxy-ca/ca-certificates.crt
    -e REQUESTS_CA_BUNDLE=/egress-proxy-ca/ca-certificates.crt
    -e NODE_EXTRA_CA_CERTS=/egress-proxy-ca/ca-certificates.crt
    -v /egress-proxy-ca/ca-certificates.crt:/egress-proxy-ca/ca-certificates.crt:ro
    -v /egress-proxy-ca/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    -e DOCKER_CONFIG=/etc/oci-auth
    -v /etc/oci-auth/config.json:/etc/oci-auth/config.json:ro
  # Allow the runner's own CA + oci-auth bind mounts above through act_runner's volume
  # gate (a Haku-authored workflow still cannot mount arbitrary dind-host paths).
  # DOCKER_CONFIG points Bazel rules_oci at the puller creds for oci-cache.allegedly.works
  # so base-image pulls resolve through the authenticated cache, not Docker Hub.
  valid_volumes:
    - /egress-proxy-ca/ca-certificates.crt
    - /etc/oci-auth/config.json
cache:
  enabled: false
