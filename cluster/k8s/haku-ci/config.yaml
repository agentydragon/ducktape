# act_runner (forgejo-runner) daemon config. Jobs run in a standard "act" image
# (catthehacker/ubuntu) that carries node + git + the docker CLI, talking to the
# rootless dind sidecar via DOCKER_HOST. node+git let JS actions (actions/checkout)
# run; the docker CLI reaches dind for `docker build`/`docker push`. capacity:1 keeps
# builds serial (bounded blast radius + resource use). See README for builder notes.
log:
  level: info
runner:
  capacity: 1
  timeout: 30m
  # `<label>:docker://<image>` runs jobs in that container image. Must carry the
  # docker CLI (to reach the dind sidecar) AND node+git (so actions/checkout and
  # other JS actions run). The standard act image bundles all three.
  labels:
    - "haku-ci:docker://catthehacker/ubuntu:act-latest"
container:
  # How the RUNNER reaches the dind daemon: it shares the pod network namespace
  # with the dind sidecar, so localhost works here.
  docker_host: "tcp://localhost:2375"
  # How JOB CONTAINERS reach the dind daemon. They run on a per-job docker bridge
  # network (not the pod netns), so `localhost` is the job container itself — the
  # default unix socket doesn't exist and `docker build`/`push` fail. Map
  # host.docker.internal to the host-gateway (the dind/pod) and point DOCKER_HOST
  # at it so the in-container docker CLI talks to the dind sidecar.
  #
  # The build steps (bazel/bazelisk, npm, pip, git) run INSIDE these job
  # containers, so their external egress must also go through haku-egress-proxy and trust
  # its CA. `-e HTTP_PROXY/HTTPS_PROXY/NO_PROXY` route egress (NO_PROXY keeps dind +
  # the in-cluster Forgejo registry direct); the two `-v` mounts inject the
  # haku-egress-proxy CA bundle — the source path is on the DIND daemon's filesystem, where
  # the CA volume is mounted (deployment.yaml) — both at the env-pointed path and
  # over the system trust store (/etc/ssl/certs/ca-certificates.crt) so tools that
  # only read the system bundle trust it too. The per-tool CA env vars cover
  # git/curl/python/node. NOTE: Bazel's Java repository downloader does NOT read
  # these (it uses the JDK truststore) — the haku-state build image must import the
  # CA into cacerts (e.g. `keytool -importcert` / `update-ca-certificates`).
  options: "--add-host host.docker.internal:host-gateway -e DOCKER_HOST=tcp://host.docker.internal:2375 -e HTTP_PROXY=http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080 -e HTTPS_PROXY=http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080 -e NO_PROXY=127.0.0.1,localhost,host.docker.internal,forgejo-http.forgejo,forgejo-http.forgejo.svc.cluster.local,.forgejo,.svc.cluster.local,10.0.0.0/8 -e SSL_CERT_FILE=/egress-proxy-ca/ca-certificates.crt -e CURL_CA_BUNDLE=/egress-proxy-ca/ca-certificates.crt -e GIT_SSL_CAINFO=/egress-proxy-ca/ca-certificates.crt -e REQUESTS_CA_BUNDLE=/egress-proxy-ca/ca-certificates.crt -e NODE_EXTRA_CA_CERTS=/egress-proxy-ca/ca-certificates.crt -v /egress-proxy-ca/ca-certificates.crt:/egress-proxy-ca/ca-certificates.crt:ro -v /egress-proxy-ca/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro"
  # Allow the runner's own CA bind mounts above through act_runner's volume gate
  # (a Haku-authored workflow still cannot mount arbitrary dind-host paths).
  valid_volumes:
    - /egress-proxy-ca/ca-certificates.crt
cache:
  enabled: false
