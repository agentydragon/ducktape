# forgejo-runner config, shared by the two commands each ephemeral pod runs:
# `register --ephemeral` then `one-job --wait` (scaledjob.yaml). Jobs run in a standard
# "act" image (catthehacker/ubuntu) that carries node + git + the docker CLI, talking to
# the rootless dind sidecar via DOCKER_HOST. node+git let JS actions (actions/checkout)
# run; the docker CLI reaches dind for `docker build`/`docker push`. See README for
# builder notes.
log:
  level: info
runner:
  # Where `register` writes the registration it hands to `one-job`. Set explicitly
  # rather than relying on the image's WORKDIR (/data) and the relative default.
  file: /data/.runner
  # One job per pod is enforced by `one-job`; this keeps the two in agreement.
  capacity: 1
  # Was 30m, which the `bazel-ci / image` job came within three minutes of (27m03s
  # observed). One job per pod also means the Bazel cache no longer carries over
  # between CI jobs, so builds get slower, not faster — this needs real headroom.
  # Keep at or below the Job's activeDeadlineSeconds in scaledjob.yaml.
  timeout: 1h
  # On SIGTERM, finish the running job instead of dropping it.
  #
  # This used to be load-bearing against KEDA: the old ScaledObject scaled on QUEUED
  # jobs, so a job that had started read as zero demand and the HPA reaped its pod
  # mid-build. It never actually worked, because dind was an ordinary container and
  # was SIGTERMed in parallel — the runner waited politely on a job whose containers
  # dockerd had already destroyed. The ScaledJob migration removes the reaping and the
  # native-sidecar dind fixes the ordering; what's left for this setting is node drains
  # and evictions. Must stay <= the pod's terminationGracePeriodSeconds, or the kubelet
  # SIGKILLs before this timeout can elapse.
  shutdown_timeout: 30m
  # `<label>:docker://<image>` runs jobs in that container image. Must carry the
  # docker CLI (to reach the dind sidecar) AND node+git (so actions/checkout and
  # other JS actions run). The standard act image bundles all three.
  labels:
    - "haku-ci:docker://catthehacker/ubuntu:act-latest"
container:
  # How the RUNNER reaches the dind daemon: it shares the pod network namespace
  # with the dind sidecar, so localhost works here.
  docker_host: "tcp://localhost:2375"
  # How JOB CONTAINERS reach the dind daemon. They run on a per-job docker bridge
  # network (not the pod netns), so `localhost` is the job container itself — the
  # default unix socket doesn't exist and `docker build`/`push` fail. Map
  # host.docker.internal to the host-gateway (the dind/pod) and point DOCKER_HOST
  # at it so the in-container docker CLI talks to the dind sidecar.
  #
  # The build steps (bazel/bazelisk, npm, pip, git) run INSIDE these job containers,
  # so their egress must go through haku-egress-proxy and trust its CA. A folded
  # scalar (>-) can't carry inline comments (they'd become literal args), so the
  # per-arg rationale — each entry is either load-bearing (why) or a trim candidate
  # (TODO) — lives here, arg-group by arg-group:
  #
  #   --add-host + -e DOCKER_HOST  → REQUIRED. Reach dind from the per-job bridge net
  #     (see the DOCKER_HOST note above); nothing to trim.
  #   -e HTTP_PROXY / HTTPS_PROXY  → REQUIRED. act/forgejo-runner do NOT forward the
  #     runner's own proxy env into job containers (nektos/act#1578), so egress has to
  #     be injected per-job here. Can only disappear by baking them into a custom job
  #     image's ENV.
  #   -e NO_PROXY  → REQUIRED (keeps dind + the in-cluster Forgejo git/registry direct),
  #     but the LIST is a trim candidate. TODO(check): confirm each entry is load-bearing
  #     — loopback + host.docker.internal are; `10.0.0.0/8` and the explicit
  #     forgejo-http.forgejo{,.svc.cluster.local} may be redundant with the `.forgejo` /
  #     `.svc.cluster.local` suffixes (NO_PROXY suffix-match semantics differ per tool —
  #     Go vs curl vs python — so verify against a real job before dropping any).
  #     Keep *.allegedly.works / .allegedly.works load-bearing: public cluster names
  #     resolve to the hostNetwork Cilium Gateway node IPs. If the haku-egress-proxy
  #     handles that CONNECT itself, DNS can choose the proxy pod's own Gateway node and
  #     the same-node public-Gateway hairpin returns Envoy "Access denied" for the proxy
  #     identity. Direct job-container egress to those names is still CNP-limited to
  #     cluster destinations, not general internet.
  #   -e SSL_CERT_FILE / CURL_CA_BUNDLE / GIT_SSL_CAINFO  → belt-and-suspenders, likely
  #     TRIMMABLE. These point curl/git/openssl at the CA, but the `/etc/ssl/certs` mount
  #     below already makes it the system default those tools read. TODO(after 1st green):
  #     drop.
  #   -e REQUESTS_CA_BUNDLE / NODE_EXTRA_CA_CERTS  → needed ONLY by tools that ignore the
  #     system store (python-requests, node). TODO(after 1st green): a pure Bazel build
  #     may never invoke either (Bazel fetches via its JDK downloader → cacerts, handled
  #     in the build image, NOT here); drop whichever the build doesn't touch.
  #   -v …:/egress-proxy-ca/ca-certificates.crt  → provides the path the CA env vars point
  #     at; trim together with those env vars.
  #   -v …:/etc/ssl/certs/ca-certificates.crt  → REQUIRED. Overlays the CA onto the system
  #     trust store so system-store readers (curl/git) trust the proxy's bumped TLS with no
  #     per-tool var — this is the mount that makes the three env vars above redundant.
  #
  # NOTE: Bazel's Java repository downloader reads none of these (it uses the JDK
  # truststore) — the haku-state build image must import the CA into cacerts
  # (`keytool -importcert` / `update-ca-certificates`).
  #
  # The clean end-state that erases most of this: a custom job image with the CA baked
  # in (update-ca-certificates) + proxy ENV, collapsing `options` to --add-host +
  # -e DOCKER_HOST. Deferred pending the first green build (operator decision, PR #2799).
  #
  # Folded scalar (>-): reads as one arg per line but act_runner sees a single
  # space-joined string. One `-e`/`-v` per line — keep them contiguous (a blank line in
  # a folded scalar becomes a newline and would corrupt the options string).
  options: >-
    --add-host host.docker.internal:host-gateway
    -e DOCKER_HOST=tcp://host.docker.internal:2375
    -e HTTP_PROXY=http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
    -e HTTPS_PROXY=http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
    -e NO_PROXY=127.0.0.1,localhost,host.docker.internal,*.allegedly.works,.allegedly.works,forgejo-http.forgejo,forgejo-http.forgejo.svc.cluster.local,.forgejo,.svc.cluster.local,10.0.0.0/8
    -e SSL_CERT_FILE=/egress-proxy-ca/ca-certificates.crt
    -e CURL_CA_BUNDLE=/egress-proxy-ca/ca-certificates.crt
    -e GIT_SSL_CAINFO=/egress-proxy-ca/ca-certificates.crt
    -e REQUESTS_CA_BUNDLE=/egress-proxy-ca/ca-certificates.crt
    -e NODE_EXTRA_CA_CERTS=/egress-proxy-ca/ca-certificates.crt
    -v /egress-proxy-ca/ca-certificates.crt:/egress-proxy-ca/ca-certificates.crt:ro
    -v /egress-proxy-ca/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    -v /bazel-cache:/root/.cache
  # NO oci-cache credential is injected. The oci-cache Zot registry is a public
  # pull-through cache — anonymous by design; only its *public* HTTPRoute is fronted
  # by a basic-auth sidecar. In-cluster consumers reach Zot's internal Service
  # (oci-cache.oci-cache.svc.cluster.local, covered by the .svc.cluster.local NO_PROXY
  # suffix above, and by the dind --registry-mirror in deployment.yaml) with no
  # credential — so dind base-image pulls need no DOCKER_CONFIG.
  # COUPLING: Bazel rules_oci does NOT go through the dind mirror (it has its own
  # puller), so haku-state's MODULE.bazel oci.pull refs must point at the internal
  # Service (insecure/HTTP), not oci-cache.allegedly.works — otherwise, with this cred
  # gone, an explicit public-host ref 401s. Land that MODULE.bazel switch alongside this.
  #
  # (Was: -e DOCKER_CONFIG=/etc/oci-auth + a read-only config.json bind mount, to hand
  # rules_oci the public-door puller creds. That made DOCKER_CONFIG a read-only mount,
  # which broke `docker login` in every other job — `rename … device or resource busy`.
  # Removed 2026-07-05.)
  #
  # Allow the runner's own CA bind mount + the pod-local Bazel-cache mount above through
  # act_runner's volume gate (a Haku-authored workflow still cannot mount arbitrary dind-host
  # paths). `-v /bazel-cache:/root/.cache` maps the runner pod's emptyDir (scaledjob.yaml)
  # onto each job container's ~/.cache, so the Bazel output base + --disk_cache + repo cache
  # persist across otherwise-ephemeral job containers on that pod. Since the ScaledJob
  # migration the pod itself lasts exactly one CI job, so this now warms only the Bazel
  # invocations WITHIN a job (bazel-ci runs `Test` then `Build`) rather than successive jobs.
  # Same host-path bind mechanism as the CA mounts (resolved on the dind filesystem, where
  # the emptyDir is mounted at /bazel-cache).
  valid_volumes:
    - /egress-proxy-ca/ca-certificates.crt
    - /bazel-cache
# No act_runner cache server (that backs actions/cache) — the pod-local Bazel cache is the
# bind-mounted emptyDir above, not a tar'd-and-uploaded actions/cache blob.
cache:
  enabled: false
