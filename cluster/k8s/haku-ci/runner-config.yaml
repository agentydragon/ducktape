apiVersion: v1
kind: ConfigMap
metadata:
  name: haku-runner-config
  namespace: haku-ci
data:
  # act_runner (forgejo-runner) daemon config. Jobs run in a docker-cli container
  # (so workflows can `docker build`/`docker push`) talking to the rootless dind
  # sidecar via DOCKER_HOST. capacity:1 keeps builds serial (bounded blast radius +
  # resource use). See README for the labels/builder iterate notes.
  config.yaml: |
    log:
      level: info
    runner:
      capacity: 1
      timeout: 30m
      # `<label>:docker://<image>` runs jobs in that container image (which must
      # carry the docker CLI to reach the dind sidecar).
      labels:
        - "docker:docker://docker:27-cli"
    container:
      # The dind-rootless sidecar; no privileged daemon, no host docker socket.
      docker_host: "tcp://localhost:2375"
      # Don't try to mount a host docker socket into job containers.
      options: ""
    cache:
      enabled: false
