apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level `namespace:` transformer: haku-ci.k8s.yaml holds a cluster-scoped
# CiliumClusterwideNetworkPolicy that must NOT be stamped with a namespace. Its
# namespaced objects already set `namespace: haku-ci` explicitly.
resources:
  # cdk8s-generated (cluster/cdk8s/haku_ci/runner.py) -- see cluster/docs/cdk8s.md.
  - haku-ci.k8s.yaml
