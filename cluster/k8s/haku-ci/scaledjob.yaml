# Forgejo's /metrics endpoint exposes no Actions queue-depth metric. KEDA's
# native forgejo-runner scaler instead polls Forgejo's authenticated,
# repo-scoped runner-jobs endpoint, filtered to this runner label. Its result is
# exactly the number of jobs presently waiting for a haku-ci runner.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: haku-ci-forgejo
  namespace: haku-ci
spec:
  secretTargetRef:
    - parameter: token
      name: haku-forgejo-tea
      key: token
---
# ScaledJob, NOT ScaledObject — this is the whole point of this file.
#
# The forgejo-runner trigger counts QUEUED jobs. Under a ScaledObject that metric
# drives an HPA over a long-lived Deployment, and the same number that scales up
# also scales down: the moment a runner picks a job up the metric returns to zero,
# the HPA concludes the pods are idle, and it deletes one at random. It has no way
# to know which pod is mid-build. That reaped builds on `haku-state` repeatedly
# (see README, "Queue autoscaling").
#
# Under a ScaledJob the same metric is only ever a CREATE signal. KEDA translates
# "N jobs queued" into "create N Kubernetes Jobs", never deletes a running one, and
# each pod ends its own life when its single CI job is done. There is no scale-down
# path to get wrong, so the failure mode is structurally absent rather than mitigated.
# This is also the shape the scaler is documented for:
# https://keda.sh/docs/2.20/scalers/forgejo/
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: haku-runner
  namespace: haku-ci
  labels:
    app.kubernetes.io/name: haku-runner
spec:
  # One pod per queued job, up to four concurrently. No minimum: between bursts
  # there are no runner pods at all, which was already true under the ScaledObject
  # (minReplicaCount: 0) — the runner holds no state worth keeping warm.
  maxReplicaCount: 4
  pollingInterval: 15
  successfulJobsHistoryLimit: 3
  # Keep more failures than successes: a failed pod's logs are the only forensics
  # for an infrastructure fault (registration refused, dind never came up), since a
  # failed *build* exits 0 here — see `backoffLimit` below.
  failedJobsHistoryLimit: 5
  # gradual = editing this ScaledJob does NOT delete Jobs already running. The
  # default ("immediate") would kill in-flight builds on every Flux reconcile that
  # touches this file, reintroducing the exact bug this migration removes, just with
  # a different trigger.
  rollout:
    strategy: gradual
  jobTargetRef:
    parallelism: 1
    completions: 1
    # No Kubernetes-level retry. A failed *build* is not a failed Job — the runner
    # reports the failure to Forgejo and exits 0 — so a non-zero exit here means an
    # infrastructure fault, and retrying it in-place would just fail the same way.
    # The correct retry already exists: the CI job stays queued, so the next KEDA
    # poll creates a fresh pod.
    backoffLimit: 0
    # Upper bound on the pod's whole life: waiting for a task + running it.
    # `one-job --wait` blocks until Forgejo hands it a task, so a pod created for a
    # job that is cancelled before pickup would otherwise wait forever holding one
    # of the four slots. 70m = config.yaml's `timeout: 1h` plus slack.
    activeDeadlineSeconds: 4200
    template:
      metadata:
        labels:
          app.kubernetes.io/name: haku-runner
      spec:
        restartPolicy: Never
        automountServiceAccountToken: false
        # Only matters for eviction/drain now — nothing deletes this pod mid-build
        # any more. Slightly above config.yaml's `shutdown_timeout: 30m` so a drained
        # node lets a build of up to that length finish instead of dropping it.
        terminationGracePeriodSeconds: 1830
        # This privileged, agent-controlled build compute runs only on approved always-on
        # workers: non-control-plane HIL nodes and the home OptiPlex. Their Talos configs
        # enable the user namespaces rootless dind needs; roaming and unrelated workers
        # remain ineligible without introducing a separately reconciled capability label.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: topology.kubernetes.io/region
                      operator: In
                      values: ["hil"]
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: ["optiplex"]
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        # Requests describe only the runner's idle footprint, so the default scheduler's
        # resource scoring alone can co-locate an entire four-job burst. Prefer an even
        # host spread, but keep CI available when only one capable worker is schedulable.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: haku-runner
        initContainers:
          # dind is a NATIVE SIDECAR (an initContainer with restartPolicy: Always),
          # not an ordinary container. Two things depend on that, and both are
          # load-bearing:
          #
          # 1. TERMINATION ORDER. Ordinary containers are SIGTERMed in parallel, so
          #    dockerd died alongside the runner and took the build containers with
          #    it — which is why `shutdown_timeout: 30m` + a 2100s grace period did
          #    NOT save the reaped builds they were added for: the runner waited
          #    gracefully on a job whose containers no longer existed. Native sidecars
          #    are terminated only AFTER the main container exits.
          # 2. JOB COMPLETION. In a Job, an ordinary dind container would never exit,
          #    so the Job would never reach Complete. A native sidecar is torn down by
          #    the kubelet when `runner` finishes. Without this the ScaledJob does not
          #    work at all.
          #
          # The startupProbe gates the runner on dockerd actually listening — under a
          # Deployment a too-early runner just crash-looped until dind was up, but with
          # restartPolicy: Never that first crash would fail the whole Job.
          #
          # privileged: true is the documented requirement for docker:dind-rootless — it
          # provides /dev (incl. /dev/net/tun for RootlessKit) and disables the mount masks
          # that otherwise hide those devices from RootlessKit's nested namespaces. The
          # non-privileged path cleared seccomp (PSA) + user.max_user_namespaces (the OVH
          # worker sysctl) but still couldn't create the rootless TAP because of the masks.
          # Crucially the DAEMON still runs ROOTLESS (UID 1000 via the -rootless image), so
          # this is strictly better than classic rootful dind; the privileged POD is the
          # price, contained by haku-ci being operator-only (no Haku RBAC), off control
          # planes, and egress-fenced. See README.
          - name: dind
            image: docker:27-dind-rootless
            restartPolicy: Always
            args:
              - --host=tcp://0.0.0.0:2375
              - --tls=false
              # Pull Docker Hub base images through the in-cluster oci-cache Zot mirror
              # instead of docker.io (+ its CDN fronts) directly — that's why the Docker
              # Hub FQDNs are gone from the haku-egress-proxy allowlist. The mirror serves
              # Docker Hub at its root and fetches from origin under oci-cache's own egress.
              # `.svc.cluster.local` so NO_PROXY routes it direct (not via the proxy);
              # insecure-registry because oci-cache is plain HTTP on :80. Classic dockerd
              # only mirrors Docker Hub — ghcr/quay still go direct via the proxy.
              - --registry-mirror=http://oci-cache.oci-cache.svc.cluster.local
              - --insecure-registry=oci-cache.oci-cache.svc.cluster.local
            # --tls=false alone isn't enough: the dind entrypoint defaults DOCKER_TLS_CERTDIR
            # to /certs and re-enables TLS on 2375, so the runner's plain-HTTP client hits
            # "HTTP request to an HTTPS server". Emptying it disables TLS so 2375 is plain HTTP
            # (localhost-only inside the pod). This is the last piece that lets the runner
            # connect to the rootless daemon.
            env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              # dockerd pulls base images through haku-egress-proxy. Docker >=23 reads these
              # proxy vars from the daemon environment for registry pulls; NO_PROXY
              # keeps the in-cluster Forgejo registry push and public cluster Gateway
              # names direct. dockerd is Go, so SSL_CERT_FILE points its registry-TLS
              # trust at the haku-egress-proxy CA bundle (a full bundle incl. system +
              # cluster roots), so it validates the intercepted registry TLS.
              - name: HTTP_PROXY
                value: http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
              - name: HTTPS_PROXY
                value: http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
              - name: NO_PROXY
                value: 127.0.0.1,localhost,host.docker.internal,*.allegedly.works,.allegedly.works,forgejo-http.forgejo,forgejo-http.forgejo.svc.cluster.local,.forgejo,.svc.cluster.local,10.0.0.0/8
              - name: SSL_CERT_FILE
                value: /egress-proxy-ca/ca-certificates.crt
            startupProbe:
              tcpSocket:
                port: 2375
              periodSeconds: 2
              failureThreshold: 90
            securityContext:
              privileged: true
              runAsUser: 1000
              runAsGroup: 1000
            volumeMounts:
              - name: docker-data
                mountPath: /var/lib/docker
              - name: egress-proxy-ca
                mountPath: /egress-proxy-ca
                readOnly: true
              # dind resolves the `-v /bazel-cache:/root/.cache` job-container bind mount
              # (config.yaml) against its own filesystem, so the pod-local emptyDir must be
              # mounted here rather than just in the runner.
              - name: bazel-cache
                mountPath: /bazel-cache
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: "3"
                memory: 6Gi
        containers:
          # The Forgejo Actions runner: registers EPHEMERALLY with the haku-state repo,
          # waits for exactly one job, runs it in a docker-cli job container against the
          # dind sidecar, and exits — which completes the Job and ends the pod.
          - name: runner
            # Pinned, and a major jump from the old floating `:6` tag — unavoidable, since
            # `one-job` needs runner >6.1 and `register --ephemeral` needs both a recent
            # runner and a Forgejo 15+ server (this instance reports 15.0.3). 12.13.2 rather
            # than the newest 13.0.0: it carries `--ephemeral`, `one-job` and `--wait`
            # (verified in its source tree) with several more weeks of soak. Pinned rather
            # than floating so an upstream release can't silently change CI behaviour.
            # ⚠️ Crossing 8.0.0 means workflows are now schema-validated and will REFUSE to
            # run if they don't parse — see README, "Upgrading the runner image".
            image: code.forgejo.org/forgejo/runner:12.13.2
            command: ["sh", "-c"]
            # --ephemeral tells Forgejo to DELETE this runner registration once it has run
            # one job. The old Deployment re-registered on every pod start and never
            # deregistered — its comment claimed "ephemeral" but the flag was absent, and
            # the repo had accumulated 529 runner registrations, 525 of them offline.
            # --ephemeral is refused outright by servers older than Forgejo 15, so this
            # fails loudly rather than drifting silently.
            #
            # `one-job --wait` blocks until Forgejo assigns a task, runs it, and exits.
            # The --wait matters: without it the runner makes a single fetch attempt and
            # exits NON-ZERO if the task isn't dispatchable in that instant, which would
            # fail the Job on a pure startup race. Bounded by activeDeadlineSeconds above.
            args:
              - |
                set -e
                forgejo-runner register --no-interactive --ephemeral \
                  --instance "$FORGEJO_INSTANCE_URL" \
                  --token "$(cat /secrets/token)" \
                  --name "$RUNNER_NAME" \
                  --labels "haku-ci:docker://catthehacker/ubuntu:act-latest" \
                  --config /config/config.yaml
                exec forgejo-runner one-job --wait --config /config/config.yaml
            env:
              - name: FORGEJO_INSTANCE_URL
                value: http://forgejo-http.forgejo:3000
              - name: RUNNER_NAME
                # Every pod registers separately. A fixed name would race or overwrite
                # registrations when KEDA starts additional pods.
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: DOCKER_HOST
                value: tcp://localhost:2375
              # Route the runner's external egress (fetching `uses:` actions from
              # data.forgejo.org, etc.) through haku-egress-proxy — the sole external door
              # (ccnp-force-proxy-egress.yaml). NO_PROXY keeps in-cluster Forgejo
              # (git + registry, long-poll), public cluster Gateway names
              # (*.allegedly.works), and the localhost dind socket direct. The public
              # names still land on Cilium Gateway nodes and stay bounded by the
              # cluster-only CNP; sending them through haku-egress-proxy creates a
              # DNS-round-robin chance of proxy-pod -> own-node Gateway self-hairpin,
              # which Cilium Gateway answers with Envoy "Access denied" for this
              # policy-constrained identity. Include both wildcard and suffix forms
              # because NO_PROXY matching differs by client.
              - name: HTTP_PROXY
                value: http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
              - name: HTTPS_PROXY
                value: http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
              - name: NO_PROXY
                value: 127.0.0.1,localhost,host.docker.internal,*.allegedly.works,.allegedly.works,forgejo-http.forgejo,forgejo-http.forgejo.svc.cluster.local,.forgejo,.svc.cluster.local,10.0.0.0/8
              - name: SSL_CERT_FILE
                value: /egress-proxy-ca/ca-certificates.crt
              - name: CURL_CA_BUNDLE
                value: /egress-proxy-ca/ca-certificates.crt
              - name: GIT_SSL_CAINFO
                value: /egress-proxy-ca/ca-certificates.crt
              - name: REQUESTS_CA_BUNDLE
                value: /egress-proxy-ca/ca-certificates.crt
              - name: NODE_EXTRA_CA_CERTS
                value: /egress-proxy-ca/ca-certificates.crt
            volumeMounts:
              - name: config
                mountPath: /config
                readOnly: true
              - name: token
                mountPath: /secrets
                readOnly: true
              - name: runner-data
                mountPath: /data
              - name: egress-proxy-ca
                mountPath: /egress-proxy-ca
                readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 1Gi
        volumes:
          - name: config
            configMap:
              name: haku-runner-config
          - name: token
            secret:
              # Provisioned out-of-band during paving (see README): a repo-scoped
              # runner registration token for haku-state. The pod stays pending until
              # this Secret exists.
              secretName: haku-ci-runner-token
          # Holds the `.runner` file written by `register` (config.yaml pins the path).
          - name: runner-data
            emptyDir: {}
          - name: docker-data
            emptyDir: {}
          # Bazel cache (output base + --disk_cache + repo cache), bind-mounted into each
          # job container's ~/.cache. Under the old Deployment it also warmed SUCCESSIVE
          # jobs on a surviving pod; one job per pod means it now only spans the Bazel
          # invocations WITHIN a single CI job (bazel-ci's `Test` step then `Build`), which
          # is still most of the win. See README for the cost and the follow-up.
          - name: bazel-cache
            emptyDir: {}
          # haku-egress-proxy CA trust bundle, written into this namespace by the
          # trust-manager Bundle (agents/haku-egress-proxy/trust-bundle.yaml). Mounted into
          # both the runner and dind so intercepted external TLS validates.
          - name: egress-proxy-ca
            configMap:
              name: haku-egress-proxy-ca-cert
  triggers:
    - type: forgejo-runner
      # No `name:` — the docs list it as required, but the scaler filters on labels
      # and the current deployment has worked without it. A fixed name could not match
      # anyway: every pod registers under its own pod name.
      metadata:
        address: http://forgejo-http.forgejo:3000
        owner: haku
        repo: haku-state
        labels: haku-ci
      authenticationRef:
        name: haku-ci-forgejo
