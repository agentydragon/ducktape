apiVersion: apps/v1
kind: Deployment
metadata:
  name: haku-runner
  namespace: haku-ci
  labels:
    app.kubernetes.io/name: haku-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-runner
    spec:
      automountServiceAccountToken: false
      # Pin to the ACTUAL OVH workers (ks_game_worker0/1), not the OVH control planes.
      # The OVH CPs are schedulable (allowSchedulingOnControlPlanes) and region=hil, and
      # are misleadingly keyed kimsufi_worker0/1 in tofu though their role is controlplane
      # — so a plain region selector landed this runner on a control plane. That's wrong
      # twice over: (1) this is agent-controlled build compute, which must stay off
      # control-plane nodes, and (2) the user.max_user_namespaces sysctl rootless dind
      # needs is set only on role==worker nodes (cluster/terraform/main/ovh-nodes.tf), so
      # the runner must land there. Exclude any node carrying the control-plane label.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["hil"]
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        # The Forgejo Actions runner: registers (ephemerally) with the haku-state
        # repo via the registration token, long-polls for jobs, and runs them in
        # docker-cli job containers against the dind sidecar.
        - name: runner
          image: code.forgejo.org/forgejo/runner:6
          command: ["sh", "-c"]
          # Re-register on each start (ephemeral; no persisted .runner file/PVC),
          # then run the daemon. The registration token is repo-scoped (haku-state).
          args:
            - |
              set -e
              forgejo-runner register --no-interactive \
                --instance "$FORGEJO_INSTANCE_URL" \
                --token "$(cat /secrets/token)" \
                --name "$RUNNER_NAME" \
                --labels "haku-ci:docker://docker:27-cli" \
                --config /config/config.yaml
              exec forgejo-runner daemon --config /config/config.yaml
          env:
            - name: FORGEJO_INSTANCE_URL
              value: http://forgejo-http.forgejo:3000
            - name: RUNNER_NAME
              value: haku-ci
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: token
              mountPath: /secrets
              readOnly: true
            - name: runner-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
        # Docker daemon for the builds, listening only on localhost:2375 inside the pod.
        # privileged: true is the documented requirement for docker:dind-rootless — it
        # provides /dev (incl. /dev/net/tun for RootlessKit) and disables the mount masks
        # that otherwise hide those devices from RootlessKit's nested namespaces. The
        # non-privileged path cleared seccomp (PSA) + user.max_user_namespaces (the OVH
        # worker sysctl) but still couldn't create the rootless TAP because of the masks.
        # Crucially the DAEMON still runs ROOTLESS (UID 1000 via the -rootless image), so
        # this is strictly better than classic rootful dind; the privileged POD is the
        # price, contained by haku-ci being operator-only (no Haku RBAC), off control
        # planes, and egress-fenced. See README.
        - name: dind
          image: docker:27-dind-rootless
          args:
            - --host=tcp://0.0.0.0:2375
            - --tls=false
            # The build-ui workflow pushes to the Forgejo registry over the
            # in-cluster service (forgejo-http.forgejo:3000, plain HTTP) instead of
            # the public git.allegedly.works — keeps build traffic off the public
            # hairpin. dockerd rejects HTTP registries unless they're declared
            # insecure.
            - --insecure-registry=forgejo-http.forgejo:3000
          # --tls=false alone isn't enough: the dind entrypoint defaults DOCKER_TLS_CERTDIR
          # to /certs and re-enables TLS on 2375, so the runner's plain-HTTP client hits
          # "HTTP request to an HTTPS server". Emptying it disables TLS so 2375 is plain HTTP
          # (localhost-only inside the pod). This is the last piece that lets the runner
          # connect to the rootless daemon.
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 6Gi
      volumes:
        - name: config
          configMap:
            name: haku-runner-config
        - name: token
          secret:
            # Provisioned out-of-band during paving (see README): a repo-scoped
            # runner registration token for haku-state. The pod stays pending until
            # this Secret exists.
            secretName: haku-ci-runner-token
        - name: runner-data
          emptyDir: {}
        - name: docker-data
          emptyDir: {}
