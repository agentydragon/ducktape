---
# Cluster-wide self-signed CA for internal service certificates. It signs the root CA
# Certificate in cluster-ca.k8s.yaml (cluster/cdk8s/cert_manager/cluster_ca.py).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cluster-ca-bootstrap
spec:
  selfSigned: {}
---
# ClusterIssuer using the root CA for issuing internal certificates
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cluster-internal-ca
spec:
  ca:
    secretName: cluster-root-ca-secret
