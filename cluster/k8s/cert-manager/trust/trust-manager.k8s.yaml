apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager-trust
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager
  namespace: cert-manager-trust
spec:
  interval: 24h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager-trust
spec:
  chart:
    spec:
      chart: trust-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: cert-manager-trust
      version: 0.25.*
  install:
    remediation:
      retries: 3
  interval: 30m
  values:
    priorityClassName: system-cluster-critical
    replicaCount: 1
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
