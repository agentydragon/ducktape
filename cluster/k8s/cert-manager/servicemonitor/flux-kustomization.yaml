apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-servicemonitor
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/cert-manager/servicemonitor
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: cert-manager-servicemonitor

    namespace: ducktape-flux
  dependsOn:
    - name: cert-manager
      namespace: ducktape-flux
    - name: monitoring-stack
      namespace: ducktape-flux
