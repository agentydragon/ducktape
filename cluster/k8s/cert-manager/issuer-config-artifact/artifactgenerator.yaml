apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: cert-manager-issuer-config
  namespace: ducktape-flux
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: ducktape
      namespace: ducktape-flux
  artifacts:
    - name: cert-manager-issuer-config
      originRevision: "@repo"
      copy:
        - from: "@repo/cluster/k8s/cert-manager/issuer-config/**"
          to: "@artifact/cluster/k8s/cert-manager/issuer-config/"
          exclude:
            - flux-kustomization.yaml
