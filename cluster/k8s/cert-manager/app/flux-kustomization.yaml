apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: ducktape-flux
spec:
  dependsOn:
    - name: cert-manager-issuer-config
      namespace: ducktape-flux
    - name: reflector
      namespace: ducktape-flux
    - name: monitoring-crds
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager-webhook
      namespace: cert-manager
  interval: 10m
  path: ./cluster/k8s/cert-manager/app
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: cert-manager
    namespace: ducktape-flux
  timeout: 5m
  wait: true
