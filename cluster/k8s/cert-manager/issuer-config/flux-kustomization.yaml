apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuer-config
  namespace: ducktape-flux
spec:
  interval: 10m
  path: ./cluster/k8s/cert-manager/issuer-config
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: ExternalArtifact
    name: cert-manager-issuer-config
    namespace: ducktape-flux
  timeout: 5m
  wait: true
