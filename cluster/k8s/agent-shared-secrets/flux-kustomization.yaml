apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-shared-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/agent-shared-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  dependsOn:
    - name: claude-rbac
    - name: openclaw-sandbox
