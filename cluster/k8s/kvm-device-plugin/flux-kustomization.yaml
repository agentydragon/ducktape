apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kvm-device-plugin
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/kvm-device-plugin
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: generic-device-plugin
      namespace: kvm-device-plugin
