apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headscale-secrets
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./cluster/k8s/headscale-secrets"
  prune: true
  wait: true
  dependsOn:
    - name: external-secrets # kubernetes-headscale-secret-store must exist
    - name: headscale-namespace
    - name: headscale-db # headscale-db-headscale secret must exist before ESO can sync
