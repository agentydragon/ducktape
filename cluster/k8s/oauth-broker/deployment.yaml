apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-broker
  namespace: oauth-broker
  labels:
    app: oauth-broker
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oauth-broker
  template:
    metadata:
      labels:
        app: oauth-broker
    spec:
      serviceAccountName: oauth-broker
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: harbor-pull-robot
      containers:
        - name: oauth-broker
          image: registry.allegedly.works/ducktape/oauth-broker:devel-20260312071939-48ee228 # {"$imagepolicy": "flux-system:oauth-broker"}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OAUTH_BROKER_CONFIG
              value: /etc/oauth-broker/config.yaml
            - name: UV_PYTHON_PREFERENCE
              value: only-system
            - name: OURA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oura-client-credentials
                  key: client_id
            - name: OURA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oura-client-credentials
                  key: client_secret
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-client-credentials
                  key: client_id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-client-credentials
                  key: client_secret
          volumeMounts:
            - name: config
              mountPath: /etc/oauth-broker
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # readOnlyRootFilesystem incompatible with aspect_py_binary launcher
            # (uv needs to write to the venv directory baked into the image)
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: oauth-broker-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: tmp
          emptyDir: {}
