# Preserve the established flux-system Secret contract for GitOps controllers
# and Reflector while the canonical encrypted PAT lives in external-creds.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: flux-system
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-secrets-sync-pat
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    name: github-secrets-sync-pat
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          description: Fine-grained GitHub PAT for GitOps-managed GitHub resources and token-rotation commits. Required permissions and rationale are documented in cluster/k8s/github-secrets-sync/README.md.
  data:
    - secretKey: token
      remoteRef:
        key: github-agentydragon-2
        property: token
