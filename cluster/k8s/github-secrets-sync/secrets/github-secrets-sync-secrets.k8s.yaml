apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: flux-system
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-secrets-sync-pat
  namespace: flux-system
spec:
  data:
    - remoteRef:
        key: github-agentydragon-2
        property: token
      secretKey: token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: github-secrets-sync-pat
    template:
      metadata:
        annotations:
          description: Fine-grained GitHub PAT for GitOps-managed GitHub resources and token-rotation commits. Required permissions and rationale are documented in cluster/k8s/github-secrets-sync/README.md.
      type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buildbuddy-api-key
  namespace: flux-system
spec:
  data:
    - remoteRef:
        key: buildbuddy-api-key
        property: api-key
      secretKey: api-key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: buildbuddy-api-key
