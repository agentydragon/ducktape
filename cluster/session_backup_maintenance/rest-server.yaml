# Operator-created only; not in the Flux kustomization. Render the node name.
apiVersion: v1
kind: Pod
metadata:
  name: session-backup-maintenance
  namespace: session-backup
  labels:
    app.kubernetes.io/name: session-backup
spec:
  nodeName: ${MAINTENANCE_NODE}
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: rest-server
      image: docker.io/restic/rest-server:0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
      command: [rest-server]
      args: ["--path", "/data", "--htpasswd-file", "/auth/.htpasswd", "--private-repos", "--listen", "127.0.0.1:8000"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: data
          mountPath: /data
        - name: auth
          mountPath: /auth
          readOnly: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: session-backup-data-hdd
    - name: auth
      secret:
        secretName: session-backup-rest-server-auth
        defaultMode: 0440
