# Deb packages for the authentik-jwt-rotation CronJob image, which bakes the
# Python rotate.py rotator. git + ca-certificates provide the HTTPS git push;
# curl + jq remain available for in-container debugging on debian:trixie-slim.
#
# Regenerate the lock file after any change:
#   bazel run @trixie_authentik_rotation//:lock
version: 1

sources:
  - channel: trixie main
    url: https://snapshot.debian.org/archive/debian/20260301T000000Z
  - channel: trixie-security main
    url: https://snapshot.debian.org/archive/debian-security/20260301T000000Z

archs:
  - "amd64"

packages:
  - "bash"
  - "ca-certificates"
  - "curl"
  - "git"
  - "jq"
