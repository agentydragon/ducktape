apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - mcp.k8s.yaml
components:
  - ../../../../k8s/grocy/mcp-image-pins
configMapGenerator:
  - name: grocy-mcp-config
    namespace: grocy-sf
    literals:
      - |
        config.yaml=grocy_url: https://grocy-sf.allegedly.works
        auth:
          oidc_issuer: https://auth.allegedly.works/application/o/grocy-mcp-sf/
          public_base_url: https://grocy-mcp-sf.allegedly.works
        persistence:
          kind: postgres
