apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: grocy-sf
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    description: PostgreSQL DSN for the grocy-sf MCP OAuth state store.
  name: mcp-oauth-db-credentials
  namespace: grocy-sf
spec:
  data:
    - remoteRef:
        key: mcp-oauth-grocy-sf-credentials
        property: uri
      secretKey: uri
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: mcp-oauth-grocy-sf-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: mcp-oauth-db-credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: FastMCP server generating Grocy tools from Grocy's OpenAPI spec. Per-request token exchange swaps the caller's Authentik JWT for a Grocy-proxy-scoped JWT before calling Grocy.
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: grocy-mcp
  name: grocy-mcp-server
  namespace: grocy-sf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/name: grocy-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/name: grocy-mcp
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      automountServiceAccountToken: false
      containers:
        - env:
            - name: GROCY_MCP_AUTH__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client_id
                  name: grocy-mcp-oidc-sf
            - name: GROCY_MCP_AUTH__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client_secret
                  name: grocy-mcp-oidc-sf
            - name: GROCY_MCP_AUTH__PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: grocy_proxy_client_id
                  name: grocy-mcp-oidc-sf
            - name: GROCY_MCP_PERSISTENCE__URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: mcp-oauth-db-credentials
            - name: LOG_LEVEL
              value: INFO
            - name: GROCY_MCP_CONFIG_FILE
              value: /etc/grocy-mcp/config.yaml
          image: git.allegedly.works/ducktape-ci/grocy-mcp:unset
          imagePullPolicy: Always
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 20
            tcpSocket:
              port: 8765
          name: server
          ports:
            - containerPort: 8765
              name: http
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 3
            periodSeconds: 10
            tcpSocket:
              port: 8765
          resources:
            limits:
              cpu: 200m
              memory: 768Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/grocy-mcp
              name: config
              readOnly: true
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - configMap:
            name: grocy-mcp-config
          name: config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: grocy-mcp
  name: grocy-mcp-server
  namespace: grocy-sf
spec:
  ports:
    - name: http
      port: 8765
      protocol: TCP
      targetPort: 8765
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: 9090
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: grocy-mcp
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grocy-mcp-server
  namespace: grocy-sf
spec:
  endpoints:
    - path: /metrics
      port: metrics
      scrapeTimeout: 10s
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/name: grocy-mcp
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grocy-mcp-sf-server
  namespace: grocy-sf
spec:
  hostnames:
    - grocy-mcp-sf.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: grocy-mcp-server
          port: 8765
      timeouts:
        backendRequest: 60s
        request: 60s
