apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: auto
    rbac.ducktape.io/agent-readable-logs: "true"
  name: grocy-sf
spec: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: grocy
  name: grocy
  namespace: grocy-sf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grocy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grocy
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: UTC
          image: lscr.io/linuxserver/grocy:v4.6.0-ls318
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - i=0; while [ $i -lt 60 ]; do curl -fsS -o /dev/null http://localhost:80/ && exit 0; sleep 2; i=$((i+1)); done
          livenessProbe:
            httpGet:
              path: /login
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          name: grocy
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /login
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /config/data/settingoverrides
              name: settingoverrides
      nodeSelector:
        topology.kubernetes.io/region: hil
        topology.kubernetes.io/zone: hil-ovh
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: grocy-config-ovh
        - configMap:
            name: grocy-settingoverrides
          name: settingoverrides
---
apiVersion: v1
kind: Service
metadata:
  name: grocy
  namespace: grocy-sf
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app.kubernetes.io/name: grocy
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grocy-settingoverrides
  namespace: grocy-sf
data:
  AUTH_CLASS.txt: Grocy\Middleware\ReverseProxyAuthMiddleware
  DEFAULT_PERMISSIONS.txt: none
  REVERSE_PROXY_AUTH_HEADER.txt: X-authentik-username
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grocy-ingress
  namespace: grocy-sf
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              app.kubernetes.io/component: server
              app.kubernetes.io/name: authentik
      ports:
        - port: 80
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gatus
      ports:
        - port: 80
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grocy
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grocy-config-ovh
  namespace: grocy-sf
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path-ovh
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grocy-config-ovh-verify-20260520
  namespace: grocy-sf
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
        - args:
            - |
              test -f /config/data/grocy.db
              php -r '$db=new PDO("sqlite:/config/data/grocy.db"); echo $db->query("PRAGMA integrity_check")->fetchColumn(), "\n";' | grep -Fx ok
          command:
            - /bin/sh
            - -ceu
          image: lscr.io/linuxserver/grocy:v4.6.0-ls318
          name: verifier
          volumeMounts:
            - mountPath: /config
              name: config
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: grocy-config-ovh
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: grocy-config-ovh-migration
  namespace: grocy-sf
spec:
  rsyncTLS:
    copyMethod: Direct
    destinationPVC: grocy-config-ovh
    moverSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceType: ClusterIP
  trigger:
    manual: prep-20260520
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grocy-config-ovh-backup
  namespace: grocy-sf
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: seaweedfs-ovh
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: grocy-config-ovh-backup
  namespace: grocy-sf
spec:
  rsyncTLS:
    copyMethod: Direct
    destinationPVC: grocy-config-ovh-backup
    moverAffinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values:
                    - hil-ovh
    moverSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    serviceType: ClusterIP
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: grocy-config-ovh-backup
  namespace: grocy-sf
spec:
  rsyncTLS:
    address: volsync-rsync-tls-dst-grocy-config-ovh-backup.grocy-sf.svc
    copyMethod: Direct
    keySecret: volsync-rsync-tls-grocy-config-ovh-backup
    moverAffinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values:
                    - hil-ovh
    moverSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    port: 8000
  sourcePVC: grocy-config-ovh
  trigger:
    schedule: 23 */6 * * *
