apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grocy-user-perms-provisioner-ingress
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grocy-user-perms-provisioner
      ports:
        - port: 80
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grocy
  policyTypes:
    - Ingress
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  name: grocy-user-perms-provisioner
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grocy-user-perms-provisioner
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --policy
            - /config/policy.yaml
            - --grocy-url
            - http://grocy
          image: git.allegedly.works/ducktape-ci/grocy-user-perms-provisioner:unset
          imagePullPolicy: Always
          name: provisioner
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /config
              name: policy
              readOnly: true
      imagePullSecrets:
        - name: forgejo-images-creds
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - configMap:
            name: grocy-user-perms-policy
          name: policy
---
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    description: Daily drift correction for the user→permission policy in policy.yaml. The one-shot provisioner Job converges at bootstrap and on policy changes; this CronJob re-asserts the same policy so manual permission edits in the Grocy UI (e.g. elevating haku) converge back within a day.
  name: grocy-user-perms-reconciler
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grocy-user-perms-provisioner
        spec:
          automountServiceAccountToken: false
          containers:
            - args:
                - --policy
                - /config/policy.yaml
                - --grocy-url
                - http://grocy
              image: git.allegedly.works/ducktape-ci/grocy-user-perms-provisioner:unset
              imagePullPolicy: Always
              name: reconciler
              resources:
                limits:
                  memory: 128Mi
                requests:
                  cpu: 25m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - mountPath: /config
                  name: policy
                  readOnly: true
          imagePullSecrets:
            - name: forgejo-images-creds
          restartPolicy: OnFailure
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - configMap:
                name: grocy-user-perms-policy
              name: policy
      ttlSecondsAfterFinished: 86400
  schedule: 40 4 * * *
  successfulJobsHistoryLimit: 1
