apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fairwinds-stable
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.fairwinds.com/stable
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: kube-system
spec:
  chart:
    spec:
      chart: vpa
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: flux-system
      version: 5.0.1
  install:
    remediation:
      retries: 3
  interval: 30m
  values:
    admissionController:
      enabled: true
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 25m
          memory: 128Mi
    recommender:
      enabled: true
      extraArgs:
        recommender-interval: 15m
      resources:
        limits:
          cpu: 200m
          memory: 512Mi
        requests:
          cpu: 25m
          memory: 256Mi
    updater:
      enabled: true
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 25m
          memory: 128Mi
