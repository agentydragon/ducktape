apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fairwinds-stable
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.fairwinds.com/stable
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: kube-system
spec:
  chart:
    spec:
      chart: vpa
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: flux-system
      version: 5.0.1
  install:
    remediation:
      retries: 3
  interval: 30m
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: vpa-admission-controller
                namespace: kube-system
              spec:
                template:
                  spec:
                    containers:
                      - name: vpa
                        startupProbe:
                          tcpSocket:
                            port: http
                          periodSeconds: 5
                          failureThreshold: 60
            target:
              kind: Deployment
              name: vpa-admission-controller
              namespace: kube-system
  values:
    admissionController:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: admission-controller
                  app.kubernetes.io/instance: vpa
                  app.kubernetes.io/name: vpa
              topologyKey: kubernetes.io/hostname
      enabled: true
      podDisruptionBudget:
        minAvailable: 2
      replicaCount: 3
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 25m
          memory: 128Mi
    recommender:
      enabled: true
      extraArgs:
        recommender-interval: 15m
      resources:
        limits:
          cpu: 200m
          memory: 512Mi
        requests:
          cpu: 25m
          memory: 256Mi
    updater:
      enabled: true
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 25m
          memory: 128Mi
