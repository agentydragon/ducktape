apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rolebindingc8e7b3bd920032fa373ba2af702e6677864d108193
  namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
