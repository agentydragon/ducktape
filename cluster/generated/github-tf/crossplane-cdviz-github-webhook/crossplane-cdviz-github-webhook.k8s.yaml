---
apiVersion: opentofu.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: crossplane-cdviz-github-webhook
spec:
  backendFile: |
    conn_str = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
    schema_name = "cdviz_github_webhook"
  configuration: |
    terraform {
      backend "pg" {}
    }
    provider "kubernetes" {
      config_path = "/etc/opentofu/kubernetes/opentofu-cdviz-github-webhook"
    }
---
apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/external-name: cdviz-github-webhook
  name: cdviz-github-webhook
spec:
  deletionPolicy: Orphan
  forProvider:
    env:
      - name: PGPASSWORD
        secretKeyRef:
          key: password
          name: tofu-state-db-credentials
          namespace: flux-system
    module: |
      # GitHub Actions run and pull request webhook for the CDviz receiver.

      data "kubernetes_secret" "github_secrets_sync_pat" {
        metadata {
          name      = "github-secrets-sync-pat"
          namespace = "flux-system"
        }
      }

      provider "github" {
        owner = "agentydragon"
        token = data.kubernetes_secret.github_secrets_sync_pat.data["token"]
      }

      resource "random_password" "github_webhook" {
        length  = 40
        special = false
      }

      resource "kubernetes_secret" "github_webhook" {
        metadata {
          name      = var.webhook_secret_name
          namespace = var.namespace
        }

        data = {
          token = random_password.github_webhook.result
        }
      }

      resource "github_repository_webhook" "cdviz" {
        repository = "ducktape"

        configuration {
          url          = var.webhook_url
          content_type = "json"
          secret       = random_password.github_webhook.result
          insecure_ssl = false
        }

        active = true
        events = ["workflow_run", "workflow_job", "pull_request"]
      }

      terraform {
        required_providers {
          github = {
            source = "integrations/github"
          }
          kubernetes = {
            source = "hashicorp/kubernetes"
          }
          random = {
            source = "hashicorp/random"
          }
        }
      }

      variable "namespace" {
        description = "Namespace containing the CDviz webhook signing Secret."
        type        = string
      }

      variable "webhook_secret_name" {
        description = "Name of the CDviz webhook signing Secret."
        type        = string
      }

      variable "webhook_url" {
        description = "HTTPS endpoint that receives GitHub webhook payloads."
        type        = string

        validation {
          condition     = startswith(var.webhook_url, "https://")
          error_message = "The CDviz GitHub webhook URL must use HTTPS."
        }
      }
    planArgs:
      - -lock-timeout=5m
    source: Inline
    vars:
      - key: namespace
        value: cdviz
      - key: webhook_secret_name
        value: github-webhook
      - key: webhook_url
        value: https://cdviz-webhook.allegedly.works/webhook/github
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    name: crossplane-cdviz-github-webhook
