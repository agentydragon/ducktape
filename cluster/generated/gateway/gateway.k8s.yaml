apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: "off"
  name: gateway-system
spec: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.kubernetes.io/target: 147.135.104.16,147.135.104.5,147.135.37.175,147.135.39.162,147.135.39.176,51.81.245.180
  name: cluster-gateway
  namespace: gateway-system
spec:
  gatewayClassName: cilium
  listeners:
    - allowedRoutes:
        namespaces:
          from: All
      hostname: "*.allegedly.works"
      name: https-wildcard
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: wildcard-allegedly-works-tls
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: All
      hostname: allegedly.works
      name: https-apex
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: apex-allegedly-works-tls
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: All
      name: http
      port: 80
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: gateway-system
spec:
  parentRefs:
    - name: cluster-gateway
      sectionName: http
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            statusCode: 301
          type: RequestRedirect
