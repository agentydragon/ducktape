apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: "off"
  name: gateway-system
spec: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-agent-gateway-routes
spec:
  failurePolicy: Fail
  matchConditions:
    - expression: request.namespace in ['claude-sandbox', 'haku-sandbox']
      name: agent-sandbox
  matchConstraints:
    resourceRules:
      - apiGroups:
          - gateway.networking.k8s.io
        apiVersions:
          - "*"
        operations:
          - CREATE
          - UPDATE
        resources:
          - gateways
          - grpcroutes
          - httproutes
          - tcproutes
          - tlsroutes
          - udproutes
        scope: Namespaced
  validations:
    - expression: "false"
      message: Gateway API routes and Gateways may not be written in agent sandbox namespaces. Public ingress is operator-owned through the Authentik proxy.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-agent-gateway-routes
spec:
  policyName: restrict-agent-gateway-routes
  validationActions:
    - Deny
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.kubernetes.io/target: 147.135.104.16,147.135.104.5,147.135.37.175,147.135.39.162,147.135.39.176,51.81.245.180
  name: cluster-gateway
  namespace: gateway-system
spec:
  gatewayClassName: cilium
  listeners:
    - allowedRoutes:
        namespaces:
          from: All
      hostname: "*.allegedly.works"
      name: https-wildcard
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: wildcard-allegedly-works-tls
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: All
      hostname: allegedly.works
      name: https-apex
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: apex-allegedly-works-tls
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: All
      hostname: agentydragon.com
      name: https-agentydragon-com
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: agentydragon-com-tls
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: All
      hostname: www.agentydragon.com
      name: https-www-agentydragon-com
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: agentydragon-com-tls
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: All
      hostname: adgn.link
      name: https-adgn-link
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: adgn-link-tls
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: All
      hostname: www.adgn.link
      name: https-www-adgn-link
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: adgn-link-tls
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: All
      name: http
      port: 80
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: gateway-system
spec:
  parentRefs:
    - name: cluster-gateway
      sectionName: http
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            statusCode: 301
          type: RequestRedirect
