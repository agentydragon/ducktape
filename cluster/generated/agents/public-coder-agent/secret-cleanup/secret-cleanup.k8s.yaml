apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-coder-agent-secret-cleanup
  namespace: ducktape-flux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: public-coder-agent-secret-cleanup
  namespace: public-coder-agent
rules:
  - apiGroups:
      - ""
    resourceNames:
      - aiquota-api-bearer-public-coder
      - brave-search-api-key
      - buildbuddy-api-key
      - clickhouse-public-coder-credentials
      - haku-console-public-coder-agent
      - public-coder-agent-devbox-ssh-key
      - public-coder-agent-github-token
      - public-coder-agent-matrix-bot-password
      - public-coder-agent-proxy-ca
      - public-coder-agent-sshpiper-devbox-key
      - public-coder-agent-sshpiper-host-key
      - public-coder-devbox-ssh-host-key
    resources:
      - secrets
    verbs:
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: public-coder-agent-secret-cleanup
  namespace: public-coder-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: public-coder-agent-secret-cleanup
subjects:
  - kind: ServiceAccount
    name: public-coder-agent-secret-cleanup
    namespace: ducktape-flux
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  name: public-coder-agent-secret-cleanup
  namespace: ducktape-flux
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - kubectl -n public-coder-agent delete secret --ignore-not-found=true aiquota-api-bearer-public-coder brave-search-api-key buildbuddy-api-key clickhouse-public-coder-credentials haku-console-public-coder-agent public-coder-agent-devbox-ssh-key public-coder-agent-github-token public-coder-agent-matrix-bot-password public-coder-agent-proxy-ca public-coder-agent-sshpiper-devbox-key public-coder-agent-sshpiper-host-key public-coder-devbox-ssh-host-key
          command:
            - /bin/sh
            - -ec
          image: bitnamilegacy/kubectl:1.33.4@sha256:ed0b31a0508da84ee655c5c6e01bd3897fc56ad6cf69debb27fa1893a06d2246
          imagePullPolicy: IfNotPresent
          name: delete-retired-secrets
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: public-coder-agent-secret-cleanup
