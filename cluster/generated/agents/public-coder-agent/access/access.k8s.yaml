apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: Second OpenClaw agent, egress-confined to a CONNECT proxy and reachable only through the Authentik proxy outpost. Opens pull requests against public repositories as agentydragon-agent.
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: auto
    name: public-coder-agent
    rbac.ducktape.io/agent-readable-metadata: "true"
  name: public-coder-agent
spec: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: public-coder-agent
imagePullSecrets:
  - name: forgejo-images-creds
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    description: Read-only diagnostic access for the public-coder access profile.
  name: public-coder-agent-reader
  namespace: public-coder-agent
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - events
      - services
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
      - ingresses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
      - ocirepositories
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - kubevirt.io
    resourceNames:
      - public-coder-devbox
    resources:
      - virtualmachines
    verbs:
      - get
  - apiGroups:
      - kubevirt.io
    resourceNames:
      - public-coder-devbox
    resources:
      - virtualmachineinstances
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    description: Binds public-coder and its Haku superset to the reader Role.
  name: public-coder-agent-reader
  namespace: public-coder-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: public-coder-agent-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:haku
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:haku
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - kind: ServiceAccount
    name: claude-ai
    namespace: agentplane-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: public-coder-agent-devbox-vmi-restart
  namespace: public-coder-agent
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    description: Read-only VolSync backup status for Haku and public-coder.
  name: agent-public-coder-extended-diagnostics-reader
  namespace: public-coder-agent
rules:
  - apiGroups:
      - volsync.backube
    resources:
      - replicationsources
      - replicationdestinations
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    description: Binds Haku and public-coder to VolSync status.
  name: agent-public-coder-extended-diagnostics-reader
  namespace: public-coder-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-public-coder-extended-diagnostics-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:haku
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:haku
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - kind: ServiceAccount
    name: claude-ai
    namespace: agentplane-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-testing-login-reader
  namespace: public-coder-agent
rules:
  - apiGroups:
      - ""
    resourceNames:
      - agentplane-testing-acceptance-operator
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-testing-login-reader
  namespace: public-coder-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-testing-login-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:haku
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:haku
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - kind: ServiceAccount
    name: claude-ai
    namespace: agentplane-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    description: Read-only node inventory for public-coder-agent diagnostics.
  name: public-coder-agent-node-reader
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    description: Binds public-coder and its Haku superset to read-only node inventory.
  name: public-coder-agent-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: public-coder-agent-node-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:haku
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:haku
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    description: Read-only CRD schemas and node metrics for public-coder diagnostics.
  name: public-coder-agent-cluster-metadata-reader
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    description: Binds public-coder and its Haku superset to CRD schemas and node metrics only.
  name: public-coder-agent-cluster-metadata-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: public-coder-agent-cluster-metadata-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:haku
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:haku
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    description: Gives only the Haku authorization proxy a cluster-admin execution ceiling.
  name: haku-kube-api-proxy-cluster-admin-ceiling
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: haku-kube-api-proxy
    namespace: haku-console
