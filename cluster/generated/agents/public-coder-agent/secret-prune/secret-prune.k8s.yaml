apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: brave-search-api-key
  namespace: public-coder-agent
spec:
  data:
    - remoteRef:
        key: brave-search-api-key
        property: api-key
      secretKey: api-key
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Orphan
    deletionPolicy: Retain
    name: brave-search-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: public-coder-agent-github-token
  namespace: public-coder-agent
spec:
  data:
    - remoteRef:
        key: github-agentydragon-agent
        property: token
      secretKey: GITHUB_TOKEN
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: public-coder-agent-github-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: public-coder-agent-proxy-root-ca
  namespace: public-coder-agent
spec:
  commonName: public-coder-agent-proxy-root-ca
  duration: 87600h
  isCA: true
  issuerRef:
    kind: ClusterIssuer
    name: cluster-ca-bootstrap
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 8760h
  secretName: public-coder-agent-proxy-ca
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: cert-manager
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: cert-manager
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: public-coder-agent-proxy-ca-cert
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        key: ca.crt
        name: cluster-root-ca-secret
    - secret:
        key: tls.crt
        name: public-coder-agent-proxy-ca
  target:
    configMap:
      key: ca-certificates.crt
      metadata:
        annotations:
          description: Trust bundle for public-coder-agent HTTPS traffic intercepted by its egress proxy
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - public-coder-agent
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: brave-search-api-key
  namespace: public-coder-agent
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: public-coder-agent-github-token
  namespace: public-coder-agent
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: public-coder-agent-proxy-ca
  namespace: public-coder-agent
type: kubernetes.io/tls
