apiVersion: v1
kind: ConfigMap
metadata:
  name: haku-openclaw-spike-config
  namespace: haku-openclaw-spike
data:
  claude.json: |
    {
      "hasCompletedOnboarding": true,
      "theme": "dark",
      "projects": {
        "/home/openclaw/.openclaw/workspace": {
          "hasTrustDialogAccepted": true,
          "hasCompletedProjectOnboarding": true
        }
      }
    }
  openclaw.json: |
    {
      "meta": {
        "migrations": {
          "modelPolicyAllowlist": true
        }
      },
      "agents": {
        "defaults": {
          "userTimezone": "America/Los_Angeles",
          "model": {
            "primary": "anthropic/claude-opus-5"
          },
          "models": {
            "anthropic/claude-opus-5": {
              "agentRuntime": {
                "id": "claude-cli"
              },
              "alias": "Opus"
            },
            "anthropic/claude-sonnet-5": {
              "agentRuntime": {
                "id": "claude-cli"
              },
              "alias": "Sonnet"
            },
            "anthropic/claude-fable-5": {
              "agentRuntime": {
                "id": "claude-cli"
              },
              "alias": "Fable"
            },
            "anthropic/claude-haiku-4-5-20251001": {
              "agentRuntime": {
                "id": "claude-cli"
              },
              "alias": "Haiku"
            }
          },
          "modelPolicy": {
            "allow": [
              "anthropic/claude-opus-5",
              "anthropic/claude-sonnet-5",
              "anthropic/claude-fable-5",
              "anthropic/claude-haiku-4-5-20251001"
            ]
          },
          "sandbox": {
            "mode": "off"
          },
          "skills": [],
          "verboseDefault": "full"
        },
        "entries": {
          "haku": {
            "default": true,
            "name": "Haku"
          }
        }
      },
      "memory": {
        "search": {
          "enabled": false
        }
      },
      "commands": {
        "config": false,
        "mcp": false,
        "restart": false
      },
      "cron": {
        "enabled": false
      },
      "gateway": {
        "auth": {
          "mode": "trusted-proxy",
          "trustedProxy": {
            "allowLoopback": true,
            "allowUsers": [
              "agentydragon"
            ],
            "requiredHeaders": [
              "x-authentik-email",
              "x-forwarded-host",
              "x-forwarded-proto"
            ],
            "userHeader": "x-authentik-username",
            "deviceAutoApprove": {
              "enabled": true,
              "scopes": [
                "operator.admin"
              ]
            }
          }
        },
        "bind": "lan",
        "controlUi": {
          "allowedOrigins": [
            "https://haku-openclaw-spike.allegedly.works"
          ]
        },
        "mode": "local",
        "trustedProxies": [
          "10.0.0.0/8"
        ]
      },
      "hooks": {
        "internal": {
          "entries": {
            "session-memory": {
              "enabled": true,
              "llmSlug": false,
              "messages": 15
            }
          }
        }
      },
      "mcp": {
        "servers": {
          "haku-console": {
            "url": "https://haku.allegedly.works/mcp",
            "transport": "streamable-http",
            "supportsParallelToolCalls": true,
            "requestTimeoutMs": 60000,
            "headers": {
              "Authorization": "Bearer ${HAKU_CONSOLE_TOKEN}"
            }
          }
        }
      },
      "plugins": {
        "entries": {
          "anthropic": {
            "enabled": true
          }
        }
      },
      "tools": {
        "allow": [
          "exec",
          "process",
          "read",
          "write",
          "edit",
          "apply_patch",
          "memory_get",
          "memory_search",
          "session_status",
          "bundle-mcp"
        ],
        "elevated": {
          "enabled": false
        },
        "exec": {
          "mode": "full"
        },
        "fs": {
          "workspaceOnly": true
        },
        "sessions": {
          "visibility": "agent"
        }
      }
    }
immutable: false
