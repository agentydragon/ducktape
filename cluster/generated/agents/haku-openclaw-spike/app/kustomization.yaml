apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.k8s.yaml
  - haku-openclaw-spike-config.k8s.yaml
  - haku-openclaw-spike.k8s.yaml
components:
  - ../../../../k8s/agents/haku-openclaw-spike/app-image-pins
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: haku-openclaw-spike-kubeconfig
    namespace: haku-openclaw-spike
    files:
      - config=kube-client-config
