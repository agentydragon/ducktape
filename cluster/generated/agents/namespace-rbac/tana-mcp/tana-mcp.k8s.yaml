apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-diagnostics-metadata
  namespace: tana-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-readable-namespace-metadata
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:haku
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:haku
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:kubectl-sandbox-users
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:public-coder
  - kind: ServiceAccount
    name: claude-ai
    namespace: agentplane-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-diagnostics-logs
  namespace: tana-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-readable-namespace-logs
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:haku
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:haku
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:kubectl-sandbox-users
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:public-coder
  - kind: ServiceAccount
    name: claude-ai
    namespace: agentplane-staging
