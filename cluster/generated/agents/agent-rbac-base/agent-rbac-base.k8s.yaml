apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: development
    goldilocks.fairwinds.com/enabled: "true"
    name: claude-sandbox
  name: claude-sandbox
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: claude-sandbox-quota
  namespace: claude-sandbox
spec:
  hard:
    configmaps: "30"
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "30"
    pods: "50"
    requests.cpu: "8"
    requests.memory: 16Gi
    requests.storage: 50Gi
    services: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: claude-sandbox-limits
  namespace: claude-sandbox
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 10m
        memory: 16Mi
      type: Container
    - max:
        cpu: "8"
        memory: 16Gi
      type: Pod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-sandbox-admin
  namespace: claude-sandbox
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/attach
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - events
    verbs:
      - "*"
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - "*"
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - "*"
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
      - publications
      - subscriptions
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-sandbox-admin
  namespace: claude-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-sandbox-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:kubectl-sandbox-users
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-ollama-consumer
  namespace: claude-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ollama-api-consumer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:kubectl-sandbox-users
---
apiVersion: kyverno.io/v2
kind: CleanupPolicy
metadata:
  name: sandbox-janitor
  namespace: claude-sandbox
spec:
  conditions:
    all:
      - key: "{{ time_since('', '{{ target.metadata.creationTimestamp }}', '') }}"
        operator: GreaterThan
        value: 168h
  match:
    any:
      - resources:
          kinds:
            - Pod
            - Deployment
            - StatefulSet
            - Job
            - CronJob
            - Service
  schedule: 20 * * * *
---
