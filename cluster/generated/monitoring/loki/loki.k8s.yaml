apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: initial
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    rbac.ducktape.io/agent-readable-logs: "true"
  name: loki
spec: {}
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Loki chunks, ruler, and admin objects.
  name: loki
  namespace: loki
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: loki
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: loki
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  annotations:
    description: Loki chunks, ruler, and admin objects.
  name: loki
  namespace: loki
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: loki
  namespace: loki
spec:
  identityRef:
    name: loki
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: loki-seaweedfs-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  chart:
    spec:
      chart: loki
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 7.x
  install:
    remediation:
      retries: 3
  interval: 30m
  values:
    backend:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      annotations:
        goldilocks.fairwinds.com/enabled: "false"
      extraEnvFrom:
        - secretRef:
            name: loki-seaweedfs-credentials
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      persistence:
        volumeClaimsEnabled: false
      replicas: 2
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 256Mi
    chunksCache:
      enabled: false
    deploymentMode: SimpleScalable
    gateway:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      enabled: true
      extraContainers:
        - args:
            - -k
            - --no-hosts
            - --listen-address=127.0.0.1
            - --port=8053
            - --cache-size=150
          image: 4km3/dnsmasq:2.90-r3-alpine-3.22.2
          name: dnsmasq
          ports:
            - containerPort: 8053
              name: dns
              protocol: UDP
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 5m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      nginxConfig:
        resolver: 127.0.0.1:8053
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 2
      compactor:
        compaction_interval: 10m
        delete_request_store: s3
        retention_delete_delay: 2h
        retention_enabled: true
      ingester:
        wal:
          replay_memory_ceiling: 1GB
      limits_config:
        ingestion_burst_size_mb: 20
        ingestion_rate_mb: 10
        per_stream_rate_limit: 5MB
        per_stream_rate_limit_burst: 10MB
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        retention_period: 2160h
        volume_enabled: true
      schemaConfig:
        configs:
          - from: "2026-04-06"
            index:
              period: 24h
              prefix: loki_index_
            object_store: s3
            schema: v13
            store: tsdb
      storage:
        bucketNames:
          admin: loki
          chunks: loki
          ruler: loki
        s3:
          endpoint: http://seaweedfs-s3.seaweedfs.svc:8333
          insecure: true
          region: us-east-1
          s3ForcePathStyle: true
        type: s3
    monitoring:
      dashboards:
        enabled: false
      rules:
        enabled: false
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      serviceMonitor:
        enabled: true
    read:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      annotations:
        goldilocks.fairwinds.com/enabled: "false"
      extraEnv:
        - name: GOMEMLIMIT
          value: 3277MiB
      extraEnvFrom:
        - secretRef:
            name: loki-seaweedfs-credentials
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      replicas: 2
      resources:
        limits:
          cpu: 500m
          memory: 4Gi
        requests:
          cpu: 50m
          memory: 128Mi
    resultsCache:
      enabled: false
    singleBinary:
      replicas: 0
    test:
      enabled: false
    write:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      annotations:
        goldilocks.fairwinds.com/vpa-resource-policy: '{"containerPolicies": [{"containerName": "loki", "controlledValues": "RequestsOnly", "minAllowed": {"memory": "1Gi"}, "maxAllowed": {"memory": "2Gi"}}]}'
      extraEnv:
        - name: GOMEMLIMIT
          value: 1536MiB
      extraEnvFrom:
        - secretRef:
            name: loki-seaweedfs-credentials
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      persistence:
        size: 10Gi
        storageClass: piraeus-hdd-local
      replicas: 2
      resources:
        limits:
          cpu: 500m
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 1Gi
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress
  namespace: loki
spec:
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: s3
            app.kubernetes.io/name: seaweedfs
            k8s:io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
            k8s:io.kubernetes.pod.namespace: loki
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "7946"
              protocol: TCP
            - port: "9095"
              protocol: TCP
            - port: "3100"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: grafana
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: backend
            app.kubernetes.io/instance: props
            k8s:io.kubernetes.pod.namespace: props
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alloy
            k8s:io.kubernetes.pod.namespace: monitoring
        - matchLabels:
            app.kubernetes.io/name: alloy-node
            k8s:io.kubernetes.pod.namespace: monitoring
        - matchLabels:
            app.kubernetes.io/name: alloy-syslog
            k8s:io.kubernetes.pod.namespace: monitoring
        - matchLabels:
            app.kubernetes.io/name: alloy-journal
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alloy-node
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3500"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: gatus
            k8s:io.kubernetes.pod.namespace: gatus
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki-read-proxy
            k8s:io.kubernetes.pod.namespace: loki-read-proxy
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
            k8s:io.kubernetes.pod.namespace: loki
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "3100"
              protocol: TCP
            - port: "9095"
              protocol: TCP
            - port: "7946"
              protocol: TCP
