  folder: Storage
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: "{\"schemaVersion\": 39, \"templating\": {\"list\": [{\"type\": \"custom\", \"name\": \"storage_tier\", \"label\": \"Storage tier\", \"skipUrlSync\": false, \"query\": \"SSD : ssd,HDD : hdd,Both : ssd|hdd\", \"current\": {\"text\": \"Both\", \"value\": \"ssd|hdd\", \"selected\": true}, \"multi\": false, \"allowCustomValue\": true, \"options\": [{\"text\": \"SSD\", \"value\": \"ssd\", \"selected\": false}, {\"text\": \"HDD\", \"value\": \"hdd\", \"selected\": false}, {\"text\": \"Both\", \"value\": \"ssd|hdd\", \"selected\": true}], \"includeAll\": false, \"auto\": false, \"auto_min\": \"10s\", \"auto_count\": 30}, {\"type\": \"query\", \"name\": \"node\", \"label\": \"Cluster node\", \"skipUrlSync\": false, \"query\": \"label_values(kube_node_info, node)\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"current\": {\"text\": \"All cluster nodes\", \"value\": [\"$__all\"]}, \"multi\": true, \"allowCustomValue\": true, \"refresh\": 1, \"includeAll\": true, \"allValue\": \"optiplex|ovh-.*\", \"regex\": \"/^(optiplex|ovh-.*)$/\", \"auto\": false, \"auto_min\": \"10s\", \"auto_count\": 30, \"definition\": \"label_values(kube_node_info, node)\"}, {\"type\": \"custom\", \"name\": \"topk\", \"label\": \"Rows\", \"skipUrlSync\": false, \"query\": \"10,25,50\", \"current\": {\"text\": \"10\", \"value\": \"10\"}, \"multi\": false, \"allowCustomValue\": true, \"options\": [{\"text\": \"10\", \"value\": \"10\", \"selected\": true}, {\"text\": \"25\", \"value\": \"25\", \"selected\": false}, {\"text\": \"50\", \"value\": \"50\", \"selected\": false}], \"includeAll\": false, \"auto\": false, \"auto_min\": \"10s\", \"auto_count\": 30}]}, \"annotations\": {}, \"uid\": \"cluster-storage-io\", \"title\": \"Storage I/O\", \"tags\": [\"cluster\", \"storage\", \"io\"], \"timezone\": \"browser\", \"editable\": true, \"graphTooltip\": 1, \"time\": {\"from\": \"now-1h\", \"to\": \"now\"}, \"fiscalYearStartMonth\": 0, \"refresh\": \"1m\", \"version\": 1, \"panels\": [{\"type\": \"text\", \"id\": 1, \"title\": \"How to read this dashboard\", \"transparent\": false, \"gridPos\": {\"h\": 5, \"w\": 24, \"x\": 0, \"y\": 0}, \"repeatDirection\": \"h\", \"options\": {\"mode\": \"markdown\", \"content\": \"The **Storage tier** selector scopes node-owned panels to Kubernetes nodes labeled `storage.allegedly.works/tier`; **Both** selects `ssd` and `hdd`. The node selector narrows within that set. Nodes without a tier label, including Wyrm2 and its local OpenEBS volumes, are omitted.\\n\\nPhysical device panels show block-device writes and exclude DRBD logical devices. Container panels show cAdvisor filesystem writes. SeaweedFS, Loki, and Mimir metrics are grouped under **Cluster-wide service traffic**; the tier selector does not apply because those series have no storage-node ownership. These layers overlap and must not be added together as one total. Rate panels use a fixed 5-minute window so the same PromQL and LogQL remain valid in dashboard rendering and Explore.\"}}, {\"type\": \"timeseries\", \"id\": 2, \"targets\": [{\"expr\": \"sum by (node, device) (((rate(node_disk_written_bytes_total{device!~\\\"^(loop|ram|fd|dm-|sr|drbd).*\\\"}[5m]) * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{pod=~\\\"prometheus-node-exporter-.+\\\"})) * on (node) group_left () max by (node, label_storage_allegedly_works_tier) (kube_node_labels{node=~\\\"$node\\\", label_storage_allegedly_works_tier=~\\\"$storage_tier\\\"})))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{node}} {{device}}\", \"refId\": \"A\"}], \"title\": \"Physical disk write throughput\", \"description\": \"Block-device writes on nodes in the selected storage tier; DRBD logical devices are excluded.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 24, \"x\": 0, \"y\": 5}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": []}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"Bps\"}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 4, \"targets\": [{\"expr\": \"sum by (node, device) (((rate(node_disk_writes_completed_total{device!~\\\"^(loop|ram|fd|dm-|sr|drbd).*\\\"}[5m]) * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{pod=~\\\"prometheus-node-exporter-.+\\\"})) * on (node) group_left () max by (node, label_storage_allegedly_works_tier) (kube_node_labels{node=~\\\"$node\\\", label_storage_allegedly_works_tier=~\\\"$storage_tier\\\"})))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{node}} {{device}}\", \"refId\": \"A\"}], \"title\": \"Physical disk write IOPS\", \"description\": \"Completed block-device writes per second on nodes in the selected storage tier; DRBD logical devices are excluded.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 24, \"x\": 0, \"y\": 13}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": []}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\"}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 6, \"targets\": [{\"expr\": \"sum by (node, device) (((rate(node_disk_io_time_seconds_total{device!~\\\"^(loop|ram|fd|dm-|sr|drbd).*\\\"}[5m]) * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{pod=~\\\"prometheus-node-exporter-.+\\\"})) * on (node) group_left () max by (node, label_storage_allegedly_works_tier) (kube_node_labels{node=~\\\"$node\\\", label_storage_allegedly_works_tier=~\\\"$storage_tier\\\"})))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{node}} {{device}}\", \"refId\": \"A\"}], \"title\": \"Physical disk busy fraction\", \"description\": \"Fraction of the last five minutes each block device had I/O in flight on nodes in the selected storage tier.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 24, \"x\": 0, \"y\": 21}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": []}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"percentunit\", \"min\": 0, \"max\": 1}, \"overrides\": []}}, {\"type\": \"table\", \"id\": 8, \"targets\": [{\"expr\": \"topk(${topk}, sum by (namespace, pod, container, node, device) (rate(container_fs_writes_bytes_total{namespace!=\\\"\\\", pod!=\\\"\\\", container!=\\\"\\\", container!=\\\"POD\\\", node=~\\\"$node\\\"}[5m]) * on (node) group_left () max by (node, label_storage_allegedly_works_tier) (kube_node_labels{node=~\\\"$node\\\", label_storage_allegedly_works_tier=~\\\"$storage_tier\\\"})))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"format\": \"table\", \"instant\": true, \"legendFormat\": \"{{namespace}}/{{pod}} {{container}} {{node}} {{device}}\", \"range\": false, \"refId\": \"A\"}], \"title\": \"Top container writers\", \"description\": \"cAdvisor filesystem writes grouped by namespace, pod, container, node, and device on nodes in the selected storage tier. This is producer attribution, not a physical-block-device total.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 29}, \"repeatDirection\": \"h\", \"transformations\": [{\"id\": \"organize\", \"options\": {\"excludeByName\": {\"Time\": true}}}], \"fieldConfig\": {\"defaults\": {\"unit\": \"Bps\"}, \"overrides\": []}}, {\"type\": \"table\", \"id\": 10, \"targets\": [{\"expr\": \"topk(${topk}, sum by (namespace, pod, container, node, device) (rate(container_fs_writes_total{namespace!=\\\"\\\", pod!=\\\"\\\", container!=\\\"\\\", container!=\\\"POD\\\", node=~\\\"$node\\\"}[5m]) * on (node) group_left () max by (node, label_storage_allegedly_works_tier) (kube_node_labels{node=~\\\"$node\\\", label_storage_allegedly_works_tier=~\\\"$storage_tier\\\"})))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"format\": \"table\", \"instant\": true, \"legendFormat\": \"{{namespace}}/{{pod}} {{container}} {{node}} {{device}}\", \"range\": false, \"refId\": \"A\"}], \"title\": \"Top container write IOPS\", \"description\": \"cAdvisor filesystem write operations grouped by namespace, pod, container, node, and device on nodes in the selected storage tier.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 39}, \"repeatDirection\": \"h\", \"transformations\": [{\"id\": \"organize\", \"options\": {\"excludeByName\": {\"Time\": true}}}], \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\"}, \"overrides\": []}}, {\"type\": \"row\", \"collapsed\": false, \"id\": 19, \"panels\": [], \"title\": \"Cluster-wide service traffic \\u00b7 tier selector does not apply\", \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 49}}, {\"type\": \"table\", \"id\": 12, \"targets\": [{\"expr\": \"topk(${topk}, sum by (bucket) (rate(SeaweedFS_s3_bucket_traffic_received_bytes_total{bucket!=\\\"\\\"}[5m])))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"format\": \"table\", \"instant\": true, \"legendFormat\": \"{{bucket}}\", \"range\": false, \"refId\": \"A\"}], \"title\": \"Cluster-wide S3 bytes received by bucket\", \"description\": \"Cluster-wide service telemetry; storage tier selection does not apply. Logical bytes received by SeaweedFS S3, broken down by bucket. This is ingress to SeaweedFS and is not the same as physical disk writes.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 10, \"w\": 12, \"x\": 0, \"y\": 50}, \"repeatDirection\": \"h\", \"transformations\": [{\"id\": \"organize\", \"options\": {\"excludeByName\": {\"Time\": true}}}], \"fieldConfig\": {\"defaults\": {\"unit\": \"Bps\"}, \"overrides\": []}}, {\"type\": \"table\", \"id\": 13, \"targets\": [{\"expr\": \"topk(${topk}, sum by (bucket) (rate(SeaweedFS_s3_bucket_traffic_sent_bytes_total{bucket!=\\\"\\\"}[5m])))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"format\": \"table\", \"instant\": true, \"legendFormat\": \"{{bucket}}\", \"range\": false, \"refId\": \"A\"}], \"title\": \"Cluster-wide S3 bytes sent by bucket\", \"description\": \"Cluster-wide service telemetry; storage tier selection does not apply. Logical bytes sent by SeaweedFS S3, broken down by bucket.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 10, \"w\": 12, \"x\": 12, \"y\": 50}, \"repeatDirection\": \"h\", \"transformations\": [{\"id\": \"organize\", \"options\": {\"excludeByName\": {\"Time\": true}}}], \"fieldConfig\": {\"defaults\": {\"unit\": \"Bps\"}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 14, \"targets\": [{\"expr\": \"sum by (namespace) (bytes_rate({namespace=~\\\".+\\\"}[5m]))\", \"refId\": \"A\", \"queryType\": \"range\", \"datasource\": {\"type\": \"loki\", \"uid\": \"${DS_LOKI}\"}}], \"title\": \"Cluster-wide Loki log bytes by namespace\", \"description\": \"Cluster-wide service telemetry; storage tier selection does not apply. Logical log volume accepted by Loki, grouped by namespace.\", \"transparent\": false, \"datasource\": {\"type\": \"loki\", \"uid\": \"${DS_LOKI}\"}, \"gridPos\": {\"h\": 10, \"w\": 12, \"x\": 0, \"y\": 60}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": []}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"Bps\"}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 15, \"targets\": [{\"expr\": \"topk(${topk}, sum by (namespace, pod) (bytes_rate({namespace=~\\\".+\\\"}[5m])))\", \"refId\": \"A\", \"queryType\": \"range\", \"datasource\": {\"type\": \"loki\", \"uid\": \"${DS_LOKI}\"}}], \"title\": \"Cluster-wide Loki log bytes by pod\", \"description\": \"Cluster-wide service telemetry; storage tier selection does not apply. Logical log volume accepted by Loki, grouped by namespace and pod.\", \"transparent\": false, \"datasource\": {\"type\": \"loki\", \"uid\": \"${DS_LOKI}\"}, \"gridPos\": {\"h\": 10, \"w\": 12, \"x\": 12, \"y\": 60}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": []}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"Bps\"}, \"overrides\": []}}, {\"type\": \"table\", \"id\": 16, \"targets\": [{\"expr\": \"topk(${topk}, sum by (job, namespace, service, instance) (sum_over_time(scrape_samples_post_metric_relabeling{job!=\\\"\\\"}[5m]) / 300))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"format\": \"table\", \"instant\": true, \"legendFormat\": \"{{job}} {{namespace}}/{{service}} {{instance}}\", \"range\": false, \"refId\": \"A\"}], \"title\": \"Cluster-wide scraped samples/s by target\", \"description\": \"Cluster-wide service telemetry; storage tier selection does not apply. Estimated samples/s per scrape target, derived from the per-scrape sample count over five minutes. Shows only the selected top rows; this pre-ingestion estimate does not include direct OTLP or Tempo metrics-generator writes counted by Mimir.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 10, \"w\": 12, \"x\": 0, \"y\": 70}, \"repeatDirection\": \"h\", \"transformations\": [{\"id\": \"organize\", \"options\": {\"excludeByName\": {\"Time\": true}}}], \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\"}, \"overrides\": []}}, {\"type\": \"stat\", \"id\": 17, \"targets\": [{\"expr\": \"sum(rate(cortex_distributor_received_samples_total{user=\\\"anonymous\\\"}[5m]))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"samples/s\", \"refId\": \"A\"}], \"title\": \"Cluster-wide Mimir samples/s\", \"description\": \"Cluster-wide service telemetry; storage tier selection does not apply. Samples accepted by Mimir's distributor for the anonymous tenant, including scrape and direct-write sources. Rejected and deduplicated samples are excluded, so this is not expected to equal the scrape-target estimate.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 10, \"w\": 6, \"x\": 12, \"y\": 70}, \"repeatDirection\": \"h\", \"options\": {\"graphMode\": \"area\", \"colorMode\": \"value\", \"justifyMode\": \"auto\", \"textMode\": \"auto\", \"wideLayout\": true, \"showPercentChange\": false, \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"values\": false, \"fields\": \"\"}, \"percentChangeColorMode\": \"standard\", \"orientation\": \"auto\"}, \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"decimals\": 0}, \"overrides\": []}}, {\"type\": \"stat\", \"id\": 18, \"targets\": [{\"expr\": \"sum(sum_over_time(scrape_samples_post_metric_relabeling{job!=\\\"\\\"}[5m])) / 300\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"samples/s\", \"refId\": \"A\"}], \"title\": \"Cluster-wide scraped samples/s\", \"description\": \"Cluster-wide service telemetry; storage tier selection does not apply. Estimated average rate from per-scrape sample counts over five minutes, across all scrape targets. Excludes direct OTLP and Tempo metrics-generator writes sent to Mimir.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 10, \"w\": 6, \"x\": 18, \"y\": 70}, \"repeatDirection\": \"h\", \"options\": {\"graphMode\": \"area\", \"colorMode\": \"value\", \"justifyMode\": \"auto\", \"textMode\": \"auto\", \"wideLayout\": true, \"showPercentChange\": false, \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"values\": false, \"fields\": \"\"}, \"percentChangeColorMode\": \"standard\", \"orientation\": \"auto\"}, \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"decimals\": 0}, \"overrides\": []}}]}"
