PV phase distinguishes Bound, Released, and Available copies.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 14, "w": 24, "x": 0, "y": 48}, "repeatDirection": "h", "transformations": [{"id": "labelsToFields", "options": {}, "filter": {"id": "byRefId", "options": "/^A$/"}, "topic": "series"}, {"id": "filterFieldsByName", "options": {"include": {"names": ["Time", "node", "storage_pool", "phase", "resource", "persistentvolume", "namespace", "persistentvolumeclaim", "Value #A"]}}, "filter": {"id": "byRefId", "options": "/^A$/"}, "topic": "series"}, {"id": "labelsToFields", "options": {}, "filter": {"id": "byRefId", "options": "/^B$/"}, "topic": "series"}, {"id": "filterFieldsByName", "options": {"include": {"names": ["Time", "node", "storage_pool", "phase", "resource", "persistentvolume", "namespace", "persistentvolumeclaim", "Value #B"]}}, "filter": {"id": "byRefId", "options": "/^B$/"}, "topic": "series"}, {"id": "merge", "options": {}}, {"id": "organize", "options": {"excludeByName": {"Time": true}, "indexByName": {"node": 0, "storage_pool": 1, "namespace": 2, "persistentvolumeclaim": 3, "Value #A": 4, "Value #B": 5, "phase": 6, "resource": 7, "persistentvolume": 8}, "renameByName": {"node": "Storage node", "storage_pool": "Pool", "namespace": "Namespace", "persistentvolumeclaim": "PVC", "Value #A": "Estimated allocated bytes", "Value #B": "PV capacity limit", "phase": "PV phase", "resource": "LINSTOR resource", "persistentvolume": "PV"}}}, {"id": "sortBy", "options": {"fields": {}, "sort": [{"field": "Estimated allocated bytes", "desc": true}]}}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"type": "row", "collapsed": false, "id": 38, "panels": [], "title": "Piraeus consumer-side PVC filesystem usage", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 62}}, {"type": "table", "id": 39, "targets": [{"expr": "disk_usage:pvc_used_bytes{node=~\"$node\"} and on (namespace, persistentvolumeclaim) max by (namespace, persistentvolumeclaim) (disk_usage:volume_capacity_bytes{phase=\"Bound\", storage_pool=~\"$storage_pool\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "range": false, "refId": "A"}, {"expr": "group by (namespace, persistentvolumeclaim, node) (disk_usage:pvc_used_bytes{node=~\"$node\"}) * on (namespace, persistentvolumeclaim) group_left () max by (namespace, persistentvolumeclaim) (disk_usage:volume_capacity_bytes{phase=\"Bound\", storage_pool=~\"$storage_pool\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "range": false, "refId": "B"}, {"expr": "(disk_usage:pvc_used_bytes{node=~\"$node\"} and on (namespace, persistentvolumeclaim) max by (namespace, persistentvolumeclaim) (disk_usage:volume_capacity_bytes{phase=\"Bound\", storage_pool=~\"$storage_pool\"})) / on (namespace, persistentvolumeclaim) group_left() max by (namespace, persistentvolumeclaim) (disk_usage:volume_capacity_bytes{phase=\"Bound\", storage_pool=~\"$storage_pool\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "range": false, "refId": "C"}], "title": "Kubelet filesystem use and Bound Piraeus PVC limit", "description": "Kubelet filesystem-used bytes and volume capacity limits for measured Bound Piraeus PVCs on the selected consumer nodes. Limits are deduplicated across diskful copies. Raw block PVCs and unmounted volumes have no filesystem-used sample; their limits remain visible in the diskful copy table above.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 11, "w": 24, "x": 0, "y": 63}, "repeatDirection": "h", "transformations": [{"id": "labelsToFields", "options": {}, "filter": {"id": "byRefId", "options": "/^A$/"}, "topic": "series"}, {"id": "filterFieldsByName", "options": {"include": {"names": ["Time", "namespace", "persistentvolumeclaim", "node", "Value #A"]}}, "filter": {"id": "byRefId", "options": "/^A$/"}, "topic": "series"}, {"id": "labelsToFields", "options": {}, "filter": {"id": "byRefId", "options": "/^B$/"}, "topic": "series"}, {"id": "filterFieldsByName", "options": {"include": {"names": ["Time", "namespace", "persistentvolumeclaim", "node", "Value #B"]}}, "filter": {"id": "byRefId", "options": "/^B$/"}, "topic": "series"}, {"id": "labelsToFields", "options": {}, "filter": {"id": "byRefId", "options": "/^C$/"}, "topic": "series"}, {"id": "filterFieldsByName", "options": {"include": {"names": ["Time", "namespace", "persistentvolumeclaim", "node", "Value #C"]}}, "filter": {"id": "byRefId", "options": "/^C$/"}, "topic": "series"}, {"id": "merge", "options": {}}, {"id": "organize", "options": {"excludeByName": {"Time": true}, "indexByName": {"namespace": 0, "persistentvolumeclaim": 1, "node": 2, "Value #A": 3, "Value #B": 4, "Value #C": 5}, "renameByName": {"namespace": "Namespace", "persistentvolumeclaim": "PVC", "node": "Consumer node", "Value #A": "Filesystem used", "Value #B": "Bound PV capacity limit", "Value #C": "Filesystem used / PV limit"}}}, {"id": "sortBy", "options": {"fields": {}, "sort": [{"field": "Filesystem used", "desc": true}]}}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": [{"matcher": {"id": "byName", "options": "Filesystem used / PV limit"}, "properties": [{"id": "unit", "value": "percentunit"}, {"id": "decimals", "value": 1}]}]}}]}'
