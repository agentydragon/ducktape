apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: rugged-power
  namespace: monitoring
spec:
  datasources:
    - datasourceName: mimir
      inputName: DS_MIMIR
  folder: Nodes & Hardware
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |-
    {
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "type": "query",
            "name": "instance",
            "label": "Rugged instance",
            "skipUrlSync": false,
            "query": "label_values(node_uname_info{nodename=\"rugged\"}, instance)",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_MIMIR}"
            },
            "multi": false,
            "allowCustomValue": true,
            "refresh": 1,
            "sort": 1,
            "includeAll": false,
            "auto": false,
            "auto_min": "10s",
            "auto_count": 30,
            "definition": "label_values(node_uname_info{nodename=\"rugged\"}, instance)"
          }
        ]
      },
      "annotations": {},
      "uid": "rugged-power",
      "title": "Rugged Power",
      "description": "Laptop battery and RAPL telemetry for Rugged. Adapted from Grafana dashboard 12542; RAPL panels deliberately select the canonical intel-rapl path to exclude duplicate MMIO counters.",
      "tags": [
        "laptop",
        "power",
        "rapl",
        "rugged"
      ],
      "timezone": "",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "hidden": false,
        "refresh_intervals": [
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "1h"
        ]
      },
      "fiscalYearStartMonth": 0,
      "refresh": "1m",
      "panels": [
        {
          "type": "bargauge",
          "id": 1,
          "targets": [
            {
              "expr": "node_power_supply_capacity{instance=~\"$instance\",power_supply=~\"BAT.*\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_MIMIR}"
              },
              "legendFormat": "{{power_supply}}",
              "refId": "A"
            }
          ],
          "title": "Battery charge",
          "transparent": false,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_MIMIR}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "repeatDirection": "h",
          "options": {
            "displayMode": "lcd",
            "valueMode": "color",
            "namePlacement": "auto",
            "showUnfilled": true,
            "sizing": "auto",
            "minVizWidth": 8,
            "minVizHeight": 16,
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false,
              "calcs": []
            },
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false,
              "fields": ""
            },
            "maxVizHeight": 300,
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "red"
                  },
                  {
                    "value": 20,
                    "color": "orange"
                  },
                  {
                    "value": 50,
                    "color": "green"
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "table",
          "id": 2,
          "targets": [
            {
              "expr": "node_power_supply_info{instance=~\"$instance\",type=~\"Battery|Mains|USB\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_MIMIR}"
              },
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Battery and external-power state",
          "transparent": false,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_MIMIR}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "repeatDirection": "h",
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {}
            }
          ],
          "options": {
            "frameIndex": 0,
            "showHeader": true,
            "showTypeIcons": false,
            "footer": {
              "show": false,
              "reducer": [],
              "countRows": false
            },
            "cellHeight": "sm"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "inspect": false
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 3,
          "targets": [
            {
              "expr": "rate(node_rapl_package_joules_total{instance=~\"$instance\",path=~\".*/intel-rapl:[^/]+$\"}[$__rate_interval])",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_MIMIR}"
              },
              "legendFormat": "package",
              "refId": "A"
            },
            {
              "expr": "rate(node_rapl_dram_joules_total{instance=~\"$instance\",path=~\".*/intel-rapl:[^/]+:[^/]+$\"}[$__rate_interval])",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_MIMIR}"
              },
              "legendFormat": "DRAM",
              "refId": "B"
            },
            {
              "expr": "rate(node_rapl_psys_joules_total{instance=~\"$instance\",path=~\".*/intel-rapl:[^/]+$\"}[$__rate_interval])",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_MIMIR}"
              },
              "legendFormat": "platform",
              "refId": "C"
            }
          ],
          "title": "RAPL power draw",
          "transparent": false,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_MIMIR}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "lineInterpolation": "linear",
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 4,
          "targets": [
            {
              "expr": "node_power_supply_current_ampere{instance=~\"$instance\",power_supply=~\"BAT.*\"} * on (power_supply) node_power_supply_voltage_volt{instance=~\"$instance\",power_supply=~\"BAT.*\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_MIMIR}"
              },
              "legendFormat": "{{power_supply}}",
              "refId": "A"
            }
          ],
          "title": "Battery electrical power (sign follows kernel current)",
          "transparent": false,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_MIMIR}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "lineInterpolation": "linear",
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 5,
          "targets": [
            {
              "expr": "node_power_supply_temp_celsius{instance=~\"$instance\",power_supply=~\"BAT.*\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_MIMIR}"
              },
              "legendFormat": "{{power_supply}}",
              "refId": "A"
            }
          ],
          "title": "Battery temperature",
          "transparent": false,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_MIMIR}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "lineInterpolation": "linear",
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          }
        }
      ]
    }
