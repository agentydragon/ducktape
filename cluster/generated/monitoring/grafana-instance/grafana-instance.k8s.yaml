alue\": true, \"options\": [{\"text\": \"some\", \"value\": \"waiting\", \"selected\": true}, {\"text\": \"full\", \"value\": \"stalled\", \"selected\": false}], \"includeAll\": false, \"auto\": false, \"auto_min\": \"10s\", \"auto_count\": 30}, {\"type\": \"custom\", \"name\": \"topk\", \"label\": \"Pods\", \"skipUrlSync\": false, \"query\": \"10,25,50\", \"current\": {\"text\": \"10\", \"value\": \"10\"}, \"multi\": false, \"allowCustomValue\": true, \"options\": [{\"text\": \"10\", \"value\": \"10\", \"selected\": true}, {\"text\": \"25\", \"value\": \"25\", \"selected\": false}, {\"text\": \"50\", \"value\": \"50\", \"selected\": false}], \"includeAll\": false, \"auto\": false, \"auto_min\": \"10s\", \"auto_count\": 30}]}, \"annotations\": {}, \"uid\": \"io-pressure\", \"title\": \"IO pressure\", \"tags\": [\"cluster\", \"storage\", \"io\", \"pressure\"], \"timezone\": \"browser\", \"editable\": true, \"graphTooltip\": 1, \"fiscalYearStartMonth\": 0, \"refresh\": \"1m\", \"version\": 1, \"panels\": [{\"type\": \"text\", \"id\": 1, \"title\": \"How to read this dashboard\", \"transparent\": false, \"gridPos\": {\"h\": 6, \"w\": 24, \"x\": 0, \"y\": 0}, \"repeatDirection\": \"h\", \"options\": {\"mode\": \"markdown\", \"content\": \"IO pressure is Linux PSI: the share of wall time in which tasks were stalled waiting for block IO. **Some** means at least one task was stalled; **full** means every non-idle task was stalled at once, so the workload made no progress; **full** is never above **some**. The **IO stall** picker switches the node and pod graphs between the two; the pod table shows both. Node PSI comes from node-exporter (`node_pressure_io_*`); pod PSI comes from cAdvisor's pod-level cgroup (`container_pressure_io_*{container=\\\"\\\"}`). Pod values are not additive: two pods stalled at the same instant each show 100%.\\n\\nThe **Storage tier** selector scopes the node list to Kubernetes nodes labeled `storage.allegedly.works/tier`; **Both** selects `ssd` and `hdd`. Nodes without a tier label, including Wyrm2 and its local OpenEBS volumes, are omitted. The disk rows repeat once per selected node. Disk panels come from node-exporter `node_disk_*`, mapped to the Kubernetes node via its exporter pod. Their `hdd`/`ssd` label is the per-device rotational flag from `node_disk_info`, which can differ from the node storage tier. Virtual disks (`vd*`) usually report rotational regardless of what backs them. Device-mapper, DRBD, loop, and optical devices are left out of physical-device panels. The separate DRBD logical throughput panel overlaps backing-device I/O and must not be added to physical throughput. Latency is the mean service time per completed request over 5 minutes, empty when nothing completed; utilization is the fraction of time the device had IO in flight, which saturates at 100% on a spinning disk but not reliably on SSDs with deep queues.\"}}, {\"type\": \"row\", \"collapsed\": false, \"id\": 2, \"panels\": [], \"title\": \"Node IO pressure\", \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 6}}, {\"type\": \"timeseries\", \"id\": 3, \"targets\": [{\"expr\": \"max by (node) (rate(node_pressure_io_${stall}_seconds_total[5m]) * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace=\\\"monitoring\\\",pod=~\\\"prometheus-node-exporter-.+\\\",node=~\\\"$node\\\"}))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{node}}\", \"refId\": \"A\"}], \"title\": \"Node IO stall: ${stall:text}\", \"description\": \"Share of time tasks on the node waited on IO; the IO stall picker at the top switches between some and full.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 24, \"x\": 0, \"y\": 7}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"right\", \"showLegend\": true, \"calcs\": [\"mean\", \"max\"], \"sortB