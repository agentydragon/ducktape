": 0, "y": 3}, "repeatDirection": "h", "options": {"graphMode": "none", "colorMode": "value", "justifyMode": "auto", "textMode": "auto", "wideLayout": true, "showPercentChange": false, "reduceOptions": {"calcs": ["lastNotNull"], "values": false, "fields": ""}, "percentChangeColorMode": "standard", "orientation": "auto"}, "fieldConfig": {"defaults": {"unit": "short", "min": 0, "color": {"mode": "palette-classic"}}, "overrides": []}}, {"type": "stat", "id": 2, "targets": [{"expr": "sum(increase(kubelet_runtime_operations_total{job=\"kubelet\",operation_type=\"pull_image\"}[24h]))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "instant": true, "legendFormat": "Runtime pull calls", "range": false, "refId": "A"}], "title": "Kubelet pull calls \u00b7 24h", "description": "Outer-cluster kubelet CRI pull_image calls across all registries, including failures. Does not cover nested K3s or Docker-in-Docker. No registry label is available, so this is not a denominator for Zot cache coverage. Window ends at the selected time.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 4, "w": 6, "x": 6, "y": 3}, "repeatDirection": "h", "options": {"graphMode": "none", "colorMode": "value", "justifyMode": "auto", "textMode": "auto", "wideLayout": true, "showPercentChange": false, "reduceOptions": {"calcs": ["lastNotNull"], "values": false, "fields": ""}, "percentChangeColorMode": "standard", "orientation": "auto"}, "fieldConfig": {"defaults": {"unit": "short", "min": 0, "color": {"mode": "palette-classic"}}, "overrides": []}}, {"type": "stat", "id": 3, "targets": [{"expr": "max(kubelet_volume_stats_used_bytes{namespace=\"oci-cache\",persistentvolumeclaim=\"zot-cache\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "instant": true, "legendFormat": "Used", "range": false, "refId": "A"}], "title": "Cache filesystem used", "description": "Kubelet filesystem usage of zot-cache, including indexes, staging and meta