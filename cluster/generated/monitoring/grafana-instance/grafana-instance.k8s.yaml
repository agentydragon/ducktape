among probe samples recorded in the preceding 5 minutes, split by source_node and target. 0% means all recorded probes passed. No data means no probe samples were available and is not treated as success.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 0, \"y\": 143}, \"repeatDirection\": \"h\", \"fieldConfig\": {\"defaults\": {\"unit\": \"percent\", \"min\": 0, \"max\": 100, \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 10, \"showPoints\": \"never\", \"spanNulls\": false}}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 56, \"targets\": [{\"expr\": \"probe_duration_seconds{job=\\\"monitoring/home-application-probes\\\"}\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{source_node}} \\u2192 {{target}}\", \"refId\": \"A\"}], \"title\": \"Probe duration\", \"description\": \"Blackbox exporter probe duration in seconds for each source_node and target. HTTPS duration includes DNS, TCP connection, TLS verification, and the HTTP request.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 8, \"y\": 143}, \"repeatDirection\": \"h\", \"fieldConfig\": {\"defaults\": {\"unit\": \"s\", \"min\": 0, \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 10, \"showPoints\": \"never\", \"spanNulls\": false}}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 57, \"targets\": [{\"expr\": \"100 * count_over_time(probe_success{job=\\\"monitoring/home-application-probes\\\"}[5m]) / 30\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{source_node}} \\u2192 {{target}}\", \"refId\": \"A\"}], \"title\": \"Probe sample coverage\", \"description\": \"Observed probe samples as a percentage of the 30 expected samples in each 5-minute window (10-second scrape interval). Missing series remain No data; reduced values show missing observations.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 16, \"y\": 143}, \"repeatDirection\": \"h\", \"fieldConfig\": {\"defaults\": {\"unit\": \"percent\", \"min\": 0, \"max\": 100, \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 10, \"showPoints\": \"never\", \"spanNulls\": false}}, \"overrides\": []}}], \"links\": [{\"title\": \"Home gateway\", \"type\": \"link\", \"icon\": \"dashboard\", \"tooltip\": \"\", \"tags\": [], \"asDropdown\": false, \"targetBlank\": false, \"includeVars\": false, \"keepTime\": false, \"url\": \"/d/home-gateway\"}]}"
