loads_total{namespace=\"oci-cache\"}[1h]))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "Zot manifest reads", "refId": "A"}, {"expr": "sum(increase(kubelet_runtime_operations_total{job=\"kubelet\",operation_type=\"pull_image\"}[1h]))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "Outer-cluster runtime pull calls", "refId": "B"}], "title": "Manifest reads and runtime pull calls \u00b7 rolling 1h", "description": "Zot counts image-store manifest reads, including HEAD checks, multi-architecture manifests and internal reads. These are not complete image pulls, cache hits or unique images. Outer-cluster kubelet CRI pull_image calls across all registries, including failures. Does not cover nested K3s or Docker-in-Docker. No registry label is available, so this is not a denominator for Zot cache coverage. Each point is the preceding hour, not a disjoint bucket.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 7}, "repeatDirection": "h", "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"drawStyle": "line", "lineWidth": 1, "lineInterpolation": "linear", "fillOpacity": 10, "showPoints": "never"}}, "overrides": []}}, {"type": "timeseries", "id": 6, "targets": [{"expr": "max(kubelet_volume_stats_used_bytes{namespace=\"oci-cache\",persistentvolumeclaim=\"zot-cache\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "Used", "refId": "A"}, {"expr": "max(kubelet_volume_stats_capacity_bytes{namespace=\"oci-cache\",persistentvolumeclaim=\"zot-cache\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "Capacity", "refId": "B"}], "title": "Cache filesystem used and capacity", "description": "Filesystem metrics