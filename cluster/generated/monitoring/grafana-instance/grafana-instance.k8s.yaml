apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cpap-gateway-disk
  namespace: monitoring
spec:
  datasources:
    - datasourceName: mimir
      inputName: DS_MIMIR
  folder: Cluster & Platform
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |-
    {
      "schemaVersion": 39,
      "templating": {},
      "annotations": {},
      "uid": "cpap-gateway-disk",
      "title": "CPAP gateway disk",
      "description": "Guest root filesystem capacity and use for the stateless CPAP gateway VM. The current guest has no separate /boot filesystem mount, so boot-partition usage is not exposed here. This does not measure OptiPlex host storage or Kubernetes pod storage.",
      "tags": [
        "cpap",
        "kubevirt",
        "storage"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "fiscalYearStartMonth": 0,
      "refresh": "1m",
      "version": 1,
      "panels": [
        {
          "type": "timeseries",
          "id": 1,
          "targets": [
            {
              "expr": "max by (mountpoint) (node_filesystem_size_bytes{namespace=\"cpap-sync\",service=\"cpap-gateway-metrics\",endpoint=\"node-metrics\",mountpoint=\"/\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_MIMIR}"
              },
              "legendFormat": "Capacity",
              "refId": "A"
            },
            {
              "expr": "max by (mountpoint) (node_filesystem_size_bytes{namespace=\"cpap-sync\",service=\"cpap-gateway-metrics\",endpoint=\"node-metrics\",mountpoint=\"/\"}) - max by (mountpoint) (node_filesystem_free_bytes{namespace=\"cpap-sync\",service=\"cpap-gateway-metrics\",endpoint=\"node-metrics\",mountpoint=\"/\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_MIMIR}"
              },
              "legendFormat": "Used",
              "refId": "B"
            }
          ],
          "title": "Guest root filesystem: used and capacity",
          "description": "Guest root filesystem. Used bytes are size minus free; root-reserved blocks are included in free. Capacity is the filesystem visible inside the VM, separate from KubeVirt and host storage. Only the CPAP gateway guest filesystem collector is scraped by monitoring Alloy.",
          "transparent": false,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_MIMIR}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "lineInterpolation": "linear",
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 2,
          "targets": [
            {
              "expr": "100 * (1 - max by (mountpoint) (node_filesystem_free_bytes{namespace=\"cpap-sync\",service=\"cpap-gateway-metrics\",endpoint=\"node-metrics\",mountpoint=\"/\"}) / max by (mountpoint) (node_filesystem_size_bytes{namespace=\"cpap-sync\",service=\"cpap-gateway-metrics\",endpoint=\"node-metrics\",mountpoint=\"/\"}))",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_MIMIR}"
              },
              "legendFormat": "Used",
              "refId": "A"
            }
          ],
          "title": "Guest root filesystem: used percent",
          "description": "Guest root filesystem. Used bytes are size minus free; root-reserved blocks are included in free. Capacity is the filesystem visible inside the VM, separate from KubeVirt and host storage. Only the CPAP gateway guest filesystem collector is scraped by monitoring Alloy.",
          "transparent": false,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_MIMIR}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "lineInterpolation": "linear",
                "fillOpacity": 20,
                "showPoints": "never"
              }
            },
            "overrides": []
          }
        }
      ]
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: flux-cluster
  namespace: monitoring
spec:
  datasources:
    - datasourceName: mimir
      inputName: DS_MIMIR
  folder: Cluster & Platform
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |-
    {
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "type": "query",
            "name": "namespace",
            "label": "Namespace",
            "skipUrlSync": false,
            "query": "label_values(kube_customresource_flux_kustomization_ready, namespace)",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_MIMIR}"
            },
            "current": {
              "text": "All",
              "value": [
                "$__all"
              ]
            },
            "multi": true,
            "allowCustomValue": true,
            "refresh": 1,
            "includeAll": true,
            "allValue": ".*",
            "auto": false,
            "auto_min": "10s",
            "auto_count": 30,
            "definition": "label_values(kube_customresource_flux_kustomization_ready, namespace)"
          }
        ]
      },
      "annotations": {},
      "uid": "eM7_f4V7z",
      "title": "Flux cluster",
      "description": "Flux readiness and reconciliation metrics from kube-state-metrics and the Flux controllers.",
      "tags": [
        "flux",
        "kubernetes"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 0,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "fiscalYearStartMonth": 0,
      "refresh": "1m",
      "version": 1,
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "targets": [
            {
              "expr": "count(kube_customresource_flux_kustomization_ready{namespace=~\"$namespace\",status=\"True\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_MIMIR}"
              },
              "instant": true,
              "legendFormat": "ready",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Ready Kustomizations",
          "description": "Kustomizations whose Ready condition is True.",
          "transparent": false,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_MIMIR}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "repeatDirection": "h",
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "justifyMode": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false,
              "fields": ""
            },
            "percentChangeColorMode": "standard",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "red"
                  },
                  {
                    "value": 1,
                    "color": "green"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 2,
          "targets": [
            {
              "expr": "sum(kube_customresource_flux_kustomization_ready{namespace=~\"$namespace\",status!=\"True\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_MIMIR}"
              },
              "instant": true,
              "legendFormat": "not ready",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Not-ready Kustomizations",
          "description": "Kustomizations whose current Ready condition is False or Unknown.",
          "transparent": false,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_MIMIR}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "repeatDirection": "h",
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "justifyMode": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false,
              "fields": ""
            },
            "percentChangeColorMode": "standard",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 1,
                    "color": "red"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 3,
          "targets": [
            {
              "expr": "count(kube_customresource_flux_helmrelease_ready{namespace=~\"$namespace\",status=\"True\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_MIMIR}"
              },
              "instant": true,
              "legendFormat": "ready",
              "range": false,
