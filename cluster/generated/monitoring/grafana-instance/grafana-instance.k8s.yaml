  json: '{"schemaVersion": 39, "templating": {"list": [{"type": "custom", "name": "storage_tier", "label": "Storage tier", "skipUrlSync": false, "query": "SSD : ssd,HDD : hdd,Both : ssd|hdd", "current": {"text": "Both", "value": "ssd|hdd", "selected": true}, "multi": false, "allowCustomValue": true, "options": [{"text": "SSD", "value": "ssd", "selected": false}, {"text": "HDD", "value": "hdd", "selected": false}, {"text": "Both", "value": "ssd|hdd", "selected": true}], "includeAll": false, "auto": false, "auto_min": "10s", "auto_count": 30}, {"type": "query", "name": "node", "label": "Machine", "skipUrlSync": false, "query": "label_values(kube_node_labels{label_storage_allegedly_works_tier=~\"$storage_tier\"}, node)", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "current": {"text": "All", "value": ["$__all"]}, "multi": true, "allowCustomValue": true, "refresh": 1, "sort": 1, "includeAll": true, "auto": false, "auto_min": "10s", "auto_count": 30, "definition": "label_values(kube_node_labels{label_storage_allegedly_works_tier=~\"$storage_tier\"}, node)"}]}, "annotations": {}, "uid": "cluster-disk-usage", "title": "Host filesystem usage \u00b7 ext4/XFS", "tags": ["cluster", "disk", "storage", "filesystem", "ext4", "xfs"], "timezone": "browser", "editable": true, "graphTooltip": 1, "time": {"from": "now-24h", "to": "now"}, "fiscalYearStartMonth": 0, "refresh": "5m", "version": 1, "panels": [{"type": "text", "id": 1, "title": "How to read this dashboard", "transparent": false, "gridPos": {"h": 6, "w": 24, "x": 0, "y": 0}, "repeatDirection": "h", "options": {"mode": "markdown", "content": "This dashboard covers **host ext4/XFS filesystems** only. Its filesystem totals and attribution do not include Piraeus LVM thin pools, diskful PV limits, or copy estimates; see the **Piraeus LVM storage** dashboard for those separate accounting layers.\n\nFilesystem use is size minus free bytes, deduplicated by node and device. The attribution view separates measured components, unattributed bytes, root-reserved free space, and available bytes. Repeated mounts can refer to one underlying device.\n\nThe Storage tier selector filters by node labels; Machine filters node-owned panels. This is node-level filtering. If a node later has both SSD and HDD, per-device media labels will be needed to separate those disks."}}, {"type": "stat", "id": 2, "targets": [{"expr": "sum(disk_usage:filesystem_size_bytes{node=~\"$node\"} - on (node, device) disk_usage:filesystem_free_bytes{node=~\"$node\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "instant": true, "range": false, "refId": "A"}], "title": "Host filesystem used (ext4/XFS)", "description": "Sum of ext4/XFS filesystem size minus free bytes, deduplicated by node and device. This excludes ext4 root-reserved blocks and is host-filesystem accounting, separate from Piraeus thin-pool use.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 5, "w": 12, "x": 0, "y": 6}, "repeatDirection": "h", "options": {"graphMode": "area", "colorMode": "value", "justifyMode": "auto", "textMode": "auto", "wideLayout": true, "showPercentChange": false, "reduceOptions": {"calcs": ["lastNotNull"], "values": false, "fields": ""}, "percentChangeColorMode": "standard", "orientation": "auto"}, "fieldConfig": {"defaults": {"unit": "bytes", "color": {"mode": "fixed", "fixedColor": "#5794F2"}}, "overrides": []}}, {"type": "stat", "id": 3, "targets": [{"expr": "sum(disk_usage:filesystem_size_bytes{node=~\"$node\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "instant": true, "range": false, "refId": "A"}], "title": "Host filesystem capacity (ext4/XFS)", "description": "Total ext4/XFS host filesystem capacity from filesystem recording rules, deduplicated by node and device.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 5, "w": 12, "x": 12, "y": 6}, "repeatDirection": "h", "options": {"graphMode": "area", "colorMode": "value", "justifyMode": "auto", "textMode": "auto", "wideLayout": true, "showPercentChange": false, "reduceOptions": {"calcs": ["lastNotNull"], "values": false, "fields": ""}, "percentChangeColorMode": "standard", "orientation": "auto"}, "fieldConfig": {"defaults": {"unit": "bytes", "color": {"mode": "fixed", "fixedColor": "#5794F2"}}, "overrides": []}}, {"type": "row", "collapsed": false, "id": 23, "panels": [], "title": "Ext4/XFS host filesystem attribution", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 11}}, {"type": "piechart", "id": 18, "targets": [{"expr": "sum by (category) (disk_usage:component_used_bytes{node=~\"$node\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "instant": true, "legendFormat": "{{category}}", "range": false, "refId": "A"}, {"expr": "sum(disk_usage:unattributed_bytes{node=~\"$node\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "instant": true, "legendFormat": "Unattributed", "range": false, "refId": "B"}, {"expr": "sum(disk_usage:filesystem_free_bytes{node=~\"$node\"} - on (node, device) disk_usage:filesystem_avail_bytes{node=~\"$node\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "instant": true, "legendFormat": "Reserved (root only)", "range": false, "refId": "C"}, {"expr": "sum(disk_usage:filesystem_avail_bytes{node=~\"$node\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "instant": true, "legendFormat": "Free", "range": false, "refId": "D"}], "title": "Ext4/XFS filesystem capacity by use", "description": "Host filesystem components, unattributed use, root-only reserve, and available bytes. Piraeus thin-pool physical use and volume-copy estimates are separate accounting layers.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 0, "y": 12}, "repeatDirection": "h", "options": {"pieType": "pie", "tooltip": {"mode": "single", "sort": "asc"}, "reduceOptions": {"calcs": ["lastNotNull"], "values": false, "fields": ""}, "legend": {"values": ["value", "percent"], "displayMode": "table", "placement": "right", "showLegend": true, "calcs": []}, "orientation": "auto", "displayLabels": ["name", "percent"]}, "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": [{"matcher": {"id": "byName", "options": "Free"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "rgba(115, 191, 105, 0.35)"}}]}, {"matcher": {"id": "byName", "options": "Unattributed"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]}, {"matcher": {"id": "byName", "options": "Reserved (root only)"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#8e8e8e"}}]}]}}, {"type": "barchart", "id": 19, "targets": [{"expr": "label_join((sum by (node, device, component) (disk_usage:component_used_bytes{node=~\"$node\"}) or label_replace(disk_usage:unattributed_bytes{node=~\"$node\"}, \"component\", \"Unattributed\", \"\", \"\") or label_replace(disk_usage:filesystem_free_bytes{node=~\"$node\"} - disk_usage:filesystem_avail_bytes{node=~\"$node\"}, \"component\", \"Reserved (root only)\", \"\", \"\") or label_replace(disk_usage:filesystem_avail_bytes{node=~\"$node\"}, \"component\", \"Free\", \"\", \"\")) * on (node, device) group_left (mountpoint, media) (topk by (node, device) (1, disk_usage:mount:info{node=~\"$node\"}) * on (node, device) group_left (media) disk_usage:filesystem:info{node=~\"$node\"}), \"disk\", \" \u00b7 \", \"node\", \"device\", \"mountpoint\", \"media\")", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "range": false, "refId": "A"}, {"expr": "max(disk_usage:filesystem_size_bytes{node=~\"$node\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "range": false, "refId": "MaxDisk"}], "title": "Host filesystem use by component", "description": "One bar per scraped ext4/XFS filesystem across the selected machines, labelled node, device, mountpoint, and media. Bars share the largest selected disk as their scale. Components come from existing filesystem rules; Piraeus pool physical use and per-copy estimates are separate.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 12, "y": 12}, "repeatDirection": "h", "transformations": [{"id": "configFromData", "options": {"configRefId": "MaxDisk", "mappings": [{"fieldName": "Value #MaxDisk", "handlerKey": "max"}, {"fieldName": "Time", "handlerKey": "__ignore"}], "applyTo": {"id": "byType", "options": "number"}}}, {"id": "groupingToMatrix", "options": {"columnField": "component", "rowField": "disk", "valueField": "Value #A", "emptyValue": "null"}}, {"id": "sortBy", "options": {"fields": {}, "sort": [{"field": "disk\\component", "desc": false}]}}, {"id": "organize", "options": {"excludeByName": {}, "renameByName": {"disk\\component": "Disk"}}}], "options": {"orientation": "horizontal", "xTickLabelRotation": 0, "xTickLabelMaxLength": 0, "stacking": "normal", "showValue": "never", "barWidth": 0.8, "groupWidth": 0.7, "legend": {"displayMode": "list", "placement": "bottom", "showLegend": false, "calcs": []}, "tooltip": {"mode": "multi", "sort": "desc", "hideZeros": true}, "fullHighlight": false, "xField": "Disk", "barRadius": 0, "xTickLabelSpacing": 0}, "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "color": {"mode": "palette-classic"}, "custom": {"lineWidth": 0, "fillOpacity": 85, "gradientMode": "none", "axisPlacement": "auto", "axisSoftMin": 0}}, "overrides": [{"matcher": {"id": "byName", "options": "Free"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "rgba(115, 191, 105, 0.35)"}}]}, {"matcher": {"id": "byName", "options": "Unattributed"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]}, {"matcher": {"id": "byName", "options": "Reserved (root only)"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#8e8e8e"}}]}]}}, {"type": "table", "id": 20, "targets": [{"expr": "sort_desc((sum by (node, device, component) (disk_usage:component_used_bytes{node=~\"$node\"}) or label_replace(disk_usage:unattributed_bytes{node=~\"$node\"}, \"component\", \"Unattributed\", \"\", \"\") or label_replace(disk_usage:filesystem_free_bytes{node=~\"$node\"} - disk_usage:filesystem_avail_bytes{node=~\"$node\"}, \"component\", \"Reserved (root only)\", \"\", \"\") or label_replace(disk_usage:filesystem_avail_bytes{node=~\"$node\"}, \"component\", \"Free\", \"\", \"\")) * on (node, device) group_left (mountpoint, media) (topk by (node, device) (1, disk_usage:mount:info{node=~\"$node\"}) * on (node, device) group_left (media) disk_usage:filesystem:info{node=~\"$node\"}))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "range": false, "refId": "A"}, {"expr": "(sum by (node, device, component) (disk_usage:component_used_bytes{node=~\"$node\"}) or label_replace(disk_usage:unattributed_bytes{node=~\"$node\"}, \"component\", \"Unattributed\", \"\", \"\") or label_replace(disk_usage:filesystem_free_bytes{node=~\"$node\"} - disk_usage:filesystem_avail_bytes{node=~\"$node\"}, \"component\", \"Reserved (root only)\", \"\", \"\") or label_replace(disk_usage:filesystem_avail_bytes{node=~\"$node\"}, \"component\", \"Free\", \"\", \"\")) * on (node, device) group_left (mountpoint, media) (topk by (node, device) (1, disk_usage:mount:info{node=~\"$node\"}) * on (node, device) group_left (media) disk_usage:filesystem:info{node=~\"$node\"}) / on (node, device) group_left () disk_usage:filesystem_size_bytes{node=~\"$node\"}", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "range": false, "refId": "B"}], "title": "Host filesystem attribution by node and device", "description": "Ext4/XFS filesystem component estimates, free bytes, and root-only reserve by node and device. Piraeus thin-pool accounting is kept separate; per-copy Piraeus allocation estimates do not form a residual against these filesystem bytes.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 12, "w": 24, "x": 0, "y": 21}, "repeatDirection": "h", "transformations": [{"id": "merge", "options": {}}, {"id": "organize", "options": {"excludeByName": {"Time": true}, "indexByName": {"node": 0, "device": 1, "mountpoint": 2, "media": 3, "component": 4, "Value #A": 5, "Value #B": 6}, "renameByName": {"node": "Machine", "device": "Device", "mountpoint": "Mountpoint", "media": "Media", "component": "Component", "Value #A": "Bytes", "Value #B": "Share of disk"}}}, {"id": "sortBy", "options": {"fields": {}, "sort": [{"field": "Bytes", "desc": true}]}}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": [{"matcher": {"id": "byName", "options": "Share of disk"}, "properties": [{"id": "unit", "value": "percentunit"}, {"id": "decimals", "value": 1}]}]}}, {"type": "bargauge", "id": 21, "targets": [{"expr": "sort_desc(label_join(disk_usage:unattributed_bytes{node=~\"$node\"} * on (node, device) group_left (mountpoint, media) (topk by (node, device) (1, disk_usage:mount:info{node=~\"$node\"}) * on (node, device) group_left (media) disk_usage:filesystem:info{node=~\"$node\"}), \"disk\", \" \u00b7 \", \"node\", \"device\", \"mountpoint\", \"media\"))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "instant": true, "legendFormat": "{{disk}}", "range": false, "refId": "A"}], "title": "Unattributed bytes per disk", "description": "Filesystem used (size minus free) minus every attributed component. On system disks (/var, /) this is mostly container images, emptyDir volumes, logs and etcd, which no scraped metric breaks down; on data disks, see the PVC list beside it.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 11, "w": 24, "x": 0, "y": 33}, "repeatDirection": "h", "options": {"displayMode": "basic", "valueMode": "color", "namePlacement": "top", "showUnfilled": true, "sizing": "auto", "minVizWidth": 8, "minVizHeight": 16, "legend": {"displayMode": "list", "placement": "bottom", "showLegend": false, "calcs": []}, "reduceOptions": {"calcs": ["lastNotNull"], "values": false, "fields": ""}, "maxVizHeight": 300, "orientation": "horizontal"}, "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "color": {"mode": "fixed", "fixedColor": "orange"}}, "overrides": []}}, {"type": "table", "id": 4, "targets": [{"expr": "sort_desc((disk_usage:filesystem_size_bytes{node=~\"$node\"} - on (node, device) disk_usage:filesystem_free_bytes{node=~\"$node\"}) * on (node, device) group_right disk_usage:mount:info{node=~\"$node\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "legendFormat": "{{node}} {{device}} {{mountpoint}}", "range": false, "refId": "A"}], "title": "Current host filesystem use by mount", "description": "Per-mount ext4/XFS data used from deduplicated per-device filesystem recordings. Repeated mounts, including bind mounts, are shown as detail rows; dashboard totals count each device once.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 0, "y": 44}, "repeatDirection": "h", "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}}}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"type": "timeseries", "id": 5, "targets": [{"expr": "topk(10, (disk_usage:filesystem_size_bytes{node=~\"$node\"} - on (node, device) disk_usage:filesystem_free_bytes{node=~\"$node\"}) * on (node, device) group_right disk_usage:mount:info{node=~\"$node\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "{{node}} {{mountpoint}}", "refId": "A"}], "title": "Largest host filesystem mounts over time", "description": "Top ten ext4/XFS mounts by data used, joined from deduplicated per-device filesystem recordings. Repeated mounts can show the same underlying device; they are detail series, not additive capacity.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 12, "y": 44}, "repeatDirection": "h", "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": []}, "tooltip": {"mode": "multi", "sort": "desc"}}, "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}]}'
