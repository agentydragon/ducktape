apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: buildbuddy-executor-pool
  namespace: monitoring
spec:
  datasources:
    - datasourceName: mimir
      inputName: DS_MIMIR
  folder: CI
  instanceSelector:
