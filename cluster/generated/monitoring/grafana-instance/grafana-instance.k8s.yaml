  json: '{"schemaVersion": 39, "templating": {}, "annotations": {}, "uid": "cpap-gateway-disk", "title": "CPAP gateway disk", "description": "Guest root filesystem capacity and use for the stateless CPAP gateway VM. The current guest has no separate /boot filesystem mount, so boot-partition usage is not exposed here. This does not measure OptiPlex host storage or Kubernetes pod storage.", "tags": ["cpap", "kubevirt", "storage"], "timezone": "browser", "editable": true, "graphTooltip": 1, "time": {"from": "now-24h", "to": "now"}, "fiscalYearStartMonth": 0, "refresh": "1m", "version": 1, "panels": [{"type": "timeseries", "id": 1, "targets": [{"expr": "max by (mountpoint) (node_filesystem_size_bytes{namespace=\"cpap-sync\",service=\"cpap-gateway-metrics\",endpoint=\"node-metrics\",mountpoint=\"/\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "Capacity", "refId": "A"}, {"expr": "max by (mountpoint) (node_filesystem_size_bytes{namespace=\"cpap-sync\",service=\"cpap-gateway-metrics\",endpoint=\"node-metrics\",mountpoint=\"/\"}) - max by (mountpoint) (node_filesystem_free_bytes{namespace=\"cpap-sync\",service=\"cpap-gateway-metrics\",endpoint=\"node-metrics\",mountpoint=\"/\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "Used", "refId": "B"}], "title": "Guest root filesystem: used and capacity", "description": "Guest root filesystem. Used bytes are size minus free; root-reserved blocks are included in free. Capacity is the filesystem visible inside the VM, separate from KubeVirt and host storage. Only the CPAP gateway guest filesystem collector is scraped by monitoring Alloy.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}, "repeatDirection": "h", "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "lineWidth": 1, "lineInterpolation": "linear", "fillOpacity": 10, "showPoints": "never"}}, "overrides": []}}, {"type": "timeseries", "id": 2, "targets": [{"expr": "100 * (1 - max by (mountpoint) (node_filesystem_free_bytes{namespace=\"cpap-sync\",service=\"cpap-gateway-metrics\",endpoint=\"node-metrics\",mountpoint=\"/\"}) / max by (mountpoint) (node_filesystem_size_bytes{namespace=\"cpap-sync\",service=\"cpap-gateway-metrics\",endpoint=\"node-metrics\",mountpoint=\"/\"}))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "Used", "refId": "A"}], "title": "Guest root filesystem: used percent", "description": "Guest root filesystem. Used bytes are size minus free; root-reserved blocks are included in free. Capacity is the filesystem visible inside the VM, separate from KubeVirt and host storage. Only the CPAP gateway guest filesystem collector is scraped by monitoring Alloy.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "repeatDirection": "h", "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "fieldConfig": {"defaults": {"unit": "percent", "decimals": 1, "min": 0, "max": 100, "custom": {"drawStyle": "line", "lineWidth": 1, "lineInterpolation": "linear", "fillOpacity": 20, "showPoints": "never"}}, "overrides": []}}]}'
