ional\\\", \\\"1\\\"), \\\"media\\\", \\\"ssd\\\", \\\"rotational\\\", \\\"0\\\")) * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace=\\\"monitoring\\\",pod=~\\\"prometheus-node-exporter-.+\\\",node=~\\\"$node\\\"}))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{device}} ({{media}})\", \"refId\": \"A\"}], \"title\": \"Disk queue depth\", \"description\": \"Average number of requests in flight (node_disk_io_time_weighted_seconds_total).\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 9, \"w\": 8, \"x\": 16, \"y\": 64}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"mean\", \"max\"], \"sortBy\": \"Max\", \"sortDesc\": true}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"min\": 0, \"custom\": {\"fillOpacity\": 10}}, \"overrides\": []}}, {\"type\": \"row\", \"collapsed\": false, \"id\": 17, \"panels\": [], \"title\": \"DRBD logical I/O\", \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 73}}, {\"type\": \"timeseries\", \"id\": 18, \"targets\": [{\"expr\": \"max by (node, device) ((rate(node_disk_read_bytes_total{device=~\\\"^drbd.*\\\"}[5m]) + rate(node_disk_written_bytes_total{device=~\\\"^drbd.*\\\"}[5m])) * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace=\\\"monitoring\\\",pod=~\\\"prometheus-node-exporter-.+\\\",node=~\\\"$node\\\"}))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{node}} {{device}}\", \"refId\": \"A\"}], \"title\": \"Logical throughput by node and device\", \"description\": \"Read plus written bytes per second by DRBD device. This is logical block-device I/O and overlaps the backing physical devices; do not add it to physical throughput.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 9, \"w\": 24, \"x\": 0, \"y\": 74}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"mean\", \"max\"], \"sortBy\": \"Max\", \"sortDesc\": true}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"Bps\", \"min\": 0, \"custom\": {\"fillOpacity\": 10}}, \"overrides\": []}}]}"
