apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: s3-operations
  namespace: monitoring
spec:
  datasources:
    - datasourceName: mimir
      inputName: DS_MIMIR
  folder: Storage
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: "{\"schemaVersion\": 39, \"templating\": {\"list\": [{\"type\": \"query\", \"name\": \"bucket\", \"label\": \"Bucket\", \"skipUrlSync\": false, \"query\": \"label_values(SeaweedFS_s3_request_total{namespace=\\\"seaweedfs\\\"}, bucket)\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"current\": {\"text\": \"All buckets\", \"value\": \"$__all\"}, \"multi\": false, \"allowCustomValue\": true, \"options\": [{\"text\": \"All buckets\", \"value\": \"$__all\", \"selected\": true}], \"refresh\": 1, \"includeAll\": true, \"allValue\": \".*\", \"auto\": false, \"auto_min\": \"10s\", \"auto_count\": 30, \"definition\": \"label_values(SeaweedFS_s3_request_total{namespace=\\\"seaweedfs\\\"}, bucket)\"}]}, \"annotations\": {}, \"uid\": \"s3-operations\", \"title\": \"S3 Operations\", \"tags\": [\"cluster\", \"seaweedfs\", \"s3\", \"operations\"], \"timezone\": \"browser\", \"editable\": true, \"graphTooltip\": 1, \"time\": {\"from\": \"now-1h\", \"to\": \"now\"}, \"fiscalYearStartMonth\": 0, \"refresh\": \"1m\", \"version\": 1, \"panels\": [{\"type\": \"text\", \"id\": 1, \"title\": \"Reading this dashboard\", \"transparent\": false, \"gridPos\": {\"h\": 4, \"w\": 24, \"x\": 0, \"y\": 0}, \"repeatDirection\": \"h\", \"options\": {\"mode\": \"markdown\", \"content\": \"Choose a bucket to filter request/error rates, p95s, and per-bucket traffic. `seaweedfs-s3` is internal; `public-s3` is public. Missing request series are not proof of zero traffic; check scrape status.\\n\\nRequest duration includes full response transfer; TTFB is time to first byte. Both percentiles use a rolling five-minute window. In-flight gauges have no bucket label and stay gateway-wide.\"}}, {\"type\": \"stat\", \"id\": 2, \"targets\": [{\"expr\": \"max by (service, pod) (up{namespace=\\\"seaweedfs\\\", service=~\\\"^(public-s3|seaweedfs-s3)$\\\"}) or on (service) label_replace(label_replace(vector(2), \\\"service\\\", \\\"public-s3\\\", \\\"\\\", \\\"\\\"), \\\"collection\\\", \\\"not-scraped\\\", \\\"\\\", \\\"\\\") or on (service) label_replace(label_replace(vector(2), \\\"service\\\", \\\"seaweedfs-s3\\\", \\\"\\\", \\\"\\\"), \\\"collection\\\", \\\"not-scraped\\\", \\\"\\\", \\\"\\\")\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"instant\": true, \"legendFormat\": \"{{service}} / {{pod}} {{collection}}\", \"range\": false, \"refId\": \"A\"}], \"title\": \"S3 metrics scrape status\", \"description\": \"Each pod shows its current scrape state: 1 = Up, 0 = Down. An expected service without any target series is added as 2 = Not collected and labeled `not-scraped`. These values describe collection, not traffic.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 6, \"w\": 24, \"x\": 0, \"y\": 4}, \"repeatDirection\": \"h\", \"options\": {\"graphMode\": \"none\", \"colorMode\": \"background\", \"justifyMode\": \"auto\", \"textMode\": \"value_and_name\", \"wideLayout\": true, \"showPercentChange\": false, \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"values\": false, \"fields\": \"\"}, \"percentChangeColorMode\": \"standard\", \"orientation\": \"horizontal\"}, \"fieldConfig\": {\"defaults\": {\"decimals\": 0, \"mappings\": [{\"type\": \"value\", \"options\": {\"0\": {\"text\": \"Down\", \"color\": \"red\"}, \"1\": {\"text\": \"Up\", \"color\": \"green\"}, \"2\": {\"text\": \"Not collected\", \"color\": \"orange\"}}}], \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"value\": null, \"color\": \"red\"}, {\"value\": 1, \"color\": \"green\"}, {\"value\": 2, \"color\": \"orange\"}]}}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 3, \"targets\": [{\"expr\": \"sum by (service, type) (rate(SeaweedFS_s3_request_total{namespace=\\\"seaweedfs\\\", service=~\\\"^(public-s3|seaweedfs-s3)$\\\", bucket=~\\\"$bucket\\\"}[5m]))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{service}} / {{type}}\", \"refId\": \"A\"}], \"title\": \"S3 requests/s\", \"description\": \"Request counter rate by S3 service and operation. The Bucket selector applies.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 10}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"decimals\": 2, \"min\": 0}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 4, \"targets\": [{\"expr\": \"sum by (service, type) (rate(SeaweedFS_s3_request_total{namespace=\\\"seaweedfs\\\", service=~\\\"^(public-s3|seaweedfs-s3)$\\\", bucket=~\\\"$bucket\\\", code=~\\\"5..\\\"}[5m])) or on (service, type) (0 * sum by (service, type) (rate(SeaweedFS_s3_request_total{namespace=\\\"seaweedfs\\\", service=~\\\"^(public-s3|seaweedfs-s3)$\\\", bucket=~\\\"$bucket\\\"}[5m])))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{service}} / {{type}}\", \"refId\": \"A\"}], \"title\": \"HTTP 5xx requests/s\", \"description\": \"Rate of S3 requests whose response code is 5xx, grouped by service and operation. A real zero is allowed when there are no recent errors. The Bucket selector applies.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 10}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"decimals\": 3, \"min\": 0}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 5, \"targets\": [{\"expr\": \"histogram_quantile(0.95, sum by (service, type, le) (rate(SeaweedFS_s3_request_seconds_bucket{namespace=\\\"seaweedfs\\\", service=~\\\"^(public-s3|seaweedfs-s3)$\\\", bucket=~\\\"$bucket\\\"}[5m])))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{service}} / {{type}}\", \"refId\": \"A\"}], \"title\": \"Request duration p95\", \"description\": \"95th percentile of full S3 request processing duration in seconds. This includes response transfer time; large object downloads can dominate it. The Bucket selector applies.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 18}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"s\", \"decimals\": 3, \"min\": 0}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 6, \"targets\": [{\"expr\": \"histogram_quantile(0.95, sum by (service, type, le) (rate(SeaweedFS_s3_time_to_first_byte_millisecond_bucket{namespace=\\\"seaweedfs\\\", service=~\\\"^(public-s3|seaweedfs-s3)$\\\", bucket=~\\\"$bucket\\\"}[5m]))) / 1000\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{service}} / {{type}}\", \"refId\": \"A\"}], \"title\": \"Time to first byte p95\", \"description\": \"95th percentile time to first byte, converted from the exporter's millisecond buckets to seconds. Compare with full request duration above. The Bucket selector applies.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 18}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"s\", \"decimals\": 3, \"min\": 0}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 7, \"targets\": [{\"expr\": \"sum by (service, bucket) (rate(SeaweedFS_s3_bucket_traffic_received_bytes_total{namespace=\\\"seaweedfs\\\", service=~\\\"^(public-s3|seaweedfs-s3)$\\\", bucket=~\\\"$bucket\\\"}[5m]))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{service}} / {{bucket}}\", \"refId\": \"A\"}], \"title\": \"S3 bytes received by bucket\", \"description\": \"S3 client-to-gateway bytes per second, grouped by service and bucket. The Bucket selector applies.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 26}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"Bps\", \"decimals\": 1, \"min\": 0}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 8, \"targets\": [{\"expr\": \"sum by (service, bucket) (rate(SeaweedFS_s3_bucket_traffic_sent_bytes_total{namespace=\\\"seaweedfs\\\", service=~\\\"^(public-s3|seaweedfs-s3)$\\\", bucket=~\\\"$bucket\\\"}[5m]))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{service}} / {{bucket}}\", \"refId\": \"A\"}], \"title\": \"S3 bytes sent by bucket\", \"description\": \"S3 gateway-to-client bytes per second, grouped by service and bucket. The Bucket selector applies.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 26}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"Bps\", \"decimals\": 1, \"min\": 0}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 9, \"targets\": [{\"expr\": \"sum by (service, type) (SeaweedFS_s3_in_flight_requests{namespace=\\\"seaweedfs\\\", service=~\\\"^(public-s3|seaweedfs-s3)$\\\"})\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{service}} / {{type}}\", \"refId\": \"A\"}], \"title\": \"S3 requests in flight\", \"description\": \"Current in-flight requests grouped by service and operation. This gauge has no bucket label and is gateway-wide; the Bucket selector does not affect it.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 34}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"min\": 0}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 10, \"targets\": [{\"expr\": \"sum by (service) (SeaweedFS_s3_in_flight_upload_count{namespace=\\\"seaweedfs\\\", service=~\\\"^(public-s3|seaweedfs-s3)$\\\"})\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{service}}\", \"refId\": \"A\"}], \"title\": \"S3 uploads in flight\", \"description\": \"Current upload count grouped by service. This gauge has no bucket label and is gateway-wide; the Bucket selector does not affect it.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 34}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0, \"min\": 0}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 11, \"targets\": [{\"expr\": \"sum by (service) (SeaweedFS_s3_in_flight_upload_bytes{namespace=\\\"seaweedfs\\\", service=~\\\"^(public-s3|seaweedfs-s3)$\\\"})\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{service}}\", \"refId\": \"A\"}], \"title\": \"S3 upload bytes in flight\", \"description\": \"Current bytes being uploaded, grouped by service. This gauge has no bucket label and is gateway-wide; the Bucket selector does not affect it.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 24, \"x\": 0, \"y\": 42}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"bytes\", \"decimals\": 0, \"min\": 0}, \"overrides\": []}}]}"
