apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: storage-service-details
  namespace: monitoring
spec:
  datasources:
    - datasourceName: mimir
      inputName: DS_MIMIR
  folder: Storage
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: '{"schemaVersion": 39, "templating": {"list": [{"type": "custom", "name": "storage_tier", "label": "Storage tier", "skipUrlSync": false, "query": "SSD : ssd,HDD : hdd,Both : ssd|hdd", "current": {"text": "Both", "value": "ssd|hdd", "selected": true}, "multi": false, "allowCustomValue": true, "options": [{"text": "SSD", "value": "ssd", "selected": false}, {"text": "HDD", "value": "hdd", "selected": false}, {"text": "Both", "value": "ssd|hdd", "selected": true}], "includeAll": false, "auto": false, "auto_min": "10s", "auto_count": 30}, {"type": "query", "name": "node", "label": "Machine", "skipUrlSync": false, "query": "label_values(kube_node_labels{label_storage_allegedly_works_tier=~\"$storage_tier\"}, node)", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "current": {"text": "All", "value": ["$__all"]}, "multi": true, "allowCustomValue": true, "refresh": 1, "sort": 1, "includeAll": true, "auto": false, "auto_min": "10s", "auto_count": 30, "definition": "label_values(kube_node_labels{label_storage_allegedly_works_tier=~\"$storage_tier\"}, node)"}]}, "annotations": {}, "uid": "storage-service-details", "title": "Storage workload and collector details", "tags": ["cluster", "storage", "workload", "collector"], "timezone": "browser", "editable": true, "graphTooltip": 1, "time": {"from": "now-24h", "to": "now"}, "fiscalYearStartMonth": 0, "refresh": "5m", "version": 1, "panels": [{"type": "text", "id": 1, "title": "How to read this dashboard", "transparent": false, "gridPos": {"h": 6, "w": 24, "x": 0, "y": 0}, "repeatDirection": "h", "options": {"mode": "markdown", "content": "These are workload and collector measurements, not a third layer to add to host filesystem or Piraeus pool totals. CNPG database size is not total PGDATA filesystem use. SeaweedFS logical bucket bytes omit replicas; physical bucket and collection values overlap. ClickHouse MergeTree bytes are per-pod collector values.\n\nMachine and Storage tier filter node-owned panels. SeaweedFS S3 bucket panels are cluster-wide and are not filtered by node ownership.\n\nThe Storage tier selector filters by node labels; Machine filters node-owned panels. This is node-level filtering. If a node later has both SSD and HDD, per-device media labels will be needed to separate those disks."}}, {"type": "row", "collapsed": false, "id": 24, "panels": [], "title": "CNPG database detail", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 6}}, {"type": "table", "id": 6, "targets": [{"expr": "sort_desc(max by (node, namespace, job, datname) (cnpg_pg_database_size_bytes{datname!~\"template0|template1\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{node=~\"$node\"})))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "legendFormat": "{{node}} {{namespace}} {{job}} {{datname}}", "range": false, "refId": "A"}], "title": "CNPG database size by machine now", "description": "CNPG exporter database-size values from pods on the selected machine. This database metric is not total PGDATA filesystem use; replicas report their own copies and must not be added across machines as unique data.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 0, "y": 7}, "repeatDirection": "h", "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}}}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"type": "timeseries", "id": 7, "targets": [{"expr": "topk(10, max by (node, namespace, job, datname) (cnpg_pg_database_size_bytes{datname!~\"template0|template1\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{node=~\"$node\"})))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "{{node}} {{namespace}} {{job}} {{datname}}", "refId": "A"}], "title": "Largest CNPG databases by machine over time", "description": "CNPG exporter database-size values from pods on the selected machine. This database metric is not total PGDATA filesystem use; replicas report their own copies and must not be added across machines as unique data.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 12, "y": 7}, "repeatDirection": "h", "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": []}, "tooltip": {"mode": "multi", "sort": "desc"}}, "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"type": "row", "collapsed": false, "id": 40, "panels": [], "title": "SeaweedFS volume-server detail", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 16}}, {"type": "table", "id": 8, "targets": [{"expr": "sort_desc(max by (node, pod, name, type) (SeaweedFS_volumeServer_resource{namespace=\"seaweedfs\",type=~\"all|avail|used\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace=\"seaweedfs\",node=~\"$node\"})))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "legendFormat": "{{node}} {{pod}} {{name}} {{type}}", "range": false, "refId": "A"}], "title": "SeaweedFS volume-server disks by machine now", "description": "Volume-server all/available/used resource gauges from pods on the selected machine. These per-server values are collector detail and are not additive to the filesystem or Piraeus pool totals.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 0, "y": 17}, "repeatDirection": "h", "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}}}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"type": "timeseries", "id": 9, "targets": [{"expr": "max by (node, pod, name) (SeaweedFS_volumeServer_resource{namespace=\"seaweedfs\",type=\"used\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace=\"seaweedfs\",node=~\"$node\"}))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "{{node}} {{pod}} {{name}}", "refId": "A"}], "title": "SeaweedFS volume-server disk use by machine over time", "description": "Volume-server reported used bytes per selected storage node and server disk. This is a per-collector view; do not add it to the independent pool and filesystem accounting layers.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 12, "y": 17}, "repeatDirection": "h", "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": []}, "tooltip": {"mode": "multi", "sort": "desc"}}, "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"type": "table", "id": 14, "targets": [{"expr": "sort_desc(sum by (node, collection) (max by (node, collection, pod) (SeaweedFS_volumeServer_total_disk_size{namespace=\"seaweedfs\",type=\"normal\",collection!=\"\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace=\"seaweedfs\",node=~\"$node\"}))))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "legendFormat": "{{node}} {{collection}}", "range": false, "refId": "A"}], "title": "SeaweedFS collection bytes by machine now", "description": "Collection bytes reported by volume-server pods on the selected machine. Each replica is counted on its storage node; these collector values overlap physical bucket bytes.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 0, "y": 26}, "repeatDirection": "h", "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}}}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"type": "timeseries", "id": 15, "targets": [{"expr": "topk(10, sum by (node, collection) (max by (node, collection, pod) (SeaweedFS_volumeServer_total_disk_size{namespace=\"seaweedfs\",type=\"normal\",collection!=\"\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace=\"seaweedfs\",node=~\"$node\"}))))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "{{node}} {{collection}}", "refId": "A"}], "title": "Largest SeaweedFS collections by machine over time", "description": "Collection bytes reported by volume-server pods on the selected machine over time. Each replica is counted on its storage node; these collector values overlap physical bucket bytes.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 12, "y": 26}, "repeatDirection": "h", "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": []}, "tooltip": {"mode": "multi", "sort": "desc"}}, "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"type": "row", "collapsed": false, "id": 41, "panels": [], "title": "SeaweedFS S3 bucket detail \u00b7 cluster-wide", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 35}}, {"type": "table", "id": 10, "targets": [{"expr": "sort_desc(max by (bucket) (SeaweedFS_s3_bucket_size_bytes{namespace=\"seaweedfs\",bucket!=\"\"}))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "legendFormat": "{{bucket}}", "range": false, "refId": "A"}], "title": "SeaweedFS S3 logical bucket size now (cluster-wide)", "description": "Logical S3 object bytes by bucket across the cluster. The Machine selector does not apply because this metric has no storage-node ownership.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 0, "y": 36}, "repeatDirection": "h", "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}}}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"type": "timeseries", "id": 11, "targets": [{"expr": "topk(10, max by (bucket) (SeaweedFS_s3_bucket_size_bytes{namespace=\"seaweedfs\",bucket!=\"\"}))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "{{bucket}}", "refId": "A"}], "title": "Largest SeaweedFS S3 logical buckets over time (cluster-wide)", "description": "Logical S3 object bytes by bucket across the cluster. The Machine selector does not apply because this metric has no storage-node ownership; logical bytes omit replicas.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 12, "y": 36}, "repeatDirection": "h", "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": []}, "tooltip": {"mode": "multi", "sort": "desc"}}, "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"type": "table", "id": 12, "targets": [{"expr": "sort_desc(max by (bucket) (SeaweedFS_s3_bucket_physical_size_bytes{namespace=\"seaweedfs\",bucket!=\"\"}))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "legendFormat": "{{bucket}}", "range": false, "refId": "A"}], "title": "SeaweedFS S3 physical bucket size now (cluster-wide)", "description": "S3-reported physical bucket bytes across the cluster. The Machine selector does not apply because this metric has no storage-node ownership.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 0, "y": 45}, "repeatDirection": "h", "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}}}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"type": "timeseries", "id": 13, "targets": [{"expr": "topk(10, max by (bucket) (SeaweedFS_s3_bucket_physical_size_bytes{namespace=\"seaweedfs\",bucket!=\"\"}))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "{{bucket}}", "refId": "A"}], "title": "Largest SeaweedFS S3 physical buckets over time (cluster-wide)", "description": "S3-reported physical bucket bytes across the cluster. The Machine selector does not apply because this metric has no storage-node ownership; these overlap with collection-level replica bytes.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 12, "y": 45}, "repeatDirection": "h", "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": []}, "tooltip": {"mode": "multi", "sort": "desc"}}, "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"type": "row", "collapsed": false, "id": 42, "panels": [], "title": "ClickHouse MergeTree detail", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 54}}, {"type": "table", "id": 16, "targets": [{"expr": "sort_desc((max by (node, namespace, pod) (ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTables{namespace=\"clickhouse\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace=\"clickhouse\",node=~\"$node\"})) + max by (node, namespace, pod) (ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTablesSystem{namespace=\"clickhouse\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace=\"clickhouse\",node=~\"$node\"}))))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "format": "table", "instant": true, "legendFormat": "{{node}} {{pod}}", "range": false, "refId": "A"}], "title": "ClickHouse MergeTree bytes by machine now", "description": "MergeTree bytes reported by ClickHouse pods on the selected machine, including the existing system-table metric. This per-pod collector detail is separate from host filesystem and Piraeus pool use.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 0, "y": 55}, "repeatDirection": "h", "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}}}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"type": "timeseries", "id": 17, "targets": [{"expr": "(max by (node, namespace, pod) (ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTables{namespace=\"clickhouse\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace=\"clickhouse\",node=~\"$node\"})) + max by (node, namespace, pod) (ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTablesSystem{namespace=\"clickhouse\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace=\"clickhouse\",node=~\"$node\"})))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "{{node}} {{pod}}", "refId": "A"}], "title": "ClickHouse MergeTree bytes by machine over time", "description": "MergeTree bytes reported by ClickHouse pods on the selected machine, including the existing system-table metric. This per-pod collector detail is separate from host filesystem and Piraeus pool use.", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 9, "w": 12, "x": 12, "y": 55}, "repeatDirection": "h", "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": []}, "tooltip": {"mode": "multi", "sort": "desc"}}, "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}]}'
