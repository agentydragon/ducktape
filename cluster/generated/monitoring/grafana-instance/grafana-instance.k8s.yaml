apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cluster-storage-io
  namespace: monitoring
spec:
  datasources:
    - datasourceName: fc9a18f9-6955-4e40-95c1-66e32e7e8431
      inputName: DS_LOKI
