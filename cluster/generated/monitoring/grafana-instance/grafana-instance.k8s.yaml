\": {\"unit\": \"short\", \"decimals\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"value\": null, \"color\": \"red\"}, {\"value\": 1, \"color\": \"green\"}]}}, \"overrides\": []}}, {\"type\": \"row\", \"collapsed\": false, \"id\": 6, \"panels\": [], \"title\": \"Executor activity\", \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 6}}, {\"type\": \"timeseries\", \"id\": 7, \"targets\": [{\"expr\": \"sum by (stage) (buildbuddy_remote_execution_tasks_executing{namespace=\\\"buildbuddy-executor\\\",service=\\\"buildbuddy-kvm-worker-metrics\\\",endpoint=\\\"metrics\\\"})\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{stage}}\", \"refId\": \"A\"}], \"title\": \"Tasks by stage\", \"description\": \"Current executor-side tasks by stage, summed across the KVM pool. A task occupies one stage at a time. Scrape intervals may miss short tasks.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 9, \"w\": 12, \"x\": 0, \"y\": 7}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": []}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"min\": 0, \"color\": {\"mode\": \"palette-classic\"}, \"custom\": {\"lineWidth\": 2, \"fillOpacity\": 10, \"showPoints\": \"never\", \"spanNulls\": false}}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 8, \"targets\": [{\"expr\": \"sum by (pod) (buildbuddy_remote_execution_tasks_executing{namespace=\\\"buildbuddy-executor\\\",service=\\\"buildbuddy-kvm-worker-metrics\\\",endpoint=\\\"metrics\\\"})\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{pod}}\", \"refId\": \"A\"}], \"title\": \"Tasks per worker\", \"description\": \"Tasks in all execution stages per worker. This shows executor occupancy, not queued cent