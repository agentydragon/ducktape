      dashboards: grafana
  json: "{\"schemaVersion\": 41, \"templating\": {\"list\": [{\"type\": \"custom\", \"name\": \"traffic_scale\", \"label\": \"Traffic scale\", \"hide\": 0, \"skipUrlSync\": false, \"query\": \"Linear,Log\", \"current\": {\"text\": \"Linear\", \"value\": \"Linear\"}, \"multi\": false, \"allowCustomValue\": true, \"options\": [{\"text\": \"Linear\", \"value\": \"Linear\", \"selected\": true}, {\"text\": \"Log\", \"value\": \"Log\", \"selected\": false}], \"includeAll\": false, \"auto\": false, \"auto_min\": \"10s\", \"auto_count\": 30}]}, \"annotations\": {}, \"uid\": \"home-network-overview\", \"title\": \"Home network overview\", \"description\": \"Home connectivity at a glance: AT&T gateway, home nodes, and how metrics are buffered through outages.\", \"tags\": [\"home-network\"], \"timezone\": \"browser\", \"editable\": false, \"graphTooltip\": 1, \"time\": {\"from\": \"now-24h\", \"to\": \"now\"}, \"fiscalYearStartMonth\": 0, \"refresh\": \"1m\", \"panels\": [{\"type\": \"row\", \"collapsed\": false, \"id\": 1, \"panels\": [], \"title\": \"Right now\", \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 0}}, {\"type\": \"stat\", \"id\": 2, \"targets\": [{\"expr\": \"min(kube_node_status_condition{condition=\\\"Ready\\\",status=\\\"true\\\",node=~\\\"wyrm2|optiplex\\\"})\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"\", \"refId\": \"A\"}], \"title\": \"Home seen from OVH\", \"description\": \"Both home nodes report Ready to the API server in OVH. Computed by kube-state-metrics in OVH, so this goes Down live during a home outage, unlike the series scraped at home.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 4, \"w\": 4, \"x\": 0, \"y\": 1}, \"repeatDirection\": \"h\", \"options\": {\"graphMode\": \"none\", \"colorMode\": \"background\", \"justifyMode\": \"auto\", \"textMode\": \"auto\", \"wideLayout\": true, \"showPercentChange\": false, \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"values\": false, \"fields\": \"\"}, \"percentChangeColorMode\": \"standard\", \"orientation\": \"auto\"}, \"fieldConfig\": {\"defaults\": {\"mappings\": [{\"type\": \"value\", \"options\": {\"0\": {\"text\": \"Down\", \"color\": \"red\"}, \"1\": {\"text\": \"Up\", \"color\": \"green\"}}}], \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"value\": null, \"color\": \"red\"}, {\"value\": 1, \"color\": \"green\"}]}}, \"overrides\": []}}, {\"type\": \"stat\", \"id\": 3, \"targets\": [{\"expr\": \"att_gateway_wan_up\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"\", \"refId\": \"A\"}], \"title\": \"WAN\", \"description\": \"The gateway's WAN link (broadband status page).\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 4, \"w\": 4, \"x\": 4, \"y\": 1}, \"repeatDirection\": \"h\", \"options\": {\"graphMode\": \"none\", \"colorMode\": \"background\", \"justifyMode\": \"auto\", \"textMode\": \"auto\", \"wideLayout\": true, \"showPercentChange\": false, \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"values\": false, \"fields\": \"\"}, \"percentChangeColorMode\": \"standard\", \"orientation\": \"auto\"}, \"fieldConfig\": {\"defaults\": {\"mappings\": [{\"type\": \"value\", \"options\": {\"0\": {\"text\": \"Down\", \"color\": \"red\"}, \"1\": {\"text\": \"Up\", \"color\": \"green\"}}}], \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"value\": null, \"color\": \"red\"}, {\"value\": 1, \"color\": \"green\"}]}}, \"overrides\": []}}, {\"type\": \"stat\", \"id\": 4, \"targets\": [{\"expr\": \"att_gateway_optical_up\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"\", \"refId\": \"A\"}], \"title\": \"Fiber\", \"description\": \"The gateway's optical link (fiber status page).\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 4, \"w\": 4, \"x\": 8, \"y\": 1}, \"repeatDirection\": \"h\", \"options\": {\"graphMode\": \"none\", \"colorMode\": \"background\", \"justifyMode\": \"auto\", \"textMode\": \"auto\", \"wideLayout\": true, \"showPercentChange\": false, \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"values\": false, \"fields\": \"\"}, \"percentChangeColorMode\": \"standard\", \"orientation\": \"auto\"}, \"fieldConfig\": {\"defaults\": {\"mappings\": [{\"type\": \"value\", \"options\": {\"0\": {\"text\": \"Down\", \"color\": \"red\"}, \"1\": {\"text\": \"Up\", \"color\": \"green\"}}}], \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"value\": null, \"color\": \"red\"}, {\"value\": 1, \"color\": \"green\"}]}}, \"overrides\": []}}, {\"type\": \"stat\", \"id\": 5, \"targets\": [{\"expr\": \"att_gateway_uptime_seconds\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"\", \"refId\": \"A\"}], \"title\": \"Gateway uptime\", \"description\": \"Time since the gateway last booted.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 4, \"w\": 4, \"x\": 12, \"y\": 1}, \"repeatDirection\": \"h\", \"options\": {\"graphMode\": \"none\", \"colorMode\": \"background\", \"justifyMode\": \"auto\", \"textMode\": \"auto\", \"wideLayout\": true, \"showPercentChange\": false, \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"values\": false, \"fields\": \"\"}, \"percentChangeColorMode\": \"standard\", \"orientation\": \"auto\"}, \"fieldConfig\": {\"defaults\": {\"unit\": \"s\", \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"value\": null, \"color\": \"orange\"}, {\"value\": 3600, \"color\": \"green\"}]}}, \"overrides\": []}}, {\"type\": \"stat\", \"id\": 6, \"targets\": [{\"expr\": \"resets((max(att_gateway_uptime_seconds))[7d:1m])\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"instant\": true, \"legendFormat\": \"\", \"range\": false, \"refId\": \"A\"}], \"title\": \"Gateway reboots (7d)\", \"description\": \"Observed decreases in the gateway's uptime in the last 7 days, sampled each minute. Gaps can hide reboots.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 4, \"w\": 4, \"x\": 16, \"y\": 1}, \"repeatDirection\": \"h\", \"options\": {\"graphMode\": \"none\", \"colorMode\": \"background\", \"justifyMode\": \"auto\", \"textMode\": \"auto\", \"wideLayout\": true, \"showPercentChange\": false, \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"values\": false, \"fields\": \"\"}, \"percentChangeColorMode\": \"standard\", \"orientation\": \"auto\"}, \"fieldConfig\": {\"defaults\": {\"decimals\": 0, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"value\": null, \"color\": \"green\"}, {\"value\": 1, \"color\": \"orange\"}]}}, \"overrides\": []}}, {\"type\": \"stat\", \"id\": 7, \"targets\": [{\"expr\": \"max(max by (node) (clamp_min(max by (pod) (prometheus_remote_storage_highest_timestamp_in_seconds{job=\\\"alloy-node\\\"}) - max by (pod) (prometheus_remote_storage_queue_highest_sent_timestamp_seconds{job=\\\"alloy-node\\\"}), 0) * on (pod) group_left (node) max by (pod, node) (kube_pod_info{namespace=\\\"monitoring\\\",created_by_name=\\\"alloy-node\\\",node=~\\\"wyrm2|optiplex\\\"})))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"\", \"refId\": \"A\"}], \"title\": \"Home metrics backlog\", \"description\": \"Largest delay between the newest sample a home Alloy has collected and the newest it has delivered to Mimir. Grows while home is cut off, drains after it reconnects.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 4, \"w\": 4, \"x\": 20, \"y\": 1}, \"repeatDirection\": \"h\", \"options\": {\"graphMode\": \"none\", \"colorMode\": \"background\", \"justifyMode\": \"auto\", \"textMode\": \"auto\", \"wideLayout\": true, \"showPercentChange\": false, \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"values\": false, \"fields\": \"\"}, \"percentChangeColorMode\": \"standard\", \"orientation\": \"auto\"}, \"fieldConfig\": {\"defaults\": {\"unit\": \"s\", \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"value\": null, \"color\": \"green\"}, {\"value\": 300, \"color\": \"orange\"}]}}, \"overrides\": []}}, {\"type\": \"row\", \"collapsed\": false, \"id\": 8, \"panels\": [], \"title\": \"Connectivity\", \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 5}}, {\"type\": \"state-timeline\", \"id\": 9, \"targets\": [{\"expr\": \"min(att_gateway_wan_up)\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"Gateway WAN\", \"refId\": \"A\"}, {\"expr\": \"min(att_gateway_optical_up)\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"Gateway fiber\", \"refId\": \"B\"}, {\"expr\": \"min(att_gateway_scrape_success)\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"Gateway status pages readable\", \"refId\": \"C\"}, {\"expr\": \"max by (node) (kube_node_status_condition{condition=\\\"Ready\\\",status=\\\"true\\\",node=~\\\"wyrm2|optiplex\\\"})\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{node}} Ready (seen from OVH)\", \"refId\": \"D\"}, {\"expr\": \"up{job=\\\"kubelet\\\",metrics_path=\\\"/metrics\\\",node=~\\\"wyrm2|optiplex\\\"}\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{node}} kubelet scraped\", \"refId\": \"E\"}], \"title\": \"Home connectivity timeline\", \"description\": \"Each row is one link or node over time. Gateway link queries combine exporter pod identities so replacements do not add rows; overlapping reports show Down if either reports Down. A blank stretch means Mimir has no samples for it: home was unreachable and the data was not (or not yet) replayed from a home buffer. The OVH-side Ready rows go Down during an outage; the rows scraped at home show what home itself saw once their buffer is replayed.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 24, \"x\": 0, \"y\": 6}, \"repeatDirection\": \"h\", \"options\": {\"showValue\": \"never\", \"rowHeight\": 0.8, \"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\", \"showLegend\": false, \"calcs\": []}, \"tooltip\": {\"mode\": \"single\", \"sort\": \"none\"}, \"mergeValues\": true, \"alignValue\": \"left\"}, \"fieldConfig\": {\"defaults\": {\"mappings\": [{\"type\": \"value\", \"options\": {\"0\": {\"text\": \"Down\", \"color\": \"red\"}, \"1\": {\"text\": \"Up\", \"color\": \"green\"}}}], \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"value\": null, \"color\": \"red\"}, {\"value\": 1, \"color\": \"green\"}]}, \"custom\": {\"lineWidth\": 0, \"fillOpacity\": 80}}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 10, \"targets\": [{\"expr\": \"rate(att_gateway_wan_receive_bytes_total[5m]) * 8\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"download (${traffic_scale})\", \"refId\": \"A\"}, {\"expr\": \"rate(att_gateway_wan_transmit_bytes_total[5m]) * 8\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"upload (${traffic_scale})\", \"refId\": \"B\"}], \"title\": \"Internet throughput (gateway WAN)\", \"description\": \"Traffic through the gateway's WAN port. Traffic scale selects linear or base-10 symlog; the log view remains linear below 1 bit/s so zero stays visible.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 14}, \"repeatDirection\": \"h\", \"fieldConfig\": {\"defaults\": {\"unit\": \"bps\", \"min\": 0, \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 10, \"showPoints\": \"never\", \"spanNulls\": false}}, \"overrides\": [{\"matcher\": {\"id\": \"byRegexp\", \"options\": \"/ [(]Log[)]$/\"}, \"properties\": [{\"id\": \"custom.scaleDistribution\", \"value\": {\"type\": \"symlog\", \"log\": 10, \"linearThreshold\": 1}}]}]}}, {\"type\": \"timeseries\", \"id\": 11, \"targets\": [{\"expr\": \"rate(node_network_receive_bytes_total{job=\\\"node-exporter\\\",device=~\\\"nebula.*\\\"}[5m]) * 8 * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info{job=\\\"node-exporter\\\",nodename=~\\\"wyrm2|optiplex\\\"})\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{nodename}} in (${traffic_scale})\", \"refId\": \"A\"}, {\"expr\": \"rate(node_network_transmit_bytes_total{job=\\\"node-exporter\\\",device=~\\\"nebula.*\\\"}[5m]) * 8 * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info{job=\\\"node-exporter\\\",nodename=~\\\"wyrm2|optiplex\\\"})\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{nodename}} out (${traffic_scale})\", \"refId\": \"B\"}], \"title\": \"Home to OVH tunnel (Nebula)\", \"description\": \"Traffic on each home node's Nebula interface, which carries all of its cluster traffic to OVH, including metrics remote-write. Traffic scale selects linear or base-10 symlog; the log view remains linear below 1 bit/s so zero stays visible.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 14}, \"repeatDirection\": \"h\", \"fieldConfig\": {\"defaults\": {\"unit\": \"bps\", \"min\": 0, \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 10, \"showPoints\": \"never\", \"spanNulls\": false}}, \"overrides\": [{\"matcher\": {\"id\": \"byRegexp\", \"options\": \"/ [(]Log[)]$/\"}, \"properties\": [{\"id\": \"custom.scaleDistribution\", \"va