_progs_virtual_memory_max_bytes{job=\"cilium-agent\", pod=~\"$pod\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "{{pod}}", "refId": "A"}], "title": "BPF map and program virtual memory per pod", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}, "repeatDirection": "h", "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": []}, "tooltip": {"mode": "multi", "sort": "desc"}}, "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never"}}, "overrides": []}}, {"type": "timeseries", "id": 5, "targets": [{"expr": "max by (pod) (cilium_bpf_map_pressure{job=\"cilium-agent\", pod=~\"$pod\"})", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "{{pod}}", "refId": "A"}], "title": "Maximum BPF map pressure per pod", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}, "repeatDirection": "h", "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": []}, "tooltip": {"mode": "multi", "sort": "desc"}}, "fieldConfig": {"defaults": {"unit": "percentunit", "custom": {"drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never"}}, "overrides": []}}, {"type": "timeseries", "id": 6, "targets": [{"expr": "topk(5, avg(rate(cilium_bpf_map_ops_total{job=\"cilium-agent\", pod=~\"$pod\"}[5m])) by (pod, map_name, operation))", "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "legendFormat": "{{pod}} / {{map_name}} / {{operation}}", "refId": "A"}], "title": "Top BPF map operation rates", "transparent": false, "datasource": {"type": "prometheus", "uid": "${DS_MIMIR}"}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}, "repeatDirection": "h", "options": {"legend": {"displayMode": "list", "placement": "bott