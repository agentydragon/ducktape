 0, \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 10, \"showPoints\": \"never\", \"spanNulls\": false}}, \"overrides\": []}}, {\"type\": \"row\", \"collapsed\": false, \"id\": 39, \"panels\": [], \"title\": \"Outage buffering (home Alloy)\", \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 133}}, {\"type\": \"timeseries\", \"id\": 40, \"targets\": [{\"expr\": \"max by (node) (clamp_min(max by (pod) (prometheus_remote_storage_highest_timestamp_in_seconds{job=\\\"alloy-node\\\"}) - max by (pod) (prometheus_remote_storage_queue_highest_sent_timestamp_seconds{job=\\\"alloy-node\\\"}), 0) * on (pod) group_left (node) max by (pod, node) (kube_pod_info{namespace=\\\"monitoring\\\",created_by_name=\\\"alloy-node\\\",node=~\\\"wyrm2|optiplex\\\"}))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{node}}\", \"refId\": \"A\"}], \"title\": \"Remote-write delay per home node\", \"description\": \"How far each home Alloy's delivered data trails what it has collected. It is reported by the Alloy itself, so an outage shows up here only once its backlog is replayed.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 8, \"w\": 8, \"x\": 0, \"y\": 134}, \"repeatDirection\": \"h\", \"fieldConfig\": {\"defaults\": {\"unit\": \"s\", \"min\": 0, \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 10, \"showPoints\": \"never\", \"spanNulls\": false}}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 41, \"targets\": [{\"expr\": \"max by (node) (max by (pod) (prometheus_remote_storage_samples_pending{job=\\\"alloy-node\\\"}) * on (pod) group_left (node) max by (pod, node) (kube_pod_info{namespace=\\\"monitoring\\\",created_by_name=\\\"alloy-node\\\",node=~\\\"wyrm2|optiplex\\\"}))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{node}}\", \"refId\": \"A\"}], \"title\": \"Sample