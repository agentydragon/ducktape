apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db-ovh
  namespace: monitoring
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
      secret:
        name: grafana-db-app
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  monitoring:
    enablePodMonitor: true
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: grafana-db-ovh
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    resizeInUseVolumes: false
    size: 4Gi
    storageClass: piraeus-ssd-local
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for monitoring/grafana-db-ovh.
  name: monitoring-db-backups
  namespace: monitoring
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: monitoring-db-backups
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: monitoring-db-backups
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for monitoring/grafana-db-ovh.
  name: monitoring-db-backups
  namespace: monitoring
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: monitoring-db-backups
  namespace: monitoring
spec:
  identityRef:
    name: monitoring-db-backups
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: monitoring-db-backups-s3-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  annotations:
    description: SeaweedFS S3 destination for monitoring/grafana-db-ovh base backups and WAL.
  name: grafana-db-ovh
  namespace: monitoring
spec:
  configuration:
    data:
      compression: gzip
    destinationPath: s3://monitoring-db-backups/
    endpointURL: http://seaweedfs-s3.seaweedfs.svc:8333
    s3Credentials:
      accessKeyId:
        key: AWS_ACCESS_KEY_ID
        name: monitoring-db-backups-s3-credentials
      secretAccessKey:
        key: AWS_SECRET_ACCESS_KEY
        name: monitoring-db-backups-s3-credentials
    wal:
      compression: gzip
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: grafana-db-ovh
  namespace: monitoring
spec:
  backupOwnerReference: self
  cluster:
    name: grafana-db-ovh
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 53 2 * * *
---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  labels:
    dashboards: grafana
  name: grafana
  namespace: monitoring
spec:
  client:
    useKubeAuth: true
  config:
    auth.generic_oauth:
      allow_sign_up: "true"
      api_url: http://authentik-server.authentik/application/o/userinfo/
      auth_url: https://auth.allegedly.works/application/o/authorize/
      client_id: ${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
      client_secret: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      enabled: "true"
      name: Authentik
      role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || 'Viewer'
      scopes: openid email profile
      token_url: http://authentik-server.authentik/application/o/token/
    auth.jwt:
      auto_sign_up: "true"
      email_claim: sub
      enabled: "true"
      expect_claims: '{"aud": "operator.grafana.com"}'
      header_name: Authorization
      jwk_set_bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      jwk_set_url: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}/openid/v1/jwks
      role_attribute_path: contains(sub, 'system:serviceaccount:monitoring:grafana-operator') && 'GrafanaAdmin' || 'None'
      username_claim: sub
    database:
      host: grafana-db-ovh-rw.monitoring.svc:5432
      name: grafana
      password: ${GF_DATABASE_PASSWORD}
      ssl_mode: require
      type: postgres
      user: grafana
    plugins:
      preinstall: grafana-clock-panel,grafana-clickhouse-datasource@4.20.0
    security:
      admin_password: ${GF_SECURITY_ADMIN_PASSWORD}
      admin_user: ${GF_SECURITY_ADMIN_USER}
    server:
      root_url: https://grafana.allegedly.works
  deployment:
    spec:
      template:
        spec:
          containers:
            - env:
                - name: SSL_CERT_DIR
                  value: /etc/ssl/certs:/var/run/secrets/kubernetes.io/serviceaccount
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      key: admin-user
                      name: grafana-admin-password
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: admin-password
                      name: grafana-admin-password
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: grafana-db-app
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                      name: grafana-oidc-config
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                      name: grafana-oidc-config
              name: grafana
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  hostnames:
    - grafana.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
---
