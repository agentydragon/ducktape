  namespace: monitoring
spec:
  datasource:
    access: proxy
    editable: true
    isDefault: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: fc9a18f9-6955-4e40-95c1-66e32e7e8431
        filterBySpanID: false
        filterByTraceID: true
        spanEndTimeShift: 1h
        spanStartTimeShift: -1h
    name: Tempo
    type: tempo
    uid: f99d1a97-7e72-4887-9277-0b105a5ccf44
    url: http://tempo.monitoring.svc.cluster.local:3200
  instanceSelector:
    matchLabels:
      dashboards: grafana
---
