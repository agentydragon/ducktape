metrics\\\",endpoint=\\\"metrics\\\"})\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{pod}}\", \"refId\": \"A\"}], \"title\": \"Local executor queue\", \"description\": \"Actions waiting in each executor's local queue, summed over group labels. This is not the BuildBuddy scheduler's pool backlog or a count of distinct pending actions.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 9, \"w\": 12, \"x\": 12, \"y\": 16}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": []}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"desc\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"min\": 0, \"color\": {\"mode\": \"palette-classic\"}, \"custom\": {\"lineWidth\": 2, \"fillOpacity\": 10, \"showPoints\": \"never\", \"spanNulls\": false}}, \"overrides\": []}}, {\"type\": \"row\", \"collapsed\": false, \"id\": 11, \"panels\": [], \"title\": \"Guest resources\", \"gridPos\": {\"h\": 1, \"w\": 24, \"x\": 0, \"y\": 25}}, {\"type\": \"timeseries\", \"id\": 12, \"targets\": [{\"expr\": \"100 * (1 - avg by (pod) (rate(node_cpu_seconds_total{namespace=\\\"buildbuddy-executor\\\",service=\\\"buildbuddy-kvm-worker-metrics\\\",endpoint=\\\"node-metrics\\\",mode=\\\"idle\\\"}[5m])))\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{pod}}\", \"refId\": \"A\"}], \"title\": \"Guest CPU busy\", \"description\": \"100% minus idle time across the guest vCPUs, averaged over five minutes. Busy includes I/O wait and steal time.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 9, \"w\": 8, \"x\": 0, \"y\": 26}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"list\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": []}, \"tooltip\": {\"m