apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafana-instance.k8s.yaml
configMapGenerator:
  - name: flux-cluster-dashboard
    namespace: monitoring
    files:
      - flux-cluster.json
  - name: interface-flap-frequency-dashboard
    namespace: monitoring
    files:
      - interface-flap-frequency.json
  - name: rugged-power-dashboard
    namespace: monitoring
    files:
      - rugged-power.json
  - name: node-memory-dashboard
    namespace: monitoring
    files:
      - node-memory.json
  - name: cluster-storage-io-dashboard
    namespace: monitoring
    files:
      - cluster-storage-io.json
  - name: s3-operations-dashboard
    namespace: monitoring
    files:
      - s3-operations.json
  - name: cluster-disk-usage-dashboard
    namespace: monitoring
    files:
      - cluster-disk-usage.json
  - name: piraeus-storage-dashboard
    namespace: monitoring
    files:
      - piraeus-storage.json
  - name: storage-service-details-dashboard
    namespace: monitoring
    files:
      - storage-service-details.json
  - name: io-pressure-dashboard
    namespace: monitoring
    files:
      - io-pressure.json
  - name: home-network-overview-dashboard
    namespace: monitoring
    files:
      - home-network-overview.json
configurations:
  - kustomizeconfig
