apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-switch-tls
  namespace: monitoring
spec:
  commonName: CRS310
  ipAddresses:
    - 192.168.1.100
  issuerRef:
    kind: ClusterIssuer
    name: cluster-internal-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: home-switch-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-switch-bootstrap-tls
  namespace: monitoring
spec:
  commonName: CRS310
  ipAddresses:
    - 192.168.1.100
  issuerRef:
    kind: ClusterIssuer
    name: cluster-internal-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: home-switch-bootstrap-tls
