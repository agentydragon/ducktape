apiVersion: v1
kind: ServiceAccount
metadata:
  name: mktxp-credentials-reader
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mktxp-credentials-reader
  namespace: monitoring
rules:
  - apiGroups:
      - ""
    resourceNames:
      - home-switch-monitoring
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mktxp-credentials-reader
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mktxp-credentials-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: mktxp-credentials-reader
    namespace: monitoring
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-mktxp-credentials-secret-store
spec:
  conditions:
    - namespaces:
        - monitoring
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: mktxp-credentials-reader
      remoteNamespace: monitoring
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mktxp-credentials
  namespace: monitoring
spec:
  data:
    - remoteRef:
        key: home-switch-monitoring
        property: password
      secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-mktxp-credentials-secret-store
  target:
    creationPolicy: Owner
    name: mktxp-credentials
    template:
      data:
        credentials.yaml: |
          username: monitoring
          password: {{ .password }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Prometheus metrics read from the home MikroTik switch's RouterOS API.
  labels:
    app.kubernetes.io/name: mktxp
  name: mktxp
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mktxp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mktxp
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - mktxp
            - --cfg-dir
            - /etc/mktxp
            - export
          image: ghcr.io/akpw/mktxp:2.1.0@sha256:512ebe6c83c374147ac326c57ff9225b09df777883e772d417e5275bc6820e98
          imagePullPolicy: IfNotPresent
          livenessProbe:
            periodSeconds: 30
            tcpSocket:
              port: http
          name: exporter
          ports:
            - containerPort: 49090
              name: http
              protocol: TCP
          readinessProbe:
            periodSeconds: 30
            tcpSocket:
              port: http
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /etc/mktxp
              name: config
              readOnly: true
            - mountPath: /etc/mktxp-credentials
              name: credentials
              readOnly: true
            - mountPath: /etc/cluster-ca
              name: cluster-ca
              readOnly: true
      nodeSelector:
        kubernetes.io/hostname: optiplex
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      volumes:
        - configMap:
            name: mktxp-config
          name: config
        - name: credentials
          secret:
            secretName: mktxp-credentials
        - configMap:
            name: cluster-internal-ca-bundle
          name: cluster-ca
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: mktxp
  name: mktxp
  namespace: monitoring
spec:
  ports:
    - name: http
      port: 49090
      protocol: TCP
      targetPort: 49090
  selector:
    app.kubernetes.io/name: mktxp
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mktxp
  namespace: monitoring
spec:
  endpoints:
    - interval: 60s
      path: /metrics
      port: http
      scheme: http
      scrapeTimeout: 30s
  selector:
    matchLabels:
      app.kubernetes.io/name: mktxp
