apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    // --- Metrics scraping (replaces Prometheus) ---

    // Discover ServiceMonitor targets cluster-wide; scrape those not backed by a pod.
    // PodMonitors are scraped entirely by the per-node Alloys (node.alloy).
    prometheus.operator.servicemonitors "cluster" {
      kubernetes_role = "endpointslice"

      // kube-prometheus-stack ServiceMonitors use Secret-backed authorization or no
      // authentication. Alloy rejects any ServiceMonitor referencing a local file --
      // `bearerTokenFile` or `tlsConfig.{ca,cert,key}File` -- and local file access is
      // intentionally disabled here.
      //
      // A rejected ServiceMonitor produces no scrape config at all, so there is no
      // `up` series to fall to 0 and TargetDown cannot fire: the only trace is one
      // error line in Alloy's own log. That is how the entire control-plane and
      // cAdvisor surface (`container_cpu_usage_seconds_total`, `kubelet_*`,
      // `apiserver_request_*`, `coredns_*`) went missing while every rule built on
      // it kept evaluating against no data.
      //
      // ServiceMonitors arrive only through Flux. Authenticated targets must use
      // Secret-backed credentials; unauthenticated targets must clear auth fields.

      // A target backed by a pod is scraped by the Alloy on that pod's node (node.alloy); this
      // one keeps the rest, such as Services with hand-set endpoints.
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = ".+"
        action        = "drop"
      }

      scrape {
        default_scrape_interval = "60s"
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    // Push scraped metrics to Mimir.
    prometheus.remote_write "mimir" {
      endpoint {
        url = sys.env("MIMIR_PUSH_URL")
      }
    }

    // --- Control-plane scraping ---

    // kube-prometheus-stack's API-server and kubelet ServiceMonitors are disabled in
    // ../stack/helmrelease.yaml because Alloy scrapes those surfaces natively: the
    // apiserver below, kubelet and cAdvisor from each node's own Alloy (node.alloy).
    // The chart-managed controller-manager and scheduler monitors use the
    // Alloy-owned Secret, while CoreDNS is chart-managed without authentication.
    //
    // `job` and `metrics_path` are load-bearing, not cosmetic: the deployed
    // kubernetes-mixin rules select on job="kubelet" (35 rules), job="apiserver"
    // (90), metrics_path="/metrics" (27) and metrics_path="/metrics/cadvisor" (8).
    // Prometheus attaches `job` and `instance` on its own but NOT `metrics_path` --
    // prometheus-operator adds it when it renders a ServiceMonitor -- so every
    // scrape below sets it explicitly. Omit it and the rules go back to evaluating
    // against no data, with nothing logged.

    // The apiserver is reached through the `kubernetes` Service in `default`, whose
    // certificate the cluster CA does sign -- so this one verifies properly rather
    // than skipping.
    discovery.kubernetes "apiserver" {
      role = "endpoints"

      namespaces {
        names = ["default"]
      }
    }

    discovery.relabel "apiserver" {
      targets = discovery.kubernetes.apiserver.targets

      rule {
        source_labels = [
          "__meta_kubernetes_service_label_component",
          "__meta_kubernetes_service_label_provider",
          "__meta_kubernetes_endpoint_port_name",
        ]
        regex  = "apiserver;kubernetes;https"
        action = "keep"
      }
      rule {
        target_label = "metrics_path"
        replacement  = "/metrics"
      }
    }

    // Copied from the chart ServiceMonitor's metricRelabelings.
    // apiserver_request_duration_seconds_bucket is high-cardinality enough that
    // keeping every bucket is a real cost against `ingestion_rate_mb`.
    prometheus.relabel "apiserver" {
      forward_to = [prometheus.remote_write.mimir.receiver]

      rule {
        source_labels = ["__name__", "le"]
        regex         = "(etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\\.15|0\\.2|0\\.3|0\\.35|0\\.4|0\\.45|0\\.6|0\\.7|0\\.8|0\\.9|1\\.25|1\\.5|1\\.75|2|3|3\\.5|4|4\\.5|6|7|8|9|15|20|40|45|50)(\\.0)?"
        action        = "drop"
      }
    }

    prometheus.scrape "apiserver" {
      targets           = discovery.relabel.apiserver.output
      job_name          = "apiserver"
      scheme            = "https"
      metrics_path      = "/metrics"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        ca_file     = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        server_name = "kubernetes"
      }
      forward_to = [prometheus.relabel.apiserver.receiver]
    }

    // --- Rule sync (replaces Prometheus rule evaluation) ---

    // Sync PrometheusRule CRDs to Mimir Ruler for evaluation.
    mimir.rules.kubernetes "rules" {
      address = sys.env("MIMIR_GATEWAY_URL")
    }

    // --- OTLP ingestion (Agentplane and browser relay traces, logs, metrics) ---

    otelcol.receiver.otlp "agentplane" {
      grpc {
        endpoint = sys.env("OTLP_GRPC_LISTEN_ADDRESS")

        keepalive {
          enforcement_policy {
            min_time              = "30s"
            permit_without_stream = false
          }
        }
      }
      http {
        endpoint = sys.env("OTLP_HTTP_LISTEN_ADDRESS")
      }
      output {
        metrics = [otelcol.processor.batch.default.input]
        logs    = [otelcol.processor.batch.default.input]
        traces  = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      output {
        metrics = [otelcol.exporter.prometheus.default.input]
        logs    = [otelcol.exporter.loki.default.input]
        traces  = [otelcol.exporter.otlp.tempo.input]
      }
    }

    // Convert OTLP metrics to Prometheus format and push to Mimir.
    otelcol.exporter.prometheus "default" {
      forward_to          = [prometheus.remote_write.mimir.receiver]
      add_metric_suffixes = false
    }

    // Forward OTel logs to Loki.
    otelcol.exporter.loki "default" {
      forward_to = [loki.write.monitoring.receiver]
    }

    loki.write "monitoring" {
      endpoint {
        url = sys.env("LOKI_PUSH_URL")
      }
    }

    // Forward traces to Tempo via OTLP/gRPC.
    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = sys.env("TEMPO_OTLP_GRPC_ENDPOINT")
        tls {
          insecure = true
        }
      }
    }

    // --- Kubernetes events ---

    // Events live ~1h in the apiserver; this is the only durable copy. It is also
    // the only channel for HelmRelease drift: helm-controller reports drift solely
    // as an info-severity `DriftDetected` Event, with no corresponding metric, so
    // `driftDetection: mode: warn` is unobservable without this.
    //
    // Must run on exactly one Alloy instance -- the watch is cluster-wide, so a
    // second replica (or a DaemonSet conversion) ingests every event twice. The
    // `controller.type: deployment` / `replicas: 1` in helmrelease.yaml is
    // load-bearing here.
    //
    // json over the logfmt default: event messages are free text with spaces and
    // quotes, and `| json | reason="DriftDetected"` is the query shape wanted.
    loki.source.kubernetes_events "cluster" {
      job_name   = "kubernetes-events"
      log_format = "json"
      forward_to = [loki.write.monitoring.receiver]
    }
immutable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-node-config
  namespace: monitoring
data:
  node.alloy: |
    // Per-node Alloy (DaemonSet): scrapes only targets on its own node, `NODE_NAME` (its kubelet and
    // every ServiceMonitor/PodMonitor target backed by a pod there), and buffers them in a WAL on that
    // node's disk. When the node loses its link to Mimir (a home WAN outage), it keeps scraping and
    // replays the backlog once the link returns, within `max_keepalive_time` and Mimir's
    // `out_of_order_time_window`. Cluster-wide work stays on the central Alloy (config.alloy).

    prometheus.remote_write "mimir" {
      endpoint {
        url = sys.env("MIMIR_PUSH_URL")
      }

      // The default 8h would drop the oldest unsent samples of a longer outage. Matches Mimir's
      // `out_of_order_time_window`, past which replayed samples would be rejected anyway.
      wal {
        max_keepalive_time = "720h"
      }
    }

    // --- ServiceMonitors and PodMonitors ---

    // Every monitor is discovered cluster-wide and narrowed to targets backed by a pod on this node.
    // The central Alloy drops those same targets, so each is scraped exactly once. Its comment on
    // `prometheus.operator.servicemonitors` covers which ServiceMonitors Alloy rejects.
    prometheus.operator.servicemonitors "node" {
      kubernetes_role = "endpointslice"

      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = sys.env("NODE_NAME")
        action        = "keep"
      }

      scrape {
        default_scrape_interval = "60s"
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    prometheus.operator.podmonitors "node" {
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = sys.env("NODE_NAME")
        action        = "keep"
      }

      scrape {
        default_scrape_interval = "60s"
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    // --- kubelet ---

    // `job` and `metrics_path` are load-bearing: the kubernetes-mixin rules select on job="kubelet"
    // and metrics_path="/metrics" or "/metrics/cadvisor" (see config.alloy's control-plane notes).

    discovery.kubernetes "node" {
      role = "node"

      selectors {
        role  = "node"
        field = string.format("metadata.name=%s", sys.env("NODE_NAME"))
      }
    }

    // One relabel per kubelet path: the `metrics_path` label has to be a literal, and it is what
    // separates cAdvisor series from kubelet's own on a shared job.
    discovery.relabel "kubelet_metrics" {
      targets = discovery.kubernetes.node.targets

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        target_label = "metrics_path"
        replacement  = "/metrics"
      }
    }

    discovery.relabel "kubelet_cadvisor" {
      targets = discovery.kubernetes.node.targets

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        target_label = "metrics_path"
        replacement  = "/metrics/cadvisor"
      }
    }

    discovery.relabel "kubelet_probes" {
      targets = discovery.kubernetes.node.targets

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        target_label = "metrics_path"
        replacement  = "/metrics/probes"
      }
    }

    // insecure_skip_verify mirrors the chart's own kubelet ServiceMonitor: the kubelet serving
    // certificate is node-local and not signed by the cluster CA.
    prometheus.scrape "kubelet_metrics" {
      targets           = discovery.relabel.kubelet_metrics.output
      job_name          = "kubelet"
      scheme            = "https"
      metrics_path      = "/metrics"
      honor_labels      = true
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    prometheus.scrape "kubelet_cadvisor" {
      targets           = discovery.relabel.kubelet_cadvisor.output
      job_name          = "kubelet"
      scheme            = "https"
      metrics_path      = "/metrics/cadvisor"
      honor_labels      = true
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    prometheus.scrape "kubelet_probes" {
      targets           = discovery.relabel.kubelet_probes.output
      job_name          = "kubelet"
      scheme            = "https"
      metrics_path      = "/metrics/probes"
      honor_labels      = true
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }
immutable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-syslog-config
  namespace: monitoring
data:
  syslog.alloy: |
    // Syslog receiver (Deployment on optiplex): the home switch sends RouterOS's BSD syslog, and the
    // AT&T gateway its firewall log, over UDP to optiplex's fixed LAN address, which a hostPort per
    // sender forwards here. Entries carry the time they arrive: RFC 3164 timestamps have no year or
    // zone, and both senders are one LAN hop away. The gateway's datagrams carry no `<PRI>` header,
    // so no syslog parser accepts them and its listener keeps each datagram whole.

    loki.source.syslog "lan" {
      listener {
        address       = sys.env("SYSLOG_LISTEN_ADDRESS")
        protocol      = "udp"
        syslog_format = "rfc3164"
        labels        = { job = "home-switch" }
      }
      listener {
        address       = sys.env("GATEWAY_SYSLOG_LISTEN_ADDRESS")
        protocol      = "udp"
        syslog_format = "raw"
        labels        = { job = "home-gateway" }
      }
      relabel_rules = loki.relabel.syslog.rules
      forward_to    = [loki.write.loki.receiver]
    }

    loki.relabel "syslog" {
      rule {
        source_labels = ["__syslog_message_hostname"]
        target_label  = "host"
      }
      rule {
        source_labels = ["__syslog_message_severity"]
        target_label  = "level"
      }
      forward_to = []
    }

    loki.write "loki" {
      endpoint {
        url = sys.env("LOKI_PUSH_URL")
        // Retry forever rather than drop after 10 tries: a home WAN outage cuts optiplex off from
        // Loki, and the in-memory queue holds hours of switch logs. A pod restart still loses it.
        max_backoff_retries = 0
      }
    }
immutable: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  chart:
    spec:
      chart: alloy
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 1.x
  interval: 30m
  values:
    alloy:
      configMap:
        create: false
        key: config.alloy
        name: alloy-config
      extraEnv:
        - name: MIMIR_PUSH_URL
          value: http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push
        - name: MIMIR_GATEWAY_URL
          value: http://mimir-gateway.monitoring.svc.cluster.local
        - name: LOKI_PUSH_URL
          value: http://loki-write.loki.svc.cluster.local:3100/loki/api/v1/push
        - name: TEMPO_OTLP_GRPC_ENDPOINT
          value: tempo.monitoring.svc.cluster.local:4317
        - name: OTLP_GRPC_LISTEN_ADDRESS
          value: 0.0.0.0:4317
        - name: OTLP_HTTP_LISTEN_ADDRESS
          value: 0.0.0.0:4318
      extraPorts:
        - name: otlp-grpc
          port: 4317
          protocol: TCP
          targetPort: 4317
        - name: otlp-http
          port: 4318
          protocol: TCP
          targetPort: 4318
    controller:
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      replicas: 1
      type: deployment
    serviceMonitor:
      enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-node
  namespace: monitoring
spec:
  chart:
    spec:
      chart: alloy
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 1.x
  interval: 30m
  values:
    alloy:
      configMap:
        create: false
        key: node.alloy
        name: alloy-node-config
      extraEnv:
        - name: MIMIR_PUSH_URL
          value: http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      mounts:
        extra:
          - mountPath: /var/lib/alloy-node
            name: wal
      resources:
        requests:
          cpu: 20m
          memory: 256Mi
      storagePath: /var/lib/alloy-node
    controller:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: NotIn
                    values:
                      - roaming
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      type: daemonset
      volumes:
        extra:
          - hostPath:
              path: /var/lib/alloy-node
              type: DirectoryOrCreate
            name: wal
    nameOverride: alloy-node
    serviceMonitor:
      enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-syslog
  namespace: monitoring
spec:
  chart:
    spec:
      chart: alloy
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 1.x
  interval: 30m
  values:
    alloy:
      configMap:
        create: false
        key: syslog.alloy
        name: alloy-syslog-config
      extraEnv:
        - name: LOKI_PUSH_URL
          value: http://loki-write.loki.svc.cluster.local:3100/loki/api/v1/push
        - name: SYSLOG_LISTEN_ADDRESS
          value: 0.0.0.0:5514
        - name: GATEWAY_SYSLOG_LISTEN_ADDRESS
          value: 0.0.0.0:5515
      extraPorts:
        - hostPort: 514
          name: syslog
          port: 514
          protocol: UDP
          targetPort: 5514
        - hostPort: 1514
          name: gateway-syslog
          port: 1514
          protocol: UDP
          targetPort: 5515
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
      stabilityLevel: experimental
    controller:
      nodeSelector:
        kubernetes.io/hostname: optiplex
      replicas: 1
      type: deployment
      updateStrategy:
        type: Recreate
    nameOverride: alloy-syslog
    serviceMonitor:
      enabled: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-otlp-ingress
  namespace: monitoring
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              app.kubernetes.io/component: server
              app.kubernetes.io/instance: authentik
      ports:
        - port: 4318
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentplane-staging
          podSelector:
            matchLabels:
              agentplane.io/otel-emitter: "true"
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-node
      ports:
        - port: 12345
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Ingress
