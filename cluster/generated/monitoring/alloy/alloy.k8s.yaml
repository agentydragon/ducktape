apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    description: "Deploying runs retained-log replay on wyrm2: pod duplicates and up to 12h journal replay. No automatic rollback; see cluster/cdk8s/monitoring/docs/wyrm2-alloy-canary.md."
  name: wyrm2-alloy-canary
  namespace: monitoring
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wyrm2-alloy-canary
    spec:
      automountServiceAccountToken: true
      containers:
        - command:
            - python
            - -B
            - /scripts/cutover.py
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          image: python:3.14-alpine
          name: cutover
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /state/node
              name: node
              readOnly: true
            - mountPath: /state/journal
              name: journal
              readOnly: true
            - mountPath: /state/pods
              name: pods
              readOnly: false
            - mountPath: /state/promtail
              name: promtail
              readOnly: true
            - mountPath: /evidence
              name: evidence
              readOnly: false
            - mountPath: /scripts
              name: script
              readOnly: true
      nodeName: wyrm2
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: wyrm2-alloy-canary
      volumes:
        - hostPath:
            path: /var/lib/alloy-node
            type: Directory
          name: node
        - hostPath:
            path: /var/lib/alloy-journal
            type: DirectoryOrCreate
          name: journal
        - hostPath:
            path: /var/lib/alloy-node/loki.source.file.pods
            type: DirectoryOrCreate
          name: pods
        - hostPath:
            path: /run/promtail
            type: Directory
          name: promtail
        - hostPath:
            path: /var/lib/promtail-alloy-wyrm2-canary
            type: DirectoryOrCreate
          name: evidence
        - configMap:
            name: wyrm2-alloy-canary-script
          name: script
