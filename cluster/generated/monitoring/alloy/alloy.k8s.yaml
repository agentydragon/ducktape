apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    // --- Metrics scraping (replaces Prometheus) ---

    // Discover ServiceMonitor targets cluster-wide; scrape those not backed by a pod.
    // PodMonitors are scraped entirely by the per-node Alloys (node.alloy).
    prometheus.operator.servicemonitors "cluster" {
      kubernetes_role = "endpointslice"

      // kube-prometheus-stack ServiceMonitors use Secret-backed authorization or no
      // authentication. Alloy rejects any ServiceMonitor referencing a local file --
      // `bearerTokenFile` or `tlsConfig.{ca,cert,key}File` -- and local file access is
      // intentionally disabled here.
      //
      // A rejected ServiceMonitor produces no scrape config at all, so there is no
      // `up` series to fall to 0 and TargetDown cannot fire: the only trace is one
      // error line in Alloy's own log. That is how the entire control-plane and
      // cAdvisor surface (`container_cpu_usage_seconds_total`, `kubelet_*`,
      // `apiserver_request_*`, `coredns_*`) went missing while every rule built on
      // it kept evaluating against no data.
      //
      // ServiceMonitors arrive only through Flux. Authenticated targets must use
      // Secret-backed credentials; unauthenticated targets must clear auth fields.

      // A target backed by a pod is scraped by the Alloy on that pod's node (node.alloy); this
      // one keeps the rest, such as Services with hand-set endpoints.
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = ".+"
        action        = "drop"
      }

      scrape {
        default_scrape_interval = "60s"
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    // Push scraped metrics to Mimir.
    prometheus.remote_write "mimir" {
      endpoint {
        url = sys.env("MIMIR_PUSH_URL")
      }
    }

    // --- Control-plane scraping ---

    // kube-prometheus-stack's API-server and kubelet ServiceMonitors are disabled in
    // ../stack/helmrelease.yaml because Alloy scrapes those surfaces natively: the
    // apiserver below, kubelet and cAdvisor from each node's own Alloy (node.alloy).
    // The chart-managed controller-manager and scheduler monitors use the
    // Alloy-owned Secret, while CoreDNS is chart-managed without authentication.
    //
    // `job` and `metrics_path` are load-bearing, not cosmetic: the deployed
    // kubernetes-mixin rules select on job="kubelet" (35 rules), job="apiserver"
    // (90), metrics_path="/metrics" (27) and metrics_path="/metrics/cadvisor" (8).
    // Prometheus attaches `job` and `instance` on its own but NOT `metrics_path` --
    // prometheus-operator adds it when it renders a ServiceMonitor -- so every
    // scrape below sets it explicitly. Omit it and the rules go back to evaluating
    // against no data, with nothing logged.

    // The apiserver is reached through the `kubernetes` Service in `default`, whose
    // certificate the cluster CA does sign -- so this one verifies properly rather
    // than skipping.
    discovery.kubernetes "apiserver" {
      role = "endpoints"

      namespaces {
        names = ["default"]
      }
    }

    discovery.relabel "apiserver" {
      targets = discovery.kubernetes.apiserver.targets

      rule {
        source_labels = [
          "__meta_kubernetes_service_label_component",
          "__meta_kubernetes_service_label_provider",
          "__meta_kubernetes_endpoint_port_name",
        ]
        regex  = "apiserver;kubernetes;https"
        action = "keep"
      }
      rule {
        target_label = "metrics_path"
        replacement  = "/metrics"
      }
    }

    // Copied from the chart ServiceMonitor's metricRelabelings.
    // apiserver_request_duration_seconds_bucket is high-cardinality enough that
    // keeping every bucket is a real cost against `ingestion_rate_mb`.
    prometheus.relabel "apiserver" {
      forward_to = [prometheus.remote_write.mimir.receiver]

      rule {
        source_labels = ["__name__", "le"]
        regex         = "(etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\\.15|0\\.2|0\\.3|0\\.35|0\\.4|0\\.45|0\\.6|0\\.7|0\\.8|0\\.9|1\\.25|1\\.5|1\\.75|2|3|3\\.5|4|4\\.5|6|7|8|9|15|20|40|45|50)(\\.0)?"
        action        = "drop"
      }
    }

    prometheus.scrape "apiserver" {
      targets           = discovery.relabel.apiserver.output
      job_name          = "apiserver"
      scheme            = "https"
      metrics_path      = "/metrics"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        ca_file     = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        server_name = "kubernetes"
      }
      forward_to = [prometheus.relabel.apiserver.receiver]
    }

    // --- Rule sync (replaces Prometheus rule evaluation) ---

    // Sync PrometheusRule CRDs to Mimir Ruler for evaluation.
    mimir.rules.kubernetes "rules" {
      address = sys.env("MIMIR_GATEWAY_URL")
    }

    // --- OTLP ingestion (Agentplane and browser relay traces, logs, metrics) ---

    otelcol.receiver.otlp "agentplane" {
      grpc {
        endpoint = sys.env("OTLP_GRPC_LISTEN_ADDRESS")

        keepalive {
          enforcement_policy {
            min_time              = "30s"
            permit_without_stream = false
          }
        }
      }
      http {
        endpoint = sys.env("OTLP_HTTP_LISTEN_ADDRESS")
      }
      output {
        metrics = [otelcol.processor.batch.default.input]
        logs    = [otelcol.processor.batch.default.input]
        traces  = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      output {
        metrics = [otelcol.exporter.prometheus.default.input]
        logs    = [otelcol.exporter.loki.default.input]
        traces  = [otelcol.exporter.otlp.tempo.input]
      }
    }

    // Convert OTLP metrics to Prometheus format and push to Mimir.
    otelcol.exporter.prometheus "default" {
      forward_to          = [prometheus.remote_write.mimir.receiver]
      add_metric_suffixes = false
    }

    // Forward OTel logs to Loki.
    otelcol.exporter.loki "default" {
      forward_to = [loki.write.monitoring.receiver]
    }

    loki.write "monitoring" {
      endpoint {
        url = sys.env("LOKI_PUSH_URL")
      }
    }

    // Forward traces to Tempo via OTLP/gRPC.
    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = sys.env("TEMPO_OTLP_GRPC_ENDPOINT")
        tls {
          insecure = true
        }
      }
    }

    // --- Kubernetes events ---

    // Events live ~1h in the apiserver; this is the only durable copy. It is also
    // the only channel for HelmRelease drift: helm-controller reports drift solely
    // as an info-severity `DriftDetected` Event, with no corresponding metric, so
    // `driftDetection: mode: warn` is unobservable without this.
    //
    // Must run on exactly one Alloy instance -- the watch is cluster-wide, so a
    // second replica (or a DaemonSet conversion) ingests every event twice. The
    // `controller.type: deployment` / `replicas: 1` in helmrelease.yaml is
    // load-bearing here.
    //
    // json over the logfmt default: event messages are free text with spaces and
    // quotes, and `| json | reason="DriftDetected"` is the query shape wanted.
    loki.source.kubernetes_events "cluster" {
      job_name   = "kubernetes-events"
      log_format = "json"
      forward_to = [loki.write.monitoring.receiver]
    }
immutable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-node-config
  namespace: monitoring
data:
  node.alloy: |
    // Per-node Alloy (DaemonSet): scrapes only targets on its own node, `NODE_NAME` (its kubelet and
    // every ServiceMonitor/PodMonitor target backed by a pod there), and buffers them in a WAL on that
    // node's disk. When the node loses its link to Mimir (a home WAN outage), it keeps scraping and
    // replays the backlog once the link returns, within `max_keepalive_time` and Mimir's
    // `out_of_order_time_window`. Cluster-wide work stays on the central Alloy (config.alloy).

    prometheus.remote_write "mimir" {
      endpoint {
        url = sys.env("MIMIR_PUSH_URL")
      }

      // The default 8h would drop the oldest unsent samples of a longer outage. Matches Mimir's
      // `out_of_order_time_window`, past which replayed samples would be rejected anyway.
      wal {
        max_keepalive_time = "720h"
      }
    }

    // --- ServiceMonitors and PodMonitors ---

    // Every monitor is discovered cluster-wide and narrowed to targets backed by a pod on this node.
    // The central Alloy drops those same targets, so each is scraped exactly once. Its comment on
    // `prometheus.operator.servicemonitors` covers which ServiceMonitors Alloy rejects.
    prometheus.operator.servicemonitors "node" {
      kubernetes_role = "endpointslice"

      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = sys.env("NODE_NAME")
        action        = "keep"
      }

      scrape {
        default_scrape_interval = "60s"
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    prometheus.operator.podmonitors "node" {
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = sys.env("NODE_NAME")
        action        = "keep"
      }

      scrape {
        default_scrape_interval = "60s"
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    // --- kubelet ---

    // `job` and `metrics_path` are load-bearing: the kubernetes-mixin rules select on job="kubelet"
    // and metrics_path="/metrics" or "/metrics/cadvisor" (see config.alloy's control-plane notes).

    discovery.kubernetes "node" {
      role = "node"

      selectors {
        role  = "node"
        field = string.format("metadata.name=%s", sys.env("NODE_NAME"))
      }
    }

    // One relabel per kubelet path: the `metrics_path` label has to be a literal, and it is what
    // separates cAdvisor series from kubelet's own on a shared job.
    discovery.relabel "kubelet_metrics" {
      targets = discovery.kubernetes.node.targets

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        target_label = "metrics_path"
        replacement  = "/metrics"
      }
    }

    discovery.relabel "kubelet_cadvisor" {
      targets = discovery.kubernetes.node.targets

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        target_label = "metrics_path"
        replacement  = "/metrics/cadvisor"
      }
    }

    discovery.relabel "kubelet_probes" {
      targets = discovery.kubernetes.node.targets

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        target_label = "metrics_path"
        replacement  = "/metrics/probes"
      }
    }

    // insecure_skip_verify mirrors the chart's own kubelet ServiceMonitor: the kubelet serving
    // certificate is node-local and not signed by the cluster CA.
    prometheus.scrape "kubelet_metrics" {
      targets           = discovery.relabel.kubelet_metrics.output
      job_name          = "kubelet"
      scheme            = "https"
      metrics_path      = "/metrics"
      honor_labels      = true
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    prometheus.scrape "kubelet_cadvisor" {
      targets           = discovery.relabel.kubelet_cadvisor.output
      job_name          = "kubelet"
      scheme            = "https"
      metrics_path      = "/metrics/cadvisor"
      honor_labels      = true
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    prometheus.scrape "kubelet_probes" {
      targets           = discovery.relabel.kubelet_probes.output
      job_name          = "kubelet"
      scheme            = "https"
      metrics_path      = "/metrics/probes"
      honor_labels      = true
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }
    // The node label is the per-node migration gate (loki.POD_COLLECTOR_LABEL).
    // Import requires a stopped Promtail snapshot and a first-start reset of ONLY this
    // log component's unused state: see docs/promtail-alloy-cutover.md.
    discovery.kubernetes "pod_logs" {
      role = "pod"
      selectors {
        role  = "pod"
        field = string.format("spec.nodeName=%s", sys.env("NODE_NAME"))
      }
      attach_metadata {
        node = true
      }
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pod_logs.targets
      rule {
        source_labels = ["__meta_kubernetes_node_label_observability_allegedly_works_pod_collector"]
        regex         = "alloy"
        action        = "keep"
      }
      // Match Promtail chart 6.x's app fallback and its useful, bounded labels.
      rule {
        source_labels = ["__meta_kubernetes_pod_controller_name"]
        regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
        target_label  = "__tmp_controller_name"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__tmp_controller_name", "__meta_kubernetes_pod_name"]
        regex         = "^;*([^;]+)(;.*)?$"
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance", "__meta_kubernetes_pod_label_instance"]
        regex         = "^;*([^;]+)(;.*)?$"
        target_label  = "instance"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component", "__meta_kubernetes_pod_label_component"]
        regex         = "^;*([^;]+)(;.*)?$"
        target_label  = "component"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node_name"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["namespace", "app"]
        separator     = "/"
        target_label  = "job"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
      // Static pods use config hash rather than the API UID in their on-disk path.
      rule {
        source_labels = ["__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash", "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        regex         = "true/(.*)"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
    }

    local.file_match "pods" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pods" {
      targets               = local.file_match.pods.targets
      legacy_positions_file = "/var/lib/alloy-node/legacy-pod-positions.yaml"
      forward_to            = [loki.process.pods.receiver]
    }

    loki.process "pods" {
      stage.cri {}
      // File paths contain Pod UIDs: retain the incident's cardinality protection.
      stage.label_drop {
        values = ["filename"]
      }
      forward_to = [loki.write.pod_logs.receiver]
    }

    loki.write "pod_logs" {
      endpoint {
        url = sys.env("LOKI_PUSH_URL")
      }
    }
immutable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-syslog-config
  namespace: monitoring
data:
  syslog.alloy: |
    // Syslog receiver (Deployment on optiplex): the home switch sends RouterOS's BSD syslog, and the
    // AT&T gateway its firewall log, over UDP to optiplex's fixed LAN address, which a hostPort per
    // sender forwards here. Entries carry the time they arrive: RFC 3164 timestamps have no year or
    // zone, and both senders are one LAN hop away. The gateway's datagrams carry no `<PRI>` header,
    // so no syslog parser accepts them and its listener keeps each datagram whole.

    loki.source.syslog "lan" {
      listener {
        address       = sys.env("SYSLOG_LISTEN_ADDRESS")
        protocol      = "udp"
        syslog_format = "rfc3164"
        labels        = { job = "home-switch" }
      }
      listener {
        address       = sys.env("GATEWAY_SYSLOG_LISTEN_ADDRESS")
        protocol      = "udp"
        syslog_format = "raw"
        labels        = { job = "home-gateway" }
      }
      relabel_rules = loki.relabel.syslog.rules
      forward_to    = [loki.write.loki.receiver]
    }

    loki.relabel "syslog" {
      rule {
        source_labels = ["__syslog_message_hostname"]
        target_label  = "host"
      }
      rule {
        source_labels = ["__syslog_message_severity"]
        target_label  = "level"
      }
      forward_to = []
    }

    loki.write "loki" {
      endpoint {
        url = sys.env("LOKI_PUSH_URL")
        // Retry forever rather than drop after 10 tries: a home WAN outage cuts optiplex off from
        // Loki, and the in-memory queue holds hours of switch logs. A pod restart still loses it.
        max_backoff_retries = 0
      }
    }
immutable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-journal-config
  namespace: monitoring
data:
  journal.alloy: |
    // Only the NixOS-only alloy-journal release mounts these paths. No kernel/unit
    // filter: retain all system journal messages, including kernel GPU Xid events.
    loki.relabel "journal" {
      forward_to = []
      rule {
        source_labels = ["__journal__systemd_unit"]
        target_label  = "unit"
      }
      rule {
        source_labels = ["__journal__hostname"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__journal_priority_keyword"]
        target_label  = "level"
      }
      rule {
        target_label = "job"
        replacement  = "systemd-journal"
      }
    }

    loki.source.journal "journal" {
      path          = "/var/log/journal"
      max_age       = "12h"
      relabel_rules = loki.relabel.journal.rules
      labels        = {job = "systemd-journal"}
      legacy_position {
        file = "/var/lib/alloy-journal/legacy-journal-positions.yaml"
        name = "journal"
      }
      forward_to = [loki.write.journal.receiver]
    }

    loki.write "journal" {
      endpoint {
        url = sys.env("LOKI_PUSH_URL")
      }
    }
immutable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wyrm2-alloy-canary-script
  namespace: monitoring
data:
  config-hashes.json: '{"alloy-node-config": "9d9e6fbdfca7a242583b3ef82fa1e2208ad1a3d06d66807308b3339c8acd5fd3", "alloy-journal-config": "b30dfa74e986082e8c66c7345f63008a8532e89208f92eca6a8417c66c66fdd8"}'
  cutover.py: |
    """One-shot wyrm2 replay handoff. Deployment is the activation operation."""

    from __future__ import annotations

    import hashlib
    import json
    import os
    import re
    import ssl
    import stat
    import sys
    import time
    import urllib.request
    from dataclasses import dataclass
    from datetime import UTC, datetime
    from pathlib import Path
    from typing import Any

    NODE = "wyrm2"
    POD_LABEL = "observability.allegedly.works/pod-collector"
    JOURNAL_LABEL = "observability.allegedly.works/journal-collector"
    COLLECTORS = (
        ("loki", "promtail"),
        ("loki", "promtail-journal"),
        ("monitoring", "alloy-node"),
        ("monitoring", "alloy-journal"),
    )
    NODE_API = f"/api/v1/nodes/{NODE}"


    def require(condition: bool, reason: str) -> None:
        if not condition:
            raise RuntimeError(reason)


    class Api:
        def __init__(self) -> None:
            credentials = Path("/var/run/secrets/kubernetes.io/serviceaccount")
            self.token = (credentials / "token").read_text().strip()
            self.context = ssl.create_default_context(cafile=str(credentials / "ca.crt"))
            self.url = f"https://{os.environ['KUBERNETES_SERVICE_HOST']}:{os.environ['KUBERNETES_SERVICE_PORT_HTTPS']}"

        def request(self, path: str, patch: list[dict[str, Any]] | None = None) -> dict[str, Any]:
            request = urllib.request.Request(
                self.url + path,
                data=json.dumps(patch).encode() if patch is not None else None,
                headers={"Authorization": f"Bearer {self.token}", "Content-Type": "application/json-patch+json"},
                method="PATCH" if patch is not None else "GET",
            )
            with urllib.request.urlopen(request, context=self.context, timeout=20) as response:
                result = json.load(response)
                if not isinstance(result, dict):
                    raise RuntimeError("Kubernetes response is not an object")
                return result


    @dataclass(frozen=True)
    class Files:
        node: Path = Path("/state/node")  # read-only, including metrics WAL
        journal: Path = Path("/state/journal")  # read-only
        pod_component: Path = Path("/state/pods")  # only writable Alloy state mount
        promtail: Path = Path("/state/promtail/positions.yaml")  # read-only shared checkpoint
        evidence: Path = Path("/evidence")

        def unused(self) -> None:
            for root, legacy in ((self.node, "legacy-pod-positions.yaml"), (self.journal, "legacy-journal-positions.yaml")):
                require(not os.path.lexists(root / legacy), f"existing import input: {root / legacy}")
            require(not list(self.journal.iterdir()), "journal storage has prior state")
            require(
                not any(
                    p.name.startswith("loki.source.file.") and p.name != "loki.source.file.pods"
                    for p in self.node.iterdir()
                ),
                "unexpected file-source state",
            )
            entries = list(self.pod_component.iterdir())
            require(all(p.name == "positions.yml" for p in entries), "unexpected pod component files")
            if entries:
                content = read_regular(entries[0])
                require(
                    re.fullmatch(rb"\s*positions:\s*\{\}\s*", content) is not None,
                    "pod positions are not demonstrably unused; never reset active state",
                )


    def read_regular(path: Path) -> bytes:
        with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), "rb") as source:
            require(stat.S_ISREG(os.fstat(source.fileno()).st_mode), f"not a regular file: {path}")
            return source.read()


    def write_once(path: Path, content: bytes) -> None:
        with path.open("xb") as destination:
            destination.write(content)
            destination.flush()
            os.fchmod(destination.fileno(), 0o400)
            os.fsync(destination.fileno())
        sync_directory(path.parent)


    def sync_directory(path: Path) -> None:
        directory = os.open(path, os.O_RDONLY | os.O_DIRECTORY)
        try:
            os.fsync(directory)
        finally:
            os.close(directory)


    def record(directory: Path, name: str, value: Any) -> None:
        write_once(directory / f"{name}.json", json.dumps(value, indent=2, sort_keys=True).encode())


    def healthy_node(node: dict[str, Any]) -> None:
        require(node["metadata"]["name"] == NODE, "wrong node")
        require(not node["metadata"].get("deletionTimestamp") and not node["spec"].get("unschedulable"), "node unavailable")
        require(not node["spec"].get("taints"), "unexpected wyrm2 taints")
        require(node["metadata"]["labels"].get("node-vendor") == "nixos", "not the expected NixOS node")
        conditions = {c["type"]: c["status"] for c in node["status"]["conditions"]}
        require(conditions.get("Ready") == "True", "node not Ready; termination cannot be trusted")
        require(
            all(conditions.get(c) == "False" for c in ("MemoryPressure", "DiskPressure", "PIDPressure")), "node pressure"
        )


    def scheduled(spec: dict[str, Any], labels: dict[str, str]) -> bool:
        require(not spec.get("nodeName") or spec["nodeName"] == NODE, "unexpected fixed node")
        if any(labels.get(k) != v for k, v in spec.get("nodeSelector", {}).items()):
            return False
        terms = (
            spec.get("affinity", {})
            .get("nodeAffinity", {})
            .get("requiredDuringSchedulingIgnoredDuringExecution", {})
            .get("nodeSelectorTerms")
        )
        if terms is None:
            return True
        matches = []
        for term in terms:
            require(not term.get("matchFields"), "unsupported collector matchFields")
            expressions = term.get("matchExpressions", [])
            matched = bool(expressions)
            for expression in expressions:
                key, operator = expression["key"], expression["operator"]
                values = expression.get("values", [])
                require(operator in {"In", "NotIn", "Exists", "DoesNotExist"}, "unsupported affinity operator")
                matched &= {
                    "In": key in labels and labels[key] in values,
                    "NotIn": labels.get(key) not in values,
                    "Exists": key in labels,
                    "DoesNotExist": key not in labels,
                }[operator]
            matches.append(matched)
        return any(matches)


    def collectors(api: Api) -> list[dict[str, Any]]:
        return [api.request(f"/apis/apps/v1/namespaces/{ns}/daemonsets/{name}") for ns, name in COLLECTORS]


    def pods(api: Api) -> list[dict[str, Any]]:
        return [
            pod
            for namespace in ("loki", "monitoring")
            for pod in api.request(f"/api/v1/namespaces/{namespace}/pods?fieldSelector=spec.nodeName%3D{NODE}")["items"]
        ]


    def owned(pod: dict[str, Any], daemonset: dict[str, Any]) -> bool:
        return any(
            owner.get("controller") and owner["uid"] == daemonset["metadata"]["uid"]
            for owner in pod["metadata"].get("ownerReferences", [])
        )


    def matches(pod: dict[str, Any], daemonset: dict[str, Any]) -> bool:
        selector = daemonset["spec"]["selector"]
        require(bool(selector.get("matchLabels")) and not selector.get("matchExpressions"), "unexpected collector selector")
        return owned(pod, daemonset) or all(
            pod["metadata"].get("labels", {}).get(k) == v for k, v in selector["matchLabels"].items()
        )


    def ready(pod: dict[str, Any]) -> bool:
        return not pod["metadata"].get("deletionTimestamp") and any(
            c["type"] == "Ready" and c["status"] == "True" for c in pod.get("status", {}).get("conditions", [])
        )


    def reviewed_template(spec: dict[str, Any], index: int) -> dict[str, Any]:
        main_name = "promtail" if index < 2 else "alloy"
        main: dict[str, Any] = next(c for c in spec["containers"] if c["name"] == main_name)
        expected_image = "docker.io/grafana/promtail:3.5.1" if index < 2 else "docker.io/grafana/alloy:v1.22.0"
        require(main["image"] == expected_image and not main.get("command"), "unreviewed image/entrypoint")
        volumes = {v["name"]: v for v in spec["volumes"]}
        mounts = {m["mountPath"]: m for m in main["volumeMounts"]}
        config_directory = "/etc/promtail" if index < 2 else "/etc/alloy"
        require(mounts.get(config_directory) == {"name": "config", "mountPath": config_directory}, "config mount drift")
        source = volumes["config"].get("secret" if index < 2 else "configMap", {})
        require(not source.get("items"), "config key remapping is not reviewed")
        if index < 2:
            require(source.get("secretName") == COLLECTORS[index][1], "wrong Promtail Secret name")
            expected_args = ["-config.file=/etc/promtail/promtail.yaml"]
            storage = "/run/promtail"
        else:
            component = "node" if index == 2 else "journal"
            require(source.get("name") == f"alloy-{component}-config", "wrong Alloy ConfigMap")
            storage = f"/var/lib/alloy-{component}"
            expected_args = [
                "run",
                f"/etc/alloy/{component}.alloy",
                f"--storage.path={storage}",
                "--server.http.listen-addr=0.0.0.0:12345",
                "--server.http.ui-path-prefix=/",
                "--stability.level=generally-available",
            ]
        require(main.get("args") == expected_args, "collector config/storage args drift")
        required_paths = {storage: False}
        if index in (0, 1, 2):
            required_paths["/var/log/pods"] = True
        if index in (1, 3):
            required_paths |= {"/var/log/journal": True, "/etc/machine-id": True}
        for path, read_only in required_paths.items():
            mount = mounts.get(path, {})
            require(
                bool(mount)
                and not mount.get("subPath")
                and not mount.get("subPathExpr")
                and bool(mount.get("readOnly")) == read_only,
                f"collector mount drift: {path}",
            )
            require(volumes[mount["name"]].get("hostPath", {}).get("path") == path, f"wrong host path: {path}")
        return main


    def check_configs(api: Api, expected: dict[str, str]) -> None:
        require(set(expected) == {"alloy-node-config", "alloy-journal-config"}, "incomplete expected configuration")
        for name, key in (("alloy-node-config", "node.alloy"), ("alloy-journal-config", "journal.alloy")):
            config = api.request(f"/api/v1/namespaces/monitoring/configmaps/{name}")
            require(hashlib.sha256(config["data"][key].encode()).hexdigest() == expected[name], "Alloy config mismatch")


    def check_collectors(sets: list[dict[str, Any]], node: dict[str, Any], current_pods: list[dict[str, Any]]) -> None:
        for index, ds in enumerate(sets):
            metadata, status, template = ds["metadata"], ds["status"], ds["spec"]["template"]["spec"]
            require(status.get("observedGeneration", 0) >= metadata["generation"], "DaemonSet not observed")
            desired = status["desiredNumberScheduled"]
            require(
                status.get("numberReady", 0) == desired
                and status.get("updatedNumberScheduled", 0) == desired
                and not status.get("numberMisscheduled", 0),
                f"DaemonSet rollout incomplete: {metadata['name']}",
            )
            for gate, expected in (("promtail", index != 3), ("drained", False), ("alloy", index >= 2)):
                labels = node["metadata"]["labels"] | {POD_LABEL: gate, JOURNAL_LABEL: gate}
                require(scheduled(template, labels) == expected, f"wrong {gate} scheduling gate: {metadata['name']}")
            main = reviewed_template(template, index)
            on_node = [p for p in current_pods if matches(p, ds)]
            require(len(on_node) == (0 if index == 3 else 1), f"unexpected collectors on wyrm2: {metadata['name']}")
            for pod in on_node:
                require(owned(pod, ds), "unowned collector Pod")
                require(ready(pod), f"collector not Ready: {pod['metadata']['name']}")
                actual = reviewed_template(pod["spec"], index)
                require(
                    all(actual.get(key) == main.get(key) for key in ("image", "args", "command", "env")),
                    "pod differs from reviewed template",
                )
                require(all(mount in actual["volumeMounts"] for mount in main["volumeMounts"]), "pod mounts differ")


    def set_gates(api: Api, previous: tuple[str | None, str | None], value: str) -> dict[str, Any]:
        node = api.request(NODE_API)
        healthy_node(node)
        labels = node["metadata"]["labels"]
        require(
            tuple(labels.get(k) for k in (POD_LABEL, JOURNAL_LABEL)) == previous, "collector gates changed concurrently"
        )
        return api.request(
            NODE_API,
            [
                {"op": "test", "path": "/metadata/resourceVersion", "value": node["metadata"]["resourceVersion"]},
                {"op": "add", "path": "/metadata/labels", "value": labels | {POD_LABEL: value, JOURNAL_LABEL: value}},
            ],
        )


    def wait_collectors(api: Api, sets: list[dict[str, Any]], *, activated: bool) -> None:
        deadline = time.monotonic() + 300
        while True:
            node = api.request(NODE_API)
            healthy_node(node)
            expected = "alloy" if activated else "drained"
            require(all(node["metadata"]["labels"].get(k) == expected for k in (POD_LABEL, JOURNAL_LABEL)), "gates changed")
            current = pods(api)
            present = [[p for p in current if matches(p, ds)] for ds in sets]
            if not activated and not any(present):
                return
            if (
                activated
                and not any(present[:2])
                and all(
                    len(p) == 1 and ready(p[0]) and owned(p[0], ds) for p, ds in zip(present[2:], sets[2:], strict=True)
                )
            ):
                return
            require(time.monotonic() < deadline, f"collector {'startup' if activated else 'termination'} timed out")
            time.sleep(2)


    def run(api: Api, files: Files, expected_configs: dict[str, str]) -> None:
        require(os.environ.get("NODE_NAME") == NODE, "Job did not start on wyrm2")
        require(not list(files.evidence.iterdir()), "prior attempt exists; inspect evidence, never automatically rerun")
        node = api.request(NODE_API)
        healthy_node(node)
        previous = (node["metadata"]["labels"].get(POD_LABEL), node["metadata"]["labels"].get(JOURNAL_LABEL))
        require(all(value in (None, "promtail") for value in previous), "node already drained/activated or unknown gates")
        sets, current_pods = collectors(api), pods(api)
        check_collectors(sets, node, current_pods)
        check_configs(api, expected_configs)
        files.unused()
        require(bool(read_regular(files.promtail)), "no legacy rollback checkpoint")
        attempt = files.evidence / "attempt"
        attempt.mkdir(mode=0o700)  # exclusive durable fence: every later invocation refuses
        sync_directory(files.evidence)
        record(
            attempt,
            "preflight",
            {
                "time": datetime.now(UTC).isoformat(),
                "node": node,
                "daemonsets": sets,
                "pods": [p for p in current_pods if any(matches(p, ds) for ds in sets)],
                "mode": "retained-file-and-12h-journal-replay",
            },
        )
        set_gates(api, previous, "drained")
        record(attempt, "drained", {"time": datetime.now(UTC).isoformat()})
        wait_collectors(api, sets, activated=False)
        require(
            all(
                before["spec"] == after["spec"] and before["metadata"]["uid"] == after["metadata"]["uid"]
                for before, after in zip(sets, collectors(api), strict=True)
            ),
            "DaemonSet changed during drain",
        )
        files.unused()
        legacy = read_regular(files.promtail)
        require(bool(legacy), "stopped rollback checkpoint missing")
        write_once(attempt / "shared-promtail-positions.yaml", legacy)
        checksums = {"shared-promtail-positions.yaml": hashlib.sha256(legacy).hexdigest()}
        positions = files.pod_component / "positions.yml"
        if positions.exists():
            content = read_regular(positions)
            require(re.fullmatch(rb"\s*positions:\s*\{\}\s*", content) is not None, "pod state changed after drain")
            write_once(attempt / "unused-alloy-pod-positions.yml", content)
            checksums["unused-alloy-pod-positions.yml"] = hashlib.sha256(content).hexdigest()
            positions.unlink()  # only demonstrably unused state, with all writers stopped
            sync_directory(files.pod_component)
        record(attempt, "snapshots", checksums)
        record(attempt, "prepared", {"time": datetime.now(UTC).isoformat(), "legacy_import": False})
        check_configs(api, expected_configs)
        set_gates(api, ("drained", "drained"), "alloy")
        record(attempt, "activated", {"time": datetime.now(UTC).isoformat()})
        wait_collectors(api, sets, activated=True)
        record(
            attempt,
            "ready",
            {"time": datetime.now(UTC).isoformat(), "pods": [p for p in pods(api) if any(matches(p, ds) for ds in sets)]},
        )
        print(
            "wyrm2 Alloy ready; operator must verify Loki canaries, replay, rotation, restart and metrics recovery",
            flush=True,
        )


    if __name__ == "__main__":
        try:
            run(Api(), Files(), json.loads(Path("/scripts/config-hashes.json").read_text()))
        except Exception as error:
            print(
                f"STOP: {error}. No automatic rollback. Inspect Node/wyrm2 labels and /evidence/attempt; "
                "if drained, keep it drained while investigating; if alloy, preserve active state. "
                "See docs/wyrm2-alloy-canary.md for recovery.",
                file=sys.stderr,
                flush=True,
            )
            raise
