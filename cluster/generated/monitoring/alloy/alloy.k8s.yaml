apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  chart:
    spec:
      chart: alloy
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 1.x
  interval: 30m
  values:
    alloy:
      configMap:
        create: false
        key: config.alloy
        name: alloy-config
      extraEnv:
        - name: MIMIR_PUSH_URL
          value: http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push
        - name: MIMIR_GATEWAY_URL
          value: http://mimir-gateway.monitoring.svc.cluster.local
        - name: LOKI_PUSH_URL
          value: http://loki-write.loki.svc.cluster.local:3100/loki/api/v1/push
        - name: TEMPO_OTLP_GRPC_ENDPOINT
          value: tempo.monitoring.svc.cluster.local:4317
        - name: OTLP_HTTP_LISTEN_ADDRESS
          value: 0.0.0.0:4318
      extraPorts:
        - name: otlp-http
          port: 4318
          protocol: TCP
          targetPort: 4318
    controller:
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      replicas: 1
      type: deployment
    serviceMonitor:
      enabled: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-otlp-ingress
  namespace: monitoring
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              app.kubernetes.io/component: server
              app.kubernetes.io/instance: authentik
      ports:
        - port: 4318
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Ingress
