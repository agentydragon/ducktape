apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  chart:
    spec:
      chart: alloy
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 1.x
  interval: 30m
  values:
    alloy:
      configMap:
        create: false
        key: config.alloy
        name: alloy-config
      extraEnv:
        - name: MIMIR_PUSH_URL
          value: http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push
        - name: MIMIR_GATEWAY_URL
          value: http://mimir-gateway.monitoring.svc.cluster.local
        - name: LOKI_PUSH_URL
          value: http://loki-write.loki.svc.cluster.local:3100/loki/api/v1/push
        - name: TEMPO_OTLP_GRPC_ENDPOINT
          value: tempo.monitoring.svc.cluster.local:4317
        - name: OTLP_HTTP_LISTEN_ADDRESS
          value: 0.0.0.0:4318
      extraPorts:
        - name: otlp-http
          port: 4318
          protocol: TCP
          targetPort: 4318
    controller:
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      replicas: 1
      type: deployment
    serviceMonitor:
      enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-node
  namespace: monitoring
spec:
  chart:
    spec:
      chart: alloy
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 1.x
  interval: 30m
  values:
    alloy:
      configMap:
        create: false
        key: node.alloy
        name: alloy-node-config
      extraEnv:
        - name: MIMIR_PUSH_URL
          value: http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      mounts:
        extra:
          - mountPath: /var/lib/alloy-node
            name: wal
      resources:
        requests:
          cpu: 20m
          memory: 256Mi
      storagePath: /var/lib/alloy-node
    controller:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: NotIn
                    values:
                      - roaming
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      type: daemonset
      volumes:
        extra:
          - hostPath:
              path: /var/lib/alloy-node
              type: DirectoryOrCreate
            name: wal
    nameOverride: alloy-node
    serviceMonitor:
      enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-syslog
  namespace: monitoring
spec:
  chart:
    spec:
      chart: alloy
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 1.x
  interval: 30m
  values:
    alloy:
      configMap:
        create: false
        key: syslog.alloy
        name: alloy-syslog-config
      extraEnv:
        - name: LOKI_PUSH_URL
          value: http://loki-write.loki.svc.cluster.local:3100/loki/api/v1/push
        - name: SYSLOG_LISTEN_ADDRESS
          value: 0.0.0.0:5514
        - name: GATEWAY_SYSLOG_LISTEN_ADDRESS
          value: 0.0.0.0:5515
      extraPorts:
        - hostPort: 514
          name: syslog
          port: 514
          protocol: UDP
          targetPort: 5514
        - hostPort: 1514
          name: gateway-syslog
          port: 1514
          protocol: UDP
          targetPort: 5515
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
      stabilityLevel: experimental
    controller:
      nodeSelector:
        kubernetes.io/hostname: optiplex
      replicas: 1
      type: deployment
      updateStrategy:
        type: Recreate
    nameOverride: alloy-syslog
    serviceMonitor:
      enabled: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-otlp-ingress
  namespace: monitoring
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              app.kubernetes.io/component: server
              app.kubernetes.io/instance: authentik
      ports:
        - port: 4318
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-node
      ports:
        - port: 12345
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Ingress
