---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: home-application-probes
  namespace: monitoring
spec:
  podMetricsEndpoints:
    - interval: 10s
      params:
        module:
          - tcp_ipv4
        target:
          - 1.1.1.1:443
      path: /probe
      port: http
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: source_node
        - sourceLabels:
            - __param_target
          targetLabel: target
      scrapeTimeout: 7s
    - interval: 10s
      params:
        module:
          - https_ipv4
        target:
          - https://data.forgejo.org/api/v1/version
      path: /probe
      port: http
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: source_node
        - sourceLabels:
            - __param_target
          targetLabel: target
      scrapeTimeout: 7s
    - interval: 10s
      params:
        module:
          - https_ipv4
        target:
          - https://github.com/robots.txt
      path: /probe
      port: http
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: source_node
        - sourceLabels:
            - __param_target
          targetLabel: target
      scrapeTimeout: 7s
  selector:
    matchLabels:
      app.kubernetes.io/part-of: home-application-probes
