apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: ICMP loss and RTT from optiplex to home LAN and OVH targets.
  labels:
    app.kubernetes.io/name: smokeping
    app.kubernetes.io/part-of: smokeping
  name: smokeping
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: smokeping
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smokeping
        app.kubernetes.io/part-of: smokeping
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --no-privileged
            - --ping.interval=200ms
            - 192.168.1.254
            - 192.168.1.100
            - 10.42.0.16
          image: quay.io/superq/smokeping-prober:v0.12.0@sha256:2524b895bdae244984e937ecb8fdd755baedbf2bb108204bd1a1dc6732706303
          imagePullPolicy: IfNotPresent
          livenessProbe:
            periodSeconds: 30
            tcpSocket:
              port: http
          name: prober
          ports:
            - containerPort: 9374
              name: http
              protocol: TCP
          readinessProbe:
            periodSeconds: 30
            tcpSocket:
              port: http
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      nodeSelector:
        kubernetes.io/hostname: optiplex
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.ipv4.ping_group_range
            value: 65532 65532
      terminationGracePeriodSeconds: 10
---
