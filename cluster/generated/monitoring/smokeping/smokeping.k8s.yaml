apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: smokeping
  namespace: monitoring
spec:
  podMetricsEndpoints:
    - interval: 30s
      metricRelabelings:
        - regex: 192\.168\.1\.254
          replacement: gateway
          sourceLabels:
            - ip
          targetLabel: target
        - regex: 192\.168\.1\.100
          replacement: switch
          sourceLabels:
            - ip
          targetLabel: target
        - regex: 10\.42\.0\.16
          replacement: ovh-ns104952
          sourceLabels:
            - ip
          targetLabel: target
        - regex: 192\.168\.1\.10
          replacement: optiplex
          sourceLabels:
            - ip
          targetLabel: target
      path: /metrics
      port: http
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: source_node
      scrapeTimeout: 10s
  selector:
    matchLabels:
      app.kubernetes.io/part-of: smokeping
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smokeping
  namespace: monitoring
spec:
  groups:
    - name: smokeping
      rules:
        - alert: HomeGatewayUplinkLoss
          annotations:
            description: "{{ $labels.source_node }} has lost {{ $value | humanizePercentage }} of pings to the AT&T gateway (192.168.1.254) for 15 minutes while pings to the switch (192.168.1.100) are clean: the switch-to-gateway uplink (CRS310 ether1) is likely back in the 2.5G loss state. See debug/home_network_connectivity/2026_10_gateway_uplink_loss.md."
            summary: Packet loss from the home LAN to the AT&T gateway, none to the switch
          expr: |
            (1 - sum by (source_node) (rate(smokeping_response_duration_seconds_count{job="monitoring/smokeping", target="gateway"}[5m])) / sum by (source_node) (rate(smokeping_requests_total{job="monitoring/smokeping", target="gateway"}[5m]))) > 0.03
            and on (source_node)
            (1 - sum by (source_node) (rate(smokeping_response_duration_seconds_count{job="monitoring/smokeping", target="switch"}[5m])) / sum by (source_node) (rate(smokeping_requests_total{job="monitoring/smokeping", target="switch"}[5m]))) < 0.005
          for: 15m
          labels:
            severity: warning
