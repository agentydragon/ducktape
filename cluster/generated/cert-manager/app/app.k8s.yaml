apiVersion: v1
kind: Namespace
metadata:
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: '{"containerPolicies": [{"containerName": "cert-manager-controller", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "10m", "memory": "112Mi"}, "maxAllowed": {"cpu": "10m", "memory": "128Mi"}, "controlledResources": ["memory"]}, {"containerName": "cert-manager-cainjector", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "10m", "memory": "224Mi"}, "maxAllowed": {"cpu": "10m", "memory": "512Mi"}, "controlledResources": ["memory"]}, {"containerName": "cert-manager-webhook", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "10m", "memory": "64Mi"}, "maxAllowed": {"cpu": "10m", "memory": "128Mi"}, "controlledResources": ["memory"]}, {"containerName": "*", "controlledValues": "RequestsOnly", "mode": "Off"}]}'
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: initial
    rbac.ducktape.io/agent-readable-logs: "true"
  name: cert-manager
spec: {}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      version: v1.21.2
  install:
    remediation:
      retries: 3
  interval: 30m
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cert-manager
                namespace: cert-manager
              spec:
                template:
                  spec:
                    containers:
                      - name: cert-manager-controller
                        readinessProbe:
                          httpGet:
                            path: /livez
                            port: http-healthz
            target:
              kind: Deployment
              name: cert-manager
              namespace: cert-manager
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cert-manager-cainjector
                namespace: cert-manager
              spec:
                template:
                  spec:
                    containers:
                      - name: cert-manager-cainjector
                        readinessProbe:
                          tcpSocket:
                            port: http-metrics
            target:
              kind: Deployment
              name: cert-manager-cainjector
              namespace: cert-manager
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cert-manager-cainjector
                namespace: cert-manager
                annotations:
                  goldilocks.fairwinds.com/vpa-update-mode: auto
            target:
              kind: Deployment
              name: cert-manager-cainjector
              namespace: cert-manager
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cert-manager
                namespace: cert-manager
                annotations:
                  goldilocks.fairwinds.com/vpa-update-mode: auto
            target:
              kind: Deployment
              name: cert-manager
              namespace: cert-manager
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cert-manager-webhook
                namespace: cert-manager
                annotations:
                  goldilocks.fairwinds.com/vpa-update-mode: auto
            target:
              kind: Deployment
              name: cert-manager-webhook
              namespace: cert-manager
  values:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: controller
                app.kubernetes.io/instance: cert-manager
            topologyKey: kubernetes.io/hostname
    cainjector:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: cainjector
                  app.kubernetes.io/instance: cert-manager
              topologyKey: kubernetes.io/hostname
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      replicaCount: 2
      resources:
        limits:
          cpu: 100m
          memory: 512Mi
        requests:
          cpu: 10m
          memory: 128Mi
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      enableGatewayAPI: true
      kind: ControllerConfiguration
    crds:
      enabled: true
    extraArgs:
      - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
      - --dns01-recursive-nameservers-only
    global:
      priorityClassName: system-cluster-critical
    ingressShim:
      defaultIssuerKind: ClusterIssuer
      defaultIssuerName: letsencrypt-prod
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    prometheus:
      enabled: true
      servicemonitor:
        enabled: false
    replicaCount: 2
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    webhook:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: webhook
                  app.kubernetes.io/instance: cert-manager
              topologyKey: kubernetes.io/hostname
      extraArgs:
        - --dynamic-serving-dns-names=cert-manager-webhook,cert-manager-webhook.cert-manager,cert-manager-webhook.cert-manager.svc,cert-manager-webhook.cert-manager.svc.cluster.local
      podDisruptionBudget:
        enabled: true
        minAvailable: 2
      replicaCount: 3
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 32Mi
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  endpoints:
    - path: /metrics
      port: http-metrics
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: cert-manager
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: webhook
  namespace: cert-manager
spec:
  endpoints:
    - path: /metrics
      port: metrics
  selector:
    matchLabels:
      app.kubernetes.io/component: webhook
      app.kubernetes.io/instance: cert-manager
