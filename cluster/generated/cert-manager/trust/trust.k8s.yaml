apiVersion: v1
kind: Namespace
metadata:
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: '{"containerPolicies": [{"containerName": "trust-manager", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "25m", "memory": "128Mi"}, "maxAllowed": {"cpu": "100m", "memory": "256Mi"}, "controlledResources": ["cpu", "memory"]}, {"containerName": "*", "controlledValues": "RequestsOnly", "mode": "Off"}]}'
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: initial
  name: cert-manager-trust
spec: {}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager-trust
spec:
  chart:
    spec:
      chart: trust-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      version: 0.25.*
  install:
    remediation:
      retries: 3
  interval: 30m
  values:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: trust-manager
            topologyKey: kubernetes.io/hostname
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    priorityClassName: system-cluster-critical
    replicaCount: 2
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
