apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: Redis operator for managing Valkey instances
  name: valkey-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ot-helm
  namespace: flux-system
spec:
  interval: 24h
  url: https://ot-container-kit.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: valkey-system
spec:
  chart:
    spec:
      chart: redis-operator
      sourceRef:
        kind: HelmRepository
        name: ot-helm
        namespace: flux-system
      version: 0.26.1
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  interval: 30m
  upgrade:
    crds: CreateReplace
  values:
    featureGates:
      GenerateConfigInInitContainer: true
    redisOperator:
      imageTag: v0.25.0
      initContainerImageTag: v0.25.0
