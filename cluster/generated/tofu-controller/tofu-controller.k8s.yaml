apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tofu-controller
  namespace: flux-system
spec:
  interval: 24h
  url: https://flux-iac.github.io/tofu-controller
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
  namespace: flux-system
spec:
  chart:
    spec:
      chart: tofu-controller
      sourceRef:
        kind: HelmRepository
        name: tofu-controller
        namespace: flux-system
      version: 0.16.5
  install:
    crds: Create
    remediation:
      retries: 3
  interval: 15m
  upgrade:
    crds: CreateReplace
  values:
    allowCrossNamespaceRefs: true
    logLevel: info
    podSecurityContext:
      fsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 128Mi
    runner:
      grpc:
        maxMessageSize: 50
      serviceAccount:
        annotations:
          eks.amazonaws.com/role-arn: ""
