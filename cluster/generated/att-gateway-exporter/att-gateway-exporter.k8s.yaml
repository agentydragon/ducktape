apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Prometheus metrics scraped from the AT&T BGW320 gateway's status pages.
  labels:
    app.kubernetes.io/name: att-gateway-exporter
  name: att-gateway-exporter
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: att-gateway-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: att-gateway-exporter
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: ATT_GATEWAY_URL
              value: http://192.168.1.254
            - name: ATT_GATEWAY_LISTEN_PORT
              value: "9173"
          image: git.allegedly.works/ducktape-ci/att-gateway-exporter:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            periodSeconds: 30
            tcpSocket:
              port: http
          name: exporter
          ports:
            - containerPort: 9173
              name: http
              protocol: TCP
          readinessProbe:
            periodSeconds: 30
            tcpSocket:
              port: http
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        kubernetes.io/hostname: optiplex
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: att-gateway-exporter
  name: att-gateway-exporter
  namespace: monitoring
spec:
  ports:
    - name: http
      port: 9173
      protocol: TCP
      targetPort: 9173
  selector:
    app.kubernetes.io/name: att-gateway-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: att-gateway-exporter
  namespace: monitoring
spec:
  endpoints:
    - interval: 60s
      path: /metrics
      port: http
      scheme: http
      scrapeTimeout: 10s
  selector:
    matchLabels:
      app.kubernetes.io/name: att-gateway-exporter
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: att-gateway-exporter
  namespace: monitoring
spec:
  configMapRef:
    key: dashboard.json
    name: att-gateway-exporter-dashboard
  folder: Home network
  instanceSelector:
    matchLabels:
      dashboards: grafana
