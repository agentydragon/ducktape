---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    description: Shared OVH-HA CNPG cluster for MCP OAuth state.
  name: mcp-oauth-state-db
  namespace: mcp-oauth-state
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: app
      owner: app
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  managed:
    roles:
      - ensure: present
        login: true
        name: mcp_oauth_grocy_sf
        passwordSecret:
          name: mcp-oauth-grocy-sf-credentials
      - ensure: present
        login: true
        name: mcp_oauth_grocy_vallejo
        passwordSecret:
          name: mcp-oauth-grocy-vallejo-credentials
      - ensure: present
        login: true
        name: mcp_oauth_tana
        passwordSecret:
          name: mcp-oauth-tana-credentials
      - ensure: absent
        name: mcp_oauth_plaid_db
  monitoring:
    enablePodMonitor: true
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 5Gi
    storageClass: local-path-ovh-hdd
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mcp-oauth-grocy-sf-database
  namespace: mcp-oauth-state
spec:
  cluster:
    name: mcp-oauth-state-db
  databaseReclaimPolicy: retain
  name: mcp_oauth_grocy_sf
  owner: mcp_oauth_grocy_sf
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-oauth-grocy-sf-reader
  namespace: mcp-oauth-state
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-oauth-grocy-sf-reader
  namespace: mcp-oauth-state
rules:
  - apiGroups:
      - ""
    resourceNames:
      - mcp-oauth-grocy-sf-credentials
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-oauth-grocy-sf-reader
  namespace: mcp-oauth-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-oauth-grocy-sf-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: mcp-oauth-grocy-sf-reader
    namespace: mcp-oauth-state
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  annotations:
    description: Allows only the grocy-sf MCP OAuth consumer to read its DSN from mcp-oauth-state.
  name: mcp-oauth-grocy-sf-secret-store
spec:
  conditions:
    - namespaces:
        - grocy-sf
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: mcp-oauth-grocy-sf-reader
          namespace: mcp-oauth-state
      remoteNamespace: mcp-oauth-state
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
