apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-oauth-grocy-sf-credentials-generator
  namespace: mcp-oauth-state
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-oauth-grocy-sf-credentials
  namespace: mcp-oauth-state
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-oauth-grocy-sf-credentials-generator
  refreshInterval: 8760h
  target:
    name: mcp-oauth-grocy-sf-credentials
    template:
      data:
        dbname: mcp_oauth_grocy_sf
        host: mcp-oauth-state-db-rw.mcp-oauth-state.svc
        password: "{{ .password }}"
        port: "5432"
        uri: postgresql://mcp_oauth_grocy_sf:{{ .password }}@mcp-oauth-state-db-rw.mcp-oauth-state.svc:5432/mcp_oauth_grocy_sf
        username: mcp_oauth_grocy_sf
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
---
