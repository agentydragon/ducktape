apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "false"
    name: claude-session-sync
  name: claude-session-sync
spec: {}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: claude-session-sync
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    description: Events of every Claude Code cloud session, mirrored by claude-session-sync. Once the sessions age out of Anthropic's API this may be the only copy.
  name: claude-session-sync-db
  namespace: claude-session-sync
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: claude_sessions
      owner: claude_sessions
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  monitoring:
    enablePodMonitor: true
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 40Gi
    storageClass: local-path-ovh-hdd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-session-sync-data
  namespace: claude-session-sync
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: seaweedfs-ovh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Serves the owner-authenticated Claude session page and proxies controls to the credential owner.
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/name: claude-session-sync
  name: claude-session-sync
  namespace: claude-session-sync
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: claude-session-sync
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/name: claude-session-sync
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - web
          env:
            - name: SESSION_SYNC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: claude-session-sync-db-app
            - name: SESSION_SYNC_PUBLIC_BASE_URL
              value: https://claude-session-sync.allegedly.works
            - name: SESSION_SYNC_CONTROL_BASE_URL
              value: http://claude-session-sync-control.claude-session-sync.svc:8080
            - name: SESSION_SYNC_PORT
              value: "8080"
            - name: SESSION_SYNC_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  key: SESSION_SYNC_OIDC_ISSUER
                  name: claude-session-sync-oidc
            - name: SESSION_SYNC_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: SESSION_SYNC_OIDC_CLIENT_ID
                  name: claude-session-sync-oidc
            - name: SESSION_SYNC_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: SESSION_SYNC_OIDC_CLIENT_SECRET
                  name: claude-session-sync-oidc
            - name: SESSION_SYNC_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: SESSION_SYNC_OIDC_SESSION_SECRET
                  name: claude-session-sync-oidc
            - name: SESSION_SYNC_OIDC_ALLOWED_SUBJECT
              valueFrom:
                secretKeyRef:
                  key: SESSION_SYNC_OIDC_ALLOWED_SUBJECT
                  name: claude-session-sync-oidc
          image: git.allegedly.works/ducktape-ci/claude-session-sync:unset
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          name: claude-session-sync
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Owns the rotating Claude OAuth credential, pairing flow, polling cycle, and live API streams.
  labels:
    app.kubernetes.io/component: control
    app.kubernetes.io/name: claude-session-sync-control
  name: claude-session-sync-control
  namespace: claude-session-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: control
      app.kubernetes.io/name: claude-session-sync-control
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control
        app.kubernetes.io/name: claude-session-sync-control
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - control
          env:
            - name: SESSION_SYNC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: claude-session-sync-db-app
            - name: SESSION_SYNC_CREDENTIALS_FILE
              value: /data/credentials.json
            - name: SESSION_SYNC_PORT
              value: "8080"
          image: git.allegedly.works/ducktape-ci/claude-session-sync:unset
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          name: claude-session-sync-control
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - mountPath: /data
              name: data
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: claude-session-sync-data
---
apiVersion: v1
kind: Service
metadata:
  name: claude-session-sync
  namespace: claude-session-sync
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/component: web
    app.kubernetes.io/name: claude-session-sync
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: claude-session-sync-control
  namespace: claude-session-sync
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/component: control
    app.kubernetes.io/name: claude-session-sync-control
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claude-session-sync
  namespace: claude-session-sync
spec:
  hostnames:
    - claude-session-sync.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: claude-session-sync
          port: 8080
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    description: The Gateway may reach the page. Web Pods may reach Authentik, the database, and the private control Service.
  name: web
  namespace: claude-session-sync
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - auth.allegedly.works
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: claude-session-sync-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: control
            app.kubernetes.io/name: claude-session-sync-control
            k8s:io.kubernetes.pod.namespace: claude-session-sync
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: web
      app.kubernetes.io/name: claude-session-sync
      k8s:io.kubernetes.pod.namespace: claude-session-sync
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    description: Only web Pods may call the single Claude credential and sync control process.
  name: control
  namespace: claude-session-sync
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.anthropic.com
        - matchName: platform.claude.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - api.anthropic.com
            - platform.claude.com
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: claude-session-sync-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: control
      app.kubernetes.io/name: claude-session-sync-control
      k8s:io.kubernetes.pod.namespace: claude-session-sync
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: web
            app.kubernetes.io/name: claude-session-sync
            k8s:io.kubernetes.pod.namespace: claude-session-sync
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
