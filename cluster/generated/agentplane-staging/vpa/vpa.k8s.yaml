apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: actions
  namespace: agentplane-staging
spec:
  resourcePolicy:
    containerPolicies:
      - containerName: actions
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsOnly
        maxAllowed:
          memory: 160Mi
        minAllowed:
          memory: 128Mi
      - containerName: "*"
        mode: "Off"
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: actions
  updatePolicy:
    updateMode: Initial
---
