apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: initial
  name: kube-system
spec: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cilium-operator
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      io.cilium/app: operator
      name: cilium-operator
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: audit-direct-workload-writes
spec:
  failurePolicy: Ignore
  matchConditions:
    - expression: "!(request.namespace in ['kube-system', 'kyverno', 'flux-system', 'kube-public', 'kube-node-lease'])"
      name: application-namespace
    - expression: "!(request.userInfo.username in ['system:serviceaccount:flux-system:kustomize-controller', 'system:serviceaccount:flux-system:helm-controller', 'system:serviceaccount:flux-system:source-controller', 'system:serviceaccount:flux-system:haku-state-reconciler', 'system:serviceaccount:kyverno:kyverno-admission-controller', 'system:serviceaccount:monitoring:monitoring-operator', 'system:serviceaccount:monitoring:grafana-operator', 'system:serviceaccount:seaweedfs:seaweedfs-operator', 'system:serviceaccount:authentik:authentik', 'system:serviceaccount:kube-system:reloader-reloader']) && !(request.namespace == 'crossplane-system' && request.userInfo.username == 'system:serviceaccount:crossplane-system:crossplane') && !('system:nodes' in request.userInfo.?groups.orValue([]))"
      name: direct-writer
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - daemonsets
          - deployments
          - statefulsets
        scope: Namespaced
  validations:
    - expression: "false"
      message: Workload write outside the known GitOps and operator paths.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: audit-direct-workload-writes
spec:
  policyName: audit-direct-workload-writes
  validationActions:
    - Audit
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hubble-ui-ingress
  namespace: kube-system
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              app.kubernetes.io/component: server
              app.kubernetes.io/name: authentik
      ports:
        - port: 8081
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gatus
      ports:
        - port: 8081
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hubble-ui
  policyTypes:
    - Ingress
