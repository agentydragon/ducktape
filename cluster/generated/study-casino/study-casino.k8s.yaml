apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "false"
    name: study-casino
    rbac.ducktape.io/agent-readable-logs: "true"
  name: study-casino
spec: {}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    description: CNPG Postgres for study-casino state.
  name: study-casino-db
  namespace: study-casino
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/region: hil
    podAntiAffinityType: required
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: studycasino
      owner: studycasino
  instances: 3
  managed:
    roles:
      - comment: Read-only access for sandbox agents; object GRANTs come from the db-readonly-provisioner Job.
        ensure: present
        login: true
        name: study_casino_ro
        passwordSecret:
          name: study-casino-db-ro
  monitoring:
    enablePodMonitor: true
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: study-casino-db
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 1Gi
    storageClass: local-path-ovh-ssd
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for study-casino/study-casino-db.
  name: study-casino-db-backups
  namespace: study-casino
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: study-casino-db-backups
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: study-casino-db-backups
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for study-casino/study-casino-db.
  name: study-casino-db-backups
  namespace: study-casino
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: study-casino-db-backups
  namespace: study-casino
spec:
  identityRef:
    name: study-casino-db-backups
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: study-casino-db-backups-s3-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  annotations:
    description: SeaweedFS S3 destination for study-casino/study-casino-db base backups and WAL.
  name: study-casino-db
  namespace: study-casino
spec:
  configuration:
    data:
      compression: gzip
    destinationPath: s3://study-casino-db-backups/
    endpointURL: http://seaweedfs-s3.seaweedfs.svc:8333
    s3Credentials:
      accessKeyId:
        key: AWS_ACCESS_KEY_ID
        name: study-casino-db-backups-s3-credentials
      secretAccessKey:
        key: AWS_SECRET_ACCESS_KEY
        name: study-casino-db-backups-s3-credentials
    wal:
      compression: gzip
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: study-casino-db
  namespace: study-casino
spec:
  backupOwnerReference: self
  cluster:
    name: study-casino-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 27 1 * * *
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: study-casino-db-ro-generator
  namespace: study-casino
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: study-casino-db-ro
  namespace: study-casino
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: study-casino-db-ro-generator
  refreshInterval: 8760h
  target:
    name: study-casino-db-ro
    template:
      data:
        DATABASE_URL: postgresql://study_casino_ro:{{ .password }}@study-casino-db-rw.study-casino.svc:5432/studycasino
        dbname: studycasino
        host: study-casino-db-rw.study-casino.svc
        password: "{{ .password }}"
        port: "5432"
        username: study_casino_ro
      metadata:
        annotations:
          description: Read-only Postgres credentials for sandbox agents. CNPG sets the study_casino_ro password from this Secret; Reflector mirrors it into claude-sandbox.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: claude-sandbox
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: claude-sandbox
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    description: Applies the read-only object GRANTs for study_casino_ro. The role itself is managed declaratively by CNPG (Cluster.spec.managed.roles).
    kustomize.toolkit.fluxcd.io/force: enabled
  name: db-readonly-provisioner
  namespace: study-casino
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: study-casino-db-readonly-provisioner
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - |
              set -x
              echo "PGUSER=${PGUSER:-<unset>}"
              echo "PGHOST=${PGHOST:-<unset>}"
              echo "PGDATABASE=${PGDATABASE:-<unset>}"
              echo "PGPASSWORD set: ${PGPASSWORD:+yes}"
              exec psql \
                --set=ON_ERROR_STOP=1 \
                -f /sql/readonly-role.sql
          command:
            - /bin/bash
            - -c
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: study-casino-db-app
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: study-casino-db-app
            - name: PGHOST
              value: study-casino-db-rw.study-casino.svc
            - name: PGDATABASE
              value: studycasino
          image: ghcr.io/cloudnative-pg/postgresql:18.6
          name: psql
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - mountPath: /sql
              name: sql
              readOnly: true
      nodeSelector:
        topology.kubernetes.io/region: hil
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - configMap:
            name: study-casino-db-readonly-sql
          name: sql
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: study-casino
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Habit-tracking casino app. Serves PWA + /sync endpoint with OIDC auth (Authorization Code flow, confidential client). State lives in CNPG Postgres (study-casino-db).
  labels:
    app.kubernetes.io/name: study-casino
  name: study-casino
  namespace: study-casino
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: study-casino
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: study-casino
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
              weight: 100
      automountServiceAccountToken: false
      containers:
        - env:
            - name: STUDY_CASINO_IMAGE_TAG
              value: unset
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: study-casino-db-app
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: study-casino-db-app
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: study-casino-db-app
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: study-casino-db-app
            - name: PG_DBNAME
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: study-casino-db-app
            - name: STUDY_CASINO_DATABASE_URL
              value: postgresql+psycopg://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/$(PG_DBNAME)
            - name: STUDY_CASINO_ADMIN_USERS
              value: agentydragon
            - name: STUDY_CASINO_OIDC_ISSUER
              value: https://auth.allegedly.works/application/o/study-casino/
            - name: STUDY_CASINO_OIDC_CLIENT_ID
              value: study-casino
            - name: STUDY_CASINO_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: oidc_client_secret
                  name: study-casino-oidc
            - name: STUDY_CASINO_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: session_secret
                  name: study-casino-oidc
            - name: STUDY_CASINO_RNG_SECRET
              valueFrom:
                secretKeyRef:
                  key: rng_secret
                  name: study-casino-oidc
            - name: STUDY_CASINO_RNG_KEY_ID
              value: study-casino-rng-v1
          image: git.allegedly.works/ducktape-ci/study-casino:unset
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          name: app
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/region: hil
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
---
apiVersion: v1
kind: Service
metadata:
  name: study-casino
  namespace: study-casino
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: study-casino
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: study-casino
  namespace: study-casino
spec:
  hostnames:
    - casino.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: study-casino
          port: 8080
      filters:
        - responseHeaderModifier:
            set:
              - name: Cache-Control
                value: public, max-age=31536000, immutable
          type: ResponseHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /fonts/
    - backendRefs:
        - name: study-casino
          port: 8080
      filters:
        - responseHeaderModifier:
            set:
              - name: Cache-Control
                value: public, max-age=31536000, immutable
          type: ResponseHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /assets/
    - backendRefs:
        - name: study-casino
          port: 8080
      filters:
        - responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-store
          type: ResponseHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-secrets-reader
  namespace: study-casino
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:kubectl-sandbox-users
