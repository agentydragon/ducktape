apiVersion: v1
kind: Namespace
metadata:
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: '{"containerPolicies": [{"containerName": "external-secrets", "controlledValues": "RequestsOnly", "minAllowed": {"memory": "256Mi", "cpu": "100m"}, "maxAllowed": {"memory": "384Mi", "cpu": "100m"}, "controlledResources": ["memory"]}, {"containerName": "webhook", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "15m", "memory": "256Mi"}, "maxAllowed": {"cpu": "100m", "memory": "384Mi"}, "controlledResources": ["cpu", "memory"]}, {"containerName": "*", "controlledValues": "RequestsOnly", "mode": "Off"}]}'
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: initial
  name: external-secrets-system
spec: {}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: external-secrets-selfsigned-issuer
  namespace: external-secrets-system
spec:
  selfSigned: {}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets-system
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets-system
spec:
  chart:
    spec:
      chart: external-secrets
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets-system
      version: 2.10.0
  install:
    remediation:
      retries: 3
  interval: 15m
  values:
    certController:
      create: false
    concurrent: 8
    deploymentAnnotations:
      goldilocks.fairwinds.com/vpa-update-mode: auto
    installCRDs: false
    leaderElect: true
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    priorityClassName: system-cluster-critical
    readinessProbe:
      enabled: true
    replicaCount: 2
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    serviceAccount:
      create: true
      name: external-secrets
    serviceMonitor:
      enabled: true
      namespace: monitoring
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    webhook:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: external-secrets
                  app.kubernetes.io/name: external-secrets-webhook
              topologyKey: kubernetes.io/hostname
      certManager:
        cert:
          issuerRef:
            group: cert-manager.io
            kind: Issuer
            name: external-secrets-selfsigned-issuer
        enabled: true
      create: true
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      port: 9443
      priorityClassName: system-cluster-critical
      replicaCount: 2
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-cluster-secret-store-namespaces
spec:
  failurePolicy: Fail
  matchConditions:
    - expression: "!('system:nodes' in request.userInfo.groups)"
      name: exclude-kubelets
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups:
          - external-secrets.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - clustersecretstores
        scope: Cluster
  validations:
    - expression: object.spec.?conditions.orValue([]).exists(c, c.?namespaces.orValue([]).size() > 0) || (request.operation == 'UPDATE' && !oldObject.spec.?conditions.orValue([]).exists(c, c.?namespaces.orValue([]).size() > 0))
      message: ClusterSecretStore must name at least one allowed namespace in spec.conditions[].namespaces.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-cluster-secret-store-namespaces
spec:
  policyName: require-cluster-secret-store-namespaces
  validationActions:
    - Deny
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-secret-store-audit
  namespace: external-secrets-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-secret-store-audit
rules:
  - apiGroups:
      - external-secrets.io
    resources:
      - clustersecretstores
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-secret-store-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-secret-store-audit
subjects:
  - kind: ServiceAccount
    name: cluster-secret-store-audit
    namespace: external-secrets-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-secret-store-audit
  namespace: external-secrets-system
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      annotations:
        goldilocks.fairwinds.com/vpa-update-mode: "off"
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: true
          containers:
            - command:
                - python
                - -B
                - -c
                - |
                  """Read-only audit of stored ClusterSecretStores. This file runs with stdlib only."""

                  from __future__ import annotations

                  import json
                  import ssl
                  import sys
                  from collections.abc import Callable
                  from pathlib import Path
                  from typing import Any
                  from urllib.parse import urlencode
                  from urllib.request import Request, urlopen

                  _CREDENTIALS = Path("/var/run/secrets/kubernetes.io/serviceaccount")
                  _STORE_API = "https://kubernetes.default.svc/apis/external-secrets.io/v1/clustersecretstores"


                  def audit(fetch_page: Callable[[str], dict[str, Any]]) -> int:
                      invalid = []
                      total = 0
                      continuation = ""
                      try:
                          while True:
                              page = fetch_page(continuation)
                              for store in page["items"]:
                                  total += 1
                                  conditions = store["spec"].get("conditions") or []
                                  if not any(condition and condition.get("namespaces") for condition in conditions):
                                      invalid.append(store["metadata"]["name"])
                              continuation = page["metadata"].get("continue", "")
                              if not continuation:
                                  break
                      except (OSError, ValueError, KeyError, TypeError) as error:
                          print(f"ClusterSecretStore audit could not complete ({type(error).__name__}).", file=sys.stderr)
                          return 2
                      for name in sorted(invalid):
                          print(f"ClusterSecretStore {name} has no explicit consumer namespace.", file=sys.stderr)
                      print(f"Checked {total} ClusterSecretStores. Violations: {len(invalid)}.")
                      return int(bool(invalid))


                  def _fetch_page(continuation: str) -> dict[str, Any]:
                      token = (_CREDENTIALS / "token").read_text().strip()
                      context = ssl.create_default_context(cafile=str(_CREDENTIALS / "ca.crt"))
                      query = urlencode({"limit": 25, "continue": continuation})
                      request = Request(f"{_STORE_API}?{query}", headers={"Authorization": f"Bearer {token}"})
                      with urlopen(request, context=context, timeout=10) as response:
                          page: dict[str, Any] = json.load(response)
                          return page


                  if __name__ == "__main__":
                      raise SystemExit(audit(_fetch_page))
              image: python:3.14-alpine@sha256:601e99e090cb08c2784a42395487709500bc39930307fe72f3f11a8f3c430762
              name: audit
              resources:
                limits:
                  memory: 128Mi
                requests:
                  cpu: 25m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
          nodeSelector:
            topology.kubernetes.io/zone: hil-ovh
          restartPolicy: Never
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: cluster-secret-store-audit
  schedule: "*/30 * * * *"
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
