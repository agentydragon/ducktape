apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: auto
    rbac.ducktape.io/agent-readable-logs: "true"
  name: gatus
spec: {}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gatus-db
  namespace: gatus
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: gatus
      owner: gatus
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  monitoring:
    enablePodMonitor: true
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: gatus-db
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    resizeInUseVolumes: false
    size: 2Gi
    storageClass: piraeus-ssd-local
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for gatus/gatus-db.
  name: gatus-db-backups
  namespace: gatus
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: gatus-db-backups
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: gatus-db-backups
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for gatus/gatus-db.
  name: gatus-db-backups
  namespace: gatus
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: gatus-db-backups
  namespace: gatus
spec:
  identityRef:
    name: gatus-db-backups
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: gatus-db-backups-s3-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  annotations:
    description: SeaweedFS S3 destination for gatus/gatus-db base backups and WAL.
  name: gatus-db
  namespace: gatus
spec:
  configuration:
    data:
      compression: gzip
    destinationPath: s3://gatus-db-backups/
    endpointURL: http://seaweedfs-s3.seaweedfs.svc:8333
    s3Credentials:
      accessKeyId:
        key: AWS_ACCESS_KEY_ID
        name: gatus-db-backups-s3-credentials
      secretAccessKey:
        key: AWS_SECRET_ACCESS_KEY
        name: gatus-db-backups-s3-credentials
    wal:
      compression: gzip
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gatus-db
  namespace: gatus
spec:
  backupOwnerReference: self
  cluster:
    name: gatus-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 23 4 * * *
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
data:
  config.yaml: |
    metrics: true
    security:
      oidc:
        issuer-url: https://auth.allegedly.works/application/o/gatus/
        redirect-url: https://status.allegedly.works/authorization-code/callback
        client-id: gatus
        client-secret: ${GATUS_CLIENT_SECRET}
        scopes:
          - openid
    storage:
      type: postgres
      path: ${GATUS_DB_URI}
    endpoints:
      - name: Website
        group: core
        url: https://www.allegedly.works
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Forgejo
        group: core
        url: https://git.allegedly.works/api/v1/version
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Grafana
        group: core
        url: https://grafana.allegedly.works/api/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Authentik login page
        group: sso
        url: https://auth.allegedly.works
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Authentik liveness
        group: sso
        url: http://authentik-server.authentik.svc.cluster.local:80/-/health/live/
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Matrix SSO
        group: sso
        url: https://matrix.allegedly.works/_matrix/client/v3/login
        interval: 120s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].flows[0].type == m.login.sso"
      - name: Ollama
        group: ai
        url: http://ollama.ollama.svc.cluster.local:11434/api/tags
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: LiteLLM
        group: ai
        url: http://litellm.litellm.svc.cluster.local:4000/health/liveliness
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: LiteLLM inference
        enabled: false
        group: ai
        url: http://litellm.litellm.svc.cluster.local:4000/v1/chat/completions
        method: POST
        headers:
          Content-Type: application/json
          Authorization: Bearer ${LITELLM_API_KEY}
        body: |
          {
            "model": "ollama/oai-chat/gpt-oss-20b-128k",
            "messages": [{"role": "user", "content": "Respond with exactly the number that equals 5 times 7"}],
            "max_tokens": 1000
          }
        interval: 30m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].choices[0].message.content == pat(*35*)"
      - name: Langfuse
        group: ai
        url: http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Matrix/Synapse
        group: comms
        url: http://matrix-synapse.matrix.svc.cluster.local:8008/_matrix/client/versions
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Element
        group: comms
        url: https://chat.allegedly.works
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Loki write
        group: cluster
        url: http://loki-write.loki.svc.cluster.local:3100/ready
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Loki read
        group: cluster
        url: http://loki-read.loki.svc.cluster.local:3100/ready
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Loki labels API
        group: cluster
        url: http://loki-read.loki.svc.cluster.local:3100/loki/api/v1/labels
        interval: 120s
        conditions:
          - "[STATUS] == 200"
      - name: Mimir
        group: cluster
        url: http://mimir-gateway.monitoring.svc.cluster.local/ready
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Hubble UI
        group: cluster
        url: http://hubble-ui.kube-system.svc.cluster.local:80
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Headlamp
        group: cluster
        url: http://headlamp.headlamp.svc.cluster.local:80
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Nix Cache
        group: services
        url: https://cache.allegedly.works/public/nix-cache-info
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Proxmox proxy
        group: services
        url: http://proxmox-proxy.proxmox-proxy.svc.cluster.local:8080
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Atuin
        group: services
        url: http://server.atuin.svc.cluster.local:8888
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Grocy SF
        group: services
        url: http://grocy.grocy-sf.svc.cluster.local:80/login
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: Grocy Vallejo
        group: services
        url: http://grocy.grocy-vallejo.svc.cluster.local:80/login
        interval: 60s
        conditions:
          - "[STATUS] == 200"
      - name: kubectl-passthrough-mcp
        group: services
        url: http://kubectl-passthrough-mcp.kubectl-passthrough-mcp.svc.cluster.local:8080/healthz
        interval: 60s
        conditions:
          - "[STATUS] == 200"
immutable: false
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: twin
  namespace: gatus
spec:
  interval: 24h
  url: https://twin.github.io/helm-charts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus
  namespace: gatus
immutable: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  chart:
    spec:
      chart: gatus
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: gatus
      version: 1.5.0
  install:
    strategy:
      name: RetryOnFailure
  interval: 15m
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    env:
      GATUS_DB_URI:
        valueFrom:
          secretKeyRef:
            key: uri
            name: gatus-db-app
      LITELLM_API_KEY:
        valueFrom:
          secretKeyRef:
            key: api-key
            name: litellm-master-key
    envFrom:
      - secretRef:
          name: gatus-oidc-secret
    externalConfigMap: gatus-config
    ingress:
      enabled: false
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    persistence:
      enabled: false
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 20m
        memory: 64Mi
    serviceMonitor:
      enabled: false
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress
  namespace: gatus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-visibility
  namespace: gatus
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - all
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
  namespace: gatus
spec:
  hostnames:
    - status.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: gatus
          port: 80
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gatus
  namespace: gatus
spec:
  endpoints:
    - path: /metrics
      port: http
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus
