apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: auto
    rbac.ducktape.io/agent-readable-logs: "true"
  name: gatus
spec: {}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gatus-db
  namespace: gatus
spec:
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: gatus
      owner: gatus
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  monitoring:
    enablePodMonitor: true
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: gatus-db
  probes:
    liveness:
      isolationCheck:
        enabled: false
  storage:
    size: 1Gi
    storageClass: local-path-ovh
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for gatus/gatus-db.
  name: gatus-db-backups
  namespace: gatus
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: gatus-db-backups
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: gatus-db-backups
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  annotations:
    description: Private CNPG physical backups and WAL archive for gatus/gatus-db.
  name: gatus-db-backups
  namespace: gatus
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: gatus-db-backups
  namespace: gatus
spec:
  identityRef:
    name: gatus-db-backups
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    accessKeyField: AWS_ACCESS_KEY_ID
    name: gatus-db-backups-s3-credentials
    secretKeyField: AWS_SECRET_ACCESS_KEY
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  annotations:
    description: SeaweedFS S3 destination for gatus/gatus-db base backups and WAL.
  name: gatus-db
  namespace: gatus
spec:
  configuration:
    data:
      compression: gzip
    destinationPath: s3://gatus-db-backups/
    endpointURL: http://seaweedfs-s3.seaweedfs.svc:8333
    s3Credentials:
      accessKeyId:
        key: AWS_ACCESS_KEY_ID
        name: gatus-db-backups-s3-credentials
      secretAccessKey:
        key: AWS_SECRET_ACCESS_KEY
        name: gatus-db-backups-s3-credentials
    wal:
      compression: gzip
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gatus-db
  namespace: gatus
spec:
  backupOwnerReference: self
  cluster:
    name: gatus-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: 0 23 4 * * *
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: twin
  namespace: gatus
spec:
  interval: 24h
  url: https://twin.github.io/helm-charts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus
  namespace: gatus
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  chart:
    spec:
      chart: gatus
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: gatus
      version: 1.5.0
  install:
    strategy:
      name: RetryOnFailure
  interval: 15m
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    env:
      GATUS_DB_URI:
        valueFrom:
          secretKeyRef:
            key: uri
            name: gatus-db-app
      LITELLM_API_KEY:
        valueFrom:
          secretKeyRef:
            key: api-key
            name: litellm-master-key
    envFrom:
      - secretRef:
          name: gatus-oidc-secret
    externalConfigMap: gatus-config
    ingress:
      enabled: false
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    persistence:
      enabled: false
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 20m
        memory: 64Mi
    serviceMonitor:
      enabled: false
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress
  namespace: gatus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-visibility
  namespace: gatus
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - all
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
  namespace: gatus
spec:
  hostnames:
    - status.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: gatus
          port: 80
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gatus
  namespace: gatus
spec:
  endpoints:
    - path: /metrics
      port: http
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus
