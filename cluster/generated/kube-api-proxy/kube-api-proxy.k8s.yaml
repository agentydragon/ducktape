apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    description: |
      HTTPRoute for the Kubernetes API at kubeapi.allegedly.works. The Cilium
      Gateway terminates the wildcard LE cert at the `https-wildcard` listener,
      then forwards to the `kubeapi-proxy` nginx pod which re-encrypts to the
      apiserver over HTTPS (Cilium doesn't support backend TLS natively).

      Purpose: works through Claude Code web's L7 TLS-terminating egress proxy,
      which rejects the cluster-CA-signed cert that api.allegedly.works presents
      on the direct API endpoint (:6443). See ../docs/lessons_learned/ for the full story.
      Auth is bearer-JWT only (client certs die at the MITM boundary; see the
      kubeconfig.py docstring in devinfra/k8s/kubeconfig.py).
  name: kubeapi-allegedly-works
  namespace: default
spec:
  hostnames:
    - kubeapi.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  rules:
    - backendRefs:
        - name: kubeapi-proxy
          port: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeapi-proxy-config
  namespace: default
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes 1;
    error_log /dev/stderr warn;
    events { worker_connections 128; }
    http {
      access_log /dev/stderr;
      # kubectl exec/attach/port-forward open an HTTP Upgrade (WebSocket/SPDY) to
      # the apiserver. By default nginx proxies as HTTP/1.0 and strips the hop-by-hop
      # Upgrade/Connection headers, so the apiserver receives a plain GET to /exec and
      # returns 400 "Upgrade request required". The map + directives below fix that.
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }
      server {
        listen 8080;
        location / {
          proxy_pass https://kubernetes.default.svc:443;
          proxy_ssl_verify on;
          proxy_ssl_trusted_certificate /var/run/secrets/kubernetes.io/serviceaccount/ca.crt;
          proxy_ssl_server_name on;
          proxy_ssl_name kubernetes.default.svc;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          # Pass through all headers including Authorization
          proxy_pass_request_headers on;
          # WebSocket/SPDY upgrade for kubectl exec/attach/port-forward:
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: |
      nginx reverse proxy: HTTP 8080 → HTTPS kubernetes.default.svc:443.
      Bridges the gap between Cilium Gateway (TLS terminate) and the
      apiserver (requires HTTPS). Used by kubeapi.allegedly.works route.
    reloader.stakater.com/auto: "true"
  name: kubeapi-proxy
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubeapi-proxy
  template:
    metadata:
      labels:
        app: kubeapi-proxy
    spec:
      automountServiceAccountToken: true
      containers:
        - image: nginxinc/nginx-unprivileged:1.31-alpine
          name: nginx
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: config
              readOnly: true
              subPath: nginx.conf
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/cache/nginx
              name: cache
      volumes:
        - configMap:
            name: kubeapi-proxy-config
          name: config
        - emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          name: tmp
        - emptyDir:
            medium: Memory
            sizeLimit: 8Mi
          name: cache
---
apiVersion: v1
kind: Service
metadata:
  name: kubeapi-proxy
  namespace: default
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: kubeapi-proxy
