apiVersion: v1
kind: Namespace
metadata:
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: '{"containerPolicies": [{"containerName": "gc", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "10m", "memory": "128Mi"}, "maxAllowed": {"cpu": "25m", "memory": "256Mi"}, "controlledResources": ["cpu", "memory"]}, {"containerName": "master", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "100m", "memory": "128Mi"}, "maxAllowed": {"cpu": "150m", "memory": "256Mi"}, "controlledResources": ["cpu", "memory"]}, {"containerName": "worker", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "5m", "memory": "96Mi"}, "maxAllowed": {"cpu": "100m", "memory": "128Mi"}, "controlledResources": ["cpu", "memory"]}, {"containerName": "*", "controlledValues": "RequestsOnly", "mode": "Off"}]}'
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: initial
    pod-security.kubernetes.io/enforce: privileged
    rbac.ducktape.io/agent-readable-logs: "true"
  name: node-feature-discovery
spec: {}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nfd
  namespace: node-feature-discovery
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/node-feature-discovery/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: node-feature-discovery
spec:
  chart:
    spec:
      chart: node-feature-discovery
      sourceRef:
        kind: HelmRepository
        name: nfd
        namespace: node-feature-discovery
      version: 0.19.0
  install:
    remediation:
      retries: 3
  interval: 15m
  values:
    worker:
      config:
        sources:
          pci:
            deviceClassWhitelist:
              - "02"
              - "03"
            deviceLabelFields:
              - vendor
      tolerations:
        - effect: NoSchedule
          operator: Exists
