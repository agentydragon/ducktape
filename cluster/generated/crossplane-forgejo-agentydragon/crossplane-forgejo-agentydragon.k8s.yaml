apiVersion: opentofu.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: crossplane-forgejo-agentydragon
spec:
  backendFile: |
    conn_str = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
    schema_name = "forgejo_agentydragon"
  configuration: |
    terraform {
      backend "pg" {}
    }
---
apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/external-name: default
  name: forgejo-agentydragon
spec:
  deletionPolicy: Orphan
  forProvider:
    env:
      - name: PGPASSWORD
        secretKeyRef:
          key: password
          name: tofu-state-db-credentials
          namespace: flux-system
    module: git::https://github.com/agentydragon/ducktape.git//tf/gitops/forgejo-agentydragon?ref=devel
    planArgs:
      - -lock-timeout=5m
    remotePullPolicy: Always
    source: Remote
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    name: crossplane-forgejo-agentydragon
