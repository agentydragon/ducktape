apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    description: "Haku's own compute identity in haku-sandbox — carried by whatever Haku workload runs here: the sandbox exec-target pods the provisioning MCP hands out (cluster/k8s/haku/workspaces/) and the managed-agent worker (haku/runtime/managed_agent/self_hosted/deploy/). Bound to haku-sandbox-admin (full CRUD in this namespace) by rolebinding-haku.yaml, so `kubectl` works out of the box. Deliberately NOT tied to one runtime — it's Haku operating its own compute; the exec-target pods don't run an agent harness. cluster-diagnostics read is a follow-up."
  name: haku
  namespace: haku-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    description: "Full CRUD within the haku-sandbox compute sandbox (mirrors claude-sandbox-admin): pods/log/exec/attach, services, configmaps, secrets, PVCs, events, plus apps and batch workloads. The namespace is network-isolated behind its own mitmproxy; secrets here are still expected to hold only read-only credentials Haku may fully use. Security model: haku/docs/security.md."
  name: haku-sandbox-admin
  namespace: haku-sandbox
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/attach
      - pods/portforward
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - events
    verbs:
      - "*"
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - "*"
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haku
  namespace: haku-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haku-sandbox-admin
subjects:
  - kind: ServiceAccount
    name: haku
    namespace: haku-sandbox
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: haku:access-profile:haku
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    description: 'Binds haku-sandbox-admin to the OIDC group oidc-ksbx-groups:haku — the group kube-apiserver derives from the Authentik haku-client-credentials JWT (groups: ["haku"]). This is how the Haku background-agent routine drives its own sandbox namespace.'
  name: haku-oidc-secret-reader
  namespace: haku-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haku-sandbox-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:haku
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: haku-sandbox-quota
  namespace: haku-sandbox
spec:
  hard:
    configmaps: "30"
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "18"
    pods: "20"
    requests.cpu: "8"
    requests.memory: 16Gi
    requests.storage: 140Gi
    services: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: haku-sandbox-limits
  namespace: haku-sandbox
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 10m
        memory: 16Mi
      type: Container
    - max:
        cpu: "4"
        memory: 8Gi
      type: Pod
