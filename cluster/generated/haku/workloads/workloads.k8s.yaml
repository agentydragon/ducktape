apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  annotations:
    description: Haku's own state repo (internal Forgejo, plaintext HTTP). Source for the haku-state-workloads Kustomization, which reconciles Haku-authored manifests under k8s/ into haku-sandbox. Read-only pull; basic-auth via the haku-forgejo-git Secret (the only creds available — Flux never pushes).
  name: haku-state
  namespace: flux-system
spec:
  interval: 5m
  ref:
    branch: main
  secretRef:
    name: haku-forgejo-git
  url: http://forgejo-http.forgejo:3000/haku/haku-state.git
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    description: Impersonation identity for the haku-state-workloads Kustomization. Lives in flux-system (kustomize-controller impersonates SAs in the Kustomization's own namespace); its only grant is the haku-state-workload-deployer Role in haku-sandbox.
  name: haku-state-reconciler
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    description: "What Flux may apply when reconciling Haku's haku-state k8s/ dir — the workload subset of haku-sandbox-admin: Deployments/StatefulSets/DaemonSets/ReplicaSets, Services/ConfigMaps/PVCs, Jobs/CronJobs, plus its own Flux image automation (image.toolkit ImageRepository/ImagePolicy/ImageUpdateAutomation + source.toolkit GitRepository). Those are bounded — the controllers that reconcile them only ever touch Haku's own images + haku-state. Deliberately NOT secrets (no plaintext-git secrets), NOT Gateway-API routes (Kyverno denies those too), and NOT notification.toolkit Receivers (a cross-namespace force-reconcile primitive — kept operator-owned, see cluster/generated/haku/ui-image-webhook). So Haku's GitOps path can run + ship its own workloads but never widen its own perimeter."
  name: haku-state-workload-deployer
  namespace: haku-sandbox
rules:
  - apiGroups:
      - ""
    resources:
      - services
      - configmaps
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - image.toolkit.fluxcd.io
    resources:
      - imagerepositories
      - imagepolicies
      - imageupdateautomations
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haku-state-workload-deployer
  namespace: haku-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haku-state-workload-deployer
subjects:
  - kind: ServiceAccount
    name: haku-state-reconciler
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    description: Reconciles Haku-authored workload manifests (haku-state k8s/) into haku-sandbox. Impersonates the constrained haku-state-reconciler SA, so it may apply only what that SA's Role allows (Deployments/Services/ConfigMaps/Jobs/CronJobs/PVCs in haku-sandbox — no Secrets, no routes). Until Haku seeds k8s/ this is NotReady (path not found); that is expected pre-first-run.
  name: haku-state-workloads
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s
  prune: true
  retryInterval: 1m
  serviceAccountName: haku-state-reconciler
  sourceRef:
    kind: GitRepository
    name: haku-state
  targetNamespace: haku-sandbox
  timeout: 5m
  wait: false
