apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: haku-sandbox
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-flux-system-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: activitywatch-read-token
  namespace: haku-sandbox
spec:
  data:
    - remoteRef:
        key: activitywatch-read-token
        property: token
      secretKey: token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-activitywatch-secret-store
  target:
    name: activitywatch-read-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coinbase-api-credentials
  namespace: haku-sandbox
spec:
  data:
    - remoteRef:
        key: coinbase-api-credentials
        property: api_key
      secretKey: api_key
    - remoteRef:
        key: coinbase-api-credentials
        property: api_secret
      secretKey: api_secret
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    name: haku-sandbox-coinbase-api-credentials
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-secret-reader
  namespace: haku-sandbox
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haku-sandbox-haku-forgejo-git-reader
  namespace: forgejo
rules:
  - apiGroups:
      - ""
    resourceNames:
      - haku-forgejo-git
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haku-sandbox-haku-forgejo-git-reader
  namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haku-sandbox-haku-forgejo-git-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: forgejo-secret-reader
    namespace: haku-sandbox
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-haku-sandbox-haku-forgejo-git-secret-store
spec:
  conditions:
    - namespaces:
        - haku-sandbox
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: forgejo-secret-reader
      remoteNamespace: forgejo
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-forgejo-git
  namespace: haku-sandbox
spec:
  dataFrom:
    - extract:
        key: haku-forgejo-git
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-haku-sandbox-haku-forgejo-git-secret-store
  target:
    creationPolicy: Owner
    name: haku-forgejo-git
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: haku-egress-proxy,flux-system,agentplane-index
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: haku-egress-proxy,flux-system,agentplane-index
---
apiVersion: rbac.authorization.k8s.io/v1
