apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  annotations:
    description: Filtered checkout of the metal tofu root, its module tree, the SOPS secrets it reads and nebula-mesh.json, for the infra-drift plan-only Terraform CR.
  name: infra-drift-source
  namespace: flux-system
spec:
  ignore: |
    /*
    !/nebula-mesh.json
    # data.sops_file.ovh_{credentials,rescue_ssh} and, if -target ever stops
    # pruning them, the nebula certs under secrets/nebula/. Ciphertext only.
    !/secrets
    !/cluster
    /cluster/*
    !/cluster/terraform
    # Every file()-family call in the root, wherever it sits: -target does not
    # prune configuration evaluation. talos-cloud-controller-manager for
    # talos-ccm.tf's locals, flux-system for null_resource.flux_bootstrap's
    # triggers. The rest of cluster/{k8s,generated} (10 MB) reads nothing.
    !/cluster/generated
    /cluster/generated/*
    !/cluster/generated/talos-cloud-controller-manager
    !/cluster/k8s
    /cluster/k8s/*
    !/cluster/k8s/flux
    /cluster/k8s/flux/*
    !/cluster/k8s/flux/flux-system
    # module "wyrm2_image": `tofu init` installs every module block in the
    # config, whether or not -target keeps it in the plan graph.
    !/terraform
    /terraform/*
    !/terraform/modules
  interval: 10m
  ref:
    branch: devel
  url: https://github.com/agentydragon/ducktape.git
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  annotations:
    description: Plan-only drift watch on cluster/terraform/main (the metal root). Never applies; `bazel run //cluster:bootstrap` remains the apply path.
  name: infra-drift
  namespace: flux-system
spec:
  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "main"
      }
  interval: 6h
  path: ./cluster/terraform/main
  planOnly: true
  refreshBeforeApply: true
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: tofu-state-db-credentials
        - name: SOPS_AGE_KEY
          valueFrom:
            secretKeyRef:
              key: age.agekey
              name: sops-age-cluster-secrets
  serviceAccountName: tf-runner
  sourceRef:
    kind: GitRepository
    name: infra-drift-source
    namespace: flux-system
  storeReadablePlan: human
  targets:
    - ovh_dedicated_server.kimsufi
    - ovh_dedicated_server.kimsufi_cp
