apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "false"
    name: haku-ci
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    rbac.ducktape.io/agent-readable-logs: "true"
  name: haku-ci
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: haku-ci-force-proxy-egress
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "3000"
              protocol: TCP
            - port: "5000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: haku-egress-proxy
            k8s:io.kubernetes.pod.namespace: haku-egress-proxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - haku-ci
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haku-runner-config
  namespace: haku-ci
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 1
      timeout: 3600s
      shutdown_timeout: 1800s
      labels:
      - haku-ci:docker://catthehacker/ubuntu@sha256:c58e2b364da03b0c804c7d660f2ecbedf2f221a382b9baa0b344b0144780ff43
    container:
      docker_host: tcp://localhost:2375
      options: --add-host host.docker.internal:host-gateway -e DOCKER_HOST=tcp://host.docker.internal:2375
        -e HTTP_PROXY=http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
        -e HTTPS_PROXY=http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
        -e 'NO_PROXY=127.0.0.1,localhost,host.docker.internal,*.allegedly.works,.allegedly.works,forgejo-http.forgejo,forgejo-http.forgejo.svc.cluster.local,.forgejo,.svc.cluster.local,10.0.0.0/8'
        -e SSL_CERT_FILE=/egress-proxy-ca/ca-certificates.crt -e CURL_CA_BUNDLE=/egress-proxy-ca/ca-certificates.crt
        -e GIT_SSL_CAINFO=/egress-proxy-ca/ca-certificates.crt -e REQUESTS_CA_BUNDLE=/egress-proxy-ca/ca-certificates.crt
        -e NODE_EXTRA_CA_CERTS=/egress-proxy-ca/ca-certificates.crt -v /egress-proxy-ca/ca-certificates.crt:/egress-proxy-ca/ca-certificates.crt:ro
        -v /egress-proxy-ca/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
        -v /bazel-cache:/root/.cache
      valid_volumes:
      - /egress-proxy-ca/ca-certificates.crt
      - /bazel-cache
    cache:
      enabled: false
immutable: false
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: haku-ci-forgejo
  namespace: haku-ci
spec:
  secretTargetRef:
    - key: token
      name: haku-forgejo-tea
      parameter: token
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  labels:
    app.kubernetes.io/name: haku-runner
  name: haku-runner
  namespace: haku-ci
spec:
  failedJobsHistoryLimit: 5
  jobTargetRef:
    activeDeadlineSeconds: 4200
    backoffLimit: 0
    completions: 1
    parallelism: 1
    template:
      metadata:
        labels:
          app.kubernetes.io/name: haku-runner
      spec:
        automountServiceAccountToken: false
        containers:
          - args:
              - one-job
              - --wait
              - --config
              - /config/config.yaml
            command:
              - forgejo-runner
            env:
              - name: DOCKER_HOST
                value: tcp://localhost:2375
              - name: HTTP_PROXY
                value: http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
              - name: HTTPS_PROXY
                value: http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
              - name: NO_PROXY
                value: 127.0.0.1,localhost,host.docker.internal,*.allegedly.works,.allegedly.works,forgejo-http.forgejo,forgejo-http.forgejo.svc.cluster.local,.forgejo,.svc.cluster.local,10.0.0.0/8
              - name: SSL_CERT_FILE
                value: /egress-proxy-ca/ca-certificates.crt
              - name: CURL_CA_BUNDLE
                value: /egress-proxy-ca/ca-certificates.crt
              - name: GIT_SSL_CAINFO
                value: /egress-proxy-ca/ca-certificates.crt
              - name: REQUESTS_CA_BUNDLE
                value: /egress-proxy-ca/ca-certificates.crt
              - name: NODE_EXTRA_CA_CERTS
                value: /egress-proxy-ca/ca-certificates.crt
            image: code.forgejo.org/forgejo/runner:12.13.2
            name: runner
            resources:
              limits:
                cpu: "1"
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 128Mi
            volumeMounts:
              - mountPath: /config
                name: config
                readOnly: true
              - mountPath: /data
                name: runner-data
              - mountPath: /egress-proxy-ca
                name: egress-proxy-ca
                readOnly: true
        initContainers:
          - args:
              - register
              - --no-interactive
              - --ephemeral
              - --instance
              - http://forgejo-http.forgejo:3000
              - --token
              - $(RUNNER_TOKEN)
              - --name
              - $(RUNNER_NAME)
              - --labels
              - haku-ci:docker://catthehacker/ubuntu@sha256:c58e2b364da03b0c804c7d660f2ecbedf2f221a382b9baa0b344b0144780ff43
              - --config
              - /config/config.yaml
            command:
              - forgejo-runner
            env:
              - name: RUNNER_TOKEN
                valueFrom:
                  secretKeyRef:
                    key: token
                    name: haku-ci-runner-token
              - name: RUNNER_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
            image: code.forgejo.org/forgejo/runner:12.13.2
            name: register
            resources:
              limits:
                cpu: "1"
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 128Mi
            volumeMounts:
              - mountPath: /config
                name: config
                readOnly: true
              - mountPath: /data
                name: runner-data
          - args:
              - --host=tcp://0.0.0.0:2375
              - --tls=false
              - --registry-mirror=http://oci-cache.oci-cache.svc.cluster.local
              - --insecure-registry=oci-cache.oci-cache.svc.cluster.local
              - --dns-search=svc.cluster.local
            env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              - name: HTTP_PROXY
                value: http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
              - name: HTTPS_PROXY
                value: http://haku-egress-proxy.haku-egress-proxy.svc.cluster.local:8080
              - name: NO_PROXY
                value: 127.0.0.1,localhost,host.docker.internal,*.allegedly.works,.allegedly.works,forgejo-http.forgejo,forgejo-http.forgejo.svc.cluster.local,.forgejo,.svc.cluster.local,10.0.0.0/8
              - name: SSL_CERT_FILE
                value: /egress-proxy-ca/ca-certificates.crt
            image: docker:29-dind-rootless
            name: dind
            resources:
              limits:
                cpu: "3"
                memory: 6Gi
              requests:
                cpu: 200m
                memory: 512Mi
            restartPolicy: Always
            securityContext:
              privileged: true
              runAsGroup: 1000
              runAsUser: 1000
            startupProbe:
              failureThreshold: 90
              periodSeconds: 2
              tcpSocket:
                port: 2375
            volumeMounts:
              - mountPath: /var/lib/docker
                name: docker-data
              - mountPath: /egress-proxy-ca
                name: egress-proxy-ca
                readOnly: true
              - mountPath: /bazel-cache
                name: bazel-cache
        restartPolicy: Never
        terminationGracePeriodSeconds: 1830
        tolerations:
          - effect: NoSchedule
            key: node-role.kubernetes.io/roaming
            operator: Equal
            value: "true"
        topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: haku-runner
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
        volumes:
          - configMap:
              name: haku-runner-config
            name: config
          - emptyDir: {}
            name: runner-data
          - emptyDir: {}
            name: docker-data
          - emptyDir: {}
            name: bazel-cache
          - configMap:
              name: haku-egress-proxy-ca-cert
            name: egress-proxy-ca
  maxReplicaCount: 4
  pollingInterval: 15
  rollout:
    strategy: gradual
  successfulJobsHistoryLimit: 3
  triggers:
    - authenticationRef:
        name: haku-ci-forgejo
      metadata:
        address: http://forgejo-http.forgejo:3000
        labels: haku-ci
        owner: haku
        repo: haku-state
      type: forgejo-runner
