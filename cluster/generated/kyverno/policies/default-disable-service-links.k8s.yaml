apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: Sets enableServiceLinks to false on newly created Pods to prevent legacy Service environment variables from colliding with application settings.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Default Service Links off
  name: default-disable-service-links
spec:
  admission: true
  background: false
  rules:
    - match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
      mutate:
        patchStrategicMerge:
          spec:
            enableServiceLinks: false
      name: default-disable-service-links
