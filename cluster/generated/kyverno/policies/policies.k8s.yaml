apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Access Control
    policies.kyverno.io/description: |
      Restricts agent identities (claude-code-web user, kubectl-sandbox-users group) to only patching the reconcile.fluxcd.io/requestedAt annotation on Flux Kustomization resources. Changes to spec or any other annotation are blocked.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Kustomization
    policies.kyverno.io/title: Restrict Agent Kustomization Patches
  name: restrict-agent-kustomization-patch
spec:
  admission: true
  background: false
  rules:
    - match:
        any:
          - resources:
              kinds:
                - kustomize.toolkit.fluxcd.io/v1/Kustomization
              operations:
                - UPDATE
            subjects:
              - kind: User
                name: claude-code-web
          - resources:
              kinds:
                - kustomize.toolkit.fluxcd.io/v1/Kustomization
              operations:
                - UPDATE
            subjects:
              - kind: Group
                name: oidc-ksbx-groups:kubectl-sandbox-users
      name: only-reconcile-annotation
      validate:
        cel:
          expressions:
            - expression: object.spec == oldObject.spec
              message: Changes to spec are not permitted.
            - expression: |
                (!has(object.metadata.annotations) ||

                 object.metadata.annotations.all(k,
                   k == 'reconcile.fluxcd.io/requestedAt' ||
                   (has(oldObject.metadata.annotations) &&
                    k in oldObject.metadata.annotations &&
                    object.metadata.annotations[k] == oldObject.metadata.annotations[k])))
                && (!has(oldObject.metadata.annotations) ||

                 oldObject.metadata.annotations.all(k,
                   k == 'reconcile.fluxcd.io/requestedAt' ||
                   (has(object.metadata.annotations) &&
                    k in object.metadata.annotations &&
                    oldObject.metadata.annotations[k] == object.metadata.annotations[k])))
              message: Only the reconcile.fluxcd.io/requestedAt annotation may be changed.
        message: |
          Agent service accounts may only patch the reconcile.fluxcd.io/requestedAt annotation. Changes to spec or other annotations are not permitted.
  validationFailureAction: enforce
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Access Control
    policies.kyverno.io/description: "Blocks creation/modification of any Gateway API route (HTTPRoute, TLSRoute, TCPRoute, UDPRoute, GRPCRoute) or Gateway in the agent-writable sandbox namespaces (claude-sandbox, haku-sandbox). The public `cluster-gateway` listeners use `allowedRoutes.namespaces.from: All`, so without this fence an agent that gained `httproutes`/`gateways` RBAC could publish a route that attaches to the public gateway and bypasses the operator-owned Authentik proxy. Agents have no legitimate need to create routes — their sandbox Roles already omit these resources — so a blanket deny in those namespaces closes the latent hole structurally without touching any existing route (none live in a sandbox namespace). This denylist is preferred over per-listener `allowedRoutes` selectors because the public gateway's listener-level `allowedRoutes` is affected by Cilium bug #42159 (see cluster/docs/plan.md), and the Selector approach would require labeling the built-in `default` and `flux-system` namespaces that host critical routes. For Haku this is an enforcement inventory entry in haku/docs/security.md."
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: HTTPRoute, TLSRoute, TCPRoute, UDPRoute, GRPCRoute, Gateway
    policies.kyverno.io/title: Restrict Agent Gateway API Routes
  name: restrict-agent-gateway-routes
spec:
  admission: true
  background: false
  rules:
    - match:
        any:
          - resources:
              kinds:
                - HTTPRoute
                - GRPCRoute
                - TLSRoute
                - TCPRoute
                - UDPRoute
                - Gateway
              namespaces:
                - claude-sandbox
                - haku-sandbox
              operations:
                - CREATE
                - UPDATE
      name: deny-routes-in-agent-namespaces
      validate:
        deny: {}
        message: "Gateway API routes and Gateways may not be created in agent sandbox namespaces. Public ingress is operator-owned: route through the Authentik proxy (HTTPRoutes in the `authentik` namespace) instead. Resource: {{request.object.kind}}/{{request.object.metadata.name}}"
  validationFailureAction: enforce
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Access Control
    policies.kyverno.io/description: "A ClusterSecretStore with no `spec.conditions` is usable from every namespace in the cluster. That is not a mild default here: the ESO ServiceAccount holds cluster-wide secret read, so the store — not RBAC — is the only thing bounding what an ExternalSecret can pull out of the store's `remoteNamespace`. An unfenced `kubernetes-flux-system-secret-store` means any namespace can read the GitHub App, the PATs, the AWS Route 53 credentials and `ci-age-key`. This requires every store to name at least one namespace in `conditions[].namespaces`, which rejects the degenerate forms as well: an empty `conditions: []` (ESO treats it exactly like an absent one), a condition carrying no criteria at all, and a bare `namespaceSelector: {}` — an empty LabelSelector matches every namespace by the standard Kubernetes convention, so that one reads as a fence while being the widest setting available. Requiring an explicit list also rules out selector-based fences, which nothing here uses; relax it deliberately if that changes."
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ClusterSecretStore
    policies.kyverno.io/title: Require ClusterSecretStore Conditions
  name: require-secret-store-conditions
spec:
  admission: true
  background: true
  rules:
    - match:
        any:
          - resources:
              kinds:
                - ClusterSecretStore
              operations:
                - CREATE
                - UPDATE
      name: require-conditions
      validate:
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.conditions[].namespaces[] || `[]` | length(@) }}"
                operator: Equals
                value: 0
        message: "ClusterSecretStore must name the namespaces allowed to use it in spec.conditions[].namespaces; without at least one the store is readable from every namespace and the ESO ServiceAccount has cluster-wide secret read. Store: {{request.object.metadata.name}} (remoteNamespace {{request.object.spec.provider.kubernetes.remoteNamespace || 'n/a'}})."
  validationFailureAction: enforce
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Access Control
    policies.kyverno.io/description: Generates namespaced, read-only metadata and optional pod-log RoleBindings when a GitOps-managed Namespace opts in.
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace, RoleBinding
    policies.kyverno.io/title: Generate agent diagnostics readers
  name: generate-agent-diagnostics-readers
spec:
  background: true
  rules:
    - generate:
        apiVersion: rbac.authorization.k8s.io/v1
        data:
          metadata:
            labels:
              rbac.ducktape.io/access: agent-readable-metadata
              rbac.ducktape.io/managed-by: kyverno
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: agent-readable-namespace-metadata
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: oidc-ksbx-groups:haku
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: haku:access-profile:haku
            - kind: ServiceAccount
              name: haku
              namespace: haku-sandbox
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: oidc-ksbx-groups:kubectl-sandbox-users
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: haku:access-profile:public-coder
            - kind: ServiceAccount
              name: claude-ai
              namespace: agentplane-staging
        generateExisting: true
        kind: RoleBinding
        name: agent-readable-metadata
