apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: Enforces that workload resources (Deployments, StatefulSets, DaemonSets) can only be created or modified by Flux GitOps controllers. Direct kubectl apply/create/patch is blocked.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, StatefulSet, DaemonSet
    policies.kyverno.io/title: Require GitOps
  name: require-gitops
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConditions:
    - expression: "!(request.userInfo.username in ['system:serviceaccount:flux-system:kustomize-controller', 'system:serviceaccount:flux-system:helm-controller', 'system:serviceaccount:flux-system:source-controller', 'system:serviceaccount:flux-system:haku-state-reconciler', 'system:serviceaccount:kyverno:kyverno-admission-controller', 'system:serviceaccount:monitoring:monitoring-operator', 'system:serviceaccount:monitoring:grafana-operator', 'system:serviceaccount:seaweedfs:seaweedfs-operator', 'system:serviceaccount:authentik:authentik', 'system:serviceaccount:kube-system:reloader-reloader'])"
      name: not-exempt-service-account
    - expression: "!(request.userInfo.username == 'system:serviceaccount:crossplane-system:crossplane' && request.namespace == 'crossplane-system')"
      name: not-crossplane-in-its-namespace
    - expression: "!(request.namespace in ['kube-system', 'kyverno', 'flux-system'])"
      name: not-system-namespace
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
          - statefulsets
          - daemonsets
  validationActions:
    - Audit
  validations:
    - expression: "false"
      messageExpression: "'Direct resource creation/modification blocked. All changes must go through GitOps (commit to git repository). Resource: ' + object.kind + '/' + object.metadata.name + ' User: ' + request.userInfo.username"
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: Sets enableServiceLinks to false on newly created Pods to prevent legacy Service environment variables from colliding with application settings.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Default Service Links off
  name: default-disable-service-links
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
  mutations:
    - applyConfiguration:
        expression: "Object{spec: Object.spec{enableServiceLinks: false}}"
      patchType: ApplyConfiguration
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Access Control
    policies.kyverno.io/description: "A ClusterSecretStore with no `spec.conditions` is usable from every namespace in the cluster. That is not a mild default here: the ESO ServiceAccount holds cluster-wide secret read, so the store — not RBAC — is the only thing bounding what an ExternalSecret can pull out of the store's `remoteNamespace`. An unfenced `kubernetes-flux-system-secret-store` means any namespace can read the GitHub App, the PATs, the AWS Route 53 credentials and `ci-age-key`. This requires every store to name at least one namespace in `conditions[].namespaces`, which rejects the degenerate forms as well: an empty `conditions: []` (ESO treats it exactly like an absent one), a condition carrying no criteria at all, and a bare `namespaceSelector: {}` — an empty LabelSelector matches every namespace by the standard Kubernetes convention, so that one reads as a fence while being the widest setting available. Requiring an explicit list also rules out selector-based fences, which nothing here uses; relax it deliberately if that changes."
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ClusterSecretStore
    policies.kyverno.io/title: Require ClusterSecretStore Conditions
  name: require-secret-store-conditions
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - external-secrets.io
        apiVersions:
          - "*"
        operations:
          - CREATE
          - UPDATE
        resources:
          - clustersecretstores
  validationActions:
    - Deny
  validations:
    - expression: has(object.spec.conditions) && object.spec.conditions.exists(c, has(c.namespaces) && size(c.namespaces) > 0)
      messageExpression: "'ClusterSecretStore must name the namespaces allowed to use it in spec.conditions[].namespaces; without at least one the store is readable from every namespace and the ESO ServiceAccount has cluster-wide secret read. Store: ' + object.metadata.name"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
  name: kyverno-cleanup-controller-jobs
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
  name: kyverno-cleanup-controller-workloads
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
  name: kyverno-cleanup-controller-sandboxes
rules:
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - extensions.agents.x-k8s.io
    resources:
      - sandboxclaims
    verbs:
      - get
      - list
      - watch
      - delete
