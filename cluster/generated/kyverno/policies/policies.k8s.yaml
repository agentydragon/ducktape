apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: Enforces that workload resources (Deployments, StatefulSets, DaemonSets) can only be created or modified by Flux GitOps controllers. Direct kubectl apply/create/patch is blocked.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, StatefulSet, DaemonSet
    policies.kyverno.io/title: Require GitOps
  name: require-gitops
spec:
  background: false
  rules:
    - exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kustomize-controller
                namespace: flux-system
          - subjects:
              - kind: ServiceAccount
                name: helm-controller
                namespace: flux-system
          - subjects:
              - kind: ServiceAccount
                name: source-controller
                namespace: flux-system
          - subjects:
              - kind: ServiceAccount
                name: haku-state-reconciler
                namespace: flux-system
          - subjects:
              - kind: ServiceAccount
                name: kyverno-admission-controller
                namespace: kyverno
          - subjects:
              - kind: ServiceAccount
                name: monitoring-operator
                namespace: monitoring
          - subjects:
              - kind: ServiceAccount
                name: grafana-operator
                namespace: monitoring
          - subjects:
              - kind: ServiceAccount
                name: seaweedfs-operator
                namespace: seaweedfs
          - subjects:
              - kind: ServiceAccount
                name: authentik
                namespace: authentik
          - subjects:
              - kind: ServiceAccount
                name: reloader-reloader
                namespace: kube-system
          - resources:
              namespaces:
                - crossplane-system
            subjects:
              - kind: ServiceAccount
                name: crossplane
                namespace: crossplane-system
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - flux-system
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
              operations:
                - CREATE
                - UPDATE
      name: block-direct-workload-changes
      validate:
        deny: {}
        message: "Direct resource creation/modification blocked. All changes must go through GitOps (commit to git repository). Resource: {{request.object.kind}}/{{request.object.metadata.name}} User: {{request.userInfo.username}}"
  validationFailureAction: audit
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: Sets spec.revisionHistoryLimit to 3 on Deployments, StatefulSets, and DaemonSets that do not specify it, to bound accumulated revision history (dead ReplicaSets / ControllerRevisions) and the kube-state-metrics series and memory that track them.
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Deployment, StatefulSet, DaemonSet
    policies.kyverno.io/title: Default revisionHistoryLimit
  name: default-revision-history-limit
spec:
  admission: true
  background: false
  rules:
    - match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
              operations:
                - CREATE
                - UPDATE
      mutate:
        patchStrategicMerge:
          spec:
            revisionHistoryLimit: 3
      name: default-revision-history-limit
      preconditions:
        all:
          - key: "{{ request.object.spec.revisionHistoryLimit || `-1` }}"
            operator: Equals
            value: -1
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: Sets enableServiceLinks to false on newly created Pods to prevent legacy Service environment variables from colliding with application settings.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Default Service Links off
  name: default-disable-service-links
spec:
  admission: true
  background: false
  rules:
    - match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
      mutate:
        patchStrategicMerge:
          spec:
            enableServiceLinks: false
      name: default-disable-service-links
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Access Control
    policies.kyverno.io/description: "A ClusterSecretStore with no `spec.conditions` is usable from every namespace in the cluster. That is not a mild default here: the ESO ServiceAccount holds cluster-wide secret read, so the store — not RBAC — is the only thing bounding what an ExternalSecret can pull out of the store's `remoteNamespace`. An unfenced `kubernetes-flux-system-secret-store` means any namespace can read the GitHub App, the PATs, the AWS Route 53 credentials and `ci-age-key`. This requires every store to name at least one namespace in `conditions[].namespaces`, which rejects the degenerate forms as well: an empty `conditions: []` (ESO treats it exactly like an absent one), a condition carrying no criteria at all, and a bare `namespaceSelector: {}` — an empty LabelSelector matches every namespace by the standard Kubernetes convention, so that one reads as a fence while being the widest setting available. Requiring an explicit list also rules out selector-based fences, which nothing here uses; relax it deliberately if that changes."
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ClusterSecretStore
    policies.kyverno.io/title: Require ClusterSecretStore Conditions
  name: require-secret-store-conditions
spec:
  admission: true
  background: true
  rules:
    - match:
        any:
          - resources:
              kinds:
                - ClusterSecretStore
              operations:
                - CREATE
                - UPDATE
      name: require-conditions
      validate:
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.conditions[].namespaces[] || `[]` | length(@) }}"
                operator: Equals
                value: 0
        message: "ClusterSecretStore must name the namespaces allowed to use it in spec.conditions[].namespaces; without at least one the store is readable from every namespace and the ESO ServiceAccount has cluster-wide secret read. Store: {{request.object.metadata.name}} (remoteNamespace {{request.object.spec.provider.kubernetes.remoteNamespace || 'n/a'}})."
  validationFailureAction: enforce
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
  name: kyverno-cleanup-controller-jobs
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
  name: kyverno-cleanup-controller-workloads
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
  name: kyverno-cleanup-controller-sandboxes
rules:
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - extensions.agents.x-k8s.io
    resources:
      - sandboxclaims
    verbs:
      - get
      - list
      - watch
      - delete
