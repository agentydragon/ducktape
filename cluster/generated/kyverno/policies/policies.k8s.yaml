apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: Enforces that workload resources (Deployments, StatefulSets, DaemonSets) can only be created or modified by Flux GitOps controllers. Direct kubectl apply/create/patch is blocked.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, StatefulSet, DaemonSet
    policies.kyverno.io/title: Require GitOps
  name: require-gitops
spec:
  background: false
  rules:
    - exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kustomize-controller
                namespace: flux-system
          - subjects:
              - kind: ServiceAccount
                name: helm-controller
                namespace: flux-system
          - subjects:
              - kind: ServiceAccount
                name: source-controller
                namespace: flux-system
          - subjects:
              - kind: ServiceAccount
                name: haku-state-reconciler
                namespace: flux-system
          - subjects:
              - kind: ServiceAccount
                name: kyverno-admission-controller
                namespace: kyverno
          - subjects:
              - kind: ServiceAccount
                name: monitoring-operator
                namespace: monitoring
          - subjects:
              - kind: ServiceAccount
                name: grafana-operator
                namespace: monitoring
          - subjects:
              - kind: ServiceAccount
                name: seaweedfs-operator
                namespace: seaweedfs
          - subjects:
              - kind: ServiceAccount
                name: authentik
                namespace: authentik
          - subjects:
              - kind: ServiceAccount
                name: reloader-reloader
                namespace: kube-system
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - flux-system
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
              operations:
                - CREATE
                - UPDATE
      name: block-direct-workload-changes
      validate:
        deny: {}
        message: "Direct resource creation/modification blocked. All changes must go through GitOps (commit to git repository). Resource: {{request.object.kind}}/{{request.object.metadata.name}} User: {{request.userInfo.username}}"
  validationFailureAction: audit
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: Sets spec.revisionHistoryLimit to 3 on Deployments, StatefulSets, and DaemonSets that do not specify it, to bound accumulated revision history (dead ReplicaSets / ControllerRevisions) and the kube-state-metrics series and memory that track them.
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Deployment, StatefulSet, DaemonSet
    policies.kyverno.io/title: Default revisionHistoryLimit
  name: default-revision-history-limit
spec:
  admission: true
  background: false
  rules:
    - match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
              operations:
                - CREATE
                - UPDATE
      mutate:
        patchStrategicMerge:
          spec:
            revisionHistoryLimit: 3
      name: default-revision-history-limit
      preconditions:
        all:
          - key: "{{ request.object.spec.revisionHistoryLimit || `-1` }}"
            operator: Equals
            value: -1
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: Sets enableServiceLinks to false on newly created Pods to prevent legacy Service environment variables from colliding with application settings.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Default Service Links off
  name: default-disable-service-links
spec:
  admission: true
  background: false
  rules:
    - match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
      mutate:
        patchStrategicMerge:
          spec:
            enableServiceLinks: false
      name: default-disable-service-links
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: "Adds a goldilocks vpa-resource-policy annotation setting controlledValues: RequestsOnly to namespaces running goldilocks VPA in auto mode, so VPA never scales a container's limits down in proportion to its requests. Only applied when the namespace does not already declare its own policy."
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/title: Default VPA to RequestsOnly
  name: default-vpa-requests-only
spec:
  admission: true
  background: false
  rules:
    - match:
        any:
          - resources:
              kinds:
                - Namespace
              operations:
                - CREATE
                - UPDATE
              selector:
                matchLabels:
                  goldilocks.fairwinds.com/vpa-update-mode: auto
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              +(goldilocks.fairwinds.com/vpa-resource-policy): '{"containerPolicies": [{"containerName": "*", "controlledValues": "RequestsOnly"}]}'
      name: default-vpa-requests-only
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/category: Networking
    policies.kyverno.io/description: Mutates pods in claude-sandbox to automatically inject mitmproxy proxy env vars (HTTP_PROXY, HTTPS_PROXY, NO_PROXY, SSL_CERT_FILE, CURL_CA_BUNDLE, REQUESTS_CA_BUNDLE, NODE_EXTRA_CA_CERTS) and mount the mitmproxy trust bundle at /mitmproxy-ca/ca-certificates.crt.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Inject mitmproxy
  name: inject-mitmproxy
spec:
  mutateExistingOnPolicyUpdate: false
  rules:
    - match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - claude-sandbox
              operations:
                - CREATE
      mutate:
        patchesJson6902: |-
          - op: add
            path: "/spec/volumes/-"
            value:
              name: mitmproxy-ca-cert
              configMap:
                name: mitmproxy-ca-cert
      name: add-proxy-volume
      preconditions:
        all:
          - key: "{{ (request.object.spec.volumes || `[]`)[?name=='mitmproxy-ca-cert'] | length(@) }}"
            operator: Equals
            value: 0
    - match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - claude-sandbox
              operations:
                - CREATE
      mutate:
        foreach:
          - list: request.object.spec.containers
            patchesJson6902: |-
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: HTTP_PROXY
                  value: "http://mitmproxy.agents-mitmproxy.svc.cluster.local:8080"
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: HTTPS_PROXY
                  value: "http://mitmproxy.agents-mitmproxy.svc.cluster.local:8080"
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: NO_PROXY
                  value: "127.0.0.1,localhost,.svc,.svc.cluster.local,kubernetes.default.svc,10.0.0.0/8"
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: SSL_CERT_FILE
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: CURL_CA_BUNDLE
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: REQUESTS_CA_BUNDLE
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/containers/{{elementIndex}}/env/-"
                value:
                  name: NODE_EXTRA_CA_CERTS
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/containers/{{elementIndex}}/volumeMounts/-"
                value:
                  name: mitmproxy-ca-cert
                  mountPath: /mitmproxy-ca
                  readOnly: true
            preconditions:
              all:
                - key: "{{ (element.volumeMounts || `[]`)[?name=='mitmproxy-ca-cert'] | length(@) }}"
                  operator: Equals
                  value: 0
      name: add-proxy-env-and-mount-containers
    - match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - claude-sandbox
              operations:
                - CREATE
      mutate:
        foreach:
          - list: request.object.spec.initContainers
            patchesJson6902: |-
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: HTTP_PROXY
                  value: "http://mitmproxy.agents-mitmproxy.svc.cluster.local:8080"
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: HTTPS_PROXY
                  value: "http://mitmproxy.agents-mitmproxy.svc.cluster.local:8080"
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: NO_PROXY
                  value: "127.0.0.1,localhost,.svc,.svc.cluster.local,kubernetes.default.svc,10.0.0.0/8"
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: SSL_CERT_FILE
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: CURL_CA_BUNDLE
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: REQUESTS_CA_BUNDLE
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/env/-"
                value:
                  name: NODE_EXTRA_CA_CERTS
                  value: /mitmproxy-ca/ca-certificates.crt
              - op: add
                path: "/spec/initContainers/{{elementIndex}}/volumeMounts/-"
                value:
                  name: mitmproxy-ca-cert
                  mountPath: /mitmproxy-ca
                  readOnly: true
            preconditions:
              all:
                - key: "{{ (element.volumeMounts || `[]`)[?name=='mitmproxy-ca-cert'] | length(@) }}"
                  operator: Equals
                  value: 0
      name: add-proxy-env-and-mount-init-containers
      preconditions:
        any:
          - key: "{{ (request.object.spec.initContainers || `[]`) | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
---
