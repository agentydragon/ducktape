apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: "off"
    rbac.ducktape.io/agent-readable-logs: "true"
  name: kyverno
spec: {}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 24h
  url: https://kyverno.github.io/kyverno/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      version: 3.9.1
  install:
    remediation:
      retries: 3
  interval: 15m
  targetNamespace: kyverno
  values:
    admissionController:
      annotations:
        goldilocks.fairwinds.com/vpa-resource-policy: '{"containerPolicies": [{"containerName": "kyverno", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "100m", "memory": "224Mi"}, "maxAllowed": {"cpu": "100m", "memory": "384Mi"}, "controlledResources": ["memory"]}, {"containerName": "*", "controlledValues": "RequestsOnly", "mode": "Off"}]}'
        goldilocks.fairwinds.com/vpa-update-mode: auto
      antiAffinity:
        enabled: true
      certManager:
        enabled: false
      container:
        resources:
          limits:
            memory: 384Mi
          requests:
            cpu: 100m
            memory: 128Mi
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      podDisruptionBudget:
        minAvailable: 2
      priorityClassName: system-cluster-critical
      replicas: 3
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: admission-controller
              app.kubernetes.io/instance: "{{ .Release.Name }}"
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          nodeTaintsPolicy: Honor
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      updateStrategy:
        rollingUpdate:
          maxUnavailable: 0
    backgroundController:
      annotations:
        goldilocks.fairwinds.com/vpa-resource-policy: '{"containerPolicies": [{"containerName": "controller", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "50m", "memory": "208Mi"}, "maxAllowed": {"cpu": "50m", "memory": "256Mi"}, "controlledResources": ["memory"]}, {"containerName": "*", "controlledValues": "RequestsOnly", "mode": "Off"}]}'
        goldilocks.fairwinds.com/vpa-update-mode: initial
      enabled: true
      priorityClassName: system-cluster-critical
      replicas: 1
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
    cleanupController:
      annotations:
        goldilocks.fairwinds.com/vpa-resource-policy: '{"containerPolicies": [{"containerName": "controller", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "10m", "memory": "124Mi"}, "maxAllowed": {"cpu": "10m", "memory": "128Mi"}, "controlledResources": ["memory"]}, {"containerName": "*", "controlledValues": "RequestsOnly", "mode": "Off"}]}'
        goldilocks.fairwinds.com/vpa-update-mode: initial
      enabled: true
      podDisruptionBudget:
        minAvailable: 1
      priorityClassName: system-cluster-critical
      replicas: 2
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 32Mi
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: cleanup-controller
              app.kubernetes.io/instance: "{{ .Release.Name }}"
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          nodeTaintsPolicy: Honor
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
    config:
      excludeKyvernoNamespace: true
    crds:
      install: true
    features:
      admissionReports:
        enabled: true
      logging:
        format: text
      policyReports:
        enabled: true
    global:
      image:
        registry: ghcr.io
    reportsController:
      annotations:
        goldilocks.fairwinds.com/vpa-resource-policy: '{"containerPolicies": [{"containerName": "controller", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "100m", "memory": "256Mi"}, "maxAllowed": {"cpu": "100m", "memory": "512Mi"}, "controlledResources": ["memory"]}, {"containerName": "*", "controlledValues": "RequestsOnly", "mode": "Off"}]}'
        goldilocks.fairwinds.com/vpa-update-mode: initial
      enabled: true
      priorityClassName: system-cluster-critical
      replicas: 1
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
