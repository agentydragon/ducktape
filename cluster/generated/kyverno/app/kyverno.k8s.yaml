apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 24h
  url: https://kyverno.github.io/kyverno/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      version: 3.9.1
  install:
    remediation:
      retries: 3
  interval: 15m
  targetNamespace: kyverno
  values:
    admissionController:
      antiAffinity:
        enabled: true
      certManager:
        enabled: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      priorityClassName: system-cluster-critical
      replicas: 3
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
    backgroundController:
      enabled: true
      priorityClassName: system-cluster-critical
      replicas: 1
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
    cleanupController:
      enabled: true
      priorityClassName: system-cluster-critical
      replicas: 1
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 32Mi
    config:
      excludeKyvernoNamespace: true
    crds:
      install: true
    features:
      admissionReports:
        enabled: true
      logging:
        format: text
      policyReports:
        enabled: true
    global:
      image:
        registry: ghcr.io
    reportsController:
      enabled: true
      priorityClassName: system-cluster-critical
      replicas: 1
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
