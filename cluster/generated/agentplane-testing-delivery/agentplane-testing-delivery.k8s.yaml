apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-gateway
  namespace: agentplane-testing
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: runner-gateway
  name: runner-gateway
  namespace: agentplane-testing
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-runner-gateway-deployment-c8a3e7b5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner-gateway
        cdk8s.io/metadata.addr: agentplane-runner-gateway-deployment-c8a3e7b5
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - --sandbox-namespace=agentplane-testing
            - --listen-address=0.0.0.0:8080
            - --runner-token-file=/var/run/secrets/agentplane-runner-gateway/token
            - --dispatcher-audience=session-dispatcher
            - --gateway-audience=agentplane-runner-gateway
            - --runner-audience=agentplane-runner-control
            - --sandbox-controller-account=agentplane-testing/sandbox-controller
            - --dispatcher-caller=agentplane-testing/app
            - --dispatcher-caller=agentplane-testing/notifications
            - --gateway-caller=agentplane-testing/app
            - --gateway-caller=agentplane-testing/notifications
            - --gateway-caller=agentplane-testing/runner-gateway
            - --wake-caller=agentplane-testing/app
            - --wake-caller=agentplane-testing/notifications
          env:
            - name: AGENTPLANE_RUNNER_GATEWAY_DISPATCHER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: postgres-session-dispatcher
            - name: AGENTPLANE_RUNNER_GATEWAY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          image: git.allegedly.works/ducktape-ci/agentplane-runner-gateway:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            grpc:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          name: runner-gateway
          ports:
            - containerPort: 8080
              name: grpc
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            grpc:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /var/run/secrets/agentplane-runner-gateway
              name: runner-gateway-token
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: runner-gateway
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      volumes:
        - name: runner-gateway-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentplane-runner-gateway
                  expirationSeconds: 3600
                  path: token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentplane-testing-runner-gateway-token-reviewer
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentplane-testing-runner-gateway-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentplane-testing-runner-gateway-token-reviewer
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: runner-gateway
    namespace: agentplane-testing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-gateway
  namespace: agentplane-testing
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - sandboxes
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-gateway
  namespace: agentplane-testing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner-gateway
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: runner-gateway
    namespace: agentplane-testing
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: agentplane-runner-control
  namespace: agentplane-testing
spec:
  description: The calling Sandbox Pod's short-lived, Pod-bound identity minted only for its runner's control stream to the Runner Gateway. It conveys no other authority.
  source:
    projectedWorkloadToken:
      audience: agentplane-runner-control
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: PolicySet
metadata:
  name: runner-control
  namespace: agentplane-testing
spec:
  rules:
    - clusterInternal: true
      credentialRef:
        name: agentplane-runner-control
      hosts:
        - runner-gateway.agentplane-testing.svc.cluster.local
      methods:
        - POST
      paths:
        - /agentplane.proto.runner_control.RunnerControl/Connect
      type: egress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: runner-gateway
  namespace: agentplane-testing
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: postgres
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: runner-gateway
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: runner-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: app
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: notifications
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: runner-gateway
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: sandbox-controller
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: app
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: notifications
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: egress
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: runner-gateway-runner-control-proxy
  namespace: agentplane-testing
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: runner-gateway
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: egress
