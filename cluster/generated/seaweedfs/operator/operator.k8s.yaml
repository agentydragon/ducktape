apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: |
      SeaweedFS object store on the OVH Kimsufi nodes, backed by the
      Talos-declared UserVolumeConfig data disk on each node. Replication
      strategy "001" (one copy on a different node, same rack).
      See cluster/docs/kimsufi_provisioning.md and
      cluster/docs/plans/ovh_storage_tiering.md.
  labels:
    goldilocks.fairwinds.com/enabled: "false"
  name: seaweedfs
spec: {}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: seaweedfs-operator
  namespace: flux-system
spec:
  interval: 24h
  url: https://seaweedfs.github.io/seaweedfs-operator/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
  namespace: seaweedfs
spec:
  chart:
    spec:
      chart: seaweedfs-operator
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-operator
        namespace: flux-system
      version: 0.1.42
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  interval: 30m
  upgrade:
    crds: CreateReplace
  values:
    replicaCount: 1
    webhook:
      enabled: false
