---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: claude-reader
  namespace: seaweedfs
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: claude-reader
  namespace: seaweedfs
spec:
  identityRef:
    name: claude-reader
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
  secretRef:
    accessKeyField: claudeReaderAccessKey
    name: claude-reader-s3-credentials
    namespace: seaweedfs-credentials
    secretKeyField: claudeReaderSecretKey
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Policy
metadata:
  name: claude-reader-buckets
  namespace: seaweedfs
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
  statements:
    - actions:
        - s3:ListBucket
      effect: Allow
      resources:
        - attic
        - drivefs-artifacts
        - vm-images
        - loom-gym
      sid: ListReadableBuckets
    - actions:
        - s3:GetObject
      effect: Allow
      resources:
        - attic/*
        - drivefs-artifacts/*
        - vm-images/*
        - loom-gym/*
      sid: ReadBucketObjects
    - actions:
        - s3:PutObject
        - s3:DeleteObject
        - s3:GetObjectTagging
        - s3:PutObjectTagging
        - s3:DeleteObjectTagging
      effect: Allow
      resources:
        - loom-gym/*
      sid: WriteAndTagLoomGymObjects
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3PolicyBinding
metadata:
  name: claude-reader-buckets
  namespace: seaweedfs
spec:
  policyRef:
    name: claude-reader-buckets
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
  subjects:
    - kind: S3Identity
      name: claude-reader
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-s3-bootstrap-config
  namespace: seaweedfs
data:
  seaweedfs_s3_config.json: |
    {"identities":[
      {"name":"anonymous","actions":["Read:pr-visuals"]}
    ]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Single public-facing SeaweedFS S3 gateway (s3.allegedly.works). Mounts a static config for bootstrap and public-specific identities. Filer-backed IAM identities are also valid here, so every credential must remain a confidential Secret even when its usual consumer is cluster-internal.
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/component: s3
    app.kubernetes.io/name: public-s3
    app.kubernetes.io/part-of: seaweedfs
  name: public-s3
  namespace: seaweedfs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: s3
      app.kubernetes.io/name: public-s3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: s3
        app.kubernetes.io/name: public-s3
        app.kubernetes.io/part-of: seaweedfs
    spec:
      containers:
        - command:
            - /bin/sh
            - -ec
            - weed -logtostderr=true s3 -port=8333 -filer=seaweedfs-filer:8888 -config=/etc/sw/seaweedfs_s3_config.json -metricsPort=9327 -ip.bind=0.0.0.0
          image: chrislusf/seaweedfs:4.46
          imagePullPolicy: IfNotPresent
          name: s3
          ports:
            - containerPort: 8333
              name: s3-http
              protocol: TCP
            - containerPort: 9327
              name: s3-metrics
              protocol: TCP
          readinessProbe:
            failureThreshold: 100
            httpGet:
              path: /status
              port: 8333
            initialDelaySeconds: 10
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - mountPath: /etc/sw
              name: s3-config
              readOnly: true
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - configMap:
            name: public-s3-bootstrap-config
          name: s3-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: s3
    app.kubernetes.io/name: public-s3
    app.kubernetes.io/part-of: seaweedfs
  name: public-s3
  namespace: seaweedfs
spec:
  ports:
    - name: s3-http
      port: 8333
      protocol: TCP
      targetPort: s3-http
    - name: s3-metrics
      port: 9327
      protocol: TCP
      targetPort: s3-metrics
  selector:
    app.kubernetes.io/component: s3
    app.kubernetes.io/name: public-s3
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-s3
  namespace: seaweedfs
spec:
  hostnames:
    - s3.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: public-s3
          port: 8333
      timeouts:
        backendRequest: 3600s
        request: 3600s
