apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: drivefs-artifacts-writer
  namespace: seaweedfs
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: drivefs-artifacts-writer
  namespace: seaweedfs
spec:
  identityRef:
    name: drivefs-artifacts-writer
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
  secretRef:
    accessKeyField: writerAccessKey
    name: drivefs-artifacts-s3-credentials
    namespace: seaweedfs-credentials
    secretKeyField: writerSecretKey
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: drivefs-artifacts-reader
  namespace: seaweedfs
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: drivefs-artifacts-reader
  namespace: seaweedfs
spec:
  identityRef:
    name: drivefs-artifacts-reader
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
  secretRef:
