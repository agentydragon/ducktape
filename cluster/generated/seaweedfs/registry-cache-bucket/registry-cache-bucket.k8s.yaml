apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  annotations:
    description: "Zot's OCI pull-through cache: manifests and blobs."
  name: registry-cache
  namespace: oci-cache
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: registry-cache
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: registry-cache
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  annotations:
    description: "Zot's OCI pull-through cache: manifests and blobs."
  name: registry-cache
  namespace: oci-cache
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: registry-cache
  namespace: oci-cache
spec:
  identityRef:
    name: registry-cache
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    name: registry-cache-s3-credentials
---
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: oci-cache-registry-cache
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: oci-cache
    - group: seaweed.seaweedfs.com
      kind: S3Identity
      namespace: oci-cache
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: oci-cache
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
