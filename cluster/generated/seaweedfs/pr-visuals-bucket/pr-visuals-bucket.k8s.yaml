apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: pr-visuals
  namespace: flux-system
spec:
  access:
    - actions:
        - Read
        - Write
        - List
        - Tagging
      user: pr-visuals-writer
    - actions:
        - Read
      user: anonymous
  adoptExisting: true
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  name: pr-visuals
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: pr-visuals
  namespace: seaweedfs
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespace: flux-system
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: flux-system
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: pr-visuals-writer
  namespace: seaweedfs
spec:
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: pr-visuals-writer
  namespace: flux-system
spec:
  identityRef:
    name: pr-visuals-writer
  reclaimPolicy: Retain
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  secretRef:
    name: pr-visuals-s3-credentials
