apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: central-sampler
  namespace: agentplane-staging
spec:
  resourcePolicy:
    containerPolicies:
      - containerName: central-sampler
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsOnly
      - containerName: "*"
        mode: "Off"
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: central-sampler
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: egress
  namespace: agentplane-staging
spec:
  resourcePolicy:
    containerPolicies:
      - containerName: proxy
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsOnly
      - containerName: "*"
        mode: "Off"
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: egress
  updatePolicy:
    updateMode: Initial
---
