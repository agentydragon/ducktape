apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: agentplane-testing
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-cheap-experiments-reader
  namespace: litellm
rules:
  - apiGroups:
      - ""
    resourceNames:
      - litellm-key-cheap-experiments
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-cheap-experiments-reader
  namespace: litellm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: litellm-cheap-experiments-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: external-creds-reader
    namespace: agentplane-testing
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-litellm-cheap-experiments-secret-store
spec:
  conditions:
    - namespaces:
        - agentplane-testing
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-creds-reader
      remoteNamespace: litellm
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-key-cheap-experiments
  namespace: agentplane-testing
spec:
  data:
    - remoteRef:
        key: litellm-key-cheap-experiments
        property: api-key
      secretKey: api-key
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-litellm-cheap-experiments-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: litellm-key-cheap-experiments
