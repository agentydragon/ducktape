apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: sandbox-controller
  name: sandbox-controller
  namespace: agentplane-testing
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-sandbox-controller-deployment-c8a54474
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-controller
        cdk8s.io/metadata.addr: agentplane-sandbox-controller-deployment-c8a54474
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - --namespace=agentplane-testing
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --runner-gateway-target={sandbox}-control.{namespace}.svc:8080
            - --runner-gateway-token-file=/var/run/secrets/agentplane-runner-gateway/token
          env:
            - name: AGENTPLANE_SANDBOX_CONTROLLER_NAMESPACE
              value: agentplane-testing
            - name: AGENTPLANE_SANDBOX_CONTROLLER_METRICS_BIND_ADDRESS
              value: :8080
            - name: AGENTPLANE_SANDBOX_CONTROLLER_HEALTH_PROBE_BIND_ADDRESS
              value: :8081
            - name: AGENTPLANE_SANDBOX_CONTROLLER_RUNNER_GATEWAY_TARGET
              value: "{sandbox}-control.{namespace}.svc:8080"
            - name: AGENTPLANE_SANDBOX_CONTROLLER_RUNNER_GATEWAY_TOKEN_FILE
              value: /var/run/secrets/agentplane-runner-gateway/token
          image: git.allegedly.works/ducktape-ci/agentplane-sandbox-controller:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
          name: sandbox-controller
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /var/run/secrets/agentplane-runner-gateway
              name: runner-gateway-token
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: sandbox-controller
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
        - name: runner-gateway-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentplane-runner-gateway
                  expirationSeconds: 3600
                  path: token
