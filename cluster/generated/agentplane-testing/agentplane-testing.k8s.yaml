            - dex
            - serve
            - /etc/dex/config.yaml
          env:
            - name: DEX_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client-id
                  name: agentplane-oidc
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client-secret
                  name: agentplane-oidc
            - name: MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client-secret
                  name: agentplane-mcp-oauth
          image: ghcr.io/dexidp/dex:v2.45.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /dex/healthz
              port: 5556
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
          name: dex
          ports:
            - containerPort: 5556
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /dex/healthz
              port: 5556
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/dex
              name: secret-agentplane-testing-acceptance-operator
              readOnly: true
            - mountPath: /tmp
              name: tmp
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
        - name: secret-agentplane-testing-acceptance-operator
          secret:
            items:
              - key: config.yaml
                path: config.yaml
            secretName: agentplane-testing-acceptance-operator
        - emptyDir: {}
          name: tmp
