---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: github-pat
  namespace: agentplane-testing
spec:
  description: A GitHub personal access token belonging to the bot account agentydragon-agent. Requests carrying it act as that account and are attributable to it. The proxy does not narrow what the token itself may do — the rule's hosts and methods are the only limit it adds, so treat anything the token can reach on those hosts as reachable.
  source:
    secretRef:
      key: token
      name: agentplane-github-pat
  targets:
    - header: Authorization
      method: schemeToken
      scheme: Bearer
    - header: Authorization
      method: basicPassword
---
apiVersion: agentplane.allegedly.works/v1alpha1
kind: EgressCredential
metadata:
  name: buildbuddy
  namespace: agentplane-testing
spec:
  description: The shared BuildBuddy API key, copied into this environment's isolated egress-credentials namespace by ESO. BuildBuddy uses this key for its JSON-over-HTTP API and gRPC services, presented as the literal value of the `x-buildbuddy-api-key` header/metadata entry. Its authority is the account's BuildBuddy permissions; the egress policy limits where it is sent.
  source:
    secretRef:
      key: api-key
      name: buildbuddy-api-key
  targets:
    - header: x-buildbuddy-api-key
      method: wholeValue
---
apiVersion: agentplane.allegedly.works/v1alpha1
