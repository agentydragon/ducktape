            - --harness-env
            - NODE_EXTRA_CA_CERTS
            - --harness-env
            - CURL_CA_BUNDLE
            - --harness-env
            - GIT_SSL_CAINFO
            - --harness-env
            - REQUESTS_CA_BUNDLE
            - --harness-env
