        app.kubernetes.io/name: sandbox-controller
        cdk8s.io/metadata.addr: agentplane-sandbox-controller-deployment-c8a54474
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: AGENTPLANE_SANDBOX_CONTROLLER_NAMESPACE
              value: agentplane-testing
            - name: AGENTPLANE_SANDBOX_CONTROLLER_METRICS_BIND_ADDRESS
              value: :8080
            - name: AGENTPLANE_SANDBOX_CONTROLLER_HEALTH_PROBE_BIND_ADDRESS
              value: :8081
            - name: AGENTPLANE_SANDBOX_CONTROLLER_RUNNER_GATEWAY_TARGET
