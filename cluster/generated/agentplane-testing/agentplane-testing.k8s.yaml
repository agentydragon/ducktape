              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /state
              name: state
            - mountPath: /etc/ssl/certs/ca-certificates.crt
              name: egress-ca
              readOnly: true
              subPath: ca-certificates.crt
            - mountPath: /etc/ssl/certs/java/cacerts
              name: egress-ca
              readOnly: true
              subPath: ca-certificates.p12
            - mountPath: /etc/kubernetes/kubeconfig
              name: tool-config
              readOnly: true
              subPath: kubeconfig
          workingDir: /state
        - env:
