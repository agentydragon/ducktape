apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-egress-sidecar
  namespace: agentplane-testing
data:
  settings.yaml: |
    proxy_host: egress.agentplane-testing.svc.cluster.local
    proxy_port: 8888
    listen_port: 3128
    readiness_host: 0.0.0.0
    readiness_port: 3129
    token_file: /var/run/agentplane-egress/token
    audience_token_files:
      https://localhost:7445: /var/run/agentplane-egress/kubernetes-token
      agentplane-notifications: /var/run/agentplane-egress/notifications-token
      agentplane-runner-control: /var/run/agentplane-egress/runner-control-token
      agentplane-runner-ingress: /var/run/agentplane-egress/runner-ingress-token
immutable: false
---
apiVersion: v1
kind: PodTemplate
metadata:
  name: sandbox
  namespace: agentplane-testing
template:
  metadata:
    labels:
      app.kubernetes.io/name: sandbox
  spec:
    automountServiceAccountToken: false
    containers:
      - command:
          - bash
          - -c
          - trap 'exit 0' TERM; sleep infinity & wait
        env:
          - name: HTTP_PROXY
            value: http://127.0.0.1:3128
          - name: HTTPS_PROXY
            value: http://127.0.0.1:3128
          - name: http_proxy
            value: http://127.0.0.1:3128
          - name: https_proxy
            value: http://127.0.0.1:3128
          - name: NO_PROXY
            value: 127.0.0.1,localhost
          - name: no_proxy
            value: 127.0.0.1,localhost
          - name: SSL_CERT_FILE
            value: /etc/ssl/certs/ca-certificates.crt
          - name: NODE_EXTRA_CA_CERTS
            value: /etc/ssl/certs/ca-certificates.crt
          - name: CURL_CA_BUNDLE
            value: /etc/ssl/certs/ca-certificates.crt
          - name: GIT_SSL_CAINFO
            value: /etc/ssl/certs/ca-certificates.crt
          - name: REQUESTS_CA_BUNDLE
            value: /etc/ssl/certs/ca-certificates.crt
          - name: KUBECONFIG
            value: /etc/kubernetes/kubeconfig
          - name: TZ
            value: America/Los_Angeles
        image: git.allegedly.works/ducktape-ci/agentplane-sandbox:unset
        name: sandbox
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - mountPath: /etc/ssl/certs/ca-certificates.crt
            name: egress-ca
            readOnly: true
            subPath: ca-certificates.crt
          - mountPath: /etc/ssl/certs/java/cacerts
            name: egress-ca
            readOnly: true
            subPath: ca-certificates.p12
          - mountPath: /etc/kubernetes/kubeconfig
            name: tool-config
            readOnly: true
            subPath: kubeconfig
          - mountPath: /etc/bazel.bazelrc
            name: tool-config
            readOnly: true
            subPath: bazel.bazelrc
      - env:
          - name: AGENTPLANE_EGRESS_SIDECAR_CONFIG_FILE
            value: /etc/agentplane-egress-sidecar/settings.yaml
        image: git.allegedly.works/ducktape-ci/agentplane-egress-sidecar:unset
        name: egress-sidecar
        readinessProbe:
          failureThreshold: 1
          httpGet:
            path: /readyz
            port: 3129
          periodSeconds: 2
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - mountPath: /var/run/agentplane-egress
            name: egress-token
            readOnly: true
          - mountPath: /etc/agentplane-egress-sidecar
            name: egress-sidecar-settings
            readOnly: true
    imagePullSecrets:
      - name: forgejo-images-creds
    securityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    terminationGracePeriodSeconds: 60
    volumes:
      - configMap:
          name: agentplane-testing-egress-ca
        name: egress-ca
      - configMap:
          name: sandbox-tool-config
        name: tool-config
      - name: egress-token
        projected:
          sources:
            - serviceAccountToken:
                audience: agentplane-egress
                expirationSeconds: 600
                path: token
            - serviceAccountToken:
                audience: https://localhost:7445
                expirationSeconds: 600
                path: kubernetes-token
            - serviceAccountToken:
                audience: agentplane-notifications
                expirationSeconds: 600
                path: notifications-token
            - serviceAccountToken:
                audience: agentplane-runner-control
                expirationSeconds: 600
                path: runner-control-token
            - serviceAccountToken:
                audience: agentplane-runner-ingress
                expirationSeconds: 600
                path: runner-ingress-token
      - configMap:
          name: sandbox-egress-sidecar
        name: egress-sidecar-settings
---
