apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: agentplane-testing
data:
  config.yaml: |
    models:
      models:
        - model: ollama/olm-chat/qwen3.8-flash-next-iq4xs-128k
          display_name: Qwen3.8 Flash Next IQ4_XS (128K) — cluster Ollama
          reasoning_efforts: []
        - model: chatgpt/oai-responses/gpt-6-luna
          display_name: GPT-6 Luna — ChatGPT
          reasoning_efforts:
            - minimal
            - low
            - medium
            - high
            - xhigh
        - model: ollama/oai-chat/qwen3.8-flash-next-iq4xs-256k
          display_name: Qwen3.8 Flash Next IQ4_XS (256K) — cluster Ollama
          reasoning_efforts:
            - low
            - medium
            - high
        - model: ollama/oai-chat/gpt-oss-20b-128k
          display_name: GPT-OSS 20B (128K) — cluster Ollama
          reasoning_efforts: []
        - model: ollama/oai-chat/gpt-oss-120b-128k
          display_name: GPT-OSS 120B (128K) — cluster Ollama
          reasoning_efforts: []
        - model: ollama/oai-chat/gemma4-31b-it-q8_0-128k
          display_name: Gemma 4 31B (128K) — cluster Ollama
          reasoning_efforts: []
      harnesses:
        HARNESS_CLAUDE:
          - ollama/olm-chat/qwen3.8-flash-next-iq4xs-128k
        HARNESS_CODEX:
          - chatgpt/oai-responses/gpt-6-luna
          - ollama/oai-chat/qwen3.8-flash-next-iq4xs-256k
          - ollama/oai-chat/gpt-oss-20b-128k
          - ollama/oai-chat/gpt-oss-120b-128k
          - ollama/oai-chat/gemma4-31b-it-q8_0-128k
    thread_presets:
      public-coder-codex:
        title: Public coder / Codex
        harness: HARNESS_CODEX
        model: chatgpt/oai-responses/gpt-6-luna
        cwd: /state/workspaces/{session_id}
        reasoning_effort: medium
        instructions: |-
          Work as a public-repository coding agent. You will usually work on the public GitHub repository
          agentydragon/ducktape. Follow the shared ducktape contribution instructions below.

          The public-coder preset grants BuildBuddy diagnostics through Agentplane egress. Use its
          credential placeholder as the `x-buildbuddy-api-key` header through the proxy when reading
          invocation details or logs from the allowed BuildBuddy API host. The proxy substitutes the
          cluster-held API key; never read, print, or persist the real key or bypass the proxy.

          When contributing to the public `agentydragon/ducktape` repository, use the dedicated
          `agentydragon-agent` GitHub identity, not the operator's identity. Check the current Agentplane
          egress rules before GitHub access. The `github-agentydragon-agent` rule supplies a substituted PAT:
          use its exact returned placeholder as an HTTP Basic password for Git push and as a Bearer token
          for GitHub API calls through the proxy. Never read, log, or persist the real PAT.

          Work in a ducktape checkout (not nested inside another repository). Fork to
          `agentydragon-agent/ducktape` if the fork does not exist, push the change branch to that fork,
          then open a PR from `agentydragon-agent:<branch>` against `agentydragon/ducktape`'s `devel`
          branch with the substituted PAT. Never push directly to the upstream repository. Check the
          diff for personal data before pushing; public ducktape must contain only generic tooling and
          public-safe instructions.
    sandbox_presets:
      public-coder:
        title: Public coder
        template: runner
        policy_sets:
          - basic
          - packages
          - github-agentydragon-agent
          - github-clone
          - github-actions-logs
          - buildbuddy
          - public-coder-pr-visuals
        thread_preset: public-coder-codex
        bootstrap: |
          marker=/state/workspaces/.agentplane-public-coder-ready
          mkdir -p /state/workspaces
          if [ ! -f "$marker" ]; then
            printf '%s\n' 'public-coder workspace initialized' > "$marker"
          fi
    default_policy_sets:
      - basic
      - inference-experiments
    egress_admin_url: http://egress-admin.agentplane-testing.svc:8081/
    action_federation:
      service_url: http://actions.agentplane-testing.svc:8080/
      login_jwks_uri: https://agentplane-dex-testing.allegedly.works/dex/keys
      login_token_profile: dex
      target:
        issuer: https://agentplane-dex-testing.allegedly.works/dex
        audience: agentplane-testing
        jwks_uri: https://agentplane-dex-testing.allegedly.works/dex/keys
        token_profile: dex
      scope: openid
      mode: direct
immutable: false
