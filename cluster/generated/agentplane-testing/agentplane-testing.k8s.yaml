apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-everything
  namespace: agentplane-testing
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-mcp-everything-deployment-c8e2d559
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-everything
        cdk8s.io/metadata.addr: agentplane-mcp-everything-deployment-c8e2d559
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - node
            - dist/index.js
            - streamableHttp
          image: docker.io/tzolov/mcp-everything-server@sha256:96c4aa07420dd2a8dee0315763a8ea27de72fd054483c781894f6280cd3f56e7
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 20
            periodSeconds: 30
            tcpSocket:
              port: 3001
          name: fixture
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 5
            tcpSocket:
              port: 3001
          resources:
            limits:
              cpu: 250m
              ephemeral-storage: 1Gi
              memory: 256Mi
            requests:
              cpu: 25m
              ephemeral-storage: 1Gi
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-everything
  namespace: agentplane-testing
spec:
  externalIPs: []
  ports:
    - name: http
      port: 3001
      protocol: TCP
      targetPort: 3001
  selector:
    cdk8s.io/metadata.addr: agentplane-mcp-everything-deployment-c8e2d559
  type: ClusterIP
---
