              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/agentplane-egress/ca
              name: ca
              readOnly: true
            - mountPath: /etc/agentplane-egress/upstream-ca
              name: upstream-ca
              readOnly: true
            - mountPath: /var/lib/agentplane-egress
              name: confdir
            - mountPath: /etc/agentplane-egress/settings
              name: configmap-agentplane-egress-settings
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      initContainers:
        - env:
            - name: AGENTPLANE_EGRESS_DATABASE_URL
              valueFrom:
                secretKeyRef:
