apiVersion: v1
kind: ConfigMap
metadata:
  name: actions-settings
  namespace: agentplane-testing
data:
  settings.yaml: |
    token_audience: agentplane-egress
    operator_oidc:
      issuer: https://agentplane-dex-testing.allegedly.works/dex
      audience: agentplane-testing
      jwks_uri: https://agentplane-dex-testing.allegedly.works/dex/keys
      token_profile: dex
    policy_namespace: agentplane-testing
    caller_service_account_namespaces:
      - agentplane-testing
    direct_wait_seconds: 30
    max_wait_seconds: 180
    mcp_servers:
      example:
        server_id: example
        server_url: http://oauth-fixture.agentplane-testing.svc.cluster.local:8080/mcp
        client_id: agentplane-testing-mcp
        client_secret_file: /etc/agentplane-mcp/client-secret
        redirect_uri: https://agentplane-testing.allegedly.works/mcp-linkage/callback
        scopes:
          - openid
    action_groups:
      everything:
        title: Upstream Everything
        description: Credentialless MCP reference server for testing acceptance.
        executor:
          kind: mcp
          description: Community-built Everything image; no user account, workload token, or mounted credentials.
          config:
            transport: streamable-http
            url: http://mcp-everything.agentplane-testing.svc.cluster.local:3001/mcp
            auth: none
      example:
        title: OAuth Example
        description: Dex-backed OAuth-linked MCP fixture for testing acceptance of the linkage flow.
        executor:
          kind: mcp
          description: MCP tool protected by Dex-issued JWTs; no real credentials.
          config:
            transport: streamable-http
            url: http://oauth-fixture.agentplane-testing.svc.cluster.local:8080/mcp
            server_id: example
            auth: oauth
      sandbox:
        title: Sandbox
        description: Boxes that run as the calling ServiceAccount, and bounded commands in them.
        executor:
          kind: pod
          description: Created and exec'd by this service, as the caller, in its own namespace.
          namespace: agentplane-testing
          templates:
            sandbox: "A box to run commands in: bash and coreutils, git, curl, ripgrep, jq, openssl, kubectl (configured as the caller's ServiceAccount) and python3 (install packages into a `python3 -m venv`). 1 core and 2Gi, and no volume: files last as long as the box's Pod."
            sandbox-build: "The sandbox box sized for a build: the same tools plus bazel (bazelisk, which runs the version a workspace's `.bazelversion` names) and gcc, 2 cores and 4Gi, and a home directory that survives the container being killed for running out of memory, though not the box's Pod."
