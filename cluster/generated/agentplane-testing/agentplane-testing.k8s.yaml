apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: electric
  name: electric
  namespace: agentplane-testing
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-electric-deployment-c86a4b11
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: electric
        cdk8s.io/metadata.addr: agentplane-electric-deployment-c86a4b11
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-electric
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-electric
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: postgres-electric
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: postgres-electric
            - name: POSTGRES_DB
              value: sandbox_service
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
            - name: ELECTRIC_DB_POOL_SIZE
              value: "10"
            - name: ELECTRIC_INSECURE
              value: "true"
            - name: ELECTRIC_PORT
              value: "3000"
            - name: ELECTRIC_STORAGE
              value: fast_file
            - name: ELECTRIC_STORAGE_DIR
              value: /var/lib/electric
            - name: ELECTRIC_PERSISTENT_STATE
              value: file
            - name: ELECTRIC_MANUAL_TABLE_PUBLISHING
              value: "true"
            - name: ELECTRIC_REPLICATION_STREAM_ID
              value: agentplane_history
            - name: ELECTRIC_MAX_SHAPES
              value: "1024"
          image: docker.io/electricsql/electric:1.8.1@sha256:9b4cebe2d8f51fb3ebaeb156e443ba09deaa7c9e731f146e81f7e48238bae211
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
          name: electric
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /var/lib/electric
              name: storage
      dnsPolicy: ClusterFirst
      hostNetwork: false
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: Always
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      volumes:
        - emptyDir:
            sizeLimit: 5120Mi
          name: storage
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: electric
  name: electric
  namespace: agentplane-testing
spec:
  externalIPs: []
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    cdk8s.io/metadata.addr: agentplane-electric-deployment-c86a4b11
  type: ClusterIP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: electric
  namespace: agentplane-testing
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: postgres
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: electric
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: app
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
