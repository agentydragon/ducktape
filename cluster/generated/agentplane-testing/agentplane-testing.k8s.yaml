apiVersion: v1
kind: Namespace
metadata:
  annotations:
    description: Agentplane testing - sandboxed runner Pods (one per Sandbox) and the integration app that drives them.
  labels:
    goldilocks.fairwinds.com/enabled: "false"
    name: agentplane-testing
    rbac.ducktape.io/agent-readable-logs: "true"
  name: agentplane-testing
spec: {}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgres-actions-generator
  namespace: agentplane-testing
spec:
  allowRepeat: true
  digits: 8
  length: 40
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-actions
  namespace: agentplane-testing
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: postgres-actions-generator
  refreshInterval: 8760h
  target:
    name: postgres-actions
    template:
      data:
        dbname: actions
        host: postgres-rw.agentplane-testing.svc
        password: "{{ .password }}"
        port: "5432"
        uri: postgresql://actions:{{ .password }}@postgres-rw.agentplane-testing.svc:5432/actions
        username: actions
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: postgres-egress-generator
  namespace: agentplane-testing
spec:
