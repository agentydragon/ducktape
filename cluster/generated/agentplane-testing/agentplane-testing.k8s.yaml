      imagePullSecrets:
        - name: forgejo-images-creds
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentplane-runner
      terminationGracePeriodSeconds: 60
      volumes:
        - configMap:
            name: agentplane-testing-egress-ca
          name: egress-ca
        - configMap:
            name: agentplane-sandbox-tool-config
          name: tool-config
        - name: egress-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentplane-egress
                  expirationSeconds: 600
                  path: token
              - serviceAccountToken:
                  audience: https://localhost:7445
                  expirationSeconds: 600
                  path: kubernetes-token
              - serviceAccountToken:
                  audience: agentplane-notifications
                  expirationSeconds: 600
                  path: notifications-token
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: local-path-ovh-hdd
  volumeClaimTemplatesPolicy: Overrides
