            app.kubernetes.io/name: runner-gateway
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: runner-gateway
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: runner-gateway
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: history-service
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: notifications
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: egress
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: actions
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: electric
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: postgres
            k8s:io.kubernetes.pod.namespace: agentplane-testing
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: app
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
