apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-staging-external-bindings
  namespace: haku-sandbox
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
    verbs:
      - get
  - apiGroups:
      - rbac.authorization.k8s.io
    resourceNames:
      - haku-sandbox-admin
    resources:
      - roles
    verbs:
      - bind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-staging-external-bindings
  namespace: haku-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-staging-external-bindings
subjects:
  - kind: ServiceAccount
    name: policy-controller
    namespace: agentplane-staging
