apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-staging-external-bindings
  namespace: agentplane-testing
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - create
      - get
      - list
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-staging-external-bindings
  namespace: agentplane-testing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentplane-staging-external-bindings
subjects:
  - kind: ServiceAccount
    name: agentplane-app
    namespace: agentplane-staging
