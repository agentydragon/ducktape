apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: buildbuddy
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - env:
                - name: SSL_CERT_FILE
                  value: /var/run/public-web-pki/ca-certificates.crt
                - name: WATCH_NAMESPACE
                  value: litellm
                - name: WATCH_SECRET
                  value: litellm-key-buildbuddy-live-tests
                - name: CREDENTIAL_SECRET
                  value: buildbuddy-crossplane-provider-credentials
              name: package-runtime
              volumeMounts:
                - mountPath: /var/run/public-web-pki
                  name: public-web-pki
                  readOnly: true
          volumes:
            - configMap:
                name: public-web-pki
              name: public-web-pki
  serviceAccountTemplate:
    metadata:
      name: provider-buildbuddy
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-buildbuddy
spec:
  package: git.allegedly.works/ducktape-ci/crossplane-provider-buildbuddy:latest
  packagePullSecrets:
    - name: forgejo-images-creds
  revisionActivationPolicy: Automatic
  runtimeConfigRef:
    name: buildbuddy
