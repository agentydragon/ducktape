apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: piraeus-lvm-metrics-wyrm2-ssd
  namespace: piraeus-datastore
spec:
  groups:
    - name: piraeus-lvm-metrics-wyrm2-ssd
      rules:
        - alert: PiraeusThinPoolDataUsageWarning
          annotations:
            description: Thin-pool piraeus_ssd/data data usage has been at least 80% for 2 minutes.
            summary: Piraeus thin-pool data usage is high
          expr: (lvm_thin_pool_data_percent{namespace="piraeus-datastore",service="piraeus-lvm-metrics-wyrm2-ssd",vg="piraeus_ssd",pool="data"} >= 80) and (lvm_thin_pool_data_percent{namespace="piraeus-datastore",service="piraeus-lvm-metrics-wyrm2-ssd",vg="piraeus_ssd",pool="data"} < 90)
          for: 2m
          labels:
            severity: warning
        - alert: PiraeusThinPoolDataUsageCritical
          annotations:
            description: Thin-pool piraeus_ssd/data data usage has been at least 90% for 2 minutes.
            summary: Piraeus thin-pool data usage is critical
          expr: lvm_thin_pool_data_percent{namespace="piraeus-datastore",service="piraeus-lvm-metrics-wyrm2-ssd",vg="piraeus_ssd",pool="data"} >= 90
          for: 2m
          labels:
            severity: critical
        - alert: PiraeusThinPoolMetadataUsageWarning
          annotations:
            description: Thin-pool piraeus_ssd/data metadata usage has been at least 70% for 2 minutes.
            summary: Piraeus thin-pool metadata usage is high
          expr: (lvm_thin_pool_metadata_percent{namespace="piraeus-datastore",service="piraeus-lvm-metrics-wyrm2-ssd",vg="piraeus_ssd",pool="data"} >= 70) and (lvm_thin_pool_metadata_percent{namespace="piraeus-datastore",service="piraeus-lvm-metrics-wyrm2-ssd",vg="piraeus_ssd",pool="data"} < 85)
          for: 2m
          labels:
            severity: warning
        - alert: PiraeusThinPoolMetadataUsageCritical
          annotations:
            description: Thin-pool piraeus_ssd/data metadata usage has been at least 85% for 2 minutes.
            summary: Piraeus thin-pool metadata usage is critical
          expr: lvm_thin_pool_metadata_percent{namespace="piraeus-datastore",service="piraeus-lvm-metrics-wyrm2-ssd",vg="piraeus_ssd",pool="data"} >= 85
          for: 2m
          labels:
            severity: critical
        - alert: PiraeusThinPoolCollectorFailed
          annotations:
            description: Reporting lvs has not returned both usage fields for piraeus_ssd/data for 2 minutes.
            summary: Piraeus thin-pool metrics collection is failing
          expr: lvm_thin_pool_collector_success{namespace="piraeus-datastore",service="piraeus-lvm-metrics-wyrm2-ssd",vg="piraeus_ssd",pool="data"} == 0
          for: 2m
          labels:
            severity: warning
        - alert: PiraeusThinPoolCollectorStale
          annotations:
            description: The last successful sample or textfile update for piraeus_ssd/data is missing or older than 90 seconds.
            summary: Piraeus thin-pool metrics are stale
          expr: (time() - lvm_thin_pool_collector_last_success_timestamp_seconds{namespace="piraeus-datastore",service="piraeus-lvm-metrics-wyrm2-ssd",vg="piraeus_ssd",pool="data"} > 90 or absent(lvm_thin_pool_collector_last_success_timestamp_seconds{namespace="piraeus-datastore",service="piraeus-lvm-metrics-wyrm2-ssd",vg="piraeus_ssd",pool="data"}) or time() - node_textfile_mtime_seconds{namespace="piraeus-datastore",service="piraeus-lvm-metrics-wyrm2-ssd",file="/textfiles/lvm_thin_pool.prom"} > 90) and on(namespace) (kube_daemonset_status_desired_number_scheduled{namespace="piraeus-datastore",daemonset="piraeus-lvm-metrics-wyrm2-ssd"} > 0)
          for: 2m
          labels:
            severity: warning
        - alert: PiraeusThinPoolScrapeMissing
          annotations:
            description: Alloy has not scraped the Piraeus thin-pool exporter successfully for 2 minutes.
            summary: Piraeus thin-pool exporter is not being scraped
          expr: ((up{namespace="piraeus-datastore",service="piraeus-lvm-metrics-wyrm2-ssd"} == 0) or absent(up{namespace="piraeus-datastore",service="piraeus-lvm-metrics-wyrm2-ssd"})) and on(namespace) (kube_daemonset_status_desired_number_scheduled{namespace="piraeus-datastore",daemonset="piraeus-lvm-metrics-wyrm2-ssd"} > 0)
          for: 2m
          labels:
            severity: warning
