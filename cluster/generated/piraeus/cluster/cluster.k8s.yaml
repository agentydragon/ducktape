apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    description: Alloy scrape of the loopback-only DRBD Reactor metrics endpoint.
  name: piraeus-drbd-alloy
  namespace: piraeus-datastore
data:
  config.alloy: |
    // This runs in a narrowly scheduled host-network Piraeus monitoring Pod, where
    // loopback is shared with DRBD Reactor. Reactor listens only on 9942 and Alloy's
    // admin listener stays on loopback. Only remote-write traffic leaves the Pod.
    prometheus.remote_write "mimir" {
      endpoint {
        url = sys.env("MIMIR_PUSH_URL")
      }

      wal {
        // This collector has one 60s target per Piraeus node. A short WAL retention is
        // enough for brief gateway outages. The pod bounds WAL storage at 512Mi.
        max_keepalive_time = "2h"
      }
    }

    prometheus.scrape "drbd_reactor" {
      targets = [{
        "__address__" = "127.0.0.1:9942",
        "instance"    = sys.env("NODE_NAME"),
        "node"        = sys.env("NODE_NAME"),
      }]

      job_name        = "piraeus-datastore/linstor-satellite"
      metrics_path    = "/metrics"
      scrape_interval = "60s"
      scrape_timeout  = "10s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: piraeus-drbd-metrics
  name: piraeus-drbd-metrics
  namespace: piraeus-datastore
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: piraeus-drbd-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: piraeus-drbd-metrics
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: storage.allegedly.works/piraeus-ready
                    operator: In
                    values:
                      - "true"
      automountServiceAccountToken: false
      containers:
        - args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy
            - --server.http.listen-addr=127.0.0.1:12346
            - --stability.level=generally-available
            - --disable-reporting
          env:
            - name: MIMIR_PUSH_URL
              value: http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          image: docker.io/grafana/alloy:v1.21.1
          imagePullPolicy: IfNotPresent
          name: alloy
          resources:
            limits:
              cpu: 250m
              ephemeral-storage: 640Mi
              memory: 512Mi
            requests:
              cpu: 10m
              ephemeral-storage: 64Mi
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 473
            runAsNonRoot: true
            runAsUser: 473
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/alloy
              name: config
              readOnly: true
            - mountPath: /var/lib/alloy
              name: storage
            - mountPath: /tmp
              name: tmp
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      securityContext:
        fsGroup: 473
        runAsGroup: 473
        runAsNonRoot: true
        runAsUser: 473
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - configMap:
            defaultMode: 292
            name: piraeus-drbd-alloy
          name: config
        - emptyDir:
            sizeLimit: 512Mi
          name: storage
        - emptyDir:
            sizeLimit: 16Mi
          name: tmp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    description: Restrict the LINSTOR controller API to mutually authenticated HTTPS.
  name: linstor-controller-api
  namespace: piraeus-datastore
spec:
  ingress:
    - ports:
        - port: 3371
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: linstor-controller
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    description: Reporting-only lvs collector for the selected Piraeus thin pool.
  name: piraeus-lvm-metrics-collector
  namespace: piraeus-datastore
data:
  collect.sh: |
    #!/bin/sh
    # Report thin-pool usage with ordinary `lvs`; do not use LVM mutation commands.
    # `lvs --readonly` is intentionally omitted because it suppresses kernel status values.
    set -u

    vg=${LVM_VOLUME_GROUP:?LVM_VOLUME_GROUP must name the selected volume group}
    pool=${LVM_THIN_POOL:?LVM_THIN_POOL must name the selected thin pool}
    storage_pool=${LVM_STORAGE_POOL:?LVM_STORAGE_POOL must name the LINSTOR storage pool}
    node=${LVM_NODE:?LVM_NODE must name the Kubernetes storage node}
    output=/textfiles/lvm_thin_pool.prom
    tmp="${output}.tmp.$$"

    case "$node" in
      '' | *[!a-zA-Z0-9.-]*)
        exit 1
        ;;
    esac

    write_failure() {
      {
        printf '%s\n' \
          '# HELP lvm_thin_pool_collector_success Whether both thin-pool percentages were collected.' \
          '# TYPE lvm_thin_pool_collector_success gauge' \
          "lvm_thin_pool_collector_success{node=\"${node}\",storage_pool=\"${storage_pool}\",driver=\"LVM_THIN\",backing_pool=\"${vg}/${pool}\",vg=\"${vg}\",pool=\"${pool}\"} 0"
      } >"$tmp" || return 0
      /bin/mv -f "$tmp" "$output" || return 0
      return 0
    }

    collect_once() {
      raw="$(/usr/bin/timeout --kill-after=1s 5s /usr/sbin/lvs \
        --reportformat json --units b --nosuffix --noheadings \
        -o vg_name,lv_name,lv_size,lv_metadata_size,data_percent,metadata_percent "${vg}/${pool}" 2>/dev/null)" || {
        write_failure
        return 0
      }
      values="$(printf '%s' "$raw" | /usr/bin/jq -er --arg vg "$vg" --arg pool "$pool" '
        [ .report[]?.lv[]? | select(.vg_name == $vg and .lv_name == $pool) ] as $selected
        | if ($selected | length) == 1
             and $selected[0].data_percent != ""
             and $selected[0].metadata_percent != ""
             and $selected[0].lv_size != ""
             and $selected[0].lv_metadata_size != "" then
            ($selected[0].lv_size | tonumber | round) as $data_size
            | ($selected[0].lv_metadata_size | tonumber | round) as $metadata_size
            | ($selected[0].data_percent | tonumber) as $data_percent
            | ($selected[0].metadata_percent | tonumber) as $metadata_percent
            | [
                $data_percent,
                $metadata_percent,
                $data_size,
                $metadata_size,
                ($data_size * $data_percent / 100 | floor),
                ($metadata_size * $metadata_percent / 100 | floor)
              ] | @tsv
          else
            error("thin-pool capacity or percentage fields missing")
          end
      ' 2>/dev/null)" || {
        write_failure
        return 0
      }
      data_percent="$(printf '%s' "$values" | /usr/bin/cut -f 1)"
      metadata_percent="$(printf '%s' "$values" | /usr/bin/cut -f 2)"
      data_size="$(printf '%s' "$values" | /usr/bin/cut -f 3)"
      metadata_size="$(printf '%s' "$values" | /usr/bin/cut -f 4)"
      data_used_estimate="$(printf '%s' "$values" | /usr/bin/cut -f 5)"
      metadata_used_estimate="$(printf '%s' "$values" | /usr/bin/cut -f 6)"
      for percentage in "$data_percent" "$metadata_percent"; do
        case "$percentage" in
          '' | *[!0-9.]* | .* | *.)
            write_failure
            return 0
            ;;
        esac
        case "$percentage" in
          *.*.*)
            write_failure
            return 0
            ;;
        esac
      done
      for bytes in "$data_size" "$metadata_size" "$data_used_estimate" "$metadata_used_estimate"; do
        case "$bytes" in
          '' | *[!0-9]*)
            write_failure
            return 0
            ;;
        esac
      done

      now="$(/bin/date +%s 2>/dev/null)" || {
        write_failure
        return 0
      }
      case "$now" in
        '' | *[!0-9]*)
          write_failure
          return 0
          ;;
      esac

      {
        printf '%s\n' \
          '# HELP lvm_thin_pool_data_percent Thin-pool data usage as a percent.' \
          '# TYPE lvm_thin_pool_data_percent gauge' \
          '# HELP lvm_thin_pool_metadata_percent Thin-pool metadata usage as a percent.' \
          '# TYPE lvm_thin_pool_metadata_percent gauge' \
          '# HELP lvm_thin_pool_data_size_bytes Total data capacity of the thin pool.' \
          '# TYPE lvm_thin_pool_data_size_bytes gauge' \
          '# HELP lvm_thin_pool_data_used_bytes_estimate Estimated thin-pool data use, derived from LVM data_percent rounded to two decimal places.' \
          '# TYPE lvm_thin_pool_data_used_bytes_estimate gauge' \
          '# HELP lvm_thin_pool_metadata_size_bytes Total metadata capacity of the thin pool.' \
          '# TYPE lvm_thin_pool_metadata_size_bytes gauge' \
          '# HELP lvm_thin_pool_metadata_used_bytes_estimate Estimated thin-pool metadata use, derived from LVM metadata_percent rounded to two decimal places.' \
          '# TYPE lvm_thin_pool_metadata_used_bytes_estimate gauge' \
          '# HELP lvm_thin_pool_collector_last_success_timestamp_seconds Unix time of the last successful sample.' \
          '# TYPE lvm_thin_pool_collector_last_success_timestamp_seconds gauge' \
          '# HELP lvm_thin_pool_collector_success Whether both thin-pool percentages were collected.' \
          '# TYPE lvm_thin_pool_collector_success gauge' \
          "lvm_thin_pool_data_percent{node=\"${node}\",storage_pool=\"${storage_pool}\",driver=\"LVM_THIN\",backing_pool=\"${vg}/${pool}\",vg=\"${vg}\",pool=\"${pool}\"} ${data_percent}" \
          "lvm_thin_pool_metadata_percent{node=\"${node}\",storage_pool=\"${storage_pool}\",driver=\"LVM_THIN\",backing_pool=\"${vg}/${pool}\",vg=\"${vg}\",pool=\"${pool}\"} ${metadata_percent}" \
          "lvm_thin_pool_data_size_bytes{node=\"${node}\",storage_pool=\"${storage_pool}\",driver=\"LVM_THIN\",backing_pool=\"${vg}/${pool}\",vg=\"${vg}\",pool=\"${pool}\"} ${data_size}" \
          "lvm_thin_pool_data_used_bytes_estimate{node=\"${node}\",storage_pool=\"${storage_pool}\",driver=\"LVM_THIN\",backing_pool=\"${vg}/${pool}\",vg=\"${vg}\",pool=\"${pool}\"} ${data_used_estimate}" \
          "lvm_thin_pool_metadata_size_bytes{node=\"${node}\",storage_pool=\"${storage_pool}\",driver=\"LVM_THIN\",backing_pool=\"${vg}/${pool}\",vg=\"${vg}\",pool=\"${pool}\"} ${metadata_size}" \
          "lvm_thin_pool_metadata_used_bytes_estimate{node=\"${node}\",storage_pool=\"${storage_pool}\",driver=\"LVM_THIN\",backing_pool=\"${vg}/${pool}\",vg=\"${vg}\",pool=\"${pool}\"} ${metadata_used_estimate}" \
          "lvm_thin_pool_collector_last_success_timestamp_seconds{node=\"${node}\",storage_pool=\"${storage_pool}\",driver=\"LVM_THIN\",backing_pool=\"${vg}/${pool}\",vg=\"${vg}\",pool=\"${pool}\"} ${now}" \
          "lvm_thin_pool_collector_success{node=\"${node}\",storage_pool=\"${storage_pool}\",driver=\"LVM_THIN\",backing_pool=\"${vg}/${pool}\",vg=\"${vg}\",pool=\"${pool}\"} 1"
      } >"$tmp" || {
        write_failure
        return 0
      }
      /bin/mv -f "$tmp" "$output" || write_failure
      return 0
    }

    trap '/bin/rm -f "$tmp"' EXIT
    trap 'exit 0' HUP INT TERM
    while :; do
      collect_once
      /bin/sleep 15
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: piraeus-lvm-metrics
  name: piraeus-lvm-metrics
  namespace: piraeus-datastore
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: piraeus-lvm-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: piraeus-lvm-metrics
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - /bin/sh
            - /collector/collect.sh
          env:
            - name: LVM_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LVM_STORAGE_POOL
              value: ssd
            - name: LVM_VOLUME_GROUP
              value: piraeus_ssd
            - name: LVM_THIN_POOL
              value: data
          image: quay.io/piraeusdatastore/piraeus-server:v1.35.2
          imagePullPolicy: IfNotPresent
          name: lvm-collector
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            privileged: true
            runAsGroup: 0
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /dev
              name: host-dev
              readOnly: true
            - mountPath: /textfiles
              name: textfiles
            - mountPath: /collector
              name: collector-script
              readOnly: true
        - args:
            - --collector.disable-defaults
            - --collector.textfile
            - --collector.textfile.directory=/textfiles
            - --web.listen-address=:9100
          image: quay.io/prometheus/node-exporter:v1.12.1
          imagePullPolicy: IfNotPresent
          name: node-exporter
          ports:
            - containerPort: 9100
              name: metrics
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /textfiles
              name: textfiles
              readOnly: true
      hostNetwork: false
      nodeSelector:
        kubernetes.io/hostname: ovh-ns1001419
        storage.allegedly.works/piraeus-ready: "true"
      terminationGracePeriodSeconds: 5
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      volumes:
        - hostPath:
            path: /dev
            type: Directory
          name: host-dev
        - emptyDir: {}
          name: textfiles
        - configMap:
            defaultMode: 365
            name: piraeus-lvm-metrics-collector
          name: collector-script
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: piraeus-lvm-metrics
  name: piraeus-lvm-metrics
  namespace: piraeus-datastore
spec:
  ports:
    - name: metrics
      port: 9100
      protocol: TCP
      targetPort: metrics
  selector:
    app.kubernetes.io/name: piraeus-lvm-metrics
  type: ClusterIP
