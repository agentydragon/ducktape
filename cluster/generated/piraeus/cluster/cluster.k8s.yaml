          "lvm_thin_pool_data_size_bytes{node=\"${node}\",storage_pool=\"${storage_pool}\",driver=\"LVM_THIN\",backing_pool=\"${vg}/${pool}\",vg=\"${vg}\",pool=\"${pool}\"} ${data_size}" \
