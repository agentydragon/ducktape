apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linstor-cluster
  namespace: piraeus-datastore
spec:
  chart:
    spec:
      chart: linstor-cluster
      sourceRef:
        kind: HelmRepository
        name: piraeus-charts
        namespace: flux-system
      version: 1.3.2
  install:
    remediation:
      retries: 3
  interval: 30m
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              $patch: delete
              apiVersion: monitoring.coreos.com/v1
              kind: PodMonitor
              metadata:
                name: linstor-satellite
            target:
              group: monitoring.coreos.com
              kind: PodMonitor
              name: linstor-satellite
              version: v1
  timeout: 10m
  values:
    createApiTLS: cert-manager
    createInternalTLS: cert-manager
    linstorCluster:
      affinityController:
        enabled: true
        podTemplate:
          spec:
            nodeSelector:
              storage.allegedly.works/piraeus-ready: "true"
              topology.kubernetes.io/region: hil
      controller:
        enabled: true
        podTemplate:
          spec:
            nodeSelector:
              storage.allegedly.works/piraeus-ready: "true"
              topology.kubernetes.io/region: hil
      csiController:
        enabled: true
        podTemplate:
          spec:
            nodeSelector:
              storage.allegedly.works/piraeus-ready: "true"
              topology.kubernetes.io/region: hil
      csiNode:
        enabled: true
      highAvailabilityController:
        enabled: true
      nfsServer:
        enabled: false
      nodeAffinity:
        nodeSelectorTerms:
          - matchExpressions:
              - key: storage.allegedly.works/piraeus-ready
                operator: In
                values:
                  - "true"
      properties:
        - name: TcpPortAutoRange
          value: 7900-7999
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
    linstorSatelliteConfigurations:
      - deletionPolicy: Retain
        name: ssd-first-node
        nodeSelector:
          kubernetes.io/hostname: ovh-ns1001419
          storage.allegedly.works/piraeus-ready: "true"
        patches:
          - patch: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: reactor-config
              data:
                prometheus.toml: |
                  [[prometheus]]
                  enums = true
                  address = "127.0.0.1:9942"
            target:
              kind: ConfigMap
              name: reactor-config
              version: v1
        podTemplate:
          spec:
            dnsPolicy: ClusterFirstWithHostNet
            hostNetwork: true
            initContainers:
              - $patch: delete
                name: drbd-shutdown-guard
              - $patch: delete
                name: drbd-module-loader
            volumes:
              - $patch: delete
                name: run-systemd-system
              - $patch: delete
                name: run-drbd-shutdown-guard
              - $patch: delete
                name: systemd-bus-socket
              - $patch: delete
                name: lib-modules
              - $patch: delete
                name: usr-src
              - hostPath:
                  path: /var/etc/lvm/backup
                  type: DirectoryOrCreate
                name: etc-lvm-backup
              - hostPath:
                  path: /var/etc/lvm/archive
