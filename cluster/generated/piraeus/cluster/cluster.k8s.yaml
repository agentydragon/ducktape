          expr: (time() - lvm_thin_pool_collector_last_success_timestamp_seconds{namespace="piraeus-datastore",service="piraeus-lvm-metrics-ovh-ns104952",vg="piraeus_ssd",pool="data"} > 90 or absent(lvm_thin_pool_collector_last_success_timestamp_seconds{namespace="piraeus-datastore",service="piraeus-lvm-metrics-ovh-ns104952",vg="piraeus_ssd",pool="data"}) or time() - node_textfile_mtime_seconds{namespace="piraeus-datastore",service="piraeus-lvm-metrics-ovh-ns104952",file="/textfiles/lvm_thin_pool.prom"} > 90) and on(namespace) (kube_daemonset_status_desired_number_scheduled{namespace="piraeus-datastore",daemonset="piraeus-lvm-metrics-ovh-ns104952"} > 0)
          for: 2m
          labels:
            severity: warning
        - alert: PiraeusThinPoolScrapeMissing
          annotations:
            description: Alloy has not scraped the Piraeus thin-pool exporter successfully for 2 minutes.
            summary: Piraeus thin-pool exporter is not being scraped
          expr: ((up{namespace="piraeus-datastore",service="piraeus-lvm-metrics-ovh-ns104952"} == 0) or absent(up{namespace="piraeus-datastore",service="piraeus-lvm-metrics-ovh-ns104952"})) and on(namespace) (kube_daemonset_status_desired_number_scheduled{namespace="piraeus-datastore",daemonset="piraeus-lvm-metrics-ovh-ns104952"} > 0)
          for: 2m
          labels:
            severity: warning
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: piraeus-charts
  namespace: flux-system
spec:
  type: oci
  url: oci://ghcr.io/piraeusdatastore/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linstor-cluster
  namespace: piraeus-datastore
spec:
  chart:
    spec:
      chart: linstor-cluster
      sourceRef:
        kind: HelmRepository
        name: piraeus-charts
        namespace: flux-system
      version: 1.3.2
  install:
    remediation:
      retries: 3
  interval: 30m
  timeout: 10m
  values:
    createApiTLS: cert-manager
    createInternalTLS: cert-manager
    linstorCluster:
      affinityController:
        enabled: true
        podTemplate:
          spec:
            nodeSelector:
              storage.allegedly.works/drbd-canary: "true"
      controller:
        enabled: true
        podTemplate:
          spec:
            nodeSelector:
              storage.allegedly.works/drbd-canary: "true"
      csiController:
        enabled: true
        podTemplate:
          spec:
            nodeSelector:
              storage.allegedly.works/drbd-canary: "true"
      csiNode:
        enabled: true
      highAvailabilityController:
        enabled: false
      nfsServer:
        enabled: false
      nodeAffinity:
        nodeSelectorTerms:
          - matchExpressions:
              - key: storage.allegedly.works/drbd-canary
                operator: In
                values:
                  - "true"
          - matchExpressions:
              - key: storage.allegedly.works/piraeus-ready
                operator: In
                values:
                  - "true"
      properties:
        - name: TcpPortAutoRange
          value: 7900-7999
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
    linstorSatelliteConfigurations:
      - deletionPolicy: Retain
        name: talos-canary
        nodeSelector:
          storage.allegedly.works/drbd-canary: "true"
        patches:
          - patch: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: reactor-config
              data:
                prometheus.toml: |
                  [[prometheus]]
                  enums = true
                  address = "127.0.0.1:9942"
            target:
              kind: ConfigMap
              name: reactor-config
              version: v1
        podTemplate:
          spec:
            dnsPolicy: ClusterFirstWithHostNet
            hostNetwork: true
            initContainers:
              - $patch: delete
                name: drbd-shutdown-guard
              - $patch: delete
                name: drbd-module-loader
            volumes:
              - $patch: delete
                name: run-systemd-system
              - $patch: delete
                name: run-drbd-shutdown-guard
              - $patch: delete
                name: systemd-bus-socket
              - $patch: delete
                name: lib-modules
              - $patch: delete
                name: usr-src
              - hostPath:
                  path: /var/etc/lvm/backup
                  type: DirectoryOrCreate
                name: etc-lvm-backup
              - hostPath:
                  path: /var/etc/lvm/archive
                  type: DirectoryOrCreate
                name: etc-lvm-archive
        storagePools:
          - fileThinPool:
              directory: /var/mnt/local-path-ovh-hdd/linstor-canary
            name: local-canary
      - deletionPolicy: Retain
        name: ssd-first-node
        nodeSelector:
          kubernetes.io/hostname: ovh-ns1001419
          storage.allegedly.works/piraeus-ready: "true"
        patches:
          - patch: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: reactor-config
              data:
                prometheus.toml: |
                  [[prometheus]]
                  enums = true
                  address = "127.0.0.1:9942"
            target:
              kind: ConfigMap
              name: reactor-config
              version: v1
        podTemplate:
          spec:
            dnsPolicy: ClusterFirstWithHostNet
            hostNetwork: true
            initContainers:
              - $patch: delete
                name: drbd-shutdown-guard
              - $patch: delete
                name: drbd-module-loader
            volumes:
              - $patch: delete
                name: run-systemd-system
              - $patch: delete
                name: run-drbd-shutdown-guard
              - $patch: delete
                name: systemd-bus-socket
              - $patch: delete
                name: lib-modules
              - $patch: delete
                name: usr-src
              - hostPath:
                  path: /var/etc/lvm/backup
                  type: DirectoryOrCreate
                name: etc-lvm-backup
              - hostPath:
                  path: /var/etc/lvm/archive
                  type: DirectoryOrCreate
                name: etc-lvm-archive
        storagePools:
          - lvmThinPool:
              logicalVolumeCreateArguments:
                - --poolmetadatasize
                - 4G
                - --chunksize
                - 64K
              thinPool: data
              volumeGroup: piraeus_ssd
            name: ssd
            source:
              hostDevices:
                - /dev/disk/by-id/nvme-WDC_CL_SN720_SDAQNTW-512G-2000_1951A3449505
      - deletionPolicy: Retain
        name: ssd-ovh-ns104952
        nodeSelector:
          kubernetes.io/hostname: ovh-ns104952
          storage.allegedly.works/piraeus-ready: "true"
        patches:
          - patch: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: reactor-config
              data:
                prometheus.toml: |
                  [[prometheus]]
                  enums = true
                  address = "127.0.0.1:9942"
            target:
              kind: ConfigMap
              name: reactor-config
              version: v1
        podTemplate:
          spec:
            dnsPolicy: ClusterFirstWithHostNet
            hostNetwork: true
            initContainers:
              - $patch: delete
                name: drbd-shutdown-guard
              - $patch: delete
                name: drbd-module-loader
            volumes:
              - $patch: delete
                name: run-systemd-system
              - $patch: delete
                name: run-drbd-shutdown-guard
              - $patch: delete
                name: systemd-bus-socket
              - $patch: delete
                name: lib-modules
              - $patch: delete
                name: usr-src
              - hostPath:
                  path: /var/etc/lvm/backup
                  type: DirectoryOrCreate
                name: etc-lvm-backup
              - hostPath:
                  path: /var/etc/lvm/archive
                  type: DirectoryOrCreate
                name: etc-lvm-archive
        storagePools:
          - lvmThinPool:
              logicalVolumeCreateArguments:
                - --poolmetadatasize
                - 4G
                - --chunksize
                - 64K
              thinPool: data
              volumeGroup: piraeus_ssd
            name: ssd
            source:
              hostDevices:
                - /dev/disk/by-id/nvme-INTEL_SSDPE2MX450G7_BTPF8304019P450RGN
    storageClasses:
      - allowVolumeExpansion: true
        name: local-canary
        parameters:
          linstor.csi.linbit.com/allowRemoteVolumeAccess: "false"
          linstor.csi.linbit.com/placementCount: "1"
          linstor.csi.linbit.com/storagePool: local-canary
        reclaimPolicy: Retain
        volumeBindingMode: WaitForFirstConsumer
      - allowVolumeExpansion: true
        name: piraeus-ssd-local
        parameters:
          linstor.csi.linbit.com/allowRemoteVolumeAccess: "false"
          linstor.csi.linbit.com/placementCount: "1"
          linstor.csi.linbit.com/storagePool: ssd
        reclaimPolicy: Retain
        volumeBindingMode: WaitForFirstConsumer
