apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: flux-system
spec:
  interval: 24h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: kube-system
spec:
  chart:
    spec:
      chart: reloader
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
      version: 2.*
  install:
    remediation:
      retries: 3
  interval: 30m
  values:
    reloader:
      autoReloadAll: true
      deployment:
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      enableHA: false
      ignoreNamespaces: clickhouse
      reloadOnCreate: true
      reloadOnDelete: true
      reloadStrategy: annotations
      watchGlobally: true
