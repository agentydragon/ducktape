apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    rbac.ducktape.io/agent-readable-logs: "true"
  name: openebs
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openebs-lvm-localpv
  namespace: flux-system
spec:
  interval: 24h
  url: https://openebs.github.io/lvm-localpv
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-lvm-localpv
  namespace: openebs
spec:
  chart:
    spec:
      chart: lvm-localpv
      sourceRef:
        kind: HelmRepository
        name: openebs-lvm-localpv
        namespace: flux-system
      version: 1.10.1
  install:
    remediation:
      retries: 3
  interval: 30m
  values:
    lvmController:
      nodeSelector:
        topology.kubernetes.io/region: proxmox
    lvmNode:
      nodeSelector:
        topology.kubernetes.io/region: proxmox
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lvm-proxmox-ssd
allowVolumeExpansion: true
parameters:
  fstype: ext4
  storage: lvm
  thinProvision: "yes"
  volgroup: openebs-proxmox-ssd
provisioner: local.csi.openebs.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lvm-proxmox-ssd-block
allowVolumeExpansion: true
parameters:
  storage: lvm
  thinProvision: "yes"
  volgroup: openebs-proxmox-ssd
provisioner: local.csi.openebs.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lvm-proxmox-hdd
allowVolumeExpansion: true
parameters:
  fstype: ext4
  storage: lvm
  thinProvision: "yes"
  volgroup: openebs-proxmox-hdd
provisioner: local.csi.openebs.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lvm-proxmox-hdd-block
allowVolumeExpansion: true
parameters:
  storage: lvm
  thinProvision: "yes"
  volgroup: openebs-proxmox-hdd
provisioner: local.csi.openebs.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lvm-proxmox-hdd-shared
allowVolumeExpansion: true
parameters:
  fstype: ext4
  shared: "yes"
  storage: lvm
  thinProvision: "yes"
  volgroup: openebs-proxmox-hdd
provisioner: local.csi.openebs.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
  name: openebs-lvm-snapclass
deletionPolicy: Delete
driver: local.csi.openebs.io
