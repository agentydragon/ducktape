      - 'bearers.json={"owner": {"role": "owner", "token_file": "/var/run/platform-sessions/owner"}, "blueshield-read": {"role": "routes", "token_file": "/var/run/platform-sessions/blueshield-read", "allow": [{"instance": "blueshield", "method": "GET", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/retrieve/globalprofile/info/v2"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/member/message/center/read/v2"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/es/documents/download"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/member/coverages/pcp/goi/delegation/rules/preference/v4"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/member/benefits/claims/accumulation/v2"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/facets/claims/summary/v4"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/facets/claims/details/v4"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/member/claims/online/fetch/all/v1"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/product/benefits/mhprovider/v5"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/member/idcard/download/v4"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/member/mhr/lookup/v2"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/member/mhr/visits/v2"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/member/mhr/medication/v2"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/member/mhr/allergies/v2"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/member/mhr/immunization/v2"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/member/mhr/conditions/v2"}, {"instance": "blueshield", "method": "POST", "path": "/memberwebapp/reverseproxy-secured/v10/bsc/aip/api/bsc/gateway/member/mhr/labresults/v2"}]}}'
