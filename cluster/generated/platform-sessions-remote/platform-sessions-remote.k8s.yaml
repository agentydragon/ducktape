apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: platform-sessions-blueshield-control
  namespace: platform-sessions
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-sessions-blueshield-control
  namespace: platform-sessions
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: platform-sessions-blueshield-control
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    immutable: true
    name: platform-sessions-blueshield-control
    template:
      data:
        token: "{{ .password }}"
      type: Opaque
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: platform-sessions-blueshield-owner
  namespace: platform-sessions
spec:
  allowRepeat: true
  digits: 12
  length: 48
