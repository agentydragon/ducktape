apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-sessions-recorder-root-ca
  namespace: platform-sessions
spec:
  commonName: platform-sessions-recorder-root-ca
  duration: 87600h
  isCA: true
  issuerRef:
    kind: ClusterIssuer
    name: cluster-ca-bootstrap
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 8760h
  secretName: platform-sessions-recorder-ca
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: cert-manager
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: cert-manager
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: platform-sessions-recorder-trust
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        key: ca.crt
        name: cluster-root-ca-secret
    - secret:
        key: tls.crt
        name: platform-sessions-recorder-ca
  target:
    configMap:
      key: ca-certificates.crt
      metadata:
        annotations:
          description: Trust bundle for platform-session upstream recording
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - platform-sessions
---
apiVersion: generators.external-secrets.io/v1alpha1
