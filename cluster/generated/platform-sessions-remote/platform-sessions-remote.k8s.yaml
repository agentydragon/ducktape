            - --owner-token-file
            - /var/run/provider-credentials/owner
            - --route-token-file
            - /var/run/provider-credentials/route
            - --http-port
            - "8443"
            - --metrics-port
            - "9091"
            - --tls-cert
            - /var/run/provider-tls/tls.crt
            - --tls-key
            - /var/run/provider-tls/tls.key
            - --route-grants
            - /etc/platform-sessions/chatgpt-routes.json
          env:
            - name: HOME
              value: /tmp
            - name: HTTP_PROXY
              value: http://127.0.0.1:18080
            - name: HTTPS_PROXY
