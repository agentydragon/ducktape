apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-sessions-openai
  namespace: platform-sessions
spec:
  replicas: 0
  selector:
    matchLabels:
      app: platform-sessions-openai
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: platform-sessions-openai
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --integration-config
            - /etc/platform-sessions/openai-integration.json
            - --instance-id
            - openai
            - --control-address
            - 0.0.0.0:8444
            - --control-token-file
            - /var/run/provider-credentials/control
            - --owner-token-file
            - /var/run/provider-credentials/owner
            - --route-token-file
            - /var/run/provider-credentials/route
            - --http-port
            - "8443"
            - --metrics-port
            - "9091"
            - --tls-cert
            - /var/run/provider-tls/tls.crt
            - --tls-key
            - /var/run/provider-tls/tls.key
            - --route-grants
            - /etc/platform-sessions/openai-routes.json
          env:
            - name: HOME
              value: /tmp
            - name: HTTP_PROXY
              value: http://127.0.0.1:18080
            - name: HTTPS_PROXY
              value: http://127.0.0.1:18080
            - name: NO_PROXY
              value: localhost,127.0.0.1,.svc,.svc.cluster.local
            - name: SSL_CERT_FILE
              value: /var/run/session-recorder-trust/ca-certificates.crt
            - name: PLATFORM_SESSIONS_PROXY_ENABLED
              value: "true"
            - name: PLATFORM_SESSIONS_PROXY_CA_FILE
              value: /var/run/session-recorder-ca/tls.crt
          image: git.allegedly.works/ducktape-ci/platform-sessions-providers:unset
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          name: provider
          ports:
            - containerPort: 8443
              name: https
            - containerPort: 8444
              name: grpc
            - containerPort: 9091
              name: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/platform-sessions
              name: config
              readOnly: true
            - mountPath: /var/run/provider-credentials
              name: provider-credentials
              readOnly: true
            - mountPath: /var/run/provider-tls
              name: tls
              readOnly: true
            - mountPath: /data
              name: data
              subPath: state
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/run/session-recorder-ca
              name: recorder-ca-public
              readOnly: true
            - mountPath: /var/run/session-recorder-trust
              name: recorder-trust
              readOnly: true
      imagePullSecrets:
        - name: forgejo-images-creds
      initContainers:
        - command:
            - sh
            - -c
            - umask 077; cat /ca/tls.key /ca/tls.crt > /config/mitmproxy-ca.pem
          image: busybox:1.38
          name: recorder-ca-init
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /ca
              name: recorder-ca
              readOnly: true
            - mountPath: /config
              name: recorder-config
        - command:
            - sh
            - -c
            - umask 077; exec mitmdump -q --listen-host 127.0.0.1 --listen-port 18080 --set confdir=/config -w '+/captures/%Y-%m-%d.mitm'
          image: mitmproxy/mitmproxy:12.2.3
          name: upstream-recorder
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - import socket; socket.create_connection(('127.0.0.1', 18080), timeout=2).close()
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 128Mi
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            exec:
              command:
                - python
                - -c
                - import socket; socket.create_connection(('127.0.0.1', 18080), timeout=2).close()
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - mountPath: /config
              name: recorder-config
            - mountPath: /captures
              name: captures
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - configMap:
            name: remote-config
          name: config
        - name: provider-credentials
          projected:
            defaultMode: 288
            sources:
              - secret:
                  items:
                    - key: token
                      path: control
                  name: platform-sessions-openai-control
              - secret:
                  items:
                    - key: token
                      path: owner
                  name: platform-sessions-openai-owner
              - secret:
                  items:
                    - key: token
                      path: route
                  name: platform-sessions-openai-route
        - name: tls
          secret:
            secretName: platform-sessions-openai-tls
        - name: data
          persistentVolumeClaim:
            claimName: platform-sessions-openai-piraeus
        - emptyDir: {}
          name: tmp
        - name: captures
          persistentVolumeClaim:
            claimName: platform-sessions-openai-captures
        - name: recorder-ca
          secret:
            secretName: platform-sessions-recorder-ca
        - name: recorder-ca-public
          secret:
            items:
              - key: tls.crt
                path: tls.crt
            secretName: platform-sessions-recorder-ca
        - configMap:
            name: platform-sessions-recorder-trust
          name: recorder-trust
        - emptyDir: {}
          name: recorder-config
---
apiVersion: v1
