apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  annotations:
    description: Authenticated ducktape checkout for image automation pushes. The root flux-system GitRepository stays anonymous so Terraform can cold-bootstrap Flux before this SOPS-managed GitHub App Secret exists.
  name: ducktape-write
  namespace: flux-system
spec:
  interval: 24h
  provider: github
  ref:
    branch: devel
  secretRef:
    name: ducktape-automation-github-app
  sparseCheckout:
    - cluster/k8s/
  timeout: 5m
  url: https://github.com/agentydragon/ducktape.git
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: all-images
  namespace: flux-system
spec:
  git:
    checkout:
      ref:
        branch: devel
    commit:
      author:
        email: flux@allegedly.works
        name: flux-image-automation
      messageTemplate: |-
        chore: update images [skip ci]

        {{ range $resource, $changes := .Changed.Objects -}}
        {{ range $_, $change := $changes -}}
        {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{ end -}}
        {{ end -}}
    push:
      branch: devel
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: ducktape-write
  update:
    path: ./cluster/k8s
    strategy: Setters
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: nebula-routeros
  namespace: flux-system
spec:
  image: ghcr.io/agentydragon/nebula-routeros
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: nebula-routeros
  namespace: flux-system
spec:
  filterTags:
    pattern: ^devel-\d{14}-[0-9a-f]{7}$
  imageRepositoryRef:
    name: nebula-routeros
  policy:
    alphabetical:
      order: asc
