      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rolebindingc893b44530aa06ff58802502f8e589ab13daf4b7dc
  namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opentofu-finance-agent
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: opentofu-finance-agent
    namespace: crossplane-system
---
apiVersion: opentofu.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: crossplane-finance-agent
spec:
  backendFile: |
    conn_str = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
    schema_name = "finance_agent"
  configuration: |
    terraform {
      backend "pg" {}
    }
    provider "kubernetes" {
      config_path = "/etc/opentofu/kubernetes/opentofu-finance-agent"
    }
---
apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    crossplane.io/external-name: default
  name: finance-agent
spec:
  deletionPolicy: Orphan
  forProvider:
    env:
      - name: PGPASSWORD
        secretKeyRef:
          key: password
          name: tofu-state-db-credentials
          namespace: flux-system
    module: |
      # Forgejo repo + service user for Rai's personal financial-leash agent (an OpenAI/Codex
      # CLI workload, run outside the cluster from his own machine — see haku-state
      # memory/operator-model/operator.md and surface/plans/provider-trust-threat-model.md for the
      # trust reasoning behind giving OpenAI finance data).
      #
      # Provisions a private `finance-agent/finance-agent` repo owned by a dedicated `finance-agent`
      # service user (full read/write on its own repo), plus a write collaborator grant for `haku`
      # (operator, 2026-09-30) so Haku can help maintain it. No `claude` grant — not asked for.
      #
      # No transaction data lives in this repo — the agent queries Plaid live rather than committing
      # transactions to git history, which can't be un-committed later. The repo holds code/config only.
      # It mirrors tf/gitops/budget-ledger and tf/gitops/augur-evidence, minus their CI/sidecar consumers.
      # Its only in-cluster reader is Flux, which uses a separate read-only account and Secret.
      #
      # The Secret lands in the `forgejo` namespace, same as every other module here. Rai reads it
      # directly with his own kubectl access (`kubectl -n forgejo get secret finance-agent-git-creds -o
      # jsonpath=...`) to set up his local clone / Codex CLI. Flux reads through a separate
      # `finance-agent-flux-reader` collaborator and `finance-agent-flux-read-credentials` Secret.

      data "kubernetes_secret" "forgejo_admin" {
        metadata {
          name      = "forgejo-admin-password"
          namespace = "forgejo"
        }
      }

      provider "forgejo" {
        host     = var.forgejo_url
        username = data.kubernetes_secret.forgejo_admin.data["username"]
        password = data.kubernetes_secret.forgejo_admin.data["password"]
      }

      resource "random_password" "finance_agent" {
        length  = 48
        special = false
      }

      resource "forgejo_user" "finance_agent" {
        login                = "finance-agent"
        email                = "finance-agent@allegedly.works"
        password             = random_password.finance_agent.result
        must_change_password = false
        visibility           = "private"
      }

      # Flux uses a separate identity with read access to this repository only.
      resource "random_password" "finance_agent_flux_reader" {
        length  = 48
        special = false
      }

      resource "forgejo_user" "finance_agent_flux_reader" {
        login                = "finance-agent-flux-reader"
        email                = "finance-agent-flux-reader@allegedly.works"
        password             = random_password.finance_agent_flux_reader.result
        must_change_password = false
        visibility           = "private"
      }

      resource "forgejo_repository" "finance_agent" {
        owner          = forgejo_user.finance_agent.login
        name           = "finance-agent"
        description    = "Rai's personal financial-leash agent workspace (code/config only, no transaction data committed)."
        private        = true
        default_branch = "main"
        # Initial commit so `main` exists to clone/push against. No content seed.
        auto_init = true
      }

      # Write access for the haku agent account (user provisioned by tf/gitops/haku-state), so Haku
      # can help build/maintain this repo directly (operator, 2026-09-30).
      resource "forgejo_collaborator" "haku" {
        repository_id = forgejo_repository.finance_agent.id
        user          = "haku"
        permission    = "write"
      }

      resource "forgejo_collaborator" "flux_reader" {
        repository_id = forgejo_repository.finance_agent.id
        user          = forgejo_user.finance_agent_flux_reader.login
        permission    = "read"
      }

      # Git credentials for Rai's own local clone. Not copied anywhere in-cluster — retrieved
      # directly via kubectl, same access he already has to every other secret here.
      #
      # repo_url is the PUBLIC host, unlike every other module's `forgejo-http.forgejo:3000` — those
      # credentials are consumed by in-cluster pods; this one is consumed by Rai's own laptop, which
      # can't resolve the internal cluster-DNS name.
      resource "kubernetes_secret" "finance_agent_git_creds_source" {
        metadata {
          name      = "finance-agent-git-creds"
          namespace = "forgejo"
        }

        data = {
          username = forgejo_user.finance_agent.login
          password = random_password.finance_agent.result
          repo_url = "https://git.allegedly.works/${forgejo_user.finance_agent.login}/${forgejo_repository.finance_agent.name}.git"
        }
      }

      # Flux consumes only this repository-scoped read credential through External Secrets.
      resource "kubernetes_secret" "finance_agent_flux_reader_source" {
        metadata {
          name      = "finance-agent-flux-read-credentials"
          namespace = "forgejo"
        }

        data = {
          username = forgejo_user.finance_agent_flux_reader.login
          password = random_password.finance_agent_flux_reader.result
        }
      }

      # Match the dedicated Flux Receiver in cluster/cdk8s/flux_webhook.py.
      # The generic Receiver authenticates by its unguessable token-derived URL, as
      # in haku-state. Keep the token and URL in Terraform state / Kubernetes Secrets.
      resource "random_password" "flux_webhook_token" {
        length  = 48
        special = false
      }

      resource "kubernetes_secret" "flux_webhook_token_source" {
        metadata {
          name      = "finance-agent-flux-webhook-token"
          namespace = "forgejo"
        }
        data = {
          token = random_password.flux_webhook_token.result
        }
      }

      resource "forgejo_repository_webhook" "flux" {
        repository_id = forgejo_repository.finance_agent.id
        type          = "forgejo"
        active        = true
        branch_filter = "main"
        events        = ["push"]
        config = {
          content_type = "json"
          # Forgejo blocks private webhook destinations; use the existing public route.
          url = "https://flux-webhook.allegedly.works/hook/${sha256(join("", [random_password.flux_webhook_token.result, "finance-agent", "flux-system"]))}"
        }
      }


      terraform {
        required_version = ">= 1.0"

        required_providers {
          forgejo = {
            source  = "svalabs/forgejo"
            version = "~> 1.5"
          }
          kubernetes = {
            source  = "hashicorp/kubernetes"
            version = "~> 3.0"
          }
          random = {
            source  = "hashicorp/random"
            version = "~> 3.7"
          }
        }
      }

      variable "forgejo_url" {
        description = "Forgejo internal cluster API URL"
        type        = string
        default     = "http://forgejo-http.forgejo:3000"
      }
    planArgs:
      - -lock-timeout=5m
    source: Inline
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    name: crossplane-finance-agent
