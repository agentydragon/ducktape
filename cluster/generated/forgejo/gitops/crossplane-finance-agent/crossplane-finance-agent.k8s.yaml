  name: opentofu-finance-agent
  namespace: crossplane-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opentofu-finance-agent-impersonate
  namespace: crossplane-system
rules:
  - apiGroups:
      - ""
    resourceNames:
      - opentofu-finance-agent
    resources:
      - serviceaccounts
    verbs:
      - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rolebindingc86483c4f6460e6701b084e9fdbab5c5c15698275b
  namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opentofu-finance-agent-impersonate
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: crossplane-opentofu
    namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opentofu-finance-agent
  namespace: forgejo
rules:
  - apiGroups:
