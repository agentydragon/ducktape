apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: auto
  name: budget
spec: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-secret-reader
  namespace: budget
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: budget-ledger-git-creds-reader
  namespace: forgejo
rules:
  - apiGroups:
      - ""
    resourceNames:
      - budget-ledger-git-creds
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: budget-ledger-git-creds-reader
  namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: budget-ledger-git-creds-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: forgejo-secret-reader
    namespace: budget
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-budget-ledger-git-creds-secret-store
spec:
  conditions:
    - namespaces:
        - budget
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: forgejo-secret-reader
      remoteNamespace: forgejo
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: budget-ledger-git-creds
  namespace: budget
spec:
  dataFrom:
    - extract:
        key: budget-ledger-git-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-budget-ledger-git-creds-secret-store
  target:
    creationPolicy: Owner
    name: budget-ledger-git-creds
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: augur
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: augur
