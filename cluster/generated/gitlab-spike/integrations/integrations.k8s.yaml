        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - gitlab-spike.allegedly.works
            - registry-gitlab-spike.allegedly.works
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app: gitlab-spike-runner
