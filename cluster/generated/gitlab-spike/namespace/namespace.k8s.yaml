apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: "off"
    pod-security.kubernetes.io/enforce: baseline
  name: gitlab-spike
spec: {}
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: "off"
    pod-security.kubernetes.io/enforce: baseline
  name: gitlab-spike-ci
spec: {}
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: "off"
    pod-security.kubernetes.io/enforce: baseline
  name: gitlab-spike-demo
spec: {}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: gitlab-root-password
  namespace: gitlab-spike
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-root-password
  namespace: gitlab-spike
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: gitlab-root-password
  refreshPolicy: CreatedOnce
  target:
    name: gitlab-root-password
    template:
      data:
        password: "{{ .password }}"
      type: Opaque
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: gitlab-bootstrap-token
  namespace: gitlab-spike
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-bootstrap-token
  namespace: gitlab-spike
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: gitlab-bootstrap-token
  refreshPolicy: CreatedOnce
  target:
    name: gitlab-bootstrap-token
    template:
      data:
        token: "{{ .password }}"
      type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-spike-bootstrap
  namespace: gitlab-spike
data:
  main.rb: |
    # This token is owned by ESO, consumed by tofu-controller, and never logged.
    token = File.read('/opt/spike-token/token').strip
    raise 'Empty bootstrap token' if token.empty?

    root = User.find_by_username!('root')
    access = root.personal_access_tokens.find_or_initialize_by(name: 'gitlab-spike-tofu')
    access.scopes = ['api']
    access.expires_at = 90.days.from_now.to_date
    access.set_token(token)
    access.save!
immutable: false
