      secretKey: access_key
    - remoteRef:
        key: gitlab-spike-lfs-s3-credentials
        property: AWS_SECRET_ACCESS_KEY
      secretKey: secret_key
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gitlab-s3-credentials
  target:
    creationPolicy: Owner
    name: gitlab-spike-lfs-connection
    template:
      data:
        connection: |
          provider: AWS
          region: us-east-1
          aws_access_key_id: '{{ .access_key }}'
          aws_secret_access_key: '{{ .secret_key }}'
          endpoint: http://seaweedfs-s3.seaweedfs.svc:8333
          path_style: true
          aws_signature_version: 4
      engineVersion: v2
