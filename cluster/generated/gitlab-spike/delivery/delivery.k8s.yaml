apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gitlab-spike
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  secretRef:
    name: gitlab-spike-git
  url: http://gitlab-spike-webservice-default.gitlab-spike.svc:8181/spike/acceptance.git
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: gitlab-spike
  namespace: flux-system
spec:
  image: registry-gitlab-spike.allegedly.works/spike/acceptance
  interval: 1m
  secretRef:
    name: gitlab-spike-registry
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: gitlab-spike
  namespace: flux-system
spec:
  filterTags:
    pattern: ^devel-\d{14}-[0-9a-f]{7}$
  imageRepositoryRef:
    name: gitlab-spike
  policy:
    alphabetical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: gitlab-spike
  namespace: flux-system
spec:
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: spike-flux@invalid.example
        name: spike-flux
      messageTemplate: "chore: update spike image [skip ci]"
    push:
      branch: main
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: gitlab-spike
  update:
    path: ./k8s
    strategy: Setters
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: gitlab-spike
  namespace: flux-system
spec:
  events:
    - Push Hook
    - Pipeline Hook
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: gitlab-spike
    - apiVersion: image.toolkit.fluxcd.io/v1
      kind: ImageRepository
      name: gitlab-spike
    - apiVersion: image.toolkit.fluxcd.io/v1
      kind: ImageUpdateAutomation
      name: gitlab-spike
  secretRef:
    name: gitlab-spike-webhook
  type: gitlab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-spike
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-spike
  namespace: gitlab-spike-demo
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rolebindingc8efa7efb4c808043ff2e208fc03dfaf1eecd0a9d7
  namespace: gitlab-spike-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-spike
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: gitlab-spike
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitlab-spike-demo
  namespace: ducktape-flux
spec:
  interval: 1m
  path: ./k8s
  prune: true
  retryInterval: 1m
  serviceAccountName: gitlab-spike
  sourceRef:
    kind: GitRepository
    name: gitlab-spike
  targetNamespace: gitlab-spike-demo
  timeout: 5m
  wait: true
