apiVersion: v1
kind: Namespace
metadata:
  annotations:
    goldilocks.fairwinds.com/vpa-resource-policy: '{"containerPolicies": [{"containerName": "keda-operator", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "50m", "memory": "128Mi"}, "maxAllowed": {"cpu": "50m", "memory": "256Mi"}, "controlledResources": ["memory"]}, {"containerName": "keda-operator-metrics-apiserver", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "50m", "memory": "128Mi"}, "maxAllowed": {"cpu": "50m", "memory": "256Mi"}, "controlledResources": ["memory"]}, {"containerName": "keda-admission-webhooks", "controlledValues": "RequestsOnly", "minAllowed": {"cpu": "25m", "memory": "64Mi"}, "maxAllowed": {"cpu": "25m", "memory": "128Mi"}, "controlledResources": ["memory"]}, {"containerName": "*", "controlledValues": "RequestsOnly", "mode": "Off"}]}'
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: initial
  name: keda
spec: {}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: keda
  namespace: keda
spec:
  interval: 24h
  url: https://kedacore.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  chart:
    spec:
      chart: keda
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: keda
        namespace: keda
      version: 2.20.2
  install:
    crds: Create
    remediation:
      retries: 3
  interval: 15m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    nodeSelector:
      topology.kubernetes.io/region: hil
    podDisruptionBudget:
      webhooks:
        minAvailable: 1
    resources:
      metricServer:
        limits:
          cpu: 250m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi
      operator:
        limits:
          cpu: 250m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi
      webhooks:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 64Mi
    watchNamespace: haku-ci,buildbuddy-executor
    webhooks:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: keda-admission-webhooks
              topologyKey: kubernetes.io/hostname
      replicaCount: 2
