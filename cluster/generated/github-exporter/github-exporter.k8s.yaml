e, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 6}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"min\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"none\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 15}}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 3, \"targets\": [{\"expr\": \"min by (github_account, resource) (github_rate_remaining{resource!=\\\"graphql\\\"})\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{github_account}} / {{resource}}\", \"refId\": \"A\"}], \"title\": \"Remaining quota by REST API resource\", \"description\": \"From REST /rate_limit. `graphql` is excluded: that endpoint reports the GraphQL bucket as permanently full even while GraphQL is exhausted. The GraphQL panels above read GitHub's GraphQL response headers instead.\", \"transparent\": false, \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 16}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"none\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 1, \"fillOpacity\": 10}}, \"overrides\": []}}, {\"type\": \"timeseries\", \"id\": 4, \"targets\": [{\"expr\": \"max by (github_account) (github_graphql_rate_used)\", \"datasource\": {\"type\": \"prometheus\", \"uid\": \"${DS_MIMIR}\"}, \"legendFormat\": \"{{github_account}} used\", \"refId\": \"A\"}, {\"expr\": \"min by (github_account) (github_graphql_rate_limit)\", \"datasource\": {\"type\": \"prometheus\", \"uid\"