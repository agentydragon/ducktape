apiVersion: v1
kind: Namespace
metadata:
  name: reflector-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: emberstack
  namespace: reflector-system
spec:
  interval: 24h
  url: https://emberstack.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: reflector-system
spec:
  chart:
    spec:
      chart: reflector
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: reflector-system
      version: 10.0.65
  install:
    remediation:
      retries: 3
  interval: 15m
  values:
    affinity: {}
    configuration:
      logging:
        minimumLevel: Information
      watcher:
        timeout: 300
    fullnameOverride: reflector
    image:
      pullPolicy: IfNotPresent
      repository: emberstack/kubernetes-reflector
      tag: 10.0.65
    nameOverride: reflector
    nodeSelector: {}
    rbac:
      enabled: true
    replicaCount: 1
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    serviceAccount:
      create: true
      name: reflector
    tolerations: []
