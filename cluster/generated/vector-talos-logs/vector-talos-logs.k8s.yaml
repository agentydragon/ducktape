apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "false"
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
  name: vector-talos-logs
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: vector-talos-logs
  name: vector-talos-logs
  namespace: vector-talos-logs
spec:
  selector:
    matchLabels:
      app: vector-talos-logs
  template:
    metadata:
      labels:
        app: vector-talos-logs
    spec:
      containers:
        - args:
            - --config
            - /etc/vector/vector.toml
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VECTOR_LOG
              value: warn
            - name: VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION
              value: "true"
          image: docker.io/timberio/vector:0.58.0-distroless-libc@sha256:6c93dfe2554cc7e38316d618961cd657d5271c7a7aa727e0007502b28cb82c2e
          name: vector
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
            tcpSocket:
              host: 127.0.0.1
              port: 13333
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/vector
              name: config
              readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      nodeSelector:
        node-vendor: talos
      tolerations:
        - operator: Exists
      volumes:
        - configMap:
            name: vector-talos-config
          name: config
