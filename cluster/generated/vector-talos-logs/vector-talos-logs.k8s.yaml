apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "false"
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
  name: vector-talos-logs
spec: {}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: vector-talos-logs
  name: vector-talos-logs
  namespace: vector-talos-logs
spec:
  selector:
    matchLabels:
      app: vector-talos-logs
  template:
    metadata:
      labels:
        app: vector-talos-logs
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - run
            - /etc/alloy/talos.alloy
            - --stability.level=experimental
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=127.0.0.1:12347
            - --disable-reporting
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TALOS_LISTEN_ADDRESS
              value: 127.0.0.1:13333
            - name: LOKI_PUSH_URL
              value: http://loki-write.loki.svc.cluster.local:3100/loki/api/v1/push
          image: docker.io/grafana/alloy:v1.21.1@sha256:4039c971193053a84e53dd9ed3e7d4561c069256b024631cd3498a353ed7ece8
          name: alloy
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
            tcpSocket:
              host: 127.0.0.1
              port: 13333
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 473
          volumeMounts:
            - mountPath: /etc/alloy
              name: config
              readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      nodeSelector:
        node-vendor: talos
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - effect: NoSchedule
          operator: Exists
      volumes:
        - configMap:
            name: vector-talos-config
          name: config
