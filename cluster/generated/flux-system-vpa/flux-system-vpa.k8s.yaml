apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: helm-controller
  namespace: flux-system
spec:
  resourcePolicy:
    containerPolicies:
      - containerName: manager
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsOnly
        maxAllowed:
          cpu: 175m
          memory: 384Mi
        minAllowed:
          cpu: 100m
          memory: 64Mi
      - containerName: "*"
        mode: "Off"
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: helm-controller
  updatePolicy:
    updateMode: Initial
---
