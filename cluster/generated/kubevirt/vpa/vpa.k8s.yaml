apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: virt-api
  namespace: kubevirt
spec:
  resourcePolicy:
    containerPolicies:
      - containerName: virt-api
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsOnly
      - containerName: "*"
        mode: "Off"
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: virt-api
  updatePolicy:
    updateMode: Initial
---
