apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  annotations:
    description: KubeVirt control plane for running virtual machines on KVM-capable Kubernetes workers.
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates:
        - HostDevices
        - EnableVirtioFsStorageVolumes
    imagePullPolicy: IfNotPresent
    permittedHostDevices:
      usb:
        - resourceName: kubevirt.io/cpap-wifi
          selectors:
            - product: "7961"
              vendor: 0e8d
    smbios:
      manufacturer: Talos Virtualization
      product: allegedly-works-kubevirt
      sku: allegedly-works
      version: v0.1.0
  customizeComponents:
    patches:
      - patch: '[{"op": "add", "path": "/spec/template/spec/topologySpreadConstraints", "value": [{"maxSkew": 1, "topologyKey": "kubernetes.io/hostname", "whenUnsatisfiable": "DoNotSchedule", "labelSelector": {"matchLabels": {"kubevirt.io": "virt-api"}}, "matchLabelKeys": ["pod-template-hash"], "minDomains": 2, "nodeTaintsPolicy": "Honor"}]}]'
        resourceName: virt-api
        resourceType: Deployment
        type: json
      - patch: '[{"op": "add", "path": "/spec/template/spec/topologySpreadConstraints", "value": [{"maxSkew": 1, "topologyKey": "kubernetes.io/hostname", "whenUnsatisfiable": "DoNotSchedule", "labelSelector": {"matchLabels": {"kubevirt.io": "virt-controller"}}, "matchLabelKeys": ["pod-template-hash"], "minDomains": 2, "nodeTaintsPolicy": "Honor"}]}]'
        resourceName: virt-controller
        resourceType: Deployment
        type: json
  imagePullPolicy: IfNotPresent
  infra:
    nodePlacement:
      nodeSelector:
        topology.kubernetes.io/region: hil
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
  workloadUpdateStrategy: {}
  workloads:
    nodePlacement:
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
