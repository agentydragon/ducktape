apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: initial
    rbac.ducktape.io/agent-readable-logs: "true"
  name: cnpg-system
spec: {}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 24h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    cnpg.io/reload: ""
  name: table-size-queries
  namespace: cnpg-system
stringData:
  queries: |
    pg_table:
      primary: true
      target_databases:
        - "*"
      query: |
        SELECT pg_catalog.current_database() AS datname,
               n.nspname AS schemaname,
               c.relname,
               pg_catalog.pg_total_relation_size(c.oid) AS total_bytes
        FROM pg_catalog.pg_class AS c
        JOIN pg_catalog.pg_namespace AS n ON n.oid = c.relnamespace
        WHERE c.relkind IN ('r', 'm')
          AND c.relpersistence <> 't'
          AND n.nspname !~ '^pg_'
          AND n.nspname <> 'information_schema'
      metrics:
        - datname:
            usage: LABEL
            description: Database name
        - schemaname:
            usage: LABEL
            description: Schema name
        - relname:
            usage: LABEL
            description: Table or materialized view name
        - total_bytes:
            usage: GAUGE
            description: Allocated bytes including indexes and TOAST, reported per physical table or materialized view
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
      version: 0.29.1
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  interval: 30m
  upgrade:
    crds: CreateReplace
  values:
    config:
      data:
        MONITORING_QUERIES_SECRET: table-size-queries
    priorityClassName: system-cluster-critical
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    description: CloudNativePG Barman Cloud plugin for physical backups and WAL archiving.
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  chart:
    spec:
      chart: plugin-barman-cloud
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
      version: 0.8.0
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  interval: 30m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    priorityClassName: system-cluster-critical
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-operator
  namespace: cnpg-system
spec:
  podMetricsEndpoints:
    - path: /metrics
      port: metrics
  selector:
    matchLabels:
      app.kubernetes.io/instance: cnpg
      app.kubernetes.io/name: cloudnative-pg
