apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/descheduler
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  chart:
    spec:
      chart: descheduler
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: kube-system
      version: 0.36.0
  install:
    remediation:
      retries: 3
  interval: 30m
  values:
    deschedulerPolicy:
      metricsProviders:
        - source: KubernetesMetrics
      profiles:
        - name: default
          pluginConfig:
            - args:
                nodeFit: true
                priorityThreshold:
                  value: 1000000
              name: DefaultEvictor
            - args:
                metricsUtilization:
                  source: KubernetesMetrics
                targetThresholds:
                  cpu: 50
                  memory: 70
                thresholds:
                  cpu: 20
                  memory: 20
              name: LowNodeUtilization
            - args: {}
              name: RemoveDuplicates
            - args:
                includingInitContainers: true
                podRestartThreshold: 50
              name: RemovePodsHavingTooManyRestarts
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
                - RemoveDuplicates
            deschedule:
              enabled:
                - RemovePodsHavingTooManyRestarts
    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    rbac:
      create: true
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 25m
        memory: 128Mi
    schedule: "*/15 * * * *"
