apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: control-plane-io-alerts
  namespace: monitoring
spec:
  groups:
    - name: control-plane-io
      rules:
        - expr: |
            max by (node, disk, device_path) (
              label_replace(
                label_replace(
                  max by (node, device) (
                    node_filesystem_size_bytes{mountpoint="/var", device=~"^/dev/.+"}
                    * on (namespace, pod) group_left (node)
                      max by (namespace, pod, node) (
                        kube_pod_info{namespace="monitoring", pod=~"prometheus-node-exporter-.+"}
                      )
                  ),
                  "disk", "$1", "device", "^/dev/(nvme[0-9]+n[0-9]+|mmcblk[0-9]+|[a-z]+)(p?[0-9]+)?$"
                ),
                "device_path", "/dev/$1", "disk", "^(.+)$"
              )
              * on (node) group_left () max by (node) (kube_node_role{role="control-plane"} == 1)
            ) > bool 0
          record: cluster:talos_system_disk_device_info
        - alert: ControlPlaneSystemDiskBusy
          annotations:
            description: Device {{ $labels.device_path }} backing Talos /var on control-plane node {{ $labels.node }} has been busy for more than 50% of wall time over 15 minutes. Talos EPHEMERAL and etcd use this system disk.
            summary: Control-plane system disk {{ $labels.device_path }} is busy on {{ $labels.node }}
          expr: |
            label_replace(
              rate(node_disk_io_time_seconds_total{device!~"^(loop|ram|fd|dm-|sr|nbd|drbd).*"}[10m]),
              "disk", "$1", "device", "^(.+)$"
            )
            * on (namespace, pod) group_left (node)
              max by (namespace, pod, node) (
                kube_pod_info{namespace="monitoring", pod=~"prometheus-node-exporter-.+"}
              )
            * on (node, disk) group_left (device_path) cluster:talos_system_disk_device_info{disk!~"^(loop|ram|fd|dm-|sr|nbd|drbd).*"}
            > 0.50
          for: 15m
          labels:
            severity: warning
        - alert: ControlPlanePodSystemDiskWriterHigh
          annotations:
            description: Pod {{ $labels.namespace }}/{{ $labels.pod }} on {{ $labels.node }} is writing {{ $value | humanize1024 }}B/s to {{ $labels.device_path }}, the device backing Talos /var, for more than 10 minutes, which can contend with etcd.
            summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is writing heavily to {{ $labels.device_path }}
          expr: |
            sum by (namespace, pod, node, device_path) (
              label_replace(
                rate(
                  container_fs_writes_bytes_total{
                    device=~"^/dev/.+", container!="", pod!="", namespace!="kube-system"
                  }[10m]
                ),
                "device_path", "$1", "device", "^(.+)$"
              )
              * on (node, device_path) group_left () cluster:talos_system_disk_device_info{disk!~"^(loop|ram|fd|dm-|sr|nbd|drbd).*"}
            ) > 1048576
          for: 10m
          labels:
            severity: warning
        - alert: ControlPlaneLeasePutLatency
          annotations:
            description: p99 apiserver lease PUT latency on {{ $labels.instance }} has exceeded 500ms for 10 minutes. This is an early signal for leader-election and node-lease write path contention.
            summary: Apiserver lease PUT latency is high on {{ $labels.instance }}
          expr: |
            histogram_quantile(
              0.99,
              sum by (instance, le) (
                rate(apiserver_request_duration_seconds_bucket{resource="leases", verb="PUT", scope="resource"}[10m])
              )
            ) > 0.5
          for: 10m
          labels:
            severity: warning
        - alert: ControlPlaneLeasePutLatency
          annotations:
            description: p99 apiserver lease PUT latency on {{ $labels.instance }} has exceeded 2s for 5 minutes. Leader election and node heartbeats may time out.
            summary: Apiserver lease PUT latency is critical on {{ $labels.instance }}
          expr: |
            histogram_quantile(
              0.99,
              sum by (instance, le) (
                rate(apiserver_request_duration_seconds_bucket{resource="leases", verb="PUT", scope="resource"}[10m])
              )
            ) > 2
          for: 5m
          labels:
            severity: critical
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: disk-usage-rules
  namespace: monitoring
spec:
  groups:
    - name: disk-usage
      rules:
        - expr: group by (node, device, mountpoint) (node_filesystem_size_bytes{fstype=~"ext4|xfs",device!="",device!~"/dev/drbd.*"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace="monitoring",pod=~"prometheus-node-exporter-.+"}))
          record: disk_usage:mount:info
        - expr: max by (node, device) (node_filesystem_size_bytes{fstype=~"ext4|xfs",device!="",device!~"/dev/drbd.*"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace="monitoring",pod=~"prometheus-node-exporter-.+"}))
          record: disk_usage:filesystem_size_bytes
        - expr: max by (node, device) (node_filesystem_free_bytes{fstype=~"ext4|xfs",device!="",device!~"/dev/drbd.*"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace="monitoring",pod=~"prometheus-node-exporter-.+"}))
          record: disk_usage:filesystem_free_bytes
        - expr: max by (node, device) (node_filesystem_avail_bytes{fstype=~"ext4|xfs",device!="",device!~"/dev/drbd.*"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace="monitoring",pod=~"prometheus-node-exporter-.+"}))
          record: disk_usage:filesystem_avail_bytes
        - expr: |
            max by (node, device, media) (
              label_replace(
                group by (node, device) (disk_usage:mount:info),
                "disk", "$1", "device", "/dev/(nvme[0-9]+n[0-9]+|mmcblk[0-9]+|[a-z]+)(p?[0-9]+)?"
              )
              * on (node, disk) group_left (media)
                max by (node, disk, media) (
                  label_replace(label_replace(label_replace(label_replace(label_replace(
                    node_disk_info * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{namespace="monitoring",pod=~"prometheus-node-exporter-.+"}),
                    "disk", "$1", "device", "(.+)"),
                    "media", "HDD", "rotational", "1"),
                    "media", "SSD", "rotational", "0"),
                    "media", "virtual", "model", "QEMU_.*"),
                    "media", "virtual", "device", "vd[a-z]+")
                )
              or on (node, device)
              label_replace(group by (node, device) (disk_usage:mount:info), "media", "unknown", "", "")
            )
          record: disk_usage:filesystem:info
        - expr: |
            max by (namespace, pod, volume, persistentvolumeclaim, node, path) (
              max by (namespace, pod, volume, persistentvolumeclaim) (kube_pod_spec_volumes_persistentvolumeclaims_info)
              * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{node!=""})
              * on (namespace, persistentvolumeclaim) group_left (persistentvolume)
                label_replace(
                  max by (namespace, persistentvolumeclaim, volumename) (kube_persistentvolumeclaim_info),
                  "persistentvolume", "$1", "volumename", "(.+)"
                )
              * on (persistentvolume) group_left (path)
                label_replace(
                  label_replace(
                    max by (persistentvolume, host_path, local_path) (kube_persistentvolume_info),
                    "path", "$1", "host_path", "(.+)"
                  ),
                  "path", "$1", "local_path", "(.+)"
                )
            )
          record: disk_usage:pvc_path:info
        - expr: |
            max by (namespace, pod, volume, persistentvolumeclaim, node, device) (
            label_replace(disk_usage:pvc_path:info, "mountpoint", "$1", "path", "(/[^/]+/[^/]+/[^/]+)(/.*)?")
              * on (node, mountpoint) group_left (device) disk_usage:mount:info
            or on (namespace, pod, volume)
            label_replace(disk_usage:pvc_path:info, "mountpoint", "$1", "path", "(/[^/]+/[^/]+)(/.*)?")
              * on (node, mountpoint) group_left (device) disk_usage:mount:info
            or on (namespace, pod, volume)
            label_replace(disk_usage:pvc_path:info, "mountpoint", "$1", "path", "(/[^/]+)(/.*)?")
              * on (node, mountpoint) group_left (device) disk_usage:mount:info
            or on (namespace, pod, volume)
            label_replace(disk_usage:pvc_path:info, "mountpoint", "/", "path", "/.*")
              * on (node, mountpoint) group_left (device) disk_usage:mount:info
            )
          record: disk_usage:pvc_filesystem:info
        - expr: |
            label_replace(
            sum by (node, device, namespace, persistentvolumeclaim, component) (
              label_replace(
                label_replace(
                  max by (namespace, pod, collection) (
                    SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",type="normal"}
                  ),
                  "component", "SeaweedFS (default collection)", "collection", ""
                ),
                "component", "SeaweedFS: $1", "collection", "(.+)"
              )
              * on (namespace, pod) group_left (node, device, persistentvolumeclaim)
                disk_usage:pvc_filesystem:info{namespace="seaweedfs"}
            ),
              "category", "SeaweedFS", "", ""
            )
            or
            label_replace(
            label_replace(
              sum by (node, device, namespace, persistentvolumeclaim) (
                max by (namespace, pod) (
                  SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",type="deleted_bytes"}
                )
                * on (namespace, pod) group_left (node, device, persistentvolumeclaim)
                  disk_usage:pvc_filesystem:info{namespace="seaweedfs"}
              ),
              "component", "SeaweedFS deleted, awaiting vacuum", "", ""
            ),
              "category", "SeaweedFS deleted, awaiting vacuum", "", ""
            )
            or
            label_replace(
            label_replace(
              sum by (node, device, namespace, persistentvolumeclaim) (
                (
                  max by (namespace, pod) (ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTables{namespace="clickhouse"})
                  + max by (namespace, pod) (ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTablesSystem{namespace="clickhouse"})
                )
                * on (namespace, pod) group_left (node, device, persistentvolumeclaim)
                  disk_usage:pvc_filesystem:info{namespace="clickhouse"}
              ),
              "component", "ClickHouse", "", ""
            ),
              "category", "ClickHouse", "", ""
            )
            or
            label_replace(
            sum by (node, device, namespace, persistentvolumeclaim, component) (
              label_replace(
                max by (namespace, pod, datname) (cnpg_pg_database_size_bytes{datname!~"template0|template1"}),
                "component", "Postgres: $1", "namespace", "(.+)"
              )
              * on (namespace, pod) group_left (node, device, persistentvolumeclaim)
                disk_usage:pvc_filesystem:info{volume="pgdata"}
            ),
              "category", "Postgres (CNPG)", "", ""
            )
          record: disk_usage:application_used_bytes
        - expr: |
            disk_usage:application_used_bytes
            or
            (
            label_replace(
            label_replace(
              label_join(
                max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes)
                * on (namespace, persistentvolumeclaim) group_left (node, device)
                  max by (namespace, persistentvolumeclaim, node, device) (disk_usage:pvc_filesystem:info),
                "component", "/", "namespace", "persistentvolumeclaim"
              ),
              "component", "PVC: $1", "component", "(.+)"
            ),
              "category", "Kubelet-measured PVCs", "", ""
            )
              unless on (namespace, persistentvolumeclaim) disk_usage:application_used_bytes
            )
          record: disk_usage:component_used_bytes
        - expr: |
            disk_usage:filesystem_size_bytes - disk_usage:filesystem_free_bytes
            - on (node, device) (
              sum by (node, device) (disk_usage:component_used_bytes)
              or on (node, device) 0 * disk_usage:filesystem_size_bytes
            )
          record: disk_usage:unattributed_bytes
    - name: piraeus-storage
      rules:
        - expr: max by (node, storage_pool) (linstor_storage_pool_capacity_total_bytes{driver="LVM_THIN"} > 0)
          record: disk_usage:pool_capacity_bytes
        - expr: max by (node, storage_pool) (linstor_storage_pool_capacity_free_bytes{driver="LVM_THIN"} >= 0)
          record: disk_usage:pool_free_bytes
        - expr: disk_usage:pool_capacity_bytes - disk_usage:pool_free_bytes
          record: disk_usage:pool_used_bytes
        - expr: |
            max by (resource, volume) (
              label_replace(
                label_replace(
                  linstor_volume_definition_size_bytes,
                  "resource", "$1", "name", "(.+)"
                ),
                "volume", "$1", "volume_number", "(.+)"
              )
            )
          record: disk_usage:volume_definition_size_bytes
        - expr: |
            (
              max by (resource, persistentvolume) (
                label_replace(
                  kube_persistentvolume_info{csi_driver="linstor.csi.linbit.com",csi_volume_handle!=""},
                  "resource", "$1", "csi_volume_handle", "(.+)"
                )
              )
              * on (persistentvolume) group_left (namespace, persistentvolumeclaim, phase)
                (
                  max by (persistentvolume, namespace, persistentvolumeclaim) (
                    label_replace(label_replace(
                      kube_persistentvolume_claim_ref,
                      "namespace", "$1", "claim_namespace", "(.+)"),
                      "persistentvolumeclaim", "$1", "name", "(.+)")
                  )
                  * on (persistentvolume) group_left (phase)
                    max by (persistentvolume, phase) (kube_persistentvolume_status_phase == 1)
                )
            )
            or on (resource)
            max by (resource, persistentvolume) (
              label_replace(
                kube_persistentvolume_info{csi_driver="linstor.csi.linbit.com",csi_volume_handle!=""},
                "resource", "$1", "csi_volume_handle", "(.+)"
              )
            )
            * on (persistentvolume) group_left (phase)
              max by (persistentvolume, phase) (kube_persistentvolume_status_phase == 1)
          record: disk_usage:piraeus_volume:info
        - expr: |
            group by (node, storage_pool, resource, volume) (linstor_volume_state)
            and on (node, storage_pool) disk_usage:pool_capacity_bytes
          record: disk_usage:diskful_volume:info
        - expr: |
            (
              group by (node, storage_pool, resource) (disk_usage:diskful_volume:info)
              * on (resource) group_left (persistentvolume, namespace, persistentvolumeclaim, phase)
                disk_usage:piraeus_volume:info
            )
            or on (node, storage_pool, resource)
              group by (node, storage_pool, resource) (disk_usage:diskful_volume:info)
          record: disk_usage:volume:info
        - expr: |
            sum by (node, storage_pool, resource) (linstor_volume_allocated_size_bytes >= 0)
            * on (node, storage_pool, resource)
              group_left (persistentvolume, namespace, persistentvolumeclaim, phase)
              disk_usage:volume:info
          record: disk_usage:volume_allocated_bytes
        - expr: |
            sum by (node, storage_pool, resource) (
              disk_usage:diskful_volume:info
              * on (resource, volume) group_left ()
                disk_usage:volume_definition_size_bytes
            )
            * on (node, storage_pool, resource)
              group_left (persistentvolume, namespace, persistentvolumeclaim, phase)
              disk_usage:volume:info
          record: disk_usage:volume_capacity_bytes
        - expr: |-
            sum by (node, storage_pool) (disk_usage:volume_capacity_bytes)
            or on (node, storage_pool) (
              (0 * disk_usage:pool_capacity_bytes) unless on (node, storage_pool) disk_usage:volume:info
            )
          record: disk_usage:pool_committed_bytes
        - expr: max by (namespace, persistentvolumeclaim, node) (kubelet_volume_stats_used_bytes)
          record: disk_usage:pvc_used_bytes
        - alert: PiraeusPoolExhaustionPredicted
          annotations:
            description: The pool has less than 25% physical free space and its six-hour linear trend predicts exhaustion within 24 hours. Check actual free space, recent migrations, snapshots and growth before acting. PVC commitments may exceed physical capacity by design.
            summary: Piraeus pool {{ $labels.node }}/{{ $labels.storage_pool }} may fill within 24 hours
          expr: |-
            (predict_linear(disk_usage:pool_free_bytes[6h], 24 * 3600) < 0)
            and (disk_usage:pool_free_bytes / disk_usage:pool_capacity_bytes < 0.25)
            and (count_over_time(disk_usage:pool_free_bytes[6h]) >= 100)
            and (disk_usage:pool_free_bytes offset 6h)
          for: 1h
          labels:
            severity: warning
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets-alerts
  namespace: monitoring
spec:
  groups:
    - name: external-secrets
      rules:
        - alert: ExternalSecretNotReady
          annotations:
            description: |
              ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has reported Ready=False for more than 10 minutes. For Kubernetes-provider mirrors, this usually means the source Secret/key is missing or unreadable.
            summary: ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} is not Ready
          expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
          for: 10m
          labels:
            severity: warning
        - alert: ClusterExternalSecretNotReady
          annotations:
            description: |
              ClusterExternalSecret {{ $labels.name }} has reported Ready=False for more than 10 minutes. Check failed namespaces and generated ExternalSecret children.
            summary: ClusterExternalSecret {{ $labels.name }} is not Ready
          expr: clusterexternalsecret_status_condition{condition="Ready",status="False"} == 1
          for: 10m
          labels:
            severity: warning
        - alert: ExternalSecretsControllerBacklogged
          annotations:
            description: |
              External Secrets {{ $labels.controller }} has queued work while all workers are busy for more than 15 minutes. Short-refresh mirrors may stop propagating source Secret updates even while Ready=True remains stale.
            summary: External Secrets {{ $labels.controller }} controller is saturated with queued work
          expr: |
            sum by (controller) (
              workqueue_depth{controller=~"externalsecret|clusterexternalsecret|secretstore|clustersecretstore"}
            ) > 0
            and on (controller)
            controller_runtime_active_workers{controller=~"externalsecret|clusterexternalsecret|secretstore|clustersecretstore"}
              >= controller_runtime_max_concurrent_reconciles{controller=~"externalsecret|clusterexternalsecret|secretstore|clustersecretstore"}
          for: 15m
          labels:
            severity: warning
        - alert: ExternalSecretsControllerLongRunningWorker
          annotations:
            description: |
              A single External Secrets {{ $labels.controller }} worker has been processing one item for more than two minutes. With low concurrency, this can starve unrelated mirrors and leave target Secrets stale.
            summary: External Secrets {{ $labels.controller }} worker has been running for {{ $value | humanizeDuration }}
          expr: workqueue_longest_running_processor_seconds{controller=~"externalsecret|clusterexternalsecret|secretstore|clustersecretstore"} > 120
          for: 5m
          labels:
            severity: warning
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-alerts
  namespace: monitoring
spec:
  groups:
    - name: flux
      rules:
        - alert: FluxKustomizationNotReady
          annotations:
            description: Flux Kustomization {{ $labels.namespace }}/{{ $labels.name }} has reported Ready={{ $labels.status }} for more than 15 minutes.
            summary: Flux Kustomization {{ $labels.namespace }}/{{ $labels.name }} is not Ready
          expr: |
            kube_customresource_flux_kustomization_ready{status!="True"} == 1
            unless on (namespace, name) (kube_customresource_flux_kustomization_suspended == 1)
          for: 15m
          labels:
            severity: warning
        - alert: FluxHelmReleaseNotReady
          annotations:
            description: Flux HelmRelease {{ $labels.namespace }}/{{ $labels.name }} has reported Ready={{ $labels.status }} for more than 15 minutes.
            summary: Flux HelmRelease {{ $labels.namespace }}/{{ $labels.name }} is not Ready
          expr: |
            kube_customresource_flux_helmrelease_ready{status!="True"} == 1
            unless on (namespace, name) (kube_customresource_flux_helmrelease_suspended == 1)
          for: 15m
          labels:
            severity: warning
        - alert: FluxGitRepositoryNotReady
          annotations:
            description: Flux GitRepository {{ $labels.namespace }}/{{ $labels.name }} has reported Ready={{ $labels.status }} for more than 15 minutes.
            summary: Flux GitRepository {{ $labels.namespace }}/{{ $labels.name }} is not Ready
          expr: |
            kube_customresource_flux_gitrepository_ready{status!="True"} == 1
            unless on (namespace, name) (kube_customresource_flux_gitrepository_suspended == 1)
          for: 15m
          labels:
            severity: warning
        - alert: FluxMainGitRepositoryArtifactLarge
          annotations:
            description: GitRepository flux-system/flux-system artifact is {{ $value | humanize1024 }}B, increasing source unpack/write pressure for every dependent Kustomization.
            summary: Flux main GitRepository artifact is large
          expr: kube_customresource_flux_gitrepository_artifact_size_bytes{namespace="flux-system",name="flux-system"} > 16777216
          for: 30m
          labels:
            severity: warning
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: github-quota-alerts
  namespace: monitoring
spec:
  groups:
    - name: github-quota
      rules:
        - alert: GitHubGraphQLQuotaBurnRateHigh
          annotations:
            description: |
              Sustained above the 5000/hour budget, so this hour's bucket will exhaust before it resets. Attribution is only possible while this is firing: sample the bucket at 5s resolution to get the shape, and check the connection recorder and pod flow metrics against the same window.
            summary: GitHub GraphQL points for {{ $labels.github_account }} burning at {{ $value | humanize }}/s
          expr: deriv(github_graphql_rate_used[5m]) > 1.4
          for: 2m
          labels:
            severity: warning
        - alert: GitHubGraphQLQuotaExhausted
          annotations:
            description: |
              A retained observation reported zero remaining points. Ordinary GraphQL operations can fail until reset; rate-only probes may still work, and HTTP status varies. This alert remains active briefly after reset. Exhaustion entirely between the one-minute scrapes cannot be detected. REST `/rate_limit` can disagree with this bucket.
            summary: GitHub GraphQL quota for {{ $labels.github_account }} was exhausted in the last 5 minutes
          expr: min by (github_account) (min_over_time(github_graphql_rate_remaining[5m])) == 0
          labels:
            severity: warning
        - alert: GitHubGraphQLQuotaObservationsMissing
          annotations:
            description: |
              No remaining-quota sample has been retained for five minutes. Check discovery, Alloy collection/remote write, and the exporter for this account. Missing observations cannot establish that quota stayed nonzero. Explicitly failed scrapes are covered separately by TargetDown after ten minutes.
            summary: GitHub GraphQL quota observations for {{ $labels.github_account }} are missing
          expr: |
            (
              absent_over_time(github_graphql_rate_remaining{github_account="agentydragon"}[5m])
              unless on ()
              (max(up{job="github-graphql-rate-exporter-agentydragon",namespace="monitoring"}) == 0)
            )
            or
            (
              absent_over_time(github_graphql_rate_remaining{github_account="agentydragon-agent"}[5m])
              unless on ()
              (max(up{job="github-graphql-rate-exporter-agentydragon-agent",namespace="monitoring"}) == 0)
            )
          labels:
            severity: warning
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: grocy-mcp-alerts
  namespace: monitoring
spec:
  groups:
    - name: grocy-mcp
      rules:
        - alert: GrocyMcpNoTools
          annotations:
            description: |
              The Grocy MCP server is reachable on its metrics port, but its local FastMCP registry reports zero advertised tools. Clients can authenticate successfully and still see an empty tool list. Check the pod logs for OpenAPI generation, TOOL_OVERRIDES, or batch tool registration failures.
            summary: Grocy MCP {{ $labels.namespace }}/{{ $labels.pod }} is advertising zero tools
          expr: grocy_mcp_tools{namespace=~"grocy-.+"} == 0
          for: 5m
          labels:
            severity: warning
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mcp-auth-alerts
  namespace: monitoring
spec:
  groups:
    - name: mcp-auth
      rules:
        - alert: McpUpstreamTokenRefreshFailed
          annotations:
            description: |
              {{ $value | printf "%.0f" }} token refresh failure(s) in the last hour on {{ $labels.namespace }}/{{ $labels.pod }} (outcome={{ $labels.outcome }}). outcome=transient means Authentik was unreachable/5xx (client got 503 and may recover on its own); outcome=oauth means Authentik genuinely rejected a grant — the claude.ai connector is likely dead until manually reconnected; outcome=storage means the MCP server could not persist OAuth state to its local store such as Valkey (client got 503 and may retry). Check Settings → Connectors in claude.ai, authentik-server health, and the MCP namespace's state-store pods.
            summary: "MCP server {{ $labels.namespace }}/{{ $labels.pod }} failed a token refresh (outcome: {{ $labels.outcome }})"
          expr: increase(mcp_auth_upstream_refresh_failures_total[1h]) > 0
          labels:
            severity: warning
