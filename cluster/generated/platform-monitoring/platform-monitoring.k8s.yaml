apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: roaming-node-alerts
  namespace: monitoring
spec:
  groups:
    - name: roaming-node-alerts
      rules:
        - alert: KubeNodeNotReady
          annotations:
            description: "{{ $labels.node }} has been unready for more than 15 minutes. Roaming nodes are excluded, so this is a node that was expected to stay up."
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubenodenotready
            summary: Node is not ready.
          expr: |
            (
              kube_node_status_condition{condition="Ready",job="kube-state-metrics",status="true"} == 0
              and on (cluster, node)
              kube_node_spec_unschedulable{job="kube-state-metrics"} == 0
            )
            unless on (node) (kube_node_spec_taint{job="kube-state-metrics",key="node-role.kubernetes.io/roaming"} == 1)
          for: 15m
          labels:
            severity: warning
        - alert: KubeNodeUnreachable
          annotations:
            description: "{{ $labels.node }} is unreachable and some workloads may be rescheduled. Roaming nodes are excluded, so this is a node that was expected to stay up."
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubenodeunreachable
            summary: Node is unreachable.
          expr: |
            (
              kube_node_spec_taint{effect="NoSchedule",job="kube-state-metrics",key="node.kubernetes.io/unreachable"}
              unless ignoring (key, value)
              kube_node_spec_taint{job="kube-state-metrics",key=~"ToBeDeletedByClusterAutoscaler|cloud.google.com/impending-node-termination|aws-node-termination-handler/spot-itn|node-role.kubernetes.io/roaming"}
            ) == 1
          for: 15m
          labels:
            severity: warning
    - name: roaming-node-workload-alerts
      rules:
        - alert: KubePodNotReady
          annotations:
            description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for longer than 15 minutes on cluster {{ $labels.cluster }}.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepodnotready
            summary: Pod has been in a non-ready state for more than 15 minutes.
          expr: |-
            (
              sum by (namespace, pod, job, cluster) (
                max by (namespace, pod, job, cluster) (
                  kube_pod_status_phase{job="kube-state-metrics", namespace=~".*", phase=~"Pending|Unknown"}
                  or
                  (
                    kube_pod_status_phase{job="kube-state-metrics", namespace=~".*", phase="Running"} == 1
                    and on (namespace, pod, cluster)
                    kube_pod_status_ready{job="kube-state-metrics", namespace=~".*", condition="true"} == 0
                  )
                ) * on (namespace, pod, cluster) group_left() topk by (namespace, pod, cluster) (
                  1, max by (namespace, pod, owner_kind, cluster) (kube_pod_owner{owner_kind!="Job"})
                )
              ) > 0
              unless on (namespace, pod, cluster)
              kube_pod_status_reason{job="kube-state-metrics", namespace=~".*", reason="SchedulingGated"} == 1
            )
            unless on (namespace, pod)
            (
              kube_pod_info{job="kube-state-metrics", node!=""}
              and on (node)
              kube_node_spec_taint{job="kube-state-metrics", key="node-role.kubernetes.io/roaming"} == 1
            )
          for: 15m
          labels:
            severity: warning
        - alert: KubeletInstanceUnreachable
          annotations:
            description: A Kubelet instance has been unreachable for more than 15 minutes.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeletinstanceunreachable
            summary: Kubelet instance is unreachable.
          expr: |
            (
              up{job="kubelet", metrics_path="/metrics"} == 0
            )
            unless on (node)
            kube_node_spec_taint{job="kube-state-metrics", key="node-role.kubernetes.io/roaming"} == 1
          for: 15m
          labels:
            severity: warning
        - alert: TargetDown
          annotations:
            description: '{{ printf "%.4g" $value }}% of the {{ $labels.job }}/{{ $labels.service }} targets in {{ $labels.namespace }} namespace are down. Roaming nodes are excluded from both sides of the ratio.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/targetdown
            summary: One or more targets are unreachable.
          expr: |
            100 * (
              count by (cluster, job, namespace, service) (
                (up == 0) unless on (node) (kube_node_spec_taint{key="node-role.kubernetes.io/roaming"} == 1)
              )
              /
              count by (cluster, job, namespace, service) (
                up unless on (node) (kube_node_spec_taint{key="node-role.kubernetes.io/roaming"} == 1)
              )
            ) > 10
          for: 10m
          labels:
            severity: warning
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: replication
  namespace: seaweedfs
spec:
  groups:
    - name: seaweedfs-replication
      rules:
        - alert: SeaweedFSReplicaPlacementMismatch
          annotations:
            description: "{{ $value }} SeaweedFS volume(s) have not matched their target replica placement for 15m (replication 001 = 2 copies). The replication-repair AdminScript attempts copy-only repair hourly; check its CronJob/Job status and available volume slots if the mismatch persists. It never trims excess or misplaced replicas, so review those deliberately. Suspend the AdminScript and wait for any active Job before planned volume-server maintenance. For an immediate manual repair, inspect `volume.list` and run `volume.fix.replication -apply -doDelete=false` under `lock` from a master pod (`weed shell` reads commands on stdin)."
            summary: SeaweedFS has {{ $value }} volume(s) off their replica count
          expr: sum(SeaweedFS_master_replica_placement_mismatch) > 0
          for: 15m
          labels:
            severity: warning
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: s3-gateway-alerts
  namespace: seaweedfs
spec:
  groups:
    - name: seaweedfs-s3-gateway
      rules:
        - alert: SeaweedS3RequestErrorsHigh
          annotations:
            description: For {{ $labels.service }} {{ $labels.type }}, either at least 5% of at least 20 requests in each trailing 5-minute window returned 5xx for 10 minutes, or at least 4 requests returned 5xx in the trailing 15 minutes while fewer than 60 requests of that type were made. Either condition must remain true for 10 minutes. A compact burst of four failures can satisfy the low-volume branch while those errors remain inside the rolling 15-minute window; failures spread near the window boundary may not. Request types are evaluated separately, so read traffic cannot dilute write errors. Expected S3 4xx responses and client cancellations (499) are excluded.
            summary: SeaweedFS S3 {{ $labels.service }} {{ $labels.type }} requests are returning 5xx
          expr: |
            (
              (
                sum by (namespace, service, type) (
                  increase(
                    SeaweedFS_s3_request_total{
                      namespace="seaweedfs",
                      service=~"seaweedfs-s3|public-s3",
                      code=~"5.."
                    }[5m]
                  )
                )
                /
                on (namespace, service, type)
                sum by (namespace, service, type) (
                  increase(
                    SeaweedFS_s3_request_total{
                      namespace="seaweedfs",
                      service=~"seaweedfs-s3|public-s3"
                    }[5m]
                  )
                )
              ) >= 0.05
              and on (namespace, service, type)
              sum by (namespace, service, type) (
                increase(
                  SeaweedFS_s3_request_total{
                    namespace="seaweedfs",
                    service=~"seaweedfs-s3|public-s3"
                  }[5m]
                )
              ) >= 20
            )
            or
            (
              sum by (namespace, service, type) (
                increase(
                  SeaweedFS_s3_request_total{
                    namespace="seaweedfs",
                    service=~"seaweedfs-s3|public-s3",
                    code=~"5.."
                  }[15m]
                )
              ) >= 4
              and on (namespace, service, type)
              sum by (namespace, service, type) (
                increase(
                  SeaweedFS_s3_request_total{
                    namespace="seaweedfs",
                    service=~"seaweedfs-s3|public-s3"
                  }[15m]
                )
              ) < 60
            )
          for: 10m
          labels:
            severity: warning
    - name: seaweedfs-s3-gateway-latency
      rules:
        - alert: SeaweedS3GatewayLatencyHigh
          annotations:
            description: The 95th percentile of GET time-to-first-byte exceeded 30s, or the 95th percentile of DELETE/LIST request duration exceeded 5s, with at least 20 requests of that type in each trailing 5-minute window for 15 minutes. GET uses time-to-first-byte because download size affects total duration. PUT, POST, and COPY full duration is excluded because payload size can explain it.
            summary: SeaweedFS S3 {{ $labels.service }} {{ $labels.type }} latency is high
          expr: |
            (
              (
                histogram_quantile(
                  0.95,
                  sum by (namespace, service, type, le) (
                    rate(
                      SeaweedFS_s3_time_to_first_byte_millisecond_bucket{
                        namespace="seaweedfs",
                        service=~"seaweedfs-s3|public-s3",
                        type="GET"
                      }[5m]
                    )
                  )
                ) / 1000 > 30
                and on (namespace, service, type)
                sum by (namespace, service, type) (
                  increase(
                    SeaweedFS_s3_request_total{
                      namespace="seaweedfs",
                      service=~"seaweedfs-s3|public-s3",
                      type="GET"
                    }[5m]
                  )
                ) >= 20
              )
              or
              (
                histogram_quantile(
                  0.95,
                  sum by (namespace, service, type, le) (
                    rate(
                      SeaweedFS_s3_request_seconds_bucket{
                        namespace="seaweedfs",
                        service=~"seaweedfs-s3|public-s3",
                        type=~"DELETE|LIST"
                      }[5m]
                    )
                  )
                ) > 5
                and on (namespace, service, type)
                sum by (namespace, service, type) (
                  increase(
                    SeaweedFS_s3_request_total{
                      namespace="seaweedfs",
                      service=~"seaweedfs-s3|public-s3",
                      type=~"DELETE|LIST"
                    }[5m]
                  )
                ) >= 20
              )
            )
          for: 15m
          labels:
            severity: warning
    - name: seaweedfs-s3-gateway-metrics
      rules:
        - alert: SeaweedS3GatewayTargetMissing
          annotations:
            description: No `up` samples have been discovered for the expected {{ $labels.service }} metrics service in seaweedfs for 15 minutes. This indicates missing target discovery or ServiceMonitor wiring. A discovered target whose scrape returns `up=0` is handled by TargetDown.
            summary: SeaweedFS S3 metrics target {{ $labels.service }} is missing
          expr: absent_over_time(up{namespace="seaweedfs",service="seaweedfs-s3"}[10m])
          for: 5m
          labels:
            severity: warning
        - alert: SeaweedS3GatewayTargetMissing
          annotations:
            description: No `up` samples have been discovered for the expected {{ $labels.service }} metrics service in seaweedfs for 15 minutes. This indicates missing target discovery or ServiceMonitor wiring. A discovered target whose scrape returns `up=0` is handled by TargetDown.
            summary: SeaweedFS S3 metrics target {{ $labels.service }} is missing
          expr: absent_over_time(up{namespace="seaweedfs",service="public-s3"}[10m])
          for: 5m
          labels:
            severity: warning
        - alert: SeaweedS3GatewayTargetCountLow
          annotations:
            description: The number of discovered `up` targets for {{ $labels.service }} is below the Kubernetes Deployment's desired replica count for 10 minutes. This detects a missing pod target even while another replica is healthy. A target that is discovered but returns `up=0` is handled by TargetDown.
            summary: SeaweedFS S3 metrics targets for {{ $labels.service }} are below desired replicas
          expr: |
            count by (namespace, service) (
              max by (namespace, service, pod) (
                up{namespace="seaweedfs",service="seaweedfs-s3"}
              )
            )
            < on (namespace, service)
            label_replace(
              max by (namespace, deployment) (
                kube_deployment_spec_replicas{namespace="seaweedfs",deployment="seaweedfs-s3"}
              ),
              "service", "$1", "deployment", "(.*)"
            )
          for: 10m
          labels:
            severity: warning
        - alert: SeaweedS3GatewayTargetCountLow
          annotations:
            description: The number of discovered `up` targets for {{ $labels.service }} is below the Kubernetes Deployment's desired replica count for 10 minutes. This detects a missing pod target even while another replica is healthy. A target that is discovered but returns `up=0` is handled by TargetDown.
            summary: SeaweedFS S3 metrics targets for {{ $labels.service }} are below desired replicas
          expr: |
            count by (namespace, service) (
              max by (namespace, service, pod) (
                up{namespace="seaweedfs",service="public-s3"}
              )
            )
            < on (namespace, service)
            label_replace(
              max by (namespace, deployment) (
                kube_deployment_spec_replicas{namespace="seaweedfs",deployment="public-s3"}
              ),
              "service", "$1", "deployment", "(.*)"
            )
          for: 10m
          labels:
            severity: warning
        - alert: SeaweedS3GatewayMetricsMissing
          annotations:
            description: This pod has had successful metric scrapes but the always-exported SeaweedFS_s3_in_flight_requests gauge has been absent for 10 minutes. The expression is per pod, so a healthy sibling does not mask a malformed exporter. If the target itself is absent, SeaweedS3GatewayTargetCountLow or SeaweedS3GatewayTargetMissing covers it; if the scrape returns `up=0`, TargetDown covers it.
            summary: SeaweedFS S3 gauge metrics are missing from {{ $labels.service }} pod {{ $labels.pod }}
          expr: |
            (
              up{namespace="seaweedfs",service="seaweedfs-s3"} == 1
            )
            unless on (namespace, service, pod)
            max by (namespace, service, pod) (
              present_over_time(
                SeaweedFS_s3_in_flight_requests{namespace="seaweedfs",service="seaweedfs-s3"}[10m]
              )
            )
          for: 5m
          labels:
            severity: warning
        - alert: SeaweedS3GatewayMetricsMissing
          annotations:
            description: This pod has had successful metric scrapes but the always-exported SeaweedFS_s3_in_flight_requests gauge has been absent for 10 minutes. The expression is per pod, so a healthy sibling does not mask a malformed exporter. If the target itself is absent, SeaweedS3GatewayTargetCountLow or SeaweedS3GatewayTargetMissing covers it; if the scrape returns `up=0`, TargetDown covers it.
            summary: SeaweedFS S3 gauge metrics are missing from {{ $labels.service }} pod {{ $labels.pod }}
          expr: |
            (
              up{namespace="seaweedfs",service="public-s3"} == 1
            )
            unless on (namespace, service, pod)
            max by (namespace, service, pod) (
              present_over_time(
                SeaweedFS_s3_in_flight_requests{namespace="seaweedfs",service="public-s3"}[10m]
              )
            )
          for: 5m
          labels:
            severity: warning
