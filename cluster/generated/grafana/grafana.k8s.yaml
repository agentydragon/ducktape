apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: clickhouse
  namespace: monitoring
spec:
  datasource:
    access: proxy
    editable: false
    isDefault: false
    jsonData:
      defaultDatabase: aiquota
      host: clickhouse.clickhouse.svc
      port: 8123
      protocol: http
      queryTimeout: 60
      secure: false
      username: grafana
      validateSql: true
    name: AIQuota Analytics
    secureJsonData:
      password: ${password}
    type: grafana-clickhouse-datasource
    uid: clickhouse
  instanceSelector:
    matchLabels:
      dashboards: grafana
  valuesFrom:
    - targetPath: secureJsonData.password
      valueFrom:
        secretKeyRef:
          key: password
          name: clickhouse-grafana-credentials
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: aiquota-history
  namespace: monitoring
spec:
  folder: Analytics
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: "{\"schemaVersion\": 41, \"templating\": {}, \"annotations\": {}, \"uid\": \"aiquota-history\", \"title\": \"AIQuota history\", \"tags\": [\"analytics\", \"aiquota\", \"clickhouse\"], \"timezone\": \"browser\", \"editable\": false, \"graphTooltip\": 1, \"time\": {\"from\": \"now-30d\", \"to\": \"now\"}, \"fiscalYearStartMonth\": 0, \"refresh\": \"5m\", \"version\": 1, \"panels\": [{\"type\": \"table\", \"id\": 1, \"targets\": [{\"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"format\": 0, \"queryType\": \"sql\", \"rawSql\": \"SELECT provider, if(empty(window_name), '(default)', window_name) AS window, formatReadableTimeDelta(toUInt64(argMax(window_seconds, observed_at))) AS duration, round(argMax(remaining_percent, observed_at), 1) AS remaining_percent, round(argMax(used_percent, observed_at), 1) AS used_percent, formatReadableTimeDelta(toUInt64(argMax(reset_seconds, observed_at))) AS resets_in, formatDateTime(max(observed_at), '%Y-%m-%d %H:%i:%S') AS last_observed_at FROM aiquota.aiquota_windows WHERE $__timeFilter(observed_at) GROUP BY provider, window_name, window_seconds ORDER BY provider, window_seconds, window_name\", \"refId\": \"A\"}], \"title\": \"Current quota by provider and window\", \"transparent\": false, \"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 0}, \"repeatDirection\": \"h\"}, {\"type\": \"timeseries\", \"id\": 2, \"targets\": [{\"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"format\": 0, \"queryType\": \"sql\", \"rawSql\": \"SELECT observed_at AS time, remaining_percent AS value, concat(provider, ' / ', if(empty(window_name), '(default)', window_name), ' / ', formatReadableTimeDelta(toUInt64(window_seconds))) AS metric FROM aiquota.aiquota_windows WHERE $__timeFilter(observed_at) ORDER BY time, metric\", \"refId\": \"A\"}], \"title\": \"Quota remaining by provider and window\", \"transparent\": false, \"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 10}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"min\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"none\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"percent\", \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 15}}, \"overrides\": []}}, {\"type\": \"table\", \"id\": 3, \"targets\": [{\"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"format\": 1, \"queryType\": \"sql\", \"rawSql\": \"SELECT observed_at, source, status_code, content_type, raw_body_size_bytes, raw_body_truncated, error, raw_body_sha256 FROM (SELECT observed_at, source, status_code, content_type, raw_body_size_bytes, raw_body_truncated, error, raw_body_sha256 FROM aiquota.raw_http_observations WHERE $__timeFilter(observed_at) ORDER BY observed_at DESC LIMIT 200) AS latest_observations ORDER BY observed_at ASC\", \"refId\": \"A\"}], \"title\": \"Raw upstream observation metadata\", \"transparent\": false, \"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 20}, \"repeatDirection\": \"h\"}, {\"type\": \"timeseries\", \"id\": 4, \"targets\": [{\"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"format\": 0, \"queryType\": \"sql\", \"rawSql\": \"SELECT observed_at AS time, max(extra_spend_used_usd) AS used_usd, max(extra_spend_limit_usd) AS monthly_limit_usd FROM aiquota.aiquota_windows WHERE provider = 'claude' AND extra_spend_enabled = true AND $__timeFilter(observed_at) GROUP BY observed_at ORDER BY time\", \"refId\": \"A\"}], \"title\": \"Claude extra usage (current billing month)\", \"transparent\": false, \"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 30}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"none\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"currencyUSD\", \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 15}}, \"overrides\": []}}]}"
