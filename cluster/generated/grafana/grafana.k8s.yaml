apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: clickhouse
  namespace: monitoring
spec:
  datasource:
    access: proxy
    editable: false
    isDefault: false
    jsonData:
      defaultDatabase: aiquota
      host: clickhouse.clickhouse.svc
      port: 8123
      protocol: http
      queryTimeout: 60
      secure: false
      username: grafana
      validateSql: true
    name: AIQuota Analytics
    secureJsonData:
      password: ${password}
    type: grafana-clickhouse-datasource
    uid: clickhouse
  instanceSelector:
    matchLabels:
      dashboards: grafana
  valuesFrom:
    - targetPath: secureJsonData.password
      valueFrom:
        secretKeyRef:
          key: password
          name: clickhouse-grafana-credentials
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: aiquota-history
  namespace: monitoring
spec:
  folder: Analytics
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: "{\"schemaVersion\": 41, \"templating\": {}, \"annotations\": {}, \"uid\": \"aiquota-history\", \"title\": \"AIQuota history\", \"tags\": [\"analytics\", \"aiquota\", \"clickhouse\"], \"timezone\": \"browser\", \"editable\": false, \"graphTooltip\": 1, \"time\": {\"from\": \"now-30d\", \"to\": \"now\"}, \"fiscalYearStartMonth\": 0, \"refresh\": \"5m\", \"version\": 1, \"panels\": [{\"type\": \"table\", \"id\": 1, \"targets\": [{\"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"format\": 0, \"queryType\": \"sql\", \"rawSql\": \"SELECT\\n  provider,\\n  if(empty(account_id), 'unknown (legacy)', account_id) AS account,\\n  if(empty(window_name), '(default)', window_name) AS window,\\n  formatReadableTimeDelta(toUInt64(window_seconds)) AS duration,\\n  round(latest.1, 1) AS remaining_percent,\\n  round(latest.2, 1) AS used_percent,\\n  if(dateDiff('second', latest.5, now64(3)) > 900, 'stale (>15m)', 'fresh') AS freshness,\\n  multiIf(\\n    isNull(reset_deadline), 'unknown',\\n    reset_deadline <= now64(3), 'awaiting update',\\n    formatReadableTimeDelta(toUInt64(greatest(0, dateDiff('second', now64(3), reset_deadline))))\\n  ) AS resets_in,\\n  formatDateTime(latest.5, '%Y-%m-%d %H:%i:%S') AS last_observed_at\\nFROM (\\n  SELECT\\n    provider, account_id, window_name, window_seconds,\\n    argMax(tuple(remaining_percent, used_percent, reset_at, reset_seconds, observed_at), observed_at) AS latest,\\n    coalesce(latest.3, if(latest.4 > 0, latest.5 + toIntervalSecond(toInt64(latest.4)), NULL)) AS reset_deadline\\n  FROM aiquota.aiquota_windows\\n  WHERE $__timeFilter(observed_at)\\n  GROUP BY provider, account_id, window_name, window_seconds\\n)\\nORDER BY provider, account_id, window_seconds, window_name\", \"refId\": \"A\"}], \"title\": \"Latest quota observation by provider and window\", \"description\": \"Latest observation in the selected range. Freshness is relative to now; the collector polls every five minutes. After 15 minutes without an observation it is marked stale. A passed reset deadline means awaiting an updated quota, not that usage has reset.\", \"transparent\": false, \"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 0}, \"repeatDirection\": \"h\"}, {\"type\": \"timeseries\", \"id\": 2, \"targets\": [{\"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"format\": 0, \"queryType\": \"sql\", \"rawSql\": \"SELECT\\n  observed_at AS time,\\n  remaining_percent AS value,\\n  concat(provider, ' / ', if(empty(account_id), 'unknown (legacy)', account_id), ' / ', if(empty(window_name), '(default)', window_name), ' / ', formatReadableTimeDelta(toUInt64(window_seconds))) AS metric\\nFROM aiquota.aiquota_windows\\nWHERE $__timeFilter(observed_at)\\nORDER BY time, metric\", \"refId\": \"A\"}], \"title\": \"Quota remaining by provider and window\", \"transparent\": false, \"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 10}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"min\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"none\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"percent\", \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 15}}, \"overrides\": []}}, {\"type\": \"table\", \"id\": 3, \"targets\": [{\"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"format\": 1, \"queryType\": \"sql\", \"rawSql\": \"SELECT observed_at, source, account_id, status_code, content_type, raw_body_size_bytes, raw_body_truncated, error, raw_body_sha256\\nFROM (\\n  SELECT observed_at, source, account_id, status_code, content_type, raw_body_size_bytes, raw_body_truncated, error, raw_body_sha256\\n  FROM aiquota.raw_http_observations\\n  WHERE $__timeFilter(observed_at)\\n  ORDER BY observed_at DESC\\n  LIMIT 200\\n) AS latest_observations\\nORDER BY observed_at ASC\", \"refId\": \"A\"}], \"title\": \"Raw upstream observation metadata\", \"transparent\": false, \"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 20}, \"repeatDirection\": \"h\"}, {\"type\": \"timeseries\", \"id\": 4, \"targets\": [{\"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"format\": 0, \"queryType\": \"sql\", \"rawSql\": \"SELECT\\n  observed_at AS time,\\n  amount.2 AS value,\\n  concat(if(empty(account_id), 'unknown (legacy)', account_id), ' / ', amount.1) AS metric\\nFROM aiquota.aiquota_windows\\nARRAY JOIN [('used', extra_spend_used_usd), ('monthly limit', extra_spend_limit_usd)] AS amount\\nWHERE provider = 'claude' AND extra_spend_enabled = true AND $__timeFilter(observed_at)\\nORDER BY time, metric\", \"refId\": \"A\"}], \"title\": \"Claude extra usage by account (current billing month)\", \"transparent\": false, \"datasource\": {\"type\": \"grafana-clickhouse-datasource\", \"uid\": \"clickhouse\"}, \"gridPos\": {\"h\": 10, \"w\": 24, \"x\": 0, \"y\": 30}, \"repeatDirection\": \"h\", \"options\": {\"legend\": {\"displayMode\": \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\", \"max\"]}, \"tooltip\": {\"mode\": \"multi\", \"sort\": \"none\"}}, \"fieldConfig\": {\"defaults\": {\"unit\": \"currencyUSD\", \"custom\": {\"drawStyle\": \"line\", \"lineWidth\": 2, \"fillOpacity\": 15}}, \"overrides\": []}}]}"
