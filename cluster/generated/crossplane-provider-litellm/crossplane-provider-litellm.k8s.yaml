apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane-forgejo-images-creds-reader
  namespace: crossplane-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crossplane-forgejo-images-creds-reader
  namespace: forgejo-images
rules:
  - apiGroups:
      - ""
    resourceNames:
      - forgejo-images-creds
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crossplane-forgejo-images-creds-reader
  namespace: forgejo-images
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crossplane-forgejo-images-creds-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: crossplane-forgejo-images-creds-reader
    namespace: crossplane-system
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-crossplane-forgejo-images-creds-secret-store
spec:
  conditions:
    - namespaces:
        - crossplane-system
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: crossplane-forgejo-images-creds-reader
      remoteNamespace: forgejo-images
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: default
          type: ConfigMap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: crossplane-system
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-crossplane-forgejo-images-creds-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-litellm
spec:
  package: git.allegedly.works/ducktape-ci/provider-litellm:v2.1.0-1.ducktape.e7e87e2a10ce
  packagePullSecrets:
    - name: forgejo-images-creds
  revisionActivationPolicy: Automatic
