apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: flux-system
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-route53-credentials
  namespace: flux-system
spec:
  data:
    - remoteRef:
        key: aws-route53-dns-automation-credentials
        property: AWS_ACCESS_KEY_ID
      secretKey: AWS_ACCESS_KEY_ID
    - remoteRef:
        key: aws-route53-dns-automation-credentials
        property: AWS_REGION
      secretKey: AWS_REGION
    - remoteRef:
        key: aws-route53-dns-automation-credentials
        property: AWS_SECRET_ACCESS_KEY
      secretKey: AWS_SECRET_ACCESS_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    name: aws-route53-credentials
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: dns-records
  namespace: flux-system
spec:
  approvePlan: auto
  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "dns_records"
      }
  interval: 15m
  path: ./tf/gitops/dns-records
  refreshBeforeApply: true
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: tofu-state-db-credentials
      envFrom:
        - secretRef:
            name: aws-route53-credentials
  serviceAccountName: tf-runner
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  vars:
    - name: route53_zone_id
      value: Z02901943N8ZFQFOD9P5I
    - name: public_nodes
      value:
        ovh-ns1001419:
          public_ip: 51.81.245.180
          role: control-plane
        ovh-ns102453:
          public_ip: 147.135.37.175
          role: worker
        ovh-ns103656:
          public_ip: 147.135.39.162
          role: worker
        ovh-ns103711:
          public_ip: 147.135.39.176
          role: worker
        ovh-ns104952:
          public_ip: 147.135.104.5
          role: control-plane
        ovh-ns104963:
          public_ip: 147.135.104.16
          role: control-plane
