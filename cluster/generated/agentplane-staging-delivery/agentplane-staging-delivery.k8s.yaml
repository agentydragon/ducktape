apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-gateway
  namespace: agentplane-staging
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: runner-gateway
  name: runner-gateway
  namespace: agentplane-staging
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-runner-gateway-deployment-c8a3e7b5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        agentplane.io/otel-class: service
        agentplane.io/otel-emitter: "true"
        app.kubernetes.io/name: runner-gateway
        cdk8s.io/metadata.addr: agentplane-runner-gateway-deployment-c8a3e7b5
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: AGENTPLANE_RUNNER_GATEWAY_DISPATCHER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: postgres-session-dispatcher
            - name: OTEL_SERVICE_NAME
              value: runner-gateway
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=agentplane,deployment.environment.name=agentplane-staging
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.monitoring.svc.cluster.local:4317
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_always_on
            - name: AGENTPLANE_RUNNER_GATEWAY_CONFIG_FILE
              value: /etc/agentplane-runner-gateway/settings/settings.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-runner-gateway:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - /healthprobe
                - --target
                - 127.0.0.1:8080
                - --ca-file
                - /run/agentplane/workload-trust/ca-certificates.crt
                - --server-uri
                - spiffe://agentplane/session-dispatcher
            failureThreshold: 3
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          name: runner-gateway
          ports:
            - containerPort: 8080
              name: grpc
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /healthprobe
                - --target
                - 127.0.0.1:8080
                - --ca-file
                - /run/agentplane/workload-trust/ca-certificates.crt
                - --server-uri
                - spiffe://agentplane/session-dispatcher
            failureThreshold: 3
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          startupProbe:
            exec:
              command:
                - /healthprobe
                - --target
                - 127.0.0.1:8080
                - --ca-file
                - /run/agentplane/workload-trust/ca-certificates.crt
                - --server-uri
                - spiffe://agentplane/session-dispatcher
            failureThreshold: 60
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /run/agentplane/workload-tls
              name: workload-tls
              readOnly: true
            - mountPath: /run/agentplane/workload-trust
              name: workload-trust
              readOnly: true
            - mountPath: /run/agentplane/runner-gateway-sessions-client-tls
              name: runner-gateway-sessions-client-workload-tls
              readOnly: true
            - mountPath: /run/agentplane/runner-gateway-runtime-proxy-client-tls
              name: runner-gateway-runtime-proxy-client-workload-tls
              readOnly: true
            - mountPath: /run/agentplane/runner-gateway-environments-client-tls
              name: runner-gateway-environments-client-workload-tls
              readOnly: true
            - mountPath: /etc/agentplane-runner-gateway/settings
              name: configmap-runner-gateway-settings
              readOnly: true
            - mountPath: /run/agentplane/runner-tls
              name: runner-tls
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: runner-gateway
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      volumes:
        - name: workload-tls
          secret:
            secretName: runner-gateway-workload-tls
        - configMap:
            name: agentplane-workload-ca-bundle
          name: workload-trust
        - name: runner-gateway-sessions-client-workload-tls
          secret:
            secretName: runner-gateway-sessions-client-workload-tls
        - name: runner-gateway-runtime-proxy-client-workload-tls
          secret:
            secretName: runner-gateway-runtime-proxy-client-workload-tls
        - name: runner-gateway-environments-client-workload-tls
          secret:
            secretName: runner-gateway-environments-client-workload-tls
        - configMap:
            name: runner-gateway-settings
          name: configmap-runner-gateway-settings
        - name: runner-tls
          projected:
            defaultMode: 288
            sources:
              - secret:
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
                  name: agentplane-runner-gateway-tls
              - configMap:
                  items:
                    - key: ca-certificates.crt
                      path: ca.crt
                  name: agentplane-workload-ca-bundle
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: runner-gateway
  namespace: agentplane-staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runner-gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: runner-gateway-workload
  namespace: agentplane-staging
spec:
  duration: 24h
  issuerRef:
    kind: ClusterIssuer
    name: agentplane-workload
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 8h
  secretName: runner-gateway-workload-tls
  uris:
    - spiffe://agentplane/session-dispatcher
  usages:
    - digital signature
    - client auth
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: runner-gateway-sessions-client-workload
  namespace: agentplane-staging
spec:
  duration: 24h
  issuerRef:
    kind: ClusterIssuer
    name: agentplane-workload
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 8h
  secretName: runner-gateway-sessions-client-workload-tls
  uris:
    - spiffe://agentplane/sessions
  usages:
    - digital signature
    - client auth
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: runner-gateway-runtime-proxy-client-workload
  namespace: agentplane-staging
spec:
  duration: 24h
  issuerRef:
    kind: ClusterIssuer
    name: agentplane-workload
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 8h
  secretName: runner-gateway-runtime-proxy-client-workload-tls
  uris:
    - spiffe://agentplane/runtime-proxy
  usages:
    - digital signature
    - client auth
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: runner-gateway-environments-client-workload
  namespace: agentplane-staging
spec:
  duration: 24h
  issuerRef:
    kind: ClusterIssuer
    name: agentplane-workload
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 8h
  secretName: runner-gateway-environments-client-workload-tls
  uris:
    - spiffe://agentplane/environments
  usages:
    - digital signature
    - client auth
    - server auth
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-gateway-settings
  namespace: agentplane-staging
data:
  settings.yaml: |
    sandbox_namespace: agentplane-staging
    policy_namespace: agentplane-staging
    kubernetes_client_qps: -1
    rpc:
      listen_address: 0.0.0.0:8080
      tls:
        cert_file: /run/agentplane/workload-tls/tls.crt
        key_file: /run/agentplane/workload-tls/tls.key
      auth:
        - mode: spiffe
          ca_file: /run/agentplane/workload-trust/ca-certificates.crt
    gateway_tls:
      ca_file: /run/agentplane/workload-trust/ca-certificates.crt
      server_uri: spiffe://agentplane/session-dispatcher
      cert_file: /run/agentplane/runner-gateway-sessions-client-tls/tls.crt
      key_file: /run/agentplane/runner-gateway-sessions-client-tls/tls.key
      client_uri: spiffe://agentplane/sessions
    runner_control_target_template: runner-gateway.{namespace}.svc:8080
    runtime_proxy_readers:
      - spiffe://agentplane/app
      - spiffe://agentplane/notifications
    runtime_proxy_session_callers:
      - spiffe://agentplane/sessions
    runtime_proxy_controller_callers:
      - spiffe://agentplane/sandbox-controller
    executor_service_callers:
      - spiffe://agentplane/central-sampler
    runner_security:
      mode: mtls
      tls:
        cert_file: /run/agentplane/runner-tls/tls.crt
        key_file: /run/agentplane/runner-tls/tls.key
        ca_file: /run/agentplane/runner-tls/ca.crt
    dispatcher_service_delegation:
      actors:
        - spiffe_id: spiffe://agentplane/actions
          connection_provenance: false
      methods:
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/SubmitInput
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/ChangeModel
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/ChangeReasoningEffort
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/InterruptTurn
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/CreateSession
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/GetSession
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/GetDispatch
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/WatchDispatches
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/ListDispatches
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/CancelDispatch
    dispatcher_service_callers:
      - spiffe://agentplane/actions
      - spiffe://agentplane/app
      - spiffe://agentplane/notifications
    wake_service_callers:
      - spiffe://agentplane/app
      - spiffe://agentplane/notifications
    max_queued_per_session: 1000
    dispatcher_watch_lease_seconds: 300
    runner_request_timeout_seconds: 10
    central_sampler:
      target: central-sampler.agentplane-staging.svc.cluster.local:8083
      tls:
        ca_file: /run/agentplane/workload-trust/ca-certificates.crt
        server_uri: spiffe://agentplane/central-sampler
        cert_file: /run/agentplane/runner-gateway-sessions-client-tls/tls.crt
        key_file: /run/agentplane/runner-gateway-sessions-client-tls/tls.key
        client_uri: spiffe://agentplane/sessions
immutable: false
---
