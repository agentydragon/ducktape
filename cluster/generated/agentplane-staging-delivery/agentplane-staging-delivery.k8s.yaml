apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-gateway-settings
  namespace: agentplane-staging
data:
  settings.yaml: |
    dispatcher_callers:
      - agentplane-staging/actions
      - agentplane-staging/app
      - agentplane-staging/notifications
    gateway_callers:
      - agentplane-staging/app
      - agentplane-staging/notifications
      - agentplane-staging/runner-gateway
    runner_security:
      mode: mtls
      tls:
        cert_file: /run/agentplane/runner-tls/tls.crt
        key_file: /run/agentplane/runner-tls/tls.key
        ca_file: /run/agentplane/runner-tls/ca.crt
    central_sampler:
      target: central-sampler.agentplane-staging.svc.cluster.local:8080
      token_file: /var/run/secrets/agentplane-runner-gateway/central-sampler
    executor_callers:
      - agentplane-staging/central-sampler
    runtime_catalog:
      models:
        models:
          - model: antigravity/ant-messages/claude-opus-4-6-thinking
            display_name: Claude Opus 4.6 (Thinking) — Google Antigravity
            reasoning_efforts:
              - low
              - medium
              - high
          - model: antigravity/ant-messages/claude-sonnet-4-6
            display_name: Claude Sonnet 4.6 (Thinking) — Google Antigravity
            reasoning_efforts:
              - low
              - medium
              - high
          - model: antigravity/ant-messages/gemini-3-flash
            display_name: Gemini 3 Flash — Google Antigravity
            reasoning_efforts:
              - low
              - medium
              - high
          - model: antigravity/ant-messages/gemini-3.5-flash-lite
            display_name: Gemini 3.5 Flash-Lite — Google Antigravity
            reasoning_efforts:
              - low
              - medium
              - high
          - model: antigravity/ant-messages/gemini-3.8-flash-high
            display_name: Gemini 3.8 Flash (High) — Google Antigravity
            reasoning_efforts:
              - low
              - medium
              - high
          - model: chatgpt-sub/oai-responses/gpt-6-astra
            display_name: GPT-6 Astra — ChatGPT
            reasoning_efforts:
              - low
              - medium
              - high
              - xhigh
              - max
          - model: chatgpt-sub/oai-responses/gpt-6-luna
            display_name: GPT-6 Luna — ChatGPT
            reasoning_efforts:
              - low
              - medium
              - high
              - xhigh
              - max
          - model: chatgpt-sub/oai-responses/gpt-6.1-sol
            display_name: GPT-6.1 Sol — ChatGPT
            reasoning_efforts:
              - low
              - medium
              - high
              - xhigh
              - max
          - model: ollama/oai-chat/qwen3.8-flash-next-iq4xs-256k
            display_name: Qwen3.8 Flash Next IQ4_XS (256K) — cluster Ollama
            reasoning_efforts:
              - low
              - medium
              - high
          - model: ollama/oai-chat/gpt-oss-20b-128k
            display_name: GPT-OSS 20B (128K) — cluster Ollama
            reasoning_efforts: []
          - model: ollama/oai-chat/gpt-oss-120b-128k
            display_name: GPT-OSS 120B (128K) — cluster Ollama
            reasoning_efforts: []
          - model: ollama/oai-chat/gemma4-31b-it-q8_0-128k
            display_name: Gemma 4 31B (128K) — cluster Ollama
            reasoning_efforts: []
          - model: anthropic-api/ant-messages/claude-opus-5-5
            display_name: Opus 5.5 — Anthropic API
            reasoning_efforts:
              - low
              - medium
              - high
              - xhigh
              - max
          - model: anthropic-api/ant-messages/claude-sonnet-5-5
            display_name: Sonnet 5.5 — Anthropic API
            reasoning_efforts:
              - low
              - medium
              - high
              - xhigh
              - max
          - model: anthropic-api/ant-messages/claude-haiku-5-5
            display_name: Haiku 5.5 — Anthropic API
            reasoning_efforts:
              - low
              - medium
              - high
              - xhigh
              - max
          - model: anthropic-api/ant-messages/claude-fable-5-1
            display_name: Fable 5.1 — Anthropic API
            reasoning_efforts:
              - low
              - medium
              - high
              - xhigh
              - max
        harnesses:
          HARNESS_CLAUDE:
            - antigravity/ant-messages/claude-opus-4-6-thinking
            - antigravity/ant-messages/claude-sonnet-4-6
            - antigravity/ant-messages/gemini-3-flash
            - antigravity/ant-messages/gemini-3.5-flash-lite
            - antigravity/ant-messages/gemini-3.8-flash-high
          HARNESS_CODEX:
            - chatgpt-sub/oai-responses/gpt-6-astra
            - chatgpt-sub/oai-responses/gpt-6-luna
            - chatgpt-sub/oai-responses/gpt-6.1-sol
            - antigravity/ant-messages/claude-opus-4-6-thinking
            - antigravity/ant-messages/claude-sonnet-4-6
            - antigravity/ant-messages/gemini-3-flash
            - antigravity/ant-messages/gemini-3.5-flash-lite
            - antigravity/ant-messages/gemini-3.8-flash-high
            - ollama/oai-chat/qwen3.8-flash-next-iq4xs-256k
            - ollama/oai-chat/gpt-oss-20b-128k
            - ollama/oai-chat/gpt-oss-120b-128k
            - ollama/oai-chat/gemma4-31b-it-q8_0-128k
          HARNESS_CENTRAL_SAMPLER:
            - chatgpt-sub/oai-responses/gpt-6-astra
            - chatgpt-sub/oai-responses/gpt-6-luna
            - chatgpt-sub/oai-responses/gpt-6.1-sol
            - antigravity/ant-messages/claude-opus-4-6-thinking
            - antigravity/ant-messages/claude-sonnet-4-6
            - antigravity/ant-messages/gemini-3-flash
            - antigravity/ant-messages/gemini-3.5-flash-lite
            - antigravity/ant-messages/gemini-3.8-flash-high
            - ollama/oai-chat/qwen3.8-flash-next-iq4xs-256k
            - ollama/oai-chat/gpt-oss-20b-128k
            - ollama/oai-chat/gpt-oss-120b-128k
            - ollama/oai-chat/gemma4-31b-it-q8_0-128k
            - anthropic-api/ant-messages/claude-opus-5-5
            - anthropic-api/ant-messages/claude-sonnet-5-5
            - anthropic-api/ant-messages/claude-haiku-5-5
            - anthropic-api/ant-messages/claude-fable-5-1
      templates:
        runner-ducktape:
          workspace_root: /state/workspaces
          workspace_provenance: DEPLOYMENT_CONFIG
          workspace_root_enforced: false
          creates_missing_cwd: true
        runner-vm:
          workspace_root: /state/workspaces
          workspace_provenance: DEPLOYMENT_CONFIG
          workspace_root_enforced: false
          creates_missing_cwd: true
    wake_callers:
      - agentplane-staging/actions
      - agentplane-staging/app
      - agentplane-staging/notifications
    delegation:
      actor: agentplane-staging/actions
      caller_namespaces:
        - agentplane-staging
      methods:
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/SubmitInput
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/ChangeModel
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/ChangeReasoningEffort
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/InterruptTurn
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/OpenSession
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/GetSessionOpening
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/GetDispatch
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/WatchDispatches
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/ListDispatches
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/CancelDispatch
immutable: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-gateway
  namespace: agentplane-staging
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: runner-gateway
  name: runner-gateway
  namespace: agentplane-staging
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-runner-gateway-deployment-c8a3e7b5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        agentplane.io/otel-class: service
        agentplane.io/otel-emitter: "true"
        app.kubernetes.io/name: runner-gateway
        cdk8s.io/metadata.addr: agentplane-runner-gateway-deployment-c8a3e7b5
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: AGENTPLANE_RUNNER_GATEWAY_SANDBOX_NAMESPACE
              value: agentplane-staging
            - name: AGENTPLANE_RUNNER_GATEWAY_LISTEN_ADDRESS
              value: 0.0.0.0:8080
            - name: AGENTPLANE_RUNNER_GATEWAY_HTTP_LISTEN_ADDRESS
              value: 0.0.0.0:8081
            - name: AGENTPLANE_RUNNER_GATEWAY_RUNNER_TOKEN_FILE
              value: /var/run/secrets/agentplane-runner-gateway/token
            - name: AGENTPLANE_RUNNER_GATEWAY_DISPATCHER_AUDIENCE
              value: session-dispatcher
            - name: AGENTPLANE_RUNNER_GATEWAY_GATEWAY_AUDIENCE
              value: agentplane-runner-gateway
            - name: AGENTPLANE_RUNNER_GATEWAY_RUNNER_CONTROL_TARGET_TEMPLATE
              value: "{sandbox}-control.{namespace}.svc:8080"
            - name: AGENTPLANE_RUNNER_GATEWAY_KUBERNETES_CLIENT_QPS
              value: "-1"
            - name: AGENTPLANE_RUNNER_GATEWAY_SANDBOX_CONTROLLER_ACCOUNT
              value: agentplane-staging/sandbox-controller
            - name: AGENTPLANE_RUNNER_GATEWAY_DISPATCHER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: postgres-session-dispatcher
            - name: AGENTPLANE_RUNNER_GATEWAY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OTEL_SERVICE_NAME
              value: runner-gateway
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=agentplane,deployment.environment.name=agentplane-staging
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.monitoring.svc.cluster.local:4317
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_always_on
            - name: AGENTPLANE_RUNNER_GATEWAY_CONFIG_FILE
              value: /etc/agentplane-runner-gateway/settings/settings.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-runner-gateway:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            grpc:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          name: runner-gateway
          ports:
            - containerPort: 8080
              name: grpc
              protocol: TCP
            - containerPort: 8081
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            grpc:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          startupProbe:
            failureThreshold: 60
            grpc:
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 5
          volumeMounts:
            - mountPath: /etc/agentplane-runner-gateway/settings
              name: configmap-runner-gateway-settings
              readOnly: true
            - mountPath: /run/agentplane/runner-tls
              name: runner-tls
              readOnly: true
            - mountPath: /var/run/secrets/agentplane-runner-gateway
              name: runner-gateway-token
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: runner-gateway
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      volumes:
        - configMap:
            name: runner-gateway-settings
          name: configmap-runner-gateway-settings
        - name: runner-tls
          projected:
            defaultMode: 288
            sources:
              - secret:
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
                  name: agentplane-runner-gateway-tls
              - configMap:
                  items:
                    - key: ca-certificates.crt
                      path: ca.crt
                  name: cluster-internal-ca-bundle
        - name: runner-gateway-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agentplane-runner-gateway
                  expirationSeconds: 3600
                  path: token
              - serviceAccountToken:
                  audience: central-sampler
                  expirationSeconds: 3600
                  path: central-sampler
---
apiVersion: policy/v1
