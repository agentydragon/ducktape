apiVersion: v1
kind: ServiceAccount
metadata:
  name: sessions
  namespace: agentplane-staging
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sessions
  namespace: agentplane-staging
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - sandboxes
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - workloadcredentials
    verbs:
      - get
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - identities
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - policysets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - policybindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - agentplane.allegedly.works
    resources:
      - policybindings/status
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sessions
  namespace: agentplane-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sessions
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: sessions
    namespace: agentplane-staging
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sessions-workload
  namespace: agentplane-staging
spec:
  duration: 24h
  issuerRef:
    kind: ClusterIssuer
    name: agentplane-workload
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 8h
  secretName: sessions-workload-tls
  uris:
    - spiffe://agentplane/session-dispatcher
  usages:
    - digital signature
    - client auth
    - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sessions-client-workload
  namespace: agentplane-staging
spec:
  duration: 24h
  issuerRef:
    kind: ClusterIssuer
    name: agentplane-workload
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 8h
  secretName: sessions-client-workload-tls
  uris:
    - spiffe://agentplane/sessions
  usages:
    - digital signature
    - client auth
    - server auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: sessions
  name: sessions
  namespace: agentplane-staging
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: agentplane-runner-gateway-sessions-deployment-c8f786e6
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        agentplane.io/otel-class: service
        agentplane.io/otel-emitter: "true"
        app.kubernetes.io/component: sessions
        app.kubernetes.io/name: sessions
        cdk8s.io/metadata.addr: agentplane-runner-gateway-sessions-deployment-c8f786e6
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: AGENTPLANE_SESSIONS_DISPATCHER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: postgres-session-dispatcher
            - name: OTEL_SERVICE_NAME
              value: runner-gateway
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=agentplane,deployment.environment.name=agentplane-staging
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.monitoring.svc.cluster.local:4317
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_always_on
            - name: AGENTPLANE_SESSIONS_CONFIG_FILE
              value: /etc/agentplane-sessions/settings/settings.yaml
          image: git.allegedly.works/ducktape-ci/agentplane-sessions:unset
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - /healthprobe
                - --target
                - 127.0.0.1:8080
                - --ca-file
                - /run/agentplane/workload-trust/ca-certificates.crt
                - --server-uri
                - spiffe://agentplane/session-dispatcher
            failureThreshold: 3
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          name: sessions
          ports:
            - containerPort: 8080
              name: grpc
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /healthprobe
                - --target
                - 127.0.0.1:8080
                - --ca-file
                - /run/agentplane/workload-trust/ca-certificates.crt
                - --server-uri
                - spiffe://agentplane/session-dispatcher
            failureThreshold: 3
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          startupProbe:
            exec:
              command:
                - /healthprobe
                - --target
                - 127.0.0.1:8080
                - --ca-file
                - /run/agentplane/workload-trust/ca-certificates.crt
                - --server-uri
                - spiffe://agentplane/session-dispatcher
            failureThreshold: 60
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /run/agentplane/workload-tls
              name: workload-tls
              readOnly: true
            - mountPath: /run/agentplane/workload-trust
              name: workload-trust
              readOnly: true
            - mountPath: /run/agentplane/sessions-client-tls
              name: sessions-client-workload-tls
              readOnly: true
            - mountPath: /etc/agentplane-sessions/settings
              name: configmap-sessions-settings
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: sessions
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 60
      volumes:
        - name: workload-tls
          secret:
            secretName: sessions-workload-tls
        - configMap:
            name: agentplane-workload-ca-bundle
          name: workload-trust
        - name: sessions-client-workload-tls
          secret:
            secretName: sessions-client-workload-tls
        - configMap:
            name: sessions-settings
          name: configmap-sessions-settings
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sessions
  namespace: agentplane-staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sessions
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sessions-settings
  namespace: agentplane-staging
data:
  settings.yaml: |
    sandbox_namespace: agentplane-staging
    policy_namespace: agentplane-staging
    kubernetes_client_qps: -1
    rpc:
      listen_address: 0.0.0.0:8080
      tls:
        cert_file: /run/agentplane/workload-tls/tls.crt
        key_file: /run/agentplane/workload-tls/tls.key
      auth:
        - mode: spiffe
          ca_file: /run/agentplane/workload-trust/ca-certificates.crt
    gateway_tls:
      ca_file: /run/agentplane/workload-trust/ca-certificates.crt
      server_uri: spiffe://agentplane/sandbox-controller
      cert_file: /run/agentplane/sessions-client-tls/tls.crt
      key_file: /run/agentplane/sessions-client-tls/tls.key
      client_uri: spiffe://agentplane/sessions
    runner_control_target_template: environments.{namespace}.svc:8082
    dispatcher_service_delegation:
      actors:
        - spiffe_id: spiffe://agentplane/actions
          connection_provenance: false
      methods:
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/SubmitInput
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/ChangeModel
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/ChangeReasoningEffort
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/InterruptTurn
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/CreateSession
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/GetSession
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/GetDispatch
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/WatchDispatches
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/ListDispatches
        - /agentplane.runner_gateway.dispatcher.SessionDispatcher/CancelDispatch
    dispatcher_service_callers:
      - spiffe://agentplane/actions
      - spiffe://agentplane/app
      - spiffe://agentplane/notifications
    wake_service_callers:
      - spiffe://agentplane/actions
      - spiffe://agentplane/app
      - spiffe://agentplane/notifications
    max_queued_per_session: 1000
    dispatcher_watch_lease_seconds: 300
    runner_request_timeout_seconds: 10
    central_sampler:
      target: central-sampler.agentplane-staging.svc.cluster.local:8083
      tls:
        ca_file: /run/agentplane/workload-trust/ca-certificates.crt
        server_uri: spiffe://agentplane/central-sampler
        cert_file: /run/agentplane/sessions-client-tls/tls.crt
        key_file: /run/agentplane/sessions-client-tls/tls.key
        client_uri: spiffe://agentplane/sessions
immutable: false
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sessions
  namespace: agentplane-staging
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: postgres
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: environments
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: central-sampler
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sessions
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: egress
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: app
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: notifications
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: actions
            k8s:io.kubernetes.pod.namespace: agentplane-staging
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
