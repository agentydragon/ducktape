roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentplane-staging-runner-gateway-token-reviewer
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: runner-gateway
    namespace: agentplane-staging
---
