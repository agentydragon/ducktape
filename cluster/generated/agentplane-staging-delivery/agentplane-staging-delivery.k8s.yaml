apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-gateway
  namespace: agentplane-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner-gateway
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: runner-gateway
    namespace: agentplane-staging
