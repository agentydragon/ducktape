apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: auto
  name: website
spec: {}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: website
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: website
  name: website
  namespace: website
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website
    spec:
      automountServiceAccountToken: false
      containers:
        - image: git.allegedly.works/ducktape-ci/website:unset
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          name: server
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      imagePullSecrets:
        - name: forgejo-images-creds
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: website
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: website
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: website
  namespace: website
spec:
  hostnames:
    - www.allegedly.works
    - allegedly.works
    - www.agentydragon.com
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: website
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apex-redirect
  namespace: website
spec:
  hostnames:
    - agentydragon.com
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - filters:
        - requestRedirect:
            hostname: www.agentydragon.com
            scheme: https
            statusCode: 301
          type: RequestRedirect
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: short-links
  namespace: website
spec:
  hostnames:
    - adgn.link
    - www.adgn.link
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - filters:
        - requestRedirect:
            hostname: www.agentydragon.com
            path:
              replaceFullPath: /
              type: ReplaceFullPath
            scheme: https
            statusCode: 301
          type: RequestRedirect
    - filters:
        - requestRedirect:
            hostname: www.agentydragon.com
            path:
              replaceFullPath: /found.html
              type: ReplaceFullPath
            scheme: https
            statusCode: 302
          type: RequestRedirect
      matches:
        - path:
            type: PathPrefix
            value: /found
    - filters:
        - requestRedirect:
            hostname: www.agentydragon.com
            path:
              replaceFullPath: /nfc.html
              type: ReplaceFullPath
            scheme: https
            statusCode: 302
          type: RequestRedirect
      matches:
        - path:
            type: PathPrefix
            value: /nfc
    - filters:
        - requestRedirect:
            hostname: furryrationalists.proofgrid.tech
            path:
              replaceFullPath: /
              type: ReplaceFullPath
            scheme: https
            statusCode: 302
          type: RequestRedirect
      matches:
        - path:
            type: PathPrefix
            value: /furry-rationalists-telegram
    - filters:
        - requestRedirect:
            hostname: discord.com
            path:
              replaceFullPath: /invite/Mcdsh757Ht
              type: ReplaceFullPath
            scheme: https
            statusCode: 302
          type: RequestRedirect
      matches:
        - path:
            type: PathPrefix
            value: /effective-anthropomorphism-discord
    - filters:
        - requestRedirect:
            hostname: llm.agentydragon.com
            path:
              replaceFullPath: /
              type: ReplaceFullPath
            scheme: https
            statusCode: 302
          type: RequestRedirect
      matches:
        - path:
            type: PathPrefix
            value: /l
