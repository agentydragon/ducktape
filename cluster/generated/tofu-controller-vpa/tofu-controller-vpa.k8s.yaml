apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tofu-controller
  namespace: flux-system
spec:
  resourcePolicy:
    containerPolicies:
      - containerName: tofu-controller
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsOnly
      - containerName: "*"
        mode: "Off"
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tofu-controller
  updatePolicy:
    updateMode: Initial
