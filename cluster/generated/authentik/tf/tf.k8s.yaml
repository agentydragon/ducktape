apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: sso-providers
  namespace: flux-system
spec:
  approvePlan: auto
  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-ovh-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "sso_providers"
      }
  interval: 15m
  path: ./tf/gitops/sso-providers
  refreshBeforeApply: true
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: tofu-state-db-credentials
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
  serviceAccountName: tf-runner
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  storeReadablePlan: human
---
