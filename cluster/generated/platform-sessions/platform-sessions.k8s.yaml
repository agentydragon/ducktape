apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-sessions
  namespace: platform-sessions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-sessions
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: platform-sessions
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: HOME
              value: /tmp
            - name: PLATFORM_SESSIONS_PUBLIC_BASE_URL
              value: https://platform-sessions.allegedly.works
            - name: PLATFORM_SESSIONS_INTEGRATION_CONFIG
              valueFrom:
                configMapKeyRef:
                  key: integrations.json
                  name: platform-sessions-config
            - name: PLATFORM_SESSIONS_BEARERS
              valueFrom:
                configMapKeyRef:
                  key: bearers.json
                  name: platform-sessions-config
          envFrom:
            - secretRef:
                name: platform-sessions-oidc
          image: git.allegedly.works/ducktape-ci/platform-sessions:main-20261107024741-e756556
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          name: service
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
            - containerPort: 9091
              name: blueshield-mon
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - mountPath: /data
              name: platform-sessions
            - mountPath: /var/run/platform-sessions
              name: bearer-secrets
              readOnly: true
            - mountPath: /tmp
              name: tmp
      imagePullSecrets:
        - name: forgejo-images-creds
      nodeSelector:
        kubernetes.io/hostname: wyrm2
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: platform-sessions
          persistentVolumeClaim:
            claimName: platform-sessions
        - name: bearer-secrets
          projected:
            defaultMode: 288
            sources:
              - secret:
                  items:
                    - key: token
                      path: owner
                  name: platform-sessions-owner-bearer
              - secret:
                  items:
                    - key: token
                      path: aiquota
                  name: platform-sessions-aiquota-bearer
              - secret:
                  items:
                    - key: token
                      path: quest
                  name: platform-sessions-quest-bearer
              - secret:
                  items:
                    - key: token
                      path: thrive-scraper
                  name: platform-sessions-thrive-scraper-bearer
              - secret:
                  items:
                    - key: token
                      path: thrive-read
                  name: platform-sessions-thrive-read-bearer
              - secret:
                  items:
                    - key: token
                      path: chatgpt-read
                  name: platform-sessions-chatgpt-read-bearer
              - secret:
                  items:
                    - key: token
                      path: blueshield-read
                  name: platform-sessions-blueshield-read-bearer
        - emptyDir: {}
          name: tmp
---
apiVersion: v1
kind: Service
metadata:
  name: platform-sessions
  namespace: platform-sessions
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: platform-sessions
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-sessions
  namespace: platform-sessions
spec:
  hostnames:
    - platform-sessions.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  rules:
    - backendRefs:
        - name: platform-sessions
          port: 8080
      filters:
        - responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
          type: ResponseHeaderModifier
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: platform-sessions-quest
  namespace: platform-sessions
spec:
  podMetricsEndpoints:
    - interval: 1m
      path: /metrics
      port: metrics
    - interval: 1m
      path: /metrics
      port: blueshield-mon
  selector:
    matchLabels:
      app: platform-sessions
