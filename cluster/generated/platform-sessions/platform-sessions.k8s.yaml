---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-images-creds
  namespace: platform-sessions
spec:
  dataFrom:
    - extract:
        key: forgejo-images-creds
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-forgejo-images-secret-store
  target:
    name: forgejo-images-creds
    template:
      mergePolicy: Merge
      type: kubernetes.io/dockerconfigjson
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: platform-sessions-owner-bearer
  namespace: platform-sessions
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-sessions-owner-bearer
  namespace: platform-sessions
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: platform-sessions-owner-bearer
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    immutable: true
    name: platform-sessions-owner-bearer
    template:
      data:
        token: "{{ .password }}"
      type: Opaque
