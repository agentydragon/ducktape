apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "false"
  name: platform-sessions
spec: {}
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/enabled: "false"
  name: openai-platform-session
spec: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-sessions
  namespace: platform-sessions
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: piraeus-ssd-local
---
apiVersion: v1
