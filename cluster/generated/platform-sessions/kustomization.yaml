apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - platform-sessions.k8s.yaml
components:
  - ../../k8s/platform-sessions-image-pins
configMapGenerator:
  - name: platform-sessions-config
    namespace: platform-sessions
    literals:
      - |-
        integrations.json={
          "integrations": [
            {
              "id": "openai",
              "type": "openai",
              "state_dir": "/data/session/openai"
            },
            {
              "id": "anthropic",
              "type": "anthropic",
              "state_dir": "/data/session/anthropic"
            },
            {
              "id": "chatgpt",
              "type": "chatgpt",
              "state_dir": "/data/session/chatgpt"
            },
            {
              "id": "quest",
              "type": "quest",
              "state_dir": "/data/session/quest-platform"
            },
            {
              "id": "thrive",
              "type": "thrive",
              "state_dir": "/data/session/thrive"
            }
          ]
        }
      - |-
        bearers.json={
          "owner": {
            "role": "owner",
            "token_file": "/var/run/platform-sessions/owner"
          },
          "chatgpt-read": {
            "role": "routes",
            "token_file": "/var/run/platform-sessions/chatgpt-read",
            "allow": [
              {
                "instance": "chatgpt",
                "method": "GET",
                "path": "/backend-api/conversations"
              },
              {
                "instance": "chatgpt",
                "method": "GET",
                "path": "/backend-api/conversations/*"
              },
              {
                "instance": "chatgpt",
                "method": "GET",
                "path": "/backend-api/conversations/*/messages"
              }
            ]
          },
          "thrive-scraper": {
            "role": "routes",
            "token_file": "/var/run/platform-sessions/thrive-scraper",
            "allow": [
              {
                "instance": "thrive",
                "method": "GET",
                "path": "/products"
              },
              {
                "instance": "thrive",
                "method": "GET",
                "path": "/account/orders"
              },
              {
                "instance": "thrive",
                "method": "GET",
                "path": "/account"
              },
              {
                "instance": "thrive",
                "method": "GET",
                "path": "/carts"
              },
              {
                "instance": "thrive",
                "method": "GET",
                "path": "/autoship/items"
              },
              {
                "instance": "thrive",
                "method": "GET",
                "path": "/autoship/schedule/first"
              }
            ]
          },
          "thrive-read": {
            "role": "routes",
            "token_file": "/var/run/platform-sessions/thrive-read",
            "allow": [
              {
                "instance": "thrive",
                "method": "GET",
                "path": "/products"
              },
              {
                "instance": "thrive",
                "method": "GET",
                "path": "/account/orders"
              },
              {
                "instance": "thrive",
                "method": "GET",
                "path": "/account"
              },
              {
                "instance": "thrive",
                "method": "GET",
                "path": "/carts"
              },
              {
                "instance": "thrive",
                "method": "GET",
                "path": "/autoship/items"
              },
              {
                "instance": "thrive",
                "method": "GET",
                "path": "/autoship/schedule/first"
              }
            ]
          },
          "aiquota": {
            "role": "routes",
            "token_file": "/var/run/platform-sessions/aiquota",
            "allow": [
              {
                "instance": "openai",
                "method": "GET",
                "path": "/v1/dashboard/billing/credit_grants"
              },
              {
                "instance": "anthropic",
                "method": "GET",
                "path": "/api/organizations"
              },
              {
                "instance": "anthropic",
                "method": "GET",
                "path": "/api/organizations/*/prepaid/credits"
              }
            ]
          },
          "quest-agent": {
            "role": "routes",
            "token_file": "/var/run/platform-sessions/quest",
            "allow": [
              {
                "instance": "quest",
                "method": "GET",
                "path": "/guest/getReasons/*"
              },
              {
                "instance": "quest",
                "method": "GET",
                "path": "/guest/getPscDetails/*"
              },
              {
                "instance": "quest",
                "method": "GET",
                "path": "/api/getInsuranceProfile"
              },
              {
                "instance": "quest",
                "method": "GET",
                "path": "/guest/getTokenBasicInfoAPI/*"
              },
              {
                "instance": "quest",
                "method": "GET",
                "path": "/guest/getEncounterInfo/*"
              },
              {
                "instance": "quest",
                "method": "GET",
                "path": "/guest/getPayorList/*"
              },
              {
                "instance": "quest",
                "method": "GET",
                "path": "/guest/getAppointment/*"
              },
              {
                "instance": "quest",
                "method": "POST",
                "path": "/guest/getPscsWithAvailability"
              },
              {
                "instance": "quest",
                "method": "POST",
                "path": "/api/getOpenEorders"
              },
              {
                "instance": "quest",
                "method": "POST",
                "path": "/api/getUserDemographics"
              },
              {
                "instance": "quest",
                "method": "POST",
                "path": "/guest/examoneEligibility"
              },
              {
                "instance": "quest",
                "method": "POST",
                "path": "/guest/verifyInsurance/V2"
              },
              {
                "instance": "quest",
                "method": "POST",
                "path": "/guest/getPricing"
              }
            ]
          }
        }
