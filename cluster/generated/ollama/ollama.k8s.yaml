apiVersion: v1
kind: Namespace
metadata:
  labels:
    goldilocks.fairwinds.com/vpa-update-mode: "off"
    rbac.ducktape.io/agent-readable-logs: "true"
  name: ollama
spec: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  storageClassName: piraeus-hdd-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-iq4
  namespace: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: piraeus-ssd-local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpt-oss-scripts
  namespace: ollama
data:
  link-ssd-models.sh: |
    #!/bin/sh
    set -eu

    # Shards were SHA256-verified by the pinned inference download recipe. Check
    # presence/size at each start; avoid re-reading 94 GB on every Pod restart.
    # Refuse to replace any existing blob or link to a different target.
    mkdir -p /models/blobs
    for manifest in /scripts/qwen38-ssd-shards.tsv /scripts/qwen38-ssd-derived-shards.tsv; do
      while read -r digest size relative_path; do
        source_path="/ssd-models/$relative_path"
        blob_path="/models/blobs/sha256-$digest"
        test -f "$source_path"
        test "$(stat -c %s "$source_path")" = "$size"
        if test -L "$blob_path"; then
          test "$(readlink "$blob_path")" = "$source_path"
        elif test -e "$blob_path"; then
          echo "Refusing to replace existing blob: $blob_path" >&2
          exit 1
        else
          ln -s "$source_path" "$blob_path"
        fi
      done <"$manifest"
    done
  qwen38-ssd-derived-shards.tsv: |
    8681e217aad3be934fd9542709bf44123c4b569cb7906c01a2a383ac79c7c05f	10946624	agentplane-midturn/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
  qwen38-ssd-shards.tsv: |
    5ce89370720f8bf90890f439361282104c1aa1482d4013bb9a50923e758e71a4	10946624	Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
    577a38a2392b40ca2193cea502e1d92f60b8cd370675d308e0ec21885d9daaa7	49835229856	Qwen3.8-Flash-Next-UD-IQ4_XS-00002-of-00003.gguf
    d4634e6d84f0ebb0940be15c90d3790bf6464e3dea3a1cddc567dc0e83ad8833	43836407744	Qwen3.8-Flash-Next-UD-IQ4_XS-00003-of-00003.gguf
  setup-gpt-oss-v2.sh: |
    #!/bin/sh
    set -eu
    # pipefail makes a curl-failure exit status propagate through the awk filter,
    # so the Job actually fails (and the pod retries) instead of looking healthy.
    # busybox ash supports `set -o pipefail` since 1.34.
    set -o pipefail
    # Sizes are the model-layer size from the ollama registry manifest.
    # Total ~116 GB; PVC `models` is 200Gi (cluster/cdk8s/ollama/app.py).
    #
    # We hit `/api/pull` directly instead of using `ollama pull` because the CLI
    # emits a CR-redrawn TTY progress bar that is unreadable in `kubectl logs`.
    # Streaming JSON lets us print one human-readable line per status change and
    # every ~5% of bytes.

    # Pod can race ollama's readiness on a co-recreate; wait for the API.
    echo "=== waiting for $OLLAMA_HOST ==="
    until curl -sSf -m 5 "$OLLAMA_HOST/" >/dev/null 2>&1; do
      sleep 5
    done
    echo "=== ollama is up ==="

    echo "=== registering SSD Qwen3.8 IQ4_XS ==="
    # The init container links the verified SSD shards into the existing blob namespace.
    # Creating the manifest does not load the model or copy weights onto HDD.
    # The derived first shard changes only the GGUF chat-template metadata. Keep the
    # original split filenames as /api/create keys, so Ollama groups all three shards.
    derived_digest=$(awk 'NR == 1 { print $1 } END { if (NR != 1) exit 1 }' /scripts/qwen38-ssd-derived-shards.tsv)
    create_request=$(awk -v derived_digest="$derived_digest" '
      BEGIN {
        printf "{\"model\":\"qwen3.8-flash-next-iq4xs\",\"files\":{"
      }
      {
        digest = $1
        if ($1 == "5ce89370720f8bf90890f439361282104c1aa1482d4013bb9a50923e758e71a4") {
          digest = derived_digest
          replaced++
        }
        printf "%s\"%s\":\"sha256:%s\"", (NR == 1 ? "" : ","), $3, digest
      }
      END {
        if (replaced != 1) exit 1
        print "},\"parameters\":{\"num_ctx\":131072,\"num_thread\":6,\"temperature\":0.6,\"min_p\":0.05},\"stream\":false}"
      }
    ' /scripts/qwen38-ssd-shards.tsv)
    if ! create_response=$(curl -sS --fail-with-body --max-time 120 \
      -H 'Content-Type: application/json' \
      --data-binary "$create_request" "$OLLAMA_HOST/api/create"); then
      printf '%s\n' "$create_response" >&2
      exit 1
    fi
    printf '%s\n' "$create_response"
    case "$create_response" in
      *'"status":"success"'*) ;;
      *)
        echo "SSD model registration failed" >&2
        exit 1
        ;;
    esac

    # A separate alias makes 256K effective through Ollama's OpenAI-compatible API,
    # which does not consume native options.num_ctx. This reuses the same SSD blobs.
    if ! create_response=$(curl -sS --fail-with-body --max-time 120 \
      -H 'Content-Type: application/json' \
      --data-binary '{"model":"qwen3.8-flash-next-iq4xs-256k","from":"qwen3.8-flash-next-iq4xs","parameters":{"num_ctx":262144},"stream":false}' \
      "$OLLAMA_HOST/api/create"); then
      printf '%s\n' "$create_response" >&2
      exit 1
    fi
    printf '%s\n' "$create_response"
    case "$create_response" in
      *'"status":"success"'*) ;;
      *)
        echo "256K model registration failed" >&2
        exit 1
        ;;
    esac

    pull() {
      model=$1
      echo "=== pulling $model ==="
      curl -sS -N --fail-with-body -X POST "$OLLAMA_HOST/api/pull" \
        -H 'Content-Type: application/json' \
        -d "{\"name\":\"$model\",\"stream\":true}" \
        | awk -v model="$model" '
            BEGIN { last_status=""; last_pct=-1 }
            {
                status = ""; total = 0; comp = 0; err = ""
                if (match($0, /"status":"[^"]*"/))    status = substr($0, RSTART+10, RLENGTH-11)
                if (match($0, /"total":[0-9]+/))      total  = substr($0, RSTART+8,  RLENGTH-8) + 0
                if (match($0, /"completed":[0-9]+/))  comp   = substr($0, RSTART+12, RLENGTH-12) + 0
                if (match($0, /"error":"[^"]*"/))     err    = substr($0, RSTART+9,  RLENGTH-10)
                if (err != "") { printf "[%s] ERROR: %s\n", model, err; exit 1 }
                if (total > 0) {
                    pct = int((comp*100)/total)
                    if (status != last_status || pct - last_pct >= 5 || pct == 100) {
                        printf "[%s] %s: %3d%% (%.2f / %.2f GB)\n", model, status, pct, comp/1e9, total/1e9
                        last_status = status; last_pct = pct
                    }
                } else if (status != "" && status != last_status) {
                    printf "[%s] %s\n", model, status
                    last_status = status
                }
            }
        '
    }

    pull gpt-oss:20b        # 13.8 GB
    pull gpt-oss:120b       # 65.4 GB
    pull gemma4:31b-it-q8_0 # 33.8 GB
    pull qwen3-embedding:4b # 2.5 GB
    # Disabled after this 112GB model generated only 0.14-1.44 tokens/sec with Ollama on wyrm2.
    # The faster llama.cpp comparison also changed storage and server version; cause is not
    # isolated. Re-enable only after a compatible backend/storage setup demonstrates usable throughput.
    # pull metalspork/qwen3.8-flash-next-ud:UD-Q4_K_XL # 112 GB
immutable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-proxy
  namespace: ollama
data:
  default.conf.template: |
    server {
        listen ${AUTH_PROXY_PORT};

        location / {
            set $expected "Bearer ${OLLAMA_DIRECT_TOKEN}";
            if ($http_authorization != $expected) {
                return 401 '{"error": "unauthorized"}';
            }

            proxy_pass http://127.0.0.1:${OLLAMA_API_PORT};
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
  nginx.conf: |
    worker_processes 4;
    error_log /var/log/nginx/error.log notice;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;
        include /etc/nginx/conf.d/*.conf;
    }
immutable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: ollama
  name: ollama
  namespace: ollama
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_NOPRUNE
              value: "true"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_VULKAN
              value: "false"
            - name: CUDA_DEVICE_ORDER
              value: PCI_BUS_ID
            - name: LLAMA_ARG_FIT_TARGET
              value: 4096,2048
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: OLLAMA_KV_CACHE_TYPE
              value: q8_0
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "131072"
            - name: OLLAMA_LOAD_TIMEOUT
              value: 30m
          image: ollama/ollama:0.34.4
          livenessProbe:
            httpGet:
              path: /
              port: ollama
            initialDelaySeconds: 30
            periodSeconds: 30
          name: ollama
          ports:
            - containerPort: 11434
              name: ollama
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: ollama
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              memory: 40Gi
              nvidia.com/gpu: 2
            requests:
              cpu: "2"
              memory: 24Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - mountPath: /models
              name: models
            - mountPath: /ssd-models
              name: ssd-models
              readOnly: true
        - env:
            - name: OLLAMA_DIRECT_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: ollama-direct-token
            - name: AUTH_PROXY_PORT
              value: "11435"
            - name: OLLAMA_API_PORT
              value: "11434"
          image: nginx:1.31-alpine
          livenessProbe:
            initialDelaySeconds: 5
            periodSeconds: 30
            tcpSocket:
              port: auth-proxy
          name: auth-proxy
          ports:
            - containerPort: 11435
              name: auth-proxy
              protocol: TCP
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - mountPath: /etc/nginx/templates
              name: nginx-templates
            - mountPath: /etc/nginx/nginx.conf
              name: nginx-config
              subPath: nginx.conf
      initContainers:
        - command:
            - /bin/sh
            - /scripts/link-ssd-models.sh
          image: ollama/ollama:0.34.4
          name: link-ssd-models
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - mountPath: /models
              name: models
            - mountPath: /ssd-models
              name: ssd-models
              readOnly: true
            - mountPath: /scripts
              name: scripts
              readOnly: true
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
      volumes:
        - name: ssd-models
          persistentVolumeClaim:
            claimName: qwen38-iq4
            readOnly: true
        - configMap:
            name: gpt-oss-scripts
          name: scripts
        - name: models
          persistentVolumeClaim:
            claimName: models
        - configMap:
            name: auth-proxy
          name: nginx-templates
        - configMap:
            name: auth-proxy
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ollama
  name: ollama
  namespace: ollama
spec:
  ports:
    - name: http
      port: 11434
      protocol: TCP
      targetPort: 11434
    - name: auth-proxy
      port: 11435
      protocol: TCP
      targetPort: 11435
  selector:
    app.kubernetes.io/name: ollama
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama
  namespace: ollama
spec:
  hostnames:
    - ollama.allegedly.works
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  rules:
    - backendRefs:
        - name: ollama
          port: 11435
      timeouts:
        backendRequest: 600s
        request: 600s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ollama-api-consumer
rules:
  - apiGroups:
      - ""
    resourceNames:
      - ollama-direct-token
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reader
  namespace: ollama
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - pods/portforward
      - services
      - configmaps
      - events
    verbs:
      - get
      - list
      - watch
      - create
  - apiGroups:
      - infra.contrib.fluxcd.io
    resources:
      - terraforms
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-ollama-reader
  namespace: ollama
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reader
subjects:
  - kind: ServiceAccount
    name: default
    namespace: claude-sandbox
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc-ksbx-groups:kubectl-sandbox-users
---
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-gpt-oss-v10
  namespace: ollama
spec:
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - /scripts/setup-gpt-oss-v2.sh
          env:
            - name: OLLAMA_HOST
              value: http://127.0.0.1:11434
          image: curlimages/curl:8.22.0
          name: setup
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - mountPath: /scripts
              name: scripts
              readOnly: true
      initContainers:
        - command:
            - /bin/sh
            - /scripts/link-ssd-models.sh
          image: ollama/ollama:0.34.4
          name: link-ssd-models
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - mountPath: /models
              name: models
            - mountPath: /ssd-models
              name: ssd-models
              readOnly: true
            - mountPath: /scripts
              name: scripts
              readOnly: true
        - args:
            - serve
          env:
            - name: OLLAMA_HOST
              value: 127.0.0.1:11434
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_NOPRUNE
              value: "true"
            - name: OLLAMA_NO_CLOUD
              value: "true"
          image: ollama/ollama:0.34.4
          name: registration-api
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          restartPolicy: Always
          volumeMounts:
            - mountPath: /models
              name: models
            - mountPath: /ssd-models
              name: ssd-models
      nodeSelector:
        kubernetes.io/hostname: wyrm2
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - configMap:
            defaultMode: 493
            name: gpt-oss-scripts
          name: scripts
        - name: models
          persistentVolumeClaim:
            claimName: models
        - name: ssd-models
          persistentVolumeClaim:
            claimName: qwen38-iq4
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ollama-direct-token
  namespace: ollama
spec:
  allowRepeat: true
  digits: 12
  length: 48
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ollama-direct-token
  namespace: ollama
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ollama-direct-token
  refreshInterval: 8760h
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: ollama-direct-token
    template:
      data:
        token: "{{ .password }}"
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: claude-sandbox
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: claude-sandbox
      type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tabbyapi-config
  namespace: ollama
data:
  chat_template.jinja: |
    {%- set image_count = namespace(value=0) %}
    {%- set video_count = namespace(value=0) %}
    {%- macro render_content(content, do_vision_count, is_system_content=false) %}
        {%- if content is string %}
            {{- content }}
        {%- elif content is iterable and content is not mapping %}
            {%- for item in content %}
                {%- if 'image' in item or 'image_url' in item or item.type == 'image' %}
                    {%- if is_system_content %}
                        {{- raise_exception('System message cannot contain images.') }}
                    {%- endif %}
                    {%- if do_vision_count %}
                        {%- set image_count.value = image_count.value + 1 %}
                    {%- endif %}
                    {%- if add_vision_id %}
                        {{- 'Picture ' ~ image_count.value ~ ': ' }}
                    {%- endif %}
                    {{- '<|vision_start|><|image_pad|><|vision_end|>' }}
                {%- elif 'video' in item or item.type == 'video' %}
                    {%- if is_system_content %}
                        {{- raise_exception('System message cannot contain videos.') }}
                    {%- endif %}
                    {%- if do_vision_count %}
                        {%- set video_count.value = video_count.value + 1 %}
                    {%- endif %}
                    {%- if add_vision_id %}
                        {{- 'Video ' ~ video_count.value ~ ': ' }}
                    {%- endif %}
                    {{- '<|vision_start|><|video_pad|><|vision_end|>' }}
                {%- elif 'text' in item %}
                    {{- item.text }}
                {%- else %}
                    {{- raise_exception('Unexpected item type in content.') }}
                {%- endif %}
            {%- endfor %}
        {%- elif content is none or content is undefined %}
            {{- '' }}
        {%- else %}
            {{- raise_exception('Unexpected content type.') }}
        {%- endif %}
    {%- endmacro %}
    {%- if not messages %}
        {{- raise_exception('No messages provided.') }}
    {%- endif %}
    {%- set reasoning_instructions = '' %}
    {%- if enable_thinking is undefined or enable_thinking is true %}
        {%- set resolved_reasoning_effort = reasoning_effort|default('xhigh') %}
        {%- if resolved_reasoning_effort == 'high' %}
            {%- set resolved_reasoning_effort = 'xhigh' %}
        {%- endif %}
        {%- if resolved_reasoning_effort not in ('xhigh', 'medium', 'low') %}
            {{- raise_exception('Unexpected reasoning effort ' ~ reasoning_effort ~ '. Supported types are xhigh (default), medium, and low.') }}
        {%- endif %}
        {%- if resolved_reasoning_effort == 'xhigh' %}
            {%- set reasoning_instructions = 'Reasoning effort is set to xhigh. Please think carefully through the task, validate key assumptions, consider plausible alternatives, and prioritize correctness, consistency, and clarity in the final answer.' %}
        {%- elif resolved_reasoning_effort == 'low' %}
            {%- set reasoning_instructions = 'Reasoning effort is set to low. Keep your thinking brief and focused, moving directly to the conclusion without unnecessary elaboration.' %}
        {%- endif %}
    {%- endif %}
    {%- if tools and tools is iterable and tools is not mapping %}
        {{- '<|im_start|>system\n' }}
        {%- if reasoning_instructions %}
            {{- reasoning_instructions + '\n\n' }}
        {%- endif %}
        {{- "# Tools\n\nYou have access to the following functions:\n\n<tools>" }}
        {%- for tool in tools %}
            {{- "\n" }}
            {{- tool | tojson }}
        {%- endfor %}
        {{- "\n</tools>" }}
        {{- '\n\nIf you choose to call a function ONLY reply in the following format with NO suffix:\n\n<tool_call>\n<function=example_function_name>\n<parameter=example_parameter_1>\nvalue_1\n</parameter>\n<parameter=example_parameter_2>\nThis is the value for the second parameter\nthat can span\nmultiple lines\n</parameter>\n</function>\n</tool_call>\n\n<IMPORTANT>\nReminder:\n- Function calls MUST follow the specified format: an inner <function=...></function> block must be nested within <tool_call></tool_call> XML tags\n- Required parameters MUST be specified\n- You may provide optional reasoning for your function call in natural language BEFORE the function call, but NOT after\n- If there is no function call available, answer the question like normal with your current knowledge and do not tell the user about function calls\n</IMPORTANT>' }}
        {%- if messages[0].role == 'system' %}
            {%- set content = render_content(messages[0].content, false, true)|trim %}
            {%- if content %}
                {{- '\n\n' + content }}
            {%- endif %}
        {%- endif %}
        {{- '<|im_end|>\n' }}
    {%- else %}
        {%- if messages[0].role == 'system' %}
            {%- set content = render_content(messages[0].content, false, true)|trim %}
            {%- if content %}
                {{- '<|im_start|>system\n' + (reasoning_instructions + '\n\n' if reasoning_instructions else '')  + content + '<|im_end|>\n' }}
            {%- elif reasoning_instructions %}
                {{- '<|im_start|>system\n' + reasoning_instructions + '<|im_end|>\n' }}
            {%- endif %}
        {%- elif reasoning_instructions %}
            {{- '<|im_start|>system\n' + reasoning_instructions + '<|im_end|>\n' }}
        {%- endif %}
    {%- endif %}
    {%- set ns = namespace(multi_step_tool=true, last_query_index=messages|length - 1) %}
    {%- for message in messages[::-1] %}
        {%- set index = (messages|length - 1) - loop.index0 %}
        {%- if ns.multi_step_tool and message.role == "user" %}
            {%- set content = render_content(message.content, false)|trim %}
            {%- if not(content.startswith('<tool_response>') and content.endswith('</tool_response>')) %}
                {%- set ns.multi_step_tool = false %}
                {%- set ns.last_query_index = index %}
            {%- endif %}
        {%- endif %}
    {%- endfor %}
    {%- if ns.multi_step_tool %}
        {{- raise_exception('No user query found in messages.') }}
    {%- endif %}
    {%- for message in messages %}
        {%- set content = render_content(message.content, true)|trim %}
        {%- if message.role == "system" %}
            {%- if not loop.first %}
                {{- '<|im_start|>system\n' + content + '<|im_end|>\n' }}
            {%- endif %}
        {%- elif message.role == "user" %}
            {{- '<|im_start|>' + message.role + '\n' + content + '<|im_end|>' + '\n' }}
        {%- elif message.role == "assistant" %}
            {%- set reasoning_content = '' %}
            {%- if message.reasoning_content is string %}
                {%- set reasoning_content = message.reasoning_content %}
            {%- endif %}
            {%- set reasoning_content = reasoning_content|trim %}
            {%- if preserve_thinking is undefined or preserve_thinking is true or loop.index0 > ns.last_query_index %}
                {{- '<|im_start|>' + message.role + '\n<think>\n' + reasoning_content + '\n</think>\n\n' + content }}
            {%- else %}
                {{- '<|im_start|>' + message.role + '\n' + content }}
            {%- endif %}
            {%- if message.tool_calls and message.tool_calls is iterable and message.tool_calls is not mapping %}
                {%- for tool_call in message.tool_calls %}
                    {%- if tool_call.function is defined %}
                        {%- set tool_call = tool_call.function %}
                    {%- endif %}
                    {%- if loop.first %}
                        {%- if content|trim %}
                            {{- '\n\n<tool_call>\n<function=' + tool_call.name + '>\n' }}
                        {%- else %}
                            {{- '<tool_call>\n<function=' + tool_call.name + '>\n' }}
                        {%- endif %}
                    {%- else %}
                        {{- '\n<tool_call>\n<function=' + tool_call.name + '>\n' }}
                    {%- endif %}
                    {%- if tool_call.arguments is defined and tool_call.arguments != '' %}
                        {%- for args_name, args_value in tool_call.arguments|items %}
                            {{- '<parameter=' + args_name + '>\n' }}
                            {%- set args_value = args_value | string if args_value is string else args_value | tojson | safe %}
                            {{- args_value }}
                            {{- '\n</parameter>\n' }}
                        {%- endfor %}
                    {%- endif %}
                    {{- '</function>\n</tool_call>' }}
                {%- endfor %}
            {%- endif %}
            {{- '<|im_end|>\n' }}
        {%- elif message.role == "tool" %}
            {%- if loop.previtem and loop.previtem.role != "tool" %}
                {{- '<|im_start|>user' }}
            {%- endif %}
            {{- '\n<tool_response>\n' }}
            {{- content }}
            {{- '\n</tool_response>' }}
            {%- if not loop.last and loop.nextitem.role != "tool" %}
                {{- '<|im_end|>\n' }}
            {%- elif loop.last %}
                {{- '<|im_end|>\n' }}
            {%- endif %}
        {%- else %}
            {{- raise_exception('Unexpected message role.') }}
        {%- endif %}
    {%- endfor %}
    {%- if add_generation_prompt %}
        {{- '<|im_start|>assistant\n' }}
        {%- if enable_thinking is defined and enable_thinking is false %}
            {{- '<think>\n\n</think>\n\n' }}
        {%- else %}
            {{- '<think>\n' }}
        {%- endif %}
    {%- endif %}
  config.yml: |
    network:
      host: 0.0.0.0
      port: 5000
      disable_auth: true
      allowed_origins: []
      send_tracebacks: false

    model:
      model_dir: /models
      model_name: qwen38-exl3-268
      inline_model_loading: true
      # Keep the same budgets on startup and when a request switches checkpoints.
      use_as_default:
        - backend
        - max_seq_len
        - cache_size
        - cache_mode
        - max_batch_size
        - tensor_parallel
        - gpu_split
        - gpu_split_auto
        - vision
        - ngram_ram
        - chunk_size
        - output_chunking
        - warmup
        - draft_mode
        - draft_num_tokens
        - draft_cache_mode
      backend: exllamav3
      max_seq_len: 262144
      cache_size: 270336
      cache_mode: Q8
      max_batch_size: 1
      tensor_parallel: false
      gpu_split: [22, 30]
      gpu_split_auto: false
      vision: false
      ngram_ram: false
      chunk_size: 2048
      output_chunking: true
      warmup: true

    draft_model:
      draft_mode: mtp
      draft_num_tokens: 3
      draft_cache_mode: Q8
  tabbyapi_serve.py: |
    """Run the pinned TabbyAPI app with a request lock for its single generation slot."""

    import asyncio
    from collections.abc import Awaitable, Callable
    from importlib import import_module
    from typing import Protocol, cast

    from starlette.applications import Starlette
    from starlette.types import ASGIApp, Receive, Scope, Send

    _MODEL_REQUESTS = frozenset(
        {
            "/v1/chat/completions",
            "/v1/completions",
            "/v1/continuations",
            "/v1/decisions",
            "/v1/systemone",
            "/v1/model/load",
            "/v1/model/unload",
            "/apply-template",
            "/v1/apply-template",
        }
    )


    class SerializeModelRequests:
        """Protect the shared model from template rendering through the end of streaming."""

        def __init__(self, app: ASGIApp) -> None:
            self.app = app
            self.lock = asyncio.Lock()

        async def __call__(self, scope: Scope, receive: Receive, send: Send) -> None:
            if scope["type"] != "http" or scope["method"] != "POST" or scope["path"].rstrip("/") not in _MODEL_REQUESTS:
                await self.app(scope, receive, send)
                return

            # TabbyAPI's router releases its load lock before generation registers
            # a job. Unload waits for registered jobs only. Hold this lock over the
            # ASGI call so it also covers SSE iteration and disconnect cleanup.
            async with self.lock:
                await self.app(scope, receive, send)


    class _TabbyMain(Protocol):
        entrypoint_async: Callable[[], Awaitable[None]]

        def entrypoint(self) -> None: ...


    class _TabbyServer(Protocol):
        setup_app: Callable[[str | None, int | None], Starlette]


    def main() -> None:
        tabby = cast(_TabbyMain, import_module("main"))
        entrypoint_async = tabby.entrypoint_async

        async def serve() -> None:
            # Import here so TabbyAPI first configures the PyTorch CUDA allocator.
            server = cast(_TabbyServer, import_module("endpoints.server"))
            setup_app = server.setup_app

            def setup_locked_app(host: str | None = None, port: int | None = None) -> Starlette:
                app = setup_app(host, port)
                app.add_middleware(SerializeModelRequests)
                return app

            server.setup_app = setup_locked_app
            await entrypoint_async()

        tabby.entrypoint_async = serve
        tabby.entrypoint()


    if __name__ == "__main__":
        main()
