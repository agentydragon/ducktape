apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: tabbyapi
  name: tabbyapi
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tabbyapi
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tabbyapi
        ducktape.org/tabbyapi-model-switching: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - tabbyapi_serve.py
            - --host
            - 0.0.0.0
          env:
            - name: CUDA_DEVICE_ORDER
              value: PCI_BUS_ID
          image: ghcr.io/theroyallab/tabbyapi@sha256:6daf422856272925b8fa0db0e697b9cc7b68e5c557b2789fcf84d6e54139dfd6
          name: tabbyapi
          ports:
            - containerPort: 5000
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            limits:
              memory: 48Gi
              nvidia.com/gpu: "2"
            requests:
              cpu: "4"
              memory: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            failureThreshold: 72
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - mountPath: /models/qwen38-exl3-268
              name: weights
              readOnly: true
            - mountPath: /models/qwen38-exl3-250-abliterated
              name: abliterated-weights
              readOnly: true
            - mountPath: /app/config.yml
              name: config
              readOnly: true
              subPath: config.yml
            - mountPath: /app/tabbyapi_serve.py
              name: config
              readOnly: true
              subPath: tabbyapi_serve.py
            - mountPath: /models/qwen38-exl3-268/chat_template.jinja
