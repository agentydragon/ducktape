              readOnly: true
              subPath: chat_template.jinja
            - mountPath: /models/qwen38-exl3-250-abliterated/chat_template.jinja
              name: config
              readOnly: true
              subPath: chat_template.jinja
            - mountPath: /dev/shm
              name: shm
      nodeSelector:
        kubernetes.io/hostname: wyrm2
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: weights
          persistentVolumeClaim:
            claimName: tabbyapi-flash-next
            readOnly: true
        - name: abliterated-weights
          persistentVolumeClaim:
            claimName: tabbyapi-flash-next-abliterated
            readOnly: true
        - configMap:
            name: tabbyapi-config
          name: config
        - emptyDir:
            medium: Memory
            sizeLimit: 8Gi
          name: shm
