apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ollama.k8s.yaml
configMapGenerator:
  - name: gpt-oss-scripts
    namespace: ollama
    options:
      disableNameSuffixHash: true
    files:
      - setup-gpt-oss-v2.sh
      - link-ssd-models.sh
      - qwen38-ssd-shards.tsv
      - qwen38-ssd-derived-shards.tsv
  - name: ollama-auth-proxy
    namespace: ollama
    options:
      disableNameSuffixHash: true
    files:
      - default.conf.template=nginx-auth-proxy.conf.template
      - nginx.conf
