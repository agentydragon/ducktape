stages:
  - test
  - publish

variables:
  GOFLAGS: "-trimpath"
  GOTOOLCHAIN: local
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"

test-and-build:
  stage: test
  image: golang:1.27.3
  script:
    - go test -count=1 ./...
    - mkdir -p out
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags=-buildid= -o out/app .
    - CGO_ENABLED=0 go build -trimpath -ldflags=-buildid= -o out/flux-notify ./cmd/flux-notify
    - test -x out/app
    - test -x out/flux-notify
  artifacts:
    paths:
      - out/
    expire_in: 1 day

publish-oci:
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  image:
    name: gcr.io/go-containerregistry/crane/debug:v0.22.1
    entrypoint: [""]
  needs:
    - job: test-and-build
      artifacts: true
  before_script:
    - umask 077
    - export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker"
    - mkdir -p "$DOCKER_CONFIG"
    - auth=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$auth" > "$DOCKER_CONFIG/config.json"
    - unset auth
  script:
    - mkdir -p oci-root
    - cp out/app oci-root/app
    - chmod 0555 oci-root/app
    - tar -cf app-layer.tar -C oci-root app
    - sha7=$(printf '%s' "$CI_COMMIT_SHA" | cut -c1-7)
    - image_tag="devel-$(date -u +%Y%m%d%H%M%S)-$sha7"
    - image="$CI_REGISTRY_IMAGE:$image_tag"
    - staging_image="$CI_REGISTRY_IMAGE:ci-staging-$CI_COMMIT_SHA"
    - >-
      crane append --oci-empty-base --platform linux/amd64
      --new_layer app-layer.tar --new_tag "$staging_image"
    - crane mutate "$staging_image" --entrypoint=/app --user=65532:65532 --exposed-ports=8080 --tag "$image"
    - crane validate "$image"
    - crane delete "$staging_image" >/dev/null 2>&1 || echo 'temporary staging tag cleanup unsupported; policy ignores it'
    - printf 'image=%s\n' "$image" | tee out/published-image.txt
    - crane digest "$image"
    - test -n "${FLUX_WEBHOOK_URL:-}" || { echo 'FLUX_WEBHOOK_URL project variable is required' >&2; exit 1; }
    - ./out/flux-notify
    - rm -rf "$DOCKER_CONFIG" oci-root app-layer.tar
  after_script:
    - rm -rf "${DOCKER_CONFIG:-$CI_PROJECT_DIR/.docker}" "$CI_PROJECT_DIR/oci-root" "$CI_PROJECT_DIR/app-layer.tar"
