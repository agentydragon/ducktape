stages:
  - test
  - publish

default:
  image:
    name: ghcr.io/ko-build/ko@sha256:8cc63fb82d48708a20ec5055adc41b12bdfb5709f82a49c1b12f25e259760e7f
    entrypoint: [""]

variables:
  GOFLAGS: "-trimpath"
  GOTOOLCHAIN: local
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"

test:
  stage: test
  script:
    - ko version
    - go version
    - go test -count=1 ./...

publish-oci:
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  before_script:
    - umask 077
    - export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker"
    - mkdir -p "$DOCKER_CONFIG"
    - printf '%s' "$CI_REGISTRY_PASSWORD" | ko login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - mkdir -p out
    - sha7=$(printf '%s' "$CI_COMMIT_SHA" | cut -c1-7)
    - image_tag="devel-$(date -u +%Y%m%d%H%M%S)-$sha7"
    - export KO_DOCKER_REPO="$CI_REGISTRY_IMAGE"
    - export KO_DEFAULTBASEIMAGE=cgr.dev/chainguard/static
    - >-
      ko build --bare --platform=linux/amd64 --tags="$image_tag"
      --image-user=65532:65532 --image-refs=out/ko-image-refs.txt .
    - printf 'tag=%s:%s\n' "$CI_REGISTRY_IMAGE" "$image_tag" | tee out/published-image.txt
    - cat out/ko-image-refs.txt
    - rm -rf "$DOCKER_CONFIG"
  artifacts:
    paths:
      - out/published-image.txt
      - out/ko-image-refs.txt
    expire_in: 1 day
  after_script:
    - rm -rf "${DOCKER_CONFIG:-$CI_PROJECT_DIR/.docker}"
