# Cilium CNI — Talos-recommended defaults + Nebula-compatible MTU
#
# IMPORTANT: Do not add non-default options without verifying Nebula overlay compatibility.
# See: https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium

# Required: Talos-recommended IPAM
ipam:
  mode: kubernetes

# Required: kube-proxy replacement (kube-proxy disabled in Talos config)
kubeProxyReplacement: "true"
k8sServiceHost: "localhost"
k8sServicePort: "7445"

# Host-networked Cilium pods need cluster DNS for Kubernetes service names.
dnsPolicy: ClusterFirstWithHostNet

# Required: Talos security context (no SYS_MODULE — Talos blocks kernel module loading)
securityContext:
  capabilities:
    ciliumAgent:
      [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

# Required: Talos cgroup configuration
cgroup:
  hostRoot: /sys/fs/cgroup
  autoMount:
    enabled: false

# MTU = the UNDERLYING network MTU Cilium tunnels VXLAN over (= nebula1, see
# nebula.tf), NOT the pod MTU. Cilium subtracts the 50-byte VXLAN overhead itself,
# so MTU=1420 -> 1370 cross-node pod MTU. Do NOT set the desired pod MTU here:
# MTU=1370 wrongly yields a 1320 pod MTU (measured 2026-06-08).
# Full model + layering: cluster/docs/network.md. Helm key is uppercase `MTU`.
MTU: 1420

# Gateway API: replaces ingress-nginx (retired March 2026)
# Reuses per-node Envoy DaemonSet — zero additional controllers.
# hostNetwork binds ports 80/443 directly on gateway nodes.
gatewayAPI:
  enabled: true
  enableAppProtocol: true
  hostNetwork:
    enabled: true
    nodes:
      matchLabels:
        topology.kubernetes.io/region: hil

# Standalone Envoy DaemonSet (separate from cilium-agent) for cleaner lifecycle.
# NET_ADMIN + SYS_ADMIN required for Cilium datapath integration (BPF).
# NET_BIND_SERVICE required for binding privileged ports (80, 443) in hostNetwork mode.
envoy:
  enabled: true
  dnsPolicy: ClusterFirstWithHostNet
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE

# Observability (optional, not networking-critical)
# Expose cilium-agent metrics through the chart-managed headless Service. The
# ServiceMonitor is declared separately under cluster/k8s/monitoring/cilium so
# the bootstrap-time Helm install does not depend on monitoring CRDs.
prometheus:
  enabled: true
  metricsService: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

  # Flow metrics. Without these, flows exist only in hubble-relay's in-memory
  # ring buffer: visible live in the UI, gone afterwards. Every egress question
  # then has to be asked while the traffic is happening, which is why short
  # captures here have repeatedly "cleared" callers that were merely idle at the
  # time (debug/github_rate_limit_monitoring_blind_spot.md). These are scraped
  # into Mimir, so a window can be queried after the fact.
  #
  # Observability plane only: no datapath, MTU, or routing change, so the
  # Nebula-compatibility warning at the top of this file does not apply.
  #
  # Cardinality is the cost here, and `destinationContext` is where it bites:
  # pod IPs churn on every restart and each new value is a new Mimir series
  # forever. Resolving to a workload name first keeps intra-cluster traffic on
  # stable labels and leaves the IP fallback for external destinations only.
  #
  # `dns` stays empty until an L7 DNS policy routes queries through Cilium's DNS
  # proxy; it is enabled here so that turning one on needs no Helm upgrade.
  # `drop` is what shows a namespace being black-holed by such a policy.
  metrics:
    enabled:
      - "flow:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|dns|ip"
      - "drop:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|dns|ip"
      - "dns:query;ignoreAAAA"
    # As with `prometheus` above: the ServiceMonitor is declared under
    # cluster/k8s/monitoring/cilium so this bootstrap-time install does not
    # depend on monitoring CRDs.
    serviceMonitor:
      enabled: false

operator:
  dnsPolicy: ClusterFirstWithHostNet
