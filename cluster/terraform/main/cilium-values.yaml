# Cilium CNI — Talos-recommended defaults + Nebula-compatible MTU
#
# IMPORTANT: Do not add non-default options without verifying Nebula overlay compatibility.
# See: https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium

# Required: Talos-recommended IPAM
ipam:
  mode: kubernetes

# Required: kube-proxy replacement (kube-proxy disabled in Talos config)
kubeProxyReplacement: "true"
k8sServiceHost: "localhost"
k8sServicePort: "7445"

# Required: Talos security context (no SYS_MODULE — Talos blocks kernel module loading)
securityContext:
  capabilities:
    ciliumAgent:
      [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

# Required: Talos cgroup configuration
cgroup:
  hostRoot: /sys/fs/cgroup
  autoMount:
    enabled: false

# MTU = the UNDERLYING network MTU Cilium tunnels VXLAN over (= nebula1, see
# nebula.tf), NOT the pod MTU. Cilium subtracts the 50-byte VXLAN overhead itself,
# so MTU=1420 -> 1370 cross-node pod MTU. Do NOT set the desired pod MTU here:
# MTU=1370 wrongly yields a 1320 pod MTU (measured 2026-06-08).
# Full model + layering: cluster/docs/network.md. Helm key is uppercase `MTU`.
MTU: 1420

# Gateway API: replaces ingress-nginx (retired March 2026)
# Reuses per-node Envoy DaemonSet — zero additional controllers.
# hostNetwork binds ports 80/443 directly on gateway nodes.
gatewayAPI:
  enabled: true
  enableAppProtocol: true
  hostNetwork:
    enabled: true
    nodes:
      matchLabels:
        topology.kubernetes.io/region: hil

# Standalone Envoy DaemonSet (separate from cilium-agent) for cleaner lifecycle.
# NET_ADMIN + SYS_ADMIN required for Cilium datapath integration (BPF).
# NET_BIND_SERVICE required for binding privileged ports (80, 443) in hostNetwork mode.
envoy:
  enabled: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE

# Observability (optional, not networking-critical)
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
