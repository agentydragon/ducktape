apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlite-bench-local-path-ovh-ssd-3
  namespace: sqlite-storage-bench
  labels:
    app.kubernetes.io/name: sqlite-storage-bench
    sqlite-storage-bench/run-id: 20260707T002921Z
    sqlite-storage-bench/storage-class: local-path-ovh-ssd
    sqlite-storage-bench/repeat: "3"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-ovh-ssd
  resources:
    requests:
      storage: 8Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sqlite-bench-local-path-ovh-ssd-3
  namespace: sqlite-storage-bench
  labels:
    app.kubernetes.io/name: sqlite-storage-bench
    sqlite-storage-bench/run-id: 20260707T002921Z
    sqlite-storage-bench/storage-class: local-path-ovh-ssd
    sqlite-storage-bench/repeat: "3"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sqlite-storage-bench
        sqlite-storage-bench/run-id: 20260707T002921Z
        sqlite-storage-bench/storage-class: local-path-ovh-ssd
        sqlite-storage-bench/repeat: "3"
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      containers:
        - name: sqlite-bench
          image: python:3.13-slim
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /bench/bench_sqlite_storage.py
          env:
            - name: BENCH_ID
              value: 20260707T002921Z-local-path-ovh-ssd-3
            - name: STORAGE_CLASS
              value: local-path-ovh-ssd
            - name: REPEAT_INDEX
              value: "3"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: bench-script
              mountPath: /bench
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: bench-script
          configMap:
            name: sqlite-storage-bench-script
            defaultMode: 0555
        - name: data
          persistentVolumeClaim:
            claimName: sqlite-bench-local-path-ovh-ssd-3
