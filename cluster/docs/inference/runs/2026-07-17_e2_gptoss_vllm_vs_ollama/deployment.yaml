apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-gptoss
  namespace: llm-bench
  labels:
    app.kubernetes.io/name: vllm-gptoss
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-gptoss
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-gptoss
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          # gpt-oss-20b ships native MXFP4 safetensors — hits the 5090's FP4
          # tensor cores directly (vs Ollama, which dequantizes GGUF MXFP4 to
          # bf16). Single GPU (TP1): the apt comparison against single-node Ollama
          # (no tensor parallel), and 20B MXFP4 (~13 GB) + 128K KV fits one 5090.
          args:
            - --model=openai/gpt-oss-20b
            - --served-model-name=gpt-oss-20b
            - --tensor-parallel-size=1
            - --max-model-len=131072
            - --gpu-memory-utilization=0.90
            - --max-num-seqs=32
            - --enable-auto-tool-choice
            - --tool-call-parser=openai
            - --host=0.0.0.0
            - --port=8000
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /hf-cache
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: 24Gi
            limits:
              nvidia.com/gpu: 1
              memory: 48Gi
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-gptoss
  namespace: llm-bench
spec:
  selector:
    app.kubernetes.io/name: vllm-gptoss
  ports:
    - name: http
      port: 8000
      targetPort: http
