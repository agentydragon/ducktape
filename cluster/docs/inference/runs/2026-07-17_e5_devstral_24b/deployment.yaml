apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-devstral
  namespace: llm-bench
  labels:
    app.kubernetes.io/name: vllm-devstral
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-devstral
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-devstral
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          # E5: the dense coding-agent baseline (vs the MoEs of E1/E2/E4).
          # Devstral-Small-2-24B is FP8, Mistral3 (multimodal) arch. Dense weights
          # → expect slower decode than the A3B MoEs but strong published agentic
          # scores. 0.85 util leaves GPU0 room for wyrm2's display (see E4).
          args:
            - --model=mistralai/Devstral-Small-2-24B-Instruct-2512
            - --served-model-name=devstral-24b
            - --tensor-parallel-size=2
            - --max-model-len=131072
            - --kv-cache-dtype=fp8
            - --gpu-memory-utilization=0.85
            - --max-num-seqs=32
            - --enable-auto-tool-choice
            - --tool-call-parser=mistral
            - --host=0.0.0.0
            - --port=8000
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /hf-cache
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          resources:
            requests:
              nvidia.com/gpu: 2
              cpu: "4"
              memory: 24Gi
            limits:
              nvidia.com/gpu: 2
              memory: 48Gi
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 160
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-devstral
  namespace: llm-bench
spec:
  selector:
    app.kubernetes.io/name: vllm-devstral
  ports:
    - name: http
      port: 8000
      targetPort: http
