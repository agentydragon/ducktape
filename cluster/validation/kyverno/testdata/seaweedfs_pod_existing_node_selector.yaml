apiVersion: v1
kind: Pod
metadata:
  name: seaweedfs-consumer-pinned
  namespace: agent-workspaces
spec:
  nodeSelector:
    topology.kubernetes.io/region: hil
  containers:
    - name: app
      image: busybox
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: seaweedfs-consumer-data
