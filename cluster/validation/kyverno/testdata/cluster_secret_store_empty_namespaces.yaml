# A condition that carries an empty namespaces list: non-empty `conditions`,
# but it names nothing.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: empty-namespaces-store
spec:
  conditions:
    - namespaces: []
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: flux-system
