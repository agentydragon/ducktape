# An empty LabelSelector matches every namespace, so this reads as a fence while
# being the widest setting available.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bare-selector-store
spec:
  conditions:
    - namespaceSelector: {}
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: flux-system
