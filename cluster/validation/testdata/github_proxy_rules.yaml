rule_files:
  - github-proxy.yaml
evaluation_interval: 1m
tests:
  - name: healthy scrape capture and storage do not alert
    interval: 1m
    input_series:
      - series: up{namespace="github-api-proxy",job="github-api-proxy/github-api-proxy",pod="healthy"}
        values: 1+0x10
      - series: github_api_proxy_capture_write_failures_total{namespace="github-api-proxy",pod="healthy",channel="raw"}
        values: 0+0x10
      - series: github_api_proxy_capture_write_failures_total{namespace="github-api-proxy",pod="healthy",channel="session_ws"}
        values: 0+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-a:9327",job="server-a"}
        values: 40+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-a:9327",job="peer"}
        values: 39+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-b:9327",job="server-b"}
        values: 40+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-b:9327",job="peer"}
        values: 40+0x10
      - series: kube_persistentvolumeclaim_info{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",volumename="pvc-capture",storageclass="seaweedfs-ovh",instance="ksm-a"}
        values: 1+0x10
      - series: kube_persistentvolumeclaim_info{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",volumename="pvc-capture",storageclass="seaweedfs-ovh",instance="ksm-b"}
        values: 1+0x10
      - series: kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",instance="ksm-a"}
        values: 100+0x10
      - series: kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",instance="ksm-b"}
        values: 100+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-unrelated",type="normal",instance="server-a:9327"}
        values: 1000+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="deleted_bytes",instance="server-a:9327"}
        values: 1000+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="unrelated",collection="pvc-capture",type="normal",instance="server-a:9327"}
        values: 1000+0x10
      - series: github_api_proxy_capture_write_failures_total{namespace="unrelated",channel="raw"}
        values: 1+0x10
    promql_expr_test:
      - expr: github_api_proxy:capture_collection_physical_storage_budget:ratio
        eval_time: 10m
        exp_samples:
          - labels: github_api_proxy:capture_collection_physical_storage_budget:ratio{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"}
            value: 0.8
      - expr: ALERTS{alertname=~"GitHubProxy.*",alertstate="firing"}
        eval_time: 10m
        exp_samples: []

  - name: a capture failure stays visible despite healthy scrapes and no new failures
    interval: 1m
    input_series:
      - series: up{namespace="github-api-proxy",job="github-api-proxy/github-api-proxy",pod="running"}
        values: 1+0x10
      - series: github_api_proxy_capture_write_failures_total{namespace="github-api-proxy",pod="running",channel="raw"}
        values: 0 1+0x9
      - series: github_api_proxy_capture_write_failures_total{namespace="github-api-proxy",pod="running",channel="session_ws"}
        values: 0+0x10
    promql_expr_test:
      - expr: ALERTS{alertname=~"GitHubProxy(CaptureWriteFailed|Metrics.*)",alertstate="firing"}
        eval_time: 0m
        exp_samples: []
      - expr: ALERTS{alertname=~"GitHubProxy(CaptureWriteFailed|Metrics.*)",alertstate="firing"}
        eval_time: 1m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyCaptureWriteFailed",alertstate="firing",channel="raw",severity="warning"}
            value: 1
      - expr: ALERTS{alertname=~"GitHubProxy(CaptureWriteFailed|Metrics.*)",alertstate="firing"}
        eval_time: 10m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyCaptureWriteFailed",alertstate="firing",channel="raw",severity="warning"}
            value: 1

  - name: failed scrapes alert after two minutes but are not missing discovery
    interval: 1m
    input_series:
      - series: up{namespace="github-api-proxy",job="github-api-proxy/github-api-proxy",pod="failed"}
        values: 0+0x10
    promql_expr_test:
      - expr: ALERTS{alertname=~"GitHubProxyMetrics.*",alertstate="firing"}
        eval_time: 1m
        exp_samples: []
      - expr: ALERTS{alertname=~"GitHubProxyMetrics.*",alertstate="firing"}
        eval_time: 2m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyMetricsScrapeFailed",alertstate="firing",severity="warning"}
            value: 1
      - expr: ALERTS{alertname=~"GitHubProxyMetrics.*",alertstate="firing"}
        eval_time: 10m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyMetricsScrapeFailed",alertstate="firing",severity="warning"}
            value: 1

  - name: vanished discovery alerts five minutes after the last sample
    interval: 1m
    input_series:
      - series: up{namespace="github-api-proxy",job="github-api-proxy/github-api-proxy",pod="gone"}
        values: 1 stale
      - series: up{namespace="github-api-proxy",job="unrelated"}
        values: 1+0x6
      - series: up{namespace="unrelated",job="github-api-proxy/github-api-proxy"}
        values: 1+0x6
    promql_expr_test:
      - expr: ALERTS{alertname=~"GitHubProxyMetrics.*",alertstate="firing"}
        eval_time: 4m
        exp_samples: []
      - expr: ALERTS{alertname=~"GitHubProxyMetrics.*",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyMetricsMissing",alertstate="firing",namespace="github-api-proxy",job="github-api-proxy/github-api-proxy",severity="warning"}
            value: 1

  - name: a healthy replacement clears the alert despite a still discovered failed target
    interval: 1m
    input_series:
      - series: up{namespace="github-api-proxy",job="github-api-proxy/github-api-proxy",pod="old"}
        values: 0+0x10
      - series: up{namespace="github-api-proxy",job="github-api-proxy/github-api-proxy",pod="replacement"}
        values: _ _ _ 1+0x7
    promql_expr_test:
      - expr: ALERTS{alertname=~"GitHubProxyMetrics.*",alertstate="firing"}
        eval_time: 2m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyMetricsScrapeFailed",alertstate="firing",severity="warning"}
            value: 1
      - expr: ALERTS{alertname=~"GitHubProxyMetrics.*",alertstate="firing"}
        eval_time: 3m
        exp_samples: []
      - expr: ALERTS{alertname=~"GitHubProxyMetrics.*",alertstate="firing"}
        eval_time: 10m
        exp_samples: []

  - name: collection physical bytes must exceed eighty-five percent of the PVC request for five minutes
    interval: 1m
    input_series:
      - series: kube_persistentvolumeclaim_info{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",volumename="pvc-capture",storageclass="seaweedfs-ovh"}
        values: 1+0x8
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-a:9327"}
        values: 85 85 86+0x5 85
      - series: kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"}
        values: 100+0x8
    promql_expr_test:
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 1m
        exp_samples: []
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 6m
        exp_samples: []
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 7m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyCaptureCollectionStorageBudgetHigh",alertstate="firing",namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",severity="warning"}
            value: 1
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 8m
        exp_samples: []

  - name: an observed zero-byte collection is not missing telemetry
    interval: 1m
    input_series:
      - series: kube_persistentvolumeclaim_info{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",volumename="pvc-capture",storageclass="seaweedfs-ovh"}
        values: 1+0x10
      - series: kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"}
        values: 100+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-a:9327"}
        values: 0+0x10
    promql_expr_test:
      - expr: github_api_proxy:capture_collection_physical_storage_budget:ratio
        eval_time: 10m
        exp_samples:
          - labels: github_api_proxy:capture_collection_physical_storage_budget:ratio{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"}
            value: 0
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 10m
        exp_samples: []

  - name: missing collection bytes alert after five minutes even when unrelated collections exist
    interval: 1m
    input_series:
      - series: kube_persistentvolumeclaim_info{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",volumename="pvc-capture",storageclass="seaweedfs-ovh"}
        values: 1+0x10
      - series: kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"}
        values: 100+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-unrelated",type="normal",instance="server-a:9327"}
        values: 40+0x10
    promql_expr_test:
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 4m
        exp_samples: []
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyCaptureStorageBudgetInputsMissing",alertstate="firing",namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",severity="warning"}
            value: 1

  - name: missing PVC mapping does not silently suppress storage observation failure
    interval: 1m
    input_series:
      - series: kube_persistentvolumeclaim_info{namespace="github-api-proxy",persistentvolumeclaim="unrelated",volumename="pvc-capture",storageclass="seaweedfs-ovh"}
        values: 1+0x10
      - series: kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"}
        values: 100+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-a:9327"}
        values: 40+0x10
    promql_expr_test:
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyCaptureStorageBudgetInputsMissing",alertstate="firing",namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",severity="warning"}
            value: 1

  - name: an unmatched collection mapping is not zero usage
    interval: 1m
    input_series:
      - series: kube_persistentvolumeclaim_info{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",volumename="pvc-other",storageclass="seaweedfs-ovh"}
        values: 1+0x10
      - series: kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"}
        values: 100+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-a:9327"}
        values: 40+0x10
    promql_expr_test:
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyCaptureStorageBudgetInputsMissing",alertstate="firing",namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",severity="warning"}
            value: 1

  - name: a missing PVC request is an unavailable budget
    interval: 1m
    input_series:
      - series: kube_persistentvolumeclaim_info{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",volumename="pvc-capture",storageclass="seaweedfs-ovh"}
        values: 1+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-a:9327"}
        values: 40+0x10
    promql_expr_test:
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyCaptureStorageBudgetInputsMissing",alertstate="firing",namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",severity="warning"}
            value: 1

  - name: a nonpositive PVC request is unavailable rather than an infinite ratio
    interval: 1m
    input_series:
      - series: kube_persistentvolumeclaim_info{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",volumename="pvc-capture",storageclass="seaweedfs-ovh"}
        values: 1+0x10
      - series: kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"}
        values: 0+0x5 -1+0x4
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-a:9327"}
        values: 40+0x10
    promql_expr_test:
      - expr: github_api_proxy:capture_collection_physical_storage_budget:ratio
        eval_time: 5m
        exp_samples: []
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyCaptureStorageBudgetInputsMissing",alertstate="firing",namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",severity="warning"}
            value: 1
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 10m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyCaptureStorageBudgetInputsMissing",alertstate="firing",namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",severity="warning"}
            value: 1

  - name: one duplicate scrape can fail but total collection scrape loss alerts and recovery clears it
    interval: 1m
    input_series:
      - series: kube_persistentvolumeclaim_info{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",volumename="pvc-capture",storageclass="seaweedfs-ovh"}
        values: 1+0x10
      - series: kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"}
        values: 100+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-a:9327",job="server-a"}
        values: 40 stale _ _ _ _ _ _ 40+0x2
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-a:9327",job="peer"}
        values: 40 40 stale _ _ _ _ _ 40+0x2
    promql_expr_test:
      - expr: github_api_proxy:capture_collection_physical_storage_budget:ratio
        eval_time: 1m
        exp_samples:
          - labels: github_api_proxy:capture_collection_physical_storage_budget:ratio{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"}
            value: 0.4
      - expr: github_api_proxy:capture_collection_physical_storage_budget:ratio
        eval_time: 2m
        exp_samples: []
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 6m
        exp_samples: []
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 7m
        exp_samples:
          - labels: ALERTS{alertname="GitHubProxyCaptureStorageBudgetInputsMissing",alertstate="firing",namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",severity="warning"}
            value: 1
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 8m
        exp_samples: []

  - name: partial server loss can undercount a present ratio and is not detected by the absence guard
    interval: 1m
    input_series:
      - series: kube_persistentvolumeclaim_info{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture",volumename="pvc-capture",storageclass="seaweedfs-ovh"}
        values: 1+0x10
      - series: kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"}
        values: 100+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-a:9327"}
        values: 40+0x10
      - series: SeaweedFS_volumeServer_total_disk_size{namespace="seaweedfs",collection="pvc-capture",type="normal",instance="server-b:9327"}
        values: 40 stale
    promql_expr_test:
      - expr: github_api_proxy:capture_collection_physical_storage_budget:ratio
        eval_time: 0m
        exp_samples:
          - labels: github_api_proxy:capture_collection_physical_storage_budget:ratio{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"}
            value: 0.8
      - expr: github_api_proxy:capture_collection_physical_storage_budget:ratio
        eval_time: 10m
        exp_samples:
          - labels: github_api_proxy:capture_collection_physical_storage_budget:ratio{namespace="github-api-proxy",persistentvolumeclaim="github-api-proxy-capture"}
            value: 0.4
      - expr: ALERTS{alertname=~"GitHubProxyCapture.*Storage.*",alertstate="firing"}
        eval_time: 10m
        exp_samples: []
