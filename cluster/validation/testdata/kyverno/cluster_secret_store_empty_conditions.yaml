# `conditions: []` reads as a tightening but ESO treats it like an absent field.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: empty-conditions-store
spec:
  conditions: []
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      remoteNamespace: flux-system
