apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../check
patches:
  - target:
      kind: Job
      name: forgejo-key-check
    # Argument positions refer to check/job.yaml.
    patch: |-
      - op: replace
        path: /metadata/name
        value: forgejo-key-verify
      - op: replace
        path: /spec/template/spec/containers/0/args/1
        value: --old-key-file=/keys/replacement
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: --new-key-file=/keys/current
