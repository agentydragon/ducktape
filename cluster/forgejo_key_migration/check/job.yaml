apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-key-check
  namespace: forgejo
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
        kubernetes.io/hostname: ovh-ns103656
      imagePullSecrets:
        - name: haku-forgejo-registry-pull
      containers:
        - name: migrate
          # Exact image exercised by the isolated rehearsal.
          image: git.allegedly.works/ducktape-ci/forgejo-key-migration@sha256:89516e63d6fbf4161a5915e12b999379a55b213ff8325eaec36682dc82b3032f
          imagePullPolicy: IfNotPresent
          args:
            - check
            - --old-key-file=/keys/current
            - --new-key-file=/keys/replacement
            - --database-host=forgejo-db-ssd-rw.forgejo.svc
            - --database-name=forgejo
            - --database-user-file=/database/username
            - --database-password-file=/database/password
            - --database-ca-file=/database-ca/ca.crt
            - --expect-secrets=4
            - --expect-mirrors=1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: database
              mountPath: /database
              readOnly: true
            - name: database-ca
              mountPath: /database-ca
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: forgejo-secret-key
            defaultMode: 288
            items:
              - key: current
                path: current
              - key: replacement
                path: replacement
        - name: database
          secret:
            secretName: forgejo-db-ssd-creds
            defaultMode: 288
            items:
              - key: username
                path: username
              - key: password
                path: password
        - name: database-ca
          secret:
            secretName: forgejo-db-ssd-ca
            items:
              - key: ca.crt
                path: ca.crt
