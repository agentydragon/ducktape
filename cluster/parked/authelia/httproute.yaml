apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: authelia
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    # Use a separate subdomain during transition (Authentik still owns auth.allegedly.works)
    - "authelia.allegedly.works"
  rules:
    - backendRefs:
        - name: authelia
          port: 80
