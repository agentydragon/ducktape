apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firecrawl
  namespace: firecrawl
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "firecrawl.allegedly.works"
  rules:
    - backendRefs:
        - name: firecrawl-api
          port: 3002
