    name: public-coder-devbox-ssh-host-key
    namespace: public-coder-agent
    annotations:
        description: The devbox's persistent sshd host key. KubeVirt attaches it as the `pchostkey` guest disk; the guest installs it at /etc/ssh/ before sshd starts. Public half is committed at ssh_keys/public-coder-devbox-host.pub and pins this upstream in sshpiper's Pipe, so rotating this key means updating that file and the Pipe's known_hosts_data together.
