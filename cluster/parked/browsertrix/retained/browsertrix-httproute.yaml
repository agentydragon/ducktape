# HTTPRoute for Browsertrix via the shared Authentik proxy outpost.
# Traffic flows: Gateway -> Authentik server/outpost -> Browsertrix frontend.
# The frontend proxies /api to Browsertrix's backend, so one protected internal
# host covers the UI, API, and same-origin WACZ downloads under /data/.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browsertrix
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - archive.allegedly.works
  rules:
    - timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: authentik-server
          port: 80
