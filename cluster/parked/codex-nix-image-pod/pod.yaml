apiVersion: v1
kind: Pod
metadata:
  name: codex-nix-image-pod
  namespace: codex-nix-image-pod
  labels:
    app.kubernetes.io/name: codex-nix-image-pod
spec:
  restartPolicy: Always
  nodeSelector:
    topology.kubernetes.io/region: hil
  containers:
    - name: shell
      image: docker.io/nixos/nix:latest
      imagePullPolicy: IfNotPresent
      command:
        - /root/.nix-profile/bin/nix
      args:
        - shell
        - nixpkgs#bash
        - nixpkgs#coreutils
        - -c
        - bash
        - -lc
        - |
          set -eu
          mkdir -p /tmp/xdg-cache /workspace /home/codex/.cache /home/codex/.config/direnv
          chmod 0755 /tmp/xdg-cache /workspace /home/codex /home/codex/.cache /home/codex/.config /home/codex/.config/direnv
          exec tail -f /dev/null
      env:
        - name: HOME
          value: /home/codex
        - name: USER
          value: codex
        - name: XDG_CACHE_HOME
          value: /tmp/xdg-cache
        - name: NIX_CONFIG
          value: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      volumeMounts:
        - name: home
          mountPath: /home/codex
          subPath: home
        - name: home
          mountPath: /workspace
          subPath: workspace
      resources:
        requests:
          cpu: "500m"
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 8Gi
  volumes:
    - name: home
      persistentVolumeClaim:
        claimName: codex-home
