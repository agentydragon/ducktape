apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-config
  namespace: paperless
data:
  PAPERLESS_URL: "https://paperless.allegedly.works"
  PAPERLESS_TIME_ZONE: "America/Los_Angeles"
  PAPERLESS_OCR_LANGUAGE: "eng"

  # Postgres (CNPG paperless-db; password injected from paperless-db-app secret)
  PAPERLESS_DBENGINE: "postgresql"
  PAPERLESS_DBHOST: "paperless-db-rw.paperless.svc.cluster.local"
  PAPERLESS_DBPORT: "5432"
  PAPERLESS_DBNAME: "paperless"
  PAPERLESS_DBUSER: "paperless"

  # Valkey (RedisReplication primary endpoint)
  PAPERLESS_REDIS: "redis://paperless-valkey-ovh-master.paperless.svc.cluster.local:6379"

  # OIDC-only auth via Authentik (django-allauth openid_connect provider).
  # PAPERLESS_SOCIALACCOUNT_PROVIDERS JSON is injected from the reflected
  # paperless-sso-providers secret. Authentik's paperless_admins group is synced
  # to the matching local group and grants agentydragon Django superuser status.
  # The bootstrap Job owns the local groups and their permissions. Keep the
  # SSO claim as the sole source of group membership; synchronization replaces
  # memberships from the groups claim on login.
  PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
  PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
  PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
  PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
  PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS_CLAIM: "groups"
  PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP: "paperless_admins"
  PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
  PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
  PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
