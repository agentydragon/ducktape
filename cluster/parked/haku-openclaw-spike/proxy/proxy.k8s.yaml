apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-creds-reader
  namespace: haku-egress-proxy
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haku-openclaw-spike-github-token
  namespace: haku-egress-proxy
spec:
  data:
    - remoteRef:
        key: github-agentydragon-agent
        property: token
      secretKey: GITHUB_TOKEN
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-external-creds-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: haku-openclaw-spike-github-token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haku-openclaw-spike-proxy-config
  namespace: haku-egress-proxy
data:
  iron.yaml: |
    dns:
      enabled: false
    proxy:
      tunnel_listen: :8181
      upstream_response_header_timeout: 5m
    tls:
      mode: mitm
      ca_cert: /ca/tls.crt
      ca_key: /ca/tls.key
    transforms:
      - name: allowlist
        config:
          domains:
            - api.anthropic.com
            - api.github.com
            - bcr.bazel.build
            - cache.nixos.org
            - channels.nixos.org
            - code.forgejo.org
            - codeload.github.com
            - data.forgejo.org
            - files.pythonhosted.org
            - forgejo-http.forgejo
            - ftp.gnu.org
            - ghcr.io
            - github.com
            - haku.allegedly.works
            - index.crates.io
            - kubeapi.allegedly.works
            - nixos.org
            - nodejs.org
            - objects.githubusercontent.com
            - pkg-containers.githubusercontent.com
            - pypi.org
            - raw.githubusercontent.com
            - registry.npmjs.org
            - release-assets.githubusercontent.com
            - releases.bazel.build
            - snapshot.debian.org
            - static.crates.io
            - static.rust-lang.org
      - name: secrets
        config:
          secrets:
            - source:
                type: env
                var: CLAUDE_CODE_OAUTH_TOKEN
              replace:
                proxy_value: sk-ant-oat01-proxy-haku-openclaw-placeholder
                match_headers:
                  - Authorization
              rules:
                - host: api.anthropic.com
            - source:
                type: env
                var: HAKU_GIT_PASSWORD
              replace:
                proxy_value: proxy-haku-forgejo-placeholder
                match_headers:
                  - Authorization
              rules:
                - host: forgejo-http.forgejo
            - source:
                type: env
                var: GITHUB_TOKEN
              replace:
                proxy_value: proxy-github-placeholder
                match_headers:
                  - Authorization
              rules:
                - host: api.github.com
                - host: github.com
                - host: codeload.github.com
            - source:
                type: env
                var: HAKU_KUBE_JWT
              replace:
                proxy_value: proxy-haku-kube-placeholder
                match_headers:
                  - Authorization
              rules:
                - host: kubeapi.allegedly.works
    log:
      level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Holds Haku OpenClaw spike credentials and substitutes placeholders only for exact destination hosts.
  labels:
    app.kubernetes.io/name: haku-openclaw-spike-proxy
  name: haku-openclaw-spike-proxy
  namespace: haku-egress-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haku-openclaw-spike-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haku-openclaw-spike-proxy
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - -config
            - /etc/iron-proxy/iron.yaml
          env:
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  key: CLAUDE_CODE_OAUTH_TOKEN
                  name: haku-claude-oauth-token
            - name: HAKU_GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: haku-forgejo-git
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  key: GITHUB_TOKEN
                  name: haku-openclaw-spike-github-token
            - name: HAKU_KUBE_JWT
              valueFrom:
                secretKeyRef:
                  key: jwt
                  name: haku-openclaw-spike-kube-token
                  optional: true
          image: git.allegedly.works/ducktape-ci/iron-proxy:unset
          name: iron-proxy
          ports:
            - containerPort: 8181
              name: proxy
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /etc/iron-proxy
              name: config
              readOnly: true
            - mountPath: /ca
              name: ca
              readOnly: true
      imagePullSecrets:
        - name: forgejo-images-creds
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - configMap:
            name: haku-openclaw-spike-proxy-config
          name: config
        - name: ca
          secret:
            secretName: haku-egress-proxy-ca
---
apiVersion: v1
kind: Service
metadata:
  name: haku-openclaw-spike-proxy
  namespace: haku-egress-proxy
spec:
  ports:
    - name: proxy
      port: 8181
      protocol: TCP
      targetPort: 8181
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: 9090
  selector:
    app.kubernetes.io/name: haku-openclaw-spike-proxy
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-haku-openclaw-spike-proxy-ingress
  namespace: haku-egress-proxy
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haku-openclaw-spike
      ports:
        - port: 8181
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: haku-openclaw-spike-proxy
  policyTypes:
    - Ingress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    description: Lets the authentik-jwt-rotation CronJob read back the one Secret it publishes here, so its probe can verify the live token against kubeapi.allegedly.works. Nothing else in this namespace is readable.
  name: authentik-jwt-rotation-published-secrets-reader
  namespace: haku-egress-proxy
rules:
  - apiGroups:
      - ""
    resourceNames:
      - haku-openclaw-spike-kube-token
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-jwt-rotation-published-secrets-reader
  namespace: haku-egress-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-jwt-rotation-published-secrets-reader
subjects:
  - kind: ServiceAccount
    name: authentik-jwt-rotation
    namespace: agents-infra
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-haku-openclaw-spike-proxy-egress
  namespace: haku-egress-proxy
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "**.cluster.local"
              - matchName: api.anthropic.com
              - matchName: api.github.com
              - matchName: bcr.bazel.build
              - matchName: cache.nixos.org
              - matchName: channels.nixos.org
              - matchName: code.forgejo.org
              - matchName: codeload.github.com
              - matchName: data.forgejo.org
              - matchName: files.pythonhosted.org
              - matchName: forgejo-http.forgejo
              - matchName: ftp.gnu.org
              - matchName: ghcr.io
              - matchName: github.com
              - matchName: haku.allegedly.works
              - matchName: index.crates.io
              - matchName: kubeapi.allegedly.works
              - matchName: nixos.org
              - matchName: nodejs.org
              - matchName: objects.githubusercontent.com
              - matchName: pkg-containers.githubusercontent.com
              - matchName: pypi.org
              - matchName: raw.githubusercontent.com
              - matchName: registry.npmjs.org
              - matchName: release-assets.githubusercontent.com
              - matchName: releases.bazel.build
              - matchName: snapshot.debian.org
              - matchName: static.crates.io
              - matchName: static.rust-lang.org
    - toEntities:
        - world
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: forgejo
            k8s:io.kubernetes.pod.namespace: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: haku-openclaw-spike-proxy
