apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: manifold-mcp
  namespace: manifold-mcp
  annotations:
    description: "Authentik-gated Manifold MCP facade. Only agentydragon is allowed at the OAuth consent step (group binding in tf/gitops/agent-machine-access)."
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "manifold-mcp.allegedly.works"
  rules:
    - backendRefs:
        - name: manifold-mcp
          port: 8765
      timeouts:
        request: "60s"
        backendRequest: "60s"
