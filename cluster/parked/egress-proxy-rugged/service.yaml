apiVersion: v1
kind: Service
metadata:
  name: egress-rugged
  namespace: egress-proxy
  annotations:
    description: Internal HTTP CONNECT proxy service whose upstream egress leaves through rugged
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: egress-proxy
    app.kubernetes.io/instance: rugged
  ports:
    - name: http-proxy
      port: 8080
      targetPort: http-proxy
