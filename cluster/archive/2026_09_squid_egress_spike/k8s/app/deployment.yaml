# Block style only, no `{a: 1, b: 2}` flow mappings anywhere in this file.
#
# It carries `$imagepolicy` markers, and Flux's ImageUpdateAutomation
# re-serialises the whole document when it rewrites a tag. Its YAML emitter
# writes flow mappings without inner spaces; prettier writes them with. So a
# flow mapping here means every image update silently reformats the file and
# leaves devel failing pre-commit — and because those commits are
# `chore: update images [skip ci]` pushed straight to devel, no CI run catches
# it. Block style is what the emitter produces natively, so the rewrite touches
# only the image line.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squid-spike
  namespace: squid-egress-spike
  labels:
    app.kubernetes.io/name: squid-spike
  annotations:
    reloader.stakater.com/auto: "true"
    description: Squid with ssl_bump, exercising destination-scoped credential substitution and memory caching.
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: squid-spike
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squid-spike
    spec:
      # Mirrored in by emberstack reflector from the source Secret in
      # cluster/k8s/forgejo-images/registry-creds.sops.yaml, whose
      # reflection-*-namespaces annotations must list squid-egress-spike.
      # Deliberately NOT an ExternalSecret against
      # kubernetes-flux-system-secret-store: that store's conditions are a
      # per-namespace grant to read EVERY secret in flux-system, which is far
      # more than a throwaway spike should hold to pull one public-ish image.
      imagePullSecrets:
        - name: forgejo-images-creds
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # 13 = `proxy`, Debian's squid user (`--with-default-user=proxy`). It was
        # 31 while the image was Alpine-based, whose user is `squid`. The image's
        # CI verify step prints `id proxy` on every build so this number comes
        # from the build rather than from memory -- a mismatch does not fail
        # loudly, it fails as the cache directory being unwritable.
        runAsUser: 13
        runAsGroup: 13
        fsGroup: 13
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Three jobs, all of which must happen before squid starts: assemble the
        # bump CA into the single file squid wants, initialise the certificate
        # store, and render the credential rules. The render exists because
        # squid.conf cannot read environment variables -- its ${...} covers only
        # process_name/process_number/service_name.
        - name: prepare
          image: git.allegedly.works/ducktape-ci/squid-ssl:devel-20260819201216-06b8b19 # {"$imagepolicy": "flux-system:squid-ssl"}
          envFrom:
            - configMapRef:
                name: squid-spike-fake-credentials
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Squid wants one file containing both halves; cert-manager emits
              # them separately. Same combine step the production fences do.
              cat /run/squid-ca-src/tls.crt /run/squid-ca-src/tls.key > /run/squid-ca/bump-ca.pem
              # Guarded because init containers re-run when the pod sandbox is
              # recreated while the emptyDir survives, and -c on an existing db
              # is an error -- unguarded, that wedges the pod at init.
              [ -d /var/cache/squid/ssl_db ] \
                || /usr/lib/squid/security_file_certgen -c -s /var/cache/squid/ssl_db -M 8MB
              envsubst < /etc/squid-template/credentials.conf.tmpl > /run/squid-secrets/credentials.conf
              echo "rendered credential rules:"; grep -c request_header_add /run/squid-secrets/credentials.conf
          volumeMounts:
            - name: ca-src
              mountPath: /run/squid-ca-src
              readOnly: true
            - name: ca
              mountPath: /run/squid-ca
            - name: cache
              mountPath: /var/cache/squid
            - name: secrets
              mountPath: /run/squid-secrets
            - name: template
              mountPath: /etc/squid-template
              readOnly: true
      containers:
        - name: squid
          image: git.allegedly.works/ducktape-ci/squid-ssl:devel-20260819201216-06b8b19 # {"$imagepolicy": "flux-system:squid-ssl"}
          args: ["-f", "/etc/squid/squid.conf", "-N"]
          ports:
            - name: proxy
              containerPort: 3128
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
              readOnly: true
            - name: ca
              mountPath: /run/squid-ca
            - name: cache
              mountPath: /var/cache/squid
            - name: secrets
              mountPath: /run/squid-secrets
              readOnly: true
            - name: run
              mountPath: /run/squid
            # Squid dies at startup on shm_open without this; a musl/container
            # interaction rather than a config error.
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: config
          configMap:
            name: squid-spike-config
        - name: template
          configMap:
            name: squid-spike-config
        # cert-manager's output, mounted only into the initContainer -- squid
        # itself never sees the raw halves, only the combined file on tmpfs.
        - name: ca-src
          secret:
            secretName: squid-spike-bump-ca
        # The rendered credential rules and the CA private key live on tmpfs,
        # never on disk and never in a ConfigMap.
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: ca
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 8Mi
        # Certificate store only; the HTTP cache is cache_mem, so nothing here
        # can outlive the pod.
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: squid-spike
  namespace: squid-egress-spike
spec:
  selector:
    app.kubernetes.io/name: squid-spike
  ports:
    - name: proxy
      port: 3128
      targetPort: 3128
