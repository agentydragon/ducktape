apiVersion: v1
kind: Namespace
metadata:
  name: squid-egress-spike
  labels:
    name: squid-egress-spike
    # Explicitly off: VPA recommendations on a throwaway spike are noise, and
    # its resource profile says nothing about what a real fence would need.
    goldilocks.fairwinds.com/enabled: "false"
    # Restricted rather than the cluster-default baseline: the spike exists to
    # decide the shape of a credential-holding fence, so it should run under the
    # posture such a fence would need.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
  annotations:
    description: Throwaway spike deciding whether one Squid can replace iron-proxy as the egress fence. Holds no real credentials.
