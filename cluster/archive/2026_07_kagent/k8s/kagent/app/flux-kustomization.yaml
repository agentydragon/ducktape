apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent
  namespace: flux-system
spec:
  retryInterval: 1m
  suspend: true
  interval: 10m
  path: ./cluster/k8s/agents/kagent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kagent
      namespace: kagent
  dependsOn:
    - name: kagent-namespace
    - name: kagent-secrets
    - name: kagent-db
    # The CRDs (notably ModelConfig) must exist before flux dry-runs the
    # ModelConfig manifest in this Kustomization.
    - name: kagent-crds
    - name: gateway
    - name: cert-manager-environment
    # Wait for the SSO providers TF root to create the kagent OIDC client +
    # reflected kagent-oauth2-proxy Secret in the kagent namespace.
    - name: sso-providers-tf
