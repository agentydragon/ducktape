apiVersion: v1
kind: Namespace
metadata:
  name: kagent
  labels:
    name: kagent
    # The kagent chart's stock cluster-ops agent Deployments (k8s-agent,
    # cilium-*, istio-agent, helm-agent, kgateway-agent, observability-agent,
    # promql-agent, argo-rollouts-conversion-agent) ship without
    # securityContext.runAsNonRoot / capabilities.drop=ALL / seccompProfile,
    # which trips PSS `restricted` enforce. Drop to `baseline` so the chart's
    # built-in agents can start.
    # TODO(2026-05-08): re-tighten to `restricted` once upstream kagent fixes
    # the agent Deployment securityContexts (or once we override them via
    # postRenderer / agent values).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
