# kubespand configuration
#
# Extract cluster credentials from Talos:
#   talosctl -n <node> get machineconfiguration -o yaml | yq '.spec.cluster.id'
#   talosctl -n <node> get machineconfiguration -o yaml | yq '.spec.cluster.secret'

cluster:
  # Talos cluster identity (base64). Required.
  id: "CHANGE_ME"

  # 32-byte AES key for discovery encryption and WireGuard PSK (base64). Required.
  secret: "CHANGE_ME"

  # Cluster API server URL. Matches Talos .spec.cluster.controlPlane.endpoint.
  # Used by KubePrism as the primary upstream before CP peers are discovered.
  # Required when kubeprism.enabled is true.
  # endpoint: "https://api.example.com:6443"

# kubespan:
#   # WireGuard UDP listen port. Must match Talos KubeSpan port. Default: 51820.
#   listen_port: 51820
#
#   # MTU for the kubespan WireGuard interface. Default: 1420.
#   # If running Cilium VXLAN (50 byte overhead) on top, use:
#   #   1500 - 80 (WireGuard) - 50 (VXLAN) = 1370
#   # Must match the cluster's Cilium MTU configuration.
#   mtu: 1420
#
#   # Path to persist the WireGuard keypair. Generated on first run. Default:
#   # /var/lib/kubespan/identity.yaml.
#   identity_file: "/var/lib/kubespan/identity.yaml"
#
#   # Route all traffic through KubeSpan even when peers are down.
#   # false = only route to peers in "up" state. Default: false.
#   force_routing: false
#
#   # Additional endpoints to announce via the discovery service.
#   # Useful for nodes behind NAT where the public IP differs from the detected IP.
#   # Format: "ip:port".
#   extra_endpoints:
#     - "203.0.113.1:51820"
#
#   # Endpoint filters control which discovered peer endpoints are accepted.
#   # Each entry is a CIDR prefix. Prefix with "!" to deny.
#   # Evaluated in order; first match wins. Empty = accept all.
#   endpoint_filters:
#     - "!192.168.0.0/16"
#     - "0.0.0.0/0"
#     - "::/0"
#
#   # Prefixes to exclude from advertised networks.
#   exclude_advertised_networks: []

# discovery:
#   # gRPC discovery service endpoint. Default: discovery.talos.dev:443.
#   # Self-host: https://github.com/siderolabs/discovery-service
#   endpoint: "discovery.talos.dev:443"
#
#   # Skip TLS certificate verification for the discovery service.
#   # Only for testing with self-hosted services using self-signed certs.
#   insecure: false
#
#   # Machine type advertised to the discovery service. Informational only —
#   # does not change behavior. Talos uses "worker" or "controlplane". Default: worker.
#   machine_type: "worker"

# kubernetes:
#   # Advertise Kubernetes pod CIDRs via the discovery service.
#   # When enabled, this node's PodCIDRs (from the K8s Node object) are included
#   # in AdditionalAddresses, so remote peers route pod traffic here via KubeSpan.
#   # Requires kubeconfig_path and node_name to be set.
#   advertise_networks: false
#
#   # Path to kubeconfig for K8s API access. Required when advertise_networks
#   # is true (unless running as a pod with in-cluster config).
#   kubeconfig_path: "/etc/kubernetes/kubelet.conf"
#
#   # Kubernetes node name. Required when advertise_networks is true.
#   node_name: "worker-1"
#
#   # Kubernetes service CIDRs to advertise alongside PodCIDRs.
#   # These are static (from your cluster config), unlike PodCIDRs which are read
#   # from the K8s API dynamically. Only used when advertise_networks is true.
#   service_cidrs:
#     - "10.96.0.0/12"

# kubeprism:
#   # Enable KubePrism local API server load balancer. Binds
#   # localhost:7445 → kube-apiserver proxy. Discovers control plane endpoints
#   # from the KubeSpan mesh and load-balances across them.
#   # Requires cluster.endpoint to be set.
#   # Default: false.
#   enabled: false
#
#   # Local address to bind. Default: "127.0.0.1".
#   host: "127.0.0.1"
#
#   # Local port to listen on. Default: 7445.
#   port: 7445

# api:
#   # Unix socket path for the read-only COSI state gRPC server.
#   # Exposes all kubespand resources (peer status, affiliates, identity, etc.)
#   # for querying via COSI gRPC clients.
#   # Default: /var/run/kubespand/kubespand.sock
#   socket_path: "/var/run/kubespand/kubespand.sock"
