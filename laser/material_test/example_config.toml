# Material Test Grid — Example Configuration
#
# Generates a parametric material test grid as a LightBurn .lbrn2 file.
# Each cell is cut with a unique (x-param, y-param) combination.
#
# Run:  bazel run //laser/material_test:grid_generator_bin -- example_config.toml [-o output.lbrn2]

# ── Title / subtitle ────────────────────────────────────────────────────────────
# title:         Main title printed above the grid.
# subtitle:      Extra text prepended to the auto-generated constant-parameter summary.
# auto_subtitle: When true, appends a summary of constant parameters (those not
#                varied on any axis) to the subtitle.
title = "6.08mm ply, Lauan"
subtitle = ""
auto_subtitle = true

# ── X axis (columns) ────────────────────────────────────────────────────────────
# param:            Which cut parameter to sweep across columns.
# values:           List of values for the sweep.
# label:            Axis label printed below the column values. Omit to auto-
#                   generate from param name and unit; set to "" to suppress.
# show_labels: Show per-column value labels above the grid and the axis label.
#
# Available params:
#   power_pct      — Min and max power set together (%)
#   speed_mm_s     — Cut speed (mm/s)
#   kerf_mm        — Kerf compensation offset (mm)
#   z_offset_mm    — Z offset at start of layer (mm)
#   z_per_pass_mm  — Z step per pass, typically ≤ 0 (mm)
#   num_passes     — Number of passes (integer)
[x]
param = "power_pct"
values = [12, 13.5, 15, 16.5, 18]
label = "Power [%]"
show_labels = true

# ── Y axis (rows) ───────────────────────────────────────────────────────────────
# Same keys and available params as [x].
[y]
param = "z_per_pass_mm"
values = [-0.5, -0.6, -0.7, -0.8]
label = "\u0394Z/pass [mm]"
show_labels = true

# ── Constant cut parameters ─────────────────────────────────────────────────────
# Base cut settings applied to every cell. The x/y axis parameters override
# their respective entries here per cell.
#
# power_pct:     Shorthand — sets both power_min_pct and power_max_pct (default: none)
# power_min_pct: Minimum power, % (default: 80)
# power_max_pct: Maximum power, % (default: 80)
# speed_mm_s:    Cut speed, mm/s (default: 100)
# kerf_mm:       Kerf compensation, mm (default: 0)
# z_offset_mm:   Initial Z offset, mm (default: 0)
# z_per_pass_mm: Z step per pass, mm, typically ≤ 0 (default: 0)
# num_passes:    Number of passes (default: 1)
[cut]
# power_pct = 80       # shorthand: sets both power_min_pct and power_max_pct
power_pct = 80         # overridden by x axis
speed_mm_s = 15
kerf_mm = 0.1
z_offset_mm = -0.1
z_per_pass_mm = 0.0    # overridden by y axis
num_passes = 3

# ── Grid geometry ───────────────────────────────────────────────────────────────
# cell_size_mm:    Square cell side length, mm (default: 15)
# gap_mm:          Gap between adjacent cells, mm (default: 8)
# subgrid_gap_mm:  Gap between sub-grids in 3D/4D sweeps, mm (default: 20)
[geometry]
cell_size_mm = 15
gap_mm = 8

# ── Text labels ────────────────────────────────────────────────────────────────
# cell_text: What to print inside each cell.
#   "nothing"          — no in-cell text
#   "values"           — parameter values without units (e.g. "25", "12")
#   "values_with_units" — parameter values with units (e.g. "25%", "12 mm/s")
# cell_text_gap_mm: Vertical gap between the two in-cell text lines, mm (default: 0.3)
# show_legend:      Draw a legend cell in the bottom-left corner showing short
#                   parameter labels for the two in-cell text lines (e.g. "mm/s"
#                   and "Power %"). Requires cell_text != "nothing". (default: false)
[labels]
cell_text = "values_with_units"
cell_text_gap_mm = 0.3
show_legend = true

# ── Border ──────────────────────────────────────────────────────────────────────
# enabled:    Draw a border rectangle around the entire grid (default: false)
# padding_mm: Padding outside the grid cells, mm (default: 3)
# power_pct:  Border layer power, % (default: 10)
# speed_mm_s: Border layer speed, mm/s (default: 200)
# num_passes: Border layer passes (default: 1)
[border]
enabled = true
padding_mm = 3
power_pct = 10
speed_mm_s = 200

# ── Text layer ─────────────────────────────────────────────────────────────────
# Cut settings for all text (title, labels, values, in-cell text) — layer 0.
# power_pct:  Text layer power, % (default: 15)
# speed_mm_s: Text layer speed, mm/s (default: 200)
[text_layer]
power_pct = 15
speed_mm_s = 200

# ── Font and text sizes ─────────────────────────────────────────────────────────
# name:          Font family for all text (default: "Arial")
# h_title_mm:    Title text height, mm (default: 10)
# h_subtitle_mm: Subtitle text height, mm (default: 7)
# h_label_mm:    Axis label text height, mm (default: 6)
# h_value_mm:    Axis value label height, mm (default: 5)
# h_cell_mm:     In-cell parameter text height, mm (default: 4)
[font]
name = "zzSTENCIL"
h_title_mm = 10
h_subtitle_mm = 7
h_label_mm = 6
h_value_mm = 5
h_cell_mm = 4
