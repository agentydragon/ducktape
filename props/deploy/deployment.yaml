apiVersion: apps/v1
kind: Deployment
metadata:
  name: props
  namespace: props
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: props
      app.kubernetes.io/name: props
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: props
        app.kubernetes.io/name: props
    spec:
      imagePullSecrets:
        - name: forgejo-images-creds
      serviceAccountName: props-executor
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # Props runtime images use the ducktape-ci Forgejo tenant. Agent images
      # live in a separate Forgejo namespace (git.allegedly.works/props/*),
      # reached through the standalone props-registry-proxy service.
      containers:
        - name: props
          image: git.allegedly.works/ducktape-ci/props-backend:devel-20260828085445-cda562b # {"$imagepolicy": "flux-system:props-backend"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PROPS_IMAGE_TAG
              value: devel-20260828085445-cda562b # {"$imagepolicy": "flux-system:props-backend:tag"}
            - name: PROPS_CONFIG_FILE
              value: /etc/props/config.toml
            - name: PGHOST
              value: props-db-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: eval_results
            - name: PGUSER
              value: props
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: props-db-app
                  key: password
            # Salt for deriving deterministic per-agent DB passwords (required; no default).
            - name: PROPS_AGENT_PASSWORD_SALT
              valueFrom:
                secretKeyRef:
                  name: props-agent-password-salt
                  key: salt
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: api-key
            # Auth for the in-cluster LiteLLM upstream (config.toml [upstreams.litellm]).
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: api-key
            - name: PROPS_EVALUATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: props-evaluator-credentials
                  key: password
            # Authentik SSO for browser users (props/backend/oidc.py). The
            # props-oidc-config secret is created by tf/gitops/sso-providers and
            # reflected from the authentik namespace into props.
            - name: PROPS_OIDC_ISSUER
              value: https://auth.allegedly.works/application/o/props/
            - name: PROPS_OIDC_PUBLIC_BASE_URL
              value: https://props.allegedly.works
            - name: PROPS_OIDC_ADMIN_EMAILS
              value: agentydragon@gmail.com
            - name: PROPS_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: props-oidc-config
                  key: client-id
            - name: PROPS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: props-oidc-config
                  key: client-secret
            - name: PROPS_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: props-oidc-config
                  key: session-secret
            - name: PROPS_REGISTRY_UPSTREAM_PROJECT
              value: props
            - name: PROPS_REGISTRY_HOST
              value: props-registry-proxy
            - name: PROPS_REGISTRY_PORT
              value: "8000"
            - name: PROPS_REGISTRY_PULL_HOST
              value: props-registry.allegedly.works
          volumeMounts:
            - name: config
              mountPath: /etc/props
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              # TODO(vpa-memory-audit): 1Gi -> 1.5Gi. VPA observed a 933Mi
              # request / 1004Mi upper bound — right at the old ceiling.
              memory: 1.5Gi
          # Startup work (alembic migrations + specimen sync + executor build)
          # runs in a background task on the event loop; meanwhile /health
          # responds immediately so kubelet doesn't kill the pod. /readyz
          # only flips to 200 once that background task completes.
          # startupProbe gives 10min for the slow path before liveness kicks in.
          startupProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: props-config
