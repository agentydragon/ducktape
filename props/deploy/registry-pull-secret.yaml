apiVersion: v1
kind: ServiceAccount
metadata:
  name: props-db-app-secret-reader
  namespace: props
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: props-db-app-secret-reader
  namespace: props
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["props-db-app"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: props-db-app-secret-reader
  namespace: props
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: props-db-app-secret-reader
subjects:
  - kind: ServiceAccount
    name: props-db-app-secret-reader
    namespace: props
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: props-db-app
  namespace: props
  annotations:
    description: Reads only the CNPG-generated props-db-app Secret for derived props app Secrets.
spec:
  provider:
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: props-db-app-secret-reader
          namespace: props
      remoteNamespace: props
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: props-registry-pull
  namespace: props
  annotations:
    description: >-
      Docker pull credentials for props-registry.allegedly.works, derived from
      the CNPG props-db-app role because the props registry proxy authenticates
      pulls against Postgres credentials.
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: props-db-app
  target:
    name: props-registry-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"props-registry.allegedly.works":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: props-db-app
        property: username
    - secretKey: password
      remoteRef:
        key: props-db-app
        property: password
