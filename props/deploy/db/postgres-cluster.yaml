apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: props-db
  namespace: props
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  # CNPG 1.27+ kills isolated primaries by default (liveness probe).
  # Disable to prevent false positives from transient network blips.
  probes:
    liveness:
      isolationCheck:
        enabled: false

  # OVH-HA profile (cnpg_conventions R2): two instances on separate OVH
  # kimsufi nodes, co-located with the OVH-resident props backend.
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    topologyKey: kubernetes.io/hostname
    # Soft anti-affinity off control-plane nodes (their etcd is on a rotational
    # HDD; co-located I/O starves etcd fsync — 2026-06-28 outage).
    # TODO(etcd-hdd-contention): proper fix tracked in cluster/docs/plan.md.
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  storage:
    storageClass: local-path-ovh
    size: 10Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: eval_results
      owner: props
      # CNPG auto-generates credentials in secret props-db-app
      postInitSQL:
        - ALTER ROLE props CREATEROLE BYPASSRLS
