# Props is intentionally parked. This control object lives with the package so
# removing Props from the root Flux bundle also removes its stale health status.
# It is intentionally not listed in deploy/kustomization.yaml: when Props is
# revived, the control object must not recursively manage its own declaration.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: props
  namespace: ducktape-flux
spec:
  suspend: true
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./props/deploy
  prune: true
  wait: true
  deletionPolicy: WaitForTermination
  sourceRef:
    kind: GitRepository
    name: ducktape
    namespace: ducktape-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: external-secrets-config
      namespace: ducktape-flux
    - name: forgejo-images
      namespace: ducktape-flux
    - name: cnpg
      namespace: ducktape-flux
    - name: gateway
      namespace: ducktape-flux
    - name: external-secrets-operator
      namespace: ducktape-flux
    - name: forgejo
      namespace: ducktape-flux
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: props-registry-pull
      namespace: props
    - apiVersion: apps/v1
      kind: Deployment
      name: props
      namespace: props
