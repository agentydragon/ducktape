# The props backend spawns bare critic/agent pods and does not reap the ones
# that fail (e.g. critic-dev-opt-* pods sitting in Error for days). Delete
# Succeeded/Failed pods after 3 days — recent failures stay inspectable, and
# agent traces live in the database regardless. Running pods never match.
# Delete RBAC: the kyverno-cleanup-controller-workloads ClusterRole in cluster/cdk8s/kyverno/policies.py.
apiVersion: policies.kyverno.io/v1
kind: NamespacedDeletingPolicy
metadata:
  name: reap-finished-pods
  namespace: props
spec:
  schedule: "10 * * * *"
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
  conditions:
    - name: finished
      expression: has(object.status.phase) && object.status.phase in ['Succeeded', 'Failed']
    - name: older-than-3-days
      expression: time.now() - timestamp(object.metadata.creationTimestamp) > duration('72h')
