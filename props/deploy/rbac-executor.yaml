apiVersion: v1
kind: ServiceAccount
metadata:
  name: props-executor
  namespace: props
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: props-executor
  namespace: props
rules:
  - apiGroups: [""]
    # list: the GraderSupervisor reconciles graders by listing pods by label
    # (reconcile-from-API), so it survives restarts and reaps duplicates/orphans.
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: props-executor
  namespace: props
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: props-executor
subjects:
  - kind: ServiceAccount
    name: props-executor
    namespace: props
