# Props infrastructure services
# Run: docker compose up -d
# Stop: docker compose down

networks:
  # Internal network for registry/backend/postgres communication
  # Agents cannot access this network directly
  props-internal:
    name: props-internal
    internal: true
  # Network for agent containers to reach backend and postgres
  props-agents:
    name: props-agents

services:
  postgres:
    image: postgres:16
    container_name: props-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: eval_results
    command: ["-c", "max_connections=200"]
    volumes:
      - props_eval_results_data:/var/lib/postgresql/data
    networks:
      - props-internal
      - props-agents
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  registry:
    image: registry:2
    container_name: props-registry
    # Note: Registry is not exposed on host - agents talk to it via the backend proxy
    # Only exposed for debugging; use a different port to avoid conflict
    ports:
      - "5000:5000"
    volumes:
      - props_registry_data:/var/lib/registry
    networks:
      - props-internal
      - default # For host port publishing (internal network blocks it)

  # Unified backend — see docs/backend_api.md for endpoint reference
  backend:
    image: props-backend:latest
    container_name: props-backend
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.toml:/etc/props/config.toml:ro
    environment:
      PROPS_CONFIG_FILE: /etc/props/config.toml
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_UPSTREAM_URL: https://api.openai.com
      PROPS_REGISTRY_UPSTREAM_URL: http://props-registry:5000
      PGHOST: props-postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: eval_results
    networks:
      - props-internal
      - props-agents
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LLM proxy data plane — agents reach the LLM through here (auth + budget +
  # cost + upstream routing), split out of the backend so the API can roll
  # without disrupting in-flight agents. config.toml's llm_proxy_url points
  # agents at this service. Mirrors cluster/k8s/props/app/llm-proxy-deployment.yaml.
  llm-proxy:
    image: props-llm-proxy:latest
    container_name: props-llm-proxy
    volumes:
      - ./config.toml:/etc/props/config.toml:ro
    environment:
      PROPS_CONFIG_FILE: /etc/props/config.toml
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: https://api.openai.com/v1
      PGHOST: props-postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: eval_results
    networks:
      # props-agents: agents resolve `props-llm-proxy` here and it reaches the
      # upstream LLM (this network has egress; props-internal does not).
      # props-internal: reach props-postgres for auth/budget/cost queries.
      - props-internal
      - props-agents
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  props_eval_results_data:
  props_registry_data:
