# Props infrastructure services
# Run: docker compose up -d
# Stop: docker compose down

networks:
  # Internal network for registry/proxy/postgres communication
  # Agents cannot access this network directly
  props-internal:
    name: props-internal
    internal: true
  # Network for agent containers to reach proxy and postgres
  props-agents:
    name: props-agents

services:
  postgres:
    image: postgres:16
    container_name: props-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: eval_results
    command: ["-c", "max_connections=200"]
    volumes:
      - props_eval_results_data:/var/lib/postgresql/data
    networks:
      - props-internal
      - props-agents
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  registry:
    image: registry:2
    container_name: props-registry
    # Note: Registry is not exposed on host - agents talk to it via the proxy
    # Only exposed for debugging; use a different port to avoid conflict with proxy
    ports:
      - "5000:5000"
    volumes:
      - props_registry_data:/var/lib/registry
    networks:
      - props-internal
      - default # For host port publishing (internal network blocks it)

  # Combined proxy for both LLM and Registry functionality
  # LLM endpoints: POST /v1/responses
  # Registry endpoints: /v2/* (OCI Distribution API)
  proxy:
    image: props-proxy:latest
    container_name: props-proxy
    ports:
      - "5050:5050"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_UPSTREAM_URL: https://api.openai.com
      PROPS_REGISTRY_UPSTREAM_URL: http://props-registry:5000
      PGHOST: props-postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: eval_results
    networks:
      - props-internal
      - props-agents
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  props_eval_results_data:
  props_registry_data:
