{{- if .Values.registry.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "props.fullname" . }}-registry
  labels:
    {{- include "props.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.registry.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "props.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: registry
{{- end }}
