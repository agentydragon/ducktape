apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "props.fullname" . }}
  labels:
    {{- include "props.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "props.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "props.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: props-backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PROPS_CONFIG_FILE
              value: /etc/props/config.toml
            - name: PROPS_LOG_OUTPUT
              value: stderr
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.registry.enabled }}
            - name: PROPS_REGISTRY_UPSTREAM_URL
              value: http://{{ include "props.fullname" . }}-registry:{{ .Values.registry.service.port }}
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: PGHOST
              value: {{ include "props.fullname" . }}-postgresql
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: PGUSER
              value: {{ .Values.postgresql.auth.username | quote }}
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "props.fullname" . }}-postgresql
                  key: postgres-password
            {{- end }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "props.fullname" . }}
                  key: openai-api-key
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/props
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: {{ include "props.fullname" . }}-config
