apiVersion: v1
kind: Secret
metadata:
  name: {{ include "props.fullname" . }}
  labels:
    {{- include "props.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.openaiApiKey }}
  openai-api-key: {{ .Values.openaiApiKey | b64enc | quote }}
  {{- else }}
  {{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (include "props.fullname" .)) }}
  {{- if and $existingSecret (hasKey $existingSecret.data "openai-api-key") }}
  openai-api-key: {{ index $existingSecret.data "openai-api-key" }}
  {{- end }}
  {{- end }}
