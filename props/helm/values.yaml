image:
  repository: ghcr.io/agentydragon/props-backend
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts: []
  tls: []

# Props config.toml content (mounted as ConfigMap)
config:
  backend_url: "http://props:8000"
  grader_model: ""
  agent_env:
    PGHOST: "props-postgresql"
    PGPORT: "5432"
    PGDATABASE: "eval_results"
  executor:
    type: "kubernetes"
    namespace: "props"
  # Upstream LLM providers (rendered as [upstreams.<name>] in config.toml)
  upstreams: {}
  # Model definitions (rendered as [[models]] in config.toml)
  models: []

# Extra environment variables for the backend container
extraEnv: {}

# OpenAI API key (stored in the chart-managed secret)
openaiApiKey: ""

# Reference pre-existing secrets instead of chart-managed ones.
# When set, the chart skips creating its own secret and reads env vars
# from the named secrets.
existingSecrets: {}
  # openaiApiKey:
  #   name: "props-openai-api-key"
  #   key: "api-key"
  # ollamaApiKey:
  #   name: "props-ollama-api-key"
  #   key: "api-key"

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 1000m

nodeSelector: {}

podAnnotations: {}

# OCI container registry for agent images
registry:
  enabled: true
  image:
    repository: registry
    tag: "2"
    pullPolicy: IfNotPresent
  service:
    port: 5000
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: ""

# PostgreSQL backup CronJob
backup:
  enabled: false
  schedule: "0 3 * * *"
  retention:
    days: 7
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""

# External Secrets configuration for evaluator credentials
externalSecret:
  enabled: false
  secretStore:
    name: vault-backend
    kind: ClusterSecretStore

# PostgreSQL subchart configuration
# The bitnami subchart auto-generates and manages its own password secret.
postgresql:
  enabled: true
  auth:
    database: eval_results
    username: postgres
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
