image:
  repository: ghcr.io/agentydragon/props-backend
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts: []
  tls: []

# Props config.toml content (mounted as ConfigMap)
config:
  backend_url: "http://props-backend:8000"
  grader_model: ""
  agent_env:
    PGHOST: "props-postgresql"
    PGPORT: "5432"
    PGDATABASE: "eval_results"
  executor:
    type: "kubernetes"
    namespace: "props"

# Extra environment variables for the backend container
extraEnv: {}

# OpenAI API key (stored in the chart-managed secret)
openaiApiKey: ""

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 1000m

podAnnotations: {}

# OCI container registry for agent images
registry:
  enabled: true
  image:
    repository: registry
    tag: "2"
    pullPolicy: IfNotPresent
  service:
    port: 5000
  persistence:
    enabled: true
    size: 50Gi

# PostgreSQL subchart configuration
# The bitnami subchart auto-generates and manages its own password secret.
postgresql:
  enabled: true
  auth:
    database: eval_results
    username: postgres
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
