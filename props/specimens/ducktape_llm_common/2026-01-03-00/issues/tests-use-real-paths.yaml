  - occurrence_id: occ-0
    files:
      tests/claude_linter_v2/test_integration.py:
        - [19, 19]
        - [50, 50]
        - [86, 86]
        - [122, 122]
        - [165, 165]
        - [201, 201]
        - [218, 218]
    note: "Multiple tests use hardcoded /tmp/ paths like '/tmp/test_bare_except.py' instead of tmp_path fixture"
    critic_scopes_expected_to_recall:
      - [tests/claude_linter_v2/test_integration.py]
    match_file_restriction:
      - tests/claude_linter_v2/test_integration.py
