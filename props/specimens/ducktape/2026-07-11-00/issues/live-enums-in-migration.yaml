rationale: |
  Migration 0001 derives its PostgreSQL enum labels from current application enums. Adding a member therefore changes what a fresh database gets from the historical revision while already-upgraded databases retain the old type, making later enum migrations diverge or fail. Historical migrations must freeze the values present at their revision and introduce later values in new revisions.
