rationale: |
  The approval drawer and full history page independently orchestrate the same approve/deny API calls, busy state, refresh, and operator feedback. The copies have already diverged: an empty drawer denial invents `"denied from console"` while history records no reason; only the drawer shows a running transition; success notifications inconsistently use raw `server.tool` identifiers or the custom title; and their error titles differ. The audit record and feedback for one decision must not depend on which UI surface the operator used. Route both surfaces through one decision controller and derive notification text from `approvalDisplayFields`.
