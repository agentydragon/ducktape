rationale: |
  The policy eval runner parses the final container log line as JSON on line 77,
  then catches `Exception` on lines 78-79 to wrap malformed output as
  `RuntimeError("invalid JSON from policy eval: ...")`.

  That handler is specifically for JSON decoding failures. Catching `Exception`
  can also hide unrelated programming errors raised while preparing the input to
  `json.loads`, making them look like malformed policy-eval output. Narrow the
  handler to `json.JSONDecodeError` so real non-JSON failures surface with their
  original exception type and stack context.
should_flag: true
