rationale: |
  `agent_core/logging_utils.py` and `util/logging.py` both implement
  `configure_logging` with nearly identical logic: dictConfig setup with
  console/file/null handlers, structlog processor chain with the same
  `MINICODEX_DEBUG` env var check, same `KeyValueRenderer`/`JSONRenderer`
  switch, same `make_filtering_bound_logger(logging.INFO)` wrapper. The
  `util/logging.py` version is strictly more capable (env-var defaults,
  `LogLevel` enum, Typer callback). `agent_core` should use it instead.

