rationale: |
  Module-level `GSETTINGS_PROFILES_LIST` (line 19) duplicates the
  `Gio.Settings` instance created by `GSettingsProfiles.__init__` (line 24).
  `gsettings_set_default_profile_uuid` (line 42) uses the module-level
  duplicate instead of being a `default_profile_uuid` setter on the class.
  Move the function onto `GSettingsProfiles` and remove the module-level
  duplicate.

