# Build and push all props agent images to the props registry.
#
# The props backend image is pushed via the push-images.yml workflow.
#
# Triggers:
#   - workflow_call (from ci.yml)
#   - workflow_dispatch: manual push of all images
name: Props Images

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      rbe_image:
        description: "Override RBE container image (optional)"
        required: false
        type: string
        default: ""
    secrets:
      SOPS_AGE_KEY:
        required: true

concurrency:
  group: props-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix-devtools
        with:
          package: citools

      - uses: ./.github/actions/setup-ci-secrets
        with:
          sops_age_key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Push agent images
        uses: ./.github/actions/bb-remote
        with:
          args: run //props/agents:push_images
          rbe_image: ${{ inputs.rbe_image }}
          env_overrides: |
            PROPS_REGISTRY_URL=${{ vars.PROPS_REGISTRY_URL }}
            PROPS_REGISTRY_USERNAME=${{ env.PROPS_REGISTRY_USERNAME }}
            PROPS_REGISTRY_PASSWORD=${{ env.PROPS_REGISTRY_PASSWORD }}
