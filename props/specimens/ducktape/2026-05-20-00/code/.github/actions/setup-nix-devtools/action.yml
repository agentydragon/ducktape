name: Setup Nix + Devtools
description: Install Nix and a flake package output (default .#devtools)

inputs:
  package:
    description: "Nix flake package to install (e.g. devtools, citools)"
    required: false
    default: devtools

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: experimental-features = nix-command flakes

    - name: Install ${{ inputs.package }}
      shell: bash
      run: nix profile install .#${{ inputs.package }}
