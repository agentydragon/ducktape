  - id: review_ducktape_wt_conftest
    type: code_review
    prompt: "Review these files: wt/tests/conftest.py, wt/tests/config_factory.py"
    setup_overrides:
      # docker:
      #   image: python:3.11
      git_clone:
        repo: https://github.com/agentydragon/ducktape.git
        commit: 0791e282ab4b1c829615c12c2a76e6975511975f
      sandbox:
        enabled: true
        read_only_paths: [] # Git clone directory will be automatically added
        read_write_paths: [] # No write access needed for code review
        allow_network: false # No network needed for code review
        bind_system: true # Need Python, git, and other tools
    grading_overrides:
      strategy: comparison
      reference: |
        ## wt/tests/conftest.py:
        - all imports inside functions MUST go do the top

        - _project_root_on_pythonpath incorrectly manipulates os.environ without using
          monkeypatch, use monkeypatch instead

        - "Factory Fixtures..." comment is marketing language and goes against philosophy
          of "document current state, not the past"

        - mock_factory must be deleted, useless passthrough function - likewise repo_factory

        - `# Service builder and env var fixtures removed - configure directly in tests with factories`
          - again, historical comment, must be removed, this is just clutter

        - `cli_test_env` returning WT_DIR is useful but not intuitive - should rename
          fixture to better describe that if keeping the behavior

        - temp_dir: another useless fixture, just passthru to default tmp_path. delete.

        - isolated_git_env: again, use monkeypatch

        - sample_commit_info: imports to the top

        - cli_runner: useless fixture, delete, does not save any effort ever

        - ValueError in kill_daemon... should not be sawllowed - should be raised and
          complained about. pid file unlink should be inside if exists check for pid file
          and not wrapped in suppress.

        - shutuil -> import to the top

        - `Uses modern repo_factory internally but maintains compatibility with existing
          integration tests that need real git repositories.` - marketing language, rm
          "modern", misleading comment, delete.

        - `config_file = ConfigFile(**{**defaults, **config_overrides})` violation -
          use defaults | config_overrides modern syntax

        - `"""Centralized helper to build test configurations with the standard pattern.
          This eliminates duplication of the ConfigFile → YAML → Configuration.resolve
          workflow."""` this documents how a refactor was made in the past, hopefully,
          but if it''s already finished then this comment is useless and should be deleted.

        - yield env followed by kill_daemon_at_wt_dir(config.wt_dir) fails to clean
          up if exception, must be in finally

        ## config_factory.py
        - Methods like with_worktrees_dir, with_branch_prefix, with_upstream_branch etc
          are overly verbose builder pattern - could be simplified

        - All docstrings like "Set custom worktrees directory." are extremely canonical
          examples of "useless docstring". delete the docstrings. and only keep those
          methods that are *actually used*.

        - def build(self, wt_dir: Path | None = None) -> Configuration:
              """Build the final configuration."""
          - this too, we have all seen the factory pattern, useless docstring
