name: props

services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: props-postgres
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: eval_results
    command: postgres -p 5433 -c max_connections=200
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5433", "-U", "postgres"]
      interval: 1s
      timeout: 5s
      retries: 30

  registry:
    image: docker.io/library/registry:2
    container_name: props-registry
    network_mode: host
    environment:
      REGISTRY_HTTP_ADDR: ":5050"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5050/v2/"]
      interval: 1s
      timeout: 5s
      retries: 30
