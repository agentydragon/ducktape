# This kustomization depends on 'a', creating a cycle: a -> b -> a
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cycle-b
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/cycle/b
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cycle-a
