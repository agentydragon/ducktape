# This kustomization uses ExternalSecret but is missing the
# required dependsOn: external-secrets-config
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: missing-dependency
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/missing-dependency
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Missing: dependsOn: - name: external-secrets-config
