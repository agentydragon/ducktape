apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: proxmox-proxy
  namespace: flux-system
spec:
  # Suspended — wyrm2 offline, no Proxmox nodes available. Re-enable once atlas is back up.
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/proxmox-proxy
  prune: true
  wait: true
  dependsOn:
    - name: gateway
