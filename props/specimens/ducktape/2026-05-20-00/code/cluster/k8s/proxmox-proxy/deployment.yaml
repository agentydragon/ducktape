apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxmox-proxy
  namespace: proxmox-proxy
  labels:
    app.kubernetes.io/name: proxmox-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proxmox-proxy
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app.kubernetes.io/name: proxmox-proxy
    spec:
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      containers:
        - name: nginx
          image: docker.io/library/nginx:alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: proxmox-proxy-config
