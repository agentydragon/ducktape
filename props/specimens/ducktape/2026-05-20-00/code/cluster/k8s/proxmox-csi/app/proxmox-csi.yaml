---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: proxmox-csi
  namespace: csi-proxmox
spec:
  interval: 24h
  url: oci://ghcr.io/sergelogvinov/charts/proxmox-csi-plugin
  ref:
    tag: "0.5.5"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proxmox-csi-plugin
  namespace: csi-proxmox
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: proxmox-csi
    namespace: csi-proxmox
  values:
    config:
      existingSecret: "proxmox-csi-plugin"

    storageClass:
      - name: "proxmox-csi-retain"
        storage: "local"
        # Retain policy: volumes preserved on PVC deletion (safety)
        # Cleanup handled by terraform destroy provisioner
        reclaimPolicy: "Retain"
        allowVolumeExpansion: true
        parameters:
          cache: "directsync"
          ssd: "true"
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"

    # Controller Deployment must run on Proxmox nodes to reach Proxmox API at 10.2.0.2:8006.
    # Note: top-level nodeSelector (not controller.nodeSelector) — chart uses top-level for the controller pod.
    nodeSelector:
      topology.kubernetes.io/region: proxmox

    controller:
      replicaCount: 1
      plugin:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi

    node:
      enableTopology: true
      # Only run on Proxmox nodes (VPS nodes use local-path/hcloud-volumes)
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
