apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/gateway
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager
    - name: kyverno
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cert-manager-issuer-config
  healthChecks:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: cluster-gateway
      namespace: gateway-system
