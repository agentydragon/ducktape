---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nfd
  namespace: node-feature-discovery
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/node-feature-discovery/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: node-feature-discovery
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: node-feature-discovery
      version: "0.18.3"
      sourceRef:
        kind: HelmRepository
        name: nfd
        namespace: node-feature-discovery
  values:
    worker:
      tolerations:
        - effect: NoSchedule
          operator: Exists
      config:
        sources:
          pci:
            deviceClassWhitelist:
              - "02"
              - "03"
            deviceLabelFields:
              - vendor
