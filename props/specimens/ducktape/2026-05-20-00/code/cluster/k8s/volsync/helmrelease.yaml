---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: backube
  namespace: flux-system
spec:
  interval: 24h
  url: https://backube.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync-system
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: volsync
      version: "0.15.0"
      sourceRef:
        kind: HelmRepository
        name: backube
        namespace: flux-system
      interval: 12h
  values:
    manageCRDs: true
    nodeSelector:
      topology.kubernetes.io/zone: hil-ovh
