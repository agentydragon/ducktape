apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitea
  namespace: flux-system
spec:
  suspend: true
  # Wyrm2 offline during relocation — suspended until hardware is back up.
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/gitea/app
  prune: true
  wait: true
  # Health check ensures Gitea is fully operational with SSO
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gitea
      namespace: gitea
  dependsOn:
    - name: gitea-namespace
    - name: gitea-db
    - name: gateway
    - name: cert-manager
    - name: gitea-secrets
    - name: reflector # Mirrors gitea-oauth-client-secret from authentik namespace
    - name: sso-providers-tf # Writes gitea-oauth-client-secret to authentik namespace
    - name: authentik # Authentik must be running for OIDC
    # Gitea validates OIDC at init time (configure-gitea init container fetches discovery URL).
    # Other SSO apps (Harbor, Matrix, Grafana) validate lazily at first login, so they don't need this.
