apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitea-secrets
  namespace: flux-system
spec:
  suspend: true
  # Wyrm2 offline during relocation — suspended until hardware is back up.
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/gitea/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  dependsOn:
    - name: gitea-namespace
