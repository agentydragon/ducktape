apiVersion: batch/v1
kind: CronJob
metadata:
  name: cpap-sync
  namespace: cpap-sync
  annotations:
    description: >-
      Connects to the ez Share WiFi SD card in the ResMed CPAP and syncs all EDF data files to the cpap-data PVC.
spec:
  schedule: "0 10 * * *"
  # Temporarily disabled — wyrm2 will be offline during relocation.
  suspend: true
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          hostNetwork: true
          nodeSelector:
            kubernetes.io/hostname: wyrm2
          securityContext:
            runAsUser: 0
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: cpap-data
            - name: dbus
              hostPath:
                path: /run/dbus
            - name: network-manager
              hostPath:
                path: /var/run/NetworkManager
          containers:
            - name: sync
              image: ghcr.io/agentydragon/cpap-sync:devel-20260505014412-1e78e52 # {"$imagepolicy": "flux-system:cpap-sync"}
              securityContext:
                capabilities:
                  add: ["NET_ADMIN"]
              volumeMounts:
                - name: data
                  mountPath: /data/cpap
                - name: dbus
                  mountPath: /run/dbus
                - name: network-manager
                  mountPath: /var/run/NetworkManager
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
