apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cpap-webdav
  namespace: cpap-sync
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - cpap.allegedly.works
  rules:
    - backendRefs:
        - name: cpap-webdav
          port: 8080
