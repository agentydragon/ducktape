apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: langfuse
  namespace: flux-system
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/langfuse/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 20m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: langfuse
      namespace: langfuse
  dependsOn:
    - name: langfuse-namespace
    - name: langfuse-secrets
    - name: langfuse-db
    - name: gateway
    - name: proxmox-csi
