---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 24h
  url: https://langfuse.github.io/langfuse-k8s
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 15m
  timeout: 20m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: langfuse
      version: ">=1.0.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: langfuse
        namespace: langfuse
  values:
    langfuse:
      nextauth:
        url: "https://langfuse.allegedly.works"
        secret:
          secretKeyRef:
            name: langfuse-secrets
            key: nextauth-secret
      salt:
        secretKeyRef:
          name: langfuse-secrets
          key: salt
      encryptionKey:
        secretKeyRef:
          name: langfuse-secrets
          key: encryption-key

      web:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi

      worker:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi

      # Headless initialization — bootstrap org/project/user on first startup.
      # API keys are generated by the langfuse-secrets Terraform module so
      # LiteLLM can use the same keys without any manual step.
      additionalEnv:
        - name: LANGFUSE_INIT_ORG_ID
          value: "langfuse-default-org"
        - name: LANGFUSE_INIT_ORG_NAME
          value: "Default"
        - name: LANGFUSE_INIT_PROJECT_ID
          value: "langfuse-litellm-project"
        - name: LANGFUSE_INIT_PROJECT_NAME
          value: "litellm"
        - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
        - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_PROJECT_SECRET_KEY
        - name: LANGFUSE_INIT_USER_EMAIL
          value: "admin@allegedly.works"
        - name: LANGFUSE_INIT_USER_NAME
          value: "admin"
        - name: LANGFUSE_INIT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: LANGFUSE_INIT_USER_PASSWORD

    postgresql:
      deploy: false
      host: langfuse-db-rw
      auth:
        username: langfuse
        database: langfuse
        existingSecret: langfuse-db-app
        secretKeys:
          userPasswordKey: password

    # TODO(reliability): ClickHouse replication (3-node cluster) for
    # durability. Currently single-node on Proxmox.
    clickhouse:
      deploy: true
      auth:
        existingSecret: langfuse-secrets
        existingSecretKey: clickhouse-password
      replicaCount: 1
      resourcesPreset: medium
      # Disable ClickHouse's built-in self-profiling system logs. These grew
      # to 3.8 GiB in ~2 weeks, causing OOMKills at the 1.5 GiB limit.
      # Uses `remove="1"` to fully strip log table definitions from merged
      # config. See: https://kb.altinity.com/altinity-kb-setup-and-maintenance/altinity-kb-system-tables-eat-my-disk/
      extraOverrides: |
        <clickhouse>
          <logger>
            <level>information</level>
          </logger>
          <trace_log remove="1" />
          <text_log remove="1" />
          <metric_log remove="1" />
          <asynchronous_metric_log remove="1" />
          <query_log>
            <max_size_rows>8192</max_size_rows>
            <reserved_size_rows>8192</reserved_size_rows>
          </query_log>
        </clickhouse>
      clusterEnabled: false
      zookeeper:
        replicaCount: 1
        resourcesPreset: small
        persistence:
          storageClass: lvm-proxmox-hdd
          size: 8Gi
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      persistence:
        storageClass: lvm-proxmox-hdd
        size: 20Gi

    redis:
      deploy: true
      auth:
        # Reference the langfuse-secrets K8s secret for both the Bitnami sub-chart
        # and Langfuse app connection string. CLEANUP(2026-05-17): langfuse is
        # suspended; secret needs to be re-created via SOPS when unsuspended
        # (see cluster/vault-migration/TODO.md "Suspended services").
        existingSecret: langfuse-secrets
        existingSecretPasswordKey: redis-password
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      primary:
        persistence:
          storageClass: lvm-proxmox-hdd

    # TODO(reliability): Replace bundled MinIO with the cluster's SeaweedFS S3
    # gateway (seaweedfs-s3.seaweedfs.svc:8333) for durability. The chart's
    # `minio:` key configures Langfuse's object storage backend regardless of
    # which S3 implementation it points at — keep the key name when migrating.
    minio:
      deploy: true
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      persistence:
        storageClass: lvm-proxmox-hdd
        size: 20Gi

    # Ingress disabled — using Gateway API HTTPRoute
    ingress:
      enabled: false
