apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/litellm/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  dependsOn:
    - name: litellm-namespace
    - name: external-secrets-config
