apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix
  namespace: flux-system
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/matrix/app
  prune: true
  wait: true
  # Health check ensures Matrix Synapse is ready with SSO
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: matrix-synapse
      namespace: matrix
  dependsOn:
    - name: matrix-namespace
    - name: matrix-db
    - name: gateway
    - name: cert-manager
    - name: authentik
    - name: matrix-secrets
    - name: sso-providers-tf # writes matrix-oidc-config to authentik ns
    - name: reflector # mirrors matrix-oidc-config to matrix ns
    - name: local-path-provisioner
# Note: Matrix Synapse needs OIDC discovery endpoint at startup (from provider),
# but oauth-client-secret (from matrix-secret) is only needed for OAuth login flows later
