apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openhands-settings-json
  namespace: openhands
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-openhands-secret-store
    kind: ClusterSecretStore
  target:
    name: openhands-settings-json
    creationPolicy: Owner
    template:
      data:
        settings.json: |
          {
            "user_consents_to_analytics": false,
            "agent_settings": {
              "llm": {
                "model": "glm-5.1",
                "api_key": "{{ .zaiApiKey }}",
                "base_url": "https://api.z.ai/api/anthropic"
              }
            },
            "llm_profiles": {
              "profiles": {
                "glm-5.1": {
                  "model": "glm-5.1",
                  "api_key": "{{ .zaiApiKey }}",
                  "base_url": "https://api.z.ai/api/anthropic"
                },
                "gpt-5.5-pro": {
                  "model": "gpt-5.5-pro",
                  "api_key": "{{ .openaiApiKey }}"
                },
                "gpt-5.5": {
                  "model": "gpt-5.5",
                  "api_key": "{{ .openaiApiKey }}"
                }
              },
              "active": "glm-5.1"
            }
          }
  data:
    - secretKey: zaiApiKey
      remoteRef:
        key: openhands-secrets
        property: ZAI_API_KEY
    - secretKey: openaiApiKey
      remoteRef:
        key: openhands-secrets
        property: OPENAI_API_KEY
