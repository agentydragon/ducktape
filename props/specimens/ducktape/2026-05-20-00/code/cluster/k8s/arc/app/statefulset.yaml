apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: github-runner
  namespace: arc-runners
  labels:
    app.kubernetes.io/name: github-runner
spec:
  serviceName: github-runner
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-runner
    spec:
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: fix-perms
          image: ghcr.io/actions/actions-runner:latest
          command: ["chown", "-R", "1001:1001", "/home/runner/.cache"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: cache
              mountPath: /home/runner/.cache
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:latest
          command: ["/bin/bash", "/scripts/startup.sh"]
          resources:
            requests:
              memory: 8Gi
              cpu: "2"
            limits:
              memory: 8Gi
              cpu: "8"
          env:
            - name: RUNNER_ALLOW_RUNASROOT
              value: "1"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: github-app
              mountPath: /etc/github-app
              readOnly: true
            - name: work
              mountPath: /home/runner/_work
            - name: cache
              mountPath: /home/runner/.cache
      volumes:
        - name: scripts
          configMap:
            name: runner-startup
            defaultMode: 0755
        - name: github-app
          secret:
            secretName: github-app
        - name: work
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        # CLEANUP(2026-04-02): Migrate to local-path-proxmox
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
