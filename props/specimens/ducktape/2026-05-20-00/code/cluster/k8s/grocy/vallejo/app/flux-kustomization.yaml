apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grocy-vallejo
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/grocy/vallejo/app
  prune: true
  wait: true
  dependsOn:
    - name: gateway
    - name: cert-manager-issuer-config
    - name: cert-manager-environment
    - name: authentik
    - name: volsync
