apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocy-vallejo
resources:
  - ../../app-base
  - namespace.yaml
  - pvc.yaml
  - volsync-verify-job.yaml
  - volsync-migration.yaml
patches:
  - target:
      kind: Deployment
      name: grocy
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grocy
      spec:
        replicas: 1
        template:
          spec:
            nodeSelector:
              topology.kubernetes.io/zone: hil-ovh
