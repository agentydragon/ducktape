apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocy-mcp-server
  labels:
    app.kubernetes.io/name: grocy-mcp
    app.kubernetes.io/component: server
  annotations:
    description: "FastMCP server generating Grocy tools from Grocy's OpenAPI spec. Per-request token exchange swaps the caller's Authentik JWT for a Grocy-proxy-scoped JWT before calling Grocy."
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grocy-mcp
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grocy-mcp
        app.kubernetes.io/component: server
    spec:
      enableServiceLinks: false
      containers:
        - name: server
          image: ghcr.io/agentydragon/grocy-mcp:devel-20260515225007-280fb91 # {"$imagepolicy": "flux-system:grocy-mcp-oidc-server"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
            # Overlay patches replace these values per household.
            - name: GROCY_MCP_AUTH__OIDC_ISSUER
              value: "MUST_BE_PATCHED"
            - name: GROCY_MCP_AUTH__PUBLIC_BASE_URL
              value: "MUST_BE_PATCHED"
            - name: GROCY_MCP_GROCY_URL
              value: "MUST_BE_PATCHED"
            - name: GROCY_MCP_AUTH__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grocy-mcp-oidc
                  key: client_id
            - name: GROCY_MCP_AUTH__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grocy-mcp-oidc
                  key: client_secret
            - name: GROCY_MCP_AUTH__PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grocy-mcp-oidc
                  key: grocy_proxy_client_id
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 20
