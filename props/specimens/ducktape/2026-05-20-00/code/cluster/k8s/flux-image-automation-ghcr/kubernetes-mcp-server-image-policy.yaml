# CLEANUP: see kubernetes-mcp-server-image-repository.yaml.
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: kubernetes-mcp-server
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: kubernetes-mcp-server
  filterTags:
    pattern: '^devel-\d{14}-[0-9a-f]{7}$'
  policy:
    alphabetical:
      order: asc
