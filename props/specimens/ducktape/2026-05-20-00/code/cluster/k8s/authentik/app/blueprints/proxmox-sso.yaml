version: 1
metadata:
  name: SSO - Proxmox
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: proxmox-provider
    state: present
    identifiers:
      name: proxmox
    attrs:
      external_host: "https://atlas.allegedly.works"
      internal_host: "http://proxmox-proxy.proxmox-proxy.svc.cluster.local:8080"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=24"

  - model: authentik_core.application
    id: proxmox-app
    state: present
    identifiers:
      slug: proxmox
    attrs:
      name: Proxmox
      provider: !KeyOf proxmox-provider
      meta_description: "Proxmox Virtual Environment"
      meta_launch_url: "https://atlas.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf proxmox-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
