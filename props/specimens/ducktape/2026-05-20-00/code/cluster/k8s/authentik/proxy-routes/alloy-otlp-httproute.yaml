# HTTPRoute for Alloy OTLP via shared Authentik proxy outpost.
# Traffic flows: external client → Gateway → outpost (Bearer token auth) → Alloy :4318.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alloy-otlp
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "alloy-otlp.allegedly.works"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
