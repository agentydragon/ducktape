apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-proxy-routes
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/authentik/proxy-routes
  prune: true
  dependsOn:
    - name: gateway
    - name: authentik
