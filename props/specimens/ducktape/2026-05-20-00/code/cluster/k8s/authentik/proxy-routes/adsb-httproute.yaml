# HTTPRoute for ADS-B tracker via shared Authentik proxy outpost.
# Traffic flows: Gateway -> outpost (auth) -> ultrafeeder backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adsb
  namespace: authentik
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "adsb.allegedly.works"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
