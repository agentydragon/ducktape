version: 1
metadata:
  name: SSO - Longhorn
  labels:
    blueprints.goauthentik.io/description: "Longhorn UI proxy provider and application"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: longhorn-provider
    state: present
    identifiers:
      name: longhorn
    attrs:
      external_host: "https://longhorn.allegedly.works"
      internal_host: "http://longhorn-frontend.longhorn-system.svc.cluster.local:80"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=1"

  - model: authentik_core.application
    id: longhorn-app
    state: present
    identifiers:
      slug: longhorn
    attrs:
      name: Longhorn
      provider: !KeyOf longhorn-provider
      meta_description: "Longhorn distributed storage management"
      meta_launch_url: "https://longhorn.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf longhorn-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
