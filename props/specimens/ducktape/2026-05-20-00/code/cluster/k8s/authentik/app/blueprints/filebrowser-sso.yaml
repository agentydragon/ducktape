version: 1
metadata:
  name: SSO - Scanner File Browser
  labels:
    blueprints.goauthentik.io/description: "Scanner file browser proxy provider, application, and outpost"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: scanner-filebrowser-provider
    state: present
    identifiers:
      name: scanner-filebrowser
    attrs:
      external_host: "https://scanbox.allegedly.works"
      internal_host: "http://scanner-filebrowser.scanner.svc.cluster.local:8080"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=1"

  - model: authentik_core.application
    id: scanner-filebrowser-app
    state: present
    identifiers:
      slug: scanner-filebrowser
    attrs:
      name: Scanner File Browser
      provider: !KeyOf scanner-filebrowser-provider
      meta_description: "Scanner File Browser"
      meta_icon: "https://cdn.simpleicons.org/files"
      meta_launch_url: "https://scanbox.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf scanner-filebrowser-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
