version: 1
metadata:
  name: SSO - OpenClaw
  labels:
    blueprints.goauthentik.io/description: "OpenClaw proxy provider, application, and outpost"

entries:
  - model: authentik_providers_proxy.proxyprovider
    id: openclaw-provider
    state: present
    identifiers:
      name: openclaw
    attrs:
      external_host: "https://openclaw.allegedly.works"
      internal_host: "http://openclaw.openclaw-gateway.svc.cluster.local:18789"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=1"

  - model: authentik_core.application
    id: openclaw-app
    state: present
    identifiers:
      slug: openclaw
    attrs:
      name: OpenClaw
      provider: !KeyOf openclaw-provider
      meta_description: "OpenClaw AI Agent"
      meta_icon: "https://raw.githubusercontent.com/openclaw/openclaw/main/docs/assets/pixel-lobster.svg"
      meta_launch_url: "https://openclaw.allegedly.works"
      open_in_new_tab: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf openclaw-app
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
