apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  namespace: authentik
spec:
  instances: 2

  # CNPG 1.27+ kills isolated primaries by default (liveness probe).
  # Disable to prevent false positives from transient network blips.
  probes:
    liveness:
      isolationCheck:
        enabled: false

  affinity:
    nodeSelector:
      topology.kubernetes.io/region: hil
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    # One PostgreSQL instance per VPS node for real HA
    topologyKey: kubernetes.io/hostname

  storage:
    # CLEANUP(2026-04-02): Migrate to local-path-hetzner
    storageClass: local-path
    size: 8Gi

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      # CNPG auto-generates credentials in secret authentik-db-app
