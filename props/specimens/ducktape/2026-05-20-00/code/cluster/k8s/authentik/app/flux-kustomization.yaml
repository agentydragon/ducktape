apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m0s
  path: ./cluster/k8s/authentik/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: true
  # Health checks ensure Authentik is fully operational before dependents start
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: authentik
      namespace: authentik
    - apiVersion: apps/v1
      kind: Deployment
      name: authentik-server
      namespace: authentik
    - apiVersion: apps/v1
      kind: Deployment
      name: authentik-worker
      namespace: authentik
  dependsOn:
    - name: authentik-namespace
    - name: authentik-db # Wait for CNPG cluster ready and authentik-db-app secret to exist
    - name: authentik-secrets # Admin password, secret key, bootstrap token (SOPS)
    - name: authentik-sso-secrets # SSO client secrets for blueprint !Env tags
    - name: cert-manager # Wait for cert-manager for TLS certificates
    - name: gateway # Wait for Gateway API for external access
