version: 1
metadata:
  name: SSO - Tandoor
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: tandoor-provider
    state: present
    identifiers:
      name: tandoor
    attrs:
      external_host: "https://tandoor.allegedly.works"
      internal_host: "http://tandoor.tandoor.svc.cluster.local:80"
      mode: proxy
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: "hours=24"
  - model: authentik_core.application
    id: tandoor-app
    state: present
    identifiers:
      slug: tandoor
    attrs:
      name: Tandoor Recipes
      provider: !KeyOf tandoor-provider
      meta_description: "Recipe & pantry inventory management"
      meta_launch_url: "https://tandoor.allegedly.works"
