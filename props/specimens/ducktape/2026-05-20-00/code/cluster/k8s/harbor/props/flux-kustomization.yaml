---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-props
  namespace: flux-system
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/harbor/props
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: harbor-props
      namespace: flux-system
  dependsOn:
    - name: harbor
    - name: tofu-controller
    - name: tofu-state-db
    - name: props-namespace
