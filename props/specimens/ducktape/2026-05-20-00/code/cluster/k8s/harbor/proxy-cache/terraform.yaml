---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: harbor-proxy-cache
  namespace: flux-system
spec:
  interval: 15m
  refreshBeforeApply: true
  path: ./tf/gitops/harbor-proxy-cache
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  # Use in-cluster service account
  serviceAccountName: tf-runner
  approvePlan: "auto"

  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "harbor_proxy_cache"
      }
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tofu-state-db-credentials
              key: password

  # Variables for Terraform
  vars:
    - name: harbor_url
      value: "http://harbor-core.harbor:80"

  # No Terraform dependencies - Harbor is deployed via Helm
  # Flux Kustomization dependency ensures Harbor is ready before this runs
