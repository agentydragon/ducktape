apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-servicemonitor
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/harbor/servicemonitor
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: harbor
    - name: monitoring-stack
