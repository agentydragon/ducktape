apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  retryInterval: 1m
  dependsOn:
    - name: kyverno # Policies require Kyverno CRDs to be installed
  interval: 5m
  path: ./cluster/k8s/kyverno/policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 2m
