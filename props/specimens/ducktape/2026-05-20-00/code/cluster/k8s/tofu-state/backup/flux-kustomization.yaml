apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tofu-state-backup
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/tofu-state/backup
  prune: true
  wait: true
  dependsOn:
    - name: tofu-state-db
    - name: local-path-provisioner
