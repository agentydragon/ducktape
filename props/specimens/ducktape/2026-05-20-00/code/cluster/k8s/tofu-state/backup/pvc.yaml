apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tofu-state-backup
  namespace: tofu-state
  annotations:
    description: >-
      Proxmox storage for cold-boot recovery. The CNPG cluster runs on VPS
      (local-path); backups on Proxmox ensure a different failure domain.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-proxmox
  resources:
    requests:
      storage: 1Gi
