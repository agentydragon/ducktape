apiVersion: v1
kind: ResourceQuota
metadata:
  name: claude-sandbox-quota
  namespace: claude-sandbox
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "50"
    services: "30"
    configmaps: "30"
    persistentvolumeclaims: "30"
    requests.storage: 50Gi
