apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: kagent
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "kagent.allegedly.works"
  rules:
    - backendRefs:
        - name: kagent-oauth2-proxy
          port: 4180
