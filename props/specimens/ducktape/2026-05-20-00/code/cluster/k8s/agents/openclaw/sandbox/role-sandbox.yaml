apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-sandbox-admin
  namespace: openclaw-sandbox
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/attach
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - events
    verbs: ["*"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["*"]

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["*"]
