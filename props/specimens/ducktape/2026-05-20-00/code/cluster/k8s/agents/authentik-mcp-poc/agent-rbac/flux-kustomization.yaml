apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-mcp-poc-agent-rbac
  namespace: flux-system
  annotations:
    description: Agent RBAC for authentik-mcp-poc namespace. Lightweight — only RoleBindings. Depends on namespace existing + claude-rbac for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/agents/authentik-mcp-poc/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: authentik-mcp-poc-namespace
    - name: claude-rbac
