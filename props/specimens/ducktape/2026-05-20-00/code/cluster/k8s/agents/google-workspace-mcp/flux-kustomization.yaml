apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: google-workspace-mcp
  namespace: flux-system
spec:
  suspend: true
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/agents/google-workspace-mcp
  prune: true
  wait: true
  dependsOn:
    - name: airlock # google-client-credentials (Reflector mirrors it here)
    - name: local-path-provisioner
    - name: reflector
