apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: kagent
spec:
  interval: 10m
  # The chart pulls ~12 subcharts (kmcp, querydoc, plus 9 stock cluster-ops
  # agents). The default 5m timeout is too tight; upgrades that touch the
  # `default-model-config` ModelConfig race against all those Deployments
  # rolling. 15m is comfortable.
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    # Helm-controller's default upgrade.remediation.retries is 0 — any single
    # transient failure becomes terminal and self-heal stops. Match the
    # install side so a flaky reconcile doesn't permanently wedge the HR.
    remediation:
      retries: 3
  dependsOn:
    - name: kagent-crds
      namespace: kagent
  chart:
    spec:
      chart: kagent
      version: 0.9.2
      sourceRef:
        kind: HelmRepository
        name: kagent
        namespace: kagent
      interval: 5m
  # Postgres URL pulled from the CNPG-generated kagent-db-app Secret's `uri` key.
  # Flux substitutes it into values.database.postgres.url at apply time, so the
  # connection string never lands in git.
  valuesFrom:
    - kind: Secret
      name: kagent-db-app
      valuesKey: uri
      targetPath: database.postgres.url
  values:
    # The chart auto-creates a `default-model-config` ModelConfig CR that every
    # built-in agent (k8s-agent, cilium-*, istio-agent, helm-agent, etc.) hard-
    # references by name, and the controller uses it as the default for new
    # agents created from the UI. We point it at z.ai's OpenAI-compatible
    # **Coding Plan** endpoint at https://api.z.ai/api/coding/paas/v4 (per
    # docs/z_ai_api.md): the general /api/paas/v4 endpoint does not count
    # against the coding-plan quota and returns 429 "Insufficient balance"
    # for accounts on the coding subscription. `providers.openAI` does not
    # pass `baseUrl` through to the rendered ModelConfig, so it's added via
    # the postRenderer below.
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        model: glm-5.1
        apiKeySecretRef: kagent-zai
        apiKeySecretKey: ZAI_API_KEY

    # Controller configuration
    controller:
      replicas: 1
      loglevel: "info"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 512Mi
      auth:
        # JWT from the bundled oauth2-proxy is trusted; controller maps the
        # `email` claim to the user identity surfaced in the UI.
        mode: trusted-proxy
        userIdClaim: email
      # CNPG kagent-db is region-pinned to proxmox; app must match (R5 in
      # cluster/docs/cnpg_conventions.md).
      nodeSelector:
        topology.kubernetes.io/region: proxmox

    # UI configuration
    ui:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      service:
        type: ClusterIP
        ports:
          port: 8080
          targetPort: 8080
      nodeSelector:
        topology.kubernetes.io/region: proxmox

    # External Postgres (CNPG cluster kagent-db). The connection string itself
    # comes from valuesFrom above; only the type switch lives in git.
    database:
      type: postgres
      postgres:
        vectorEnabled: false
      # The chart's bundled postgres Deployment is unconfigured (no PVC, hardcoded
      # creds) and only meant for dev. Disable it so we don't carry an orphan
      # `kagent-postgresql-*` Pending pod.
      bundled:
        enabled: false

    # KMCP server for MCP protocol
    kmcp:
      enabled: true

    # Authentik-fronted OIDC. Cookie + client secret come from the
    # kagent-oauth2-proxy Secret reflected from the authentik namespace
    # by tf/gitops/sso-providers/provider_kagent.tf.
    #
    # The kagent chart already wires extraArgs (provider=oidc, branded
    # login templates, skip-auth-regex for static assets, scope incl.
    # groups, etc.) and references $(OIDC_ISSUER_URL) / $(OIDC_REDIRECT_URL)
    # via env. We only override those env values + reverse-proxy.
    oauth2-proxy:
      enabled: true
      config:
        existingSecret: kagent-oauth2-proxy
      extraEnv:
        - name: OIDC_ISSUER_URL
          value: https://auth.allegedly.works/application/o/kagent/
        - name: OIDC_REDIRECT_URL
          value: https://kagent.allegedly.works/oauth2/callback
        - name: UPSTREAM_URL
          value: http://kagent-ui:8080
      extraArgs:
        # Trust X-Forwarded-* headers from the cluster-gateway Envoy so the
        # OIDC redirect URLs are computed against the public hostname.
        reverse-proxy: "true"
        # Authentik does not populate `email_verified` in the id_token for
        # locally-managed users (only for users who arrived via OAuth
        # sources like Google), so oauth2-proxy fails the callback with
        # `email in id_token isn't verified`. We trust Authentik for
        # email validity in this homelab.
        insecure-oidc-allow-unverified-email: "true"

  # The chart's `providers.openAI` shortcut does not expose
  # `spec.openAI.baseUrl` on the ModelConfig it generates, so the rendered
  # default-model-config would point at api.openai.com — wrong for our
  # z.ai key. Patch the rendered CR to pin the z.ai endpoint. Strategic-
  # merge form (vs. JSON patch) so kustomize creates the missing
  # `/spec/openAI` parent automatically.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ModelConfig
              name: default-model-config
            patch: |
              apiVersion: kagent.dev/v1alpha2
              kind: ModelConfig
              metadata:
                name: default-model-config
              spec:
                openAI:
                  baseUrl: https://api.z.ai/api/coding/paas/v4
