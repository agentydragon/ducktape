apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: manifold-mcp
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/agents/manifold-mcp/app
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: manifold-mcp
      namespace: manifold-mcp
  dependsOn:
    - name: gateway
    - name: manifold-mcp-namespace
    - name: valkey
    - name: agent-machine-access-tf
