apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airlock-secret-writer
  namespace: airlock
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airlock-secret-writer
  namespace: airlock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airlock-secret-writer
subjects:
  - kind: ServiceAccount
    name: airlock
    namespace: airlock
