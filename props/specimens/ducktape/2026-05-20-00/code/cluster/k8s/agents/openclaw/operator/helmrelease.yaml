apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw-operator
  namespace: openclaw-operator
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: openclaw-operator
      # Pinned: 0.12.0 generates invalid chromium-proxy nginx config
      # (proxy_pass with URI inside named location @chromium_ws → crashloop).
      version: "0.11.1"
      sourceRef:
        kind: HelmRepository
        name: openclaw
        namespace: openclaw-operator
      interval: 12h
  values:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
