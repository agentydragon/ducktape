apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubectl-sandbox-mcp
  namespace: kubectl-sandbox-mcp
  annotations:
    description: "Gated SA kubectl MCP server. Authentik consent required; server uses its own SA for kubectl operations."
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "kubectl-sandbox-mcp.allegedly.works"
  rules:
    - backendRefs:
        - name: kubectl-sandbox-mcp
          port: 8080
      timeouts:
        request: "60s"
        backendRequest: "60s"
