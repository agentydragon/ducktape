# Bearer token for MCP agent callers of the homeassistant-proxy API.
# Generated once by ESO Password generator; Stakater Reloader restarts the
# proxy pod on rotation.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: homeassistant-proxy-mcp-agent-generator
  namespace: homeassistant-proxy
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-proxy-tokens
  namespace: homeassistant-proxy
spec:
  refreshInterval: 8760h
  target:
    name: homeassistant-proxy-tokens
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "openclaw-sandbox,claude-sandbox"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "openclaw-sandbox,claude-sandbox"
      data:
        mcp_agent: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: homeassistant-proxy-mcp-agent-generator
