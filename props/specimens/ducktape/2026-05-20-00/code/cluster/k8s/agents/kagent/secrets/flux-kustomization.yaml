apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kagent-secrets
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  path: ./cluster/k8s/agents/kagent/secrets
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kagent-namespace
