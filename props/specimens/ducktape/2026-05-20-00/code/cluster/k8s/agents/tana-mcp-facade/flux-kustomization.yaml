apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tana-mcp-facade
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/agents/tana-mcp-facade
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: tana-mcp-facade
      namespace: tana-mcp
  dependsOn:
    - name: gateway
    - name: tana-mcp
    - name: valkey
    - name: agent-machine-access-tf
