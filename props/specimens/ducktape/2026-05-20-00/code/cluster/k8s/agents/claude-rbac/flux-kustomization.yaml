apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-rbac
  namespace: flux-system
  annotations:
    description: Lightweight base for Claude agent sandbox. Sandbox namespace + ClusterRoles. Must not depend on service or database kustomizations.
spec:
  interval: 10m
  path: ./cluster/k8s/agents/claude-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: kyverno-policies
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: claude-sandbox
