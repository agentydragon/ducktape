# Allow the clawd node (in openclaw-sandbox) to reach the OpenClaw gateway.
# Additive with the operator's default-deny NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openclaw-sandbox-ingress
  namespace: openclaw-gateway
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openclaw-sandbox
      ports:
        - port: 18790
          protocol: TCP
  policyTypes:
    - Ingress
