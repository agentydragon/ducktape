# Proxy that rewrites Host/Origin to localhost so Tana's MCP server accepts
# requests from cluster clients.
#
# Security boundary:
# - Expose only /mcp and /health to cluster clients
# - Keep Tana's OAuth endpoints pod-local because cluster clients do not need
#   them for normal MCP use
# - This avoids exposing unnecessary auth surface beyond the proxied MCP API
server {
    listen 8263;

    location = /mcp {
        proxy_pass http://127.0.0.1:8262;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8262;
        proxy_set_header Origin http://localhost:8262;
        proxy_set_header Connection '';

        # SSE / Streamable HTTP support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8262/health;
        proxy_set_header Host localhost:8262;
    }

    location ^~ /oauth/ {
        return 403;
    }

    location / {
        return 404;
    }
}
