# HTTPRoute for kubectl-passthrough-mcp.
# NOT behind the Authentik outpost — the MCP server drives the full OAuth dance
# (DCR, PKCE, resource metadata) internally using containers/kubernetes-mcp-server's
# built-in OAuth2/OIDC support.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubectl-passthrough-mcp
  namespace: kubectl-passthrough-mcp
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway-system
  hostnames:
    - "kubectl-passthrough-mcp.allegedly.works"
  rules:
    - backendRefs:
        - name: kubectl-passthrough-mcp
          port: 8080
      timeouts:
        request: "60s"
        backendRequest: "60s"
