apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-crds
  namespace: kagent
spec:
  interval: 10m
  chart:
    spec:
      chart: kagent-crds
      version: 0.9.2
      sourceRef:
        kind: HelmRepository
        name: kagent
        namespace: kagent
      interval: 5m
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
