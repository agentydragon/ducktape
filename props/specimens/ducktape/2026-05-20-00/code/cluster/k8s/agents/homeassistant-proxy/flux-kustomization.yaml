apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homeassistant-proxy
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster/k8s/agents/homeassistant-proxy
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: homeassistant-proxy
      namespace: homeassistant-proxy
  dependsOn:
    - name: external-secrets-config
