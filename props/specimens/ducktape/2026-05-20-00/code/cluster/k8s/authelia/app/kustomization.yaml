apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - secrets.sops.yaml
  - jwks.sops.yaml

configMapGenerator:
  - name: authelia-config
    namespace: authelia
    files:
      - configuration.yml
      - users.yml
    options:
      disableNameSuffixHash: true
