---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openebs-lvm-localpv
  namespace: flux-system
spec:
  interval: 24h
  url: https://openebs.github.io/lvm-localpv
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-lvm-localpv
  namespace: openebs
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: lvm-localpv
      version: "1.8.1"
      sourceRef:
        kind: HelmRepository
        name: openebs-lvm-localpv
        namespace: flux-system
  values:
    lvmNode:
      nodeSelector:
        topology.kubernetes.io/region: proxmox
    lvmController:
      nodeSelector:
        topology.kubernetes.io/region: proxmox
