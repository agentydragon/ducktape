---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/descheduler
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: descheduler
      version: "0.35.0"
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: kube-system
  values:
    schedule: "*/15 * * * *"
    deschedulerPolicyAPIVersion: "descheduler/v1alpha2"
    deschedulerPolicy:
      metricsProviders:
        - source: KubernetesMetrics
      profiles:
        - name: default
          pluginConfig:
            - name: LowNodeUtilization
              args:
                metricsUtilization:
                  source: KubernetesMetrics
                thresholds:
                  cpu: 20
                  memory: 20
                targetThresholds:
                  cpu: 50
                  memory: 70
            - name: RemoveDuplicates
              args: {}
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 50
                includingInitContainers: true
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
                - RemoveDuplicates
            deschedule:
              enabled:
                - RemovePodsHavingTooManyRestarts
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    rbac:
      create: true
