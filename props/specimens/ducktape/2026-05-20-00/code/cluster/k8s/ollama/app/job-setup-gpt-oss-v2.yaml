apiVersion: batch/v1
kind: Job
metadata:
  name: setup-gpt-oss-v2
  namespace: ollama
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        topology.kubernetes.io/region: proxmox
      volumes:
        - name: scripts
          configMap:
            name: gpt-oss-scripts
            defaultMode: 0755
      containers:
        - name: setup
          # curl + busybox awk; we hit /api/pull directly (no ollama CLI needed).
          image: curlimages/curl:8.10.1
          command:
            - /scripts/setup-gpt-oss-v2.sh
          env:
            - name: OLLAMA_HOST
              value: "http://ollama.ollama.svc.cluster.local:11434"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
