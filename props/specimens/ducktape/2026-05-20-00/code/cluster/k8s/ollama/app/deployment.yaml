apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app.kubernetes.io/name: ollama
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      containers:
        - name: ollama
          image: ollama/ollama:0.21.2
          ports:
            - name: ollama
              containerPort: 11434
              protocol: TCP
          env:
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: OLLAMA_KV_CACHE_TYPE
              value: q8_0
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_NUM_CTX
              value: "131072"
          resources:
            requests:
              nvidia.com/gpu: 2
              memory: 24Gi
              cpu: "2"
            limits:
              nvidia.com/gpu: 2
              memory: 40Gi
          volumeMounts:
            - name: models
              mountPath: /models
          livenessProbe:
            httpGet:
              path: /
              port: ollama
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: ollama
            initialDelaySeconds: 10
            periodSeconds: 10
        - name: auth-proxy
          image: nginx:1.27-alpine
          ports:
            - name: auth-proxy
              containerPort: 11435
              protocol: TCP
          env:
            - name: OLLAMA_DIRECT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ollama-bearer-token
                  key: token
          volumeMounts:
            - name: nginx-templates
              mountPath: /etc/nginx/templates
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          livenessProbe:
            tcpSocket:
              port: auth-proxy
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llm-models
        - name: nginx-templates
          configMap:
            name: ollama-auth-proxy
        - name: nginx-config
          configMap:
            name: ollama-auth-proxy
