apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana-operator
      version: "~5.22"
      sourceRef:
        kind: HelmRepository
        name: grafana-operator
        namespace: flux-system
      interval: 12h
  values:
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
