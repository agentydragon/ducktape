apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-db
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/monitoring/grafana-db
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: grafana-db
      namespace: monitoring
  dependsOn:
    - name: monitoring-namespace
    - name: cnpg
