# SeaweedFS dashboard from grafana.com — covers master/volume/filer/s3
# operation rates, latency histograms, volume fill, and replication state.
# Used during the SeaweedFS trial to capture the baseline performance
# numbers we want before deciding on filer/PVC adoption.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: seaweedfs
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  grafanaCom:
    id: 14242
