apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-instance
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/monitoring/grafana-instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: grafana-deployment
      namespace: monitoring
  timeout: 5m
  dependsOn:
    - name: grafana-operator
    - name: grafana-db
    - name: monitoring-stack-secrets
    - name: sso-providers-tf
