apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-stack
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/monitoring/stack
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
  timeout: 10m
  dependsOn:
    - name: monitoring-namespace
    - name: gateway
    - name: cert-manager-environment
    - name: monitoring-stack-secrets
    - name: sso-providers-tf
    - name: grafana-db
