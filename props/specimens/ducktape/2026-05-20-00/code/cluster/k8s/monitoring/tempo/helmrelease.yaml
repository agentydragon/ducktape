apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: tempo
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  values:
    tempo:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

      storage:
        trace:
          backend: s3
          s3:
            endpoint: seaweedfs-s3.seaweedfs.svc:8333
            bucket: tempo
            insecure: true

      extraEnvFrom:
        - secretRef:
            name: tempo-s3-credentials

    persistence:
      enabled: false

    nodeSelector:
      topology.kubernetes.io/region: hil

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    serviceMonitor:
      enabled: true
