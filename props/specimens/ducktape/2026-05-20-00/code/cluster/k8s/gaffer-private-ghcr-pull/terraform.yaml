apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: gaffer-private-ghcr-pull
  namespace: flux-system
  annotations:
    description: "Synthesizes the `gaffer-ghcr-pull` dockerconfigjson Secret in flux-system from the PAT in `github-pat-ghcr-read`. Reflector mirrors it into each gaffer-private consumer namespace. Sourced from flux-system; runs after the gaffer-private bridge Kustomization creates the consumer namespaces."
spec:
  interval: 15m
  refreshBeforeApply: true
  approvePlan: "auto"
  path: ./tf/gitops/gaffer-private-ghcr-pull
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  serviceAccountName: tf-runner
  backendConfig:
    customConfiguration: |
      backend "pg" {
        conn_str    = "postgres://tfstate@tofu-state-db-rw.tofu-state.svc:5432/tfstate?sslmode=disable"
        schema_name = "gaffer_private_ghcr_pull"
      }
  runnerPodTemplate:
    spec:
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tofu-state-db-credentials
              key: password
