apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: props-agent-rbac
  namespace: flux-system
  annotations:
    description: Agent RBAC for props namespace. Lightweight — only RoleBindings and Roles. Depends on namespace existing + claude-rbac for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/props/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: props-namespace
    - name: claude-rbac
