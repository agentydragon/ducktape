apiVersion: v1
kind: ServiceAccount
metadata:
  name: props-executor
  namespace: props
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: props-executor
  namespace: props
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: props-executor
  namespace: props
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: props-executor
subjects:
  - kind: ServiceAccount
    name: props-executor
    namespace: props
