apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: user-agentydragon
  namespace: flux-system
spec:
  retryInterval: 1m
  interval: 10m
  path: ./cluster/k8s/user-agentydragon
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age-cluster-secrets
