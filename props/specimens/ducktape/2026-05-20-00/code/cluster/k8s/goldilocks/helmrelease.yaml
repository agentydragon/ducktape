apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: goldilocks
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: goldilocks
      version: "10.3.0"
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: flux-system
      interval: 12h
  values:
    vpa:
      enabled: false

    controller:
      flags:
        on-by-default: "true"
      resources:
        requests:
          cpu: 25m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 512Mi

    dashboard:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
