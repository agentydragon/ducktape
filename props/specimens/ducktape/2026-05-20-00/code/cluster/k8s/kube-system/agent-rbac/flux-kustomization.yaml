apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-system-agent-rbac
  namespace: flux-system
  annotations:
    description: Agent RBAC for kube-system namespace. Lightweight — only RoleBindings. Depends on namespace existing + claude-rbac for ClusterRoles.
spec:
  interval: 10m
  path: ./cluster/k8s/kube-system/agent-rbac
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  dependsOn:
    - name: kube-system
    - name: claude-rbac
