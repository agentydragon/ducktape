---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia
  namespace: nvidia-device-plugin
spec:
  interval: 24h
  url: https://nvidia.github.io/k8s-device-plugin
---
# RuntimeClass so pods can request the nvidia containerd runtime.
# The runtime is configured in k8s-worker.nix (nvidia-container-runtime.cdi).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  interval: 15m
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.18.2"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: nvidia-device-plugin
  values:
    # nvidia-container-runtime.cdi (in containerd, via RuntimeClass) injects
    # /dev/nvidia*, driver libs, and glibc via host CDI specs. The device plugin
    # only needs NVML access (provided by the runtime) to enumerate GPUs.
    # Default envvar strategy: plugin sets NVIDIA_VISIBLE_DEVICES on workload
    # containers; the CDI runtime translates that to CDI device injection.
    runtimeClassName: nvidia
