apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inventree-secrets
  namespace: flux-system
spec:
  retryInterval: 1m
  suspend: true
  interval: 10m
  path: ./cluster/k8s/inventree/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: inventree-namespace
