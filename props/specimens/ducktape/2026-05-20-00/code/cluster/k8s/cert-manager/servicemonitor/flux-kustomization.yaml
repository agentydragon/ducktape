apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-servicemonitor
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/k8s/cert-manager/servicemonitor
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager
    - name: monitoring-stack
