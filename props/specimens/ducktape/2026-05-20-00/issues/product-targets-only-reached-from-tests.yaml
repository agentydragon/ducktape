  Marking them testonly would hide the real problem.


  Fix each occurrence by wiring it into the intended non-test Bazel binary, artifact, validation, packaging, or deployment
  workflow. If a target has no intended non-test consumer, delete it instead of keeping a library that is only exercised by
  tests."
