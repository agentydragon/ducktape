rationale:
  "These are false positives for the original artifact-only heuristic. Manual review found that they are not dead
  targets: most feed OCI images that are built, loaded, pushed, or otherwise documented as artifacts; some are testonly helpers
  already marked testonly; and the rest are transitive dependencies whose actual actionable root is already represented in
  unconsumed-bazel-targets. A critic should not report these labels merely because a binary/test root query did not count
  artifact and release roots."
should_flag: false
