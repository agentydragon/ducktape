rationale: |
  `unparseable` is typed as `list[tuple[GmailMessage, str]]` and stores
  error strings alongside messages, but when iterated the error is discarded
  with `_error`. The error information is captured but never surfaced — not
  logged, not reported, not returned. Either the errors should be used
  (e.g., logged or included in output) or the type should be simplified to
  `list[GmailMessage]` to reflect what is actually consumed.
