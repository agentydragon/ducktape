[mypy]
python_version = 3.14
warn_return_any = True
warn_unused_ignores = True
ignore_missing_imports = False
namespace_packages = True
explicit_package_bases = True
warn_unused_configs = True
strict_equality = True
disallow_untyped_defs = False
check_untyped_defs = True
# Only report errors in explicitly passed files, not transitively checked modules
# This still TYPE-CHECKS our usage of imported APIs, just doesn't report
# internal implementation errors within those packages
follow_imports = silent

# Source paths for workspace packages (used for non-Bazel runs)
# Bazel's rules_mypy sets MYPYPATH automatically from target deps
mypy_path = .

# Pydantic plugin for proper type understanding of Field() defaults and aliases
# SQLAlchemy plugin for proper ORM type inference
plugins = pydantic.mypy, sqlalchemy.ext.mypy.plugin

# Exclude only test fixtures and testdata within packages
# Also exclude Alembic migrations (auto-generated boilerplate)
# statsmodels is excluded because it has a broken module structure that causes
# mypy to error with "Source file found twice under different module names"
exclude = /testdata/|/fixtures/|/vendor/|/migrations/|/statsmodels/|props/specimens/.*/code/

# Type-check the arguments of generated Pydantic __init__ methods (default: Any).
[pydantic-mypy]
init_typed = True

# Per-module overrides for test data
[mypy-*.testdata.*]
ignore_errors = True

# --- Packages without py.typed and no stubs available ---

# pyroute2 0.9.6: methods (link, addr, link_lookup) are dynamically dispatched
# via __getattr__ in IPRoute. No py.typed, no stubs, no upstream plan.
# Upstream discussion: https://github.com/svinota/pyroute2/discussions/880
[mypy-pyroute2.*]
follow_imports = skip
ignore_missing_imports = True

# JAX 0.11.1: ships py.typed stubs with two internal-stub issues mypy 1.x
# rejects — `_Device` used as both a type and a runtime variable inside
# `jax/numpy/__init__.pyi`, and `Array.__ne__` returning `Array` (intentional
# NumPy-style elementwise comparison; the same LSP violation lives in numpy
# itself, which we don't lint). `follow_imports` is moot because Bazel's mypy
# aspect passes target files explicitly. `ignore_errors` suppresses errors
# raised inside JAX's own stub files while keeping the public-API types
# usable in our code.
[mypy-jax.*]
ignore_errors = True

[mypy-jaxlib.*]
ignore_errors = True

# fontTools 4.65.0: has inline annotations but no py.typed marker.
# Table access (font["head"]) returns generic Table — attribute access
# (unitsPerEm, etc.) is untyped because attributes are set via sstruct.unpack2().
[mypy-fontTools.*]
follow_imports = skip
ignore_missing_imports = True

# gnucash: Python bindings for GnuCash, no type stubs.
# Used by: finance/gnucash_*.py
[mypy-gnucash.*]
ignore_missing_imports = True

# --- Packages with broken stubs or internal type errors ---

# PyHamcrest 2.1.0: has py.typed but type annotations are broken —
# all_of()/only_contains() use Union[Matcher[T], T] which mypy infers as
# Matcher[Never]. Skip analysis so imports resolve as Any.
# Upstream fix: https://github.com/hamcrest/PyHamcrest/pull/267
# Reverify: check if PR #267 is released (2.1.1+).
[mypy-hamcrest.*]
follow_imports = skip
ignore_missing_imports = True

# rpds-py 2026.6.3: bundled __init__.pyi has implicit Optional parameters
# (e.g. `def get(self, key: K, default: V = ...) -> V` missing `| None`).
# Triggers: error: Incompatible return value type
[mypy-rpds.*]
ignore_errors = True

# pygit2 1.20.1: stubs reference pygit2._libgit2.ffi (CFFI-generated module)
# which has no stubs. Only this specific submodule needs the override.
[mypy-pygit2._libgit2.ffi]
ignore_missing_imports = True

# Legacy inventree import script — uses duck typing patterns (dynamic attribute
# access, untyped dicts) not compatible with strict mypy.
[mypy-import_samplebooks2]
ignore_errors = True

# numpy: bundled stubs have internal overload/override conflicts.
# ignore_missing_imports needed because types-networkx stubs import numpy
# in the rules_mypy stubs virtualenv where numpy may not be resolved.
[mypy-numpy.*]
ignore_errors = True
ignore_missing_imports = True

# SciPy 1.17.1's bundled _orthogonal stubs currently conflict with NumPy 2.4's
# poly1d overloads and retain an unused type: ignore. Keep SciPy's public types
# available, but do not fail repository mypy on errors inside its vendor stubs.
[mypy-scipy.*]
ignore_errors = True

# types-networkx: stubs have stale `# type: ignore[misc]` that should be
# `[overload-overlap]`. Upstream bug in the stubs package.
[mypy-networkx.*]
ignore_errors = True

# docker-py 7.2.0: no py.typed. types-docker stubs exist but have
# import-untyped errors and unused `# type: ignore` comments internally.
[mypy-docker.*]
ignore_missing_imports = True
ignore_errors = True

# zstandard 0.25.0: bundled stubs have ZstdCompressionWriter.write()
# signature returning int vs None incompatibility with IO[bytes] protocol.
[mypy-zstandard.*]
ignore_errors = True

# matplotlib 3.11.2: bundled stubs have unused `# type: ignore` comments.
# Large stub surface area — unlikely to be fixed soon.
[mypy-matplotlib.*]
ignore_errors = True

# pandas 3.0.5: bundled stubs have zero-member enum issues
# (e.g. `class NaType(enum.Enum)` with no members triggers mypy errors).
[mypy-pandas.*]
ignore_errors = True

# tokenizers 0.23.2: bundled stubs reuse runtime variables such as Model,
# Decoder, and Normalizer as type annotations, which mypy rejects. This is
# transitively imported by LiteLLM; keep its public API available without
# reporting errors from the vendor stub itself.
[mypy-tokenizers.*]
ignore_errors = True

# opentelemetry-proto 1.44.0: generated protobuf stubs contain incompatible
# descriptor assignments and references to private protobuf internals that
# mypy cannot resolve. The package is transitively imported by LiteLLM.
[mypy-opentelemetry.proto.*]
ignore_errors = True

# mautrix 0.21.1: bundled stubs have internal type issues
# (e.g. incompatible overrides in EventType, ContentType).
[mypy-mautrix.*]
ignore_errors = True

# --- Infrastructure / internal overrides ---

# mypy-protobuf's generated gRPC stub contains an upstream unused ignore.
[mypy-agentplane.runner.protocol_pb2_grpc]
warn_unused_ignores = False

# logfire-api 5.1.0: bundled stubs expose optional integrations (logfire,
# OpenTelemetry exporters, and requests types) that are not installed by the
# pydantic-ai-slim dependency. They are checked transitively through the
# pydantic-ai API, but are not ducktape code.
[mypy-logfire_api.*]
ignore_errors = True
ignore_missing_imports = True

# cotrl: experimental RL code with many untyped deps (gymnasium, scipy,
# stable-baselines3). Pre-existing, not worth fixing.
[mypy-x.cotrl.*]
ignore_errors = True

# kubernetes-asyncio 36.1.0: stubs reference
# IoK8sApimachineryPkgApisMetaV1GroupVersionKind which doesn't exist in
# kubernetes_asyncio.client.models (upstream bug in code generation).
# Reverify: check if fixed in a future release.
[mypy-kubernetes_asyncio.*]
ignore_errors = True

# PySide6 is provided by the FreeCAD runtime, not the Bazel pip hub.
[mypy-PySide6.*]
ignore_missing_imports = True

# FreeCAD modules: provided by the FreeCAD AppImage runtime, not pip.
# freecad-stubs exists but rules_mypy can't resolve it (no "freecad" runtime
# package in pip hub). pivy and importDXF have no stubs at all.
[mypy-FreeCAD.*]
ignore_missing_imports = True
[mypy-FreeCADGui.*]
ignore_missing_imports = True
[mypy-Part.*]
ignore_missing_imports = True
[mypy-Sketcher.*]
ignore_missing_imports = True
[mypy-TechDraw.*]
ignore_missing_imports = True
[mypy-TechDrawGui.*]
ignore_missing_imports = True
[mypy-pivy.*]
ignore_missing_imports = True

# rules_python 2.3.3's generated console-script wrapper carries a defensive
# bare type-ignore on sys.exit(); this entry point is otherwise fully typed, so
# mypy 2.3.1 reports that generated ignore as unused.
[mypy-tana.litellm_proxy.server_bin_entry_point]
warn_unused_ignores = False
