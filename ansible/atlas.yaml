---
- name: Configure atlas Proxmox host
  hosts: atlas
  become: true
  vars_files:
    - vars/common_vars.yml
  vars:
    docker_state: absent # Proxmox host doesn't need Docker
    nebula_ca_cert_file: "{{ playbook_dir }}/../secrets/nebula/ca.crt"
    nebula_host_cert_file: "{{ playbook_dir }}/../secrets/nebula/atlas.crt"
    nebula_host_key_sops_file: "{{ playbook_dir }}/../secrets/nebula/atlas.sops.key"
    hostexecd_host: atlas
    hostexecd_daemon_token_sops_file: "{{ playbook_dir }}/../cluster/k8s/haku/console/node-daemon-atlas.sops.yaml"
  remote_user: root

  tasks:
    # Fix Proxmox repository issues
    - name: Remove Proxmox enterprise
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.sources
        - /etc/apt/sources.list.d/ceph.sources
      tags: [repositories]

    - name: Add Proxmox no-subscription repository (PVE 9 / trixie)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-no-subscription.sources
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-no-subscription
        mode: "0644"
      tags: [repositories]

    - name: Configure local datastore content types for Terraform
      ansible.builtin.command:
        cmd: pvesm set local --content backup,iso,vztmpl,snippets,images,import
      register: datastore_result
      changed_when: datastore_result.rc == 0
      failed_when: datastore_result.rc != 0 and 'already exists' not in datastore_result.stderr
      tags: [proxmox, terraform]

    # Replaces the subscription-status condition with `if (false)` so the
    # "no valid subscription" popup is never shown. Idempotent via --forward.
    - name: Copy Proxmox no-subscription patch to target
      ansible.builtin.copy:
        src: proxmox-no-subscription.patch
        dest: /tmp/proxmox-no-subscription.patch
        mode: "0644"
      tags: [proxmox, ui]

    - name: Suppress Proxmox no-subscription popup in web UI
      ansible.builtin.command:
        argv:
          - patch
          - --forward
          - --backup
          - --strip=1
          - /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
          - /tmp/proxmox-no-subscription.patch
      register: patch_result
      changed_when: "'patching file' in patch_result.stdout"
      failed_when: patch_result.rc != 0 and 'Skipping patch' not in patch_result.stdout
      tags: [proxmox, ui]

    - name: Update apt cache after repository changes
      ansible.builtin.apt:
        update_cache: true
      tags: [repositories]

    - name: Install AMD CPU microcode updates
      ansible.builtin.apt:
        name: amd64-microcode
        state: present
      tags: [packages, system]

    - name: Install desktop and virtualization packages
      ansible.builtin.apt:
        name:
          - firefox-esr
          - gnome
          - gdm3 # GNOME Display Manager
          - zsh
          # Client-side tools (don't conflict with Proxmox's QEMU)
          - virt-viewer
          - spice-client-gtk # For SPICE console connections
          # libvirt-daemon-system and libvirt-clients are NOT installed —
          # they conflict with Proxmox's pve-qemu-kvm and would remove
          # the proxmox-ve meta-package. PVE manages VMs natively.
          - ydotool # For input automation on Wayland (SPICE latency measurement)
          - ydotoold # ydotool daemon
          - gstreamer1.0-pipewire # For GNOME screencast recording
          - gstreamer1.0-plugins-good # For GNOME screencast recording
          - gnome-shell-extension-gsconnect # KDE Connect protocol for GNOME
          # TODO: Enable GSConnect via ansible (dconf) or home-manager after install
        state: present
        install_recommends: false
      tags: [packages, desktop, virtualization]

    # Moonlight (game stream client) — pairs with Sunshine on wyrm2, which
    # renders + NVENC-encodes on a passed-through RTX 5090. Not in Debian,
    # and upstream's Cloudsmith apt repo ships no amd64 builds (Raspberry Pi
    # arches only) — Flathub is the supported x86_64 path.
    # See debug/atlas/gpu-strategy.md.
    - name: Install flatpak
      ansible.builtin.apt:
        name: flatpak
        state: present
        install_recommends: false
      tags: [packages, moonlight]

    - name: Add Flathub remote
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
        state: present
      tags: [moonlight]

    - name: Install Moonlight (Flathub)
      community.general.flatpak:
        name: com.moonlight_stream.Moonlight
        state: present
      tags: [packages, desktop, moonlight]

    - name: Create primary user
      ansible.builtin.user:
        name: "{{ my_user }}"
        comment: Primary user account
        shell: /usr/bin/zsh
        home: "/home/{{ my_user }}"
        create_home: true
        groups:
          - sudo
          - libvirt # for virt-manager access
          - input # for /dev/uinput access (ydotool)
        append: true
        state: present
      tags: [users]

    - name: Ensure root .ssh directory exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        mode: "0700"
        owner: root
        group: root
      tags: [users, ssh]

    - name: Authorize SSH keys for root login
      ansible.builtin.copy:
        dest: /root/.ssh/authorized_keys
        content: |
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBoGigbjJZfs1+M6yUCJSBzUlu2mFcakFTmuxrN425fO agentydragon@atlas
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICweiJQQidbhojDI7tXuSuntptCc6Dy4stIGzDlI9z0b agentydragon@rugged
        mode: "0600"
        owner: root
        group: root
      tags: [users, ssh]

    - name: Allow input group access to /dev/uinput
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/60-uinput.rules
        content: 'KERNEL=="uinput", GROUP="input", MODE="0660", OPTIONS+="static_node=uinput"'
        mode: "0644"
      notify: Reload udev rules
      tags: [ydotool]

    - name: Enable GDM display manager
      ansible.builtin.systemd:
        name: gdm3
        enabled: true
        state: started
      tags: [desktop]

    - name: Apply system inspection nopasswd role
      ansible.builtin.import_role:
        name: system_inspection_nopasswd
      tags: [sudo, system]

    - name: Apply Nebula mesh role
      ansible.builtin.import_role:
        name: nebula
      tags: [nebula]

    - name: Apply hostexecd role
      ansible.builtin.import_role:
        name: hostexecd
      tags: [hostexecd]

    - name: Apply Nix role
      ansible.builtin.import_role:
        name: nix
      tags: [nix]
      vars:
        nix_trusted_users: "root {{ my_user }}"

    # Proxmox network bridges (ifupdown2). Both bridges ride the same physical
    # NIC. The cable is in enp11s0; enp12s0 is the other onboard NIC (no cable).
    # If the cable ever moves to enp12s0, swap bridge-ports enp11s0 -> enp12s0
    # and the VLAN parent enp11s0.4 -> enp12s0.4.
    - name: Configure Proxmox network interfaces (bridges + k8s VLAN)
      ansible.builtin.copy:
        dest: /etc/network/interfaces
        content: |
          # network interface settings — managed by Ansible (see atlas.yaml)
          #
          # vmbr0: Home LAN bridge (DHCP from router) — host internet uplink
          # vmbr4: Kubernetes VLAN 4 bridge (static IPs, isolated network)
          #
          # Active NIC: enp11s0 (cable is in this port). enp12s0 has no cable.

          auto lo
          iface lo inet loopback

          iface enp11s0 inet manual

          iface enp12s0 inet manual

          # VLAN 4 interface for Kubernetes cluster network
          auto enp11s0.4
          iface enp11s0.4 inet manual

          # Home LAN bridge - gets IP via DHCP from home router
          auto vmbr0
          iface vmbr0 inet dhcp
              bridge-ports enp11s0
              bridge-stp off
              bridge-fd 0

          # Kubernetes VLAN 4 bridge
          # Static IP for Proxmox API access from Kubernetes VMs.
          # Used by Proxmox CSI driver to manage VM disks.
          # Network allocation (see cluster/README.md):
          #   10.2.0.1    - Home router (gateway)
          #   10.2.0.2    - Atlas (Proxmox host) <- this interface
          #   10.2.1.x    - Control plane nodes
          #   10.2.2.x    - Worker nodes
          auto vmbr4
          iface vmbr4 inet static
              address 10.2.0.2/16
              bridge-ports enp11s0.4
              bridge-stp off
              bridge-fd 0

          source /etc/network/interfaces.d/*
        mode: "0644"
        backup: true
      notify: Reload network interfaces
      tags: [network, bridges]

    # GPU Passthrough Configuration
    #
    # Atlas boots via systemd-boot (UEFI), NOT GRUB. Kernel cmdline lives in
    # /etc/kernel/cmdline and is applied via `proxmox-boot-tool refresh`.
    #
    # pcie_aspm=off: Disable PCIe Active State Power Management to prevent
    # passed-through GPUs from entering low-power states that VFIO can't
    # recover from, causing "RC watchdog: GPU is probably locked!" errors.
    # See debug/atlas/wyrm_gpu_lockup.md for details.
    #
    # ahci.mobile_lpm_policy=1: Force max_performance SATA link power management.
    # Kernel 6.17 defaults to min_power (lpm-pol 3) which enables DIPM — drives
    # autonomously trigger SATA PHY power state transitions that destabilize the
    # AMD 800 Series chipset PCIe fabric (ata7 errors → chipset-wide lockup).
    # Kernel 6.8 did not default to min_power and ran 12+ days stable.
    # =0 (keep_firmware_settings) also disables DIPM on this board's firmware,
    # but =1 (max_performance) is explicit. See debug/atlas/black_screen_lockup.md.
    #
    # Reserve 96 x 1 GiB hugepages for wyrm2. The VM owns nearly all of Atlas's
    # interactive workload, so its RAM should not sit on the normal LRU where
    # direct reclaim can repeatedly scan it without freeing useful host memory.
    - name: Configure kernel cmdline for IOMMU and GPU passthrough
      ansible.builtin.copy:
        dest: /etc/kernel/cmdline
        # clearcpuid=510: Disable AMD Idle HLT Intercept (X86_FEATURE_IDLE_HLT,
        # CPUID 0x8000000A_EDX[30]). This feature (merged kernel 6.15) causes
        # guest vCPU stalls and spurious NMIs on AMD Zen 5. See
        # debug/kernel-6.18-amd-kvm-stall.md.
        # CLEANUP(added 2026-03-31): Remove once a pve-kernel containing the
        # RHBZ#2448303 fix (AMD Idle HLT Intercept) ships and atlas runs it.
        content: >-
          root=ZFS=rpool/ROOT/pve-1 boot=zfs amd_iommu=on iommu=pt
          pcie_aspm=off ahci.mobile_lpm_policy=1 clearcpuid=510
          default_hugepagesz=1G hugepagesz=1G hugepages=96
        mode: "0644"
        backup: true
      notify: Refresh proxmox boot
      tags: [gpu_passthrough, iommu, memory]

    - name: Add VFIO modules to /etc/modules
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: "{{ item }}"
        create: true
        mode: "0644"
      loop:
        - vfio
        - vfio_iommu_type1
        - vfio_pci
      tags: [gpu_passthrough, vfio]

    # Kernel modules required by NixOS LXC containers running k8s workers.
    # LXC shares the host kernel, so modules must be loaded on the host.
    - name: Add k8s-LXC kernel modules to /etc/modules
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: "{{ item }}"
        create: true
        mode: "0644"
      loop:
        - overlay
        - br_netfilter
        - wireguard
        - iscsi_tcp
      tags: [k8s_lxc]

    - name: Blacklist NVIDIA drivers on host
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-nvidia.conf
        content: |
          blacklist nouveau
          blacklist nvidia
          blacklist nvidiafb
          blacklist nvidia_drm
        mode: "0644"
      tags: [gpu_passthrough, nvidia]

    # RTX 5090 (Blackwell) has a known VFIO bug where the GPU can't wake
    # from D3cold after VM shutdown, causing FLR timeouts and host soft
    # lockups. Prevent vfio-pci from putting GPUs into D3 when idle.
    # See debug/atlas/black_screen_lockup.md for details.
    - name: Prevent VFIO D3 idle on GPUs (RTX 5090 Blackwell workaround)
      ansible.builtin.copy:
        dest: /etc/modprobe.d/vfio-pci.conf
        content: |
          options vfio-pci disable_idle_d3=1
        mode: "0644"
      tags: [gpu_passthrough, vfio]

    # Disable KVM halt polling — kernel 6.18 has a bug in the AMD Idle HLT
    # Intercept feature (merged 6.15) that causes guest vCPU stalls in
    # pv_native_safe_halt when halt polling is enabled. halt_poll_ns=0
    # fixes idle stalls but does NOT fully fix stalls under load — there
    # are likely multiple bug paths. Still worth applying as a partial
    # mitigation. See debug/kernel-6.18-amd-kvm-stall.md.
    # CLEANUP(added 2026-03-30): Remove once a pve-kernel containing the
    # RHBZ#2448303 fix (AMD Idle HLT Intercept) ships and atlas runs it.
    - name: Disable KVM halt polling (kernel 6.18 AMD stall workaround)
      ansible.builtin.copy:
        dest: /etc/modprobe.d/kvm-halt-poll.conf
        content: |
          options kvm halt_poll_ns=0
        mode: "0644"
      tags: [kvm, workaround]

    # Bound the ARC instead of relying on it to shrink quickly enough during a
    # host allocation burst. This leaves a predictable host reserve alongside
    # wyrm2's 96 GiB hugepage pool. Own the canonical zfs.conf path: modprobe
    # concatenates matching option lines, so a second file can silently lose to
    # a later lexical filename (as zfs-memory.conf did to the old zfs.conf).
    - name: Cap the ZFS ARC at 8 GiB
      ansible.builtin.copy:
        dest: /etc/modprobe.d/zfs.conf
        content: |
          options zfs zfs_arc_max=8589934592
        mode: "0644"
      tags: [memory, zfs]

    - name: Remove duplicate legacy ZFS ARC configuration
      ansible.builtin.file:
        path: /etc/modprobe.d/zfs-memory.conf
        state: absent
      tags: [memory, zfs]

    - name: Read the live ZFS ARC cap
      ansible.builtin.command:
        cmd: cat /sys/module/zfs/parameters/zfs_arc_max
      register: zfs_arc_max_live
      changed_when: false
      tags: [memory, zfs]

    - name: Apply the ZFS ARC cap live
      ansible.builtin.command:
        cmd: /usr/bin/tee /sys/module/zfs/parameters/zfs_arc_max
        stdin: "8589934592"
      when: zfs_arc_max_live.stdout != "8589934592"
      changed_when: true
      tags: [memory, zfs]

    - name: Prevent D3cold on RTX 5090 GPUs via udev
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/99-vfio-gpu-no-d3cold.rules
        content: 'ACTION=="add", SUBSYSTEM=="pci", ATTR{vendor}=="0x10de", ATTR{device}=="0x2b85", ATTR{power/control}="on", ATTR{d3cold_allowed}="0"'
        mode: "0644"
      notify: Reload udev rules
      tags: [gpu_passthrough, vfio]

    # Disable ASPM on all PCI devices via setpci at device add time.
    # pcie_aspm=off and BIOS "Disabled" (BIOS-controlled) are both insufficient —
    # BIOS 2102 still enables L1 on 27+ devices. Belt-and-suspenders with setpci.
    # Also disable D3cold and runtime PM on all PCIe bridges.
    # See debug/atlas/black_screen_lockup.md.
    - name: Disable ASPM on all PCI devices and D3cold on bridges
      ansible.builtin.copy:
        src: files/99-disable-chipset-aspm.rules
        dest: /etc/udev/rules.d/99-disable-chipset-aspm.rules
        mode: "0644"
      notify: Reload udev rules
      tags: [pcie, power_management]

    - name: Update initramfs after module changes
      ansible.builtin.command:
        cmd: update-initramfs -u
      register: initramfs_result
      changed_when: initramfs_result.rc == 0
      tags: [gpu_passthrough, memory, zfs]

    # zram swap — replaces the ZFS zvol swap (/dev/zd0).
    # ZFS-backed swap deadlocks under memory pressure: the kernel tries to swap
    # out pages via the zvol, but ZFS needs memory to perform that I/O, causing
    # a priority inversion that freezes the host. zram compresses pages in RAM
    # (no disk I/O) and avoids the deadlock entirely.
    # See debug/atlas/black_screen_lockup.md, incident 16.
    - name: Install zram-tools
      ansible.builtin.apt:
        name: zram-tools
        state: present
      tags: [swap, zram]

    - name: Configure zram swap (50% of RAM, zstd compression)
      ansible.builtin.copy:
        dest: /etc/default/zramswap
        content: |
          # Managed by Ansible — see atlas.yaml
          ALGO=zstd
          PERCENT=50
          PRIORITY=100
        mode: "0644"
      notify: Restart zramswap
      tags: [swap, zram]

    - name: Enable zramswap service
      ansible.builtin.systemd:
        name: zramswap
        enabled: true
        state: started
      tags: [swap, zram]

    # QEMU's guest RAM is anonymous/shmem from the host's perspective. A value
    # of 150 made direct reclaim strongly prefer scanning wyrm2's 96 GiB mapping,
    # even though almost none of those pages could be reclaimed. Keep zram as an
    # emergency pressure valve without making guest RAM the preferred target.
    - name: Limit swapping of QEMU guest memory
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-zram.conf
        content: "vm.swappiness = 10\n"
        mode: "0644"
      notify: Apply sysctl settings
      tags: [swap, zram]

    # Disable ZFS Direct I/O on the dataset backing VM disk images.
    # We observed dio_verify_wr (DIO_CHECKSUM_VERIFY) EIO errors on this
    # dataset with DIO enabled, causing QEMU to pause VMs. Root cause is
    # unclear — could be a ZFS DIO bug (feature is new, OpenZFS 2.3.0 Jan
    # 2025, known open issues like openzfs/zfs#16695), or actual hardware
    # corruption that DIO verify is correctly catching. Disabling DIO as a
    # trial to see if the problem goes away.
    # See debug/wyrm2-io-error-2026-04-08/README.md for investigation.
    - name: Disable ZFS Direct I/O on VM image dataset
      community.general.zfs:
        name: rpool/var-lib-vz
        state: present
        extra_zfs_properties:
          direct: disabled
      tags: [zfs, storage]

    - name: Mask CUPS services (spams dmesg)
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - cups.service
        - cups.socket
        - cups.path
        - cups-browsed.service
      failed_when: false
      tags: [cups, services]

    # Disable all sleep states — atlas is a server running VMs with VFIO GPU
    # passthrough. Host suspend kills VFIO-passed GPUs (GSP-RM firmware doesn't
    # survive S3) and causes cascading watchdog timeouts in guests.
    # See debug/atlas/wyrm_gpu_lockup.md.
    - name: Mask all sleep/suspend/hibernate targets
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target
      tags: [power_management, vfio]

    - name: Ensure logind.conf.d directory exists
      ansible.builtin.file:
        path: /etc/systemd/logind.conf.d
        state: directory
        mode: "0755"
      tags: [power_management, vfio]

    - name: Disable logind idle/lid suspend actions
      ansible.builtin.copy:
        dest: /etc/systemd/logind.conf.d/no-suspend.conf
        content: |
          # Managed by Ansible — see atlas.yaml
          # Atlas is a server; never suspend/hibernate.
          [Login]
          HandleSuspendKey=ignore
          HandleHibernateKey=ignore
          HandleLidSwitch=ignore
          HandleLidSwitchExternalPower=ignore
          HandleLidSwitchDocked=ignore
          IdleAction=ignore
        mode: "0644"
      notify: Restart logind
      tags: [power_management, vfio]

    # TODO: WiFi Configuration - MediaTek MT7927 (14c3:7927)
    # The atlas host has a MediaTek MT7927 WiFi 7 card. MT7927 support was added
    # to the mt76 driver in Linux 6.12. Upgrade to Proxmox VE 9 (kernel 6.12+)
    # will enable this. After upgrade, install: wireless-tools, wpasupplicant, iw

  handlers:
    - name: Reload network interfaces
      ansible.builtin.command:
        cmd: ifreload -a
      register: ifreload_result
      changed_when: ifreload_result.rc == 0

    - name: Refresh proxmox boot
      ansible.builtin.command:
        cmd: proxmox-boot-tool refresh
      register: boot_result
      changed_when: boot_result.rc == 0

    - name: Reload udev rules
      ansible.builtin.command:
        cmd: udevadm control --reload-rules
      register: udev_result
      changed_when: udev_result.rc == 0

    - name: Restart logind
      ansible.builtin.systemd:
        name: systemd-logind
        state: restarted

    - name: Restart zramswap
      ansible.builtin.systemd:
        name: zramswap
        state: restarted

    - name: Apply sysctl settings
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true
