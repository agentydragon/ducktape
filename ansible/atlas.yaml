---
- name: Configure atlas Proxmox host
  hosts: atlas
  vars_files:
    - vars/common_vars.yml
  vars:
    rcup_computer: atlas
    ducktape_path: "/home/{{ my_user }}/code/ducktape"
    docker_state: absent  # Proxmox host doesn't need Docker
    skip_ubuntu_ppas: true  # Debian-based Proxmox can't use Ubuntu PPAs
    include_heavy_dev_packages: false
  remote_user: root

  tasks:
    # Fix Proxmox repository issues
    - name: Remove Proxmox enterprise repositories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.list
        - /etc/apt/sources.list.d/ceph.list
      tags: [repositories]

    - name: Add Proxmox no-subscription repository
      ansible.builtin.apt_repository:
        repo: "deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription"
        state: present
        filename: pve-no-subscription
      tags: [repositories]

    - name: Update apt cache after repository changes
      ansible.builtin.apt:
        update_cache: true
      tags: [repositories]

    - name: Ensure ducktape directory parent exists
      ansible.builtin.file:
        path: "/home/{{ my_user }}/code"
        state: directory
        owner: "{{ my_user }}"
        group: "{{ my_user }}"
        mode: '0755'
      tags: [dotfiles]

    - name: Clone ducktape repository if not present  # noqa: latest[git]
      ansible.builtin.git:
        repo: "git@gitlab.com:agentydragon/ducktape"
        dest: "{{ ducktape_path }}"
        accept_hostkey: true
      become: true
      become_user: "{{ my_user }}"
      tags: [dotfiles]
      failed_when: false  # In case SSH keys aren't set up yet

    - name: Install Firefox
      ansible.builtin.package:
        name: firefox-esr
        state: present
      tags: [packages]

    - name: Install desktop and virtualization packages
      ansible.builtin.apt:
        name:
          - gnome
          - virt-viewer
          - libvirt-daemon-system
          - libvirt-clients
          - gdm3  # GNOME Display Manager
          - zsh
          - spice-client-gtk  # For SPICE console connections
        state: present
        install_recommends: false
      tags: [packages, desktop, virtualization]

    - name: Ensure libvirt service is started
      ansible.builtin.systemd:
        name: libvirtd
        state: started
        enabled: true
      tags: [virtualization]

    - name: Create primary user
      ansible.builtin.user:
        name: "{{ my_user }}"
        comment: Primary user account
        shell: /usr/bin/zsh
        home: "/home/{{ my_user }}"
        create_home: true
        groups:
          - sudo
          - libvirt  # for virt-manager access
        append: true
        state: present
      tags: [users]

    - name: Enable GDM display manager
      ansible.builtin.systemd:
        name: gdm3
        enabled: true
        state: started
      tags: [desktop]

    - name: Apply system inspection nopasswd role
      ansible.builtin.import_role:
        name: system_inspection_nopasswd
      tags: [sudo, system]

    - name: Apply Tailscale client role
      ansible.builtin.import_role:
        name: tailscale_client
      tags: [tailscale]

    - name: Apply CLI role
      ansible.builtin.import_role:
        name: cli
      tags: [cli]

    # cli_nix_migrated excluded - atlas now uses Nix/home-manager for migrated packages

    - name: Apply Nix role
      ansible.builtin.import_role:
        name: nix
      tags: [nix]
      vars:
        nix_trusted_users: "root {{ my_user }}"

    # k3s cluster provisioning moved to separate playbook: k3s-provision.yaml
    # This avoids SSH authentication issues with existing VMs
    # To provision k3s: ansible-playbook k3s-provision.yaml
    # DNS for k3s is handled centrally via *.k3s.agentydragon.com (VPS)

    - import_role:
        name: gitea-mirrors
      tags: [gitea-mirrors, storage]

    - import_role:
        name: gitea-mirrors
      tags: [gitea-mirrors, storage]

    # TODO
    # - ansible.builtin.import_role:
    #     name: gpu-passthrough
    #   tags: [gpu-passthrough]
