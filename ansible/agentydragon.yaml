---
- name: Configure agentydragon laptop
  hosts: agentydragon
  vars_files:
    - vars/common_vars.yml
  # TODO: vars_files: agentydragon_gitlab_token.yml
  remote_user: "{{ my_user }}"

  roles:
    - role: nix
    - role: docker
    # - role: gui
    # - role: laptop
    - role: system_inspection_nopasswd
    - role: legacy_vpn_uninstall
      tags: [wireguard, tailscale]

  tasks:
    - name: Install CUDA (NVidia-specific)
      become: true
      ansible.builtin.apt:
        pkg: system76-cuda-latest

