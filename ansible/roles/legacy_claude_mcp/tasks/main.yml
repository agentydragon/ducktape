---
# Use bash -lc to run commands in a login shell that sources ~/.profile
# This is necessary because Ansible uses non-interactive, non-login shells by default
# which don't have access to user's PATH settings (e.g., ~/.npm-global/bin)
- name: Check if Claude Code CLI is installed
  ansible.builtin.shell: bash -lc 'which claude' # noqa: command-instead-of-shell (needs login shell)
  register: claude_cli_check
  failed_when: false
  changed_when: false

- name: Fail if Claude CLI is not installed
  ansible.builtin.fail:
    msg: |
      ⚠️  ERROR: Claude Code CLI is not installed!
      Please install Claude Code first: https://claude.ai/code
  when: claude_cli_check.rc != 0

- name: Get current MCP server list
  ansible.builtin.shell: bash -lc 'claude mcp list' # noqa: command-instead-of-shell (needs login shell)
  register: mcp_list_output
  changed_when: false

- name: Parse configured MCP servers
  ansible.builtin.set_fact:
    configured_mcp_servers: >-
      {{ mcp_list_output.stdout_lines
         | default([])
         | map('regex_replace', '^([^:]+):.*', '\1')
         | list }}

- name: Check for missing MCP servers
  ansible.builtin.set_fact:
    missing_mcp_servers: >-
      {{ legacy_claude_mcp_servers.keys() | list | difference(configured_mcp_servers) }}

- name: Report MCP server status
  ansible.builtin.debug:
    msg: |
      Claude MCP Server Status:
      - Configured servers: {{ configured_mcp_servers | join(', ') or 'None' }}
      - Missing servers: {{ missing_mcp_servers | join(', ') or 'None ✅' }}
      - Auto-apply: {{ legacy_claude_mcp_auto_apply | ternary('Enabled', 'Disabled') }}

- name: Check if MCP configuration changes are needed
  ansible.builtin.command: "{{ role_path }}/files/apply_mcp_config.py --check --json-output"
  register: mcp_check_result
  failed_when: false
  changed_when: false

- name: Parse MCP check results
  ansible.builtin.set_fact:
    mcp_changes_needed: >-
      {{ (mcp_check_result.stdout | from_json).changed | default(false)
         if mcp_check_result.stdout else false }}
    mcp_check_data: "{{ mcp_check_result.stdout | from_json if mcp_check_result.stdout else {} }}"
  when: mcp_check_result.rc == 0 or mcp_check_result.rc == 1

- name: Extract MCP server lists
  ansible.builtin.set_fact:
    mcp_servers_to_add: "{{ (mcp_check_data | default({})).servers_added | default([]) }}"
    mcp_servers_to_update: "{{ (mcp_check_data | default({})).servers_updated | default([]) }}"
  when: mcp_check_result.rc == 0 or mcp_check_result.rc == 1

- name: Handle MCP check failure
  ansible.builtin.fail:
    msg: |
      Failed to check MCP configuration:
      stdout: {{ mcp_check_result.stdout }}
      stderr: {{ mcp_check_result.stderr }}
      rc: {{ mcp_check_result.rc }}
  when: mcp_check_result.rc not in [0, 1]

- name: Apply MCP configuration if enabled
  when:
    - legacy_claude_mcp_auto_apply | bool
    - mcp_changes_needed | default(false) | bool
  block:
    - name: Reset MCP apply data
      ansible.builtin.set_fact:
        mcp_apply_data: {}

    - name: Apply MCP configuration using Python script
      ansible.builtin.command: "{{ role_path }}/files/apply_mcp_config.py --json-output"
      register: apply_result
      changed_when: (apply_result.stdout | from_json).changed | default(false)

    - name: Parse MCP apply result
      ansible.builtin.set_fact:
        mcp_apply_data: "{{ apply_result.stdout | from_json if apply_result.stdout else {} }}"
      when: apply_result.stdout | default('') | length > 0
      notify: show mcp config changes

- name: Fail if MCP servers are not configured and auto-apply is disabled
  ansible.builtin.fail:
    msg: |
      ⚠️  ERROR: Required Claude MCP servers are not configured!

      Servers that need to be added: {{ mcp_servers_to_add | join(', ') }}
      {%- if mcp_servers_to_update | length > 0 %}
      Servers that need to be updated: {{ mcp_servers_to_update | join(', ') }}
      {%- endif %}

      To skip all Claude tasks: ansible-playbook <hostname>.yaml --skip-tags claude
      To skip only MCP check: ansible-playbook <hostname>.yaml --skip-tags mcp

      To configure manually, run:
        {{ role_path }}/files/apply_mcp_config.py

      Or enable auto-apply by setting:
        legacy_claude_mcp_auto_apply: true

      Note: This will modify your ~/.claude.json configuration.
  when:
    - not legacy_claude_mcp_auto_apply | bool
    - mcp_changes_needed | default(false) | bool
