---
# These Node.js tools are now installed via home.nix but kept here for non-Nix systems

- name: Install Node.js CLI tools globally with pnpm
  community.general.pnpm:
    name: "{{ item }}"
    global: true
  loop:
    - '@openai/codex'
    - '@ast-grep/cli'  # For semantic code queries across multiple languages
    - 'jscpd'  # Copy/paste detector for 150+ languages including Python, TypeScript
    - 'madge'  # Dependency graph visualization tool
    - 'pyright'  # Python language server for static type checking
  tags: [pnpm]
