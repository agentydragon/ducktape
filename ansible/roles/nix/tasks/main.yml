---
- name: Install Nix dependencies
  ansible.builtin.apt:
    name:
      - curl
      - xz-utils
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Check if Nix is already installed
  ansible.builtin.stat:
    path: /nix
  register: nix_installed

- name: Download and install Nix (multi-user)
  when: not nix_installed.stat.exists
  block:
    - name: Download Nix installer
      ansible.builtin.get_url:
        url: https://nixos.org/nix/install
        dest: /tmp/install-nix.sh
        mode: "0755"

    - name: Install Nix in multi-user mode
      ansible.builtin.shell: |
        sh /tmp/install-nix.sh --daemon --yes
      become: true
      changed_when: true

    - name: Remove Nix installer
      ansible.builtin.file:
        path: /tmp/install-nix.sh
        state: absent

- name: Configure Nix
  ansible.builtin.lineinfile:
    path: /etc/nix/nix.conf
    regexp: "^{{ item.key }} ="
    line: "{{ item.key }} = {{ item.value }}"
    mode: "0644"
    create: true
    backup: true
  loop:
    - { key: "experimental-features", value: "nix-command flakes" }
    - { key: "trusted-users", value: "root {{ nix_trusted_users | default(ansible_user_id) }}" }
  become: true
  notify: restart nix-daemon

- name: Ensure nix-daemon is started and enabled
  ansible.builtin.systemd:
    name: nix-daemon
    state: started
    enabled: true
  become: true
