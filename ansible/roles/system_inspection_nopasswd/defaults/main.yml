---
# User to grant passwordless sudo for system inspection tools
system_inspection_nopasswd_user: "{{ my_user }}"

# List of read-only system inspection commands that NEED passwordless sudo
#
# KEEP IN SYNC with: nix/lib/inspection-commands.nix
#
# Structure matches Nix SSOT:
#   - sudo_any_args: Commands where any flags are safe (read-only)
#   - sudo_exact_subcommands: Commands restricted to specific safe subcommands
#   - sudo_wildcard_subcommands: Commands with safe prefix + variable trailing arg
#   - log_viewing: Commands for viewing log files (path-restricted)
#
# NOTE: Commands like hostnamectl, timedatectl have destructive flags.
# Only safe read-only subcommands are allowed.
#
# All paths are for Debian/Ubuntu systems.

# Commands where any arguments are safe (truly read-only)
system_inspection_nopasswd_sudo_any_args:
  # Hardware information (needs sudo for full access)
  - /usr/bin/lshw
  - /usr/sbin/dmidecode
  - /usr/bin/hwinfo
  - /usr/sbin/biosdecode
  - /usr/sbin/ownership
  - /usr/sbin/vpddecode
  - /usr/bin/inxi
  - /usr/bin/acpi
  - /usr/sbin/ipmi-sensors
  # System information
  - /usr/bin/uname
  # Process information (sudo for all processes)
  - /usr/sbin/iotop
  - /usr/bin/pidstat
  # Memory information
  - /usr/bin/slabtop
  # Disk information
  - /usr/sbin/blkid
  # File system information - display commands only
  - /usr/sbin/lvdisplay
  - /usr/sbin/vgdisplay
  - /usr/sbin/pvdisplay
  # Kernel information
  - /usr/sbin/modinfo
  # NOTE: dmesg and journalctl have destructive flags (-c clears buffer, --vacuum-* deletes logs)
  # On NixOS: grant access via systemd-journal group + kernel.dmesg_restrict=0
  # On non-NixOS: these are included below with restrictions if needed
  # Security information
  - /usr/sbin/aa-status
  - /usr/sbin/sestatus
  # Performance monitoring
  - /usr/bin/iostat
  - /usr/bin/mpstat
  - /usr/bin/sar

# Commands restricted to specific safe subcommands (exact match)
# Format: "command subcommand" or "command" for no-args
system_inspection_nopasswd_sudo_exact_subcommands:
  # GPU information - ONLY query subcommands
  - /usr/bin/nvidia-smi
  - /usr/bin/nvidia-smi -q
  - /usr/bin/nvidia-smi -L
  - /usr/bin/nvidia-smi pmon
  - /usr/bin/nvidia-smi dmon
  # ACPI information - ONLY query flags (not -W which modifies wakeup)
  - /usr/bin/acpitool
  - /usr/bin/acpitool -B
  - /usr/bin/acpitool -a
  - /usr/bin/acpitool -t
  - /usr/bin/acpitool -f
  - /usr/bin/acpitool -e
  # Last login information - ONLY no-args (avoids -C clear flag)
  - /usr/bin/lastlog
  # System information - ONLY read-only subcommands
  - /usr/bin/hostnamectl status
  - /usr/bin/timedatectl status
  - /usr/bin/timedatectl show
  - /usr/bin/timedatectl timesync-status
  - /usr/bin/localectl status
  - /usr/bin/loginctl list-sessions
  - /usr/bin/loginctl list-users
  - /usr/bin/bootctl status
  - /usr/bin/bootctl list
  # Firmware - ONLY query subcommands
  - /usr/bin/fwupdmgr get-devices
  - /usr/bin/fwupdmgr get-updates
  - /usr/bin/fwupdmgr get-history
  - /usr/bin/fwupdmgr get-plugins
  - /usr/bin/fwupdmgr security
  # IPMI - ONLY read-only subcommands
  - /usr/sbin/ipmitool sensor list
  - /usr/sbin/ipmitool sdr list
  - /usr/sbin/ipmitool fru print
  - /usr/sbin/ipmitool mc info
  - /usr/sbin/ipmitool lan print
  - /usr/sbin/ipmitool chassis status
  # Disk partitioning - ONLY read-only list modes
  - /usr/sbin/fdisk -l
  - /usr/sbin/parted -l
  # NVMe info - ONLY read operations
  - /usr/bin/nvme list
  # Network information - ONLY show/list operations
  - /usr/sbin/ip addr show
  - /usr/sbin/ip -s addr show
  - /usr/sbin/ip route show
  - /usr/sbin/ip -s route show
  - /usr/sbin/ip link show
  - /usr/sbin/ip -s link show
  - /usr/sbin/ip neighbor show
  - /usr/sbin/ip netns list
  # Service information - ONLY safe subcommands
  - /usr/bin/systemctl list-units
  - /usr/bin/systemctl list-unit-files
  - /usr/bin/systemctl list-timers
  - /usr/bin/systemctl list-sockets
  # File systems - ONLY read commands
  - /usr/bin/zfs list
  - /usr/bin/zpool status
  - /usr/bin/zpool list
  - /usr/bin/btrfs filesystem show
  - /usr/bin/btrfs device stats
  # Package managers - ONLY list modes
  - /usr/bin/apt list
  - /usr/bin/dpkg -l
  - /usr/bin/snap list
  - /usr/bin/flatpak list
  # System control - ONLY read modes
  - /usr/sbin/sysctl -a
  - /usr/sbin/sysctl -N
  # Firewall - ONLY list/show modes
  - /usr/bin/firewall-cmd --list-all
  - /usr/sbin/iptables -L
  - /usr/sbin/iptables -S
  - /usr/sbin/ip6tables -L
  - /usr/sbin/ip6tables -S
  - /usr/sbin/nft list ruleset
  # Container/VM - ONLY read-only info
  - /usr/bin/docker ps
  - /usr/bin/docker images
  - /usr/bin/docker info
  - /usr/bin/docker version
  - /usr/bin/podman ps
  - /usr/bin/podman images
  - /usr/bin/virsh list
  - /usr/bin/qm list

# Commands with safe prefix + variable trailing argument (wildcard match)
# Format: "command prefix" - will be expanded to "command prefix *"
system_inspection_nopasswd_sudo_wildcard_subcommands:
  # Session/user info - needs session/user ID
  - /usr/bin/loginctl show-session
  - /usr/bin/loginctl show-user
  - /usr/bin/loginctl session-status
  - /usr/bin/loginctl user-status
  # SMART disk info - needs device path
  - /usr/sbin/smartctl -a
  - /usr/sbin/smartctl -H
  - /usr/sbin/smartctl -i
  - /usr/sbin/smartctl -l
  # NVMe info - needs device path
  - /usr/bin/nvme smart-log
  - /usr/bin/nvme id-ctrl
  - /usr/bin/nvme id-ns
  # Service status - needs service name
  - /usr/bin/systemctl status
  - /usr/bin/systemctl show
  # System control - read specific variable
  - /usr/sbin/sysctl -n
  # Proxmox - needs path argument
  - /usr/bin/pvesh get
  # Performance monitoring - needs args
  - /usr/bin/perf stat
  - /usr/bin/perf top

# Log viewing commands with path restrictions
# These are separate because Claude Code cannot express path restrictions
system_inspection_nopasswd_log_viewing:
  - /usr/bin/tail -f /var/log/*
  - /usr/bin/head /var/log/*
  - /usr/bin/cat /var/log/*
  - /usr/bin/less /var/log/*
  - /usr/bin/zcat /var/log/*.gz
  - /usr/bin/bzcat /var/log/*.bz2

# Combined list for backward compatibility with existing templates
# This will be generated by the tasks from the above lists
system_inspection_nopasswd_commands: []
