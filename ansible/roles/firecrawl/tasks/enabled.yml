---
# Enable (install & run) Firecrawl via Docker Compose

- name: Ensure python3-pip is present (docker SDK dep)
  become: true
  ansible.builtin.apt:
    name: python3-pip
    state: present

# ---------------------------------------------------------------------------
# Prepare project directory with compose files
# ---------------------------------------------------------------------------

- name: Create Firecrawl Docker Compose directory on host
  become: true
  ansible.builtin.file:
    path: "{{ firecrawl_project_path }}"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Copy docker-compose files for Firecrawl
  become: true
  ansible.builtin.copy:
    src: "docker-compose.yml"
    dest: "{{ firecrawl_project_path }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# ---------------------------------------------------------------------------
# Start / recreate the stack (pull latest images, etc.)
# ---------------------------------------------------------------------------

# First, always stop and remove any existing containers to ensure clean state
- name: Stop and remove any existing Firecrawl containers
  become: true
  block:
    - name: Check what's using port 3002 before cleanup
      ansible.builtin.shell: |
        lsof -i :3002 || true
        docker ps --filter "publish=3002" || true
      register: port_check_before
      failed_when: false
      changed_when: false

    - name: Show what's using port 3002
      ansible.builtin.debug:
        msg: "{{ port_check_before.stdout_lines }}"

    - name: Find all containers with firecrawl in name
      ansible.builtin.shell: |
        set -o pipefail
        docker ps -aq --filter "name=firecrawl" | xargs -r docker stop
        docker ps -aq --filter "name=firecrawl" | xargs -r docker rm
      register: cleanup_result
      failed_when: false  # Don't fail if no containers found
      changed_when: cleanup_result.stdout != ""

    - name: Ensure firecrawl compose project is fully down
      community.docker.docker_compose_v2:
        project_src: "{{ firecrawl_project_path }}"
        project_name: firecrawl  # Explicitly set project name
        state: absent
        remove_orphans: true
      failed_when: false  # Don't fail if project doesn't exist

    - name: Verify Firecrawl port is now free {{ firecrawl_port }}
      ansible.builtin.shell: |
        lsof -i :{{ firecrawl_port }} || echo "Port {{ firecrawl_port }} is free"
      register: port_check_after
      failed_when: false
      changed_when: false

    - name: Show port status after cleanup
      ansible.builtin.debug:
        msg: "{{ port_check_after.stdout_lines }}"

- name: Start Firecrawl services fresh
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ firecrawl_project_path }}"
    project_name: firecrawl  # Explicitly set project name to avoid directory-based naming
    pull: always     # pull updated images
    recreate: always # pick up any env / compose modifications
    remove_orphans: true  # Remove containers for services not in compose file
    state: present  # Ensure services are running
  register: firecrawl_compose

- name: Show compose output (verbosity 1)
  ansible.builtin.debug:
    var: firecrawl_compose
    verbosity: 1

- name: Wait for Firecrawl API to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ firecrawl_port }}/"
    status_code: 200
  register: result
  until: result.status == 200
  retries: 30
  delay: 2

- name: Display Firecrawl access information
  ansible.builtin.debug:
    msg:
      - "Firecrawl is now running!"
      - "API endpoint: http://localhost:{{ firecrawl_port }}"
      - "Test API key: {{ firecrawl_test_api_key }}"
      - "You can test with: curl http://localhost:{{ firecrawl_port }}/"
