---
# Install and configure tailscale client

# Debian/Ubuntu installation tasks - skipped on NixOS (uses services.tailscale.enable)
- name: Add tailscale apt key
  ansible.builtin.apt_key:
    url: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg
    keyring: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present
  become: true
  when: ansible_os_family == "Debian"
  tags: [tailscale, install]

- name: Add tailscale repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/ubuntu jammy main
    state: present
    filename: tailscale
  become: true
  when: ansible_os_family == "Debian"
  tags: [tailscale, install]

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  become: true
  when: ansible_os_family == "Debian"
  tags: [tailscale, install]

- name: Prevent NetworkManager from managing tailscale0
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/99-tailscale-unmanaged.conf
    content: |
      # Prevent NM from managing the Tailscale tun interface.
      # Without this, NM auto-assumes tailscale0 and on NM restart
      # pushes empty DNS config to systemd-resolved, overwriting
      # Tailscale's MagicDNS settings (100.100.100.100).
      [keyfile]
      unmanaged-devices=interface-name:tailscale0
    owner: root
    group: root
    mode: "0644"
  become: true
  when: ansible_os_family == "Debian"
  notify: Restart NetworkManager
  tags: [tailscale, install]

- name: Start and enable tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
  become: true
  when: ansible_os_family == "Debian"
  tags: [tailscale, install]

- name: Check current tailscale status
  ansible.builtin.command: tailscale status
  register: tailscale_client_status_pre
  failed_when: false
  changed_when: false
  tags: [tailscale, status]

- name: Determine if tailscale registration is required
  ansible.builtin.set_fact:
    tailscale_client_registration_required: "{{ tailscale_client_status_pre.rc != 0 }}"
  tags: [tailscale, status]

- name: Auto-generate headscale auth key (optional)
  ansible.builtin.shell: |
    set -o pipefail
    sg headscale -c 'headscale preauthkeys create \
      --user {{ headscale_register_user }} --ephemeral \
      --expiration 1h --output json | jq -r ".key"'
  args:
    executable: /bin/bash
  delegate_to: "{{ headscale_delegate_host }}"
  vars:
    ansible_user: root
  register: tailscale_client_headscale_authkey_result
  changed_when: tailscale_client_headscale_authkey_result.rc == 0
  when:
    - tailscale_client_registration_required | default(true)
    - headscale_auto_register | default(false)
    - (tailscale_client_authkey | default('') | trim) | length == 0
  tags: [tailscale, connect]

- name: Record generated headscale auth key
  ansible.builtin.set_fact:
    tailscale_client_authkey: "{{ tailscale_client_headscale_authkey_result.stdout | trim }}"
  when:
    - tailscale_client_registration_required | default(true)
    - headscale_auto_register | default(false)
    - tailscale_client_headscale_authkey_result is defined
    - tailscale_client_headscale_authkey_result.rc is defined
    - tailscale_client_headscale_authkey_result.rc == 0
    - (tailscale_client_headscale_authkey_result.stdout | default('') | trim) | length > 0
  tags: [tailscale, connect]

- name: Get machine registration info
  ansible.builtin.shell: |
    timeout {{ tailscale_dry_run_timeout | default(30) }} \
      bash -c '
        tailscale up --login-server={{ tailscale_client_headscale_server_url }} \
          --hostname={{ inventory_hostname }} \
          --accept-routes --dry-run 2>&1 \
        || tailscale status 2>&1
      '
  become: true
  register: tailscale_client_info
  failed_when: false
  when: tailscale_client_registration_required | default(true)
  changed_when: false
  tags: [tailscale, info]

- name: Extract machine key from info
  ansible.builtin.set_fact:
    tailscale_client_machine_key: "{{ tailscale_client_info.stderr | regex_search('mkey:[a-f0-9]+') }}"
  when: tailscale_client_info.stderr is defined and 'mkey:' in tailscale_client_info.stderr
  tags: [tailscale, info]

- name: Display registration instructions (if needed)
  ansible.builtin.debug:
    msg: |
      ====================================================================
      TAILSCALE REGISTRATION INFO
      ====================================================================

      Machine key: {{ tailscale_client_machine_key | default('Not found') }}

      If registration is needed, run on headscale server:
      ssh root@{{ headscale_server_host | default('agentydragon.com') }} \
        "headscale nodes register --user agentydragon --key {{ tailscale_client_machine_key | default('MACHINE_KEY') }}"

      Registration URL (if shown): Look for https://agentydragon.com:8080/register/mkey:...
      ====================================================================
  when: tailscale_client_machine_key is defined
  tags: [tailscale, info]

- name: Stop existing wireguard if running
  ansible.builtin.command: >-
    timeout {{ tailscale_wg_stop_timeout | default(30) }} systemctl stop wg-quick@wg0
  become: true
  register: tailscale_client_wg_stop_cmd
  changed_when: tailscale_client_wg_stop_cmd.rc == 0
  failed_when: false # Service may not exist
  when: tailscale_client_registration_required | default(true)
  tags: [tailscale, migrate]

- name: Disable wireguard service
  ansible.builtin.systemd:
    name: "wg-quick@wg0"
    state: stopped
    enabled: false
  become: true
  failed_when: false # Service may not exist
  when: tailscale_client_registration_required | default(true)
  tags: [tailscale, migrate]

- name: Connect to headscale
  ansible.builtin.shell: |
    timeout {{ tailscale_up_timeout | default(30) }} \
      tailscale up \
        --login-server={{ tailscale_client_headscale_server_url }} \
        --hostname={{ inventory_hostname }} \
        --accept-routes{% if tailscale_client_authkey | default('') | trim %}
        --authkey {{ tailscale_client_authkey | trim }}{% endif %}
  become: true
  register: tailscale_client_up
  changed_when: tailscale_client_up.rc == 0
  failed_when: false
  async: 45
  poll: 5
  when: tailscale_client_registration_required | default(true)
  tags: [tailscale, connect]

- name: Auto-register machine key with headscale (if auto-register enabled)
  ansible.builtin.shell: |
    sg headscale -c 'headscale nodes register \
      --user {{ headscale_register_user }} \
      --key {{ tailscale_client_up.stderr | regex_search("mkey:[a-f0-9]+") }}'
  delegate_to: "{{ headscale_delegate_host }}"
  vars:
    ansible_user: root
  register: tailscale_client_headscale_register_result
  when:
    - tailscale_client_registration_required | default(true)
    - headscale_auto_register | default(false)
    - tailscale_client_up is defined
    - tailscale_client_up.rc != 0
    - tailscale_client_up.stderr is defined
    - "'mkey:' in tailscale_client_up.stderr"
  changed_when: true
  tags: [tailscale, connect]

- name: Retry tailscale up after registration
  ansible.builtin.shell: |
    timeout {{ tailscale_up_timeout | default(30) }} \
      tailscale up \
        --login-server={{ tailscale_client_headscale_server_url }} \
        --hostname={{ inventory_hostname }} \
        --accept-routes
  become: true
  register: tailscale_client_up_retry
  when:
    - tailscale_client_headscale_register_result is defined
    - tailscale_client_headscale_register_result is succeeded
  changed_when: true
  tags: [tailscale, connect]

- name: Handle tailscale up failure
  ansible.builtin.fail:
    msg: |-
      tailscale up failed (rc={{ tailscale_client_up.rc }}) when registering {{ inventory_hostname }}.
      Command: timeout {{ tailscale_up_timeout | default(30) }} tailscale up \
        --login-server={{ tailscale_client_headscale_server_url }} \
        --hostname={{ inventory_hostname }} \
        --accept-routes{% if tailscale_client_authkey | default('') | trim %}
        --authkey {{ tailscale_client_authkey | trim }}{% endif %}

      STDOUT:
      {{ tailscale_client_up.stdout | default('') }}

      STDERR:
      {{ tailscale_client_up.stderr | default('') }}

      {% if headscale_auto_register | default(false) %}
      Auto-registration attempted: {{ 'Success' if tailscale_client_headscale_register_result is
        defined and tailscale_client_headscale_register_result is succeeded else 'Failed' }}
      {% endif %}

      Suggested manual steps:
        1. SSH to {{ inventory_hostname }} and rerun the tailscale up command
           without timeout to see prompts.
        2. Check `journalctl -u tailscaled -n 50` for context.
        3. Verify the auth key is valid and that {{ tailscale_client_headscale_server_url }}
           presents a valid TLS certificate.
        {% if "'mkey:' in (tailscale_client_up.stderr | default(''))" %}
        4. Or manually register:
           ssh {{ headscale_delegate_host }} "headscale nodes register --user
           {{ headscale_register_user }} --key
           {{ tailscale_client_up.stderr | regex_search('mkey:[a-f0-9]+') }}"
        {% endif %}

      After completing the manual steps, rerun this playbook.
  when:
    - tailscale_client_up is defined
    - tailscale_client_up.rc is defined
    - tailscale_client_up.rc != 0
    - tailscale_client_registration_required | default(true)
    - not (tailscale_client_headscale_register_result is defined and
      tailscale_client_headscale_register_result is succeeded and
      tailscale_client_up_retry is defined and
      tailscale_client_up_retry.rc == 0)
  tags: [tailscale, connect]

- name: Extract machine key from registration output
  ansible.builtin.set_fact:
    tailscale_client_machine_key: "{{ tailscale_client_up.stderr | regex_search('mkey:[a-f0-9]+') }}"
  when:
    - tailscale_client_registration_required | default(true)
    - tailscale_client_up.stderr is defined
    - "'mkey:' in tailscale_client_up.stderr"
  tags: [tailscale, connect]

- name: Display registration instructions
  ansible.builtin.debug:
    msg: |
      ====================================================================
      HEADSCALE REGISTRATION REQUIRED
      ====================================================================

      Machine key: {{ tailscale_client_machine_key | default('Not found in output') }}

      To register this machine, run on the headscale server:

      ssh root@{{ headscale_server_host | default('agentydragon.com') }} \
        "headscale nodes register --user agentydragon --key {{ tailscale_client_machine_key | default('MACHINE_KEY') }}"

      Full registration output:
      {{ tailscale_client_up.stdout | default('') }}
      {{ tailscale_client_up.stderr | default('') }}
      ====================================================================
  when:
    - tailscale_client_registration_required | default(true)
    - tailscale_client_up.rc != 0
  tags: [tailscale, connect]

- name: Check tailscale status
  ansible.builtin.shell: |
    timeout {{ tailscale_status_timeout | default(10) }} tailscale status
  register: tailscale_client_status
  failed_when: false
  changed_when: false
  tags: [tailscale, status]

- name: Ensure --accept-routes is configured (even if already registered)
  ansible.builtin.shell: |
    timeout {{ tailscale_up_timeout | default(30) }} \
      tailscale up \
        --login-server={{ tailscale_client_headscale_server_url }} \
        --hostname={{ inventory_hostname }} \
        --accept-routes
  become: true
  register: tailscale_client_ensure_routes
  changed_when: false
  failed_when: false
  when: not (tailscale_client_registration_required | default(true))
  tags: [tailscale, config]

- name: Display tailscale status
  ansible.builtin.debug:
    var: tailscale_client_status.stdout_lines
  tags: [tailscale, status]
