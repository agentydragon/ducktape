---

- name: System-wide apt lock acquire timeout (3 min)
  become: true
  copy:
    dest: /etc/apt/apt.conf.d/99locktimeout
    content: |
      DPkg::Lock::Timeout "180";

# - name: Include glab
#   include_tasks: tasks/glab.yml
# - name: Include Trilium client
#   include_tasks: tasks/trilium_client.yml

- include_tasks: tasks/bazel.yml
  vars:
    bazel_state: absent

- name: Install CLI packages
  become: true
  ansible.builtin.apt:
    pkg:
      # removed 2024-04-13, defaults in pop os:
      #   diffutils
      - curl
      - ffmpeg
      - gnupg
      - gnupg-agent
      - gnuplot
      - grep
      - gzip
      - htop
      - iftop
      - iotop
      - iputils-ping
      - libsecret-tools  # for secret-tool, for Ansible Vault
      - locate
      - mc
      - mmv
      - mosh
      - ncdu
      - neovim
      - netcat-openbsd
      - nethogs
      - nmap
      - pkg-config
      - pv
      - pwgen
      - python3
      - python3-pip
      - rcm
      - ripgrep
      - screen
      - sed
      - sqlite3
      - tmux
      - tree
      - unrar
      - wget
      - xxd
      - yasm
      - zsh

# Modern systems require using pipx or apt for Python CLI tools
- name: Install pipx for Python CLI tools
  become: true
  ansible.builtin.apt:
    pkg:
      - pipx
    state: latest

# Move speedtest-cli installation to user level
# (Handled in dev-env-user.yml with other user tools)

- name: Remove retired pkgs
  become: true
  ansible.builtin.apt:
    pkg:
      - silversearcher-ag  # I replaced with rg

      - hyphen-en-ca
      - hyphen-en-gb
    state: absent

- name: Install snaps
  become: true
  snap:
    name: tio
    classic: true

# needed for OpenAI Codex CLI, vim-copilot
- include_tasks: tasks/nodejs.yml

# Set up oh-my-zsh
- name: Clone oh-my-zsh
  tags: [oh-my-zsh, zsh]
  git:
    # TODO(agentydragon): shallow clone
    repo: https://github.com/robbyrussell/oh-my-zsh
    dest: "/home/{{ my_user | default(ansible_user_id) }}/.oh-my-zsh"
  become: true
  become_user: "{{ my_user | default(ansible_user_id) }}"

# Set zsh as default shell
- name: Set zsh as login shell
  become: true
  tags: [zsh]
  user:
    name: "{{ my_user | default(ansible_user_id) }}"
    shell: /bin/zsh

# Deploy dotfiles before dev-env to ensure npmrc is in place
- import_tasks: tasks/dotfiles.yml

- import_tasks: tasks/dev-env.yml

- name: Check Neovim is >= 0.11 (for DEC mode 2031 for auto color scheme switching)
  block:
  - name: Get Neovim version
    command: nvim --version
    register: raw_nvim_version
    changed_when: false

  - name: Parse clean Neovim version string (strip prefix and suffix)
    set_fact:
      nvim_version_string: "{{ raw_nvim_version.stdout_lines[0] | regex_replace('^NVIM v(\\d+\\.\\d+(?:\\.\\d+)?).*', '\\1') }}"

  - name: Fail if version parsing failed
    fail:
      msg: "Couldn't parse Neovim version from: {{ raw_nvim_version }}"
    when: nvim_version_string is not defined or nvim_version_string == ''

  - name: Assert Neovim is at least 0.11
    assert:
      that:
        - "nvim_version_string is version('0.11', '>=')"
      fail_msg: "Neovim must be at least 0.11, got {{ nvim_version_string }}"

# TODO: update Neovim Lazy plugins?

- include_tasks: tasks/locale.yml

