---
# Include system inspection sudo permissions for all systems
- name: Include system inspection sudo permissions
  ansible.builtin.import_role:
    name: system_inspection_nopasswd
  tags: [sudo, system]

- name: System-wide apt lock acquire timeout (3 min)
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99locktimeout
    mode: "0644"
    content: |
      DPkg::Lock::Timeout "180";

# - name: Include Trilium client
#   include_tasks: tasks/trilium_client.yml

- name: Remove Bazel installation
  ansible.builtin.include_tasks: tasks/bazel.yml
  vars:
    bazel_state: absent

# Migrated to Nix home-manager:
# - Neovim (programs.neovim) + version validation (moved to legacy_cli)
# - pipx tools: ansible, autopep8, speedtest-cli, pydeps (moved to legacy_cli)
# - Bazel toolchain: bazelisk (replaces bazel, moved to legacy_cli)
# - CLI utilities: mc, xxd, nethogs, mmv, gnuplot (moved to legacy_cli)
# - Removed: screen (deprecated, use tmux instead)
# - CLI packages: curl, htop, iftop, iotop, nmap, pwgen, rcm, ripgrep, wget, zsh
# - Media/network: ffmpeg, mosh
# - File utilities: ncdu, pv, tree, sqlite, gnupg
# - tmux (programs.tmux)
# - nodejs (nodejs_22), oh-my-zsh (programs.zsh.oh-my-zsh)

- name: Install CLI packages
  become: true
  ansible.builtin.apt:
    update_cache: true # deb822_repository doesn't reliably trigger apt cache update
    pkg:
      # removed 2024-04-13, defaults in pop os:
      #   diffutils
      # See consolidated migration comment above
      - ffmpeg
      - gnupg-agent # gnupg moved to Nix, but keeping agent for system integration
      - grep
      - gzip
      - iputils-ping
      - libsecret-tools # for secret-tool, for Ansible Vault
      - locate
      - netcat-openbsd
      - pkg-config
      - python3
      - python3-pip
      - sed
      - sudo # for become: agentydragon further down
      - unrar-free
      - yasm
- name: Remove retired pkgs
  become: true
  ansible.builtin.apt:
    pkg:
      - hyphen-en-ca
      - hyphen-en-gb
    state: absent

- name: Ensure snapd is installed
  become: true
  ansible.builtin.apt:
    name: snapd
    state: present
  when: ansible_os_family == "Debian"

- name: Install snaps
  become: true
  community.general.snap:
    name: tio
    classic: true

# Set zsh as default shell
- name: Set zsh as login shell
  become: true
  tags: [zsh]
  ansible.builtin.user:
    name: "{{ cli_effective_user }}"
    shell: /bin/zsh

# Remove default Ubuntu directories (only if empty)
# Custom dirs are configured via xdg.userDirs in nix/home/home.nix
- name: Check if default Ubuntu directories are empty
  ansible.builtin.find:
    paths: "/home/{{ cli_effective_user }}/{{ item }}"
    file_type: any
  loop:
    - Desktop
    - Documents
    - Downloads
    - Music
    - Pictures
    - Public
    - Templates
    - Videos
  register: cli_dir_contents
  become: true
  become_user: "{{ cli_effective_user }}"
  failed_when: false # Don't fail if directory doesn't exist

- name: Ensure default directories are either absent or empty
  ansible.builtin.file:
    path: "/home/{{ cli_effective_user }}/{{ item.item }}"
    state: absent
  when:
    - item.matched is defined
    - item.matched == 0
  loop: "{{ cli_dir_contents.results }}"
  loop_control:
    label: "{{ item.path | default('skipped') }}"
  become: true
  become_user: "{{ cli_effective_user }}"

# Deploy dotfiles before dev_env to ensure npmrc is in place
- name: Import dotfiles configuration tasks
  ansible.builtin.import_tasks: tasks/dotfiles.yml

- name: Import development environment setup tasks
  ansible.builtin.import_tasks: dev-env.yml

# TODO: update Neovim Lazy plugins? (moved to legacy_cli)

- name: Configure system locale settings
  ansible.builtin.include_tasks: tasks/locale.yml
# TODO: hyphenation patterns? hyphen-cs hyphen-de
