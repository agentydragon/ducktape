---
nebula_listen_port: 4242

# Plaintext cert files (no SOPS decryption needed)
nebula_ca_cert_file: ""
nebula_host_cert_file: ""

# SOPS binary-encrypted host private key
nebula_host_key_sops_file: ""

# Upstream DNS servers for dnsmasq (non-mesh queries)
nebula_upstream_dns:
  - "1.1.1.1"
  - "8.8.8.8"

# Path to shared mesh config (nebula-mesh.json at repo root)
nebula_mesh_config_file: "{{ playbook_dir }}/../nebula-mesh.json"
