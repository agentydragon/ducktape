---
# Install and configure Nebula mesh network + dnsmasq for hostname resolution

# Roster schema (SSOT): nebula-mesh.json is a {"hosts": {name: {...}}} map.
# We derive the same mesh values the Nix/TF consumers do (see
# nix/nixos/modules/nebula.nix, cluster/terraform/main/nebula.tf):
#   - lighthouses:      nebula_ip of every host with lighthouse=true
#   - static_host_map:  nebula_ip -> [endpoint] for every host with an endpoint
#   - peer route MTUs:   the smaller constraint declared by either endpoint
- name: Load mesh roster from nebula-mesh.json
  ansible.builtin.set_fact:
    nebula_mesh_hosts: "{{ (lookup('file', nebula_mesh_config_file) | from_json).hosts }}"
  tags: [nebula, config]

- name: Verify current host exists in mesh roster
  ansible.builtin.assert:
    that:
      - inventory_hostname in nebula_mesh_hosts
    fail_msg: "{{ inventory_hostname }} is missing from {{ nebula_mesh_config_file }}"
  tags: [nebula, config]

- name: Derive lighthouse IPs from mesh roster
  ansible.builtin.set_fact:
    nebula_lighthouses: >-
      {{ nebula_mesh_hosts.values()
         | selectattr('lighthouse', 'defined') | selectattr('lighthouse')
         | map(attribute='nebula_ip') | list }}
    nebula_static_host_map: {}
  tags: [nebula, config]

- name: Build static_host_map (nebula_ip -> [endpoint]) from mesh roster
  ansible.builtin.set_fact:
    nebula_static_host_map: "{{ nebula_static_host_map | combine({item.nebula_ip: [item.endpoint]}) }}"
  loop: "{{ nebula_mesh_hosts.values() | selectattr('endpoint', 'defined') | list }}"
  loop_control:
    label: "{{ item.nebula_ip }} -> {{ item.endpoint }}"
  tags: [nebula, config]

- name: Remove Debian nebula package (dfsg build lacks v2 cert support)
  ansible.builtin.apt:
    name: nebula
    state: absent
    purge: true
  tags: [nebula, install]

- name: Install nebula binary from GitHub
  github_release_install:
    release_spec:
      repo: "slackhq/nebula"
      version: "latest"
      asset_pattern: "nebula-linux-amd64\\.tar\\.gz$"
    method:
      name: archive
      dest_path: /usr/local/bin/nebula
      extract_file: nebula
  notify: Restart nebula
  tags: [nebula, install]

- name: Install Nebula peer route dependency
  ansible.builtin.apt:
    name: iproute2
    state: present
  tags: [nebula, install]

- name: Install nebula-cert binary from GitHub
  github_release_install:
    release_spec:
      repo: "slackhq/nebula"
      version: "latest"
      asset_pattern: "nebula-linux-amd64\\.tar\\.gz$"
    method:
      name: archive
      dest_path: /usr/local/bin/nebula-cert
      extract_file: nebula-cert
  tags: [nebula, install]

- name: Deploy Nebula peer route setup
  ansible.builtin.template:
    src: peer-routes.sh.j2
    dest: "{{ nebula_peer_route_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart nebula
  tags: [nebula, install, config]

- name: Deploy nebula systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nebula@.service
    content: |
      [Unit]
      Description=Nebula mesh network (%i)
      Wants=basic.target network-online.target
      After=basic.target network-online.target

      [Service]
      SyslogIdentifier=nebula-%i
      ExecReload=/bin/kill -HUP $MAINPID
      ExecStart=/usr/local/bin/nebula -config /etc/nebula/%i.yaml
      ExecStartPost={{ nebula_peer_route_script_path }}
      Restart=always

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Restart nebula
  tags: [nebula, install]

- name: Apply sops tools role
  ansible.builtin.import_role:
    name: sops_tools
  tags: [nebula, sops]

- name: Convert host SSH key to age key for sops decryption
  ansible.builtin.shell: |
    ssh-to-age -private-key -i /etc/ssh/ssh_host_ed25519_key
  register: nebula_age_key
  changed_when: false
  no_log: true
  tags: [nebula, secrets]

- name: Decrypt Nebula host key with sops (binary format)
  ansible.builtin.shell: |
    SOPS_AGE_KEY={{ nebula_age_key.stdout }} sops decrypt {{ nebula_host_key_sops_file }}
  register: nebula_host_key_raw
  changed_when: false
  no_log: true
  tags: [nebula, secrets]

- name: Create /etc/nebula directory
  ansible.builtin.file:
    path: /etc/nebula
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [nebula, config]

- name: Deploy Nebula CA certificate
  ansible.builtin.copy:
    src: "{{ nebula_ca_cert_file }}"
    dest: /etc/nebula/ca.crt
    owner: root
    group: root
    mode: "0644"
  notify: Restart nebula
  tags: [nebula, config]

- name: Deploy Nebula host certificate
  ansible.builtin.copy:
    src: "{{ nebula_host_cert_file }}"
    dest: /etc/nebula/host.crt
    owner: root
    group: root
    mode: "0644"
  notify: Restart nebula
  tags: [nebula, config]

- name: Deploy Nebula host key
  ansible.builtin.copy:
    content: "{{ nebula_host_key_raw.stdout }}"
    dest: /etc/nebula/host.key
    owner: root
    group: root
    mode: "0600"
  notify: Restart nebula
  tags: [nebula, config]

- name: Deploy Nebula configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/nebula/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart nebula
  tags: [nebula, config]

- name: Enable and start nebula service
  ansible.builtin.systemd:
    name: nebula@config
    state: started
    enabled: true
  tags: [nebula, service]

# dnsmasq for bare hostname resolution via Nebula lighthouse DNS

- name: Install dnsmasq
  ansible.builtin.apt:
    name: dnsmasq
    state: present
  tags: [nebula, dns]

- name: Deploy dnsmasq Nebula DNS configuration
  ansible.builtin.template:
    src: dnsmasq-nebula.conf.j2
    dest: /etc/dnsmasq.d/nebula.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart dnsmasq
  tags: [nebula, dns]

- name: Configure resolv.conf to use local dnsmasq
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (nebula role)
      # dnsmasq forwards to Nebula lighthouses + upstream DNS
      nameserver 127.0.0.1
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
  tags: [nebula, dns]

- name: Prevent dhclient from overwriting resolv.conf
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Managed by Ansible (nebula role)
      # Prevent DHCP lease renewal from overwriting resolv.conf —
      # dnsmasq handles DNS forwarding.
      make_resolv_conf() { :; }
    dest: /etc/dhcp/dhclient-enter-hooks.d/nodnsupdate
    owner: root
    group: root
    mode: "0755"
  tags: [nebula, dns]

- name: Remove resolvconf package (replaced by dnsmasq)
  ansible.builtin.apt:
    name: resolvconf
    state: absent
  tags: [nebula, dns]

- name: Enable and start dnsmasq service
  ansible.builtin.systemd:
    name: dnsmasq
    state: started
    enabled: true
  tags: [nebula, dns]
