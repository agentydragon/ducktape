---
# Install and configure Nebula mesh network + dnsmasq for hostname resolution

- name: Load mesh topology from nebula-mesh.json
  ansible.builtin.set_fact:
    nebula_mesh_config: "{{ lookup('file', nebula_mesh_config_file) | from_json }}"
  tags: [nebula, config]

- name: Set lighthouse vars from mesh config
  ansible.builtin.set_fact:
    nebula_lighthouses: "{{ nebula_mesh_config.lighthouse_ips }}"
    nebula_static_host_map: "{{ nebula_mesh_config.static_host_map }}"
  tags: [nebula, config]

- name: Remove Debian nebula package (dfsg build lacks v2 cert support)
  ansible.builtin.apt:
    name: nebula
    state: absent
    purge: true
  tags: [nebula, install]

- name: Install nebula binary from GitHub
  github_release_install:
    release_spec:
      repo: "slackhq/nebula"
      version: "latest"
      asset_pattern: "nebula-linux-amd64\\.tar\\.gz$"
    method:
      name: archive
      dest_path: /usr/local/bin/nebula
      extract_file: nebula
  notify: Restart nebula
  tags: [nebula, install]

- name: Install nebula-cert binary from GitHub
  github_release_install:
    release_spec:
      repo: "slackhq/nebula"
      version: "latest"
      asset_pattern: "nebula-linux-amd64\\.tar\\.gz$"
    method:
      name: archive
      dest_path: /usr/local/bin/nebula-cert
      extract_file: nebula-cert
  tags: [nebula, install]

- name: Deploy nebula systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nebula@.service
    content: |
      [Unit]
      Description=Nebula mesh network (%i)
      Wants=basic.target network-online.target
      After=basic.target network-online.target

      [Service]
      SyslogIdentifier=nebula-%i
      ExecReload=/bin/kill -HUP $MAINPID
      ExecStart=/usr/local/bin/nebula -config /etc/nebula/%i.yaml
      Restart=always

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Restart nebula
  tags: [nebula, install]

- name: Install sops binary
  github_release_install:
    release_spec:
      repo: "getsops/sops"
      version: "latest"
      asset_pattern: "sops-.*\\.linux\\.amd64$"
    method:
      name: binary
      dest_path: /usr/local/bin/sops
  tags: [nebula, sops]

- name: Install ssh-to-age binary
  github_release_install:
    release_spec:
      repo: "Mic92/ssh-to-age"
      version: "latest"
      asset_pattern: "ssh-to-age\\.linux-amd64$"
    method:
      name: binary
      dest_path: /usr/local/bin/ssh-to-age
  tags: [nebula, sops]

- name: Convert host SSH key to age key for sops decryption
  ansible.builtin.shell: |
    ssh-to-age -private-key -i /etc/ssh/ssh_host_ed25519_key
  register: nebula_age_key
  changed_when: false
  no_log: true
  tags: [nebula, secrets]

- name: Decrypt Nebula host key with sops (binary format)
  ansible.builtin.shell: |
    SOPS_AGE_KEY={{ nebula_age_key.stdout }} sops decrypt {{ nebula_host_key_sops_file }}
  register: nebula_host_key_raw
  changed_when: false
  no_log: true
  tags: [nebula, secrets]

- name: Create /etc/nebula directory
  ansible.builtin.file:
    path: /etc/nebula
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [nebula, config]

- name: Deploy Nebula CA certificate
  ansible.builtin.copy:
    src: "{{ nebula_ca_cert_file }}"
    dest: /etc/nebula/ca.crt
    owner: root
    group: root
    mode: "0644"
  notify: Restart nebula
  tags: [nebula, config]

- name: Deploy Nebula host certificate
  ansible.builtin.copy:
    src: "{{ nebula_host_cert_file }}"
    dest: /etc/nebula/host.crt
    owner: root
    group: root
    mode: "0644"
  notify: Restart nebula
  tags: [nebula, config]

- name: Deploy Nebula host key
  ansible.builtin.copy:
    content: "{{ nebula_host_key_raw.stdout }}"
    dest: /etc/nebula/host.key
    owner: root
    group: root
    mode: "0600"
  notify: Restart nebula
  tags: [nebula, config]

- name: Deploy Nebula configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/nebula/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart nebula
  tags: [nebula, config]

- name: Enable and start nebula service
  ansible.builtin.systemd:
    name: nebula@config
    state: started
    enabled: true
  tags: [nebula, service]

# dnsmasq for bare hostname resolution via Nebula lighthouse DNS

- name: Install dnsmasq
  ansible.builtin.apt:
    name: dnsmasq
    state: present
  tags: [nebula, dns]

- name: Deploy dnsmasq Nebula DNS configuration
  ansible.builtin.template:
    src: dnsmasq-nebula.conf.j2
    dest: /etc/dnsmasq.d/nebula.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart dnsmasq
  tags: [nebula, dns]

- name: Configure resolv.conf to use local dnsmasq
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (nebula role)
      # dnsmasq forwards to Nebula lighthouses + upstream DNS
      nameserver 127.0.0.1
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
  tags: [nebula, dns]

- name: Remove resolvconf package (replaced by dnsmasq)
  ansible.builtin.apt:
    name: resolvconf
    state: absent
  tags: [nebula, dns]

- name: Enable and start dnsmasq service
  ansible.builtin.systemd:
    name: dnsmasq
    state: started
    enabled: true
  tags: [nebula, dns]
