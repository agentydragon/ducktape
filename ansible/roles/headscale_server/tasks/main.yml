---
# Install and configure headscale

- name: Create headscale group
  ansible.builtin.group:
    name: headscale
    system: true
  tags: [headscale, install]

- name: Create headscale user
  ansible.builtin.user:
    name: headscale
    group: headscale
    home: /var/lib/headscale
    shell: /bin/false
    system: true
    create_home: true
  tags: [headscale, install]

- name: Add root to headscale group for administration
  ansible.builtin.user:
    name: root
    groups: headscale
    append: true
  tags: [headscale]

- name: Create headscale config directory
  ansible.builtin.file:
    path: /etc/headscale
    state: directory
    owner: headscale
    group: headscale
    mode: "0755"
  tags: [headscale, install]

- name: Download headscale binary
  ansible.builtin.get_url:
    url: >-
      https://github.com/juanfont/headscale/releases/download/v{{ headscale_server_version
      }}/headscale_{{ headscale_server_version }}_linux_amd64
    dest: /usr/local/bin/headscale
    owner: root
    group: root
    mode: "0755"
  tags: [headscale, install]

- name: Generate noise private key
  ansible.builtin.shell: |
    /usr/local/bin/headscale generate private-key > /var/lib/headscale/noise_private.key
    chown headscale:headscale /var/lib/headscale/noise_private.key
    chmod 600 /var/lib/headscale/noise_private.key
  args:
    creates: /var/lib/headscale/noise_private.key
  tags: [headscale]

- name: Generate headscale configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/headscale/config.yaml
    owner: headscale
    group: headscale
    mode: "0644"
  notify: Restart Headscale
  tags: [headscale]

- name: Deploy headscale ACL policy
  ansible.builtin.copy:
    src: policy.json
    dest: /etc/headscale/policy.json
    owner: headscale
    group: headscale
    mode: "0644"
  notify: Restart Headscale
  tags: [headscale]

- name: Create headscale systemd service
  ansible.builtin.template:
    src: headscale.service.j2
    dest: /etc/systemd/system/headscale.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload Systemd
    - Restart Headscale
  tags: [headscale, service]

- name: Enable and start headscale service
  ansible.builtin.systemd:
    name: headscale
    enabled: true
    state: started
    daemon_reload: true
  tags: [headscale, service]

- name: Check headscale service status
  ansible.builtin.systemd:
    name: headscale
  register: headscale_server_status
  tags: [headscale, service]

- name: Display headscale service status
  ansible.builtin.debug:
    var: headscale_server_status.status
  tags: [headscale, service]

- name: Wait for headscale health endpoint
  ansible.builtin.uri:
    url: "https://{{ headscale_server_health_host }}:8080/health"
    method: GET
    status_code: 200
    validate_certs: true
    timeout: 5
  register: headscale_server_health
  until: headscale_server_health.status is defined and headscale_server_health.status == 200
  retries: 10
  delay: 3
  failed_when: false
  tags: [headscale, service]

- name: Verify headscale health endpoint
  ansible.builtin.assert:
    that:
      - headscale_server_health.status is defined
      - headscale_server_health.status == 200
    fail_msg: >-
      Headscale health endpoint did not return HTTP 200 after the configured retries.
      Last response: {{ headscale_server_health }}
  tags: [headscale, service]

# Static IP assignments for split-horizon DNS
# Headscale doesn't support static IP assignment via API, so we modify the DB directly.
# This is idempotent and only restarts Headscale if the IP actually changes.
- name: Set static Tailnet IP for atlas (100.64.1.30)
  ansible.builtin.shell: |
    set -euo pipefail
    current_ip=$(sqlite3 /var/lib/headscale/db.sqlite \
      "SELECT ipv4 FROM nodes WHERE given_name = 'atlas'")
    if [ "$current_ip" != "100.64.1.30" ]; then
      sqlite3 /var/lib/headscale/db.sqlite \
        "UPDATE nodes SET ipv4 = '100.64.1.30' WHERE given_name = 'atlas'"
      echo "changed"
    else
      echo "ok"
    fi
  args:
    executable: /bin/bash
  register: headscale_server_atlas_ip_result
  changed_when: "'changed' in headscale_server_atlas_ip_result.stdout"
  failed_when: headscale_server_atlas_ip_result.rc != 0
  notify: Restart Headscale
  tags: [headscale, atlas-ip]
