---
# Create k3s VMs from template

- name: Clone VMs from template
  ansible.builtin.shell: |
    qm clone {{ k3s_vm_template | default(9000) }} {{ item.vmid }} --name {{ item.name }} --full
  loop: "{{ k3s_vms }}"
  register: clone_result
  failed_when:
    - clone_result.rc != 0
    - "'already exists' not in clone_result.stderr"
  changed_when: clone_result.rc == 0
  tags: [k3s, vm-clone]

- name: Configure VM resources
  ansible.builtin.shell: |
    qm set {{ item.vmid }} --cores {{ item.cores }} --memory {{ item.memory }}
  loop: "{{ k3s_vms }}"
  changed_when: true
  tags: [k3s, vm-config]

- name: Resize VM disks
  ansible.builtin.shell: |
    qm resize {{ item.vmid }} scsi0 {{ item.disk_size }}
  loop: "{{ k3s_vms }}"
  changed_when: true
  tags: [k3s, vm-config]

- name: Read atlas provisioning key and add marker
  ansible.builtin.shell: |
    echo "$(cat /root/.ssh/id_ed25519.pub) # TEMPORARY-ANSIBLE-PROVISIONING-KEY" > /tmp/provisioning-key.pub
  tags: [k3s, vm-config]

- name: Configure cloud-init settings
  ansible.builtin.shell: |
    qm set {{ item.vmid }} \
      --ipconfig0 ip={{ item.ip }}/{{ k3s_network_cidr }},gw={{ k3s_network_gateway }} \
      --nameserver {{ k3s_nameserver }} \
      --sshkeys /tmp/provisioning-key.pub \
      --ciuser {{ k3s_ssh_user }}
  loop: "{{ k3s_vms }}"
  changed_when: true
  tags: [k3s, vm-config]

- name: Clean up temporary key file
  ansible.builtin.file:
    path: /tmp/provisioning-key.pub
    state: absent
  tags: [k3s, vm-config]

- name: Start VMs
  ansible.builtin.shell: |
    qm start {{ item.vmid }}
  loop: "{{ k3s_vms }}"
  register: start_result
  failed_when:
    - start_result.rc != 0
    - "'already running' not in start_result.stderr"
  changed_when: start_result.rc == 0
  tags: [k3s, vm-start]

- name: Wait for cloud-init to complete
  ansible.builtin.pause:
    seconds: 60
  tags: [k3s, vm-start]
