---
# k3s role main tasks

- name: Install required packages on Proxmox host
  ansible.builtin.apt:
    name:
      - python3-proxmoxer
      - python3-requests
    state: present
  tags: [k3s, prerequisites]

- name: Check if Ubuntu cloud image template exists
  ansible.builtin.shell: |
    pvesh get \
      /nodes/{{ k3s_proxmox_node }}/qemu/{{ k3s_vm_template }} \
      --output-format json 2>/dev/null || echo '{}'
  register: template_check
  changed_when: false
  tags: [k3s, vm-creation]

- name: Download and create Ubuntu cloud image template if missing
  ansible.builtin.include_tasks: create_template.yml
  when: template_check.stdout == '{}'
  tags: [k3s, vm-creation]

- name: Create k3s VMs
  ansible.builtin.include_tasks: create_vms.yml
  tags: [k3s, vm-creation]

- name: Wait for VMs to be accessible via SSH
  ansible.builtin.wait_for:
    host: "{{ item.ip }}"
    port: 22
    delay: 30
    timeout: 300
  loop: "{{ k3s_vms }}"
  tags: [k3s, vm-creation]

# Copy SSH keys from local machine to VMs for direct access
- name: Get local SSH public key
  ansible.builtin.command: cat ~/.ssh/id_ed25519.pub
  register: local_ssh_key
  delegate_to: localhost
  changed_when: false
  tags: [k3s, ssh-setup]

- name: Add local SSH key to k3s VMs
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=no \
      {{ k3s_ssh_user }}@{{ item.ip }} \
      'echo "{{ local_ssh_key.stdout }}" >> ~/.ssh/authorized_keys'
  loop: "{{ k3s_vms }}"
  changed_when: true
  tags: [k3s, ssh-setup]

- name: Add k3s nodes to inventory for direct SSH
  ansible.builtin.add_host:
    name: "{{ item.name }}"
    groups: k3s_nodes
    ansible_host: "{{ item.ip }}"
    ansible_user: "{{ k3s_ssh_user }}"
    ansible_ssh_common_args: >-
      -o ProxyCommand='ssh -W %h:%p root@atlas'
    k3s_role: "{{ item.role }}"
  loop: "{{ k3s_vms }}"
  tags: [k3s, inventory]

- name: Install k3s on nodes
  ansible.builtin.include_tasks: install_k3s.yml
  tags: [k3s, installation]

# TODO: Fix kubectl configuration - copy task expects local file but k3s.yaml is remote
# - name: Configure kubectl access on Proxmox host
#   include_tasks: configure_kubectl.yml
#   tags: [k3s, kubectl]

- name: Configure insecure registry for k3s nodes
  ansible.builtin.include_tasks: configure_registry.yml
  tags: [k3s, registry]

# Clean up SSH access - atlas root key is only needed during provisioning
- name: Remove temporary SSH access from atlas
  include_tasks: cleanup_ssh.yml
  tags: [k3s, security, cleanup]
  when: k3s_cleanup_ssh | default(true)
