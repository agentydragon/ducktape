---
- name: Ensure no retired packages
  become: true
  ansible.builtin.apt:
    state: absent
    pkg:
      - firefox-locale-cs
      - firefox-locale-de
      - gnome-getting-started-docs-cs
      - gnome-getting-started-docs-de
      - gnome-user-docs-cs
      - gnome-user-docs-de
      - language-pack-cs
      - language-pack-cs-base
      - language-pack-de
      - language-pack-gnome-cs
      - language-pack-gnome-cs-base
      - language-pack-gnome-de
      - libreoffice-help-cs
      - libreoffice-help-de
      - libreoffice-help-en-gb
      # libreoffice-help-en-us OK
      - libreoffice-l10n-cs
      - libreoffice-l10n-de
      - libreoffice-l10n-en-gb

- name: Install GUI packages
  become: true
  ansible.builtin.apt:
    pkg:
      # Already default in Pop! OS: gnome-shell
      - kiwix # For offline Wikipedia etc.
      - openjdk-8-jdk
      - syncthing-gtk # Not available in nixpkgs, kept in apt

- name: Install Rescuetime
  tags: [rescuetime]
  become: true
  when: ansible_architecture in ["amd64", "x86_64"]
  ansible.builtin.apt:
    deb: "https://www.rescuetime.com/installers/rescuetime_current_{{ common_dpkg_arch }}.deb"

- name: Install snaps
  become: true
  community.general.snap:
    name:
      - whatsdesk

# Element external repository cleanup
- name: Remove Element.io repository and keyring
  tags: element
  become: true
  block:
    - name: Remove Element.io repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/element-io-archive-keyring.gpg]
          https://packages.element.io/debian/ default main
        filename: element-io
        state: absent
    - name: Remove Element keyring
      ansible.builtin.file:
        path: /usr/share/keyrings/element-io-archive-keyring.gpg
        state: absent

# AppImageLauncher installation with version acknowledgment
- name: Install AppImageLauncher
  github_release_install:
    release_spec:
      repo: "TheAssassin/AppImageLauncher"
      version: "v3.0.0-alpha-4" # Pinned version
      acknowledged_version: "v3.0.0-alpha-4"
      asset_pattern: ".*_{{ common_dpkg_arch }}\\.deb$"
    method: deb
  become: true
  when: common_dpkg_arch == "amd64"
  tags: appimagelauncher

- name: Configure XDG MIME type associations
  ansible.builtin.import_tasks: xdg_mime_types.yml
  tags: [mime, xdg]
