---
# Manage XDG MIME type associations
# This task queries current associations and only updates them if different

- name: Configure XDG MIME type associations
  tags:
    - mime
    - xdg
  block:
    - name: Query current MIME type associations
      ansible.builtin.command:
        cmd: "xdg-mime query default {{ item.mime_type }}"
      register: gui_current_mime_associations
      changed_when: false
      failed_when: false
      loop: "{{ gui_xdg_mime_associations | default([]) }}"
      loop_control:
        label: "{{ item.mime_type }}"

    - name: Set MIME type associations
      ansible.builtin.command:
        cmd: "xdg-mime default {{ item.item.desktop_file }} {{ item.item.mime_type }}"
      when:
        - item.item.desktop_file is defined
        - item.rc == 0 and item.stdout.strip() != item.item.desktop_file or item.rc != 0
      loop: "{{ gui_current_mime_associations.results }}"
      loop_control:
        label: "{{ item.item.mime_type }} -> {{ item.item.desktop_file | default('undefined') }}"
      changed_when: true
