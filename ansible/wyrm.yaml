---
- name: Configure wyrm machine
  hosts: wyrm
  vars_files:
    - vars/common_vars.yml
  vars:
    rcup_computer: wyrm
    # Use system Python for modules requiring python3-debian (deb822_repository)
    ansible_python_interpreter: /usr/bin/python3
  remote_user: "{{ my_user }}"

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
      become: true

    - name: Restart nix-daemon
      ansible.builtin.systemd:
        name: nix-daemon
        state: restarted
      become: true

  roles:
    - role: cli

    - role: dev_env
      tags: [dev_env]

    - role: golang
      tags: [golang, go]
      vars:
        golang_version: "1.25.0"

    - role: docker
    - role: gui
    # dev-ml migrated to Nix (renamed to dev-ml_nix_migrated)
    - role: tailscale_client
      tags: [tailscale]
    - role: k3s_client
      tags: [k3s_client]
    # - role: nvidia-guest
    #   tags: [nvidia, gpu]
    #   vars:
    #     include_ml_libraries: true

  tasks:
    # Configure Nix trusted users for devenv cache management
    - name: Configure Nix trusted users
      ansible.builtin.lineinfile:
        path: /etc/nix/nix.conf
        regexp: "^trusted-users = "
        line: "trusted-users = root agentydragon"
        create: false
        backup: true
      become: true
      tags: [nix]
      register: nix_config_changed
      notify: restart nix-daemon

    # Disable screensaver and screen blanking for headless VM
    - name: Disable GNOME screensaver and screen blanking
      become: true
      become_user: "{{ my_user }}"
      community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
      loop:
        - { key: "/org/gnome/desktop/screensaver/idle-activation-enabled", value: "false" }
        - { key: "/org/gnome/desktop/screensaver/lock-enabled", value: "false" }
        - { key: "/org/gnome/desktop/session/idle-delay", value: "uint32 0" }
        - { key: "/org/gnome/settings-daemon/plugins/power/idle-dim", value: "false" }
        - { key: "/org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type", value: "'nothing'" }
        - { key: "/org/gnome/settings-daemon/plugins/power/sleep-inactive-battery-type", value: "'nothing'" }
      tags: [vm-display]
      when: ansible_env.DISPLAY is defined

    # TODO: Disable screen blanking further?

    # Storage configuration for tankshare
    - name: Apply tankshare role
      ansible.builtin.include_role:
        name: tankshare
      tags: [storage, docker]

    - name: Ensure /code mountpoint exists
      ansible.builtin.file:
        path: /code
        state: directory
        owner: "{{ my_user }}"
        group: "{{ my_user }}"
        mode: "0775"
      become: true
      tags: [storage]

    - name: Mount code virtiofs share
      ansible.posix.mount:
        path: /code
        src: code
        fstype: virtiofs
        opts: defaults,_netdev,nofail
        state: mounted
      become: true
      tags: [storage]

    - name: Ensure /code is writable by {{ my_user }}
      ansible.builtin.file:
        path: /code
        state: directory
        owner: "{{ my_user }}"
        group: "{{ my_user }}"
        mode: "0775"
      become: true
      tags: [storage]

    - name: Remove legacy Docker daemon configuration
      ansible.builtin.file:
        path: /etc/docker/daemon.json
        state: absent
      become: true
      notify: Restart docker
      tags: [storage, docker]

    # NVIDIA Container Toolkit for GPU passthrough in containers
    - name: Set up NVIDIA Container Toolkit repository
      ansible.builtin.deb822_repository:
        name: nvidia-container-toolkit
        uris: https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH)
        suites: ["/"]
        signed_by: https://nvidia.github.io/libnvidia-container/gpgkey
      become: true
      tags: [nvidia, docker, gpu]

    - name: Install NVIDIA Container Toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true # deb822_repository doesn't reliably trigger apt cache update
      become: true
      tags: [nvidia, docker, gpu]

    - name: Configure Docker to use NVIDIA runtime
      ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
      become: true
      notify: Restart docker
      tags: [nvidia, docker, gpu]
      changed_when: true

    # Podman 4.x from upstream Kubic repo (Pop!_OS 22.04 ships 3.4.4 which lacks CDI)
    - name: Add Kubic podman repository for podman 4.x
      ansible.builtin.deb822_repository:
        name: devel_kubic_libcontainers_unstable
        types: [deb]
        uris: https://download.opensuse.org/repositories/devel:kubic:libcontainers:unstable/xUbuntu_22.04/
        suites: [./]
        signed_by: https://download.opensuse.org/repositories/devel:kubic:libcontainers:unstable/xUbuntu_22.04/Release.key
      become: true
      tags: [podman, gpu]

    - name: Install podman from Kubic repo # noqa: package-latest
      ansible.builtin.apt:
        name: podman
        state: latest
        update_cache: true
      become: true
      tags: [podman, gpu]

    - name: Migrate podman database (3.x to 4.x)
      ansible.builtin.command: podman system migrate
      become: true
      become_user: "{{ my_user }}"
      tags: [podman, gpu]
      changed_when: true
      failed_when: false

    # Pop!_OS 22.04 pins nvidia-container-toolkit to 1.12.1 (March 2023)
    # which crashes with driver 580+ (RTX 5090). Override to use NVIDIA's repo.
    - name: Pin NVIDIA container toolkit to NVIDIA repo (override Pop!_OS)
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/nvidia-container-toolkit
        content: |
          Package: nvidia-container*
          Pin: origin nvidia.github.io
          Pin-Priority: 1002

          Package: libnvidia-container*
          Pin: origin nvidia.github.io
          Pin-Priority: 1002
        owner: root
        group: root
        mode: "0644"
      become: true
      tags: [nvidia, podman, gpu]

    - name: Upgrade nvidia-container-toolkit from NVIDIA repo # noqa: package-latest
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: latest
        update_cache: true
      become: true
      tags: [nvidia, podman, gpu]

    - name: Configure podman to use NVIDIA runtime (CDI)
      ansible.builtin.command: nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
      become: true
      tags: [nvidia, podman, gpu]
      changed_when: true

    # pnpm is installed in dev_env-user.yml via github_release_install
    # Configuration is managed via dotfiles/npmrc

    - name: Create pip cache directory on tankshare
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ my_user }}"
        group: "{{ my_user }}"
        mode: "0755"
      become: true
      loop:
        - /mnt/tankshare/shared/pip-cache
      when: tankshare_mount.stat.exists and tankshare_mount.stat.isdir
      tags: [storage, pip]

    # pip.conf is managed by Nix home-manager (nix/home/hosts/wyrm.nix)
    # to avoid conflicts between Ansible and Nix

    # TODO: Consider moving tankshare directory creation (pip-cache, uv-cache, etc.)
    # to atlas.yaml since atlas manages the actual tank ZFS volume. Would be more
    # architecturally correct, though current approach (creating from VM) works fine.
    - name: Create UV cache directory on tankshare
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ my_user }}"
        group: "{{ my_user }}"
        mode: "0755"
      become: true
      loop:
        - /mnt/tankshare/shared/uv-cache
      when: tankshare_mount.stat.exists and tankshare_mount.stat.isdir
      tags: [storage, uv, python]

    # MOTD configuration for wyrm
    - name: Set wyrm MOTD
      ansible.builtin.copy:
        content: "🐉 Welcome to wyrm!\n"
        dest: /etc/motd
        owner: root
        group: root
        mode: "0644"
      become: true
      tags: [motd]

    - name: Disable dynamic MOTD components
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "a-x" # Remove execute permission
      become: true
      loop:
        - /etc/pop-os/update-motd.d/10-help-text # The actual Pop!_OS script (symlink target)
        # TODO: Future fancy ideas:
        # - Create /etc/update-motd.d/99-wyrm-status with dynamic dragon-themed system stats
        # - Show GPU status for AI experiments
        # - Display current Python environment info
        # - Show tankshare usage as "dragon hoard"
        # - Temperature sensors as "dragon fire intensity"
        # Keep 00-header for basic system info (OS version, kernel)
      tags: [motd]

    # Docker registry client role disabled - cluster is down
    # - name: Apply Docker registry client role
    #   ansible.builtin.include_role:
    #     name: docker_registry_client
    #   tags: [docker, registry]
