# Certbot renewal is done via the nginx *authenticator*.
# See https://eff-certbot.readthedocs.io/en/latest/using.html#getting-certificates-and-choosing-plugins.
# Looks like the authenticator does this via /.well-known/acme-challenge:
#   https://github.com/certbot/certbot/blob/619654f3175687fc02dbbf34754e43c067303c3b/
#   certbot-nginx/certbot_nginx/_internal/http_01.py#L237C9-L237C9
#
# TODO: check if the configurator does a good job too.
#
# Certbot comes with a built-in systemd timer: systemctl show certbot.timer.
# That runs `certbot renew`. I can check in journalctl that it does the right
# thing. It runs ~2x/day by default.

---
- name: Configure VPS server
  hosts: vps
  remote_user: root
  vars_files:
    - group_vars/all.yml

  vars:
    # Misc host-specific variables
    rcup_computer: vps
    # Disable heavy dev packages on VPS
    include_heavy_dev_packages: false
    headscale_health_host: agentydragon.com

  roles:
    - role: common
    # - cli    # <- TODO:  needs ducktape, etc
    - role: wireguard_uninstall
      tags: [wireguard, wireguard_uninstall]
    - role: powerdns
      tags: [powerdns]

  tasks:
    # Configure systemd-resolved with split DNS for PowerDNS and Tailscale
    - name: Ensure systemd-resolved is enabled
      ansible.builtin.systemd:
        name: systemd-resolved
        state: started
        enabled: true
      become: true
      tags: [dns, powerdns]

    - name: Create systemd-resolved config directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true
      tags: [dns, powerdns]

    - name: Configure systemd-resolved with split DNS
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/10-split-dns.conf
        content: |
          [Resolve]
          # Primary DNS servers
          DNS=1.1.1.1#cloudflare-dns.com
          DNS=8.8.8.8#dns.google
          # Fallback DNS
          FallbackDNS=8.8.4.4#dns.google
          # Enable stub listener for local resolution
          DNSStubListener=yes
          # Enable caching
          Cache=yes
          # Don't use LLMNR/mDNS
          LLMNR=no
          MulticastDNS=no
        owner: root
        group: root
        mode: '0644'
      become: true
      notify: restart systemd-resolved
      tags: [dns, powerdns]

    - name: Remove overly broad PowerDNS network configuration
      ansible.builtin.file:
        path: /etc/systemd/network/10-powerdns.network
        state: absent
      become: true
      tags: [dns, powerdns]

    - name: Configure PowerDNS forwarding in systemd-resolved directly
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/10-powerdns-domains.conf
        content: |
          [Resolve]
          # Forward queries for our authoritative domains to PowerDNS
          # This will be used in addition to the global DNS servers
          DNS={{ ansible_default_ipv4.address }}#powerdns
          Domains=~agentydragon.com ~adgn.link ~k3s.agentydragon.com
        owner: root
        group: root
        mode: '0644'
      become: true
      notify:
        - restart systemd-networkd
        - restart systemd-resolved
      tags: [dns, powerdns]

    - name: Ensure /etc/resolv.conf is symlinked to systemd-resolved
      ansible.builtin.file:
        src: /run/systemd/resolve/stub-resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
      become: true
      tags: [dns, powerdns]
    # Needs to run before Docker, which tries to install gnupg2
    - name: Update everything
      become: true
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Install nginx  # noqa: package-latest
      become: true
      ansible.builtin.apt:
        name: nginx
        state: latest

    - name: Create fail2ban ignore IP configuration
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/99-ignore-my-ip.local
        content: |
          [DEFAULT]
          ignoreip = 127.0.0.1/8 ::1 98.51.154.161
        mode: '0644'
        owner: root
        group: root
      tags: [fail2ban]

    - name: Enable Fail2Ban role
      ansible.builtin.include_role:
        name: nbigot.ansible-fail2ban
      tags: [fail2ban]

    - name: Create user
      ansible.builtin.user:
        name: agentydragon
        createhome: true
        # NOTE: still need to ssh-copy-id over to the user manually.

    - name: Wait for PowerDNS DNS port
      ansible.builtin.wait_for:
        host: "{{ powerdns_dns_bind_address }}"
        port: 53
        state: started
        timeout: 60
      tags: [powerdns, letsencrypt]

    - name: "Let’s Encrypt | agentydragon.com"
      ansible.builtin.import_role:
        name: letsencrypt
      vars:
        letsencrypt_cert_name: agentydragon.com
        letsencrypt_domains:
          - "agentydragon.com"
          - "www.agentydragon.com"

    - name: "Let's Encrypt | adgn.link"
      ansible.builtin.import_role:
        name: letsencrypt
      vars:
        letsencrypt_cert_name: "adgn.link"
        letsencrypt_domains:
          - "adgn.link"
          - "www.adgn.link"

    - name: "Let's Encrypt | atlas.agentydragon.com"
      ansible.builtin.import_role:
        name: letsencrypt
      vars:
        letsencrypt_cert_name: "atlas.agentydragon.com"
        letsencrypt_domains:
          - "atlas.agentydragon.com"

    - name: "Let's Encrypt | *.k3s.agentydragon.com (wildcard)"
      ansible.builtin.import_role:
        name: letsencrypt_dns
      vars:
        letsencrypt_dns_cert_name: "k3s-wildcard"
        letsencrypt_dns_domains:
          - "*.k3s.agentydragon.com"
        letsencrypt_dns_provider: "powerdns"
      tags: [letsencrypt, k3s-wildcard]

    - name: Apply headscale role
      ansible.builtin.import_role:
        name: headscale_server
      tags: [headscale]

    - name: Restart headscale service
      ansible.builtin.systemd:
        name: headscale
        state: restarted
        enabled: true
      tags: [headscale]

    - name: Wait for headscale health endpoint
      ansible.builtin.uri:
        url: "https://{{ headscale_health_host | default(inventory_hostname) }}:8080/health"
        method: GET
        status_code: 200
        validate_certs: true
        timeout: 5
      register: headscale_health
      until: headscale_health.status is defined and headscale_health.status == 200
      retries: 10
      delay: 3
      failed_when: false
      tags: [headscale]

    - name: Verify headscale health endpoint
      ansible.builtin.assert:
        that:
          - headscale_health.status is defined
          - headscale_health.status == 200
        fail_msg: >-
          Headscale health endpoint did not return HTTP 200 after the configured retries.
          Last response: {{ headscale_health }}
      tags: [headscale]

    - name: Apply tailscale role
      ansible.builtin.import_role:
        name: tailscale_client
      tags: [tailscale]

    - name: Copy nginx.conf
      ansible.builtin.copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf
        mode: '0644'

    - name: Nginx website configs
      tags: [nginx]
      block:
        - name: "Render nginx configuration from template"
          ansible.builtin.template:
            src: nginx-sites/{{ item }}.j2
            dest: /etc/nginx/sites-available/{{ item }}
            mode: '0644'
          loop:
            - agentydragon.com
            - adgn.link
            - atlas.agentydragon.com
            - k3s.agentydragon.com
          notify:
            - Reload nginx

        # nginx default website takes priority over http://agentydragon.com
        # redirect, so disable it.
        - name: Disable nginx default website
          ansible.builtin.file:
            state: absent
            dest: /etc/nginx/sites-enabled/default
          notify:
            - Reload nginx

        - name: Enable nginx websites
          ansible.builtin.file:
            state: link
            src: /etc/nginx/sites-available/{{ item }}
            dest: /etc/nginx/sites-enabled/{{ item }}
          loop:
            - agentydragon.com
            - adgn.link
            - atlas.agentydragon.com
            - k3s.agentydragon.com
          notify:
            - Reload nginx

    - name: Grocy
      ansible.builtin.include_role:
        name: grocy
        apply:
          tags: grocy
      vars:
        grocy_state: absent # disabled
      tags: [grocy]

    - name: InvenTree
      ansible.builtin.include_role:
        name: inventree
        apply:
          tags: inventree
      vars:
        inventree_state: present
      tags: [inventree]

    - name: Trilium server
      ansible.builtin.include_role:
        name: trilium_server
        apply:
          tags: trilium
      vars:
        trilium_server_state: absent
      tags: [trilium]

    - name: Bazel remote cache
      ansible.builtin.include_role:
        name: bazel_cache
        apply:
          tags: bazel-remote-cache
      vars:
        bazel_cache_state: absent
      tags: [bazel-remote-cache]

    - name: Start and enable nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      tags: [nginx]

    - name: Syncthing server
      ansible.builtin.include_role:
        name: syncthing_server
        apply:
          tags: syncthing
      tags: syncthing

    - name: ActivityWatch server
      ansible.builtin.include_role:
        name: activitywatch_server
        apply:
          tags: activitywatch
      tags: activitywatch
      vars:
        # Listens on localhost; uploading data works via SSH tunnel.
        activitywatch_server_state: present

    # Setup agentydragon user with CLI tools and dotfiles
    - name: Setup agentydragon user environment
      tags: [user-setup]
      vars:
        my_user: agentydragon
        ducktape_path: "/home/agentydragon/code/ducktape"
      block:
        - name: Check if SSH key exists for agentydragon user
          ansible.builtin.stat:
            path: /home/agentydragon/.ssh/authorized_keys
          register: ssh_key_check

        - name: Assert SSH key is set up
          ansible.builtin.assert:
            that:
              - ssh_key_check.stat.exists
              - ssh_key_check.stat.size > 0
            fail_msg: |
              SSH key must be set up for agentydragon user. Please:
              1. Run 'ssh-copy-id agentydragon@{{ inventory_hostname }}' to set up SSH access
              2. SSH into the server as agentydragon and set up GitHub access:
                 - Generate SSH key: ssh-keygen -t ed25519 -C "your_email@example.com"
                 - Add the key to GitHub: https://github.com/settings/keys
                 - Or use GitHub CLI: gh auth login
            success_msg: "SSH key is set up for agentydragon user"

        - name: Create code directory
          become: true
          become_user: agentydragon
          ansible.builtin.file:
            path: "/home/agentydragon/code"
            state: directory
            mode: '0755'

        - name: Clone ducktape repository
          become: true
          become_user: agentydragon
          ansible.builtin.git:
            repo: git@github.com:agentydragon/ducktape.git
            dest: "{{ ducktape_path }}"
            version: devel
            accept_hostkey: true
            depth: 1  # Shallow clone for speed

    # Apply CLI role (outside the block so tags work independently)
    - name: Apply CLI role
      ansible.builtin.import_role:
        name: cli
      vars:
        cli_user: agentydragon
        cli_ducktape_path: "/home/agentydragon/code/ducktape"
      tags: [dotfiles]
      # CLI role tasks that need root will handle their own become

    # Apply Claude MCP role for agentydragon user
    - name: Apply Claude MCP role
      ansible.builtin.import_role:
        name: legacy_claude_mcp
      tags: [claude, mcp]

    - name: Install shared development environment for agentydragon
      ansible.builtin.import_role:
        name: dev_env
      vars:
        dev_env_user: agentydragon
      tags: [dev_env]

    # TODO: configure - plus for remote desktop
    # - name: Configure Authentik
    #   ansible.builtin.include_role:
    #     name: authentik
    #   tags: [authentik]

  handlers:
    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
        daemon_reload: true
      become: true
      tags: [dns, powerdns]

    - name: Restart systemd-networkd
      ansible.builtin.systemd:
        name: systemd-networkd
        state: restarted
        daemon_reload: true
      become: true
      tags: [dns, powerdns]

    # Only triggers if nginx config files changed.
    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
        daemon_reload: true
        enabled: true
      tags: [nginx]

    - name: Restart fail2ban
      tags: [fail2ban]
      block:
        - name: Validate fail2ban configuration
          ansible.builtin.command:
            cmd: fail2ban-client -d
          register: fail2ban_config_check
          failed_when: false
          changed_when: false

        - name: Fail if fail2ban configuration is invalid
          ansible.builtin.fail:
            msg: "fail2ban configuration validation failed: {{ fail2ban_config_check.stderr }}"
          when: fail2ban_config_check.rc != 0

        - name: Restart fail2ban service
          ansible.builtin.systemd:
            name: fail2ban
            state: restarted
