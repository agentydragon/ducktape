              <${List.Item}><strong>${"Sampler Store and Executor: "}</strong>${"Executor holds *Store, Owner, Session and Settings and records intents, process outcomes and incarnation rebinds under that owner. Moving executor_*.go alone would create reverse imports or a broad imitation Store interface. First name the durable owner and data types, then move the whole transaction/fence responsibility. The small extractions above do not require that design."}<//>
              <${List.Item}><strong>${"Notification GitHub store: "}</strong>${"Keep ingestion, refresh, delivery, cleanup, reconciliation and subscription start positions together under the existing GitHub advisory lock and caller transaction. No provider-prefix split until a transaction-bearing boundary preserves every participant, inbox wakeup and lock order."}<//>
              <${List.Item}><strong>${"Action handlers and MCP edge: "}</strong>${"Do not simply make action_service/api internal: MCP edge imports its Gate, OperatorVerifier and OIDC settings, and Gate uses private Action store principal types. Extract an explicitly shared admission responsibility with unchanged deny-by-default behavior before privatizing Action handlers. This needs its own authorization design and tests."}<//>
              <${List.Item}><strong>${"Runtime: "}</strong>${"Map admission closure, native/Execution fencing, journal sealing and exact History acknowledgement; simplify one evidenced shutdown/reconciliation path with race tests. Preserve component-generation ownership. This remains a parallel reliability track."}<//>
