<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentplane organization: current and goal trees</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript
      >This report uses JavaScript for its interactive tree views.</noscript
    >
    <script type="module">
      import { useEffect, useState } from "react";
      import {
        Accordion,
        Anchor,
        Badge,
        Blockquote,
        Box,
        Checkbox,
        Container,
        Group,
        List,
        Paper,
        Select,
        SimpleGrid,
        Stack,
        Text,
        Title,
      } from "@mantine/core";
      import { html, mount } from "../report.js";
      const sourceURL = (plan, path) =>
        `https://github.com/agentydragon/ducktape/tree/${plan.source_sha}/${path}`;
      const workStatus = {
        READY: { color: "blue", badge: "→ ready" },
        PLANNED: { color: "cyan", badge: "→ planned boundary" },
        "AGREED DIRECTION": { color: "teal", badge: "→ agreed direction" },
        HELD: { color: "violet", badge: "→ held to move once" },
        "DESIGN REQUIRED": { color: "yellow", badge: "? local contract" },
        "OPEN DIRECTION": { color: "orange", badge: "? open service decision" },
      };
      const workColor = (track) =>
        track.status.startsWith("DEFERRED")
          ? "gray"
          : workStatus[track.status].color;
      const workBadge = (track) =>
        track.status.startsWith("DEFERRED")
          ? "~ deferred"
          : workStatus[track.status].badge;
      const cutColor = {
        DECIDED: "teal",
        PROPOSED: "grape",
        "PROPOSED DESIGN": "grape",
        OPEN: "orange",
        NEXT: "blue",
        QUEUED: "gray",
      };
      const sourceLinks = (plan, paths) =>
        html`<${Group} gap="xs" mt="xs"
          >${paths.map((path) => html`<${Anchor} key=${path} size="xs" href=${sourceURL(plan, path)}>${path}<//>`)}<//
        >`;
      function treeLines(plan, component, goal, showFiles) {
        const all = component.id === "all";
        const root = {
          name: component.path + "/",
          path: component.path,
          children: new Map(),
        };
        const tracks = plan.remaining_work.filter(
          (t) => all || t.components.includes(component.id),
        );
        const exactMoves = new Map(
          tracks.flatMap((t) =>
            (t.path_moves || []).map((m) => [m.from, m.to]),
          ),
        );
        const moves = goal ? exactMoves : new Map();
        const splits = new Map(
          tracks.flatMap((t) =>
            (t.file_splits || []).map((split) => [split.from, split.parts]),
          ),
        );
        const deleted = new Set(tracks.flatMap((t) => t.deleted_paths || []));
        function node(path, directory = true) {
          if (path !== component.path && !path.startsWith(component.path + "/"))
            return null;
          let current = root;
          const relative = path
            .slice(component.path.length + 1)
            .replace(/\/$/, "");
          if (!relative) return current;
          const parts = relative.split("/");
          for (let i = 0; i < parts.length; i++) {
            const part = parts[i];
            if (!current.children.has(part))
              current.children.set(part, {
                name: part + (i < parts.length - 1 || directory ? "/" : ""),
                path: component.path + "/" + parts.slice(0, i + 1).join("/"),
                children: new Map(),
              });
            current = current.children.get(part);
          }
          return current;
        }
        function note(path, value, marker = "") {
          const n = node(path);
          if (!n) return;
          n.note = [n.note, value].filter(Boolean).join(" · ");
          if (marker) n.marker = marker;
        }
        const buckets = new Map();
        const sourceDirectories =
          goal && !all
            ? plan.components.flatMap((area) => area.directories)
            : component.directories;
        for (const dir of sourceDirectories)
          for (const path of dir.files) {
            if (goal && deleted.has(path)) continue;
            const parts =
              goal && splits.has(path)
                ? splits
                    .get(path)
                    .map((part) => ({ path: part.path, proposed: true }))
                : [{ path: moves.get(path) || path, proposed: false }];
            for (const part of parts) {
              const mapped = part.path;
              const parent = mapped.slice(0, mapped.lastIndexOf("/"));
              if (!buckets.has(parent))
                buckets.set(parent, {
                  other: 0,
                  tests: 0,
                  files: [],
                  proposed: false,
                });
              const bucket = buckets.get(parent);
              const existing = bucket.files.find(
                (file) => file.path === mapped,
              );
              if (existing) {
                existing.proposed ||= part.proposed;
                existing.from ||= mapped !== path ? path : null;
                bucket.proposed ||= part.proposed;
                continue;
              }
              mapped.endsWith("_test.go") ? bucket.tests++ : bucket.other++;
              bucket.proposed ||= part.proposed;
              bucket.files.push({
                path: mapped,
                from: mapped !== path ? path : null,
                proposed: part.proposed,
              });
            }
          }
        for (const [path, bucket] of buckets) {
          const n = node(path);
          if (!n) continue;
          n.note =
            `${bucket.other} non-test Go + ${bucket.tests} tests` +
            (bucket.proposed ? " · includes proposed split" : "");
          if (showFiles)
            for (const file of bucket.files) {
              const f = node(file.path, false);
              if (file.from) f.note = "← " + file.from;
              if (file.proposed) {
                f.marker = "? ";
                f.note = [f.note, "proposed allocation"]
                  .filter(Boolean)
                  .join(" · ");
              }
              if (!goal && exactMoves.has(file.path))
                f.note = "→ " + exactMoves.get(file.path);
              if (!goal && splits.has(file.path))
                f.note = "→ split; see work item";
              if (!goal && deleted.has(file.path))
                f.note = "→ remove obsolete owner";
            }
        }
        for (const path of component.context_paths) {
          const n = node(path, path.endsWith("/"));
          if (n && !n.note)
            n.note = path.endsWith("/") ? "context" : "protocol source";
        }
        const decisions = plan.components.flatMap((c) => c.package_decisions);
        if (goal)
          for (const pkg of decisions) {
            if (pkg.decision === "retain") continue;
            const targets = [
              ...new Set(pkg.target_paths.filter((p) => p !== pkg.path)),
            ];
            if (buckets.has(pkg.path))
              note(
                pkg.path,
                targets.length
                  ? "→ ? " +
                      targets.map((p) => p.split("/").pop() + "/").join(", ")
                  : pkg.decision + "; see package decision",
              );
            for (const target of targets) {
              if (buckets.has(target)) continue;
              note(target, "proposed owner; allocation gated", "? ");
            }
          }
        if (goal)
          for (const track of tracks)
            for (const rename of track.package_renames || [])
              note(rename.path, `package ${rename.from} → ${rename.to}`);
        if (all)
          for (const c of plan.components) {
            const n = node(c.path);
            n.note =
              `${c.counts.files} Go files · ${c.counts.directories} packages` +
              (goal ? " · " + c.decision.state : "");
          }
        const focus = decisions
          .filter((p) => p.decision !== "retain")
          .flatMap((p) => [p.path, ...p.target_paths]);
        const lines = [root.name + (root.note ? `  [${root.note}]` : "")];
        function visit(parent, prefix, depth) {
          const children = [...parent.children.values()].sort((a, b) =>
            a.name.localeCompare(b.name),
          );
          children.forEach((n, i) => {
            const last = i === children.length - 1;
            lines.push(
              prefix +
                (last ? "└── " : "├── ") +
                (n.marker || "") +
                n.name +
                (n.note ? `  [${n.note}]` : ""),
            );
            const deeper = prefix + (last ? "    " : "│   ");
            const relevant = focus.some((path) =>
              path.startsWith(n.path + "/"),
            );
            if (all && !showFiles && depth >= 2 && n.children.size && !relevant)
              lines.push(deeper + "└── … select component for nested owners");
            else visit(n, deeper, depth + 1);
          });
        }
        visit(root, "", 1);
        return lines.join("\n");
      }
      function TreePane({ title, text, id }) {
        return html`<${Paper} withBorder p="md" style=${{ minWidth: 0 }}>
          <${Title} order=${3}>${title}<//>
          <${Box}
            component="pre"
            data-testid=${id}
            tabIndex=${0}
            aria-label=${title + " tree"}
            style=${{ overflowX: "auto", maxWidth: "100%", maxHeight: "65vh", overflowY: "auto", fontFamily: "var(--mantine-font-family-monospace)", fontSize: "0.78rem", lineHeight: 1.65, whiteSpace: "pre", paddingBottom: "0.5rem" }}
            >${text}<//
          >
        <//>`;
      }
      function Report() {
        const [plan, setPlan] = useState(null);
        const [error, setError] = useState(null);
        const [selected, setSelected] = useState("all");
        const [showFiles, setShowFiles] = useState(false);
        const [workFilter, setWorkFilter] = useState("all");
        useEffect(() => {
          const controller = new AbortController();
          fetch("go-plan.json", { signal: controller.signal })
            .then((response) => {
              if (!response.ok) throw new Error(`Plan HTTP ${response.status}`);
              return response.json();
            })
            .then(setPlan)
            .catch((error) => {
              if (error.name !== "AbortError") setError(error.message);
            });
          return () => controller.abort();
        }, []);
        function openWork(event, id) {
          event.preventDefault();
          setWorkFilter("all");
          requestAnimationFrame(() => {
            document.getElementById(id)?.scrollIntoView();
            history.replaceState(null, "", "#" + id);
          });
        }
        if (error)
          return html`<${Container} py="xl"
            ><${Title} order=${1}>${"Agentplane organization"}<//
            ><${Text} role="alert">${error}<//><//
          >`;
        if (!plan)
          return html`<${Container} py="xl"
            ><${Text}>${"Loading current and goal trees…"}<//><//
          >`;
        const component =
          selected === "all"
            ? {
                id: "all",
                path: "agentplane",
                directories: plan.components.flatMap((c) => c.directories),
                package_decisions: plan.components.flatMap(
                  (c) => c.package_decisions,
                ),
                context_paths: [
                  ...new Set(
                    plan.components.flatMap((c) => [
                      c.path + "/",
                      ...c.context_paths,
                    ]),
                  ),
                ],
                goal_note:
                  "All Agentplane components are in scope. The overview expands branches with remaining moves; select any component for every nested package and its file names.",
              }
            : plan.components.find((c) => c.id === selected);
        const tracks = plan.remaining_work.filter(
          (t) => selected === "all" || t.components.includes(selected),
        );
        const visibleWork = plan.remaining_work.filter(
          (t) => workFilter === "all" || t.status === workFilter,
        );
        return html`<${Container}
          size="xl"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
          ><${Stack} gap="lg">
            <${Anchor} href="../">${"All reports"}<//>
            <${Title} order=${1}>${"Agentplane: current → goal"}<//>
            <${Text}
              >${"A whole-tree organization proposal: concrete commands, domain owners, boundary adapters, persistence and test support. Every tracked Go file has a disposition. The work is ordered by certainty: leftovers are deleted first, then layout fixes that hold under any service map, then moves following agreed service directions, then local extractions, and last the moves that wait on open service decisions, so each file moves once."}<//
            >
            <${Text} size="sm" c="dimmed"
              >${`${plan.counts.files.toLocaleString()} tracked Go files · ${plan.counts.directories} Go packages · ${plan.components.length} top-level areas · source ${plan.source_sha.slice(0, 10)} · observed ${plan.observed_at_utc}. Counts include every tracked Agentplane Go file, including tests and experiments. Trees also show protocol/browser context; generated Go bindings are not tracked files.`}<//
            >
            <${Group} component="nav" gap="md"
              ><${Anchor} href="#trees">${"Current and goal trees"}<//
              ><${Anchor} href="#coverage">${"Component decisions"}<//
              ><${Anchor} href="#binaries">${"Target binaries"}<//
              ><${Anchor} href="#remaining">${"Remaining work"}<//
              ><${Anchor} href="#adoption">${"Adoption order"}<//
              ><${Anchor} href="#rules">${"Organization rules"}<//><//
            >
            <${Group} gap="sm"
              ><${Anchor} href="go-plan.json">${"Remaining plan data"}<//
              ><${Anchor} href="go-files.json">${"Every current Go file"}<//
              ><${Anchor} href="evidence.json"
                >${"Source review and validation evidence"}<//
              ><//
            >
            <${Stack} component="section" id="trees" gap="md">
              <${Title} order=${2}>${"Current and goal trees"}<//>
              <${Text}
                >${"= retain an intentional owner · → exact file move · ? proposed responsibility owner; API and file allocation still gated · ~ deferred contract design. Current files remain under their current owner until an exact mapping is decided. A proposed directory is not a claim that its implementation exists. Goal file counts include explicitly proposed file splits; candidate-owner allocation remains undecided."}<//
              >
              <${Group} align="end"
                ><${Select}
                  label="Component"
                  value=${selected}
                  onChange=${setSelected}
                  allowDeselect=${false}
                  searchable
                  data=${[{ value: "all", label: "All Agentplane" }, ...plan.components.map((c) => ({ value: c.id, label: `${c.id} (${c.counts.files} Go files)` }))]}
                  style=${{ width: "min(100%, 26rem)" }} /><${Checkbox}
                  label="Show Go file names"
                  checked=${showFiles}
                  onChange=${(event) => setShowFiles(event.currentTarget.checked)}
              /><//>
              <${Text} size="sm">${component.goal_note}<//>
              <${SimpleGrid}
                cols=${{ base: 1, md: 2 }}
                spacing="md"
                data-testid="tree-pair"
              >
                <${TreePane}
                  title="Current"
                  id="current-tree"
                  text=${treeLines(plan, component, false, showFiles)}
                />
                <${TreePane}
                  title="Goal"
                  id="goal-tree"
                  text=${treeLines(plan, component, true, showFiles)}
                />
              <//>
              <${Stack} gap="xs"
                >${tracks.map((track) => html`<${Group} key=${track.id} gap="xs"><${Badge} color=${workColor(track)}>${workBadge(track)}<//><${Anchor} href=${"#" + track.id} onClick=${(event) => openWork(event, track.id)}>${track.title}<//><//>`)}<//
              >
            <//>
            <${Stack} component="section" id="coverage" gap="md">
              <${Title} order=${2}
                >${"Goal decisions for every Agentplane area"}<//
              >
              <${Text}
                >${`Every one of the ${plan.counts.directories} Go packages has its own role, disposition, target and rationale below. RETAIN means an intentional boundary with evidence; REWORK means remaining changes, including named design gates. Areas without tracked Go remain visible as context.`}<//
              >
              <${Accordion} variant="contained"
                >${plan.components.map(
                  (c) =>
                    html`<${Accordion.Item}
                      key=${c.id}
                      value=${c.id}
                      data-testid=${"component-" + c.id}
                    >
                      <${Accordion.Control}
                        >${`${c.id} · ${c.decision.state} · ${c.counts.files} Go files`}<//
                      >
                      <${Accordion.Panel}
                        ><${Stack} gap="sm">
                          <${Text} fw=${600}>${c.decision.role}<//>
                          <${Text}>${c.decision.goal_summary}<//
                          ><${Text} size="sm">${c.decision.reason}<//>
                          <${Group} gap="sm"
                            >${c.decision.evidence_paths.map((path) => html`<${Anchor} key=${path} size="sm" href=${sourceURL(plan, path)}>${path}<//>`)}<//
                          >
                          <${Accordion} variant="separated">
                            ${c.package_decisions.map(
                              (pkg) =>
                                html`<${Accordion.Item}
                                  key=${pkg.path}
                                  value=${pkg.path}
                                >
                                  <${Accordion.Control}
                                    >${pkg.path.slice(c.path.length + 1) || "(component root)"}
                                    · ${pkg.decision.toUpperCase()}<//
                                  >
                                  <${Accordion.Panel}
                                    ><${Stack} gap="xs">
                                      <${Text} fw=${600}>${pkg.role}<//>
                                      <${Text} size="sm" c="dimmed"
                                        >${"Declared packages: " + pkg.declared_packages.join(" · ") + ` · ${pkg.counts.non_test} non-test Go + ${pkg.counts.tests} tests`}<//
                                      >
                                      <${Text} size="sm">${pkg.reason}<//>
                                      <${Text} size="sm"
                                        >${"Goal: " + (pkg.target_paths.length ? pkg.target_paths.join(" · ") : pkg.path)}<//
                                      >
                                      ${pkg.gate ? html`<${Text} size="sm" c="dimmed">${"Gate: " + pkg.gate}<//>` : ""}
                                      <${Group} gap="xs"
                                        >${pkg.pending_tracks.map((id) => html`<${Anchor} key=${id} size="sm" href=${"#" + id} onClick=${(event) => openWork(event, id)}>${id}<//>`)}<//
                                      >
                                      <${Group} gap="xs"
                                        >${pkg.evidence_paths.map((path) => html`<${Anchor} key=${path} size="sm" href=${sourceURL(plan, path)}>${path.split("/").pop()}<//>`)}<//
                                      >
                                    <//><//
                                  >
                                <//>`,
                            )}
                          <//>
                        <//><//
                      >
                    <//>`,
                )}<//
              >
            <//>
            <${Stack} component="section" id="binaries" gap="md">
              <${Title} order=${2}>${"Target binaries and cut line"}<//>
              <${Group} gap="sm" wrap="nowrap" align="flex-start"
                ><${Badge}
                  color=${cutColor[plan.target_binaries.status]}
                  style=${{ flexShrink: 0 }}
                  >${plan.target_binaries.status}<//
                ><${Text} size="sm" c="dimmed"
                  >${plan.target_binaries.status_note}<//
                ><//
              >
              <${Blockquote} color="blue"
                >${plan.target_binaries.proposal_quote}<//
              >
              <${Text}>${plan.target_binaries.summary}<//>
              <${Title} order=${3}>${"Today"}<//>
              <${SimpleGrid} cols=${{ base: 1, sm: 2 }}
                >${plan.target_binaries.today.map((b) => html`<${Paper} key=${b.name} withBorder p="md" style=${{ minWidth: 0, overflowWrap: "anywhere" }}><${Text} fw=${600} ff="monospace">${b.name}<//><${Text} size="sm" mt="xs">${b.text}<//>${sourceLinks(plan, b.evidence_paths)}<//>`)}<//
              >
              <${Title} order=${3}>${"Proposed"}<//>
              <${SimpleGrid} cols=${{ base: 1, sm: 2 }}
                >${plan.target_binaries.binaries.map((b) => html`<${Paper} key=${b.name} withBorder p="md" style=${{ minWidth: 0, overflowWrap: "anywhere" }}><${Title} order=${4}>${b.name}<//><${Text} size="sm" c="dimmed">${b.text}<//><${List} size="sm" mt="xs" spacing="xs">${b.owns.map((item) => html`<${List.Item} key=${item}>${item}<//>`)}<//><${Text} size="sm" mt="xs">${"Callers: " + b.callers}<//><${Text} size="xs" c="dimmed" mt="xs">${"From: " + b.from_paths.join(" · ")}<//><//>`)}<//
              >
              <${Title} order=${3}>${"Cut line"}<//>
              ${plan.target_binaries.cut_line.map(
                (cut) =>
                  html`<${Paper}
                    key=${cut.id}
                    id=${"cut-" + cut.id}
                    withBorder
                    p="md"
                    style=${{ minWidth: 0, overflowWrap: "anywhere" }}
                    ><${Group} gap="sm"
                      ><${Badge} color=${cutColor[cut.status]}>${cut.status}<//
                      ><${Title} order=${4}>${cut.title}<//><//
                    >
                    ${cut.decision ? html`<${Text} size="sm" fw=${600} mt="xs">${cut.decision}<//>` : ""}
                    <${Text} size="sm" mt="xs">${"Today: " + cut.today}<//>
                    <${Text} size="sm" mt="xs">${cut.proposal}<//>
                    ${sourceLinks(plan, cut.evidence_paths)}<//
                  >`,
              )}
              <${Title} order=${3}>${"Keep-alive holds"}<//>
              <${Group} gap="sm" wrap="nowrap" align="flex-start"
                ><${Badge}
                  color=${cutColor[plan.target_binaries.keep_alive.status]}
                  style=${{ flexShrink: 0 }}
                  >${plan.target_binaries.keep_alive.status}<//
                ><${Text} size="sm" c="dimmed"
                  >${plan.target_binaries.keep_alive.steer}<//
                ><//
              >
              <${Text} size="sm"
                >${"Today: " + plan.target_binaries.keep_alive.today}<//
              >
              <${List} spacing="xs" size="sm"
                >${plan.target_binaries.keep_alive.proposal.map((item) => html`<${List.Item} key=${item}>${item}<//>`)}<//
              >
              ${sourceLinks(plan, plan.target_binaries.keep_alive.evidence_paths)}
              <${Title} order=${3}
                >${"Questions for the operator, one at a time"}<//
              >
              <${List} type="ordered" spacing="xs"
                >${plan.target_binaries.questions.map((q) => html`<${List.Item} key=${q.text}><${Badge} size="sm" mr="xs" color=${cutColor[q.status]}>${q.status}<//>${q.text}<//>`)}<//
              >
            <//>
            <${Stack} component="section" id="remaining" gap="md">
              <${Title} order=${2}>${"Remaining work"}<//>
              <${Text}>${plan.remaining_work_note}<//>
              <${Select}
                label="Work status"
                value=${workFilter}
                onChange=${setWorkFilter}
                allowDeselect=${false}
                data=${[{ value: "all", label: "All remaining work" }, ...[...new Set(plan.remaining_work.map((t) => t.status))].map((value) => ({ value, label: value }))]}
                style=${{ width: "min(100%, 26rem)" }}
              />
              <${Text} size="sm"
                >${"Priority follows adoption stage and the queue below. PLANNED has a concrete boundary; AGREED DIRECTION is an operator-agreed move whose contract is still to be written; HELD is a decided move waiting so its files move once; DESIGN REQUIRED needs a local contract; OPEN DIRECTION waits on an undecided service decision. None of them means a tested code patch. Target 200–3,000 changed LOC per coherent PR, with tests and caller closure."}<//
              >
              <${List} type="ordered" spacing="xs"
                >${plan.next_prs.map((item) => html`<${List.Item} key=${item.id}><${Anchor} href=${"#" + item.track} onClick=${(event) => openWork(event, item.track)}>${item.title}<//>${" · " + item.readiness}<//>`)}<//
              >
              ${visibleWork.map(
                (track) =>
                  html`<${Paper}
                    key=${track.id}
                    component="article"
                    id=${track.id}
                    withBorder
                    p="lg"
                    style=${{ minWidth: 0, overflowWrap: "anywhere" }}
                  >
                    <${Group} gap="sm"
                      ><${Badge} color=${workColor(track)}>${track.status}<//
                      ><${Text} size="sm" c="dimmed">${track.kind}<//><//
                    >
                    <${Title} order=${3} mt="sm">${track.title}<//>
                    <${Text} mt="sm">${track.summary}<//>
                    <${Text} size="sm" c="dimmed" mt="xs"
                      >${`Stage ${track.stage} · ${track.review_size}`}<//
                    >
                    ${track.dependencies.length ? html`<${Group} gap="xs" mt="xs"><${Text} size="sm">${"Content prerequisites:"}<//>${track.dependencies.map((id) => html`<${Anchor} key=${id} size="sm" href=${"#" + id} onClick=${(event) => openWork(event, id)}>${id}<//>`)}<//>` : ""}
                    ${track.target_paths.length ? html`<${TreePane} title="Target owners" id=${track.id + "-owners"} text=${track.target_paths.map((p) => p + "/").join("\n")} />` : ""}
                    ${track.file_splits?.length ? html`<${TreePane} title="Proposed file allocation" id=${track.id + "-split"} text=${track.file_splits.map((split) => split.from + "\n" + split.parts.map((part) => "└── → ? " + part.path + (part.symbols?.length ? "\n    " + part.symbols.join(", ") : "")).join("\n")).join("\n\n")} />` : ""}
                    ${track.deleted_paths?.length ? html`<${Text} size="sm">${"Proposed removal: " + track.deleted_paths.join(" · ")}<//>` : ""}
                    ${track.package_renames?.length ? html`<${Text} size="sm">${track.package_renames.map((r) => `${r.path}: package ${r.from} → ${r.to}`).join(" · ")}<//>` : ""}
                    ${track.path_moves?.length ? html`<${TreePane} title="Placement flow" id=${track.id + "-flow"} text=${track.path_moves.map((move) => `${move.from}\n└── → ${move.to}`).join("\n")} />` : ""}
                    ${track.candidate_target ? html`<${TreePane} title="Responsibility flow" id=${track.id + "-flow"} text=${`${track.source_owner}/\n└── selected types, methods and their tests\n    └── → ? ${track.candidate_target}/\n        └── API and exact filenames decided after the contract`} />` : ""}
                    <${List} type="ordered" spacing="xs" mt="sm"
                      >${track.how.map((step) => html`<${List.Item} key=${step}>${step}<//>`)}<//
                    >
                    <${Blockquote} color="yellow" mt="sm">${track.gate}<//>
                    <${Text} size="sm" mt="sm"
                      >${"Preserve: " + track.preserve}<//
                    >
                    <${Accordion} variant="contained" mt="sm"
                      ><${Accordion.Item} value="source"
                        ><${Accordion.Control}
                          >${"Source locations and validation"}<//
                        ><${Accordion.Panel}>
                          <${Text} size="sm"
                            >${"Source links pin the reviewed implementation. Exact file moves and package-name changes are recorded separately from candidate owners. Checks below name existing targets at this source pin; update labels when a package moves. No source behavior tests were run for this planning-only change."}<//
                          >
                          <${List} size="sm"
                            >${track.evidence_paths.map((path) => html`<${List.Item} key=${path}><${Anchor} href=${sourceURL(plan, path)}>${path}<//><//>`)}<//
                          >
                          <${Text} size="sm" mt="sm"
                            >${track.validation_note || "Existing validation targets; run the owner tests when its contract changes."}<//
                          ><${List} size="sm" mt="sm"
                            >${track.validation.map((label) => html`<${List.Item} key=${label}>${label}<//>`)}<//
                          >
                        <//><//
                      ><//
                    >
                  <//>`,
              )}
            <//>
            <${Stack} component="section" id="adoption" gap="md">
              <${Title} order=${2}>${"Adoption order"}<//>
              <${List} type="ordered" spacing="md"
                >${plan.adoption.map((stage) => html`<${List.Item} key=${stage.stage}><${Text} fw=${600}>${stage.title}<//><${Text} size="sm">${stage.result}<//><${Group} gap="xs">${stage.work.map((id) => html`<${Anchor} key=${id} size="sm" href=${"#" + id} onClick=${(event) => openWork(event, id)}>${id}<//>`)}<//><//>`)}<//
              >
              <${Text} size="sm"
                >${"Independent lanes proceed in parallel; only named content prerequisites constrain order. Use native GitHub Stacks for dependent PRs. Each implementation PR includes imports, BUILD, tests, CI/release/runfiles and docs closure. On merge, remove its work item and mappings, refresh the immutable inventory and re-review the remaining package decision; do not turn merged work into a completed-work listing."}<//
              >
            <//>
            <${Stack} component="section" id="rules" gap="md">
              <${Title} order=${2}>${"Organization rules"}<//>
              <${List} spacing="sm"
                >${plan.structure_rules.map((rule) => html`<${List.Item} key=${rule}>${rule}<//>`)}<//
              >
              <${Text} size="sm"
                >${"Conventions: "}<${Anchor}
                  href="https://go.dev/doc/modules/layout"
                  >${"Go module layout: internal/ and cmd/"}<//
                >${"; "}<${Anchor}
                  href="https://go.dev/doc/effective_go#package-names"
                  >${"Go package names"}<//
                >${"; "}<${Anchor}
                  href=${`https://github.com/agentydragon/ducktape/blob/${plan.source_sha}/README.md#plans`}
                  >${"Repository plan burn-down convention"}<//
                >${". Go establishes the visibility and naming conventions; the concrete ownership boundaries here are project design choices."}<//
              >
            <//>
          <//><//
        >`;
      }
      mount(Report);
    </script>
  </body>
</html>
