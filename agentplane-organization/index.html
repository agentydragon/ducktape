            ><${Box}>${"08 / Conventions"}<//
            ><${Title} order=${2} mt="lg" mb="xs"

              >${"Commands assemble; packages implement"}<//
            ><${Text} component="p" my="sm"
              >${"Keep "}<${Code}>${"main"}</${Code}>${" focused on configuration, constructing dependencies, starting and stopping the process. "}<${Code}>${"cmd/"}</${Code}>${" is a common layout for repositories with commands and importable packages, not a language requirement. "}<${Anchor}
                href=${"https://go.dev/doc/modules/layout"}
                >${"Go module layout"}<//
              ><//
            ><${Title} order=${3} mt="lg" mb="xs"
              >${"Use "}<${Code}>${"internal/"}</${Code}>${" to constrain imports"}<//
            ><${Text} component="p" my="sm"
              >${"Go permits importing a package below "}<${Code}>${"internal/"}</${Code}>${" only from the tree rooted at the directory immediately above that "}<${Code}>${"internal"}</${Code}>${" directory. Thus "}<${Code}>${"session/cmd/sessiond"}</${Code}>${" may import "}<${Code}>${"session/internal/postgres"}</${Code}>${", but "}<${Code}>${"action/"}</${Code}>${" may not. This is a build-time import rule, not a runtime security boundary. "}<${Anchor}
                href=${"https://pkg.go.dev/cmd/go#hdr-Internal_Directories"}
                >${"Go command reference"}<//
              ><//
            ><${Title} order=${3} mt="lg" mb="xs"
              >${"Name packages for what they do"}<//
            ><${Text} component="p" my="sm"
              >${"Prefer short, meaningful names like "}<${Code}>${"journal"}</${Code}>${" or "}<${Code}>${"lifecycle"}</${Code}>${". Avoid catch-all packages such as "}<${Code}>${"common"}</${Code}>${", "}<${Code}>${"utils"}</${Code}>${" or one giant "}<${Code}>${"types"}</${Code}>${" package. A directory used only to group other directories does not itself have to be a Go package. "}<${Anchor}
                href=${"https://go.dev/blog/package-names"}
                >${"Go package names"}<//
              ><//
            ><${Title} order=${3} mt="lg" mb="xs"
              >${"Use interfaces at real seams"}<//
            ><${Text} component="p" my="sm"
              >${"Go interfaces are implemented implicitly. When an interface is useful, define a small one near the consumer’s needs; implementations can return concrete types. Do not introduce an interface for every struct, or translate every protobuf message to a duplicate domain type without a reason. "}<${Anchor}

                >${"Go review guidance"}<//
