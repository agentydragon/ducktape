    <div id="report-content"></div>
    <noscript>This report uses JavaScript for Mantine components.</noscript>
    <script type="module">
      import {
        Anchor,
        Blockquote,
        Box,
        Code,
        Container,
        Group,
        List,
        Paper,
        SimpleGrid,
        Stack,
        Table,
        Text,
        Title,
      } from "@mantine/core";
      import { html, mount } from "../report.js";
      function Report() {
        return html`<${Container}
          component="main"
          size="74rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
        >
          <header>
            <${Title} order=${1} mt="md" mb="sm"
              >${"Organizing an agent platform"}<//
            >
            <${Text} component="p" my="sm"
              >${"A first-principles architecture, source inventory and staged adoption plan for Agentplane."}<//
            >
            <${Text} component="p" c="dimmed" size="sm"
              >${"Source inventory: devel 93f2ba8eef · plan preflight: devel bd9c472054 · 12 November 2026 PST (13 November UTC) · not a live deployment inventory"}<//
            >
          </header>
          <${Group} component="nav" gap="sm" my="md" aria-label="Contents"
            ><${Anchor} href=${"#thesis"}>${"Start with ownership"}<//
            ><${Anchor} href=${"#model"}>${"A small core model"}<//
            ><${Anchor} href=${"#ownership"}>${"Give each decision an owner"}<//
            ><${Anchor} href=${"#flows"}
              >${"Follow a command across failures"}<//
            ><${Anchor} href=${"#deployment"}>${"Deploy for a reason"}<//
            ><${Anchor} href=${"#boundaries"}>${"Enforce at the authority"}<//
            ><${Anchor} href=${"#packages"}
              >${"Put contracts and implementation beside their owner"}<//
            ><${Anchor} href=${"#rules"}>${"What the Go boundaries mean"}<//
            ><${Anchor} href=${"#inventory"}>${"What owns each fact today"}<//
            ><${Anchor} href=${"#coverage"}
              >${"What is specified, and what is evidenced"}<//
            ><${Anchor} href=${"#hierarchy"}
              >${"Build a hierarchy within each owner"}<//
            ><${Anchor} href=${"#adoption"}
              >${"Move useful code now; keep decisions separate"}<//
            ><${Anchor} href=${"#sources"}
              >${"Sources and design judgment"}<//
            ><//
          >
          <${Stack} component="section" id=${"thesis"} gap="sm" my="xl"
            ><${Box}>${"01 / Design thesis"}<//
            ><${Title} order=${2} mt="lg" mb="xs">${"Start with ownership"}<//
            ><${Text} component="p" my="sm"
              >${"Organize around the components that can make durable decisions: who owns a fact, how it is recorded, who may change it, and what happens if a process disappears mid-operation."}<//
            ><${Blockquote} color=${"teal"} my="md"
              ><strong>${"Scope."}</strong
              >${" This section describes a proposed design. The source inventory below distinguishes it from the current implementation; names and directory trees are illustrative."}<//
            ><${SimpleGrid} cols=${{ base: 1, sm: 3 }} spacing="md"
              ><${Paper} withBorder=${true} p="md" radius="md"
                ><${Title} order=${3} mt="lg" mb="xs">${"Authority"}<//
                ><${Text} component="p" my="sm"
                  >${"Each durable fact has a clear owner and a supported interface for changing or reading it."}<//
                ><//
              ><${Paper} withBorder=${true} p="md" radius="md"
                ><${Title} order=${3} mt="lg" mb="xs">${"Isolation"}<//
                ><${Text} component="p" my="sm"
                  >${"An environment is the security boundary for the code, credentials, filesystem and Sessions within it."}<//
                ><//
              ><${Paper} withBorder=${true} p="md" radius="md"
                ><${Title} order=${3} mt="lg" mb="xs">${"Evidence"}<//
                ><${Text} component="p" my="sm"
                  >${"A request, its admission, an attempted effect and a confirmed outcome are distinct facts."}<//
                ><//
              ><//
            ><//
          ><${Stack} component="section" id=${"model"} gap="sm" my="xl"
            ><${Box}>${"02 / Vocabulary"}<//
            ><${Title} order=${2} mt="lg" mb="xs">${"A small core model"}<//
            ><${List} spacing="xs"
              ><${List.Item}
                ><strong>${"Principal:"}</strong
                >${" a human, service or agent identity that can receive permissions."}<//
              ><${List.Item}
                ><strong>${"Environment:"}</strong
                >${" an isolated place to execute code, with an identity, storage, network policy and lifecycle."}<//
              ><${List.Item}
                ><strong>${"Session:"}</strong
                >${" durable agent work with commands, events, execution state and an assigned environment."}<//
              ><${List.Item}
                ><strong>${"Action:"}</strong
                >${" a requested effect in another system, with a policy decision and an execution record."}<//
              ><${List.Item}
                ><strong>${"Message:"}</strong
                >${" a durable notification or communication addressed to a principal or Session."}<//
              ><//
            ><${Text} component="p" my="sm"
              >${"In this proposal, a conversation is a read view of a Session. Multiple Sessions in an environment share its security boundary unless an additional isolation mechanism is explicitly provided."}<//
            ><//
          ><${Stack} component="section" id=${"ownership"} gap="sm" my="xl"
            ><${Box}>${"03 / Logical components"}<//
            ><${Title} order=${2} mt="lg" mb="xs"
              >${"Give each decision an owner"}<//
            ><${Box} style=${{ overflowX: "auto" }}
              ><${Table}
                withTableBorder=${true}
                striped=${true}
                highlightOnHover=${true}
                ><thead>
                  <tr>
                    <th>${"Component"}</th>
                    <th>${"Owns and decides"}</th>
                    <th>${"Boundary"}</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>${"Identity & policy"}</td>
                    <td>
                      ${"Principals, credentials, grants and policy evaluation."}
                    </td>
                    <td>
                      ${"Other owners enforce the decision for their own operation."}
                    </td>
                  </tr>
                  <tr>
                    <td>${"Environment manager"}</td>
                    <td>
                      ${"Desired configuration, placement, lifecycle and observed environment status."}
                    </td>
                    <td>
                      ${"Does not own Session history or Action decisions."}
                    </td>
                  </tr>
                  <tr>
                    <td>${"Session service"}</td>
                    <td>
                      ${"Session identity and placement, durable command admission, retained event archive and read projections."}
                    </td>
                    <td>
                      ${"The runtime produces execution observations; a view is not an execution authority."}
                    </td>
                  </tr>
                  <tr>
                    <td>${"Environment runtime"}</td>
                    <td>
                      ${"Local processes, workspace operations, execution, local journals and reporting observations."}
                    </td>
                    <td>
                      ${"Does not own global identity or operator policy."}
                    </td>
                  </tr>
                  <tr>
                    <td>${"Action service"}</td>
                    <td>
                      ${"Action catalog, requests, approval, execution attempts and receipts."}
                    </td>
                    <td>
                      ${"Owns external effects; a gateway does not duplicate its decisions."}
                    </td>
                  </tr>
                  <tr>
                    <td>${"Messaging"}</td>
                    <td>
                      ${"Subscriptions, inboxes, delivery state and acknowledgements."}
                    </td>
                    <td>
                      ${"Does not own the recipient’s Session lifecycle."}
                    </td>
                  </tr>
                  <tr>
                    <td>${"Access gateways"}</td>
                    <td>
                      ${"Browser, CLI, MCP, model and network protocol adaptation."}
                    </td>
                    <td>
                      ${"Authenticate and translate; do not create parallel business authorities."}
                    </td>
                  </tr>
                </tbody><//
              ><//
            ><${Text} component="p" my="sm"
              >${"These are logical boundaries, not a requirement for one deployment or database server per row."}<//
            ><//
          ><${Stack} component="section" id=${"flows"} gap="sm" my="xl"
            ><${Box}>${"04 / The lifecycle"}<//
            ><${Title} order=${2} mt="lg" mb="xs"
              >${"Follow a command across failures"}<//
            ><${Group} gap="xs" wrap="wrap" my="md"
              ><span>${"Client"}</span><b>${"→"}</b
              ><span>${"Session service"}</span><b>${"→"}</b
              ><span>${"Runtime"}</span><b>${"→"}</b
              ><span>${"Agent process"}</span><b>${"→"}</b
              ><span>${"Event archive"}</span><//
            ><${List} type="ordered" spacing="xs"
              ><${List.Item}
                >${"The caller submits a command with a stable idempotency key. The Session service durably records it and returns a receipt."}<//
              ><${List.Item}
                >${"A delivery worker sends the same command to the designated runtime. The runtime durably records its admission before carrying out work."}<//
              ><${List.Item}
                >${"The runtime journals observed events locally, then delivers them with ordered cursors. The Session service retains and acknowledges them."}<//
              ><${List.Item}
                >${"Read projections provide a conversation view; retained events remain available subject to the archive’s documented settlement and retention rules."}<//
              ><//
            ><${Blockquote} color=${"yellow"} my="md"
              ><strong>${"Uncertain effects stay uncertain."}</strong
              >${" A queue receipt, a network write and a timeout do not prove what an external process did. Retry transport with the same identity where safe; do not replay a non-idempotent effect merely because its result is unknown. Reconcile against evidence first."}<//
            ><${Text} component="p" my="sm"
              >${"For database updates that must cause later delivery, a transactional outbox is one possible mechanism. It commits the state change and pending delivery together; consumers still need to handle duplicates. "}<${Anchor}
                href=${"https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/transactional-outbox.html"}
                >${"AWS pattern"}<//
              ><//
            ><//
          ><${Stack} component="section" id=${"deployment"} gap="sm" my="xl"
            ><${Box}>${"05 / Physical design"}<//
            ><${Title} order=${2} mt="lg" mb="xs">${"Deploy for a reason"}<//
            ><${Text} component="p" my="sm"
              >${"Start with a modest number of processes. Run the environment runtime inside the environment for isolation. A Session service can initially contain command delivery, history ingestion and projection workers; separate them later when scale, privileges, reliability or release cadence justify it. A controller loop is a responsibility, not automatically its own service."}<//
            ><${Text} component="p" my="sm"
              >${"Give each state owner its own schema or database and access credentials, even when several databases share a PostgreSQL cluster. The runtime keeps a local durable journal on retained environment storage. Other components read and mutate owned state through its API, rather than reaching into private tables."}<//
            ><${Text} component="p" my="sm"
              >${"For Kubernetes environments, a reconciler can observe desired resources and move actual state toward them. The platform API need not expose Kubernetes objects to every caller. "}<${Anchor}
                href=${"https://kubernetes.io/docs/concepts/architecture/controller/"}
                >${"Kubernetes controllers"}<//
              ><//
            ><${Blockquote} color=${"teal"} my="md"
              ><strong>${"Ownership is not process count."}</strong
              >${" Combining two modules in one binary does not grant either permission to bypass the other’s authority. Splitting a binary does not by itself create a coherent boundary."}<//
            ><//
          ><${Stack} component="section" id=${"boundaries"} gap="sm" my="xl"
            ><${Box}>${"06 / Trust and protocols"}<//
            ><${Title} order=${2} mt="lg" mb="xs"
              >${"Enforce at the authority"}<//
            ><${List} spacing="xs"
              ><${List.Item}
                ><strong>${"Actions:"}</strong
                >${" the Action owner authorizes and records effects for every client, including the UI, CLI and MCP adapter."}<//
              ><${List.Item}
                ><strong>${"Execution:"}</strong
                >${" the runtime exposes a narrow, authenticated API and binds requests to verified identity and environment placement."}<//
              ><${List.Item}
                ><strong>${"Egress:"}</strong
                >${" a gateway enforces network policy and can inject external credentials without giving those secrets to general agent processes."}<//
              ><${List.Item}
                ><strong>${"Models:"}</strong
                >${" an authenticated gateway mediates provider access. A native harness or a central sampler can use the same Session and event contracts; placement does not redefine history."}<//
              ><${List.Item}
                ><strong>${"Presentation:"}</strong
                >${" the browser app composes APIs. Essential backend work continues when the app is unavailable."}<//
              ><//
            ><${Text} component="p" my="sm"
              >${"Use gRPC and protobuf where typed internal APIs and streaming are useful; use HTTP for browser access, OAuth, webhooks and provider protocols. MCP is an adapter for clients that use that protocol. The transport does not itself supply durable delivery or exactly-once effects. "}<${Anchor}
                href=${"https://grpc.io/docs/what-is-grpc/core-concepts/"}
                >${"gRPC concepts"}<//
              ><//
            ><//
          ><${Stack} component="section" id=${"packages"} gap="sm" my="xl"
            ><${Box}>${"07 / Code organization"}<//
            ><${Title} order=${2} mt="lg" mb="xs"
              >${"Put contracts and implementation beside their owner"}<//
            ><${Text} component="p" my="sm"
              >${"The sketch below uses current component names and process groupings, with proposed package homes shown explicitly. A component’s public contract is importable by other components; its private implementation sits under its owner. The tree does not prescribe a new Session service or a binary split."}<//
            ><${Code}
              block=${true}
              style=${{ overflowX: "auto", whiteSpace: "pre" }}
              >${"agentplane/\n  runner_gateway/\n    dispatcher/\n      api/                     # proposed home for its public wire contract\n      internal/                # admission and delivery implementation, where fitting\n    environments/              # environment management\n    gateway/                   # authenticated runtime routing\n    main.go                    # existing combined process; split is undecided\n\n  history_service/\n    api/                       # existing server handlers; public contracts can live below\n      history/                 # existing: History read proto and bindings\n      ingress/                 # existing: journal ingress proto and bindings\n    internal/\n      reads/                   # existing: History read implementation\n      storage/                 # possible later private implementation\n    projection/                # fold workers; preserve existing ownership\n    threadfold/                # currently also used by central-sampler tests\n    main.go\n\n  notification_service/\n    api/                       # existing RPC handlers\n    internal/\n      inboxaccess/             # existing: Notification inbox authorization\n    store/\n    worker/\n    main.go\n\n  action_service/\n    api/                       # existing RPC handlers\n    store/\n    worker/\n    main.go\n  env/runtime/\n    execution/  session/  journal/  harness/  claude/  codex/\n  identity/                    # auth and WorkloadCredential packages\n  egress/\n  app/\n  cli/"}<//
            ><${Text} component="p" my="sm"
              >${"A directory that groups contracts is not necessarily itself a Go package; the existing "}<${Code}>${"history_service/api"}</${Code}>${" is already a server-handler package and can have child contract packages. Place contracts outside "}<${Code}>${"internal/"}</${Code}>${" if callers outside the owner need them. Keep protobuf package/service names and wire semantics stable when moving files; a directory name alone does not introduce a new API version."}<//
            ><${Text} component="p" my="sm"
              >${"Do not move "}<${Code}>${"threadfold"}</${Code}>${" inside History’s "}<${Code}>${"internal/"}</${Code}>${" while the central sampler tests import it. Decide whether those tests should exercise History’s public boundary or whether a smaller shared projection contract is actually justified before changing that dependency."}<//
            ><//
          ><${Stack} component="section" id=${"rules"} gap="sm" my="xl"
            ><${Box}>${"08 / Conventions"}<//
            ><${Title} order=${2} mt="lg" mb="xs"
              >${"What the Go boundaries mean"}<//
            ><${Title} order=${3} mt="lg" mb="xs"
              >${"Commands assemble; packages implement"}<//
            ><${Text} component="p" my="sm"
              >${"Keep "}<${Code}>${"main"}</${Code}>${" focused on configuration, constructing dependencies, starting and stopping the process. "}<${Code}>${"cmd/"}</${Code}>${" is a common layout for repositories with commands and importable packages, not a language requirement. "}<${Anchor}
                href=${"https://go.dev/doc/modules/layout"}
                >${"Go module layout"}<//
              ><//
            ><${Title} order=${3} mt="lg" mb="xs"
              >${"Use "}<${Code}>${"internal/"}</${Code}>${" to constrain imports"}<//
            ><${Text} component="p" my="sm"
              >${"Go permits importing a package below "}<${Code}>${"internal/"}</${Code}>${" only from the tree rooted at the directory immediately above that "}<${Code}>${"internal"}</${Code}>${" directory. Thus "}<${Code}>${"session/cmd/sessiond"}</${Code}>${" may import "}<${Code}>${"session/internal/postgres"}</${Code}>${", but "}<${Code}>${"action/"}</${Code}>${" may not. This is a build-time import rule, not a runtime security boundary. "}<${Anchor}
                href=${"https://pkg.go.dev/cmd/go#hdr-Internal_Directories"}
                >${"Go command reference"}<//
              ><//
            ><${Title} order=${3} mt="lg" mb="xs"
              >${"Name packages for what they do"}<//
            ><${Text} component="p" my="sm"
              >${"Prefer short, meaningful names like "}<${Code}>${"journal"}</${Code}>${" or "}<${Code}>${"lifecycle"}</${Code}>${". Avoid catch-all packages such as "}<${Code}>${"common"}</${Code}>${", "}<${Code}>${"utils"}</${Code}>${" or one giant "}<${Code}>${"types"}</${Code}>${" package. A directory used only to group other directories does not itself have to be a Go package. "}<${Anchor}
                href=${"https://go.dev/blog/package-names"}
                >${"Go package names"}<//
              ><//
            ><${Title} order=${3} mt="lg" mb="xs"
              >${"Use interfaces at real seams"}<//
            ><${Text} component="p" my="sm"
              >${"Go interfaces are implemented implicitly. When an interface is useful, define a small one near the consumer’s needs; implementations can return concrete types. Do not introduce an interface for every struct, or translate every protobuf message to a duplicate domain type without a reason. "}<${Anchor}
                href=${"https://go.dev/wiki/CodeReviewComments#interfaces"}
                >${"Go review guidance"}<//
              ><//
            ><${Title} order=${3} mt="lg" mb="xs"
              >${"Follow the dependency direction"}<//
            ><${Text} component="p" my="sm"
              >${"Clients import public contracts; transport handlers call their owner’s logic; implementations depend on narrowly scoped contracts, not on another service’s private database package. Keep related test files next to the code they verify. Integration tests should exercise real boundaries and failure behavior, not just mock the same implementation assumptions."}<//
            ><//
          ><${Stack} component="section" id=${"inventory"} gap="sm" my="xl"
            ><${Box}>${"09 / Stage 1 · Source inventory"}<//
            ><${Title} order=${2} mt="lg" mb="xs"
              >${"What owns each fact today"}<//
            ><${Blockquote} color=${"teal"} my="md"
              ><strong>${"Scope and snapshot."}</strong
              >${" Read-only source and test inventory of local "}<${Code}>${"origin/devel"}</${Code}>${" at "}<${Code}>${"93f2ba8eeff36265d6e7887836b615c39b4ad985"}</${Code}>${", 12 November 2026. This is a repository snapshot, not a live database, Kubernetes, rollout or fresh CI inventory. Earlier proposal sections describe a possible target. This section distinguishes that target from current implementation."}<//
            ><${Text} component="p" my="sm">${"Changes since the previous snapshot: "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15931"}>${"History reads"}<//>${" and "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15938"}>${"Notification inbox authorization"}<//>${" moved into their owners; "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15920"}>${"sampler code-mode host and session"}<//>${" moved into an internal package. "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15934"}>${"Executor"}<//>${" and "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15921"}>${"store"}<//>${" files were reorganized within the sampler package. "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15925"}>${"Identity-scoped Environment list/get"}<//>${", "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15945"}>${"Identity actor retention"}<//>${", and "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15917"}>${"Identity-only workload credential subjects"}<//>${" landed in source; these are not live deployment claims."}<//
            >${"\n"}<${Box} style=${{ overflowX: "auto" }}
              ><${Table}
                withTableBorder=${true}
                striped=${true}
                highlightOnHover=${true}
                ><thead>
                  <tr>
                    <th>${"Fact or action"}</th>
                    <th>${"Current owner, state and interface"}</th>
                    <th>${"Failure / lifecycle boundary"}</th>
                  </tr>
                </thead>
                <tbody>
                  ${"\n"}
                  <tr>
                    <td>${"Environment desired and observed state"}</td>
                    <td>
                      ${"Runner Gateway’s EnvironmentService creates and changes Sandbox resources; Sandbox Controller reconciles Pods or VMs, state PVCs, credentials and "}<${Code}>${"Sandbox.status"}</${Code}>${". Kubernetes API is the desired/observed state interface. "}<${Anchor}
                        href=${"https://github.com/agentydragon/ducktape/blob/93f2ba8eeff36265d6e7887836b615c39b4ad985/agentplane/docs/system_overview.md#sandbox-lifecycle-and-runner-control"}
                        >${"Topology"}<//
                      >
                    </td>
                    <td>
                      ${"Managed deletion waits for Runtime quiescence and the final History acknowledgement. API deletion timestamps, caches and DB tombstones are separate events, not one transaction."}
                    </td>
                  </tr>
                  ${"\n"}
                  <tr>
                    <td>${"Session directory and commands"}</td>
                    <td>
                      ${"Dispatcher in Runner Gateway owns logical Session records, placement and queue receipts in its PostgreSQL database. App, CLI and brokers call its gRPC API. "}<${Anchor}
                        href=${"https://github.com/agentydragon/ducktape/blob/93f2ba8eeff36265d6e7887836b615c39b4ad985/agentplane/runner_gateway/dispatcher/SPEC.md"}
                        >${"Dispatcher contract"}<//
                      >
                    </td>
                    <td>
                      ${"Queue acceptance, Runtime admission and native effect are different facts. A sticky possible-forwarding marker preserves uncertainty. After Sandbox deletion, cleanup removes receipts; terminal watch snapshots are not durable future reads."}
                    </td>
                  </tr>
                  ${"\n"}
                  <tr>
                    <td>${"Native Sessions and execution"}</td>
                    <td>
                      ${"Environment Runtime owns durable local Session records, SQLite journals, native harness state and process execution. Gateway authenticates and proxies to Runtime over mTLS. "}<${Anchor}
                        href=${"https://github.com/agentydragon/ducktape/blob/93f2ba8eeff36265d6e7887836b615c39b4ad985/agentplane/env/runtime/docs/session_protocol.md"}
                        >${"Session protocol"}<//
                      >
                    </td>
                    <td>
                      ${"Admission and event commit are atomic locally; planned work with an unproven native outcome remains pending, not resent. Pod and VM successor processes require their respective external or systemd fences."}
                    </td>
                  </tr>
                  ${"\n"}
                  <tr>
                    <td>${"Shutdown and sealing"}</td>
                    <td>
                      ${"Runtime owns admission closure, component drain, native and Execution fencing, journal seal and delivery; its lifecycle worker observes exact-generation component status. "}<${Anchor}
                        href=${"https://github.com/agentydragon/ducktape/blob/93f2ba8eeff36265d6e7887836b615c39b4ad985/agentplane/env/runtime/docs/lifecycle.md"}
                        >${"Lifecycle ownership"}<//
                      >
                    </td>
                    <td>

                >${"Shared decoder"}<//

            ><${Text} component="p" my="sm"

              >${"History reads "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15931"}>${"#15931"}<//>${", Notification inbox authorization "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15938"}>${"#15938"}<//>${", History read API "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15967"}>${"#15967"}<//>${", sampler image preparation "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15964"}>${"#15964"}<//>${", Notification entry storage "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15987"}>${"#15987"}<//>${" and the History ingress API "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15990"}>${"#15990"}<//>${" are merged. The two API moves retained their protobuf package and wire names; entry storage uses the existing caller-owned transaction. These are source changes, not a deployment claim."}<//
            >${"\n"}<${Title} order=${3} mt="lg" mb="xs"
              >${"1 · Extract bounded sampler process output"}<//
            ><${Text} component="p" my="sm"
              >${"Move the head-and-tail buffer in "}<${Code}>${"central_sampler/head_tail_buffer.go"}</${Code}>${" to a focused private package such as "}<${Code}>${"internal/outputbuffer"}</${Code}>${". Give Executor, process storage and unified exec one explicit API for appending, retaining and restoring output and reading the omission count. Preserve the one-MiB limit, exact retained bytes, omission marker and persisted buffered-output/omitted-count representation; keep truncation’s shared marker consistent. Move the focused buffer tests and run sampler unit and race/integration coverage for process recovery, late output and truncation. "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/blob/bd9c47205427a93917d3c5fb5d272b588fd2e937/agentplane/central_sampler/head_tail_buffer.go"}>${"Buffer"}<//>${" · "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/blob/bd9c47205427a93917d3c5fb5d272b588fd2e937/agentplane/central_sampler/store_processes.go"}>${"Persisted process output"}<//><//
            >${"\n"}<${Title} order=${3} mt="lg" mb="xs"

            >${"\n"}<${Title} order=${3} mt="lg" mb="xs"

            ><${Text} component="p" my="sm"
              >${"Move "}<${Code}>${"notification_service/store"}</${Code}>${" under "}<${Code}>${"notification_service/internal/store"}</${Code}>${", including its existing "}<${Code}>${"internal/entry"}</${Code}>${" child. The source preflight found Go imports and Bazel dependencies only within Notification; update its API, workers, GitHub provider, migrations tests, docs and the system-test source comment together. This enforces the owner boundary; it does not itself split the flat store. Preserve lock order and transactions, and run store, API and worker integration tests. Open "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/pull/15929"}>${"#15929"}<//>${" touches overlapping files; a conflict alone is not a dependency. "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/blob/bd9c47205427a93917d3c5fb5d272b588fd2e937/agentplane/notification_service/store/BUILD.bazel"}>${"Store package"}<//><//
            >${"\n"}<${Title} order=${3} mt="lg" mb="xs"
              >${"4 · Extract the sampler History exporter"}<//
            ><${Text} component="p" my="sm"
              >${"Define a cohesive outbox boundary for a Session snapshot and cursor from the same read, journal pages, checkpoints and pending IDs; inject wakeups at composition. History ingress integration tests call the exported one-shot exporter, so compare an intentionally importable "}<${Code}>${"central_sampler/historyexport"}</${Code}>${" package with relocating the integration harness before choosing visibility. Avoid parent import cycles and transitional shims. Preserve cumulative ACK validation, consecutive pages, bounded scheduling, retries, and checkpoint advancement only after a covered snapshot and clean RPC completion. Run sampler race/integration and History ingress tests, including lost ACK, concurrent exporters and cancellation. "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/blob/bd9c47205427a93917d3c5fb5d272b588fd2e937/agentplane/central_sampler/exporter.go"}>${"Exporter"}<//>${" · "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/blob/bd9c47205427a93917d3c5fb5d272b588fd2e937/agentplane/history_service/ingress/sampler_export_test.go"}>${"Cross-service tests"}<//><//

            ><${Text} component="p" my="sm"
              >${"Two sampler tests import History’s "}<${Code}>${"threadfold"}</${Code}>${" to verify actual sampler recovery, retained tool results and failed/queued input projection. First reproduce those producer-to-History scenarios in a History-owned integration harness or through a public boundary. Hand-built History fold fixtures are useful but do not alone prove sampler output still projects correctly. Then remove the external imports and move the fold under History’s "}<${Code}>${"internal/"}</${Code}>${"; run sampler recovery, History fold, projection and cross-service integration tests. "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/blob/bd9c47205427a93917d3c5fb5d272b588fd2e937/agentplane/central_sampler/sampling_recovery_test.go"}>${"Sampler recovery"}<//>${" · "}<${Anchor} href=${"https://github.com/agentydragon/ducktape/blob/bd9c47205427a93917d3c5fb5d272b588fd2e937/agentplane/central_sampler/store_integration_test.go"}>${"Failed input"}<//><//

                href=${"https://github.com/agentydragon/ducktape/blob/93f2ba8eeff36265d6e7887836b615c39b4ad985/agentplane/plans/task_dag.md"}

              ><${Code}>${"SESSION_DATA_OWNERSHIP_DESIGN"}<//
