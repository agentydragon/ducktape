<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentplane organization: current and goal trees</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript
      >This report uses JavaScript for its interactive tree views.</noscript
    >
    <script type="module">
      import { useEffect, useState } from "react";
      import {
        Accordion,
        Anchor,
        Badge,
        Blockquote,
        Box,
        Checkbox,
        Container,
        Group,
        List,
        Paper,
        Select,
        SimpleGrid,
        Stack,
        Text,
        Title,
      } from "@mantine/core";
      import { html, mount } from "../report.js";
      const sourceURL = (plan, path) =>
        `https://github.com/agentydragon/ducktape/tree/${plan.source_sha}/${path}`;
      function treeLines(plan, component, goal, showFiles) {
        const root = { name: component.path + "/", children: new Map() };
        function node(path, directory = true) {
          let current = root;
          const relative = path
            .slice(component.path.length + 1)
            .replace(/\/$/, "");
          if (!relative) return current;
          const parts = relative.split("/");
          for (let i = 0; i < parts.length; i++) {
            const part = parts[i];
            if (!current.children.has(part))
              current.children.set(part, {
                name: part + (i < parts.length - 1 || directory ? "/" : ""),
                children: new Map(),
              });
            current = current.children.get(part);
          }
          return current;
        }
        for (const dir of component.directories) {
          const n = dir.path === component.path ? root : node(dir.path);
          n.note = `${dir.production} Go + ${dir.tests} tests`;
          if (showFiles) for (const path of dir.files) node(path, false);
        }
        for (const path of component.context_paths) {
          const n = node(path, path.endsWith("/"));
          n.note = path.endsWith("/")
            ? "browser owner; context"
            : "protocol source; context";
        }
        for (const track of plan.remaining_work.filter((t) =>
          t.components.includes(component.id),
        )) {
          if (!track.candidate_target) continue;
          const source = node(track.source_owner);
          source.note = goal
            ? "= composition / shared authority retained; exact file split TBD"
            : `${source.note} → ? ${track.candidate_target.split("/").pop()}/`;
          if (showFiles)
            for (const path of track.source_paths)
              node(path, false).note =
                "→ ? responsibility extraction; not a whole-file rename";
          if (goal) {
            const target = node(track.candidate_target);
            target.marker = "? ";
            target.note = "candidate only; contract and file allocation TBD";
          }
        }
        const lines = [root.name + (root.note ? `  [${root.note}]` : "")];
        function visit(parent, prefix) {
          const children = [...parent.children.values()].sort((a, b) =>
            a.name.localeCompare(b.name),
          );
          children.forEach((n, i) => {
            const last = i === children.length - 1;
            lines.push(
              prefix +
                (last ? "└── " : "├── ") +
                (n.marker || "") +
                n.name +
                (n.note ? `  [${n.note}]` : ""),
            );
            visit(n, prefix + (last ? "    " : "│   "));
          });
        }
        visit(root, "");
        return lines.join("\n");
      }
      function TreePane({ title, text, id }) {
        return html`<${Paper} withBorder p="md" style=${{ minWidth: 0 }}>
          <${Title} order=${3}>${title}<//>
          <${Box}
            component="pre"
            data-testid=${id}
            tabIndex=${0}
            aria-label=${title + " tree"}
            style=${{ overflowX: "auto", maxWidth: "100%", fontFamily: "var(--mantine-font-family-monospace)", fontSize: "0.78rem", lineHeight: 1.65, whiteSpace: "pre", paddingBottom: "0.5rem" }}
            >${text}<//
          >
        <//>`;
      }
      function Report() {
        const [plan, setPlan] = useState(null);
        const [error, setError] = useState(null);
        const [selected, setSelected] = useState("env");
        const [showFiles, setShowFiles] = useState(false);
        useEffect(() => {
          const controller = new AbortController();
          fetch("go-plan.json", { signal: controller.signal })
            .then((response) => {
              if (!response.ok) throw new Error(`Plan HTTP ${response.status}`);
              return response.json();
            })
            .then(setPlan)
            .catch((error) => {
              if (error.name !== "AbortError") setError(error.message);
            });
          return () => controller.abort();
        }, []);
        if (error)
          return html`<${Container} py="xl"
            ><${Title} order=${1}>${"Agentplane organization"}<//
            ><${Text} role="alert">${error}<//><//
          >`;
        if (!plan)
          return html`<${Container} py="xl"
            ><${Text}>${"Loading current and goal trees…"}<//><//
          >`;
        const component = plan.components.find((c) => c.id === selected);
        const tracks = plan.remaining_work.filter((t) =>
          t.components.includes(selected),
        );
        const overview =
          "agentplane/\n" +
          plan.components
            .map(
              (c, i) =>
                `${i === plan.components.length - 1 ? "└──" : "├──"} ${c.id}/  [${c.counts.files} tracked Go files${c.pending_tracks.length ? "; see remaining design" : "; = keep owner"}]`,
            )
            .join("\n");
        return html`<${Container} size="xl" py="xl"
          ><${Stack} gap="lg">
            <${Anchor} href="../">${"All reports"}<//>
            <${Title} order=${1}>${"Agentplane: current → goal"}<//>
            <${Text}
              >${"The plan contains remaining work. Compare the actual ownership tree with the goal, then inspect the source responsibilities and adoption gates below. Completed PR listings have been removed."}<//
            >
            <${Text} size="sm" c="dimmed"
              >${`${plan.counts.files.toLocaleString()} tracked Go files · ${plan.counts.directories} Go directories · source ${plan.source_sha.slice(0, 10)} · observed ${plan.observed_at_utc}. Counts include every tracked Agentplane Go file, including tests and experiments. Trees also show protocol/browser context; generated Go bindings are not tracked files.`}<//
            >
            <${Group} component="nav" gap="md"
              ><${Anchor} href="#trees">${"Current and goal trees"}<//
              ><${Anchor} href="#remaining">${"Remaining work"}<//
              ><${Anchor} href="#adoption">${"Adoption order"}<//
              ><${Anchor} href="#rules">${"Organization rules"}<//><//
            >
            <${Group} gap="sm"
              ><${Anchor} href="go-plan.json">${"Remaining plan data"}<//
              ><${Anchor} href="go-files.json">${"Every current Go file"}<//
              ><${Anchor} href="evidence.json"
                >${"Source and historical validation evidence"}<//
              ><//
            >
            <${Stack} component="section" id="trees" gap="md">
              <${Title} order=${2}>${"Current and goal trees"}<//>
              <${Text}
                >${"= keep the current owner · ? candidate destination, requires design · → extract a responsibility after its contract is decided · ≋ contract design with no path move selected. Goal counts and file lists are current-source context; candidate allocations are not final."}<//
              >
              <${Group} align="end"
                ><${Select}
                  label="Component"
                  value=${selected}
                  onChange=${setSelected}
                  allowDeselect=${false}
                  searchable
                  data=${plan.components.map((c) => ({ value: c.id, label: `${c.id} (${c.counts.files} Go files)` }))}
                  style=${{ width: "min(100%, 26rem)" }} /><${Checkbox}
                  label="Show Go file names"
                  checked=${showFiles}
                  onChange=${(event) => setShowFiles(event.currentTarget.checked)}
              /><//>
              <${Text} size="sm">${component.goal_note}<//>
              <${SimpleGrid}
                cols=${{ base: 1, md: 2 }}
                spacing="md"
                data-testid="tree-pair"
              >
                <${TreePane}
                  title="Current"
                  id="current-tree"
                  text=${treeLines(plan, component, false, showFiles)}
                />
                <${TreePane}
                  title="Goal"
                  id="goal-tree"
                  text=${treeLines(plan, component, true, showFiles)}
                />
              <//>
              <${Stack} gap="xs"
                >${tracks.map((track) => html`<${Group} key=${track.id} gap="xs"><${Badge} color=${track.candidate_target ? "yellow" : "gray"}>${track.candidate_target ? "? candidate extraction" : "≋ no path move selected"}<//><${Anchor} href=${"#" + track.id}>${track.title}<//><//>`)}<//
              >
              <${Accordion} variant="contained"
                ><${Accordion.Item} value="whole-tree"
                  ><${Accordion.Control}>${"Whole Agentplane ownership tree"}<//
                  ><${Accordion.Panel}
                    ><${TreePane}
                      title="Owners retained in the goal"
                      id="whole-tree"
                      text=${overview} /><//><//
              ><//>
            <//>
            <${Stack} component="section" id="remaining" gap="md">
              <${Title} order=${2}>${"Remaining work"}<//>
              <${Text}
                >${"There are no ready filesystem moves in this snapshot. The remaining differences are two responsibility extractions with design gates, plus two deferred contract designs. In particular, app/ already has cmd/, internal/ and frontend/ directly; app/go/ does not exist."}<//
              >
              ${plan.remaining_work.map(
                (track) =>
                  html`<${Paper}
                    key=${track.id}
                    component="article"
                    id=${track.id}
                    withBorder
                    p="lg"
                    style=${{ minWidth: 0, overflowWrap: "anywhere" }}
                  >
                    <${Group} gap="sm"
                      ><${Badge}
                        color=${track.candidate_target ? "yellow" : "gray"}
                        >${track.status}<//
                      ><${Text} size="sm" c="dimmed">${track.kind}<//><//
                    >
                    <${Title} order=${3} mt="sm">${track.title}<//>
                    <${Text} mt="sm">${track.summary}<//>
                    ${track.candidate_target ? html`<${TreePane} title="Responsibility flow" id=${track.id + "-flow"} text=${`${track.source_owner}/\n└── selected types, methods and their tests\n    └── → ? ${track.candidate_target}/\n        └── API and exact filenames decided after the contract`} />` : ""}
                    <${List} type="ordered" spacing="xs" mt="sm"
                      >${track.how.map((step) => html`<${List.Item} key=${step}>${step}<//>`)}<//
                    >
                    <${Blockquote} color="yellow" mt="sm">${track.gate}<//>
                    <${Text} size="sm" mt="sm"
                      >${"Preserve: " + track.preserve}<//
                    >
                    <${Accordion} variant="contained" mt="sm"
                      ><${Accordion.Item} value="source"
                        ><${Accordion.Control}
                          >${"Source locations and validation"}<//
                        ><${Accordion.Panel}>
                          <${Text} size="sm"
                            >${"These are current source locations to inspect. Candidate extractions split responsibilities; this list is not a bulk rename manifest."}<//
                          >
                          <${List} size="sm"
                            >${track.evidence_paths.map((path) => html`<${List.Item} key=${path}><${Anchor} href=${sourceURL(plan, path)}>${path}<//><//>`)}<//
                          >
                          <${List} size="sm" mt="sm"
                            >${track.validation.map((label) => html`<${List.Item} key=${label}>${label}<//>`)}<//
                          >
                        <//><//
                      ><//
                    >
                  <//>`,
              )}
            <//>
            <${Stack} component="section" id="adoption" gap="md">
              <${Title} order=${2}>${"Adoption order"}<//>
              <${List} type="ordered" spacing="md"
                >${plan.adoption.map((stage) => html`<${List.Item} key=${stage.stage}><${Text} fw=${600}>${stage.title}<//><${Text} size="sm">${stage.result}<//><//>`)}<//
              >
              <${Text} size="sm"
                >${"Runtime lifecycle and Notification transaction research can proceed independently. Dispatch the smallest decided responsibility with complete import/BUILD/docs/test closure. Native stack membership records content dependencies; rebase conflicts do not create design dependencies. Remove an item from this plan when its implementation lands."}<//
              >
            <//>
            <${Stack} component="section" id="rules" gap="md">
              <${Title} order=${2}>${"Organization rules"}<//>
              <${List} spacing="sm"
                >${plan.structure_rules.map((rule) => html`<${List.Item} key=${rule}>${rule}<//>`)}<//
              >
              <${Text} size="sm"
                >${"Conventions: "}<${Anchor}
                  href="https://go.dev/doc/modules/layout"
                  >${"Go module layout: internal/ and cmd/"}<//
                >${"; "}<${Anchor}
                  href="https://go.dev/doc/effective_go#package-names"
                  >${"Go package names"}<//
                >${"; "}<${Anchor}
                  href=${`https://github.com/agentydragon/ducktape/blob/${plan.source_sha}/README.md#plans`}
                  >${"Repository plan burn-down convention"}<//
                >${". Go establishes the visibility and naming conventions; the concrete ownership boundaries here are project design choices."}<//
              >
            <//>
          <//><//
        >`;
      }
      mount(Report);
    </script>
  </body>
</html>
