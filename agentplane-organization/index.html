                    </td>

                    </td>

                    </td>

              >${"Build a hierarchy within each owner"}<//
            ><${Text} component="p" my="sm">${"Current navigation hotspots, counted as direct tracked Go files including tests: sampler 70 (22 tests), Runtime 57 (33), Notification store 49 (32), app/go 31 (15), Sandbox controller 29 (13), Action handlers 28 (16), Dispatcher 27 (14) and Notification RPC 22 (11). Tests are a subset of each total; subdirectories and generated outputs are excluded. The sampler is down from 80 at the previous preflight after settings, toolcontract and tooloutput moved. The next two extractions create useful leaves without splitting mutable owners. File counts measure navigation, not performance or a target package size. "}<${Anchor} href=${"evidence.json"}>${"Snapshot and counting method"}<//><//
            ><${Blockquote} color=${"teal"} my="md"

                >${"Shared decoder"}<//

            ><${Text} component="p" my="sm"
              >${"The shared code-mode child process, framing and logical-session lifecycle have already moved to internal/codemode (#15920), while tool adaptation and effect evidence remain in the sampler. Executor files were split by operation (#15934) and Store files by transaction area (#15921); these latter two changes reorganized files within the same Go package rather than moving the whole subsystem. The remaining larger split is not a mechanical move. "}<${Code}>${"CodeMode"}</${Code}>${", "}<${Code}>${"Executor"}</${Code}>${", "}<${Code}>${"Runtime"}</${Code}>${" and "}<${Code}>${"Store"}</${Code}>${" currently refer to each other. Move an entire responsibility with a narrow, meaningful contract; avoid a cycle or a new interface for each method. Keep lease fences, durable intent/effect transitions and their SQL transactions intact. Existing "}<${Code}>${"anthropic/"}</${Code}>${", "}<${Code}>${"responses/"}</${Code}>${" and "}<${Code}>${"protocol/"}</${Code}>${" are already useful boundaries; do not recreate them."}<//
