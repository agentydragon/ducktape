# BuildBuddy Workflows Configuration
#
# Runs Bazel build/test/lint on BuildBuddy RBE for faster CI.
# Non-Bazel tasks (ansible-lint, nix-flake-check, pre-commit) remain in GitHub Actions.
#
# BuildBuddy docs: https://www.buildbuddy.io/docs/workflows-config/
#
# RBE is NOT auto-enabled by BuildBuddy Workflows (only remote cache + BES are).
# We pass --config=rbe (defined in .bazelrc) to enable remote execution.
# See: https://www.buildbuddy.io/docs/rbe-setup/

actions:
  - name: "CI"
    triggers:
      push:
        branches:
          - main
          - master
          - devel
      pull_request: {}

    # Use Ubuntu 24.04 for glibc 2.39 (Node.js 22.11.0 requires glibc 2.28+)
    # BuildBuddy Workflows only supports predefined Ubuntu images, not custom images
    # like ghcr.io/agentydragon/rbe-worker. RBE workers still use the custom image.
    container_image: "ubuntu-24.04"
    resource_requests:
      disk: "50GB"

    bazel_commands:
      # 1. Run all tests (excluding live OpenAI API tests)
      - >
        test
        --keep_going
        --config=rbe
        --build_metadata=ROLE=ci
        --build_metadata=TAGS=test
        --test_tag_filters=-live_openai_api
        --test_env=CI=true
        --test_env=BUILDBUDDY_WORKFLOWS=true
        //...

      # 2. Build + lint + typecheck + rust-check (all quality checks in one pass)
      # Lint runs by default: ruff, ESLint, mypy, clippy, rustfmt.
      # Use local strategy for mypy to avoid sandbox copying overhead.
      - >
        build
        --keep_going
        --config=rbe
        --strategy=mypy=local
        --build_metadata=ROLE=ci
        --build_metadata=TAGS=check
        //...

  # Release action: test, build all artifacts, upload to GitHub Releases, dispatch GHA nix-pin.
  # Only triggers on push to main/devel (not PRs).
  - name: "Release"
    triggers:
      push:
        branches:
          - main
          - devel
      workflow_dispatch: {}

    container_image: "ubuntu-24.04"
    resource_requests:
      disk: "50GB"

    env:
      GH_TOKEN: $GH_RELEASE_PAT

    steps:
      - run: |
          bazel test --keep_going --config=rbe \
            --build_metadata=ROLE=ci \
            --test_tag_filters=-live_openai_api \
            --test_env=CI=true \
            //...
      - run: |
          sudo apt-get install -y libdbus-1-dev libgirepository1.0-dev
          bazel build --config=rbe --remote_download_toplevel \
            //:wheel \
            //:claude_hooks_wheel \
            //gterm_theme:wheel \
            //skills:all_skills_tar \
            //devinfra/buildbuddy_cli:bbapi
      - run: |
          mkdir -p dist
          cp bazel-bin/claude_hooks-*.whl dist/
          cp bazel-bin/ducktape-*.whl dist/
          cp bazel-bin/gterm_theme/gterm_theme-*.whl dist/
          cp bazel-bin/skills/all_skills_tar.tar dist/skills.tar
          cp bazel-bin/devinfra/buildbuddy_cli/bbapi_/bbapi dist/

          SHORT_SHA=$(git rev-parse --short HEAD)

          # Create a new release; fails on any error including "already exists".
          create_release() {
            local tag="$1" title="$2" body="$3"; shift 3
            gh release create "$tag" --title "$title" --notes "$body" --latest=false "$@"
          }
          # Create or re-upload assets for rolling tags that are expected to already exist.
          upsert_release() {
            local tag="$1" title="$2" body="$3"; shift 3
            local out
            if out=$(gh release create "$tag" --title "$title" --notes "$body" \
                --latest=false "$@" 2>&1); then
              return 0
            fi
            case "$out" in
              *already_exist*|*"already exists"*)
                gh release upload "$tag" "$@" --clobber ;;
              *)
                echo "gh release create $tag: $out" >&2
                return 1 ;;
            esac
          }
          # Upload to pinned commit tags (used by flake.nix for deterministic pins).
          create_release "claude-hooks-$SHORT_SHA" \
            "claude-hooks ($SHORT_SHA)" "claude-hooks wheel for Claude Code integration." \
            dist/claude_hooks-*.whl
          create_release "ducktape-$SHORT_SHA" \
            "ducktape ($SHORT_SHA)" "ducktape wheel containing CLI tools." \
            dist/ducktape-*.whl
          create_release "gterm-theme-$SHORT_SHA" \
            "gterm-theme ($SHORT_SHA)" "gterm-theme wheel (GNOME Terminal theme follower)." \
            dist/gterm_theme-*.whl
          create_release "skills-$SHORT_SHA" \
            "skills ($SHORT_SHA)" "Skills tarball for AI agent deployment." \
            dist/skills.tar
          create_release "bbapi-$SHORT_SHA" \
            "bbapi ($SHORT_SHA)" "bbapi — BuildBuddy API CLI (Linux x86_64)." \
            dist/bbapi
          # Keep a rolling claude-hooks-latest tag: pre-commit.yml installs it via pip
          # at CI time, before the SHA-pinned release exists for that commit.
          upsert_release claude-hooks-latest \
            "claude-hooks (latest)" "claude-hooks wheel for Claude Code integration." \
            dist/claude_hooks-*.whl

          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          gh workflow run release.yml --ref "$BRANCH" --field short_sha="$SHORT_SHA"

  # Build container images (OCI images built with Bazel)
  - name: "Build Container Images"
    triggers:
      push:
        branches:
          - main
          - devel
      workflow_dispatch: {}

    # Same as CI action - BuildBuddy Workflows doesn't support custom images
    container_image: "ubuntu-24.04"
    resource_requests:
      disk: "50GB"

    bazel_commands:
      # Build OCI images for potential release
      # These are built but not pushed to GHCR (GitHub Actions handles pushing)
      - >
        build --config=rbe
        //props/backend:image
        //x/agent_server:image
