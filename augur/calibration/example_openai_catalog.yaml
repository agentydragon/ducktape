# Example prediction-market catalog: hand-curated Manifold markets about exogenous
# OpenAI trajectories, used to compare an augur exogenous model against market-implied
# probabilities. A real deployment supplies its own catalog (and chooses the issuer +
# model); this file ships as a worked example.
#
# DATA ONLY and read-only with respect to any model. calibration.py resolves the
# cleanly-mappable (`exact`) markets per rollout and surfaces the rest. The verbatim
# `resolution_criterion_text` is the source of truth a resolver implements -- NOT the
# question title.
#
# Provenance: collected via the Manifold MCP server (search_markets / get_market) on
# `as_of`. `resolution_criterion_text` is the market's verbatim `textDescription`;
# long descriptions are kept only for the resolution-criteria portion (`# excerpt`).

metadata:
  source: manifold
  as_of: "2026-05-29"
  # Model anchor date: month indices for `resolution_deadline`s are measured from here.
  augur_model_as_of: "2026-05-27"
  augur_sim_horizon_months: 120 # from as_of -> ~2036-05; later-resolving markets flagged

  # `mappability` -- how the market relates to a modeled augur quantity:
  #   exact      A resolver scores it apples-to-apples from per-rollout output
  #              (mapping_kind + mapping_params; recipe in `sim_signal`).
  #   correlate  augur lacks the exact concept but has a RELATED signal worth surfacing
  #              next to the market price (`correlate_of`); NOT scored. Caveat in `reason`.
  #   unmappable no meaningfully related augur signal; see `reason`.
  #
  # `mapping_kind` (exact markets only):
  mapping_kinds:
    ipo_by_date: "an IPO / public-listing (PUBLIC_MARKET_OPEN) event occurs by date D"
    pre_ipo_failure: "absorbing COLLAPSED or ACQUIRED regime reached before any PUBLIC_MARKET_OPEN"
    tender_event: "a tender at price >= X by date D (no curated market yet)"
    valuation_threshold: "NOT computable: augur models a per-UNIT mark, not a company valuation (no shares / market-cap). Surfaced, not scored."
  #
  # `correlate_of` (correlate markets only) -- the augur signal to surface, one of:
  #   ipo_by_date              P(a PUBLIC_MARKET_OPEN event by date D)
  #   mark_per_unit_trajectory the per-UNIT mark path (augur models NO company valuation)
  #   legal_event              P(a LEGAL_IMPAIRMENT event by date D)

  # The structured model emits, per (rollout, month in 0..120 from as_of):
  #   event_kind_code   NONE/TENDER/ADMIN_MARK_UPDATE/PUBLIC_MARKET_OPEN/
  #                     ACQUISITION_CASHOUT/LEGAL_IMPAIRMENT/FORCED_RECOVERY/COLLAPSE
  #   regime_code       PRIVATE_OPERATING/PUBLIC_MARKET/ACQUIRED/COLLAPSED (absorbing)
  #   mark_usd_per_unit per-UNIT value (GBM + student-t shocks)
  # IPO == first PUBLIC_MARKET_OPEN (regime -> PUBLIC_MARKET): flat
  # annual_public_market_probability=0.07 hazard, absorbing, 6-month lockup. Each market
  # carries `sim_signal` (recipe) + `sim_fidelity` (how closely it computes). Monthly
  # granularity; deadlines round to month index.
  valuation_caveat: >
    augur does NOT model company valuation: the structured model emits a per-UNIT mark
    with no shares or market-cap concept (the only market-cap value lives in the
    separate trained artifact's scale_prior, used internally as a soft-cap penalty, not
    exposed). Valuation markets are therefore SURFACED, not scored. A constant-shares
    eyeball proxy market_cap ~= mark * (current_market_cap_usd / current_mark_usd) ~=
    mark * 5.213e8 exists but dilution is unmodeled, so it is not an apples-to-apples metric.

  field_semantics: >
    close_date = Manifold trading close (UTC date). resolution_deadline = the date the
    YES condition must occur by, per the question/criterion -- OFTEN DIFFERS from
    close_date (e.g. the Bayesian 2027/2028/2029 IPO series shares one trading-close
    time but resolves for different years). sim_signal/sim_fidelity = how p_model is
    computed and how faithfully. p_market is ALWAYS fetched live from Manifold at scoring
    time (this catalog stores only market metadata, no prices). Polymarket / Kalshi stay
    out of scope until the Manifold loop works end-to-end.

