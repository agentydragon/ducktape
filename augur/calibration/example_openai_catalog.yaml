    mappability: exact
    mapping_kind: ipo_by_date
    mapping_params: {event: PUBLIC_MARKET_OPEN, by_date: "2027-01-01"}
    sim_signal: "exists t<=month(2027-01): event_kind_code[r,t]==PUBLIC_MARKET_OPEN  (equiv. regime==PUBLIC_MARKET)"
    sim_fidelity: "exact event match. NB the model's IPO hazard is a flat ~7%/yr Bernoulli vs the market's ~0.75 -- the headline calibration gap, computed exactly."
    resolution_criterion_text: |
      Update 2025-12-20 (PST) (AI summary of creator comment): This market
      resolves based on when the actual IPO occurs, not when an IPO date is
      announced.
    notes: "Highest-signal IPO market (vol ~27k, 82 bettors). Resolves on the actual IPO, not announcement."

