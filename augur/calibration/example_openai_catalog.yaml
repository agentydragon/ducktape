      exchange as a result of a non-IPO route (direct listing, SPAC/de-SPAC merger, or
      merger/acquisition resulting in listed OpenAI equity). If OpenAI goes public via
      a traditional underwritten IPO (Form S-1 primary IPO) by the deadline, resolve NO.

