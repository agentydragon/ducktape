    sim_signal: "surface P(exists t<=month(2026-12): PUBLIC_MARKET_OPEN) -- the mechanism-agnostic umbrella"
    sim_fidelity: "approx: sim cannot split IPO vs non-IPO mechanism."
    resolution_criterion_text: |
      # excerpt (resolution criteria)
      Resolve YES if, on or before 2026-12-31 23:59:59 UTC, there is verifiable
