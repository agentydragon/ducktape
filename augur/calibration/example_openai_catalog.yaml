    resolution_deadline: "2027-01-01"
    mappability: correlate
    correlate_of: ipo_by_date
    correlate_strength: strong
    reason: >
      Resolves on a SEC Form S-1 FILING, not a completed IPO. The sim has no filing
      event; P(PUBLIC_MARKET_OPEN by D) is a lower-bound leading-correlate.
    sim_signal: "surface P(exists t<=month(2026-12): PUBLIC_MARKET_OPEN) as a lower-bound proxy"
    sim_fidelity: "approx: filing vs completion gap; no distinct filing event in the sim."
    resolution_criterion_text: |
      Resolves according to Metaculus resolution.
      Metaculus high-level description: This question will resolve as Yes if
      OpenAI, a parent company, or any subsidiary that is primarily responsible
      for developing ChatGPT, files a public, non-confidential initial public
      registration statement (SEC Form S-1) at the U.S. Securities and Exchange
      Commission's EDGAR database before January 1, 2027.
    notes: "High liquidity (5100), strong signal -- valuable correlate even though not exact."

