  # ============================================================================
  # EXACT -- pre_ipo_failure  (absorbing COLLAPSED/ACQUIRED before any IPO)
  # ============================================================================
  - slug: openai-collapses-or-gets-acquired-b
    manifold_id: SlSdQOIU0l
    question: "OpenAI collapses or gets acquired before IPO?"
    outcome_type: BINARY
    close_date: "2041-01-18"
    resolution_deadline: null
    mappability: exact
    mapping_kind: pre_ipo_failure
    mapping_params: {terminal_events: [COLLAPSE, FORCED_RECOVERY, ACQUISITION_CASHOUT], before_event: PUBLIC_MARKET_OPEN}
    sim_signal: "regime reaches COLLAPSED (COLLAPSE/FORCED_RECOVERY) or ACQUIRED (ACQUISITION_CASHOUT) before any PUBLIC_MARKET_OPEN"
    sim_fidelity: "near-exact: the sim races these absorbing regimes (collapse ~0.3%/yr + acquisition ~1%/yr vs IPO ~7%/yr). Only the 'files for IPO then withdrawn -> YES' edge is unmodeled (negligible). Many rollouts stay private within 120mo -> UNRESOLVED."
    resolution_criterion_text: |
      # excerpt (resolution criteria)
      This market resolves YES if OpenAI either collapses (becomes insolvent or
      ceases operations) or is acquired by another company before completing an
      initial public offering. The market resolves NO if OpenAI successfully
      completes an IPO. If OpenAI files for IPO but the offering is withdrawn or
      fails to complete, the market resolves YES.

  # ============================================================================
  # SURFACED (valuation) -- augur does NOT model company valuation; not scored.
  # ============================================================================
  - slug: will-openai-have-a-valuation-of-1-t
    manifold_id: dy9AO5nLNq
    question: "Will OpenAi have a valuation of $1 trillion by the end of 2027?"
    outcome_type: BINARY
    close_date: "2027-12-31"
    resolution_deadline: "2027-01-01"
    mappability: correlate
    correlate_of: mark_per_unit_trajectory
    correlate_strength: strong
    reason: >
      augur does not model company valuation -- only a per-UNIT mark, with no shares or
      market-cap concept. A constant-shares proxy (mark * external shares) maps mark to
      a cap, but dilution is unmodeled, so this is surfaced for the reader, not scored.
    sim_signal: "surface only -- augur has no valuation channel (mark is per-unit)"
    sim_fidelity: "not scored: augur does not model company valuation."
    resolution_criterion_text: |
      Update 2025-12-16 (PST) (AI summary of creator comment): The market will
      resolve as YES if Gemini determines the company's value is $1,000,000,000,000
      on Jan 1, 2027. Otherwise, it resolves as NO.
    notes: "Criterion evaluates valuation ON Jan 1, 2027 (title says 'end of 2027')."

  - slug: openai-completes-an-ipo-in-2026-and
    manifold_id: hdy0nPpEsA
    question: "OpenAI completes an IPO in 2026 and has a market cap of $1 trillion+?"
    outcome_type: BINARY
    close_date: "2026-12-31"
    resolution_deadline: "2026-12-31"
    mappability: correlate
    correlate_of: ipo_by_date
    correlate_strength: strong
    reason: >
      The IPO-by-2026 leg is exactly modeled (PUBLIC_MARKET_OPEN), but the >=$1T
      market-cap conjunct needs a valuation augur does not model. Surfaced, not scored;
      calibration shows P(IPO by 2026) as the related clean signal (augur_context).
    sim_signal: "related clean signal: P(PUBLIC_MARKET_OPEN by 2026-12); the >=$1T cap conjunct is not modeled"
    sim_fidelity: "IPO-timing leg is exact; the valuation conjunct is not scored."
    resolution_criterion_text: |
      Resolves YES if OpenAI completes an IPO in 2026 and has a market cap at market
      close of $1trillion or more (USD). Completes an IPO means listing stocks on a
      public stock exchange; announcement of a date or filings does not count. Market
      cap is the one on IPO day at market close, per yahoo finance; private valuations
      don't count.

