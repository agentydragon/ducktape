    manifold_id: Csgc56pdZc
    question: "Will OpenAI go public in 2026?"
    outcome_type: BINARY
    close_date: "2026-12-31"
    resolution_deadline: "2026-12-31"
    mappability: exact
    mapping_kind: ipo_by_date
    mapping_params: {event: PUBLIC_MARKET_OPEN, by_date: "2026-12-31"}
    sim_signal: "exists t<=month(2026-12): event_kind_code[r,t]==PUBLIC_MARKET_OPEN"
    sim_fidelity: "exact; criterion ('completes an IPO and begins trading') matches the PUBLIC_MARKET regime."
    resolution_criterion_text: |
      Resolution criteria

      OpenAI will be considered to have gone public in 2026 if it completes an
      initial public offering (IPO) and begins trading on a public stock exchange
      at any point during the calendar year 2026. This includes any IPO filing,
      pricing, and first day of trading occurring in 2026. The resolution will be
      verified through major financial news sources (Bloomberg, Reuters, CNBC,
      WSJ) and official SEC filings if the IPO occurs in the United States.

