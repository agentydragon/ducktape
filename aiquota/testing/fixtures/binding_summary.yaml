# Compact summary follows one window for both tint and pace.
# Claude: short=warn (+10), long=cool (-15) -> warn +10.
# Codex: short=ok (+0), long=hot (+18) -> hot +18.
# z.ai: short=cool (-15), long=ok (+0) tie in rank -> preserve cool and -15.
# Named windows also exercise the last-window preference when its tint wins.
providers:
  - provider: claude
    last_output:
      fetched_at: "2026-01-15T12:00:00Z"
      result:
        kind: success
        windows:
          - { name: burst, used_percent: 60.0, reset_seconds: 9000.0, window_seconds: 18000.0 }
          - { name: weekly, used_percent: 15.0, reset_seconds: 423360.0, window_seconds: 604800.0 }
  - provider: codex
    last_output:
      fetched_at: "2026-01-15T12:00:00Z"
      result:
        kind: success
        windows:
          - { name: primary, used_percent: 30.0, reset_seconds: 12600.0, window_seconds: 18000.0 }
          - { name: secondary, used_percent: 48.0, reset_seconds: 423360.0, window_seconds: 604800.0 }
  - provider: zai
    last_output:
      fetched_at: "2026-01-15T12:00:00Z"
      result:
        kind: success
        windows:
          - { name: burst, used_percent: 15.0, reset_seconds: 12600.0, window_seconds: 18000.0 }
          - { name: weekly, used_percent: 30.0, reset_seconds: 423360.0, window_seconds: 604800.0 }
fetched_at: "2026-01-15T12:00:00Z"
