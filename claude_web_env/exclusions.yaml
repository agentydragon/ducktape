# Exclusion rules for manifest diff. Applied only at diff time — manifests
# always capture everything. See README.md for category descriptions.

# ─── Completely ignored paths ─────────────────────────────────────────────
# These prefixes are skipped entirely in the diff. Both sides are ignored.
skip_paths:
  # Kernel virtual filesystems (not real files)
  - /proc
  - /sys
  - /dev

  # Ephemeral runtime state (empty at image build time, populated at runtime)
  - /tmp
  - /run
  - /var/log

  # APT caches (cleared by `rm -rf /var/lib/apt/lists/*` in Dockerfile)
  - /var/cache/apt
  - /var/lib/apt/lists

  # dpkg info dir has per-file metadata for every installed package — the set
  # of files is a consequence of package selection, not an independent signal
  - /var/lib/dpkg/info

  # Podman/buildah container storage (artifacts from building inside container)
  - /var/lib/containers
  - /var/tmp

  # Our own repo checkout (present in live, not in image)
  - /home/user/ducktape

  # Caches populated at runtime
  - /root/.cache
  - /root/.npm

  # Claude session state directories (populated at runtime by Claude Code)
  - /root/.claude/telemetry
  - /root/.claude/plans
  - /root/.claude/todos
  - /root/.claude/shell-snapshots
  - /root/.claude/session-env
  - /root/.claude/statsig
  - /root/.claude/debug
  - /root/.claude/plugins
  - /root/.claude/projects
  - "/root/.claude/projects/**"
  - "/root/.claude/stop-hook-*"

  # Home directory caches for claude user (runtime state)
  - /home/claude/.cache
  - "/home/claude/.cache/**"
  - /home/claude/.npm
  - "/home/claude/.npm/**"
  - /home/claude/.claude/remote
  - "/home/claude/.claude/remote/**"
  - /home/claude/.ssh
  - "/home/claude/.ssh/**"

  # Virtualenv and pnpm caches (created by pip install at build time or runtime)
  - /root/.local/share/virtualenv
  - "/root/.local/share/virtualenv/**"
  - /root/.local/share/pnpm
  - "/root/.local/share/pnpm/**"

  # Nix store (installed at runtime by session start hook, not part of base image)
  - /nix

  # Work directory (runtime workspace)
  - /work

# ─── Volatile paths ──────────────────────────────────────────────────────
# Non-deterministic tool installations where ANY difference is expected:
# different file sets, different hashes, different permissions. These tools
# are installed from HEAD/latest and their exact contents vary between builds.
volatile_paths:
  # Ruby: rbenv, ruby-build, and pre-built Ruby binaries
  - "/opt/rbenv/**"
  - "/opt/ruby-*"
  - "/opt/ruby-*/**"

  # Node.js: nvm and node version directories
  - "/opt/nvm/**"
  - "/opt/node*/**"

  # Rust: cargo registry and rustup toolchains
  - "/root/.cargo/**"
  - "/root/.rustup/**"

  # Bun runtime
  - "/root/.bun/**"

  # uv: tool installations and Python environments
  - "/root/.local/share/uv/**"

  # Ruby gem specs (populated by gem operations)
  - "/root/.local/share/gem/**"
  - "/root/.local/lib"

  # uv/pip installed Python packages under ~/.local
  - "/root/.local/lib/python*/**"
  - "/root/.local/bin/*"

  # Go versioned directories
  - "/usr/local/go*/**"

  # System Python packages installed by pip
  - "/usr/local/lib/python*/**"

  # Python bytecode caches (.pyc): generated at import time, embed
  # compilation timestamps / magic numbers that differ between builds.
  - "**/__pycache__"
  - "**/__pycache__/**"

  # /etc config files that differ between builds (user database, hostname,
  # SSL certs, ld cache, machine-id, etc.)
  - "/etc/group"
  - "/etc/group-"
  - "/etc/gshadow"
  - "/etc/gshadow-"
  - "/etc/hostname"
  - "/etc/hosts"
  - "/etc/ld.so.cache"
  - "/etc/machine-id"
  - "/etc/passwd"
  - "/etc/passwd-"
  - "/etc/shadow"
  - "/etc/shadow-"
  - "/etc/resolv.conf"
  - "/etc/ssl/certs/ca-certificates.crt"
  - "/etc/ssl/certs/java/cacerts"
  - "/etc/ssl/certs/ssl-cert-snakeoil.pem"
  - "/etc/ssl/private/ssl-cert-snakeoil.key"
  - "/etc/sudoers"
  - "/etc/cloud/build.info"
  - "/etc/postgresql/**"

  # /var build caches and state files (debconf, fontconfig, dpkg, postgresql)
  - "/var/cache/debconf/**"
  - "/var/cache/fontconfig/**"
  - "/var/cache/ldconfig/**"
  - "/var/lib/apt/extended_states"
  - "/var/lib/dbus/machine-id"
  - "/var/lib/dpkg/alternatives/**"
  - "/var/lib/dpkg/status"
  - "/var/lib/dpkg/status-old"
  - "/var/lib/dpkg/triggers/**"
  - "/var/lib/postgresql/**"
  - "/var/lib/sgml-base/**"
  - "/var/lib/systemd/**"

  # Tools installed to /usr/local from HEAD (version drift expected)
  - "/usr/local/bin/composer"
  - "/usr/local/bin/golangci-lint"
  - "/usr/local/use-go-*.sh"

  # wget HSTS database (timestamps from build-time downloads differ per build)
  - "/root/.wget-hsts"

  # DRI drivers (mesa version drift adds/removes driver .so files)
  - "/usr/lib/x86_64-linux-gnu/dri/*"

  # libdrm/mesa versioned .so files and symlinks (version drift between apt updates)
  - "/usr/lib/x86_64-linux-gnu/libdrm.so*"
  - "/usr/lib/x86_64-linux-gnu/libdrm_amdgpu.so*"
  - "/usr/lib/x86_64-linux-gnu/libdrm_intel.so*"
  - "/usr/lib/x86_64-linux-gnu/libgallium-*.so"
  - "/usr/share/drirc.d/*"
  - "/usr/share/libdrm/*"

  # Debug symbol build-id links (change with every package version update)
  - "/usr/lib/debug/.build-id/**"

  # libc6/glibc binaries and gconv modules (version drift between snapshot and live)
  - "/usr/lib/x86_64-linux-gnu/gconv/*.so"
  - "/usr/lib/x86_64-linux-gnu/audit/*.so"
  - "/usr/lib/x86_64-linux-gnu/libc.so*"
  - "/usr/lib/x86_64-linux-gnu/libc-*.so"
  - "/usr/lib/x86_64-linux-gnu/libm.so*"
  - "/usr/lib/x86_64-linux-gnu/libm-*.so"
  - "/usr/lib/x86_64-linux-gnu/libdl.so*"
  - "/usr/lib/x86_64-linux-gnu/libpthread.so*"
  - "/usr/lib/x86_64-linux-gnu/libresolv.so*"
  - "/usr/lib/x86_64-linux-gnu/libnss_*.so*"
  - "/usr/lib/x86_64-linux-gnu/libmemusage.so"
  - "/usr/lib/x86_64-linux-gnu/libpcprofile.so"
  - "/usr/lib/x86_64-linux-gnu/libthread_db.so*"
  - "/usr/lib/x86_64-linux-gnu/libBrokenLocale.so*"
  - "/usr/lib/x86_64-linux-gnu/libSegFault.so"
  - "/usr/lib/x86_64-linux-gnu/libmvec.so*"
  - "/usr/lib/x86_64-linux-gnu/libanl.so*"
  - "/usr/lib/x86_64-linux-gnu/librt.so*"
  - "/usr/lib/x86_64-linux-gnu/libutil.so*"
  - "/usr/lib/x86_64-linux-gnu/crt*.o"
  - "/usr/lib/x86_64-linux-gnu/lib*S*.o"
  - "/usr/lib/x86_64-linux-gnu/Mcrt1.o"
  - "/usr/lib/x86_64-linux-gnu/rcrt1.o"
  - "/usr/lib/x86_64-linux-gnu/grcrt1.o"
  - "/usr/sbin/ldconfig.real"
  - "/usr/sbin/iconvconfig"
  - "/usr/bin/gencat"
  - "/usr/bin/getconf"
  - "/usr/bin/getent"
  - "/usr/bin/iconv"
  - "/usr/bin/ldd"
  - "/usr/bin/locale"
  - "/usr/bin/localedef"
  - "/usr/bin/pldd"
  - "/usr/bin/tzselect"
  - "/usr/bin/zdump"
  - "/usr/sbin/zic"

  # OpenSSL binaries and engine modules (version drift)
  - "/usr/bin/openssl"
  - "/usr/lib/x86_64-linux-gnu/engines-3/*.so"
  - "/usr/lib/x86_64-linux-gnu/ossl-modules/*.so"
  - "/usr/lib/x86_64-linux-gnu/libssl.so*"
  - "/usr/lib/x86_64-linux-gnu/libcrypto.so*"

  # OpenJDK binaries and modules (version drift between snapshot and live)
  - "/usr/lib/jvm/java-21-openjdk-amd64/**"
  - "/etc/java-21-openjdk/**"

  # Package doc changelogs (version drift causes size/hash changes)
  - "/usr/share/doc/*/changelog*"
  - "/usr/share/doc/*/copyright"
  - "/usr/share/lintian/overrides/*"

  # Mesa copyright/changelog and remaining mesa/gbm libs (version drift)
  - "/usr/share/doc/mesa-*/**"
  - "/usr/share/doc/libgbm1/**"
  - "/usr/share/doc/libgl1-mesa-dri/**"
  - "/usr/share/doc/libglx-mesa0/**"
  - "/usr/lib/x86_64-linux-gnu/gbm/*.so"
  - "/usr/lib/x86_64-linux-gnu/libGLX_mesa.so*"
  - "/usr/lib/x86_64-linux-gnu/libgbm.so*"

  # Remaining libc6/glibc files missed by glob patterns
  - "/usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so*"
  - "/usr/lib/x86_64-linux-gnu/libc.a"
  - "/usr/lib/x86_64-linux-gnu/libc_malloc_debug.so*"
  - "/usr/lib/x86_64-linux-gnu/libnsl.so*"

  # Boost shared libs (version drift)
  - "/usr/lib/x86_64-linux-gnu/libboost_*.so*"

  # OpenLDAP shared libs (version drift)
  - "/usr/lib/x86_64-linux-gnu/liblber*.so*"
  - "/usr/lib/x86_64-linux-gnu/libldap*.so*"

  # libpng (version drift)
  - "/usr/lib/x86_64-linux-gnu/libpng*.so*"
  - "/usr/lib/x86_64-linux-gnu/libpng*.a"

  # Static archives that change with version drift
  - "/usr/lib/x86_64-linux-gnu/libcrypto.a"

# ─── Hash may differ ─────────────────────────────────────────────────────
# Intentionally empty: we aim for exact binary matching via APT version
# pinning rather than masking hash differences.
hash_may_differ: []

# ─── Only in live ────────────────────────────────────────────────────────
# Paths expected only in the live container (runtime state that cannot be
# reproduced from build-time sources).
only_in_live:
  # Runtime-generated container metadata
  - /container_info.json
  - /.dockerenv

  # Claude Code runtime-generated config and state
  - /root/.claude.json
  - /root/.claude.json.backup
  - /root/.claude/stats-cache.json
  - /root/.claude/stop-hook-git-check.sh

  # Gradle and launchpadlib caches (created by runtime tool usage)
  - /root/.gradle
  - "/root/.gradle/**"
  - /root/.launchpadlib
  - "/root/.launchpadlib/**"

  # pnpm state (populated at runtime by npm tool usage)
  - /root/.local/state
  - "/root/.local/state/**"

  # Bazel config (written by session hook or user)
  - /root/.bazelrc

  # User configs written at runtime
  - "/root/.config/**"

  # Python alternatives (live has /usr/bin/python via update-alternatives, not in built)
  - /usr/bin/python
  - /usr/bin/python3-config
  - /var/lib/dpkg/alternatives/python
  - /var/lib/dpkg/alternatives/python3
  - /etc/alternatives/python
  - /etc/alternatives/python3

  # APT source files: live has legacy sources.list format
  - /etc/apt/sources.list
  - /etc/apt/sources.list.d/ubuntu.sources

  # Container runtime config (created by podman at runtime)
  - /etc/containers/containers.conf
  - /etc/containers/networks
  - /etc/containers/storage.conf
  - /var/cache/containers
  - "/var/cache/containers/**"

  # SSL cert hash symlinks (generated by update-ca-certificates, differ by cert set)
  - "/etc/ssl/certs/*.0"

  # Clang lib directories (layout differs between apt versions)
  - /usr/lib/clang/18.1.3/lib
  - /usr/lib/clang/18/lib

  # Python3 docs (installed in live by python3-doc or similar, not in our package set)
  - /usr/share/doc/python3/_static
  - "/usr/share/doc/python3/_static/**"
  - /usr/share/doc/python3/index.html

# ─── Session start hook artifacts ─────────────────────────────────────────
# These are created by our tools/claude_hooks session start hook, not part
# of the base container image.
session_hook_artifacts:
  # Nix profile symlinks (created by nix installation at runtime)
  - /root/.nix-defexpr
  - "/root/.nix-defexpr/**"
  - /root/.nix-profile
  # crun-gvisor-wrapper installed by hooks for podman compatibility
  - /usr/local/bin/crun-gvisor-wrapper
  # containers.conf with keep_original_groups fix
  - /etc/containers/containers.conf

# ─── Only in built ───────────────────────────────────────────────────────
# Paths expected only in the built image (build artifacts not present at runtime).
only_in_built:
  # npm cache from global installs (cleaned in live, present in built)
  - /root/.npm
  - "/root/.npm/**"

  # SSL cert hash symlink (generated by update-ca-certificates, differs by cert set)
  - "/etc/ssl/certs/*.0"

  # pip-installed console_scripts (live installs these at runtime, not at image build)
  - /usr/local/bin/conan
  - /usr/local/bin/httpx
  - /usr/local/bin/identify-cli
  - /usr/local/bin/nodeenv
  - /usr/local/bin/normalizer
  - /usr/local/bin/pre-commit
  - /usr/local/bin/virtualenv
  - /usr/local/bin/websockets

  # Build artifacts: APT retry config added during build
  - /etc/apt/apt.conf.d/80retries

  # Build tooling (capture-manifest.py, diff-manifests.py etc.) mounted during manifest capture
  - /tools
  - "/tools/**"

# ─── Comparison overrides ─────────────────────────────────────────────────
# gVisor user namespaces map all UIDs to a single user, making ownership
# data in the live manifest meaningless. Skip these comparisons.
ignore_owner: true
ignore_group: true
# gVisor also strips SUID/SGID/sticky bits in user namespace captures,
# so permission comparison is unreliable for the live manifest.
ignore_perms: true
