<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Plaid Spend</title>
    <link rel="stylesheet" href="/static/spend.css" />
    <script src="/static/spend.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Plaid Spend home">
          <span class="brand-mark" aria-hidden="true">↗</span>
          <span>Plaid Spend</span>
        </a>
        <form action="/auth/logout" method="post">
          <button class="sign-out" type="submit">Sign out</button>
        </form>
      </header>

      <section class="overview" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Your shared card view</p>
          <h1 id="page-title">Statement-cycle spend</h1>
          <p class="lede">Posted and pending purchases across your configured cards.</p>
        </div>
        <div class="overview-total">
          <span class="total-label">Combined spend</span>
          <strong id="combined-spend">Loading…</strong>
          <span class="live-state" id="live-state" data-state="connecting">
            <span class="live-dot" aria-hidden="true"></span>
            Connecting
          </span>
        </div>
      </section>

      <section aria-label="Configured cards">
        <div class="section-heading">
          <h2>Your cards</h2>
          <span id="card-count"></span>
        </div>
        <div id="cards" class="cards" aria-live="polite" aria-busy="true">
          <p class="empty-state">Loading your card view…</p>
        </div>
      </section>

      <footer class="page-footer">
        <span>Updates arrive from Plaid sync notifications.</span>
        <span>View updated <time id="generated-at">—</time></span>
      </footer>
    </main>
  </body>
</html>
