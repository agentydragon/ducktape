# FIXTURE plausibility bands for //finance/augur/model:test_plausibility, not evidence about any
# economy. The limits bracket a replay of the placeholder record in
# //finance/augur/model:synthetic_history and refuse an explosive equity drift. Sourced public
# bands belong in their own file.
bands:
  - measure: real_equity_wealth_factor
    horizon_months: 24
    percentile: 99.99
    upper: { value: 10.0, breach: too_optimistic }
    severity: refuse
    source: "FIXTURE: real equity x10 within two years in at most 1 path in 10,000"
  - measure: real_equity_wealth_factor
    horizon_months: 24
    percentile: 0.01
    lower: { value: 0.1, breach: too_pessimistic }
    severity: refuse
    source: "FIXTURE: a 90% real equity loss within two years in at most 1 path in 10,000"
  - measure: real_equity_wealth_factor
    horizon_months: 24
    percentile: 50
    lower: { value: 0.85, breach: too_pessimistic }
    upper: { value: 1.4, breach: too_optimistic }
    severity: flag
    source: "FIXTURE: the median two-year real equity wealth factor"
  - measure: nominal_equity_wealth_factor
    horizon_months: 12
    percentile: 5
    upper: { value: 1.1, breach: too_narrow }
    severity: flag
    source: "FIXTURE: the 1-in-20 worst year returns at most 10%"
  - measure: inflation_factor
    horizon_months: 12
    percentile: 99
    upper: { value: 1.3, breach: too_pessimistic }
    severity: refuse
    source: "FIXTURE: one-year inflation above 30% in at most 1 path in 100"
  - measure: inflation_factor
    horizon_months: 12
    percentile: 1
    lower: { value: 0.8, breach: too_wide }
    severity: refuse
    source: "FIXTURE: one-year deflation beyond 20% in at most 1 path in 100"
  - measure: short_rate
    horizon_months: 24
    percentile: 99
    upper: { value: 0.25, breach: too_wide }
    severity: refuse
    source: "FIXTURE: a short rate above 25% after two years in at most 1 path in 100"
  - measure: short_rate
    horizon_months: 24
    percentile: 1
    lower: { value: -0.05, breach: too_wide }
    severity: refuse
    source: "FIXTURE: a short rate below -5% after two years in at most 1 path in 100"
  - measure: ten_year_yield
    horizon_months: 24
    percentile: 99
    upper: { value: 0.2, breach: too_wide }
    severity: flag
    source: "FIXTURE: a ten-year yield above 20% after two years in at most 1 path in 100"
