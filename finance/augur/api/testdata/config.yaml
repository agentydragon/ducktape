agents:
  - actor_id: agent_a
    label: Agent A
    role: primary_owner
default_rollout_samples: 8
max_rollout_samples: 1000000
# Cap the always-roll-out-max length so the suite doesn't simulate the full 100-year wire ceiling on
# every product service test. Must stay >= the largest horizon/lifecycle-event month any test uses
# (the visual test drives `?h=240` with a property sale at month 120), since the sim always runs to
# this max before truncating.
max_horizon_months: 240
locations:
  - location_id: location_a
    label: Location A
    city: Location A
    state: Fixture
    local_regulation:
      property_tax_regime: california_prop13
      default_tax_regimes:
        - california_prop13
        - california_transfer_tax
        - federal_mortgage_interest
        - federal_capital_gains
        - california_income_tax
      property_tax_annual_pct: 1.0
      local_transfer_tax_pct: 0.0
      special_assessment_annual_usd: 0.0
      notes: Synthetic public fixture location.
    notes:
      - Synthetic public fixture location.
  - location_id: location_b
    label: Location B
    city: Location B
    state: Fixture
    local_regulation:
      property_tax_regime: california_prop13
      default_tax_regimes:
        - california_prop13
        - california_transfer_tax
        - federal_mortgage_interest
        - federal_capital_gains
        - california_income_tax
      property_tax_annual_pct: 1.0
      local_transfer_tax_pct: 0.0
      special_assessment_annual_usd: 0.0
      notes: Synthetic public fixture location.
    notes:
      - Synthetic public fixture location.
location_selection:
  - location_a
  - location_b
models:
  current_model:
    # Public fixture uses a composite provider: macro/liquid/real-estate series in
    # one independent block, private-equity price/event series in another. That
    # mirrors production's split without requiring trained fixture artifacts.
    type: composite
    macro: &fixture_macro
      # VOO is held, SPY is fitted. Saying "VOO is the same market as SPY" is a MODELLING
      # claim, so it lives here as a mirror rather than as an id in the portfolio pointing
      # one symbol at another — which could silently disagree with the holding's own symbol.
      type: mirroring
      mirror_series:
        - target: { kind: security, symbol: VOO }
          source: { kind: security, symbol: SPY }
      model:
        # GBM params are pre-computed from annual return / volatility:
        #   monthly_log_return_sigma = annual_vol / sqrt(12)
        #   monthly_log_return_mu    = annual_return / 12 - 0.5 * monthly_log_return_sigma^2
        type: independent
        # Typed role groups: asset_prices (security by symbol), property_values
        # (home_value by location), index_series (inflation singleton + rent by
        # location). No magic-prefix keys.
        asset_prices:
          security:
            SPY: # annual return 7%, vol 16%
              kind: gbm
              initial_value: 1.0
              monthly_log_return_mu: 0.0047666667
              monthly_log_return_sigma: 0.0461880215
            btc:
              kind: constant
              value: 75000.0
            eth:
              kind: constant
              value: 2100.0
        property_values:
          home_value:
            location_a: # annual return 3.5%, vol 8%
              kind: gbm
              initial_value: 1.0
              monthly_log_return_mu: 0.0026500000
              monthly_log_return_sigma: 0.0230940108
            location_b:
              kind: gbm
              initial_value: 1.0
              monthly_log_return_mu: 0.0026500000
              monthly_log_return_sigma: 0.0230940108
        index_series:
          inflation: # annual return 3%, vol 1.5%
            kind: gbm
            initial_value: 1.0
            monthly_log_return_mu: 0.0024906250
            monthly_log_return_sigma: 0.0043301270
          rent:
            location_a: # annual return 3%, vol 3%
              kind: gbm
              initial_value: 1.0
              monthly_log_return_mu: 0.0024625000
              monthly_log_return_sigma: 0.0086602540
            location_b:
              kind: gbm
              initial_value: 1.0
              monthly_log_return_mu: 0.0024625000
              monthly_log_return_sigma: 0.0086602540
    private_equity:
      # Exercise the PE risk provider on the public devserver path while keeping
      # fixture marks deterministic: zero monthly drift/vol, semiannual tenders.
      type: private_equity_risk
      issuers:
        private_holding_a:
          current_mark_usd: 25.0
          monthly_log_return_mu: 0.0
          monthly_log_return_sigma: 0.0
          tender_interval_months_median: 6.0
          tender_interval_log_sigma: 0.0
          tender_price_log_discount_mu: 0.0
          tender_price_log_discount_sigma: 0.0
  openai_pe:
    # Composite preset whose PE block adds an `openai` issuer so the exogenous-only
    # calibration endpoints can score the example OpenAI catalog. Reuses the same
    # fixture macro block; keeps `private_holding_a` so the product sim path is happy
    # if this preset is ever selected there too. The `openai` issuer carries nonzero
    # going-public / collapse hazards so the catalog's event markets resolve to a
    # non-trivial p_model in dev/CI.
    type: composite
    macro: *fixture_macro
    private_equity:
      type: private_equity_risk
      issuers:
        openai:
          current_mark_usd: 100.0
          monthly_log_return_mu: 0.0
          monthly_log_return_sigma: 0.03
          annual_public_market_probability: 0.08
          public_market_lockup_months: 6
          annual_collapse_probability: 0.02
          collapsed_mark_fraction: 0.0
          tender_interval_months_median: 12.0
          tender_interval_log_sigma: 0.0
        private_holding_a:
          current_mark_usd: 25.0
          monthly_log_return_mu: 0.0
          monthly_log_return_sigma: 0.0
          tender_interval_months_median: 6.0
          tender_interval_log_sigma: 0.0
# Shared default must include the `openai` issuer the calibration catalog scores;
# `openai_pe` carries both `openai` and `private_holding_a`, so the product sim path
# still works.
default_model_id: openai_pe
calibration_catalog:
  # Worked example shipped with augur/calibration. The catalog's PE markets name their issuer
  # (openai), which must match a PE issuer the chosen preset emits (here the `openai_pe` preset).
  catalog_path: ../../calibration/example_openai_catalog.yaml
  label: OpenAI (example Manifold catalog)
portfolio_sources:
  fixed:
    # Public e2e fixture; values are synthetic.
    snapshot:
      as_of_date: "2026-05-14"
      cash_usd: 250000.0
    portfolio:
      accounts:
        - account_id: taxable_brokerage
          account_type: taxable_brokerage
          label: Taxable Brokerage
          owner_agent_id: agent_a
      holdings:
        - position_id: sp500_proxy
          kind: security
          account_id: taxable_brokerage
          label: SP500 Proxy
          lots:
            - cost_basis_usd: 300000.0
              holding_period_months_at_start: 76
              lot_id: sp500_proxy_2020_01
              quantity: 750.0
            - cost_basis_usd: 250000.0
              holding_period_months_at_start: 23
              lot_id: sp500_proxy_2024_06
              quantity: 750.0
          security_kind: etf
          # VOO is its own series. That it tracks SPY is a MODEL claim, declared as a
          # mirror above — not an id pointed at a different symbol down here.
          symbol: VOO
          unit_value_usd: 500.0
        - position_id: btc_holding
          kind: security
          account_id: taxable_brokerage
          label: Bitcoin
          lots:
            - cost_basis_usd: 30000.0
              holding_period_months_at_start: 36
              lot_id: btc_2023_05
              quantity: 1.0
          security_kind: cryptocurrency
          symbol: btc
          unit_value_usd: 75000.0
        - position_id: eth_holding
          kind: security
          account_id: taxable_brokerage
          label: Ethereum
          lots:
            - cost_basis_usd: 15000.0
              holding_period_months_at_start: 30
              lot_id: eth_2023_11
              quantity: 5.0
          security_kind: cryptocurrency
          symbol: eth
          unit_value_usd: 2100.0
        - position_id: private_holding_a
          account_id: taxable_brokerage
          label: Private Holding A
          lots:
            - cost_basis_usd: 5000.0
              holding_period_months_at_start: 48
              lot_id: private_holding_a_2022_05
              quantity: 1000.0
          kind: private_equity
          issuer_id: private_holding_a
          ticker: PHA
          unit_value_usd: 25.0
      # Held-to-maturity rungs. Separate from `holdings` because a bond is not a tax lot: it is
      # never marked, is excluded from liquid net worth, and must not become a sellable sleeve.
      bonds:
        - bond_id: tips_2031
          account_id: taxable_brokerage
          label: TIPS 2031
          # A Treasury: federally taxable, state-exempt. The `inflation_indexed` flag is what
          # makes its principal ride CPI — and what makes the scenario demand an inflation path.
          issuer_jurisdiction_id: federal_us
          face_value_usd: 100000.0
          purchase_price_usd: 100000.0
          annual_coupon_rate: 0.02
          coupon_period_months: 6
          inflation_indexed: true
          holding_period_months_at_start: 12
          months_to_maturity_at_start: 60
        - bond_id: ca_muni_2034
          account_id: taxable_brokerage
          label: California Muni 2034
          # In-state for a California resident, so exempt at both levels — the case that makes
          # "in-state" holder-relative rather than a property of the bond.
          issuer_jurisdiction_id: california
          face_value_usd: 50000.0
          purchase_price_usd: 50000.0
          annual_coupon_rate: 0.035
          coupon_period_months: 6
          holding_period_months_at_start: 6
          months_to_maturity_at_start: 96
property_source:
  properties_path: properties.json
