# U.S. federal income tax — 2024 tax-year brackets.
#
# Single filer only (MFJ / HoH / MFS deferred). Standard deduction
# only (itemized deductions deferred until housing layer lands).
#
# `upper: "Infinity"` is the open-ended top bracket. Brackets are
# walked low to high; the rate applies to income in the slice
# (lower_of_this_bracket, upper_of_this_bracket]. Rates are quoted:
# the loader rejects a YAML float as inexact.
#
# LTCG brackets are walked separately on long-term capital gains
# (holding period >= 12 months) plus qualified dividends (§1(h)(11));
# the LTCG bracket position depends on total taxable income (ordinary
# + LTCG + qualified dividends combined) per §1(h).
jurisdiction_id: federal_us
# The amounts below are 2024 law: the IRS's 2024 inflation adjustments (Rev. Proc. 2023-34).
law_year: 2024

indexation:
  # IRC 1(j)(2) rate tables, re-prescribed each year under 1(j)(3) by the chained CPI-U
  # cost-of-living adjustment of 1(f)(3).
  ordinary_income_brackets: cpi
  # IRC 1(j)(5)(B) 0%/15% and 15%/20% breakpoints, increased each year under 1(j)(5)(C).
  ltcg_brackets: cpi
  # IRC 63(c)(7)(A)(iii) $12,000, increased each year under 63(c)(7)(B).
  standard_deduction: cpi
  # IRC 1211(b)(1): $3,000, with no inflation adjustment.
  max_capital_loss_ordinary_offset: fixed
  # IRC 1411(b): $200,000, with no inflation adjustment.
  net_investment_income_tax: fixed

ordinary_income_brackets:
  single:
    - { upper: 11600, rate: "0.10" }
    - { upper: 47150, rate: "0.12" }
    - { upper: 100525, rate: "0.22" }
    - { upper: 191950, rate: "0.24" }
    - { upper: 243725, rate: "0.32" }
    - { upper: 609350, rate: "0.35" }
    - { upper: "Infinity", rate: "0.37" }

ltcg_brackets:
  single:
    - { upper: 47025, rate: "0.00" }
    - { upper: 518900, rate: "0.15" }
    - { upper: "Infinity", rate: "0.20" }

standard_deduction:
  single: 14600
# IRC 1211(b).
max_capital_loss_ordinary_offset:
  single: 3000
level: federal

# IRC 103 excludes interest on state and local obligations from federal gross income —
# any state's munis, not just the holder's. Treasury interest is NOT exempt from itself,
# hence exempts_own_issue is left false.
exempt_interest_from_levels:
  - state

# IRC 1411 net investment income tax. IRS Form 8960 (2025) instructions, Part III: 3.8% of
# the smaller of net investment income and MAGI over $200,000 for a single filer.
# https://www.irs.gov/instructions/i8960
net_investment_income_tax:
  rate: "0.038"
  threshold:
    single: 200000
