# U.S. federal income tax — 2024 tax-year brackets.
#
# Single filer only (MFJ / HoH / MFS deferred). Standard deduction
# only (itemized deductions deferred until housing layer lands).
#
# `upper: "Infinity"` is the open-ended top bracket. Brackets are
# walked low to high; the rate applies to income in the slice
# (lower_of_this_bracket, upper_of_this_bracket].
#
# LTCG brackets are walked separately on long-term capital gains
# (holding period >= 12 months); the LTCG bracket position depends
# on total taxable income (ordinary + LTCG combined) per §1(h).
jurisdiction_id: federal_us

ordinary_income_brackets:
  single:
    - { upper: 11600, rate: 0.10 }
    - { upper: 47150, rate: 0.12 }
    - { upper: 100525, rate: 0.22 }
    - { upper: 191950, rate: 0.24 }
    - { upper: 243725, rate: 0.32 }
    - { upper: 609350, rate: 0.35 }
    - { upper: "Infinity", rate: 0.37 }

ltcg_brackets:
  single:
    - { upper: 47025, rate: 0.00 }
    - { upper: 518900, rate: 0.15 }
    - { upper: "Infinity", rate: 0.20 }

standard_deduction:
  single: 14600
# IRC 1211(b).
max_capital_loss_ordinary_offset:
  single: 3000
level: federal

# IRC 103 excludes interest on state and local obligations from federal gross income —
# any state's munis, not just the holder's. Treasury interest is NOT exempt from itself,
# hence exempts_own_issue is left false.
exempt_interest_from_levels:
  - state
