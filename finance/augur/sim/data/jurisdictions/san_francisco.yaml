# City and County of San Francisco: one tax rate area covering the whole city.
jurisdiction_id: san_francisco
parent: california

# The voter-approved debt rate is the combined secured rate less Proposition 13's 1% base.
# FY 2020-21 through 2024-25: Controller, "Property Tax Rate History", Budget and Finance
# Committee, September 18, 2024, combined secured rates 1.19846368%, 1.18248499%, 1.17973782%,
# 1.17769382% and 1.17143563%.
# https://sfgov.legistar.com/View.ashx?GUID=5E30D56D-839C-4366-97F8-4122960E0D4F&ID=13306109&M=F
# FY 2025-26: Treasurer & Tax Collector, "The secured property tax rate for Fiscal Year 2025-26
# is 1.18268325%." https://sftreasurer.org/property/secured-property-taxes
debt_rates:
  2020: "0.0019846368"
  2021: "0.0018248499"
  2022: "0.0017973782"
  2023: "0.0017769382"
  2024: "0.0017143563"
  2025: "0.0018268325"
# The Controller's rate history above, "Comparative Tax Bill": "Secured property tax bill pennies
# are rounded down to next even penny value."
bill_rounding: down_to_even

# Assessor-Recorder, "Transfer tax" (fetched 2026-09-28), https://www.sf.gov/transfer-tax: "If entire
# value or consideration is more than $100 but less or equal to $250,000, your tax rate is $2.50
# for each $500 or portion thereof", more than $250,000 but less than $1,000,000 $3.40, $1,000,000
# or more but less than $5,000,000 $3.75, $5,000,000 or more but less than $10,000,000 $11.25,
# $10,000,000 or more but less than $25,000,000 $27.50, and $25,000,000 or more $30.00.
# San Francisco is a city and county, so this is the whole tax (Business and Tax Regulations
# Code Article 12-C).
transfer_tax:
  per: 500
  brackets:
    - { lower: 100, lower_included: false, rate: "2.50" }
    - { lower: 250000, lower_included: false, rate: "3.40" }
    - { lower: 1000000, lower_included: true, rate: "3.75" }
    - { lower: 5000000, lower_included: true, rate: "11.25" }
    - { lower: 10000000, lower_included: true, rate: "27.50" }
    - { lower: 25000000, lower_included: true, rate: "30.00" }
