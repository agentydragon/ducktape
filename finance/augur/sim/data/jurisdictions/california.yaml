# California state income tax — 2024 tax-year brackets.
#
# Single filer only. CA taxes long-term capital gains at ordinary
# income rates (no separate LTCG bracket), so `ltcg_brackets` is
# omitted here — the tax layer will fall through to the ordinary
# bracket when no LTCG-specific brackets are configured.
#
# The 1% mental-health surcharge on income above $1M is deferred.
jurisdiction_id: california

ordinary_income_brackets:
  single:
    - { upper: 10412, rate: 0.010 }
    - { upper: 24684, rate: 0.020 }
    - { upper: 38959, rate: 0.040 }
    - { upper: 54081, rate: 0.060 }
    - { upper: 68350, rate: 0.080 }
    - { upper: 349137, rate: 0.093 }
    - { upper: 418961, rate: 0.103 }
    - { upper: 698271, rate: 0.113 }
    - { upper: "Infinity", rate: 0.123 }

standard_deduction:
  single: 5363
# California conforms to the federal limitation (R&TC 17201).
max_capital_loss_ordinary_offset:
  single: 3000
level: state

# 31 USC 3124 bars states from taxing federal obligations, so Treasury interest is exempt.
# CA-issued munis are exempt as own-issue; munis from OTHER states are neither, so they
# stay taxable here — the case a single ordinary-income bucket could not represent.
exempt_interest_from_levels:
  - federal
exempts_own_issue: true
