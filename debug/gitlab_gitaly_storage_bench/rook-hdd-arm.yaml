# HDD arm of the rook-ceph trial: 3 HDD hosts, 3-copy, loop-backed OSDs on
# /var/mnt/local-path-ovh-hdd. Replaces the SSD cluster (same namespace, so the SSD
# CephCluster/CephFilesystem must be deleted first).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rook-ceph-trial-loop-device-hdd
  namespace: rook-ceph
  annotations:
    description: One disposable 50 GiB loop-backed OSD device on each OVH HDD node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rook-ceph-trial-loop-device-hdd
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rook-ceph-trial-loop-device-hdd
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
        storage.allegedly.works/tier: hdd
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: loop-device
          image: quay.io/ceph/ceph:v20.2.2-20260616
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            seccompProfile:
              type: Unconfined
          command: [/bin/bash, -ceu]
          args:
            - |
              backing=/host-data/rook-ceph-trial-hdd/osd.img
              link=/dev/rook-ceph-trial-osd-hdd
              mkdir -p "$(dirname "$backing")"
              if [[ ! -f "$backing" ]]; then
                fallocate -l 50G "$backing"
              fi
              device="$(losetup -j "$backing" | head -n1 | cut -d: -f1)"
              if [[ -z "$device" ]]; then
                device="$(losetup --find --show --direct-io=on "$backing")"
              fi
              ln -sfn "$device" "$link"
              test -b "$link"
              echo "ready: $link -> $device ($backing)"
              exec sleep infinity
          readinessProbe:
            exec:
              command: [/bin/bash, -ceu, "test -b /dev/rook-ceph-trial-osd-hdd"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: host-dev
              mountPath: /dev
            - name: host-data
              mountPath: /host-data
      volumes:
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: host-data
          hostPath:
            path: /var/mnt/local-path-ovh-hdd
            type: Directory
---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
  annotations:
    description: Disposable three-node HDD Ceph trial (3-copy) using loop-backed OSDs
spec:
  dataDirHostPath: /var/mnt/local-path-ovh-hdd/rook-ceph-trial/rook-data
  cephVersion:
    image: quay.io/ceph/ceph:v20.2.2-20260616
    allowUnsupported: false
  mon:
    count: 3
  mgr:
    count: 1
    modules:
      - name: rook
        enabled: true
  dashboard:
    enabled: false
  crashCollector:
    disable: true
  logCollector:
    enabled: false
  cleanupPolicy:
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
    allowUninstallWithVolumes: false
  monitoring:
    enabled: false
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
  priorityClassNames:
    all: system-node-critical
    mgr: system-cluster-critical
  resources:
    mon:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1Gi }
    mgr:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1Gi }
    osd:
      requests: { cpu: 250m, memory: 2Gi }
      limits: { memory: 4Gi }
    prepareosd:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 1Gi }
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values: [hil-ovh]
                - key: storage.allegedly.works/tier
                  operator: In
                  values: [hdd]
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
  storage:
    useAllNodes: false
    useAllDevices: false
    allowDeviceClassUpdate: true
    nodes:
      - name: ovh-ns102453
        devices:
          - name: /dev/loop3
            config: { deviceClass: hdd }
      - name: ovh-ns103656
        devices:
          - name: /dev/loop3
            config: { deviceClass: hdd }
      - name: ovh-ns103711
        devices:
          - name: /dev/loop3
            config: { deviceClass: hdd }
  healthCheck:
    daemonHealth:
      mon: { interval: 45s, timeout: 10m }
      osd: { interval: 1m }
      status: { interval: 1m }
  cephConfig:
    global:
      osd_pool_default_size: "3"
      osd_pool_default_min_size: "2"
      mon_data_avail_warn: "10"
      osd_memory_target: "2147483648"
      bdev_flock_retry: "20"
      bluefs_buffered_io: "false"
---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: builtin-mgr
  namespace: rook-ceph
spec:
  name: .mgr
  failureDomain: host
  replicated:
    size: 3
    requireSafeReplicaSize: false
---
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: trialfs-hdd
  namespace: rook-ceph
spec:
  metadataPool:
    failureDomain: host
    deviceClass: hdd
    replicated: { size: 3, requireSafeReplicaSize: false }
    parameters: { compression_mode: none, min_size: "2" }
  dataPools:
    - name: replicated
      failureDomain: host
      deviceClass: hdd
      replicated: { size: 3, requireSafeReplicaSize: false }
      parameters: { compression_mode: none, min_size: "2" }
  preserveFilesystemOnDelete: false
  metadataServer:
    activeCount: 1
    activeStandby: true
    priorityClassName: system-cluster-critical
    resources:
      requests: { cpu: 100m, memory: 1Gi }
      limits: { memory: 2Gi }
    placement:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - { key: topology.kubernetes.io/zone, operator: In, values: [hil-ovh] }
                - { key: storage.allegedly.works/tier, operator: In, values: [hdd] }
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
---
apiVersion: ceph.rook.io/v1
kind: CephFilesystemSubVolumeGroup
metadata:
  name: trialfs-hdd-csi
  namespace: rook-ceph
spec:
  name: csi
  filesystemName: trialfs-hdd
  pinning: { distributed: 1 }
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-cephfs-trial-hdd
  annotations:
    description: Disposable three-copy HDD CephFS class for the Gitaly storage bench
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  clusterID: rook-ceph
  fsName: trialfs-hdd
  pool: trialfs-hdd-replicated
  mounter: kernel
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - noatime
