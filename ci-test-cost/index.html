<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CI test cost and fixture audit</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript
      >This report uses JavaScript for its layout and disclosures.</noscript
    >
    <script type="module">
      import {
        Accordion,
        Alert,
        Anchor,
        Code,
        Container,
        Group,
        Stack,
        Text,
        Title,
      } from "@mantine/core";
      import { html, mount, ManifestStamp } from "../report.js";
      const response = await fetch("./evidence.json");
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const e = await response.json();
      const gh = "https://github.com/agentydragon/ducktape";
      const source = (path, label) =>
        html`<${Anchor} href=${`${gh}/blob/${e.source_devel_commit}/${path}`}
          >${label}<//
        >`;
      const run = (id) =>
        html`<${Anchor} href=${`${gh}/actions/runs/${id}`}>${id}<//>`;
      function Report() {
        return html`<${Container}
          component="main"
          size="76rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
        >
          <${Stack} gap="xl">
            <header>
              <${Anchor} href="../">Ducktape reports<//>
              <${Text} c="dimmed" mt="md">CI test cost · remaining work<//>
              <${Title} order=${1} my="sm">CI test cost: remaining work<//>
              <${Text} size="lg"
                >Investigate test selection, fixture reuse, and the setup and
                scheduling on the path to CI feedback.<//
              >
              <${Text} size="sm" c="dimmed" mt="sm"
                ><${ManifestStamp} src="./manifest.json" /> · Audit source
                <${Code}>${e.source_devel_commit}<//><//
              >
            </header>
            <${Alert}
              title="Preserve correctness and measure the required gate"
              color="blue"
            >
              Test selection, action runtime and CI feedback use different
              clocks. Compare the same cases and inputs, preserve isolation, and
              measure the critical path before claiming a saving.
            <//>
            <section>
              <${Title} order=${2}>1. Trace test selection and shared setup<//>
              <${Text} my="sm">
                At the audit source, the
                ${" "}${source("devinfra/js/debundle/e2e/defs.bzl", "Debundle E2E macro")}${" "}
                declared a Rust test target per source and staged the same
                executable and harness. A value-flow and E2E change in
                ${" "}<${Anchor} href=${`${gh}/pull/17071`}>PR #17071<//>${" "}
                selected 302 test targets and executed 282 in
                ${" "}${run("43986348052")}; Bazel reported 368.809s elapsed and
                a 350.48s critical path. Execution records contained 510 new
                TestRunner actions in the E2E package. Shared production inputs
                are a plausible invalidation path, but that observation does not
                prove any dependency is unnecessary.
              <//>
              <${Text} my="sm">
                Replay a real test-only edit and a production value-flow edit
                with bazel-diff, inspect the configured path from each changed
                input to each selected test, and remove a dependency only when
                the test does not use it. Other groupings remain untested:
                compare the complete case inventory and outcomes, cache misses,
                action and CPU costs, and whole-invocation critical path.
                Preserve independent temporary workspaces and enough
                parallelism, and account for edits invalidating an entire group.
                A different action graph alone does not establish faster
                feedback.
              <//>
            </section>
            <section>
              <${Title} order=${2}>2. Validate registry fixture reuse<//>
              <${Text} my="sm">
                The Props registry reuse proposal, ${" "}<${Anchor}
                  href=${`${gh}/pull/17125`}
                  >PR #17125<//
                >, keeps a bounded owned blob volume while starting a fresh
                registry for pushes, authentication and manifest cleanup.
                Registry lifecycle and Optimize tests passed uncached on PR head
                <${Code}>e02143fd<//> in ${" "}<${Anchor}
                  href="https://app.buildbuddy.io/invocation/cbe0ab57-9bbf-48a2-83a3-219694c958bb"
                  >this BuildBuddy run<//
                >. The lifecycle test confirmed that blobs remain available with
                a fresh container while manifests and unfinished uploads are
                removed. Matching worker and volume names across runs do not
                prove a warm blob hit or a PR feedback saving.
              <//>
              <${Text} my="sm">
                Measure cold and compatible-warm runs with the same inputs,
                including snapshot transfer, cleanup and recovery, before
                considering wider enrollment. A second zero-wait lease
                acquisition fails; determine whether competing owners can occur
                and whether the fixture should fall back to an uncached
                registry. The proposal leaves snapshot save policy unset. A
                recycled runner, a retained snapshot and a live fixture are
                different lifetimes; do not assume one implies another.
                ${" "}<${Anchor} href="./followup-evidence.json"
                  >Validation evidence<//
                >.
              <//>
            </section>
            <section>
              <${Title} order=${2}
                >3. Measure setup and teardown on the critical path<//
              >
              <${Text} my="sm">
                One historical devel push ${" "}${run("43954366125")}${" "}
                selected 2,072 tests but executed 49; Bazel reported 457.931s
                elapsed and a 375.30s critical path. Selection and fresh
                execution are different counts. The ${" "}<${Anchor}
                  href=${e.previous_report}
                  >prior latency report<//
                >${" "} traces physical setup, case and cleanup phases in a
                different source and observation window. Do not add spans from
                concurrent suites or call scheduler delay test execution.
              <//>
              <${Text} my="sm">
                Run a same-source paired full selector with a frozen case list,
                cold and compatible-warm fixtures, cleanup verification,
                physical execution identity and required-gate timing. Trace
                queue to worker start, preparation, process and upload,
                including nested fixture phases. Record the next-slowest test
                and non-test gates. The historical sample suggests where to
                investigate; it does not measure the resulting feedback
                improvement.
              <//>
            </section>
            <${Accordion} variant="contained">
              <${Accordion.Item} value="methods">
                <${Accordion.Control}>Provenance, sample and limitations<//>
                <${Accordion.Panel}>
                  <${Text} my="sm">${e.method}<//>
                  <${Text} my="sm">
                    The original audit covers 16–17 November 2026 UTC and is
                    pinned to the source above. Historical evidence includes
                    concluded work and separately pinned follow-up experiments.
                    A gRPC invocation search timed out; direct authenticated
                    HTTPS GetExecution reads worked. Two initial 500 responses
                    persisted on retry. More failed reads and unavailable GitHub
                    logs remain in the evidence list. An empty execution
                    response is not proof that a test was skipped or cached. The
                    selected successful runs exclude failed and cancelled
                    attempts and are vulnerable to correlated development
                    activity; do not extrapolate rates. Repository branch
                    settings and service capacity can change after the audit.
                  <//>
                  <${Group}>
                    <${Anchor} href="./evidence.json">Original evidence<//>
                    <${Anchor} href="./followup-evidence.json"
                      >Follow-up evidence<//
                    >
                    <${Anchor} href="./manifest.json">Manifest<//>
                    <${Anchor} href=${e.previous_report}
                      >Prior latency snapshot<//
                    >
                    ${source("devinfra/ci/bazel_ci.py", "CI selection")}
                  <//>
                <//>
              <//>
            <//>
            <footer>
              <${Text} size="sm" c="dimmed"
                >Measurements are historical observations, not estimates of
                current end-to-end CI savings.<//
              >
            </footer>
          <//>
        <//>`;
      }
      mount(Report);
    </script>
  </body>
</html>
