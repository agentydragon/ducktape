<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CI test cost</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript>This report uses JavaScript for charts and disclosures.</noscript>
    <script type="module">
      import { useState } from "react";
      import {
        Accordion,
        Anchor,
        Box,
        Code,
        Container,
        Group,
        SegmentedControl,
        Stack,
        Table,
        Text,
        TextInput,
        Title,
      } from "@mantine/core";
      import { BarChart } from "@mantine/charts";
      import { html, mount } from "../report.js";
      const evidenceSha =
        "9d66361afbddddfd9f9181ea005b818f105530bcec7d8dfd15fb5c95a613f206";
      const response = await fetch(`./evidence.json?v=${evidenceSha}`);
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const bytes = await response.arrayBuffer();
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      const receivedSha = Array.from(new Uint8Array(digest), (byte) =>
        byte.toString(16).padStart(2, "0"),
      ).join("");
      if (receivedSha !== evidenceSha)
        throw new Error("Evidence does not match this report");
      const e = JSON.parse(new TextDecoder().decode(bytes));
      const gh = "https://github.com/agentydragon/ducktape";
      const archive =
        gh + "/blob/" + e.previous_report_commit + "/ci-test-cost/index.html";
      const link = (href, label) => html`<${Anchor} href=${href}>${label}<//>`;
      const pr = (n) => link(`${gh}/pull/${n}`, `#${n}`);
      const source = (path, label) =>
        link(`${gh}/blob/${e.source_devel_commit}/${path}`, label);
      const inv = (id, label) =>
        link(
          "https://app.buildbuddy.io/invocation/" + id,
          label || id.slice(0, 8),
        );
      const table = (headers, rows, width = 560) =>
        html` <${Table.ScrollContainer}
          minWidth=${width}
          type="native"
          maw="100%"
        >
          <${Table} striped verticalSpacing="sm">
            <${Table.Thead}
              ><${Table.Tr}
                >${headers.map((header) => html`<${Table.Th} key=${header}>${header}<//>`)}<//
              ><//
            >
            <${Table.Tbody}
              >${rows.map((row, i) => html`<${Table.Tr} key=${i}>${row.map((value, j) => html`<${Table.Td} key=${j}>${value}<//>`)}<//>`)}<//
            >
          <//>
        <//>`;
      const disclosure = (label, contents) =>
        html` <${Accordion}
          variant="contained"
          mt="sm"
          defaultValue=${location.hash && label.startsWith("Earlier") ? label : null}
          ><${Accordion.Item} value=${label}>
            <${Accordion.Control}>${label}<//
            ><${Accordion.Panel}>${contents}<//>
          <//><//
        >`;
      const minutes = (s) =>
        s == null
          ? "—"
          : `${Math.floor(Math.round(s) / 60)}m ${String(Math.round(s) % 60).padStart(2, "0")}s`;
      const header = (title, lede) =>
        html` <header>
          ${link("../", "Ducktape reports")}
          <${Title} order=${1} my="sm">${title}<//>
          <${Text} size="lg">${lede}<//>
          <${Text} mt="sm" size="sm" c="dimmed"
            >Inspected devel <${Code}>${e.source_devel_commit}<//><//
          >
        </header>`;
      const footer = () =>
        html`<footer>
          <${Group} gap="md">
            ${link("./evidence.json", "Reviewed evidence")}
            ${link("./manifest.json", "Manifest")}
            ${link(archive, "Previous snapshot")} ${link("../", "All reports")}
          <//>
        </footer>`;

      function Report() {
        const [cohort, setCohort] = useState("PR pull_request");
        const groupRows = e.groups.filter((g) => g.cohort === cohort);
        const ranks = e.targets.filter((t) => t.cohort === cohort).slice(0, 10);
        const covered = e.runs.filter((r) => r.cohort === cohort);
        const active = covered.filter((r) => r.fresh_actions > 0);
        const hours = (s) => (s / 3600).toFixed(2);
        return html`<${Container}
          component="main"
          size="73rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
        >
          <${Stack} gap="xl">
            ${header("CI test cost", "On 22 November through 10:00 UTC, Agentplane frontend tests consumed about 13.2 of 18.1 TestRunner process-hours across 15 sampled successful PR Bazel checks. The separate 14-run devel sample spent more process time on Agentplane system tests than on any other group.")}
            <section>
              <${Title} order=${2}>Where fresh test work accumulated<//>
              <${Text} my="sm"
                >The chart adds process intervals across distinct originating
                executions. Shards and parallel tests overlap in CI elapsed
                time. The selected PRs and devel workflows exercise different
                test populations.<//
              >
              <${SegmentedControl}
                my="sm"
                aria-label="Execution cohort"
                value=${cohort}
                onChange=${setCohort}
                data=${[
                  { value: "PR pull_request", label: "PR checks" },
                  { value: "devel push", label: "devel pushes" },
                ]}
              />
              <${Text} my="sm"
                >${active.length} of ${covered.length} checked invocations
                returned a timed originating TestRunner action.
                ${active.reduce((sum, r) => sum + r.fresh_actions, 0)} such
                actions ·
                ${hours(active.reduce((sum, r) => sum + r.process_s, 0))}
                process-hours.<//
              >
              <${Box}
                role="img"
                data-chart="test-process-hours"
                aria-label="TestRunner process-hours by package group"
              >
                <${BarChart}
                  h=${groupRows.length * 48 + 36}
                  orientation="vertical"
                  dataKey="group"
                  data=${groupRows.map((g) => ({ group: g.group, "Process-hours": Number(hours(g.process_s)) }))}
                  series=${[{ name: "Process-hours", color: "blue.7" }]}
                  yAxisProps=${{ width: 112, tick: { fontSize: 11 } }}
                  xAxisLabel="Process-hours"
                />
              <//>
              ${disclosure(
                "Highest-cost targets and sample invocations",
                table(
                  [
                    "Target label",
                    "Actions",
                    "Process-hours",
                    "Median action",
                    "Longest sample",
                  ],
                  ranks.map((t) => [
                    html`<${Code}>${t.label}<//>`,
                    t.n,
                    hours(t.process_s),
                    minutes(t.median_s),
                    inv(t.largest.invocation, minutes(t.largest.seconds)),
                  ]),
                  800,
                ),
              )}
            </section>
            <section>
              <${Title} order=${2}
                >Evaluate the Action harness split before reshaping browser
                shards<//
              >
              <${Text} my="sm"
                >The former
                <${Code}>//agentplane/app/frontend:visual_actions<//>
                contributed 144 actions and 5.71 process-hours. Thread Browser
                contributed 160 actions and 3.42 process-hours. #18979 moved
                Action visuals into the Action package and their own harness.
                The sample spans that change. Its aggregate ranking alone cannot
                estimate the new selection rate. ${pr(18979)} ·
                ${source("agentplane/app/frontend/actions/BUILD.bazel#L419", "Current Action visual target")}
                ·
                ${source("agentplane/app/BUILD.bazel#L344", "Current 16-shard Thread Browser target")}<//
              >
              <${Text} my="sm"
                >A Bazel somepath query at the inspected tree linked History
                visuals to the general harness and Action operation visuals to
                their own harness. The Action operation target had no path to
                the general harness entry point.
                ${inv(e.selection_probe.invocation, "Dependency graph probe")}<//
              >
              <${Text} my="sm"
                >Use an Action-only, a Thread-only and a shared-fixture edit to
                compare before/after bazel-diff selections and uncached actions.
                Compare case IDs and capture counts before treating any dropped
                action as savings. The earlier browser sharding experiment
                provides a wall-time control.
                ${link("../latency/#shard-replay", "Browser sharding trial")} ·
                ${source("devinfra/ci/bazel_ci.py#L208", "Target selection")}<//
              >
            </section>
            <section>
              <${Title} order=${2}
                >Keep Props registry reuse behind a measured benefit<//
              >
              <${Text} my="sm"
                >#17125 remains open. The exact current PR head merges cleanly
                in a Git simulation against inspected devel. Its November checks
                predate the base changes. An older controlled pair proved that
                eight retained blobs avoided 264.9 MB of repeated upload, while
                lifecycle tests exercised fresh metadata and lease contention.
                The current 29-run CI sample yielded no originating Props
                TestRunner actions, so it cannot quantify the affected fleet
                frequency. Validate fresh and retained runs under contention
                before using the optimization as a CI priority.
                ${link(e.registry_candidate.url, "Registry candidate")} ·
                ${link("./followup-evidence.json", "Original lifecycle and controlled blob evidence")}<//
              >
            </section>
            <section>
              <${Title} order=${2}>Earlier changes and sample limits<//>
              <${Text} my="sm"
                >Cluster synthesis already has a reusable tree artifact and the
                Debundle memory guard is opt-in. The old Debundle target
                grouping had no measured elapsed-time advantage. Future cost
                work needs same-input selection and gate timing before counting
                a PR speedup. ${pr(17131)} · ${pr(17117)} ·
                ${link(archive, "Original cost audit and experiments")}<//
              >
              ${disclosure("Collection method", html`<${Text}>Sampled 15 successful Bazel checks from the latency report's partial-day PR cohort and 14 successful devel CI runs by deterministic head hash. BuildBuddy execution receipts use CI run ID and attempt-derived test invocation IDs. Distinct NEW TestRunner links with positive executionStart to executionCompleted clocks enter totals. Empty replies leave selection, cache reuse and absent work unresolved. The selected successes omit failed and cancelled workflows.<//>`)}
            </section>

            ${footer()}
          <//>
        <//>`;
      }
      mount(Report);
    </script>
  </body>
</html>
