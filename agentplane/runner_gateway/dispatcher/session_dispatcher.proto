// The Session Dispatcher: the durable queue between senders and the runners' Sessions. Design in
// agentplane/docs/adr_sandbox_session_control.md.
syntax = "proto3";

package agentplane.runner_gateway.dispatcher;

import "agentplane/proto/event_log.proto";
import "agentplane/proto/environment_lifecycle.proto";
import "agentplane/proto/session.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// One RPC per command, mirroring the runner's. Each stores the command durably and answers with its
// `Dispatch` in `DELIVERY_STATE_QUEUED_IN_DISPATCHER`, or fail `NOT_FOUND` for a Sandbox that does not exist;
// none waits for delivery. `command_id` is the
// idempotency key across all of them: a retry of the same operation and payload answers with the same
// `Dispatch`, and the same ID under another operation or payload fails `ALREADY_EXISTS`.
service SessionDispatcher {
  rpc SubmitInput(SubmitInputRequest) returns (SubmitInputResponse) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}:submitInput" body: "*"};
  }
  rpc ChangeModel(ChangeModelRequest) returns (ChangeModelResponse) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}:changeModel" body: "*"};
  }
  rpc ChangeReasoningEffort(ChangeReasoningEffortRequest) returns (ChangeReasoningEffortResponse) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}:changeReasoningEffort" body: "*"};
  }
  // Not stored or queued: delivered at once to a Ready Sandbox. A stale turn is rejected
  // by the runner with FAILED_PRECONDITION; unavailable Sandbox behavior remains explicit below.
  rpc InterruptTurn(InterruptTurnRequest) returns (InterruptTurnResponse) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}:interruptTurn" body: "*"};
  }
  // Stores the request and answers with the Session's `SessionOpening` in
  // `DELIVERY_STATE_QUEUED_IN_DISPATCHER`; the opening is delivered once the Sandbox is `Ready`, before any
  // command for the Session. The request must include the expected Sandbox UID; a missing Sandbox fails
  // `NOT_FOUND`, and a different current UID fails `FAILED_PRECONDITION` before recording. `session_id` must be a
  // canonical lowercase UUID and is the idempotency key: a retry with the same Sandbox name, UID and request answers
  // with the same `SessionOpening`;
  // conflicting requests under that ID fail `ALREADY_EXISTS`.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}:open" body: "*"};
  }
  rpc GetSessionOpening(GetSessionOpeningRequest) returns (GetSessionOpeningResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/opening"};
  }
  // Discovers current opening records, including queued and failed materialization.
  // Uses retained owner authority and does not contact the environment or History.
  rpc ListSessionOpenings(ListSessionOpeningsRequest) returns (ListSessionOpeningsResponse) {
    option (google.api.http) = {get: "/v1/session-openings"};
  }
  rpc GetDispatch(GetDispatchRequest) returns (GetDispatchResponse) {
    option (google.api.http) = {get: "/v1/dispatches/{command_id}"};
  }
  // The current Dispatches of a Session or a Sandbox, then each one again whenever it changes. A
  // `CaughtUp` frame follows the current ones, so a caller can tell a Dispatch not held from one
  // not yet sent.
  rpc WatchDispatches(WatchDispatchesRequest) returns (stream WatchDispatchesResponse) {
    option (google.api.http) = {get: "/v1/dispatches:watch"};
  }
  rpc ListDispatches(ListDispatchesRequest) returns (ListDispatchesResponse) {
    option (google.api.http) = {get: "/v1/dispatches"};
  }
  // Only before possible forwarding. QUEUED alone is insufficient: a lost reply or recovery
  // can requeue an attempted command. Such cancellation fails FAILED_PRECONDITION.
  rpc CancelDispatch(CancelDispatchRequest) returns (CancelDispatchResponse) {
    option (google.api.http) = {post: "/v1/dispatches/{command_id}:cancel" body: "*"};
  }
}

// Where a Dispatch is. The one vocabulary of every dispatch.
enum DeliveryState {
  DELIVERY_STATE_UNSPECIFIED = 0;
  DELIVERY_STATE_QUEUED_IN_DISPATCHER = 1;     // awaiting delivery or same-ID reconciliation; not proof of non-admission
  DELIVERY_STATE_DELIVERING_TO_RUNNER = 2;     // a call to the runner is in flight
  DELIVERY_STATE_RUNNER_ADMITTED = 3;          // the runner journaled it
  DELIVERY_STATE_HARNESS_CONFIRMED = 4;        // it reached the model's context
  DELIVERY_STATE_NO_OP = 5;                    // nothing to do; `reason` says where that was decided
  DELIVERY_STATE_FAILED = 6;                   // terminal; `reason` names where it failed
  DELIVERY_STATE_CANCELLED_IN_DISPATCHER = 7;  // cancelled before delivery began; `reason` says by whom
  DELIVERY_STATE_UNKNOWN = 8;                  // execution/effect is unconfirmed; any known journal admission is retained
}

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_SUBMIT_INPUT = 1;
  OPERATION_CHANGE_MODEL = 2;
  OPERATION_CHANGE_REASONING_EFFORT = 3;
  reserved 4;
  reserved "OPERATION_STOP_RUNNER_SESSION";
}

message Dispatch {
  string command_id = 1;
  string session_id = 2;
  string sandbox = 3;  // the Sandbox's name
  // The Sandbox this was queued for, which a recreated Sandbox of the same name is not.
  string sandbox_uid = 4;
  Operation operation = 5;
  DeliveryState state = 6;
  optional string reason = 7;
  // The runner journal's `CommandAdmitted` entry, once observed; retained even if state becomes
  // UNKNOWN because later execution/effects could not be established.
  optional agentplane.proto.EventEntry admission = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // The environment condition currently preventing delivery, independent of delivery state.
  agentplane.proto.DeliveryBlocker delivery_blocker = 11;
  // The latest typed automatic-wake assessment. Denied or failed wake requests do not fail the command.
  agentplane.proto.WakeAssessment wake_assessment = 12;
}

message SubmitInputRequest {
  string command_id = 1;
  string session_id = 2;
  reserved 3;
  reserved "sandbox", "sandbox_uid";
  string text = 4;
  // Optional authorization precondition for brokers whose grant is scoped to one incarnation.
  string expected_sandbox_uid = 5;
}

message SubmitInputResponse {
  Dispatch dispatch = 1;
}

message ChangeModelRequest {
  string command_id = 1;
  string session_id = 2;
  reserved 3;
  reserved "sandbox", "sandbox_uid";
  string model = 4;
  string expected_sandbox_uid = 5;
}

message ChangeModelResponse {
  Dispatch dispatch = 1;
}

message ChangeReasoningEffortRequest {
  string command_id = 1;
  string session_id = 2;
  reserved 3;
  reserved "sandbox", "sandbox_uid";
  string effort = 4;
  string expected_sandbox_uid = 5;
}

message ChangeReasoningEffortResponse {
  Dispatch dispatch = 1;
}

message InterruptTurnRequest {
  string command_id = 1;
  string session_id = 2;
  reserved 3;
  reserved "sandbox", "sandbox_uid";
  string turn_id = 4;
  string expected_sandbox_uid = 5;
}

message InterruptTurnResponse {
  // `DELIVERY_STATE_RUNNER_ADMITTED` with `admission`, or `DELIVERY_STATE_NO_OP` with `reason`.
  DeliveryState state = 1;
  optional string reason = 2;
  optional agentplane.proto.EventEntry admission = 3;
}
message GetDispatchRequest {
  string command_id = 1;
}

message GetDispatchResponse {
  Dispatch dispatch = 1;
}

// Which Dispatches: one Session's, or one Sandbox's by name. Exactly one scope is set.
message DispatchFilter {
  oneof scope {
    string session_id = 1;
    string sandbox = 2;
  }
  // When not empty, only these commands within the scope; at most 1000.
  repeated string command_ids = 3;
}

message WatchDispatchesRequest {
  DispatchFilter filter = 1;
}

// The Dispatches in scope when the watch began have all been sent.
message CaughtUp {}

message WatchDispatchesResponse {
  oneof frame {
    Dispatch dispatch = 1;
    CaughtUp caught_up = 2;
  }
}

message ListDispatchesRequest {
  DispatchFilter filter = 1;
}

message ListDispatchesResponse {
  repeated Dispatch dispatches = 1;  // oldest first
}

message CancelDispatchRequest {
  string command_id = 1;
}

message CancelDispatchResponse {
  Dispatch dispatch = 1;
}

message OpenSessionRequest {
  // Caller-minted canonical lowercase UUID; never deliberately reuse it after deletion.
  string session_id = 1;
  string sandbox = 2;
  agentplane.proto.SessionSpec spec = 3;
  optional string setup_script = 4;  // selected only at creation
  // The expected Sandbox incarnation; requests cannot cross a same-name replacement.
  string sandbox_uid = 5;
}

// Where a Session's opening is, in the vocabulary of `DeliveryState`: `DELIVERY_STATE_RUNNER_ADMITTED` is
// opened.
message SessionOpening {
  string session_id = 1;
  string sandbox = 2;
  string sandbox_uid = 3;
  DeliveryState state = 4;
  optional string reason = 5;
  reserved 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // The environment condition currently preventing delivery, independent of delivery state.
  agentplane.proto.DeliveryBlocker delivery_blocker = 9;
  // The latest typed automatic-wake assessment. Denied or failed wake requests do not fail the opening.
  agentplane.proto.WakeAssessment wake_assessment = 10;
  // The harness selected in the immutable opening request. The Sandbox identifies the native
  // harness placement; central sampler openings currently also carry their required executor.
  agentplane.proto.Harness harness = 11;
}

message OpenSessionResponse {
  SessionOpening opening = 1;
}

message GetSessionOpeningRequest {
  string session_id = 1;
}

message GetSessionOpeningResponse {
  SessionOpening opening = 1;
}

message ListSessionOpeningsRequest {
  // Maximum returned openings, 1-100; zero selects 50.
  uint32 limit = 1;
  // Opaque continuation from a previous page. Carries no authority.
  string page_token = 2;
}

message ListSessionOpeningsResponse {
  // Ascending Session ID order. Pages read current records, not a frozen snapshot;
  // concurrent changes can add/remove entries, but cannot reorder existing IDs.
  repeated SessionOpening openings = 1;
  string next_page_token = 2;
}
