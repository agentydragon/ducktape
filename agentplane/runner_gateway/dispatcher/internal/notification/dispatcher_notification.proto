// Internal PostgreSQL NOTIFY envelope for Dispatcher terminal Watch events.
// NOTIFY carries text, so each serialized envelope is base64-encoded once.
syntax = "proto3";

package agentplane.runner_gateway.dispatcher;

message TerminalNotificationPart {
  string event_id = 1;
  uint32 part = 2;
  uint32 part_count = 3;
  bytes data = 4;
  reserved 5 to 7;
  reserved "execution_account_namespace", "execution_account_name", "execution_account_uid";
  // The Session's execution Identity, empty when it has none.
  string execution_identity_name = 8;
  string execution_identity_uid = 9;
}
