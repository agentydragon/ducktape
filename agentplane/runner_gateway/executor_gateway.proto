syntax = "proto3";
package agentplane.runner_gateway;

import "agentplane/proto/execution.proto";

// Typed execution operations; no caller-owned transport tunnel.
service ExecutorGateway {
  rpc OpenSession(agentplane.proto.OpenSessionRequest) returns (stream agentplane.proto.OpenSessionResponse);
  rpc StartProcess(agentplane.proto.StartProcessRequest) returns (agentplane.proto.StartProcessResponse);
  rpc ReadProcess(agentplane.proto.ReadProcessRequest) returns (agentplane.proto.ReadProcessResponse);
  rpc WriteProcess(agentplane.proto.WriteProcessRequest) returns (agentplane.proto.WriteProcessResponse);
  rpc SignalProcess(agentplane.proto.SignalProcessRequest) returns (agentplane.proto.SignalProcessResponse);
  rpc TerminateProcess(agentplane.proto.TerminateProcessRequest) returns (agentplane.proto.TerminateProcessResponse);
  rpc GetFileMetadata(agentplane.proto.GetFileMetadataRequest) returns (agentplane.proto.GetFileMetadataResponse);
  rpc OpenFile(agentplane.proto.OpenFileRequest) returns (agentplane.proto.OpenFileResponse);
  rpc ReadFile(agentplane.proto.ReadFileRequest) returns (agentplane.proto.ReadFileResponse);
  rpc CloseFile(agentplane.proto.CloseFileRequest) returns (agentplane.proto.CloseFileResponse);
}
