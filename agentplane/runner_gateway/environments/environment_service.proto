syntax = "proto3";

package agentplane.sandboxes.environments;

option go_package = "github.com/agentydragon/ducktape/agentplane/runner_gateway/environments/environmentpb;environmentpb";

import "agentplane/proto/environment_lifecycle.proto";
import "agentplane/proto/sandboxes.proto";
import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// EnvironmentService discovers existing managed environments and authorizes explicit lifecycle changes.
service EnvironmentService {
  rpc ListEnvironmentTemplates(google.protobuf.Empty) returns (ListEnvironmentTemplatesResponse) {
    option (google.api.http) = {get: "/v1/environment-templates"};
  }
  rpc CreateEnvironment(agentplane.proto.CreateSandboxRequest) returns (TargetHandle) {
    option (google.api.http) = {post: "/v1/environments" body: "*"};
  }
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse) {
    option (google.api.http) = {get: "/v1/environments"};
  }
  // Sends an initial caller-visible snapshot, then coalesced updates and removals.
  rpc WatchEnvironments(google.protobuf.Empty) returns (stream WatchEnvironmentsResponse) {
    option (google.api.http) = {get: "/v1/environments:watch"};
  }
  rpc GetEnvironment(GetEnvironmentRequest) returns (EnvironmentDescriptor) {
    option (google.api.http) = {get: "/v1/environments/{target.namespace}/{target.name}"};
  }
  // Sends the current snapshot, then updated snapshots of the exact target. Intermediate
  // states may be coalesced; reconnecting starts a fresh observation without an event cursor.
  rpc WatchEnvironment(WatchEnvironmentRequest) returns (stream WatchEnvironmentResponse) {
    option (google.api.http) = {get: "/v1/environments/{target.namespace}/{target.name}:watch"};
  }
  rpc ResumeEnvironment(ResumeEnvironmentRequest) returns (ResumeEnvironmentResponse) {
    option (google.api.http) = {post: "/v1/environments/{target.namespace}/{target.name}:resume" body: "*"};
  }
  rpc SuspendEnvironment(EnvironmentMutationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/v1/environments/{target.namespace}/{target.name}:suspend" body: "*"};
  }
  rpc DeleteEnvironment(EnvironmentMutationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/environments/{target.namespace}/{target.name}"};
  }
  rpc SetEnvironmentWakeOnSend(SetEnvironmentWakeOnSendRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {patch: "/v1/environments/{target.namespace}/{target.name}:wake-policy" body: "*"};
  }
  rpc SetEnvironmentIdleSuspend(SetEnvironmentIdleSuspendRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {patch: "/v1/environments/{target.namespace}/{target.name}:idle-suspend" body: "*"};
  }
}

message ListEnvironmentTemplatesResponse {
  repeated string names = 1;
}

message EnvironmentMutationRequest {
  TargetHandle target = 1;
}

message SetEnvironmentWakeOnSendRequest {
  TargetHandle target = 1;
  bool wake_on_send = 2;
}

message SetEnvironmentIdleSuspendRequest {
  TargetHandle target = 1;
  google.protobuf.Duration idle_suspend_after = 2;
}

message TargetHandle {
  string namespace = 1;
  string name = 2;
  string uid = 3;
}

message AccountHandle {
  string namespace = 1;
  string name = 2;
  string uid = 3;
}

message ListEnvironmentsRequest {
  // Required, bounded to 1..100. Broad readers receive one page of the inventory.
  uint32 limit = 1;
  // Opaque continuation for a broad reader. A Sandbox-owned account resolves one candidate.
  string page_token = 2;
}

message ListEnvironmentsResponse {
  repeated EnvironmentDescriptor items = 1;
  string next_page_token = 2;
}

message WatchEnvironmentsResponse {
  // Snapshot chunks replace the previous view only when snapshot_complete arrives. Afterwards,
  // upserts replace one EnvironmentDescriptor and removals remove the named UID. Reconnect starts a new snapshot.
  oneof frame {
    EnvironmentChunk snapshot = 1;
    google.protobuf.Empty snapshot_complete = 2;
    EnvironmentDescriptor upsert = 3;
    // Deleted or no longer visible; the UID fences same-name replacement.
    TargetHandle removed = 4;
  }
}

message EnvironmentChunk {
  repeated EnvironmentDescriptor environments = 1;
}

message GetEnvironmentRequest {
  // All three fields are required. A same-name replacement is not the requested target.
  TargetHandle target = 1;
}

message WatchEnvironmentRequest {
  // All three fields are required. A same-name replacement is not the requested target.
  TargetHandle target = 1;
}

message WatchEnvironmentResponse {
  EnvironmentDescriptor environment = 1;
}

enum Availability {
  AVAILABILITY_UNSPECIFIED = 0;
  AVAILABILITY_CONFIGURED = 1;
  AVAILABILITY_ABSENT = 2;
  AVAILABILITY_UNAVAILABLE = 3;
}

enum Provenance {
  PROVENANCE_UNSPECIFIED = 0;
  PROVENANCE_DEPLOYMENT_CONFIG = 1;
}

enum ReadinessState {
  READINESS_STATE_UNSPECIFIED = 0;
  READINESS_STATE_READY = 1;
  READINESS_STATE_NOT_READY = 2;
}

enum OperatingMode {
  OPERATING_MODE_UNSPECIFIED = 0;
  OPERATING_MODE_RUNNING = 1;
  OPERATING_MODE_SUSPENDED = 2;
}

enum AutomaticWakeState {
  AUTOMATIC_WAKE_STATE_UNSPECIFIED = 0;
  AUTOMATIC_WAKE_STATE_AVAILABLE = 1;
  AUTOMATIC_WAKE_STATE_NOT_AVAILABLE = 2;
  AUTOMATIC_WAKE_STATE_NOT_REQUIRED = 3;
}

message Readiness {
  ReadinessState state = 1;
  string reason = 2;
  string detail = 3;
}

message WorkspaceGuidance {
  Availability availability = 1;
  string root = 2;
  Provenance provenance = 3;
  // The Runner creates missing cwd directories when opening a Session.
  bool creates_missing_cwd = 4;
  // True only when the runtime itself enforces root as a cwd boundary for this template.
  bool root_enforced = 5;
}

message TextFact {
  Availability availability = 1;
  string value = 2;
}

message RuntimeConfiguration {
  string harness = 1;
  string model = 2;
  string display_name = 3;
  repeated string reasoning_efforts = 4;
  Provenance provenance = 5;
}

message EnvironmentDescriptor {
  TargetHandle target = 1;
  AccountHandle execution_account = 2;
  Readiness readiness = 3;
  WorkspaceGuidance workspace = 4;
  TextFact instructions = 5;
  repeated RuntimeConfiguration configurations = 6;
  Availability configurations_availability = 7;
  google.protobuf.Timestamp observed_at = 8;
  string template = 9;
  OperatingMode operating_mode = 10;
  string stop_stage = 11;
  bool wake_on_send = 12;
  // Availability of wake-on-send, distinct from permission to request an explicit resume.
  AutomaticWakeState automatic_wake = 13;
  // The current Sandbox workload incarnation is not the Sandbox UID in target.
  string runtime_incarnation_uid = 14;
  // Caller-specific permission for an explicit resume request. Absent for deleting environments
  // retained in the broad inventory view; they cannot be resumed.
  agentplane.proto.ResumeEligibility resume_eligibility = 15;
  // The observed generation and opaque precondition used by ResumeEnvironment.
  int64 wake_generation = 16;
  string resume_token = 17;
  // Full Sandbox projection used for operator diagnostics and exact live-incarnation inspection.
  // The environment-facing identity and state facts above are not repeated here.
  google.protobuf.Timestamp created_at = 18;
  SandboxBinding binding = 19;
  SandboxPod pod = 20;
  google.protobuf.Struct status = 21;
  SandboxPhase phase = 22;
  optional string preset = 23;
  google.protobuf.Duration idle_suspend_after = 24;
  optional string suspended_by = 25;
  google.protobuf.Timestamp idle_suspend_at = 26;
  repeated agentplane.proto.AutosuspendBlocker autosuspend_blockers = 27;
}

message ResumeEnvironmentRequest {
  // All three fields identify one Sandbox; a replacement is not the requested target.
  TargetHandle target = 1;
  // Opaque precondition for the target UID and wake generation observed by Discovery. Required
  // for ordinary callers. A trusted direct Pod-bound operator broker may omit it to express a new
  // operator intent; delegated actor authority never enables that path.
  string resume_token = 2;
}

enum ResumeOutcome {
  RESUME_OUTCOME_UNSPECIFIED = 0;
  RESUME_OUTCOME_REQUESTED = 1;
  RESUME_OUTCOME_ALREADY_RUNNING = 2;
  RESUME_OUTCOME_STATE_CHANGED = 3;
}

message ResumeEnvironmentResponse {
  TargetHandle target = 1;
  ResumeOutcome outcome = 2;
  // Generation observed after the guarded request, when the target still exists.
  optional int64 wake_generation = 3;
  agentplane.proto.ResumeEligibility eligibility = 4;
  agentplane.proto.WakeAssessment wake = 5;
}

message SandboxBinding {
  reserved 1;
  reserved "session_defaults";
  string bootstrap = 2;
}

// Kubernetes names/status vocabulary is preserved, not recast as runner state.
message OwnerReference {
  string api_version = 1;
  string kind = 2;
  string name = 3;
  string uid = 4;
  bool controller = 5;
}

message SandboxPod {
  string name = 1;
  string namespace = 2;
  string uid = 3;
  bool deleting = 4;
  repeated OwnerReference owner_references = 5;
  google.protobuf.Struct status = 6;
  optional string node_name = 7;
}



// Where the Sandbox is in its lifecycle, derived from what the Sandbox Controller records: whether
// deletion was asked for, whether it is to run, whether an incarnation exists, and whether its
// Sessions are sealed. A Sandbox in QUIESCING or TEARING_DOWN takes no new Sessions or commands and
// cannot be suspended or resumed; its Sessions can still be read until it is deleted.
enum SandboxPhase {
  SANDBOX_PHASE_UNSPECIFIED = 0;
  // To run, and no incarnation exists yet.
  SANDBOX_PHASE_CREATING = 1;
  // To run, with an incarnation.
  SANDBOX_PHASE_RUNNING = 2;
  // Not to run, and its incarnation is still going.
  SANDBOX_PHASE_SUSPENDING = 3;
  // Not to run, and no incarnation exists; the state volume is kept.
  SANDBOX_PHASE_SUSPENDED = 4;
  // Being deleted, waiting for its runner to seal every Session and its ingress to acknowledge each
  // seal. Stays here while the runner is unreachable, for the operator to decide.
  SANDBOX_PHASE_QUIESCING = 5;
  // Being deleted, every Session sealed: its Pod or VM and its state volume are being removed.
  SANDBOX_PHASE_TEARING_DOWN = 6;
}
