apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workloadcredentials.agentplane.allegedly.works
spec:
  group: agentplane.allegedly.works
  names:
    kind: WorkloadCredential
    listKind: WorkloadCredentialList
    plural: workloadcredentials
    singular: workloadcredential
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.credentialID
      name: Credential
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'WorkloadCredential is an owner''s request for the SVID one workload
          runs with. By convention it

          takes its owner''s name; its controller owner reference says what the workload
          is.'
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.

              Servers should convert recognized schemas to the latest internal value,
              and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.

              Servers may infer this from the endpoint the client submits requests
              to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: 'WorkloadCredentialSpec is the requester''s. A running incarnation
              is never re-pointed: the subject

              changes only together with a new binding, and a record without one is
              replaced instead. A binding

              cannot be required at create, because the credential is issued before
              the Pod or VMI exists.'
            properties:
              binding:
                description: Binding is absent for a standing workload, and for an
                  owned one before its incarnation exists.
                properties:
                  podUID:
                    description: 'UID is a type that holds unique ID values, including
                      UUIDs.  Because we

                      don''t ONLY use UUIDs, this is an alias to string.  Being a
                      type captures

                      intent and helps make sure that UIDs and names do not get conflated.'
                    format: uuid
                    type: string
                  vmiUID:
                    description: 'UID is a type that holds unique ID values, including
                      UUIDs.  Because we

                      don''t ONLY use UUIDs, this is an alias to string.  Being a
                      type captures

                      intent and helps make sure that UIDs and names do not get conflated.'
                    format: uuid
                    type: string
                type: object
                x-kubernetes-validations:
                - message: Name exactly one of podUID or vmiUID.
                  rule: has(self.podUID) != has(self.vmiUID)
              subject:
                description: 'Subject is who the workload acts as.

                  CLEANUP(added 2026-11-09): remove the ServiceAccount variant in
                  IDENTITY_CUTOVER

                  (agentplane/plans/task_dag.md), which switches every requester to
                  an Identity subject.'
                properties:
                  identity:
                    description: IdentitySubject names an Identity in the policy namespace,
                      not in the record's own namespace.
                    properties:
                      name:
                        minLength: 1
                        type: string
                      uid:
                        description: 'UID is a type that holds unique ID values, including
                          UUIDs.  Because we

                          don''t ONLY use UUIDs, this is an alias to string.  Being
                          a type captures

                          intent and helps make sure that UIDs and names do not get
                          conflated.'
                        format: uuid
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                  serviceAccount:
                    description: ServiceAccount names a ServiceAccount in the record's
                      namespace.
                    minLength: 1
                    type: string
                type: object
                x-kubernetes-validations:
                - message: Name exactly one of serviceAccount or identity.
                  rule: has(self.serviceAccount) != has(self.identity)
            required:
            - subject
            type: object
            x-kubernetes-validations:
            - message: subject changes only with a new binding
              rule: self.subject == oldSelf.subject || (has(self.binding) && (!has(oldSelf.binding)
                || self.binding != oldSelf.binding))
          status:
            description: 'WorkloadCredentialStatus is written only by the workload-identity
              component in the Policy

              Controller.'
            properties:
              acceptedBinding:
                description: AcceptedBinding is the first binding the component saw
                  for CredentialID.
                properties:
                  podUID:
                    description: 'UID is a type that holds unique ID values, including
                      UUIDs.  Because we

                      don''t ONLY use UUIDs, this is an alias to string.  Being a
                      type captures

                      intent and helps make sure that UIDs and names do not get conflated.'
                    format: uuid
                    type: string
                  vmiUID:
                    description: 'UID is a type that holds unique ID values, including
                      UUIDs.  Because we

                      don''t ONLY use UUIDs, this is an alias to string.  Being a
                      type captures

                      intent and helps make sure that UIDs and names do not get conflated.'
                    format: uuid
                    type: string
                type: object
                x-kubernetes-validations:
                - message: Name exactly one of podUID or vmiUID.
                  rule: has(self.podUID) != has(self.vmiUID)
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: 'lastTransitionTime is the last time the condition
                        transitioned from one status to another.

                        This should be when the underlying condition changed.  If
                        that is not known, then using the time when the API field
                        changed is acceptable.'
                      format: date-time
                      type: string
                    message:
                      description: 'message is a human readable message indicating
                        details about the transition.

                        This may be an empty string.'
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: 'observedGeneration represents the .metadata.generation
                        that the condition was set based upon.

                        For instance, if .metadata.generation is currently 12, but
                        the .status.conditions[x].observedGeneration is 9, the condition
                        is out of date

                        with respect to the current state of the instance.'
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: 'reason contains a programmatic identifier indicating
                        the reason for the condition''s last transition.

                        Producers of specific condition types may define expected
                        values and meanings for this field,

                        and whether the values are considered a guaranteed API.

                        The value should be a CamelCase string.

                        This field may not be empty.'
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialID:
                description: 'CredentialID is the last segment of URI. A credential
                  ID lives exactly as long as the binding

                  it was accepted for; a standing workload''s never changes.'
                pattern: ^[0-9a-f]{32}$
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the rest of
                  the status was computed for.
                format: int64
                type: integer
              secretName:
                description: SecretName is the Secret holding the issued key pair.
                type: string
              uri:
                description: URI is spiffe://agentplane/<namespace>/<name>/<credentialID>.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be at most 200 characters, so the Certificate and Secret
            names derived from it fit
          rule: size(self.metadata.name) <= 200
    served: true
    storage: true
    subresources:
      status: {}
