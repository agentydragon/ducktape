apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxtemplates.agentplane.allegedly.works
spec:
  group: agentplane.allegedly.works
  names:
    kind: SandboxTemplate
    listKind: SandboxTemplateList
    plural: sandboxtemplates
    singular: sandboxtemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.

              Servers should convert recognized schemas to the latest internal value,
              and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.

              Servers may infer this from the endpoint the client submits requests
              to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: 'SandboxTemplateSpec sets the Sandbox''s kind: exactly one
              of Pod, VM and Firecracker.'
            properties:
              firecracker:
                description: FirecrackerTemplate describes a launcher Pod and the
                  two immutable images it mounts.
                properties:
                  bootImage:
                    minLength: 1
                    type: string
                  memoryMiB:
                    format: int64
                    minimum: 128
                    type: integer
                  pod:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  runnerImage:
                    minLength: 1
                    type: string
                  vcpuCount:
                    format: int32
                    maximum: 32
                    minimum: 1
                    type: integer
                required:
                - bootImage
                - memoryMiB
                - pod
                - runnerImage
                - vcpuCount
                type: object
              pod:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              stateVolume:
                description: 'StateVolume is the controller-owned PVC for retained
                  environment state. Pod and VM backends keep

                  a directory tree; Firecracker stores the guest state disk and its
                  checkpoints.'
                properties:
                  claim:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  layout:
                    description: VolumeLayout describes contents independently of
                      the workload attachment.
                    properties:
                      filesystem:
                        enum:
                        - ext4
                        type: string
                      type:
                        enum:
                        - DirectoryTree
                        - RawDiskImage
                        - BlockFilesystem
                        type: string
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: state volume requires DirectoryTree or RawDiskImage
                      rule: self.type == 'DirectoryTree' || self.type == 'RawDiskImage'
                    - message: DirectoryTree omits filesystem; disk layouts require
                        it
                      rule: 'self.type == ''DirectoryTree'' ? !has(self.filesystem)
                        : has(self.filesystem)'
                  name:
                    minLength: 1
                    type: string
                required:
                - claim
                - layout
                - name
                type: object
              vm:
                description: VM is the VirtualMachine's spec; the controller sets
                  its run strategy from spec.running.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              workspaceVolume:
                description: WorkspaceVolume is retained by the Sandbox across workload
                  replacements.
                properties:
                  claim:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      volumeMode:
                        description: 'volumeMode defines what type of volume is required
                          by the claim.

                          Value of Filesystem is implied when not included in claim
                          spec.'
                        type: string
                  layout:
                    description: VolumeLayout describes contents independently of
                      the workload attachment.
                    properties:
                      filesystem:
                        enum:
                        - ext4
                        type: string
                      type:
                        enum:
                        - DirectoryTree
                        - RawDiskImage
                        - BlockFilesystem
                        type: string
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: DirectoryTree omits filesystem; disk layouts require
                        it
                      rule: 'self.type == ''DirectoryTree'' ? !has(self.filesystem)
                        : has(self.filesystem)'
                  name:
                    minLength: 1
                    type: string
                required:
                - claim
                - layout
                - name
                type: object
                x-kubernetes-validations:
                - message: BlockFilesystem needs Block volumeMode; other layouts use
                    Filesystem
                  rule: 'self.layout.type == ''BlockFilesystem'' ? has(self.claim.volumeMode)
                    && self.claim.volumeMode == ''Block'' : !has(self.claim.volumeMode)
                    || self.claim.volumeMode == ''Filesystem'''
            required:
            - stateVolume
            type: object
            x-kubernetes-validations:
            - message: Pod workspaces require DirectoryTree layout
              rule: '!has(self.workspaceVolume) || !has(self.pod) || self.workspaceVolume.layout.type
                == ''DirectoryTree'''
            - message: Firecracker state requires an ext4 RawDiskImage
              rule: '!has(self.firecracker) || (self.stateVolume.layout.type == ''RawDiskImage''
                && self.stateVolume.layout.filesystem == ''ext4'')'
            - message: Pod and VM state require DirectoryTree without a filesystem
              rule: has(self.firecracker) || (self.stateVolume.layout.type == 'DirectoryTree'
                && !has(self.stateVolume.layout.filesystem))
            - message: Firecracker workspace requires an ext4 disk layout
              rule: '!has(self.firecracker) || !has(self.workspaceVolume) || (self.workspaceVolume.layout.type
                != ''DirectoryTree'' && self.workspaceVolume.layout.filesystem ==
                ''ext4'')'
            - message: Firecracker requires a workspace volume
              rule: '!has(self.firecracker) || has(self.workspaceVolume)'
            - message: exactly one of the fields in [pod vm firecracker] must be set
              rule: '[has(self.pod),has(self.vm),has(self.firecracker)].filter(x,x==true).size()
                == 1'
        required:
        - spec
        type: object
    served: true
    storage: true
