apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policysets.agentplane.allegedly.works
spec:
  group: agentplane.allegedly.works
  names:
    kind: PolicySet
    listKind: PolicySetList
    plural: policysets
    singular: policyset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.

              Servers should convert recognized schemas to the latest internal value,
              and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.

              Servers may infer this from the endpoint the client submits requests
              to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: PolicySetSpec contains the reusable policy rules.
            properties:
              rules:
                items:
                  description: Rule is shared by policy consumers; each consumer handles
                    its own Type.
                  properties:
                    clusterInternal:
                      description: ClusterInternal lifts private-address refusal for
                        this rule's hosts only, never for loopback or link-local.
                      type: boolean
                    clusterRole:
                      description: ClusterRole names the ClusterRole bound cluster-wide.
                      minLength: 1
                      type: string
                    credentialRef:
                      description: CredentialRef names the EgressCredential that this
                        rule lets a subject present, in the same namespace.
                      properties:
                        name:
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    hosts:
                      description: 'Hosts lists exact lowercase hostnames, `*.` subdomains,
                        or `*` for any public destination. Blanket rules do

                        not bypass authentication, bindings, method/path checks or
                        address filtering.'
                      items:
                        maxLength: 256
                        pattern: ^(\*|(\*\.)?[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*)$
                        type: string
                      maxItems: 256
                      minItems: 1
                      type: array
                    methods:
                      description: Methods lists admitted HTTP methods; omitted means
                        any method.
                      items:
                        enum:
                        - GET
                        - HEAD
                        - POST
                        - PUT
                        - PATCH
                        - DELETE
                        - OPTIONS
                        - CONNECT
                        - TRACE
                        type: string
                      minItems: 1
                      type: array
                    namespaces:
                      description: Namespaces names the target namespaces explicitly,
                        never by selection; labeling a namespace grants nothing.
                      items:
                        minLength: 1
                        type: string
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    operations:
                      description: Operations lists what a session_inbox_access rule
                        allows on its targets' Session inboxes.
                      items:
                        enum:
                        - send_message
                        type: string
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    paths:
                      description: Paths lists path patterns as the proxy matches
                        them; omitted means any path.
                      items:
                        minLength: 1
                        type: string
                      minItems: 1
                      type: array
                    policy:
                      description: Policy configures the Action evaluator for an action_auto_approve
                        rule.
                      properties:
                        actions:
                          additionalProperties:
                            items:
                              minLength: 1
                              type: string
                            minItems: 1
                            type: array
                          description: Actions lists Action names by ActionGroup key;
                            the policy matches only these.
                          minProperties: 1
                          type: object
                        entities:
                          additionalProperties:
                            items:
                              minLength: 1
                              type: string
                            minItems: 1
                            type: array
                          description: Entities maps Home Assistant entity ids to
                            the services allowed for each.
                          minProperties: 1
                          type: object
                        owner:
                          description: Owner is the GitHub repository owner.
                          minLength: 1
                          type: string
                        repository:
                          description: Repository is the GitHub repository name.
                          minLength: 1
                          type: string
                        schema:
                          description: Schema is a plain JSON Schema over the arguments;
                            properties alone never implies presence, so use required.
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        type:
                          description: Type selects how the evaluator matches an Action
                            request.
                          enum:
                          - exact_actions
                          - argument_schema
                          - github_repository
                          - github_public_repository
                          - home_assistant_entity_control
                          type: string
                      required:
                      - actions
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: Action policy fields must match type.
                        rule: 'self.type == ''exact_actions'' ? (!has(self.schema)
                          && !has(self.owner) && !has(self.repository) && !has(self.entities))
                          : self.type == ''argument_schema'' ? (has(self.schema) &&
                          !has(self.owner) && !has(self.repository) && !has(self.entities))
                          : self.type == ''github_repository'' ? (!has(self.schema)
                          && has(self.owner) && has(self.repository) && !has(self.entities))
                          : self.type == ''github_public_repository'' ? (!has(self.schema)
                          && !has(self.owner) && !has(self.repository) && !has(self.entities))
                          : !has(self.schema) && !has(self.owner) && !has(self.repository)
                          && has(self.entities)'
                    role:
                      description: Role names the Role or ClusterRole to bind; the
                        named object must already exist.
                      properties:
                        kind:
                          enum:
                          - Role
                          - ClusterRole
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    targets:
                      description: Targets names the Sandboxes whose Session inboxes
                        a session_inbox_access rule covers.
                      properties:
                        allSandboxes:
                          description: AllSandboxes covers every Sandbox in the namespace,
                            including ones created later.
                          type: boolean
                        inboxTags:
                          description: 'InboxTags covers every Sandbox in the namespace
                            whose `spec.inboxTags` holds one of these when the rule
                            is

                            checked.'
                          items:
                            maxLength: 63
                            minLength: 1
                            type: string
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        sandboxes:
                          description: Sandboxes names Sandboxes directly.
                          items:
                            description: 'SandboxTarget is one Sandbox by name. Without
                              a UID it also covers a deleted and recreated

                              Sandbox of that name; with one, only that incarnation.'
                            properties:
                              name:
                                minLength: 1
                                type: string
                              uid:
                                description: UID pins the target to one incarnation
                                  of the Sandbox.
                                format: uuid
                                type: string
                            required:
                            - name
                            type: object
                          minItems: 1
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                      type: object
                      x-kubernetes-validations:
                      - message: Name a Sandbox or an inbox tag, or set allSandboxes.
                        rule: has(self.sandboxes) || has(self.inboxTags) || (has(self.allSandboxes)
                          && self.allSandboxes)
                    type:
                      description: Type selects the consumer that handles this rule.
                      enum:
                      - kubernetes_role_binding
                      - kubernetes_cluster_role_binding
                      - egress
                      - action_auto_approve
                      - session_inbox_access
                      type: string
                  required:
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: A blanket host rule cannot set clusterInternal or credentialRef.
                    rule: '!has(self.hosts) || !self.hosts.exists(h, h == ''*'') ||
                      (!has(self.credentialRef) && (!has(self.clusterInternal) ||
                      !self.clusterInternal))'
                  - message: Rule fields must match type.
                    rule: 'self.type == ''kubernetes_role_binding'' ? (has(self.role)
                      && has(self.namespaces) && !has(self.clusterRole) && !has(self.hosts)
                      && !has(self.methods) && !has(self.paths) && !has(self.clusterInternal)
                      && !has(self.credentialRef) && !has(self.policy)) : self.type
                      == ''kubernetes_cluster_role_binding'' ? (has(self.clusterRole)
                      && !has(self.role) && !has(self.namespaces) && !has(self.hosts)
                      && !has(self.methods) && !has(self.paths) && !has(self.clusterInternal)
                      && !has(self.credentialRef) && !has(self.policy)) : self.type
                      == ''egress'' ? (has(self.hosts) && !has(self.role) && !has(self.namespaces)
                      && !has(self.clusterRole) && !has(self.policy)) : self.type
                      == ''session_inbox_access'' ? (!has(self.role) && !has(self.namespaces)
                      && !has(self.clusterRole) && !has(self.hosts) && !has(self.methods)
                      && !has(self.paths) && !has(self.clusterInternal) && !has(self.credentialRef)
                      && !has(self.policy)) : has(self.policy) && !has(self.role)
                      && !has(self.namespaces) && !has(self.clusterRole) && !has(self.hosts)
                      && !has(self.methods) && !has(self.paths) && !has(self.clusterInternal)
                      && !has(self.credentialRef)'
                  - message: Rule fields must match type.
                    rule: 'self.type == ''session_inbox_access'' ? (has(self.operations)
                      && has(self.targets)) : (!has(self.operations) && !has(self.targets))'
                maxItems: 256
                minItems: 1
                type: array
            required:
            - rules
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
