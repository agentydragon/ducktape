apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxes.agentplane.allegedly.works
spec:
  group: agentplane.allegedly.works
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    singular: sandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.template
      name: Template
      type: string
    - jsonPath: .spec.running
      name: Desired
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Running")].reason
      name: Running
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.

              Servers should convert recognized schemas to the latest internal value,
              and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.

              Servers may infer this from the endpoint the client submits requests
              to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            properties:
              bootstrap:
                description: Bootstrap is the shell source the Sandbox's runner runs
                  once, before its first Session.
                maxLength: 65536
                type: string
              idleSuspendAfter:
                description: 'IdleSuspendAfter is how long the Sandbox''s runner must
                  stay idle before the controller suspends the

                  Sandbox, at least a minute. Unset, the controller never suspends
                  it for idleness.'
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: idleSuspendAfter is at least one minute
                  rule: duration(self) >= duration('1m')
              inboxTags:
                description: 'InboxTags are the groups the Sandbox''s Session inboxes
                  take messages as: a `session_inbox_access` rule

                  targeting one of them covers the Sandbox while it holds the tag.'
                items:
                  maxLength: 63
                  minLength: 1
                  type: string
                type: array
                x-kubernetes-list-type: set
              policySets:
                description: PolicySets names the PolicySets in the Sandbox's namespace
                  its ServiceAccount is bound to.
                items:
                  minLength: 1
                  type: string
                type: array
                x-kubernetes-list-type: set
              running:
                default: false
                type: boolean
              template:
                description: Template names a SandboxTemplate in the Sandbox's namespace,
                  read again at every start.
                minLength: 1
                type: string
              wakeGeneration:
                default: 0
                description: 'WakeGeneration is bumped by whoever wakes the Sandbox.
                  An idle-suspended Sandbox runs again once it

                  differs from the generation it was suspended at.'
                format: int64
                minimum: 0
                type: integer
              wakeOnSend:
                default: false
                description: 'WakeOnSend allows authenticated user and notification
                  sends to resume a stopped Sandbox.

                  Omitted is false so older Sandbox manifests keep wake-on-send disabled.'
                type: boolean
            required:
            - template
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: 'lastTransitionTime is the last time the condition
                        transitioned from one status to another.

                        This should be when the underlying condition changed.  If
                        that is not known, then using the time when the API field
                        changed is acceptable.'
                      format: date-time
                      type: string
                    message:
                      description: 'message is a human readable message indicating
                        details about the transition.

                        This may be an empty string.'
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: 'observedGeneration represents the .metadata.generation
                        that the condition was set based upon.

                        For instance, if .metadata.generation is currently 12, but
                        the .status.conditions[x].observedGeneration is 9, the condition
                        is out of date

                        with respect to the current state of the instance.'
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: 'reason contains a programmatic identifier indicating
                        the reason for the condition''s last transition.

                        Producers of specific condition types may define expected
                        values and meanings for this field,

                        and whether the values are considered a guaranteed API.

                        The value should be a CamelCase string.

                        This field may not be empty.'
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              idleSuspendAt:
                description: IdleSuspendAt is the controller's next attempt to suspend
                  an idle Sandbox, when one is scheduled.
                format: date-time
                type: string
              incarnation:
                description: 'Incarnation is the Pod the Sandbox''s runner currently
                  runs in: its own Pod, or its VM''s

                  virt-launcher Pod.'
                properties:
                  name:
                    type: string
                  uid:
                    type: string
                required:
                - name
                - uid
                type: object
              operatingMode:
                description: 'OperatingMode is whether the controller runs the Sandbox:
                  the one derivation every reader of

                  `spec.running` reads instead.'
                enum:
                - Running
                - Suspended
                type: string
              quiesceAttempt:
                description: The latest Quiesce request, scoped to its runner incarnation,
                  for the controller's retry deadline.
                properties:
                  attemptedAt:
                    format: date-time
                    type: string
                  runnerPodUid:
                    type: string
                required:
                - attemptedAt
                - runnerPodUid
                type: object
              quiescedIncarnation:
                description: The UID of the last incarnation whose runner sealed every
                  Session, kept after it stops.
                type: string
              suspendedAtWakeGeneration:
                format: int64
                minimum: 0
                type: integer
              suspendedBy:
                description: 'SuspendedBy is why the Sandbox is suspended. `Idle`
                  keeps a Sandbox stopped that `spec.running` says to run,

                  and SuspendedAtWakeGeneration is the `spec.wakeGeneration` it stopped
                  it at.'
                enum:
                - Idle
                - Requested
                type: string
              volumes:
                properties:
                  state:
                    description: StateBinding projects the state PVC's durable layout
                      record and pins the claim's identity.
                    properties:
                      layout:
                        description: VolumeLayout describes contents independently
                          of the workload attachment.
                        properties:
                          filesystem:
                            enum:
                            - ext4
                            type: string
                          type:
                            enum:
                            - DirectoryTree
                            - RawDiskImage
                            - BlockFilesystem
                            type: string
                        required:
                        - type
                        type: object
                        x-kubernetes-validations:
                        - message: state volume requires DirectoryTree without a filesystem
                          rule: self.type == 'DirectoryTree' && !has(self.filesystem)
                        - message: DirectoryTree omits filesystem; disk layouts require
                            it
                          rule: 'self.type == ''DirectoryTree'' ? !has(self.filesystem)
                            : has(self.filesystem)'
                      name:
                        minLength: 1
                        type: string
                      uid:
                        minLength: 1
                        type: string
                    required:
                    - layout
                    - name
                    - uid
                    type: object
                  workspace:
                    description: WorkspaceBinding projects the creation record and
                      pins the claim's identity.
                    properties:
                      layout:
                        description: VolumeLayout describes contents independently
                          of the workload attachment.
                        properties:
                          filesystem:
                            enum:
                            - ext4
                            type: string
                          type:
                            enum:
                            - DirectoryTree
                            - RawDiskImage
                            - BlockFilesystem
                            type: string
                        required:
                        - type
                        type: object
                        x-kubernetes-validations:
                        - message: DirectoryTree omits filesystem; disk layouts require
                            it
                          rule: 'self.type == ''DirectoryTree'' ? !has(self.filesystem)
                            : has(self.filesystem)'
                      name:
                        minLength: 1
                        type: string
                      uid:
                        minLength: 1
                        type: string
                    required:
                    - layout
                    - name
                    - uid
                    type: object
                type: object
            type: object
            x-kubernetes-validations:
            - message: suspendedAtWakeGeneration is set exactly when suspendedBy is
                Idle
              rule: has(self.suspendedAtWakeGeneration) == (has(self.suspendedBy)
                && self.suspendedBy == 'Idle')
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: a Sandbox name is at most 63 characters
          rule: size(self.metadata.name) <= 63
    served: true
    storage: true
    subresources:
      status: {}
