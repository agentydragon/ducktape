apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: egresscredentials.agentplane.allegedly.works
spec:
  group: agentplane.allegedly.works
  names:
    kind: EgressCredential
    listKind: EgressCredentialList
    plural: egresscredentials
    singular: egresscredential
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.description
      name: Description
      type: string
    - jsonPath: .spec.source.secretRef.name
      name: Secret
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.

              Servers should convert recognized schemas to the latest internal value,
              and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.

              Servers may infer this from the endpoint the client submits requests
              to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            properties:
              description:
                description: 'What this credential is and what it can do, in prose,
                  for the sandbox that will present it

                  without ever seeing it. It is served to agents over the rules endpoint,
                  so it must contain

                  nothing secret: name the identity and its reach, never the value.'
                minLength: 1
                type: string
              source:
                description: 'Exactly one source for the substituted value. secretRef
                  is resolved in the proxy''s configured

                  credentials namespace, never this object''s; kubernetesServiceAccount
                  substitutes the proxy''s

                  own API server bearer and names the account it impersonates.'
                properties:
                  kubernetesServiceAccount:
                    description: 'KubernetesServiceAccountSource names a ServiceAccount
                      the proxy acts as by impersonation on the API

                      server its own credential reaches: it presents its own bearer
                      and asks the API server to treat the

                      request as this account''s. No token for the account is minted
                      or held. A named API server is the

                      intended extension for remote clusters, not modelled for lack
                      of a use case and additive when one

                      appears.'
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                      namespace:
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  secretRef:
                    description: SecretKeyRef names a key of a Secret in the proxy's
                      configured credentials namespace.
                    properties:
                      key:
                        minLength: 1
                        type: string
                      name:
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of the fields in [secretRef kubernetesServiceAccount]
                    must be set
                  rule: '[has(self.secretRef),has(self.kubernetesServiceAccount)].filter(x,x==true).size()
                    == 1'
              targets:
                description: 'Every exact location this credential may be presented
                  in. A kubernetesServiceAccount credential

                  takes exactly one, schemeToken Bearer on Authorization: it substitutes
                  the proxy''s own bearer,

                  which anywhere else, such as a JSON field, could be written into
                  an object.'
                items:
                  description: 'Target is one exact location a credential may be presented
                    in. A target fires only where a

                    request presents the placeholder in that position, so declaring
                    one does not make it apply to

                    traffic that does not use it.'
                  properties:
                    field:
                      description: Top-level JSON object field whose entire string
                        value must equal the placeholder (jsonField only).
                      maxLength: 256
                      minLength: 1
                      type: string
                    header:
                      description: Request header the placeholder goes in, matched
                        case-insensitively.
                      minLength: 1
                      type: string
                    method:
                      description: 'How the header value is parsed, and which whole
                        component the placeholder must equal.

                        wholeValue uses the value itself; schemeToken uses `<scheme>
                        <credential>`; basicUsername and

                        basicPassword use the halves of a `Basic base64(username:password)`
                        payload; basicWhole uses the

                        entire Basic payload, with or without a colon; jsonField uses
                        one top-level JSON string field

                        with JSON-safe encoding, without substring replacement or
                        templates.'
                      enum:
                      - wholeValue
                      - schemeToken
                      - basicUsername
                      - basicPassword
                      - basicWhole
                      - jsonField
                      type: string
                    scheme:
                      description: The scheme schemeToken expects, compared case-insensitively.
                        It is meaningful only for schemeToken.
                      minLength: 1
                      type: string
                  required:
                  - method
                  type: object
                  x-kubernetes-validations:
                  - message: header, field, and scheme must match method
                    rule: 'self.method == ''schemeToken'' ? (has(self.header) && has(self.scheme)
                      && !has(self.field)) : self.method == ''jsonField'' ? (has(self.field)
                      && !has(self.header) && !has(self.scheme)) : has(self.header)
                      && !has(self.field) && !has(self.scheme)'
                minItems: 1
                type: array
            required:
            - description
            - source
            - targets
            type: object
            x-kubernetes-validations:
            - message: 'a kubernetesServiceAccount credential has exactly one target:
                schemeToken Bearer on Authorization'
              rule: '!has(self.source.kubernetesServiceAccount) || (size(self.targets)
                == 1 && self.targets[0].method == ''schemeToken'' && has(self.targets[0].header)
                && self.targets[0].header.lowerAscii() == ''authorization'' && has(self.targets[0].scheme)
                && self.targets[0].scheme.lowerAscii() == ''bearer'')'
        required:
        - spec
        type: object
    served: true
    storage: true
