apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: egresscredentials.agentplane.allegedly.works
spec:
  group: agentplane.allegedly.works
  names:
    kind: EgressCredential
    listKind: EgressCredentialList
    plural: egresscredentials
    singular: egresscredential
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.description
      name: Description
      type: string
    - jsonPath: .spec.source.secretRef.name
      name: Secret
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.

              Servers should convert recognized schemas to the latest internal value,
              and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.

              Servers may infer this from the endpoint the client submits requests
              to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            properties:
              description:
                description: 'What this credential is and what it can do, in prose,
                  for the sandbox that will present it

                  without ever seeing it. It is served to agents over the rules endpoint,
                  so it must contain

                  nothing secret: name the identity and its reach, never the value.'
                minLength: 1
                type: string
              source:
                description: 'Exactly one source for the substituted value. secretRef
                  is resolved in the proxy''s configured

                  credentials namespace, never this object''s.'
                properties:
                  authenticatedWorkloadToken:
                    description: 'AuthenticatedWorkloadTokenSource selects the bearer
                      retained from the current request''s or

                      tunnel''s successful workload authentication. The proxy never
                      copies an unvalidated

                      Proxy-Authorization header, and resolution fails when authenticated
                      context is absent or no

                      longer bound.'
                    maxProperties: 0
                    type: object
                  projectedWorkloadToken:
                    description: ProjectedWorkloadTokenSource selects the token the
                      sidecar projected for an audience.
                    properties:
                      audience:
                        description: 'The hop bearer carries the proxy''s own audience,
                          so a destination that validates its own

                          refuses it; this is the same Pod''s identity minted for
                          that destination instead. The proxy

                          substitutes it only after reviewing it as the very Pod that
                          authenticated the hop, and only

                          for an audience its own configuration lists.'
                        minLength: 1
                        type: string
                    required:
                    - audience
                    type: object
                  secretRef:
                    description: SecretKeyRef names a key of a Secret in the proxy's
                      configured credentials namespace.
                    properties:
                      key:
                        minLength: 1
                        type: string
                      name:
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of the fields in [secretRef authenticatedWorkloadToken
                    projectedWorkloadToken] must be set
                  rule: '[has(self.secretRef),has(self.authenticatedWorkloadToken),has(self.projectedWorkloadToken)].filter(x,x==true).size()
                    == 1'
              targets:
                description: Every exact location this credential may be presented
                  in.
                items:
                  description: 'Target is one exact location a credential may be presented
                    in. A target fires only where a

                    request presents the placeholder in that position, so declaring
                    one does not make it apply to

                    traffic that does not use it.'
                  properties:
                    field:
                      description: Top-level JSON object field whose entire string
                        value must equal the placeholder (jsonField only).
                      maxLength: 256
                      minLength: 1
                      type: string
                    header:
                      description: Request header the placeholder goes in, matched
                        case-insensitively.
                      minLength: 1
                      type: string
                    method:
                      description: 'How the header value is parsed, and which whole
                        component the placeholder must equal.

                        wholeValue uses the value itself; schemeToken uses `<scheme>
                        <credential>`; basicUsername and

                        basicPassword use the halves of a `Basic base64(username:password)`
                        payload; basicWhole uses the

                        entire Basic payload, with or without a colon; jsonField uses
                        one top-level JSON string field

                        with JSON-safe encoding, without substring replacement or
                        templates.'
                      enum:
                      - wholeValue
                      - schemeToken
                      - basicUsername
                      - basicPassword
                      - basicWhole
                      - jsonField
                      type: string
                    scheme:
                      description: The scheme schemeToken expects, compared case-insensitively.
                        It is meaningful only for schemeToken.
                      minLength: 1
                      type: string
                  required:
                  - method
                  type: object
                  x-kubernetes-validations:
                  - message: header, field, and scheme must match method
                    rule: 'self.method == ''schemeToken'' ? (has(self.header) && has(self.scheme)
                      && !has(self.field)) : self.method == ''jsonField'' ? (has(self.field)
                      && !has(self.header) && !has(self.scheme)) : has(self.header)
                      && !has(self.field) && !has(self.scheme)'
                minItems: 1
                type: array
            required:
            - description
            - source
            - targets
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
