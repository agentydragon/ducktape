# Attaches PolicySets to one ServiceAccount. The binding's existence is the grant: creating one
# allows, deleting one takes that back, and it contributes nothing after it expires. Every reader of
# PolicySet rules honors it for its own rule types and reports in its own status condition.
# Kubernetes rules are enforced by the API server against the native RoleBindings and
# ClusterRoleBindings the Kubernetes Policy Controller keeps, so their revocation and expiry take
# effect when the controller deletes those. The subject schema (`spec.subject`) and the kubeconform
# schema under cluster/schemas/ are written by `bb run //agentplane/crds:generate_bin` from
# agentplane.subjects.ServiceAccountRef and this file.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policybindings.agentplane.allegedly.works
spec:
  group: agentplane.allegedly.works
  scope: Namespaced
  names:
    kind: PolicyBinding
    listKind: PolicyBindingList
    plural: policybindings
    singular: policybinding
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Subject
          type: string
          jsonPath: .spec.subject.name
        - name: Expires
          type: string
          jsonPath: .spec.expiresAt
        - name: Kubernetes
          type: string
          jsonPath: .status.conditions[?(@.type=="KubernetesReady")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [subject, policySets]
              properties:
                subject:
                  description: >-
                    The ServiceAccount this binding grants to. Kubernetes matches an RBAC subject by
                    namespace and name only, so the Kubernetes Policy Controller also stamps each
                    native binding with the account's UID and replaces them when a same-named
                    account is recreated.
                  type: object
                  required: [namespace, name]
                  properties:
                    namespace:
                      type: string
                      minLength: 1
                    name:
                      type: string
                      minLength: 1
                policySets:
                  description: PolicySet names in the binding's namespace.
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                expiresAt:
                  description: After this instant the binding contributes nothing.
                  type: string
                  format: date-time
            status:
              type: object
              properties:
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    description: >-
                      A metav1.Condition. Each reader owns its own condition type, applied with
                      its own field manager: `KubernetesReady` is the Kubernetes Policy Controller's.
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$'
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: "^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$"
                      message:
                        type: string
                        maxLength: 32768
