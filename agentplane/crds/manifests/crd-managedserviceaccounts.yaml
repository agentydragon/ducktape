apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: managedserviceaccounts.agentplane.allegedly.works
spec:
  group: agentplane.allegedly.works
  names:
    kind: ManagedServiceAccount
    listKind: ManagedServiceAccountList
    plural: managedserviceaccounts
    singular: managedserviceaccount
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.apiServer
          name: API server
          type: string
        - jsonPath: .status.serviceAccount.name
          name: Account
          type: string
        - jsonPath: .spec.expiresAt
          name: Expires
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: "ManagedServiceAccount is a ServiceAccount Agentplane creates
            and deletes, holding the expiry and owner the

            ServiceAccount itself cannot carry across namespaces or apiservers."
          properties:
            apiVersion:
              description: "APIVersion defines the versioned schema of this representation
                of an object.

                Servers should convert recognized schemas to the latest internal value,
                and

                may reject unrecognized values.

                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources"
              type: string
            kind:
              description: "Kind is a string value representing the REST resource this
                object represents.

                Servers may infer this from the endpoint the client submits requests
                to.

                Cannot be updated.

                In CamelCase.

                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds"
              type: string
            metadata:
              type: object
            spec:
              properties:
                apiServer:
                  description: APIServer names the configured apiserver the ServiceAccount
                    is created on.
                  minLength: 1
                  type: string
                expiresAt:
                  description: The Policy Controller deletes the account, and with it
                    everything it owns, at this instant.
                  format: date-time
                  type: string
              required:
                - apiServer
              type: object
            status:
              properties:
                serviceAccount:
                  description: CreatedServiceAccount is the ServiceAccount incarnation
                    the Policy Controller created.
                  properties:
                    name:
                      minLength: 1
                      type: string
                    namespace:
                      minLength: 1
                      type: string
                    uid:
                      description: "UID is a type that holds unique ID values, including
                        UUIDs.  Because we

                        don't ONLY use UUIDs, this is an alias to string.  Being a
                        type captures

                        intent and helps make sure that UIDs and names do not get conflated."
