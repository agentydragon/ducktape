// The Session Dispatcher: the durable queue between senders and the runners' Sessions. Design in
// agentplane/docs/adr_sandbox_session_control.md.
syntax = "proto3";

package agentplane.runner_gateway.dispatcher;

import "agentplane/harness_host/harness_host.proto";
import "agentplane/proto/command.proto";
import "agentplane/proto/event_log.proto";
import "agentplane/proto/identity.proto";
import "agentplane/proto/environment_lifecycle.proto";
import "agentplane/proto/session.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// One RPC per command, mirroring the runner's. Each stores the command durably and answers with its
// `Dispatch` in `DELIVERY_STATE_QUEUED_IN_DISPATCHER`, or fail `NOT_FOUND` for a Sandbox that does not exist;
// none waits for delivery. `command_id` is the
// idempotency key across all of them: a retry of the same operation and payload answers with the same
// `Dispatch`, and the same ID under another operation or payload fails `ALREADY_EXISTS`.
service SessionDispatcher {
  // Shared operator attention for an exact Dispatcher receipt revision.
  rpc AcknowledgeCommandNotice(AcknowledgeCommandNoticeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}/notice-acknowledgements" body: "*"};
  }
  // Returns only acknowledgements of the supplied command/revision pairs (1 to 100).
  rpc BatchGetCommandNoticeAcknowledgements(BatchGetCommandNoticeAcknowledgementsRequest) returns (CommandNoticeAcknowledgements) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}/notice-acknowledgements:batchGet" body: "*"};
  }
  rpc ListCommandNoticeAcknowledgements(ListCommandNoticeAcknowledgementsRequest) returns (CommandNoticeAcknowledgements) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/notice-acknowledgements"};
  }

  rpc SubmitInput(SubmitInputRequest) returns (SubmitInputResponse) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}:submitInput" body: "*"};
  }
  rpc ChangeModel(ChangeModelRequest) returns (ChangeModelResponse) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}:changeModel" body: "*"};
  }
  rpc ChangeReasoningEffort(ChangeReasoningEffortRequest) returns (ChangeReasoningEffortResponse) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}:changeReasoningEffort" body: "*"};
  }
  // The exact turn is checked at Runtime admission, including after delayed delivery.
  rpc InterruptTurn(InterruptTurnRequest) returns (InterruptTurnResponse) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}:interruptTurn" body: "*"};
  }
  // Stores the request and answers with the Session in waiting materialization; creation is delivered once the Sandbox is `Ready`, before any
  // command for the Session. The selected placement must include its exact Sandbox UID; a missing Sandbox fails
  // `NOT_FOUND`, and a different current UID fails `FAILED_PRECONDITION` before recording. `session_id` must be a
  // canonical lowercase UUID and is the idempotency key: a retry with the same placement, exact execution target and request answers
  // with the same Session;
  // conflicting requests under that ID fail `ALREADY_EXISTS`.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (google.api.http) = {post: "/v1/sessions" body: "*"};
  }
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}"};
  }
  // Discovers current Sessions, including waiting and failed materialization.
  // Uses retained owner authority and does not contact the environment or History.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {get: "/v1/sessions"};
  }
  // Current Sessions, then changed current records; the scope is ListSessions' retained owner scope.
  rpc WatchSessions(WatchSessionsRequest) returns (stream WatchSessionsResponse) {
    option (google.api.http) = {get: "/v1/sessions:watch"};
  }
  rpc GetDispatch(GetDispatchRequest) returns (GetDispatchResponse) {
    option (google.api.http) = {get: "/v1/dispatches/{command_id}"};
  }
  // Current and retained deleted Dispatches of a Session or Sandbox, followed by versioned changes.
  // CaughtUp checkpoints may repeat; every frame carries a resumable position. No token requests
  // a fresh snapshot. Expired deletion coverage returns OUT_OF_RANGE: surface the loss and resync.
  rpc WatchDispatches(WatchDispatchesRequest) returns (stream WatchDispatchesResponse) {
    option (google.api.http) = {get: "/v1/dispatches:watch"};
  }
  rpc ListDispatches(ListDispatchesRequest) returns (ListDispatchesResponse) {
    option (google.api.http) = {get: "/v1/dispatches"};
  }
  // Discover retained command rows, newest submission first. Read each page with current
  // Session authority. A physical deletion during traversal can require a fresh first page.
  rpc ListSessionDispatches(ListSessionDispatchesRequest) returns (ListSessionDispatchesResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/dispatches"};
  }
  // Only before possible forwarding. QUEUED alone is insufficient: a lost reply or recovery
  // can requeue an attempted command. Such cancellation fails FAILED_PRECONDITION.
  rpc CancelDispatch(CancelDispatchRequest) returns (CancelDispatchResponse) {
    option (google.api.http) = {post: "/v1/dispatches/{command_id}:cancel" body: "*"};
  }
}

// Where a Dispatch is. The one vocabulary of every dispatch.
enum DeliveryState {
  reserved 4, 5;
  reserved "DELIVERY_STATE_HARNESS_CONFIRMED", "DELIVERY_STATE_NO_OP";

  DELIVERY_STATE_UNSPECIFIED = 0;
  DELIVERY_STATE_QUEUED_IN_DISPATCHER = 1;     // awaiting delivery or same-ID reconciliation; not proof of non-admission
  DELIVERY_STATE_DELIVERING_TO_RUNNER = 2;     // a call to the runner is in flight
  DELIVERY_STATE_RUNNER_ADMITTED = 3;          // the runner journaled it
  DELIVERY_STATE_FAILED = 6;                   // terminal; `reason` names where it failed
  DELIVERY_STATE_CANCELLED_IN_DISPATCHER = 7;  // cancelled before delivery began; `reason` says by whom
  DELIVERY_STATE_UNKNOWN = 8;                  // execution/effect is unconfirmed; any known journal admission is retained
}

message Dispatch {
  string command_id = 1;
  string session_id = 2;
  string sandbox = 3;  // the Sandbox's name
  // The Sandbox this was queued for, which a recreated Sandbox of the same name is not.
  string sandbox_uid = 4;
  agentplane.proto.Operation operation = 5;
  DeliveryState state = 6;
  optional string reason = 7;
  // The runner journal's `CommandAdmitted` entry, once observed; retained even if state becomes
  // UNKNOWN because later execution/effects could not be established.
  optional agentplane.proto.EventEntry admission = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // The environment condition currently preventing delivery, independent of delivery state.
  agentplane.proto.DeliveryBlocker delivery_blocker = 11;
  // The latest typed automatic-wake assessment. Denied or failed wake requests do not fail the command.
  agentplane.proto.WakeAssessment wake_assessment = 12;
  // The command stored by Dispatcher. Present on GetDispatch. Mutation receipts omit it for ProtoJSON clients.
  // List and watch require include_command; legacy deletion receipts lack the stored command.
  optional agentplane.proto.Command command = 13;
  // Positive database version of this exact receipt revision. Set on reads that explicitly expose it.
  optional int64 receipt_version = 14;
}

// Receipt versions are assigned by Dispatcher to live updates and deletion receipts.
message CommandNoticeRevision {
  string command_id = 1;
  int64 receipt_version = 2;
}

message CommandNoticeAcknowledgement {
  CommandNoticeRevision notice = 1;
  google.protobuf.Timestamp acknowledged_at = 2;
}

message AcknowledgeCommandNoticeRequest {
  string session_id = 1;
  CommandNoticeRevision notice = 2;
}

message BatchGetCommandNoticeAcknowledgementsRequest {
  string session_id = 1;
  repeated CommandNoticeRevision notices = 2;
}

message ListCommandNoticeAcknowledgementsRequest {
  string session_id = 1;
  // Defaults to 25, maximum 100.
  uint32 page_size = 2;
  string page_token = 3;
}

message CommandNoticeAcknowledgements {
  repeated CommandNoticeAcknowledgement acknowledgements = 1;
  optional string next_page_token = 2;
}

message SubmitInputRequest {
  string command_id = 1;
  string session_id = 2;
  reserved 3;
  reserved "sandbox", "sandbox_uid";
  string text = 4;
  // Optional authorization precondition for brokers whose grant is scoped to one incarnation.
  string expected_sandbox_uid = 5;
}

message SubmitInputResponse {
  Dispatch dispatch = 1;
}

message ChangeModelRequest {
  string command_id = 1;
  string session_id = 2;
  reserved 3;
  reserved "sandbox", "sandbox_uid";
  string model = 4;
  string expected_sandbox_uid = 5;
}

message ChangeModelResponse {
  Dispatch dispatch = 1;
}

message ChangeReasoningEffortRequest {
  string command_id = 1;
  string session_id = 2;
  reserved 3;
  reserved "sandbox", "sandbox_uid";
  string effort = 4;
  string expected_sandbox_uid = 5;
}

message ChangeReasoningEffortResponse {
  Dispatch dispatch = 1;
}

message InterruptTurnRequest {
  string command_id = 1;
  string session_id = 2;
  reserved 3;
  reserved "sandbox", "sandbox_uid";
  string turn_id = 4;
  string expected_sandbox_uid = 5;
}

message InterruptTurnResponse {
  Dispatch dispatch = 1;
}
message GetDispatchRequest {
  string command_id = 1;
}

message GetDispatchResponse {
  Dispatch dispatch = 1;
}

// Which Dispatches: one Session's, or one Sandbox's by name. Exactly one scope is set.
message DispatchFilter {
  oneof scope {
    string session_id = 1;
    string sandbox = 2;
  }
  // When not empty, only these commands within the scope; at most 1000.
  repeated string command_ids = 3;
  // Include the stored command on each matching receipt. Requires 1 to 16 command IDs.
  bool include_command = 5;
}

message WatchDispatchesRequest {
  DispatchFilter filter = 1;
  // Opaque versioned position and filter digest; carries no authority. Reusing with a different
  // filter is INVALID_ARGUMENT. Empty requests a fresh snapshot including retained deletions.
  string resume_token = 2;
  // Watch a bounded replacement snapshot for this whole Session. Omit filter
  // in this mode. Reconnect returns a replacement.
  string workset_session_id = 3;
}

// All changes through the response resume_token have been sent. May repeat as the watch advances.
message CaughtUp {}

// A Session's current delivery work and recent receipts. None of these rows
// establish execution or effects. Authored commands can be read by ID.
message DispatchWorkset {
  string session_id = 1;
  // Up to 1024 queued or delivering commands, in queue order.
  repeated DispatchWorksetItem active = 2;
  // Up to 20 failed or unknown receipts, newest Dispatcher update first.
  // History can independently establish an outcome for these commands.
  repeated DispatchWorksetItem recent_issues = 3;
  // Up to 20 recent admissions or cancellations, newest update first.
  // These bridge the transition out of the queue while History catches up.
  repeated DispatchWorksetItem recent_admitted_or_cancelled = 4;
  bool more_active_available = 5;
  bool more_recent_issues_available = 6;
  bool more_recent_admitted_or_cancelled_available = 7;
}

message DispatchWorksetItem {
  string command_id = 1;
  agentplane.proto.Operation operation = 2;
  DeliveryState state = 3;
  // The first 256 characters of the delivery reason, if any.
  optional string reason = 4;
  bool journal_admitted = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // The original reason is available from an ordinary command-ID watch for as
  // long as this receipt is retained, including receipts of deleted Dispatches.
  bool reason_truncated = 8;
  // Positive revision of this receipt from the Dispatcher's shared version
  // sequence. Legacy and live receipts share the sequence.
  optional int64 receipt_version = 9;
  bool legacy_deletion_receipt = 10;
}

message WatchDispatchesResponse {
  oneof frame {
    Dispatch dispatch = 1;
    CaughtUp caught_up = 2;
    DispatchWorkset workset = 5;
  }
  // Resume after this frame with the same filter. Deleted receipts have no Sandbox address.
  string resume_token = 3;
}

message ListDispatchesRequest {
  DispatchFilter filter = 1;
}

message ListDispatchesResponse {
  repeated Dispatch dispatches = 1;  // oldest first
}

message ListSessionDispatchesRequest {
  string session_id = 1;
  // 1-100 rows. Zero selects 25.
  uint32 limit = 2;
  string page_token = 3;
  // Optional exact membership check against the same retained rows as an ordinary page.
  // Supply 1-16 distinct command IDs without limit or page_token to verify storage retention.
  repeated string verify_retained_command_ids = 4;
}

message ListSessionDispatchesResponse {
  // Metadata only: identity, placement, operation, delivery state, full reason and timestamps.
  // Use GetDispatch to inspect admission and other evidence on an individual receipt.
  repeated Dispatch dispatches = 1;
  // Empty when all retained rows through the first page have been covered.
  string next_page_token = 2;
  enum Coverage {
    COVERAGE_UNSPECIFIED = 0;
    // Excludes legacy watch-only tombstones and any previously pruned evidence.
    RETAINED_DISPATCH_ROWS = 1;
  }
  Coverage coverage = 3;
  // Present only for an exact membership check. True when the database protects the returned
  // Session rows from both current and previous Dispatcher writers after Environment deletion.
  optional bool retains_commands_after_environment_deletion = 4;
}

message CancelDispatchRequest {
  string command_id = 1;
}

message CancelDispatchResponse {
  Dispatch dispatch = 1;
}

message CreateSessionRequest {
  // Caller-minted canonical lowercase UUID; never deliberately reuse it after deletion.
  string session_id = 1;
  reserved 2, 5;
  reserved "sandbox", "sandbox_uid";
  agentplane.proto.SessionSpec spec = 3;
  optional string setup_script = 4;  // selected only at creation
  reserved 6, 7, 8;
  reserved "environment_hosted", "central_sampler", "initial_executor";
}

// The current materialization of a Session by its placement owner. Acceptance is durable owner
// admission, not proof of harness readiness or completion.
message SessionStatus {
  enum Materialization {
    SESSION_MATERIALIZATION_UNSPECIFIED = 0;
    SESSION_MATERIALIZATION_WAITING = 1;
    SESSION_MATERIALIZATION_IN_PROGRESS = 2;
    SESSION_MATERIALIZATION_ACCEPTED = 3;
    SESSION_MATERIALIZATION_FAILED = 4;
    SESSION_MATERIALIZATION_UNKNOWN = 5;
  }
  enum RequiredEnvironment {
    REQUIRED_ENVIRONMENT_UNSPECIFIED = 0;
    REQUIRED_ENVIRONMENT_AVAILABLE = 1;
    REQUIRED_ENVIRONMENT_DELETED = 2;
  }
  Materialization materialization = 1;
  optional string reason = 2;
  agentplane.proto.DeliveryBlocker delivery_blocker = 3;
  agentplane.proto.WakeAssessment wake_assessment = 4;
  // The exact Environment selected at creation. DELETED never adopts a same-name replacement.
  RequiredEnvironment required_environment = 5;
  SessionActivity activity = 6;
}

message SessionActivity {
  google.protobuf.Timestamp recorded_at = 1;
  oneof kind {
    agentplane.harness_host.Session observed = 2;
    Unknown unknown = 3;
    EnvironmentDown environment_down = 4;
  }
  message Unknown {
    enum Reason {
      REASON_UNSPECIFIED = 0;
      NOT_YET_OBSERVED = 1;
      STREAM_LOST = 2;
    }
    Reason reason = 1;
  }
  message EnvironmentDown {
    enum Cause {
      CAUSE_UNSPECIFIED = 0;
      SUSPENDED = 1;
      DELETED = 2;
    }
    Cause cause = 1;
  }
}

// A minimal authorized read projection; immutable SessionSpec instructions remain private.
message Session {
  string session_id = 1;
  reserved 2, 3;
  reserved "sandbox", "sandbox_uid";
  SessionStatus status = 4;
  reserved 5, 6, 9, 10;
  reserved "state", "reason", "delivery_blocker", "wake_assessment";
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  reserved 11, 13, 14;
  reserved "harness", "initial_executor", "environment_hosted", "central_sampler_v1";
  // Read-only projection of the placement stored in SessionSpec, without exposing instructions.
  agentplane.proto.SessionPlacement placement = 12;
  reserved 15;
  reserved "execution_identity";
  // The exact Identity incarnation this Session executes as.
  agentplane.proto.Identity identity = 16;
}

message CreateSessionResponse {
  Session session = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {
  // Maximum returned Sessions, 1-100; zero selects 50.
  uint32 limit = 1;
  // Opaque continuation from a previous page. Carries no authority.
  string page_token = 2;
}

message ListSessionsResponse {
  // Ascending Session ID order. Pages read current records, not a frozen snapshot;
  // concurrent creation can add entries, but cannot reorder existing IDs.
  repeated Session sessions = 1;
  string next_page_token = 2;
}

message WatchSessionsRequest {
  // Opaque versioned cursor bound to the effective read scope; carries no authority.
  // Empty starts a full snapshot. Reuse with another scope is INVALID_ARGUMENT.
  string resume_token = 1;
}

message WatchSessionsResponse {
  oneof frame {
    Session session = 1;
    CaughtUp caught_up = 2;
    // Idle lease expiry asks the client to reconnect with fresh authorization.
    google.protobuf.Empty reconnect_required = 4;
  }
  // Checkpoint after this frame. Intermediate writes may coalesce into the latest record.
  // Listener reconnect replays a full snapshot, including records before this cursor.
  string resume_token = 3;
}
