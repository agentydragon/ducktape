syntax = "proto3";
// Preserve the gRPC service name across rolling deployments.
package agentplane.x.central_sampler;

import "agentplane/proto/event_log.proto";
import "agentplane/proto/session.proto";
import "agentplane/env/runtime/control/environment_runtime.proto";
import "agentplane/proto/identity.proto";

service Sampler {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc SubmitInput(agentplane.env.runtime.control.SubmitInputRequest) returns (agentplane.env.runtime.control.SubmitInputResponse);
  rpc ChangeModel(agentplane.env.runtime.control.ChangeModelRequest) returns (agentplane.env.runtime.control.ChangeModelResponse);
  rpc ChangeReasoningEffort(agentplane.env.runtime.control.ChangeReasoningEffortRequest) returns (agentplane.env.runtime.control.ChangeReasoningEffortResponse);
  rpc InterruptTurn(agentplane.env.runtime.control.InterruptTurnRequest) returns (agentplane.env.runtime.control.InterruptTurnResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
}
message CreateSessionRequest {
  string session_id = 1;
  agentplane.proto.SessionSpec spec = 2;
  // CLEANUP(added 2026-11-17): Reserve these fields in CENTRAL_SAMPLER_HARNESS_HOST
  // step 1 PR 3 after the operator confirms the namespace setting is configured on staging.
  // If supplied, executor must agree with placement and the configured environment namespace.
  agentplane.proto.SandboxDestination executor = 3;
  // Required only for the legacy namespace fallback; first OpenSession establishes the fence.
  string expected_incarnation_uid = 4;
  // Runs once in the bound executor's working directory before sampling starts.
  optional string setup_script = 5;
  reserved 6;
  reserved "execution_principal";
  // Supplied by the Dispatcher when the executor's Sandbox names an Identity.
  agentplane.proto.Identity execution_identity = 7;
}
message CreateSessionResponse { agentplane.proto.Attached attached = 1; }
message GetSessionResponse {
  agentplane.proto.Attached attached = 1;
  agentplane.proto.SandboxDestination executor = 2;
  string expected_incarnation_uid = 3;
  // Uncertain effects or lost live JavaScript prohibit continuation.
  bool blocked = 4;
  // Actionable explanation when automatic continuation is blocked.
  string blocked_reason = 5;
}
message ListSessionsRequest {}
message ListSessionsResponse { repeated GetSessionResponse sessions = 1; }
message GetCommandResponse {
  agentplane.proto.EventEntry admission = 1;
  // Empty until applied, failed, or interrupted; these outcomes are also in the event log.
  CommandOutcome outcome = 2;
  string failure_reason = 3;
}
enum CommandOutcome { COMMAND_OUTCOME_UNSPECIFIED = 0; COMMAND_OUTCOME_ACCEPTED = 1; COMMAND_OUTCOME_APPLIED = 2; COMMAND_OUTCOME_FAILED = 3; COMMAND_OUTCOME_UNKNOWN = 4; }
