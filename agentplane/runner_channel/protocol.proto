// The runner-initiated control channel to the Sandbox Service; contract in
// agentplane/docs/runner_channel.md. An incompatible change is a new package.
syntax = "proto3";

package ducktape.agentplane.runner_channel.v1;

import "agentplane/protocol/command.proto";
import "agentplane/protocol/event_log.proto";
import "agentplane/runner/protocol.proto";
import "google/protobuf/empty.proto";

service RunnerChannel {
  rpc Connect(stream RunnerFrame) returns (stream ServiceFrame);
  // CLEANUP(added 2026-10-11): remove `Follow`, its frames and the `events` capability once
  //   `agentplane/runner/channel.py` no longer serves follows; Events go to the runner's ingress
  //   (`agentplane/proto/runner_ingress.proto`), and the Sandbox Service never agrees `events`.
  // Opened by the runner when asked by `OpenFollow`, on the connection that carried it, with the
  // connection epoch and follow ID in `x-agentplane-connection-epoch` and `x-agentplane-follow-id`
  // metadata.
  rpc Follow(stream FollowFrame) returns (google.protobuf.Empty);
}

message RunnerFrame {
  oneof frame {
    Hello hello = 1;  // first frame, exactly once
    CommandReceipt receipt = 2;
    Heartbeat heartbeat = 3;
    ControlResult control_result = 4;
  }
}

message ServiceFrame {
  oneof frame {
    Welcome welcome = 1;  // reply to Hello, exactly once
    DeliverCommand deliver = 2;
    Heartbeat heartbeat = 3;
    OpenFollow open_follow = 4;
    CloseFollow close_follow = 5;
    ControlRequest control = 6;
  }
}

message Hello {
  string runner_boot_id = 1;  // random per runner process start
  // A peer uses a frame kind or RPC only after both sides listed it.
  repeated string capabilities = 2;
  reserved 3;
  reserved "runner_version";
}

message Welcome {
  uint64 connection_epoch = 1;
  repeated string capabilities = 2;  // what the service will use on this connection
}

// The runner deduplicates on `command.command_id` within a session, so redelivery is safe.
message DeliverCommand {
  string session_id = 1;
  ducktape.agentplane.protocol.v1.Command command = 2;
}

message CommandReceipt {
  string session_id = 1;
  string command_id = 2;
  oneof outcome {
    // The runner journal's CommandAdmitted entry, fresh or already journaled.
    ducktape.agentplane.protocol.v1.EventEntry admitted = 3;
    CommandRefused refused = 4;
  }
}

message CommandRefused {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_SESSION_UNKNOWN = 1;
    REASON_HARNESS_STOPPED = 2;
    REASON_COMMAND_CONFLICT = 3;  // same command_id, different payload
    REASON_INVALID_COMMAND = 4;
  }
  Reason reason = 1;
  string detail = 2;
}

message Heartbeat {}

message OpenFollow {
  string follow_id = 1;  // chosen by the service, unique per connection epoch
  string session_id = 2;  // the runner's Session ID
  uint64 after_cursor = 3;
}

message CloseFollow {
  string follow_id = 1;
}

message FollowFrame {
  oneof frame {
    ducktape.agentplane.runner.v1.Attached attached = 1;  // first frame: snapshot and last cursor
    ducktape.agentplane.protocol.v1.EventEntry entry = 2;  // cursors strictly increasing by one
    uint64 sealed = 3;  // terminal: journal sealed at this cursor
    FollowRefused refused = 4;  // terminal, in place of `attached`
  }
}

message FollowRefused {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_SESSION_UNKNOWN = 1;
    REASON_CURSOR_BEYOND_JOURNAL = 2;
    REASON_FOLLOW_LIMIT = 3;  // the connection already carries the runner's maximum of follows
  }
  Reason reason = 1;
  string detail = 2;
}

// Each request names its verb explicitly; nothing is inferred from which fields are present. Only
// `OpenSession` and `ResumeSession` start a harness. Deliveries and requests after a `Seal` are
// handled after it, and a `Seal` after every command delivered before it.
message ControlRequest {
  string request_id = 1;  // chosen by the service; the runner answers each once
  oneof verb {
    ducktape.agentplane.runner.v1.ListSessionsRequest list_sessions = 2;
    Initialize initialize = 3;
    OpenSession open = 4;
    ResumeSession resume = 5;
    ducktape.agentplane.runner.v1.SealRequest seal = 6;
  }
}

// Bootstrap once per Sandbox; an identical retry replays the one attempt's outcome.
message Initialize {
  string script = 1;
}

// Create a session with `spec` and start it. An existing session is confirmed only, never
// restarted: its `spec`, and `setup_script` when present, must equal the stored ones.
message OpenSession {
  string session_id = 1;
  ducktape.agentplane.runner.v1.SessionSpec spec = 2;
  optional string setup_script = 3;  // selected only at creation
}

// Restart a stopped harness on the session's retained spec. A running harness is left as it is.
message ResumeSession {
  string session_id = 1;
}

message ControlResult {
  string request_id = 1;
  oneof outcome {
    ducktape.agentplane.runner.v1.ListSessionsResponse list_sessions = 2;
    // The attempt's terminal event, `result` or `interrupted`; its output is not carried.
    ducktape.agentplane.runner.v1.InitializationEvent initialize = 3;
    ducktape.agentplane.runner.v1.Attached open = 4;
    ducktape.agentplane.runner.v1.Attached resume = 5;
    ducktape.agentplane.runner.v1.SealResponse seal = 6;
    ControlRefused refused = 9;
  }
}

message ControlRefused {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_SESSION_UNKNOWN = 1;
    REASON_SPEC_CONFLICT = 2;  // the session exists with a different spec or setup script
    REASON_SEALED = 3;
    REASON_SETUP_FAILED = 4;  // the session's setup failed or was interrupted; it never resumes
    REASON_INVALID_REQUEST = 5;  // a malformed session ID, spec, setup or bootstrap script, or no verb
    REASON_BOOTSTRAP_CONFLICT = 6;  // the Sandbox already selected a different bootstrap script
    // Anything else, such as a harness that failed to launch or a failed model-config lookup.
    REASON_FAILED = 7;
  }
  Reason reason = 1;
  string detail = 2;
}
