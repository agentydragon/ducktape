syntax = "proto3";

package agentplane.app.session_opening;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "agentplane/runner_gateway/dispatcher/session_dispatcher.proto";

// User-facing composition for the integration app's human frontend, not an API for in-cluster
// services. Backend callers use SessionDispatcher directly with a complete SessionSpec and do not
// depend on the app. Before calling Dispatcher, the app resolves its Sandbox preset, applies explicit
// spec and setup-script overrides, expands the Session ID in cwd, and creates app-owned Thread
// metadata. Dispatcher remains the authority for durable admission, delivery, and opening status.
service SessionOpeningService {
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse) {
    option (google.api.http) = {
      post: "/sandboxes/{name}/sessions"
      body: "*"
      response_body: "opening"
    };
  }
  rpc GetSessionOpening(GetSessionOpeningRequest) returns (GetSessionOpeningResponse) {
    option (google.api.http) = {
      get: "/sandboxes/{name}/sessions/{session_id}/opening"
      response_body: "opening"
    };
  }
}

message OpenSessionRequest {
  string name = 1;
  // Caller-minted UUID; reconcile an uncertain outcome with this identity, never a fresh opening.
  string session_id = 2;
  string sandbox_uid = 3;
  // Partial SessionSpec ProtoJSON, validated strictly against that generated message. A Struct
  // retains supplied keys, including zero, empty and null values that clear preset defaults.
  // A plain SessionSpec would lose scalar presence and optional scalars would lose explicit null.
  google.protobuf.Struct spec = 4;
  // Omitted selects the preset; null clears it; a string (including empty) replaces it.
  google.protobuf.Value setup_script = 5;
}

message GetSessionOpeningRequest {
  string name = 1;
  string session_id = 2;
}

message OpenSessionResponse {
  agentplane.runner_gateway.dispatcher.SessionOpening opening = 1;
}

message GetSessionOpeningResponse {
  agentplane.runner_gateway.dispatcher.SessionOpening opening = 1;
}
