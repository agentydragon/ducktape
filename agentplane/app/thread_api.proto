syntax = "proto3";

// Logical query/command inputs, independent of transport. Sync-engine adapters implement selection
// and use their existing snapshot/live/reconnect protocol; there is no Agentplane FollowView RPC.
// Contract and worked interactions: agentplane/docs/thread_view_sync.md.
package ducktape.agentplane.app.v1;

import "agentplane/app/thread_view.proto";
import "agentplane/protocol/command.proto";
import "agentplane/protocol/event_log.proto";

// Tail, before, or after. Unset direction reads the newest max_segments. Before reads the closest
// earlier items; after reads the closest later items. Responses are always in ascending cursor
// order. The client continues using the first/last returned cursor and exhausted, not an offset.
// Positive counts have a server maximum. Selected bodies are whole; there is no byte budget.
message ListSegmentsRequest {
  string thread_id = 1;
  string source_id = 2;
  string projection_epoch = 3;
  oneof direction {
    uint64 before_cursor = 4;
    uint64 after_cursor = 5;
  }
  uint32 max_segments = 6;
  ContentSelection content = 7;
  // A projection-lag precondition, not a sync-engine offset or a history filter.
  uint64 minimum_through_cursor = 8;
}

// Exact identities, including an item outside loaded windows. Response is a SegmentsPage at one
// position; only existing requested items are included. Missing items are absent at that position.
message GetSegmentsRequest {
  string thread_id = 1;
  string source_id = 2;
  string projection_epoch = 3;
  repeated uint64 cursors = 4;
  ContentSelection content = 5;
  uint64 minimum_through_cursor = 6;
}

message ReadPayloadRequest {
  string thread_id = 1;
  oneof target {
    PayloadRef payload = 2;
    // Exact retained EventEntry bytes; the original identity is independent of projection epoch.
    ducktape.agentplane.protocol.v1.EventOrigin origin = 3;
  }
}

// Returns the exact archived runner CommandAdmitted entry. Admission and effect remain separate;
// a timeout does not prove non-admission, and retries keep the exact command ID and payload.
message SubmitRequest {
  string thread_id = 1;
  ducktape.agentplane.protocol.v1.Command command = 2;
}

message ListPendingCommandsRequest {
  string thread_id = 1;
  string source_id = 2;
  string projection_epoch = 3;
  uint64 after_admission_cursor = 4;
  uint32 max_commands = 5;
  uint64 minimum_through_cursor = 6;
}

// Reconcile settled as well as pending commands after a lost submission response.
message GetCommandsRequest {
  string thread_id = 1;
  string source_id = 2;
  string projection_epoch = 3;
  repeated string command_ids = 4;
  uint64 minimum_through_cursor = 5;
}
