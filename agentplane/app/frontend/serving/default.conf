server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html/dist;
    index index.html;

    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
