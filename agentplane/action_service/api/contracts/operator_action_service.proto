// The Action Service's operator API: what the integration app does for an operator about Actions beyond reading them.
// It carries no agent authority. An operator reads requests, the catalog and Action policy through `ActionService`,
// with the same bearer.
syntax = "proto3";

package agentplane.action_service;

import "agentplane/action_service/api/contracts/action_service.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// The caller is the integration app acting for an operator. The bearer is the operator's OIDC token, whose issuer,
// audience and signature the service verifies; a workload's bearer never reaches this service. An operator decides
// requests, reads integration summaries and manages MCP server linkage.
//
// An error carries the gRPC status code that names it. `UNAUTHENTICATED` is a bearer that is missing, invalid or
// expired. `INVALID_ARGUMENT` is a malformed request, or scopes the MCP server is not configured for. `NOT_FOUND` is a
// request or MCP server that does not exist. `ALREADY_EXISTS` is a decision key already used for another decision.
// `ABORTED` is an `expected_version` that is no longer current. `FAILED_PRECONDITION` is a state that refuses the
// call: a request already decided, or an MCP server whose OAuth metadata cannot be used. `UNAVAILABLE` is a draining
// service.
//
// An `*_UNSPECIFIED` enum value in a request fails `INVALID_ARGUMENT`; a response never carries one.
//
// `WatchMcpServers` sends the current set as `snapshot` frames of a bounded number of items each, then
// `snapshot_complete` (alone, for an empty set), then one `upsert` per item that changes afterwards, carrying the item
// as it now stands. A client replaces what it holds under the item's identity. A change wakes the server but the item
// is read from the table, so changes in quick succession may arrive as one `upsert`, and one that happens with the
// clock alone (a token reaching its expiry) arrives too. Nothing is replayed: a new stream starts from a new
// snapshot, which is the whole set. The bearer is checked again before every frame: a stream whose bearer expires
// or stops being accepted ends `UNAUTHENTICATED`, and the client opens another with a fresh token. A stream that ends
// `UNAUTHENTICATED` before its first frame was refused at the door, and retrying it with the same token cannot
// succeed. Each stream write is bounded to wait five seconds for transport backpressure to clear; this bounds waiting
// on the write, not when a queued frame reaches the peer. An idle drain sends `reconnect_required`; a drain during an
// outstanding write ends the stream without another frame.
service OperatorActionService {
  // Records the operator's Decision on a request waiting for one, and answers with the request as it now stands. An
  // allow queues the request for dispatch. `expected_version` must be the `version` the operator reviewed, else
  // `ABORTED`. `idempotency_key` is unique per operator: an identical retry answers with the request as it now
  // stands, and the key reused for another request or verdict fails `ALREADY_EXISTS`. A request no longer pending
  // fails `FAILED_PRECONDITION`. A draining service fails `UNAVAILABLE`.
  rpc DecideActionRequest(DecideActionRequestRequest) returns (DecideActionRequestResponse) {
    option (google.api.http) = {post: "/v1/operator/action-requests/{request_id}/decision" body: "*"};
  }

  // Live subjects of threads named by a recorded Gmail relabel or draft reply request, or returned by a thread search.
  // An unavailable thread or backend is omitted. The receipt's arguments remain authoritative.
  rpc GetGmailThreadSummaries(GetGmailThreadSummariesRequest) returns (GetGmailThreadSummariesResponse) {
    option (google.api.http) = {get: "/v1/operator/action-requests/{request_id}/gmail-thread-summaries"};
  }

  // Live display metadata for draft, message, label and filter IDs in a recorded Gmail Action.
  rpc GetGmailResourceSummaries(GetGmailResourceSummariesRequest) returns (GetGmailResourceSummariesResponse) {
    option (google.api.http) = {get: "/v1/operator/action-requests/{request_id}/gmail-resource-summaries"};
  }

  // Live names of nodes or a workspace named by a supported recorded Tana request.
  // An unavailable node or backend is omitted. The receipt's arguments remain authoritative.
  rpc GetTanaNodeSummaries(GetTanaNodeSummariesRequest) returns (GetTanaNodeSummariesResponse) {
    option (google.api.http) = {get: "/v1/operator/action-requests/{request_id}/tana-node-summaries"};
  }

  // Live display metadata for a pending Calendar request. The saved arguments supply the
  // calendar and optional event or series ID. Unavailable metadata is omitted.
  rpc GetGoogleCalendarEventPreview(GetGoogleCalendarEventPreviewRequest) returns (GetGoogleCalendarEventPreviewResponse) {
    option (google.api.http) = {get: "/v1/operator/action-requests/{request_id}/google-calendar-event-preview"};
  }

  // Live names for exact references in a saved, pending Grocy SF Action request.
  rpc GetGrocyReferenceSummaries(GetGrocyReferenceSummariesRequest) returns (GetGrocyReferenceSummariesResponse) {
    option (google.api.http) = {get: "/v1/operator/action-requests/{request_id}/grocy-reference-summaries"};
  }

  // The linkage of every configured MCP server, then each one again whenever it changes, including when its token
  // expires.
  rpc WatchMcpServers(WatchMcpServersRequest) returns (stream WatchMcpServersResponse) {
    option (google.api.http) = {get: "/v1/operator/mcp-servers:watch"};
  }

  // Begins linking a server: discovers its OAuth metadata and answers with the authorization URL the operator's
  // browser opens. The flow lasts 10 minutes and finishes at the service's callback, which is plain HTTP. A server
  // whose metadata is unusable, or that lacks Client ID Metadata Document support where the server needs it, fails
  // `FAILED_PRECONDITION`; `scopes` the server is not configured for fail `INVALID_ARGUMENT`.
  rpc StartMcpServerLinkage(StartMcpServerLinkageRequest) returns (StartMcpServerLinkageResponse) {
    option (google.api.http) = {post: "/v1/operator/mcp-servers/{server_id}/linkage/start" body: "*"};
  }

  // Discards the server's token state and answers with its now unlinked linkage. Idempotent.
  rpc DisconnectMcpServer(DisconnectMcpServerRequest) returns (DisconnectMcpServerResponse) {
    option (google.api.http) = {post: "/v1/operator/mcp-servers/{server_id}/linkage/disconnect"};
  }
}

message DecideActionRequestRequest {
  // UUID.
  string request_id = 1;
  Verdict verdict = 2;
  // The request's `version` the operator reviewed.
  int64 expected_version = 3;
  // Chosen by the caller, unique per operator: 1 to 200 characters.
  string idempotency_key = 4;
  // Shared unchanged with the caller and not secret: at most 2000 characters.
  optional string decision_note = 5;
}

message DecideActionRequestResponse {
  ActionRequest action_request = 1;
}

message GetGmailThreadSummariesRequest {
  string request_id = 1;
}

message GetGmailThreadSummariesResponse {
  repeated GmailThreadSummary threads = 1;
}

message GmailThreadSummary {
  string thread_id = 1;
  string subject = 2;
}

message GetGmailResourceSummariesRequest {
  string request_id = 1;
}

message GetGmailResourceSummariesResponse {
  repeated GmailResourceTitle drafts = 1;
  repeated GmailResourceTitle messages = 2;
  repeated GmailResourceTitle labels = 3;
  repeated GmailFilterSummary filters = 4;
}

message GmailResourceTitle {
  string id = 1;
  string title = 2;
}

message GmailFilterSummary {
  string id = 1;
  GmailFilterCriteria criteria = 2;
  GmailFilterAction action = 3;
}

message GmailFilterCriteria {
  optional string from = 1;
  optional string to = 2;
  optional string subject = 3;
  optional string query = 4;
  optional string negated_query = 5;
  optional bool has_attachment = 6;
  optional bool exclude_chats = 7;
  optional int32 size = 8;
  optional string size_comparison = 9;
}

message GmailFilterAction {
  repeated string add_label_ids = 1;
  repeated string remove_label_ids = 2;
  optional string forward = 3;
}

message GetTanaNodeSummariesRequest {
  string request_id = 1;
}

message GetTanaNodeSummariesResponse {
  repeated TanaNodeSummary nodes = 1;
  TanaWorkspaceSummary workspace = 2;
}

message TanaNodeSummary {
  string node_id = 1;
  string name = 2;
}

message TanaWorkspaceSummary {
  string workspace_id = 1;
  string name = 2;
}

message GetGoogleCalendarEventPreviewRequest {
  string request_id = 1;
}

message GetGoogleCalendarEventPreviewResponse {
  GoogleCalendarEventPreview event = 1;
  GoogleCalendarSummary calendar = 2;
}

message GoogleCalendarSummary {
  // Exact calendar ID in the request. The "primary" alias is not resolved.
  string calendar_id = 1;
  string summary = 2;
}

message GoogleCalendarEventPreview {
  string event_id = 1;
  string summary = 2;
  string html_link = 3;
  GoogleCalendarEventTime start = 4;
  GoogleCalendarEventTime end = 5;
  GoogleCalendarEventTime original_start_time = 6;
  GoogleCalendarEventScope scope = 7;
}

message GoogleCalendarEventTime {
  // Exactly one of date or date_time is set. The end date of an all-day event is exclusive.
  string date = 1;
  string date_time = 2;
  string time_zone = 3;
}

enum GoogleCalendarEventScope {
  GOOGLE_CALENDAR_EVENT_SCOPE_UNSPECIFIED = 0;
  GOOGLE_CALENDAR_EVENT_SCOPE_SINGLE_EVENT = 1;
  GOOGLE_CALENDAR_EVENT_SCOPE_OCCURRENCE = 2;
  GOOGLE_CALENDAR_EVENT_SCOPE_SERIES = 3;
}

message GetGrocyReferenceSummariesRequest {
  string request_id = 1;
}

message GetGrocyReferenceSummariesResponse {
  repeated GrocyReferenceSummary references = 1;
}

message GrocyReferenceSummary {
  // An entity type and exact ID, for example "products/42".
  string key = 1;
  string name = 2;
}

message WatchMcpServersRequest {}

// Exactly one field is set.
message WatchMcpServersResponse {
  oneof frame {
    McpServerLinkageChunk snapshot = 1;
    google.protobuf.Empty snapshot_complete = 2;
    McpServerLinkage upsert = 3;
    // Planned renewal: reconnect with fresh authorization. A successful stream ends with it; bare EOF is a failure.
    // A stream whose bearer expired ends `UNAUTHENTICATED` instead.
    google.protobuf.Empty reconnect_required = 4;
  }
}

message McpServerLinkageChunk {
  repeated McpServerLinkage linkages = 1;
}

message StartMcpServerLinkageRequest {
  string server_id = 1;
  // OAuth scopes to request. Each must be among the server's configured scopes, or among those its metadata
  // advertises where none are configured. Empty requests all of those.
  repeated string scopes = 2;
}

message StartMcpServerLinkageResponse {
  reserved 1, 3;
  reserved "flow_id", "expires_at";
  // Where the operator's browser authorizes.
  string authorization_url = 2;
}

message DisconnectMcpServerRequest {
  string server_id = 1;
}

message DisconnectMcpServerResponse {
  McpServerLinkage linkage = 1;
}

// The shared OAuth token family of one configured MCP server.
message McpServerLinkage {
  reserved 4, 6, 7, 8;
  reserved "revision", "expires_at", "linked_at", "linked_by";
  string server_id = 1;
  string server_url = 2;
  McpLinkageStatus status = 3;
  repeated string scopes = 5;
  // The latest token refresh failure, including one still being retried, which may lapse the token before it clears.
  McpRefreshFailure refresh_failure = 9;
}

enum McpLinkageStatus {
  MCP_LINKAGE_STATUS_UNSPECIFIED = 0;
  MCP_LINKAGE_STATUS_UNLINKED = 1;
  MCP_LINKAGE_STATUS_LINKED = 2;
  // The refresh failed in a way that needs the operator to link again.
  MCP_LINKAGE_STATUS_DEGRADED = 3;
  // The access token lapsed.
  MCP_LINKAGE_STATUS_EXPIRED = 4;
}

message McpRefreshFailure {
  McpRefreshAction action = 1;
  // What the latest refresh got back: the provider's OAuth error, or the token endpoint's HTTP status or connection
  // failure.
  string error = 2;
  int32 attempts = 3;
  // When the service tries again; absent for `MCP_REFRESH_ACTION_RECONNECT`.
  google.protobuf.Timestamp retry_at = 4;
}

enum McpRefreshAction {
  MCP_REFRESH_ACTION_UNSPECIFIED = 0;
  // The provider refused the refresh: the operator links the account again.
  MCP_REFRESH_ACTION_RECONNECT = 1;
  // The refresh failed in a way that may pass: the service retries.
  MCP_REFRESH_ACTION_RETRYING = 2;
}
