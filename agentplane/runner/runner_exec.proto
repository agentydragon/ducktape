// Direct Runner executor relay for forward control mode. The frames and startup behavior are shared
// with the reverse RunnerControl stream.
syntax = "proto3";

package agentplane.runner;

import "agentplane/runner_gateway/executor_gateway.proto";

service RunnerExec {
  rpc Connect(stream agentplane.runner_gateway.ExecutorFrame)
      returns (stream agentplane.runner_gateway.ExecutorFrame);
}
