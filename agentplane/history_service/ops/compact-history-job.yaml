# Manual maintenance only; this file is not included in Flux.
# Replace the Session UUID and image before applying. The default mode is a read-only canary preview.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: history-compaction-
  namespace: agentplane-staging
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: history-service
    spec:
      serviceAccountName: history-service
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        topology.kubernetes.io/zone: hil-ovh
      imagePullSecrets:
        - name: forgejo-images-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compact-history
          image: git.allegedly.works/ducktape-ci/agentplane-history-service:replace-with-deployed-image
          args:
            - compact-history
            - --session
            - "91e0ad22-4ae2-45b0-a499-f617d54eb9ca"
            - --dry-run
            - --bytes-per-second
            - "1048576"
            - --pause-file
            - /var/run/history-repack/pause
          env:
            - name: AGENTPLANE_HISTORY_SERVICE_CONFIG_FILE
              value: /etc/agentplane-history/config.yaml
            - name: AGENTPLANE_HISTORY_SERVICE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-sandbox-service
                  key: uri
          volumeMounts:
            - name: service-config
              mountPath: /etc/agentplane-history
              readOnly: true
            - name: repack-control
              mountPath: /var/run/history-repack
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: service-config
          configMap:
            name: history-service-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: repack-control
          configMap:
            name: history-repack-control
            optional: true
