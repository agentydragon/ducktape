// The History Service's read boundary over retained Session history.
// README.md specifies lossless incremental storage compaction, cursor/replay invariants and reader
// requirements. Storage blocks never appear on this API; reads reconstruct original EventEntry values.
syntax = "proto3";

package agentplane.history_service;

import "agentplane/proto/command.proto";
import "agentplane/proto/event.proto";
import "agentplane/proto/event_log.proto";
import "agentplane/proto/session.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service HistoryService {
  rpc ReadSessionEvents(ReadSessionEventsRequest) returns (ReadSessionEventsResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/events"};
  }
  // Reads committed raw entries, optionally continuing as new entries commit.
  rpc FollowSession(FollowSessionRequest) returns (stream FollowSessionResponse);
  rpc ReadSessionObservations(ReadSessionObservationsRequest) returns (ReadSessionObservationsResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/observations"};
  }
  // Newest first by `first_event_at`, Sessions with nothing folded yet ahead of the rest.
  rpc GetSessionSummary(GetSessionSummaryRequest) returns (SessionSummary) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}/summary"};
  }
  // The named Sessions' summaries, in no particular order; a Session with no history is left out.
  rpc BatchGetSessionSummaries(BatchGetSessionSummariesRequest) returns (BatchGetSessionSummariesResponse) {
    option (google.api.http) = {post: "/v1/sessions:batchGetSummaries" body: "*"};
  }
  // Fails with FAILED_PRECONDITION when the caller's projection epoch is no longer current.
  rpc ReadThreadEntities(ReadThreadEntitiesRequest) returns (ReadThreadEntitiesResponse) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}/entities" body: "*"};
  }
  // The observations an entity was folded from, and the native harness frames behind each.
  rpc ReadEntityEvidence(ReadEntityEvidenceRequest) returns (ReadEntityEvidenceResponse) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}/entity-evidence" body: "*"};
  }
  rpc ReadNativeFrames(ReadNativeFramesRequest) returns (ReadNativeFramesResponse) {
    option (google.api.http) = {post: "/v1/sessions/{session_id}/native-frames" body: "*"};
  }
  // Every Session written by a Sandbox with a matching name, deleted Sandboxes included, in no
  // particular order.
  rpc FindSessions(FindSessionsRequest) returns (FindSessionsResponse) {
    option (google.api.http) = {get: "/v1/sessions:find"};
  }
  // Tells the caller when fold state it may hold changed, which names nothing: re-read what you hold.
  // On request it also names each Session the History Service records.
  rpc WatchSessionSummaries(WatchSessionSummariesRequest) returns (stream WatchSessionSummariesResponse) {
    option (google.api.http) = {get: "/v1/session-summaries:watch"};
  }
}

message FollowSessionRequest {
  string session_id = 1;
  oneof start {
    // Exclusive. Zero starts at the beginning; above the committed tail is OUT_OF_RANGE.
    uint64 after_cursor = 2;
    StartBack back = 3;
    // Only entries committed after the opening snapshot.
    google.protobuf.Empty tail = 4;
  }
  // Empty sends every kind. Unspecified and unknown kinds are INVALID_ARGUMENT.
  repeated EventKind kinds = 5;
  // False ends successfully after caught_up; true ends with reconnect_required.
  bool follow = 6;
}

message StartBack {
  EventKind kind = 1;
  // Start at the count-th most recent retained entry of kind, inclusively; fewer starts at zero.
  // Zero is INVALID_ARGUMENT.
  uint32 count = 2;
}

// Event.observation's wire field numbers. Keep in sync when adding observation cases.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_HARNESS_STARTED = 4;
  EVENT_KIND_HARNESS_EXITED = 5;
  EVENT_KIND_HARNESS_LOST = 6;
  EVENT_KIND_HARNESS_STDERR = 7;
  EVENT_KIND_COMMAND_ADMITTED = 8;
  EVENT_KIND_COMMAND_FAILED = 9;
  EVENT_KIND_COMMAND_NOOP = 10;
  EVENT_KIND_HARNESS_USER_MESSAGE_CONFIRMED = 11;
  EVENT_KIND_TURN_STARTED = 12;
  EVENT_KIND_TURN_COMPLETED = 13;
  EVENT_KIND_ITEM_STARTED = 14;
  EVENT_KIND_TEXT_DELTA = 15;
  EVENT_KIND_TOOL_ARGUMENTS_DELTA = 16;
  EVENT_KIND_TOOL_ARGUMENTS = 17;
  EVENT_KIND_TOOL_OUTPUT_DELTA = 18;
  EVENT_KIND_ITEM_COMPLETED = 19;
  EVENT_KIND_NATIVE = 20;
  EVENT_KIND_MODEL_CHANGED = 21;
  EVENT_KIND_DEBUG_CHECKPOINT = 22;
  EVENT_KIND_CONVERSATION_RECONCILED = 23;
  EVENT_KIND_REASONING_EFFORT_CHANGED = 24;
  EVENT_KIND_SETUP_STARTED = 25;
  EVENT_KIND_SETUP_OUTPUT = 26;
  EVENT_KIND_SETUP_FINISHED = 27;
  EVENT_KIND_SETUP_INTERRUPTED = 28;
  EVENT_KIND_HARNESS_LAUNCH_FAILED = 29;
  EVENT_KIND_JOURNAL_REOPENED = 30;
  EVENT_KIND_BOUNDARY_RECORD = 31;
  EVENT_KIND_EXECUTION_PROGRESS = 32;
}

message Entries {
  // Ascending cursors; at most 128 entries or 1 MiB per frame, one oversized entry alone.
  repeated .agentplane.proto.EventEntry entries = 1;
}

message FollowSessionResponse {
  oneof frame {
    Entries entries = 1;
    // All entries through through_cursor in the latest page snapshot have been sent or filtered out.
    google.protobuf.Empty caught_up = 2;
    // Correction for a completion in the next covered cursor page. The server sends it before an
    // entries or caught_up frame advances through_cursor past that completion.
    SettledDeltas settled = 3;
    // Cleanup correction; later catch-ups may report a removed range below the starting cursor.
    CursorRange removed = 4;
    // Planned renewal when an idle stream's lease expires or the service drains: resume after through_cursor with
    // fresh auth. If either ends during a write, the stream ends without this frame.
    google.protobuf.Empty reconnect_required = 5;
  }
  // Highest cursor covered by entries or caught_up, including filtered entries. Retain this to
  // resume without gaps or duplicates; correction frames retain the last covered cursor.
  uint64 through_cursor = 6;
}

message ReadSessionEventsRequest {
  string session_id = 1;
  uint64 after_cursor = 2;
  uint32 limit = 3;
}

message ReadSessionEventsResponse {
  uint64 last_cursor = 1;
  // Runner entries in ascending cursor order. A cursor missing between them, between
  // after_cursor and the first of them, or after the last of them when the page returns fewer
  // entries than its limit, is covered by a range of one of `settlements` or of `removed`.
  repeated .agentplane.proto.EventEntry entries = 2;
  // Absent for imported history without a retained runner attachment.
  SessionFeedState feed_state = 3;
  // Every settlement whose completion entry or settled range falls after after_cursor and at or
  // before the last returned entry, including ranges below after_cursor that a reader may have
  // read before they were settled.
  repeated SettledDeltas settlements = 4;
  // Every range of cursors deliberately deleted from stored history (an operator's cleanup, not a
  // settlement) that intersects the window after after_cursor, which ends at the last returned
  // entry, or at last_cursor when the page returns fewer entries than its limit.
  repeated CursorRange removed = 5;
}

message CursorRange {
  uint64 first = 1;
  uint64 last = 2;
}

// Authored by the history writer, not the runner: the streamed delta entries of one item field
// (native frames and the runner's derived delta Events) were removed from stored history because
// the retained completion entry holds exactly their concatenation. What was dropped is how the
// content was split into chunks, each chunk's timestamp, cursor and per-frame ids, and the frames'
// serialization.
message SettledDeltas {
  string item_id = 1;
  // Exact-shape template every removed native frame matched, with its version.
  string template = 2;
  // The retained runner entry (ItemCompleted or ToolArguments) holding the content.
  uint64 completion_cursor = 3;
  repeated CursorRange ranges = 4;
  uint64 chunk_count = 5;
  google.protobuf.Timestamp first_chunk_at = 6;
  google.protobuf.Timestamp last_chunk_at = 7;
}

message SessionFeedState {
  .agentplane.proto.Attached attached = 1;
  reserved 2;
  reserved "ended";
  // The incarnation's seal, once history committed every entry through it. Sticky.
  .agentplane.proto.Sealed sealed = 3;
}

message ReadSessionObservationsRequest {
  string session_id = 1;
  // Neither bound selects the tail. All responses are in ascending cursor order.
  optional uint64 before_cursor = 2;
  optional uint64 after_cursor = 3;
  uint32 limit = 4;
}

message SessionObservation {
  uint64 cursor = 1;
  // Unspecified for an entry without an observation.
  EventKind kind = 2;
}

message ReadSessionObservationsResponse {
  uint64 last_cursor = 1;
  repeated SessionObservation observations = 2;
  // Settled and removed cursor ranges intersecting the window; they account for cursors with no
  // observation.
  repeated CursorRange settled = 3;
}

message GetSessionSummaryRequest {
  string session_id = 1;
}

message BatchGetSessionSummariesRequest {
  // At most 200.
  repeated string session_ids = 1;
}

message BatchGetSessionSummariesResponse {
  repeated SessionSummary summaries = 1;
}

enum FeedStatus {
  // No runner attachment observed yet.
  FEED_STATUS_UNSPECIFIED = 0;
  FEED_STATUS_ACTIVE = 1;
  // The harness stopped after setup; a resumed harness makes the feed active again.
  FEED_STATUS_ENDED = 2;
  FEED_STATUS_FAILED = 3;
}

message SessionSummary {
  string session_id = 1;
  reserved 2, 3;
  reserved "sandbox_namespace", "sandbox_name";
  // Committed raw history; the fold lags by `committed_cursor - folded_through`.
  uint64 committed_cursor = 4;
  // Absent until the fold has materialized a view. An authenticated runner admission can
  // materialize the empty prefix at zero before any native Event or effective controls.
  // A stalled fold reports its error in the Thread's view state.
  optional string projection_epoch = 5;
  uint64 folded_through = 6;
  google.protobuf.Timestamp first_event_at = 7;
  google.protobuf.Timestamp last_event_at = 8;
  // Inferred from model-originated events, not an observed provider request.
  google.protobuf.Timestamp last_model_activity_at = 9;
  optional .agentplane.proto.TurnStatus last_turn_status = 10;
  .agentplane.proto.Attached attached = 11;
  FeedStatus feed_status = 12;
  // With FEED_STATUS_FAILED: why the runner's history was rejected.
  optional string feed_error = 13;
  // The execution Sandbox; the authenticated producer may be a central sampler. Absent until recorded.
  optional SandboxRef sandbox = 14;
  // When the harness last became idle: running with no turn in progress, from the event that
  // ended its last turn or started it. Absent while a turn runs, while the harness is stopped,
  // and until the fold meets the event that sets it. Display only: suspension reads the runner's
  // busy state on its Lease.
  google.protobuf.Timestamp idle_since = 15;
}

message SandboxRef {
  string namespace = 1;
  string name = 2;
  // The immutable Kubernetes Sandbox UID. Absent for legacy or non-Sandbox writers.
  optional string uid = 3;
}

message FindSessionsRequest {
  oneof sandbox {
    // The Sandbox's exact name.
    string sandbox_name = 1;
    // Text the Sandbox's name contains, ignoring case.
    string sandbox_name_contains = 2;
    // The exact Sandbox incarnation.
    string sandbox_uid = 3;
  }
}

message FindSessionsResponse {
  repeated SessionSandbox sessions = 1;
}

message SessionSandbox {
  string session_id = 1;
  SandboxRef sandbox = 2;
}

message ReadThreadEntitiesRequest {
  string session_id = 1;
  // The scope the caller holds rows of. Empty reads whichever scope is current.
  string projection_epoch = 2;
  oneof window {
    EntityRange range = 3;
    EntityKeys keys = 4;
  }
}

// Entity indexes are dense from 0 over every kind, so a range is every row in that stretch.
message EntityRange {
  uint64 start_entity_index = 1;
  // At most 200.
  uint32 limit = 2;
}

enum ThreadEntityKind {
  THREAD_ENTITY_KIND_UNSPECIFIED = 0;
  THREAD_ENTITY_KIND_VIEW_STATE = 1;
  THREAD_ENTITY_KIND_ITEM = 2;
  THREAD_ENTITY_KIND_CONFIRMED_INPUT = 3;
  THREAD_ENTITY_KIND_LIFECYCLE = 4;
  THREAD_ENTITY_KIND_COMMAND = 5;
}

message EntityKey {
  // Unspecified and unrecognized kinds are invalid.
  ThreadEntityKind entity_kind = 1;
  string entity_id = 2;
}

message EntityKeys {
  // At most 200.
  repeated EntityKey keys = 1;
}

message ReadThreadEntitiesResponse {
  // Empty, with no entities, before the fold has materialized anything.
  string projection_epoch = 1;
  uint64 through_cursor = 2;
  // A range ascends by entity index; keys return the rows that exist.
  repeated ThreadEntity entities = 3;
}

// PayloadField names the immutable body a Thread entity references.
enum ThreadPayloadField {
  THREAD_PAYLOAD_FIELD_UNSPECIFIED = 0;
  THREAD_PAYLOAD_FIELD_TEXT = 1;
  THREAD_PAYLOAD_FIELD_ARGUMENTS = 2;
  THREAD_PAYLOAD_FIELD_OUTPUT = 3;
  THREAD_PAYLOAD_FIELD_CONFIRMED_INPUT = 4;
  THREAD_PAYLOAD_FIELD_COMMAND_INPUT = 5;
}

// The result of a Thread command. PENDING also means the synchronized command row is pending.
enum ThreadCommandOutcome {
  THREAD_COMMAND_OUTCOME_UNSPECIFIED = 0;
  THREAD_COMMAND_OUTCOME_PENDING = 1;
  THREAD_COMMAND_OUTCOME_EFFECTED = 2;
  THREAD_COMMAND_OUTCOME_FAILED = 3;
  THREAD_COMMAND_OUTCOME_NOOP = 4;
}

enum ThreadFeedStatus {
  THREAD_FEED_STATUS_UNSPECIFIED = 0;
  THREAD_FEED_STATUS_ACTIVE = 1;
  THREAD_FEED_STATUS_ENDED = 2;
  THREAD_FEED_STATUS_FAILED = 3;
}

// A reference to an immutable payload revision. ProtoJSON renders each uint64 as a decimal string.
message ThreadPayloadReference {
  string projection_epoch = 1;
  uint64 owner_cursor = 2;
  string owner_id = 3;
  ThreadPayloadField field = 4;
  uint64 revision_cursor = 5;
  uint64 generation = 6;
  // How many chunks of the generation this revision spans; a reader renders at most these.
  uint64 chunk_count = 7;
}

message ThreadFeedError {
  optional uint64 cursor = 1;
  string message = 2;
}

message ThreadControls {
  optional string applied_model = 1;
  optional string applied_reasoning_effort = 2;
  optional string active_turn_id = 3;
  optional string harness_state = 4;
}

// Feed lifecycle has an independent version and does not fabricate a runner cursor.
message ThreadOperational {
  ThreadFeedStatus status = 1;
  uint64 last_verified_cursor = 2;
  ThreadFeedError feed_error = 3;
}

message ThreadViewState {
  ThreadControls controls = 1;
  ThreadOperational operational = 2;
}

message ThreadItemTextCompletion {}

message ThreadItemToolCompletion {
  bool succeeded = 1;
}

message ThreadItem {
  agentplane.proto.ItemKind kind = 1;
  string tool_name = 2;
  oneof completion {
    ThreadItemTextCompletion text = 3;
    ThreadItemToolCompletion tool = 4;
  }
  optional agentplane.proto.RecoveryDisposition recovery = 5;
  optional string recovery_reason = 6;
  optional string turn_id = 7;
  ThreadPayloadReference text_ref = 8;
  ThreadPayloadReference arguments_ref = 9;
  ThreadPayloadReference output_ref = 10;
}

message ThreadConfirmedInput {
  string harness_message_id = 1;
  repeated string origin_command_ids = 2;
  optional string turn_id = 3;
  ThreadPayloadReference input_ref = 4;
}

// Event's observation oneof carries the lifecycle kind; no duplicate string discriminator is needed.
message ThreadLifecycle {
  agentplane.proto.Event event = 1;
}

message ThreadCommand {
  agentplane.proto.Operation operation = 1;
  ThreadCommandOutcome outcome = 2;
  optional uint64 outcome_cursor = 3;
  optional string outcome_reason = 4;
  optional string requested_value = 5;
  ThreadPayloadReference input_ref = 6;
}

// The canonical typed contract for the rows that History folds and readers synchronize through
// Electric. EntityKey names a row by its entity kind and ID.
message ThreadEntity {
  string session_id = 1;
  string projection_epoch = 2;
  string entity_id = 3;
  uint64 entity_index = 4;
  uint64 cursor = 5;
  uint64 revision_cursor = 6;
  oneof entity {
    ThreadViewState view_state = 10;
    ThreadItem item = 11;
    ThreadConfirmedInput confirmed_input = 12;
    ThreadLifecycle lifecycle = 13;
    ThreadCommand command = 14;
  }
}

message ReadEntityEvidenceRequest {
  string session_id = 1;
  string projection_epoch = 2;
  EntityKey entity = 3;
  uint64 after_cursor = 4;
  // At most 200.
  uint32 limit = 5;
}

message EvidenceObservation {
  uint64 observation_cursor = 1;
  bool has_native = 2;
}

message ReadEntityEvidenceResponse {
  repeated EvidenceObservation observations = 1;
  // Absent on the last page.
  optional uint64 next_after_cursor = 2;
}

message ReadNativeFramesRequest {
  string session_id = 1;
  string projection_epoch = 2;
  EntityKey entity = 3;
  uint64 observation_cursor = 4;
  uint64 after_sequence = 5;
  // At most 200.
  uint32 limit = 6;
}

message WatchSessionSummariesRequest {
  // Present: the stream also sends `session_recorded` for every Session recorded at a position after
  // this one, those already recorded first. For a normal caller, positions count only Sessions
  // visible to its execution principal. Explicit backend-wide readers use the service-wide cursor.
  // 0 names every visible Session. Absent: it names none.
  optional uint64 recorded_after = 1;
}

message WatchSessionSummariesResponse {
  oneof observation {
    // Some Session's summary or entities changed. Every stream opens with one, for whatever
    // changed while the caller was not watching.
    google.protobuf.Empty changed = 1;
    // Planned renewal: reconnect with fresh authorization.
    google.protobuf.Empty reconnect_required = 2;
    // Only for a request with `recorded_after`.
    SessionRecorded session_recorded = 3;
  }
  // A successful stream ends with reconnect_required; bare EOF is a failure.
}

// A Session the History Service recorded, on the runner's first push of it.
message SessionRecorded {
  string session_id = 1;
  // Ascending in recording order within the caller's read scope, and a position becomes visible only
  // after every lower one in that scope, so a caller reconnecting with the last handled position misses
  // no visible Session.
  uint64 position = 2;
}

message NativeFrame {
  uint64 source_sequence = 1;
  // Absent when the retained entry at that sequence carries no native frame.
  .agentplane.proto.EventEntry entry = 2;
}

message ReadNativeFramesResponse {
  repeated NativeFrame frames = 1;
  // Absent on the last page.
  optional uint64 next_after_sequence = 2;
}
