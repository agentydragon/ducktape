// The History Service's read boundary over retained Session history.
syntax = "proto3";

package ducktape.agentplane.history.v1;

import "agentplane/proto/event.proto";
import "agentplane/proto/event_log.proto";
import "agentplane/proto/runner.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service HistoryService {
  rpc ReadSessionEvents(ReadSessionEventsRequest) returns (ReadSessionEventsResponse);
  rpc ReadSessionObservations(ReadSessionObservationsRequest) returns (ReadSessionObservationsResponse);
  // Newest first by `first_event_at`, Sessions with nothing folded yet ahead of the rest.
  rpc GetSessionSummary(GetSessionSummaryRequest) returns (SessionSummary);
  // The named Sessions' summaries, in no particular order; a Session with no history is left out.
  rpc BatchGetSessionSummaries(BatchGetSessionSummariesRequest) returns (BatchGetSessionSummariesResponse);
  // Fails with FAILED_PRECONDITION when the caller's projection epoch is no longer current.
  rpc ReadThreadEntities(ReadThreadEntitiesRequest) returns (ReadThreadEntitiesResponse);
  // The observations an entity was folded from, and the native harness frames behind each.
  rpc ReadEntityEvidence(ReadEntityEvidenceRequest) returns (ReadEntityEvidenceResponse);
  rpc ReadNativeFrames(ReadNativeFramesRequest) returns (ReadNativeFramesResponse);
  // Tells the caller when fold state it may hold changed. It names nothing: re-read what you hold.
  rpc WatchSessionSummaries(WatchSessionSummariesRequest) returns (stream WatchSessionSummariesResponse);
}

message ReadSessionEventsRequest {
  string session_id = 1;
  uint64 after_cursor = 2;
  uint32 limit = 3;
}

message ReadSessionEventsResponse {
  uint64 last_cursor = 1;
  // Runner entries in ascending cursor order. A cursor missing between them, or between
  // after_cursor and the first of them, is covered by a range of one of `settlements`.
  repeated .agentplane.proto.event_log.EventEntry entries = 2;
  // Absent for imported history without a retained runner attachment.
  SessionFeedState feed_state = 3;
  // Every settlement whose completion entry or settled range falls after after_cursor and at or
  // before the last returned entry, including ranges below after_cursor that a reader may have
  // read before they were settled.
  repeated SettledDeltas settlements = 4;
}

message CursorRange {
  uint64 first = 1;
  uint64 last = 2;
}

// Authored by the history writer, not the runner: the streamed delta entries of one item field
// (native frames and the runner's derived delta Events) were removed from stored history because
// the retained completion entry holds exactly their concatenation. What was dropped is how the
// content was split into chunks, each chunk's timestamp, cursor and per-frame ids, and the frames'
// serialization.
message SettledDeltas {
  string item_id = 1;
  // Exact-shape template every removed native frame matched, with its version.
  string template = 2;
  // The retained runner entry (ItemCompleted or ToolArguments) holding the content.
  uint64 completion_cursor = 3;
  repeated CursorRange ranges = 4;
  uint64 chunk_count = 5;
  google.protobuf.Timestamp first_chunk_at = 6;
  google.protobuf.Timestamp last_chunk_at = 7;
}

message SessionFeedState {
  .agentplane.proto.runner.Attached attached = 1;
  // True only after runner EOF at exactly attached.last_cursor. False means
  // unconfirmed, not evidence of current connectivity or a running harness.
  bool ended = 2;
  // The incarnation's seal, once a follower committed every entry through it. Sticky.
  .agentplane.proto.runner.Sealed sealed = 3;
}

message ReadSessionObservationsRequest {
  string session_id = 1;
  // Neither bound selects the tail. All responses are in ascending cursor order.
  optional uint64 before_cursor = 2;
  optional uint64 after_cursor = 3;
  uint32 limit = 4;
}

message SessionObservation {
  uint64 cursor = 1;
  string kind = 2;
}

message ReadSessionObservationsResponse {
  uint64 last_cursor = 1;
  repeated SessionObservation observations = 2;
  // Settled cursor ranges intersecting the window; they account for cursors with no observation.
  repeated CursorRange settled = 3;
}

message GetSessionSummaryRequest {
  string session_id = 1;
}

message BatchGetSessionSummariesRequest {
  // At most 200.
  repeated string session_ids = 1;
}

message BatchGetSessionSummariesResponse {
  repeated SessionSummary summaries = 1;
}

enum FeedStatus {
  // No runner attachment observed yet.
  FEED_STATUS_UNSPECIFIED = 0;
  FEED_STATUS_ACTIVE = 1;
  FEED_STATUS_ENDED = 2;
  FEED_STATUS_FAILED = 3;
}

message SessionSummary {
  string session_id = 1;
  // Both or neither: the Sandbox a follower copied the Session from. A Session only pushed through
  // the ingress names no Sandbox.
  optional string sandbox_namespace = 2;
  optional string sandbox_name = 3;
  // Committed raw history; the fold lags by `committed_cursor - folded_through`.
  uint64 committed_cursor = 4;
  // Absent until the fold has materialized an entry. A stalled fold reports its error in the
  // Thread's view state.
  optional string projection_epoch = 5;
  uint64 folded_through = 6;
  google.protobuf.Timestamp first_event_at = 7;
  google.protobuf.Timestamp last_event_at = 8;
  // Inferred from model-originated events, not an observed provider request.
  google.protobuf.Timestamp last_model_activity_at = 9;
  optional .agentplane.proto.event.TurnStatus last_turn_status = 10;
  .agentplane.proto.runner.Attached attached = 11;
  FeedStatus feed_status = 12;
  // With FEED_STATUS_FAILED: why the runner's history was rejected.
  optional string feed_error = 13;
}

message ReadThreadEntitiesRequest {
  string session_id = 1;
  // The scope the caller holds rows of. Empty reads whichever scope is current.
  string projection_epoch = 2;
  oneof window {
    EntityRange range = 3;
    EntityKeys keys = 4;
  }
}

// Entity indexes are dense from 0 over every kind, so a range is every row in that stretch.
message EntityRange {
  uint64 start_entity_index = 1;
  // At most 200.
  uint32 limit = 2;
}

message EntityKey {
  string entity_kind = 1;
  string entity_id = 2;
}

message EntityKeys {
  // At most 200.
  repeated EntityKey keys = 1;
}

message ReadThreadEntitiesResponse {
  // Empty, with no entities, before the fold has materialized anything.
  string projection_epoch = 1;
  uint64 through_cursor = 2;
  // A range ascends by entity index; keys return the rows that exist.
  repeated ThreadEntity entities = 3;
}

message ThreadEntity {
  uint64 entity_index = 1;
  // A `ThreadEntityView` JSON document (`agentplane.history_service.fold.views`), the row browsers sync.
  string view_json = 2;
}

message ReadEntityEvidenceRequest {
  string session_id = 1;
  string projection_epoch = 2;
  EntityKey entity = 3;
  uint64 after_cursor = 4;
  // At most 200.
  uint32 limit = 5;
}

message EvidenceObservation {
  uint64 observation_cursor = 1;
  bool has_native = 2;
}

message ReadEntityEvidenceResponse {
  repeated EvidenceObservation observations = 1;
  // Absent on the last page.
  optional uint64 next_after_cursor = 2;
}

message ReadNativeFramesRequest {
  string session_id = 1;
  string projection_epoch = 2;
  EntityKey entity = 3;
  uint64 observation_cursor = 4;
  uint64 after_sequence = 5;
  // At most 200.
  uint32 limit = 6;
}

message WatchSessionSummariesRequest {}

message WatchSessionSummariesResponse {
  oneof observation {
    // Some Session's summary or entities changed. Every stream opens with one, for whatever
    // changed while the caller was not watching.
    google.protobuf.Empty changed = 1;
    // Planned renewal: reconnect with fresh authorization.
    google.protobuf.Empty reconnect_required = 2;
  }
  // A successful stream ends with reconnect_required; bare EOF is a failure.
}

message NativeFrame {
  uint64 source_sequence = 1;
  // Absent when the retained entry at that sequence carries no native frame.
  .agentplane.proto.event_log.EventEntry entry = 2;
}

message ReadNativeFramesResponse {
  repeated NativeFrame frames = 1;
  // Absent on the last page.
  optional uint64 next_after_sequence = 2;
}
