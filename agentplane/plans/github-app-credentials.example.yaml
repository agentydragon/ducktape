# Planning template only: not consumed by a Kustomization or service yet.
# The operator will supply cluster/k8s/agentplane-staging/github-app.sops.yaml.
# Encrypt populated stringData with SOPS before committing; never deploy these blanks.
# Installation IDs are discovered per repository, not a single global credential.
apiVersion: v1
kind: Secret
metadata:
  name: agentplane-github-app
  namespace: agentplane-staging
type: Opaque
stringData:
  app-id: ""
  private-key: "" # PEM-encoded GitHub App private key
  webhook-secret: "" # Independent secret for X-Hub-Signature-256
