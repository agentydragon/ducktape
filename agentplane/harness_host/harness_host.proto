// Harness placement contract shared by native and central hosts.
syntax = "proto3";

package agentplane.harness_host;

import "agentplane/proto/event_log.proto";
import "agentplane/proto/session.proto";
import "agentplane/proto/identity.proto";

service HarnessHost {
  // Durably reserve or confirm immutable Session creation configuration, before native readiness.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // Command responses acknowledge durable admission; delivery continues after caller disconnect.
  rpc SubmitInput(SubmitInputRequest) returns (SubmitInputResponse);
  rpc ChangeModel(ChangeModelRequest) returns (ChangeModelResponse);
  rpc ChangeReasoningEffort(ChangeReasoningEffortRequest) returns (ChangeReasoningEffortResponse);
  rpc InterruptTurn(InterruptTurnRequest) returns (InterruptTurnResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Current-state watch: snapshot upserts, CaughtUp, then changed Session upserts and CaughtUp.
  // Reconnect always starts a fresh snapshot; there is no historical replay or resume token.
  // Reconcile missing Sessions only after the initial CaughtUp. Hosts retain Sessions for the
  // lifetime of a stream; a host that removes one must terminate watches for a fresh snapshot.
  rpc WatchSessions(WatchSessionsRequest) returns (stream WatchSessionsResponse);
}

message CreateSessionRequest {
  string session_id = 1;
  agentplane.proto.SessionSpec spec = 2;
  optional string setup_script = 3;  // selected only at creation
  // The Identity the Dispatcher recorded from the Sandbox's `spec.identity` at creation, absent when
  // it named none. The Host retains it with the Session.
  agentplane.proto.Identity execution_identity = 5;
}

message CreateSessionResponse {
  agentplane.proto.Attached attached = 1;
}

// Command responses carry durable CommandAdmitted evidence, before any required startup.
// Startup and delivery continue after caller disconnect; later failures are journal outcomes.
message SubmitInputRequest {
  string session_id = 1;
  string command_id = 2;
  string text = 3;
}

message SubmitInputResponse {
  agentplane.proto.EventEntry admission = 1;
}

message ChangeModelRequest {
  string session_id = 1;
  string command_id = 2;
  string model = 3;
}

message ChangeModelResponse {
  agentplane.proto.EventEntry admission = 1;
}

message ChangeReasoningEffortRequest {
  string session_id = 1;
  string command_id = 2;
  string effort = 3;
}

message ChangeReasoningEffortResponse {
  agentplane.proto.EventEntry admission = 1;
}

message InterruptTurnRequest {
  string session_id = 1;
  string command_id = 2;
  string turn_id = 3;
}

message InterruptTurnResponse {
  agentplane.proto.EventEntry admission = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message WatchSessionsRequest {}

message CaughtUp {}

message WatchSessionsResponse {
  oneof update {
    Session upsert = 1;
    CaughtUp caught_up = 2;
  }
}

// ListSessions and WatchSessions send x-agentplane-harness-host-session-version: 1
// in their initial response metadata. Readers must require it before accepting status;
// the preceding SessionSummary wire format used incompatible fields at these numbers.
message Session {
  string session_id = 1;
  string active_turn_id = 2;
  // Commands durably admitted by this host and not yet applied or otherwise settled.
  uint32 pending_commands = 3;
  oneof host {
    EnvironmentHostedSession environment_hosted = 4;
    CentralSamplerSession central_sampler_v1 = 5;
  }
}

message EnvironmentHostedSession {
  // This Session's setup script, in its cwd on this Sandbox.
  agentplane.proto.SetupState setup = 1;
  HarnessAttachment harness = 2;
}

message HarnessAttachment {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_DETACHED = 1;
    STATE_STARTING = 2;
    STATE_ATTACHED = 3;
  }
  State state = 1;
  // Last launch failure or unexpected exit since the last HarnessStarted.
  optional uint64 failure_cursor = 2;
}

message CentralSamplerSession {
  // Setup on the executor Sandbox; NOT_REQUIRED when there is no executor.
  agentplane.proto.SetupState setup = 1;
  optional Blocked blocked = 2;
}

message Blocked {
  oneof cause {
    UnresolvedIntent unresolved_intent = 1;
    OrphanedCell orphaned_cell = 2;
    UnsettledProcess unsettled_process = 3;
    UnconfirmedEffects unconfirmed_effects = 4;
  }
  string detail = 5;
}

message UnresolvedIntent {
  string intent_id = 1;
  string kind = 2;
}

message OrphanedCell {
  string cell_id = 1;
}

message UnsettledProcess {
  string process_id = 1;
}

message UnconfirmedEffects {}
