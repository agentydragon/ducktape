syntax = "proto3";
package agentplane.x.central_sampler;

import "agentplane/proto/event_log.proto";
import "agentplane/proto/runner.proto";
import "agentplane/proto/sandboxes.proto";
import "agentplane/runner/runner_service.proto";

service Sampler {
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  rpc SubmitInput(agentplane.runner.SubmitInputRequest) returns (agentplane.runner.SubmitInputResponse);
  rpc ChangeModel(agentplane.runner.ChangeModelRequest) returns (agentplane.runner.ChangeModelResponse);
  rpc ChangeReasoningEffort(agentplane.runner.ChangeReasoningEffortRequest) returns (agentplane.runner.ChangeReasoningEffortResponse);
  rpc InterruptTurn(agentplane.runner.InterruptTurnRequest) returns (agentplane.runner.InterruptTurnResponse);
  rpc RecoverSession(RecoverSessionRequest) returns (GetSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetCommand(GetCommandRequest) returns (GetCommandResponse);
  // Replays durable evidence; follow waits for newly committed entries. No History dependency.
  rpc FollowEvents(FollowEventsRequest) returns (stream FollowEventsResponse);
  rpc Compact(CompactRequest) returns (CompactResponse);
}
message OpenSessionRequest {
  string session_id = 1;
  agentplane.proto.SessionSpec spec = 2;
  agentplane.proto.SandboxDestination executor = 3;
  string expected_incarnation_uid = 4;
  // Runs once in the bound executor's working directory before sampling starts.
  optional string setup_script = 5;
}
message OpenSessionResponse { agentplane.proto.Attached attached = 1; }
message GetSessionRequest { string session_id = 1; }
message GetSessionResponse {
  agentplane.proto.Attached attached = 1;
  agentplane.proto.SandboxDestination executor = 2;
  string expected_incarnation_uid = 3;
  // Uncertain effects or lost live JavaScript prohibit continuation.
  bool blocked = 4;
  // Actionable explanation when automatic continuation is blocked.
  string blocked_reason = 5;
}
message ListSessionsRequest {}
message ListSessionsResponse { repeated GetSessionResponse sessions = 1; }
message GetCommandRequest { string session_id = 1; string command_id = 2; }
message GetCommandResponse {
  agentplane.proto.EventEntry admission = 1;
  // Empty until applied, failed, or interrupted; these outcomes are also in the event log.
  CommandOutcome outcome = 2;
  string failure_reason = 3;
}
message FollowEventsRequest { string session_id = 1; uint64 after_cursor = 2; bool follow = 3; }
message FollowEventsResponse { agentplane.proto.EventEntry entry = 1; }
message CompactRequest { string session_id = 1; string command_id = 2; }
message CompactResponse { agentplane.proto.EventEntry admission = 1; }

enum CommandOutcome { COMMAND_OUTCOME_UNSPECIFIED = 0; COMMAND_OUTCOME_ACCEPTED = 1; COMMAND_OUTCOME_APPLIED = 2; COMMAND_OUTCOME_FAILED = 3; COMMAND_OUTCOME_UNKNOWN = 4; }

// Explicitly abandon an uncertain cell without replaying external effects.
message RecoverSessionRequest {
  string session_id = 1;
  uint64 expected_cursor = 2;
  // Required acknowledgment after inspecting boundary evidence. Remote outcomes may remain
  // unknown; recovery opens a new logical JavaScript session, so prior cell handles and
  // store/load values are unavailable to the continuation.
  string operator_note = 3;
}
