syntax = "proto3";

package agentplane.x.grpc_gateway;

option go_package = "github.com/agentydragon/ducktape/agentplane/x/grpc_gateway/proto;gatewaypb";

import "google/api/annotations.proto";

service GatewayProof {
  rpc Echo(EchoRequest) returns (EchoResponse) {
    option (google.api.http) = {
      post: "/v1/echo"
      body: "*"
    };
  }

  rpc Watch(WatchRequest) returns (stream WatchEvent) {
    option (google.api.http) = {
      get: "/v1/watch"
    };
  }
}

message EchoRequest {
  string input_text = 1;
  string correlation_id = 2;
  uint64 sequence = 3;
  bool hold_until_cancelled = 4;
}

message EchoResponse {
  string output_text = 1;
  string correlation_id = 2;
  uint64 accepted_sequence = 3;
}

message WatchRequest {
  uint64 after_sequence = 1;
  bool hold_after_first = 2;
  bool fail_after_first = 3;
}

message WatchEvent {
  uint64 sequence = 1;
  string text = 2;
}
