// The authorized Sandbox Service boundary, not a tunnel to runner Attach.
syntax = "proto3";

package ducktape.agentplane.sandbox.v1;

import "agentplane/protocol/command.proto";
import "agentplane/protocol/event_log.proto";
import "agentplane/runner/protocol.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service SandboxService {
  rpc ListSandboxes(google.protobuf.Empty) returns (ListSandboxesResponse);
  rpc GetSandbox(GetSandboxRequest) returns (Sandbox);
  // Persist the Suspended CR and return; the reconciler provisions and starts it.
  // Retry with the same name and exact choices while the Sandbox CR exists.
  rpc CreateSandbox(CreateSandboxRequest) returns (Sandbox);
  rpc SuspendSandbox(SandboxRequest) returns (google.protobuf.Empty);
  rpc ResumeSandbox(SandboxRequest) returns (google.protobuf.Empty);
  rpc DeleteSandbox(SandboxRequest) returns (google.protobuf.Empty);
  rpc ListTemplates(google.protobuf.Empty) returns (ListTemplatesResponse);

  rpc GrantEgress(GrantEgressRequest) returns (GrantEgressResponse);
  rpc RevokeEgress(RevokeEgressRequest) returns (google.protobuf.Empty);

  rpc ListSessions(SandboxRequest) returns (ducktape.agentplane.runner.v1.ListSessionsResponse);
  // Legacy caller-chosen runner identifier; retained until app cutover.
  rpc OpenSession(OpenSessionRequest) returns (ducktape.agentplane.runner.v1.Attached);
  // Service-owned Session identity. The key is only for an explicit Open retry.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // Read-only reconciliation by the original caller, sandbox incarnation and Open key.
  rpc LookupSession(LookupSessionRequest) returns (LookupSessionResponse);
  rpc ResumeSession(SessionRequest) returns (ducktape.agentplane.runner.v1.Attached);
  // Returns the original matching CommandAdmitted entry, not command completion.
  rpc SubmitCommand(SubmitCommandRequest) returns (ducktape.agentplane.protocol.v1.EventEntry);
  // Replays the runner journal after the caller's cursor, then continues live on the same stream.
  // The Sandbox Service keeps no copy of these entries.
  rpc FollowSession(FollowSessionRequest) returns (stream FollowSessionResponse);
  // Privileged, bounded retained raw history by public Session ID; survives Sandbox deletion.
  rpc ReadSessionEvents(ReadSessionEventsRequest) returns (ReadSessionEventsResponse);
  // Same reader authorization; chronological metadata without transmitting native payloads.
  rpc ReadSessionObservations(ReadSessionObservationsRequest) returns (ReadSessionObservationsResponse);
  // Any allowed service caller. Every Session, including those of deleted Sandboxes, in the
  // order of each one's latest change, then each later change as it commits.
  rpc WatchSessions(WatchSessionsRequest) returns (stream WatchSessionsResponse);
}

message ServiceAccount {
  string namespace = 1;
  string name = 2;
}

message SandboxDestination {
  ServiceAccount owner = 1;
  string sandbox = 2;
  string sandbox_uid = 3;
}

message SessionDestination {
  SandboxDestination sandbox = 1;
  string session_id = 2;
}

message SandboxRequest { SandboxDestination destination = 1; }
message SessionRequest { SessionDestination destination = 1; }
message GetSandboxRequest { string name = 1; }

message OpenSessionRequest {
  SessionDestination destination = 1;
  ducktape.agentplane.runner.v1.SessionSpec spec = 2;
  // Exact fields overriding stored defaults. Required even for an explicitly empty value.
  // Paths use SessionSpec's proto field names; nested paths and '*' are not accepted.
  google.protobuf.FieldMask override_mask = 3;
  optional string setup_script = 4;
}

message CreateSessionRequest {
  SandboxDestination sandbox = 1;
  // Opaque to the service, scoped to the authenticated caller and Sandbox UID.
  string idempotency_key = 2;
  ducktape.agentplane.runner.v1.SessionSpec spec = 3;
  // Which spec fields replace the Sandbox defaults (proto field names). Proto3 scalar
  // fields cannot distinguish absent from explicitly empty; e.g. instructions=""
  // with "instructions" in this mask clears inherited instructions. An empty mask
  // inherits all defaults, regardless of spec's scalar default values.
  google.protobuf.FieldMask override_mask = 4;
  optional string setup_script = 5;
}

message CreateSessionResponse {
  // Durable service ID (UUID), NOT the runner or harness session ID.
  string session_id = 1;
  ducktape.agentplane.runner.v1.Attached attached = 2;
}

message LookupSessionRequest {
  SandboxDestination sandbox = 1;
  string idempotency_key = 2;
}

message LookupSessionResponse {
  // Empty when no reservation exists for this exact caller, Sandbox UID and key.
  string session_id = 1;
  // Only set after evidence that native Open succeeded; inventory alone also includes failed Opens.
  // This is app-facing only and may contain the frozen spec: never forward it to the browser.
  ducktape.agentplane.runner.v1.SessionSummary summary = 2;
  // The runner has terminal setup/launch failure evidence without a successful native start.
  // A reserved but still in-flight Open leaves both summary and failed unset.
  bool failed = 3;
}

message ReadSessionEventsRequest {
  string session_id = 1;
  uint64 after_cursor = 2;
  uint32 limit = 3;
}

message ReadSessionEventsResponse {
  uint64 last_cursor = 1;
  repeated ducktape.agentplane.protocol.v1.EventEntry entries = 2;
  // Absent for imported history without a retained runner attachment.
  SessionFeedState feed_state = 3;
}

message SessionFeedState {
  ducktape.agentplane.runner.v1.Attached attached = 1;
  // True only after runner EOF at exactly attached.last_cursor. False means
  // unconfirmed, not evidence of current connectivity or a running harness.
  bool ended = 2;
}

message ReadSessionObservationsRequest {
  string session_id = 1;
  // Neither bound selects the tail. All responses are in ascending cursor order.
  optional uint64 before_cursor = 2;
  optional uint64 after_cursor = 3;
  uint32 limit = 4;
}

message SessionObservation {
  uint64 cursor = 1;
  string kind = 2;
}

message ReadSessionObservationsResponse {
  uint64 last_cursor = 1;
  repeated SessionObservation observations = 2;
}

message WatchSessionsRequest {
  // The last position the caller has processed; 0 starts from the first Session.
  uint64 after_position = 1;
}

// A Session's current record. A Session reappears, at a larger position, whenever it changes.
message SessionChange {
  // Public Session ID (UUID).
  string session_id = 1;
  // Sandbox name and current incarnation. The UID is empty for imported Sessions whose
  // Sandbox UID was not retained.
  string sandbox = 2;
  string sandbox_uid = 3;
  // Durable and commit-ordered across replicas: resuming after it misses no later change.
  uint64 position = 4;
}

message WatchSessionsResponse {
  oneof observation {
    SessionChange change = 1;
    // Planned renewal, as in FollowSession: reconnect with fresh authorization after the
    // last position received.
    google.protobuf.Empty reconnect_required = 2;
  }
  // A successful stream ends with reconnect_required; bare EOF is a failure.
}

// Internal frozen launch snapshot, committed before contacting the runner.
message FrozenLaunch {
  ducktape.agentplane.runner.v1.Open open = 1;
  string bootstrap = 2;
}

message SubmitCommandRequest {
  SessionDestination destination = 1;
  ducktape.agentplane.protocol.v1.Command command = 2;
  ducktape.agentplane.protocol.v1.Follow follow = 3;
}

message FollowSessionRequest {
  SessionDestination destination = 1;
  // Entries after this cursor of the current Sandbox incarnation's runner journal. A cursor beyond
  // the journal's end fails with FAILED_PRECONDITION instead of an Attached snapshot.
  ducktape.agentplane.protocol.v1.Follow follow = 2;
}

// The runner sealed this Sandbox incarnation of the Session at teardown: its journal is final.
// Staged for the runner's teardown seal; no runner journals a seal yet, so this is never sent.
message Sealed {
  // The incarnation's final cursor. Every entry through it precedes this frame.
  uint64 cursor = 1;
}

message FollowSessionResponse {
  oneof observation {
    // Its last_cursor is the journal end at attach time: entries up to it are replayed, later ones live.
    ducktape.agentplane.runner.v1.Attached attached = 1;
    // Replayed and live entries have the same shape, with consecutive cursors.
    ducktape.agentplane.protocol.v1.EventEntry entry = 2;
    // Runner attachment reached native EOF. This is not a fabricated execution Event.
    google.protobuf.Empty ended = 3;
    // Planned renewal: reconnect with fresh authorization from the committed cursor.
    // This is transport control, not native EOF or a journal entry.
    google.protobuf.Empty reconnect_required = 4;
    Sealed sealed = 5;
  }
  // A successful stream ends with ended, reconnect_required or sealed. Bare transport EOF
  // and DEADLINE_EXCEEDED are failures, never native closure evidence.
}

message SessionDefaults {
  optional ducktape.agentplane.runner.v1.Harness harness = 1;
  optional string model = 2;
  optional string cwd = 3;
  optional string reasoning_effort = 4;
  optional string instructions = 5;
  optional string setup_script = 6;
}

message SandboxBinding {
  SessionDefaults session_defaults = 1;
  string bootstrap = 2;
}

message CreateSandboxRequest {
  string name = 1;
  string template = 2;
  // EgressPolicy names to grant to the new sandbox.
  repeated string egress_policies = 3;
  repeated string action_policy_sets = 4;
  repeated string kubernetes_grants = 5;
  SessionDefaults session_defaults = 6;
  string bootstrap = 7;
}

// Kubernetes names/status vocabulary is preserved, not recast as runner state.
message RoleRef {
  string kind = 1;
  string name = 2;
}
message KubernetesGrant {
  string kind = 1;
  optional string namespace = 2;
  RoleRef role_ref = 3;
}
message ResolvedGrant {
  string name = 1;
  KubernetesGrant grant = 2;
}
message OwnerReference {
  string api_version = 1;
  string kind = 2;
  string name = 3;
  string uid = 4;
  bool controller = 5;
}
message SandboxPod {
  string name = 1;
  string namespace = 2;
  string uid = 3;
  bool deleting = 4;
  repeated OwnerReference owner_references = 5;
  google.protobuf.Struct status = 6;
  optional string node_name = 7;
}
message Sandbox {
  reserved 3, 6, 7;
  reserved "state", "conditions", "node_name";

  string name = 1;
  string uid = 2;
  google.protobuf.Timestamp created_at = 4;
  string operating_mode = 5;
  ServiceAccount service_account = 8;
  SandboxBinding binding = 9;
  repeated ResolvedGrant kubernetes_grants = 10;
  bool kubernetes_grants_ready = 11;
  optional string kubernetes_grant_error = 12;
  bool deleting = 13;
  SandboxPod pod = 14;
  string namespace = 15;
  google.protobuf.Struct status = 16;
  bool launch_grants_pending = 17;
  bool initializing = 18;
}
message ListSandboxesResponse { repeated Sandbox sandboxes = 1; }
message ListTemplatesResponse { repeated string templates = 1; }

message GrantEgressRequest {
  SandboxDestination destination = 1;
  // EgressPolicy names to grant in the new binding.
  repeated string egress_policies = 2;
}
message GrantEgressResponse { string binding_name = 1; }
message RevokeEgressRequest { string binding_name = 1; }
