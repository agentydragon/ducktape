// Sandbox lifecycle and process diagnostics served over the Runtime control transport; contract
// in agentplane/env/runtime/docs/control.md. Session creation, commands and inventory are HarnessHost.
syntax = "proto3";

package agentplane.env.runtime.control;

import "agentplane/proto/session.proto";
import "agentplane/proto/environment_runtime_state.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Served beside HarnessHost over the Runtime control transport. Process startup, native readiness
// and reconciliation are owned by the environment services.
service EnvironmentRuntime {
  // The Controller's authenticated observe_only watch binds the workload incarnation once
  // per Runtime process, before publishing facts. Gateway watches must match that binding.
  // Each Gateway observes independently; observation does not own control-call admission.
  // No Gateway watch can change incarnation.
  rpc WatchState(WatchStateRequest) returns (stream WatchStateResponse);
  // Informational live snapshot; never starts a process or wakes a Sandbox.
  rpc GetStatus(agentplane.proto.GetStatusRequest)
      returns (agentplane.proto.EnvironmentRuntimeStatus);
  // Sandbox teardown: durably refuse new Sessions and execution, let setup/bootstrap finish, stop harnesses,
  // and seal every journal at its final cursor. Idempotent: a repeat returns the same cursors with
  // each Session's current `flushed`, so teardown repeats it until every Session is flushed.
  rpc Quiesce(agentplane.proto.QuiesceRequest) returns (agentplane.proto.QuiesceResponse);
  // Atomically close admission only if the Runtime is still in the observed idle period.
  // This preserves RAM and Sessions for a Firecracker checkpoint; it does not quiesce.
  rpc PrepareSuspend(PrepareSuspendRequest) returns (google.protobuf.Empty);
  // Release the admission gate after a completed checkpoint and actual guest resume, or
  // invalidate an attempt rejected before checkpoint. A newer generation supersedes old RPCs.
  rpc ResumeAdmission(ResumeAdmissionRequest) returns (google.protobuf.Empty);
}

message WatchStateRequest {
  string sandbox_uid = 1;
  string incarnation_uid = 2;  // current Pod or virt-launcher Pod UID
  reserved 3;
  reserved "connection_epoch";
  // Requires the Controller peer identity, which binds this Runtime process's incarnation.
  // Grants no control or Executor authorization; reconnect cannot replace the binding.
  bool observe_only = 4;
}

message WatchStateResponse {
  string sandbox_uid = 1;
  string incarnation_uid = 2;
  string environment_runtime_boot_id = 3;
  reserved 4;
  reserved "connection_epoch";
  agentplane.proto.EnvironmentRuntimeFacts facts = 5;
}

message PrepareSuspendRequest {
  int64 generation = 1;  // positive, monotonically increasing per Sandbox incarnation
  google.protobuf.Timestamp if_idle_since = 2;
}

message ResumeAdmissionRequest {
  int64 generation = 1;
}
