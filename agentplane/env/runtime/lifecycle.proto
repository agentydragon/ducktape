syntax = "proto3";

package agentplane.env.runtime;

import "agentplane/proto/environment_runtime_state.proto";
// Typed in-process lifecycle values. Runtime owns identity and generation;
// Host reports the generation applied and whether native work has stopped.

message Binding {
  string runtime_boot_id = 1;
  string host_boot_id = 2;
  uint64 generation = 3;
}

message HostReport {
  Binding binding = 1;
  bool ready = 2;
  bool native_stopped = 3;
  agentplane.proto.EnvironmentRuntimeFacts facts = 4;
  string error = 5;
}

message LifecycleIntent {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    INACTIVE = 1;
    RUNNING = 2;
    QUIESCING = 3;
    CLOSING = 4;
  }

  Binding binding = 1;
  string sandbox_uid = 2;
  string incarnation_uid = 3;
  Mode mode = 4;
  string seal_uid = 5;
  bool execution_fenced = 6;
}
