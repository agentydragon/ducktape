syntax = "proto3";
// The published wire identity is stable across source/package relocation.
package agentplane.executor;

import "agentplane/proto/sandboxes.proto";

// The Gateway authorizes and resolves this scope; the execution owner checks its current incarnation.
message ExecutionScope {
  agentplane.proto.SandboxDestination destination = 1;
  string expected_incarnation_uid = 2;
  // Sampler Session attribution, distinct from the local execution session.
  string session_id = 3;
}

// A stale expected incarnation can be rebound only when the owner verified that the
// destination still names this Sandbox and observed its current incarnation.
message SandboxIncarnationChanged {
  string sandbox_uid = 1;
  string incarnation_uid = 2;
}

// A verified, scoped execution request was refused before native dispatch.
// Gateway attaches route/lifecycle states after caller authorization and exact Sandbox UID
// resolution; a scoped Runtime may attach a local readiness state before native dispatch. It
// carries no replacement identity and does not authorize waking or provisioning an environment.
message ExecutionEnvironmentFailure {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_SUSPENDED = 1;
    STATE_STARTING = 2;
    STATE_NOT_READY = 3;
    STATE_QUIESCING = 4;
    STATE_CONTROL_ROUTE_UNAVAILABLE = 5;
  }
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_NOT_DISPATCHED = 1;
  }
  State state = 1;
  Outcome outcome = 2;
}

// Outcomes describe the observed local Codex reply, not process completion.
// Transport loss can leave an effect unknown; request IDs do not provide deduplication.
message ExecutionStatus {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_COMPLETED = 1;
    OUTCOME_REJECTED = 2;
    OUTCOME_UNKNOWN = 3;
  }
  Outcome outcome = 1;
  string message = 2;
  optional int32 upstream_code = 3;
}
message ExecutionShell {
  string name = 1;
  string path = 2;
}
message ExecutionEnvironmentPolicy {
  string inherit = 1;
  bool ignore_default_excludes = 2;
  repeated string exclude = 3;
  map<string, string> set = 4;
  repeated string include_only = 5;
}
message OpenSessionRequest {
  ExecutionScope scope = 1;
  string request_id = 2;
  optional string resume_session_id = 3;
}
message OpenSessionResponse {
  // The first response has an outcome and session identity. Later responses carry
  // asynchronous native notifications with no status.
  ExecutionStatus status = 1;
  string execution_session_id = 2;
  ExecutionShell shell = 3;
  repeated ExecutionNativeFrame native_frames = 20;
}
// Caller-selected IDs correlate requests and evidence; they are not retry or admission receipts.
message StartProcessRequest {
  ExecutionScope scope = 1;
  string execution_session_id = 2;
  string request_id = 3;
  string process_id = 4;
  repeated string argv = 5;
  // Absolute file URI, following the native executor path contract.
  string cwd = 6;
  ExecutionEnvironmentPolicy environment_policy = 7;
  map<string, string> environment = 8;
  bool tty = 9;
  bool pipe_stdin = 10;
  optional string arg0 = 11;
}
message StartProcessResponse {
  ExecutionStatus status = 1;
  string process_id = 2;
  repeated ExecutionNativeFrame native_frames = 20;
}
message ReadProcessRequest {
  ExecutionScope scope = 1;
  string execution_session_id = 2;
  string request_id = 3;
  string process_id = 4;
  // Exclusive last-consumed sequence; absent starts at the retained beginning.
  optional uint64 after_seq = 5;
  uint32 max_bytes = 6;
  uint32 wait_ms = 7;
}
message ExecutionOutputChunk {
  uint64 seq = 1;
  string stream = 2;
  bytes data = 3;
}
message ReadProcessResponse {
  ExecutionStatus status = 1;
  repeated ExecutionOutputChunk chunks = 2;
  // One past the last-consumed sequence. For the next read use next_seq - 1
  // as after_seq when nonzero; zero means no sequence was consumed.
  uint64 next_seq = 3;
  bool exited = 4;
  optional int32 exit_code = 5;
  bool closed = 6;
  optional string failure = 7;
  repeated ExecutionNativeFrame native_frames = 20;
}
message WriteProcessRequest {
  ExecutionScope scope = 1;
  string execution_session_id = 2;
  string request_id = 3;
  string process_id = 4;
  bytes data = 5;
  string write_id = 6;
}
message WriteProcessResponse {
  ExecutionStatus status = 1;
  string write_status = 2;
  repeated ExecutionNativeFrame native_frames = 20;
}
message SignalProcessRequest {
  ExecutionScope scope = 1;
  string execution_session_id = 2;
  string request_id = 3;
  string process_id = 4;
  string signal = 5;
}
message SignalProcessResponse {
  ExecutionStatus status = 1;
  repeated ExecutionNativeFrame native_frames = 20;
}
message TerminateProcessRequest {
  ExecutionScope scope = 1;
  string execution_session_id = 2;
  string request_id = 3;
  string process_id = 4;
}
message TerminateProcessResponse {
  ExecutionStatus status = 1;
  bool running = 2;
  repeated ExecutionNativeFrame native_frames = 20;
}
message GetFileMetadataRequest {
  ExecutionScope scope = 1;
  string execution_session_id = 2;
  string request_id = 3;
  // Absolute file URI.
  string path = 4;
}
message GetFileMetadataResponse {
  ExecutionStatus status = 1;
  bool is_directory = 2;
  bool is_file = 3;
  bool is_symlink = 4;
  uint64 size = 5;
  repeated ExecutionNativeFrame native_frames = 20;
}
message OpenFileRequest {
  ExecutionScope scope = 1;
  string execution_session_id = 2;
  string request_id = 3;
  string handle_id = 4;
  // Absolute file URI.
  string path = 5;
}
message OpenFileResponse {
  ExecutionStatus status = 1;
  string handle_id = 2;
  repeated ExecutionNativeFrame native_frames = 20;
}
message ReadFileRequest {
  ExecutionScope scope = 1;
  string execution_session_id = 2;
  string request_id = 3;
  string handle_id = 4;
  uint64 offset = 5;
  uint32 length = 6;
}
message ReadFileResponse {
  ExecutionStatus status = 1;
  bytes data = 2;
  bool eof = 3;
  repeated ExecutionNativeFrame native_frames = 20;
}
message CloseFileRequest {
  ExecutionScope scope = 1;
  string execution_session_id = 2;
  string request_id = 3;
  string handle_id = 4;
}
message CloseFileResponse {
  ExecutionStatus status = 1;
  repeated ExecutionNativeFrame native_frames = 20;
}
// Evidence only: native payloads are never accepted as executable requests. The sampler retains
// these in its existing boundary journal, applying its existing binary-data redaction.
// No adapter persistence is introduced.
message ExecutionNativeFrame {
  string direction = 1;
  bytes payload = 2;
}

// Typed execution operations; no caller-owned transport tunnel.
service Executor {
  rpc OpenSession(OpenSessionRequest) returns (stream OpenSessionResponse);
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);
  rpc ReadProcess(ReadProcessRequest) returns (ReadProcessResponse);
  rpc WriteProcess(WriteProcessRequest) returns (WriteProcessResponse);
  rpc SignalProcess(SignalProcessRequest) returns (SignalProcessResponse);
  rpc TerminateProcess(TerminateProcessRequest) returns (TerminateProcessResponse);
  rpc GetFileMetadata(GetFileMetadataRequest) returns (GetFileMetadataResponse);
  rpc OpenFile(OpenFileRequest) returns (OpenFileResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc CloseFile(CloseFileRequest) returns (CloseFileResponse);
}
