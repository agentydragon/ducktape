// The runner's session and Sandbox lifecycle messages, carried by the runner control stream
// (runner_service.proto) and its Event ingress (runner_ingress.proto), and retained by the services
// that read them.

syntax = "proto3";

package agentplane.proto;

import "google/protobuf/timestamp.proto";

enum InitializationStream {
  INITIALIZATION_STREAM_UNSPECIFIED = 0;
  INITIALIZATION_STREAM_STDOUT = 1;
  INITIALIZATION_STREAM_STDERR = 2;
}

message InitializationOutput {
  InitializationStream stream = 1;
  bytes data = 2;
}

message InitializeResult {
  bool executed = 1;
  int32 exit_code = 2;
}

// The attempt stopped without a result, e.g. its runner died, so the script may have run any part
// of itself. It is never run again: a fresh initialization needs a new Sandbox.
message InitializationInterrupted {}

message InitializationEvent {
  // Sandbox-scoped, dense, and persisted across runner restarts.
  uint64 sequence = 1;
  // 1 for the one attempt. Logs from older runners, which retried failed attempts, count higher.
  uint32 attempt = 2;
  oneof observation {
    InitializationOutput output = 3;
    // A result or an interruption ends the attempt; nothing follows either.
    InitializeResult result = 4;
    InitializationInterrupted interrupted = 5;
  }
}

enum Harness {
  HARNESS_UNSPECIFIED = 0;
  HARNESS_CLAUDE = 1;
  HARNESS_CODEX = 2;
}

message SessionSpec {
  Harness harness = 1;
  string cwd = 2;
  string model = 3;
  string reasoning_effort = 4;
  // Standing instructions are fixed for the session's life: a spec supplied to reopen the
  // session must equal the stored one. Empty is a session without any.
  string instructions = 5;
}

enum HarnessState {
  HARNESS_STATE_UNSPECIFIED = 0;
  HARNESS_STATE_RUNNING = 1;
  HARNESS_STATE_STOPPED = 2;
}

enum SetupState {
  SETUP_STATE_UNSPECIFIED = 0;
  SETUP_STATE_NOT_REQUIRED = 1;
  SETUP_STATE_RUNNING = 2;
  SETUP_STATE_SUCCEEDED = 3;
  SETUP_STATE_FAILED = 4;
  SETUP_STATE_INTERRUPTED = 5;
}

// The Session's first lifecycle outcome: whether its harness ever started, or its launch failed first.
enum LaunchOutcome {
  LAUNCH_OUTCOME_UNSPECIFIED = 0;
  LAUNCH_OUTCOME_PENDING = 1;  // no outcome journaled yet
  LAUNCH_OUTCOME_STARTED = 2;
  // Setup failed or was interrupted, the harness failed to launch, or it exited before it started.
  LAUNCH_OUTCOME_FAILED = 3;
}

message Attached {
  string session_id = 1;
  SessionSpec spec = 2;
  // The last source-local cursor in the session log when this snapshot was taken.
  uint64 last_cursor = 3;
  HarnessState harness_state = 4;
  // Empty when no turn is active.
  string active_turn_id = 5;
  SetupState setup_state = 6;
  LaunchOutcome launch_outcome = 7;
  // The UID of the incarnation (the Pod or VM launcher Pod) whose runner took this snapshot. Absent from a
  // runner that predates the field.
  optional string incarnation_uid = 8;
}

// Every session in the runner's state directory. Session ids are client-chosen, so this is how a
// client that keeps no record of its own finds them again.
message ListSessionsRequest {}

message SessionSummary {
  string session_id = 1;
  SessionSpec spec = 2;
  uint64 last_cursor = 3;
  HarnessState harness_state = 4;
  // Empty when no turn is active.
  string active_turn_id = 5;
  SetupState setup_state = 6;
  LaunchOutcome launch_outcome = 7;
}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
}

message QuiesceRequest {
  // The runner's `idle_since` as the caller last observed it. Absent: quiesce unconditionally. Present: a
  // runner that is busy, or whose `idle_since` differs at microsecond precision, refuses with `ABORTED`
  // instead of entering lameduck. Checked only on entry, so a repeat `Quiesce` on a runner already in
  // lameduck succeeds whatever it carries.
  optional google.protobuf.Timestamp if_idle_since = 1;
}

// How far a runner's quiesce has got. A reader treats any value other than `QUIESCE_STAGE_QUIESCED`,
// one it does not know included, as not final.
enum QuiesceStage {
  QUIESCE_STAGE_UNSPECIFIED = 0;
  // Refusing new work and ending running turns.
  QUIESCE_STAGE_DRAINING = 1;
  // Every Session's journal is final; the ingress has not acknowledged all of them.
  QUIESCE_STAGE_FLUSHING = 2;
  // Every final cursor is acknowledged.
  QUIESCE_STAGE_QUIESCED = 3;
}

// Reports progress for a Sandbox teardown initiated by `Quiesce`. The runner durably refuses new
// and resumed sessions, stops every harness and setup script, then seals every session journal.
// `QUIESCE_STAGE_QUIESCED` means the ingress acknowledged every final cursor.
message QuiesceResponse {
  QuiesceStage stage = 2;
  reserved 1;
  reserved "sessions";
}

// The session's journal is final: every entry through `cursor` precedes this message.
message Sealed {
  uint64 cursor = 1;
  // The incarnation that sealed the journal. Absent from a seal written before the field: it counts as an
  // earlier incarnation's, so a later one may continue the journal.
  optional string incarnation_uid = 2;
}

// Live introspection only. Process identifiers never become command destinations.
message GetStatusRequest {}

message RunnerStatus {
  repeated HarnessProcessStatus processes = 1;
  repeated SessionStatus sessions = 2;
  string runner_boot_id = 3;
  RunnerLifecycleStatus lifecycle = 4;
}

enum RunnerLifecycleMode {
  RUNNER_LIFECYCLE_MODE_UNSPECIFIED = 0;
  RUNNER_LIFECYCLE_MODE_RUNNING = 1;
  RUNNER_LIFECYCLE_MODE_QUIESCING = 2;
  RUNNER_LIFECYCLE_MODE_CLOSING = 3;
}

enum RunnerLifecycleStage {
  RUNNER_LIFECYCLE_STAGE_UNSPECIFIED = 0;
  RUNNER_LIFECYCLE_STAGE_RUNNING = 1;
  RUNNER_LIFECYCLE_STAGE_DRAINING = 2;
  RUNNER_LIFECYCLE_STAGE_HALTING = 3;
  RUNNER_LIFECYCLE_STAGE_STOPPING = 4;
  RUNNER_LIFECYCLE_STAGE_FENCING = 5;
  RUNNER_LIFECYCLE_STAGE_SEALING = 6;
  RUNNER_LIFECYCLE_STAGE_FLUSHING = 7;
  RUNNER_LIFECYCLE_STAGE_QUIESCED = 8;
  RUNNER_LIFECYCLE_STAGE_CLOSED = 9;
}

enum RunnerLifecycleBlockerKind {
  RUNNER_LIFECYCLE_BLOCKER_KIND_UNSPECIFIED = 0;
  RUNNER_LIFECYCLE_BLOCKER_KIND_ADMISSIONS = 1;
  RUNNER_LIFECYCLE_BLOCKER_KIND_SESSION_HALT = 2;
  RUNNER_LIFECYCLE_BLOCKER_KIND_SESSION_PROCESS = 3;
  RUNNER_LIFECYCLE_BLOCKER_KIND_CODEX_APP_SERVER = 4;
  RUNNER_LIFECYCLE_BLOCKER_KIND_CODEX_EXEC_SERVER = 5;
  RUNNER_LIFECYCLE_BLOCKER_KIND_BOOTSTRAP = 6;
  RUNNER_LIFECYCLE_BLOCKER_KIND_PROCESS_CLEANUP = 7;
  RUNNER_LIFECYCLE_BLOCKER_KIND_SESSION_INSPECTION = 8;
  RUNNER_LIFECYCLE_BLOCKER_KIND_JOURNAL_SEAL = 9;
  RUNNER_LIFECYCLE_BLOCKER_KIND_INGRESS_ACKNOWLEDGEMENT = 10;
}

// The aggregate Runner controller's first unmet lifecycle predicate, with the live COSI resource
// identity and scalar facts it inspected. This is diagnostic output, not a separate state machine.
message RunnerLifecycleBlocker {
  RunnerLifecycleBlockerKind kind = 1;
  string resource_type = 2;
  string resource_id = 3;
  string process_id = 4;
  bool resource_present = 5;
  uint64 admissions = 6;
  bool journal_seal_present = 7;
  string journal_seal_uid = 8;
  string expected_journal_seal_uid = 9;
  uint64 journal_seal_cursor = 10;
  bool acknowledgement_present = 11;
  bool acknowledgement_sealed = 12;
  uint64 acknowledgement_cursor = 13;
  bool finalizers_pending = 14;
  // Error from the resource named by this blocker, when that resource reports one.
  string error = 15;
}

message RunnerLifecycleStatus {
  RunnerLifecycleMode desired_mode = 1;
  uint64 desired_generation = 2;
  uint64 progress_generation = 3;
  bool progress_available = 4;
  bool progress_current = 5;
  RunnerLifecycleStage stage = 6;
  string error = 7;
  RunnerLifecycleBlocker blocker = 8;
}

enum ProcessState {
  PROCESS_STATE_UNSPECIFIED = 0;
  PROCESS_STATE_STARTING = 1;
  PROCESS_STATE_RUNNING = 2;
  PROCESS_STATE_STOPPING = 3;
}

message HarnessProcessStatus {
  // Unique per spawn; a PID can be reused.
  string process_id = 1;
  optional int64 pid = 2;
  Harness harness = 3;
  ProcessState state = 4;
  repeated string assigned_session_ids = 5;
}

enum SessionExecutionState {
  SESSION_EXECUTION_STATE_UNSPECIFIED = 0;
  SESSION_EXECUTION_STATE_DORMANT = 1;
  SESSION_EXECUTION_STATE_PREPARING = 2;
  SESSION_EXECUTION_STATE_READY = 3;
  SESSION_EXECUTION_STATE_FAILED = 4;
}

message SessionStatus {
  string session_id = 1;
  optional string process_id = 2;
  optional string native_session_id = 3;
  SessionExecutionState execution_state = 4;
  optional string active_turn_id = 5;
  optional uint64 failure_cursor = 6;
  bool busy = 7;
}
