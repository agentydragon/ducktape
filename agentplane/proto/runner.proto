// Runner transport over the common durable Command/Event log language.
//
// A runner session owns one native conversation and a state-volume Event source. Attach selects
// that source, returns a runner-specific snapshot, then follows it. Command, EventEntry, and Follow
// are source-neutral messages from agentplane/proto: the integration app uses the same messages
// for its retained Thread archive.

syntax = "proto3";

package agentplane.proto.runner;

import "agentplane/proto/command.proto";
import "agentplane/proto/event_log.proto";

service Runner {
  rpc Attach(stream ClientMessage) returns (stream ServerMessage);
  // Execute control-plane configured initialization for this Sandbox, at most once. The runner
  // records the selected script at one fixed state path. An exact retry replays the one attempt,
  // failed or interrupted included, without running the script again; any other script is refused.
  rpc Initialize(InitializeRequest) returns (stream InitializationEvent);
  // Every session in the runner's state directory. Session ids are client-chosen, so this is how a
  // client that keeps no record of its own finds them again.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Sandbox teardown. The runner durably refuses new and resumed sessions, stops every harness and
  // setup script, then seals every session's journal at its final cursor. Sealing again returns the
  // same cursors, with each session's current `flushed`. Sealed sessions can still be followed to
  // their end.
  rpc Seal(SealRequest) returns (SealResponse);
}

message InitializeRequest {
  string script = 1;
  // Events with a greater sequence are replayed before live output. Zero replays the whole log.
  uint64 after_sequence = 2;
}

enum InitializationStream {
  INITIALIZATION_STREAM_UNSPECIFIED = 0;
  INITIALIZATION_STREAM_STDOUT = 1;
  INITIALIZATION_STREAM_STDERR = 2;
}

message InitializationOutput {
  InitializationStream stream = 1;
  bytes data = 2;
}

message InitializeResult {
  bool executed = 1;
  int32 exit_code = 2;
}

// The attempt stopped without a result, e.g. its runner died, so the script may have run any part
// of itself. It is never run again: a fresh initialization needs a new Sandbox.
message InitializationInterrupted {}

message InitializationEvent {
  // Sandbox-scoped, dense, and persisted across runner restarts for cursor-based replay.
  uint64 sequence = 1;
  // 1 for the one attempt. Logs from older runners, which retried failed attempts, count higher.
  uint32 attempt = 2;
  oneof observation {
    InitializationOutput output = 3;
    // A result or an interruption ends the attempt; nothing follows either.
    InitializeResult result = 4;
    InitializationInterrupted interrupted = 5;
  }
}

enum Harness {
  HARNESS_UNSPECIFIED = 0;
  HARNESS_CLAUDE = 1;
  HARNESS_CODEX = 2;
}

message SessionSpec {
  Harness harness = 1;
  string cwd = 2;
  string model = 3;
  string reasoning_effort = 4;
  // Standing instructions are fixed for the session's life: a spec supplied on re-attach must
  // equal the stored one. Empty is a session without any.
  string instructions = 5;
}

message Open {
  // Client-chosen. An unknown id creates the session from spec; a known id attaches to the existing
  // session, and spec, when present, must equal the stored one.
  string session_id = 1;
  SessionSpec spec = 2;
  .agentplane.proto.event_log.Follow follow = 3;
  // Only selected at creation. Reattaching never executes setup again.
  optional string setup_script = 4;
}

// Ends the stream; the harness keeps running.
message Detach {}

message ClientMessage {
  oneof message {
    Open open = 1;
    .agentplane.proto.command.Command command = 2;
    Detach detach = 3;
  }
}

enum HarnessState {
  HARNESS_STATE_UNSPECIFIED = 0;
  HARNESS_STATE_RUNNING = 1;
  HARNESS_STATE_STOPPED = 2;
}

enum SetupState {
  SETUP_STATE_UNSPECIFIED = 0;
  SETUP_STATE_NOT_REQUIRED = 1;
  SETUP_STATE_RUNNING = 2;
  SETUP_STATE_SUCCEEDED = 3;
  SETUP_STATE_FAILED = 4;
  SETUP_STATE_INTERRUPTED = 5;
}

// The Session's first lifecycle outcome: whether its harness ever started, or its launch failed first.
enum LaunchOutcome {
  LAUNCH_OUTCOME_UNSPECIFIED = 0;
  LAUNCH_OUTCOME_PENDING = 1;  // no outcome journaled yet
  LAUNCH_OUTCOME_STARTED = 2;
  // Setup failed or was interrupted, the harness failed to launch, or it exited before it started.
  LAUNCH_OUTCOME_FAILED = 3;
}

message Attached {
  string session_id = 1;
  SessionSpec spec = 2;
  // The last source-local cursor in the session log at attach time; greater cursors are live.
  uint64 last_cursor = 3;
  HarnessState harness_state = 4;
  // Empty when no turn is active.
  string active_turn_id = 5;
  SetupState setup_state = 6;
  LaunchOutcome launch_outcome = 7;
}

message ListSessionsRequest {}

message SessionSummary {
  string session_id = 1;
  SessionSpec spec = 2;
  uint64 last_cursor = 3;
  HarnessState harness_state = 4;
  // Empty when no turn is active.
  string active_turn_id = 5;
  SetupState setup_state = 6;
  LaunchOutcome launch_outcome = 7;
}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
}

message SealRequest {}

message SessionSeal {
  string session_id = 1;
  // The session's final cursor in this Sandbox incarnation.
  uint64 cursor = 2;
  // The runner's ingress has acknowledged the seal at `cursor`.
  bool flushed = 3;
}

message SealResponse {
  repeated SessionSeal sessions = 1;
  reserved 2;
  reserved "pushes";
}

// The session's journal is final: every entry through `cursor` precedes this message.
message Sealed {
  uint64 cursor = 1;
}

message ServerMessage {
  oneof message {
    Attached attached = 1;
    .agentplane.proto.event_log.EventEntry event_entry = 2;
    // The stream ends after an error, such as a malformed command or a spec mismatch.
    string error = 3;
    // Ends the stream of a sealed session once it has replayed through the seal's cursor.
    Sealed sealed = 4;
  }
}
