// The runner's session and Sandbox lifecycle messages, carried by the runner control stream
// (runner_control.proto) and its Event ingress (runner_ingress.proto), and retained by the services
// that read them.

syntax = "proto3";

package agentplane.proto.runner;

import "google/protobuf/timestamp.proto";

enum InitializationStream {
  INITIALIZATION_STREAM_UNSPECIFIED = 0;
  INITIALIZATION_STREAM_STDOUT = 1;
  INITIALIZATION_STREAM_STDERR = 2;
}

message InitializationOutput {
  InitializationStream stream = 1;
  bytes data = 2;
}

message InitializeResult {
  bool executed = 1;
  int32 exit_code = 2;
}

// The attempt stopped without a result, e.g. its runner died, so the script may have run any part
// of itself. It is never run again: a fresh initialization needs a new Sandbox.
message InitializationInterrupted {}

message InitializationEvent {
  // Sandbox-scoped, dense, and persisted across runner restarts.
  uint64 sequence = 1;
  // 1 for the one attempt. Logs from older runners, which retried failed attempts, count higher.
  uint32 attempt = 2;
  oneof observation {
    InitializationOutput output = 3;
    // A result or an interruption ends the attempt; nothing follows either.
    InitializeResult result = 4;
    InitializationInterrupted interrupted = 5;
  }
}

enum Harness {
  HARNESS_UNSPECIFIED = 0;
  HARNESS_CLAUDE = 1;
  HARNESS_CODEX = 2;
}

message SessionSpec {
  Harness harness = 1;
  string cwd = 2;
  string model = 3;
  string reasoning_effort = 4;
  // Standing instructions are fixed for the session's life: a spec supplied to reopen the
  // session must equal the stored one. Empty is a session without any.
  string instructions = 5;
}

enum HarnessState {
  HARNESS_STATE_UNSPECIFIED = 0;
  HARNESS_STATE_RUNNING = 1;
  HARNESS_STATE_STOPPED = 2;
}

enum SetupState {
  SETUP_STATE_UNSPECIFIED = 0;
  SETUP_STATE_NOT_REQUIRED = 1;
  SETUP_STATE_RUNNING = 2;
  SETUP_STATE_SUCCEEDED = 3;
  SETUP_STATE_FAILED = 4;
  SETUP_STATE_INTERRUPTED = 5;
}

// The Session's first lifecycle outcome: whether its harness ever started, or its launch failed first.
enum LaunchOutcome {
  LAUNCH_OUTCOME_UNSPECIFIED = 0;
  LAUNCH_OUTCOME_PENDING = 1;  // no outcome journaled yet
  LAUNCH_OUTCOME_STARTED = 2;
  // Setup failed or was interrupted, the harness failed to launch, or it exited before it started.
  LAUNCH_OUTCOME_FAILED = 3;
}

message Attached {
  string session_id = 1;
  SessionSpec spec = 2;
  // The last source-local cursor in the session log when this snapshot was taken.
  uint64 last_cursor = 3;
  HarnessState harness_state = 4;
  // Empty when no turn is active.
  string active_turn_id = 5;
  SetupState setup_state = 6;
  LaunchOutcome launch_outcome = 7;
  // The UID of the incarnation (the Pod or VM launcher Pod) whose runner took this snapshot. Absent from a
  // runner that predates the field.
  optional string incarnation_uid = 8;
}

// Every session in the runner's state directory. Session ids are client-chosen, so this is how a
// client that keeps no record of its own finds them again.
message ListSessionsRequest {}

message SessionSummary {
  string session_id = 1;
  SessionSpec spec = 2;
  uint64 last_cursor = 3;
  HarnessState harness_state = 4;
  // Empty when no turn is active.
  string active_turn_id = 5;
  SetupState setup_state = 6;
  LaunchOutcome launch_outcome = 7;
}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
}

// Sandbox teardown. The runner durably refuses new and resumed sessions, stops every harness and
// setup script, then seals every session's journal at its final cursor. Sealing again returns the
// same cursors, with each session's current `flushed`. Sealed sessions can still be read to their end.
message SessionSeal {
  string session_id = 1;
  // The session's final cursor in this Sandbox incarnation.
  uint64 cursor = 2;
  // The runner's ingress has acknowledged the seal at `cursor`.
  bool flushed = 3;
}

message QuiesceRequest {
  // The runner's `idle_since` as the caller last observed it. Absent: quiesce unconditionally. Present: a
  // runner that is busy, or whose `idle_since` differs at microsecond precision, refuses with `ABORTED`
  // instead of entering lameduck. Checked only on entry, so a repeat `Quiesce` on a runner already in
  // lameduck succeeds whatever it carries.
  optional google.protobuf.Timestamp if_idle_since = 1;
}

// How far a runner's quiesce has got. A reader treats any value other than `QUIESCE_STAGE_QUIESCED`,
// one it does not know included, as not final.
enum QuiesceStage {
  QUIESCE_STAGE_UNSPECIFIED = 0;
  // Refusing new work and ending running turns.
  QUIESCE_STAGE_DRAINING = 1;
  // Every Session's journal is final; the ingress has not acknowledged all of them.
  QUIESCE_STAGE_FLUSHING = 2;
  // Every final cursor is acknowledged.
  QUIESCE_STAGE_QUIESCED = 3;
}

message QuiesceResponse {
  // Absent from a runner whose `Quiesce` blocks until every seal is flushed; `sessions` then says it.
  // Present, the quiesce is final only at `QUIESCE_STAGE_QUIESCED`, and `sessions` is empty before it.
  optional QuiesceStage stage = 2;
  repeated SessionSeal sessions = 1;
}

// The session's journal is final: every entry through `cursor` precedes this message.
message Sealed {
  uint64 cursor = 1;
  // The incarnation that sealed the journal. Absent from a seal written before the field: it counts as an
  // earlier incarnation's, so a later one may continue the journal.
  optional string incarnation_uid = 2;
}
