// The runner control stream, which the runner dials to the Runner Gateway, and the `Runner` service
// the runner serves over it; contract in agentplane/docs/runner_control.md. An incompatible change
// rides a clean cutover: the operator retires every Sandbox on the old protocol.
syntax = "proto3";

package agentplane.proto.runner_control;

import "agentplane/proto/command.proto";
import "agentplane/proto/event_log.proto";
import "agentplane/proto/grpc_tunnel.proto";
import "agentplane/proto/runner.proto";

// Served by the Runner Gateway; the runner opens one `Connect` stream and serves `Runner` on it.
service RunnerControl {
  rpc Connect(stream RunnerFrame) returns (stream ServiceFrame);
}

// Served by the runner, and called by the Runner Gateway through the runner's `Connect` stream. Only
// `OpenSession` and `ResumeSession` start a harness. A `Seal` waits for every command admission
// already under way, and every call the runner receives after it waits for the `Seal`.
service Runner {
  rpc ListSessions(agentplane.proto.runner.ListSessionsRequest)
      returns (agentplane.proto.runner.ListSessionsResponse);
  // Bootstrap, at most once per Sandbox: answers with the attempt's terminal event, `result` or
  // `interrupted`, once the attempt has ended; its output is not carried. The runner records the
  // selected script at one fixed state path. An exact retry replays the one attempt's outcome, failed
  // or interrupted included, without running the script again; any other script is refused with
  // `ALREADY_EXISTS`.
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  // Create a Session with `spec` and start it. An existing Session is confirmed only, never
  // restarted: its `spec`, and `setup_script` when present, must equal the stored ones, or the call
  // fails with `ALREADY_EXISTS`.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  // Restart a stopped harness on the Session's retained spec. A running harness is left as it is.
  rpc ResumeSession(ResumeSessionRequest) returns (ResumeSessionResponse);
  // Sandbox teardown: durably refuse new and resumed Sessions, stop every harness and setup script,
  // and seal every journal at its final cursor. Idempotent: a repeat returns the same cursors with
  // each Session's current `flushed`, so teardown repeats it until every Session is flushed.
  rpc Seal(agentplane.proto.runner.SealRequest) returns (agentplane.proto.runner.SealResponse);
  // Admit a command, or return its admission if it is already journaled with the same payload, even
  // after its harness stopped or its journal was sealed; redelivery is therefore safe. The same
  // `command_id` with another payload fails with `ALREADY_EXISTS`.
  rpc DeliverCommand(DeliverCommandRequest) returns (DeliverCommandResponse);
}

message RunnerFrame {
  oneof frame {
    Hello hello = 1;  // first frame, exactly once
    Heartbeat heartbeat = 3;
    agentplane.proto.grpc_tunnel.Reply reply = 5;  // to a `call` on this stream
  }
  reserved 2, 4;
  reserved "receipt", "control_result";
}

message ServiceFrame {
  oneof frame {
    Welcome welcome = 1;  // reply to Hello, exactly once
    Heartbeat heartbeat = 3;
    agentplane.proto.grpc_tunnel.Call call = 7;  // a `Runner` call
  }
  reserved 2, 4, 5, 6;
  reserved "deliver", "open_follow", "close_follow", "control";
}

message Hello {
  string runner_boot_id = 1;  // random per runner process start
  reserved 2, 3;
  reserved "capabilities", "runner_version";
}

message Welcome {
  uint64 connection_epoch = 1;
  reserved 2;
  reserved "capabilities";
}

message Heartbeat {}

message InitializeRequest {
  string script = 1;
}

message InitializeResponse {
  agentplane.proto.runner.InitializationEvent outcome = 1;
}

message OpenSessionRequest {
  string session_id = 1;
  agentplane.proto.runner.SessionSpec spec = 2;
  optional string setup_script = 3;  // selected only at creation
}

message OpenSessionResponse {
  agentplane.proto.runner.Attached attached = 1;
}

message ResumeSessionRequest {
  string session_id = 1;
}

message ResumeSessionResponse {
  agentplane.proto.runner.Attached attached = 1;
}

message DeliverCommandRequest {
  string session_id = 1;
  agentplane.proto.command.Command command = 2;
}

message DeliverCommandResponse {
  // The runner journal's CommandAdmitted entry for the command.
  agentplane.proto.event_log.EventEntry admission = 1;
}
