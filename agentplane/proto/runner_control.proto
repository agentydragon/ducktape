// The runner control stream, which the runner dials to the Runner Gateway, and the `Runner` service
// the runner serves over it; contract in agentplane/docs/runner_control.md. An incompatible change
// rides a clean cutover: the operator retires every Sandbox on the old protocol.
syntax = "proto3";

package agentplane.proto.runner_control;

import "agentplane/proto/command.proto";
import "agentplane/proto/event_log.proto";
import "agentplane/proto/grpc_tunnel.proto";
import "agentplane/proto/runner.proto";
import "google/protobuf/timestamp.proto";

// Served by the Runner Gateway; the runner opens one `Connect` stream and serves `Runner` on it.
service RunnerControl {
  rpc Connect(stream RunnerFrame) returns (stream ServiceFrame);
}

// Served by the runner, and called by the Runner Gateway through the runner's `Connect` stream. Only
// `OpenSession` and `ResumeSession` start a harness. A `Quiesce` waits for every command admission
// already under way, and every call the runner receives after it waits for it.
service Runner {
  rpc ListSessions(agentplane.proto.runner.ListSessionsRequest)
      returns (agentplane.proto.runner.ListSessionsResponse);
  // Create a Session with `spec` and start it, after the Sandbox's bootstrap has run to success: the
  // runner runs it once, before the Sandbox's first Session, and a failed or interrupted attempt
  // refuses every later create with `FAILED_PRECONDITION`. The stored `spec` is `spec` with the
  // platform instructions and the Sandbox's and Session's identity ahead of its `instructions`. An
  // existing Session is confirmed against the same composition and, once its setup allows, a
  // stopped harness is started: `spec`, and `setup_script` when present, must equal the stored ones,
  // or the call fails with `ALREADY_EXISTS`.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  // Restart a stopped harness on the Session's retained spec. A running harness is left as it is.
  rpc ResumeSession(ResumeSessionRequest) returns (ResumeSessionResponse);
  // Sandbox teardown: durably refuse new and resumed Sessions, stop every harness and setup script,
  // and seal every journal at its final cursor. Idempotent: a repeat returns the same cursors with
  // each Session's current `flushed`, so teardown repeats it until every Session is flushed.
  rpc Quiesce(agentplane.proto.runner.QuiesceRequest) returns (agentplane.proto.runner.QuiesceResponse);
  // Admit a command, or return its admission if it is already journaled with the same payload, even
  // after its harness stopped or its journal was sealed; redelivery is therefore safe. The same
  // `command_id` with another payload fails with `ALREADY_EXISTS`.
  rpc DeliverCommand(DeliverCommandRequest) returns (DeliverCommandResponse);
  // One RPC per command, each admitting exactly as `DeliverCommand` does: the same `command_id`
  // with the same payload returns the existing admission, and under another operation or payload
  // it fails with `ALREADY_EXISTS`, so a `command_id` is unique across all of them.
  rpc SubmitInput(SubmitInputRequest) returns (SubmitInputResponse);
  rpc ChangeModel(ChangeModelRequest) returns (ChangeModelResponse);
  rpc ChangeReasoningEffort(ChangeReasoningEffortRequest) returns (ChangeReasoningEffortResponse);
  rpc InterruptTurn(InterruptTurnRequest) returns (InterruptTurnResponse);
  rpc StopRunnerSession(StopRunnerSessionRequest) returns (StopRunnerSessionResponse);
}

message RunnerFrame {
  oneof frame {
    Hello hello = 1;  // first frame, exactly once
    Heartbeat heartbeat = 3;
    agentplane.proto.grpc_tunnel.Reply reply = 5;  // to a `call` on this stream
  }
  reserved 2, 4;
  reserved "receipt", "control_result";
}

message ServiceFrame {
  oneof frame {
    Welcome welcome = 1;  // reply to Hello, exactly once
    Heartbeat heartbeat = 3;
    agentplane.proto.grpc_tunnel.Call call = 7;  // a `Runner` call
  }
  reserved 2, 4, 5, 6;
  reserved "deliver", "open_follow", "close_follow", "control";
}

message Hello {
  string runner_boot_id = 1;  // random per runner process start
  reserved 2, 3;
  reserved "capabilities", "runner_version";
}

message Welcome {
  uint64 connection_epoch = 1;
  // The UID of the Sandbox incarnation (its Pod, or a VM's virt-launcher Pod) the gateway authenticated
  // this connection as. A seal the runner recorded under another UID is an earlier incarnation's.
  string incarnation_uid = 3;
  reserved 2;
  reserved "capabilities";
}

message Heartbeat {
  // Only the runner sets it: sent at once when a fact changes and with its first heartbeat after every
  // `Welcome`. Each carrying it replaces the gateway's record of all the facts.
  optional RunnerFacts facts = 1;
}

// What the runner publishes about itself, for the Runner Gateway to record on the Sandbox's connection
// Lease.
message RunnerFacts {
  enum QuiesceStage {
    QUIESCE_STAGE_UNSPECIFIED = 0;  // not quiescing
    QUIESCE_STAGE_DRAINING = 1;     // refusing new work, stopping harnesses
    QUIESCE_STAGE_FLUSHING = 2;     // journals final, ingress acknowledgements pending
    QUIESCE_STAGE_QUIESCED = 3;     // every final cursor acknowledged
  }
  enum Bootstrap {
    BOOTSTRAP_UNSPECIFIED = 0;  // the Sandbox has none, or it has not started
    BOOTSTRAP_RUNNING = 1;
    BOOTSTRAP_SUCCEEDED = 2;
    BOOTSTRAP_FAILED = 3;
    BOOTSTRAP_INTERRUPTED = 4;
  }

  QuiesceStage quiesce_stage = 1;
  // When the whole Sandbox became idle: any Session running a turn or command, or a background process
  // or attached terminal running, makes it busy. Absent while busy, and from a runner that does not
  // track it.
  google.protobuf.Timestamp idle_since = 2;
  Bootstrap bootstrap = 3;
  // Some Session's setup script is running. A suspend waits for it to finish.
  bool setups_running = 4;
}

message OpenSessionRequest {
  string session_id = 1;
  agentplane.proto.runner.SessionSpec spec = 2;
  optional string setup_script = 3;  // selected only at creation
}

message OpenSessionResponse {
  agentplane.proto.runner.Attached attached = 1;
}

message ResumeSessionRequest {
  string session_id = 1;
}

message ResumeSessionResponse {
  agentplane.proto.runner.Attached attached = 1;
}

message DeliverCommandRequest {
  string session_id = 1;
  agentplane.proto.command.Command command = 2;
}

message DeliverCommandResponse {
  // The runner journal's CommandAdmitted entry for the command.
  agentplane.proto.event_log.EventEntry admission = 1;
}

// The command RPCs' responses each carry the runner journal's CommandAdmitted entry for the command.
message SubmitInputRequest {
  string session_id = 1;
  string command_id = 2;
  string text = 3;
}

message SubmitInputResponse {
  agentplane.proto.event_log.EventEntry admission = 1;
}

message ChangeModelRequest {
  string session_id = 1;
  string command_id = 2;
  string model = 3;
}

message ChangeModelResponse {
  agentplane.proto.event_log.EventEntry admission = 1;
}

message ChangeReasoningEffortRequest {
  string session_id = 1;
  string command_id = 2;
  string effort = 3;
}

message ChangeReasoningEffortResponse {
  agentplane.proto.event_log.EventEntry admission = 1;
}

message InterruptTurnRequest {
  string session_id = 1;
  string command_id = 2;
  string turn_id = 3;
}

message InterruptTurnResponse {
  agentplane.proto.event_log.EventEntry admission = 1;
}

message StopRunnerSessionRequest {
  string session_id = 1;
  string command_id = 2;
}

message StopRunnerSessionResponse {
  agentplane.proto.event_log.EventEntry admission = 1;
}
