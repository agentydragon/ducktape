syntax = "proto3";

package agentplane.proto.event_log;

import "agentplane/proto/event.proto";

message EventOrigin {
  // Globally unique, durable identity of the source which originally appended this Event.
  string source_id = 1;
  // Dense source-local sequence assigned by that original source.
  uint64 sequence = 2;
}

message EventEntry {
  // Position in the source serving this follow. An importer assigns a new cursor without changing
  // origin or Event.
  uint64 cursor = 1;
  EventOrigin origin = 2;
  agentplane.proto.event.Event event = 3;
}
