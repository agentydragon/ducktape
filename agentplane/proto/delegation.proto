// Identity and provenance carried by a delegated workload RPC.
syntax = "proto3";

package agentplane.proto;

import "agentplane/proto/identity.proto";

// Payload of agentplane-delegation-bin gRPC metadata: the authenticated service
// asserts this RPC serves the caller's Action request/execution. The receiver
// must trust that service to delegate and authorize caller normally; the IDs
// provide audit correlation, not approval proof.
message Delegation {
  ServiceAccountIdentity caller = 1;
  string action_request_id = 2;
  string action_execution_id = 3;
}
