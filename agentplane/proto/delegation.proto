// Identity and provenance carried by a delegated workload RPC.
syntax = "proto3";

package agentplane.proto;

import "agentplane/proto/identity.proto";

// Payload of agentplane-delegation-bin gRPC metadata: the authenticated service
// asserts this RPC serves the named caller. The receiver must trust that
// service to delegate and authorize the caller normally; the provenance
// provides audit correlation, not approval proof.
message Delegation {
  // The Identity the RPC acts for. A receiver that predates this field reads
  // the envelope as having no effective Identity and refuses it.
  oneof effective_caller {
    // An Identity in the receiver's policy namespace, by name and the UID of
    // the incarnation the actor recorded.
    Identity identity = 4;
  }
  reserved 1, 2, 3;
  reserved "caller", "action_request_id", "action_execution_id";
  // Exactly one profile names the durable record the actor serves. A receiver
  // that predates a profile reads the envelope as having none and refuses it.
  oneof provenance {
    ActionProvenance action = 5;
    SessionProvenance session = 6;
    ConnectionProvenance connection = 7;
  }
}

// The Action Service's admitted request and execution records.
message ActionProvenance {
  string request_id = 1;
  // The existing execution record's ID, never its lease token.
  string execution_id = 2;
}

// The central Session a sampler acts for: its canonical public UUID.
message SessionProvenance {
  string session_id = 1;
}

// An external MCP Connection's existing, consented OAuth grant. The Connection and grant are
// resolved again by the MCP edge for each request; these identifiers provide typed attribution
// to the receiving Action method and do not confer authority by themselves.
message ConnectionProvenance {
  string connection_id = 1;
  string grant_id = 2;
}
