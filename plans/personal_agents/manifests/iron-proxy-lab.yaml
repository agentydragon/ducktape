# The configuration that actually ran: iron-proxy holding the GitHub PAT, a real
# OpenClaw holding only a placeholder, and a NetworkPolicy making the proxy the
# single route out. Measurements: <../findings/egress_and_tls.md> F15-F17.
#
# Deliberately not under `cluster/k8s/` -- a proposal, not something Flux applies.
#
# Three decisions here were arrived at by measurement:
#
#   1. `replace` mode, not `inject`. Both work; `replace` leaves the agent aware
#      that a credential exists while unable to read it, which is a truer model
#      to hand a reasoning system than silent injection. It is also the mode the
#      end-to-end run used. Rationale: <../credential_proxy_options.md>.
#   2. The CA goes in the **system trust store**, not into per-tool environment
#      variables. `GIT_SSL_CAINFO` is stripped from the agent's exec environment
#      by the harness (F17), and git links GnuTLS so neither `SSL_CERT_FILE` nor
#      `CURL_CA_BUNDLE` reaches it. One merged bundle covers git, curl and
#      Python; only Node needs its own variable.
#   3. Host-level allowlist only. GitHub already denies `agentydragon-agent`
#      write access outside its own forks, so per-path rules are defence in
#      depth rather than the mechanism -- and scoping rules by method/path
#      requires a paired `methods: ["CONNECT"]` rule per host or the preflight
#      is rejected and the host becomes unreachable. The optional block below
#      shows the shape if you want it.
#
# The agent must be TOLD the contract, because `replace` mode only acts on
# requests that carry the placeholder: "to reach github.com and api.github.com,
# authenticate with $GH_PAT; it is a proxy placeholder and the real credential is
# attached on the way out." That belongs in the agent's own instructions, not
# only here. An unauthenticated request is not a failure -- it is an agent that
# did not ask to be authenticated.
#
# There is no meaningful missing-secret failure to guard against: the token
# arrives via secretKeyRef, so an absent Secret or key stops the pod at
# CreateContainerConfigError before it serves anything. Only a present-but-empty
# value would reach GitHub as a 401.
#
# Before promoting: pin the image by digest and mirror it to Harbor rather than
# tracking `:latest` from Docker Hub, per the repo's image conventions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: iron-proxy-config
  namespace: agent-lab
data:
  iron.yaml: |
    # The agent reaches the proxy via HTTP_PROXY at a Service; nothing hijacks DNS.
    dns:
      enabled: false

    proxy:
      tunnel_listen: ":8080"

    tls:
      mode: "mitm"
      # cert-manager owns this keypair, so it cannot drift the way a
      # self-generated mitmproxy CA did (F8). The CA must carry
      # keyUsage=keyCertSign or iron-proxy refuses to start, with that message.
      ca_cert: "/ca/tls.crt"
      ca_key: "/ca/tls.key"

    transforms:
      - name: allowlist
        config:
          domains:
            - "github.com"
            - "api.github.com"
            - "codeload.github.com"
            - "objects.githubusercontent.com"
            - "raw.githubusercontent.com"
          # Optional defence in depth -- confining writes to the agent's own
          # fork. Note the first rule: without a CONNECT entry the scoped rules
          # below never apply, because the preflight matches none of them and
          # the host is rejected outright.
          #
          # rules:
          #   - host: "api.github.com"
          #     methods: ["CONNECT"]
          #   - host: "api.github.com"
          #     methods: ["GET"]
          #   - host: "api.github.com"
          #     methods: ["POST", "PATCH", "PUT", "DELETE"]
          #     paths: ["/repos/agentydragon-agent/*"]

      - name: secrets
        config:
          secrets:
            - source:
                type: env
                var: GITHUB_TOKEN
              replace:
                # What the agent holds. Substituted in `Bearer <placeholder>`
                # and inside base64 `Basic <user>:<placeholder>` alike -- the
                # latter being the git-over-HTTPS shape, verified with a real
                # 3.9 MB push (F16).
                proxy_value: "proxy-github-placeholder"
                match_headers: ["Authorization"]
                # require: true is NOT set. In explicit-proxy mode it is
                # evaluated against the header-less CONNECT and rejects every
                # HTTPS request with 403 (F15).
              rules:
                - host: "api.github.com"
                - host: "github.com"
                - host: "codeload.github.com"

    log:
      level: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iron-proxy
  namespace: agent-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: iron-proxy }
  template:
    metadata:
      labels: { app: iron-proxy }
    spec:
      containers:
        - name: iron-proxy
          image: ironsh/iron-proxy:latest
          args: ["-config", "/etc/iron-proxy/iron.yaml"]
          env:
            # The real credential lives here and nowhere else.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef: { name: lab-github-token, key: GITHUB_TOKEN }
          ports:
            - { name: proxy, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/iron-proxy, readOnly: true }
            - { name: ca, mountPath: /ca, readOnly: true }
      volumes:
        - name: config
          configMap: { name: iron-proxy-config }
        - name: ca
          secret: { secretName: iron-proxy-ca }
---
apiVersion: v1
kind: Service
metadata:
  name: iron-proxy
  namespace: agent-lab
spec:
  selector: { app: iron-proxy }
  ports:
    - { name: proxy, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oc-iron
  namespace: agent-lab
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: oc-iron }
  template:
    metadata:
      labels: { app: oc-iron }
    spec:
      securityContext: { fsGroup: 1000 }
      initContainers:
        - name: seed
          image: ghcr.io/agentydragon/openclaw:devel-20260728182008-17ba82d
          command:
            - sh
            - -c
            - |
              set -e
              cp /cfg/openclaw.json /state/openclaw.json
              # Decision 2: the CA joins the distro bundle, so every OpenSSL and
              # GnuTLS client trusts it with no environment variable involved.
              cat /etc/ssl/certs/ca-certificates.crt /ca/ca.crt > /merged/ca-certificates.crt
          volumeMounts:
            - { name: cfg, mountPath: /cfg }
            - { name: data, mountPath: /state }
            - { name: ca, mountPath: /ca, readOnly: true }
            - { name: merged, mountPath: /merged }
      containers:
        - name: openclaw
          image: ghcr.io/agentydragon/openclaw:devel-20260728182008-17ba82d
          env:
            - { name: HOME, value: /home/openclaw }
            - { name: NPM_CONFIG_PREFIX, value: /home/openclaw/.openclaw/npm-prefix }
            - { name: NPM_CONFIG_CACHE, value: /home/openclaw/.openclaw/npm-cache }
            # The agent holds the placeholder and never the token. Named so the
            # agent can tell what it is: there is a credential, it is mediated,
            # and it cannot be read. A leak of this value is a non-event.
            - { name: GH_PAT, value: "proxy-github-placeholder" }
            - name: OPENCLAW_LITELLM_API_KEY
              valueFrom:
                secretKeyRef: { name: litellm-key-openclaw, key: api-key }
            - { name: NODE_USE_ENV_PROXY, value: "1" }
            - { name: HTTP_PROXY, value: "http://iron-proxy.agent-lab.svc.cluster.local:8080" }
            - { name: HTTPS_PROXY, value: "http://iron-proxy.agent-lab.svc.cluster.local:8080" }
            # LiteLLM is in-cluster and must not go through the proxy.
            - { name: NO_PROXY, value: "127.0.0.1,localhost,.svc.cluster.local,10.0.0.0/8" }
            # The only CA variable still required: Node ships its own roots and
            # ignores the system trust store. SSL_CERT_FILE, CURL_CA_BUNDLE,
            # REQUESTS_CA_BUNDLE and GIT_SSL_CAINFO are all redundant now.
            #
            # Point it at the MOUNTED path, not at the initContainer's scratch
            # path -- `/merged` does not exist in this container. Node ignores a
            # nonexistent NODE_EXTRA_CA_CERTS file **silently**, falls back to
            # its bundled roots, and fails with SELF_SIGNED_CERT_IN_CHAIN, which
            # reads like a trust problem rather than a typo.
            - { name: NODE_EXTRA_CA_CERTS, value: /etc/ssl/certs/ca-certificates.crt }
          # Without these the namespace LimitRange default (512Mi) applies and
          # the gateway is OOMKilled mid-run with exit 137.
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "2", memory: 4Gi }
          volumeMounts:
            - { name: data, mountPath: /home/openclaw/.openclaw }
            - { name: tmp, mountPath: /tmp }
            - name: merged
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        # The gateway config (openclaw.json), supplied alongside this file --
        # in the lab it was copied from the `oc-plain-config` ConfigMap.
        - name: cfg
          configMap: { name: oc-iron-config }
        - name: ca
          secret: { secretName: iron-proxy-ca }
        - name: merged
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# The enforcement layer. The HTTP_PROXY variables above are convenience only --
# an agent that unsets them does not gain egress, it loses its only route out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oc-iron-egress
  namespace: agent-lab
spec:
  podSelector:
    matchLabels: { app: oc-iron }
  policyTypes: [Egress]
  egress:
    # Scoped to kube-dns: an unscoped port-53 rule is a tunnel the allowlist
    # never sees.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels: { app: iron-proxy }
      ports:
        - { port: 8080, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: litellm }
          podSelector:
            matchLabels: { app.kubernetes.io/name: litellm }
      ports:
        - { port: 4000, protocol: TCP }
