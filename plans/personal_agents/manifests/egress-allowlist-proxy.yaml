---
# The CA is owned outside mitmproxy so it is stable across proxy restarts and the
# workload can be handed exactly the certificate the proxy signs with. Production
# gets this Secret from a cert-manager `Certificate` (see
# cluster/k8s/agents/public-coder-agent/proxy/certificate.yaml), which is the
# better shape and the one to copy for anything long-lived. The lab creates it
# directly, because agent-lab's RBAC does not include cert-manager resources:
#
#   openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
#     -keyout ca.key -out ca.crt -days 3650 -subj "/CN=lab-proxy-ca/O=agent-lab" \
#     -addext "basicConstraints=critical,CA:TRUE" \
#     -addext "keyUsage=critical,digitalSignature,keyCertSign,cRLSign"
#   kubectl -n agent-lab create secret generic lab-proxy-ca \
#     --from-file=tls.key=ca.key --from-file=tls.crt=ca.crt --from-file=ca.crt=ca.crt
#
# Either way the point is the same: mitmproxy must not be the thing that owns it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-proxy
  namespace: agent-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: lab-proxy }
  template:
    metadata:
      labels: { app: lab-proxy }
    spec:
      # mitmdump runs as uid 1000 and caches generated leaf certs in confdir, so
      # the emptyDir has to be group-writable by it.
      securityContext:
        fsGroup: 1000
      initContainers:
        # mitmproxy wants one PEM holding key+cert; cert-manager splits them.
        - name: ca-init
          image: busybox:1.37
          command:
            - sh
            - -c
            - cat /ca/tls.key /ca/tls.crt > /confdir/mitmproxy-ca.pem
          volumeMounts:
            - { name: ca, mountPath: /ca, readOnly: true }
            - { name: confdir, mountPath: /confdir }
          # The namespace enforces PodSecurity `restricted`, which applies to
          # initContainers too -- without this the pod is rejected outright.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mitmdump
          # >=12.2.3 for the CA SKI/AKI fix -- see
          # cluster/docs/lessons_learned/2026_06_25_mitmproxy_ca_ski_aki_mismatch.md.
          image: docker.io/mitmproxy/mitmproxy:12.2.3
          command: ["mitmdump"]
          args:
            - --listen-host
            - 0.0.0.0
            - --listen-port
            - "8080"
            - --set
            - block_global=false
            - --set
            - confdir=/confdir
            - -s
            - /addon/allowlist.py
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: addon
              mountPath: /addon
            - name: confdir
              mountPath: /confdir
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: addon
          configMap: { name: lab-proxy-addon }
        - name: ca
          secret: { secretName: lab-proxy-ca }
        - name: confdir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lab-proxy
  namespace: agent-lab
spec:
  selector: { app: lab-proxy }
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
