# Envoy credential_injector, tested against real GitHub -- the experiment behind
# credential_proxy_options.md. Kept because the result is a negative one and
# negative results get re-derived unless the setup survives.
#
# Two listeners, one credential, one filter:
#   :8080 reverse proxy  -> injects; GET /user returns "agentydragon-agent"
#   :8081 forward proxy  -> cannot inject; CONNECT tunnel is opaque TLS, so
#                           https://api.github.com/user returns 401
#
# The reverse leg proves the credential and filter are configured correctly,
# which is what makes the forward leg's 401 structural rather than a typo.
# Envoy has no on-the-fly certificate minting, so it cannot MITM arbitrary hosts
# the way mitmproxy and Squid+ssl_bump can.
#
# Also note Envoy logs at startup that credential_injector is work-in-progress:
# "not covered by the threat model, are not supported by the security team, and
# are subject to breaking changes."
#
# The RBAC filter is separate on purpose: credential_injector performs no path or
# method authorization of its own.
#
# To re-run, recreate the credential Secret (deleted after the test -- it holds a
# live PAT, and the value must carry the scheme because the generic credential is
# injected verbatim):
#
#   kubectl -n agent-lab create secret generic envoy-gh-cred \
#     --from-literal=token="Bearer $(your-pat)"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-cred-test
  namespace: agent-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: envoy-cred-test }
  template:
    metadata:
      labels: { app: envoy-cred-test }
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.34-latest
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          ports: [{ containerPort: 8080 }, { containerPort: 8081 }]
          volumeMounts:
            - { name: cfg, mountPath: /etc/envoy }
            - { name: creds, mountPath: /creds, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: cfg
          configMap: { name: envoy-cred-test }
        - name: creds
          secret: { secretName: envoy-gh-cred }
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-cred-test
  namespace: agent-lab
spec:
  selector: { app: envoy-cred-test }
  ports:
    - { name: rev, port: 8080, targetPort: 8080 }
    - { name: fwd, port: 8081, targetPort: 8081 }
