# OpenClaw as a plain Deployment — no operator, so the NetworkPolicy is ours.
#
# Same harness and same config as oc-solo (sandbox.mode "off": one container,
# no OpenShell relay). The only substantive difference is the egress boundary:
# here nothing emits an unconditional 443 allow, so the pod can reach DNS, the
# allowlisting proxy, and LiteLLM — and nothing else.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oc-plain-data
  namespace: agent-lab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-proxmox
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oc-plain
  namespace: agent-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: oc-plain }
  template:
    metadata:
      labels: { app: oc-plain }
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # The gateway reads its config from the state dir, which is the PVC, so
        # the declarative config has to be planted there before startup.
        - name: seed-config
          image: ghcr.io/agentydragon/openclaw:devel-20260728182008-17ba82d
          command: ["sh", "-c", "cp /cfg/openclaw.json /state/openclaw.json && echo seeded"]
          volumeMounts:
            - { name: cfg, mountPath: /cfg }
            - { name: data, mountPath: /state }
      containers:
        - name: openclaw
          image: ghcr.io/agentydragon/openclaw:devel-20260728182008-17ba82d
          env:
            # The image does not set HOME to the state dir; the operator does,
            # and without it the gateway looks for openclaw.json elsewhere and
            # exits with "Missing config".
            - name: HOME
              value: /home/openclaw
            # Must sit inside the PVC mount: $HOME itself is the read-only
            # image layer, so with the defaults every `openclaw plugins install`
            # dies on EACCES creating ~/.cache.
            - name: NPM_CONFIG_PREFIX
              value: /home/openclaw/.openclaw/npm-prefix
            - name: NPM_CONFIG_CACHE
              value: /home/openclaw/.openclaw/npm-cache
            # NOT `GITHUB_TOKEN`/`GH_TOKEN`: host-env-security strips both by
            # exact name from the exec tool's environment, so the agent could
            # authenticate to nothing. lab_notes.md F7.
            - name: GH_PAT
              valueFrom:
                secretKeyRef: { name: lab-github-token, key: GITHUB_TOKEN }
            - name: OPENCLAW_LITELLM_API_KEY
              valueFrom:
                secretKeyRef: { name: litellm-key-openclaw, key: api-key }
            - name: NODE_USE_ENV_PROXY
              value: "1"
            - name: HTTP_PROXY
              value: "http://lab-proxy.agent-lab.svc.cluster.local:8080"
            - name: HTTPS_PROXY
              value: "http://lab-proxy.agent-lab.svc.cluster.local:8080"
            - name: NO_PROXY
              value: "127.0.0.1,localhost,.svc.cluster.local,10.0.0.0/8"
            - name: SSL_CERT_FILE
              value: /lab-ca/ca.crt
            - name: CURL_CA_BUNDLE
              value: /lab-ca/ca.crt
            - name: REQUESTS_CA_BUNDLE
              value: /lab-ca/ca.crt
            - name: GIT_SSL_CAINFO
              value: /lab-ca/ca.crt
            - name: NODE_EXTRA_CA_CERTS
              value: /lab-ca/ca.crt
          volumeMounts:
            - { name: data, mountPath: /home/openclaw/.openclaw }
            - { name: lab-ca, mountPath: /lab-ca, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "2", memory: 4Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: oc-plain-data }
        - name: cfg
          configMap: { name: oc-plain-config }
        # The cert-manager-issued CA the proxy signs with, straight from the
        # Certificate's Secret -- not a hand-copied ConfigMap, which is how the
        # trust chain silently drifted out of sync (lab_notes.md F8).
        - name: lab-ca
          secret: { secretName: lab-proxy-ca }
        - name: tmp
          emptyDir: {}
      nodeSelector:
        topology.kubernetes.io/region: proxmox
---
# The outer fence F3 showed the operator cannot provide: no blanket 443 rule.
# This is the enforcement layer. The HTTP_PROXY/HTTPS_PROXY env vars above are
# convenience, not confinement — an agent that unsets them does not gain egress,
# it just loses its only route out.
#
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oc-plain-egress
  namespace: agent-lab
spec:
  podSelector:
    matchLabels: { app: oc-plain }
  policyTypes: [Egress]
  egress:
    # Scoped to kube-dns: an unscoped port-53 rule is a DNS tunnel the proxy
    # allowlist never sees.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels: { app: lab-proxy }
      ports:
        - { port: 8080, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - { port: 4000, protocol: TCP }
