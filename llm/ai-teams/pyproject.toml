[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-teams"
version = "0.1.0"
description = "Multi-agent workflow orchestration tools"
authors = [{name = "AI Teams Project"}]
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0",
    "tabulate>=0.9.0",
]

[project.scripts]
ai-teams = "ai_teams.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_teams*"]
