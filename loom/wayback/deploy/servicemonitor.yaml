apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wayback-cache
  namespace: wayback-cache
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wayback-cache
      app.kubernetes.io/component: input
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
