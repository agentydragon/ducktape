nameOverride: ""
fullnameOverride: ""

guacamole:
  replicaCount: 1
  image:
    repository: guacamole/guacamole
    tag: "1.5.5"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  extraEnv: []

guacd:
  replicaCount: 1
  image:
    repository: guacamole/guacd
    tag: "1.5.5"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4822
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}

postgres:
  host: guacamole-postgresql
  port: 5432
  database: guacamole
  user: guacamole
  secretName: guacamole-db-credentials
  secretKeys:
    userPasswordKey: password
    adminPasswordKey: postgres-password
    envPasswordKey: POSTGRES_PASSWORD

serviceAccount:
  create: false
  name: ""

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts: []
  tls: []

nodeSelector: {}
affinity: {}
tolerations: []
