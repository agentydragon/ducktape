apiVersion: v1
kind: Service
metadata:
  name: {{ include "guacamole.guacamoleServiceName" . }}
  labels:
    {{- include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/component" "guacamole")) | nindent 4 }}
spec:
  type: {{ .Values.guacamole.service.type }}
  selector:
    {{- include "common.selectorLabelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/component" "guacamole")) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.guacamole.service.port }}
      targetPort: http
      protocol: TCP
