apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "common.fullname" . }}
  labels:
{{ include "traefik.labels" . | indent 4 }}
spec:
  selector:
    matchLabels:
{{ include "traefik.selectorLabels" . | indent 6 }}
  template:
    metadata:
      labels:
{{ include "traefik.selectorLabels" . | indent 8 }}
      {{- if .Values.daemonset.podAnnotations }}
      annotations:
{{ toYaml .Values.daemonset.podAnnotations | indent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "traefik.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- if .Values.podSecurityContext }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      {{- end }}
{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
{{- end }}
      containers:
        - name: traefik
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- if .Values.securityContext }}
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
{{- end }}
          args:
{{- range .Values.globalArguments }}
            - {{ . | quote }}
{{- end }}
{{- range .Values.daemonset.args }}
            - {{ . | quote }}
{{- end }}
{{- range .Values.extraArgs }}
            - {{ . | quote }}
{{- end }}
          env:
            - name: TZ
              value: UTC
{{- if .Values.extraEnv }}
{{ toYaml .Values.extraEnv | indent 12 }}
{{- end }}
          ports:
            - name: web
              containerPort: {{ .Values.service.ports.web }}
            - name: websecure
              containerPort: {{ .Values.service.ports.websecure }}
            - name: dashboard
              containerPort: 8080
          resources:
{{ toYaml .Values.daemonset.resources | indent 12 }}
{{- if .Values.extraVolumeMounts }}
          volumeMounts:
{{ toYaml .Values.extraVolumeMounts | indent 12 }}
{{- end }}
      {{- if .Values.extraVolumes }}
      volumes:
{{ toYaml .Values.extraVolumes | indent 8 }}
      {{- end }}
      {{- if .Values.daemonset.affinity }}
      affinity:
{{ toYaml .Values.daemonset.affinity | indent 8 }}
      {{- end }}
      {{- if .Values.daemonset.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.daemonset.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.daemonset.tolerations }}
      tolerations:
{{ toYaml .Values.daemonset.tolerations | indent 8 }}
      {{- end }}
