{{- with .Values.tls.options.default }}
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: {{ $.Release.Namespace }}
spec:
{{- if .minVersion }}
  minVersion: {{ .minVersion }}
{{- end }}
{{- if hasKey . "sniStrict" }}
  sniStrict: {{ .sniStrict }}
{{- end }}
{{- end }}
{{- with $store := .Values.tls.store.default }}
{{- if $store.defaultCertificateSecret }}
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: {{ $.Release.Namespace }}
spec:
  defaultCertificate:
    secretName: {{ $store.defaultCertificateSecret }}
{{- end }}
{{- end }}
