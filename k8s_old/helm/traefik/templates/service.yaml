apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.fullname" . }}
  labels:
{{ include "traefik.labels" . | indent 4 }}
  {{- if .Values.service.annotations }}
  annotations:
{{ toYaml .Values.service.annotations | indent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
{{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP | quote }}
{{- end }}
{{- if .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
{{- end }}
  selector:
{{ include "traefik.selectorLabels" . | indent 4 }}
  ports:
    - name: web
      port: {{ .Values.service.ports.web }}
      targetPort: {{ .Values.service.ports.web }}
      protocol: TCP
    - name: websecure
      port: {{ .Values.service.ports.websecure }}
      targetPort: {{ .Values.service.ports.websecure }}
      protocol: TCP
