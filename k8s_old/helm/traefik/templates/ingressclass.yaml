{{- if .Values.ingressClass.create }}
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ .Values.ingressClass.name }}
  annotations:
    ingressclass.kubernetes.io/is-default-class: {{ ternary "\"true\"" "\"false\"" .Values.ingressClass.isDefault | quote }}
  labels:
{{ include "traefik.labels" . | indent 4 }}
spec:
  controller: {{ .Values.ingressClass.controller }}
{{- end }}
