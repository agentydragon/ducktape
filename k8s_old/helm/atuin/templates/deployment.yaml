apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atuin.serverName" . }}
  labels:
{{ include "atuin.serverLabels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
{{ include "atuin.serverSelectorLabels" . | indent 6 }}
  template:
    metadata:
      labels:
{{ include "atuin.serverSelectorLabels" . | indent 8 }}
{{- if .Values.podAnnotations }}
      annotations:
{{ toYaml .Values.podAnnotations | indent 8 }}
{{- end }}
    spec:
{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
{{- end }}
      serviceAccountName: {{ include "atuin.serviceAccountName" . }}
{{- if .Values.podSecurityContext }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
{{- end }}
      initContainers:
        - name: wait-for-postgres
          image: {{ printf "%s:%s" .Values.waitForPostgres.image.repository .Values.waitForPostgres.image.tag }}
          imagePullPolicy: {{ .Values.waitForPostgres.image.pullPolicy }}
          command:
{{ toYaml .Values.waitForPostgres.command | indent 12 }}
          env:
            - name: POSTGRES_HOST
              value: {{ default (include "atuin.postgresServiceName" .) .Values.waitForPostgres.env.POSTGRES_HOST | quote }}
            - name: POSTGRES_PORT
              value: {{ default (printf "%d" .Values.postgres.service.port) .Values.waitForPostgres.env.POSTGRES_PORT | quote }}
      containers:
        - name: atuin
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - atuin
            - server
            - start
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: ATUIN_CONFIG_DIR
              value: /config
            - name: ATUIN_DB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "atuin.postgresSecretName" . }}
                  key: db-uri
            - name: RUST_LOG
              value: info
{{- if .Values.env.extra }}
{{ toYaml .Values.env.extra | indent 12 }}
{{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
{{ toYaml .Values.resources | indent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "atuin.serverName" . }}-config
{{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 6 }}
{{- end }}
{{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 6 }}
{{- end }}
{{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 6 }}
{{- end }}
