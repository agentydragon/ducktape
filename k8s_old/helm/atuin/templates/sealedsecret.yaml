{{- $secret := .Values.secrets.postgres -}}
{{- if and $secret $secret.sealed.enabled }}
{{- $encrypted := $secret.sealed.encryptedData -}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ default (include "atuin.postgresSecretName" .) $secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "atuin.postgresLabels" . | indent 4 }}
spec:
  encryptedData:
    postgres-password: {{ required "secrets.postgres.sealed.encryptedData.postgresPassword is required when sealed secret is enabled" $encrypted.postgresPassword | quote }}
    db-uri: {{ required "secrets.postgres.sealed.encryptedData.dbUri is required when sealed secret is enabled" $encrypted.dbUri | quote }}
  template:
    metadata:
      name: {{ default (include "atuin.postgresSecretName" .) $secret.name }}
      namespace: {{ .Release.Namespace }}
      labels:
{{ include "atuin.postgresLabels" . | indent 8 }}
    type: Opaque
{{- end }}
