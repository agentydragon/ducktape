{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "atuin.postgresServiceName" . }}
  labels:
{{ include "atuin.postgresLabels" . | indent 4 }}
  {{- if .Values.postgres.annotations }}
  annotations:
{{ toYaml .Values.postgres.annotations | indent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "atuin.postgresServiceName" . }}
  replicas: 1
  selector:
    matchLabels:
{{ include "atuin.postgresSelectorLabels" . | indent 6 }}
  template:
    metadata:
      labels:
{{ include "atuin.postgresSelectorLabels" . | indent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ printf "%s:%s" .Values.postgres.image.repository .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.postgres.service.port }}
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "atuin.postgresSecretName" . }}
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
{{ toYaml .Values.postgres.resources | indent 12 }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.user }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.user }}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
{{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "atuin.postgresPvcName" . }}
{{- else }}
          emptyDir: {}
{{- end }}
{{- end }}
