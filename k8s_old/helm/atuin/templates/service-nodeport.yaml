{{- if .Values.nodePortService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "atuin.serverName" . }}-nodeport
  labels:
{{ include "atuin.serverLabels" . | indent 4 }}
spec:
  type: NodePort
  ports:
    - port: {{ .Values.nodePortService.port }}
      targetPort: {{ .Values.service.port }}
      nodePort: {{ .Values.nodePortService.nodePort }}
      protocol: TCP
      name: http
  selector:
{{ include "atuin.serverSelectorLabels" . | indent 4 }}
{{- end }}
