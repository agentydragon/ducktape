{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "atuin.postgresServiceName" . }}
  labels:
{{ include "atuin.postgresLabels" . | indent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.port }}
      protocol: TCP
      name: postgres
  selector:
{{ include "atuin.postgresSelectorLabels" . | indent 4 }}
{{- end }}
