apiVersion: v1
kind: Service
metadata:
  name: {{ include "atuin.serverName" . }}
  labels:
{{ include "atuin.serverLabels" . | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
{{ include "atuin.serverSelectorLabels" . | indent 4 }}
