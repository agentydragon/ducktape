nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/atuinsh/atuin
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

affinity: {}
nodeSelector: {}
tolerations: []

env:
  extra: []

config:
  serverToml: ""

service:
  type: ClusterIP
  port: 8888
nodePortService:
  enabled: false
  port: 8888
  nodePort: 30888

ingress:
  enabled: true
  className: traefik
  annotations:
    ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: atuin.k3s.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

postgres:
  enabled: true
  fullname: postgres
  image:
    repository: postgres
    tag: 14-alpine
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    existingClaim: postgres-pvc
    storageClass: local-path
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  database: atuin
  user: atuin
  annotations: {}

secrets:
  postgres:
    name: atuin-postgres
    sealed:
      enabled: false
      encryptedData:
        postgresPassword: ""
        dbUri: ""

waitForPostgres:
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  command:
    - sh
    - -c
    - until nc -z ${POSTGRES_HOST} ${POSTGRES_PORT}; do echo waiting for postgres; sleep 2; done
  env:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
