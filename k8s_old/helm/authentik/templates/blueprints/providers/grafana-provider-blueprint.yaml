apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-grafana
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "common.blueprintLabels" . | nindent 4 }}
data:
  grafana.yaml: |
    version: 1
    metadata:
      name: Grafana OAuth2 Provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      grafana_client_secret: !Env [GRAFANA_OAUTH_SECRET, "changeme"]
    entries:
      # Create OAuth2 Provider for Grafana
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        state: present
        identifiers:
          client_id: grafana
        attrs:
          name: Grafana OAuth Provider
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: grafana
          client_secret: !Context grafana_client_secret
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.k3s.agentydragon.com/login/generic_oauth
            - matching_mode: strict
              url: https://grafana.k3s.local/login/generic_oauth
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          issuer_mode: per_provider
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      # Create custom scope mapping for Grafana roles
      - model: authentik_providers_oauth2.scopemapping
        id: grafana-groups
        state: present
        identifiers:
          scope_name: grafana_groups
        attrs:
          name: Grafana Groups
          scope_name: grafana_groups
          expression: |
            # Map Authentik groups to Grafana roles
            groups = []
            for group in request.user.ak_groups.all():
                groups.append(group.name)
            return {
                "groups": groups,
            }

      # Create Application for Grafana
      - model: authentik_core.application
        id: grafana-app
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          slug: grafana
          provider: !KeyOf grafana-provider
          meta_launch_url: https://grafana.k3s.agentydragon.com
          meta_description: Metrics and Dashboards
          meta_icon: https://grafana.com/static/img/menu/grafana2.svg
          policy_engine_mode: any
          group: Infrastructure

      # Create admin group
      - model: authentik_core.group
        id: grafana-admins
        state: present
        identifiers:
          name: grafana-admins
        attrs:
          name: grafana-admins
          is_superuser: false
