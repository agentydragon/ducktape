apiVersion: v2
name: authentik
description: Authentik SSO deployment for k3s
type: application
version: 0.1.0

dependencies:
  - name: common-lib
    version: ^0.1.1
    repository: file://../common-lib
  - name: authentik
    version: "2025.8.3"
    repository: https://charts.goauthentik.io
  - name: postgresql
    version: "16.2.1"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "20.3.0"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
