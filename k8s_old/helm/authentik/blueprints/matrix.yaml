version: 1
metadata:
  name: Matrix Synapse OIDC Setup
  labels:
    blueprints.goauthentik.io/type: matrix
    blueprints.goauthentik.io/instantiate: "true"
    {{- if .BlueprintChecksum }}
    blueprints.goauthentik.io/revision: {{ .BlueprintChecksum | quote }}
    {{- end }}
entries:
  - model: authentik_providers_oauth2.scopemapping
    id: matrix-groups
    state: present
    identifiers:
      scope_name: groups
    attrs:
      name: Matrix Groups
      scope_name: groups
      expression: |
        groups = []
        for group in request.user.ak_groups.all():
            groups.append(group.name)
        return {"groups": groups}

  - model: authentik_crypto.certificatekeypair
    id: matrix-signing-key
    state: present
    identifiers:
      name: Matrix Synapse Signing Key
    attrs:
      name: Matrix Synapse Signing Key
      certificate_data: !Env MATRIX_SIGNING_CERT
      key_data: !Env MATRIX_SIGNING_KEY

  - model: authentik_providers_oauth2.oauth2provider
    id: matrix-provider
    state: present
    identifiers:
      name: Matrix Synapse Provider
    attrs:
      name: Matrix Synapse Provider
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: matrix-synapse
      client_secret: !Env MATRIX_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://matrix.k3s.agentydragon.com/_synapse/client/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf matrix-groups
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      signing_key: !KeyOf matrix-signing-key

  - model: authentik_core.application
    id: matrix-application
    state: present
    identifiers:
      slug: matrix
    attrs:
      name: Matrix Synapse
      slug: matrix
      provider: !KeyOf matrix-provider
      policy_engine_mode: any
      meta_launch_url: https://matrix.k3s.agentydragon.com
      meta_icon: https://matrix.org/images/matrix-logo.svg
      meta_description: Matrix Homeserver
      group: Infrastructure

  - model: authentik_core.group
    id: matrix-users
    state: present
    identifiers:
      name: matrix-users
    attrs:
      name: matrix-users
      is_superuser: false
