version: 1
metadata:
  name: rspcache Admin
  labels:
    blueprints.goauthentik.io/type: rspcache
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_core.group
    id: rspcache-admins
    state: present
    identifiers:
      name: rspcache-admins
    attrs:
      name: rspcache-admins
      is_superuser: false

  - model: authentik_providers_proxy.proxyprovider
    id: rspcache-provider
    state: present
    identifiers:
      name: rspcache-admin
    attrs:
      name: rspcache-admin
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://rspcache-admin.k3s.agentydragon.com
      internal_host: http://rspcache-admin.rspcache.svc.cluster.local:8100
      skip_path_regex: ""

  - model: authentik_core.application
    id: rspcache-admin-app
    state: present
    identifiers:
      slug: rspcache-admin
    attrs:
      name: rspcache-admin
      slug: rspcache-admin
      provider: !KeyOf rspcache-provider
      policy_engine_mode: any
      meta_launch_url: https://rspcache-admin.k3s.agentydragon.com
      meta_description: rspcache administration UI
      group: Infrastructure
