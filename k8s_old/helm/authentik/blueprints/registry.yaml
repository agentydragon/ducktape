version: 1
metadata:
  name: Container Registry Access
  labels:
    blueprints.goauthentik.io/type: registry
    blueprints.goauthentik.io/instantiate: "true"
    {{- if .BlueprintChecksum }}
    blueprints.goauthentik.io/revision: {{ .BlueprintChecksum | quote }}
    {{- end }}
entries:
  - model: authentik_core.group
    id: registry-admin-group
    state: present
    identifiers:
      name: {{ .Values.registry.adminGroup }}
    attrs:
      name: {{ .Values.registry.adminGroup }}
      is_superuser: false

  - model: authentik_providers_proxy.proxyprovider
    id: registry-provider
    state: present
    identifiers:
      name: registry-forward-auth
    attrs:
      name: registry-forward-auth
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: {{ .Values.registry.externalHost | quote }}
      internal_host: {{ .Values.registry.internalHost | quote }}
      skip_path_regex: ""
      basic_auth_enabled: true

  - model: authentik_core.application
    id: registry-app
    state: present
    identifiers:
      slug: registry
    attrs:
      name: Container Registry
      slug: registry
      provider: !KeyOf registry-provider
      policy_engine_mode: any
      meta_launch_url: {{ .Values.registry.externalHost | quote }}
      meta_description: Private container registry protected by Authentik forward-auth.
      group: Infrastructure
