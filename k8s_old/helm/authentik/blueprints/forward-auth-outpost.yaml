version: 1
metadata:
  name: Forward Auth Outpost Attachments
  labels:
    blueprints.goauthentik.io/type: forward-auth
    blueprints.goauthentik.io/instantiate: "true"
    {{- if .BlueprintChecksum }}
    blueprints.goauthentik.io/revision: {{ .BlueprintChecksum | quote }}
    {{- end }}
entries:
  - model: authentik_outposts.outpost
    id: forward-auth-outpost
    state: present
    identifiers:
      name: {{ .Values.forwardAuth.outpost.name | quote }}
    attrs:
      name: {{ .Values.forwardAuth.outpost.name | quote }}
      type: proxy
      providers:
        {{- range $provider := .Values.forwardAuth.outpost.providers }}
        - !Find [authentik_core.provider, [name, {{ $provider | quote }}]]
        {{- end }}
