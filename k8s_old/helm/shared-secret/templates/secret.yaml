{{- $secretCfg := .Values.secret -}}
{{- $name := $secretCfg.name | default (include "shared-secret.fullname" .) -}}
{{- $length := int (default 48 $secretCfg.length) -}}
{{- $keys := $secretCfg.dataKeys | default (list "password") -}}
{{- $primaryKey := index $keys 0 -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $value := default "" $secretCfg.value -}}
{{- if and (eq $value "") $existing }}
  {{- $existingVal := index $existing.data $primaryKey -}}
  {{- if $existingVal }}
    {{- $value = ($existingVal | b64dec) -}}
  {{- end -}}
{{- end -}}
{{- if eq $value "" -}}
  {{- $value = randAlphaNum $length -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "common.labelsWith" (dict "context" . "extra" ($secretCfg.labels | default (dict))) | nindent 4 }}
  {{- $annotations := $secretCfg.annotations | default (dict) -}}
  {{- if or .Values.includeHashAnnotation (gt (len $annotations) 0) }}
  annotations:
    {{- range $k, $v := $annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- if .Values.includeHashAnnotation }}
    shared-secret/hash: {{ sha256sum $value | quote }}
    {{- end }}
  {{- end }}
type: {{ $secretCfg.type | default "Opaque" }}
stringData:
  {{- range $keys }}
  {{ . }}: {{ $value | quote }}
  {{- end }}
