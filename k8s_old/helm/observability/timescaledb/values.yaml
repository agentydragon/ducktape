nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: timescale/timescaledb
  tag: latest-pg15
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClass: ""

postgres:
  database: openai_probe
  secretName: timescaledb-secret
  secretKey: postgres-password

service:
  port: 5432

sealedSecret:
  enabled: true
  name: timescaledb-secret
  encryptedData:
    postgres-password: ""

nodeSelector: {}
affinity: {}
tolerations: []
