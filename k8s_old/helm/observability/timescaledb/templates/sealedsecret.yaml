{{- if .Values.sealedSecret.enabled }}
{{- $encrypted := dict "postgres-password" (required "sealedSecret.encryptedData.postgres-password is required when sealedSecret.enabled=true" (index .Values.sealedSecret.encryptedData "postgres-password")) -}}
{{- $secretName := default (include "common.fullname" .) .Values.sealedSecret.name -}}
{{ include "common.sealedSecret" (dict "context" . "namespace" .Release.Namespace "name" $secretName "component" "timescaledb" "encryptedData" $encrypted) }}
{{- end }}
