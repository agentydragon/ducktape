{{- $component := "timescaledb" -}}
{{- $labels := include "common.componentLabels" (dict "context" . "component" $component) | fromYaml -}}
{{- $selector := include "common.componentSelectorLabels" (dict "context" . "component" $component) | fromYaml -}}
{{- $fullname := include "common.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
{{ toYaml $labels | indent 4 }}
spec:
  serviceName: {{ $fullname }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
{{ toYaml $selector | indent 6 }}
  template:
    metadata:
      labels:
{{ toYaml $selector | indent 8 }}
    spec:
      containers:
        - name: timescaledb
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: {{ .Values.postgres.secretKey }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
{{ toYaml .Values.resources | indent 12 }}
{{- if not .Values.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
{{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
{{- end }}
{{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
{{- end }}
{{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
{{- end }}
{{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
{{ toYaml .Values.persistence.accessModes | indent 10 }}
{{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
{{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}
