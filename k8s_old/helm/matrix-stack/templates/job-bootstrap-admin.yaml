apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "matrix-stack.fullname" . }}-bootstrap-admin
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
    app.kubernetes.io/component: bootstrap
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register-admin
          image: python:3.12-alpine
          command:
            - sh
            - -c
            - >-
              pip install --no-cache-dir requests &&
              python /scripts/admin_bootstrap.py
          env:
            - name: SYNAPSE_HOMESERVER
              value: {{ include "matrix-stack.synapse-internal-url" . | quote }}
            - name: REGISTRATION_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "matrix-stack.matrixSecretName" . }}
                  key: registration_shared_secret
            - name: ADMIN_USERNAME
              value: {{ .Values.bootstrap.admin.username | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "matrix-stack.bootstrapSecretName" . }}
                  key: {{ .Values.bootstrap.admin.passwordKey | default "admin-password" | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ include "matrix-stack.fullname" . }}-bootstrap-scripts
            defaultMode: 0750
