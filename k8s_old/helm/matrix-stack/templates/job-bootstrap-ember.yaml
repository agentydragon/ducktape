apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "matrix-stack.fullname" . }}-bootstrap-ember
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
    app.kubernetes.io/component: bootstrap
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
        app.kubernetes.io/component: bootstrap
    spec:
      serviceAccountName: {{ include "matrix-stack.fullname" . }}-ember-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: register-ember
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              pip install --no-cache-dir kubernetes requests &&
              python /scripts/ember_bootstrap.py
          env:
            - name: SYNAPSE_HOMESERVER
              value: {{ include "matrix-stack.synapse-internal-url" . | quote }}
            - name: REGISTRATION_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "matrix-stack.matrixSecretName" . }}
                  key: registration_shared_secret
            - name: EMBER_USERNAME
              value: {{ .Values.bootstrap.ember.username | quote }}
            - name: EMBER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "matrix-stack.bootstrapSecretName" . }}
                  key: {{ .Values.bootstrap.ember.passwordKey | default "ember-password" | quote }}
            - name: EMBER_NAMESPACE
              value: {{ .Values.bootstrap.ember.namespace | quote }}
            - name: EMBER_SECRET_NAME
              value: {{ .Values.bootstrap.ember.secretName | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ include "matrix-stack.fullname" . }}-bootstrap-scripts
            defaultMode: 0750
