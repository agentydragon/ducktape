apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "matrix-stack.fullname" . }}-bootstrap-scripts
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
    app.kubernetes.io/component: bootstrap
    helm.sh/chart: {{ include "matrix-stack.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  admin_bootstrap.py: |
{{ (.Files.Get "files/admin_bootstrap.py") | nindent 4 }}
  ember_bootstrap.py: |
{{ (.Files.Get "files/ember_bootstrap.py") | nindent 4 }}
