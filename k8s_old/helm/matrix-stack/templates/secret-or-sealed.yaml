{{- if .Values.sealedSecrets.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "matrix-stack.bootstrapSecretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
{{- with .Values.bootstrap.secret.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  encryptedData:
{{- if .Values.sealedSecrets.encryptedData }}
{{ toYaml .Values.sealedSecrets.encryptedData | indent 4 }}
{{- else }}
    # admin-password: "<sealed>"
    # ember-password: "<sealed>"
    # oidc-client-secret: "<sealed>"
{{- end }}
  template:
    metadata:
      name: {{ include "matrix-stack.bootstrapSecretName" . }}
{{- with .Values.bootstrap.secret.annotations }}
      annotations:
{{ toYaml . | indent 8 }}
{{- end }}
    type: Opaque
{{- else }}
{{- $secret := default (dict) .Values.bootstrap.secret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matrix-stack.bootstrapSecretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "matrix-stack.name" . }}
{{- with .Values.bootstrap.secret.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
type: Opaque
data:
  admin-password: {{ default "" $secret.adminPasswordB64 | quote }}
  ember-password: {{ default "" $secret.emberPasswordB64 | quote }}
  oidc-client-secret: {{ default "" $secret.oidcClientSecretB64 | quote }}
{{- end }}
