{{- if .Values.loadBalancerService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.fullname" . }}-external
  labels:
{{ include "registry.labels" . | indent 4 }}
  {{- if .Values.loadBalancerService.annotations }}
  annotations:
{{ toYaml .Values.loadBalancerService.annotations | indent 4 }}
  {{- end }}
spec:
  type: {{ .Values.loadBalancerService.type }}
  ports:
    - port: {{ .Values.loadBalancerService.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
{{ include "registry.selectorLabels" . | indent 4 }}
{{- end }}
