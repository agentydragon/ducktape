nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: registry
  tag: "2.8.3"
  pullPolicy: IfNotPresent

imagePullSecrets: []

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 5000
  annotations: {}

loadBalancerService:
  enabled: true
  type: LoadBalancer
  annotations:
    metallb.universe.tf/allow-shared-ip: registry-group
  port: 5000

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    ingress.kubernetes.io/proxy-body-size: "0"
    cert-manager.io/cluster-issuer: homelab-ca-issuer
  hosts:
    - host: registry.k3s.agentydragon.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - registry.k3s.agentydragon.com
      secretName: registry-tls

persistence:
  enabled: true
  existingClaim: registry-storage
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi

extraEnv: []

affinity: {}
nodeSelector: {}
tolerations: []
