selfSignedClusterIssuer:
  name: selfsigned-cluster-issuer

caCertificate:
  name: homelab-ca
  namespace: cert-manager
  commonName: Homelab CA
  secretName: homelab-ca-secret
  duration: 87600h
  renewBefore: 720h

caClusterIssuer:
  name: homelab-ca-issuer
  secretName: homelab-ca-secret

labels:
  app.kubernetes.io/managed-by: homelab
  app.kubernetes.io/component: cert-manager-ca
