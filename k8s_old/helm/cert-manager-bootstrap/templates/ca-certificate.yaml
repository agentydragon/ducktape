apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.caCertificate.name }}
  namespace: {{ .Values.caCertificate.namespace }}
  labels:
{{ toYaml .Values.labels | indent 4 }}
spec:
  isCA: true
  commonName: {{ .Values.caCertificate.commonName | quote }}
  secretName: {{ .Values.caCertificate.secretName }}
  duration: {{ .Values.caCertificate.duration | quote }}
  renewBefore: {{ .Values.caCertificate.renewBefore | quote }}
  issuerRef:
    name: {{ .Values.selfSignedClusterIssuer.name }}
    kind: ClusterIssuer
