apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rspcache.proxyName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/name" (include "rspcache.proxyName" .) "app.kubernetes.io/component" "proxy")) | indent 4 }}
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rspcache.proxyName" . }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rspcache.proxyName" . }}
        app.kubernetes.io/component: proxy
        {{- range $k, $v := .Values.podLabels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- if .Values.podAnnotations }}
      annotations:
        {{- range $k, $v := .Values.podAnnotations }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- end }}
    spec:
{{ include "common.renderImagePullSecrets" . | indent 6 }}
      containers:
        - name: proxy
          image: "{{ .Values.appImage.repository }}:{{ .Values.appImage.tag }}"
          imagePullPolicy: {{ .Values.appImage.pullPolicy }}
          command: ["python", "-m", "adgn.rspcache.cli", "run"]
          args: ["--app", "proxy", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: ADGN_RESP_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxy.env.dbSecret }}
                  key: {{ .Values.proxy.env.dbUrlKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxy.env.openaiSecret }}
                  key: {{ .Values.proxy.env.openaiApiKeyKey }}
            - name: ADGN_OPENAI_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxy.env.openaiSecret }}
                  key: {{ .Values.proxy.env.openaiKeysKey }}
            - name: RSPCACHE_REQUIRE_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rspcache.configName" . }}
                  key: RSPCACHE_REQUIRE_API_KEY
          ports:
            - name: http
              containerPort: {{ .Values.proxy.service.port }}
          readinessProbe:
{{ toYaml .Values.proxy.readinessProbe | indent 12 }}
          livenessProbe:
{{ toYaml .Values.proxy.livenessProbe | indent 12 }}
          resources:
{{ toYaml .Values.proxy.resources | indent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
