{{- if .Values.admin.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rspcache.adminName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/name" (include "rspcache.adminName" .) "app.kubernetes.io/component" "admin")) | indent 4 }}
  {{- if .Values.admin.ingress.annotations }}
  annotations:
{{ toYaml .Values.admin.ingress.annotations | indent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.admin.ingress.className }}
  {{- if and .Values.admin.ingress.tls.enabled .Values.admin.ingress.tls.secretName }}
  tls:
    - hosts:
        {{- range .Values.admin.ingress.hosts }}
        - {{ .host | quote }}
        {{- end }}
      secretName: {{ .Values.admin.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- range .Values.admin.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "rspcache.adminName" $ }}
                port:
                  number: {{ $.Values.admin.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
