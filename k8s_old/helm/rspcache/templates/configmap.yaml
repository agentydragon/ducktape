apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rspcache.configName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/component" "config")) | indent 4 }}
data:
  RSPCACHE_REQUIRE_API_KEY: {{ ternary "\"1\"" "\"0\"" .Values.config.requireApiKey }}
