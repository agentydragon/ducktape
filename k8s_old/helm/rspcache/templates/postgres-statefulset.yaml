{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rspcache.postgresName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/name" (include "rspcache.postgresName" .) "app.kubernetes.io/component" "database")) | indent 4 }}
spec:
  serviceName: {{ include "rspcache.postgresName" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rspcache.postgresName" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rspcache.postgresName" . }}
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: tcp-postgres
              containerPort: {{ .Values.postgres.service.port }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sealedSecrets.db.name | default "rspcache-db" }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sealedSecrets.db.name | default "rspcache-db" }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sealedSecrets.db.name | default "rspcache-db" }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
{{ toYaml .Values.postgres.resources | indent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: {{ include "rspcache.postgresName" . }}
          app.kubernetes.io/component: database
      spec:
        accessModes:
{{- range .Values.postgres.storage.accessModes }}
          - {{ . | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size | quote }}
{{- end }}
