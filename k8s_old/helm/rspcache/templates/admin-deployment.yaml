apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rspcache.adminName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/name" (include "rspcache.adminName" .) "app.kubernetes.io/component" "admin")) | indent 4 }}
spec:
  replicas: {{ .Values.admin.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rspcache.adminName" . }}
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rspcache.adminName" . }}
        app.kubernetes.io/component: admin
    spec:
{{ include "common.renderImagePullSecrets" . | indent 6 }}
      containers:
        - name: admin
          image: "{{ .Values.appImage.repository }}:{{ .Values.appImage.tag }}"
          imagePullPolicy: {{ .Values.appImage.pullPolicy }}
          command: ["python", "-m", "adgn.rspcache.cli", "run"]
          args: ["--app", "admin", "--host", "0.0.0.0", "--port", "8100"]
          env:
            - name: ADGN_RESP_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxy.env.dbSecret }}
                  key: {{ .Values.proxy.env.dbUrlKey }}
            - name: RSPCACHE_REQUIRE_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "rspcache.configName" . }}
                  key: RSPCACHE_REQUIRE_API_KEY
          ports:
            - name: http
              containerPort: {{ .Values.admin.service.port }}
          readinessProbe:
{{ toYaml .Values.admin.readinessProbe | indent 12 }}
          livenessProbe:
{{ toYaml .Values.admin.livenessProbe | indent 12 }}
          resources:
{{ toYaml .Values.admin.resources | indent 12 }}
