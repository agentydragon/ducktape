apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/name" (include "rspcache.proxyName" .) "app.kubernetes.io/component" "proxy")) | indent 4 }}
spec:
  type: {{ .Values.proxy.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "rspcache.proxyName" . }}
    app.kubernetes.io/component: proxy
  ports:
    - name: http
      port: {{ .Values.proxy.service.port }}
      targetPort: http
