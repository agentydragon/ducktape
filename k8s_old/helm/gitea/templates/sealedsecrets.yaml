{{- $ns := .Release.Namespace -}}
{{- if and .Values.sealedSecrets.oauth.enabled .Values.sealedSecrets.oauth.encryptedData }}
{{ include "common.sealedSecret" (dict
  "context" .
  "namespace" $ns
  "name" (default "gitea-oauth-shared" .Values.oauthSetupJob.oauthSecretName)
  "component" "credentials"
  "annotations" (.Values.sealedSecrets.oauth.annotations | default (dict))
  "encryptedData" .Values.sealedSecrets.oauth.encryptedData
) }}
---
{{- end }}
{{- if and .Values.emberBootstrap.enabled .Values.sealedSecrets.emberCredentials.enabled .Values.sealedSecrets.emberCredentials.encryptedData }}
{{ include "common.sealedSecret" (dict
  "context" .
  "namespace" $ns
  "name" (default .Values.emberBootstrap.passwordSecretName "gitea-ember-credentials")
  "component" "credentials"
  "encryptedData" .Values.sealedSecrets.emberCredentials.encryptedData
) }}
{{- end }}
