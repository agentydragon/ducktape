{{- if .Values.oauthSetupJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-oauth-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "{{ .Values.oauthSetupJob.hookWeight }}"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
{{ include "common.componentLabels" (dict "context" . "component" "oauth-setup") | indent 4 }}
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-gitea
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Gitea to be ready..."
              until nc -z gitea-http 3000; do
                echo "Gitea not ready yet, waiting..."
                sleep 5
              done
              echo "Gitea is ready!"
      containers:
        - name: configure-oauth
          image: "{{ .Values.oauthSetupJob.image.repository }}:{{ .Values.oauthSetupJob.image.tag }}"
          imagePullPolicy: {{ .Values.oauthSetupJob.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA_WORK_DIR
              value: "{{ .Values.oauthSetupJob.pvcMountPath }}"
            - name: GITEA_CUSTOM
              value: "{{ .Values.oauthSetupJob.pvcMountPath }}/gitea"
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauthSetupJob.oauthSecretName }}
                  key: client_id
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauthSetupJob.oauthSecretName }}
                  key: client_secret
          command:
            - sh
            - -c
            - |
              set -e
              echo "Configuring OAuth2 provider..."

              export HOME={{ .Values.oauthSetupJob.pvcMountPath }}/git
              cd {{ .Values.oauthSetupJob.pvcMountPath }}

              if /app/gitea/gitea admin auth list | grep -q "{{ .Values.oauthSetupJob.providerName }}"; then
                echo "OAuth2 provider '{{ .Values.oauthSetupJob.providerName }}' already exists, skipping..."
              else
                /app/gitea/gitea admin auth add-oauth \
                  --name "{{ .Values.oauthSetupJob.providerName }}" \
                  --provider "openidConnect" \
                  --key "${OAUTH_CLIENT_ID}" \
                  --secret "${OAUTH_CLIENT_SECRET}" \
                  --auto-discover-url "{{ .Values.oauthSetupJob.autoDiscoverUrl }}" \
                  --scopes "openid profile email groups" \
                  --group-claim-name "groups" \
                  --admin-group "{{ .Values.oauthSetupJob.adminGroup }}" \
                  --restricted-group "{{ .Values.oauthSetupJob.restrictedGroup }}"

                echo "OAuth2 provider configured successfully!"
              fi
          volumeMounts:
            - name: gitea-config
              mountPath: {{ .Values.oauthSetupJob.pvcMountPath }}
      volumes:
        - name: gitea-config
          persistentVolumeClaim:
            claimName: {{ include "gitea-stack.sharedStorageClaimName" . }}
{{- end }}
