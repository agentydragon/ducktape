{{- if .Values.emberBootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-ember-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.componentLabels" (dict "context" . "component" "ember-bootstrap") | indent 4 }}
spec:
  template:
    spec:
      serviceAccountName: {{ include "gitea-stack.emberServiceAccountName" . }}
      restartPolicy: OnFailure
      containers:
        - name: configure-ember
          image: "{{ .Values.emberBootstrap.image.repository }}:{{ .Values.emberBootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.emberBootstrap.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA_WORK_DIR
              value: "{{ .Values.emberBootstrap.pvcMountPath }}"
            - name: GITEA_CUSTOM
              value: "{{ .Values.emberBootstrap.pvcMountPath }}/gitea"
            - name: GITEA_BASE_URL
              value: "{{ .Values.emberBootstrap.baseUrl }}"
            - name: EMBER_USERNAME
              value: "{{ .Values.emberBootstrap.username }}"
            - name: EMBER_EMAIL
              value: "{{ .Values.emberBootstrap.email }}"
            - name: EMBER_NAMESPACE
              value: "{{ .Values.emberBootstrap.secretNamespace }}"
            - name: EMBER_SECRET_NAME
              value: "{{ .Values.emberBootstrap.secretName }}"
            - name: EMBER_TOKEN_NAME
              value: "{{ .Values.emberBootstrap.tokenName }}"
            - name: EMBER_TOKEN_SCOPES
              value: "{{ .Values.emberBootstrap.tokenScopes }}"
            - name: EMBER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emberBootstrap.passwordSecretName }}
                  key: {{ .Values.emberBootstrap.passwordSecretKey }}
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              echo "Installing python runtime..."
              apk add --no-cache python3 py3-requests >/dev/null
              python3 {{ .Values.emberBootstrap.scriptPath }}
          volumeMounts:
            - name: gitea-config
              mountPath: {{ .Values.emberBootstrap.pvcMountPath }}
            - name: bootstrap-scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: gitea-config
          persistentVolumeClaim:
            claimName: {{ include "gitea-stack.sharedStorageClaimName" . }}
        - name: bootstrap-scripts
          configMap:
            name: {{ include "gitea-stack.emberScriptConfigMapName" . }}
            defaultMode: 0750
{{- end }}
