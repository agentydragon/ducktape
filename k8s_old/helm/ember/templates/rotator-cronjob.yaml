{{- if .Values.rotator.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-rspcache-key-rotator" (include "ember.fullname" .) }}
  labels:
    {{- include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/component" "rotator")) | nindent 4 }}
spec:
  schedule: {{ .Values.rotator.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: {{ printf "%s-rspcache-key-rotator" (include "ember.fullname" .) }}
        spec:
{{ include "common.renderImagePullSecrets" . | indent 10 }}
          serviceAccountName: {{ include "ember.rotatorServiceAccountName" . }}
          restartPolicy: {{ .Values.rotator.restartPolicy }}
          containers:
            - name: rotator
              image: "{{ .Values.rotator.image.repository }}:{{ .Values.rotator.image.tag }}"
              imagePullPolicy: {{ .Values.rotator.image.pullPolicy }}
              env:
                - name: ADMIN_URL
                  value: {{ .Values.rotator.adminUrl | quote }}
                - name: SECRET_NAME
                  value: {{ .Values.rotator.secretName | quote }}
                - name: UPSTREAM_ALIAS
                  value: {{ .Values.rotator.upstreamAlias | quote }}
                - name: DEPLOYMENT_NAME
                  value: {{ default (include "ember.fullname" .) .Values.rotator.deploymentName | quote }}
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              command:
                - python
                - /opt/rotator/rspcache_key_rotator.py
              volumeMounts:
                - name: rotator-script
                  mountPath: /opt/rotator
                  readOnly: true
          volumes:
            - name: rotator-script
              configMap:
                name: {{ printf "%s-rotator-script" (include "ember.fullname" .) }}
                defaultMode: 0755
{{- end }}
