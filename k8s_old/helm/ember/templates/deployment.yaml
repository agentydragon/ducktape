apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ember.fullname" . }}
  labels:
    {{- include "common.labelsWith" (dict "context" . "extra" (dict "app.kubernetes.io/component" "agent")) | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ember.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "ember.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
        {{- range $k, $v := .Values.podLabels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- if .Values.podAnnotations }}
      annotations:
        {{- range $k, $v := .Values.podAnnotations }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- end }}
    spec:
{{ include "common.renderImagePullSecrets" . | indent 6 }}
      restartPolicy: Always
      serviceAccountName: {{ include "ember.serviceAccountName" . }}
      containers:
        - name: emberd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: EMBER_CONFIG_FILE
              value: /etc/ember/ember.toml
          volumeMounts:
            - name: history
              mountPath: {{ .Values.config.state.dir | quote }}
            - name: config
              mountPath: /etc/ember
              readOnly: true
            - name: runtime-secrets
              mountPath: /var/run/ember/secrets
              readOnly: true
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: history
          persistentVolumeClaim:
            claimName: {{ include "ember.pvcName" . }}
        - name: config
          configMap:
            name: {{ include "ember.configName" . }}
        - name: runtime-secrets
          projected:
            sources:
              - secret:
                  name: {{ .Values.runtimeSecrets.matrixTokenSecret }}
                  items:
                    - key: {{ .Values.runtimeSecrets.matrixAccessTokenKey }}
                      path: matrix_access_token
              - secret:
                  name: {{ .Values.runtimeSecrets.giteaSecret }}
                  items:
                    - key: {{ .Values.runtimeSecrets.giteaTokenKey }}
                      path: gitea_token
              - secret:
                  name: {{ .Values.runtimeSecrets.rspcacheClientSecret }}
                  items:
                    - key: {{ .Values.runtimeSecrets.rspcacheApiKeyKey }}
                      path: openai_api_key
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
