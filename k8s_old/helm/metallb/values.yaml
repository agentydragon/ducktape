nameOverride: ""
fullnameOverride: ""

namespace:
  create: false
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

pools:
  - name: default-pool
    spec:
      addresses:
        - 10.0.200.100-10.0.200.119

l2Advertisements:
  - name: default
    spec:
      ipAddressPools:
        - default-pool
