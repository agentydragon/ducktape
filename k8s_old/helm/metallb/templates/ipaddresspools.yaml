{{- $pools := .Values.pools | default (list) -}}
{{- range $index, $pool := $pools }}
{{- if gt $index 0 }}---
{{- end }}
{{- $name := required "pools[].name is required" $pool.name }}
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
{{ include "metallb.labels" $ | indent 4 }}
spec:
{{ toYaml (default dict $pool.spec) | indent 2 }}
{{- end }}
{{- if not $pools }}
# No IPAddressPools configured
{{- end }}
