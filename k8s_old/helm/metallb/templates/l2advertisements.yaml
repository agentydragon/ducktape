{{- $ads := .Values.l2Advertisements | default (list) -}}
{{- range $index, $adv := $ads }}
{{- if gt $index 0 }}---
{{- end }}
{{- $name := required "l2Advertisements[].name is required" $adv.name }}
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
{{ include "metallb.labels" $ | indent 4 }}
spec:
{{ toYaml (default dict $adv.spec) | indent 2 }}
{{- end }}
{{- if not $ads }}
# No L2Advertisements configured
{{- end }}
