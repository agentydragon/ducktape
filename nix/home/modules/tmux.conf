# Pane border titles - show pane title or current command
set -g pane-border-status top
set -g pane-border-format ' #{?pane_title,#{pane_title},#{pane_current_command}} '

# Window/Pane titles
# Propagate the pane title (set by apps via OSC 0/2, e.g. claude) verbatim
# to the outer terminal. Using #{pane_title} rather than #W avoids
# automatic-rename later clobbering the app-set title in the window name.
set -g set-titles on
set -g set-titles-string '#{pane_title}'
set -g allow-rename on
set -g automatic-rename on

# Status bar update interval
set -g status-interval 2

# Forward terminal focus changes to apps running inside tmux.
set -g focus-events on

# Start panes at 1 (like windows)
setw -g pane-base-index 1

# Enable vi mode in copy mode
setw -g mode-keys vi

# Split bindings (| for horizontal, - for vertical)
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Pane navigation with vim keys (h/j/k/l) - repeatable with prefix
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
set -g repeat-time 400
bind -T prefix -r h select-pane -L
bind -T prefix -r j select-pane -D
bind -T prefix -r k select-pane -U
bind -T prefix -r l select-pane -R

# Resize panes with Alt + arrows
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
# M-Up reserved for Codex CLI (queued prompt retrieval), so leave it unbound here.
unbind -n M-Up
bind -n M-Down  resize-pane -D 2

# Clipboard integration
set -g set-clipboard on

# Copy mode (vi) key bindings (tmux-yank handles clipboard integration via xclip)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-line

# Status bar configuration
set -g status-left-length 60
set -g status-right-length 60
# Colours come from the Solarized theme sourced at the end (the @sol_* options,
# populated from nix-colors); they re-expand each redraw so the bar tracks
# light/dark theme switches live.
set -g status-left "#[fg=#{@sol_accent},bold]#S #[fg=#{@sol_muted}]│ #[fg=#{@sol_fg},nobold]#I:#W "
# Windows show the (OSC-modifiable) pane title, truncated with an ellipsis;
# falls back to the running command, matching pane-border-format.
#
# Tabs are one space apart (empty separator, each window emits one trailing
# space). To keep that single gap while highlighting *both* sides of the active
# tab: the active window's own trailing space is painted by
# window-status-current-style, and a non-active window highlights its trailing
# space only when the *next* window is the active one (#{active_window_index}
# == this index + 1) — i.e. the window immediately left of the active tab tints
# the shared gap. Net effect: symmetric single-space highlight around the
# active tab with no double gaps.
#
# TODO: the active tab's left-gap highlight is emitted by whichever window has
# index == active-1, so it goes missing whenever no such window sits directly
# left of the active tab: (a) the active tab is the first window — the left gap
# is status-left's trailing space, outside this format's control; (b) indices
# aren't contiguous (renumber-windows is off, so closing a middle window leaves
# a hole and active-1 is no longer the real left neighbor). Both degrade
# gracefully — spacing stays single, only the left highlight drops. Fixes:
# condition status-left's trailing space on active_window_index == 1 for (a);
# `renumber-windows on` would remove the holes behind (b).
set -g window-status-separator ""
set -g window-status-format "#I:#{=/24/…:#{?pane_title,#{pane_title},#{pane_current_command}}}#{?#{==:#{active_window_index},#{e|+:#{window_index},1}},#[bg=#{@sol_accent}],} "
set -g window-status-current-format "#I:#{=/24/…:#{?pane_title,#{pane_title},#{pane_current_command}}} "
# Show the login user only when it isn't the usual account. Both the name and
# its separator are emitted by grep, so the " │ " before the clock disappears
# together with the name (no floating separator on the primary account).
set -g status-right "#{prefix_highlight}#[fg=#{@sol_fg}] #(whoami | grep -vFx agentydragon)#[fg=#{@sol_muted}]#(whoami | grep -qvFx agentydragon && printf ' │ ')#[fg=#{@sol_fg}]%Y-%m-%d %H:%M "

# Plugin settings
# prefix-highlight configuration
set -g @prefix_highlight_show_copy_mode on
set -g @prefix_highlight_show_sync_mode on

# Ensure tmux refreshes SSH-related env vars when reattaching locally, so p10k context
# doesn't think we're still in an old SSH session.
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION"

# tmux-resurrect settings
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'

# tmux-continuum settings
set -g @continuum-restore 'on'

# Enable true color support for xterm-256color terminals
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable hyperlink support (OSC 8) for clickable links in terminal
set -as terminal-features ',*:hyperlinks'
