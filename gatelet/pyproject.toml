[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gatelet"
version = "0.1.0"
description = "LLM-friendly API for Home Assistant and webhooks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "agentydragon", email = "agentydragon@example.com"},
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.2",
    "SQLAlchemy>=2.0.0",
    "types-sqlalchemy>=1.4.53",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.6",
    "asyncpg>=0.27.0",
    "cryptography>=41.0.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.9",
    "pydantic>=2.4.0",
    "compact_json>=1.0.0",
    "homeassistant-api",
    'passlib',
    "tomlkit",
    'fastapi-csrf-protect',
    'fastapi-users[sqlalchemy,argon2]',
    'fastapi-sessions',

    # ActivityWatch stuff
    'aw-client',
    'aw-core', # bundles: 'aw-query', 'aw-transform',

    "oura", # Oura API: https://github.com/turing-complet/python-ouraring
    # TODO: google - activity?
    "python-metar", # weather
    # "withings-api", # TODO: scale, later

    # weather
    "pyowm", # live weather, forecasts
    "aqipy",
    "meteostat",
    "geopy",  # geocoding: gps -> place name

    # google cal
    "google-api-python-client",
    "google-auth",


    # Not anytime soon:
    #   Smart home extra:         pytradfri, pywizlight
    #   NextCloud/Apple Calendar: caldav
    #   Finance:                  yfinance, ccxt
    #   Fitness:                  strava, pytrain (Apple Fitness), polaracceslink, garminconnect, fitbit
    #   Time tracking:            py-toggl, rescuetime-py
    #   LLM helpers:              openai, tiktoken, anthropic
]

[project.optional-dependencies]
dev = [
    "pytest==7.3.1",
    "pytest-asyncio==0.21.0",
    "pytest-timeout==2.2.0",
    "isort==5.12.0",
    "pyhamcrest==2.0.4",
    "httpx==0.24.1",
    "pytest-postgresql==4.1.1",
    "sqlalchemy-stubs==0.4.0",
    "playwright",
    "pytest-playwright",
    "invoke",
]

[project.scripts]
gatelet-reporter = "gatelet.reporter:main"



[tool.setuptools]
package-dir = {"" = "."}

# Automatically include every Python package that is part of the ``gatelet``
# namespace (``gatelet`` itself, ``gatelet.server`` and any future
# sub-packages).
# Discover all sub-packages called ``gatelet`` or starting with that prefix.
#
# ``namespaces = true`` tells setuptools that some of those packages may be
# namespace packages – i.e. they might not contain an ``__init__.py``.  This is
# handy when the root package only acts as a namespace and the real, importable
# modules live further down the tree (``gatelet.server`` & friends).  It also
# prevents the *“package directory './gatelet' does not exist”* installation
# error when the namespace folder is present but empty (the situation inside
# the autonomous-agent container).
packages = { find = { where = ["."], include = ["gatelet*"], namespaces = true } }

# Include non-Python assets for the server component (HTML templates, CSS,
# …).  They live under ``gatelet/server`` so we reference the fully-qualified
# package name.
include-package-data = true

[tool.setuptools.package-data]
"gatelet.server" = [
    "templates/*",
    "static/**/*",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["server"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
lint.per-file-ignores = {"gatelet/tasks.py" = ["INP001"]}
