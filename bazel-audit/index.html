<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bazel target and wiring audit · Ducktape</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript
      >This report uses JavaScript for Mantine components and charts.</noscript
    >
    <script type="module">
      import {
        Anchor,
        Container,
        Group,
        Paper,
        Stack,
        Text,
        Title,
      } from "@mantine/core";
      import { html, mount } from "../report.js";
      const response = await fetch("./evidence.json");
      if (!response.ok) throw new Error("Could not load the Bazel audit");
      const audit = await response.json();
      function Report() {
        return html`<${Container} component="main" size="60rem" py="xl">
          <${Anchor} href="../">Ducktape reports<//>
          <${Title} order=${1} mt="md">Bazel target and wiring audit<//>
          <${Text} size="lg" my="md"
            >The typed-lint roster covers all 329 frontend source files at
            d1402061ea. A simulated omission dropped six. The next build
            experiment is to measure checker-only provider dependencies in one
            consumer.<//
          >
          <${Group} gap="md" mb="xl"
            ><${Text} c="dimmed">22 November 2026 UTC<//>
            <${Anchor}
              href=${"https://github.com/agentydragon/ducktape/tree/" + audit.source_devel_commit}
              >Wiring review ${audit.source_devel_commit.slice(0, 10)}<//
            >
            <${Anchor}
              href=${"https://github.com/agentydragon/ducktape/tree/" + audit.coverage_followup.source_devel_commit}
              >Roster
              ${audit.coverage_followup.source_devel_commit.slice(0, 10)}<//
            >
            <${Anchor} href="evidence.json"
              >Evidence and query expressions<//
            ><//
          >
          <${Stack} gap="md"
            >${audit.findings.map(
              (item) =>
                html`<${Paper}
                  key=${item.id}
                  id=${item.id}
                  component="section"
                  withBorder
                  radius="md"
                  p="lg"
                >
                  <${Title} order=${2} size="h3">${item.title}<//>
                  <${Text} my="sm">${item.finding}<//
                  ><${Text} my="sm">${item.action}<//>
                  <${Group} gap="md"
                    >${Object.entries(item.links).map(([label, url]) => html`<${Anchor} key=${url} href=${url} size="sm">${label}<//>`)}<//
                  >
                <//>`,
            )}<//
          ><//
        >`;
      }
      mount(Report);
    </script>
  </body>
</html>
