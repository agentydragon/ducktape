# Deb packages layered on debian:trixie-slim for the CPAP sync container.
# Cluster jobs use the Wyrm2 CPAP gateway and only need the HTTP client plus git;
# the WiFi packages remain for direct manual runs near the card. Git clones/pushes
# the cpap-data Forgejo repo via https://git.allegedly.works. The CA bundle it needs comes from
# //third_party/debian_slim:cacerts, not this apt layer.
#
# Regenerate the lock file after any change:
#   bazel run @trixie_cpap_sync//:lock
version: 1

sources:
  - channel: trixie main
    url: https://snapshot.debian.org/archive/debian/20260301T000000Z
  - channel: trixie-security main
    url: https://snapshot.debian.org/archive/debian-security/20260301T000000Z

archs:
  - "amd64"

packages:
  - "isc-dhcp-client"
  - "git"
  - "iproute2"
  - "iw"
  - "wpasupplicant"
