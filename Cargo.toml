cargo-features = ["edition2024"]

[package]
name = "ducktape"
version = "0.0.1"
authors = ["Rai <agentydragon@gmail.com>"]
edition = "2024"

[dependencies]
log = "^0.4.29"
env_logger = "^0.11.8"
# rust_decimal must use `serde-arbitrary-precision` to match `serde_json`, which
# is built with `arbitrary_precision` on workspace-wide (feature unification).
# Any other format (or `serde` alone) deserializes a JSON number as
# "invalid type: map, expected a Decimal type" — `serde-float` only works when
# serde_json lacks `arbitrary_precision`, which it does not here.
rust_decimal = { version = "^1.40.0", features = ["serde-arbitrary-precision"] }
tokio = { version = "^1.49.0", features = ["macros", "rt-multi-thread", "net", "process", "signal", "time", "fs", "sync", "io-util", "io-std"], default-features=false}
# native-tls makes trouble
reqwest = {version="^0.12.28", features=["json", "rustls-tls"], default-features=false}
serde = {version="^1.0.228", features=["derive"]}
url = {version="^2.5.8", features=["serde"]}
serde_json = "^1.0.149"
# worthy
chrono = {features=["serde"], version="^0.4.43"}
chrono-tz = "^0.10.4"
serde-xml-rs = "^0.8.2"
petgraph = "^0.8.3"
rustc-hash = "^2.1.2"
# debundle selector index: roaring bitmaps for posting-list intersection
roaring = "^0.10.12"
# debundle relational-selector solver: in-process Datalog (CQ over the program graph)
ascent = "^0.8.0"
# debundle: derive enum -> wire-string (snake_case) so kind spellings aren't hand-rolled
strum = { version = "^0.27", features = ["derive"] }
#tokio = { version = "*", features = ["full", "time"] }
warp = "^0.4.2"
futures = "^0.3.31"
rusty-money = "^0.4.2"
serde_yaml = "^0.9.34"
structopt = "^0.3.26"
xdg = "^3.0.0"
alphavantage = "^0.7.1"
shellexpand = "^3.1.1"
currency_layer = "^0.2.0"
async-trait = "^0.1.89"
rust_decimal_macros = "^1.40.0"
term-table = "^1.4.0"
uuid = { version="^1.19.0", features=["v4"] }
shlex = "^1.3.0"
glob = "^0.3.3"
csv = "^1.4.0"
scraper = "^0.26.0"
# process_api RE dependencies
tokio-tungstenite = "^0.29.0"
tokio-vsock = "^0.7.2"
hyper = { version = "^1.8.1", features = ["http1", "server"] }
hyper-util = { version = "^0.1.19", features = ["tokio"] }
http = "^1.4.0"
http-body-util = "^0.1.3"
clap = { version = "^4.5.58", features = ["derive", "env"] }
nix = { version = "^0.31.1", features = ["signal", "process", "fs"] }
# claude-hook (Rust hook daemon)
axum = { version = "^0.8.4", features = ["json"] }
tower = "^0.5.2"
tempfile = "^3.20.0"
bytes = "^1.11.0"
parking_lot = "^0.12.5"
libc = "^0.2.172"
jsonwebtoken = "^9.3.1"
# x/twenty_questions_frameworks/rig
anyhow = "^1.0"
object_store = { version = "^0.13.2", features = ["aws"] }
sea-orm = { version = "1.1.17", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-json"] }
sha2 = "^0.11.0"
# rig-core's default `reqwest-rustls` feature pulls aws-lc-rs → aws-lc-sys (needs cmake).
# Use native-tls instead (system OpenSSL on Linux, no cmake required).
rig-core = { version = "^0.33.0", default-features = false, features = ["derive", "reqwest-native-tls"] }
bollard = "^0.20.2"
swc_atoms = "^9.0.0"
swc_common = { version = "^21.0.1", features = ["concurrent"] }
swc_ecma_ast = "^23.0.0"
swc_ecma_codegen = "^26.0.1"
swc_ecma_parser = "^39.0.1"
swc_ecma_transforms_base = "^42.0.0"
swc_ecma_utils = "^29.1.1"
swc_ecma_visit = "^23.0.0"
relative-path = "^2.0.1"
lol_html = "^2.8.1"
humantime = "^2.3.0"
rayon = "^1.12.0"
regex = "^1.12.3"
# debundle property-based test suites (test-only consumer; single
# [dependencies] section because crate_universe pins one root manifest)
proptest = "^1.6.0"
# tana/firebase_session_extractor
rusty-leveldb = "^4.0.1"
v8_valueserializer = "^0.1.2"
prometheus = "^0.13.4"
# x/codex_execpolicy_audit — pulled in so crate_universe renders them into @crates
# for the overlaid codex-shell-command + codex-utils-absolute-path BUILD files.
# Versions pinned to openai/codex's workspace deps for API compatibility.
base64 = "0.22.1"
dirs = "6"
dunce = "1.0.4"
once_cell = "1.20.2"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
which = "8"
# codex-utils-absolute-path (a dep of codex-shell-command) derives JsonSchema + TS.
schemars = "0.8.22"
ts-rs = "11"
# codex-execpolicy (the real Starlark rule engine) deps.
multimap = "0.10.0"
starlark = { version = "0.14.2", default-features = false }
thiserror = "2.0.17"
# finance/augur/rust: the simulator's in-process Python extension. `extension-module`
# keeps libpython out of the link line so Bazel builds a cdylib the interpreter loads.
pyo3 = { version = "^0.27.2", features = ["extension-module"] }

[[bin]]
name = "ducktape_fake"
path = "main.rs"

# Only generate BUILD files for Linux.
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "debundle_rust"
path = "devinfra/js/debundle/rust/src/main.rs"
