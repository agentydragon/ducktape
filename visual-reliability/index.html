<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Visual reliability</title>

    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/core@9.6.1/styles.css"
      integrity="sha384-i9tDmARQSxqmzSCjbU/VkZGPbv8PjopI///D0KBD2i8+Y/wjaqYR8TDcV69RytF8"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../report.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mantine/charts@9.6.1/styles.css"
      integrity="sha384-SAaixzmOuoOlEdvk2Tg+2gOI+7JIMU05jOmxjegc3CUuKmNXOkUNkFwM93V7hSId"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0?target=es2022",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?target=es2022",
          "react-dom": "https://esm.sh/react-dom@19.3.0?external=react&target=es2022",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react&target=es2022",
          "@mantine/core": "https://esm.sh/@mantine/core@9.6.1?bundle&external=react,react-dom&target=es2022",
          "@mantine/hooks": "https://esm.sh/@mantine/hooks@9.6.1?external=react&target=es2022",
          "@mantine/charts": "https://esm.sh/@mantine/charts@9.6.1?bundle&external=react,react-dom,@mantine/core,@mantine/hooks,recharts&target=es2022",
          "recharts": "https://esm.sh/recharts@3.3.0?bundle&external=react,react-dom,react-is&target=es2022",
          "react-is": "https://esm.sh/react-is@19.3.0?target=es2022",
          "htm": "https://esm.sh/htm@3.1.1?target=es2022"
        }
      }
    </script>
    <script>
      document.documentElement.dataset.mantineColorScheme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="report-content"></div>
    <noscript>This report uses JavaScript for charts and disclosures.</noscript>
    <script type="module">
      import { useState } from "react";
      import {
        Accordion,
        Anchor,
        Box,
        Code,
        Container,
        Group,
        SegmentedControl,
        Stack,
        Table,
        Text,
        TextInput,
        Title,
      } from "@mantine/core";
      import { BarChart } from "@mantine/charts";
      import { html, mount } from "../report.js";
      const evidenceSha =
        "83c15841d6f8e7d444c1953595619908574f27c3880c19f978d03b5bb5175e73";
      const response = await fetch(`./evidence.json?v=${evidenceSha}`);
      if (!response.ok) throw new Error(`Evidence HTTP ${response.status}`);
      const bytes = await response.arrayBuffer();
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      const receivedSha = Array.from(new Uint8Array(digest), (byte) =>
        byte.toString(16).padStart(2, "0"),
      ).join("");
      if (receivedSha !== evidenceSha)
        throw new Error("Evidence does not match this report");
      const e = JSON.parse(new TextDecoder().decode(bytes));
      const gh = "https://github.com/agentydragon/ducktape";
      const archive =
        gh +
        "/blob/" +
        e.previous_report_commit +
        "/visual-reliability/index.html";
      const link = (href, label) => html`<${Anchor} href=${href}>${label}<//>`;
      const pr = (n) => link(`${gh}/pull/${n}`, `#${n}`);
      const source = (path, label) =>
        link(`${gh}/blob/${e.source_devel_commit}/${path}`, label);
      const inv = (id, label) =>
        link(
          "https://app.buildbuddy.io/invocation/" + id,
          label || id.slice(0, 8),
        );
      const table = (headers, rows, width = 560) =>
        html` <${Table.ScrollContainer}
          minWidth=${width}
          type="native"
          maw="100%"
        >
          <${Table} striped verticalSpacing="sm">
            <${Table.Thead}
              ><${Table.Tr}
                >${headers.map((header) => html`<${Table.Th} key=${header}>${header}<//>`)}<//
              ><//
            >
            <${Table.Tbody}
              >${rows.map((row, i) => html`<${Table.Tr} key=${i}>${row.map((value, j) => html`<${Table.Td} key=${j}>${value}<//>`)}<//>`)}<//
            >
          <//>
        <//>`;
      const disclosure = (label, contents) =>
        html` <${Accordion}
          variant="contained"
          mt="sm"
          defaultValue=${location.hash && label.startsWith("Earlier") ? label : null}
          ><${Accordion.Item} value=${label}>
            <${Accordion.Control}>${label}<//
            ><${Accordion.Panel}>${contents}<//>
          <//><//
        >`;
      const minutes = (s) =>
        s == null
          ? "—"
          : `${Math.floor(Math.round(s) / 60)}m ${String(Math.round(s) % 60).padStart(2, "0")}s`;
      const header = (title, lede) =>
        html` <header>
          ${link("../", "Ducktape reports")}
          <${Title} order=${1} my="sm">${title}<//>
          <${Text} size="lg">${lede}<//>
          <${Text} mt="sm" size="sm" c="dimmed"
            >Inspected devel <${Code}>${e.source_devel_commit}<//><//
          >
        </header>`;
      const footer = () =>
        html`<footer>
          <${Group} gap="md">
            ${link("./evidence.json", "Reviewed evidence")}
            ${link("./manifest.json", "Manifest")}
            ${link(archive, "Previous snapshot")} ${link("../", "All reports")}
          <//>
        </footer>`;

      function Report() {
        const f = e.visual_operation_failure;
        const c = e.chart_candidate;
        return html`<${Container}
          component="main"
          size="73rem"
          py="xl"
          style=${{ overflowWrap: "anywhere" }}
        >
          <${Stack} gap="xl">
            ${header("Visual reliability", "A visual operation case captured a 2,598 CSS px discrepancy between the mounted editor and its parked placeholder. The visual History index shows many passing records, but all 16 evenly spaced pass records inspected here reused cached results.")}
            <section id="open-title">
              <${Title} order=${2}>Qualify editor height before parking<//>
              <${Text} my="sm"
                >On the failing desktop run, the editor measured 3,372.28 CSS px
                before scrolling. The parked placeholder measured 774.25 CSS px,
                against a 1 px tolerance. The test sampled initial height after
                the editor attached and sampled the placeholder after scrolling.
                The log leaves open whether the initial read, the last committed
                editor measurement or the parked geometry was stale.
                ${inv(f.invocation, "Failed test and log")}<//
              >
              <${Text} my="sm"
                >#18979 moved the case to the Action-specific harness at
                <${Code}
                  >//agentplane/app/frontend/actions:visual_operation_presentation<//
                >. If the mismatch recurs, sample heights around CodeMirror’s
                measurement and the ResizeObserver delivery before making
                readiness wait for a committed geometry. Retain the
                parked-height, narrow remount and text-selection assertions.
                ${pr(18979)} ·
                ${source("agentplane/app/frontend/actions/test_visual_operation_presentation.py#L83", "Current test")}<//
              >
              <${Text} my="sm"
                >One uncached current devel RBE run passed the moved target.
                Keep the exact geometry check while gathering repeat exposure.
                ${inv(e.current_source_control.invocation, "Current-source control")}<//
              >
            </section>
            <section>
              <${Title} order=${2}>Visual History exposure<//>
              <${Text} my="sm"
                >Across 15 November 00:00 through 22 November 10:00 UTC the
                BuildBuddy target index recorded 1,127 passes and three failed
                builds for <${Code}>${e.visual_target}<//>. All three
                failed-build records lacked a TestResult. The 16 evenly spaced
                pass records inspected had four cached runs each and zero linked
                originating TestRunner actions. The window-wide number of fresh
                runs is unknown.<//
              >
              ${disclosure(
                "Reviewed history records",
                table(
                  [
                    "Tested source",
                    "Indexed outcome",
                    "Cached runs",
                    "Invocation",
                  ],
                  e.visual_samples.map((r) => [
                    r.commit.slice(0, 10),
                    r.recorded,
                    r.targets.length ? r.targets[0].cached : "—",
                    inv(r.invocation),
                  ]),
                ),
              )}
            </section>
            <section>
              <${Title} order=${2}
                >Leave the Chart.js patch pending a current reproduction<//
              >
              <${Text} my="sm"
                >Spending History still mounts Chart.js 4.5.1. #10753 remains
                open on its 16 October head. A Git merge simulation against
                current devel found conflicts in
                ${c.merge_conflicts.join(", ")}. Start with the current spending
                chart and a desktop-to-mobile resize or dataset-toggle witness
                before porting the library patch. Its old green checks cover its
                original source tree. ${link(c.url, "Chart.js candidate")} ·
                ${source("finance/plaid/spend/ui/SpendingHistoryChart.tsx", "Current Spending History chart")}<//
              >
            </section>
            <section id="history-title">
              <${Title} order=${2}>Earlier visual investigations<//>
              <${Text} my="sm"
                >Scroll framing and capture identity fixes remain in the
                previous reviewed snapshot with their original measurements.
                ${link(archive, "9 November review")}<//
              >
            </section>

            ${footer()}
          <//>
        <//>`;
      }
      mount(Report);
    </script>
  </body>
</html>
