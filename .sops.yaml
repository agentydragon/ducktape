  - path_regex: tf/gitops/litellm-keys/litellm-tana-clients-key\.yaml$
    key_groups:
      - age:
          - *admin
          - *litellm-clients
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  # codex-clients virtual key (laptop + agent-box codex-claude; codex-pod receives it via
  # the reflected kubernetes_secret, not sops). Reuses the narrow litellm-clients key.
  - path_regex: tf/gitops/litellm-keys/litellm-codex-clients-key\.yaml$
    key_groups:
      - age:
          - *admin
          - *litellm-clients
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
          - *agent-box-codex-user
  # gemini-clients virtual key (laptop gemini-claude — laptop-only). Reuses the narrow
