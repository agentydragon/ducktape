creation_rules:
  # CLIProxyAPI client key: Flux applies and reflects it to codex-pod, while
  # workstation and agent-box Codex home-manager configs decrypt the same SSOT.
  # Must precede the generic cluster/k8s rule below.
  - path_regex: cluster/k8s/cli-proxy-api/client-key\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
          - *gecko-agentydragon
          - *agent-box-codex-user

  # DriveFS artifacts S3 gateway credentials, now hosted on the consolidated
  # public-s3 gateway. Flux applies the Secret (cluster-secrets), user machines
  # read writer credentials to upload new binaries (user keys), and
  # gaffer-private CI reads reader credentials to fetch binaries during builds
  # (CI key).
  - path_regex: cluster/k8s/seaweedfs/public-s3/drivefs-artifacts-credentials\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
          - *ci

  # Claude S3 credentials for the consolidated public-s3 gateway. Flux
  # applies the Secret and ESO assembles it into the gateway config
  # (cluster-secrets); Claude Code web sessions decrypt it directly (claude-web)
  # to use s3.allegedly.works: read across the allowed buckets, write only to
  # loom-gym (eval-run results).
  - path_regex: cluster/k8s/seaweedfs/public-s3/claude-reader-credentials\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *claude-web

  # BuildBuddy API key — the widest-audience shared credential here. Flux
  # applies the Secret and reflects it to the agent namespaces; the in-cluster
  # tofu-controller reads it from claude-sandbox to set the ducktape
  # BUILDBUDDY_API_KEY GitHub Actions secret (tf/gitops/github-secrets-sync);
  # and every workstation and agent identity that runs bbr decrypts this file
  # directly. Recipients are the union of the two rules this replaced, so no
  # reader lost access when the duplicate under secrets/ was removed. More
  # specific than the generic cluster/k8s/* rule below, so this match wins.
  - path_regex: cluster/k8s/agents/shared-secrets/buildbuddy-api-key\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
          - *gecko-agentydragon
          - *claude-web
          - *codex-cloud-agent
          - *agent-box-codex-user
          - *haku

  # Brave Search API key — Flux applies the Secret and the agent egress proxies
  # consume it in-cluster (cluster-secrets), AND workstations read it directly
  # as $BRAVE_API_KEY via ducktape.sopsEnv (user keys), so the subscription is
  # not duplicated into a second ciphertext under secrets/. More specific than
  # the generic cluster/k8s/* rule below, so this match wins.
  - path_regex: cluster/k8s/agents/shared-secrets/brave-search-api-key\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
          - *gecko-agentydragon

  # ActivityWatch central write token — Flux applies the Secret and the write-proxy
  # sidecar checks it (cluster-secrets), AND the synced desktops read the same value
  # as $AW_DEST_TOKEN for the importer (user keys). One value, both sides. More
  # specific than the generic cluster/k8s/* rule below, so this match wins.
  - path_regex: cluster/k8s/activitywatch/activitywatch-write-token\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon

  # tofu-state PG backend credentials — Flux applies the Secret, CNPG consumes it
  # in-cluster (cluster-secrets), AND tofu running on user machines needs to read
  # the password to set PG_CONN_STR (user keys). More specific than the generic
  # cluster/k8s/* rule below, so this match wins.
  - path_regex: cluster/k8s/tofu-state/db/credentials\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon

  # SeaweedFS per-tenant S3 credentials. Only accessKey/secretKey are
  # encrypted. Legacy files may also carry plaintext identity metadata and
  # ExternalSecret templates; operator-managed identities keep policy in the
  # Bucket/S3Identity resources instead. More specific than the generic
  # cluster/k8s/* rule below, so this match wins.
  - path_regex: cluster/k8s/seaweedfs/secrets/identities/.*\.sops\.yaml$
    encrypted_regex: ^(accessKey|secretKey)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets

  # Atuin user password: shared between the cluster-side user-provisioner Job
  # (which reads the password and writes the argon2 hash into atuin's DB) and
  # home-manager sops-nix on each NixOS host (which feeds the same plaintext
  # password to `atuin login`). Single source of truth — no duplication.
  # More specific than the generic cluster/k8s/* rule below, so this match wins.
  - path_regex: cluster/k8s/user-agentydragon/atuin-user-password\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
          - *gecko-agentydragon

  # Flux ntfy webhook: only the topic URL (address) is a capability/secret. The
  # ntfy message-template headers are non-secret presentation config, so keep
  # them plaintext (encrypted_regex matches address only) and out of the MAC
  # (mac_only_encrypted). Template tweaks can then be made without the age key
  # (agents/CI) while `address` stays encrypted. More specific than the generic
  # cluster/k8s/* rule below, so this match wins.
  - path_regex: cluster/k8s/flux-webhook/ntfy-webhook\.sops\.yaml$
    encrypted_regex: ^address$
    mac_only_encrypted: true
    key_groups:
      - age:
          - *admin
          - *cluster-secrets

  # This is an intentionally narrow, cluster-wide pull credential. Its
  # reflector policy and consumer inventory are plaintext operational metadata,
  # so keep them out of the MAC: adding a namespace grant must not require
  # decrypting or rotating the docker credential.
  - path_regex: cluster/k8s/forgejo-images/registry-creds\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    mac_only_encrypted: true
    key_groups:
      - age:
          - *admin
          - *cluster-secrets

  # Node-daemon routing credentials are one SSOT consumed by Flux in haku-console and by
  # sops-nix on the matching host. Each host can decrypt only its own credential.
  - path_regex: cluster/k8s/haku/console/node-daemon-wyrm2\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *wyrm2-host

  - path_regex: cluster/k8s/haku/console/node-daemon-rugged\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *rugged-host

  - path_regex: cluster/k8s/haku/console/node-daemon-atlas\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *atlas-host

  # AIQuota's read-only bearer is also consumed by the local CLI/GNOME clients.
  # Keep the same token as the cluster Secret, but let the configured user
  # identities decrypt it without granting them access to other cluster secrets.
  - path_regex: cluster/k8s/aiquota/aiquota-api-bearer\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *wyrm2-host
          - *rugged-host
          - *atlas-host
          - *iguana-host
          - *gecko-host
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
          - *gecko-agentydragon

  # Cluster, Props, and Wayback deployment secrets (Flux + admin can decrypt).
  - path_regex: (cluster/k8s|props/deploy/secrets|loom/wayback/deploy/secrets)/.*\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *cluster-secrets

  # --- CI secrets (admin + CI key) ---
  - path_regex: secrets/ci/.*\.sops\.yaml$
    key_groups:
      - age:
          - *admin
          - *ci

  # ducktape-automation GitHub App private key (RSA PEM, SOPS binary).
  # Decryptable by admin, in-cluster Flux, and CI. CI here covers both
  # ducktape and gaffer-private GHA — they share the same age key today
  # (synced by tf/gitops/github-secrets-sync). TODO: consider splitting
  # &ci into separate &ducktape-ci and &gaffer-ci recipients. Concretely,
  # the existing CI rule above (`secrets/ci/.*\.sops\.yaml$`) currently
  # encrypts BOTH `secrets/ci/attic-main-writer.sops.yaml` (ducktape CI's
  # cache:rw) and `secrets/ci/attic-gaffer-writer.sops.yaml` (gaffer CI's
  # cache:rw) to the shared `&ci` recipient — so a compromise of either
  # repo's age key grants access to both writer tokens. Splitting would
  # mean the gaffer-ci token is only decryptable by gaffer's age key,
  # and vice versa.
  - path_regex: secrets/ducktape-automation\..*\.private-key\.sops\.pem$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *ci
  - path_regex: secrets/ducktape-automation\..*\.client-secret\.sops\.txt$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *cluster-secrets
          - *ci

  # --- Nebula private keys (SOPS binary, admin + host) ---
  - path_regex: secrets/nebula/ca\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  # Tofu reads Talos node keys while assembling machine configuration; Talos
  # itself never decrypts these files. Keep them recoverable by every operator
  # identity that can run the Terraform root, rather than by a host-only key.
  - path_regex: secrets/nebula/(optiplex|ovh-[a-z0-9-]+)\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  - path_regex: secrets/nebula/wyrm2\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *wyrm2-host
  - path_regex: secrets/nebula/rugged\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *rugged-host
  - path_regex: secrets/nebula/atlas\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *atlas-host
  - path_regex: secrets/nebula/iguana\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *iguana-host
  # Mobile Nebula import keys are admin-only in git; the generated plaintext
  # import file installs the key into the phone's app keystore.
  - path_regex: secrets/nebula/pixel6\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin

  # --- Per-host attic reader tokens (admin + host + user) ---
  # Combined NixOS+HM file: NixOS daemon decrypts via host key for
  # /etc/nix/attic-netrc; home-manager decrypts via user key for
  # ~/.config/attic/config.toml. Auto-rotated by attic-token-rotation
  # CronJobs in the cluster.
  # Must precede the broader `secrets/hosts/<host>-.*\.yaml$` rules below.
  - path_regex: secrets/hosts/wyrm2-attic\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-host
          - *wyrm2-agentydragon
  - path_regex: secrets/hosts/rugged-attic\.yaml$
    key_groups:
      - age:
          - *admin
          - *rugged-host
          - *rugged-agentydragon
  - path_regex: secrets/hosts/atlas-attic\.yaml$
    key_groups:
      - age:
          - *admin
          - *atlas-host
          - *atlas-agentydragon
  - path_regex: secrets/hosts/iguana-attic\.yaml$
    key_groups:
      - age:
          - *admin
          - *iguana-host
          - *iguana-agentydragon
  - path_regex: secrets/hosts/gecko-attic\.yaml$
    key_groups:
      - age:
          - *admin
          - *gecko-host
          - *gecko-agentydragon
  # agent-box VM attic reader: NixOS daemon decrypts via the host key, the codex
  # user's home-manager via its user key. Must precede secrets/hosts/agent-box-.*.
  - path_regex: secrets/hosts/agent-box-attic\.yaml$
    key_groups:
      - age:
          - *admin
          - *agent-box-host
          - *agent-box-codex-user

  # wyrm2 gnome-remote-desktop system-RDP TLS pair (admin + host). The system
  # daemon decrypts via the host key; the cert is public but encrypted alongside
  # the key for an atomic pair (no plain secret committed).
  - path_regex: secrets/hosts/wyrm2-rdp-tls\.sops\.(crt|key)$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *wyrm2-host

  # --- Per-host secrets (admin + host) ---
  - path_regex: secrets/hosts/wyrm2-.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-host
  - path_regex: secrets/hosts/rugged-.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *rugged-host
  - path_regex: secrets/hosts/atlas-.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *atlas-host
  - path_regex: secrets/hosts/iguana-.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *iguana-host
  - path_regex: secrets/hosts/gecko-.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *gecko-host
  - path_regex: secrets/hosts/agent-box-.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *agent-box-host

  # --- SSH keys (SOPS binary, admin + owning host's user key) ---
  - path_regex: ssh_keys/wyrm2-.*\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *wyrm2-agentydragon
  - path_regex: ssh_keys/iguana-.*\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *iguana-agentydragon
  - path_regex: ssh_keys/rugged-.*\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *rugged-agentydragon
  - path_regex: ssh_keys/atlas-.*\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *atlas-agentydragon
  # TODO: Revisit the security model for cluster-recoverable gecko host identity.
  - path_regex: ssh_keys/gecko-host-.*\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
          - *gecko-agentydragon
  - path_regex: ssh_keys/gecko-.*\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *gecko-agentydragon
  # --- Self-hosted agent-box VM keys ---
  # Host key: cluster-recoverable (admin + user keys), installed via cloud-init.
  - path_regex: ssh_keys/agent-box-host\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  # User identity: decrypted on the VM by NixOS sops-nix via the host key, then
  # planted at /home/codex/.ssh/id_ed25519. admin retained for management.
  - path_regex: ssh_keys/agent-box-codex-user\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *agent-box-host
  # Forgejo bot push key: decrypted by the codex user's home-manager sops-nix.
  - path_regex: ssh_keys/agent-box-codex-forgejo\.sops\.key$
    store_type: binary
    key_groups:
      - age:
          - *admin
          - *agent-box-codex-user

  # --- Per-user home-manager secrets (admin + user SSH key) ---
  - path_regex: secrets/home/wyrm2/.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-agentydragon
  - path_regex: secrets/home/rugged/.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *rugged-agentydragon
  - path_regex: secrets/home/atlas/.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *atlas-agentydragon
  - path_regex: secrets/home/gecko/.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *gecko-agentydragon

  # --- Plaid API credentials (admin + all user keys) ---
  - path_regex: secrets/plaid\.sops\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon

  # --- Wealthfront app-specific password for Plaid (read-only aggregation) ---
  - path_regex: secrets/wealthfront-plaid-app-password\.sops\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon

  # --- PostScan Mail API key (admin + all user keys) ---
  - path_regex: secrets/postscanmail\.sops\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon

  # --- Kalshi API key (read-only) ---
  - path_regex: secrets/kalshi-readonly\.sops\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
          - *claude-web
          - *codex-cloud-agent

  # --- Anthropic Admin API key (org usage/cost reporting + org management) ---
  # Highly privileged: this key can manage the whole org. Decryptable only by
  # agentydragon's user ssh keys (+ admin break-glass) — deliberately NOT
  # readable by any agent/host/CI recipient.
  - path_regex: secrets/anthropic-admin-key\.sops\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
          - *gecko-agentydragon

  # --- Talos machine secrets (admin-only, state recovery backup) ---
  - path_regex: secrets/talos-machine-secrets\.sops\.yaml$
    key_groups:
      - age:
          - *admin

  # --- K8s worker secrets (all k8s worker hosts) ---
  - path_regex: secrets/k8s-worker\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-host
          - *rugged-host
          - *iguana-host
  # Dedicated PAT kept in SOPS for now even though the GitHub release-asset
  # fetch path is being removed. TODO: decide whether to keep, rotate, or
  # delete it once private-cache delivery is in place.
  - path_regex: secrets/shared/gaffer-private-fetch-pat\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-host
          - *rugged-host
  # Manifold Markets API key — for human/agent local use. The cluster-side
  # copy at cluster/k8s/agents/manifold-mcp/app/api-key.sops.yaml is encrypted
  # to admin + cluster-secrets (matches the cluster/k8s/.* rule below).
  - path_regex: secrets/manifold-api-key\.yaml$
    key_groups:
      - age:
          - *admin
          - *claude-web
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  # Home Wi-Fi credentials are consumed by system-level NetworkManager on the
  # named NixOS hosts, so encrypt to their host identities rather than users.
  - path_regex: secrets/shared/home-wifi\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-host
          - *iguana-host
  # --- All-user secrets (admin + all user SSH keys) ---
  # cluster-secrets-age: Flux SOPS decryption key (TODO: consider narrowing to admin-only)
  # flux-deploy-key: ED25519 SSH key registered as GitHub deploy key
  # cluster-tokens: Proxmox API token for tofu apply; legacy HCloud token retained for account history
  # habitify, huggingface: personal API tokens exported as env vars
  - path_regex: secrets/shared/.*\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-host
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
          - *gecko-agentydragon
  # Claude web K8s bearer JWT (auto-rotated by the authentik-jwt-rotation CronJob)
  - path_regex: secrets/claude-web-k8s-jwt\.yaml$
    key_groups:
      - age:
          - *admin
          - *claude-web
          - *codex-cloud-agent
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  # Claude web Forgejo tea token (auto-rotated by forgejo-token-rotation).
  # Same service account as claude-forgejo-credentials, but stored as an API
  # token so `tea` can use the account directly.
  - path_regex: secrets/claude-forgejo-tea-token\.yaml$
    key_groups:
      - age:
          - *admin
          - *claude-web
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  # Private half of the haku age keypair. Encrypted only to agentydragon's
  # user ssh keys (+ admin) so the operator can retrieve it for the Haku routine's
  # env; haku itself is deliberately NOT a reader (it would be circular).
  - path_regex: secrets/haku-age-key\.sops\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  # Haku background-agent K8s bearer JWT (auto-rotated by the authentik-jwt-rotation
  # CronJob). Decrypted only by the Haku routine (haku); admin + user keys
  # for break-glass.
  - path_regex: secrets/haku-k8s-jwt\.yaml$
    key_groups:
      - age:
          - *admin
          - *haku
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  # The same bearer for the same `haku` k8s group, minted separately for the
  # experimental OpenClaw runtime (rotations.yaml: haku-k8s-openclaw). No `haku`
  # recipient, unlike the entry above: that routine decrypts its token from this
  # file, whereas the OpenClaw runtime never sees the file at all -- iron-proxy
  # injects the bearer from the k8s Secret the rotator publishes alongside it.
  # Admin + user keys are break-glass only; nothing decrypts this in normal
  # operation.
  - path_regex: secrets/haku-k8s-openclaw-jwt\.yaml$
    key_groups:
      - age:
          - *admin
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  # Haku Forgejo tea token (auto-rotated by forgejo-token-rotation). Decrypted
  # by the Haku routine directly and also materialized as a k8s Secret for web
  # bootstrap + the self-hosted worker.
  - path_regex: secrets/haku-forgejo-tea-token\.yaml$
    key_groups:
      - age:
          - *admin
          - *haku
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  # agent-box Codex K8s bearer JWT (auto-rotated by the authentik-jwt-rotation
  # CronJob). Decrypted by the codex user's home-manager on agent-box to render
  # ~/.kube/config; admin + user keys retained for break-glass.
  - path_regex: secrets/agent-box-codex-k8s-jwt\.yaml$
    key_groups:
      - age:
          - *admin
          - *agent-box-codex-user
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  # agent-box Codex Forgejo tea token (auto-rotated by forgejo-token-rotation).
  # Decrypted by the codex user's home-manager to render ~/.config/tea/config.yml.
  - path_regex: secrets/agent-box-codex-forgejo-tea-token\.yaml$
    key_groups:
      - age:
          - *admin
          - *agent-box-codex-user
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  # codex-pod Forgejo tea token (auto-rotated by forgejo-token-rotation). The pod
