          - *litellm-clients
          - *wyrm2-agentydragon
          - *rugged-agentydragon
          - *atlas-agentydragon
          - *iguana-agentydragon
  # Haku mailbox (Stalwart) bearer JWT (auto-rotated by the authentik-jwt-rotation
  # CronJob). Same readers as haku-k8s-jwt: the Haku routine (haku) plus admin +
