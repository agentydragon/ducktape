exclude: ".*/testdata/.*|nonrcm-dotfiles/config/cronomix/.*\\.json$"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Safety guard: block pushes to protected branches.
      # 'main' and 'master' are protected by default.
      - id: no-commit-to-branch

      # XXX: disable for tanapaste
      # - id: trailing-whitespace
      # - id: end-of-file-fixer  # files end always in newline

      - id: check-merge-conflict
      # Syntax checks
      - id: check-ast  # valid Python parse
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        # Skip Helm templates (contain Go templating, not valid YAML pre-render)
        exclude: ansible/host_vars/.*\.yml$|^claude/claude_optimizer/config\.example\.yaml$|^k8s/.*\.ya?ml$
      - id: check-toml

      # TODO: this one should NOT fix within dotfiles e.g. OrcaSlicer
      # - id: check-json

      # TODO: maybe:
      # https://github.com/pre-commit/pre-commit-hooks?tab=readme-ov-file#name-tests-test
      # --pytest-test-first
      # - check-shebang-scripts-are-executable

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args:
          - "-c"
          - ".yamllint.yaml"
        files: "\\.ya?ml$"
        exclude: "ansible/host_vars/.*\\.yml$|^k8s/.*\\.ya?ml$"

  # Ansible-lint with compatibility fix for ansible-core 2.19.0+
  # NOTE: ansible-core 2.19.0 fucking removed ansible.parsing.yaml.constructor module
  # that ansible-lint depends on, causing ModuleNotFoundError. Pin to 2.18.x
  # until ansible-lint is updated. See: https://github.com/ansible/ansible/issues/85243
  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        entry: bash -c 'if git diff --cached --name-only | grep -E -q "^ansible/.*\.(yml|yaml)$"; then
          ansible-lint --config-file .ansible-lint.yaml ansible/; else
          echo "No ansible files changed, skipping ansible-lint"; fi'
        language: python
        additional_dependencies:
          - 'ansible-core>=2.18,<2.19'
          - ansible-lint
        files: "^ansible/.*\\.(yml|yaml)$"
        pass_filenames: false

  # Ruff = linter + import sorter + formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff-check
        name: ruff-check
        args: [--fix]
        files: "\\.py$"
      - id: ruff-format
        name: ruff-format
        files: "\\.py$"

  # Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        name: mypy (generic)
        files: "^$"
        language_version: python3.12
        additional_dependencies:
          # deps of gatelet that still lack bundled typings
          - types-psycopg2    # stubs for psycopg2-binary
          - types-python-dateutil  # indirect via httpx / fastapi
          - homeassistant-stubs
          - types-Markdown
          - types-PyYAML
          - types-requests
          - types-tabulate
          - types-docker
          - types-toml
          - types-aiofiles
      - id: mypy
        name: mypy (adgn)
        files: "^adgn/src/(adgn|wt)/"
        language_version: python3.12
        args:
          - "--config-file=adgn/pyproject.toml"
        additional_dependencies:
          - pydantic>=2
          - types-PyYAML
          - types-requests
          - types-toml
          - types-aiofiles
          - types-Markdown
          - types-colorama
          - types-psutil
          - types-tabulate
          - types-docker

  # Buildifier for Bazel files
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 6.4.0
    hooks:
      - id: buildifier
      - id: buildifier-lint

  # Alejandra Nix formatter
  - repo: local
    hooks:
      - id: alejandra
        name: alejandra
        entry: alejandra --quiet
        language: system
        files: \.nix$

  # Jsonnet formatter for specimen .libsonnet files (adgn_llm)
