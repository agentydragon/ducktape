exclude: ".*/testdata/.*|.*/fixtures/.*|nonrcm-dotfiles/config/cronomix/.*\\.json$|adgn/src/adgn/props/specimens/.*|.*/examples/.*\\.py$|^ansible/\\.ansible/.*"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Safety guard: block pushes to protected branches.
      # 'main' and 'master' are protected by default.
      - id: no-commit-to-branch

      # XXX: disable for tanapaste
      # - id: trailing-whitespace
      # - id: end-of-file-fixer  # files end always in newline

      - id: check-merge-conflict

      # Syntax checks
      - id: check-ast  # valid Python parse
        language_version: python3.12
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        # Skip Helm (contains Go templating, not valid YAML)
        exclude: ansible/host_vars/.*\.yml$|^claude/claude_optimizer/config\.example\.yaml$|^k8s/.*\.ya?ml$
      - id: check-toml

      # TODO: disabled - should NOT fix within dotfiles e.g. OrcaSlicer
      # - id: check-json

      # TODO: maybe:
      # https://github.com/pre-commit/pre-commit-hooks?tab=readme-ov-file#name-tests-test
      # --pytest-test-first
      # - check-shebang-scripts-are-executable

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]
        files: "\\.ya?ml$"
        exclude: "ansible/host_vars/.*\\.yml$|^k8s/.*\\.ya?ml$"

  # Ansible-lint with compatibility fix for ansible-core 2.19.0+
  # NOTE: ansible-core 2.19.0 fucking removed ansible.parsing.yaml.constructor module
  # that ansible-lint depends on, causing ModuleNotFoundError. Pin to 2.18.x
  # until ansible-lint is updated. See: https://github.com/ansible/ansible/issues/85243
  #
  # IMPORTANT: Run from ansible/ to limit discovery to ansible files only.
  # When ansible-lint runs with no lintables specified, it defaults to *scanning the whole repo* (".").
  - repo: https://github.com/ansible/ansible-lint
    rev: v24.9.2
    hooks:
      - id: ansible-lint
        files: "^ansible/"
        exclude: "k8s/.*"  # Exclude k8s files that cause parsing issues
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/ansible" && ./run-ansible-lint.sh'
        args: []  # Clear default args since we're using custom entry
        additional_dependencies:
          - ansible-core>=2.18.0,<2.19.0  # Avoid fucking breaking module removal in 2.19.0

  # Ruff = linter + import sorter + formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff-check
        args: [--fix, --config, ruff.toml]
        files: "\\.py$"
      - id: ruff-format
        args: [--config, ruff.toml]
        files: "\\.py$"

  # Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        name: mypy (adgn)
        files: "^adgn/.*\\.py$"
        exclude: "(/props/specimens/|/third_party/|/testdata/|/fixtures/|/vendor/)"
        language_version: python3.12
        args: ["--config-file=mypy.ini"]
        additional_dependencies:
          # Core dependencies
          - pydantic>=2
          # Type stubs
          - types-psycopg2
          - types-python-dateutil
          - types-Markdown
          - types-PyYAML
          - types-requests
          - types-tabulate
          - types-docker
          - types-toml
          - types-aiofiles
          - types-colorama
          - types-psutil
          - homeassistant-stubs

  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 6.4.0
    hooks:
      - id: buildifier
      - id: buildifier-lint

  - repo: local
    hooks:
      - id: alejandra
        name: alejandra (nix formatter)
        entry: direnv exec . alejandra --quiet
        language: system
        files: \.nix$

  # Jsonnet formatter for specimen .libsonnet files (adgn_llm)
