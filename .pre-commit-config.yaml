# Global exclusions for git-tracked files that should skip hooks
# Note: .gitignore is respected automatically (pre-commit only runs on tracked files)
# Uses (?x) verbose regex mode for readable multi-line patterns
exclude: |
  (?x)^(
    # Legacy/archived directories
    x/k8s_old/.*|

    # Artifacts captured from live Claude Code containers — not our source code
    devinfra/claude/web_env/(rootfs|reference)/.*|
    devinfra/claude/web_env/live-dpkg-versions\.txt|

    # Test data
    x/claude_hooks/testdata/.*\.md|
    tana/testdata/.*|

    # Generated content
    llm/instruct_logseq/.*|

    # Specimens committed snapshot code
    props/specimens/[^/]+/[^/]+/code/.*
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Safety guard: block pushes to protected branches.
      # 'main' and 'master' are protected by default.
      - id: no-commit-to-branch

      - id: trailing-whitespace
        exclude: "(__snapshots__/.*\\.ambr|\\.patch)$"
      - id: end-of-file-fixer

      - id: check-merge-conflict

      # Syntax checks
      - id: check-ast # valid Python parse
        language_version: python3.13
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        # Skip ansible !vault tags (not parseable without custom YAML constructor), Helm/Flux dirs (Go templating), chart values
        exclude: "ansible/host_vars/.*\\.yml$|cluster/k8s/|cluster/charts/|props/helm/templates/"
      - id: check-toml

      # TODO: disabled - should NOT fix within dotfiles e.g. OrcaSlicer
      # - id: check-json

      # TODO: maybe:
      # https://github.com/pre-commit/pre-commit-hooks?tab=readme-ov-file#name-tests-test
      # --pytest-test-first
      # - check-shebang-scripts-are-executable

  # Ruff linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff-check
        args: [--fix, --config, ruff.toml]
        files: "\\.py$"
      - id: ruff-format
        args: [--config, ruff.toml]
        files: "\\.py$"

  # TODO: Check if Bazel mypy (runs by default via bazel build //...) can replace
  # pre-commit mypy hooks. The Bazel mypy setup handles workspace dependencies
  # correctly and uses a single mypy.ini config.

  # Nix formatter (RFC 166 style) - downloads static binary from GitHub releases
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: devinfra/precommit/run_nixfmt.sh
        language: system
        files: "\\.nix$"

  # Markdown linting (scoped to match .markdownlint-cli2.jsonc globs)
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
        files: ^(cluster|website)/.*\.md$

  # NOTE: ESLint and svelte-check are handled by Bazel:
  # - ESLint: bazel build //... (lint aspects run by default)
  # - svelte-check: bazel test //props/frontend:svelte_check_test
  #                 bazel test //x/agent_server/web:svelte_check_test

  # Buildifier - Bazel/Starlark formatting and linting
  # TODO: Sync buildifier version with Bazel (currently keith=8.2.1.1, Bazel=8.2.1.2 in MODULE.bazel)
  # Consider: extract version from MODULE.bazel, or pin both to same source
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.2.1.1
    hooks:
      - id: buildifier
      - id: buildifier-lint

  # shfmt - Shell script formatting
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt

  # rustfmt - Rust code formatting
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt

  # gofumpt - Go code formatting (strict superset of gofmt, isolated via language: golang)
  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt
        entry: gofumpt -w
        language: golang
        additional_dependencies:
          - mvdan.cc/gofumpt@v0.9.2
        types: [go]

  # ============================================================================
  # LOCAL HOOKS
  # ============================================================================
  - repo: local
    hooks:
      # Ansible syntax check: Fast validation for pre-commit
      # Pre-commit: Just runs ansible-playbook --syntax-check (fast, catches essential errors)
      # CI: Runs full ansible-lint with all rules (thorough, slower)
      - id: ansible-syntax-check
        name: ansible-playbook --syntax-check
        entry: ansible/scripts/run-syntax-check.sh
        language: python
        additional_dependencies: [ansible]
        # Only root-level ansible/*.yaml (playbooks), not roles/vars/etc subdirs.
        files: "^ansible/[^/]+\\.yaml$"
        # TODO: Re-enable gpd.yaml once all machines use Nix home-manager
        # and legacy_* roles are deleted. Currently gpd.yaml → legacy_gui →
        # petermosmans.customize-gnome (missing galaxy role) breaks syntax-check.
        exclude: "^ansible/(gpd|requirements|inventory)\\.yaml$"
        pass_filenames: true

      # Prettier formatter - uses .prettierrc.cjs config and .prettierignore
      # The .prettierrc.cjs uses require() for the svelte plugin, which resolves via
      # NODE_PATH set by pre-commit's language:node environment
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown --list-different
        language: node
        additional_dependencies:
          - prettier@3.7.4
          - prettier-plugin-svelte@3.4.1
          - svelte@5.38.1
        files: "\\.(js|jsx|ts|tsx|svelte|css|md|yaml|yml|json|html)$"
        exclude: "\\.pnpm/"

      # Block non-root pyproject.toml files — all Python packaging config must live in the root pyproject.toml
      - id: no-subdir-pyproject-toml
        name: No sub-directory pyproject.toml files
        entry: bash -c 'echo "Non-root pyproject.toml files are forbidden (use root pyproject.toml):" >&2; printf "  %s\n" "$@" >&2; exit 1' --
        language: system
        files: "pyproject\\.toml$"
        exclude: "^pyproject\\.toml$"

      # Unified pre-commit: custom validations only (formatting handled by dedicated hooks)
      # Uses --script_path runner to avoid Bazel lock (allows parallel batch execution)
      # Runners stored in .git/precommit-runners/, one per pre-commit invocation
      # NOTE: formatting moved to standard hooks (buildifier, ruff, shfmt - see above)
      - id: bazel-precommit
        name: bazel precommit (validate)
        entry: devinfra/precommit/run_precommit.sh
        language: system
        pass_filenames: true
        # Triggers on: test files (pytest-main), cluster files (validations), terraform (centralization)
        files: |
          (?x)^(
            .*\\.(py|tf)$|
            cluster/
          )$
        exclude: |
          (?x)^(
            # Authentik blueprints are not K8s manifests, skip validation
            cluster/k8s/authentik/blueprints/.*
          )$

      # Enforce affected Bazel tests are cached/passing before commit.
      # Guarded by DUCKTAPE_PRECOMMIT_ENFORCE_BAZEL_TESTS=1 (set in Claude Code web sessions).
      # Uses git staged files internally, so always_run + pass_filenames=false.
      - id: enforce-bazel-tests
        name: enforce affected bazel tests
        entry: ducktape-precommit
        language: system
        pass_filenames: false
        always_run: true

      # Specimens: block changes to committed snapshot code/ directories
      - id: block-specimen-code-changes
        name: Block changes to committed specimen code
        entry: props/specimens/hooks/block_snapshot_code_changes.py
        language: python
        pass_filenames: false
        always_run: true

      # Specimens: validate issue ID format in issues/*.yaml filenames
      - id: validate-specimen-issue-ids
        name: Validate specimen issue ID format
        entry: props/specimens/hooks/validate_issue_ids.py
        language: python
        pass_filenames: false
        always_run: true

      # Kubernetes manifest validation (auto-installed via go install)
      # CRD schemas from datreeio/CRDs-catalog cover Flux, cert-manager,
      # external-secrets, sealed-secrets, etc.  Niche CRDs without catalog
      # schemas (powerdns-operator, kagent) are skipped rather than failing.
      # TODO: Run the datree CRD extractor against the live cluster to get
      # schemas for niche CRDs (ClusterRRset, ClusterZone, Agent, ModelConfig,
      # RemoteMCPServer), check them into cluster/schemas/, add as a
      # -schema-location, and drop -ignore-missing-schemas.
      # gotk-components.yaml is excluded (auto-generated by Flux).
      - id: kubeconform
        name: kubeconform (cluster)
        language: golang
        additional_dependencies:
          - github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
        entry: kubeconform
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -ignore-missing-schemas
        files: ^cluster/k8s/.*\.(yaml|yml)$
        exclude: |
          (?x)^(
            cluster/k8s/flux-system/gotk-components\.yaml|
            # kustomize config files (kustomize.config.k8s.io/v1beta1) — not K8s resources
            cluster/k8s/.*/kustomization\.yaml|
            # Authentik blueprints are not K8s manifests, skip validation
            cluster/k8s/authentik/blueprints/.*|
            # Application config files, not K8s manifests
            cluster/k8s/gatus/config\.yaml|
            cluster/k8s/applications/headscale/config\.yaml|
            cluster/k8s/airlock/config\.yaml|
            cluster/k8s/homeassistant-proxy/config\.yaml|
            cluster/k8s/litellm/proxy-config\.yaml|
            # Helm values files consumed via configMapGenerator, not K8s manifests
            cluster/k8s/.*/ccm-values\.yaml
          )$
        types: [yaml]

  # ============================================================================
  # CLUSTER-SPECIFIC HOOKS (external repos, scoped to cluster/ directory)
  # ============================================================================

  # Checkov security scanner for Terraform (standalone, avoids 10s import in bazel-precommit)
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.497
    hooks:
      - id: checkov_diff
        args: ["--framework", "terraform", "--skip-check", "CKV_TF_1", "-f"]
        files: "^cluster/terraform/.*\\.tf$"

  # TFLint - Terraform linter (auto-installed via go install)
  # Config: cluster/.tflint.hcl; plugins cached in ~/.tflint.d/plugins
  # Wrapper groups changed files by directory and runs tflint --chdir=<dir> per directory
  # (tflint always lints the whole module, not individual files)
  #
  # Version pin: v0.56.0 is the latest tflint compatible with Go 1.24 (shipped in
  # Claude Code web containers). v0.60.0+ requires Go >= 1.25.4. Bump when the
  # container Go version is upgraded.
  #
  # Claude Code web: `go install` needs NO_PROXY to NOT include *.googleapis.com,
  # because proxy.golang.org redirects zip downloads to storage.googleapis.com.
  # If NO_PROXY bypasses the egress proxy for that domain, DNS fails (no direct
  # internet in gVisor sandbox). The session-start hook should strip *.googleapis.com
  # from NO_PROXY — see devinfra/claude/ proxy documentation.
  - repo: local
    hooks:
      - id: tflint
        name: tflint (cluster)
        language: golang
        additional_dependencies:
          - github.com/terraform-linters/tflint@v0.56.0
        entry: devinfra/precommit/run_tflint.sh
        files: "^cluster/terraform/.*\\.tf$"

  # NOTE: terraform_validate hook removed — Bazel rules_tf now covers all
  # terraform modules via :validate and :lint targets with hermetic providers.
  # See MODULE.bazel tf.download(mirror={...}) for provider configuration.

  # NOTE: The following custom validations are in bazel-precommit:
  # - pytest-main check (ensures test files have pytest_bazel.main() entry points)
  # - terraform-version-centralization (checks terraform modules don't define provider versions)
  # - filename-conventions (enforces underscores not dashes in new .py/.md files)
  # - cluster validations (kustomize, helm, sealed-secrets)
  # This avoids Bazel client lock contention and runs validations in parallel.
  #
  # Standard formatting hooks (no longer in bazel-precommit):
  # - buildifier (format + lint) → keith/pre-commit-buildifier
  # - ruff (format + lint) → astral-sh/ruff-pre-commit
  # - shfmt (format) → scop/pre-commit-shfmt
