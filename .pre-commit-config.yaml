default_install_hook_types:
  - pre-commit
  - prepare-commit-msg

default_stages: [pre-commit]

# Global exclusions for git-tracked files that should skip hooks
# Note: .gitignore is respected automatically (pre-commit only runs on tracked files)
# Uses (?x) verbose regex mode for readable multi-line patterns
exclude: |
  (?x)^(
    # Artifacts captured from live Claude Code containers — not our source code
    devinfra/claude/web_env/(rootfs|reference)/.*|
    devinfra/claude/web_env/live-dpkg-versions\.txt|

    # Test data
    tana/testdata/.*|
    # Status pages saved verbatim from the AT&T gateway
    att_gateway/testdata/.*|

    # Generated content
    x/llm/instruct_logseq/.*|

    # Vendored upstream source; validate the chart with Helm instead.
    cluster/charts/browsertrix/.*|

    # Specimens committed snapshot code
    props/specimens/[^/]+/[^/]+/code/.*
  )$
repos:
  # All hook commands come from the flake-locked Nix precommit package.
  # Keep upstream pre-commit-hooks metadata when changing their local definitions.
  - repo: local
    hooks:
      # Safety guard: block direct commits on protected branches. Listing
      # --branch replaces the default (main, master), so name each one;
      # devel is the default branch and is server-side protected by the
      # github-branch-protection ruleset.
      - id: no-commit-to-branch
        name: don't commit to branch
        entry: no-commit-to-branch
        language: system
        pass_filenames: false
        always_run: true
        args: [--branch, devel, --branch, main]

      # Check the complete BUILD graph even when pre-commit receives only changed files.
      - id: gazelle
        name: Gazelle drift
        entry: gazelle --mode=diff
        language: system
        pass_filenames: false
        always_run: true

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
        minimum_pre_commit_version: 3.2.0
        # .dxf: FreeCAD TechDraw DXF output has trailing whitespace in geometry lines
        # model_comparison/*.svg: matplotlib emits a trailing space after every path
        #   coordinate; stripping it just churns against the next deterministic render
        exclude: "(__snapshots__/.*\\.ambr|\\.patch|\\.dxf|cluster/docs/inference/model_comparison/.*\\.svg)$"
      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
        minimum_pre_commit_version: 3.2.0
        # .dxf: FreeCAD TechDraw DXF output ends without a trailing newline
        exclude: "\\.dxf$"

      - id: check-merge-conflict
        name: check for merge conflicts
        entry: check-merge-conflict
        language: system
        types: [text]

      # Syntax checks
      - id: check-yaml
        name: check yaml
        entry: check-yaml
        language: system
        types: [yaml]
        args: ["--allow-multiple-documents"]
        # Skip Helm/Flux dirs (Go templating), chart values
        exclude: "cluster/k8s/|cluster/generated/|cluster/parked/|cluster/charts/"
      - id: check-toml
        name: check toml
        entry: check-toml
        language: system
        types: [toml]

      - id: check-xml
        name: check XML syntax
        entry: check-xml
        language: system
        files: \.xml$

      # TODO: Consider enabling check-json and check-shebang-scripts-are-executable.

      # Language-agnostic ordering for explicitly marked blocks.
      # Blocks are opt-in, paired (`start`/`end` on their own lines, inside the
      # block) and meant for lists that are sets: allowlists, path filters,
      # package/command names, kustomize resources. Marking one is a claim that
      # order carries no meaning, so don't mark argv, workflow steps, priorities,
      # schema- or version-ordered sequences, or anything a generator owns --
      # sort it in the generator, or leave it. Give a list a floor of ~6 entries:
      # below that the markers cost more than the drift they catch. Blocks
      # holding a YAML block scalar (`|-`) or an anchor need care -- a marker
      # placed at an item's content indent is absorbed into the value, and
      # prettier moves markers on anchored lines onto the key.
      - id: keep-sorted
        name: keep-sorted
        entry: keep-sorted
        language: system
        types: [text]

      - id: ruff-check
        name: ruff-check
        entry: ruff check --fix --force-exclude --config ruff.toml
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: ruff format --force-exclude --config ruff.toml
        language: system
        types: [python]

      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        types: [nix]

      - id: statix
        name: statix
        entry: statix check -c devinfra/statix.toml
        language: system
        types: [nix]
        pass_filenames: false

      # The Markdown config uses only the paths supplied by pre-commit.
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2 --fix
        language: system
        files: ^(cluster|website)/.*\.md$

      - id: buildifier
        name: buildifier
        entry: buildifier --lint=fix
        language: system
        files: "(BUILD|WORKSPACE|\\.bzl|\\.bazel)$"

      # Exclude .zsh: pre-commit's identify tags zsh as shell, but shfmt can't parse
      # advanced zsh-specific syntax (e.g. p10k.zsh, zsh-init.zsh).
      - id: shfmt
        name: shfmt
        entry: shfmt -w
        language: system
        types: [shell]
        exclude: "\\.zsh$"

      - id: rustfmt
        name: rustfmt
        entry: rustfmt
        language: system
        types: [rust]

      - id: gofumpt
        name: gofumpt
        entry: gofumpt -w
        language: system
        types: [go]

      # Ansible syntax check: Fast validation for pre-commit
      # Pre-commit: Just runs ansible-playbook --syntax-check (fast, catches essential errors)
      # CI: Runs full ansible-lint with all rules (thorough, slower)
      - id: ansible-syntax-check
        name: ansible-playbook --syntax-check
        entry: ansible/scripts/run-syntax-check.sh
        language: system
        # Only root-level ansible/*.yaml (playbooks), not roles/vars/etc subdirs.
        files: "^ansible/[^/]+\\.yaml$"
        exclude: "^ansible/(requirements|inventory)\\.yaml$"
        pass_filenames: true

      # Prettier formatter - uses .prettierrc.cjs config and .prettierignore.
      # Prettier + plugins bundled in Nix (nix/packages/prettier/) — NODE_PATH
      # is set by the wrapper so .prettierrc.cjs's require() resolves.
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown --list-different
        language: system
        files: "\\.(js|mjs|cjs|jsx|ts|tsx|css|md|yaml|yml|json|html)$"

      # lean-fmt is built against the same Lean version as split-proof's Bazel
      # toolchain and lives in the shared Nix pre-commit closure.
      # Pass only changed files to keep normal commits and CI scoped to their diff.
      - id: lean-fmt-format
        name: lean-fmt format
        entry: lean-fmt format
        language: system
        files: "^devinfra/js/debundle/x/split_proof/.*\\.lean$"

      - id: lean-fmt-organize
        name: lean-fmt organize imports
        entry: lean-fmt organize
        language: system
        files: "^devinfra/js/debundle/x/split_proof/.*\\.lean$"

      - id: lean-fmt-check
        name: lean-fmt check
        entry: lean-fmt check
        language: system
        files: "^devinfra/js/debundle/x/split_proof/.*\\.lean$"

      # Block non-root pyproject.toml files — all Python packaging config must live in the root pyproject.toml.
      - id: no-subdir-pyproject-toml
        name: No sub-directory pyproject.toml files
        entry: bash -c 'echo "Non-root pyproject.toml files are forbidden (use root pyproject.toml):" >&2; printf "  %s\n" "$@" >&2; exit 1' --
        language: system
        files: "pyproject\\.toml$"
        exclude: "^pyproject\\.toml$"

      # Pre-commit file validations (filenames, frozen-specimens). These are
      # git-diff-based checks with no static repo-state equivalent. Cluster
      # validation moved to the Bazel test //cluster/validation:test_* targets.
      - id: ducktape-precommit
        name: ducktape pre-commit
        entry: ducktape-precommit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Block amending already-pushed commits
      - id: ducktape-prepare-commit-msg
        name: ducktape prepare-commit-msg
        entry: ducktape-prepare-commit-msg
        language: system
        pass_filenames: false
        always_run: true
        stages: [prepare-commit-msg]

      # Kubernetes manifest validation
      # CRD schemas from datreeio/CRDs-catalog cover Flux, cert-manager,
      # external-secrets, etc.; cluster/schemas/ holds the ones for this repo's
      # own CRDs (each file is its CRD's openAPIV3Schema, dumped by
      # `bb run //agentplane/crds:generate_bin`). Kinds with no schema in either
      # place are skipped rather than failing (`-ignore-missing-schemas`).
      # gotk-components.yaml is excluded (auto-generated by Flux).
      # TODO: Derive Seaweed's schema from the pinned operator CRD and remove its
      # GVK skip below; the public catalog schema predates master.persistence.
      - id: kubeconform
        name: kubeconform (cluster)
        language: system
        # kubeconform -skip is a comma-separated string; repeated flags keep only the last value.
        entry: kubeconform
          -schema-location default
          -schema-location 'cluster/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -ignore-missing-schemas
          -skip 'seaweed.seaweedfs.com/v1/Seaweed,agentplane.allegedly.works/v1alpha1/Sandbox,agentplane.allegedly.works/v1alpha1/SandboxTemplate,agentplane.allegedly.works/v1alpha1/PolicySet,agentplane.allegedly.works/v1alpha1/PolicyBinding,agentplane.allegedly.works/v1alpha1/EgressCredential'
        files: ^cluster/(k8s|generated|parked)/.*\.(yaml|yml)$
        exclude: |
          (?x)^(
            # kustomize config files (kustomize.config.k8s.io/v1beta1) — not K8s resources
            cluster/(k8s|generated|parked)/.*/kustomization\.yaml|
            # Authentik blueprints are not K8s manifests, skip validation
            cluster/k8s/authentik/app/blueprints/.*|
            # Authelia configuration files consumed via configMapGenerator, not K8s manifests
            cluster/parked/authelia/(configuration|users)\.yml|
            # Parked GitHub Actions workflows, not K8s manifests
            cluster/parked/public-coder-agent/ci/.*|
            # A partial HelmRelease the tofu-controller image-pins Component patches in
            cluster/k8s/tofu-controller-image-pins/helmrelease-image\.yaml
          )$
        types: [yaml]

      # Checkov uses the same file-based invocation as its upstream hook.
      - id: checkov_diff
        name: checkov (terraform)
        language: system
        entry: checkov
        args: ["--framework", "terraform", "--skip-check", "CKV_TF_1,CKV2_AWS_23", "-f"]
        files: "^(cluster/terraform|tf)/.*\\.tf$"
        require_serial: true

      # Config: cluster/.tflint.hcl; plugins cached in ~/.tflint.d/plugins
      # Wrapper groups changed files by directory and runs tflint --chdir=<dir> per directory
      # (tflint always lints the whole module, not individual files)
      - id: tflint
        name: tflint (cluster)
        language: system
        entry: devinfra/precommit/run_tflint.sh
        files: "^(cluster/terraform|tf)/.*\\.tf$"
