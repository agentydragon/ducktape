default_install_hook_types:
  - pre-commit
  - prepare-commit-msg

default_stages: [pre-commit]

# Global exclusions for git-tracked files that should skip hooks
# Note: .gitignore is respected automatically (pre-commit only runs on tracked files)
# Uses (?x) verbose regex mode for readable multi-line patterns
exclude: |
  (?x)^(
    # Artifacts captured from live Claude Code containers — not our source code
    devinfra/claude/web_env/(rootfs|reference)/.*|
    devinfra/claude/web_env/live-dpkg-versions\.txt|

    # Test data
    x/claude_hooks/testdata/.*\.md|
    tana/testdata/.*|

    # Generated content
    llm/instruct_logseq/.*|

    # Vendored upstream source; validate the chart with Helm instead.
    cluster/charts/browsertrix/.*|

    # Specimens committed snapshot code
    props/specimens/[^/]+/[^/]+/code/.*
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Safety guard: block direct commits on protected branches. Listing
      # --branch replaces the default (main, master), so name each one;
      # devel is the default branch and is server-side protected by the
      # github-branch-protection ruleset.
      - id: no-commit-to-branch
        args: [--branch, devel, --branch, main]

      - id: trailing-whitespace
        # .dxf: FreeCAD TechDraw DXF output has trailing whitespace in geometry lines
        # model_comparison/*.svg: matplotlib emits a trailing space after every path
        #   coordinate; stripping it just churns against the next deterministic render
        exclude: "(__snapshots__/.*\\.ambr|\\.patch|\\.dxf|cluster/docs/inference/model_comparison/.*\\.svg)$"
      - id: end-of-file-fixer
        # .dxf: FreeCAD TechDraw DXF output ends without a trailing newline
        exclude: "\\.dxf$"

      - id: check-merge-conflict

      # Syntax checks
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        # Skip ansible !vault tags (not parseable without custom YAML constructor), Helm/Flux dirs (Go templating), chart values
        exclude: "ansible/host_vars/.*\\.yml$|cluster/k8s/|cluster/charts/|props/helm/templates/"
      - id: check-toml

      # TODO: enable check-json
      # - id: check-json

      # TODO: maybe:
      # https://github.com/pre-commit/pre-commit-hooks?tab=readme-ov-file#name-tests-test
      # --pytest-test-first
      # - check-shebang-scripts-are-executable

  # Ruff linter and formatter — ruff provided by devShell / web-session via Nix
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: ruff check --fix --force-exclude --config ruff.toml
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: ruff format --force-exclude --config ruff.toml
        language: system
        types: [python]

  # TODO: Check if Bazel mypy (runs by default via bazel build //...) can replace
  # pre-commit mypy hooks. The Bazel mypy setup handles workspace dependencies
  # correctly and uses a single mypy.ini config.

  # Nix formatter (RFC 166 style) — nixfmt provided by devShell / web-session via Nix
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        types: [nix]

  # Statix - Nix anti-pattern linter — statix provided by devShell / web-session via Nix
  - repo: local
    hooks:
      - id: statix
        name: statix
        entry: statix check -c devinfra/statix.toml
        language: system
        types: [nix]
        pass_filenames: false

  # Markdown linting — markdownlint-cli2 provided by devShell / web-session via
  # Nix (avoids a git clone of the hook's repo just to install it). Scoped to
  # staged files via `files:` regex below; the markdownlint-cli2 config
  # (.markdownlint-cli2.jsonc) has no globs of its own, so pre-commit's
  # positional args (= staged files) are the only inputs.
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2 --fix
        language: system
        files: ^(cluster|website)/.*\.md$

  # NOTE: ESLint and svelte-check are handled by Bazel:
  # - ESLint: bazel build //... (lint aspects run by default)
  # - svelte-check: bazel test //props/frontend:svelte_check_test

  # Buildifier - Bazel/Starlark formatting and linting — buildifier provided by devShell / web-session via Nix
  - repo: local
    hooks:
      - id: buildifier
        name: buildifier
        entry: buildifier --lint=fix
        language: system
        files: "(BUILD|WORKSPACE|\\.bzl|\\.bazel)$"

  # shfmt - Shell script formatting — shfmt provided by devShell / web-session via Nix
  # Exclude .zsh: pre-commit's identify tags zsh as shell, but shfmt can't parse
  # advanced zsh-specific syntax (e.g. p10k.zsh, zsh-init.zsh).
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        entry: shfmt -w
        language: system
        types: [shell]
        exclude: "\\.zsh$"

  # rustfmt - Rust code formatting — rustfmt provided by devShell / web-session via Nix
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: rustfmt
        language: system
        types: [rust]

  # gofumpt - Go code formatting — gofumpt provided by devShell / web-session via Nix
  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt
        entry: gofumpt -w
        language: system
        types: [go]

  # ============================================================================
  # LOCAL HOOKS
  # ============================================================================

  - repo: local
    hooks:
      # Ansible syntax check: Fast validation for pre-commit
      # Pre-commit: Just runs ansible-playbook --syntax-check (fast, catches essential errors)
      # CI: Runs full ansible-lint with all rules (thorough, slower)
      - id: ansible-syntax-check
        name: ansible-playbook --syntax-check
        entry: ansible/scripts/run-syntax-check.sh
        language: system
        # Only root-level ansible/*.yaml (playbooks), not roles/vars/etc subdirs.
        files: "^ansible/[^/]+\\.yaml$"
        # TODO: Re-enable gpd.yaml once all machines use Nix home-manager
        # and legacy_* roles are deleted. Currently gpd.yaml → legacy_gui →
        # petermosmans.customize-gnome (missing galaxy role) breaks syntax-check.
        exclude: "^ansible/(gpd|requirements|inventory)\\.yaml$"
        pass_filenames: true

      # Prettier formatter - uses .prettierrc.cjs config and .prettierignore.
      # Prettier + plugins bundled in Nix (nix/packages/prettier/) — NODE_PATH
      # is set by the wrapper so .prettierrc.cjs's require() resolves.
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown --list-different
        language: system
        files: "\\.(js|mjs|cjs|jsx|ts|tsx|svelte|css|md|yaml|yml|json|html)$"
        exclude: "\\.pnpm/"

      # Block non-root pyproject.toml files — all Python packaging config must live in the root pyproject.toml.
      - id: no-subdir-pyproject-toml
        name: No sub-directory pyproject.toml files
        entry: bash -c 'echo "Non-root pyproject.toml files are forbidden (use root pyproject.toml):" >&2; printf "  %s\n" "$@" >&2; exit 1' --
        language: system
        files: "pyproject\\.toml$"
        exclude: "^pyproject\\.toml$"

      # Pre-commit file validations (filenames, frozen-specimens). These are
      # git-diff-based checks with no static repo-state equivalent. Cluster
      # validation moved to the Bazel test //cluster/validation:test_* targets.
      - id: ducktape-precommit
        name: ducktape pre-commit
        entry: ducktape-precommit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Verify test files have pytest_bazel.main() entry points
      - id: ducktape-pytest-main-check
        name: ducktape pytest-main-check
        entry: ducktape-pytest-main-check
        language: system
        pass_filenames: true
        always_run: true
        stages: [pre-commit]

      # Enforce affected Bazel tests are cached/passing (opt-in via DUCKTAPE_PRECOMMIT_ENFORCE_BAZEL_TESTS=1)
      - id: ducktape-enforce-bazel-tests
        name: ducktape enforce-bazel-tests
        entry: ducktape-enforce-bazel-tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Block amending already-pushed commits
      - id: ducktape-prepare-commit-msg
        name: ducktape prepare-commit-msg
        entry: ducktape-prepare-commit-msg
        language: system
        pass_filenames: false
        always_run: true
        stages: [prepare-commit-msg]

      # Kubernetes manifest validation (auto-installed via go install)
      # CRD schemas from datreeio/CRDs-catalog cover Flux, cert-manager,
      # external-secrets, etc.; cluster/schemas/ holds the ones for this repo's
      # own CRDs (each file is its CRD's openAPIV3Schema, pinned by a
      # cluster/validation test). Niche third-party CRDs without catalog
      # schemas (powerdns-operator, kagent) are skipped rather than failing.
      # TODO: Run the datree CRD extractor against the live cluster to get
      # schemas for niche CRDs (ClusterRRset, ClusterZone, Agent, ModelConfig,
      # RemoteMCPServer), check them into cluster/schemas/, and drop
      # -ignore-missing-schemas.
      # gotk-components.yaml is excluded (auto-generated by Flux).
      - id: kubeconform
        name: kubeconform (cluster)
        language: system
        entry: kubeconform
          -schema-location default
          -schema-location 'cluster/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -ignore-missing-schemas
        files: ^cluster/k8s/.*\.(yaml|yml)$
        exclude: |
          (?x)^(
            cluster/k8s/flux-system/gotk-components\.yaml|
            # kustomize config files (kustomize.config.k8s.io/v1beta1) — not K8s resources
            cluster/k8s/.*/kustomization\.yaml|
            # RedisReplication CRD schema in datreeio catalog is outdated (missing spec.sentinel)
            cluster/k8s/.*/valkey-instance\.yaml|
            # Seaweed v1 CRD schema in datreeio catalog is outdated (missing spec.s3,
            # spec.master.defaultReplication, spec.volume.storageClassName — all
            # present in operator v1.0.19's live CRD)
            cluster/k8s/seaweedfs/cluster/seaweed\.yaml|
            # Authentik blueprints are not K8s manifests, skip validation
            cluster/k8s/authentik/app/blueprints/.*|
            # Application config files, not K8s manifests
            cluster/k8s/gatus/app/config\.yaml|
            cluster/k8s/evidence/market-roster/market-roster\.yaml|
            cluster/k8s/agents/airlock/config\.yaml|
            cluster/k8s/grocy/sf/mcp/config\.yaml|
            cluster/k8s/grocy/vallejo/mcp/config\.yaml|
            cluster/k8s/agents/plaid-mcp/app/items\.yaml|
            cluster/k8s/agents/grocy-mcp/envoy\.yaml|
            cluster/k8s/agents/homeassistant-proxy/config\.yaml|
            cluster/k8s/x/claude-sandbox-firecracker/config\.yaml|
            # act_runner config mounted via configMapGenerator, not a K8s manifest
            cluster/k8s/haku-ci/config\.yaml|
            # Agentplane app settings mounted via configMapGenerator, not a K8s manifest
            cluster/k8s/agentplane-staging/app/config\.yaml|
            # OpenShell policy mounted via configMapGenerator, not a K8s manifest
            cluster/k8s/agents/openshell/openclaw/policy\.yaml|
            # iron-proxy config mounted via configMapGenerator, not a K8s manifest
            cluster/k8s/agents/public-coder-agent/proxy/iron\.yaml|
            cluster/k8s/agents/public-coder-agent/proxy/codex-runner-iron\.yaml|
            cluster/k8s/agents/haku-egress-proxy/claude-iron\.yaml|
            cluster/k8s/agents/haku-egress-proxy/openclaw-spike-iron\.yaml|
            cluster/k8s/litellm/app/(chatgpt-)?proxy-config\.yaml|
            cluster/k8s/litellm/tana/proxy-config\.yaml|
            cluster/k8s/x/haku/dispatch/litellm/workers-litellm-config\.yaml|
            cluster/k8s/haku/console/config\.yaml|
            # per-index haku-indexer chunk config slices mounted via configMapGenerator
            cluster/k8s/haku/console/indexer-chunk-[a-z0-9-]+-config\.yaml|
            # dispatcher Job template with ${...} placeholders, mounted via configMapGenerator
            cluster/k8s/x/haku/dispatch/dispatcher/job-template\.yaml|
            cluster/k8s/x/haku/dispatch/dispatcher/zones\.yaml|
            # Helm values files consumed via configMapGenerator, not K8s manifests
            cluster/k8s/.*/ccm-values\.yaml|
            # Authelia configuration files consumed via configMapGenerator, not K8s manifests
            cluster/k8s/x/authelia/app/(configuration|users)\.yml|
            # rotate.py rotation list, mounted via configMapGenerator, not a K8s manifest
            cluster/k8s/agents/authentik-jwt-rotation/rotations\.yaml|
            cluster/k8s/agents/forgejo-token-rotation/tokens\.yaml|
            # rotate.py token list, mounted via configMapGenerator, not a K8s manifest
            cluster/k8s/agents/attic-jwt-rotation/rotators\.yaml|
            # provision.py user→permission policy, mounted via configMapGenerator, not a K8s manifest
            cluster/k8s/grocy/user-perms-base/policy\.yaml|
            # APT manifests for Bazel rules_distroless, not K8s manifests
            cluster/k8s/agents/authentik-jwt-rotation/trixie_authentik_rotation\.yaml|
            cluster/k8s/agents/attic-jwt-rotation/trixie_attic_rotation\.yaml|
          )$
        types: [yaml]

  # ============================================================================
  # CLUSTER-SPECIFIC HOOKS (external repos, scoped to cluster/ directory)
  # ============================================================================

  # Checkov security scanner for Terraform — checkov provided by devShell / web-session
  # via Nix (pkgs.checkov). Local hook (not repo: github) so pre-commit needn't clone
  # the checkov repo, which web sessions cannot fetch through the egress proxy.
  # Mirrors the upstream checkov_diff hook: `entry: checkov` + pass_filenames with `-f`.
  - repo: local
    hooks:
      - id: checkov_diff
        name: checkov (terraform)
        language: system
        entry: checkov
        args: ["--framework", "terraform", "--skip-check", "CKV_TF_1,CKV2_AWS_23", "-f"]
        files: "^(cluster/terraform|tf)/.*\\.tf$"
        require_serial: true

  # TFLint - Terraform linter — tflint provided by devShell / web-session via Nix
  # Config: cluster/.tflint.hcl; plugins cached in ~/.tflint.d/plugins
  # Wrapper groups changed files by directory and runs tflint --chdir=<dir> per directory
  # (tflint always lints the whole module, not individual files)
  - repo: local
    hooks:
      - id: tflint
        name: tflint (cluster)
        language: system
        entry: devinfra/precommit/run_tflint.sh
        files: "^(cluster/terraform|tf)/.*\\.tf$"

  # NOTE: terraform_validate hook removed — Bazel rules_tf now covers all
  # terraform modules via :validate and :lint targets with hermetic providers.
  # See MODULE.bazel tf.download(mirror={...}) for provider configuration.
