    # permanently on an uncaught CancelledError from a mid-request client disconnect (#5786).
    # fastmcp's own minor version is capped, matching its predecessor's cap: fastmcp moves fast
    # post-major-bump, and a repin needs the same deliberate re-audit as any other FastMCP
    # version bump (see haku/console/docs/agent_authority.md § "The FastMCP seam").
    "mcp[cli]>=2.0.0",
    "fastmcp>=4.0.3,<4.1",
    "py-key-value-aio[valkey]>=0.4.4",

