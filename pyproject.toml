# Python dependency manifest for Bazel lock file generation.
#
# This file serves as the single source of truth for Python dependencies.
# It is NOT used for pip/uv installation - dependencies are consumed via Bazel.
#
# Workflow:
#   1. Edit dependencies in [project.dependencies] below
#   2. Run: bazel run //:requirements.update
#   3. This generates requirements_bazel.txt (the lock file)
#   4. Bazel targets reference deps as @pypi//package_name
#
# Individual packages no longer have their own pyproject.toml files.

[project]
name = "ducktape"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    # Core
    "pydantic>=2.13.5",
    "pydantic-settings>=2.0.0",
    "typer>=0.27.2",
    "typer-di>=0.1.3",
    "click>=8.5.0",
    "rich>=13.0.0",
    "structlog",
    "platformdirs>=4.11.8",
    "atomicwrites>=1.4.1",

    # Web frameworks
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.53.0",
    "httpx>=0.27.0",
    "httpx2>=2.13.0",
    # mcp/fastmcp v4 use httpx2 for SSE and no longer pull this in transitively;
    # x/agentplane's replication tests use it directly against a real httpx SSE client.
    "httpx-sse>=0.4.3",
    # IDNA A-label canonicalization for exact-origin HTTP grants (haku/console).
    "idna>=3.4",
    "websockets>=15.0",
    "apscheduler>=3.11.3",
    # CRDT for the Study Casino multi-device sync (also indirectly pulled in
    # by datalayer-pycrdt; pinned here as a direct dep so the casino doesn't
    # depend on that transitive edge).
    "pycrdt>=0.14,<0.15",
    "hass-client>=1.3.1",
    # Python cdk8s uses jsii to synthesize ordinary Kubernetes YAML.
    "cdk8s>=2.70.101,<3",
    # cdk8s-plus supplies typed Kubernetes resources such as ConfigMap; the
    # core cdk8s ApiObject intentionally only models metadata. Pinned to the
    # newest published k8s-version line (cdk8s-plus-35 doesn't exist yet) --
    # the cluster itself runs Kubernetes 1.35.1
    # (cluster/terraform/main/variables.tf's kubernetes_version).
    "cdk8s-plus-34>=2.0,<3",
    "aiohttp>=3.14.3",
    "requests>=2.32.5",

    # Async
    "anyio>=4.15.1",
    "aiosqlite>=0.18.0",
    "aiodocker>=0.22.0",
    "asyncpg>=0.29.0",

    # LLM/AI
    "openai>=1.40.0",
    "inspect-ai>=0.3.263",
    "anthropic",
    "claude-code-sdk>=0.0.21,<0.1",
    "claude-agent-sdk>=0.2.152,<0.3",
    "tiktoken>=0.14.0",
    "tenacity>=8.2.0",

